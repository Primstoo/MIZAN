<script>
const MODULE={"slug":"stratigraphie","titre":"Stratigraphie et paléontologie","cle":"stratigraphie_scores","cleEtat":"stratigraphie_scores_etat","format":"score10","intro":"<p>Ce module suit <strong>les chapitres de stratigraphie 2020-2021<\/strong> et <strong>le cours de paléontologie et paléoécologie<\/strong>, puis <strong>les contrôles du Pr Rhalmi corrigés<\/strong> (2015 à 2021).<\/p>\n<p><strong>Comment l&#39;utiliser<\/strong><\/p>\n<ol>\n<li>Apprends les définitions par cœur : elles valent la moitié des points.<\/li>\n<li>Pour les questions de synthèse, suis les étapes données dans chaque chapitre.<\/li>\n<li>Fais le QCM du chapitre. <strong>8/10 = chapitre maîtrisé.<\/strong><\/li>\n<\/ol>\n<p><strong>À vérifier<\/strong> : plusieurs cours de paléontologie et l&#39;examen 2022 sont des scans non lus ; les réponses des contrôles sont rédigées par nous.<\/p>\n","annexes":[],"cartes":null,"maths":false};
const CHAPS=[{"id":"principes-stratigraphie","t":"Les principes de la stratigraphie","seance":"Chapitre 1 · Stratigraphie","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir qu&#39;une roche sédimentaire se dépose en couches (strates) horizontales au départ.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Dans une pile de couches non déformée, laquelle s&#39;est déposée en premier ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Celle du bas.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « lire une pile de pages ».<\/strong> Chaque strate est une page de l&#39;histoire ; les principes disent dans quel ordre les lire.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Appliquer la superposition à une série plissée ou renversée. Il faut d&#39;abord repérer la polarité (figures sédimentaires, fossiles en position de vie).<\/p>\n<\/aside><p>À la fin, tu sais appliquer les principes et reconnaître une discordance.<\/p>\n<h2>Idée 1 · Les principes<\/h2>\n<figure class=\"grille\"><figcaption>Principes de la stratigraphie<\/figcaption><table><tr><th>Principe,<\/th><th>Énoncé<\/th><\/tr><tr><td class=\"h1\">Horizontalité,<\/td><td>les<\/td><td>couches<\/td><td>se<\/td><td>déposent<\/td><td>horizontalement<\/td><\/tr><tr><td class=\"h1\">Superposition,<\/td><td>la<\/td><td>couche<\/td><td>du<\/td><td>dessus<\/td><td>est<\/td><td>plus<\/td><td>récente<\/td><\/tr><tr><td class=\"h1\">Continuité,<\/td><td>une<\/td><td>couche<\/td><td>a<\/td><td>le<\/td><td>même<\/td><td>âge<\/td><td>sur<\/td><td>toute<\/td><td>son<\/td><td>étendue<\/td><\/tr><tr><td class=\"h1\">Recoupement,<\/td><td>ce<\/td><td>qui<\/td><td>recoupe<\/td><td>est<\/td><td>plus<\/td><td>récent<\/td><\/tr><tr><td class=\"h1\">Inclusion,<\/td><td>un<\/td><td>élément<\/td><td>inclus<\/td><td>est<\/td><td>plus<\/td><td>ancien<\/td><td>que<\/td><td>son<\/td><td>encaissant<\/td><\/tr><tr><td class=\"h1\">Identité<\/td><td>paléontologique,<\/td><td>mêmes<\/td><td>fossiles<\/td><td>stratigraphiques<\/td><td>=<\/td><td>même<\/td><td>âge<\/td><\/tr><tr><td class=\"h1\">Actualisme,<\/td><td>les<\/td><td>processus<\/td><td>actuels<\/td><td>expliquent<\/td><td>le<\/td><td>passé<\/td><\/tr><\/table><\/figure><h2>Idée 2 · Discordances et lacunes<\/h2>\n<svg viewBox=\"0 0 320 120\" role=\"img\" aria-label=\"Discordance angulaire : couches inclinées érodées, recouvertes de couches horizontales\" style=\"max-width:360px;width:100%\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M10 110L120 60M40 110L150 60M70 110L180 60M100 110L210 60\"/><path d=\"M10 60h300\" stroke=\"#D9824F\" stroke-width=\"3\"/><path d=\"M10 45h300M10 30h300M10 15h300\"/><\/g>\n<g fill=\"currentColor\" font-size=\"10\"><text x=\"215\" y=\"80\">série plissée ancienne<\/text><text x=\"210\" y=\"57\">surface d'érosion<\/text><\/g>\n<\/svg><p>Une <strong>discordance angulaire<\/strong> montre : dépôt, déformation, érosion, puis nouveau dépôt. Une <strong>lacune<\/strong> est une période sans dépôt (ou érodée).<\/p>\n<h2>Idée 3 · Transgression et régression<\/h2>\n<p>Transgression : la mer avance sur le continent, les dépôts deviennent plus marins vers le haut. Régression : la mer recule, les dépôts deviennent plus continentaux.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Application<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Une série plissée est recouverte en discordance par des couches horizontales. Ordonne les événements.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Dépôt de la série inférieure, plissement, érosion, dépôt de la série supérieure.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Un galet de granite est inclus dans un conglomérat. Lequel est le plus ancien ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Le granite (principe d&#39;inclusion).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Le principe de recoupement dit :<\/div><button class=\"opt\" data-o=\"0\">ce qui recoupe est plus récent<\/button><button class=\"opt\" data-o=\"1\">ce qui recoupe est plus ancien<\/button><button class=\"opt\" data-o=\"2\">tout a le même âge<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Une discordance angulaire implique :<\/div><button class=\"opt\" data-o=\"0\">une déformation et une érosion<\/button><button class=\"opt\" data-o=\"1\">un dépôt continu<\/button><button class=\"opt\" data-o=\"2\">l&#39;absence de fossiles<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Dans une transgression, les dépôts deviennent vers le haut :<\/div><button class=\"opt\" data-o=\"0\">plus marins<\/button><button class=\"opt\" data-o=\"1\">plus continentaux<\/button><button class=\"opt\" data-o=\"2\">volcaniques<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Le principe d&#39;inclusion :<\/div><button class=\"opt\" data-o=\"0\">l&#39;inclus est plus ancien que l&#39;encaissant<\/button><button class=\"opt\" data-o=\"1\">l&#39;inclus est plus récent<\/button><button class=\"opt\" data-o=\"2\">ils ont le même âge<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">L&#39;actualisme signifie :<\/div><button class=\"opt\" data-o=\"0\">les processus actuels expliquent le passé<\/button><button class=\"opt\" data-o=\"1\">tout est récent<\/button><button class=\"opt\" data-o=\"2\">les fossiles sont actuels<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Une lacune correspond à :<\/div><button class=\"opt\" data-o=\"0\">une absence de dépôt<\/button><button class=\"opt\" data-o=\"1\">une couche épaisse<\/button><button class=\"opt\" data-o=\"2\">un fossile<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Le principe de continuité :<\/div><button class=\"opt\" data-o=\"0\">une couche a le même âge sur toute son étendue<\/button><button class=\"opt\" data-o=\"1\">les couches sont continues dans le temps<\/button><button class=\"opt\" data-o=\"2\">les fossiles évoluent<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Avant d&#39;appliquer la superposition, il faut vérifier :<\/div><button class=\"opt\" data-o=\"0\">que la série n&#39;est pas renversée<\/button><button class=\"opt\" data-o=\"1\">la couleur<\/button><button class=\"opt\" data-o=\"2\">la température<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">L&#39;identité paléontologique sert à :<\/div><button class=\"opt\" data-o=\"0\">corréler des couches éloignées<\/button><button class=\"opt\" data-o=\"1\">dater en années<\/button><button class=\"opt\" data-o=\"2\">mesurer l&#39;épaisseur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Le principe d&#39;horizontalité concerne :<\/div><button class=\"opt\" data-o=\"0\">le dépôt initial des couches<\/button><button class=\"opt\" data-o=\"1\">les failles<\/button><button class=\"opt\" data-o=\"2\">les plis<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"principes-stratigraphie","rep":null,"tol":null},{"n":"principes-stratigraphie","rep":null,"tol":null},{"n":"principes-stratigraphie","rep":null,"tol":null}],"qcm":[{"n":"principes-stratigraphie","q":"Le principe de recoupement dit :","o":["ce qui recoupe est plus récent","ce qui recoupe est plus ancien","tout a le même âge"],"a":0,"e":"Faille, filon."},{"n":"principes-stratigraphie","q":"Une discordance angulaire implique :","o":["une déformation et une érosion","un dépôt continu","l&#39;absence de fossiles"],"a":0,"e":"Interruption de sédimentation."},{"n":"principes-stratigraphie","q":"Dans une transgression, les dépôts deviennent vers le haut :","o":["plus marins","plus continentaux","volcaniques"],"a":0,"e":"La mer avance."},{"n":"principes-stratigraphie","q":"Le principe d&#39;inclusion :","o":["l&#39;inclus est plus ancien que l&#39;encaissant","l&#39;inclus est plus récent","ils ont le même âge"],"a":0,"e":"Galets."},{"n":"principes-stratigraphie","q":"L&#39;actualisme signifie :","o":["les processus actuels expliquent le passé","tout est récent","les fossiles sont actuels"],"a":0,"e":"Lyell."},{"n":"principes-stratigraphie","q":"Une lacune correspond à :","o":["une absence de dépôt","une couche épaisse","un fossile"],"a":0,"e":"Temps non enregistré."},{"n":"principes-stratigraphie","q":"Le principe de continuité :","o":["une couche a le même âge sur toute son étendue","les couches sont continues dans le temps","les fossiles évoluent"],"a":0,"e":"Limité par les variations latérales."},{"n":"principes-stratigraphie","q":"Avant d&#39;appliquer la superposition, il faut vérifier :","o":["que la série n&#39;est pas renversée","la couleur","la température"],"a":0,"e":"Polarité."},{"n":"principes-stratigraphie","q":"L&#39;identité paléontologique sert à :","o":["corréler des couches éloignées","dater en années","mesurer l&#39;épaisseur"],"a":0,"e":"Fossiles stratigraphiques."},{"n":"principes-stratigraphie","q":"Le principe d&#39;horizontalité concerne :","o":["le dépôt initial des couches","les failles","les plis"],"a":0,"e":"Avant déformation."}]},{"id":"lithostratigraphie","t":"La lithostratigraphie","seance":"Chapitre 2 · Lithostratigraphie","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir qu&#39;une roche sédimentaire raconte son milieu de dépôt (calcaire marin, grès de rivière, argile calme…).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Un conglomérat à gros galets arrondis indique-t-il une eau calme ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Non : il faut un courant fort pour transporter de gros galets.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « découper selon la roche ».<\/strong> La lithostratigraphie découpe la série d&#39;après la nature des roches, sans s&#39;occuper de leur âge.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Confondre une formation (unité de roche) et un étage (unité de temps). Une formation peut avoir des âges différents d&#39;un endroit à l&#39;autre.<\/p>\n<\/aside><p>À la fin, tu sais nommer les unités lithostratigraphiques et lire une colonne.<\/p>\n<h2>Idée 1 · Les unités<\/h2>\n<figure class=\"grille\"><figcaption>Unités lithostratigraphiques (de la plus grande à la plus petite)<\/figcaption><table><tr><th>Unité,<\/th><th>Définition<\/th><\/tr><tr><td class=\"h1\">Groupe,<\/td><td>ensemble<\/td><td>de<\/td><td>formations<\/td><\/tr><tr><td class=\"h1\">Formation,<\/td><td>unité<\/td><td>de<\/td><td>base<\/td><td>cartographiable,<\/td><td>lithologie<\/td><td>homogène,<\/td><td>avec<\/td><td>une<\/td><td>localité<\/td><td>type<\/td><\/tr><tr><td class=\"h1\">Membre,<\/td><td>partie<\/td><td>d'une<\/td><td>formation<\/td><\/tr><tr><td class=\"h1\">Banc<\/td><td>(couche),<\/td><td>plus<\/td><td>petite<\/td><td>unité<\/td><\/tr><\/table><\/figure><h2>Idée 2 · La colonne stratigraphique<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Lever une coupe<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · 1. Mesure l&#39;épaisseur de chaque banc, de bas en haut.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · 2. Note la lithologie, la couleur, la granulométrie, les figures sédimentaires, les fossiles.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · 3. Dessine la colonne avec les figurés conventionnels.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · 4. Regroupe en membres et formations.<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Idée 3 · Les variations latérales de faciès<\/h2>\n<p>Un <strong>faciès<\/strong> est l&#39;ensemble des caractères d&#39;une roche qui traduisent son milieu de dépôt. À un même moment, on dépose du sable près de la côte et de l&#39;argile au large : les limites de formations peuvent recouper les lignes de temps (diachronisme).<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Application<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Une formation de grès est datée du Jurassique ici et du Crétacé 100 km plus loin. Est-ce contradictoire ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Non : c&#39;est un diachronisme ; le rivage s&#39;est déplacé et le même faciès s&#39;est déposé à des moments différents.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">L&#39;unité de base de la lithostratigraphie :<\/div><button class=\"opt\" data-o=\"0\">la formation<\/button><button class=\"opt\" data-o=\"1\">l&#39;étage<\/button><button class=\"opt\" data-o=\"2\">la zone<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">La lithostratigraphie découpe selon :<\/div><button class=\"opt\" data-o=\"0\">la nature des roches<\/button><button class=\"opt\" data-o=\"1\">les fossiles<\/button><button class=\"opt\" data-o=\"2\">l&#39;âge en années<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Un faciès traduit :<\/div><button class=\"opt\" data-o=\"0\">un milieu de dépôt<\/button><button class=\"opt\" data-o=\"1\">un âge précis<\/button><button class=\"opt\" data-o=\"2\">une température de fusion<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Un membre est :<\/div><button class=\"opt\" data-o=\"0\">une partie d&#39;une formation<\/button><button class=\"opt\" data-o=\"1\">un ensemble de groupes<\/button><button class=\"opt\" data-o=\"2\">une unité de temps<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Le diachronisme signifie que :<\/div><button class=\"opt\" data-o=\"0\">une formation a des âges différents selon le lieu<\/button><button class=\"opt\" data-o=\"1\">toutes les couches ont le même âge<\/button><button class=\"opt\" data-o=\"2\">les fossiles sont remaniés<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Une argile indique un milieu :<\/div><button class=\"opt\" data-o=\"0\">calme<\/button><button class=\"opt\" data-o=\"1\">très agité<\/button><button class=\"opt\" data-o=\"2\">volcanique<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Une coupe se lève :<\/div><button class=\"opt\" data-o=\"0\">de bas en haut<\/button><button class=\"opt\" data-o=\"1\">de haut en bas<\/button><button class=\"opt\" data-o=\"2\">au hasard<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Un groupe réunit :<\/div><button class=\"opt\" data-o=\"0\">plusieurs formations<\/button><button class=\"opt\" data-o=\"1\">plusieurs bancs seulement<\/button><button class=\"opt\" data-o=\"2\">plusieurs étages<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">L&#39;étage est une unité :<\/div><button class=\"opt\" data-o=\"0\">chronostratigraphique<\/button><button class=\"opt\" data-o=\"1\">lithostratigraphique<\/button><button class=\"opt\" data-o=\"2\">biostratigraphique<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Les figures sédimentaires servent notamment à :<\/div><button class=\"opt\" data-o=\"0\">trouver la polarité de la série<\/button><button class=\"opt\" data-o=\"1\">dater en Ma<\/button><button class=\"opt\" data-o=\"2\">mesurer la radioactivité<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"lithostratigraphie","rep":null,"tol":null},{"n":"lithostratigraphie","rep":null,"tol":null}],"qcm":[{"n":"lithostratigraphie","q":"L&#39;unité de base de la lithostratigraphie :","o":["la formation","l&#39;étage","la zone"],"a":0,"e":"Cartographiable."},{"n":"lithostratigraphie","q":"La lithostratigraphie découpe selon :","o":["la nature des roches","les fossiles","l&#39;âge en années"],"a":0,"e":"Litho = roche."},{"n":"lithostratigraphie","q":"Un faciès traduit :","o":["un milieu de dépôt","un âge précis","une température de fusion"],"a":0,"e":"Ensemble de caractères."},{"n":"lithostratigraphie","q":"Un membre est :","o":["une partie d&#39;une formation","un ensemble de groupes","une unité de temps"],"a":0,"e":"Subdivision."},{"n":"lithostratigraphie","q":"Le diachronisme signifie que :","o":["une formation a des âges différents selon le lieu","toutes les couches ont le même âge","les fossiles sont remaniés"],"a":0,"e":"Migration du faciès."},{"n":"lithostratigraphie","q":"Une argile indique un milieu :","o":["calme","très agité","volcanique"],"a":0,"e":"Particules fines."},{"n":"lithostratigraphie","q":"Une coupe se lève :","o":["de bas en haut","de haut en bas","au hasard"],"a":0,"e":"Ordre de dépôt."},{"n":"lithostratigraphie","q":"Un groupe réunit :","o":["plusieurs formations","plusieurs bancs seulement","plusieurs étages"],"a":0,"e":"Unité supérieure."},{"n":"lithostratigraphie","q":"L&#39;étage est une unité :","o":["chronostratigraphique","lithostratigraphique","biostratigraphique"],"a":0,"e":"Temps."},{"n":"lithostratigraphie","q":"Les figures sédimentaires servent notamment à :","o":["trouver la polarité de la série","dater en Ma","mesurer la radioactivité"],"a":0,"e":"Rides, granoclassement."}]},{"id":"biostratigraphie","t":"La biostratigraphie","seance":"Chapitre 3 · Biostratigraphie","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir que les espèces apparaissent et disparaissent au cours du temps (évolution).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Une espèce qui a vécu pendant 100 Ma est-elle un bon outil pour dater finement ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Non : on préfère des espèces qui ont vécu peu de temps.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « horloge fossile ».<\/strong> Un bon fossile stratigraphique vit peu longtemps, partout, et en grand nombre.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Confondre biostratigraphie et paléoécologie. La biostratigraphie utilise les fossiles pour <strong>dater et corréler<\/strong> ; la paléoécologie pour <strong>reconstituer le milieu de vie<\/strong>.<\/p>\n<\/aside><p>À la fin, tu sais définir une biozone et choisir un bon fossile stratigraphique.<\/p>\n<h2>Idée 1 · Le bon fossile stratigraphique<\/h2>\n<figure class=\"grille\"><figcaption>Critères<\/figcaption><table><tr><th>Critère,<\/th><th>Pourquoi<\/th><\/tr><tr><td class=\"h1\">Courte<\/td><td>durée<\/td><td>de<\/td><td>vie<\/td><td>de<\/td><td>l'espèce,<\/td><td>datation<\/td><td>précise<\/td><\/tr><tr><td class=\"h1\">Large<\/td><td>répartition<\/td><td>géographique,<\/td><td>corrélations<\/td><td>lointaines<\/td><\/tr><tr><td class=\"h1\">Abondance,<\/td><td>on<\/td><td>le<\/td><td>trouve<\/td><td>facilement<\/td><\/tr><tr><td class=\"h1\">Indépendance<\/td><td>du<\/td><td>faciès,<\/td><td>présent<\/td><td>dans<\/td><td>plusieurs<\/td><td>milieux<\/td><\/tr><tr><td class=\"h1\">Facile<\/td><td>à<\/td><td>reconnaître,<\/td><td>identification<\/td><td>sûre<\/td><\/tr><\/table><\/figure><p>Exemples : ammonites (Mésozoïque), graptolites (Paléozoïque inférieur), trilobites (Cambrien), foraminifères planctoniques (Crétacé-Cénozoïque).<\/p>\n<h2>Idée 2 · Les biozones<\/h2>\n<svg viewBox=\"0 0 320 130\" role=\"img\" aria-label=\"Biozone d'intervalle : trois espèces avec leurs durées d'existence et la zone définie\" style=\"max-width:360px;width:100%\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M60 120V20M120 120V50M180 90V10\"/><path d=\"M30 50h200M30 90h200\" stroke=\"#D9824F\" stroke-dasharray=\"5 4\"/><\/g>\n<g fill=\"currentColor\" font-size=\"10\"><text x=\"50\" y=\"14\">A<\/text><text x=\"114\" y=\"44\">B<\/text><text x=\"174\" y=\"8\">C<\/text><text x=\"235\" y=\"74\">biozone<\/text><\/g>\n<\/svg><figure class=\"grille\"><figcaption>Types de biozones<\/figcaption><table><tr><th>Zone,<\/th><th>Définie<\/th><th>par<\/th><\/tr><tr><td class=\"h1\">Zone<\/td><td>d'extension,<\/td><td>toute<\/td><td>la<\/td><td>durée<\/td><td>d'un<\/td><td>taxon<\/td><\/tr><tr><td class=\"h1\">Zone<\/td><td>d'intervalle,<\/td><td>entre<\/td><td>deux<\/td><td>événements<\/td><td>(apparition,<\/td><td>disparition)<\/td><\/tr><tr><td class=\"h1\">Zone<\/td><td>d'association,<\/td><td>un<\/td><td>ensemble<\/td><td>de<\/td><td>taxons<\/td><td>qui<\/td><td>vivent<\/td><td>ensemble<\/td><\/tr><tr><td class=\"h1\">Zone<\/td><td>d'abondance<\/td><td>(acmé),<\/td><td>le<\/td><td>maximum<\/td><td>d'abondance<\/td><td>d'un<\/td><td>taxon<\/td><\/tr><\/table><\/figure><h2>Idée 3 · Corréler<\/h2>\n<p>On relie deux coupes éloignées en reconnaissant les mêmes biozones. Les limites de biozones sont des lignes de temps, contrairement aux limites de formations.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Contrôle 2019-2020<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Différence entre étude biostratigraphique et étude paléoécologique ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Biostratigraphie : on utilise la succession des fossiles pour dater relativement et corréler les couches (biozones). Paléoécologie : on utilise les fossiles et les sédiments pour reconstituer le milieu de vie (bathymétrie, salinité, énergie, climat) et les relations entre organismes.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Un bon fossile stratigraphique a une durée de vie :<\/div><button class=\"opt\" data-o=\"0\">courte<\/button><button class=\"opt\" data-o=\"1\">longue<\/button><button class=\"opt\" data-o=\"2\">infinie<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Les ammonites datent surtout :<\/div><button class=\"opt\" data-o=\"0\">le Mésozoïque<\/button><button class=\"opt\" data-o=\"1\">le Quaternaire<\/button><button class=\"opt\" data-o=\"2\">le Précambrien<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Une biozone est définie par :<\/div><button class=\"opt\" data-o=\"0\">son contenu fossile<\/button><button class=\"opt\" data-o=\"1\">la couleur des roches<\/button><button class=\"opt\" data-o=\"2\">l&#39;épaisseur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">La biostratigraphie sert à :<\/div><button class=\"opt\" data-o=\"0\">dater et corréler<\/button><button class=\"opt\" data-o=\"1\">reconstituer le climat seulement<\/button><button class=\"opt\" data-o=\"2\">mesurer la radioactivité<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Les graptolites caractérisent :<\/div><button class=\"opt\" data-o=\"0\">le Paléozoïque inférieur<\/button><button class=\"opt\" data-o=\"1\">le Cénozoïque<\/button><button class=\"opt\" data-o=\"2\">le Jurassique<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Une zone d&#39;acmé correspond :<\/div><button class=\"opt\" data-o=\"0\">au maximum d&#39;abondance d&#39;un taxon<\/button><button class=\"opt\" data-o=\"1\">à son apparition<\/button><button class=\"opt\" data-o=\"2\">à son extinction<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Les limites de biozones sont :<\/div><button class=\"opt\" data-o=\"0\">des lignes de temps<\/button><button class=\"opt\" data-o=\"1\">des limites de faciès<\/button><button class=\"opt\" data-o=\"2\">des failles<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Un fossile dépendant du faciès est :<\/div><button class=\"opt\" data-o=\"0\">un mauvais fossile stratigraphique<\/button><button class=\"opt\" data-o=\"1\">un excellent fossile stratigraphique<\/button><button class=\"opt\" data-o=\"2\">toujours un microfossile<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Les foraminifères planctoniques sont utiles car :<\/div><button class=\"opt\" data-o=\"0\">abondants et largement répandus<\/button><button class=\"opt\" data-o=\"1\">très grands<\/button><button class=\"opt\" data-o=\"2\">terrestres<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">La paléoécologie reconstitue :<\/div><button class=\"opt\" data-o=\"0\">le milieu de vie<\/button><button class=\"opt\" data-o=\"1\">l&#39;âge en années<\/button><button class=\"opt\" data-o=\"2\">l&#39;ordre des couches<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"biostratigraphie","rep":null,"tol":null},{"n":"biostratigraphie","rep":null,"tol":null}],"qcm":[{"n":"biostratigraphie","q":"Un bon fossile stratigraphique a une durée de vie :","o":["courte","longue","infinie"],"a":0,"e":"Précision."},{"n":"biostratigraphie","q":"Les ammonites datent surtout :","o":["le Mésozoïque","le Quaternaire","le Précambrien"],"a":0,"e":"Disparues à K-T."},{"n":"biostratigraphie","q":"Une biozone est définie par :","o":["son contenu fossile","la couleur des roches","l&#39;épaisseur"],"a":0,"e":"Bio."},{"n":"biostratigraphie","q":"La biostratigraphie sert à :","o":["dater et corréler","reconstituer le climat seulement","mesurer la radioactivité"],"a":0,"e":"Chronologie relative."},{"n":"biostratigraphie","q":"Les graptolites caractérisent :","o":["le Paléozoïque inférieur","le Cénozoïque","le Jurassique"],"a":0,"e":"Ordovicien, Silurien."},{"n":"biostratigraphie","q":"Une zone d&#39;acmé correspond :","o":["au maximum d&#39;abondance d&#39;un taxon","à son apparition","à son extinction"],"a":0,"e":"Abondance."},{"n":"biostratigraphie","q":"Les limites de biozones sont :","o":["des lignes de temps","des limites de faciès","des failles"],"a":0,"e":"Isochrones."},{"n":"biostratigraphie","q":"Un fossile dépendant du faciès est :","o":["un mauvais fossile stratigraphique","un excellent fossile stratigraphique","toujours un microfossile"],"a":0,"e":"Il manque dans les autres milieux."},{"n":"biostratigraphie","q":"Les foraminifères planctoniques sont utiles car :","o":["abondants et largement répandus","très grands","terrestres"],"a":0,"e":"Microfossiles marins."},{"n":"biostratigraphie","q":"La paléoécologie reconstitue :","o":["le milieu de vie","l&#39;âge en années","l&#39;ordre des couches"],"a":0,"e":"Environnement."}]},{"id":"fossilisation","t":"Fossiles et fossilisation","seance":"Paléontologie · Taphonomie et vocabulaire","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir qu&#39;un organisme mort est en général détruit (décomposition, charognards).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Les parties molles se fossilisent-elles souvent ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Rarement : il faut un enfouissement très rapide et sans oxygène.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « enterré vite, à l&#39;abri ».<\/strong> Une fossilisation réussie = parties dures + enfouissement rapide + peu d&#39;oxygène.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Croire qu&#39;un fossile est toujours un reste d&#39;organisme. Une trace (empreinte de pas, terrier) est aussi un fossile : un <strong>ichnofossile<\/strong>.<\/p>\n<\/aside><p>À la fin, tu sais définir les termes qui tombent au contrôle et décrire les modes de fossilisation.<\/p>\n<h2>Idée 1 · Les modes de fossilisation<\/h2>\n<figure class=\"grille\"><figcaption>Modes<\/figcaption><table><tr><th>Mode,<\/th><th>Ce<\/th><th>qui<\/th><th>se<\/th><th>passe,<\/th><th>Exemple<\/th><\/tr><tr><td class=\"h1\">Conservation<\/td><td>intégrale,<\/td><td>l'organisme<\/td><td>entier<\/td><td>est<\/td><td>gardé,<\/td><td>mammouth<\/td><td>dans<\/td><td>la<\/td><td>glace,<\/td><td>insecte<\/td><td>dans<\/td><td>l'ambre<\/td><\/tr><tr><td class=\"h1\">Perminéralisation,<\/td><td>des<\/td><td>minéraux<\/td><td>remplissent<\/td><td>les<\/td><td>pores<\/td><td>des<\/td><td>tissus,<\/td><td>bois<\/td><td>silicifié<\/td><\/tr><tr><td class=\"h1\">Épigénie<\/td><td>(remplacement),<\/td><td>la<\/td><td>matière<\/td><td>est<\/td><td>remplacée<\/td><td>molécule<\/td><td>à<\/td><td>molécule,<\/td><td>ammonite<\/td><td>pyritisée<\/td><\/tr><tr><td class=\"h1\">Moule<\/td><td>et<\/td><td>empreinte,<\/td><td>le<\/td><td>reste<\/td><td>disparaît,<\/td><td>seule<\/td><td>sa<\/td><td>forme<\/td><td>reste,<\/td><td>moule<\/td><td>interne<\/td><td>de<\/td><td>coquille<\/td><\/tr><tr><td class=\"h1\">Carbonisation<\/td><td>(extraction<\/td><td>des<\/td><td>éléments<\/td><td>volatils),<\/td><td>les<\/td><td>éléments<\/td><td>volatils<\/td><td>(H,<\/td><td>O,<\/td><td>N)<\/td><td>partent,<\/td><td>il<\/td><td>reste<\/td><td>un<\/td><td>film<\/td><td>de<\/td><td>carbone,<\/td><td>feuilles<\/td><td>fossiles<\/td><\/tr><\/table><\/figure><h2>Idée 2 · Le vocabulaire du contrôle<\/h2>\n<figure class=\"grille\"><figcaption>Définitions<\/figcaption><table><tr><th>Terme,<\/th><th>Définition<\/th><\/tr><tr><td class=\"h1\">Ichnofossile,<\/td><td>trace<\/td><td>d'activité<\/td><td>fossilisée<\/td><td>(piste,<\/td><td>terrier,<\/td><td>empreinte)<\/td><\/tr><tr><td class=\"h1\">Taxonomie,<\/td><td>science<\/td><td>qui<\/td><td>nomme<\/td><td>et<\/td><td>classe<\/td><td>les<\/td><td>êtres<\/td><td>vivants<\/td><\/tr><tr><td class=\"h1\">Biocénose,<\/td><td>ensemble<\/td><td>des<\/td><td>organismes<\/td><td>vivant<\/td><td>ensemble<\/td><td>dans<\/td><td>un<\/td><td>milieu<\/td><\/tr><tr><td class=\"h1\">Thanatocénose,<\/td><td>ensemble<\/td><td>des<\/td><td>restes<\/td><td>accumulés<\/td><td>après<\/td><td>la<\/td><td>mort<\/td><\/tr><tr><td class=\"h1\">Endobionte,<\/td><td>organisme<\/td><td>vivant<\/td><td>dans<\/td><td>le<\/td><td>sédiment<\/td><\/tr><tr><td class=\"h1\">Sessile,<\/td><td>organisme<\/td><td>fixé<\/td><\/tr><tr><td class=\"h1\">Nécrophage,<\/td><td>se<\/td><td>nourrit<\/td><td>de<\/td><td>cadavres<\/td><\/tr><tr><td class=\"h1\">Limnivore,<\/td><td>avale<\/td><td>le<\/td><td>sédiment<\/td><td>pour<\/td><td>en<\/td><td>extraire<\/td><td>la<\/td><td>matière<\/td><td>organique<\/td><\/tr><tr><td class=\"h1\">Extinction,<\/td><td>disparition<\/td><td>définitive<\/td><td>d'un<\/td><td>taxon<\/td><\/tr><\/table><\/figure><h2>Idée 3 · Le dimorphisme sexuel<\/h2>\n<p>Différence de forme entre mâles et femelles d&#39;une même espèce. Chez les <strong>ammonites<\/strong>, les macroconques (grandes, femelles probables) et microconques (petites, à apophyses jugales, mâles probables). Chez les <strong>ostracodes<\/strong>, les carapaces des femelles sont souvent renflées à l&#39;arrière (logement des œufs).<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Contrôle 2015-2016<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Explique le cas de l&#39;extraction des éléments volatils.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>C&#39;est la carbonisation : après l&#39;enfouissement, la pression et la chaleur chassent l&#39;hydrogène, l&#39;oxygène et l&#39;azote de la matière organique. Il reste une pellicule de carbone qui dessine l&#39;organisme (feuilles, poissons). C&#39;est aussi le processus qui forme le charbon.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Une empreinte de pas de dinosaure est :<\/div><button class=\"opt\" data-o=\"0\">un ichnofossile<\/button><button class=\"opt\" data-o=\"1\">une perminéralisation<\/button><button class=\"opt\" data-o=\"2\">une thanatocénose<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Le bois silicifié résulte :<\/div><button class=\"opt\" data-o=\"0\">d&#39;une perminéralisation<\/button><button class=\"opt\" data-o=\"1\">d&#39;une carbonisation<\/button><button class=\"opt\" data-o=\"2\">d&#39;une conservation intégrale<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Un organisme fixé est dit :<\/div><button class=\"opt\" data-o=\"0\">sessile<\/button><button class=\"opt\" data-o=\"1\">vagile<\/button><button class=\"opt\" data-o=\"2\">endobionte<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Un limnivore :<\/div><button class=\"opt\" data-o=\"0\">avale le sédiment<\/button><button class=\"opt\" data-o=\"1\">chasse des proies<\/button><button class=\"opt\" data-o=\"2\">fait la photosynthèse<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">La carbonisation :<\/div><button class=\"opt\" data-o=\"0\">chasse les éléments volatils<\/button><button class=\"opt\" data-o=\"1\">ajoute du calcaire<\/button><button class=\"opt\" data-o=\"2\">conserve les couleurs<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">La thanatocénose est :<\/div><button class=\"opt\" data-o=\"0\">un assemblage de restes après la mort<\/button><button class=\"opt\" data-o=\"1\">une communauté vivante<\/button><button class=\"opt\" data-o=\"2\">une espèce<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">La conservation dans l&#39;ambre est :<\/div><button class=\"opt\" data-o=\"0\">intégrale<\/button><button class=\"opt\" data-o=\"1\">un moule<\/button><button class=\"opt\" data-o=\"2\">une épigénie<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Favorise la fossilisation :<\/div><button class=\"opt\" data-o=\"0\">un enfouissement rapide<\/button><button class=\"opt\" data-o=\"1\">l&#39;oxygène abondant<\/button><button class=\"opt\" data-o=\"2\">les charognards<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Un endobionte vit :<\/div><button class=\"opt\" data-o=\"0\">dans le sédiment<\/button><button class=\"opt\" data-o=\"1\">sur une roche<\/button><button class=\"opt\" data-o=\"2\">en pleine eau<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Les microconques d&#39;ammonites sont probablement :<\/div><button class=\"opt\" data-o=\"0\">des mâles<\/button><button class=\"opt\" data-o=\"1\">des juvéniles<\/button><button class=\"opt\" data-o=\"2\">des femelles<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"fossilisation","rep":null,"tol":null},{"n":"fossilisation","rep":null,"tol":null}],"qcm":[{"n":"fossilisation","q":"Une empreinte de pas de dinosaure est :","o":["un ichnofossile","une perminéralisation","une thanatocénose"],"a":0,"e":"Trace d&#39;activité."},{"n":"fossilisation","q":"Le bois silicifié résulte :","o":["d&#39;une perminéralisation","d&#39;une carbonisation","d&#39;une conservation intégrale"],"a":0,"e":"Silice dans les pores."},{"n":"fossilisation","q":"Un organisme fixé est dit :","o":["sessile","vagile","endobionte"],"a":0,"e":"Moules, coraux."},{"n":"fossilisation","q":"Un limnivore :","o":["avale le sédiment","chasse des proies","fait la photosynthèse"],"a":0,"e":"Vers fouisseurs."},{"n":"fossilisation","q":"La carbonisation :","o":["chasse les éléments volatils","ajoute du calcaire","conserve les couleurs"],"a":0,"e":"Il reste du carbone."},{"n":"fossilisation","q":"La thanatocénose est :","o":["un assemblage de restes après la mort","une communauté vivante","une espèce"],"a":0,"e":"Thanatos = mort."},{"n":"fossilisation","q":"La conservation dans l&#39;ambre est :","o":["intégrale","un moule","une épigénie"],"a":0,"e":"Insectes."},{"n":"fossilisation","q":"Favorise la fossilisation :","o":["un enfouissement rapide","l&#39;oxygène abondant","les charognards"],"a":0,"e":"À l&#39;abri de la décomposition."},{"n":"fossilisation","q":"Un endobionte vit :","o":["dans le sédiment","sur une roche","en pleine eau"],"a":0,"e":"Fouisseur."},{"n":"fossilisation","q":"Les microconques d&#39;ammonites sont probablement :","o":["des mâles","des juvéniles","des femelles"],"a":0,"e":"Dimorphisme sexuel."}]},{"id":"paleoecologie-crises","t":"Paléoécologie et crises biologiques","seance":"Paléontologie · Paléoenvironnements, extinctions","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir qu&#39;une espèce vit dans un milieu précis (profondeur, salinité, température).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Des coraux constructeurs actuels vivent-ils en eau froide et profonde ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Non : en eau chaude, claire et peu profonde (zone éclairée).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « détective ».<\/strong> Fossiles en position de vie + sédiment + traces = un paléoenvironnement.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Utiliser un fossile transporté. Une coquille roulée a pu être déplacée loin de son milieu de vie : vérifie qu&#39;il est <strong>en place<\/strong> (autochtone).<\/p>\n<\/aside><p>À la fin, tu sais reconstituer un paléoenvironnement et citer les causes des crises biologiques.<\/p>\n<h2>Idée 1 · Reconstituer un paléoenvironnement<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Méthode (contrôle 2019-2020)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · 1. Identifier les fossiles et vérifier qu&#39;ils sont en place (biocénose, pas thanatocénose remaniée).<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · 2. Appliquer l&#39;actualisme : comparer aux espèces actuelles proches et à leur milieu.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · 3. Étudier le sédiment : granulométrie, figures sédimentaires, minéraux (énergie, profondeur).<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · 4. Utiliser les traces fossiles (ichnofaciès) et la géochimie (isotopes de l&#39;oxygène pour la température).<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · 5. Croiser tous les indices et conclure : milieu, profondeur, salinité, climat.<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Idée 2 · Les grandes crises<\/h2>\n<figure class=\"grille\"><figcaption>Les cinq grandes extinctions<\/figcaption><table><tr><th>Crise,<\/th><th>Âge,<\/th><th>Victimes<\/th><th>emblématiques<\/th><\/tr><tr><td class=\"h1\">Fin<\/td><td>Ordovicien,<\/td><td>≈<\/td><td>444<\/td><td>Ma,<\/td><td>nombreux<\/td><td>invertébrés<\/td><td>marins<\/td><\/tr><tr><td class=\"h1\">Fin<\/td><td>Dévonien,<\/td><td>≈<\/td><td>372<\/td><td>Ma,<\/td><td>récifs<\/td><\/tr><tr><td class=\"h1\">Permien-Trias,<\/td><td>252<\/td><td>Ma,<\/td><td>≈<\/td><td>95<\/td><td>%<\/td><td>des<\/td><td>espèces<\/td><td>marines,<\/td><td>trilobites<\/td><\/tr><tr><td class=\"h1\">Fin<\/td><td>Trias,<\/td><td>≈<\/td><td>201<\/td><td>Ma,<\/td><td>nombreux<\/td><td>reptiles<\/td><\/tr><tr><td class=\"h1\">Crétacé-Tertiaire<\/td><td>(K-T),<\/td><td>66<\/td><td>Ma,<\/td><td>dinosaures<\/td><td>non<\/td><td>aviens,<\/td><td>ammonites<\/td><\/tr><\/table><\/figure><h2>Idée 3 · Les causes<\/h2>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Trois grandes causes : <strong>volcanisme massif<\/strong> (trapps de Sibérie au Permien-Trias, trapps du Deccan à K-T), <strong>impacts météoritiques<\/strong> (Chicxulub à K-T, couche à iridium), <strong>variations du niveau marin et du climat<\/strong> (régressions, glaciations, anoxie des océans).<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Contrôle 2019-2020<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Cite les trois principales causes des crises biologiques majeures.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Volcanisme intense (trapps), impact de météorite, changements du niveau marin et du climat (glaciation, réchauffement, anoxie).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">La plus grande extinction :<\/div><button class=\"opt\" data-o=\"0\">Permien-Trias<\/button><button class=\"opt\" data-o=\"1\">K-T<\/button><button class=\"opt\" data-o=\"2\">fin Dévonien<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Le cratère de Chicxulub est lié :<\/div><button class=\"opt\" data-o=\"0\">à la limite K-T<\/button><button class=\"opt\" data-o=\"1\">au Permien<\/button><button class=\"opt\" data-o=\"2\">au Cambrien<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Les trapps de Sibérie sont :<\/div><button class=\"opt\" data-o=\"0\">un volcanisme massif<\/button><button class=\"opt\" data-o=\"1\">un impact<\/button><button class=\"opt\" data-o=\"2\">une glaciation<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Pour reconstituer un milieu, un fossile doit être :<\/div><button class=\"opt\" data-o=\"0\">en place<\/button><button class=\"opt\" data-o=\"1\">roulé et transporté<\/button><button class=\"opt\" data-o=\"2\">isolé de tout sédiment<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Les isotopes de l&#39;oxygène renseignent sur :<\/div><button class=\"opt\" data-o=\"0\">la température<\/button><button class=\"opt\" data-o=\"1\">l&#39;âge absolu<\/button><button class=\"opt\" data-o=\"2\">la profondeur des failles<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Les ammonites disparaissent :<\/div><button class=\"opt\" data-o=\"0\">à K-T<\/button><button class=\"opt\" data-o=\"1\">au Permien-Trias<\/button><button class=\"opt\" data-o=\"2\">au Quaternaire<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Des coraux constructeurs fossiles indiquent :<\/div><button class=\"opt\" data-o=\"0\">une mer chaude et peu profonde<\/button><button class=\"opt\" data-o=\"1\">une mer froide et profonde<\/button><button class=\"opt\" data-o=\"2\">un lac de montagne<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">L&#39;anoxie des océans est :<\/div><button class=\"opt\" data-o=\"0\">un manque d&#39;oxygène dans l&#39;eau<\/button><button class=\"opt\" data-o=\"1\">un excès d&#39;oxygène<\/button><button class=\"opt\" data-o=\"2\">un volcan sous-marin<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Une régression peut provoquer :<\/div><button class=\"opt\" data-o=\"0\">la disparition d&#39;habitats côtiers<\/button><button class=\"opt\" data-o=\"1\">une hausse du niveau marin<\/button><button class=\"opt\" data-o=\"2\">aucun effet<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Les trapps du Deccan sont associés à :<\/div><button class=\"opt\" data-o=\"0\">la limite K-T<\/button><button class=\"opt\" data-o=\"1\">l&#39;Ordovicien<\/button><button class=\"opt\" data-o=\"2\">le Trias<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"paleoecologie-crises","rep":null,"tol":null},{"n":"paleoecologie-crises","rep":null,"tol":null}],"qcm":[{"n":"paleoecologie-crises","q":"La plus grande extinction :","o":["Permien-Trias","K-T","fin Dévonien"],"a":0,"e":"≈ 95 % des espèces marines."},{"n":"paleoecologie-crises","q":"Le cratère de Chicxulub est lié :","o":["à la limite K-T","au Permien","au Cambrien"],"a":0,"e":"66 Ma."},{"n":"paleoecologie-crises","q":"Les trapps de Sibérie sont :","o":["un volcanisme massif","un impact","une glaciation"],"a":0,"e":"Permien-Trias."},{"n":"paleoecologie-crises","q":"Pour reconstituer un milieu, un fossile doit être :","o":["en place","roulé et transporté","isolé de tout sédiment"],"a":0,"e":"Autochtone."},{"n":"paleoecologie-crises","q":"Les isotopes de l&#39;oxygène renseignent sur :","o":["la température","l&#39;âge absolu","la profondeur des failles"],"a":0,"e":"Paléothermomètre."},{"n":"paleoecologie-crises","q":"Les ammonites disparaissent :","o":["à K-T","au Permien-Trias","au Quaternaire"],"a":0,"e":"Avec les dinosaures."},{"n":"paleoecologie-crises","q":"Des coraux constructeurs fossiles indiquent :","o":["une mer chaude et peu profonde","une mer froide et profonde","un lac de montagne"],"a":0,"e":"Actualisme."},{"n":"paleoecologie-crises","q":"L&#39;anoxie des océans est :","o":["un manque d&#39;oxygène dans l&#39;eau","un excès d&#39;oxygène","un volcan sous-marin"],"a":0,"e":"Cause de crise."},{"n":"paleoecologie-crises","q":"Une régression peut provoquer :","o":["la disparition d&#39;habitats côtiers","une hausse du niveau marin","aucun effet"],"a":0,"e":"Plateaux continentaux exondés."},{"n":"paleoecologie-crises","q":"Les trapps du Deccan sont associés à :","o":["la limite K-T","l&#39;Ordovicien","le Trias"],"a":0,"e":"Inde."}]},{"id":"annales-corrigees","t":"Annales corrigées · contrôles de paléontologie (Pr Rhalmi)","seance":"Contrôles de cours, BCG S3 section A (1 h)","imp":5,"payant":true,"html":"<p>Les questions qui reviennent dans les contrôles du Pr Rhalmi (2015-2016, 2017-2018, 2019-2020, 2020-2021), avec des réponses types. Les réponses sont rédigées par nous à partir du cours.<\/p>\n<h2>Contrôle 2015-2016<\/h2>\n<section class=\"exo\"><h3>Définitions (5 points)<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Ichnofossile, perminéralisation, paléoenvironnement, endobionte, taxonomie.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Ichnofossile : trace fossile d&#39;activité. Perminéralisation : remplissage des pores des tissus par des minéraux. Paléoenvironnement : milieu de vie et de dépôt d&#39;une époque passée. Endobionte : organisme vivant dans le sédiment. Taxonomie : science de la classification et de la nomenclature des êtres vivants.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Extinction, biocénose, sessile, nécrophage, limnivore.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Extinction : disparition définitive d&#39;un taxon. Biocénose : communauté d&#39;organismes vivant ensemble. Sessile : fixé au substrat. Nécrophage : se nourrit de cadavres. Limnivore : ingère le sédiment pour en extraire la matière organique.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Questions (6 points)<\/h3><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Explique le dimorphisme sexuel, avec deux exemples.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Différence morphologique entre mâles et femelles d&#39;une même espèce. Ex. 1 : ammonites, macroconques et microconques (à apophyses jugales). Ex. 2 : ostracodes, carapace des femelles renflée à l&#39;arrière.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Explique le cas de l&#39;extraction des éléments volatils.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Carbonisation : sous l&#39;effet de l&#39;enfouissement, H, O et N quittent la matière organique ; il reste un film de carbone qui garde la forme de l&#39;organisme.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Contrôle 2019-2020<\/h2>\n<section class=\"exo\"><h3>Synthèse (15 points)<\/h3><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Différence entre étude biostratigraphique et étude paléoécologique (5 points).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Biostratigraphie : fossiles comme outils de datation relative et de corrélation (biozones, bons fossiles stratigraphiques). Paléoécologie : fossiles comme indicateurs du milieu de vie (bathymétrie, salinité, température, énergie) et des relations entre organismes.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>Trois principales causes des crises biologiques (5 points).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Volcanisme massif (trapps), impact météoritique, variations du niveau marin et du climat (glaciation, anoxie).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><p>Comment reconstituer un paléoenvironnement (5 points) ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Fossiles en place, actualisme, étude du sédiment, traces fossiles, géochimie, puis synthèse (voir chapitre 5).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Pour une question de synthèse à 5 points, vise 5 idées : une par point, chacune avec un exemple.<\/p>\n<\/aside><h2>QCM d&#39;entraînement<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Un terrier fossile est :<\/div><button class=\"opt\" data-o=\"0\">un ichnofossile<\/button><button class=\"opt\" data-o=\"1\">une biocénose<\/button><button class=\"opt\" data-o=\"2\">une perminéralisation<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">La taxonomie :<\/div><button class=\"opt\" data-o=\"0\">classe et nomme les êtres vivants<\/button><button class=\"opt\" data-o=\"1\">date les roches<\/button><button class=\"opt\" data-o=\"2\">étudie les séismes<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Les ostracodes montrent un dimorphisme :<\/div><button class=\"opt\" data-o=\"0\">de la carapace<\/button><button class=\"opt\" data-o=\"1\">de la couleur seulement<\/button><button class=\"opt\" data-o=\"2\">aucun<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Un limnivore se nourrit :<\/div><button class=\"opt\" data-o=\"0\">du sédiment<\/button><button class=\"opt\" data-o=\"1\">de plantes<\/button><button class=\"opt\" data-o=\"2\">de cadavres<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">La carbonisation laisse :<\/div><button class=\"opt\" data-o=\"0\">un film de carbone<\/button><button class=\"opt\" data-o=\"1\">un moule calcaire<\/button><button class=\"opt\" data-o=\"2\">un organisme entier<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">La biostratigraphie utilise les fossiles pour :<\/div><button class=\"opt\" data-o=\"0\">dater et corréler<\/button><button class=\"opt\" data-o=\"1\">reconstituer la température seulement<\/button><button class=\"opt\" data-o=\"2\">mesurer l&#39;épaisseur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Une question à 5 points demande environ :<\/div><button class=\"opt\" data-o=\"0\">5 idées<\/button><button class=\"opt\" data-o=\"1\">1 idée<\/button><button class=\"opt\" data-o=\"2\">20 lignes de détails sans structure<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">L&#39;actualisme sert à :<\/div><button class=\"opt\" data-o=\"0\">interpréter les fossiles par comparaison avec l&#39;actuel<\/button><button class=\"opt\" data-o=\"1\">dater en années<\/button><button class=\"opt\" data-o=\"2\">classer les roches<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Le volcanisme des trapps est :<\/div><button class=\"opt\" data-o=\"0\">une cause de crise<\/button><button class=\"opt\" data-o=\"1\">une conséquence d&#39;une crise<\/button><button class=\"opt\" data-o=\"2\">sans effet sur le climat<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Un nécrophage :<\/div><button class=\"opt\" data-o=\"0\">mange des cadavres<\/button><button class=\"opt\" data-o=\"1\">est fixé<\/button><button class=\"opt\" data-o=\"2\">vit dans le sédiment<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"annales-c // Format « score10 » : scores des chapitres dans MODULE.cle, essais et cartes dans MODULE.cleEtat.
const lireJ = (k) => { try { return JSON.parse(localStorage.getItem(k) || "{}") || {}; } catch (e) { return {}; } };
const ecrireJ = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const etat = () => { const S = lireJ(MODULE.cleEtat); S.attempts = S.attempts || {}; S.cards = S.cards || {}; return S; };
function noter(n, ok) { const S = etat(); (S.attempts[n] = S.attempts[n] || []).push(ok ? 1 : 0); if (S.attempts[n].length > 30) S.attempts[n].shift(); ecrireJ(MODULE.cleEtat, S); }
// Maîtrisé = au moins 3 essais et 80 % de réussite sur les 5 derniers (règle commune à la plateforme).
function statut(n) {
  if (MODULE.format === "score10") { const v = lireJ(MODULE.cle)[n]; if (v !== undefined) return [v >= 8 ? "ok" : "fragile", v / 10]; }
  if (MODULE.format === "best") { const v = (lireJ(MODULE.cle).notions || {})[n]; return v && v.best != null ? [v.best >= 0.8 ? "ok" : "fragile", v.best] : ["jamais", null]; }
  if (MODULE.format === "pc") { const v = lireJ(MODULE.cle)[n]; return v && v.pc !== undefined ? [v.pc >= 80 ? "ok" : "fragile", v.pc / 100] : ["jamais", null]; } const a = (etat().attempts[n] || []).slice(-5); if (!a.length) return ["jamais", null]; const r = a.reduce((x, y) => x + y, 0) / a.length; return [(etat().attempts[n].length >= 3 && r >= 0.8) ? "ok" : "fragile", r]; }
const NCH = {}; NOTIONS.forEach((n) => (NCH[n.ch] = NCH[n.ch] || []).push(n));
function scoreChap(c) {
  if (MODULE.format === "score10") return lireJ(MODULE.cle)[c.id];
  if (MODULE.format === "pc") { const v = lireJ(MODULE.cle)[c.id]; return v && v.pc !== undefined ? Math.round(v.pc / 10) : undefined; }
  if (MODULE.format === "best") { const v = (lireJ(MODULE.cle).notions || {})[c.id]; return v && v.best != null ? Math.round(v.best * 10) : undefined; }
  const l = NCH[c.id] || []; if (!l.length || !l.some((n) => statut(n.id)[0] !== "jamais")) return undefined;
  return Math.round((10 * l.filter((n) => statut(n.id)[0] === "ok").length) / l.length);
}

function vueBord() {
