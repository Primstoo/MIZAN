<script>
const MODULE={"slug":"prog-c","titre":"Programmation en C","cle":"prog-c_scores","cleEtat":"prog-c_scores_etat","format":"score10","intro":"<p>Ce module suit <strong>les 7 chapitres du polycopié du Pr Safi<\/strong>, puis corrige les <strong>TD 1 et 2<\/strong>, les <strong>TP 2 à 5<\/strong> et son <strong>examen blanc (1 h 30)<\/strong>.<\/p>\n<p><strong>Comment l&#39;utiliser<\/strong><\/p>\n<ol>\n<li>Lis un chapitre : chaque idée a un schéma ou un pas-à-pas.<\/li>\n<li>Recopie les programmes et compile-les (Code::Blocks, ou <code>gcc prog.c -o prog<\/code>). Lire du C ne suffit pas.<\/li>\n<li>Fais le QCM : <strong>8/10 = chapitre maîtrisé<\/strong>.<\/li>\n<li>Le tuteur (en bas à droite) répond à tes questions.<\/li>\n<\/ol>\n<p><strong>Ce qui est sûr<\/strong> : le plan et les exemples viennent du cours ; tous les programmes ont été compilés et exécutés.\n<strong>À vérifier<\/strong> : le barème de l&#39;examen. Le corrigé manuscrit du TD qui circule contient des erreurs : elles sont signalées au chapitre « TD et TP corrigés ».<\/p>\n","annexes":[],"cartes":null,"maths":false};
const CHAPS=[{"id":"bases-types","t":"Premier programme, types de base et constantes","seance":"Chapitre 1 · L'environnement et les bibliothèques","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu dois savoir ce qu&#39;est un algorithme : des variables, des affectations, une boucle « pour ». Le C n&#39;est qu&#39;une façon stricte de l&#39;écrire.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>En algorithmique, que vaut S après : S ← 0 ; pour i de 1 à 4 faire S ← S + i ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 10<\/b><\/p><p>0 + 1 + 2 + 3 + 4 = 10. C&#39;est exactement le programme d&#39;exemple du chapitre (somme des entiers de 1 à N).<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Le C ne devine rien. Chaque variable a un <strong>type<\/strong> déclaré, chaque instruction finit par <code>;<\/code>, chaque affichage dit son format (<code>%d<\/code>, <code>%f<\/code>…). Pense « contrat » : tu annonces, le compilateur vérifie.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Une variable non initialisée <strong>ne vaut pas 0<\/strong> : elle contient n&#39;importe quoi. Le prof insiste : <code>int iSomme = 0;<\/code> et pas <code>int iSomme;<\/code>.<\/p>\n<\/aside><p>À la fin, tu sais lire la structure d&#39;un programme C, choisir le bon type et reconnaître une constante valide.<\/p>\n<h2>Idée 1 · La forme d&#39;un programme C<\/h2>\n<p>Un programme C = des <code>#include<\/code> (bibliothèques) + une fonction <strong><code>main<\/code><\/strong> (le programme principal) + éventuellement d&#39;autres fonctions. Un <strong>bloc<\/strong> est délimité par <code>{ }<\/code>.<\/p>\n<svg viewBox=\"0 0 600 230\" role=\"img\" aria-label=\"Anatomie d'un programme C : include, main, déclarations, instructions, return\" style=\"max-width:600px;width:100%\">\n<g font-family=\"monospace\" font-size=\"15\" fill=\"currentColor\">\n<rect x=\"10\" y=\"10\" width=\"330\" height=\"210\" rx=\"8\" fill=\"none\" stroke=\"currentColor\"/>\n<text x=\"25\" y=\"40\">#include &lt;stdio.h&gt;<\/text>\n<text x=\"25\" y=\"75\">int main(void)<\/text>\n<text x=\"25\" y=\"100\">{<\/text>\n<text x=\"45\" y=\"125\" fill=\"#D9824F\">int iSomme = 0;<\/text>\n<text x=\"45\" y=\"155\">iSomme += 5;<\/text>\n<text x=\"45\" y=\"180\">printf(\"%d\\n\", iSomme);<\/text>\n<text x=\"45\" y=\"205\">return 0; }<\/text>\n<\/g>\n<g font-family=\"sans-serif\" font-size=\"14\" fill=\"currentColor\">\n<text x=\"360\" y=\"40\">← bibliothèque (printf, scanf)<\/text>\n<text x=\"360\" y=\"75\">← programme principal<\/text>\n<text x=\"360\" y=\"125\" fill=\"#D9824F\">← déclarations (type + nom)<\/text>\n<text x=\"360\" y=\"167\">← instructions, chacune avec ;<\/text>\n<text x=\"360\" y=\"205\">← fin, 0 = tout va bien<\/text>\n<\/g><\/svg><p>Voici l&#39;exemple du cours (somme de 1 à N), avec N fixé à 10 pour pouvoir l&#39;exécuter :<\/p>\n<pre class=\"\"><code>#include &lt;stdio.h&gt;\nint main(void)\n{\n    int iCompteur;      /* compteur de boucle */\n    int iSomme = 0;     /* somme initialisée à 0 */\n    int N = 10;         /* borne (dans le cours : lue par scanf) */\n    for (iCompteur = 1; iCompteur &lt;= N; iCompteur++)\n        iSomme += iCompteur;   /* iSomme = iSomme + iCompteur */\n    printf(&quot;Somme = %d\\n&quot;, iSomme);\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Somme = 55<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le cours écrit <code>void main()<\/code> (style des vieux compilateurs Turbo C). La norme demande <code>int main(void)<\/code> avec <code>return 0;<\/code>. Gcc accepte <code>void main<\/code> avec un avertissement : à l&#39;examen, écris <code>int main<\/code>.<\/p>\n<\/aside><h2>Idée 2 · Les types de base et leur format<\/h2>\n<figure class=\"grille\"><figcaption>Types de base (taille sur gcc actuel)<\/figcaption><table><tr><th>Type,<\/th><th>Octets,<\/th><th>Format<\/th><th>printf,<\/th><th>Exemple<\/th><\/tr><tr><td class=\"h1\">int,<\/td><td>4,<\/td><td>%d,<\/td><td>42<\/td><\/tr><tr><td>short,<\/td><td>2,<\/td><td>%hd,<\/td><td>-300<\/td><\/tr><tr><td>long,<\/td><td>8,<\/td><td>%ld,<\/td><td>1500000L<\/td><\/tr><tr><td>unsigned,<\/td><td>4,<\/td><td>%u,<\/td><td>40000u<\/td><\/tr><tr><td class=\"h1\">float,<\/td><td>4,<\/td><td>%f,<\/td><td>3.5f<\/td><\/tr><tr><td class=\"h1\">double,<\/td><td>8,<\/td><td>%f<\/td><td>/<\/td><td>%lf,<\/td><td>3.14<\/td><\/tr><tr><td class=\"h1\">char,<\/td><td>1,<\/td><td>%c,<\/td><td>'A'<\/td><\/tr><\/table><\/figure><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le cours dit « int codé sur 2 octets en général, parfois 4 ». C&#39;était vrai sous DOS. Aujourd&#39;hui (gcc, Code::Blocks, Linux, Windows) <code>int<\/code> fait <strong>4 octets<\/strong> et <code>long<\/code> 8 octets sous Linux 64 bits (4 sous Windows). Vérifie toujours avec <code>sizeof<\/code>.<\/p>\n<\/aside><pre class=\"\"><code>#include &lt;stdio.h&gt;\nint main(void)\n{\n    printf(&quot;char=%zu short=%zu int=%zu float=%zu double=%zu\\n&quot;,\n           sizeof(char), sizeof(short), sizeof(int), sizeof(float), sizeof(double));\n    char B = 'A';\n    printf(&quot;Le caractere %c a le code %d\\n&quot;, B, B);\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>char=1 short=2 int=4 float=4 double=8\nLe caractere A a le code 65<\/code><\/pre><p>Un <code>char<\/code> est un petit entier : <code>&#39;A&#39;<\/code> vaut 65 (code ASCII). Il n&#39;y a <strong>pas de type chaîne<\/strong> en C : une chaîne est un tableau de <code>char<\/code> terminé par <code>&#39;\\0&#39;<\/code>.<\/p>\n<h2>Idée 3 · Les noms et les constantes<\/h2>\n<p>Un identificateur commence par une <strong>lettre ou <code>_<\/code><\/strong>, puis lettres, chiffres, <code>_<\/code>. Pas d&#39;accent, pas de tiret, pas d&#39;espace. Majuscules ≠ minuscules.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Lire une constante entière<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Regarde le début<\/div><p><code>0x<\/code> ou <code>0X<\/code> → hexadécimal ; <code>0<\/code> suivi de chiffres → octal ; sinon décimal.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Regarde la fin<\/div><p><code>L<\/code> → long ; <code>U<\/code> → unsigned ; <code>UL<\/code> / <code>LU<\/code> → unsigned long.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Convertis<\/div><p>0110 (octal) = 1×64 + 1×8 + 0 = 72 ; 0xFF = 15×16 + 15 = 255.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Constantes réelles<\/div><p>23.4 est un <code>double<\/code> par défaut ; 1e1f est un <code>float<\/code> (10) ; 34.5L est un <code>long double<\/code>.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le tableau du cours donne <code>0110 = 96 (= 8² + 8¹)<\/code>. C&#39;est faux : 8² + 8¹ = 64 + 8 = <strong>72<\/strong>. Le programme ci-dessous le confirme.<\/p>\n<\/aside><pre class=\"\"><code>#include &lt;stdio.h&gt;\nint main(void)\n{\n    printf(&quot;%d %d %d %ld\\n&quot;, 1924, 0110, 0xFF, -123L);\n    printf(&quot;%d %d\\n&quot;, 01231, 0xeba);\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>1924 72 255 -123\n665 3770<\/code><\/pre><p>Caractères spéciaux à connaître : <code>\\n<\/code> (saut de ligne), <code>\\t<\/code> (tabulation), <code>\\0<\/code> (caractère nul, fin de chaîne), <code>\\\\<\/code>, <code>\\&#39;<\/code>, <code>\\&quot;<\/code>.<\/p>\n<h2>Idée 4 · Tableaux statiques et chaînes (aperçu)<\/h2>\n<p><code>int iTableau[10];<\/code> réserve 10 entiers consécutifs, indicés de <strong>0 à 9<\/strong>. <code>int t[] = {4,5,8,12,-3};<\/code> fixe la taille à 5. <code>char t[] = &quot;abcde&quot;;<\/code> réserve <strong>6<\/strong> octets (5 lettres + <code>&#39;\\0&#39;<\/code>).<\/p>\n<pre class=\"\"><code>#include &lt;stdio.h&gt;\nint main(void)\n{\n    int iTableau[] = {4, 5, 8, 12, -3};\n    char t[] = &quot;abcde&quot;;\n    printf(&quot;%zu elements, 1er=%d, dernier=%d\\n&quot;,\n           sizeof(iTableau) / sizeof(int), iTableau[0], iTableau[4]);\n    printf(&quot;%s occupe %zu octets\\n&quot;, t, sizeof(t));\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>5 elements, 1er=4, dernier=-3\nabcde occupe 6 octets<\/code><\/pre><p>Avec un pointeur <code>char *p;<\/code> rien n&#39;est réservé : il faut <code>p = (char*) malloc(x);<\/code> puis <code>free(p);<\/code> (détaillé au chapitre 7).<\/p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Type + nom + <code>;<\/code> pour déclarer. Initialise toujours. Indices de 0 à n−1. Une chaîne finit par <code>&#39;\\0&#39;<\/code>.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>TD 1 · Exercice I (identificateurs)<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Lesquels sont acceptés : <code>fonction-1<\/code>, <code>_MOYENNE_du_MOIS_<\/code>, <code>3e_jour<\/code>, <code>limite_inf.<\/code>, <code>lim_supérieure<\/code>, <code>__A_<\/code>, <code>_<\/code>, <code>a<\/code>, <code>3<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Acceptés : <code>_MOYENNE_du_MOIS_<\/code>, <code>__A_<\/code>, <code>_<\/code>, <code>a<\/code>.\nRefusés : <code>fonction-1<\/code> (tiret), <code>3e_jour<\/code> et <code>3<\/code> (commencent par un chiffre), <code>limite_inf.<\/code> (point), <code>lim_supérieure<\/code> (accent é).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>TD 1 · Exercice II (types économiques)<\/h3><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Donne le type C le plus économique, sans perte de précision, pour : Compteur {0..300}, X {-120..100}, Mesure {-10..104}, surface1 {0.5..150075}, surface2 {-12..1500750.5}, N1 {0..2¹⁰}, N2 {0..4⁷}, N3 {0..32⁶}, trouve {vrai, faux}.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>char tient de -128 à 127, short de -32768 à 32767 ; un float garde environ 6-7 chiffres significatifs.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Compteur : <code>unsigned short<\/code> (300 &gt; 255, donc pas char).\nX, Y : <code>signed char<\/code> (−120..100 tient dans −128..127).\nMesure : <code>signed char<\/code> (−10..104).\nsurface1 : <code>float<\/code> (150075 a 6 chiffres significatifs, 150075.0 : OK en float).\nsurface2 : <code>double<\/code> (1500750.5 demande 8 chiffres significatifs, trop pour un float).\nN1 : 2¹⁰ = 1024 → <code>unsigned short<\/code>.\nN2 : 4⁷ = 2¹⁴ = 16384 → <code>unsigned short<\/code> (ou <code>short<\/code>).\nN3 : 32⁶ = 2³⁰ = 1 073 741 824 → <code>unsigned long<\/code> (dépasse short ; <code>int<\/code> 4 octets suffit sur gcc, mais la norme ne garantit qu&#39;un <code>long<\/code>).\ntrouve : <code>int<\/code> (pas de booléen en C ANSI ; 0 = faux, autre = vrai), ou <code>char<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Taille d&#39;une chaîne<\/h3><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Combien d&#39;octets réserve <code>char nom[] = &quot;FSABM&quot;;<\/code> ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 6<\/b><\/p><p>5 lettres + le <code>&#39;\\0&#39;<\/code> final ajouté par le compilateur.<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quel identificateur est valide en C ?<\/div><button class=\"opt\" data-o=\"0\"><code>3e_jour<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>_MOYENNE_du_MOIS_<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>limite-inf<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Que vaut la constante <code>0110<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">110<\/button><button class=\"opt\" data-o=\"1\">96<\/button><button class=\"opt\" data-o=\"2\">72<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Que vaut <code>0xFF<\/code> en décimal ?<\/div><button class=\"opt\" data-o=\"0\">15<\/button><button class=\"opt\" data-o=\"1\">255<\/button><button class=\"opt\" data-o=\"2\">256<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Quel est le type de la constante <code>23.4<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">float<\/button><button class=\"opt\" data-o=\"1\">double<\/button><button class=\"opt\" data-o=\"2\">int<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Combien d&#39;octets fait un <code>int<\/code> avec gcc sur un PC actuel ?<\/div><button class=\"opt\" data-o=\"0\">2<\/button><button class=\"opt\" data-o=\"1\">4<\/button><button class=\"opt\" data-o=\"2\">8<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Quel format pour afficher un <code>char<\/code> comme caractère ?<\/div><button class=\"opt\" data-o=\"0\"><code>%d<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>%c<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>%s<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Que contient <code>int iSomme;<\/code> juste après sa déclaration (variable locale) ?<\/div><button class=\"opt\" data-o=\"0\">0<\/button><button class=\"opt\" data-o=\"1\">1<\/button><button class=\"opt\" data-o=\"2\">Une valeur indéterminée<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\"><code>int t[10];<\/code> : quel est l&#39;indice du dernier élément ?<\/div><button class=\"opt\" data-o=\"0\">10<\/button><button class=\"opt\" data-o=\"1\">9<\/button><button class=\"opt\" data-o=\"2\">11<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Que représente <code>&#39;\\0&#39;<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">Le chiffre zéro<\/button><button class=\"opt\" data-o=\"1\">Le caractère nul qui termine une chaîne<\/button><button class=\"opt\" data-o=\"2\">Un saut de ligne<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Combien d&#39;éléments a <code>int t[] = {4,5,8,12,-3};<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">0, la taille manque<\/button><button class=\"opt\" data-o=\"1\">5<\/button><button class=\"opt\" data-o=\"2\">6<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"bases-types","rep":["10"],"tol":null},{"n":"bases-types","rep":null,"tol":null},{"n":"bases-types","rep":null,"tol":null},{"n":"bases-types","rep":["6"],"tol":null}],"qcm":[{"n":"bases-types","q":"Quel identificateur est valide en C ?","o":["<code>3e_jour<\/code>","<code>_MOYENNE_du_MOIS_<\/code>","<code>limite-inf<\/code>"],"a":1,"e":"Un nom commence par une lettre ou <code>_<\/code> et ne contient que lettres, chiffres et <code>_<\/code>."},{"n":"bases-types","q":"Que vaut la constante <code>0110<\/code> ?","o":["110","96","72"],"a":2,"e":"Le 0 initial indique l&#39;octal : 1×64 + 1×8 + 0 = 72. Le cours écrit 96 par erreur."},{"n":"bases-types","q":"Que vaut <code>0xFF<\/code> en décimal ?","o":["15","255","256"],"a":1,"e":"15×16 + 15 = 255."},{"n":"bases-types","q":"Quel est le type de la constante <code>23.4<\/code> ?","o":["float","double","int"],"a":1,"e":"Les constantes réelles sont <code>double<\/code> par défaut ; il faut <code>23.4f<\/code> pour un float."},{"n":"bases-types","q":"Combien d&#39;octets fait un <code>int<\/code> avec gcc sur un PC actuel ?","o":["2","4","8"],"a":1,"e":"4 octets (le cours mentionne 2 octets : c&#39;était sous DOS)."},{"n":"bases-types","q":"Quel format pour afficher un <code>char<\/code> comme caractère ?","o":["<code>%d<\/code>","<code>%c<\/code>","<code>%s<\/code>"],"a":1,"e":"<code>%c<\/code> pour un caractère, <code>%s<\/code> pour une chaîne ; <code>%d<\/code> affiche son code ASCII."},{"n":"bases-types","q":"Que contient <code>int iSomme;<\/code> juste après sa déclaration (variable locale) ?","o":["0","1","Une valeur indéterminée"],"a":2,"e":"Pas d&#39;initialisation par défaut pour une variable locale."},{"n":"bases-types","q":"<code>int t[10];<\/code> : quel est l&#39;indice du dernier élément ?","o":["10","9","11"],"a":1,"e":"Indices de 0 à n−1."},{"n":"bases-types","q":"Que représente <code>&#39;\\0&#39;<\/code> ?","o":["Le chiffre zéro","Le caractère nul qui termine une chaîne","Un saut de ligne"],"a":1,"e":"<code>&#39;\\0&#39;<\/code> (code 0) marque la fin d&#39;une chaîne ; le chiffre &#39;0&#39; a le code 48."},{"n":"bases-types","q":"Combien d&#39;éléments a <code>int t[] = {4,5,8,12,-3};<\/code> ?","o":["0, la taille manque","5","6"],"a":1,"e":"Sans taille, le compilateur compte les valeurs : 5."}]},{"id":"operateurs","t":"Opérateurs et expressions","seance":"Chapitre 2 · Opérateurs et expressions","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il te faut les types du chapitre 1 (<code>int<\/code>, <code>double<\/code>, <code>char<\/code>) et l&#39;idée qu&#39;en C <strong>vrai = tout sauf 0<\/strong>, <strong>faux = 0<\/strong>.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>En C, l&#39;expression <code>7 / 2<\/code> entre deux int vaut combien ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 3<\/b><\/p><p>Division entière : la partie décimale est jetée. Il faut un double (7.0 / 2) pour obtenir 3.5.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Évalue <strong>une étape à la fois<\/strong> et note après chaque étape la valeur rendue <strong>et<\/strong> les variables modifiées. C&#39;est exactement ce que demande l&#39;exercice IV du TD 1.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p><code>=<\/code> affecte, <code>==<\/code> compare. <code>if (a = 5)<\/code> met 5 dans <code>a<\/code> puis teste 5 (vrai) : toujours vrai, sans erreur de compilation.<\/p>\n<\/aside><p>À la fin, tu sais évaluer à la main n&#39;importe quelle expression du TD 1 (priorité, <code>++<\/code>, affectations composées, logique).<\/p>\n<h2>Idée 1 · Arithmétique : le type décide<\/h2>\n<p><code>+ - * / %<\/code>. Le résultat a le type des opérandes : deux <code>int<\/code> → division <strong>entière<\/strong> ; un <code>double<\/code> → division réelle. <code>%<\/code> (modulo, reste) n&#39;accepte que des entiers.<\/p>\n<pre class=\"\"><code>#include &lt;stdio.h&gt;\nint main(void)\n{\n    int x = 14, a;\n    double y = 14, b;\n    a = (x / 4) * 4;     /* 14/4 = 3, puis 3*4 */\n    b = (y / 4) * 4;     /* 3.5 * 4 */\n    printf(&quot;a=%d b=%.1f reste=%d\\n&quot;, a, b, 14 % 4);\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>a=12 b=14.0 reste=2<\/code><\/pre><h2>Idée 2 · <code>++<\/code> avant ou après<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>x = ++n contre x = n++ (n vaut 10)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · Pré-incrément <code>x = ++n;<\/code><\/div><p>n passe d&#39;abord à 11, puis x reçoit 11.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · Post-incrément <code>x = n++;<\/code><\/div><p>x reçoit d&#39;abord 10, puis n passe à 11.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · Bilan<\/div><p>dans les deux cas n finit à 11 ; seule la valeur <strong>utilisée<\/strong> change.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><pre class=\"\"><code>#include &lt;stdio.h&gt;\nint main(void)\n{\n    int x, n = 10;\n    x = ++n;\n    printf(&quot;x=%d n=%d\\n&quot;, x, n);\n    n = 10;\n    x = n++;\n    printf(&quot;x=%d n=%d\\n&quot;, x, n);\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>x=11 n=11\nx=10 n=11<\/code><\/pre><h2>Idée 3 · Priorité et sens d&#39;évaluation<\/h2>\n<figure class=\"flux\"><figcaption>Du plus prioritaire au moins prioritaire (simplifié)<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">() []<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">.<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">! ++ -- - unaire * &amp; sizeof<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">* / %<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">+ -<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">&lt;&lt; &gt;&gt;<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">&lt; &lt;= &gt; &gt;=<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">== !=<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">&amp;<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">^<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">|<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">&amp;&amp;<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">||<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">?:<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">= += -= *= /=<\/div><\/div><\/figure><ul>\n<li><code>a = b - c - d<\/code> se lit <code>(b - c) - d<\/code> (gauche → droite).<\/li>\n<li><code>a -= b -= c<\/code> se lit <code>a -= (b -= c)<\/code> (affectations : droite → gauche).<\/li>\n<li><code>&amp;&amp;<\/code> passe <strong>avant<\/strong> <code>||<\/code>.<\/li>\n<\/ul>\n<aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>Le Pr Safi conseille : « mettez des parenthèses plutôt que de vous fier au tableau de priorité ». À l&#39;examen, une parenthèse en trop ne coûte rien.<\/p>\n<\/aside><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Dans le tableau du cours, l&#39;opérateur <code>^<\/code> est imprimé « ∧ » et <code>||<\/code> est imprimé « k » (défaut de police). Il faut lire <code>^<\/code> (ou exclusif bit à bit) et <code>||<\/code> (ou logique).<\/p>\n<\/aside><h2>Idée 4 · Comparaison et logique rendent 0 ou 1<\/h2>\n<pre class=\"\"><code>#include &lt;stdio.h&gt;\nint main(void)\n{\n    int n = 0, m = 10, x, y;\n    x = (n &lt; 20) &amp;&amp; m;              /* 1 &amp;&amp; 10 -&gt; 1 */\n    y = !((n &gt; 20) || (m == 10));   /* !(0 || 1) -&gt; 0 */\n    printf(&quot;x=%d y=%d\\n&quot;, x, y);\n    printf(&quot;%d\\n&quot;, (3 * 4) &lt; (4 * 5));\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>x=1 y=0\n1<\/code><\/pre><p><code>&amp;&amp;<\/code> et <code>||<\/code> s&#39;arrêtent dès que le résultat est connu (évaluation paresseuse) : dans <code>0 &amp;&amp; f()<\/code>, <code>f<\/code> n&#39;est jamais appelée.<\/p>\n<h2>Idée 5 · Bits, décalages, affectation composée, ternaire, cast<\/h2>\n<figure class=\"grille\"><figcaption>n = 13 en binaire, puis n &amp; 12 et n &gt;&gt; 2<\/figcaption><table><tr><th>b3,<\/th><th>b2,<\/th><th>b1,<\/th><th>b0,<\/th><th>valeur<\/th><\/tr><tr><td class=\"h1\">1,<\/td><td class=\"h1\">1,<\/td><td>0,<\/td><td>1,<\/td><td>13<\/td><\/tr><tr><td>1,<\/td><td>1,<\/td><td>0,<\/td><td>0,<\/td><td>12<\/td><td>(masque)<\/td><\/tr><tr><td class=\"h1\">1,<\/td><td class=\"h1\">1,<\/td><td>0,<\/td><td>0,<\/td><td>13<\/td><td>&amp;<\/td><td>12<\/td><td>=<\/td><td>12<\/td><\/tr><tr><td class=\"h0\">0,<\/td><td class=\"h0\">0,<\/td><td>1,<\/td><td>1,<\/td><td>13<\/td><td>&gt;&gt;<\/td><td>2<\/td><td>=<\/td><td>3<\/td><\/tr><\/table><\/figure><pre class=\"\"><code>#include &lt;stdio.h&gt;\nint main(void)\n{\n    int n = 13, a = 5, b;\n    printf(&quot;%d %d %d %d\\n&quot;, n &amp; 12, n | 2, n ^ 1, n &gt;&gt; 2);\n    printf(&quot;%d\\n&quot;, 3 &lt;&lt; 1);          /* *2 */\n    a *= 2 + 10;                     /* a = a * (2 + 10) */\n    b = 2 * (a = 10);                /* une affectation a une valeur */\n    printf(&quot;a=%d b=%d\\n&quot;, a, b);\n    double y = 100, r;\n    r = (y &lt; 200) ? 3.14 : 25;\n    printf(&quot;%.2f\\n&quot;, r);\n    double p = 10, q = 3;\n    printf(&quot;%.1f %.4f\\n&quot;, (double)((int)p / (int)q), p / q);\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>12 15 12 3\n6\na=10 b=20\n3.14\n3.0 3.3333<\/code><\/pre><p>Conversions implicites : <code>char<\/code> et <code>short<\/code> deviennent <code>int<\/code> ; si un opérande est <code>double<\/code>, l&#39;autre devient <code>double<\/code>. Le <strong>cast<\/strong> <code>(type)<\/code> force une conversion.<\/p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Méthode pour évaluer : 1) remplace les variables par leur valeur ; 2) applique la priorité ; 3) note la valeur rendue ; 4) note les variables modifiées (<code>=<\/code>, <code>+=<\/code>, <code>++<\/code>).<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>TD 1 · Exercice IV (A=20, B=5, C=-10, D=2, X=12, Y=15, valeurs remises à chaque ligne)<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Évalue : (1) <code>(5*X)+2*((3*B)+4)<\/code> (2) <code>A == (B=5)<\/code> (3) <code>A += (X+5)<\/code> (4) <code>A != (C *= (-D))<\/code> (5) <code>A %= D++<\/code> (6) <code>(X++)*(A+C)<\/code> (7) <code>A&amp;&amp;B||!0&amp;&amp;C&amp;&amp;!D<\/code><\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>(1) 60 + 2×19 = <strong>98<\/strong>.\n(2) B reçoit 5 (inchangé), 20 == 5 → <strong>0<\/strong>.\n(3) A = 20 + 17 = <strong>37<\/strong>.\n(4) C devient −10 × −2 = 20 ; 20 != 20 → <strong>0<\/strong> ; C = 20.\n(5) D++ donne 2 puis D = 3 ; A = 20 % 2 = <strong>0<\/strong>.\n(6) X++ donne 12 puis X = 13 ; 12 × 10 = <strong>120<\/strong>.\n(7) <code>&amp;&amp;<\/code> d&#39;abord : (A&amp;&amp;B) = 1, donc <code>1 || ...<\/code> = <strong>1<\/strong>.\nLe programme du chapitre « TD et TP corrigés » vérifie les 14 expressions.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Division<\/h3><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Que vaut <code>c<\/code> après <code>double a = 10, b = 3, c; c = ((int)a) / ((int)b);<\/code> ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 3<\/b><\/p><p>Les deux opérandes sont convertis en int : division entière 10/3 = 3, puis 3 est rangé dans c (3.0).<\/p>\n<\/div><\/div><\/section><section class=\"exo\"><h3>Décalage<\/h3><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Que vaut <code>5 &lt;&lt; 3<\/code> ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 40<\/b><\/p><p>Décaler de 3 bits à gauche = multiplier par 2³ = 8 : 5 × 8 = 40.<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\"><code>int x = 14; (x / 4) * 4<\/code> vaut :<\/div><button class=\"opt\" data-o=\"0\">12<\/button><button class=\"opt\" data-o=\"1\">14<\/button><button class=\"opt\" data-o=\"2\">14.0<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Après <code>int n = 10, x; x = n++;<\/code> :<\/div><button class=\"opt\" data-o=\"0\">x=11, n=11<\/button><button class=\"opt\" data-o=\"1\">x=10, n=11<\/button><button class=\"opt\" data-o=\"2\">x=10, n=10<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Que vaut <code>!0<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">0<\/button><button class=\"opt\" data-o=\"1\">1<\/button><button class=\"opt\" data-o=\"2\">-1<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\"><code>A &amp;&amp; B || !0 &amp;&amp; C &amp;&amp; !D<\/code> avec A=20, B=5, C=-10, D=2 :<\/div><button class=\"opt\" data-o=\"0\">0<\/button><button class=\"opt\" data-o=\"1\">1<\/button><button class=\"opt\" data-o=\"2\">-10<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\"><code>a -= b -= c<\/code> équivaut à :<\/div><button class=\"opt\" data-o=\"0\"><code>(a -= b) -= c<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>a -= (b -= c)<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>a = a - b - c<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Que vaut <code>13 &amp; 12<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">13<\/button><button class=\"opt\" data-o=\"1\">12<\/button><button class=\"opt\" data-o=\"2\">1<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\"><code>int A = 20; A == (B = 5)<\/code> rend :<\/div><button class=\"opt\" data-o=\"0\">5<\/button><button class=\"opt\" data-o=\"1\">0<\/button><button class=\"opt\" data-o=\"2\">20<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\"><code>(y &lt; 200) ? 3.14 : 25<\/code> avec y = 100 vaut :<\/div><button class=\"opt\" data-o=\"0\">3.14<\/button><button class=\"opt\" data-o=\"1\">25<\/button><button class=\"opt\" data-o=\"2\">1<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Type de <code>i + f<\/code> avec i int et f float ?<\/div><button class=\"opt\" data-o=\"0\">int<\/button><button class=\"opt\" data-o=\"1\">float<\/button><button class=\"opt\" data-o=\"2\">char<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Que fait <code>if (a = 0)<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">Compare a à 0<\/button><button class=\"opt\" data-o=\"1\">Met 0 dans a et le test est toujours faux<\/button><button class=\"opt\" data-o=\"2\">Erreur de compilation<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"operateurs","rep":["3"],"tol":null},{"n":"operateurs","rep":null,"tol":null},{"n":"operateurs","rep":["3"],"tol":null},{"n":"operateurs","rep":["40"],"tol":null}],"qcm":[{"n":"operateurs","q":"<code>int x = 14; (x / 4) * 4<\/code> vaut :","o":["12","14","14.0"],"a":0,"e":"14/4 = 3 en division entière, puis 3×4 = 12."},{"n":"operateurs","q":"Après <code>int n = 10, x; x = n++;<\/code> :","o":["x=11, n=11","x=10, n=11","x=10, n=10"],"a":1,"e":"Post-incrément : la valeur 10 est utilisée, puis n devient 11."},{"n":"operateurs","q":"Que vaut <code>!0<\/code> ?","o":["0","1","-1"],"a":1,"e":"La négation de faux (0) est vrai, représenté par 1."},{"n":"operateurs","q":"<code>A &amp;&amp; B || !0 &amp;&amp; C &amp;&amp; !D<\/code> avec A=20, B=5, C=-10, D=2 :","o":["0","1","-10"],"a":1,"e":"<code>&amp;&amp;<\/code> avant <code>||<\/code> : (A&amp;&amp;B)=1, donc 1 || ... = 1."},{"n":"operateurs","q":"<code>a -= b -= c<\/code> équivaut à :","o":["<code>(a -= b) -= c<\/code>","<code>a -= (b -= c)<\/code>","<code>a = a - b - c<\/code>"],"a":1,"e":"Les affectations s&#39;évaluent de droite à gauche."},{"n":"operateurs","q":"Que vaut <code>13 &amp; 12<\/code> ?","o":["13","12","1"],"a":1,"e":"1101 &amp; 1100 = 1100 = 12."},{"n":"operateurs","q":"<code>int A = 20; A == (B = 5)<\/code> rend :","o":["5","0","20"],"a":1,"e":"B reçoit 5, puis 20 == 5 est faux : 0."},{"n":"operateurs","q":"<code>(y &lt; 200) ? 3.14 : 25<\/code> avec y = 100 vaut :","o":["3.14","25","1"],"a":0,"e":"Condition vraie : on prend la première valeur."},{"n":"operateurs","q":"Type de <code>i + f<\/code> avec i int et f float ?","o":["int","float","char"],"a":1,"e":"Conversion implicite de i vers float."},{"n":"operateurs","q":"Que fait <code>if (a = 0)<\/code> ?","o":["Compare a à 0","Met 0 dans a et le test est toujours faux","Erreur de compilation"],"a":1,"e":"<code>=<\/code> affecte ; la valeur de l&#39;affectation (0) est fausse."}]},{"id":"controle","t":"Tests et boucles (if, switch, while, do-while, for)","seance":"Chapitre 3 · Les structures de contrôle","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu dois savoir évaluer une condition (chapitre 2) : en C elle vaut 0 (faux) ou autre chose (vrai).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Avec note = 12, que vaut <code>note &gt;= 10 &amp;&amp; note &lt;= 20<\/code> ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1<\/b><\/p><p>Les deux comparaisons valent 1, et 1 &amp;&amp; 1 = 1.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Avant d&#39;écrire une boucle, réponds à trois questions : où je commence ? quand je continue ? comment j&#39;avance ? Ce sont les trois cases du <code>for<\/code>.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Le <code>;<\/code> collé derrière : <code>for (i = 0; i &lt; 5; i++);<\/code> ou <code>if (x &gt; 0);<\/code> ferme l&#39;instruction tout de suite. Le bloc qui suit s&#39;exécute une seule fois, sans condition.<\/p>\n<\/aside><p>À la fin, tu sais choisir entre <code>if<\/code>, <code>switch<\/code>, <code>while<\/code>, <code>do…while<\/code> et <code>for<\/code>, et tracer une boucle à la main.<\/p>\n<h2>Idée 1 · Instruction simple, bloc<\/h2>\n<p>Un <code>;<\/code> termine une instruction. Des <code>{ }<\/code> regroupent plusieurs instructions en <strong>un bloc<\/strong>, qui compte comme une seule. Sans accolades, <code>if<\/code>/<code>while<\/code>/<code>for<\/code> ne contrôlent <strong>qu&#39;une<\/strong> instruction.<\/p>\n<h2>Idée 2 · Choisir : if, else if, else<\/h2>\n<figure class=\"flux\"><figcaption>Note d'un module (TD 2, exercice II)<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">note &gt;= 10 et &lt;= 20 ?<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">« module validé »<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">sinon note &gt;= 5 ?<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">« rattrapage »<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">sinon<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">« non validé »<\/div><\/div><\/figure><pre class=\"\"><code>#include &lt;stdio.h&gt;\nvoid verdict(float note)\n{\n    if (note &lt; 0 || note &gt; 20)\n        printf(&quot;%.1f : note invalide\\n&quot;, note);\n    else if (note &gt;= 10)\n        printf(&quot;%.1f : module valide\\n&quot;, note);\n    else if (note &gt;= 5)\n        printf(&quot;%.1f : rattrapage du module\\n&quot;, note);\n    else\n        printf(&quot;%.1f : non valide\\n&quot;, note);\n}\nint main(void)\n{\n    verdict(14); verdict(7.5); verdict(3); verdict(25);\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>14.0 : module valide\n7.5 : rattrapage du module\n3.0 : non valide\n25.0 : note invalide<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Dans le cours, le schéma <code>if … else if … else<\/code> place mal les accolades (<code>{ instruction; else if …<\/code> puis <code>}}<\/code> à la fin). Chaque bloc doit être fermé <strong>avant<\/strong> le <code>else<\/code> : <code>if (c1) { … } else if (c2) { … } else { … }<\/code>.<\/p>\n<\/aside><h2>Idée 3 · switch : plusieurs valeurs constantes<\/h2>\n<pre class=\"\"><code>#include &lt;stdio.h&gt;\nint main(void)\n{\n    int a, b;\n    for (a = 1; a &lt;= 5; a++) {\n        switch (a) {\n            case 1:\n            case 2:\n            case 3: b = 100; break;\n            case 4: b = 200; break;\n            default: b = 0; break;\n        }\n        printf(&quot;a=%d -&gt; b=%d\\n&quot;, a, b);\n    }\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>a=1 -&gt; b=100\na=2 -&gt; b=100\na=3 -&gt; b=100\na=4 -&gt; b=200\na=5 -&gt; b=0<\/code><\/pre><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Sans <code>break<\/code>, l&#39;exécution <strong>continue dans le case suivant<\/strong>. C&#39;est voulu pour 1, 2, 3 ci-dessus, mais c&#39;est souvent un oubli. <code>case<\/code> n&#39;accepte que des constantes entières (ou caractères), pas d&#39;intervalle.<\/p>\n<\/aside><h2>Idée 4 · Les trois boucles<\/h2>\n<svg viewBox=\"0 0 620 200\" role=\"img\" aria-label=\"while teste avant d'exécuter, do-while exécute avant de tester\" style=\"max-width:620px;width:100%\">\n<g font-family=\"sans-serif\" font-size=\"14\" fill=\"currentColor\" stroke=\"currentColor\">\n<text x=\"80\" y=\"20\" stroke=\"none\" font-weight=\"bold\">while<\/text>\n<rect x=\"30\" y=\"35\" width=\"150\" height=\"40\" rx=\"6\" fill=\"none\" stroke=\"#D9824F\"/>\n<text x=\"55\" y=\"60\" stroke=\"none\">condition ?<\/text>\n<rect x=\"30\" y=\"115\" width=\"150\" height=\"40\" rx=\"6\" fill=\"none\"/>\n<text x=\"75\" y=\"140\" stroke=\"none\">corps<\/text>\n<line x1=\"105\" y1=\"75\" x2=\"105\" y2=\"115\"/><text x=\"112\" y=\"100\" stroke=\"none\">vrai<\/text>\n<path d=\"M30 135 H10 V55 H30\" fill=\"none\"/>\n<line x1=\"180\" y1=\"55\" x2=\"240\" y2=\"55\"/><text x=\"190\" y=\"48\" stroke=\"none\">faux → sortie<\/text>\n<text x=\"420\" y=\"20\" stroke=\"none\" font-weight=\"bold\">do … while<\/text>\n<rect x=\"370\" y=\"35\" width=\"150\" height=\"40\" rx=\"6\" fill=\"none\"/>\n<text x=\"415\" y=\"60\" stroke=\"none\">corps<\/text>\n<rect x=\"370\" y=\"115\" width=\"150\" height=\"40\" rx=\"6\" fill=\"none\" stroke=\"#D9824F\"/>\n<text x=\"395\" y=\"140\" stroke=\"none\">condition ?<\/text>\n<line x1=\"445\" y1=\"75\" x2=\"445\" y2=\"115\"/>\n<path d=\"M370 135 H350 V55 H370\" fill=\"none\"/><text x=\"300\" y=\"100\" stroke=\"none\">vrai<\/text>\n<line x1=\"520\" y1=\"135\" x2=\"600\" y2=\"135\"/><text x=\"530\" y=\"175\" stroke=\"none\">faux → sortie<\/text>\n<text x=\"350\" y=\"195\" stroke=\"none\">le corps s'exécute au moins une fois<\/text>\n<\/g><\/svg><p><code>for (expr1; expr2; expr3) corps;<\/code> est la même chose que <code>expr1; while (expr2) { corps; expr3; }<\/code>. Chaque expression peut manquer, mais les <code>;<\/code> restent : <code>for (;;)<\/code> est une boucle infinie.<\/p>\n<pre class=\"\"><code>#include &lt;stdio.h&gt;\nint main(void)\n{\n    int n, i;\n    float S = 0;\n    n = 5;                       /* TD 2 ex. IV : somme des 1/i^2 */\n    for (i = 1; i &lt;= n; i++)\n        S = S + 1.0 / (i * i);\n    printf(&quot;S5 = %f\\n&quot;, S);\n\n    int k = 0;                   /* do-while : au moins un passage */\n    do { k++; } while (k &lt; 0);\n    printf(&quot;k = %d\\n&quot;, k);\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>S5 = 1.463611\nk = 1<\/code><\/pre><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Écrire <code>1 / (i * i)<\/code> donne <strong>0<\/strong> dès i = 2 (division entière). Il faut <code>1.0 / (i * i)<\/code> ou un cast.<\/p>\n<\/aside><h2>Idée 5 · break et continue<\/h2>\n<p><code>break<\/code> quitte la boucle (ou le <code>switch<\/code>). <code>continue<\/code> passe directement au tour suivant (dans un <code>for<\/code>, <code>expr3<\/code> est quand même exécutée).<\/p>\n<pre class=\"\"><code>#include &lt;stdio.h&gt;\nint main(void)\n{\n    int i;\n    for (i = 1; i &lt;= 10; i++) {\n        if (i % 2 == 0) continue;   /* saute les pairs */\n        if (i &gt; 7) break;           /* arrête après 7 */\n        printf(&quot;%d &quot;, i);\n    }\n    printf(&quot;\\n&quot;);\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>1 3 5 7 <\/code><\/pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Nombre de tours connu → <code>for<\/code>. Condition testée avant → <code>while<\/code>. Saisie à contrôler (au moins une fois) → <code>do … while<\/code>.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>TD 2 · Exercice I (signe d&#39;un produit)<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Écris le test qui affiche le signe de A<em>B <strong>sans calculer<\/strong> A<\/em>B.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>if (A == 0 || B == 0) printf(&quot;produit nul&quot;);<\/code> puis <code>else if ((A &gt; 0) == (B &gt; 0)) printf(&quot;positif&quot;);<\/code> puis <code>else printf(&quot;negatif&quot;);<\/code>.\nMême signe → positif, signes différents → négatif. Le cas nul se traite en premier.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>TD 2 · Exercice V (saisie contrôlée)<\/h3><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Écris la boucle qui redemande un nombre entre 10 et 20 en affichant « Plus petit ! » ou « Plus grand ! ».<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>do { printf(&quot;Nombre : &quot;); scanf(&quot;%d&quot;, &amp;N); if (N &gt; 20) printf(&quot;Plus petit !\\n&quot;); else if (N &lt; 10) printf(&quot;Plus grand !\\n&quot;); } while (N &lt; 10 || N &gt; 20);<\/code>\n<code>do … while<\/code> car il faut lire au moins une fois.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Tracer un for<\/h3><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Combien de fois s&#39;exécute le corps de <code>for (i = 3; i &lt; 10; i += 2)<\/code> ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 4<\/b><\/p><p>i prend 3, 5, 7, 9 : 4 tours.<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 7 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quelle boucle exécute son corps au moins une fois ?<\/div><button class=\"opt\" data-o=\"0\">while<\/button><button class=\"opt\" data-o=\"1\">do … while<\/button><button class=\"opt\" data-o=\"2\">for<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\"><code>for (i = 0; i &lt; 5; i++)<\/code> : combien de tours ?<\/div><button class=\"opt\" data-o=\"0\">4<\/button><button class=\"opt\" data-o=\"1\">5<\/button><button class=\"opt\" data-o=\"2\">6<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Dans un switch, si on oublie <code>break<\/code> :<\/div><button class=\"opt\" data-o=\"0\">Erreur de compilation<\/button><button class=\"opt\" data-o=\"1\">On exécute aussi les cases suivants<\/button><button class=\"opt\" data-o=\"2\">On sort du switch<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Que vaut S après <code>float S=0; for(i=1;i&lt;=3;i++) S += 1/(i*i);<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">1.361<\/button><button class=\"opt\" data-o=\"1\">1.0<\/button><button class=\"opt\" data-o=\"2\">0<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\"><code>continue<\/code> dans une boucle :<\/div><button class=\"opt\" data-o=\"0\">Quitte la boucle<\/button><button class=\"opt\" data-o=\"1\">Passe au tour suivant<\/button><button class=\"opt\" data-o=\"2\">Recommence la boucle depuis le début<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\"><code>for (;;)<\/code> est :<\/div><button class=\"opt\" data-o=\"0\">Une boucle infinie<\/button><button class=\"opt\" data-o=\"1\">Une erreur de syntaxe<\/button><button class=\"opt\" data-o=\"2\">Une boucle qui ne s&#39;exécute pas<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Pour une saisie à vérifier (redemander tant qu&#39;elle est fausse), on préfère :<\/div><button class=\"opt\" data-o=\"0\">for<\/button><button class=\"opt\" data-o=\"1\">do … while<\/button><button class=\"opt\" data-o=\"2\">switch<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\"><code>if (n &gt; 0) a = 1; b = 2;<\/code> : b = 2 est exécuté…<\/div><button class=\"opt\" data-o=\"0\">Seulement si n &gt; 0<\/button><button class=\"opt\" data-o=\"1\">Toujours<\/button><button class=\"opt\" data-o=\"2\">Jamais<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\"><code>switch<\/code> peut tester :<\/div><button class=\"opt\" data-o=\"0\">Un intervalle comme 10..20<\/button><button class=\"opt\" data-o=\"1\">Des valeurs constantes entières ou caractères<\/button><button class=\"opt\" data-o=\"2\">Des chaînes de caractères<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Que contient l&#39;expression 2 de <code>for(e1; e2; e3)<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">L&#39;initialisation<\/button><button class=\"opt\" data-o=\"1\">La condition de continuation<\/button><button class=\"opt\" data-o=\"2\">L&#39;incrémentation<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"controle","rep":["1"],"tol":null},{"n":"controle","rep":null,"tol":null},{"n":"controle","rep":null,"tol":null},{"n":"controle","rep":["4"],"tol":null}],"qcm":[{"n":"controle","q":"Quelle boucle exécute son corps au moins une fois ?","o":["while","do … while","for"],"a":1,"e":"Le test est placé après le corps."},{"n":"controle","q":"<code>for (i = 0; i &lt; 5; i++)<\/code> : combien de tours ?","o":["4","5","6"],"a":1,"e":"i = 0, 1, 2, 3, 4."},{"n":"controle","q":"Dans un switch, si on oublie <code>break<\/code> :","o":["Erreur de compilation","On exécute aussi les cases suivants","On sort du switch"],"a":1,"e":"C&#39;est le « fall-through »."},{"n":"controle","q":"Que vaut S après <code>float S=0; for(i=1;i&lt;=3;i++) S += 1/(i*i);<\/code> ?","o":["1.361","1.0","0"],"a":1,"e":"1/(1)=1 puis 1/4 et 1/9 valent 0 en division entière."},{"n":"controle","q":"<code>continue<\/code> dans une boucle :","o":["Quitte la boucle","Passe au tour suivant","Recommence la boucle depuis le début"],"a":1,"e":"<code>break<\/code> quitte, <code>continue<\/code> saute au tour suivant."},{"n":"controle","q":"<code>for (;;)<\/code> est :","o":["Une boucle infinie","Une erreur de syntaxe","Une boucle qui ne s&#39;exécute pas"],"a":0,"e":"Une condition absente est considérée comme vraie."},{"n":"controle","q":"Pour une saisie à vérifier (redemander tant qu&#39;elle est fausse), on préfère :","o":["for","do … while","switch"],"a":1,"e":"Il faut lire au moins une fois avant de tester."},{"n":"controle","q":"<code>if (n &gt; 0) a = 1; b = 2;<\/code> : b = 2 est exécuté…","o":["Seulement si n &gt; 0","Toujours","Jamais"],"a":1,"e":"Sans accolades, le if ne contrôle qu&#39;une instruction."},{"n":"controle","q":"<code>switch<\/code> peut tester :","o":["Un intervalle comme 10..20","Des valeurs constantes entières ou caractères","Des chaînes de caractères"],"a":1,"e":"<code>case<\/code> n&#39;accepte que des constantes entières."},{"n":"controle","q":"Que contient l&#39;expression 2 de <code>for(e1; e2; e3)<\/code> ?","o":["L&#39;initialisation","La condition de continuation","L&#39;incrémentation"],"a":1,"e":"e2 est testée avant chaque tour ; c&#39;est une condition de répétition, pas d&#39;arrêt."}]},{"id":"entrees-sorties","t":"Lire et écrire (printf, scanf, getchar, putchar)","seance":"Chapitre 4 · Lecture et écriture des données","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu dois connaître les types (<code>int<\/code>, <code>long<\/code>, <code>float<\/code>, <code>double<\/code>, <code>char<\/code>) et leurs formats <code>%d<\/code>, <code>%f<\/code>, <code>%c<\/code> (chapitre 1).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Quel format pour afficher un <code>long<\/code> ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : %ld<\/b><\/p><p><code>%ld<\/code> (ou <code>%li<\/code>). Avec <code>%d<\/code> la valeur peut être tronquée.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>printf et scanf sont symétriques : printf reçoit des <strong>valeurs<\/strong>, scanf reçoit des <strong>adresses<\/strong> (<code>&amp;x<\/code>). Un spécificateur <code>%<\/code> par variable, dans l&#39;ordre.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p><code>scanf(&quot;%d&quot;, x);<\/code> sans <code>&amp;<\/code> compile (avec un avertissement) puis plante ou écrit n&#39;importe où. Et pour un <code>double<\/code>, scanf veut <code>%lf<\/code>, pas <code>%f<\/code>.<\/p>\n<\/aside><p>À la fin, tu sais prévoir exactement ce qu&#39;affiche un printf avec largeur et précision, et lire des données au clavier sans piège.<\/p>\n<h2>Idée 1 · printf : format + expressions<\/h2>\n<p><code>printf(&quot;&lt;format&gt;&quot;, expr1, expr2, …);<\/code> Le format contient du texte, des séquences <code>\\n<\/code>, <code>\\t<\/code>, et un spécificateur par expression.<\/p>\n<pre class=\"\"><code>#include &lt;stdio.h&gt;\nint main(void)\n{\n    int A = 234, B = 67;\n    printf(&quot;%i fois %i est %li\\n&quot;, A, B, (long)A * B);\n    char C = 'A';\n    printf(&quot;Le caractere %c a le code %i !\\n&quot;, C, C);\n    printf(&quot;%o %x %X %e\\n&quot;, 255, 255, 255, 1234.5);\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>234 fois 67 est 15678\nLe caractere A a le code 65 !\n377 ff FF 1.234500e+03<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le cours annonce « 234 fois 67 est 615678 ». C&#39;est faux : 234 × 67 = <strong>15 678<\/strong>, comme le montre l&#39;exécution.<\/p>\n<\/aside><figure class=\"grille\"><figcaption>Spécificateurs de printf<\/figcaption><table><tr><th>Format,<\/th><th>Type<\/th><th>attendu,<\/th><th>Affiche<\/th><\/tr><tr><td class=\"h1\">%d<\/td><td>/<\/td><td>%i,<\/td><td>int,<\/td><td>entier<\/td><td>signé<\/td><\/tr><tr><td>%u,<\/td><td>unsigned,<\/td><td>entier<\/td><td>≥<\/td><td>0<\/td><\/tr><tr><td>%o<\/td><td>/<\/td><td>%x,<\/td><td>int,<\/td><td>octal<\/td><td>/<\/td><td>hexadécimal<\/td><\/tr><tr><td class=\"h1\">%ld,<\/td><td>long,<\/td><td>entier<\/td><td>long<\/td><\/tr><tr><td class=\"h1\">%f,<\/td><td>double<\/td><td>(float<\/td><td>promu),<\/td><td>6<\/td><td>décimales<\/td><\/tr><tr><td>%e,<\/td><td>double,<\/td><td>notation<\/td><td>scientifique<\/td><\/tr><tr><td>%Lf,<\/td><td>long<\/td><td>double,<\/td><td>réel<\/td><td>long<\/td><\/tr><tr><td class=\"h1\">%c,<\/td><td>char/int,<\/td><td>un<\/td><td>caractère<\/td><\/tr><tr><td class=\"h1\">%s,<\/td><td>char<\/td><td class=\"h1\">,<\/td><td>une<\/td><td>chaîne<\/td><\/tr><\/table><\/figure><h2>Idée 2 · Largeur et précision<\/h2>\n<p><code>%Wd<\/code> réserve W colonnes (aligné à droite). <code>%W.Pf<\/code> : W colonnes au total, P décimales, arrondi.<\/p>\n<pre class=\"\"><code>#include &lt;stdio.h&gt;\nint main(void)\n{\n    printf(&quot;[%4d][%4d][%4d][%4u][%4X][%4x]\\n&quot;, 123, 1234, 12345, 0, 123, 123);\n    printf(&quot;[%f][%12f][%.2f][%5.0f][%10.3f][%.4f]\\n&quot;,\n           100.123, 100.123, 100.123, 100.123, 100.123, 1.23456);\n    printf(&quot;[%-6d]\\n&quot;, 42);\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>[ 123][1234][12345][   0][  7B][  7b]\n[100.123000][  100.123000][100.12][  100][   100.123][1.2346]\n[42    ]<\/code><\/pre><p>Si la valeur est plus large que W, elle est affichée en entier (12345 sur <code>%4d<\/code>). Le <code>-<\/code> aligne à gauche (ajout hors cours).<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Lire %10.3f appliqué à 100.123<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Précision<\/div><p>.3 → 3 décimales : 100.123<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Longueur<\/div><p>« 100.123 » fait 7 caractères<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Largeur<\/div><p>10 colonnes → 3 espaces devant<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Résultat<\/div><p>«   100.123 »<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Idée 3 · scanf : lire à une adresse<\/h2>\n<p><code>scanf(&quot;&lt;format&gt;&quot;, &amp;var1, &amp;var2, …);<\/code> Il renvoie le <strong>nombre<\/strong> de valeurs lues correctement.<\/p>\n<figure class=\"grille\"><figcaption>Formats de lecture<\/figcaption><table><tr><th>Variable,<\/th><th>Format<\/th><th>scanf<\/th><\/tr><tr><td>int,<\/td><td>%d<\/td><\/tr><tr><td>long,<\/td><td>%ld<\/td><\/tr><tr><td class=\"h1\">float,<\/td><td>%f<\/td><\/tr><tr><td class=\"h1\">double,<\/td><td>%lf<\/td><\/tr><tr><td>char,<\/td><td>%c<\/td><\/tr><tr><td>chaîne<\/td><td>(char<\/td><td>t[]),<\/td><td>%s<\/td><td>sans<\/td><td>&amp;<\/td><\/tr><\/table><\/figure><ul>\n<li>Les espaces, tabulations et retours à la ligne se valent comme séparateurs : « 12 4 1980 » ou sur trois lignes, c&#39;est pareil.<\/li>\n<li><code>scanf(&quot;%4d %2d&quot;, &amp;A, &amp;B);<\/code> avec 1234567 → A = 1234, B = 56 ; le 7 reste pour la lecture suivante.<\/li>\n<li><code>scanf(&quot;%d/%d/%d&quot;, &amp;J, &amp;M, &amp;A);<\/code> exige les <code>/<\/code> : « 17/7/1974 » marche, « 17 7 1974 » ne lit que J (renvoie 1).<\/li>\n<\/ul>\n<pre class=\"\"><code>int JOUR, MOIS, ANNEE, RECU;\nRECU = scanf(&quot;%i %i %i&quot;, &amp;JOUR, &amp;MOIS, &amp;ANNEE);\n/* tape « 17 7 1974 »  -&gt; RECU = 3\n   tape « 17/7/1974 »  -&gt; RECU = 1 (seul JOUR est lu) */<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le tableau des formats de scanf du cours donne <code>%b<\/code> pour l&#39;hexadécimal : c&#39;est <code>%x<\/code>. Et pour 17 7 19.74 le cours indique MOIS = 4 : avec « 17 7 19.74 » on obtient JOUR = 17, MOIS = 7, ANNEE = 19 (le « .74 » reste dans le tampon).<\/p>\n<\/aside><h2>Idée 4 · getchar et putchar<\/h2>\n<p><code>getchar()<\/code> lit <strong>un<\/strong> caractère (après Entrée) et renvoie un <code>int<\/code> ; à la fin du fichier, elle renvoie <code>EOF<\/code> (−1). <code>putchar(c)<\/code> écrit un caractère.<\/p>\n<pre class=\"\"><code>#include &lt;stdio.h&gt;\nint main(void)\n{\n    int c;                       /* int, pas char : pour reconnaître EOF */\n    while ((c = getchar()) != EOF)\n        putchar(c);\n    putchar('O'); putchar('K'); putchar('\\n');\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>OK<\/code><\/pre><p>(Ici l&#39;entrée est vide : la boucle s&#39;arrête tout de suite sur EOF.)<\/p>\n<aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>Le cours insiste : la variable qui reçoit <code>getchar()<\/code> doit être un <code>int<\/code>. Avec un <code>char<\/code> non signé, <code>c != EOF<\/code> est toujours vrai (boucle infinie) ; avec un <code>char<\/code> signé, le caractère de code 255 est pris pour une fin de fichier.<\/p>\n<\/aside><p><code>getch()<\/code> (<code>&lt;conio.h&gt;<\/code>) lit sans attendre Entrée mais n&#39;est pas standard (Windows/DOS uniquement).<\/p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>printf : valeurs. scanf : adresses (<code>&amp;<\/code>). <code>double<\/code> → <code>%lf<\/code> en lecture. getchar → <code>int<\/code>.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Prévoir un affichage<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Qu&#39;affiche <code>printf(&quot;[%6.2f]&quot;, 3.14159);<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>[  3.14]<\/code> : 2 décimales → « 3.14 » (4 caractères), complété à 6 colonnes par 2 espaces.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>scanf avec largeur<\/h3><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p><code>scanf(&quot;%4d %2d&quot;, &amp;A, &amp;B);<\/code> et on tape 1234567. Que vaut B ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 56<\/b><\/p><p>A prend les 4 premiers chiffres (1234), B les 2 suivants (56), 7 reste dans le tampon.<\/p>\n<\/div><\/div><\/section><section class=\"exo\"><h3>TD 2 · Exercice III (majuscule → minuscule)<\/h3><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Lis un caractère ; si c&#39;est une majuscule, affiche-la en minuscule, sinon un message d&#39;erreur.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>int c = getchar(); if (c &gt;= &#39;A&#39; &amp;&amp; c &lt;= &#39;Z&#39;) printf(&quot;%c\\n&quot;, c + 32); else printf(&quot;Erreur\\n&quot;);<\/code>\n&#39;a&#39; − &#39;A&#39; = 97 − 65 = 32. On peut écrire <code>c - &#39;A&#39; + &#39;a&#39;<\/code>, plus lisible, ou <code>tolower(c)<\/code> de <code>&lt;ctype.h&gt;<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 7 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Qu&#39;affiche <code>printf(&quot;%4d&quot;, 12345);<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">1234<\/button><button class=\"opt\" data-o=\"1\">12345<\/button><button class=\"opt\" data-o=\"2\">2345<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Qu&#39;affiche <code>printf(&quot;%.2f&quot;, 100.123);<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">100.12<\/button><button class=\"opt\" data-o=\"1\">100.123000<\/button><button class=\"opt\" data-o=\"2\">100.1<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Pour lire un double, on écrit :<\/div><button class=\"opt\" data-o=\"0\"><code>scanf(&quot;%f&quot;, &amp;x);<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>scanf(&quot;%lf&quot;, &amp;x);<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>scanf(&quot;%d&quot;, x);<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Que renvoie <code>scanf(&quot;%d %d&quot;, &amp;a, &amp;b)<\/code> si on tape « 5 x » ?<\/div><button class=\"opt\" data-o=\"0\">2<\/button><button class=\"opt\" data-o=\"1\">1<\/button><button class=\"opt\" data-o=\"2\">0<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\"><code>printf(&quot;%x&quot;, 255)<\/code> affiche :<\/div><button class=\"opt\" data-o=\"0\">377<\/button><button class=\"opt\" data-o=\"1\">ff<\/button><button class=\"opt\" data-o=\"2\">FF<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Pourquoi <code>&amp;<\/code> devant une variable dans scanf ?<\/div><button class=\"opt\" data-o=\"0\">Pour l&#39;afficher<\/button><button class=\"opt\" data-o=\"1\">scanf a besoin de son adresse pour y écrire<\/button><button class=\"opt\" data-o=\"2\">C&#39;est facultatif<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Quel type de retour a getchar() ?<\/div><button class=\"opt\" data-o=\"0\">char<\/button><button class=\"opt\" data-o=\"1\">int<\/button><button class=\"opt\" data-o=\"2\">void<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\"><code>printf(&quot;%c&quot;, 66)<\/code> affiche :<\/div><button class=\"opt\" data-o=\"0\">66<\/button><button class=\"opt\" data-o=\"1\">B<\/button><button class=\"opt\" data-o=\"2\">b<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\"><code>printf(&quot;[%5.0f]&quot;, 100.123)<\/code> affiche :<\/div><button class=\"opt\" data-o=\"0\">[  100]<\/button><button class=\"opt\" data-o=\"1\">[100]<\/button><button class=\"opt\" data-o=\"2\">[100.1]<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">234 × 67 calculé par <code>printf(&quot;%li&quot;, (long)234*67)<\/code> affiche :<\/div><button class=\"opt\" data-o=\"0\">615678<\/button><button class=\"opt\" data-o=\"1\">15678<\/button><button class=\"opt\" data-o=\"2\">1567<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"entrees-sorties","rep":["%ld"],"tol":null},{"n":"entrees-sorties","rep":null,"tol":null},{"n":"entrees-sorties","rep":["56"],"tol":null},{"n":"entrees-sorties","rep":null,"tol":null}],"qcm":[{"n":"entrees-sorties","q":"Qu&#39;affiche <code>printf(&quot;%4d&quot;, 12345);<\/code> ?","o":["1234","12345","2345"],"a":1,"e":"La largeur est un minimum : rien n&#39;est coupé."},{"n":"entrees-sorties","q":"Qu&#39;affiche <code>printf(&quot;%.2f&quot;, 100.123);<\/code> ?","o":["100.12","100.123000","100.1"],"a":0,"e":"Deux décimales, arrondi."},{"n":"entrees-sorties","q":"Pour lire un double, on écrit :","o":["<code>scanf(&quot;%f&quot;, &amp;x);<\/code>","<code>scanf(&quot;%lf&quot;, &amp;x);<\/code>","<code>scanf(&quot;%d&quot;, x);<\/code>"],"a":1,"e":"En lecture, double ↔ %lf."},{"n":"entrees-sorties","q":"Que renvoie <code>scanf(&quot;%d %d&quot;, &amp;a, &amp;b)<\/code> si on tape « 5 x » ?","o":["2","1","0"],"a":1,"e":"Seul a est lu correctement."},{"n":"entrees-sorties","q":"<code>printf(&quot;%x&quot;, 255)<\/code> affiche :","o":["377","ff","FF"],"a":1,"e":"%x : hexadécimal en minuscules."},{"n":"entrees-sorties","q":"Pourquoi <code>&amp;<\/code> devant une variable dans scanf ?","o":["Pour l&#39;afficher","scanf a besoin de son adresse pour y écrire","C&#39;est facultatif"],"a":1,"e":"Le passage se fait par valeur : seule l&#39;adresse permet de modifier la variable."},{"n":"entrees-sorties","q":"Quel type de retour a getchar() ?","o":["char","int","void"],"a":1,"e":"int, pour pouvoir renvoyer EOF."},{"n":"entrees-sorties","q":"<code>printf(&quot;%c&quot;, 66)<\/code> affiche :","o":["66","B","b"],"a":1,"e":"66 est le code ASCII de &#39;B&#39;."},{"n":"entrees-sorties","q":"<code>printf(&quot;[%5.0f]&quot;, 100.123)<\/code> affiche :","o":["[  100]","[100]","[100.1]"],"a":0,"e":"0 décimale → « 100 », complété à 5 colonnes."},{"n":"entrees-sorties","q":"234 × 67 calculé par <code>printf(&quot;%li&quot;, (long)234*67)<\/code> affiche :","o":["615678","15678","1567"],"a":1,"e":"Le cours se trompe (615678) ; le bon produit est 15678."}]},{"id":"fonctions","t":"Fonctions, portée et classes de variables","seance":"Chapitre 5 · La programmation modulaire et les fonctions","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu dois savoir écrire un <code>main<\/code> avec des boucles et des tests (chapitres 1 à 3). Une fonction est un « petit main » qu&#39;on appelle par son nom.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>En maths, f(x) = x² + 3x + 5. Que vaut f(1.5) ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 11.75<\/b><\/p><p>2.25 + 4.5 + 5 = 11.75. C&#39;est exactement la fonction <code>fct<\/code> du cours avec b = 3, c = 5.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Une fonction est une boîte noire : des <strong>arguments<\/strong> entrent (par copie), une <strong>valeur<\/strong> sort par <code>return<\/code>. Tout ce qui est déclaré dedans meurt à la sortie (sauf <code>static<\/code>).<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Croire qu&#39;une fonction peut modifier la variable qu&#39;on lui passe. En C, le passage est <strong>toujours par valeur<\/strong> : <code>echange(n, p)<\/code> ne change ni n ni p. Il faudra des pointeurs (chapitre 7).<\/p>\n<\/aside><p>À la fin, tu sais définir, déclarer (prototype) et appeler une fonction, et prévoir la valeur d&#39;une variable globale, locale ou statique.<\/p>\n<h2>Idée 1 · En-tête, corps, return, prototype<\/h2>\n<svg viewBox=\"0 0 620 150\" role=\"img\" aria-label=\"Décomposition de l'en-tête float fct(float x, int b, int c)\" style=\"max-width:620px;width:100%\">\n<g font-family=\"monospace\" font-size=\"20\" fill=\"currentColor\">\n<text x=\"20\" y=\"50\"><tspan fill=\"#D9824F\">float<\/tspan> fct (<tspan fill=\"#D9824F\">float x, int b, int c<\/tspan>)<\/text>\n<\/g>\n<g font-family=\"sans-serif\" font-size=\"14\" fill=\"currentColor\" stroke=\"currentColor\">\n<line x1=\"45\" y1=\"60\" x2=\"45\" y2=\"95\"/><text x=\"10\" y=\"115\" stroke=\"none\">type du résultat<\/text>\n<line x1=\"105\" y1=\"60\" x2=\"105\" y2=\"135\"/><text x=\"112\" y=\"140\" stroke=\"none\">nom<\/text>\n<line x1=\"320\" y1=\"60\" x2=\"320\" y2=\"95\"/><text x=\"220\" y=\"115\" stroke=\"none\">arguments muets (type + nom)<\/text>\n<\/g><\/svg><pre class=\"\"><code>#include &lt;stdio.h&gt;\nfloat fct(float, int, int);          /* prototype (déclaration) */\nint main(void)\n{\n    float x = 1.5, y, z;\n    int n = 3, p = 5, q = 10;\n    y = fct(x, n, p);                 /* arguments effectifs */\n    printf(&quot;valeur de y : %e\\n&quot;, y);\n    z = fct(x + 0.5, q, n - 1);\n    printf(&quot;valeur de z : %e\\n&quot;, z);\n    return 0;\n}\nfloat fct(float x, int b, int c)      /* définition */\n{\n    return x * x + b * x + c;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>valeur de y : 1.175000e+01\nvaleur de z : 2.600000e+01<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Dans le cours, le prototype s&#39;appelle <code>fct<\/code> mais les appels utilisent <code>fexple(...)<\/code> : erreur de nom (ça ne compile pas). Il faut le même nom partout. De même, la fonction <code>absom(double u, double v)<\/code> calcule <code>s = a + b<\/code> : il faut <code>s = u + v<\/code>.<\/p>\n<\/aside><ul>\n<li><strong>Arguments muets<\/strong> (formels) : <code>x, b, c<\/code> dans l&#39;en-tête. <strong>Arguments effectifs<\/strong> : les valeurs passées à l&#39;appel (<code>x + 0.5, q, n - 1<\/code>), n&#39;importe quelle expression.<\/li>\n<li><code>return<\/code> donne le résultat <strong>et<\/strong> arrête la fonction. Il peut y en avoir plusieurs.<\/li>\n<li><code>void f(int n)<\/code> : pas de résultat. <code>float tirage(void)<\/code> : pas d&#39;argument.<\/li>\n<li>Le <strong>prototype<\/strong> (en-tête + <code>;<\/code>) placé avant <code>main<\/code> permet au compilateur de vérifier les types et de convertir les arguments. Sans <code>#include &lt;math.h&gt;<\/code>, <code>sqrt<\/code> serait supposée renvoyer un <code>int<\/code> : résultat faux.<\/li>\n<\/ul>\n<h2>Idée 2 · Passage par valeur<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Ce qui se passe dans echange(n, p)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Avant l&#39;appel<\/div><p>n = 10, p = 20 dans main.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Appel<\/div><p>a reçoit une <strong>copie<\/strong> de n (10), b une copie de p (20).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Dans echange<\/div><p>a et b sont permutés : a = 20, b = 10.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Retour<\/div><p>les copies a, b disparaissent. n et p n&#39;ont jamais bougé : 10 et 20.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><pre class=\"\"><code>#include &lt;stdio.h&gt;\nvoid echange(int a, int b)\n{\n    int c;\n    printf(&quot;debut echange : %d %d\\n&quot;, a, b);\n    c = a; a = b; b = c;\n    printf(&quot;fin echange : %d %d\\n&quot;, a, b);\n}\nint main(void)\n{\n    int n = 10, p = 20;\n    printf(&quot;avant appel : %d %d\\n&quot;, n, p);\n    echange(n, p);\n    printf(&quot;apres appel : %d %d\\n&quot;, n, p);\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>avant appel : 10 20\ndebut echange : 10 20\nfin echange : 20 10\napres appel : 10 20<\/code><\/pre><aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>Deux remèdes selon le cours : passer l&#39;<strong>adresse<\/strong> (comme <code>scanf(&amp;x)<\/code>, chapitre 7) ou utiliser une <strong>variable globale<\/strong> (à réserver aux cas exceptionnels : effets de bord).<\/p>\n<\/aside><h2>Idée 3 · Globale, locale, statique<\/h2>\n<figure class=\"grille\"><figcaption>Les trois sortes de variables<\/figcaption><table><tr><th>Sorte,<\/th><th>Déclarée,<\/th><th>Portée,<\/th><th>Durée<\/th><th>de<\/th><th>vie,<\/th><th>Valeur<\/th><th>initiale<\/th><\/tr><tr><td class=\"h1\">globale,<\/td><td>hors<\/td><td>de<\/td><td>toute<\/td><td>fonction,<\/td><td>du<\/td><td>point<\/td><td>de<\/td><td>déclaration<\/td><td>à<\/td><td>la<\/td><td>fin<\/td><td>du<\/td><td>fichier,<\/td><td>tout<\/td><td>le<\/td><td>programme,<\/td><td>0<\/td><\/tr><tr><td>locale<\/td><td>(auto),<\/td><td>dans<\/td><td>une<\/td><td>fonction,<\/td><td>la<\/td><td>fonction,<\/td><td>un<\/td><td>appel,<\/td><td>indéterminée<\/td><\/tr><tr><td class=\"h1\">locale<\/td><td>static,<\/td><td>dans<\/td><td>une<\/td><td>fonction<\/td><td>avec<\/td><td>static,<\/td><td>la<\/td><td>fonction,<\/td><td>tout<\/td><td>le<\/td><td>programme,<\/td><td>0<\/td><\/tr><\/table><\/figure><pre class=\"\"><code>#include &lt;stdio.h&gt;\nint i;                         /* globale : initialisée à 0 */\nvoid opt(void) { printf(&quot;il fait beau %d fois\\n&quot;, i); }\nvoid fct(void)\n{\n    static int k;              /* garde sa valeur entre deux appels */\n    k++;\n    printf(&quot;call number : %d\\n&quot;, k);\n}\nint main(void)\n{\n    for (i = 1; i &lt;= 3; i++) opt();\n    int n;\n    for (n = 1; n &lt;= 3; n++) fct();\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>il fait beau 1 fois\nil fait beau 2 fois\nil fait beau 3 fois\ncall number : 1\ncall number : 2\ncall number : 3<\/code><\/pre><p>Une locale qui porte le même nom qu&#39;une globale la <strong>masque<\/strong> dans sa fonction. Une variable <code>static<\/code> locale reste invisible hors de sa fonction : ce n&#39;est pas une globale.<\/p>\n<h2>Idée 4 · La récursivité<\/h2>\n<p>Une fonction récursive s&#39;appelle elle-même. Il faut un <strong>cas d&#39;arrêt<\/strong>. Chaque appel empile ses propres variables ; on dépile au premier <code>return<\/code>.<\/p>\n<figure class=\"flux\"><figcaption>fact(4) dans le cours<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">fact(4) = fact(3)*4<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">fact(3) = fact(2)*3<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">fact(2) = fact(1)*2<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">fact(1) = 1 (arrêt)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">on remonte : 2, 6, 24<\/div><\/div><\/figure><pre class=\"\"><code>#include &lt;stdio.h&gt;\nlong fact(int n)\n{\n    if (n &gt; 1)\n        return fact(n - 1) * n;\n    else\n        return 1;\n}\nint main(void)\n{\n    int n;\n    for (n = 0; n &lt;= 5; n++)\n        printf(&quot;%d! = %ld\\n&quot;, n, fact(n));\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>0! = 1\n1! = 1\n2! = 2\n3! = 6\n4! = 24\n5! = 120<\/code><\/pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Prototype avant <code>main<\/code>, <code>return<\/code> arrête la fonction, passage par valeur (copie), <code>static<\/code> = mémoire permanente mais portée locale, récursivité = cas d&#39;arrêt obligatoire.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>TP 2 · Exercice III<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Écris <code>int max2(int a, int b)<\/code> qui renvoie le plus grand des deux.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>int max2(int a, int b) { return (a &gt; b) ? a : b; }<\/code> — testé au chapitre « TD et TP corrigés ».<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Variable statique<\/h3><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p><code>void f(void){ static int s = 5; s += 2; printf(&quot;%d &quot;, s); }<\/code> appelée 3 fois affiche quoi ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>7 9 11<\/code> : l&#39;initialisation à 5 n&#39;a lieu qu&#39;une fois ; s garde sa valeur d&#39;un appel à l&#39;autre.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Récursivité<\/h3><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Combien d&#39;appels de <code>fact<\/code> au total pour <code>fact(5)<\/code> ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 5<\/b><\/p><p>fact(5), fact(4), fact(3), fact(2), fact(1) : 5 appels (fact(1) est le cas d&#39;arrêt).<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Après <code>echange(n, p)<\/code> (passage par valeur) avec n=10, p=20 :<\/div><button class=\"opt\" data-o=\"0\">n=10, p=20<\/button><button class=\"opt\" data-o=\"1\">n=20, p
