is faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Que devient le problème si le plan $(P)$ est fixe ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$\\vec\\Omega = \\vec 0$ : $\\vec V_e = \\vec\\gamma_e = \\vec\\gamma_c = \\vec 0$, le repère est galiléen et l&#39;équation se réduit à $\\ddot\\theta = \\dfrac gr\\sin\\theta$ (avec l&#39;orientation de $\\theta$ de l&#39;énoncé), et $\\dot\\theta^2 = \\dfrac{2g}{r}(1-\\cos\\theta)$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Le PFD dans un référentiel galiléen s&#39;écrit :<\/div><button class=\"opt\" data-o=\"0\">$m\\vec\\gamma = \\sum\\vec F_{ext}$<\/button><button class=\"opt\" data-o=\"1\">$m\\vec V = \\sum\\vec F_{ext}$<\/button><button class=\"opt\" data-o=\"2\">$m\\vec\\gamma = \\sum\\vec F_{ext} + \\vec F_e$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">La pulsation du pendule simple (petits angles) est :<\/div><button class=\"opt\" data-o=\"0\">$\\sqrt{g/\\ell}$<\/button><button class=\"opt\" data-o=\"1\">$\\sqrt{\\ell/g}$<\/button><button class=\"opt\" data-o=\"2\">$g/\\ell$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">La force de Coriolis vaut :<\/div><button class=\"opt\" data-o=\"0\">$-m\\vec\\gamma_e$<\/button><button class=\"opt\" data-o=\"1\">$-2m\\,\\vec\\Omega\\wedge\\vec V_r$<\/button><button class=\"opt\" data-o=\"2\">$m\\vec g$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Pour $k = 20$ N/m et $m = 0{,}2$ kg, $\\omega_0$ vaut :<\/div><button class=\"opt\" data-o=\"0\">100 rad/s<\/button><button class=\"opt\" data-o=\"1\">10 rad/s<\/button><button class=\"opt\" data-o=\"2\">4 rad/s<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Sans frottement, la réaction du support est :<\/div><button class=\"opt\" data-o=\"0\">perpendiculaire au support<\/button><button class=\"opt\" data-o=\"1\">tangente au support<\/button><button class=\"opt\" data-o=\"2\">nulle<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">À l&#39;équilibre dans un repère non galiléen, $\\vec F_c$ est :<\/div><button class=\"opt\" data-o=\"0\">nulle<\/button><button class=\"opt\" data-o=\"1\">égale à $\\vec F_e$<\/button><button class=\"opt\" data-o=\"2\">égale au poids<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">L&#39;amplitude et la phase d&#39;un oscillateur sont fixées par :<\/div><button class=\"opt\" data-o=\"0\">les conditions initiales<\/button><button class=\"opt\" data-o=\"1\">la masse seule<\/button><button class=\"opt\" data-o=\"2\">la raideur seule<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">La tension du fil du pendule est maximale quand :<\/div><button class=\"opt\" data-o=\"0\">le pendule passe à la verticale ($\\varphi = 0$)<\/button><button class=\"opt\" data-o=\"1\">$\\varphi$ est maximal<\/button><button class=\"opt\" data-o=\"2\">la vitesse est nulle<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">La quantité de mouvement est :<\/div><button class=\"opt\" data-o=\"0\">$m\\vec V$<\/button><button class=\"opt\" data-o=\"1\">$m\\vec\\gamma$<\/button><button class=\"opt\" data-o=\"2\">$\\tfrac12 mV^2$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Le principe des actions réciproques dit :<\/div><button class=\"opt\" data-o=\"0\">$\\vec F_{A\\to B} = -\\vec F_{B\\to A}$<\/button><button class=\"opt\" data-o=\"1\">$\\vec F_{A\\to B} = \\vec F_{B\\to A}$<\/button><button class=\"opt\" data-o=\"2\">$\\sum\\vec F = \\vec 0$ toujours<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"dynamique","rep":null,"tol":null},{"n":"dynamique","rep":["2.01"],"tol":0.01},{"n":"dynamique","rep":null,"tol":null},{"n":"dynamique","rep":null,"tol":null}],"qcm":[{"n":"dynamique","q":"Le PFD dans un référentiel galiléen s&#39;écrit :","o":["$m\\vec\\gamma = \\sum\\vec F_{ext}$","$m\\vec V = \\sum\\vec F_{ext}$","$m\\vec\\gamma = \\sum\\vec F_{ext} + \\vec F_e$"],"a":0,"e":"Pas de force d&#39;inertie en galiléen."},{"n":"dynamique","q":"La pulsation du pendule simple (petits angles) est :","o":["$\\sqrt{g/\\ell}$","$\\sqrt{\\ell/g}$","$g/\\ell$"],"a":0,"e":"De $\\ddot\\varphi + (g/\\ell)\\varphi = 0$."},{"n":"dynamique","q":"La force de Coriolis vaut :","o":["$-m\\vec\\gamma_e$","$-2m\\,\\vec\\Omega\\wedge\\vec V_r$","$m\\vec g$"],"a":1,"e":"$-m\\vec\\gamma_c$."},{"n":"dynamique","q":"Pour $k = 20$ N/m et $m = 0{,}2$ kg, $\\omega_0$ vaut :","o":["100 rad/s","10 rad/s","4 rad/s"],"a":1,"e":"$\\sqrt{100}$."},{"n":"dynamique","q":"Sans frottement, la réaction du support est :","o":["perpendiculaire au support","tangente au support","nulle"],"a":0,"e":"$\\vec R_t = \\vec 0$."},{"n":"dynamique","q":"À l&#39;équilibre dans un repère non galiléen, $\\vec F_c$ est :","o":["nulle","égale à $\\vec F_e$","égale au poids"],"a":0,"e":"$\\vec V_r = \\vec 0$."},{"n":"dynamique","q":"L&#39;amplitude et la phase d&#39;un oscillateur sont fixées par :","o":["les conditions initiales","la masse seule","la raideur seule"],"a":0,"e":"Deux constantes d&#39;intégration."},{"n":"dynamique","q":"La tension du fil du pendule est maximale quand :","o":["le pendule passe à la verticale ($\\varphi = 0$)","$\\varphi$ est maximal","la vitesse est nulle"],"a":0,"e":"$\\cos\\varphi$ et $\\dot\\varphi^2$ sont alors maximaux."},{"n":"dynamique","q":"La quantité de mouvement est :","o":["$m\\vec V$","$m\\vec\\gamma$","$\\tfrac12 mV^2$"],"a":0,"e":"$\\vec p = m\\vec V$."},{"n":"dynamique","q":"Le principe des actions réciproques dit :","o":["$\\vec F_{A\\to B} = -\\vec F_{B\\to A}$","$\\vec F_{A\\to B} = \\vec F_{B\\to A}$","$\\sum\\vec F = \\vec 0$ toujours"],"a":0,"e":"Troisième loi de Newton."}]},{"id":"theoremes-generaux","t":"Théorèmes généraux · moment cinétique et énergie","seance":"Chapitre V · Théorèmes généraux de la dynamique","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu dois maîtriser le PFD et le produit vectoriel.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Que vaut $\\overrightarrow{OM}\\wedge\\vec F$ si $\\vec F$ est parallèle à $\\overrightarrow{OM}$ ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$\\vec 0$ : le produit vectoriel de deux vecteurs colinéaires est nul. C&#39;est le cas des forces centrales.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Trois théorèmes, une même équation du mouvement.<\/strong> Quantité de mouvement, moment cinétique, énergie : on retrouve le même $\\ddot\\theta$. Choisis celui qui élimine l&#39;inconnue gênante (une réaction qui ne travaille pas disparaît du TEC).<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Appliquer le théorème du moment cinétique en un point <strong>mobile<\/strong> sans le terme correctif. Le cours conseille de choisir un point <strong>fixe<\/strong>.<\/p>\n<\/aside><p>À la fin, tu sais appliquer le TMC, le TEC et la conservation de l&#39;énergie mécanique, en galiléen et en non galiléen.<\/p>\n<h2>Idée 1 · Moment cinétique<\/h2>\n<p>$$\\vec\\sigma_O(M/\\mathcal R) = \\overrightarrow{OM}\\wedge m\\vec V(M/\\mathcal R),\\qquad \\vec{\\mathcal M}_O(\\vec F) = \\overrightarrow{OM}\\wedge\\vec F\\ (\\text{N·m})$$<\/p>\n<p><strong>TMC<\/strong> ($O$ fixe, $\\mathcal R$ galiléen) : $\\dfrac{d\\vec\\sigma_O}{dt}\\Big|_{\\mathcal R} = \\vec{\\mathcal M}_O\\left(\\sum\\vec F_{ext}\\right)$. En non galiléen, on ajoute $\\vec{\\mathcal M}_O(\\vec F_e) + \\vec{\\mathcal M}_O(\\vec F_c)$.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>TMC pour le pendule simple<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · Moment cinétique<\/div><p>$\\vec\\sigma_O = \\ell\\vec e_\\rho\\wedge m\\ell\\dot\\varphi\\vec e_\\varphi = m\\ell^2\\dot\\varphi\\,\\vec k$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · Moments<\/div><p>$\\vec{\\mathcal M}_O(\\vec T) = \\vec 0$ (colinéaire au fil) ; $\\vec{\\mathcal M}_O(\\vec P) = -\\ell mg\\sin\\varphi\\,\\vec k$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · TMC<\/div><p>$m\\ell^2\\ddot\\varphi = -mg\\ell\\sin\\varphi$, soit $\\ddot\\varphi + \\dfrac g\\ell\\sin\\varphi = 0$, la même équation qu&#39;avec le PFD, sans calculer $T$.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p>Si $M$ est isolé ou soumis à une force centrale : $\\vec\\sigma_O$ est constant.<\/p>\n<h2>Idée 2 · Travail, puissance, énergie cinétique<\/h2>\n<p>$$dW = \\vec F\\cdot d\\overrightarrow{OM},\\quad P = \\frac{dW}{dt} = \\vec F\\cdot\\vec V\\ (\\text{W}),\\quad E_c = \\tfrac12 mV^2$$<\/p>\n<p><strong>TEC<\/strong> (galiléen) : $E_c(B) - E_c(A) = W_{A\\to B}\\left(\\sum\\vec F_{ext}\\right)$. En non galiléen, on ajoute $W(\\vec F_e)$ ; <strong>la force de Coriolis ne travaille pas<\/strong> ($\\vec F_c\\perp\\vec V_r$).<\/p>\n<h2>Idée 3 · Énergie potentielle et énergie mécanique<\/h2>\n<figure class=\"flux\"><figcaption>Force conservative<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">F = −grad Ep<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">rot F = 0<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">W(A→B) = Ep(A) − Ep(B), indépendant du chemin<\/div><\/div><\/figure><ul>\n<li>Pesanteur ($z$ vers le haut) : $E_p = mgz + \\text{cte}$ ; ressort : $E_p = \\tfrac12 kx^2 + \\text{cte}$.<\/li>\n<li>$E_m = E_c + E_p$ ; $\\Delta E_m = W(\\vec F_{non\\,cons})$.<\/li>\n<li>Si toutes les forces qui travaillent sont conservatives : $E_m$ = constante (intégrale première).<\/li>\n<li>Le frottement n&#39;est pas conservatif : $E_m$ diminue (dissipation).<\/li>\n<\/ul>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le signe de $E_p$ de pesanteur dépend de l&#39;orientation de l&#39;axe. Avec un axe $Oz$ vers le haut, $E_p = mgz$ ; avec un axe vers le bas (comme $\\vec j$ du pendule du cours), $E_p = -mgy$.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Série 3, exercice 2<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>$\\vec F = \\tfrac{25}{6}y\\,\\vec e_x + (z-x)\\,\\vec e_y + (2z^2 - x)\\,\\vec e_z$, trajectoire $x = 3t$, $y = 2t^2$, $z = t - 2$. Puissance $P(t)$ ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$\\vec V = (3, 4t, 1)$. $P = \\tfrac{25}{6}\\cdot2t^2\\cdot3 + (t-2-3t)\\cdot4t + 2(t-2)^2 - 3t = 19t^2 - 19t + 8$ W.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>À quel instant (s) la puissance est-elle minimale ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.5<\/b><\/p><p>$dP/dt = 38t - 19 = 0$, donc $t = 0{,}5$ s ; position $(3/2,\\ 1/2,\\ -3/2)$.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Travail entre $t_1 = 0$ et $t_2 = 2$ s (J, une décimale) ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 28.7<\/b><\/p><p>$W = \\int_0^2 (19t^2 - 19t + 8)\\,dt = \\tfrac{152}{3} - 38 + 16 \\approx 28{,}7$ J.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>En ligne droite de $A(0,0,-2)$ à $B(6,8,0)$, le travail vaut $\\approx 67{,}3$ J. Conclusion ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Le travail dépend du chemin : $\\vec F$ <strong>n&#39;est pas conservative<\/strong>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Série 3, exercice 3 : énergie<\/h3><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>Anneau sur un cerceau de rayon $R$ en translation verticale d&#39;accélération $a$. On trouve $E_p(\\vec P) = mgR\\sin\\theta$ et $E_p(\\vec F_e) = maR\\sin\\theta$ dans $\\mathcal R_1$. Retrouve l&#39;équation en $\\theta$ par l&#39;énergie mécanique.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$E_m = \\tfrac12 mR^2\\dot\\theta^2 + m(g+a)R\\sin\\theta$ est constante (la réaction et Coriolis ne travaillent pas). En dérivant : $mR^2\\dot\\theta\\ddot\\theta + m(g+a)R\\dot\\theta\\cos\\theta = 0$, donc $\\ddot\\theta = -\\dfrac{g+a}{R}\\cos\\theta$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Le moment cinétique en $O$ vaut :<\/div><button class=\"opt\" data-o=\"0\">$\\overrightarrow{OM}\\wedge m\\vec V$<\/button><button class=\"opt\" data-o=\"1\">$m\\vec V\\wedge\\overrightarrow{OM}$<\/button><button class=\"opt\" data-o=\"2\">$\\overrightarrow{OM}\\cdot m\\vec V$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Une force centrale (portée par $\\overrightarrow{OM}$) a un moment en $O$ :<\/div><button class=\"opt\" data-o=\"0\">nul<\/button><button class=\"opt\" data-o=\"1\">maximal<\/button><button class=\"opt\" data-o=\"2\">égal à $\\vec F$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">La force de Coriolis :<\/div><button class=\"opt\" data-o=\"0\">ne travaille pas<\/button><button class=\"opt\" data-o=\"1\">travaille toujours<\/button><button class=\"opt\" data-o=\"2\">est conservative<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Si $\\vec F = -\\overrightarrow{\\text{grad}}\\,E_p$, alors :<\/div><button class=\"opt\" data-o=\"0\">son travail ne dépend pas du chemin<\/button><button class=\"opt\" data-o=\"1\">son travail est nul<\/button><button class=\"opt\" data-o=\"2\">elle est une force de frottement<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">$E_m$ se conserve si :<\/div><button class=\"opt\" data-o=\"0\">seules des forces conservatives travaillent<\/button><button class=\"opt\" data-o=\"1\">il y a du frottement<\/button><button class=\"opt\" data-o=\"2\">le repère tourne<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">La puissance minimale de $P = 19t^2 - 19t + 8$ est atteinte à :<\/div><button class=\"opt\" data-o=\"0\">$t = 0{,}5$ s<\/button><button class=\"opt\" data-o=\"1\">$t = 1$ s<\/button><button class=\"opt\" data-o=\"2\">$t = 0$ s<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">L&#39;unité du moment d&#39;une force est :<\/div><button class=\"opt\" data-o=\"0\">N·m<\/button><button class=\"opt\" data-o=\"1\">J/s<\/button><button class=\"opt\" data-o=\"2\">kg·m/s<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Le TEC relie :<\/div><button class=\"opt\" data-o=\"0\">variation de $E_c$ et travail des forces<\/button><button class=\"opt\" data-o=\"1\">variation de $\\vec\\sigma$ et moment des forces<\/button><button class=\"opt\" data-o=\"2\">$\\vec\\gamma$ et forces<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Pour montrer qu&#39;une force est conservative, on peut vérifier :<\/div><button class=\"opt\" data-o=\"0\">$\\overrightarrow{\\text{rot}}\\,\\vec F = \\vec 0$<\/button><button class=\"opt\" data-o=\"1\">$\\text{div}\\,\\vec F = 0$<\/button><button class=\"opt\" data-o=\"2\">$\\vec F\\cdot\\vec V = 0$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">$W \\ne W'$ sur deux chemins entre $A$ et $B$ prouve que la force est :<\/div><button class=\"opt\" data-o=\"0\">non conservative<\/button><button class=\"opt\" data-o=\"1\">conservative<\/button><button class=\"opt\" data-o=\"2\">nulle<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"theoremes-generaux","rep":null,"tol":null},{"n":"theoremes-generaux","rep":null,"tol":null},{"n":"theoremes-generaux","rep":["0.5"],"tol":null},{"n":"theoremes-generaux","rep":["28.7"],"tol":0.1},{"n":"theoremes-generaux","rep":null,"tol":null},{"n":"theoremes-generaux","rep":null,"tol":null}],"qcm":[{"n":"theoremes-generaux","q":"Le moment cinétique en $O$ vaut :","o":["$\\overrightarrow{OM}\\wedge m\\vec V$","$m\\vec V\\wedge\\overrightarrow{OM}$","$\\overrightarrow{OM}\\cdot m\\vec V$"],"a":0,"e":"Ordre : position puis quantité de mouvement."},{"n":"theoremes-generaux","q":"Une force centrale (portée par $\\overrightarrow{OM}$) a un moment en $O$ :","o":["nul","maximal","égal à $\\vec F$"],"a":0,"e":"Vecteurs colinéaires."},{"n":"theoremes-generaux","q":"La force de Coriolis :","o":["ne travaille pas","travaille toujours","est conservative"],"a":0,"e":"Elle est perpendiculaire à $\\vec V_r$."},{"n":"theoremes-generaux","q":"Si $\\vec F = -\\overrightarrow{\\text{grad}}\\,E_p$, alors :","o":["son travail ne dépend pas du chemin","son travail est nul","elle est une force de frottement"],"a":0,"e":"Force conservative."},{"n":"theoremes-generaux","q":"$E_m$ se conserve si :","o":["seules des forces conservatives travaillent","il y a du frottement","le repère tourne"],"a":0,"e":"$\\Delta E_m = W(\\vec F_{non\\,cons}) = 0$."},{"n":"theoremes-generaux","q":"La puissance minimale de $P = 19t^2 - 19t + 8$ est atteinte à :","o":["$t = 0{,}5$ s","$t = 1$ s","$t = 0$ s"],"a":0,"e":"$dP/dt = 0$."},{"n":"theoremes-generaux","q":"L&#39;unité du moment d&#39;une force est :","o":["N·m","J/s","kg·m/s"],"a":0,"e":"Produit d&#39;une distance par une force."},{"n":"theoremes-generaux","q":"Le TEC relie :","o":["variation de $E_c$ et travail des forces","variation de $\\vec\\sigma$ et moment des forces","$\\vec\\gamma$ et forces"],"a":0,"e":"Théorème de l&#39;énergie cinétique."},{"n":"theoremes-generaux","q":"Pour montrer qu&#39;une force est conservative, on peut vérifier :","o":["$\\overrightarrow{\\text{rot}}\\,\\vec F = \\vec 0$","$\\text{div}\\,\\vec F = 0$","$\\vec F\\cdot\\vec V = 0$"],"a":0,"e":"Condition du cours."},{"n":"theoremes-generaux","q":"$W \\ne W'$ sur deux chemins entre $A$ et $B$ prouve que la force est :","o":["non conservative","conservative","nulle"],"a":0,"e":"Série 3, exercice 2."}]},{"id":"series-corrigees","t":"Séries de TD corrigées (1 à 3)","seance":"TD · Séries 1, 2 et 3","imp":4,"html":"<p>Les trois séries du semestre, avec la méthode et les résultats. Les corrections fournies sont manuscrites (étudiant) ; nous avons recalculé les résultats clés.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Série 1, ex. 1 : la correction manuscrite conclut que la base $(\\vec e_1, \\vec e_2, \\vec e_3)$ « n&#39;est pas orthogonale » sans le vérifier par des produits scalaires ; la seule conclusion démontrée est qu&#39;elle <strong>n&#39;est pas normée<\/strong> ($\\|\\vec e_1\\| = \\sin\\theta_A \\ne 1$). Série 2, ex. 2 : la valeur finale de $R_c$ est mal lisible dans la correction ; le calcul donne $R_c = \\dfrac{9\\sqrt2}{4}e^t$.<\/p>\n<\/aside><h2>Série 1 · Rappels mathématiques<\/h2>\n<section class=\"exo\"><h3>Série 1<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Ex. 1 : avec $\\vec u_A, \\vec u_B, \\vec u_C$ unitaires, on pose $\\vec e_1 = \\vec u_B\\wedge\\vec u_C$. Pourquoi $\\|\\vec e_1\\| = \\sin\\theta_A$ ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$\\|\\vec u_B\\wedge\\vec u_C\\| = \\|\\vec u_B\\|\\,\\|\\vec u_C\\|\\,|\\sin\\theta_A| = \\sin\\theta_A$ (normes égales à 1, $\\theta_A\\in[0,\\pi]$). On vérifie avec $\\sin^2\\theta_A + \\cos^2\\theta_A = 1$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Ex. 2 : dimensions et domaines de $x, y, z, \\rho, \\varphi$ ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$x, y, z, \\rho$ en mètres ; $\\varphi$ en radians. $x, y, z\\in\\mathbb R$, $\\rho\\ge0$, $\\varphi\\in[0, 2\\pi[$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Ex. 3 : calcule $\\dfrac{d\\vec e_x}{dt}\\Big|_{\\mathcal R_{cyl}}$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Dans le repère cylindrique, c&#39;est $\\vec e_\\rho$ qui est fixe ; $\\vec e_x = \\cos\\varphi\\,\\vec e_\\rho - \\sin\\varphi\\,\\vec e_\\varphi$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>En dérivant avec $\\vec e_\\rho, \\vec e_\\varphi$ fixes : $\\dfrac{d\\vec e_x}{dt} = -\\dot\\varphi(\\sin\\varphi\\,\\vec e_\\rho + \\cos\\varphi\\,\\vec e_\\varphi) = -\\dot\\varphi\\,\\vec e_y$. De même $\\dfrac{d\\vec e_y}{dt} = \\dot\\varphi\\,\\vec e_x$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Série 2 · Cinématique et changement de référentiel<\/h2>\n<section class=\"exo\"><h3>Série 2<\/h3><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Ex. 1 : rayon de courbure de $x = t-1$, $y = -t^2+1$ ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$R_c = \\dfrac{(1+4t^2)^{3/2}}{2}$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Ex. 3 : accélération de Coriolis de l&#39;anneau sur le cercle tournant ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$\\vec\\gamma_c = 2r\\dot\\alpha\\dot\\theta\\cos\\theta\\,\\vec e_{y'}$ (complémentaire, perpendiculaire au plan du cercle).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>Ex. 4 : vitesse absolue de l&#39;anneau à la sortie de la tige ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$\\vec V_a = \\omega\\sqrt{L^2 - r_0^2}\\,\\vec i_1 + \\omega L\\,\\vec j_1$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Série 3 · Dynamique et théorèmes généraux<\/h2>\n<section class=\"exo\"><h3>Série 3<\/h3><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><p>Ex. 1 : équation différentielle de l&#39;anneau sur le cerceau en rotation ($\\overrightarrow{O_1M} = r\\vec e_\\rho$, $\\overrightarrow{OO_1} = a\\vec i_1 + b\\vec k_1$) ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Projection du PFD sur $\\vec e_\\theta$ : $\\ddot\\theta = \\dfrac gr\\sin\\theta + \\dfrac ar\\omega^2\\cos\\theta + \\omega^2\\sin\\theta\\cos\\theta$. Avec $\\theta = \\dot\\theta = 0$ à $t = 0$, une intégration donne $\\dot\\theta^2$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"7\"><div class=\"ex-q\"><p>Ex. 3 : $\\mathcal R_1$ (lié au cerceau en translation, $\\overrightarrow{OO_1} = b\\vec j + \\tfrac12 at^2\\vec k$) est-il galiléen ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Non : $\\vec\\gamma(O_1/\\mathcal R) = a\\vec k \\ne \\vec 0$, translation rectiligne <strong>accélérée<\/strong>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"8\"><div class=\"ex-q\"><p>Ex. 3 : équation en $\\theta$ (par PFD, TEC, TEM ou TMC) ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$\\ddot\\theta = -\\dfrac{g+a}{R}\\cos\\theta$, et la réaction : $R_\\rho = m\\sin\\theta(a+g) - mR\\dot\\theta^2$ (au signe de la convention de l&#39;énoncé), $R_z = 0$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 6 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Dans la série 3 ex. 3, $\\vec F_c$ est nulle car :<\/div><button class=\"opt\" data-o=\"0\">$\\mathcal R_1$ est en translation ($\\vec\\Omega = \\vec 0$)<\/button><button class=\"opt\" data-o=\"1\">la vitesse relative est nulle<\/button><button class=\"opt\" data-o=\"2\">il n&#39;y a pas de pesanteur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Série 3 ex. 2 : $W = 28{,}7$ J sur la trajectoire, $67{,}3$ J en ligne droite. Donc :<\/div><button class=\"opt\" data-o=\"0\">la force n&#39;est pas conservative<\/button><button class=\"opt\" data-o=\"1\">la force est conservative<\/button><button class=\"opt\" data-o=\"2\">il y a une erreur de calcul<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Série 2 ex. 1 : l&#39;accélération est :<\/div><button class=\"opt\" data-o=\"0\">constante, $-2\\vec j$<\/button><button class=\"opt\" data-o=\"1\">nulle<\/button><button class=\"opt\" data-o=\"2\">variable<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Série 2 ex. 4 : l&#39;accélération absolue est portée par :<\/div><button class=\"opt\" data-o=\"0\">$\\vec j_1$<\/button><button class=\"opt\" data-o=\"1\">$\\vec i_1$<\/button><button class=\"opt\" data-o=\"2\">$\\vec k$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Série 3 ex. 3 : $E_p$ de $\\vec F_e$ dans $\\mathcal R_1$ :<\/div><button class=\"opt\" data-o=\"0\">$maR\\sin\\theta$<\/button><button class=\"opt\" data-o=\"1\">$-maR\\sin\\theta$<\/button><button class=\"opt\" data-o=\"2\">0<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Série 1 ex. 4 : $f = 3r^3\\sin^2\\theta\\cos\\theta\\sin2\\varphi$ s&#39;écrit en cartésiennes :<\/div><button class=\"opt\" data-o=\"0\">$6xyz$<\/button><button class=\"opt\" data-o=\"1\">$3xyz$<\/button><button class=\"opt\" data-o=\"2\">$x^2+y^2+z^2$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Série 2 ex. 2 : $\\|\\vec\\gamma\\|$ vaut :<\/div><button class=\"opt\" data-o=\"0\">$\\sqrt{17}\\,e^t$<\/button><button class=\"opt\" data-o=\"1\">$3e^t$<\/button><button class=\"opt\" data-o=\"2\">$e^t$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Série 1 ex. 1 : la base $(\\vec e_1, \\vec e_2, \\vec e_3)$ :<\/div><button class=\"opt\" data-o=\"0\">est une base mais pas normée<\/button><button class=\"opt\" data-o=\"1\">est orthonormée<\/button><button class=\"opt\" data-o=\"2\">n&#39;est pas une base<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Série 3 ex. 1 : si le plan est fixe :<\/div><button class=\"opt\" data-o=\"0\">le repère relatif devient galiléen<\/button><button class=\"opt\" data-o=\"1\">Coriolis double<\/button><button class=\"opt\" data-o=\"2\">$\\vec\\gamma_e$ reste centripète<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Série 2 ex. 3 : $\\vec\\gamma_c$ est dite :<\/div><button class=\"opt\" data-o=\"0\">complémentaire<\/button><button class=\"opt\" data-o=\"1\">centripète<\/button><button class=\"opt\" data-o=\"2\">tangentielle<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"series-corrigees","rep":null,"tol":null},{"n":"series-corrigees","rep":null,"tol":null},{"n":"series-corrigees","rep":null,"tol":null},{"n":"series-corrigees","rep":null,"tol":null},{"n":"series-corrigees","rep":null,"tol":null},{"n":"series-corrigees","rep":null,"tol":null},{"n":"series-corrigees","rep":null,"tol":null},{"n":"series-corrigees","rep":null,"tol":null},{"n":"series-corrigees","rep":null,"tol":null}],"qcm":[{"n":"series-corrigees","q":"Dans la série 3 ex. 3, $\\vec F_c$ est nulle car :","o":["$\\mathcal R_1$ est en translation ($\\vec\\Omega = \\vec 0$)","la vitesse relative est nulle","il n&#39;y a pas de pesanteur"],"a":0,"e":"$\\vec\\gamma_c = 2\\vec\\Omega\\wedge\\vec V_r = \\vec 0$."},{"n":"series-corrigees","q":"Série 3 ex. 2 : $W = 28{,}7$ J sur la trajectoire, $67{,}3$ J en ligne droite. Donc :","o":["la force n&#39;est pas conservative","la force est conservative","il y a une erreur de calcul"],"a":0,"e":"Le travail dépend du chemin."},{"n":"series-corrigees","q":"Série 2 ex. 1 : l&#39;accélération est :","o":["constante, $-2\\vec j$","nulle","variable"],"a":0,"e":"$\\ddot y = -2$."},{"n":"series-corrigees","q":"Série 2 ex. 4 : l&#39;accélération absolue est portée par :","o":["$\\vec j_1$","$\\vec i_1$","$\\vec k$"],"a":0,"e":"Les termes sur $\\vec i_1$ s&#39;annulent."},{"n":"series-corrigees","q":"Série 3 ex. 3 : $E_p$ de $\\vec F_e$ dans $\\mathcal R_1$ :","o":["$maR\\sin\\theta$","$-maR\\sin\\theta$","0"],"a":0,"e":"$\\vec F_e = -ma\\vec k_1$, conservative."},{"n":"series-corrigees","q":"Série 1 ex. 4 : $f = 3r^3\\sin^2\\theta\\cos\\theta\\sin2\\varphi$ s&#39;écrit en cartésiennes :","o":["$6xyz$","$3xyz$","$x^2+y^2+z^2$"],"a":0,"e":"$\\sin2\\varphi = 2\\sin\\varphi\\cos\\varphi$."},{"n":"series-corrigees","q":"Série 2 ex. 2 : $\\|\\vec\\gamma\\|$ vaut :","o":["$\\sqrt{17}\\,e^t$","$3e^t$","$e^t$"],"a":0,"e":"$\\sqrt{16e^{2t} + e^{2t}}$."},{"n":"series-corrigees","q":"Série 1 ex. 1 : la base $(\\vec e_1, \\vec e_2, \\vec e_3)$ :","o":["est une base mais pas normée","est orthonormée","n&#39;est pas une base"],"a":0,"e":"Produit mixte non nul, normes différentes de 1."},{"n":"series-corrigees","q":"Série 3 ex. 1 : si le plan est fixe :","o":["le repère relatif devient galiléen","Coriolis double","$\\vec\\gamma_e$ reste centripète"],"a":0,"e":"$\\omega = 0$."},{"n":"series-corrigees","q":"Série 2 ex. 3 : $\\vec\\gamma_c$ est dite :","o":["complémentaire","centripète","tangentielle"],"a":0,"e":"Autre nom de l&#39;accélération de Coriolis."}]},{"id":"revision","t":"Révision et examen blanc","seance":"Révision · tout le cours","imp":5,"html":"<h2>La méthode à appliquer partout<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Résoudre un problème de mécanique du point<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/6 · Choisis le système et le référentiel<\/div><p>galiléen ou non ? S&#39;il tourne ou accélère, prévois $\\vec F_e$ et $\\vec F_c$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/6 · Choisis la base<\/div><p>celle qui suit le mouvement (polaire pour un cercle, cartésienne pour une droite).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/6 · Écris $\\overrightarrow{OM}$, puis dérive<\/div><p>n&#39;oublie pas les dérivées des vecteurs de base ($\\vec\\Omega\\wedge\\vec u$).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/6 · Bilan des forces<\/div><p>poids, réaction, tension, rappel, inertie.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/6 · Choisis le théorème<\/div><p>PFD (forces inconnues), TMC (point fixe, élimine les forces qui passent par lui), énergie (élimine les forces qui ne travaillent pas).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">6/6 · Vérifie<\/div><p>homogénéité, cas limite ($\\omega = 0$, petits angles).<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Aucune annale de contrôle ne nous a été fournie : cet examen blanc reprend le format des séries (un exercice par grande partie du cours). Durée conseillée : 1 h 30.<\/p>\n<\/aside><h2>Examen blanc<\/h2>\n<section class=\"exo\"><h3>Exercice 1 · Outils (4 pts)<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Soit $\\vec A = \\vec i + \\vec j$ et $\\vec B = \\vec j + \\vec k$. Calcule $\\vec A\\wedge\\vec B$ et l&#39;angle entre $\\vec A$ et $\\vec B$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$\\vec A\\wedge\\vec B = (1\\cdot1 - 0)\\vec i - (1\\cdot1 - 0)\\vec j + (1\\cdot1 - 0)\\vec k = \\vec i - \\vec j + \\vec k$. $\\cos\\theta = \\dfrac{1}{\\sqrt2\\sqrt2} = \\tfrac12$, donc $\\theta = 60°$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>$f = xy + z^2$. Calcule $\\overrightarrow{\\text{grad}}\\,f$ et vérifie que son rotationnel est nul.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$\\overrightarrow{\\text{grad}}\\,f = y\\vec i + x\\vec j + 2z\\vec k$. Rotationnel : $(0-0)\\vec i - (0-0)\\vec j + (1-1)\\vec k = \\vec 0$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Exercice 2 · Cinématique (5 pts)<\/h3><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>$M$ décrit $\\rho = R$ constant, $\\varphi = \\omega t$. Donne $\\vec V$ et $\\vec\\gamma$ en polaires.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$\\vec V = R\\omega\\,\\vec e_\\varphi$, $\\vec\\gamma = -R\\omega^2\\,\\vec e_\\rho$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>$x = 2t$, $y = t^2$. Rayon de courbure à $t = 0$ (m) ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 2<\/b><\/p><p>$\\vec V = (2, 2t)$, $\\vec\\gamma = (0, 2)$. À $t = 0$ : $\\|\\vec V\\|^3 = 8$, $\\|\\vec V\\wedge\\vec\\gamma\\| = 4$, $R_c = 2$ m.<\/p>\n<\/div><\/div><\/section><section class=\"exo\"><h3>Exercice 3 · Changement de référentiel (5 pts)<\/h3><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Une tige tourne dans $(xOy)$ autour de $Oz$ à $\\omega$ constant. Un anneau glisse sur la tige avec $\\overrightarrow{OM} = r(t)\\vec i_1$. Donne $\\vec V_r$, $\\vec V_e$, $\\vec\\gamma_r$, $\\vec\\gamma_e$, $\\vec\\gamma_c$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$\\vec V_r = \\dot r\\,\\vec i_1$ ; $\\vec V_e = r\\omega\\,\\vec j_1$ ; $\\vec\\gamma_r = \\ddot r\\,\\vec i_1$ ; $\\vec\\gamma_e = -r\\omega^2\\,\\vec i_1$ ; $\\vec\\gamma_c = 2\\omega\\dot r\\,\\vec j_1$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>Sans frottement, la tige horizontale. Équation en $r$ ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>PFD dans $\\mathcal R_1$ projeté sur $\\vec i_1$ : $m\\ddot r = mr\\omega^2$ (seule $\\vec F_e$ a une composante sur $\\vec i_1$), donc $\\ddot r - \\omega^2 r = 0$, de solution $r = r_0\\cosh(\\omega t)$ si $\\dot r(0) = 0$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Exercice 4 · Énergie (6 pts)<\/h3><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><p>Un ressort horizontal ($k = 50$ N/m) porte $m = 0{,}5$ kg, lâché sans vitesse à $x_0 = 0{,}1$ m. Énergie mécanique (J) ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.25<\/b><\/p><p>$E_m = \\tfrac12 kx_0^2 = \\tfrac12\\times50\\times0{,}01 = 0{,}25$ J (conservée, pas de frottement).<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"7\"><div class=\"ex-q\"><p>Vitesse maximale (m/s) ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1<\/b><\/p><p>En $x = 0$ : $\\tfrac12 mV^2 = 0{,}25$, donc $V = 1$ m/s. Ou $V_{max} = \\omega_0 x_0 = 10\\times0{,}1$.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"8\"><div class=\"ex-q\"><p>Retrouve l&#39;équation du mouvement en dérivant $E_m$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$\\dfrac{dE_m}{dt} = m\\dot x\\ddot x + kx\\dot x = 0$, donc $\\ddot x + \\dfrac km x = 0$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 6 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Pour éliminer la tension d&#39;un fil, on utilise de préférence :<\/div><button class=\"opt\" data-o=\"0\">le TMC au point d&#39;attache<\/button><button class=\"opt\" data-o=\"1\">le PFD projeté sur le fil<\/button><button class=\"opt\" data-o=\"2\">la composition des vitesses<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Pour $x = 2t$, $y = t^2$, $R_c$ à $t = 0$ vaut :<\/div><button class=\"opt\" data-o=\"0\">2 m<\/button><button class=\"opt\" data-o=\"1\">1 m<\/button><button class=\"opt\" data-o=\"2\">4 m<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Sur une tige tournante horizontale sans frottement, l&#39;anneau :<\/div><button class=\"opt\" data-o=\"0\">s&#39;éloigne de l&#39;axe<\/button><button class=\"opt\" data-o=\"1\">reste immobile<\/button><button class=\"opt\" data-o=\"2\">se rapproche de l&#39;axe<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">$E_m$ d&#39;un ressort ($k = 50$ N/m) lâché à $0{,}1$ m :<\/div><button class=\"opt\" data-o=\"0\">0,25 J<\/button><button class=\"opt\" data-o=\"1\">2,5 J<\/button><button class=\"opt\" data-o=\"2\">0,5 J<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">La réaction normale sans frottement :<\/div><button class=\"opt\" data-o=\"0\">ne travaille pas<\/button><button class=\"opt\" data-o=\"1\">travaille toujours<\/button><button class=\"opt\" data-o=\"2\">est conservative<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Dans un repère non galiléen en rotation, on ajoute :<\/div><button class=\"opt\" data-o=\"0\">$\\vec F_e$ et $\\vec F_c$<\/button><button class=\"opt\" data-o=\"1\">seulement $\\vec F_c$<\/button><button class=\"opt\" data-o=\"2\">rien<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">$\\overrightarrow{\\text{grad}}(xy + z^2)$ vaut :<\/div><button class=\"opt\" data-o=\"0\">$y\\vec i + x\\vec j + 2z\\vec k$<\/button><button class=\"opt\" data-o=\"1\">$x\\vec i + y\\vec j + 2z\\vec k$<\/button><button class=\"opt\" data-o=\"2\">$xy\\vec i + z^2\\vec k$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">$(\\vec i + \\vec j)\\wedge(\\vec j + \\vec k)$ vaut :<\/div><button class=\"opt\" data-o=\"0\">$\\vec i - \\vec j + \\vec k$<\/button><button class=\"opt\" data-o=\"1\">$\\vec i + \\vec j + \\vec k$<\/button><button class=\"opt\" data-o=\"2\">$\\vec 0$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Dans un mouvement circulaire uniforme, $\\vec\\gamma$ vaut :<\/div><button class=\"opt\" data-o=\"0\">$-R\\omega^2\\,\\vec e_\\rho$<\/button><button class=\"opt\" data-o=\"1\">$R\\omega\\,\\vec e_\\varphi$<\/button><button class=\"opt\" data-o=\"2\">$\\vec 0$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Le terme $2\\omega\\dot r\\,\\vec j_1$ est :<\/div><button class=\"opt\" data-o=\"0\">l&#39;accélération de Coriolis<\/button><button class=\"opt\" data-o=\"1\">l&#39;accélération d&#39;entraînement<\/button><button class=\"opt\" data-o=\"2\">l&#39;accélération relative<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"revision","rep":null,"tol":null},{"n":"revision","rep":null,"tol":null},{"n":"revision","rep":null,"tol":null},{"n":"revision","rep":["2"],"tol":null},{"n":"revision","rep":null,"tol":null},{"n":"revision","rep":null,"tol":null},{"n":"revision","rep":["0.25"],"tol":0.005},{"n":"revision","rep":["1"],"tol":0.01},{"n":"revision","rep":null,"tol":null}],"qcm":[{"n":"revision","q":"Pour éliminer la tension d&#39;un fil, on utilise de préférence :","o":["le TMC au point d&#39;attache","le PFD projeté sur le fil","la composition des vitesses"],"a":0,"e":"Son moment au point d&#39;attache est nul."},{"n":"revision","q":"Pour $x = 2t$, $y = t^2$, $R_c$ à $t = 0$ vaut :","o":["2 m","1 m","4 m"],"a":0,"e":"$8/4$."},{"n":"revision","q":"Sur une tige tournante horizontale sans frottement, l&#39;anneau :","o":["s&#39;éloigne de l&#39;axe","reste immobile","se rapproche de l&#39;axe"],"a":0,"e":"$\\ddot r = \\omega^2 r &gt; 0$."},{"n":"revision","q":"$E_m$ d&#39;un ressort ($k = 50$ N/m) lâché à $0{,}1$ m :","o":["0,25 J","2,5 J","0,5 J"],"a":0,"e":"$\\tfrac12 kx_0^2$."},{"n":"revision","q":"La réaction normale sans frottement :","o":["ne travaille pas","travaille toujours","est conservative"],"a":0,"e":"Elle est perpendiculaire à la vitesse."},{"n":"revision","q":"Dans un repère non galiléen en rotation, on ajoute :","o":["$\\vec F_e$ et $\\vec F_c$","seulement $\\vec F_c$","rien"],"a":0,"e":"Les deux forces d&#39;inertie."},{"n":"revision","q":"$\\overrightarrow{\\text{grad}}(xy + z^2)$ vaut :","o":["$y\\vec i + x\\vec j + 2z\\vec k$","$x\\vec i + y\\vec j + 2z\\vec k$","$xy\\vec i + z^2\\vec k$"],"a":0,"e":"Dérivées partielles."},{"n":"revision","q":"$(\\vec i + \\vec j)\\wedge(\\vec j + \\vec k)$ vaut :","o":["$\\   }
  function renderList() {
    const q = norm($('#mztQ').value || ''); const ts = [...ST.threads].reverse().filter((t) => !q || norm(t.msgs.map((m) => m.t).join(' ')).includes(q));
    $('#mztList').innerHTML = ts.length ? ts.map((t) => `<details class="mzt-item"><summary>${esc(t.title)}</summary><div class="mzt-meta">${esc(t.sec)} · ${esc(t.date)}</div>${t.msgs.map((m) => `<div class="mzt-m ${m.r === 'u' ? 'u' : 'a'}" style="margin:6px 0">${m.r === 'u' ? esc(m.t) : md(m.t)}</div>`).join('')}<button type="button" data-cont="${esc(t.id)}">Continuer cette discussion</button></details>`).join('')
      : `<p class="mzt-note">${ST.threads.length ? 'Aucune discussion ne contient ce mot.' : 'Aucune discussion pour l\'instant.'}</p>`;
  }
  function renderMem() {
    $('#mztMemL').innerHTML = ST.memos.length ? ST.memos.map((m, i) => `<div class="mzt-item"><div class="mzt-meta">${esc(m.date)}</div>${esc(m.text)}<div><button type="button" data-memdel="${i}" style="margin-top:4px">Effacer</button></div></div>`).join('')
      : '<p class="mzt-note">Aucune note pour l\'instant. Elles apparaîtront au fil de tes questions.</p>';
  }

  // ---------- stockage compte ----------
  async function saveThread(t) {
    saveLocal(); if (!db) return;
    try { await db.collection(base + '/threads').doc(t.id).set({ sec: t.sec, date: t.date, title: t.title, msgs: t.msgs.slice(-40) }); } catch (e) {}
  }
  async function saveMemos() { saveLocal(); if (!db) return; try { await db.doc(base).set({ memos: ST.memos.slice(-30), updated: Date.now() }); } catch (e) {} }

  // ---------- appel au tuteur ----------
  const ERR = { not_granted: 'Tu n\'as pas autorisé la page à utiliser Claude. Recharge-la et accepte la demande, ou change-le dans le menu Autorisations de l\'artifact.', rate_limited: 'Trop de questions d\'un coup, ou limite d\'usage atteinte. Réessaie dans un moment.', prompt_too_large: 'L\'extrait est trop long : ouvre une partie plus précise du cours.', image_rejected: 'Cette photo n\'est pas acceptée. Essaie un JPEG ou un PNG plus léger.', refused: 'Claude n\'a pas pu répondre à cette demande. Reformule ta question.' };
  const visible = (t) => {
    const L = String(t).split('\n');
    for (let i = L.length - 1; i >= Math.max(0, L.length - 3); i--) if (/^\s*M[ÉE]MO\s*:/i.test(L[i])) return L.slice(0, i).join('\n').trim();
    return String(t).trim();
  };
  // rendu léger : on échappe le HTML d'abord, puis gras, italique, code, titres, puces et blocs de code
  const inl = (s) => {
    const p = s.split('`'); if (p.length % 2 === 0) { const last = p.pop(); p[p.length - 1] += '`' + last; }
    return p.map((x, i) => i % 2 ? '<code>' + esc(x) + '</code>' : esc(x).replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*\w])\*([^*\n]+)\*(?![*\w])/g, '$1<em>$2</em>')).join('');
  };
  const md = (t) => {
    const out = []; let list = null, code = null;
    const flush = () => { if (list) { out.push('</' + list + '>'); list = null; } };
    String(t).split('\n').forEach((raw) => {
      if (/^\s*```/.test(raw)) { if (code === null) { flush(); code = []; } else { out.push('<pre>' + esc(code.join('\n')) + '</pre>'); code = null; } return; }
      if (code !== null) { code.push(raw); return; }
      let m;
      if ((m = raw.match(/^\s*#{1,6}\s+(.*)$/))) { flush(); out.push('<p><strong>' + inl(m[1]) + '</strong></p>'); }
      else if ((m = raw.match(/^\s*[-*•]\s+(.*)$/))) { if (list !== 'ul') { flush(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + inl(m[1]) + '</li>'); }
      else if ((m = raw.match(/^\s*\d+[.)]\s+(.*)$/))) { if (list !== 'ol') { flush(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + inl(m[1]) + '</li>'); }
      else if (!raw.trim()) flush();
      else { flush(); out.push('<p>' + inl(raw) + '</p>'); }
    });
    if (code !== null) out.push('<pre>' + esc(code.join('\n')) + '</pre>');
    flush(); return out.join('');
  };
  async function ask(q, deep) {
    q = (q || '').trim(); deep = deep || $('#mztDeep').checked;
    if (busy || !q) return; if (!sample) { note(); return; }
    const c = refreshCtx();
    if (!cur || (cur.sec !== c.label && !forced)) { cur = { id: 't' + Date.now().toString(36), sec: c.label, date: today(), title: q.slice(0, 80), msgs: [] }; ST.threads.push(cur); }
    else if (!ST.threads.includes(cur)) ST.threads.push(cur);
    cur.msgs.push({ r: 'u', t: q }); busy = true; renderLog();
    const out = document.createElement('div'); out.className = 'mzt-m a'; out.textContent = deep ? 'Réflexion approfondie…' : 'Réflexion…'; $('#mztLog').appendChild(out);
    $('#mztSend').disabled = true; $('#mztStop').hidden = false;
    const style = deep
      ? 'Réponse APPROFONDIE (400 à 700 mots) : 1) l\'intuition avec une analogie, 2) l\'explication détaillée pas à pas, 3) pourquoi ça marche, 4) un exemple complet chiffré, 5) les pièges fréquents et ce qui tombe à l\'examen, 6) une question pour vérifier la compréhension.'
      : 'Réponse EXPLICATIVE (150 à 250 mots) : 1) l\'idée en une phrase, 2) l\'explication pas à pas, 3) un petit exemple chiffré ou concret, 4) une courte question pour vérifier la compréhension.';
    const mem = [];
    if (ST.memos.length) mem.push('DIFFICULTÉS DÉJÀ REPÉRÉES :\n' + ST.memos.slice(-12).map((m) => `- ${m.date} : ${m.text}`).join('\n'));
    const lastQ = ST.threads.flatMap((t) => t.msgs.filter((m) => m.r === 'u').map((m) => `[${t.sec}] ${m.t.slice(0, 100)}`)).slice(-6);
    if (lastQ.length) mem.push('SES DERNIÈRES QUESTIONS :\n' + lastQ.map((x) => '- ' + x).join('\n'));
    const rules = `Tu es le tuteur de ${C.student}, pour le module ${C.module}${C.prof ? ' du ' + C.prof : ''}. Il apprend souvent la notion pour la première fois.
Règles : réponds en français simple, en Markdown léger (**gras** pour les termes clés, tirets, étapes numérotées, formules et calculs entre accents graves ; pas de tableaux). ${style} Appuie-toi d'abord sur l'EXTRAIT ci-dessous et sur les conventions du prof ; si une source générale diffère du cours, signale l'écart et dis quelle version utiliser à l'examen (celle du prof). Pour un calcul, pose chaque étape et vérifie-la. S'il envoie une réponse ou une photo de brouillon, corrige étape par étape et nomme précisément l'erreur. Si tu n'es pas sûr, dis-le. S'il demande un mini-exercice, donne l'exercice sans la solution.
Utilise sa mémoire pour faire des liens avec ses confusions passées, sans la réciter.
Termine TOUJOURS par une dernière ligne séparée au format exact « MÉMO: … » qui résume en 15 mots maximum la difficulté révélée par sa question (ou « MÉMO: rien »). Cette ligne lui est cachée.
${C.conventions ? 'CONVENTIONS DU PROF : ' + C.conventions + '\n' : ''}MÉMOIRE DE L'ÉLÈVE :
${mem.join('\n\n') || '(rien pour l\'instant)'}
EXTRAIT (${c.label}) :
${c.text.slice(0, deep ? 9000 : 3500)}`;
    const recent = cur.msgs.slice(deep ? -9 : -5, -1).map((m) => ({ role: m.r === 'u' ? 'user' : 'assistant', content: m.t }));
    while (recent.length && recent[0].role !== 'user') recent.shift();
    const msgs = [...recent.filter((m) => m.content && m.content.trim()), { role: 'user', content: q }]; while (msgs.length > 1 && msgs[0].role !== 'user') msgs.shift(); msgs[0] = { role: 'user', content: rules + '\n\n---\nQuestion : ' + msgs[0].content };
    ctl = new AbortController();
    const opts = { modelTier: deep ? 'complex' : 'quick', cache: false, signal: ctl.signal, onText: ({ text }) => { out.innerHTML = md(visible(text)); $('#mztLog').scrollTop = 1e9; } };
    if (img) opts.images = [img];
    try {
      const r = await sample(msgs, opts);
      const mm = r.text.match(/(?:^|\n)\s*M[ÉE]MO\s*:\s*(.+)\s*$/i);
      cur.msgs.push({ r: 'a', t: visible(r.text) + (r.truncated ? '\n\n(Réponse coupée : pose une question plus ciblée.)' : ''), d: !!deep });
      if (mm && !/^\s*rien/i.test(mm[1])) { ST.memos.push({ date: today(), text: mm[1].trim().slice(0, 160) }); if (ST.memos.length > 30) ST.memos.shift(); saveMemos(); }
      await saveThread(cur);
    } catch (e) {
      const kept = e && e.text ? visible(e.text) : '';
      if (e && e.code === 'cancelled') { if (kept) cur.msgs.push({ r: 'a', t: kept + '\n(Arrêté.)' }); else cur.msgs.pop(); }
      else { cur.msgs.pop(); out.textContent = (kept ? kept + '\n\n' : '') + (ERR[e && e.code] || 'Le tuteur n\'a pas pu répondre. Réessaie dans un instant.'); }
      if (!cur.msgs.length) ST.threads = ST.threads.filter((t) => t !== cur);
      saveLocal();
      if (!(e && e.code === 'cancelled')) { busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImgN').textContent = ''; return; }
    }
    busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImg').value = ''; $('#mztImgN').textContent = ''; renderLog();
  }

  // ---------- événements ----------
  $('#mztBtn').onclick = () => openPanel(null);
  $('#mztX').onclick = closePanel;
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#mztPan').hidden) closePanel(); });
  $('#mztTabH').onclick = () => view($('#mztHist').hidden ? 'hist' : 'chat');
  $('#mztTabM').onclick = () => view($('#mztMem').hidden ? 'mem' : 'chat');
  $('#mztQ').oninput = renderList;
  $('#mztList').onclick = (e) => { const id = e.target.dataset && e.target.dataset.cont; if (!id) return; cur = ST.threads.find((t) => t.id === id); view('chat'); $('#mztCtx').textContent = '· ' + cur.sec; renderLog(); };
  $('#mztMemL').onclick = (e) => { const i = e.target.dataset && e.target.dataset.memdel; if (i == null) return; ST.memos.splice(+i, 1); saveMemos(); renderMem(); };
  $('#mztChips').onclick = (e) => { const b = e.target.closest('[data-chip]'); if (!b) return; const t = $('#mztIn'); t.value = b.dataset.chip + (t.value ? ' : ' + t.value : ''); t.focus(); };
  $('#mztNew').onclick = () => { cur = null; renderLog(); };
  $('#mztStop').onclick = () => { if (ctl) ctl.abort(); };
  $('#mztImg').onchange = (e) => { img = e.target.files[0] || null; $('#mztImgN').textContent = img ? 'Photo : ' + img.name : ''; };
  $('#mztF').onsubmit = (e) => { e.preventDefault(); const v = $('#mztIn').value; $('#mztIn').value = ''; ask(v); };
  $('#mztIn').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#mztF').requestSubmit(); } });

  // ---------- capacités (facultatives) ----------
  const W = window.claude;
  if (W && W.use) {
    W.use('sample').then((s) => { sample = s; ready = true; note();
      if (s && s.limits) s.limits().then((l) => { if (l && l.images) { imgOK = true; $('#mztImgL').hidden = false; if (l.images.mediaTypes) $('#mztImg').accept = l.images.mediaTypes.join(','); } }).catch(() => {});
    }).catch(() => { ready = true; note(); });
    Promise.all([W.use('db'), W.use('user')]).then(async ([d, u]) => {
      if (!d || !u) return; const id = await u.id(); if (!id) return; db = d; base = 'data/users/' + id + '/mzt_' + C.id;
      try {
        const m = await db.doc(base).get(); if (m.exists) { const v = m.data() || {}; if (Array.isArray(v.memos)) ST.memos = JSON.parse(JSON.stringify(v.memos)); }
        const q = await db.collection(base + '/threads').get(); const remote = q.docs.map((x) => Object.assign({ id: x.id }, JSON.parse(JSON.stringify(x.data() || {}))));
        const map = {}; [...ST.threads, ...remote].forEach((t) => { if (!map[t.id] || (t.msgs || []).length > (map[t.id].msgs || []).length) map[t.id] = t; });
        ST.threads = Object.values(map).sort((a, b) => parseInt(a.id.slice(1), 36) - parseInt(b.id.slice(1), 36)); saveLocal();
      } catch (e) {}
    }).catch(() => {});
  } else { ready = true; note(); }

  window.MZT = { open: openPanel, close: closePanel };
})();

</script>

if(window.top===window&&location.protocol==="file:"){a.hidden=true;return}
a.href=p.indexOf("/decouvrir")===0||location.pathname.indexOf("/decouvrir")===0?"/decouvrir":"/app/modules";})();</script>
