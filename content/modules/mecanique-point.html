const MODULE={"slug":"mecanique-point","titre":"Mécanique du point","cle":"mecanique-point_scores","cleEtat":"mecanique-point_scores_etat","format":"score10","intro":"<p>Ce module suit le <strong>cours de Mécanique du point matériel du Pr M. Driouich<\/strong> (FSABM, S1) et ses trois séries de TD corrigées.<\/p>\n<p><strong>Chaque chapitre a trois temps<\/strong><\/p>\n<ol>\n<li><strong>Avant de commencer<\/strong> : ce qu&#39;il faut déjà savoir, avec une question pour vérifier.<\/li>\n<li><strong>Comment l&#39;aborder<\/strong> : l&#39;état d&#39;esprit et le piège classique.<\/li>\n<li><strong>Les idées, illustrées<\/strong> : un schéma, une phrase, un exemple chiffré, puis exercices, flashcards et QCM.<\/li>\n<\/ol>\n<p>Termine chaque chapitre par le QCM : <strong>8/10 = chapitre maîtrisé<\/strong>.<\/p>\n<p><strong>Ce qui est sûr<\/strong> : le plan, les notations et les exemples viennent du polycopié (58 pages) et des séries 1 à 3 corrigées. Les corrections des séries sont manuscrites ; quand nous y avons trouvé une erreur, elle est signalée.<\/p>\n<p><strong>À vérifier<\/strong> : aucune annale de contrôle ne nous a été fournie. L&#39;examen blanc est construit sur le modèle des séries.<\/p>\n","annexes":[],"cartes":null,"maths":true};
const CHAPS=[{"id":"vecteurs","t":"Vecteurs, bases et produits","seance":"Chapitre I · Rappels mathématiques (I à III)","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu dois savoir calculer une racine carrée et utiliser le théorème de Pythagore : la longueur de la diagonale d&#39;un rectangle de côtés $a$ et $b$ vaut $\\sqrt{a^2+b^2}$.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Un rectangle a pour côtés 3 et 4. Quelle est la longueur de sa diagonale ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 5<\/b><\/p><p>$\\sqrt{3^2+4^2} = \\sqrt{25} = 5$. La norme d&#39;un vecteur, c&#39;est exactement ce calcul, avec une troisième coordonnée en plus.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Un vecteur, c&#39;est quatre informations<\/strong> : module, support (direction), sens, origine. Le produit scalaire répond à « sont-ils alignés ? », le produit vectoriel à « quel plan forment-ils ? ».<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Écrire $\\vec u \\wedge \\vec v = \\vec v \\wedge \\vec u$. Le produit vectoriel est <strong>antisymétrique<\/strong> : $\\vec v \\wedge \\vec u = -\\,\\vec u \\wedge \\vec v$. Échanger l&#39;ordre change le signe.<\/p>\n<\/aside><p>À la fin, tu sais calculer une norme, un vecteur unitaire, un angle, un produit vectoriel et un produit mixte dans une base orthonormée directe.<\/p>\n<h2>Idée 1 · Repère, base orthonormée directe<\/h2>\n<p>Un repère d&#39;espace $\\mathcal R(O, x, y, z)$ = une origine $O$ et trois axes non coplanaires. Il est <strong>orthonormé direct<\/strong> si les vecteurs unitaires $(\\vec i, \\vec j, \\vec k)$ sont orthogonaux deux à deux, de norme 1, et respectent la <strong>règle du tire-bouchon<\/strong> : en tournant de $\\vec i$ vers $\\vec j$, le tire-bouchon avance vers $\\vec k$.<\/p>\n<svg viewBox=\"0 0 420 200\" role=\"img\" aria-label=\"Repère orthonormé direct : i, j, k avec la règle du tire-bouchon\" style=\"max-width:100%;height:auto\"><g stroke=\"currentColor\" stroke-width=\"2\" fill=\"none\"><path d=\"M200 140V30\"/><path d=\"M200 140H330\"/><path d=\"M200 140L120 185\"/><\/g><g stroke=\"#D9824F\" stroke-width=\"2\" fill=\"none\"><path d=\"M245 120A40 22 0 0 1 180 115\"/><\/g><g font-family=\"sans-serif\" font-size=\"14\" fill=\"currentColor\"><text x=\"206\" y=\"34\">k<\/text><text x=\"334\" y=\"145\">j<\/text><text x=\"104\" y=\"190\">i<\/text><text x=\"186\" y=\"158\">O<\/text><text x=\"250\" y=\"100\" fill=\"#D9824F\">de i vers j : on avance selon k<\/text><\/g><\/svg><p>Repère d&#39;espace + repère de temps (horloge, en secondes) = <strong>référentiel<\/strong>.<\/p>\n<p>Tout vecteur s&#39;écrit de façon unique $\\vec V = v_1\\vec i + v_2\\vec j + v_3\\vec k$. En 3D, $\\overrightarrow{OM} = x\\vec i + y\\vec j + z\\vec k$ : on note $M(x, y, z)$.<\/p>\n<h2>Idée 2 · Produit scalaire : norme, angle, orthogonalité<\/h2>\n<p>$$\\vec u\\cdot\\vec v = u_1v_1 + u_2v_2 + u_3v_3 = \\|\\vec u\\|\\,\\|\\vec v\\|\\cos(\\vec u,\\vec v)$$<\/p>\n<ul>\n<li>Norme : $\\|\\vec u\\| = \\sqrt{\\vec u\\cdot\\vec u} = \\sqrt{u_1^2+u_2^2+u_3^2}$.<\/li>\n<li>Vecteur unitaire porté par $\\vec A$ : $\\vec u_A = \\vec A / \\|\\vec A\\|$.<\/li>\n<li>$\\vec u \\perp \\vec v \\iff \\vec u\\cdot\\vec v = 0$.<\/li>\n<li>Le produit scalaire ne dépend pas de la base, <strong>mais<\/strong> les deux vecteurs doivent être écrits dans la même base pour le calculer.<\/li>\n<\/ul>\n<p>Exemple (série 1) : $\\vec A(3, 2, \\sqrt3)$ donne $\\|\\vec A\\| = \\sqrt{9+4+3} = 4$ et $\\vec u_A = \\left(\\tfrac34, \\tfrac12, \\tfrac{\\sqrt3}{4}\\right)$.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Angle entre deux vecteurs<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Écris les deux vecteurs dans la même base<\/div><p>par exemple $\\vec u(1,0,1)$ et $\\vec v(0,1,1)$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Calcule le produit scalaire<\/div><p>$\\vec u\\cdot\\vec v = 0 + 0 + 1 = 1$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Calcule les normes<\/div><p>$\\|\\vec u\\| = \\|\\vec v\\| = \\sqrt2$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Divise<\/div><p>$\\cos\\theta = \\dfrac{1}{\\sqrt2\\cdot\\sqrt2} = \\dfrac12$, donc $\\theta = 60°$.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Idée 3 · Produit vectoriel et produit mixte<\/h2>\n<p>$\\vec u\\wedge\\vec v$ est un vecteur :<\/p>\n<ul>\n<li>de module $\\|\\vec u\\|\\,\\|\\vec v\\|\\,|\\sin(\\vec u,\\vec v)|$ (l&#39;aire du parallélogramme) ;<\/li>\n<li>perpendiculaire au plan de $\\vec u$ et $\\vec v$ ;<\/li>\n<li>tel que $(\\vec u, \\vec v, \\vec u\\wedge\\vec v)$ soit direct.<\/li>\n<\/ul>\n<svg viewBox=\"0 0 420 200\" role=\"img\" aria-label=\"Produit vectoriel perpendiculaire au plan formé par u et v\" style=\"max-width:100%;height:auto\"><path d=\"M120 150L260 150L330 100L190 100Z\" fill=\"#D9824F\" opacity=\"0.15\"/><g stroke=\"currentColor\" stroke-width=\"2\" fill=\"none\"><path d=\"M120 150H260\"/><path d=\"M120 150L190 100\"/><\/g><path d=\"M120 150V40\" stroke=\"#D9824F\" stroke-width=\"2.5\"/><g font-family=\"sans-serif\" font-size=\"14\" fill=\"currentColor\"><text x=\"262\" y=\"168\">u<\/text><text x=\"194\" y=\"94\">v<\/text><text x=\"128\" y=\"46\" fill=\"#D9824F\">u ∧ v<\/text><text x=\"230\" y=\"130\">aire = ‖u ∧ v‖<\/text><\/g><\/svg><p>En composantes :<\/p>\n<p>$$\\vec u\\wedge\\vec v = (u_2v_3 - u_3v_2)\\,\\vec i - (u_1v_3 - u_3v_1)\\,\\vec j + (u_1v_2 - u_2v_1)\\,\\vec k$$<\/p>\n<p>Base directe : $\\vec i\\wedge\\vec j = \\vec k$, $\\vec j\\wedge\\vec k = \\vec i$, $\\vec k\\wedge\\vec i = \\vec j$.<\/p>\n<ul>\n<li>$\\vec u \\parallel \\vec v \\iff \\vec u\\wedge\\vec v = \\vec 0$.<\/li>\n<li>Double produit vectoriel : $\\vec u\\wedge(\\vec v\\wedge\\vec w) = (\\vec u\\cdot\\vec w)\\,\\vec v - (\\vec u\\cdot\\vec v)\\,\\vec w$.<\/li>\n<li>Produit mixte : $(\\vec u, \\vec v, \\vec w) = \\vec u\\cdot(\\vec v\\wedge\\vec w)$, un scalaire, invariant par permutation circulaire. Il est <strong>non nul<\/strong> si et seulement si les trois vecteurs ne sont pas coplanaires : ils forment alors une base.<\/li>\n<\/ul>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Pour montrer que trois vecteurs forment une base : calcule leur produit mixte. S&#39;il est non nul, c&#39;est une base. Pour dire qu&#39;elle est <strong>normée<\/strong>, vérifie en plus que chaque vecteur a une norme 1.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Série 1, exercice 1 (extrait)<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Soit $\\vec B(2, \\sqrt3, \\sqrt2)$. Calcule $\\|\\vec B\\|$.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 3<\/b><\/p><p>$\\|\\vec B\\| = \\sqrt{4 + 3 + 2} = \\sqrt9 = 3$, donc $\\vec u_B = \\left(\\tfrac23, \\tfrac{\\sqrt3}{3}, \\tfrac{\\sqrt2}{3}\\right)$.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Avec $\\vec C(1, 2, 2)$, calcule $\\|\\vec C\\|$, puis $\\cos\\theta_A = \\vec u_B\\cdot\\vec u_C$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>$\\vec u_C = (1/3, 2/3, 2/3)$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>$\\|\\vec C\\| = 3$. $\\cos\\theta_A = \\tfrac23\\cdot\\tfrac13 + \\tfrac{\\sqrt3}{3}\\cdot\\tfrac23 + \\tfrac{\\sqrt2}{3}\\cdot\\tfrac23 = \\dfrac{2 + 2\\sqrt3 + 2\\sqrt2}{9} \\approx 0{,}921$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Produit vectoriel<\/h3><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Calcule $\\vec i\\wedge(\\vec i + \\vec k)$ dans une base orthonormée directe.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$\\vec i\\wedge\\vec i + \\vec i\\wedge\\vec k = \\vec 0 - \\vec j = -\\vec j$ (car $\\vec k\\wedge\\vec i = \\vec j$, donc $\\vec i\\wedge\\vec k = -\\vec j$).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Les vecteurs $(1,0,0)$, $(1,1,0)$ et $(1,1,1)$ forment-ils une base ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Produit mixte : déterminant de la matrice triangulaire, égal à $1\\times1\\times1 = 1 \\ne 0$. Oui, c&#39;est une base (non orthonormée).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">La norme de $\\vec A(3, 2, \\sqrt3)$ vaut :<\/div><button class=\"opt\" data-o=\"0\">$3 + 2 + \\sqrt3$<\/button><button class=\"opt\" data-o=\"1\">4<\/button><button class=\"opt\" data-o=\"2\">16<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">$\\vec u\\cdot\\vec v = 0$ avec $\\vec u, \\vec v$ non nuls signifie :<\/div><button class=\"opt\" data-o=\"0\">$\\vec u \\parallel \\vec v$<\/button><button class=\"opt\" data-o=\"1\">$\\vec u \\perp \\vec v$<\/button><button class=\"opt\" data-o=\"2\">$\\vec u = -\\vec v$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">$\\vec k\\wedge\\vec i$ vaut, en base orthonormée directe :<\/div><button class=\"opt\" data-o=\"0\">$-\\vec j$<\/button><button class=\"opt\" data-o=\"1\">$\\vec j$<\/button><button class=\"opt\" data-o=\"2\">$\\vec 0$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">$\\vec v\\wedge\\vec u$ est égal à :<\/div><button class=\"opt\" data-o=\"0\">$\\vec u\\wedge\\vec v$<\/button><button class=\"opt\" data-o=\"1\">$-\\,\\vec u\\wedge\\vec v$<\/button><button class=\"opt\" data-o=\"2\">$\\vec u\\cdot\\vec v$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Le module de $\\vec u\\wedge\\vec v$ vaut :<\/div><button class=\"opt\" data-o=\"0\">$\\|\\vec u\\|\\,\\|\\vec v\\|\\cos\\theta$<\/button><button class=\"opt\" data-o=\"1\">$\\|\\vec u\\|\\,\\|\\vec v\\|\\,|\\sin\\theta|$<\/button><button class=\"opt\" data-o=\"2\">$\\|\\vec u\\| + \\|\\vec v\\|$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Le produit mixte $(\\vec u, \\vec v, \\vec w)$ est :<\/div><button class=\"opt\" data-o=\"0\">un vecteur<\/button><button class=\"opt\" data-o=\"1\">un scalaire<\/button><button class=\"opt\" data-o=\"2\">toujours nul<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Un produit mixte nul signifie que les trois vecteurs sont :<\/div><button class=\"opt\" data-o=\"0\">coplanaires<\/button><button class=\"opt\" data-o=\"1\">orthogonaux deux à deux<\/button><button class=\"opt\" data-o=\"2\">unitaires<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Le vecteur unitaire porté par $\\vec A$ est :<\/div><button class=\"opt\" data-o=\"0\">$\\vec A\\,\\|\\vec A\\|$<\/button><button class=\"opt\" data-o=\"1\">$\\vec A/\\|\\vec A\\|$<\/button><button class=\"opt\" data-o=\"2\">$\\|\\vec A\\|/\\vec A$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Une grandeur scalaire comme la masse :<\/div><button class=\"opt\" data-o=\"0\">ne dépend pas du repère d&#39;observation<\/button><button class=\"opt\" data-o=\"1\">dépend du repère d&#39;observation<\/button><button class=\"opt\" data-o=\"2\">est toujours un vecteur unitaire<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">$\\vec u\\wedge(\\vec v\\wedge\\vec w)$ vaut :<\/div><button class=\"opt\" data-o=\"0\">$(\\vec u\\cdot\\vec v)\\vec w - (\\vec u\\cdot\\vec w)\\vec v$<\/button><button class=\"opt\" data-o=\"1\">$(\\vec u\\cdot\\vec w)\\vec v - (\\vec u\\cdot\\vec v)\\vec w$<\/button><button class=\"opt\" data-o=\"2\">$\\vec 0$ toujours<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"vecteurs","rep":["5"],"tol":null},{"n":"vecteurs","rep":["3"],"tol":null},{"n":"vecteurs","rep":null,"tol":null},{"n":"vecteurs","rep":null,"tol":null},{"n":"vecteurs","rep":null,"tol":null}],"qcm":[{"n":"vecteurs","q":"La norme de $\\vec A(3, 2, \\sqrt3)$ vaut :","o":["$3 + 2 + \\sqrt3$","4","16"],"a":1,"e":"$\\sqrt{9 + 4 + 3} = \\sqrt{16} = 4$."},{"n":"vecteurs","q":"$\\vec u\\cdot\\vec v = 0$ avec $\\vec u, \\vec v$ non nuls signifie :","o":["$\\vec u \\parallel \\vec v$","$\\vec u \\perp \\vec v$","$\\vec u = -\\vec v$"],"a":1,"e":"Le cosinus de l&#39;angle est nul : angle droit."},{"n":"vecteurs","q":"$\\vec k\\wedge\\vec i$ vaut, en base orthonormée directe :","o":["$-\\vec j$","$\\vec j$","$\\vec 0$"],"a":1,"e":"Permutation circulaire $(\\vec k, \\vec i, \\vec j)$ : $\\vec k\\wedge\\vec i = \\vec j$."},{"n":"vecteurs","q":"$\\vec v\\wedge\\vec u$ est égal à :","o":["$\\vec u\\wedge\\vec v$","$-\\,\\vec u\\wedge\\vec v$","$\\vec u\\cdot\\vec v$"],"a":1,"e":"Le produit vectoriel est antisymétrique."},{"n":"vecteurs","q":"Le module de $\\vec u\\wedge\\vec v$ vaut :","o":["$\\|\\vec u\\|\\,\\|\\vec v\\|\\cos\\theta$","$\\|\\vec u\\|\\,\\|\\vec v\\|\\,|\\sin\\theta|$","$\\|\\vec u\\| + \\|\\vec v\\|$"],"a":1,"e":"C&#39;est l&#39;aire du parallélogramme construit sur $\\vec u$ et $\\vec v$."},{"n":"vecteurs","q":"Le produit mixte $(\\vec u, \\vec v, \\vec w)$ est :","o":["un vecteur","un scalaire","toujours nul"],"a":1,"e":"$\\vec u\\cdot(\\vec v\\wedge\\vec w)$ : un produit scalaire, donc un nombre."},{"n":"vecteurs","q":"Un produit mixte nul signifie que les trois vecteurs sont :","o":["coplanaires","orthogonaux deux à deux","unitaires"],"a":0,"e":"Ils sont dans un même plan, donc ne forment pas une base."},{"n":"vecteurs","q":"Le vecteur unitaire porté par $\\vec A$ est :","o":["$\\vec A\\,\\|\\vec A\\|$","$\\vec A/\\|\\vec A\\|$","$\\|\\vec A\\|/\\vec A$"],"a":1,"e":"On divise par la norme pour obtenir un vecteur de norme 1."},{"n":"vecteurs","q":"Une grandeur scalaire comme la masse :","o":["ne dépend pas du repère d&#39;observation","dépend du repère d&#39;observation","est toujours un vecteur unitaire"],"a":0,"e":"Le cours oppose grandeurs scalaires (masse, température) et vectorielles (vitesse, accélération), qui dépendent du repère."},{"n":"vecteurs","q":"$\\vec u\\wedge(\\vec v\\wedge\\vec w)$ vaut :","o":["$(\\vec u\\cdot\\vec v)\\vec w - (\\vec u\\cdot\\vec w)\\vec v$","$(\\vec u\\cdot\\vec w)\\vec v - (\\vec u\\cdot\\vec v)\\vec w$","$\\vec 0$ toujours"],"a":1,"e":"Formule du double produit vectoriel ; il appartient au plan $(\\vec v, \\vec w)$."}]},{"id":"coordonnees-operateurs","t":"Coordonnées et opérateurs (gradient, divergence, rotationnel)","seance":"Chapitre I · Rappels mathématiques (IV à VI)","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu dois savoir dériver $\\cos$ et $\\sin$ : $(\\cos\\varphi)' = -\\sin\\varphi$ et $(\\sin\\varphi)' = \\cos\\varphi$, et une dérivée partielle (on dérive par rapport à une variable, les autres restent constantes).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Soit $f(x,y) = x^2 y$. Que vaut $\\dfrac{\\partial f}{\\partial x}$ en $x = 3$, $y = 2$ ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 12<\/b><\/p><p>$\\dfrac{\\partial f}{\\partial x} = 2xy = 2\\times3\\times2 = 12$ ($y$ reste constant).<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Choisis les coordonnées qui suivent la symétrie.<\/strong> Un mouvement circulaire ? Cylindriques. Une sphère ? Sphériques. Le bon choix rend les calculs courts.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Croire que $\\vec e_\\rho$ et $\\vec e_\\varphi$ sont fixes. Ils <strong>tournent<\/strong> avec $M$ : $\\dfrac{d\\vec e_\\rho}{dt} = \\dot\\varphi\\,\\vec e_\\varphi$ et $\\dfrac{d\\vec e_\\varphi}{dt} = -\\dot\\varphi\\,\\vec e_\\rho$. Les oublier fausse toute vitesse.<\/p>\n<\/aside><p>À la fin, tu sais passer des cartésiennes aux cylindriques et sphériques, écrire $d\\overrightarrow{OM}$ et calculer gradient, divergence et rotationnel.<\/p>\n<h2>Idée 1 · Coordonnées cylindriques $(\\rho, \\varphi, z)$<\/h2>\n<svg viewBox=\"0 0 440 220\" role=\"img\" aria-label=\"Coordonnées cylindriques : projection m de M dans le plan xOy, rho = Om, angle phi, vecteurs e_rho et e_phi\" style=\"max-width:100%;height:auto\"><g stroke=\"currentColor\" stroke-width=\"1.6\" fill=\"none\"><path d=\"M150 160V20\"/><path d=\"M150 160H320\"/><path d=\"M150 160L70 205\"/><path d=\"M150 160L250 190\" stroke-dasharray=\"4 3\"/><path d=\"M250 190V70\" stroke-dasharray=\"4 3\"/><\/g><g stroke=\"#D9824F\" stroke-width=\"2.2\" fill=\"none\"><path d=\"M250 190L295 203\"/><path d=\"M250 190L275 160\"/><path d=\"M110 182A45 45 0 0 0 190 172\"/><\/g><g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\"><text x=\"156\" y=\"24\">z<\/text><text x=\"324\" y=\"164\">y<\/text><text x=\"58\" y=\"210\">x<\/text><text x=\"254\" y=\"66\">M<\/text><text x=\"254\" y=\"208\">m<\/text><text x=\"190\" y=\"190\">ρ<\/text><text x=\"140\" y=\"205\" fill=\"#D9824F\">φ<\/text><text x=\"298\" y=\"206\" fill=\"#D9824F\">e_ρ<\/text><text x=\"278\" y=\"156\" fill=\"#D9824F\">e_φ<\/text><\/g><\/svg><p>$m$ est la projection de $M$ dans le plan $(xOy)$ ; $\\rho = Om \\ge 0$, $\\varphi = (\\vec i, \\overrightarrow{Om}) \\in [0, 2\\pi[$, $z$ la cote.<\/p>\n<p>$$x = \\rho\\cos\\varphi,\\quad y = \\rho\\sin\\varphi,\\quad \\rho = \\sqrt{x^2+y^2}$$\n$$\\vec e_\\rho = \\cos\\varphi\\,\\vec i + \\sin\\varphi\\,\\vec j,\\qquad \\vec e_\\varphi = -\\sin\\varphi\\,\\vec i + \\cos\\varphi\\,\\vec j$$\n$$\\overrightarrow{OM} = \\rho\\,\\vec e_\\rho + z\\,\\vec e_z,\\qquad d\\overrightarrow{OM} = d\\rho\\,\\vec e_\\rho + \\rho\\,d\\varphi\\,\\vec e_\\varphi + dz\\,\\vec e_z$$<\/p>\n<p>Coordonnées polaires = cylindriques sans $z$ (mouvement plan).<\/p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>La dérivée d&#39;un vecteur unitaire n&#39;a <strong>pas<\/strong> de composante sur lui-même (car $\\vec u\\cdot\\vec u = 1$ donne $\\vec u\\cdot\\dfrac{d\\vec u}{dt} = 0$). On l&#39;écrit $\\dfrac{d\\vec u}{dt} = \\vec\\omega\\wedge\\vec u$ avec $\\vec\\omega = \\dot\\varphi\\,\\vec e_z$ (série 1, ex. 3).<\/p>\n<\/aside><h2>Idée 2 · Coordonnées sphériques $(r, \\theta, \\varphi)$<\/h2>\n<p>$r = OM \\ge 0$, $\\theta = (\\vec k, \\overrightarrow{OM}) \\in [0, \\pi]$ (colatitude), $\\varphi \\in [0, 2\\pi[$ (longitude).<\/p>\n<p>$$x = r\\sin\\theta\\cos\\varphi,\\quad y = r\\sin\\theta\\sin\\varphi,\\quad z = r\\cos\\theta$$\n$$\\overrightarrow{OM} = r\\,\\vec e_r,\\qquad d\\overrightarrow{OM} = dr\\,\\vec e_r + r\\,d\\theta\\,\\vec e_\\theta + r\\sin\\theta\\,d\\varphi\\,\\vec e_\\varphi$$<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Cartésiennes<\/th>\n<th>Cylindriques<\/th>\n<th>Sphériques<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>$\\overrightarrow{OM}$<\/td>\n<td>$x\\vec i + y\\vec j + z\\vec k$<\/td>\n<td>$\\rho\\vec e_\\rho + z\\vec e_z$<\/td>\n<td>$r\\vec e_r$<\/td>\n<\/tr>\n<tr>\n<td>Volume élémentaire<\/td>\n<td>$dx\\,dy\\,dz$<\/td>\n<td>$\\rho\\,d\\rho\\,d\\varphi\\,dz$<\/td>\n<td>$r^2\\sin\\theta\\,dr\\,d\\theta\\,d\\varphi$<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h2>Idée 3 · Gradient, divergence, rotationnel<\/h2>\n<p>L&#39;opérateur nabla en cartésiennes : $\\vec\\nabla = \\dfrac{\\partial}{\\partial x}\\vec i + \\dfrac{\\partial}{\\partial y}\\vec j + \\dfrac{\\partial}{\\partial z}\\vec k$.<\/p>\n<figure class=\"flux\"><figcaption>Ce que chaque opérateur prend et rend<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">grad : scalaire f → vecteur ∇f<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">div : vecteur A → scalaire ∇·A<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">rot : vecteur A → vecteur ∇∧A<\/div><\/div><\/figure><ul>\n<li>$\\overrightarrow{\\text{grad}}\\,f$ ; différentielle totale : $df = \\overrightarrow{\\text{grad}}\\,f\\cdot d\\overrightarrow{OM}$.<\/li>\n<li>En cylindriques : $\\overrightarrow{\\text{grad}}\\,f = \\dfrac{\\partial f}{\\partial\\rho}\\vec e_\\rho + \\dfrac1\\rho\\dfrac{\\partial f}{\\partial\\varphi}\\vec e_\\varphi + \\dfrac{\\partial f}{\\partial z}\\vec e_z$.<\/li>\n<li>En sphériques : $\\overrightarrow{\\text{grad}}\\,f = \\dfrac{\\partial f}{\\partial r}\\vec e_r + \\dfrac1r\\dfrac{\\partial f}{\\partial\\theta}\\vec e_\\theta + \\dfrac1{r\\sin\\theta}\\dfrac{\\partial f}{\\partial\\varphi}\\vec e_\\varphi$.<\/li>\n<li>Identités : $\\overrightarrow{\\text{rot}}(\\overrightarrow{\\text{grad}}\\,f) = \\vec 0$ et $\\text{div}(\\overrightarrow{\\text{rot}}\\,\\vec A) = 0$.<\/li>\n<\/ul>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Série 1, ex. 4 : div et rot de $\\vec f = x^2yz\\,\\vec i + xy^2z\\,\\vec j + z\\,\\vec k$<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Divergence<\/div><p>$\\dfrac{\\partial(x^2yz)}{\\partial x} + \\dfrac{\\partial(xy^2z)}{\\partial y} + \\dfrac{\\partial z}{\\partial z} = 2xyz + 2xyz + 1 = 4xyz + 1$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · Rotationnel, composante $\\vec i$<\/div><p>$\\dfrac{\\partial f_z}{\\partial y} - \\dfrac{\\partial f_y}{\\partial z} = 0 - xy^2 = -xy^2$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · Composante $\\vec j$<\/div><p>$\\dfrac{\\partial f_x}{\\partial z} - \\dfrac{\\partial f_z}{\\partial x} = x^2y - 0 = x^2y$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · Composante $\\vec k$<\/div><p>$\\dfrac{\\partial f_y}{\\partial x} - \\dfrac{\\partial f_x}{\\partial y} = y^2z - x^2z$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · Résultat<\/div><p>$\\overrightarrow{\\text{rot}}\\,\\vec f = -xy^2\\,\\vec i + x^2y\\,\\vec j + (y^2 - x^2)z\\,\\vec k$.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Série 1, exercice 4<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>$f(x,y,z) = r^2$ avec $r = \\|\\overrightarrow{OM}\\|$. Calcule $\\overrightarrow{\\text{grad}}\\,f$ et $df$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$f = x^2+y^2+z^2$, donc $\\overrightarrow{\\text{grad}}\\,f = 2x\\vec i + 2y\\vec j + 2z\\vec k = 2\\overrightarrow{OM}$ et $df = 2x\\,dx + 2y\\,dy + 2z\\,dz$. On vérifie bien $df = \\overrightarrow{\\text{grad}}\\,f\\cdot d\\overrightarrow{OM}$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>$f(M) = 3r^3\\sin^2\\theta\\cos\\theta\\sin 2\\varphi$. Exprime $f$ en cartésiennes, puis $\\overrightarrow{\\text{grad}}\\,f$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>$\\sin 2\\varphi = 2\\sin\\varphi\\cos\\varphi$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>$f = 6\\,(r\\sin\\theta\\cos\\varphi)(r\\sin\\theta\\sin\\varphi)(r\\cos\\theta) = 6xyz$. Donc $\\overrightarrow{\\text{grad}}\\,f = 6yz\\,\\vec i + 6xz\\,\\vec j + 6xy\\,\\vec k$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Série 1, exercice 3<\/h3><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>$P$ se déplace dans $(xOy)$, coordonnées $(\\rho, \\varphi, 0)$. Calcule $\\dfrac{d\\vec e_\\rho}{dt}$ dans la base cartésienne, puis cylindrique.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$\\vec e_\\rho = \\cos\\varphi\\,\\vec i + \\sin\\varphi\\,\\vec j$ donne $\\dfrac{d\\vec e_\\rho}{dt} = \\dot\\varphi(-\\sin\\varphi\\,\\vec i + \\cos\\varphi\\,\\vec j) = \\dot\\varphi\\,\\vec e_\\varphi$. De même $\\dfrac{d\\vec e_\\varphi}{dt} = -\\dot\\varphi\\,\\vec e_\\rho$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">En cylindriques, $x$ vaut :<\/div><button class=\"opt\" data-o=\"0\">$\\rho\\cos\\varphi$<\/button><button class=\"opt\" data-o=\"1\">$\\rho\\sin\\varphi$<\/button><button class=\"opt\" data-o=\"2\">$r\\sin\\theta\\cos\\varphi$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">$\\dfrac{d\\vec e_\\rho}{dt}$ vaut :<\/div><button class=\"opt\" data-o=\"0\">$\\vec 0$<\/button><button class=\"opt\" data-o=\"1\">$\\dot\\varphi\\,\\vec e_\\varphi$<\/button><button class=\"opt\" data-o=\"2\">$-\\dot\\varphi\\,\\vec e_\\rho$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">En sphériques, l&#39;angle $\\theta$ est mesuré à partir de :<\/div><button class=\"opt\" data-o=\"0\">l&#39;axe $Oz$<\/button><button class=\"opt\" data-o=\"1\">l&#39;axe $Ox$<\/button><button class=\"opt\" data-o=\"2\">le plan $(xOy)$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Le gradient d&#39;un champ scalaire est :<\/div><button class=\"opt\" data-o=\"0\">un vecteur<\/button><button class=\"opt\" data-o=\"1\">un scalaire<\/button><button class=\"opt\" data-o=\"2\">toujours nul<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">La divergence de $\\vec f = x^2yz\\,\\vec i + xy^2z\\,\\vec j + z\\,\\vec k$ vaut :<\/div><button class=\"opt\" data-o=\"0\">$2xyz$<\/button><button class=\"opt\" data-o=\"1\">$4xyz + 1$<\/button><button class=\"opt\" data-o=\"2\">$x^2 + y^2 + 1$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">$\\overrightarrow{\\text{grad}}(x^2+y^2+z^2)$ vaut :<\/div><button class=\"opt\" data-o=\"0\">$\\overrightarrow{OM}$<\/button><button class=\"opt\" data-o=\"1\">$2\\,\\overrightarrow{OM}$<\/button><button class=\"opt\" data-o=\"2\">$r^2$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">La composante $\\vec e_\\varphi$ du gradient en cylindriques est :<\/div><button class=\"opt\" data-o=\"0\">$\\partial f/\\partial\\varphi$<\/button><button class=\"opt\" data-o=\"1\">$\\dfrac1\\rho\\,\\partial f/\\partial\\varphi$<\/button><button class=\"opt\" data-o=\"2\">$\\rho\\,\\partial f/\\partial\\varphi$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">La dérivée d&#39;un vecteur unitaire est :<\/div><button class=\"opt\" data-o=\"0\">perpendiculaire à ce vecteur<\/button><button class=\"opt\" data-o=\"1\">parallèle à ce vecteur<\/button><button class=\"opt\" data-o=\"2\">toujours nulle<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Le volume élémentaire en sphériques est :<\/div><button class=\"opt\" data-o=\"0\">$dr\\,d\\theta\\,d\\varphi$<\/button><button class=\"opt\" data-o=\"1\">$r^2\\sin\\theta\\,dr\\,d\\theta\\,d\\varphi$<\/button><button class=\"opt\" data-o=\"2\">$r\\,dr\\,d\\theta\\,d\\varphi$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">$\\text{div}(\\overrightarrow{\\text{rot}}\\,\\vec A)$ vaut :<\/div><button class=\"opt\" data-o=\"0\">0<\/button><button class=\"opt\" data-o=\"1\">$\\vec 0$<\/button><button class=\"opt\" data-o=\"2\">$\\overrightarrow{\\text{grad}}\\,A$<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"coordonnees-operateurs","rep":["12"],"tol":null},{"n":"coordonnees-operateurs","rep":null,"tol":null},{"n":"coordonnees-operateurs","rep":null,"tol":null},{"n":"coordonnees-operateurs","rep":null,"tol":null}],"qcm":[{"n":"coordonnees-operateurs","q":"En cylindriques, $x$ vaut :","o":["$\\rho\\cos\\varphi$","$\\rho\\sin\\varphi$","$r\\sin\\theta\\cos\\varphi$"],"a":0,"e":"$\\rho$ est la distance dans le plan $(xOy)$."},{"n":"coordonnees-operateurs","q":"$\\dfrac{d\\vec e_\\rho}{dt}$ vaut :","o":["$\\vec 0$","$\\dot\\varphi\\,\\vec e_\\varphi$","$-\\dot\\varphi\\,\\vec e_\\rho$"],"a":1,"e":"$\\vec e_\\rho$ tourne avec $M$ à la vitesse angulaire $\\dot\\varphi$."},{"n":"coordonnees-operateurs","q":"En sphériques, l&#39;angle $\\theta$ est mesuré à partir de :","o":["l&#39;axe $Oz$","l&#39;axe $Ox$","le plan $(xOy)$"],"a":0,"e":"$\\theta = (\\vec k, \\overrightarrow{OM})$, entre $0$ et $\\pi$."},{"n":"coordonnees-operateurs","q":"Le gradient d&#39;un champ scalaire est :","o":["un vecteur","un scalaire","toujours nul"],"a":0,"e":"Il pointe dans la direction où $f$ augmente le plus vite."},{"n":"coordonnees-operateurs","q":"La divergence de $\\vec f = x^2yz\\,\\vec i + xy^2z\\,\\vec j + z\\,\\vec k$ vaut :","o":["$2xyz$","$4xyz + 1$","$x^2 + y^2 + 1$"],"a":1,"e":"$2xyz + 2xyz + 1$."},{"n":"coordonnees-operateurs","q":"$\\overrightarrow{\\text{grad}}(x^2+y^2+z^2)$ vaut :","o":["$\\overrightarrow{OM}$","$2\\,\\overrightarrow{OM}$","$r^2$"],"a":1,"e":"$2x\\vec i + 2y\\vec j + 2z\\vec k$."},{"n":"coordonnees-operateurs","q":"La composante $\\vec e_\\varphi$ du gradient en cylindriques est :","o":["$\\partial f/\\partial\\varphi$","$\\dfrac1\\rho\\,\\partial f/\\partial\\varphi$","$\\rho\\,\\partial f/\\partial\\varphi$"],"a":1,"e":"Car le déplacement sur $\\vec e_\\varphi$ vaut $\\rho\\,d\\varphi$."},{"n":"coordonnees-operateurs","q":"La dérivée d&#39;un vecteur unitaire est :","o":["perpendiculaire à ce vecteur","parallèle à ce vecteur","toujours nulle"],"a":0,"e":"Dériver $\\vec u\\cdot\\vec u = 1$ donne $2\\,\\vec u\\cdot\\dot{\\vec u} = 0$."},{"n":"coordonnees-operateurs","q":"Le volume élémentaire en sphériques est :","o":["$dr\\,d\\theta\\,d\\varphi$","$r^2\\sin\\theta\\,dr\\,d\\theta\\,d\\varphi$","$r\\,dr\\,d\\theta\\,d\\varphi$"],"a":1,"e":"Produit des trois déplacements $dr$, $r\\,d\\theta$, $r\\sin\\theta\\,d\\varphi$."},{"n":"coordonnees-operateurs","q":"$\\text{div}(\\overrightarrow{\\text{rot}}\\,\\vec A)$ vaut :","o":["0","$\\vec 0$","$\\overrightarrow{\\text{grad}}\\,A$"],"a":0,"e":"Identité du cours ; c&#39;est un scalaire nul."}]},{"id":"cinematique","t":"Cinématique · vitesse et accélération","seance":"Chapitre II · Cinématique du point matériel","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il te faut les bases du chapitre 2 : $\\overrightarrow{OM}$ en cylindriques et $\\dfrac{d\\vec e_\\rho}{dt} = \\dot\\varphi\\,\\vec e_\\varphi$.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>$x(t) = t - 1$. Que vaut $\\dot x$ ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1<\/b><\/p><p>$\\dot x = dx/dt = 1$. Le point au-dessus signifie « dérivée par rapport au temps ».<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Tout part de $\\overrightarrow{OM}$.<\/strong> Écris la position, dérive une fois (vitesse), dérive encore (accélération). La seule difficulté : dériver aussi les vecteurs de base qui tournent.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Une vitesse ou une accélération n&#39;a de sens que <strong>par rapport à un référentiel<\/strong> : on écrit $\\vec V(M/\\mathcal R)$, jamais $\\vec V$ tout court, dès qu&#39;il y a deux repères.<\/p>\n<\/aside><p>À la fin, tu sais trouver la trajectoire, la vitesse et l&#39;accélération en cartésiennes et en cylindriques.<\/p>\n<h2>Idée 1 · Trajectoire, vitesse, accélération<\/h2>\n<figure class=\"flux\"><figcaption>Une dérivation à chaque étape<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">position OM(t)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">vitesse V = dOM/dt|R<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">accélération γ = dV/dt|R<\/div><\/div><\/figure><ul>\n<li><strong>Trajectoire<\/strong> : ensemble des positions de $M$ ; on l&#39;obtient en <strong>éliminant $t$<\/strong> entre les équations horaires.<\/li>\n<li>$\\vec V(M/\\mathcal R) = \\dfrac{d\\overrightarrow{OM}}{dt}\\Big|_{\\mathcal R}$ (m/s) ; $\\vec\\gamma(M/\\mathcal R) = \\dfrac{d\\vec V}{dt}\\Big|_{\\mathcal R}$ (m/s²).<\/li>\n<li>Cartésiennes (base fixe) : $\\vec V = \\dot x\\vec i + \\dot y\\vec j + \\dot z\\vec k$, $\\vec\\gamma = \\ddot x\\vec i + \\ddot y\\vec j + \\ddot z\\vec k$.<\/li>\n<\/ul>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Série 2, ex. 1 : $x = t - 1$, $y = -t^2 + 1$, $z = 0$<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · Élimine $t$<\/div><p>$t = x + 1$, donc $y = -(x+1)^2 + 1 = -x^2 - 2x$ : une <strong>parabole<\/strong>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · Vitesse<\/div><p>$\\vec V = \\vec i - 2t\\,\\vec j$, et $\\|\\vec V\\| = \\sqrt{1 + 4t^2}$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · Accélération<\/div><p>$\\vec\\gamma = -2\\,\\vec j$ (constante).<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Idée 2 · En cylindriques (polaires)<\/h2>\n<svg viewBox=\"0 0 420 210\" role=\"img\" aria-label=\"Vitesse en polaires : composante radiale rho point selon e_rho et orthoradiale rho phi point selon e_phi\" style=\"max-width:100%;height:auto\"><g stroke=\"currentColor\" stroke-width=\"1.6\" fill=\"none\"><path d=\"M60 180H380\"/><path d=\"M60 180V20\"/><path d=\"M60 180L230 90\"/><\/g><g stroke=\"#D9824F\" stroke-width=\"2.4\"><path d=\"M230 90L300 53\"/><path d=\"M230 90L267 160\"/><\/g><g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\"><text x=\"236\" y=\"86\">M<\/text><text x=\"300\" y=\"48\" fill=\"#D9824F\">ρ̇ e_ρ<\/text><text x=\"272\" y=\"168\" fill=\"#D9824F\">ρφ̇ e_φ<\/text><text x=\"130\" y=\"128\">ρ<\/text><\/g><\/svg><p>En dérivant $\\overrightarrow{OM} = \\rho\\,\\vec e_\\rho + z\\,\\vec e_z$ :<\/p>\n<p>$$\\vec V = \\dot\\rho\\,\\vec e_\\rho + \\rho\\dot\\varphi\\,\\vec e_\\varphi + \\dot z\\,\\vec e_z$$\n$$\\vec\\gamma = (\\ddot\\rho - \\rho\\dot\\varphi^2)\\,\\vec e_\\rho + (2\\dot\\rho\\dot\\varphi + \\rho\\ddot\\varphi)\\,\\vec e_\\varphi + \\ddot z\\,\\vec e_z$$<\/p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Le terme $-\\rho\\dot\\varphi^2$ est l&#39;accélération <strong>centripète<\/strong>. Le terme $2\\dot\\rho\\dot\\varphi$ apparaît dès que $\\rho$ et $\\varphi$ varient ensemble.<\/p>\n<\/aside><p>Exemple chiffré : cercle $\\rho = 2$ m, $\\dot\\varphi = 3$ rad/s constant. Alors $\\vec V = 6\\,\\vec e_\\varphi$ m/s et $\\vec\\gamma = -18\\,\\vec e_\\rho$ m/s².<\/p>\n<h2>Idée 3 · Mouvements types<\/h2>\n<table>\n<thead>\n<tr>\n<th>Mouvement<\/th>\n<th>Caractéristique<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Rectiligne uniforme<\/td>\n<td>$\\vec\\gamma = \\vec 0$, $\\vec V$ constant<\/td>\n<\/tr>\n<tr>\n<td>Rectiligne uniformément varié<\/td>\n<td>$\\vec\\gamma$ constant, colinéaire à $\\vec V$ ; $x = \\tfrac12 a t^2 + v_0 t + x_0$<\/td>\n<\/tr>\n<tr>\n<td>Circulaire uniforme<\/td>\n<td>$\\rho = R$, $\\dot\\varphi = \\omega$ ; $V = R\\omega$, $\\gamma = R\\omega^2$ dirigée vers le centre<\/td>\n<\/tr>\n<tr>\n<td>Sinusoïdal<\/td>\n<td>$x = X_m\\cos(\\omega t + \\phi)$, $\\ddot x + \\omega^2 x = 0$<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Mouvement <strong>accéléré<\/strong> si $\\vec V\\cdot\\vec\\gamma &gt; 0$, <strong>retardé<\/strong> si $\\vec V\\cdot\\vec\\gamma &lt; 0$.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Série 2, exercice 2<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>$x = 2e^t\\sin t$, $y = 2e^t\\cos t$, $z = e^t$. Calcule $\\|\\vec V\\|$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>$\\dot x = 2e^t(\\sin t + \\cos t)$, $\\dot y = 2e^t(\\cos t - \\sin t)$, $\\dot z = e^t$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>$\\|\\vec V\\|^2 = 4e^{2t}\\cdot2 + e^{2t} = 9e^{2t}$, donc $\\|\\vec V\\| = 3e^t$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Et $\\|\\vec\\gamma\\|$ ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$\\ddot x = 4e^t\\cos t$, $\\ddot y = -4e^t\\sin t$, $\\ddot z = e^t$, donc $\\|\\vec\\gamma\\| = \\sqrt{17}\\,e^t$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Mouvement circulaire<\/h3><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Un point tourne sur un cercle de rayon $0{,}5$ m à $\\dot\\varphi = 4$ rad/s constant. Accélération en m/s² ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 8<\/b><\/p><p>$\\gamma = R\\omega^2 = 0{,}5\\times16 = 8$ m/s², dirigée vers le centre.<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 6 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">La trajectoire de $x = t-1$, $y = -t^2+1$ est :<\/div><button class=\"opt\" data-o=\"0\">une droite<\/button><button class=\"opt\" data-o=\"1\">une parabole<\/button><button class=\"opt\" data-o=\"2\">un cercle<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">La vitesse est la dérivée de :<\/div><button class=\"opt\" data-o=\"0\">$\\overrightarrow{OM}$ par rapport au temps<\/button><button class=\"opt\" data-o=\"1\">l&#39;accélération<\/button><button class=\"opt\" data-o=\"2\">l&#39;abscisse curviligne par rapport à $x$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">En polaires, la composante orthoradiale de la vitesse vaut :<\/div><button class=\"opt\" data-o=\"0\">$\\dot\\rho$<\/button><button class=\"opt\" data-o=\"1\">$\\rho\\dot\\varphi$<\/button><button class=\"opt\" data-o=\"2\">$\\rho\\dot\\varphi^2$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Dans un mouvement circulaire uniforme, l&#39;accélération est :<\/div><button class=\"opt\" data-o=\"0\">nulle<\/button><button class=\"opt\" data-o=\"1\">dirigée vers le centre<\/button><button class=\"opt\" data-o=\"2\">tangente à la trajectoire<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Si $\\vec V\\cdot\\vec\\gamma &lt; 0$, le mouvement est :<\/div><button class=\"opt\" data-o=\"0\">accéléré<\/button><button class=\"opt\" data-o=\"1\">retardé<\/button><button class=\"opt\" data-o=\"2\">uniforme<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Pour $\\rho = 2$ m et $\\dot\\varphi = 3$ rad/s constants, $\\|\\vec V\\|$ vaut :<\/div><button class=\"opt\" data-o=\"0\">3 m/s<\/button><button class=\"opt\" data-o=\"1\">6 m/s<\/button><button class=\"opt\" data-o=\"2\">18 m/s<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Le terme $2\\dot\\rho\\dot\\varphi$ apparaît sur :<\/div><button class=\"opt\" data-o=\"0\">$\\vec e_\\rho$<\/button><button class=\"opt\" data-o=\"1\">$\\vec e_\\varphi$<\/button><button class=\"opt\" data-o=\"2\">$\\vec e_z$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Pour $x = 2e^t\\sin t$, $y = 2e^t\\cos t$, $z = e^t$, $\\|\\vec V\\|$ vaut :<\/div><button class=\"opt\" data-o=\"0\">$e^t$<\/button><button class=\"opt\" data-o=\"1\">$3e^t$<\/button><button class=\"opt\" data-o=\"2\">$\\sqrt{17}e^t$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">L&#39;unité de l&#39;accélération est :<\/div><button class=\"opt\" data-o=\"0\">m/s<\/button><button class=\"opt\" data-o=\"1\">m/s²<\/button><button class=\"opt\" data-o=\"2\">rad/s<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Un mouvement sinusoïdal vérifie :<\/div><button class=\"opt\" data-o=\"0\">$\\ddot x + \\omega^2 x = 0$<\/button><button class=\"opt\" data-o=\"1\">$\\ddot x = \\omega x$<\/button><button class=\"opt\" data-o=\"2\">$\\dot x = 0$<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"cinematique","rep":["1"],"tol":null},{"n":"cinematique","rep":null,"tol":null},{"n":"cinematique","rep":null,"tol":null},{"n":"cinematique","rep":["8"],"tol":null}],"qcm":[{"n":"cinematique","q":"La trajectoire de $x = t-1$, $y = -t^2+1$ est :","o":["une droite","une parabole","un cercle"],"a":1,"e":"$y = -x^2 - 2x$."},{"n":"cinematique","q":"La vitesse est la dérivée de :","o":["$\\overrightarrow{OM}$ par rapport au temps","l&#39;accélération","l&#39;abscisse curviligne par rapport à $x$"],"a":0,"e":"$\\vec V = d\\overrightarrow{OM}/dt$."},{"n":"cinematique","q":"En polaires, la composante orthoradiale de la vitesse vaut :","o":["$\\dot\\rho$","$\\rho\\dot\\varphi$","$\\rho\\dot\\varphi^2$"],"a":1,"e":"Elle vient de $\\rho\\,d\\vec e_\\rho/dt$."},{"n":"cinematique","q":"Dans un mouvement circulaire uniforme, l&#39;accélération est :","o":["nulle","dirigée vers le centre","tangente à la trajectoire"],"a":1,"e":"$\\vec\\gamma = -R\\omega^2\\,\\vec e_\\rho$."},{"n":"cinematique","q":"Si $\\vec V\\cdot\\vec\\gamma &lt; 0$, le mouvement est :","o":["accéléré","retardé","uniforme"],"a":1,"e":"La vitesse diminue."},{"n":"cinematique","q":"Pour $\\rho = 2$ m et $\\dot\\varphi = 3$ rad/s constants, $\\|\\vec V\\|$ vaut :","o":["3 m/s","6 m/s","18 m/s"],"a":1,"e":"$\\rho\\dot\\varphi = 6$."},{"n":"cinematique","q":"Le terme $2\\dot\\rho\\dot\\varphi$ apparaît sur :","o":["$\\vec e_\\rho$","$\\vec e_\\varphi$","$\\vec e_z$"],"a":1,"e":"Composante orthoradiale de l&#39;accélération."},{"n":"cinematique","q":"Pour $x = 2e^t\\sin t$, $y = 2e^t\\cos t$, $z = e^t$, $\\|\\vec V\\|$ vaut :","o":["$e^t$","$3e^t$","$\\sqrt{17}e^t$"],"a":1,"e":"$\\sqrt{8e^{2t} + e^{2t}}$."},{"n":"cinematique","q":"L&#39;unité de l&#39;accélération est :","o":["m/s","m/s²","rad/s"],"a":1,"e":"Dérivée d&#39;une vitesse."},{"n":"cinematique","q":"Un mouvement sinusoïdal vérifie :","o":["$\\ddot x + \\omega^2 x = 0$","$\\ddot x = \\omega x$","$\\dot x = 0$"],"a":0,"e":"Équation de l&#39;oscillateur harmonique."}]},{"id":"frenet","t":"Repère de Frenet et rayon de courbure","seance":"Chapitre II · Cinématique (abscisse curviligne, Frenet)","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu dois savoir calculer une norme et un produit vectoriel (chapitre 1), et la vitesse en cartésiennes (chapitre 3).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>$\\vec V = \\vec i - 2\\vec j$ et $\\vec\\gamma = -2\\vec j$. Calcule $\\|\\vec V\\wedge\\vec\\gamma\\|$.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 2<\/b><\/p><p>$\\vec V\\wedge\\vec\\gamma = (1)(-2)\\,\\vec k - 0 = -2\\vec k$, de norme 2.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Frenet, c&#39;est le repère du conducteur<\/strong> : $\\vec\\tau$ devant soi (le long de la route), $\\vec n$ vers l&#39;intérieur du virage. L&#39;accélération tangentielle change la vitesse, la normale change la direction.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Croire que l&#39;accélération est nulle quand $\\|\\vec V\\|$ est constante. Dans un virage à vitesse constante, $\\gamma_t = 0$ mais $\\gamma_n = V^2/R_c \\ne 0$.<\/p>\n<\/aside><p>À la fin, tu sais décomposer $\\vec\\gamma$ en $\\gamma_t$ et $\\gamma_n$ et calculer un rayon de courbure de deux façons.<\/p>\n<h2>Idée 1 · Abscisse curviligne et base de Frenet<\/h2>\n<svg viewBox=\"0 0 440 200\" role=\"img\" aria-label=\"Base de Frenet : tau tangent à la trajectoire, n vers le centre de courbure C, rayon de courbure Rc\" style=\"max-width:100%;height:auto\"><path d=\"M40 170Q200 10 400 150\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><g stroke=\"#D9824F\" stroke-width=\"2.4\"><path d=\"M220 90L300 98\"/><path d=\"M220 90L214 150\"/><\/g><path d=\"M220 90L208 190\" stroke=\"currentColor\" stroke-dasharray=\"4 3\"/><g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\"><text x=\"210\" y=\"82\">M<\/text><text x=\"304\" y=\"100\" fill=\"#D9824F\">τ<\/text><text x=\"196\" y=\"150\" fill=\"#D9824F\">n<\/text><text x=\"214\" y=\"196\">C (centre de courbure)<\/text><text x=\"226\" y=\"176\">R_c<\/text><\/g><\/svg><ul>\n<li>Abscisse curviligne $s(t)$ : longueur d&#39;arc parcourue ; $ds = \\|d\\overrightarrow{OM}\\|$ et $\\|\\vec V\\| = \\dfrac{ds}{dt}$.<\/li>\n<li>$\\vec\\tau = \\dfrac{\\vec V}{\\|\\vec V\\|}$ (tangent), $\\dfrac{d\\vec\\tau}{ds} = \\dfrac1{R_c}\\vec n$ (normale, vers le centre de courbure), $\\vec b = \\vec\\tau\\wedge\\vec n$.<\/li>\n<\/ul>\n<h2>Idée 2 · Accélération tangentielle et normale<\/h2>\n<p>$$\\vec V = V\\,\\vec\\tau,\\qquad \\vec\\gamma = \\frac{dV}{dt}\\,\\vec\\tau + \\frac{V^2}{R_c}\\,\\vec n$$<\/p>\n<table>\n<thead>\n<tr>\n<th>Composante<\/th>\n<th>Formule<\/th>\n<th>Rôle<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>$\\gamma_t$<\/td>\n<td>$\\dfrac{d\\|\\vec V\\|}{dt}$<\/td>\n<td>change la valeur de la vitesse<\/td>\n<\/tr>\n<tr>\n<td>$\\gamma_n$<\/td>\n<td>$\\dfrac{V^2}{R_c} \\ge 0$<\/td>\n<td>change la direction<\/td>\n<\/tr>\n<\/tbody><\/table>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Série 2, ex. 1 : $\\vec V = \\vec i - 2t\\vec j$, $\\vec\\gamma = -2\\vec j$<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · $\\gamma_t$<\/div><p>$\\|\\vec V\\| = \\sqrt{1+4t^2}$, donc $\\gamma_t = \\dfrac{4t}{\\sqrt{1+4t^2}}$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · $\\vec\\gamma_t$<\/div><p>$\\gamma_t\\,\\vec\\tau = \\dfrac{4t}{1+4t^2}(\\vec i - 2t\\vec j)$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · $\\vec\\gamma_n$<\/div><p>$\\vec\\gamma - \\vec\\gamma_t = -\\dfrac{4t}{1+4t^2}\\vec i - \\dfrac{2}{1+4t^2}\\vec j$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · $R_c$<\/div><p>$R_c = \\dfrac{\\|\\vec V\\|^3}{\\|\\vec V\\wedge\\vec\\gamma\\|} = \\dfrac{(1+4t^2)^{3/2}}{2}$.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Deux méthodes pour $R_c$ : $R_c = \\dfrac{\\|\\vec V\\|^3}{\\|\\vec V\\wedge\\vec\\gamma\\|}$ (la plus rapide) ou $R_c = \\dfrac{V^2}{\\gamma_n}$.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Série 2, exercice 2<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Pour $x = 2e^t\\sin t$, $y = 2e^t\\cos t$, $z = e^t$ ($V = 3e^t$), calcule $R_c$ avec $\\dfrac{d\\vec\\tau}{ds} = \\dfrac1{R_c}\\vec n$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>$\\vec\\tau = \\vec V/V = \\tfrac23(\\sin t+\\cos t,\\ \\cos t-\\sin t,\\ \\tfrac12)$, puis $\\dfrac{d\\vec\\tau}{ds} = \\dfrac{d\\vec\\tau}{dt}\\dfrac{dt}{ds}$ avec $\\dfrac{dt}{ds} = \\dfrac1{3e^t}$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>$\\left\\|\\dfrac{d\\vec\\tau}{dt}\\right\\| = \\tfrac23\\sqrt2$, donc $\\left\\|\\dfrac{d\\vec\\tau}{ds}\\right\\| = \\dfrac{2\\sqrt2}{9e^t}$ et $R_c = \\dfrac{9e^t}{2\\sqrt2} = \\dfrac{9\\sqrt2}{4}e^t = \\dfrac{9\\sqrt2}{4}z$ (vérifié par calcul symbolique). Le rayon de courbure dépend de $z$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Projection dans $z = 0$ : exprime $\\rho(\\varphi)$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$\\rho = \\sqrt{x^2+y^2} = 2e^t$ et $\\tan\\varphi = y/x = \\cot t$, donc $\\varphi = \\tfrac\\pi2 - t$. D&#39;où $\\rho = 2e^{\\pi/2 - \\varphi}$ : une <strong>spirale logarithmique<\/strong>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 7 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">$\\vec n$ est dirigé vers :<\/div><button class=\"opt\" data-o=\"0\">le centre de courbure<\/button><button class=\"opt\" data-o=\"1\">l&#39;extérieur du virage<\/button><button class=\"opt\" data-o=\"2\">l&#39;origine $O$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">À vitesse de norme constante, $\\gamma_t$ vaut :<\/div><button class=\"opt\" data-o=\"0\">0<\/button><button class=\"opt\" data-o=\"1\">$V^2/R_c$<\/button><button class=\"opt\" data-o=\"2\">$V$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">$\\gamma_n$ vaut :<\/div><button class=\"opt\" data-o=\"0\">$dV/dt$<\/button><button class=\"opt\" data-o=\"1\">$V^2/R_c$<\/button><button class=\"opt\" data-o=\"2\">$R_c/V^2$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Pour une droite, $R_c$ est :<\/div><button class=\"opt\" data-o=\"0\">nul<\/button><button class=\"opt\" data-o=\"1\">infini<\/button><button class=\"opt\" data-o=\"2\">égal à 1<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">$R_c = \\|\\vec V\\|^3/\\|\\vec V\\wedge\\vec\\gamma\\|$ pour $\\vec V = \\vec i - 2t\\vec j$, $\\vec\\gamma = -2\\vec j$, à $t = 0$ :<\/div><button class=\"opt\" data-o=\"0\">1/2<\/button><button class=\"opt\" data-o=\"1\">2<\/button><button class=\"opt\" data-o=\"2\">1<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">$\\vec b$ se définit par :<\/div><button class=\"opt\" data-o=\"0\">$\\vec\\tau\\wedge\\vec n$<\/button><button class=\"opt\" data-o=\"1\">$\\vec n\\wedge\\vec\\tau$<\/button><button class=\"opt\" data-o=\"2\">$\\vec\\tau + \\vec n$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">L&#39;abscisse curviligne vérifie :<\/div><button class=\"opt\" data-o=\"0\">$ds/dt = \\|\\vec V\\|$<\/button><button class=\"opt\" data-o=\"1\">$ds/dt = \\|\\vec\\gamma\\|$<\/button><button class=\"opt\" data-o=\"2\">$s = \\|\\overrightarrow{OM}\\|$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">La trajectoire $\\rho = 2e^{\\pi/2-\\varphi}$ est :<\/div><button class=\"opt\" data-o=\"0\">un cercle<\/button><button class=\"opt\" data-o=\"1\">une spirale logarithmique<\/button><button class=\"opt\" data-o=\"2\">une parabole<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Dans un virage à vitesse constante, l&#39;accélération est :<\/div><button class=\"opt\" data-o=\"0\">nulle<\/button><button class=\"opt\" data-o=\"1\">normale à la trajectoire<\/button><button class=\"opt\" data-o=\"2\">tangente<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">$\\gamma_n$ est toujours :<\/div><button class=\"opt\" data-o=\"0\">positive ou nulle<\/button><button class=\"opt\" data-o=\"1\">négative<\/button><button class=\"opt\" data-o=\"2\">de signe quelconque<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"frenet","rep":["2"],"tol":null},{"n":"frenet","rep":null,"tol":null},{"n":"frenet","rep":null,"tol":null}],"qcm":[{"n":"frenet","q":"$\\vec n$ est dirigé vers :","o":["le centre de courbure","l&#39;extérieur du virage","l&#39;origine $O$"],"a":0,"e":"Concavité de la trajectoire."},{"n":"frenet","q":"À vitesse de norme constante, $\\gamma_t$ vaut :","o":["0","$V^2/R_c$","$V$"],"a":0,"e":"$\\gamma_t = dV/dt$."},{"n":"frenet","q":"$\\gamma_n$ vaut :","o":["$dV/dt$","$V^2/R_c$","$R_c/V^2$"],"a":1,"e":"Accélération normale."},{"n":"frenet","q":"Pour une droite, $R_c$ est :","o":["nul","infini","égal à 1"],"a":1,"e":"Aucune courbure, $\\gamma_n = 0$."},{"n":"frenet","q":"$R_c = \\|\\vec V\\|^3/\\|\\vec V\\wedge\\vec\\gamma\\|$ pour $\\vec V = \\vec i - 2t\\vec j$, $\\vec\\gamma = -2\\vec j$, à $t = 0$ :","o":["1/2","2","1"],"a":0,"e":"$1^3/2$."},{"n":"frenet","q":"$\\vec b$ se définit par :","o":["$\\vec\\tau\\wedge\\vec n$","$\\vec n\\wedge\\vec\\tau$","$\\vec\\tau + \\vec n$"],"a":0,"e":"Pour que $(\\vec\\tau, \\vec n, \\vec b)$ soit direct."},{"n":"frenet","q":"L&#39;abscisse curviligne vérifie :","o":["$ds/dt = \\|\\vec V\\|$","$ds/dt = \\|\\vec\\gamma\\|$","$s = \\|\\overrightarrow{OM}\\|$"],"a":0,"e":"C&#39;est la longueur parcourue sur la courbe."},{"n":"frenet","q":"La trajectoire $\\rho = 2e^{\\pi/2-\\varphi}$ est :","o":["un cercle","une spirale logarithmique","une parabole"],"a":1,"e":"Rayon exponentiel en fonction de l&#39;angle."},{"n":"frenet","q":"Dans un virage à vitesse constante, l&#39;accélération est :","o":["nulle","normale à la trajectoire","tangente"],"a":1,"e":"$\\gamma_t = 0$, il reste $\\gamma_n$."},{"n":"frenet","q":"$\\gamma_n$ est toujours :","o":["positive ou nulle","négative","de signe quelconque"],"a":0,"e":"$V^2/R_c \\ge 0$."}]},{"id":"changement-referentiel","t":"Changement de référentiel","seance":"Chapitre III · Changement de référentiel","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu dois savoir écrire $\\dfrac{d\\vec u}{dt} = \\vec\\omega\\wedge\\vec u$ pour un vecteur unitaire qui tourne (chapitre 2).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Un repère tourne autour de $Oz$ avec $\\vec\\Omega = \\omega\\vec k$. Que vaut $\\dfrac{d\\vec i_1}{dt}$ ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$\\vec\\Omega\\wedge\\vec i_1 = \\omega\\,\\vec k\\wedge\\vec i_1 = \\omega\\,\\vec j_1$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Trois questions<\/strong> : comment bouge $M$ dans $\\mathcal R_1$ (relatif) ? Comment bougerait un point <strong>fixe<\/strong> de $\\mathcal R_1$ situé en $M$ (entraînement) ? Et Coriolis, le terme qui couple les deux.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Calculer $\\vec\\gamma_e$ en dérivant $\\vec V_e$. <strong>Faux<\/strong> : $\\vec\\gamma_e$ est l&#39;accélération qu&#39;aurait $M$ s&#39;il était fixe dans $\\mathcal R_1$, ce n&#39;est pas la dérivée de $\\vec V_e$.<\/p>\n<\/aside><p>À la fin, tu sais appliquer $\\vec V_a = \\vec V_r + \\vec V_e$ et $\\vec\\gamma_a = \\vec\\gamma_r + \\vec\\gamma_e + \\vec\\gamma_c$.<\/p>\n<h2>Idée 1 · Dérivée d&#39;un vecteur dans deux repères<\/h2>\n<p>$\\mathcal R$ absolu, $\\mathcal R_1(O_1, \\vec i_1, \\vec j_1, \\vec k_1)$ relatif, de vecteur rotation $\\vec\\Omega(\\mathcal R_1/\\mathcal R)$ :<\/p>\n<p>$$\\left.\\frac{d\\vec A}{dt}\\right|_{\\mathcal R} = \\left.\\frac{d\\vec A}{dt}\\right|_{\\mathcal R_1} + \\vec\\Omega(\\mathcal R_1/\\mathcal R)\\wedge\\vec A$$<\/p>\n<svg viewBox=\"0 0 440 200\" role=\"img\" aria-label=\"Repère fixe R et repère mobile R1 tournant à la vitesse angulaire omega\" style=\"max-width:100%;height:auto\"><g stroke=\"currentColor\" stroke-width=\"1.6\" fill=\"none\"><path d=\"M80 170H260\"/><path d=\"M80 170V30\"/><\/g><g stroke=\"#D9824F\" stroke-width=\"2\" fill=\"none\"><path d=\"M80 170L230 90\"/><path d=\"M80 170L150 50\"/><path d=\"M150 170A70 70 0 0 0 140 136\"/><\/g><g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\"><text x=\"264\" y=\"174\">x (R)<\/text><text x=\"84\" y=\"28\">y (R)<\/text><text x=\"234\" y=\"88\" fill=\"#D9824F\">x₁ (R₁)<\/text><text x=\"154\" y=\"48\" fill=\"#D9824F\">y₁ (R₁)<\/text><text x=\"160\" y=\"150\" fill=\"#D9824F\">θ = ωt<\/text><\/g><\/svg><h2>Idée 2 · Composition des vitesses<\/h2>\n<p>$$\\vec V_a(M/\\mathcal R) = \\vec V_r(M/\\mathcal R_1) + \\vec V_e,\\qquad \\vec V_e = \\vec V(O_1/\\mathcal R) + \\vec\\Omega\\wedge\\overrightarrow{O_1M}$$<\/p>\n<h2>Idée 3 · Composition des accélérations<\/h2>\n<p>$$\\vec\\gamma_a = \\vec\\gamma_r + \\vec\\gamma_e + \\vec\\gamma_c$$\n$$\\vec\\gamma_e = \\vec\\gamma(O_1/\\mathcal R) + \\frac{d\\vec\\Omega}{dt}\\wedge\\overrightarrow{O_1M} + \\vec\\Omega\\wedge(\\vec\\Omega\\wedge\\overrightarrow{O_1M}),\\qquad \\vec\\gamma_c = 2\\,\\vec\\Omega\\wedge\\vec V_r$$<\/p>\n<table>\n<thead>\n<tr>\n<th>Mouvement de $\\mathcal R_1$<\/th>\n<th>$\\vec\\gamma_e$<\/th>\n<th>$\\vec\\gamma_c$<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Translation ($\\vec\\Omega = \\vec 0$)<\/td>\n<td>$\\vec\\gamma(O_1/\\mathcal R)$<\/td>\n<td>$\\vec 0$<\/td>\n<\/tr>\n<tr>\n<td>Rotation uniforme autour d&#39;un axe fixe<\/td>\n<td>$\\vec\\Omega\\wedge(\\vec\\Omega\\wedge\\overrightarrow{O_1M})$ (centripète)<\/td>\n<td>$2\\vec\\Omega\\wedge\\vec V_r$<\/td>\n<\/tr>\n<\/tbody><\/table>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Série 2, ex. 4 : anneau sur une tige qui tourne à $\\omega$, $\\overrightarrow{OM} = r_0\\cosh(\\omega t)\\,\\vec i_1$<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Relatif<\/div><p>$\\vec V_r = r_0\\omega\\sinh(\\omega t)\\,\\vec i_1$ ; $\\vec\\gamma_r = r_0\\omega^2\\cosh(\\omega t)\\,\\vec i_1$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · Entraînement<\/div><p>$\\vec V_e = \\omega\\vec k\\wedge r\\vec i_1 = r_0\\omega\\cosh(\\omega t)\\,\\vec j_1$ ; $\\vec\\gamma_e = -\\omega^2 r_0\\cosh(\\omega t)\\,\\vec i_1$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · Coriolis<\/div><p>$\\vec\\gamma_c = 2\\omega\\vec k\\wedge\\vec V_r = 2\\omega^2 r_0\\sinh(\\omega t)\\,\\vec j_1$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · Absolu<\/div><p>$\\vec\\gamma_a = 2\\omega^2 r_0\\sinh(\\omega t)\\,\\vec j_1$ (les termes sur $\\vec i_1$ s&#39;annulent).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · Sortie de la tige (longueur $L$)<\/div><p>$r_0\\cosh(\\omega\\tau) = L$, donc $\\tau = \\dfrac1\\omega\\,\\text{argch}\\dfrac{L}{r_0}$, et $V_r = \\omega\\sqrt{L^2 - r_0^2}$.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Un repère en <strong>translation rectiligne uniforme<\/strong> par rapport à un repère galiléen est galiléen. Dès qu&#39;il accélère ou tourne, il ne l&#39;est plus.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Série 2, exercice 3 : anneau sur un cercle qui tourne<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Le cercle de rayon $r$ tourne autour de $Oz$ à $\\dot\\alpha$ ; $A$ repéré par $\\theta$, $\\overrightarrow{OA} = r\\sin\\theta\\,\\vec e_{x'} + r\\cos\\theta\\,\\vec e_{z'}$. Donne $\\vec V_r$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$\\vec V_r = r\\dot\\theta\\cos\\theta\\,\\vec e_{x'} - r\\dot\\theta\\sin\\theta\\,\\vec e_{z'} = r\\dot\\theta\\,\\vec e_\\theta$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Donne $\\vec V_e$ et $\\vec\\gamma_c$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$\\vec V_e = \\dot\\alpha\\,\\vec e_{z'}\\wedge\\overrightarrow{OA} = r\\dot\\alpha\\sin\\theta\\,\\vec e_{y'}$. $\\vec\\gamma_c = 2\\dot\\alpha\\,\\vec e_{z'}\\wedge\\vec V_r = 2r\\dot\\alpha\\dot\\theta\\cos\\theta\\,\\vec e_{y'}$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Entraînement en translation<\/h3><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>$\\mathcal R_1$ accélère en translation à $3$ m/s² par rapport à $\\mathcal R$. $M$ est immobile dans $\\mathcal R_1$. Accélération absolue (m/s²) ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 3<\/b><\/p><p>$\\vec\\gamma_r = \\vec 0$, $\\vec\\gamma_c = \\vec 0$ (pas de rotation), $\\vec\\gamma_a = \\vec\\gamma_e = 3$ m/s².<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 7 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">L&#39;accélération de Coriolis vaut :<\/div><button class=\"opt\" data-o=\"0\">$\\vec\\Omega\\wedge\\vec V_r$<\/button><button class=\"opt\" data-o=\"1\">$2\\,\\vec\\Omega\\wedge\\vec V_r$<\/button><button class=\"opt\" data-o=\"2\">$2\\,\\vec\\Omega\\wedge\\vec V_a$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Si $\\mathcal R_1$ est en translation par rapport à $\\mathcal R$ :<\/div><button class=\"opt\" data-o=\"0\">$\\vec\\gamma_c = \\vec 0$<\/button><button class=\"opt\" data-o=\"1\">$\\vec\\gamma_e = \\vec 0$<\/button><button class=\"opt\" data-o=\"2\">$\\vec V_e = \\vec 0$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">$\\vec V_e$ est la vitesse :<\/div><button class=\"opt\" data-o=\"0\">qu&#39;aurait $M$ s&#39;il était fixe dans $\\mathcal R_1$<\/button><button class=\"opt\" data-o=\"1\">de $M$ dans $\\mathcal R_1$<\/button><button class=\"opt\" data-o=\"2\">de $O$ dans $\\mathcal R_1$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Pour la tige qui tourne, $\\vec\\gamma_e$ est :<\/div><button class=\"opt\" data-o=\"0\">tangentielle<\/button><button class=\"opt\" data-o=\"1\">centripète, $-\\omega^2 r\\,\\vec i_1$<\/button><button class=\"opt\" data-o=\"2\">nulle<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">$\\frac{d\\vec i_1}{dt}|_{\\mathcal R}$ avec $\\vec\\Omega = \\omega\\vec k$ vaut :<\/div><button class=\"opt\" data-o=\"0\">$\\omega\\,\\vec j_1$<\/button><button class=\"opt\" data-o=\"1\">$-\\omega\\,\\vec j_1$<\/button><button class=\"opt\" data-o=\"2\">$\\vec 0$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">$\\vec\\gamma_e$ s&#39;obtient :<\/div><button class=\"opt\" data-o=\"0\">en dérivant $\\vec V_e$<\/button><button class=\"opt\" data-o=\"1\">par sa formule (point fixe de $\\mathcal R_1$)<\/button><button class=\"opt\" data-o=\"2\">en dérivant $\\vec V_r$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Pour $r = r_0\\cosh(\\omega t)$, le temps de sortie de la tige est :<\/div><button class=\"opt\" data-o=\"0\">$\\frac1\\omega\\,\\text{argch}(L/r_0)$<\/button><button class=\"opt\" data-o=\"1\">$L/(r_0\\omega)$<\/button><button class=\"opt\" data-o=\"2\">$\\omega L$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">$\\cosh^2 x - \\sinh^2 x$ vaut :<\/div><button class=\"opt\" data-o=\"0\">1<\/button><button class=\"opt\" data-o=\"1\">0<\/button><button class=\"opt\" data-o=\"2\">$\\cosh 2x$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Un repère en translation rectiligne uniforme par rapport à un galiléen est :<\/div><button class=\"opt\" data-o=\"0\">galiléen<\/button><button class=\"opt\" data-o=\"1\">non galiléen<\/button><button class=\"opt\" data-o=\"2\">en rotation<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Si $M$ est fixe dans $\\mathcal R_1$ :<\/div><button class=\"opt\" data-o=\"0\">$\\vec V_r = \\vec 0$ et $\\vec\\gamma_c = \\vec 0$<\/button><button class=\"opt\" data-o=\"1\">$\\vec V_e = \\vec 0$<\/button><button class=\"opt\" data-o=\"2\">$\\vec\\gamma_a = \\vec 0$<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"changement-referentiel","rep":null,"tol":null},{"n":"changement-referentiel","rep":null,"tol":null},{"n":"changement-referentiel","rep":null,"tol":null},{"n":"changement-referentiel","rep":["3"],"tol":null}],"qcm":[{"n":"changement-referentiel","q":"L&#39;accélération de Coriolis vaut :","o":["$\\vec\\Omega\\wedge\\vec V_r$","$2\\,\\vec\\Omega\\wedge\\vec V_r$","$2\\,\\vec\\Omega\\wedge\\vec V_a$"],"a":1,"e":"Avec la vitesse <strong>relative<\/strong>."},{"n":"changement-referentiel","q":"Si $\\mathcal R_1$ est en translation par rapport à $\\mathcal R$ :","o":["$\\vec\\gamma_c = \\vec 0$","$\\vec\\gamma_e = \\vec 0$","$\\vec V_e = \\vec 0$"],"a":0,"e":"$\\vec\\Omega = \\vec 0$."},{"n":"changement-referentiel","q":"$\\vec V_e$ est la vitesse :","o":["qu&#39;aurait $M$ s&#39;il était fixe dans $\\mathcal R_1$","de $M$ dans $\\mathcal R_1$","de $O$ dans $\\mathcal R_1$"],"a":0,"e":"Définition de l&#39;entraînement."},{"n":"changement-referentiel","q":"Pour la tige qui tourne, $\\vec\\gamma_e$ est :","o":["tangentielle","centripète, $-\\omega^2 r\\,\\vec i_1$","nulle"],"a":1,"e":"$\\vec\\Omega\\wedge(\\vec\\Omega\\wedge r\\vec i_1) = -\\omega^2 r\\vec i_1$."},{"n":"changement-referentiel","q":"$\\frac{d\\vec i_1}{dt}|_{\\mathcal R}$ avec $\\vec\\Omega = \\omega\\vec k$ vaut :","o":["$\\omega\\,\\vec j_1$","$-\\omega\\,\\vec j_1$","$\\vec 0$"],"a":0,"e":"$\\omega\\vec k\\wedge\\vec i_1 = \\omega\\vec j_1$."},{"n":"changement-referentiel","q":"$\\vec\\gamma_e$ s&#39;obtient :","o":["en dérivant $\\vec V_e$","par sa formule (point fixe de $\\mathcal R_1$)","en dérivant $\\vec V_r$"],"a":1,"e":"Piège classique."},{"n":"changement-referentiel","q":"Pour $r = r_0\\cosh(\\omega t)$, le temps de sortie de la tige est :","o":["$\\frac1\\omega\\,\\text{argch}(L/r_0)$","$L/(r_0\\omega)$","$\\omega L$"],"a":0,"e":"$\\cosh(\\omega\\tau) = L/r_0$."},{"n":"changement-referentiel","q":"$\\cosh^2 x - \\sinh^2 x$ vaut :","o":["1","0","$\\cosh 2x$"],"a":0,"e":"Identité utilisée dans la série 2."},{"n":"changement-referentiel","q":"Un repère en translation rectiligne uniforme par rapport à un galiléen est :","o":["galiléen","non galiléen","en rotation"],"a":0,"e":"$\\vec\\gamma_e = \\vec 0$, pas de force d&#39;inertie."},{"n":"changement-referentiel","q":"Si $M$ est fixe dans $\\mathcal R_1$ :","o":["$\\vec V_r = \\vec 0$ et $\\vec\\gamma_c = \\vec 0$","$\\vec V_e = \\vec 0$","$\\vec\\gamma_a = \\vec 0$"],"a":0,"e":"Coriolis dépend de $\\vec V_r$."}]},{"id":"dynamique","t":"Dynamique · PFD, forces d'inertie, pendule et ressort","seance":"Chapitre IV · Dynamique du point matériel","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu dois savoir écrire l&#39;accélération en polaires et la composition des accélérations (chapitres 3 et 5).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Pour un point sur un cercle de rayon $\\ell$ fixe, repéré par $\\varphi$, que vaut $\\vec\\gamma$ en polaires ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$\\rho = \\ell$ constant : $\\vec\\gamma = -\\ell\\dot\\varphi^2\\,\\vec e_\\rho + \\ell\\ddot\\varphi\\,\\vec e_\\varphi$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Toujours la même recette<\/strong> : système, référentiel, bilan des forces, PFD, projection sur une base bien choisie.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Ajouter des forces d&#39;inertie dans un référentiel <strong>galiléen<\/strong>. Elles n&#39;existent que dans un repère non galiléen ; dans $\\mathcal R$ galiléen on écrit seulement $m\\vec\\gamma = \\sum\\vec F_{ext}$.<\/p>\n<\/aside><p>À la fin, tu sais établir l&#39;équation différentielle du pendule simple et du ressort, et appliquer le PFD dans un repère non galiléen.<\/p>\n<h2>Idée 1 · Les trois lois de Newton<\/h2>\n<ul>\n<li><strong>Inertie<\/strong> : dans un référentiel galiléen, un point isolé est au repos ou en mouvement rectiligne uniforme.<\/li>\n<li><strong>PFD<\/strong> : $\\dfrac{d\\vec p}{dt}\\Big|_{\\mathcal R} = m\\,\\vec\\gamma(M/\\mathcal R) = \\sum\\vec F_{ext}$, avec $\\vec p = m\\vec V$.<\/li>\n<li><strong>Actions réciproques<\/strong> : $\\vec F_{A\\to B} = -\\vec F_{B\\to A}$.<\/li>\n<\/ul>\n<p>Forces usuelles : poids $\\vec P = m\\vec g$ ; réaction $\\vec R = \\vec R_n + \\vec R_t$ ($\\vec R_t = \\vec 0$ sans frottement) ; tension d&#39;un fil $\\vec T$ ; rappel d&#39;un ressort $\\vec F = -k\\,\\Delta\\ell\\,\\vec u$.<\/p>\n<h2>Idée 2 · PFD dans un référentiel non galiléen<\/h2>\n<p>$$m\\,\\vec\\gamma(M/\\mathcal R_1) = \\sum\\vec F_{ext} + \\vec F_e + \\vec F_c,\\qquad \\vec F_e = -m\\vec\\gamma_e,\\quad \\vec F_c = -m\\vec\\gamma_c$$<\/p>\n<p>Équilibre dans $\\mathcal R_1$ : $\\sum\\vec F_{ext} + \\vec F_e + \\vec F_c = \\vec 0$ (et $\\vec F_c = \\vec 0$ car $\\vec V_r = \\vec 0$).<\/p>\n<aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>Le cours insiste : $\\vec F_e$ et $\\vec F_c$ <strong>n&#39;apparaissent que dans les repères non galiléens<\/strong>.<\/p>\n<\/aside><h2>Idée 3 · Pendule simple<\/h2>\n<svg viewBox=\"0 0 400 230\" role=\"img\" aria-label=\"Pendule simple : fil de longueur l, angle phi avec la verticale, poids P et tension T\" style=\"max-width:100%;height:auto\"><g stroke=\"currentColor\" stroke-width=\"1.6\" fill=\"none\"><path d=\"M120 20H280\"/><path d=\"M200 20V200\" stroke-dasharray=\"4 3\"/><path d=\"M200 20L280 150\"/><circle cx=\"280\" cy=\"150\" r=\"9\"/><\/g><g stroke=\"#D9824F\" stroke-width=\"2.4\"><path d=\"M280 159V215\"/><path d=\"M280 150L250 101\"/><\/g><path d=\"M200 70A50 50 0 0 0 226 63\" stroke=\"#D9824F\" fill=\"none\"/><g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\"><text x=\"214\" y=\"88\" fill=\"#D9824F\">φ<\/text><text x=\"246\" y=\"80\">ℓ<\/text><text x=\"288\" y=\"212\" fill=\"#D9824F\">P = mg<\/text><text x=\"222\" y=\"114\" fill=\"#D9824F\">T<\/text><\/g><\/svg><figure class=\"etapes\" data-i=\"0\"><figcaption>Équation du pendule (base polaire, $\\vec e_\\rho$ le long du fil)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Bilan<\/div><p>$\\vec P = mg\\cos\\varphi\\,\\vec e_\\rho - mg\\sin\\varphi\\,\\vec e_\\varphi$ ; $\\vec T = -T\\vec e_\\rho$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · Accélération<\/div><p>$\\vec\\gamma = -\\ell\\dot\\varphi^2\\vec e_\\rho + \\ell\\ddot\\varphi\\vec e_\\varphi$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · Projection sur $\\vec e_\\rho$<\/div><p>$T = mg\\cos\\varphi + m\\ell\\dot\\varphi^2$ (tension du fil).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · Projection sur $\\vec e_\\varphi$<\/div><p>$\\ddot\\varphi + \\dfrac g\\ell\\sin\\varphi = 0$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · Petites oscillations<\/div><p>$\\sin\\varphi \\approx \\varphi$, donc $\\ddot\\varphi + \\omega_0^2\\varphi = 0$ avec $\\omega_0 = \\sqrt{g/\\ell}$.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Idée 4 · Ressort horizontal<\/h2>\n<p>Masse $m$, ressort de raideur $k$, sans frottement, $x$ = allongement. PFD projeté sur $\\vec i$ :<\/p>\n<p>$$m\\ddot x = -kx \\;\\Longrightarrow\\; \\ddot x + \\omega_0^2 x = 0,\\quad \\omega_0 = \\sqrt{k/m}$$<\/p>\n<p>Solution : $x(t) = X_m\\cos(\\omega_0 t + \\phi)$ ; période $T_0 = 2\\pi/\\omega_0$. $X_m$ et $\\phi$ viennent des conditions initiales. Projection sur $\\vec j$ : $R = mg$.<\/p>\n<p>Exemple : $k = 20$ N/m, $m = 0{,}2$ kg : $\\omega_0 = 10$ rad/s, $T_0 \\approx 0{,}63$ s.<\/p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Pendule (petits angles) et ressort donnent la même équation $\\ddot y + \\omega_0^2 y = 0$ : <strong>oscillateur harmonique<\/strong>.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Pendule<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Un pendule de longueur $\\ell = 1$ m, $g = 9{,}8$ m/s². Période des petites oscillations en s (deux décimales) ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 2.01<\/b><\/p><p>$T_0 = 2\\pi\\sqrt{\\ell/g} = 2\\pi\\sqrt{1/9{,}8} \\approx 2{,}01$ s.<\/p>\n<\/div><\/div><\/section><section class=\"exo\"><h3>Série 3, exercice 1 (extrait)<\/h3><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Anneau sur un cerceau dans un plan vertical tournant à $\\omega$ autour de $Oz$. Dans $\\mathcal R_1$ (lié au plan), quelles forces faut-il écrire ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Le poids $\\vec P$, la réaction $\\vec R$ (sans frottement : perpendiculaire au cerceau), la force d&#39;inertie d&#39;entraînement $\\vec F_e = -m\\vec\\gamma_e$ et celle de Coriolis $\\vec F_c = -m\\vec\\gamma_c$, car $\\mathcal R_1$ tourne : il n&#39;est pas galiléen.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'ava
