const MODULE={"slug":"algo-python-2","titre":"Algorithmique et programmation Python 2","cle":"algo-python-2_scores","cleEtat":"algo-python-2_scores_etat","format":"score10","intro":"<p>Ce module suit <strong>le polycopié du Pr M. Biniz<\/strong> (Algorithmique et Python 2, S2) et corrige <strong>l&#39;examen blanc (TD 6)<\/strong>.<\/p>\n<p><strong>Comment l&#39;utiliser<\/strong><\/p>\n<ol>\n<li>Lis un chapitre en entier. Chaque notion est montrée en pseudo-code puis en Python typé, comme en cours.<\/li>\n<li>Recopie et exécute les exemples (Thonny, VS Code ou Google Colab).<\/li>\n<li>Fais le QCM du chapitre. <strong>8/10 = chapitre maîtrisé.<\/strong><\/li>\n<li>Le tuteur (en bas à droite) répond à tes questions sur le chapitre ouvert.<\/li>\n<\/ol>\n<p><strong>Ce qui est sûr<\/strong> : le contenu vient du polycopié et de la correction de l&#39;examen blanc. Tous les exemples Python ont été exécutés.\n<strong>À vérifier<\/strong> : l&#39;énoncé des QCM de l&#39;examen blanc n&#39;était pas fourni (seule la grille de réponses) et la complexité n&#39;est pas dans le polycopié. Demande au prof le format exact de l&#39;examen.<\/p>\n","annexes":[],"cartes":null,"maths":false};
const CHAPS=[{"id":"procedures-fonctions","t":"Typage, procédures et fonctions","seance":"Introduction + Chapitre I (§1–2)","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu dois savoir écrire un <code>print<\/code>, une affectation et une boucle <code>for<\/code> en Python (Python 1).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Que fait <code>x = 3<\/code> puis <code>x = x * x<\/code> puis <code>print(x)<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Il affiche <code>9<\/code>. On calcule à droite (3 × 3), puis on range le résultat dans <code>x<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Une seule question à te poser : est-ce que ça RENVOIE quelque chose ?<\/strong> Si non, c&#39;est une procédure (<code>-&gt; None<\/code>). Si oui, c&#39;est une fonction (<code>-&gt; int<\/code>, <code>-&gt; str<\/code>…).<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Confondre <code>print<\/code> et <code>return<\/code>. Une « fonction » qui affiche son résultat sans le renvoyer est en réalité une procédure : <code>x = f(5) + 1<\/code> plante car <code>f(5)<\/code> vaut <code>None<\/code>.<\/p>\n<\/aside><p>À la fin, tu sais traduire une procédure ou une fonction du pseudo-code du prof en Python typé.<\/p>\n<h2>Idée 1 · Le typage rend le code lisible<\/h2>\n<p>Python devine les types à l&#39;exécution (typage dynamique). Depuis Python 3.5 (PEP 484), on peut <strong>annoter<\/strong> les types : <code>nombre: int<\/code>, <code>-&gt; int<\/code>. Le prof les met partout.<\/p>\n<p><strong>Ce que t&#39;apportent les annotations<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Avantage<\/th>\n<th>Ce que ça t&#39;apporte<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Clarté<\/td>\n<td>on voit ce qu&#39;on donne et ce qu&#39;on reçoit<\/td>\n<\/tr>\n<tr>\n<td>IDE<\/td>\n<td>autocomplétion, alertes en direct<\/td>\n<\/tr>\n<tr>\n<td>Refactoring<\/td>\n<td>les outils repèrent les incohérences<\/td>\n<\/tr>\n<tr>\n<td>Documentation<\/td>\n<td>le type est écrit dans le code<\/td>\n<\/tr>\n<tr>\n<td>Mypy<\/td>\n<td>détecte les erreurs AVANT l&#39;exécution<\/td>\n<\/tr>\n<\/tbody><\/table>\n<pre class=\"\"><code>def double(n: int) -&gt; int:\n    return 2 * n\n\nprint(double(4))\nprint(double(&quot;ab&quot;))   # Python n'empêche rien : les annotations sont indicatives<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>8\nabab<\/code><\/pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Les annotations ne sont <strong>pas vérifiées<\/strong> par Python à l&#39;exécution. Seul un outil comme <strong>Mypy<\/strong> signale l&#39;erreur.<\/p>\n<\/aside><h2>Idée 2 · La procédure : des actions, pas de résultat<\/h2>\n<svg viewBox=\"0 0 560 120\" style=\"width:100%;max-width:560px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Procédure : paramètres en entrée, actions, rien en sortie. Fonction : paramètres en entrée, calcul, une valeur en sortie.\">\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\">\n<rect x=\"150\" y=\"10\" width=\"200\" height=\"40\" rx=\"8\" fill=\"none\" stroke=\"currentColor\"/><text x=\"250\" y=\"35\" text-anchor=\"middle\">PROCEDURE : affiche, modifie<\/text>\n<text x=\"20\" y=\"35\">paramètres →<\/text><text x=\"370\" y=\"35\">→ rien (None)<\/text>\n<rect x=\"150\" y=\"70\" width=\"200\" height=\"40\" rx=\"8\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"250\" y=\"95\" text-anchor=\"middle\">FONCTION : calcule<\/text>\n<text x=\"20\" y=\"95\">paramètres →<\/text><text x=\"370\" y=\"95\" fill=\"#D9824F\" font-weight=\"700\">→ RETOURNER valeur<\/text>\n<\/g><\/svg><p>Une procédure exécute des instructions. Le prof la type <code>-&gt; None<\/code>.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Traduire une procédure du pseudo-code<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · En-tête<\/div><p><code>PROCEDURE calculerCarré(nombre : ENTIER) -&gt; None<\/code> devient <code>def calculer_carre(nombre: int) -&gt; None:<\/code><\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · Variables locales<\/div><p><code>Var carre : int<\/code> devient une annotation à la première affectation : <code>carre: int = ...<\/code><\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · Affectation<\/div><p><code>carre &lt;- nombre * nombre<\/code> devient <code>carre = nombre * nombre<\/code><\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · Affichage<\/div><p><code>AFFICHER(...)<\/code> devient <code>print(...)<\/code><\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · Fin<\/div><p><code>FIN PROCÉDURE<\/code> disparaît : c&#39;est l&#39;indentation qui ferme le bloc.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><pre class=\"\"><code>def calculer_carre(nombre: int) -&gt; None:\n    carre: int = nombre * nombre\n    print(&quot;Le carré de&quot;, nombre, &quot;est&quot;, carre)\n\ncalculer_carre(5)<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Le carré de 5 est 25<\/code><\/pre><h2>Idée 3 · La fonction : elle RETOURNE une valeur<\/h2>\n<p>Même structure, mais on termine par <code>RETOURNER<\/code> (<code>return<\/code>). Le résultat se range dans une variable.<\/p>\n<pre class=\"\"><code>def calculer_carre(nombre: int) -&gt; int:\n    carre: int = nombre * nombre\n    return carre\n\nresultat: int = calculer_carre(5)\nprint(&quot;Le carré de 5 est :&quot;, resultat)\nprint(calculer_carre(3) + 1)<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Le carré de 5 est : 25\n10<\/code><\/pre><p>Une fonction sans paramètre existe aussi. L&#39;exemple du prof tire un nombre au hasard avec <code>random.randint(1, 100)<\/code> :<\/p>\n<pre class=\"\"><code>import random\ndef generer_nombre_aleatoire() -&gt; int:\n    nombre: int = random.randint(1, 100)\n    return nombre<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Dans le pseudo-code du polycopié (fonction <code>calculerCarre<\/code>), la variable déclarée est <code>carre<\/code> mais la ligne de retour écrit <code>RETOURNER carré<\/code>. C&#39;est la même variable : écris le même nom partout.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Procédure ou fonction ?<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Écris une <strong>procédure<\/strong> typée <code>afficher_table(n: int)<\/code> qui affiche les 3 premiers multiples de n sur une ligne.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>def afficher_table(n: int) -&gt; None:<\/code> puis, dans le corps, <code>for i in range(1, 4): print(n * i, end=&quot; &quot;)<\/code>.\nElle ne renvoie rien : <code>-&gt; None<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Écris une <strong>fonction<\/strong> typée <code>moyenne(a: float, b: float) -&gt; float<\/code>. Que vaut <code>moyenne(12, 15)<\/code> ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 13.5<\/b><\/p><p><code>return (a + b) / 2<\/code> donne 13.5.<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 7 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quelle est la différence entre une procédure et une fonction ?<\/div><button class=\"opt\" data-o=\"0\">La procédure a toujours des paramètres<\/button><button class=\"opt\" data-o=\"1\">La fonction retourne une valeur, la procédure non<\/button><button class=\"opt\" data-o=\"2\">La fonction ne peut pas afficher<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Comment le prof type-t-il une procédure en Python ?<\/div><button class=\"opt\" data-o=\"0\"><code>-&gt; void<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>-&gt; None<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>-&gt; proc<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Depuis quelle version Python accepte-t-il les annotations de type (PEP 484) ?<\/div><button class=\"opt\" data-o=\"0\">2.7<\/button><button class=\"opt\" data-o=\"1\">3.5<\/button><button class=\"opt\" data-o=\"2\">3.10<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\"><code>def f(n: int) -&gt; int: return n * 2<\/code>. Que donne <code>f(&quot;a&quot;)<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">Une erreur de type<\/button><button class=\"opt\" data-o=\"1\"><code>&#39;aa&#39;<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>None<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Quel outil détecte les erreurs de type avant l&#39;exécution ?<\/div><button class=\"opt\" data-o=\"0\">pip<\/button><button class=\"opt\" data-o=\"1\">Mypy<\/button><button class=\"opt\" data-o=\"2\">IDLE<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Que renvoie une fonction Python sans <code>return<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">0<\/button><button class=\"opt\" data-o=\"1\"><code>None<\/code><\/button><button class=\"opt\" data-o=\"2\">une chaîne vide<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Traduction de <code>carre &lt;- nombre * nombre<\/code> ?<\/div><button class=\"opt\" data-o=\"0\"><code>carre == nombre * nombre<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>carre = nombre * nombre<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>carre -&gt; nombre * nombre<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Qu&#39;est-ce qui ferme un bloc <code>def<\/code> en Python ?<\/div><button class=\"opt\" data-o=\"0\"><code>FIN FONCTION<\/code><\/button><button class=\"opt\" data-o=\"1\">une accolade<\/button><button class=\"opt\" data-o=\"2\">le retour à l&#39;indentation précédente<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\"><code>def g() -&gt; int: return 7<\/code>. C&#39;est…<\/div><button class=\"opt\" data-o=\"0\">une fonction sans paramètre<\/button><button class=\"opt\" data-o=\"1\">une procédure sans paramètre<\/button><button class=\"opt\" data-o=\"2\">une erreur de syntaxe<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Lequel n&#39;est PAS un avantage du typage cité par le prof ?<\/div><button class=\"opt\" data-o=\"0\">documentation intégrée<\/button><button class=\"opt\" data-o=\"1\">détection précoce des erreurs<\/button><button class=\"opt\" data-o=\"2\">le code devient obligatoirement plus rapide avec CPython<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"procedures-fonctions","rep":null,"tol":null},{"n":"procedures-fonctions","rep":null,"tol":null},{"n":"procedures-fonctions","rep":["13.5"],"tol":null}],"qcm":[{"n":"procedures-fonctions","q":"Quelle est la différence entre une procédure et une fonction ?","o":["La procédure a toujours des paramètres","La fonction retourne une valeur, la procédure non","La fonction ne peut pas afficher"],"a":1,"e":"Une procédure fait des actions ; une fonction renvoie un résultat."},{"n":"procedures-fonctions","q":"Comment le prof type-t-il une procédure en Python ?","o":["<code>-&gt; void<\/code>","<code>-&gt; None<\/code>","<code>-&gt; proc<\/code>"],"a":1,"e":"Une procédure ne renvoie rien : <code>None<\/code>."},{"n":"procedures-fonctions","q":"Depuis quelle version Python accepte-t-il les annotations de type (PEP 484) ?","o":["2.7","3.5","3.10"],"a":1,"e":"Le type hinting est arrivé avec Python 3.5."},{"n":"procedures-fonctions","q":"<code>def f(n: int) -&gt; int: return n * 2<\/code>. Que donne <code>f(&quot;a&quot;)<\/code> ?","o":["Une erreur de type","<code>&#39;aa&#39;<\/code>","<code>None<\/code>"],"a":1,"e":"Python ne vérifie pas les annotations à l&#39;exécution."},{"n":"procedures-fonctions","q":"Quel outil détecte les erreurs de type avant l&#39;exécution ?","o":["pip","Mypy","IDLE"],"a":1,"e":"Mypy lit les annotations et signale les incohérences."},{"n":"procedures-fonctions","q":"Que renvoie une fonction Python sans <code>return<\/code> ?","o":["0","<code>None<\/code>","une chaîne vide"],"a":1,"e":"Sans <code>return<\/code>, la valeur renvoyée est <code>None<\/code>."},{"n":"procedures-fonctions","q":"Traduction de <code>carre &lt;- nombre * nombre<\/code> ?","o":["<code>carre == nombre * nombre<\/code>","<code>carre = nombre * nombre<\/code>","<code>carre -&gt; nombre * nombre<\/code>"],"a":1,"e":"<code>&lt;-<\/code> est l&#39;affectation, <code>=<\/code> en Python."},{"n":"procedures-fonctions","q":"Qu&#39;est-ce qui ferme un bloc <code>def<\/code> en Python ?","o":["<code>FIN FONCTION<\/code>","une accolade","le retour à l&#39;indentation précédente"],"a":2,"e":"L&#39;indentation délimite les blocs en Python."},{"n":"procedures-fonctions","q":"<code>def g() -&gt; int: return 7<\/code>. C&#39;est…","o":["une fonction sans paramètre","une procédure sans paramètre","une erreur de syntaxe"],"a":0,"e":"Elle renvoie un entier : c&#39;est une fonction, même sans paramètre."},{"n":"procedures-fonctions","q":"Lequel n&#39;est PAS un avantage du typage cité par le prof ?","o":["documentation intégrée","détection précoce des erreurs","le code devient obligatoirement plus rapide avec CPython"],"a":2,"e":"Le gain de vitesse ne concerne que des outils comme Cython ou PyPy, pas CPython."}]},{"id":"passage-parametres","t":"Passage par valeur et par adresse","seance":"Chapitre I (§3–4)","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir qu&#39;une liste se modifie sur place (<code>L[0] = 99<\/code>, <code>L.append(4)<\/code>) alors qu&#39;un entier ne se modifie jamais : <code>x = x + 1<\/code> crée un nouvel entier.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p><code>L = [1, 2]<\/code>, puis <code>M = L<\/code>, puis <code>M.append(3)<\/code>. Que vaut <code>L<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>[1, 2, 3]<\/code>. <code>M<\/code> et <code>L<\/code> sont deux noms pour <strong>la même<\/strong> liste.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Demande-toi : la fonction modifie-t-elle l&#39;objet, ou fabrique-t-elle un nouvel objet ?<\/strong> Modifier l&#39;objet → visible dehors. Nouvel objet → invisible dehors.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Croire que <code>incrementer(y)<\/code> change <code>y<\/code>. Avec un entier, la fonction travaille sur une copie (en pratique : un nouvel objet). <code>y<\/code> reste 5.<\/p>\n<\/aside><p>À la fin, tu sais prédire ce qu&#39;affiche un programme après l&#39;appel d&#39;une fonction, pour un <code>int<\/code>, une <code>str<\/code> ou une <code>list<\/code>.<\/p>\n<h2>Idée 1 · Par valeur : la fonction reçoit une copie<\/h2>\n<svg viewBox=\"0 0 560 110\" style=\"width:100%;max-width:560px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Passage par valeur : y vaut 5 dans l'appelant, x reçoit une copie 5 puis devient 6, y reste 5.\">\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\">\n<rect x=\"20\" y=\"30\" width=\"120\" height=\"44\" rx=\"6\" fill=\"none\" stroke=\"currentColor\"/><text x=\"80\" y=\"57\" text-anchor=\"middle\">y = 5<\/text>\n<text x=\"80\" y=\"20\" text-anchor=\"middle\">appelant<\/text>\n<text x=\"210\" y=\"57\" text-anchor=\"middle\">copie →<\/text>\n<rect x=\"280\" y=\"30\" width=\"120\" height=\"44\" rx=\"6\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"340\" y=\"57\" text-anchor=\"middle\">x = 5 → 6<\/text>\n<text x=\"340\" y=\"20\" text-anchor=\"middle\">fonction<\/text>\n<text x=\"420\" y=\"100\" fill=\"#D9824F\" font-weight=\"700\">y reste 5<\/text><\/g><\/svg><p>La fonction reçoit une <strong>copie<\/strong> de la valeur. Elle peut la changer : l&#39;original ne bouge pas.<\/p>\n<pre class=\"\"><code>def incrementer(x: int) -&gt; int:\n    x = x + 1\n    return x\n\ny: int = 5\nincrementer(y)\nprint(y)\ny = incrementer(y)   # pour changer y, on récupère le résultat\nprint(y)<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>5\n6<\/code><\/pre><p>Avantages : sécurité, comportement prévisible. Inconvénient : copier une grosse structure coûte du temps et de la mémoire.<\/p>\n<h2>Idée 2 · Par adresse : la fonction reçoit l&#39;original<\/h2>\n<p>La fonction reçoit <strong>l&#39;adresse<\/strong> de la donnée. Ce qu&#39;elle modifie, c&#39;est l&#39;original. Efficace (pas de copie), mais risque d&#39;effets de bord.<\/p>\n<figure class=\"grille\"><figcaption>L avant (ligne 1) et après (ligne 2) modifier(L)<\/figcaption><table><tr><th><\/th><th>0<\/th><th>1<\/th><th>2<\/th><\/tr><tr><th>avant<\/th><td>1<\/td><td>2<\/td><td>3<\/td><\/tr><tr><th>après<\/th><td class=\"h1\">99<\/td><td>2<\/td><td>3<\/td><\/tr><\/table><\/figure><pre class=\"\"><code>def modifier(liste: list[int]) -&gt; None:\n    liste[0] = 99\n\nL: list[int] = [1, 2, 3]\nmodifier(L)\nprint(L)<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>[99, 2, 3]<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Dans le polycopié, cette fonction est typée <code>-&gt; list[int]<\/code> alors qu&#39;elle ne renvoie rien. Le bon type est <code>-&gt; None<\/code> (c&#39;est une procédure).<\/p>\n<\/aside><h2>Idée 3 · En Python : passage par affectation d&#39;objet<\/h2>\n<p>Python passe toujours <strong>une référence vers l&#39;objet<\/strong>. Le comportement dépend du type :<\/p>\n<p><strong>Ce qui se passe selon le type<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Exemples<\/th>\n<th>Se comporte comme<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>immuable<\/td>\n<td>int, float, str, tuple<\/td>\n<td>par valeur<\/td>\n<\/tr>\n<tr>\n<td>mutable<\/td>\n<td>list, dict, set<\/td>\n<td>par adresse<\/td>\n<\/tr>\n<\/tbody><\/table>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Prédire l'affichage après un appel<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · Repère le type de l&#39;argument<\/div><p>immuable (int, str…) ou mutable (list, dict…) ?<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · Regarde ce que fait la fonction<\/div><p>modification sur place (<code>L[0] = …<\/code>, <code>append<\/code>) ou réaffectation (<code>L = […]<\/code>, <code>x = x + 1<\/code>) ?<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · Conclus<\/div><p>mutable ET modification sur place → l&#39;original change. Sinon → il ne change pas.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><pre class=\"\"><code>def reaffecter(liste: list[int]) -&gt; None:\n    liste = [0, 0]          # nouvelle liste locale : le lien est rompu\n\ndef ajouter(liste: list[int]) -&gt; None:\n    liste.append(4)         # modification sur place\n\ndef crier(s: str) -&gt; None:\n    s = s.upper()           # str immuable : nouvel objet\n\nL = [1, 2, 3]; nom = &quot;fsabm&quot;\nreaffecter(L); ajouter(L); crier(nom)\nprint(L, nom)<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>[1, 2, 3, 4] fsabm<\/code><\/pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p><strong>Mutable + modifié sur place = visible dehors.<\/strong> Tout le reste est invisible dehors.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Prédire l&#39;affichage<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p><code>def f(t: list[int]) -&gt; None: t[1] = t[1] * 10<\/code>, puis <code>T = [1, 2, 3]<\/code>, <code>f(T)<\/code>, <code>print(T[1])<\/code>. Qu&#39;affiche le programme ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 20<\/b><\/p><p>La liste est mutable et modifiée sur place : <code>T[1]<\/code> passe de 2 à 20.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p><code>def g(n: int) -&gt; None: n = n * 10<\/code>, puis <code>a = 4<\/code>, <code>g(a)<\/code>, <code>print(a)<\/code> ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 4<\/b><\/p><p>Un entier est immuable : <code>a<\/code> ne change pas.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Comment protéger une liste d&#39;une fonction qui la modifie ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Passer une copie : <code>f(L.copy())<\/code> ou <code>f(L[:])<\/code>. La fonction modifie la copie, <code>L<\/code> reste intacte.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\"><code>y = 5<\/code>, <code>incrementer(y)<\/code> (qui fait <code>x = x + 1; return x<\/code>), puis <code>print(y)<\/code>. Affichage ?<\/div><button class=\"opt\" data-o=\"0\">5<\/button><button class=\"opt\" data-o=\"1\">6<\/button><button class=\"opt\" data-o=\"2\">None<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\"><code>L = [1, 2, 3]<\/code>, <code>modifier(L)<\/code> qui fait <code>liste[0] = 99<\/code>. Que vaut <code>L<\/code> ?<\/div><button class=\"opt\" data-o=\"0\"><code>[1, 2, 3]<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>[99, 2, 3]<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>[99]<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Comment le prof qualifie-t-il le passage des paramètres en Python ?<\/div><button class=\"opt\" data-o=\"0\">toujours par valeur<\/button><button class=\"opt\" data-o=\"1\">toujours par adresse<\/button><button class=\"opt\" data-o=\"2\">par affectation d&#39;objet (valeur de référence)<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Lequel de ces types est mutable ?<\/div><button class=\"opt\" data-o=\"0\">tuple<\/button><button class=\"opt\" data-o=\"1\">str<\/button><button class=\"opt\" data-o=\"2\">dict<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Un inconvénient du passage par valeur ?<\/div><button class=\"opt\" data-o=\"0\">La copie de grosses structures coûte mémoire et temps<\/button><button class=\"opt\" data-o=\"1\">Il modifie les données par erreur<\/button><button class=\"opt\" data-o=\"2\">Il est imprévisible<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Un inconvénient du passage par adresse ?<\/div><button class=\"opt\" data-o=\"0\">Il copie tout<\/button><button class=\"opt\" data-o=\"1\">Risque de modifier l&#39;original par erreur (effet de bord)<\/button><button class=\"opt\" data-o=\"2\">Il est impossible en Python<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\"><code>def f(L): L = [7]<\/code>, puis <code>A = [1]<\/code>, <code>f(A)<\/code>. Que vaut <code>A<\/code> ?<\/div><button class=\"opt\" data-o=\"0\"><code>[1]<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>[7]<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>[1, 7]<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\"><code>def f(L): L.append(7)<\/code>, puis <code>A = [1]<\/code>, <code>f(A)<\/code>. Que vaut <code>A<\/code> ?<\/div><button class=\"opt\" data-o=\"0\"><code>[1]<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>[1, 7]<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>[7]<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\"><code>def f(s): s = s + &quot;!&quot;<\/code>, puis <code>m = &quot;ok&quot;<\/code>, <code>f(m)<\/code>. Que vaut <code>m<\/code> ?<\/div><button class=\"opt\" data-o=\"0\"><code>&quot;ok&quot;<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>&quot;ok!&quot;<\/code><\/button><button class=\"opt\" data-o=\"2\">erreur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Quel type de retour convient à <code>def modifier(liste: list[int])<\/code> qui ne renvoie rien ?<\/div><button class=\"opt\" data-o=\"0\"><code>-&gt; list[int]<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>-&gt; None<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>-&gt; int<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"passage-parametres","rep":null,"tol":null},{"n":"passage-parametres","rep":["20"],"tol":null},{"n":"passage-parametres","rep":["4"],"tol":null},{"n":"passage-parametres","rep":null,"tol":null}],"qcm":[{"n":"passage-parametres","q":"<code>y = 5<\/code>, <code>incrementer(y)<\/code> (qui fait <code>x = x + 1; return x<\/code>), puis <code>print(y)<\/code>. Affichage ?","o":["5","6","None"],"a":0,"e":"Le résultat n&#39;est pas récupéré et l&#39;entier original ne change pas."},{"n":"passage-parametres","q":"<code>L = [1, 2, 3]<\/code>, <code>modifier(L)<\/code> qui fait <code>liste[0] = 99<\/code>. Que vaut <code>L<\/code> ?","o":["<code>[1, 2, 3]<\/code>","<code>[99, 2, 3]<\/code>","<code>[99]<\/code>"],"a":1,"e":"La liste est modifiée sur place via sa référence."},{"n":"passage-parametres","q":"Comment le prof qualifie-t-il le passage des paramètres en Python ?","o":["toujours par valeur","toujours par adresse","par affectation d&#39;objet (valeur de référence)"],"a":2,"e":"Python passe une référence vers l&#39;objet."},{"n":"passage-parametres","q":"Lequel de ces types est mutable ?","o":["tuple","str","dict"],"a":2,"e":"dict, list et set sont mutables."},{"n":"passage-parametres","q":"Un inconvénient du passage par valeur ?","o":["La copie de grosses structures coûte mémoire et temps","Il modifie les données par erreur","Il est imprévisible"],"a":0,"e":"Copier coûte cher pour les grandes structures."},{"n":"passage-parametres","q":"Un inconvénient du passage par adresse ?","o":["Il copie tout","Risque de modifier l&#39;original par erreur (effet de bord)","Il est impossible en Python"],"a":1,"e":"C&#39;est le revers de son efficacité."},{"n":"passage-parametres","q":"<code>def f(L): L = [7]<\/code>, puis <code>A = [1]<\/code>, <code>f(A)<\/code>. Que vaut <code>A<\/code> ?","o":["<code>[1]<\/code>","<code>[7]<\/code>","<code>[1, 7]<\/code>"],"a":0,"e":"La réaffectation crée une liste locale ; <code>A<\/code> n&#39;est pas touché."},{"n":"passage-parametres","q":"<code>def f(L): L.append(7)<\/code>, puis <code>A = [1]<\/code>, <code>f(A)<\/code>. Que vaut <code>A<\/code> ?","o":["<code>[1]<\/code>","<code>[1, 7]<\/code>","<code>[7]<\/code>"],"a":1,"e":"<code>append<\/code> modifie la liste partagée."},{"n":"passage-parametres","q":"<code>def f(s): s = s + &quot;!&quot;<\/code>, puis <code>m = &quot;ok&quot;<\/code>, <code>f(m)<\/code>. Que vaut <code>m<\/code> ?","o":["<code>&quot;ok&quot;<\/code>","<code>&quot;ok!&quot;<\/code>","erreur"],"a":0,"e":"Une chaîne est immuable."},{"n":"passage-parametres","q":"Quel type de retour convient à <code>def modifier(liste: list[int])<\/code> qui ne renvoie rien ?","o":["<code>-&gt; list[int]<\/code>","<code>-&gt; None<\/code>","<code>-&gt; int<\/code>"],"a":1,"e":"Sans <code>return<\/code>, la fonction renvoie <code>None<\/code> : c&#39;est une procédure."}]},{"id":"portee-variables","t":"Portée des variables · global, local, nonlocal","seance":"Chapitre I (§5)","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir définir une fonction et l&#39;appeler, et savoir qu&#39;une fonction peut être écrite <strong>dans<\/strong> une autre.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p><code>def f(): a = 1<\/code> puis <code>f()<\/code> puis <code>print(a)<\/code>. Que se passe-t-il ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>NameError<\/code> : <code>a<\/code> n&#39;existe que pendant l&#39;appel de <code>f<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense en boîtes emboîtées.<\/strong> Le script est la grande boîte (global). Chaque fonction est une boîte dedans (local). Une fonction dans une fonction est une boîte encore plus petite.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Écrire <code>x = …<\/code> dans une fonction en croyant modifier la globale <code>x<\/code>. Sans <code>global x<\/code>, Python crée une <strong>nouvelle<\/strong> variable locale.<\/p>\n<\/aside><p>À la fin, tu sais dire, pour chaque variable, où elle vit et qui peut la modifier.<\/p>\n<h2>Idée 1 · Trois niveaux de portée<\/h2>\n<svg viewBox=\"0 0 560 170\" style=\"width:100%;max-width:560px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Trois boîtes emboîtées : le script (global), la fonction externe (enclosing, nonlocal), la fonction interne (local).\">\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\">\n<rect x=\"10\" y=\"10\" width=\"540\" height=\"150\" rx=\"10\" fill=\"none\" stroke=\"currentColor\"/><text x=\"24\" y=\"30\">Script : variables GLOBALES (modifiables avec global)<\/text>\n<rect x=\"40\" y=\"45\" width=\"480\" height=\"100\" rx=\"10\" fill=\"none\" stroke=\"currentColor\" stroke-dasharray=\"5 4\"/><text x=\"54\" y=\"65\">externe() : z (modifiable depuis interne avec nonlocal)<\/text>\n<rect x=\"80\" y=\"80\" width=\"400\" height=\"50\" rx=\"10\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"280\" y=\"110\" text-anchor=\"middle\" fill=\"#D9824F\" font-weight=\"700\">interne() : variables LOCALES<\/text>\n<\/g><\/svg><ul>\n<li><strong>Globale<\/strong> : définie au niveau du script, lisible partout.<\/li>\n<li><strong>Locale<\/strong> : créée dans une fonction à l&#39;appel, détruite à la fin.<\/li>\n<li><strong>Nonlocale<\/strong> : variable de la fonction englobante, modifiée depuis une fonction imbriquée.<\/li>\n<\/ul>\n<h2>Idée 2 · <code>global<\/code> pour modifier une globale<\/h2>\n<pre class=\"\"><code>x: str = &quot;global&quot;\n\ndef sans_global() -&gt; None:\n    x = &quot;locale&quot;          # crée une locale, la globale ne change pas\n\ndef exemple() -&gt; None:\n    global x\n    x = &quot;modifiée globalement&quot;\n\nsans_global(); print(x)\nexemple(); print(x)<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>global\nmodifiée globalement<\/code><\/pre><p>Une locale n&#39;existe pas dehors :<\/p>\n<pre class=\"\"><code>def exemple() -&gt; None:\n    y: str = &quot;locale&quot;\n    print(y)\n\nexemple()   # affiche : locale\nprint(y)    # NameError: name 'y' is not defined<\/code><\/pre><h2>Idée 3 · <code>nonlocal<\/code> pour les fonctions imbriquées<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Lire l'exemple nonlocal du prof<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Appel de externe()<\/div><p>z vaut &quot;externe&quot; dans la boîte d&#39;externe.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Appel de interne()<\/div><p><code>nonlocal z<\/code> dit : « le z dont je parle est celui de la boîte juste au-dessus ».<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Affectation<\/div><p>z devient &quot;modifiée par interne&quot; dans externe.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · print(z) dans externe<\/div><p>affiche la valeur modifiée.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><pre class=\"\"><code>def externe() -&gt; None:\n    z: str = &quot;externe&quot;\n    def interne() -&gt; None:\n        nonlocal z\n        z = &quot;modifiée par interne&quot;\n    interne()\n    print(z)\n\nexterne()<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>modifiée par interne<\/code><\/pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p><code>global<\/code> vise le script. <code>nonlocal<\/code> vise la fonction englobante <strong>la plus proche<\/strong>. <code>nonlocal<\/code> ne marche pas pour une variable globale (SyntaxError).<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Qui modifie quoi ?<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p><code>c = 0<\/code>, <code>def inc(): global c; c += 1<\/code>, on appelle <code>inc()<\/code> trois fois. Que vaut <code>c<\/code> ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 3<\/b><\/p><p><code>global c<\/code> fait pointer sur la globale : 0 → 1 → 2 → 3.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Même code SANS la ligne <code>global c<\/code>. Que se passe-t-il à l&#39;appel ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>UnboundLocalError<\/code> : <code>c += 1<\/code> fait de <code>c<\/code> une locale, lue avant d&#39;être affectée.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p><code>def a(): n = 1; def b(): nonlocal n; n = n + 5; b(); return n<\/code>. Que renvoie <code>a()<\/code> ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 6<\/b><\/p><p><code>b<\/code> modifie le <code>n<\/code> de <code>a<\/code> : 1 + 5 = 6.<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 6 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Une variable créée dans une fonction est…<\/div><button class=\"opt\" data-o=\"0\">locale<\/button><button class=\"opt\" data-o=\"1\">globale<\/button><button class=\"opt\" data-o=\"2\">nonlocale<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Quel mot-clé permet de modifier une globale dans une fonction ?<\/div><button class=\"opt\" data-o=\"0\">nonlocal<\/button><button class=\"opt\" data-o=\"1\">global<\/button><button class=\"opt\" data-o=\"2\">extern<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\"><code>nonlocal<\/code> sert…<\/div><button class=\"opt\" data-o=\"0\">à créer une globale<\/button><button class=\"opt\" data-o=\"1\">à modifier une variable de la fonction englobante<\/button><button class=\"opt\" data-o=\"2\">à supprimer une variable<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\"><code>x = 1<\/code>, <code>def f(): x = 2<\/code>, <code>f()<\/code>, <code>print(x)<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">1<\/button><button class=\"opt\" data-o=\"1\">2<\/button><button class=\"opt\" data-o=\"2\">erreur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\"><code>def f(): y = 3<\/code>, <code>f()<\/code>, <code>print(y)<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">3<\/button><button class=\"opt\" data-o=\"1\">None<\/button><button class=\"opt\" data-o=\"2\">NameError<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Combien de types de portée le prof distingue-t-il ?<\/div><button class=\"opt\" data-o=\"0\">2<\/button><button class=\"opt\" data-o=\"1\">3<\/button><button class=\"opt\" data-o=\"2\">4<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Où utilise-t-on <code>nonlocal<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">dans le script principal<\/button><button class=\"opt\" data-o=\"1\">dans une fonction imbriquée<\/button><button class=\"opt\" data-o=\"2\">dans une classe uniquement<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\"><code>c = 0<\/code>, <code>def f(): c += 1<\/code>, <code>f()<\/code> donne…<\/div><button class=\"opt\" data-o=\"0\">c vaut 1<\/button><button class=\"opt\" data-o=\"1\">UnboundLocalError<\/button><button class=\"opt\" data-o=\"2\">c vaut 0<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Quand une variable locale est-elle détruite ?<\/div><button class=\"opt\" data-o=\"0\">à la fin de l&#39;exécution de la fonction<\/button><button class=\"opt\" data-o=\"1\">à la fin du programme<\/button><button class=\"opt\" data-o=\"2\">jamais<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\"><code>global x<\/code> dans une fonction, puis <code>x = 5<\/code>. Résultat ?<\/div><button class=\"opt\" data-o=\"0\">une locale x = 5<\/button><button class=\"opt\" data-o=\"1\">la globale x vaut 5<\/button><button class=\"opt\" data-o=\"2\">une erreur<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"portee-variables","rep":null,"tol":null},{"n":"portee-variables","rep":["3"],"tol":null},{"n":"portee-variables","rep":null,"tol":null},{"n":"portee-variables","rep":["6"],"tol":null}],"qcm":[{"n":"portee-variables","q":"Une variable créée dans une fonction est…","o":["locale","globale","nonlocale"],"a":0,"e":"Elle n&#39;existe que pendant l&#39;appel."},{"n":"portee-variables","q":"Quel mot-clé permet de modifier une globale dans une fonction ?","o":["nonlocal","global","extern"],"a":1,"e":"<code>global x<\/code> pointe vers la variable du script."},{"n":"portee-variables","q":"<code>nonlocal<\/code> sert…","o":["à créer une globale","à modifier une variable de la fonction englobante","à supprimer une variable"],"a":1,"e":"Il vise la portée parente la plus proche."},{"n":"portee-variables","q":"<code>x = 1<\/code>, <code>def f(): x = 2<\/code>, <code>f()<\/code>, <code>print(x)<\/code> ?","o":["1","2","erreur"],"a":0,"e":"Sans <code>global<\/code>, <code>x = 2<\/code> crée une locale."},{"n":"portee-variables","q":"<code>def f(): y = 3<\/code>, <code>f()<\/code>, <code>print(y)<\/code> ?","o":["3","None","NameError"],"a":2,"e":"<code>y<\/code> est détruite à la fin de l&#39;appel."},{"n":"portee-variables","q":"Combien de types de portée le prof distingue-t-il ?","o":["2","3","4"],"a":1,"e":"Globale, locale et nonlocale."},{"n":"portee-variables","q":"Où utilise-t-on <code>nonlocal<\/code> ?","o":["dans le script principal","dans une fonction imbriquée","dans une classe uniquement"],"a":1,"e":"Il n&#39;a de sens que dans une fonction définie dans une autre."},{"n":"portee-variables","q":"<code>c = 0<\/code>, <code>def f(): c += 1<\/code>, <code>f()<\/code> donne…","o":["c vaut 1","UnboundLocalError","c vaut 0"],"a":1,"e":"<code>c<\/code> est vue comme locale, lue avant affectation."},{"n":"portee-variables","q":"Quand une variable locale est-elle détruite ?","o":["à la fin de l&#39;exécution de la fonction","à la fin du programme","jamais"],"a":0,"e":"Elle vit le temps de l&#39;appel."},{"n":"portee-variables","q":"<code>global x<\/code> dans une fonction, puis <code>x = 5<\/code>. Résultat ?","o":["une locale x = 5","la globale x vaut 5","une erreur"],"a":1,"e":"La globale est modifiée."}]},{"id":"recursivite","t":"Récursivité terminale et non terminale","seance":"Chapitre II","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir écrire une fonction avec <code>if<\/code>/<code>else<\/code> et <code>return<\/code>.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Écris la factorielle 5! = 5 × 4 × 3 × 2 × 1. Combien vaut-elle ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 120<\/b><\/p><p>5 × 4 = 20, × 3 = 60, × 2 = 120.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Fais confiance à l&#39;appel récursif.<\/strong> Suppose que <code>somme(n - 1)<\/code> marche, et demande-toi seulement comment obtenir <code>somme(n)<\/code> à partir de lui.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Oublier le <strong>cas de base<\/strong> (ou ne jamais l&#39;atteindre). La fonction s&#39;appelle à l&#39;infini : <code>RecursionError<\/code>.<\/p>\n<\/aside><p>À la fin, tu sais écrire une fonction récursive et dire si elle est terminale ou non.<\/p>\n<h2>Idée 1 · Une fonction qui s&#39;appelle elle-même<\/h2>\n<p>Deux ingrédients obligatoires : un <strong>cas de base<\/strong> qui renvoie directement, et un <strong>appel récursif<\/strong> sur un problème plus petit.<\/p>\n<pre class=\"\"><code>def somme(n: int) -&gt; int:\n    if n == 0:\n        return 0                 # cas de base\n    else:\n        return n + somme(n - 1)  # appel sur un problème plus petit\n\nresultat: int = somme(5)\nprint(&quot;Somme des nombres de 1 à 5 :&quot;, resultat)<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Somme des nombres de 1 à 5 : 15<\/code><\/pre><h2>Idée 2 · Non terminale : du travail APRÈS l&#39;appel<\/h2>\n<p>Dans <code>n + somme(n - 1)<\/code>, il reste une addition à faire après le retour. Chaque appel attend sur une <strong>pile<\/strong>.<\/p>\n<svg viewBox=\"0 0 560 190\" style=\"width:100%;max-width:560px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Pile d'appels de somme(3) : on empile somme(3), somme(2), somme(1), somme(0) qui renvoie 0, puis on dépile 1, 3, 6.\">\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\">\n<rect x=\"40\" y=\"140\" width=\"200\" height=\"30\" fill=\"none\" stroke=\"currentColor\"/><text x=\"140\" y=\"160\" text-anchor=\"middle\">somme(3) attend 3 + …<\/text>\n<rect x=\"40\" y=\"105\" width=\"200\" height=\"30\" fill=\"none\" stroke=\"currentColor\"/><text x=\"140\" y=\"125\" text-anchor=\"middle\">somme(2) attend 2 + …<\/text>\n<rect x=\"40\" y=\"70\" width=\"200\" height=\"30\" fill=\"none\" stroke=\"currentColor\"/><text x=\"140\" y=\"90\" text-anchor=\"middle\">somme(1) attend 1 + …<\/text>\n<rect x=\"40\" y=\"35\" width=\"200\" height=\"30\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"140\" y=\"55\" text-anchor=\"middle\" fill=\"#D9824F\">somme(0) = 0 (cas de base)<\/text>\n<text x=\"140\" y=\"22\" text-anchor=\"middle\">empiler ↑<\/text>\n<text x=\"300\" y=\"55\">dépiler : 0<\/text><text x=\"300\" y=\"90\">1 + 0 = 1<\/text><text x=\"300\" y=\"125\">2 + 1 = 3<\/text><text x=\"300\" y=\"160\" fill=\"#D9824F\" font-weight=\"700\">3 + 3 = 6<\/text>\n<\/g><\/svg><h2>Idée 3 · Terminale : l&#39;appel récursif est la DERNIÈRE action<\/h2>\n<p>On transporte le résultat partiel dans un <strong>accumulateur<\/strong> <code>acc<\/code>. Le retour de l&#39;appel est renvoyé tel quel, sans calcul.<\/p>\n<figure class=\"grille\"><figcaption>factorielle(4) en version terminale : (n, acc) à chaque appel<\/figcaption><table><tr><th><\/th><th>n<\/th><th>acc<\/th><\/tr><tr><th>appel1<\/th><td>4<\/td><td>1<\/td><\/tr><tr><th>appel2<\/th><td>3<\/td><td>4<\/td><\/tr><tr><th>appel3<\/th><td>2<\/td><td>12<\/td><\/tr><tr><th>appel4<\/th><td>1<\/td><td>24<\/td><\/tr><tr><th>appel5<\/th><td class=\"h1\">0<\/td><td class=\"h1\">24<\/td><\/tr><\/table><\/figure><pre class=\"\"><code>def factorielle(n: int, acc: int = 1) -&gt; int:\n    if n == 0:\n        return acc\n    else:\n        return factorielle(n - 1, acc * n)\n\nprint(&quot;Factorielle de 5 :&quot;, factorielle(5))<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Factorielle de 5 : 120<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Dans le <strong>pseudo-code<\/strong> du polycopié, le cas de base écrit <code>RETOURNER 1<\/code>. Avec un accumulateur, il faut <code>RETOURNER acc<\/code> (comme dans la version Python du prof) : sinon la fonction renverrait toujours 1.<\/p>\n<\/aside><figure class=\"etapes\" data-i=\"0\"><figcaption>Rendre une récursion terminale<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Repère le calcul fait après l&#39;appel<\/div><p>dans <code>n + somme(n - 1)<\/code>, c&#39;est <code>n + …<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Ajoute un accumulateur<\/div><p>paramètre <code>acc<\/code> avec une valeur de départ neutre (0 pour une somme, 1 pour un produit).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Fais le calcul AVANT l&#39;appel<\/div><p><code>return somme_t(n - 1, acc + n)<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Cas de base<\/div><p>renvoie <code>acc<\/code>.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p><strong>Terminale<\/strong> = rien après l&#39;appel (<code>return f(...)<\/code>). <strong>Non terminale<\/strong> = une opération attend le retour (<code>return n + f(...)<\/code>).<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Écrire des récursions<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Écris <code>somme_t(n, acc=0)<\/code> terminale. Que vaut <code>somme_t(4)<\/code> ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 10<\/b><\/p><p><code>if n == 0: return acc<\/code> sinon <code>return somme_t(n - 1, acc + n)<\/code>. 4 + 3 + 2 + 1 = 10.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>(Examen blanc, Q23) Écris <code>somme_recursive(L)<\/code> qui renvoie la somme d&#39;une liste. Que vaut <code>somme_recursive([2, 5, 1])<\/code> ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 8<\/b><\/p><p>Cas de base <code>if len(L) == 0: return 0<\/code>, sinon <code>return L[0] + somme_recursive(L[1:])<\/code>. Elle est non terminale.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p><code>puissance(x, n)<\/code> : écris-la récursivement.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>if n == 0: return 1<\/code> sinon <code>return x * puissance(x, n - 1)<\/code>. Non terminale.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quelle version est terminale ?<\/div><button class=\"opt\" data-o=\"0\"><code>return n * f(n - 1)<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>return f(n - 1, acc * n)<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>return 1 + f(n - 1)<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Que vaut <code>somme(4)<\/code> avec <code>return n + somme(n - 1)<\/code> et <code>somme(0) = 0<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">4<\/button><button class=\"opt\" data-o=\"1\">10<\/button><button class=\"opt\" data-o=\"2\">24<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Sans cas de base, une fonction récursive…<\/div><button class=\"opt\" data-o=\"0\">renvoie None<\/button><button class=\"opt\" data-o=\"1\">provoque une RecursionError<\/button><button class=\"opt\" data-o=\"2\">s&#39;arrête au bout de 10 appels<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Quelle structure la récursion non terminale utilise-t-elle ?<\/div><button class=\"opt\" data-o=\"0\">une pile<\/button><button class=\"opt\" data-o=\"1\">une file<\/button><button class=\"opt\" data-o=\"2\">un dictionnaire<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Dans <code>factorielle(n, acc=1)<\/code>, que renvoie le cas de base ?<\/div><button class=\"opt\" data-o=\"0\">1<\/button><button class=\"opt\" data-o=\"1\"><code>acc<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>n<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\"><code>factorielle(3)<\/code> version terminale : valeurs de acc successives ?<\/div><button class=\"opt\" data-o=\"0\">1, 3, 6, 6<\/button><button class=\"opt\" data-o=\"1\">1, 2, 6, 24<\/button><button class=\"opt\" data-o=\"2\">3, 2, 1<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Valeur initiale d&#39;un accumulateur pour une somme ?<\/div><button class=\"opt\" data-o=\"0\">0<\/button><button class=\"opt\" data-o=\"1\">1<\/button><button class=\"opt\" data-o=\"2\">None<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\"><code>somme_recursive([4, 6])<\/code> avec <code>L[0] + somme_recursive(L[1:])<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">4<\/button><button class=\"opt\" data-o=\"1\">10<\/button><button class=\"opt\" data-o=\"2\">6<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Que fait <code>L[1:]<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">supprime L[1]<\/button><button class=\"opt\" data-o=\"1\">renvoie la liste sans son premier élément<\/button><button class=\"opt\" data-o=\"2\">renvoie le deuxième élément<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\"><code>return f(n - 1) + 1<\/code> est…<\/div><button class=\"opt\" data-o=\"0\">terminale<\/button><button class=\"opt\" data-o=\"1\">non terminale<\/button><button class=\"opt\" data-o=\"2\">impossible<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"recursivite","rep":["120"],"tol":null},{"n":"recursivite","rep":["10"],"tol":null},{"n":"recursivite","rep":["8"],"tol":null},{"n":"recursivite","rep":null,"tol":null}],"qcm":[{"n":"recursivite","q":"Quelle version est terminale ?","o":["<code>return n * f(n - 1)<\/code>","<code>return f(n - 1, acc * n)<\/code>","<code>return 1 + f(n - 1)<\/code>"],"a":1,"e":"Rien n&#39;est calculé après l&#39;appel."},{"n":"recursivite","q":"Que vaut <code>somme(4)<\/code> avec <code>return n + somme(n - 1)<\/code> et <code>somme(0) = 0<\/code> ?","o":["4","10","24"],"a":1,"e":"4 + 3 + 2 + 1 + 0."},{"n":"recursivite","q":"Sans cas de base, une fonction récursive…","o":["renvoie None","provoque une RecursionError","s&#39;arrête au bout de 10 appels"],"a":1,"e":"Elle s&#39;appelle sans fin jusqu&#39;à saturer la pile."},{"n":"recursivite","q":"Quelle structure la récursion non terminale utilise-t-elle ?","o":["une pile","une file","un dictionnaire"],"a":0,"e":"Les appels en attente sont empilés."},{"n":"recursivite","q":"Dans <code>factorielle(n, acc=1)<\/code>, que renvoie le cas de base ?","o":["1","<code>acc<\/code>","<code>n<\/code>"],"a":1,"e":"L&#39;accumulateur contient le résultat complet."},{"n":"recursivite","q":"<code>factorielle(3)<\/code> version terminale : valeurs de acc successives ?","o":["1, 3, 6, 6","1, 2, 6, 24","3, 2, 1"],"a":0,"e":"acc = 1, puis 1×3, puis 3×2, puis 6×1."},{"n":"recursivite","q":"Valeur initiale d&#39;un accumulateur pour une somme ?","o":["0","1","None"],"a":0,"e":"0 est neutre pour l&#39;addition."},{"n":"recursivite","q":"<code>somme_recursive([4, 6])<\/code> avec <code>L[0] + somme_recursive(L[1:])<\/code> ?","o":["4","10","6"],"a":1,"e":"4 + (6 + 0)."},{"n":"recursivite","q":"Que fait <code>L[1:]<\/code> ?","o":["supprime L[1]","renvoie la liste sans son premier élément","renvoie le deuxième élément"],"a":1,"e":"C&#39;est une tranche à partir de l&#39;indice 1."},{"n":"recursivite","q":"<code>return f(n - 1) + 1<\/code> est…","o":["terminale","non terminale","impossible"],"a":1,"e":"L&#39;addition se fait après le retour de l&#39;appel."}]},{"id":"enregistrements-enumerations","t":"Enregistrements (dataclass) et énumérations","seance":"Chapitre III + namedtuple (Chapitre IV §5)","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir qu&#39;une variable peut contenir des valeurs de types différents (int, str, float) et savoir écrire une fonction typée.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Quel type donner à un prix comme 12.5 ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : float<\/b><\/p><p>Un nombre à virgule est un <code>float<\/code>.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Un enregistrement, c&#39;est une fiche.<\/strong> Une fiche « Produit » a des cases : nom, catégorie, prix. Chaque produit est une fiche remplie.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Écrire une classe avec seulement <code>x: int<\/code> et <code>y: int<\/code> (sans <code>@dataclass<\/code>), puis appeler <code>Point(3, 5)<\/code>. Python plante : <code>TypeError: Point() takes no arguments<\/code>.<\/p>\n<\/aside><p>À la fin, tu sais écrire une <code>@dataclass<\/code>, créer des instances, lire leurs champs et définir une <code>Enum<\/code>. C&#39;est le cœur de l&#39;examen blanc.<\/p>\n<h2>Idée 1 · L&#39;enregistrement regroupe des champs de types différents<\/h2>\n<svg viewBox=\"0 0 560 120\" style=\"width:100%;max-width:560px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Fiche Produit avec trois champs : nom de type str, categorie de type str, prix de type float ; on y accède par p.nom, p.categorie, p.prix.\">\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\">\n<rect x=\"20\" y=\"10\" width=\"300\" height=\"100\" rx=\"8\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"35\" y=\"30\" fill=\"#D9824F\" font-weight=\"700\">p : Produit<\/text>\n<text x=\"35\" y=\"55\">nom : str = \"Stylo\"<\/text><text x=\"35\" y=\"75\">categorie : str = \"Papeterie\"<\/text><text x=\"35\" y=\"95\">prix : float = 4.5<\/text>\n<text x=\"350\" y=\"55\">← p.nom<\/text><text x=\"350\" y=\"75\">← p.categorie<\/text><text x=\"350\" y=\"95\">← p.prix<\/text>\n<\/g><\/svg><p>En pseudo-code : <code>ENREGISTREMENT Point: x : ENTIER  y : ENTIER  FIN ENREGISTREMENT<\/code>. En Python, première méthode du prof : une classe avec <code>__init__<\/code>.<\/p>\n<pre class=\"\"><code>class Point:\n    def __init__(self, x: int, y: int):\n        self.x: int = x\n        self.y: int = y\n\npoint: Point = Point(3, 5)\nprint(&quot;Coordonnées du point :&quot;, point.x, &quot;,&quot;, point.y)<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Coordonnées du point : 3 , 5<\/code><\/pre><h2>Idée 2 · <code>@dataclass<\/code> : la méthode à retenir<\/h2>\n<p>Depuis Python 3.7, <code>@dataclass<\/code> écrit le <code>__init__<\/code> (et un affichage lisible) à ta place.<\/p>\n<pre class=\"\"><code>from dataclasses import dataclass\n\n@dataclass\nclass Produit:\n    nom: str\n    categorie: str\n    prix: float\n\np = Produit(&quot;Stylo&quot;, &quot;Papeterie&quot;, 4.5)\nprint(p.nom, p.prix)\nprint(p)\np.prix = 5.0          # les champs sont modifiables\nprint(p.prix)<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Stylo 4.5\nProduit(nom='Stylo', categorie='Papeterie', prix=4.5)\n5.0<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le polycopié propose une « deuxième méthode » : une classe avec seulement <code>x: int<\/code> et <code>y: int<\/code>, sans <code>@dataclass<\/code>. Ce code <strong>plante<\/strong> à <code>Point(3, 5)<\/code> (<code>TypeError<\/code>), car aucune méthode <code>__init__<\/code> n&#39;est créée. Il faut ajouter <code>@dataclass<\/code> au-dessus de la classe.<\/p>\n<\/aside><aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>L&#39;examen blanc commence par une <code>@dataclass Produit<\/code> (nom, catégorie, prix). Sache l&#39;écrire sans hésiter.<\/p>\n<\/aside><h2>Idée 3 · L&#39;énumération : un choix parmi une liste finie<\/h2>\n<pre class=\"\"><code>from enum import Enum\n\nclass JourSemaine(Enum):\n    LUNDI = 1\n    MARDI = 2\n    MERCREDI = 3\n    JEUDI = 4\n    VENDREDI = 5\n    SAMEDI = 6\n    DIMANCHE = 7\n\njour: JourSemaine = JourSemaine.MERCREDI\nprint(&quot;Aujourd'hui, c'est&quot;, jour)\nprint(jour.name, jour.value)\nprint(JourSemaine(5))<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Aujourd'hui, c'est JourSemaine.MERCREDI\nMERCREDI 3\nJourSemaine.VENDREDI<\/code><\/pre><h2>Idée 4 · <code>namedtuple<\/code> : un tuple avec des noms<\/h2>\n<pre class=\"\"><code>from collections import namedtuple\n\nPoint = namedtuple('Point', ['x', 'y', 'z'])\np = Point(1.5, 2.5, 0.0)\nprint(p.x, p[1])\nprint(p)<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>1.5 2.5\nPoint(x=1.5, y=2.5, z=0.0)<\/code><\/pre><p><strong>Choisir sa structure<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Outil<\/th>\n<th>Champs nommés<\/th>\n<th>Modifiable<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>@dataclass<\/td>\n<td>oui<\/td>\n<td>oui<\/td>\n<\/tr>\n<tr>\n<td>namedtuple<\/td>\n<td>oui<\/td>\n<td>non (tuple)<\/td>\n<\/tr>\n<tr>\n<td>Enum<\/td>\n<td>membres fixes<\/td>\n<td>non<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Fiches et énumérations<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>(Examen blanc, Q17) Écris la dataclass <code>Produit<\/code> (nom, catégorie, prix).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>from dataclasses import dataclass<\/code>, puis <code>@dataclass<\/code>, puis <code>class Produit:<\/code> avec les trois lignes <code>nom: str<\/code>, <code>categorie: str<\/code>, <code>prix: float<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Écris <code>Couleur(Enum)<\/code> avec ROUGE = 1, VERT = 2. Que vaut <code>Couleur.VERT.value<\/code> ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 2<\/b><\/p><p><code>.value<\/code> renvoie la valeur associée au membre.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Avec <code>P = namedtuple(&#39;P&#39;, [&#39;a&#39;, &#39;b&#39;])<\/code> et <code>q = P(1, 2)<\/code>, que fait <code>q.a = 5<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Erreur <code>AttributeError<\/code> : un namedtuple est un tuple, donc immuable.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 7 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quel module fournit <code>@dataclass<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">typing<\/button><button class=\"opt\" data-o=\"1\">dataclasses<\/button><button class=\"opt\" data-o=\"2\">collections<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Depuis quelle version de Python existe <code>dataclasses<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">3.5<\/button><button class=\"opt\" data-o=\"1\">3.7<\/button><button class=\"opt\" data-o=\"2\">2.7<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Avec <code>@dataclass class Produit: nom: str; prix: float<\/code>, comment créer un produit ?<\/div><button class=\"opt\" data-o=\"0\"><code>Produit(&quot;Stylo&quot;, 4.5)<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>Produit.nom = &quot;Stylo&quot;<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>new Produit(&quot;Stylo&quot;, 4.5)<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\"><code>print(p)<\/code> pour une dataclass affiche…<\/div><button class=\"opt\" data-o=\"0\">l&#39;adresse mémoire<\/button><button class=\"opt\" data-o=\"1\"><code>Produit(nom=&#39;Stylo&#39;, prix=4.5)<\/code><\/button><button class=\"opt\" data-o=\"2\">rien<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Quel module fournit <code>Enum<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">enum<\/button><button class=\"opt\" data-o=\"1\">dataclasses<\/button><button class=\"opt\" data-o=\"2\">typing<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\"><code>JourSemaine.MERCREDI.value<\/code> vaut…<\/div><button class=\"opt\" data-o=\"0\">&quot;MERCREDI&quot;<\/button><button class=\"opt\" data-o=\"1\">3<\/button><button class=\"opt\" data-o=\"2\">JourSemaine.MERCREDI<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Un namedtuple est-il modifiable ?<\/div><button class=\"opt\" data-o=\"0\">oui<\/button><button class=\"opt\" data-o=\"1\">non, c&#39;est un tuple<\/button><button class=\"opt\" data-o=\"2\">seulement ses champs numériques<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">D&#39;où vient <code>namedtuple<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">enum<\/button><button class=\"opt\" data-o=\"1\">collections<\/button><button class=\"opt\" data-o=\"2\">dataclasses<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\"><code>class Point: x: int; y: int<\/code> (sans décorateur), puis <code>Point(3, 5)<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">crée le point<\/button><button class=\"opt\" data-o=\"1\">TypeError<\/button><button class=\"opt\" data-o=\"2\">renvoie None<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">À quoi sert une énumération ?<\/div><button class=\"opt\" data-o=\"0\">à numéroter les lignes d&#39;un fichier<\/button><button class=\"opt\" data-o=\"1\">à limiter une variable à un ensemble fini de valeurs<\/button><button class=\"opt\" data-o=\"2\">à trier une liste<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"enregistrements-enumerations","rep":["float"],"tol":null},{"n":"enregistrements-enumerations","rep":null,"tol":null},{"n":"enregistrements-enumerations","rep":["2"],"tol":null},{"n":"enregistrements-enumerations","rep":null,"tol":null}],"qcm":[{"n":"enregistrements-enumerations","q":"Quel module fournit <code>@dataclass<\/code> ?","o":["typing","dataclasses","collections"],"a":1,"e":"<code>from dataclasses import dataclass<\/code>."},{"n":"enregistrements-enumerations","q":"Depuis quelle version de Python existe <code>dataclasses<\/code> ?","o":["3.5","3.7","2.7"],"a":1,"e":"Introduit en Python 3.7."},{"n":"enregistrements-enumerations","q":"Avec <code>@dataclass class Produit: nom: str; prix: float<\/code>, comment créer un produit ?","o":["<code>Produit(&quot;Stylo&quot;, 4.5)<\/code>","<code>Produit.nom = &quot;Stylo&quot;<\/code>","<code>new Produit(&quot;Stylo&quot;, 4.5)<\/code>"],"a":0,"e":"Le constructeur prend les champs dans l&#39;ordre."},{"n":"enregistrements-enumerations","q":"<code>print(p)<\/code> pour une dataclass affiche…","o":["l&#39;adresse mémoire","<code>Produit(nom=&#39;Stylo&#39;, prix=4.5)<\/code>","rien"],"a":1,"e":"La dataclass génère un affichage lisible."},{"n":"enregistrements-enumerations","q":"Quel module fournit <code>Enum<\/code> ?","o":["enum","dataclasses","typing"],"a":0,"e":"<code>from enum import Enum<\/code>."},{"n":"enregistrements-enumerations","q":"<code>JourSemaine.MERCREDI.value<\/code> vaut…","o":["&quot;MERCREDI&quot;","3","JourSemaine.MERCREDI"],"a":1,"e":"<code>.value<\/code> renvoie la valeur associée."},{"n":"enregistrements-enumerations","q":"Un namedtuple est-il modifiable ?","o":["oui","non, c&#39;est un tuple","seulement ses champs numériques"],"a":1,"e":"Les tuples sont immuables."},{"n":"enregistrements-enumerations","q":"D&#39;où vient <code>namedtuple<\/code> ?","o":["enum","collections","dataclasses"],"a":1,"e":"<code>from collections import namedtuple<\/code>."},{"n":"enregistrements-enumerations","q":"<code>class Point: x: int; y: int<\/code> (sans décorateur), puis <code>Point(3, 5)<\/code> ?","o":["crée le point","TypeError","renvoie None"],"a":1,"e":"Sans <code>@dataclass<\/code>, aucun constructeur à deux arguments n&#39;existe."},{"n":"enregistrements-enumerations","q":"À quoi sert une énumération ?","o":["à numéroter les lignes d&#39;un fichier","à limiter une variable à un ensemble fini de valeurs","à trier une liste"],"a":1,"e":"Elle rend explicites les choix possibles."}]},{"id":"dictionnaires-ensembles-tuples","t":"Listes, dictionnaires, ensembles et tuples","seance":"Chapitre IV + fonctions prédéfinies","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir créer une liste, lire <code>L[i]<\/code> et la parcourir avec <code>for<\/code>.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p><code>L = [4, 7, 9]<\/code>. Que vaut <code>L[1]<\/code> ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 7<\/b><\/p><p>Les indices commencent à 0 : <code>L[0] = 4<\/code>, <code>L[1] = 7<\/code>.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Choisis la structure selon la question que tu poses.<\/strong> « Le i-ème ? » → liste. « La valeur de cette clé ? » → dictionnaire. « Est-il dedans, sans doublon ? » → ensemble. « Valeurs fixes ? » → tuple.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Croire qu&#39;un ensemble garde l&#39;ordre ou qu&#39;on peut écrire <code>S[0]<\/code>. Un <code>set<\/code> n&#39;est pas ordonné : pas d&#39;indice, et <code>pop()<\/code> retire un élément imprévisible.<\/p>\n<\/aside><p>À la fin, tu connais les méthodes du polycopié (append, extend, insert, remove, pop, index, count, sort, reverse, add, update, discard, clear, keys, values, items, get, popitem) et ce qu&#39;elles renvoient.<\/p>\n<h2>Idée 1 · Quatre structures, quatre usages<\/h2>\n<table>\n<thead>\n<tr>\n<th>Structure<\/th>\n<th>Écriture<\/th>\n<th>Ordonnée<\/th>\n<th>Modifiable<\/th>\n<th>Doublons<\/th>\n<th>Type (typing)<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>liste<\/td>\n<td><code>[1, 2]<\/code><\/td>\n<td>oui<\/td>\n<td>oui<\/td>\n<td>oui<\/td>\n<td><code>List[int]<\/code><\/td>\n<\/tr>\n<tr>\n<td>tuple<\/td>\n<td><code>(10, 20)<\/code><\/td>\n<td>oui<\/td>\n<td><strong>non<\/strong><\/td>\n<td>oui<\/td>\n<td><code>Tuple[int, int]<\/code><\/td>\n<\/tr>\n<tr>\n<td>ensemble<\/td>\n<td><code>{1, 2}<\/code><\/td>\n<td><strong>non<\/strong><\/td>\n<td>oui<\/td>\n<td><strong>non<\/strong><\/td>\n<td><code>Set[int]<\/code><\/td>\n<\/tr>\n<tr>\n<td>dictionnaire<\/td>\n<td><code>{&quot;Alice&quot;: 123456}<\/code><\/td>\n<td>oui (3.7+)<\/td>\n<td>oui<\/td>\n<td>clés uniques<\/td>\n<td><code>Dict[str, int]<\/code><\/td>\n<\/tr>\n<\/tbody><\/table>\n<svg viewBox=\"0 0 560 100\" style=\"width:100%;max-width:560px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Un dictionnaire associe chaque clé à une valeur : Alice vers 123456, Bob vers 789012.\">\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\">\n<rect x=\"40\" y=\"15\" width=\"110\" height=\"30\" rx=\"6\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"95\" y=\"35\" text-anchor=\"middle\">\"Alice\"<\/text>\n<rect x=\"40\" y=\"55\" width=\"110\" height=\"30\" rx=\"6\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"95\" y=\"75\" text-anchor=\"middle\">\"Bob\"<\/text>\n<text x=\"200\" y=\"35\">→<\/text><text x=\"200\" y=\"75\">→<\/text>\n<rect x=\"240\" y=\"15\" width=\"110\" height=\"30\" rx=\"6\" fill=\"none\" stroke=\"currentColor\"/><text x=\"295\" y=\"35\" text-anchor=\"middle\">123456<\/text>\n<rect x=\"240\" y=\"55\" width=\"110\" height=\"30\" rx=\"6\" fill=\"none\" stroke=\"currentColor\"/><text x=\"295\" y=\"75\" text-anchor=\"middle\">789012<\/text>\n<text x=\"380\" y=\"55\">clé → valeur<\/text><\/g><\/svg><pre class=\"\"><code>from typing import Dict, Set, Tuple\nannuaire: Dict[str, int] = {&quot;Alice&quot;: 123456, &quot;Bob&quot;: 789012}\nprint(&quot;Numéro d'Alice :&quot;, annuaire[&quot;Alice&quot;])\nnombres: Set[int] = {1, 2, 3, 2}\nprint(nombres, 2 in nombres)\ncoordonnees: Tuple[int, int] = (10, 20)\nx, y = coordonnees          # déballage\nprint(x, y)<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Numéro d'Alice : 123456\n{1, 2, 3} True\n10 20<\/code><\/pre><h2>Idée 2 · Les méthodes des listes<\/h2>\n<pre class=\"\"><code>nombres = [1, 2, 4]\nnombres.append(5)        # ajoute à la fin\nnombres.insert(2, 3)     # insère 3 à l'indice 2\nnombres.extend([6, 2])   # ajoute plusieurs éléments\nprint(nombres)\nnombres.remove(2)        # supprime la PREMIÈRE occurrence de 2\nprint(nombres)\nprint(nombres.pop(), nombres.pop(0), nombres)\nprint(nombres.index(4), nombres.count(4))\nnombres.sort(reverse=True)\nprint(nombres)\nnombres.reverse()\nprint(nombres)<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>[1, 2, 3, 4, 5, 6, 2]\n[1, 3, 4, 5, 6, 2]\n2 1 [3, 4, 5, 6]\n1 1\n[6, 5, 4, 3]\n[3, 4, 5, 6]<\/code><\/pre><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p><code>append([6, 2])<\/code> ajoute <strong>une<\/strong> case contenant une liste ; <code>extend([6, 2])<\/code> ajoute <strong>deux<\/strong> cases. Et <code>remove(x)<\/code> enlève une <strong>valeur<\/strong>, <code>pop(i)<\/code> enlève un <strong>indice<\/strong> et renvoie l&#39;élément.<\/p>\n<\/aside><p>Un tuple n&#39;a que deux méthodes : <code>count()<\/code> et <code>index()<\/code> (il est immuable).<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le polycopié type un tuple de longueur variable <code>Tuple[int]<\/code>. Ce type veut dire « tuple d&#39;<strong>un seul<\/strong> entier ». Pour une longueur quelconque, écris <code>Tuple[int, ...]<\/code> (ou <code>tuple[int, ...]<\/code>).<\/p>\n<\/aside><h2>Idée 3 · Les méthodes des ensembles<\/h2>\n<pre class=\"\"><code>e = {1, 2}\ne.add(1)                 # déjà présent : aucun effet\ne.update([2, 3, 4])      # ajoute plusieurs éléments\nprint(e)\ne.remove(2)              # KeyError si absent\ne.discard(9)             # aucun effet si absent, pas d'erreur\nprint(e)\ne.clear()\nprint(e)<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>{1, 2, 3, 4}\n{1, 3, 4}\nset()<\/code><\/pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p><code>remove<\/code> lève <code>KeyError<\/code> si l&#39;élément est absent ; <code>discard<\/code> ne dit rien. <code>pop()<\/code> sur un ensemble retire un élément <strong>arbitraire<\/strong>.<\/p>\n<\/aside><h2>Idée 4 · Les méthodes des dictionnaires<\/h2>\n<pre class=\"\"><code>d = {'a': 1, 'b': 2, 'c': 3}\nprint(d.keys())\nprint(list(d.values()), list(d.items())[0])\nprint(d.get('a'), d.get('z'), d.get('z', 'Non trouvé'))\nprint(d.pop('b'), d)\nprint(d.popitem(), d)\nfor cle, valeur in d.items():\n    print(cle, &quot;-&gt;&quot;, valeur)<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>dict_keys(['a', 'b', 'c'])\n[1, 2, 3] ('a', 1)\n1 None Non trouvé\n2 {'a': 1, 'c': 3}\n('c', 3) {'a': 1}\na -&gt; 1<\/code><\/pre><figure class=\"etapes\" data-i=\"0\"><figcaption>Compter les occurrences avec un dictionnaire<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Crée un dictionnaire vide<\/div><p><code>compte = {}<\/code><\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Parcours les éléments<\/div><p><code>for x in L:<\/code><\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Ajoute 1 à la bonne clé<\/div><p><code>compte[x] = compte.get(x, 0) + 1<\/code> (get évite la KeyError la première fois)<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Résultat<\/div><p>pour <code>L = [&quot;a&quot;, &quot;b&quot;, &quot;a&quot;]<\/code>, <code>compte = {&#39;a&#39;: 2, &#39;b&#39;: 1}<\/code><\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Manipuler les collections<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p><code>L = [3, 1, 3, 2]<\/code>. Que vaut <code>L.count(3)<\/code> ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 2<\/b><\
