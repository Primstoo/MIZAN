/p><p>3 apparaît deux fois.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p><code>d = {&#39;x&#39;: 5}<\/code>. Que renvoie <code>d.get(&#39;y&#39;, 0)<\/code> ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0<\/b><\/p><p>La clé est absente : on obtient la valeur par défaut.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Élimine les doublons de <code>[4, 4, 1, 1, 2]<\/code> et renvoie une liste triée.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>sorted(set([4, 4, 1, 1, 2]))<\/code> donne <code>[1, 2, 4]<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Écris <code>compter(L)<\/code> qui renvoie le dictionnaire des occurrences.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>compte = {}<\/code> ; <code>for x in L: compte[x] = compte.get(x, 0) + 1<\/code> ; <code>return compte<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 9 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\"><code>L = [1, 2, 3, 2, 4]<\/code>, <code>L.remove(2)<\/code>. Que vaut L ?<\/div><button class=\"opt\" data-o=\"0\"><code>[1, 3, 2, 4]<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>[1, 3, 4]<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>[1, 2, 2, 4]<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\"><code>L = [1, 2, 3, 4]<\/code>, <code>L.pop(2)<\/code> renvoie…<\/div><button class=\"opt\" data-o=\"0\">2<\/button><button class=\"opt\" data-o=\"1\">3<\/button><button class=\"opt\" data-o=\"2\">4<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\"><code>L = [1, 2, 4]<\/code>, <code>L.insert(2, 3)<\/code>. L vaut…<\/div><button class=\"opt\" data-o=\"0\"><code>[1, 2, 3, 4]<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>[1, 3, 2, 4]<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>[1, 2, 4, 3]<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Quelle structure n&#39;accepte pas les doublons ?<\/div><button class=\"opt\" data-o=\"0\">liste<\/button><button class=\"opt\" data-o=\"1\">tuple<\/button><button class=\"opt\" data-o=\"2\">ensemble<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\"><code>{}<\/code> crée…<\/div><button class=\"opt\" data-o=\"0\">un dictionnaire vide<\/button><button class=\"opt\" data-o=\"1\">un ensemble vide<\/button><button class=\"opt\" data-o=\"2\">un tuple vide<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\"><code>d = {&#39;a&#39;: 1}<\/code>, <code>d[&#39;z&#39;]<\/code> provoque…<\/div><button class=\"opt\" data-o=\"0\">None<\/button><button class=\"opt\" data-o=\"1\">KeyError<\/button><button class=\"opt\" data-o=\"2\">0<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\"><code>{1, 2, 3}.remove(4)<\/code> provoque…<\/div><button class=\"opt\" data-o=\"0\">KeyError<\/button><button class=\"opt\" data-o=\"1\">rien<\/button><button class=\"opt\" data-o=\"2\">ValueError<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Quelles méthodes possède un tuple ?<\/div><button class=\"opt\" data-o=\"0\">append et remove<\/button><button class=\"opt\" data-o=\"1\">count et index<\/button><button class=\"opt\" data-o=\"2\">sort et reverse<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\"><code>e = {1, 2}<\/code>, <code>e.update([2, 3])<\/code>. e vaut…<\/div><button class=\"opt\" data-o=\"0\"><code>{1, 2, 2, 3}<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>{1, 2, 3}<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>{2, 3}<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\"><code>d = {&#39;a&#39;: 1, &#39;b&#39;: 2}<\/code>, <code>d.popitem()<\/code> renvoie…<\/div><button class=\"opt\" data-o=\"0\"><code>(&#39;a&#39;, 1)<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>(&#39;b&#39;, 2)<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>2<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"10\"><div class=\"qq-q\">Que vaut <code>x<\/code> après <code>x, y = (10, 20)<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">10<\/button><button class=\"opt\" data-o=\"1\">(10, 20)<\/button><button class=\"opt\" data-o=\"2\">20<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"dictionnaires-ensembles-tuples","rep":["7"],"tol":null},{"n":"dictionnaires-ensembles-tuples","rep":["2"],"tol":null},{"n":"dictionnaires-ensembles-tuples","rep":["0"],"tol":null},{"n":"dictionnaires-ensembles-tuples","rep":null,"tol":null},{"n":"dictionnaires-ensembles-tuples","rep":null,"tol":null}],"qcm":[{"n":"dictionnaires-ensembles-tuples","q":"<code>L = [1, 2, 3, 2, 4]<\/code>, <code>L.remove(2)<\/code>. Que vaut L ?","o":["<code>[1, 3, 2, 4]<\/code>","<code>[1, 3, 4]<\/code>","<code>[1, 2, 2, 4]<\/code>"],"a":0,"e":"Seule la première occurrence de 2 est supprimée."},{"n":"dictionnaires-ensembles-tuples","q":"<code>L = [1, 2, 3, 4]<\/code>, <code>L.pop(2)<\/code> renvoie…","o":["2","3","4"],"a":1,"e":"pop(2) supprime et renvoie l&#39;élément d&#39;indice 2."},{"n":"dictionnaires-ensembles-tuples","q":"<code>L = [1, 2, 4]<\/code>, <code>L.insert(2, 3)<\/code>. L vaut…","o":["<code>[1, 2, 3, 4]<\/code>","<code>[1, 3, 2, 4]<\/code>","<code>[1, 2, 4, 3]<\/code>"],"a":0,"e":"3 est placé à l&#39;indice 2."},{"n":"dictionnaires-ensembles-tuples","q":"Quelle structure n&#39;accepte pas les doublons ?","o":["liste","tuple","ensemble"],"a":2,"e":"Un set ne contient que des éléments uniques."},{"n":"dictionnaires-ensembles-tuples","q":"<code>{}<\/code> crée…","o":["un dictionnaire vide","un ensemble vide","un tuple vide"],"a":0,"e":"L&#39;ensemble vide s&#39;écrit <code>set()<\/code>."},{"n":"dictionnaires-ensembles-tuples","q":"<code>d = {&#39;a&#39;: 1}<\/code>, <code>d[&#39;z&#39;]<\/code> provoque…","o":["None","KeyError","0"],"a":1,"e":"Pour éviter l&#39;erreur, on utilise <code>d.get(&#39;z&#39;)<\/code>."},{"n":"dictionnaires-ensembles-tuples","q":"<code>{1, 2, 3}.remove(4)<\/code> provoque…","o":["KeyError","rien","ValueError"],"a":0,"e":"Contrairement à discard."},{"n":"dictionnaires-ensembles-tuples","q":"Quelles méthodes possède un tuple ?","o":["append et remove","count et index","sort et reverse"],"a":1,"e":"Il est immuable : seulement des méthodes de consultation."},{"n":"dictionnaires-ensembles-tuples","q":"<code>e = {1, 2}<\/code>, <code>e.update([2, 3])<\/code>. e vaut…","o":["<code>{1, 2, 2, 3}<\/code>","<code>{1, 2, 3}<\/code>","<code>{2, 3}<\/code>"],"a":1,"e":"Les doublons sont ignorés."},{"n":"dictionnaires-ensembles-tuples","q":"<code>d = {&#39;a&#39;: 1, &#39;b&#39;: 2}<\/code>, <code>d.popitem()<\/code> renvoie…","o":["<code>(&#39;a&#39;, 1)<\/code>","<code>(&#39;b&#39;, 2)<\/code>","<code>2<\/code>"],"a":1,"e":"Depuis Python 3.7, la dernière paire insérée."},{"n":"dictionnaires-ensembles-tuples","q":"Que vaut <code>x<\/code> après <code>x, y = (10, 20)<\/code> ?","o":["10","(10, 20)","20"],"a":0,"e":"C&#39;est le déballage d&#39;un tuple."}]},{"id":"fichiers","t":"Manipulation des fichiers et gestion des erreurs","seance":"Chapitre V","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir manipuler les chaînes de caractères (<code>len<\/code>, tranches <code>s[0:10]<\/code>) et les listes.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p><code>s = &quot;Beni Mellal&quot;<\/code>. Que vaut <code>s[0:4]<\/code> ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : Beni<\/b><\/p><p>Indices 0 à 3 (le 4 est exclu).<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Imagine un curseur de traitement de texte.<\/strong> Chaque lecture ou écriture le fait avancer. <code>tell()<\/code> dit où il est, <code>seek()<\/code> le déplace.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Ouvrir en mode <code>&quot;w&quot;<\/code> un fichier qui contient déjà des données : il est <strong>vidé<\/strong> à l&#39;ouverture. Pour ajouter à la fin, c&#39;est <code>&quot;a&quot;<\/code>.<\/p>\n<\/aside><p>À la fin, tu sais ouvrir, lire, écrire un fichier texte ou CSV, déplacer le curseur et gérer l&#39;erreur « fichier introuvable ».<\/p>\n<h2>Idée 1 · Ouvrir, lire, fermer<\/h2>\n<p>Deux types de fichiers : <strong>texte<\/strong> (lisible par l&#39;humain) et <strong>binaire<\/strong> (images, audio…).<\/p>\n<figure class=\"flux\"><figcaption>Cycle de vie d'un fichier<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">OUVRIR (open)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">LIRE / ÉCRIRE (read, write)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">FERMER (close)<\/div><\/div><\/figure><table>\n<thead>\n<tr>\n<th>Mode<\/th>\n<th>Rôle<\/th>\n<th>Si le fichier existe<\/th>\n<th>S&#39;il n&#39;existe pas<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>&quot;r&quot;<\/code><\/td>\n<td>lecture<\/td>\n<td>lit<\/td>\n<td>FileNotFoundError<\/td>\n<\/tr>\n<tr>\n<td><code>&quot;w&quot;<\/code><\/td>\n<td>écriture<\/td>\n<td><strong>l&#39;efface<\/strong><\/td>\n<td>le crée<\/td>\n<\/tr>\n<tr>\n<td><code>&quot;a&quot;<\/code><\/td>\n<td>ajout<\/td>\n<td>écrit à la fin<\/td>\n<td>le crée<\/td>\n<\/tr>\n<tr>\n<td><code>&quot;b&quot;<\/code><\/td>\n<td>binaire (avec r/w/a : <code>&quot;rb&quot;<\/code>)<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody><\/table>\n<pre class=\"\"><code>with open(&quot;mon_fichier.txt&quot;, &quot;w&quot;) as f:\n    f.write(&quot;Bonjour\\nFSABM\\n&quot;)\nwith open(&quot;mon_fichier.txt&quot;, &quot;a&quot;) as f:\n    f.write(&quot;Python 2\\n&quot;)\n\nf = open(&quot;mon_fichier.txt&quot;, &quot;r&quot;)\nfor ligne in f:\n    print(ligne.strip())       # strip enlève le \\n de fin de ligne\nf.close()\n\nwith open(&quot;mon_fichier.txt&quot;) as f:\n    print(f.readlines())<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Bonjour\nFSABM\nPython 2\n['Bonjour\\n', 'FSABM\\n', 'Python 2\\n']<\/code><\/pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p><code>with open(...) as f:<\/code> ferme le fichier <strong>automatiquement<\/strong>, même en cas d&#39;erreur. C&#39;est l&#39;équivalent de <code>OUVRIR ... COMME f<\/code> du pseudo-code du prof.<\/p>\n<\/aside><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Dans l&#39;exemple du polycopié, <code>print(ligne)<\/code> affiche une ligne vide entre chaque ligne : la ligne lue contient déjà son <code>\\n<\/code>, et <code>print<\/code> en ajoute un. Utilise <code>ligne.strip()<\/code> ou <code>print(ligne, end=&quot;&quot;)<\/code>.<\/p>\n<\/aside><h2>Idée 2 · Le curseur : <code>read(n)<\/code>, <code>tell()<\/code>, <code>seek()<\/code><\/h2>\n<svg viewBox=\"0 0 600 90\" style=\"width:100%;max-width:600px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Fichier de 25 caractères : read(10) lit les positions 0 à 9, seek saute les positions 10 à 14, read(10) lit 15 à 24.\">\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\">\n<rect x=\"20\" y=\"30\" width=\"200\" height=\"30\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"120\" y=\"50\" text-anchor=\"middle\">read(10) : 0 → 9<\/text>\n<rect x=\"220\" y=\"30\" width=\"100\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-dasharray=\"4 3\"/><text x=\"270\" y=\"50\" text-anchor=\"middle\">sauté (5)<\/text>\n<rect x=\"320\" y=\"30\" width=\"200\" height=\"30\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"420\" y=\"50\" text-anchor=\"middle\">read(10) : 15 → 24<\/text>\n<text x=\"220\" y=\"80\" text-anchor=\"middle\">tell() = 10<\/text><text x=\"320\" y=\"80\" text-anchor=\"middle\">seek(15)<\/text><\/g><\/svg><pre class=\"\"><code>with open(&quot;exemple.txt&quot;, &quot;w&quot;) as f:\n    f.write(&quot;ABCDEFGHIJ-----KLMNOPQRST&quot;)\n\nwith open(&quot;exemple.txt&quot;, &quot;r&quot;) as fichier:\n    premier_bloc: str = fichier.read(10)\n    print(&quot;Premier bloc :&quot;, premier_bloc, &quot;| position :&quot;, fichier.tell())\n    fichier.seek(fichier.tell() + 5)\n    deuxieme_bloc: str = fichier.read(10)\n    print(&quot;Deuxième bloc :&quot;, deuxieme_bloc)<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Premier bloc : ABCDEFGHIJ | position : 10\nDeuxième bloc : KLMNOPQRST<\/code><\/pre><h2>Idée 3 · Gérer fichiers et dossiers : <code>shutil<\/code> et <code>os<\/code><\/h2>\n<table>\n<thead>\n<tr>\n<th>Action<\/th>\n<th>Code<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>copier<\/td>\n<td><code>shutil.copy(source, destination)<\/code><\/td>\n<\/tr>\n<tr>\n<td>déplacer<\/td>\n<td><code>shutil.move(source, destination)<\/code><\/td>\n<\/tr>\n<tr>\n<td>supprimer<\/td>\n<td><code>os.remove(chemin)<\/code> (après <code>os.path.exists(chemin)<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>créer un dossier<\/td>\n<td><code>os.mkdir(nom)<\/code><\/td>\n<\/tr>\n<\/tbody><\/table>\n<pre class=\"\"><code>import os, shutil\nwith open(&quot;source.txt&quot;, &quot;w&quot;) as f:\n    f.write(&quot;data&quot;)\nos.mkdir(&quot;nouveau_dossier&quot;)\nshutil.copy(&quot;source.txt&quot;, &quot;copie.txt&quot;)\nshutil.move(&quot;copie.txt&quot;, &quot;nouveau_dossier/destination.txt&quot;)\nif os.path.exists(&quot;source.txt&quot;):\n    os.remove(&quot;source.txt&quot;)\nprint(os.listdir(&quot;nouveau_dossier&quot;), os.path.exists(&quot;source.txt&quot;))<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>['destination.txt'] False<\/code><\/pre><h2>Idée 4 · CSV et <code>try … except<\/code><\/h2>\n<pre class=\"\"><code>import csv\nwith open(&quot;nouveau.csv&quot;, &quot;w&quot;, newline=&quot;&quot;) as fichier_csv:\n    ecrivain = csv.writer(fichier_csv)\n    ecrivain.writerow([&quot;Nom&quot;, &quot;Age&quot;])\n    ecrivain.writerow([&quot;Alice&quot;, 25])\n\nwith open(&quot;nouveau.csv&quot;, &quot;r&quot;) as fichier_csv:\n    for ligne in csv.reader(fichier_csv):\n        print(ligne)<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>['Nom', 'Age']\n['Alice', '25']<\/code><\/pre><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p><code>csv.reader<\/code> renvoie <strong>toujours des chaînes<\/strong> : <code>&#39;25&#39;<\/code>, pas <code>25<\/code>. Convertis avec <code>int(ligne[1])<\/code>.<\/p>\n<\/aside><figure class=\"etapes\" data-i=\"0\"><figcaption>Lire un fichier sans planter<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Essaie<\/div><p><code>try:<\/code> puis <code>with open(&#39;donnees.csv&#39;, &#39;r&#39;) as f:<\/code> et la lecture.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Cas prévu<\/div><p><code>except FileNotFoundError:<\/code> affiche « Le fichier n&#39;a pas été trouvé. »<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Cas imprévu<\/div><p><code>except Exception as e:<\/code> affiche le message de l&#39;erreur <code>e<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Ordre<\/div><p>l&#39;exception la plus précise d&#39;abord, <code>Exception<\/code> en dernier.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><pre class=\"\"><code>import csv\ntry:\n    with open('absent.csv', 'r') as f:\n        for ligne in csv.reader(f):\n            print(ligne)\nexcept FileNotFoundError:\n    print(&quot;Le fichier n'a pas été trouvé.&quot;)\nexcept Exception as e:\n    print(f&quot;Une erreur est survenue: {e}&quot;)<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Le fichier n'a pas été trouvé.<\/code><\/pre><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Fichiers<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Un fichier contient 3 lignes. On l&#39;ouvre en <code>&quot;w&quot;<\/code> et on écrit <code>&quot;x&quot;<\/code>. Combien de lignes contient-il ensuite ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1<\/b><\/p><p>Le mode <code>&quot;w&quot;<\/code> efface le contenu : il ne reste que <code>x<\/code>.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Après <code>f.read(7)<\/code> sur un fichier neuf, que renvoie <code>f.tell()<\/code> ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 7<\/b><\/p><p>Le curseur a avancé de 7 caractères.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Écris une fonction <code>compter_lignes(nom: str) -&gt; int<\/code> qui renvoie -1 si le fichier n&#39;existe pas.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>try:<\/code> <code>with open(nom) as f: return len(f.readlines())<\/code> puis <code>except FileNotFoundError: return -1<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 10 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quel mode ajoute du texte à la fin sans effacer ?<\/div><button class=\"opt\" data-o=\"0\">&quot;w&quot;<\/button><button class=\"opt\" data-o=\"1\">&quot;a&quot;<\/button><button class=\"opt\" data-o=\"2\">&quot;r&quot;<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Ouvrir en &quot;r&quot; un fichier inexistant provoque…<\/div><button class=\"opt\" data-o=\"0\">FileNotFoundError<\/button><button class=\"opt\" data-o=\"1\">la création du fichier<\/button><button class=\"opt\" data-o=\"2\">None<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\"><code>f.read(10)<\/code> lit…<\/div><button class=\"opt\" data-o=\"0\">10 lignes<\/button><button class=\"opt\" data-o=\"1\">10 caractères<\/button><button class=\"opt\" data-o=\"2\">10 octets en binaire seulement<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Quelle méthode renvoie la position du curseur ?<\/div><button class=\"opt\" data-o=\"0\">seek()<\/button><button class=\"opt\" data-o=\"1\">tell()<\/button><button class=\"opt\" data-o=\"2\">pos()<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Quel module sert à copier un fichier ?<\/div><button class=\"opt\" data-o=\"0\">os<\/button><button class=\"opt\" data-o=\"1\">shutil<\/button><button class=\"opt\" data-o=\"2\">csv<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Quelle fonction supprime un fichier ?<\/div><button class=\"opt\" data-o=\"0\"><code>os.remove<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>shutil.delete<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>os.mkdir<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Que renvoie <code>readlines()<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">une chaîne<\/button><button class=\"opt\" data-o=\"1\">une liste de lignes<\/button><button class=\"opt\" data-o=\"2\">le nombre de lignes<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Avantage de <code>with open(...)<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">le fichier est fermé automatiquement<\/button><button class=\"opt\" data-o=\"1\">il lit plus vite<\/button><button class=\"opt\" data-o=\"2\">il évite toutes les erreurs<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">csv.reader renvoie l&#39;âge 25 sous la forme…<\/div><button class=\"opt\" data-o=\"0\">25<\/button><button class=\"opt\" data-o=\"1\">&#39;25&#39;<\/button><button class=\"opt\" data-o=\"2\">25.0<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Dans <code>try ... except<\/code>, où place-t-on <code>except Exception<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">en premier<\/button><button class=\"opt\" data-o=\"1\">en dernier<\/button><button class=\"opt\" data-o=\"2\">jamais<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"fichiers","rep":["Beni"],"tol":null},{"n":"fichiers","rep":["1"],"tol":null},{"n":"fichiers","rep":["7"],"tol":null},{"n":"fichiers","rep":null,"tol":null}],"qcm":[{"n":"fichiers","q":"Quel mode ajoute du texte à la fin sans effacer ?","o":["&quot;w&quot;","&quot;a&quot;","&quot;r&quot;"],"a":1,"e":"&quot;a&quot; = append."},{"n":"fichiers","q":"Ouvrir en &quot;r&quot; un fichier inexistant provoque…","o":["FileNotFoundError","la création du fichier","None"],"a":0,"e":"Le mode lecture n&#39;en crée pas."},{"n":"fichiers","q":"<code>f.read(10)<\/code> lit…","o":["10 lignes","10 caractères","10 octets en binaire seulement"],"a":1,"e":"En mode texte, read(n) lit n caractères."},{"n":"fichiers","q":"Quelle méthode renvoie la position du curseur ?","o":["seek()","tell()","pos()"],"a":1,"e":"seek déplace, tell indique."},{"n":"fichiers","q":"Quel module sert à copier un fichier ?","o":["os","shutil","csv"],"a":1,"e":"<code>shutil.copy(source, destination)<\/code>."},{"n":"fichiers","q":"Quelle fonction supprime un fichier ?","o":["<code>os.remove<\/code>","<code>shutil.delete<\/code>","<code>os.mkdir<\/code>"],"a":0,"e":"os.remove(chemin)."},{"n":"fichiers","q":"Que renvoie <code>readlines()<\/code> ?","o":["une chaîne","une liste de lignes","le nombre de lignes"],"a":1,"e":"Chaque élément garde son <code>\\n<\/code>."},{"n":"fichiers","q":"Avantage de <code>with open(...)<\/code> ?","o":["le fichier est fermé automatiquement","il lit plus vite","il évite toutes les erreurs"],"a":0,"e":"La fermeture est garantie à la sortie du bloc."},{"n":"fichiers","q":"csv.reader renvoie l&#39;âge 25 sous la forme…","o":["25","&#39;25&#39;","25.0"],"a":1,"e":"Tout est lu comme chaîne."},{"n":"fichiers","q":"Dans <code>try ... except<\/code>, où place-t-on <code>except Exception<\/code> ?","o":["en premier","en dernier","jamais"],"a":1,"e":"Les exceptions précises d&#39;abord, la générale ensuite."}]},{"id":"td-corriges","t":"TD corrigé · gestion de produits (TD 6)","seance":"TD 6 · partie programmation de l'examen blanc","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Ce TD mobilise trois chapitres : dataclass (chap. 5), listes (chap. 6) et récursivité (chap. 4).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Avec <code>@dataclass class Produit: nom: str; prix: float<\/code>, comment lit-on le prix de <code>p<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>p.prix<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Écris chaque question comme une petite fonction indépendante<\/strong>, puis assemble-les dans le programme principal (Q21). C&#39;est exactement le découpage noté par le prof.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Dans une f-string, oublier les accolades : <code>f&quot;Nom: p.nom&quot;<\/code> affiche le texte <code>p.nom<\/code>, pas le nom du produit. Il faut <code>f&quot;Nom: {p.nom}&quot;<\/code>.<\/p>\n<\/aside><p>À la fin, tu sais écrire l&#39;exercice « produits » de l&#39;examen blanc sans erreur, et calculer une somme en itératif et en récursif.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Seule la <strong>correction<\/strong> du TD 6 était fournie, pas l&#39;énoncé. Les consignes ci-dessous sont reconstruites à partir de la correction. La correction du prof contient deux erreurs, signalées et corrigées plus bas.<\/p>\n<\/aside><h2>Idée 1 · Q17–Q19 : la fiche Produit, la saisie, l&#39;affichage<\/h2>\n<figure class=\"flux\"><figcaption>Le programme de l'exercice<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">Q17 dataclass Produit<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Q18 ajouter_produit (saisie)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Q20 trier_produits<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Q19 afficher_produit<\/div><\/div><\/figure><p>Q18 utilise <code>input()<\/code> : on le montre sans l&#39;exécuter.<\/p>\n<pre class=\"\"><code>def ajouter_produit() -&gt; Produit:\n    nom = input(&quot;Nom du produit : &quot;)\n    categorie = input(&quot;Catégorie : &quot;)\n    prix = float(input(&quot;Prix : &quot;))      # input renvoie une chaîne : on convertit\n    p = Produit(nom, categorie, prix)\n    return p<\/code><\/pre><pre class=\"\"><code>from dataclasses import dataclass\n\n@dataclass\nclass Produit:                          # Q17\n    nom: str\n    categorie: str\n    prix: float\n\ndef afficher_produit(p: Produit) -&gt; None:   # Q19 corrigée\n    print(f&quot;Nom: {p.nom}&quot;)\n    print(f&quot;Catégorie: {p.categorie}&quot;)\n    print(f&quot;Prix: {p.prix}&quot;)\n\nafficher_produit(Produit(&quot;Cahier&quot;, &quot;Papeterie&quot;, 12.0))<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Nom: Cahier\nCatégorie: Papeterie\nPrix: 12.0<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Erreur dans la correction (Q19) : <code>print(f&quot;Nom: p.nom&quot;)<\/code> sans accolades affiche littéralement <code>Nom: p.nom<\/code>. Corrigé : <code>f&quot;Nom: {p.nom}&quot;<\/code>.<\/p>\n<\/aside><h2>Idée 2 · Q20 : tri par sélection, du plus cher au moins cher<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Tri par sélection décroissant<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Pour chaque position i<\/div><p>on cherche le produit le plus cher parmi T[i], T[i+1], …<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Recherche du max<\/div><p><code>posmax = i<\/code>, puis pour j &gt; i, si <code>T[j].prix &gt; T[posmax].prix<\/code> alors <code>posmax = j<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Échange<\/div><p>on échange T[i] et <strong>T[posmax]<\/strong> (pas T[j] !).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Fin<\/div><p>après n − 1 tours, T est trié par prix décroissant.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><figure class=\"grille\"><figcaption>Prix pendant le tri (case échangée en orange)<\/figcaption><table><tr><th><\/th><th>0<\/th><th>1<\/th><th>2<\/th><th>3<\/th><\/tr><tr><th>départ<\/th><td>5<\/td><td>9<\/td><td>2<\/td><td>7<\/td><\/tr><tr><th>i=0<\/th><td class=\"h1\">9<\/td><td class=\"h1\">5<\/td><td>2<\/td><td>7<\/td><\/tr><tr><th>i=1<\/th><td>9<\/td><td class=\"h1\">7<\/td><td>2<\/td><td class=\"h1\">5<\/td><\/tr><tr><th>i=2<\/th><td>9<\/td><td>7<\/td><td class=\"h1\">5<\/td><td class=\"h1\">2<\/td><\/tr><\/table><\/figure><pre class=\"\"><code>from dataclasses import dataclass\n\n@dataclass\nclass Produit:\n    nom: str\n    categorie: str\n    prix: float\n\ndef trier_produits(T: list[Produit]) -&gt; list[Produit]:\n    for i in range(len(T) - 1):\n        posmax = i\n        for j in range(i + 1, len(T)):\n            if T[j].prix &gt; T[posmax].prix:\n                posmax = j\n        if posmax != i:\n            temp = T[i]\n            T[i] = T[posmax]\n            T[posmax] = temp\n    return T\n\nT = [Produit(&quot;A&quot;, &quot;x&quot;, 5), Produit(&quot;B&quot;, &quot;x&quot;, 9), Produit(&quot;C&quot;, &quot;x&quot;, 2), Produit(&quot;D&quot;, &quot;x&quot;, 7)]\nprint([p.prix for p in trier_produits(T)])<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>[9, 7, 5, 2]<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Erreur dans la correction (Q20) : l&#39;échange y est écrit <code>T[i] = T[j]<\/code> et <code>T[j] = temp<\/code>. Après la boucle, <code>j<\/code> vaut toujours le dernier indice : on échange avec le mauvais élément et la liste n&#39;est pas triée (avec les prix 5, 9, 2, 7, on obtient 7, 9, 5, 2). Il faut échanger avec <code>T[posmax]<\/code>.<\/p>\n<\/aside><h2>Idée 3 · Q21 : le programme principal<\/h2>\n<pre class=\"\"><code>N = int(input(&quot;Entrer le nbre de produits:&quot;))\nT = []\nfor _ in range(N):\n    T.append(ajouter_produit())\nT = trier_produits(T)\nfor p in T:\n    afficher_produit(p)<\/code><\/pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p><code>for _ in range(N)<\/code> : le <code>_<\/code> signale qu&#39;on n&#39;utilise pas le compteur.<\/p>\n<\/aside><h2>Idée 4 · Q22–Q23 : somme itérative et somme récursive<\/h2>\n<pre class=\"\"><code>def somme_iterative(L: list[float]) -&gt; float:     # Q22\n    S = 0\n    for x in L:\n        S += x\n    return S\n\ndef somme_recursive(L: list[float]) -&gt; float:     # Q23\n    if len(L) == 0:\n        return 0\n    else:\n        return L[0] + somme_recursive(L[1:])\n\nprint(somme_iterative([3, 8, 1]), somme_recursive([3, 8, 1]))<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>12 12<\/code><\/pre><h2>Idée 5 · Q24 : coût d&#39;une recherche dichotomique<\/h2>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>La complexité n&#39;apparaît pas dans le polycopié, et l&#39;énoncé de Q24 (la fonction <code>Recherche<\/code>) n&#39;a pas été fourni. Ce qui suit explique la méthode et le résultat de la correction.<\/p>\n<\/aside><p>La méthode du prof : coût d&#39;un <code>Si<\/code> = 1 (le test) + le max des coûts des deux branches ; coût d&#39;une boucle = nombre de tours × coût d&#39;un tour + coût du test final ; on additionne les blocs.<\/p>\n<svg viewBox=\"0 0 560 100\" style=\"width:100%;max-width:560px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Recherche dichotomique : à chaque tour la zone de recherche est coupée en deux : n, n/2, n/4, jusqu'à 1, soit log2(n) tours.\">\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\">\n<rect x=\"20\" y=\"15\" width=\"400\" height=\"18\" fill=\"none\" stroke=\"currentColor\"/><text x=\"440\" y=\"29\">n<\/text>\n<rect x=\"20\" y=\"40\" width=\"200\" height=\"18\" fill=\"none\" stroke=\"currentColor\"/><text x=\"440\" y=\"54\">n/2<\/text>\n<rect x=\"20\" y=\"65\" width=\"100\" height=\"18\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"440\" y=\"79\" fill=\"#D9824F\" font-weight=\"700\">n/4 … 1 : log₂(n) tours<\/text>\n<\/g><\/svg><p>Correction du prof : CSi2 = 1 + max(2, 2) = 3 ; CSi1 = 1 + max(1, 3) = 4 ; boucle : log₂(n) tours de coût 3 + 4 + 3 = 10, plus 3, soit 10·ln(n)/ln(2) + 3 ; avec CS = 3 et CSi3 = 2, le total vaut <strong>10·log₂(n) + 8<\/strong>. La complexité est <strong>logarithmique : O(log n)<\/strong>.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Variantes de l&#39;examen<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Modifie <code>trier_produits<\/code> pour trier par prix <strong>croissant<\/strong>. Quelle ligne change ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>La comparaison : <code>if T[j].prix &lt; T[posmin].prix:<\/code> (on cherche le minimum).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Écris <code>produits_categorie(T, cat)<\/code> qui renvoie la liste des noms des produits de la catégorie <code>cat<\/code>.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>return [p.nom for p in T if p.categorie == cat]<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Combien de tours fait une recherche dichotomique dans 1024 éléments (au pire, environ) ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 10<\/b><\/p><p>log₂(1024) = 10.<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\"><code>print(f&quot;Nom: p.nom&quot;)<\/code> affiche…<\/div><button class=\"opt\" data-o=\"0\"><code>Nom: p.nom<\/code><\/button><button class=\"opt\" data-o=\"1\">le nom du produit<\/button><button class=\"opt\" data-o=\"2\">une erreur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Que renvoie <code>input()<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">un int<\/button><button class=\"opt\" data-o=\"1\">une str<\/button><button class=\"opt\" data-o=\"2\">un float<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Dans le tri par sélection décroissant, avec quoi échange-t-on T[i] ?<\/div><button class=\"opt\" data-o=\"0\">T[j]<\/button><button class=\"opt\" data-o=\"1\">T[posmax]<\/button><button class=\"opt\" data-o=\"2\">T[i+1]<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Combien de tours fait la boucle externe d&#39;un tri par sélection de n éléments ?<\/div><button class=\"opt\" data-o=\"0\">n<\/button><button class=\"opt\" data-o=\"1\">n − 1<\/button><button class=\"opt\" data-o=\"2\">n²<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\"><code>somme_recursive([])<\/code> renvoie…<\/div><button class=\"opt\" data-o=\"0\">0<\/button><button class=\"opt\" data-o=\"1\">None<\/button><button class=\"opt\" data-o=\"2\">une erreur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\"><code>somme_recursive<\/code> est-elle terminale ?<\/div><button class=\"opt\" data-o=\"0\">oui<\/button><button class=\"opt\" data-o=\"1\">non<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Complexité de la recherche dichotomique ?<\/div><button class=\"opt\" data-o=\"0\">O(n)<\/button><button class=\"opt\" data-o=\"1\">O(log n)<\/button><button class=\"opt\" data-o=\"2\">O(n²)<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Coût de <code>Si<\/code> dont les branches coûtent 2 et 5 ?<\/div><button class=\"opt\" data-o=\"0\">7<\/button><button class=\"opt\" data-o=\"1\">6<\/button><button class=\"opt\" data-o=\"2\">8<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\"><code>for _ in range(3): T.append(0)<\/code>. Que vaut T si T était vide ?<\/div><button class=\"opt\" data-o=\"0\"><code>[0, 0, 0]<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>[0]<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>[3]<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Pour trier par prix croissant, on cherche à chaque tour…<\/div><button class=\"opt\" data-o=\"0\">le maximum<\/button><button class=\"opt\" data-o=\"1\">le minimum<\/button><button class=\"opt\" data-o=\"2\">le premier élément<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"td-corriges","rep":null,"tol":null},{"n":"td-corriges","rep":null,"tol":null},{"n":"td-corriges","rep":null,"tol":null},{"n":"td-corriges","rep":["10"],"tol":null}],"qcm":[{"n":"td-corriges","q":"<code>print(f&quot;Nom: p.nom&quot;)<\/code> affiche…","o":["<code>Nom: p.nom<\/code>","le nom du produit","une erreur"],"a":0,"e":"Sans accolades, rien n&#39;est évalué."},{"n":"td-corriges","q":"Que renvoie <code>input()<\/code> ?","o":["un int","une str","un float"],"a":1,"e":"Toujours une chaîne de caractères."},{"n":"td-corriges","q":"Dans le tri par sélection décroissant, avec quoi échange-t-on T[i] ?","o":["T[j]","T[posmax]","T[i+1]"],"a":1,"e":"posmax est l&#39;indice du plus grand élément restant."},{"n":"td-corriges","q":"Combien de tours fait la boucle externe d&#39;un tri par sélection de n éléments ?","o":["n","n − 1","n²"],"a":1,"e":"<code>range(len(T) - 1)<\/code> : le dernier élément est forcément à sa place."},{"n":"td-corriges","q":"<code>somme_recursive([])<\/code> renvoie…","o":["0","None","une erreur"],"a":0,"e":"C&#39;est le cas de base."},{"n":"td-corriges","q":"<code>somme_recursive<\/code> est-elle terminale ?","o":["oui","non"],"a":1,"e":"L&#39;addition <code>L[0] + …<\/code> se fait après l&#39;appel."},{"n":"td-corriges","q":"Complexité de la recherche dichotomique ?","o":["O(n)","O(log n)","O(n²)"],"a":1,"e":"La zone est divisée par deux à chaque tour."},{"n":"td-corriges","q":"Coût de <code>Si<\/code> dont les branches coûtent 2 et 5 ?","o":["7","6","8"],"a":1,"e":"1 + max(2, 5) = 6."},{"n":"td-corriges","q":"<code>for _ in range(3): T.append(0)<\/code>. Que vaut T si T était vide ?","o":["<code>[0, 0, 0]<\/code>","<code>[0]<\/code>","<code>[3]<\/code>"],"a":0,"e":"Trois tours, trois ajouts."},{"n":"td-corriges","q":"Pour trier par prix croissant, on cherche à chaque tour…","o":["le maximum","le minimum","le premier élément"],"a":1,"e":"Le plus petit restant va en position i."}]},{"id":"examen-blanc","t":"Révision et examen blanc corrigé","seance":"Révision · format de l'examen blanc (TD 6)","imp":5,"payant":true,"html":"<h2>Avant de commencer<\/h2>\n<p>Ce chapitre suppose que tu as fait les QCM des chapitres 1 à 8. Si un QCM est sous 8/10, reprends d&#39;abord ce chapitre.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Sans regarder : quelle est la différence entre <code>remove<\/code> et <code>discard<\/code> sur un ensemble ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>remove<\/code> lève <code>KeyError<\/code> si l&#39;élément est absent ; <code>discard<\/code> ne fait rien.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Fais l&#39;examen en conditions réelles<\/strong> : 1 h 30, sans ordinateur, sur papier. Corrige-toi seulement après.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Perdre des points sur des détails de syntaxe : oublier <code>@dataclass<\/code>, les accolades d&#39;une f-string, la conversion <code>float(input(...))<\/code> ou le cas de base d&#39;une récursion.<\/p>\n<\/aside><p>À la fin, tu connais le format de l&#39;examen et tu as vérifié chaque point du programme.<\/p>\n<aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>Format de l&#39;examen blanc du Pr Biniz (TD 6) : <strong>16 QCM<\/strong> (A–D) sur une feuille de réponses, puis <strong>Q17–Q20<\/strong> (dataclass, saisie, affichage, tri) notées sur 1 point, et <strong>Q21–Q24<\/strong> (programme principal, somme itérative, somme récursive, coût d&#39;un algorithme) notées sur 2 points.<\/p>\n<\/aside><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>L&#39;énoncé des 16 QCM de l&#39;examen blanc n&#39;a pas été fourni (seulement la grille de réponses). Les QCM et le problème ci-dessous sont <strong>nos propres sujets<\/strong>, construits sur le même format et sur le polycopié.<\/p>\n<\/aside><h2>Idée 1 · La fiche de révision en une page<\/h2>\n<table>\n<thead>\n<tr>\n<th>Chapitre<\/th>\n<th>À savoir écrire sans hésiter<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Procédures / fonctions<\/td>\n<td><code>def f(n: int) -&gt; None:<\/code> / <code>-&gt; int:<\/code> + <code>return<\/code><\/td>\n<\/tr>\n<tr>\n<td>Passage des paramètres<\/td>\n<td>mutable modifié sur place → visible dehors<\/td>\n<\/tr>\n<tr>\n<td>Portée<\/td>\n<td><code>global x<\/code>, <code>nonlocal z<\/code><\/td>\n<\/tr>\n<tr>\n<td>Récursivité<\/td>\n<td>cas de base + appel plus petit ; terminale = <code>return f(n-1, acc*n)<\/code><\/td>\n<\/tr>\n<tr>\n<td>Enregistrements<\/td>\n<td><code>@dataclass class Produit: nom: str ...<\/code> ; <code>Enum<\/code> ; <code>namedtuple<\/code><\/td>\n<\/tr>\n<tr>\n<td>Collections<\/td>\n<td>append/extend/insert/remove/pop, add/discard, get/items/popitem<\/td>\n<\/tr>\n<tr>\n<td>Fichiers<\/td>\n<td><code>with open(nom, &quot;r&quot;/&quot;w&quot;/&quot;a&quot;) as f<\/code>, <code>read(n)<\/code>, <code>tell()<\/code>, <code>seek()<\/code>, <code>csv<\/code>, <code>try/except FileNotFoundError<\/code><\/td>\n<\/tr>\n<\/tbody><\/table>\n<figure class=\"flux\"><figcaption>Ordre de travail le jour de l'examen<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">QCM (rapides)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Q17–Q20 (dataclass et tri)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Q22–Q23 (sommes)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Q21 (assembler)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Q24 (coût)<\/div><\/div><\/figure><h2>Idée 2 · Problème corrigé : gestion d&#39;étudiants<\/h2>\n<p><strong>Énoncé.<\/strong> On gère les étudiants d&#39;une filière de la FSABM.<\/p>\n<ol>\n<li>Écris une dataclass <code>Etudiant<\/code> (nom : str, filiere : str, moyenne : float). <em>(1 pt)<\/em><\/li>\n<li>Écris <code>afficher_etudiant(e)<\/code> qui affiche « nom - filière : moyenne ». <em>(1 pt)<\/em><\/li>\n<li>Écris <code>trier_etudiants(T)<\/code> qui trie par moyenne décroissante (tri par sélection). <em>(1 pt)<\/em><\/li>\n<li>Écris <code>admis(T)<\/code> qui renvoie le dictionnaire {nom : moyenne} des étudiants ayant au moins 10. <em>(1 pt)<\/em><\/li>\n<li>Écris <code>maximum_recursif(L)<\/code> qui renvoie le plus grand élément d&#39;une liste non vide, récursivement. <em>(2 pts)<\/em><\/li>\n<li>Écris <code>sauvegarder(T, nom_fichier)<\/code> qui écrit les étudiants dans un CSV, puis <code>relire(nom_fichier)<\/code> qui renvoie le nombre de lignes, ou -1 si le fichier n&#39;existe pas. <em>(2 pts)<\/em><\/li>\n<\/ol>\n<pre class=\"\"><code>from dataclasses import dataclass\nimport csv\n\n@dataclass\nclass Etudiant:                                   # 1\n    nom: str\n    filiere: str\n    moyenne: float\n\ndef afficher_etudiant(e: Etudiant) -&gt; None:       # 2\n    print(f&quot;{e.nom} - {e.filiere} : {e.moyenne}&quot;)\n\ndef trier_etudiants(T: list[Etudiant]) -&gt; list[Etudiant]:   # 3\n    for i in range(len(T) - 1):\n        posmax = i\n        for j in range(i + 1, len(T)):\n            if T[j].moyenne &gt; T[posmax].moyenne:\n                posmax = j\n        T[i], T[posmax] = T[posmax], T[i]\n    return T\n\ndef admis(T: list[Etudiant]) -&gt; dict[str, float]:          # 4\n    d = {}\n    for e in T:\n        if e.moyenne &gt;= 10:\n            d[e.nom] = e.moyenne\n    return d\n\ndef maximum_recursif(L: list[float]) -&gt; float:            # 5\n    if len(L) == 1:\n        return L[0]\n    m = maximum_recursif(L[1:])\n    return L[0] if L[0] &gt; m else m\n\ndef sauvegarder(T: list[Etudiant], nom_fichier: str) -&gt; None:   # 6\n    with open(nom_fichier, &quot;w&quot;, newline=&quot;&quot;) as f:\n        w = csv.writer(f)\n        for e in T:\n            w.writerow([e.nom, e.filiere, e.moyenne])\n\ndef relire(nom_fichier: str) -&gt; int:\n    try:\n        with open(nom_fichier, &quot;r&quot;) as f:\n            return len(list(csv.reader(f)))\n    except FileNotFoundError:\n        return -1\n\nT = [Etudiant(&quot;Amine&quot;, &quot;MI&quot;, 9.5), Etudiant(&quot;Sara&quot;, &quot;MI&quot;, 14.0), Etudiant(&quot;Yassine&quot;, &quot;MI&quot;, 11.25)]\nfor e in trier_etudiants(T):\n    afficher_etudiant(e)\nprint(admis(T))\nprint(maximum_recursif([9.5, 14.0, 11.25]))\nsauvegarder(T, &quot;etudiants.csv&quot;)\nprint(relire(&quot;etudiants.csv&quot;), relire(&quot;absent.csv&quot;))<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Sara - MI : 14.0\nYassine - MI : 11.25\nAmine - MI : 9.5\n{'Sara': 14.0, 'Yassine': 11.25}\n14.0\n3 -1<\/code><\/pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p><code>T[i], T[posmax] = T[posmax], T[i]<\/code> échange deux cases en une ligne : plus court et sans risque d&#39;erreur que la version avec <code>temp<\/code>.<\/p>\n<\/aside><h2>Idée 3 · Prédire l&#39;affichage : les pièges classiques<\/h2>\n<pre class=\"\"><code>def f(L: list[int], n: int) -&gt; None:\n    L.append(n)\n    n = n + 1\n\nA = [1]; k = 5\nf(A, k)\nprint(A, k)\n\ndef compte(n: int, acc: int = 0) -&gt; int:\n    if n == 0:\n        return acc\n    return compte(n // 10, acc + 1)\nprint(compte(2026))\n\ne = {3, 1, 3}\nd = {&quot;a&quot;: 1}\nprint(len(e), d.get(&quot;b&quot;, 0), (1, 2, 1).count(1))<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>[1, 5] 5\n4\n2 0 2<\/code><\/pre><figure class=\"etapes\" data-i=\"0\"><figcaption>Lire le premier bloc<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · f(A, k)<\/div><p>L pointe vers la liste A, n reçoit 5.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · L.append(n)<\/div><p>la liste partagée devient [1, 5].<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · n = n + 1<\/div><p>n devient 6 dans la fonction seulement (int immuable).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Résultat<\/div><p><code>[1, 5] 5<\/code>.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Questions longues type examen<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Écris <code>compter_mots(nom_fichier)<\/code> qui renvoie un dictionnaire {mot : nombre d&#39;apparitions}.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>d = {}<\/code> ; <code>with open(nom_fichier) as f:<\/code> ; <code>for ligne in f: for mot in ligne.split(): d[mot] = d.get(mot, 0) + 1<\/code> ; <code>return d<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Écris une version <strong>terminale<\/strong> de <code>maximum_recursif<\/code>.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>def max_t(L, m): if len(L) == 0: return m<\/code> sinon <code>return max_t(L[1:], L[0] if L[0] &gt; m else m)<\/code>. Premier appel : <code>max_t(L[1:], L[0])<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Combien vaut le coût d&#39;un <code>Si<\/code> dont les branches coûtent 3 et 1 ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 4<\/b><\/p><p>1 (test) + max(3, 1) = 4.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Que vaut <code>compte(7)<\/code> dans l&#39;exemple ci-dessus ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1<\/b><\/p><p>7 a un chiffre : un appel avec acc + 1, puis n = 0 renvoie 1.<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 6 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\"><code>def f(x: int) -&gt; None: x += 1<\/code>, puis <code>a = 1; f(a); print(a)<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">1<\/button><button class=\"opt\" data-o=\"1\">2<\/button><button class=\"opt\" data-o=\"2\">None<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\"><code>global<\/code> est nécessaire pour…<\/div><button class=\"opt\" data-o=\"0\">lire une variable globale<\/button><button class=\"opt\" data-o=\"1\">modifier une variable globale dans une fonction<\/button><button class=\"opt\" data-o=\"2\">créer une variable locale<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Laquelle est une récursion terminale ?<\/div><button class=\"opt\" data-o=\"0\"><code>return 1 + f(n - 1)<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>return f(n - 1, acc + 1)<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>return f(n - 1) * 2<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\"><code>@dataclass<\/code> génère automatiquement…<\/div><button class=\"opt\" data-o=\"0\">le constructeur <code>__init__<\/code><\/button><button class=\"opt\" data-o=\"1\">une base de données<\/button><button class=\"opt\" data-o=\"2\">une énumération<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\"><code>JourSemaine(2)<\/code> avec MARDI = 2 renvoie…<\/div><button class=\"opt\" data-o=\"0\"><code>JourSemaine.MARDI<\/code><\/button><button class=\"opt\" data-o=\"1\">2<\/button><button class=\"opt\" data-o=\"2\">&quot;MARDI&quot;<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\"><code>[1, 2].append([3, 4])<\/code> donne…<\/div><button class=\"opt\" data-o=\"0\"><code>[1, 2, 3, 4]<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>[1, 2, [3, 4]]<\/code><\/button><button class=\"opt\" data-o=\"2\">une erreur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\"><code>s = set(); s.add(2); s.add(2); len(s)<\/code> vaut…<\/div><button class=\"opt\" data-o=\"0\">1<\/button><button class=\"opt\" data-o=\"1\">2<\/button><button class=\"opt\" data-o=\"2\">0<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Ouvrir un fichier en <code>&quot;w&quot;<\/code>…<\/div><button class=\"opt\" data-o=\"0\">ajoute à la fin<\/button><button class=\"opt\" data-o=\"1\">efface son contenu s&#39;il existe<\/button><button class=\"opt\" data-o=\"2\">échoue s&#39;il existe<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\"><code>f.seek(0)<\/code> sert       if (/^\s*\|.*\|\s*$/.test(raw)) { if (list) { out.push('</' + list + '>'); list = null; } (tab = tab || []).push(raw); return; }
      flushTab();
      if ((m = raw.match(/^\s*#{1,6}\s+(.*)$/))) { flush(); out.push('<p><strong>' + inl(m[1]) + '</strong></p>'); }
      else if ((m = raw.match(/^\s*[-*•]\s+(.*)$/))) { if (list !== 'ul') { flush(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + inl(m[1]) + '</li>'); }
      else if ((m = raw.match(/^\s*\d+[.)]\s+(.*)$/))) { if (list !== 'ol') { flush(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + inl(m[1]) + '</li>'); }
      else if (!raw.trim()) flush();
      else { flush(); out.push('<p>' + inl(raw) + '</p>'); }
    });
    if (code !== null) out.push('<pre>' + esc(code.join('\n')) + '</pre>');
    flush(); return rendreMaths(out.join(''));
  };

  // ---------- MathJax : celui de la page s'il existe, sinon chargé à la première formule ----------
  let mjPret = null;
  const mathjax = () => mjPret || (mjPret = new Promise((ok, ko) => {
    if (!window.MathJax) {
      window.MathJax = { svg: { fontCache: 'global' }, startup: { typeset: false } };
      const s = document.createElement('script'); s.async = true; s.src = 'https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js';
      s.onerror = () => ko(new Error('MathJax')); document.head.appendChild(s);
    }
    let n = 0; const t = setInterval(() => {
      if (window.MathJax && MathJax.tex2svgPromise && MathJax.startup && MathJax.startup.promise) { clearInterval(t); MathJax.startup.promise.then(ok, ko); }
      else if (++n > 150) { clearInterval(t); ko(new Error('MathJax')); }
    }, 100);
  })).catch((e) => { mjPret = null; throw e; });
  const svgCache = new Map(); let file = Promise.resolve();
  function dessinerMaths(racine) {
    const spans = [...racine.querySelectorAll('.mzt-tex:not([data-ok])')]; if (!spans.length) return;
    mathjax().then(() => spans.forEach((sp) => {
      const cle = sp.dataset.d + '|' + sp.textContent;
      const poser = (n) => { if (!sp.isConnected || sp.dataset.ok) return; sp.textContent = ''; sp.appendChild(n.cloneNode(true)); sp.dataset.ok = '1'; };
      if (svgCache.has(cle)) return poser(svgCache.get(cle));
      file = file.then(() => MathJax.tex2svgPromise(sp.textContent, { display: sp.dataset.d === '1' }).then((n) => { svgCache.set(cle, n); poser(n); })).catch(() => {});
    })).catch(() => {});
  }
  async function ask(q, deep) {
    q = (q || '').trim(); deep = deep || $('#mztDeep').checked;
    if (busy || !q) return; if (!sample) { note(); return; }
    const c = refreshCtx();
    if (!cur || (cur.sec !== c.label && !forced)) { cur = { id: 't' + Date.now().toString(36), sec: c.label, date: today(), title: q.slice(0, 80), msgs: [] }; ST.threads.push(cur); }
    else if (!ST.threads.includes(cur)) ST.threads.push(cur);
    cur.msgs.push({ r: 'u', t: q }); busy = true; renderLog();
    const out = document.createElement('div'); out.className = 'mzt-m a'; out.textContent = deep ? 'Réflexion approfondie…' : 'Réflexion…'; $('#mztLog').appendChild(out);
    $('#mztSend').disabled = true; $('#mztStop').hidden = false;
    const style = deep
      ? 'Réponse APPROFONDIE (400 à 700 mots) : 1) l\'intuition avec une analogie, 2) l\'explication détaillée pas à pas, 3) pourquoi ça marche, 4) un exemple complet chiffré, 5) les pièges fréquents et ce qui tombe à l\'examen, 6) une question pour vérifier la compréhension.'
      : 'Réponse EXPLICATIVE (150 à 250 mots) : 1) l\'idée en une phrase, 2) l\'explication pas à pas, 3) un petit exemple chiffré ou concret, 4) une courte question pour vérifier la compréhension.';
    const mem = [];
    if (ST.memos.length) mem.push('DIFFICULTÉS DÉJÀ REPÉRÉES :\n' + ST.memos.slice(-12).map((m) => `- ${m.date} : ${m.text}`).join('\n'));
    const lastQ = ST.threads.flatMap((t) => t.msgs.filter((m) => m.r === 'u').map((m) => `[${t.sec}] ${m.t.slice(0, 100)}`)).slice(-6);
    if (lastQ.length) mem.push('SES DERNIÈRES QUESTIONS :\n' + lastQ.map((x) => '- ' + x).join('\n'));
    const rules = `Tu es le tuteur de ${C.student}, pour le module ${C.module}${C.prof ? ' du ' + C.prof : ''}. Il apprend souvent la notion pour la première fois.
Règles : réponds en français simple, en Markdown léger (**gras** pour les termes clés, tirets, étapes numérotées). Toute formule ou tout calcul s'écrit en LaTeX : $…$ dans la phrase, $$…$$ seul sur sa ligne pour une formule importante (ex. $\\hat y_i$, $$\\text{MSE}=\\frac{1}{n}\\sum_{i=1}^{n}(y_i-\\hat y_i)^2$$) ; jamais d'accents graves pour une formule, ils sont réservés au code et aux noms de fonctions. Un petit tableau Markdown est permis s'il clarifie (3 colonnes maximum, l'écran est étroit). ${style} Appuie-toi d'abord sur l'EXTRAIT ci-dessous et sur les conventions du prof ; si une source générale diffère du cours, signale l'écart et dis quelle version utiliser à l'examen (celle du prof). Pour un calcul, pose chaque étape et vérifie-la. S'il envoie une réponse ou une photo de brouillon, corrige étape par étape et nomme précisément l'erreur. Si tu n'es pas sûr, dis-le. S'il demande un mini-exercice, donne l'exercice sans la solution.
Utilise sa mémoire pour faire des liens avec ses confusions passées, sans la réciter.
Termine TOUJOURS par une dernière ligne séparée au format exact « MÉMO: … » qui résume en 15 mots maximum la difficulté révélée par sa question (ou « MÉMO: rien »). Cette ligne lui est cachée.
${C.conventions ? 'CONVENTIONS DU PROF : ' + C.conventions + '\n' : ''}MÉMOIRE DE L'ÉLÈVE :
${mem.join('\n\n') || '(rien pour l\'instant)'}
EXTRAIT (${c.label}) :
${c.text.slice(0, deep ? 9000 : 3500)}`;
    const recent = cur.msgs.slice(deep ? -9 : -5, -1).map((m) => ({ role: m.r === 'u' ? 'user' : 'assistant', content: m.t }));
    while (recent.length && recent[0].role !== 'user') recent.shift();
    const msgs = [...recent.filter((m) => m.content && m.content.trim()), { role: 'user', content: q }]; while (msgs.length > 1 && msgs[0].role !== 'user') msgs.shift(); msgs[0] = { role: 'user', content: rules + '\n\n---\nQuestion : ' + msgs[0].content };
    ctl = new AbortController();
    const opts = { modelTier: deep ? 'complex' : 'quick', cache: false, signal: ctl.signal, onText: ({ text }) => { out.innerHTML = md(visible(text)); dessinerMaths(out); $('#mztLog').scrollTop = 1e9; } };
    if (img) opts.images = [img];
    try {
      const r = await sample(msgs, opts);
      const mm = r.text.match(/(?:^|\n)\s*M[ÉE]MO\s*:\s*(.+)\s*$/i);
      cur.msgs.push({ r: 'a', t: visible(r.text) + (r.truncated ? '\n\n(Réponse coupée : pose une question plus ciblée.)' : ''), d: !!deep });
      if (mm && !/^\s*rien/i.test(mm[1])) { ST.memos.push({ date: today(), text: mm[1].trim().slice(0, 160) }); if (ST.memos.length > 30) ST.memos.shift(); saveMemos(); }
      await saveThread(cur);
    } catch (e) {
      const kept = e && e.text ? visible(e.text) : '';
      if (e && e.code === 'cancelled') { if (kept) cur.msgs.push({ r: 'a', t: kept + '\n(Arrêté.)' }); else cur.msgs.pop(); }
      else { cur.msgs.pop(); compacter(!!cur.msgs.length); out.textContent = (kept ? kept + '\n\n' : '') + (ERR[e && e.code] || 'Le tuteur n\'a pas pu répondre. Réessaie dans un instant.'); }
      if (!cur.msgs.length) ST.threads = ST.threads.filter((t) => t !== cur);
      saveLocal();
      if (!(e && e.code === 'cancelled')) { busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImgN').textContent = ''; return; }
    }
    busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImg').value = ''; $('#mztImgN').textContent = ''; renderLog();
  }

  // ---------- événements ----------
  $('#mztBtn').onclick = () => openPanel(null);
  $('#mztX').onclick = closePanel;
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#mztPan').hidden) closePanel(); });
  $('#mztTabH').onclick = () => view($('#mztHist').hidden ? 'hist' : 'chat');
  $('#mztTabM').onclick = () => view($('#mztMem').hidden ? 'mem' : 'chat');
  $('#mztQ').oninput = renderList;
  $('#mztList').onclick = (e) => { const id = e.target.dataset && e.target.dataset.cont; if (!id) return; cur = ST.threads.find((t) => t.id === id); view('chat'); $('#mztCtx').textContent = '· ' + cur.sec; renderLog(); };
  $('#mztMemL').onclick = (e) => { const i = e.target.dataset && e.target.dataset.memdel; if (i == null) return; ST.memos.splice(+i, 1); saveMemos(); renderMem(); };
  $('#mztChips').onclick = (e) => { const b = e.target.closest('[data-chip]'); if (!b) return; const t = $('#mztIn'); t.value = b.dataset.chip + (t.value ? ' : ' + t.value : ''); t.focus(); };
  $('#mztNew').onclick = () => { cur = null; renderLog(); };
  $('#mztStop').onclick = () => { if (ctl) ctl.abort(); };
  $('#mztImg').onchange = (e) => { img = e.target.files[0] || null; $('#mztImgN').textContent = img ? 'Photo : ' + img.name : ''; };
  $('#mztF').onsubmit = (e) => { e.preventDefault(); const v = $('#mztIn').value; $('#mztIn').value = ''; ask(v); };
  $('#mztIn').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#mztF').requestSubmit(); } });

  // ---------- capacités (facultatives) ----------
  const W = window.claude;
  if (W && W.use) {
    W.use('sample').then((s) => { sample = s; ready = true; note();
      if (s && s.limits) s.limits().then((l) => { if (l && l.images) { imgOK = true; $('#mztImgL').hidden = false; if (l.images.mediaTypes) $('#mztImg').accept = l.images.mediaTypes.join(','); } }).catch(() => {});
    }).catch(() => { ready = true; note(); });
    Promise.all([W.use('db'), W.use('user')]).then(async ([d, u]) => {
      if (!d || !u) return; const id = await u.id(); if (!id) return; db = d; base = 'data/users/' + id + '/mzt_' + C.id;
      try {
        const m = await db.doc(base).get(); if (m.exists) { const v = m.data() || {}; if (Array.isArray(v.memos)) ST.memos = JSON.parse(JSON.stringify(v.memos)); }
        const q = await db.collection(base + '/threads').get(); const remote = q.docs.map((x) => Object.assign({ id: x.id }, JSON.parse(JSON.stringify(x.data() || {}))));
        const map = {}; [...ST.threads, ...remote].forEach((t) => { if (!map[t.id] || (t.msgs || []).length > (map[t.id].msgs || []).length) map[t.id] = t; });
        ST.threads = Object.values(map).sort((a, b) => parseInt(a.id.slice(1), 36) - parseInt(b.id.slice(1), 36)); saveLocal();
      } catch (e) {}
    }).catch(() => {});
  } else { ready = true; note(); }

  window.MZT = { open: openPanel, close: closePanel };
})();

</script>

if(window.top===window&&location.protocol==="file:"){a.hidden=true;return}
a.href=p.indexOf("/decouvrir")===0||location.pathname.indexOf("/decouvrir")===0?"/decouvrir":"/app/modules";})();</script>
