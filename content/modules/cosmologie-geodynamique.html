<script>
const MODULE={"slug":"cosmologie-geodynamique","titre":"Cosmologie et géodynamique interne","cle":"cosmologie-geodynamique_scores","cleEtat":"cosmologie-geodynamique_scores_etat","format":"score10","intro":"<p>Ce module suit <strong>le polycopié du module G116<\/strong> (cosmologie, introduction à la géologie, géodynamique interne) et se termine par <strong>les contrôles 2022 corrigés<\/strong> (normale et rattrapage).<\/p>\n<p><strong>Comment l&#39;utiliser<\/strong><\/p>\n<ol>\n<li>Lis un chapitre ; retiens les chiffres en gras (âges, profondeurs, vitesses) : ils tombent dans les QCM.<\/li>\n<li>À l&#39;examen, plusieurs réponses peuvent être justes : lis chaque proposition seule.<\/li>\n<li>Fais le QCM du chapitre. <strong>8/10 = chapitre maîtrisé.<\/strong><\/li>\n<\/ol>\n<p><strong>À vérifier<\/strong> : les fichiers des contrôles corrigés ne contiennent pas les cases cochées ; les réponses sont rédigées par nous.<\/p>\n","annexes":[],"cartes":null,"maths":false};
const CHAPS=[{"id":"univers-systeme-solaire","t":"L'Univers et le système solaire","seance":"Chapitre 2 · Cosmologie","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut lire les puissances de 10 : 4,56·10⁹ ans = 4 560 millions d&#39;années = 4,56 Ga.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>4560·10⁶ ans et 4,56·10⁹ ans, est-ce la même durée ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Oui : 4560·10⁶ = 4,56·10⁹. Les deux propositions sont justes dans un QCM.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « une histoire en quatre temps ».<\/strong> Big Bang → étoiles et galaxies → nébuleuse solaire → planètes qui se différencient.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Croire que l&#39;âge de la Terre a été mesuré sur des roches terrestres. Il a été mesuré sur des <strong>météorites<\/strong> (chondrites), car les roches les plus anciennes de la Terre ont été recyclées.<\/p>\n<\/aside><p>À la fin, tu connais les étapes de la formation du système solaire et les chiffres clés.<\/p>\n<h2>Idée 1 · Le Big Bang<\/h2>\n<p>L&#39;Univers est né il y a environ <strong>13,8 Ga<\/strong>. Trois preuves : l&#39;expansion (fuite des galaxies, loi de Hubble, décalage vers le rouge), le rayonnement fossile (fond diffus cosmologique à ≈ 2,7 K), l&#39;abondance de l&#39;hélium et de l&#39;hydrogène.<\/p>\n<h2>Idée 2 · La formation du système solaire<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Du nuage aux planètes<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · 1. Un nuage de gaz et de poussières (nébuleuse) s&#39;effondre et tourne.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · 2. Le centre forme le Soleil ; autour, un disque.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · 3. Les poussières s&#39;agglomèrent : planétésimaux, puis planètes (accrétion).<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · 4. Près du Soleil : planètes telluriques (rocheuses) ; loin : planètes géantes gazeuses.<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><figure class=\"grille\"><figcaption>Les deux familles de planètes<\/figcaption><table><tr><th>,<\/th><th>Telluriques,<\/th><th>Géantes<\/th><\/tr><tr><td class=\"h1\">Exemples,<\/td><td>Mercure<\/td><td>Vénus<\/td><td>Terre<\/td><td>Mars,<\/td><td>Jupiter<\/td><td>Saturne<\/td><td>Uranus<\/td><td>Neptune<\/td><\/tr><tr><td class=\"h1\">Composition,<\/td><td>roches<\/td><td>et<\/td><td>métaux,<\/td><td>gaz<\/td><td>(H,<\/td><td>He)<\/td><td>et<\/td><td>glaces<\/td><\/tr><tr><td class=\"h1\">Densité,<\/td><td>forte<\/td><td>(≈<\/td><td>5,5<\/td><td>pour<\/td><td>la<\/td><td>Terre),<\/td><td>faible<\/td><\/tr><\/table><\/figure><h2>Idée 3 · L&#39;âge de la Terre<\/h2>\n<p><strong>4,56 Ga<\/strong>, obtenu par <strong>radiochronologie<\/strong> sur des <strong>météorites<\/strong>. Les plus vieilles roches terrestres connues sont des <strong>gneiss d&#39;Acasta<\/strong> (nord du Canada), <strong>≈ 4,03-4,04 Ga<\/strong>, dans la <strong>croûte continentale<\/strong>. Des cristaux de zircon d&#39;Australie atteignent 4,4 Ga.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Application<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Pourquoi date-t-on la Terre avec des météorites ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Elles se sont formées en même temps que la Terre et n&#39;ont pas été transformées par la tectonique, l&#39;érosion ou le métamorphisme.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Où sont les plus anciennes roches terrestres ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Dans la croûte continentale (gneiss d&#39;Acasta, nord du Canada, ≈ 4,03 Ga). La croûte océanique a au plus ≈ 180 Ma.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">L&#39;âge de la Terre a été mesuré sur :<\/div><button class=\"opt\" data-o=\"0\">des roches océaniques<\/button><button class=\"opt\" data-o=\"1\">des météorites<\/button><button class=\"opt\" data-o=\"2\">des fossiles<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Une preuve du Big Bang :<\/div><button class=\"opt\" data-o=\"0\">le rayonnement fossile<\/button><button class=\"opt\" data-o=\"1\">la tectonique des plaques<\/button><button class=\"opt\" data-o=\"2\">les marées<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Jupiter est une planète :<\/div><button class=\"opt\" data-o=\"0\">tellurique<\/button><button class=\"opt\" data-o=\"1\">géante gazeuse<\/button><button class=\"opt\" data-o=\"2\">naine<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">L&#39;âge de la Terre vaut :<\/div><button class=\"opt\" data-o=\"0\">4,56 Ga<\/button><button class=\"opt\" data-o=\"1\">13,8 Ga<\/button><button class=\"opt\" data-o=\"2\">4,56 Ma<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Les plus vieilles roches terrestres sont dans :<\/div><button class=\"opt\" data-o=\"0\">la croûte continentale<\/button><button class=\"opt\" data-o=\"1\">la croûte océanique<\/button><button class=\"opt\" data-o=\"2\">le noyau<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">L&#39;accrétion est :<\/div><button class=\"opt\" data-o=\"0\">l&#39;agglomération de matière en corps plus gros<\/button><button class=\"opt\" data-o=\"1\">la destruction d&#39;une planète<\/button><button class=\"opt\" data-o=\"2\">la fusion nucléaire<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Les planètes proches du Soleil sont :<\/div><button class=\"opt\" data-o=\"0\">rocheuses<\/button><button class=\"opt\" data-o=\"1\">gazeuses<\/button><button class=\"opt\" data-o=\"2\">glacées<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">La fuite des galaxies montre :<\/div><button class=\"opt\" data-o=\"0\">que l&#39;Univers est en expansion<\/button><button class=\"opt\" data-o=\"1\">que la Terre tourne<\/button><button class=\"opt\" data-o=\"2\">que le Soleil est jeune<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">La méthode qui donne un âge en années est :<\/div><button class=\"opt\" data-o=\"0\">la radiochronologie<\/button><button class=\"opt\" data-o=\"1\">la superposition<\/button><button class=\"opt\" data-o=\"2\">la paléontologie seule<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Les gneiss d&#39;Acasta ont :<\/div><button class=\"opt\" data-o=\"0\">≈ 4,03 Ga<\/button><button class=\"opt\" data-o=\"1\">4,56 Ga<\/button><button class=\"opt\" data-o=\"2\">180 Ma<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"univers-systeme-solaire","rep":null,"tol":null},{"n":"univers-systeme-solaire","rep":null,"tol":null},{"n":"univers-systeme-solaire","rep":null,"tol":null}],"qcm":[{"n":"univers-systeme-solaire","q":"L&#39;âge de la Terre a été mesuré sur :","o":["des roches océaniques","des météorites","des fossiles"],"a":1,"e":"Chondrites."},{"n":"univers-systeme-solaire","q":"Une preuve du Big Bang :","o":["le rayonnement fossile","la tectonique des plaques","les marées"],"a":0,"e":"Fond diffus à ≈ 2,7 K."},{"n":"univers-systeme-solaire","q":"Jupiter est une planète :","o":["tellurique","géante gazeuse","naine"],"a":1,"e":"Surtout H et He."},{"n":"univers-systeme-solaire","q":"L&#39;âge de la Terre vaut :","o":["4,56 Ga","13,8 Ga","4,56 Ma"],"a":0,"e":"Milliards d&#39;années."},{"n":"univers-systeme-solaire","q":"Les plus vieilles roches terrestres sont dans :","o":["la croûte continentale","la croûte océanique","le noyau"],"a":0,"e":"Recyclage de la croûte océanique."},{"n":"univers-systeme-solaire","q":"L&#39;accrétion est :","o":["l&#39;agglomération de matière en corps plus gros","la destruction d&#39;une planète","la fusion nucléaire"],"a":0,"e":"Planétésimaux → planètes."},{"n":"univers-systeme-solaire","q":"Les planètes proches du Soleil sont :","o":["rocheuses","gazeuses","glacées"],"a":0,"e":"Les éléments volatils ont été chassés."},{"n":"univers-systeme-solaire","q":"La fuite des galaxies montre :","o":["que l&#39;Univers est en expansion","que la Terre tourne","que le Soleil est jeune"],"a":0,"e":"Loi de Hubble."},{"n":"univers-systeme-solaire","q":"La méthode qui donne un âge en années est :","o":["la radiochronologie","la superposition","la paléontologie seule"],"a":0,"e":"Datation absolue."},{"n":"univers-systeme-solaire","q":"Les gneiss d&#39;Acasta ont :","o":["≈ 4,03 Ga","4,56 Ga","180 Ma"],"a":0,"e":"Nord du Canada."}]},{"id":"temps-geologiques","t":"Le temps en géologie","seance":"Introduction à la géologie · Datation relative et absolue","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut se souvenir de la décroissance radioactive : après une demi-vie, il reste la moitié des atomes pères.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Après 2 demi-vies, quelle fraction d&#39;atomes pères reste-t-il ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.25<\/b><\/p><p>Un quart.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « avant / après », puis « combien ».<\/strong> La datation relative ordonne les événements ; la datation absolue (radiochronologie) leur donne un âge chiffré.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Placer le Permien dans le Mésozoïque. Le Permien est la <strong>dernière période du Paléozoïque<\/strong> (ère primaire) ; le Mésozoïque commence avec le Trias.<\/p>\n<\/aside><p>À la fin, tu sais réciter les ères et leurs limites, et appliquer les principes de datation relative.<\/p>\n<h2>Idée 1 · L&#39;échelle des temps<\/h2>\n<figure class=\"grille\"><figcaption>Les ères du Phanérozoïque<\/figcaption><table><tr><th>Ère,<\/th><th>Ancien<\/th><th>nom,<\/th><th>Périodes,<\/th><th>Fin<\/th><th>marquée<\/th><th>par<\/th><\/tr><tr><td class=\"h1\">Paléozoïque<\/td><td>(541<\/td><td>à<\/td><td>252<\/td><td>Ma),<\/td><td>primaire,<\/td><td>Cambrien<\/td><td>Ordovicien<\/td><td>Silurien<\/td><td>Dévonien<\/td><td>Carbonifère<\/td><td>Permien,<\/td><td>crise<\/td><td>Permien-Trias<\/td><td>(la<\/td><td>plus<\/td><td>grave)<\/td><\/tr><tr><td class=\"h1\">Mésozoïque<\/td><td>(252<\/td><td>à<\/td><td>66<\/td><td>Ma),<\/td><td>secondaire,<\/td><td>Trias<\/td><td>Jurassique<\/td><td>Crétacé,<\/td><td>limite<\/td><td>K-T<\/td><td>(dinosaures)<\/td><\/tr><tr><td class=\"h1\">Cénozoïque<\/td><td>(66<\/td><td>Ma<\/td><td>à<\/td><td>aujourd'hui),<\/td><td>tertiaire<\/td><td>et<\/td><td>quaternaire,<\/td><td>Paléogène<\/td><td>Néogène<\/td><td>Quaternaire,<\/td><td>—<\/td><\/tr><\/table><\/figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>La <strong>limite K-T<\/strong> (Crétacé-Tertiaire, 66 Ma) est soulignée par une couche argileuse riche en <strong>iridium<\/strong> (impact d&#39;astéroïde) ; elle voit l&#39;extinction des dinosaures et des ammonites. Les <strong>trilobites<\/strong>, eux, disparaissent à la fin du <strong>Permien<\/strong>.<\/p>\n<\/aside><h2>Idée 2 · La datation relative<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Les principes<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · 1. Superposition : une couche est plus récente que celle qu&#39;elle recouvre.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · 2. Continuité : une couche a le même âge sur toute son étendue.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · 3. Recoupement : ce qui recoupe (faille, filon) est plus récent que ce qui est recoupé.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · 4. Inclusion : un fragment inclus est plus ancien que la roche qui l&#39;inclut.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · 5. Identité paléontologique : mêmes fossiles stratigraphiques, même âge.<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Idée 3 · La radiochronologie<\/h2>\n<p>Âge : t = (1/λ) × ln(1 + F/P), avec F atomes fils et P atomes pères. Couples usuels : U/Pb (roches très anciennes), K/Ar, Rb/Sr, ¹⁴C (moins de ≈ 50 000 ans).<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Application<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Un filon de basalte recoupe une couche de calcaire. Lequel est le plus ancien ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Le calcaire : ce qui recoupe est plus récent.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Le ¹⁴C peut-il dater une roche de 10 Ma ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Non : sa demi-vie (5 730 ans) le limite à ≈ 50 000 ans. On utilise K/Ar par exemple.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Le Mésozoïque comprend :<\/div><button class=\"opt\" data-o=\"0\">Trias, Jurassique, Crétacé<\/button><button class=\"opt\" data-o=\"1\">Cambrien, Trias, Permien<\/button><button class=\"opt\" data-o=\"2\">Permien, Trias, Jurassique<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">La limite K-T est marquée par :<\/div><button class=\"opt\" data-o=\"0\">une couche riche en iridium<\/button><button class=\"opt\" data-o=\"1\">l&#39;apparition des trilobites<\/button><button class=\"opt\" data-o=\"2\">la formation de la Pangée<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Les trilobites disparaissent à la fin :<\/div><button class=\"opt\" data-o=\"0\">du Permien<\/button><button class=\"opt\" data-o=\"1\">du Crétacé<\/button><button class=\"opt\" data-o=\"2\">du Cambrien<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">La datation absolue utilise :<\/div><button class=\"opt\" data-o=\"0\">la radioactivité<\/button><button class=\"opt\" data-o=\"1\">la superposition<\/button><button class=\"opt\" data-o=\"2\">les fossiles seuls<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Une faille qui coupe trois couches est :<\/div><button class=\"opt\" data-o=\"0\">plus récente que les trois<\/button><button class=\"opt\" data-o=\"1\">plus ancienne<\/button><button class=\"opt\" data-o=\"2\">du même âge<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">La plus grande crise biologique :<\/div><button class=\"opt\" data-o=\"0\">Permien-Trias<\/button><button class=\"opt\" data-o=\"1\">K-T<\/button><button class=\"opt\" data-o=\"2\">Quaternaire<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Le Cénozoïque commence à :<\/div><button class=\"opt\" data-o=\"0\">66 Ma<\/button><button class=\"opt\" data-o=\"1\">252 Ma<\/button><button class=\"opt\" data-o=\"2\">541 Ma<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Le ¹⁴C sert à dater :<\/div><button class=\"opt\" data-o=\"0\">des restes de moins de 50 000 ans<\/button><button class=\"opt\" data-o=\"1\">des météorites<\/button><button class=\"opt\" data-o=\"2\">le noyau terrestre<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Le principe de superposition dit :<\/div><button class=\"opt\" data-o=\"0\">la couche du dessus est plus récente<\/button><button class=\"opt\" data-o=\"1\">la couche du dessus est plus ancienne<\/button><button class=\"opt\" data-o=\"2\">toutes les couches ont le même âge<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Paléozoïque est l&#39;ancien nom de l&#39;ère :<\/div><button class=\"opt\" data-o=\"0\">primaire<\/button><button class=\"opt\" data-o=\"1\">secondaire<\/button><button class=\"opt\" data-o=\"2\">tertiaire<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"temps-geologiques","rep":["0.25"],"tol":null},{"n":"temps-geologiques","rep":null,"tol":null},{"n":"temps-geologiques","rep":null,"tol":null}],"qcm":[{"n":"temps-geologiques","q":"Le Mésozoïque comprend :","o":["Trias, Jurassique, Crétacé","Cambrien, Trias, Permien","Permien, Trias, Jurassique"],"a":0,"e":"Le Permien est paléozoïque."},{"n":"temps-geologiques","q":"La limite K-T est marquée par :","o":["une couche riche en iridium","l&#39;apparition des trilobites","la formation de la Pangée"],"a":0,"e":"Impact d&#39;astéroïde."},{"n":"temps-geologiques","q":"Les trilobites disparaissent à la fin :","o":["du Permien","du Crétacé","du Cambrien"],"a":0,"e":"Ils ne sont pas concernés par K-T."},{"n":"temps-geologiques","q":"La datation absolue utilise :","o":["la radioactivité","la superposition","les fossiles seuls"],"a":0,"e":"Radiochronologie."},{"n":"temps-geologiques","q":"Une faille qui coupe trois couches est :","o":["plus récente que les trois","plus ancienne","du même âge"],"a":0,"e":"Recoupement."},{"n":"temps-geologiques","q":"La plus grande crise biologique :","o":["Permien-Trias","K-T","Quaternaire"],"a":0,"e":"≈ 95 % des espèces marines."},{"n":"temps-geologiques","q":"Le Cénozoïque commence à :","o":["66 Ma","252 Ma","541 Ma"],"a":0,"e":"Après K-T."},{"n":"temps-geologiques","q":"Le ¹⁴C sert à dater :","o":["des restes de moins de 50 000 ans","des météorites","le noyau terrestre"],"a":0,"e":"Demi-vie courte."},{"n":"temps-geologiques","q":"Le principe de superposition dit :","o":["la couche du dessus est plus récente","la couche du dessus est plus ancienne","toutes les couches ont le même âge"],"a":0,"e":"Si la série n&#39;est pas renversée."},{"n":"temps-geologiques","q":"Paléozoïque est l&#39;ancien nom de l&#39;ère :","o":["primaire","secondaire","tertiaire"],"a":0,"e":"Mésozoïque = secondaire."}]},{"id":"structure-interne","t":"La structure interne de la Terre","seance":"Géodynamique interne · Sismologie et enveloppes","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir qu&#39;une onde change de vitesse, et donc de direction, quand elle change de milieu (comme la lumière).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Une onde accélère brutalement à une certaine profondeur. Qu&#39;en déduis-tu ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Il y a une discontinuité : le matériau change en dessous.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « les séismes sont une échographie ».<\/strong> Les ondes sismiques traversent la Terre ; leurs vitesses et leurs zones d&#39;ombre révèlent les couches.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Dire que le champ magnétique naît dans le manteau. Il est produit par les mouvements du <strong>fer liquide du noyau externe<\/strong> (effet dynamo).<\/p>\n<\/aside><p>À la fin, tu sais décrire les enveloppes, les discontinuités et le comportement des ondes P et S.<\/p>\n<h2>Idée 1 · Les ondes sismiques<\/h2>\n<figure class=\"grille\"><figcaption>Ondes de volume<\/figcaption><table><tr><th>Onde,<\/th><th>Type,<\/th><th>Vitesse,<\/th><th>Traverse<\/th><th>les<\/th><th>liquides<\/th><th>?<\/th><\/tr><tr><td class=\"h1\">P<\/td><td>(premières),<\/td><td>compression,<\/td><td>longitudinale,<\/td><td>la<\/td><td>plus<\/td><td>rapide<\/td><td>(jusqu'à<\/td><td>≈<\/td><td>13-14<\/td><td>km/s),<\/td><td>oui<\/td><\/tr><tr><td class=\"h1\">S<\/td><td>(secondes),<\/td><td>cisaillement,<\/td><td>transversale,<\/td><td>plus<\/td><td>lente,<\/td><td>non<\/td><\/tr><\/table><\/figure><p>Une <strong>hodochrone<\/strong> est la courbe du temps d&#39;arrivée des ondes en fonction de la distance à l&#39;épicentre, construite avec les enregistrements des stations sismiques.<\/p>\n<h2>Idée 2 · Les enveloppes et discontinuités<\/h2>\n<svg viewBox=\"0 0 320 170\" role=\"img\" aria-label=\"Coupe de la Terre : croûte, manteau, noyau externe liquide, noyau interne solide\" style=\"max-width:300px;width:100%\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"160\" cy=\"85\" r=\"80\"/><circle cx=\"160\" cy=\"85\" r=\"44\" stroke=\"#D9824F\"/><circle cx=\"160\" cy=\"85\" r=\"15\" fill=\"#D9824F\" fill-opacity=\".4\" stroke=\"#D9824F\"/><circle cx=\"160\" cy=\"85\" r=\"77\"/><\/g>\n<g fill=\"currentColor\" font-size=\"10\"><text x=\"245\" y=\"40\">croûte<\/text><text x=\"200\" y=\"65\">manteau<\/text><text x=\"125\" y=\"120\">noyau externe<\/text><text x=\"150\" y=\"88\">graine<\/text><\/g>\n<\/svg><figure class=\"grille\"><figcaption>De la surface au centre<\/figcaption><table><tr><th>Enveloppe,<\/th><th>Profondeur,<\/th><th>État,<\/th><th>Composition<\/th><\/tr><tr><td class=\"h1\">Croûte<\/td><td>continentale,<\/td><td>0<\/td><td>à<\/td><td>30-70<\/td><td>km,<\/td><td>solide,<\/td><td>granitique<\/td><td>(«<\/td><td>Sial<\/td><td>»),<\/td><td>jusqu'à<\/td><td>4<\/td><td>Ga<\/td><\/tr><tr><td class=\"h1\">Croûte<\/td><td>océanique,<\/td><td>0<\/td><td>à<\/td><td>7<\/td><td>km,<\/td><td>solide,<\/td><td>basaltique,<\/td><td>moins<\/td><td>de<\/td><td>200<\/td><td>Ma<\/td><\/tr><tr><td class=\"h1\">Manteau,<\/td><td>Moho<\/td><td>à<\/td><td>2<\/td><td>900<\/td><td>km,<\/td><td>solide<\/td><td>(ductile),<\/td><td>péridotite<\/td><\/tr><tr><td class=\"h1\">Noyau<\/td><td>externe,<\/td><td>2<\/td><td>900<\/td><td>à<\/td><td>5<\/td><td>150<\/td><td>km,<\/td><td>liquide,<\/td><td>Fe<\/td><td>Ni<\/td><td>(+<\/td><td>S,<\/td><td>O)<\/td><\/tr><tr><td class=\"h1\">Noyau<\/td><td>interne<\/td><td>(graine),<\/td><td>5<\/td><td>150<\/td><td>à<\/td><td>6<\/td><td>371<\/td><td>km,<\/td><td>solide,<\/td><td>Fe<\/td><td>Ni<\/td><\/tr><\/table><\/figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Moho : croûte/manteau. Gutenberg (2 900 km) : manteau/noyau, les ondes S disparaissent. Lehmann (5 150 km) : noyau externe/graine.<\/p>\n<\/aside><h2>Idée 3 · Lithosphère, asthénosphère, chaleur<\/h2>\n<p>La <strong>lithosphère<\/strong> (croûte + manteau supérieur rigide, ≈ 100 km) glisse sur l&#39;<strong>asthénosphère<\/strong> (manteau ductile). Le <strong>gradient géothermique<\/strong> moyen est ≈ <strong>30 °C/km<\/strong> près de la surface.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Application<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Pourquoi les ondes S ne traversent-elles pas le noyau externe ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Il est liquide, et un liquide ne transmet pas le cisaillement.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Une station à 120° de l&#39;épicentre ne reçoit ni P ni S directes. Pourquoi ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Elle est dans la zone d&#39;ombre (≈ 103° à 143°) créée par la réfraction des ondes P au contact du noyau.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Les ondes P sont :<\/div><button class=\"opt\" data-o=\"0\">des ondes de compression<\/button><button class=\"opt\" data-o=\"1\">transversales<\/button><button class=\"opt\" data-o=\"2\">arrêtées par les liquides<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Le noyau externe est :<\/div><button class=\"opt\" data-o=\"0\">liquide<\/button><button class=\"opt\" data-o=\"1\">solide<\/button><button class=\"opt\" data-o=\"2\">gazeux<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Le champ magnétique terrestre :<\/div><button class=\"opt\" data-o=\"0\">est généré dans le noyau externe<\/button><button class=\"opt\" data-o=\"1\">naît dans la croûte<\/button><button class=\"opt\" data-o=\"2\">bloque les météorites<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Épaisseur moyenne de la croûte océanique :<\/div><button class=\"opt\" data-o=\"0\">≈ 7 km<\/button><button class=\"opt\" data-o=\"1\">≈ 35 km<\/button><button class=\"opt\" data-o=\"2\">≈ 100 km<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">La discontinuité de Mohorovičić sépare :<\/div><button class=\"opt\" data-o=\"0\">croûte et manteau<\/button><button class=\"opt\" data-o=\"1\">manteau et noyau<\/button><button class=\"opt\" data-o=\"2\">noyau externe et graine<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Le noyau est surtout fait de :<\/div><button class=\"opt\" data-o=\"0\">Fe et Ni<\/button><button class=\"opt\" data-o=\"1\">Si et Al<\/button><button class=\"opt\" data-o=\"2\">Mg et Ca<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Le gradient géothermique moyen :<\/div><button class=\"opt\" data-o=\"0\">≈ 30 °C/km<\/button><button class=\"opt\" data-o=\"1\">≈ 150 °C/km<\/button><button class=\"opt\" data-o=\"2\">≈ 3 °C/km<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Une hodochrone est utilisée en :<\/div><button class=\"opt\" data-o=\"0\">sismologie<\/button><button class=\"opt\" data-o=\"1\">géochronologie<\/button><button class=\"opt\" data-o=\"2\">paléontologie<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">La lithosphère repose sur :<\/div><button class=\"opt\" data-o=\"0\">l&#39;asthénosphère<\/button><button class=\"opt\" data-o=\"1\">le noyau<\/button><button class=\"opt\" data-o=\"2\">la graine<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">La croûte continentale est :<\/div><button class=\"opt\" data-o=\"0\">plus vieille que la croûte océanique<\/button><button class=\"opt\" data-o=\"1\">plus dense que la croûte océanique<\/button><button class=\"opt\" data-o=\"2\">basaltique<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"structure-interne","rep":null,"tol":null},{"n":"structure-interne","rep":null,"tol":null},{"n":"structure-interne","rep":null,"tol":null}],"qcm":[{"n":"structure-interne","q":"Les ondes P sont :","o":["des ondes de compression","transversales","arrêtées par les liquides"],"a":0,"e":"Longitudinales."},{"n":"structure-interne","q":"Le noyau externe est :","o":["liquide","solide","gazeux"],"a":0,"e":"Les S y disparaissent."},{"n":"structure-interne","q":"Le champ magnétique terrestre :","o":["est généré dans le noyau externe","naît dans la croûte","bloque les météorites"],"a":0,"e":"Il dévie le vent solaire."},{"n":"structure-interne","q":"Épaisseur moyenne de la croûte océanique :","o":["≈ 7 km","≈ 35 km","≈ 100 km"],"a":0,"e":"Basaltique."},{"n":"structure-interne","q":"La discontinuité de Mohorovičić sépare :","o":["croûte et manteau","manteau et noyau","noyau externe et graine"],"a":0,"e":"Moho."},{"n":"structure-interne","q":"Le noyau est surtout fait de :","o":["Fe et Ni","Si et Al","Mg et Ca"],"a":0,"e":"Si, Al : croûte (Sial)."},{"n":"structure-interne","q":"Le gradient géothermique moyen :","o":["≈ 30 °C/km","≈ 150 °C/km","≈ 3 °C/km"],"a":0,"e":"Près de la surface."},{"n":"structure-interne","q":"Une hodochrone est utilisée en :","o":["sismologie","géochronologie","paléontologie"],"a":0,"e":"Temps d&#39;arrivée des ondes."},{"n":"structure-interne","q":"La lithosphère repose sur :","o":["l&#39;asthénosphère","le noyau","la graine"],"a":0,"e":"Manteau ductile."},{"n":"structure-interne","q":"La croûte continentale est :","o":["plus vieille que la croûte océanique","plus dense que la croûte océanique","basaltique"],"a":0,"e":"Granitique, peu recyclée."}]},{"id":"tectonique-des-plaques","t":"La tectonique des plaques","seance":"Géodynamique interne · Plaques, dorsales, subduction, points chauds","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir que la lithosphère est rigide et découpée en plaques.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Sur quoi glissent les plaques lithosphériques ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Sur l&#39;asthénosphère, partie ductile du manteau.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « trois frontières ».<\/strong> Les plaques s&#39;écartent (dorsale), se rapprochent (subduction, collision) ou coulissent (faille transformante). Tout le reste en découle.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Associer une fosse océanique à une dorsale. La fosse marque une <strong>subduction<\/strong>, frontière <strong>convergente<\/strong>.<\/p>\n<\/aside><p>À la fin, tu sais relier chaque relief (dorsale, fosse, chaîne, archipel) à son mécanisme.<\/p>\n<h2>Idée 1 · Les frontières de plaques<\/h2>\n<figure class=\"grille\"><figcaption>Les trois types<\/figcaption><table><tr><th>Frontière,<\/th><th>Mouvement,<\/th><th>Relief,<\/th><th>Exemple<\/th><\/tr><tr><td class=\"h1\">Divergente,<\/td><td>écartement,<\/td><td>dorsale<\/td><td>(accrétion<\/td><td>océanique),<\/td><td>dorsale<\/td><td>médio-atlantique<\/td><\/tr><tr><td class=\"h1\">Convergente,<\/td><td>rapprochement,<\/td><td>fosse<\/td><td>+<\/td><td>volcans<\/td><td>(subduction)<\/td><td>ou<\/td><td>chaîne<\/td><td>(collision),<\/td><td>Andes<\/td><td>;<\/td><td>Himalaya<\/td><\/tr><tr><td class=\"h1\">Transformante,<\/td><td>coulissement,<\/td><td>faille,<\/td><td>faille<\/td><td>de<\/td><td>San<\/td><td>Andreas<\/td><\/tr><\/table><\/figure><svg viewBox=\"0 0 320 110\" role=\"img\" aria-label=\"Plaque océanique qui plonge sous une plaque continentale au niveau d'une fosse\" style=\"max-width:380px;width:100%\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M10 40h140l20 10M170 50l130 55\"/><path d=\"M190 30h120\" stroke=\"#D9824F\"/><path d=\"M60 25l30 0M75 20l15 5-15 5\"/><\/g>\n<g fill=\"currentColor\" font-size=\"10\"><text x=\"20\" y=\"30\">plaque océanique<\/text><text x=\"200\" y=\"22\">plaque continentale<\/text><text x=\"150\" y=\"70\">fosse<\/text><\/g>\n<\/svg><h2>Idée 2 · Les preuves<\/h2>\n<ul>\n<li>Les <strong>anomalies magnétiques<\/strong> symétriques de part et d&#39;autre des dorsales (le champ s&#39;inverse et reste fossilisé dans les basaltes).<\/li>\n<li>L&#39;âge des fonds océaniques augmente avec la distance à la dorsale.<\/li>\n<li>Les séismes dessinent les limites de plaques.<\/li>\n<li>La <strong>Pangée<\/strong> : un supercontinent qui a existé de la fin du Paléozoïque au Jurassique (Wegener).<\/li>\n<\/ul>\n<h2>Idée 3 · Les points chauds<\/h2>\n<p>Un panache venu du manteau profond perce la plaque : volcanisme intraplaque. La plaque se déplace au-dessus d&#39;un point fixe : chaîne d&#39;îles de plus en plus vieilles (Hawaï).<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Application<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>À quoi correspond une fosse océanique ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Une limite convergente (subduction), là où les fonds océaniques sont les plus profonds (Mariannes ≈ 11 km).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Pourquoi les îles d&#39;Hawaï ont-elles des âges croissants vers le nord-ouest ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>La plaque Pacifique dérive au-dessus d&#39;un point chaud fixe : chaque île s&#39;éloigne de la source et s&#39;éteint.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Une dorsale est une frontière :<\/div><button class=\"opt\" data-o=\"0\">divergente<\/button><button class=\"opt\" data-o=\"1\">convergente<\/button><button class=\"opt\" data-o=\"2\">transformante<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Une fosse océanique souligne :<\/div><button class=\"opt\" data-o=\"0\">une limite convergente<\/button><button class=\"opt\" data-o=\"1\">une dorsale<\/button><button class=\"opt\" data-o=\"2\">un point chaud<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Un point chaud se traduit par :<\/div><button class=\"opt\" data-o=\"0\">des éruptions volcaniques<\/button><button class=\"opt\" data-o=\"1\">des séismes uniquement<\/button><button class=\"opt\" data-o=\"2\">une fosse<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">La Pangée était :<\/div><button class=\"opt\" data-o=\"0\">un continent<\/button><button class=\"opt\" data-o=\"1\">un océan<\/button><button class=\"opt\" data-o=\"2\">une roche<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">L&#39;Himalaya résulte :<\/div><button class=\"opt\" data-o=\"0\">d&#39;une collision<\/button><button class=\"opt\" data-o=\"1\">d&#39;une dorsale<\/button><button class=\"opt\" data-o=\"2\">d&#39;un point chaud<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Les anomalies magnétiques des fonds océaniques sont :<\/div><button class=\"opt\" data-o=\"0\">symétriques par rapport à la dorsale<\/button><button class=\"opt\" data-o=\"1\">aléatoires<\/button><button class=\"opt\" data-o=\"2\">absentes<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">La croûte océanique la plus ancienne a :<\/div><button class=\"opt\" data-o=\"0\">moins de 200 Ma<\/button><button class=\"opt\" data-o=\"1\">4 Ga<\/button><button class=\"opt\" data-o=\"2\">1 Ga<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">La faille de San Andreas est :<\/div><button class=\"opt\" data-o=\"0\">transformante<\/button><button class=\"opt\" data-o=\"1\">divergente<\/button><button class=\"opt\" data-o=\"2\">une fosse<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">La croûte continentale est recyclée en subduction :<\/div><button class=\"opt\" data-o=\"0\">facilement<\/button><button class=\"opt\" data-o=\"1\">très peu (trop légère)<\/button><button class=\"opt\" data-o=\"2\">jamais créée<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Le mot accrétion océanique désigne :<\/div><button class=\"opt\" data-o=\"0\">la création de croûte océanique à la dorsale<\/button><button class=\"opt\" data-o=\"1\">la disparition d&#39;un océan<\/button><button class=\"opt\" data-o=\"2\">l&#39;érosion des côtes<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"tectonique-des-plaques","rep":null,"tol":null},{"n":"tectonique-des-plaques","rep":null,"tol":null},{"n":"tectonique-des-plaques","rep":null,"tol":null}],"qcm":[{"n":"tectonique-des-plaques","q":"Une dorsale est une frontière :","o":["divergente","convergente","transformante"],"a":0,"e":"Accrétion."},{"n":"tectonique-des-plaques","q":"Une fosse océanique souligne :","o":["une limite convergente","une dorsale","un point chaud"],"a":0,"e":"Subduction."},{"n":"tectonique-des-plaques","q":"Un point chaud se traduit par :","o":["des éruptions volcaniques","des séismes uniquement","une fosse"],"a":0,"e":"Archipels intra-océaniques."},{"n":"tectonique-des-plaques","q":"La Pangée était :","o":["un continent","un océan","une roche"],"a":0,"e":"Supercontinent."},{"n":"tectonique-des-plaques","q":"L&#39;Himalaya résulte :","o":["d&#39;une collision","d&#39;une dorsale","d&#39;un point chaud"],"a":0,"e":"Inde contre Asie."},{"n":"tectonique-des-plaques","q":"Les anomalies magnétiques des fonds océaniques sont :","o":["symétriques par rapport à la dorsale","aléatoires","absentes"],"a":0,"e":"Preuve de l&#39;expansion."},{"n":"tectonique-des-plaques","q":"La croûte océanique la plus ancienne a :","o":["moins de 200 Ma","4 Ga","1 Ga"],"a":0,"e":"Recyclée par subduction."},{"n":"tectonique-des-plaques","q":"La faille de San Andreas est :","o":["transformante","divergente","une fosse"],"a":0,"e":"Coulissement."},{"n":"tectonique-des-plaques","q":"La croûte continentale est recyclée en subduction :","o":["facilement","très peu (trop légère)","jamais créée"],"a":1,"e":"Elle est peu dense."},{"n":"tectonique-des-plaques","q":"Le mot accrétion océanique désigne :","o":["la création de croûte océanique à la dorsale","la disparition d&#39;un océan","l&#39;érosion des côtes"],"a":0,"e":"Frontière divergente."}]},{"id":"annales-2022","t":"Annales corrigées · contrôles 2022 (normale et rattrapage)","seance":"Module G116, contrôles du 21/01/2022 et du 11/02/2022 (QCM)","imp":5,"payant":true,"html":"<p>Les deux contrôles 2022 sont des QCM à réponses multiples. Voici les questions reprises du sujet, avec les bonnes réponses justifiées. Rappel de la consigne : toute rature annule la réponse.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Les fichiers « corrigés » fournis ne montrent pas les cases cochées. Les réponses ci-dessous sont rédigées par nous à partir du cours.<\/p>\n<\/aside><h2>Contrôle normal (21/01/2022)<\/h2>\n<section class=\"exo\"><h3>Questions 1 à 6<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><ol>\n<li>Subdivisions du Mésozoïque parmi : Cambrien, Trias, Permien, Crétacé, Jurassique.<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><strong>Trias, Jurassique, Crétacé.<\/strong> Cambrien et Permien sont paléozoïques.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><ol start=\"2\">\n<li>L&#39;âge de la Terre…<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Justes : <strong>est de 4,56·10⁹ ans<\/strong>, <strong>a été mesuré sur des météorites<\/strong>, <strong>est de 4560·10⁶ ans<\/strong> (même valeur), <strong>est obtenu par radiochronologie<\/strong>. Faux : mesuré sur des roches de la croûte.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><ol start=\"3\">\n<li>Le champ magnétique terrestre…<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Justes : <strong>bouclier qui bloque (dévie) les vents solaires<\/strong>, <strong>fossilisé par les minéraux ferromagnétiques des roches magmatiques<\/strong>, <strong>généré par le mouvement de matière chaude du noyau externe<\/strong>. Faux : naît dans le manteau ; protège des météorites.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><ol start=\"4\">\n<li>Les plus anciennes roches terrestres…<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Justes : <strong>découvertes au nord du Canada<\/strong>, <strong>sont des gneiss<\/strong>, <strong>≈ 4,04·10⁹ ans<\/strong>, <strong>appartiennent à la croûte continentale<\/strong>. Faux : croûte océanique.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><ol start=\"5\">\n<li>Une courbe hodochrone…<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Justes : <strong>utilisée en sismologie<\/strong>, <strong>exprime le retard d&#39;arrivée des ondes dans une station<\/strong>, <strong>construite grâce aux enregistrements des stations sismiques<\/strong>. Faux : géochronologie, analyse chimique.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><ol start=\"6\">\n<li>La limite K-T…<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Justes : <strong>passage de l&#39;ère secondaire à l&#39;ère cénozoïque<\/strong>, <strong>soulignée par une couche argileuse riche en iridium<\/strong>. Faux : extinction des trilobites (fin du Permien).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Contrôle de rattrapage (11/02/2022)<\/h2>\n<section class=\"exo\"><h3>Questions 1 à 7<\/h3><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><ol>\n<li>La Pangée est…<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><strong>Un continent<\/strong> (supercontinent). La formulation du sujet « jusqu&#39;à la fin de l&#39;ère primaire » est discutable : la Pangée se forme à la fin du Paléozoïque et se fragmente au Jurassique.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"7\"><div class=\"ex-q\"><ol start=\"2\">\n<li>Le gradient géothermique est…<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Justes : <strong>l&#39;augmentation de la température avec la profondeur<\/strong>, <strong>estimé à 30 °C/km en moyenne<\/strong>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"8\"><div class=\"ex-q\"><ol start=\"3\">\n<li>Un point chaud…<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Justes : <strong>se traduit par des éruptions volcaniques<\/strong>, <strong>est à l&#39;origine d&#39;archipels intra-océaniques<\/strong>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"9\"><div class=\"ex-q\"><ol start=\"4\">\n<li>Une fosse océanique…<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Justes : <strong>souligne une limite convergente<\/strong>, <strong>zone des profondeurs maximales<\/strong>. Faux : zone d&#39;accrétion, associée à une dorsale, caractéristique de l&#39;Atlantique (marges passives).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"10\"><div class=\"ex-q\"><ol start=\"5\">\n<li>La croûte continentale…<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Justes : <strong>plus vieille que la croûte océanique<\/strong>, <strong>dénommée « Sial »<\/strong>, <strong>composition granitique<\/strong>. Faux : épaisseur 7 km (c&#39;est l&#39;océanique) ; « recyclable en subduction » (très peu).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"11\"><div class=\"ex-q\"><ol start=\"6\">\n<li>Éléments du noyau interne.<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><strong>Ni, Fe<\/strong> (et la proposition Ni, Fe, S est acceptée par de nombreux cours pour le noyau dans son ensemble ; le soufre est surtout dans le noyau externe).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"12\"><div class=\"ex-q\"><ol start=\"7\">\n<li>Les ondes de compression…<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Justes : <strong>ondes longitudinales P<\/strong>, <strong>vitesse jusqu&#39;à ≈ 14 km/s<\/strong>. Faux : ondes S, ne traversent pas les liquides.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>QCM d&#39;entraînement<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Le Permien appartient au :<\/div><button class=\"opt\" data-o=\"0\">Paléozoïque<\/button><button class=\"opt\" data-o=\"1\">Mésozoïque<\/button><button class=\"opt\" data-o=\"2\">Cénozoïque<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">4,56·10⁹ ans et 4560·10⁶ ans :<\/div><button class=\"opt\" data-o=\"0\">sont la même valeur<\/button><button class=\"opt\" data-o=\"1\">diffèrent d&#39;un facteur 10<\/button><button class=\"opt\" data-o=\"2\">diffèrent d&#39;un facteur 1000<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Le champ magnétique est fossilisé dans :<\/div><button class=\"opt\" data-o=\"0\">les minéraux ferromagnétiques des roches magmatiques<\/button><button class=\"opt\" data-o=\"1\">les fossiles<\/button><button class=\"opt\" data-o=\"2\">les glaciers<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">La croûte de 7 km d&#39;épaisseur est :<\/div><button class=\"opt\" data-o=\"0\">océanique<\/button><button class=\"opt\" data-o=\"1\">continentale<\/button><button class=\"opt\" data-o=\"2\">le manteau<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">« Sial » désigne :<\/div><button class=\"opt\" data-o=\"0\">la croûte continentale<\/button><button class=\"opt\" data-o=\"1\">le noyau<\/button><button class=\"opt\" data-o=\"2\">le manteau<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Les ondes S :<\/div><button class=\"opt\" data-o=\"0\">ne traversent pas les liquides<\/button><button class=\"opt\" data-o=\"1\">sont les plus rapides<\/button><button class=\"opt\" data-o=\"2\">sont longitudinales<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">La couche à iridium date de :<\/div><button class=\"opt\" data-o=\"0\">66 Ma<\/button><button class=\"opt\" data-o=\"1\">252 Ma<\/button><button class=\"opt\" data-o=\"2\">4,56 Ga<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Les archipels alignés témoignent :<\/div><button class=\"opt\" data-o=\"0\">d&#39;un point chaud<\/button><button class=\"opt\" data-o=\"1\">d&#39;une dorsale<\/button><button class=\"opt\" data-o=\"2\">d&#39;une fo     return String(t).trim();
  };
  // rendu léger : on échappe le HTML d'abord, puis gras, italique, code, titres, puces, tableaux et blocs de code.
  // Les formules ($…$, $$…$$, \(…\), \[…\]) sont mises de côté avant le Markdown, puis dessinées par MathJax.
  const MATHS = [];
  const protegerMaths = (t) => {
    MATHS.length = 0;
    const garde = (tex, d) => { MATHS.push({ tex: tex.trim(), d }); return '\u0000' + (MATHS.length - 1) + '\u0000'; };
    const RX = /\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$(?=[^\s$])([^$\n]*?[^\s$\\])\$(?!\d)/g;
    // le code (blocs ``` et `…`) n'est jamais lu comme une formule
    return String(t).split(/(```[\s\S]*?(?:```|$))/).map((bloc, i) => i % 2 ? bloc
      : bloc.split(/(`[^`\n]*`)/).map((x, j) => j % 2 ? x : x.replace(RX, (_, a, b, c, d) => a != null ? garde(a, 1) : b != null ? garde(b, 1) : c != null ? garde(c, 0) : garde(d, 0))).join('')).join('');
  };
  const rendreMaths = (h) => h.replace(/\u0000(\d+)\u0000/g, (_, n) => { const m = MATHS[+n]; return m ? `<span class="mzt-tex${m.d ? ' d' : ''}" data-d="${m.d}">${esc(m.tex)}</span>` : ''; });
  const inl = (s) => {
    const p = s.split('`'); if (p.length % 2 === 0) { const last = p.pop(); p[p.length - 1] += '`' + last; }
    return p.map((x, i) => i % 2 ? '<code>' + esc(x) + '</code>' : esc(x).replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*\w])\*([^*\n]+)\*(?![*\w])/g, '$1<em>$2</em>')).join('');
  };
  const cellules = (l) => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim());
  const md = (t) => {
    const out = []; let list = null, code = null, tab = null, olN = 0;
    const flushTab = () => {
      if (!tab) return;
      if (tab.length >= 2 && /^[\s|:-]+$/.test(tab[1]) && tab[1].includes('-')) {
        const [tete, , ...corps] = tab;
        out.push('<div class="mzt-tab"><table><thead><tr>' + cellules(tete).map((c) => '<th>' + inl(c) + '</th>').join('') + '</tr></thead><tbody>'
          + corps.map((r) => '<tr>' + cellules(r).map((c) => '<td>' + inl(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>');
      } else tab.forEach((r) => out.push('<p>' + inl(r) + '</p>'));
      tab = null;
    };
    const flush = () => { flushTab(); if (list) { out.push('</' + list + '>'); list = null; } };
    protegerMaths(t).split('\n').forEach((raw) => {
      if (/^\s*```/.test(raw)) { if (code === null) { flush(); code = []; } else { out.push('<pre>' + esc(code.join('\n')) + '</pre>'); code = null; } return; }
      if (code !== null) { code.push(raw); return; }
      let m;
      if (/^\s*\|.*\|\s*$/.test(raw)) { if (list) { out.push('</' + list + '>'); list = null; } (tab = tab || []).push(raw); return; }
      flushTab();
      if ((m = raw.match(/^\s*#{1,6}\s+(.*)$/))) { flush(); olN = 0; out.push('<p><strong>' + inl(m[1]) + '</strong></p>'); }
      else if ((m = raw.match(/^\s*[-*•]\s+(.*)$/))) { if (list !== 'ul') { flush(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + inl(m[1]) + '</li>'); }
      else if ((m = raw.match(/^\s*(\d+)[.)]\s+(.*)$/))) { if (list !== 'ol') { flush(); const n = +m[1]; olN = (n === 1 && olN > 1) ? olN : n; out.push('<ol start="' + olN + '">'); list = 'ol'; } out.push('<li>' + inl(m[2]) + '</li>'); olN++; }
      else if (!raw.trim()) flush();
      else { flush(); out.push('<p>' + inl(raw) + '</p>'); }
    });
    if (code !== null) out.push('<pre>' + esc(code.join('\n')) + '</pre>');
    flush(); return rendreMaths(out.join(''));
  };

  // ---------- MathJax : celui de la page s'il existe, sinon chargé à la première formule ----------
  let mjPret = null;
  const mathjax = () => mjPret || (mjPret = new Promise((ok, ko) => {
    if (!window.MathJax) {
      window.MathJax = { svg: { fontCache: 'global' }, startup: { typeset: false } };
      const s = document.createElement('script'); s.async = true; s.src = 'https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js';
      s.onerror = () => ko(new Error('MathJax')); document.head.appendChild(s);
    }
    let n = 0; const t = setInterval(() => {
      if (window.MathJax && MathJax.tex2svgPromise && MathJax.startup && MathJax.startup.promise) { clearInterval(t); MathJax.startup.promise.then(ok, ko); }
      else if (++n > 150) { clearInterval(t); ko(new Error('MathJax')); }
    }, 100);
  })).catch((e) => { mjPret = null; throw e; });
  const svgCache = new Map(); let file = Promise.resolve();
  // tex2svg ne pose ni la feuille de style MathJax ni le cache des glyphes (police « global ») : sans eux, les glyphes sont invisibles,
  // seuls les caractères hors police (é, ô…) s'affichent en flottant, et le MathML d'accessibilité apparaît en clair. updateDocument les ajoute une fois.
  const pagePrete = () => { try { MathJax.startup.document.updateDocument(); } catch (e) {} };
  function dessinerMaths(racine) {
    const spans = [...racine.querySelectorAll('.mzt-tex:not([data-ok])')]; if (!spans.length) return;
    mathjax().then(() => spans.forEach((sp) => {
      const cle = sp.dataset.d + '|' + sp.textContent;
      const poser = (n) => { if (!sp.isConnected || sp.dataset.ok) return; sp.textContent = ''; sp.appendChild(n.cloneNode(true)); sp.dataset.ok = '1'; };
      if (svgCache.has(cle)) return poser(svgCache.get(cle));
      file = file.then(() => MathJax.tex2svgPromise(sp.textContent, { display: sp.dataset.d === '1' }).then((n) => { svgCache.set(cle, n); poser(n); pagePrete(); })).catch(() => {});
    })).catch(() => {});
  }
  async function ask(q, deep) {
    q = (q || '').trim(); deep = deep || $('#mztDeep').checked;
    if (busy || !q) return; if (!sample) { note(); return; }
    const c = refreshCtx();
    if (!cur || (cur.sec !== c.label && !forced)) { cur = { id: 't' + Date.now().toString(36), sec: c.label, date: today(), title: q.slice(0, 80), msgs: [] }; ST.threads.push(cur); }
    else if (!ST.threads.includes(cur)) ST.threads.push(cur);
    cur.msgs.push({ r: 'u', t: q }); busy = true; renderLog();
    const out = document.createElement('div'); out.className = 'mzt-m a'; out.textContent = deep ? 'Réflexion approfondie…' : 'Réflexion…'; $('#mztLog').appendChild(out);
    $('#mztSend').disabled = true; $('#mztStop').hidden = false;
    const style = deep
      ? 'Réponse APPROFONDIE (400 à 700 mots) : 1) l\'intuition avec une analogie, 2) l\'explication détaillée pas à pas, 3) pourquoi ça marche, 4) un exemple complet chiffré, 5) les pièges fréquents et ce qui tombe à l\'examen, 6) une question pour vérifier la compréhension.'
      : 'Réponse EXPLICATIVE (150 à 250 mots) : 1) l\'idée en une phrase, 2) l\'explication pas à pas, 3) un petit exemple chiffré ou concret, 4) une courte question pour vérifier la compréhension.';
    const mem = [];
    if (ST.memos.length) mem.push('DIFFICULTÉS DÉJÀ REPÉRÉES :\n' + ST.memos.slice(-12).map((m) => `- ${m.date} : ${m.text}`).join('\n'));
    const lastQ = ST.threads.flatMap((t) => t.msgs.filter((m) => m.r === 'u').map((m) => `[${t.sec}] ${m.t.slice(0, 100)}`)).slice(-6);
    if (lastQ.length) mem.push('SES DERNIÈRES QUESTIONS :\n' + lastQ.map((x) => '- ' + x).join('\n'));
    const rules = `Tu es le tuteur de ${C.student}, pour le module ${C.module}${C.prof ? ' du ' + C.prof : ''}. Il apprend souvent la notion pour la première fois.
Règles : réponds en français simple, en Markdown léger (**gras** pour les termes clés, tirets, étapes numérotées). Toute formule ou tout calcul s'écrit en LaTeX : $…$ dans la phrase, $$…$$ seul sur sa ligne pour une formule importante (ex. $\\hat y_i$, $$\\text{MSE}=\\frac{1}{n}\\sum_{i=1}^{n}(y_i-\\hat y_i)^2$$) ; jamais d'accents graves pour une formule, ils sont réservés au code et aux noms de fonctions. Un petit tableau Markdown est permis s'il clarifie (3 colonnes maximum, l'écran est étroit). ${style} Appuie-toi d'abord sur l'EXTRAIT ci-dessous et sur les conventions du prof ; si une source générale diffère du cours, signale l'écart et dis quelle version utiliser à l'examen (celle du prof). Pour un calcul, pose chaque étape et vérifie-la. S'il envoie une réponse ou une photo de brouillon, corrige étape par étape et nomme précisément l'erreur. Si tu n'es pas sûr, dis-le. S'il demande un mini-exercice, donne l'exercice sans la solution.
Utilise sa mémoire pour faire des liens avec ses confusions passées, sans la réciter.
Termine TOUJOURS par une dernière ligne séparée au format exact « MÉMO: … » qui résume en 15 mots maximum la difficulté révélée par sa question (ou « MÉMO: rien »). Cette ligne lui est cachée.
${C.conventions ? 'CONVENTIONS DU PROF : ' + C.conventions + '\n' : ''}MÉMOIRE DE L'ÉLÈVE :
${mem.join('\n\n') || '(rien pour l\'instant)'}
EXTRAIT (${c.label}) :
${c.text.slice(0, deep ? 9000 : 3500)}`;
    const recent = cur.msgs.slice(deep ? -9 : -5, -1).map((m) => ({ role: m.r === 'u' ? 'user' : 'assistant', content: m.t }));
    while (recent.length && recent[0].role !== 'user') recent.shift();
    const msgs = [...recent.filter((m) => m.content && m.content.trim()), { role: 'user', content: q }]; while (msgs.length > 1 && msgs[0].role !== 'user') msgs.shift(); msgs[0] = { role: 'user', content: rules + '\n\n---\nQuestion : ' + msgs[0].content };
    ctl = new AbortController();
    const opts = { modelTier: deep ? 'complex' : 'quick', cache: false, signal: ctl.signal, onText: ({ text }) => { out.innerHTML = md(visible(text)); dessinerMaths(out); $('#mztLog').scrollTop = 1e9; } };
    if (img) opts.images = [img];
    try {
      const r = await sample(msgs, opts);
      const mm = r.text.match(/(?:^|\n)\s*M[ÉE]MO\s*:\s*(.+)\s*$/i);
      cur.msgs.push({ r: 'a', t: visible(r.text) + (r.truncated ? '\n\n(Réponse coupée : pose une question plus ciblée.)' : ''), d: !!deep });
      if (mm && !/^\s*rien/i.test(mm[1])) { ST.memos.push({ date: today(), text: mm[1].trim().slice(0, 160) }); if (ST.memos.length > 30) ST.memos.shift(); saveMemos(); }
      await saveThread(cur);
    } catch (e) {
      const kept = e && e.text ? visible(e.text) : '';
      if (e && e.code === 'cancelled') { if (kept) cur.msgs.push({ r: 'a', t: kept + '\n(Arrêté.)' }); else cur.msgs.pop(); }
      else { cur.msgs.pop(); compacter(!!cur.msgs.length); out.textContent = (kept ? kept + '\n\n' : '') + (ERR[e && e.code] || 'Le tuteur n\'a pas pu répondre. Réessaie dans un instant.'); }
      if (!cur.msgs.length) ST.threads = ST.threads.filter((t) => t !== cur);
      saveLocal();
      if (!(e && e.code === 'cancelled')) { busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImgN').textContent = ''; return; }
    }
    busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImg').value = ''; $('#mztImgN').textContent = ''; renderLog();
  }

  // ---------- événements ----------
  $('#mztBtn').onclick = () => openPanel(null);
  $('#mztX').onclick = closePanel;
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#mztPan').hidden) closePanel(); });
  $('#mztTabH').onclick = () => view($('#mztHist').hidden ? 'hist' : 'chat');
  $('#mztTabM').onclick = () => view($('#mztMem').hidden ? 'mem' : 'chat');
  $('#mztQ').oninput = renderList;
  $('#mztList').onclick = (e) => { const id = e.target.dataset && e.target.dataset.cont; if (!id) return; cur = ST.threads.find((t) => t.id === id); view('chat'); $('#mztCtx').textContent = '· ' + cur.sec; renderLog(); };
  $('#mztMemL').onclick = (e) => { const i = e.target.dataset && e.target.dataset.memdel; if (i == null) return; ST.memos.splice(+i, 1); saveMemos(); renderMem(); };
  $('#mztChips').onclick = (e) => { const b = e.target.closest('[data-chip]'); if (!b) return; const t = $('#mztIn'); t.value = b.dataset.chip + (t.value ? ' : ' + t.value : ''); t.focus(); };
  $('#mztNew').onclick = () => { cur = null; renderLog(); };
  $('#mztStop').onclick = () => { if (ctl) ctl.abort(); };
  $('#mztImg').onchange = (e) => { img = e.target.files[0] || null; $('#mztImgN').textContent = img ? 'Photo : ' + img.name : ''; };
  $('#mztF').onsubmit = (e) => { e.preventDefault(); const v = $('#mztIn').value; $('#mztIn').value = ''; ask(v); };
  $('#mztIn').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#mztF').requestSubmit(); } });

  // ---------- capacités (facultatives) ----------
  const W = window.claude;
  if (W && W.use) {
    W.use('sample').then((s) => { sample = s; ready = true; note();
      if (s && s.limits) s.limits().then((l) => { if (l && l.images) { imgOK = true; $('#mztImgL').hidden = false; if (l.images.mediaTypes) $('#mztImg').accept = l.images.mediaTypes.join(','); } }).catch(() => {});
    }).catch(() => { ready = true; note(); });
    Promise.all([W.use('db'), W.use('user')]).then(async ([d, u]) => {
      if (!d || !u) return; const id = await u.id(); if (!id) return; db = d; base = 'data/users/' + id + '/mzt_' + C.id;
      try {
        const m = await db.doc(base).get(); if (m.exists) { const v = m.data() || {}; if (Array.isArray(v.memos)) ST.memos = JSON.parse(JSON.stringify(v.memos)); }
        const q = await db.collection(base + '/threads').get(); const remote = q.docs.map((x) => Object.assign({ id: x.id }, JSON.parse(JSON.stringify(x.data() || {}))));
        const map = {}; [...ST.threads, ...remote].forEach((t) => { if (!map[t.id] || (t.msgs || []).length > (map[t.id].msgs || []).length) map[t.id] = t; });
        ST.threads = Object.values(map).sort((a, b) => parseInt(a.id.slice(1), 36) - parseInt(b.id.slice(1), 36)); saveLocal();
      } catch (e) {}
    }).catch(() => {});
  } else { ready = true; note(); }

  window.MZT = { open: openPanel, close: closePanel };
})();

</script>

if(window.top===window&&location.protocol==="file:"){a.hidden=true;return}
a.href=p.indexOf("/decouvrir")===0||location.pathname.indexOf("/decouvrir")===0?"/decouvrir":"/app/modules";})();</script>
