<script>
const MODULE={"slug":"microbiologie","titre":"Microbiologie générale","cle":"microbiologie_scores","cleEtat":"microbiologie_scores_etat","format":"score10","intro":"<p>Ce module suit <strong>le polycopié de Microbiologie BCG 2021<\/strong> de la FST Béni Mellal, puis <strong>l&#39;examen du 2/9/2020 corrigé<\/strong> (vrai/faux).<\/p>\n<p><strong>Comment l&#39;utiliser<\/strong><\/p>\n<ol>\n<li>Lis un chapitre et retiens les tableaux : Gram + et Gram −, types respiratoires, transferts de gènes.<\/li>\n<li>Méfie-toi des mots « toujours », « toutes », « jamais » dans les vrai/faux.<\/li>\n<li>Fais le QCM du chapitre. <strong>8/10 = chapitre maîtrisé.<\/strong><\/li>\n<\/ol>\n<p><strong>À vérifier<\/strong> : le cours est rédigé par nous à partir du polycopié ; les comptes rendus de TP (photos) n&#39;ont pas été exploités.<\/p>\n","annexes":[],"cartes":null,"maths":false};
const CHAPS=[{"id":"cellule-bacterienne","t":"La cellule bactérienne","seance":"Structure de la bactérie · Paroi, Gram","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut se souvenir qu&#39;une bactérie est un procaryote : pas de noyau, ribosomes 70S.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Les ribosomes bactériens sont-ils les mêmes que ceux des eucaryotes ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Non : 70S chez les bactéries, 80S dans le cytoplasme des eucaryotes. C&#39;est la cible de plusieurs antibiotiques.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « la paroi décide de tout ».<\/strong> Coloration de Gram, sensibilité aux antibiotiques, toxines : tout dépend de la structure de la paroi.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Dire que les Gram + ont deux membranes. C&#39;est l&#39;inverse : les <strong>Gram −<\/strong> ont une membrane externe en plus de la membrane plasmique.<\/p>\n<\/aside><p>À la fin, tu sais décrire la paroi des Gram + et des Gram − et les structures facultatives.<\/p>\n<h2>Idée 1 · Le peptidoglycane<\/h2>\n<p>Polymère de chaînes de sucres aminés (N-acétylglucosamine et acide N-acétylmuramique) reliées par de courts peptides. Il contient donc de l&#39;<strong>azote<\/strong> et des <strong>acides aminés<\/strong>, mais pas de résidus de glucose libre. Les <strong>pénicillines<\/strong> bloquent sa synthèse.<\/p>\n<h2>Idée 2 · Gram positif et Gram négatif<\/h2>\n<figure class=\"grille\"><figcaption>Comparaison<\/figcaption><table><tr><th>,<\/th><th>Gram<\/th><th>+,<\/th><th>Gram<\/th><th>−<\/th><\/tr><tr><td class=\"h1\">Peptidoglycane,<\/td><td>épais,<\/td><td>mince<\/td><\/tr><tr><td class=\"h1\">Membrane<\/td><td>externe,<\/td><td>non,<\/td><td>oui<\/td><td>(avec<\/td><td>LPS)<\/td><\/tr><tr><td class=\"h1\">Acides<\/td><td>teichoïques,<\/td><td>oui,<\/td><td>non<\/td><\/tr><tr><td class=\"h1\">Couleur<\/td><td>après<\/td><td>Gram,<\/td><td>violet,<\/td><td>rose<\/td><\/tr><tr><td class=\"h1\">Endotoxine<\/td><td>(LPS),<\/td><td>non,<\/td><td>oui<\/td><\/tr><\/table><\/figure><svg viewBox=\"0 0 320 110\" role=\"img\" aria-label=\"Paroi Gram positif épaisse ; paroi Gram négatif mince avec membrane externe\" style=\"max-width:380px;width:100%\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M20 90h110M180 90h120\"/><rect x=\"20\" y=\"40\" width=\"110\" height=\"45\" fill=\"#D9824F\" fill-opacity=\".3\" stroke=\"#D9824F\"/><rect x=\"180\" y=\"72\" width=\"120\" height=\"12\" fill=\"#D9824F\" fill-opacity=\".3\" stroke=\"#D9824F\"/><path d=\"M180 55h120M180 61h120\"/><\/g>\n<g fill=\"currentColor\" font-size=\"10\"><text x=\"45\" y=\"30\">Gram +<\/text><text x=\"215\" y=\"45\">Gram −<\/text><text x=\"215\" y=\"105\">membrane plasmique<\/text><\/g>\n<\/svg><h2>Idée 3 · Structures facultatives<\/h2>\n<p>Capsule (protection contre la phagocytose), flagelles (mobilité : toutes les bactéries ne sont <strong>pas<\/strong> flagellées), pili (adhésion, conjugaison), spores (résistance), plasmides (gènes accessoires).<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Vrai ou faux<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>« Les LPS sont des constituants membranaires des bactéries à Gram + ».<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Faux : les LPS sont dans la membrane externe des Gram −.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>« L&#39;acide teichoïque est un constituant de la paroi des Gram + ».<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Vrai.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Les Gram − possèdent :<\/div><button class=\"opt\" data-o=\"0\">une membrane externe<\/button><button class=\"opt\" data-o=\"1\">un peptidoglycane épais<\/button><button class=\"opt\" data-o=\"2\">des acides teichoïques<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Après coloration de Gram, les Gram + sont :<\/div><button class=\"opt\" data-o=\"0\">violets<\/button><button class=\"opt\" data-o=\"1\">roses<\/button><button class=\"opt\" data-o=\"2\">incolores<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Le peptidoglycane contient :<\/div><button class=\"opt\" data-o=\"0\">des acides aminés<\/button><button class=\"opt\" data-o=\"1\">du glucose libre<\/button><button class=\"opt\" data-o=\"2\">aucun azote<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Les pénicillines agissent sur :<\/div><button class=\"opt\" data-o=\"0\">la synthèse du peptidoglycane<\/button><button class=\"opt\" data-o=\"1\">les ribosomes<\/button><button class=\"opt\" data-o=\"2\">l&#39;ADN<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Toutes les bactéries sont mobiles :<\/div><button class=\"opt\" data-o=\"0\">vrai<\/button><button class=\"opt\" data-o=\"1\">faux<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Les LPS sont :<\/div><button class=\"opt\" data-o=\"0\">des endotoxines immunogènes<\/button><button class=\"opt\" data-o=\"1\">des réserves<\/button><button class=\"opt\" data-o=\"2\">dans la paroi des Gram +<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">La capsule protège :<\/div><button class=\"opt\" data-o=\"0\">contre la phagocytose<\/button><button class=\"opt\" data-o=\"1\">contre la lumière<\/button><button class=\"opt\" data-o=\"2\">contre la division<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Les pili sexuels servent à :<\/div><button class=\"opt\" data-o=\"0\">la conjugaison<\/button><button class=\"opt\" data-o=\"1\">la photosynthèse<\/button><button class=\"opt\" data-o=\"2\">la sporulation<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Ribosomes bactériens :<\/div><button class=\"opt\" data-o=\"0\">70S<\/button><button class=\"opt\" data-o=\"1\">80S<\/button><button class=\"opt\" data-o=\"2\">60S<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Les plasmides portent :<\/div><button class=\"opt\" data-o=\"0\">des gènes accessoires<\/button><button class=\"opt\" data-o=\"1\">tout le génome essentiel<\/button><button class=\"opt\" data-o=\"2\">des protéines de paroi uniquement<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"cellule-bacterienne","rep":null,"tol":null},{"n":"cellule-bacterienne","rep":null,"tol":null},{"n":"cellule-bacterienne","rep":null,"tol":null}],"qcm":[{"n":"cellule-bacterienne","q":"Les Gram − possèdent :","o":["une membrane externe","un peptidoglycane épais","des acides teichoïques"],"a":0,"e":"Deux membranes."},{"n":"cellule-bacterienne","q":"Après coloration de Gram, les Gram + sont :","o":["violets","roses","incolores"],"a":0,"e":"Le violet reste piégé."},{"n":"cellule-bacterienne","q":"Le peptidoglycane contient :","o":["des acides aminés","du glucose libre","aucun azote"],"a":0,"e":"Peptides et sucres aminés."},{"n":"cellule-bacterienne","q":"Les pénicillines agissent sur :","o":["la synthèse du peptidoglycane","les ribosomes","l&#39;ADN"],"a":0,"e":"Paroi."},{"n":"cellule-bacterienne","q":"Toutes les bactéries sont mobiles :","o":["vrai","faux"],"a":1,"e":"Beaucoup n&#39;ont pas de flagelle."},{"n":"cellule-bacterienne","q":"Les LPS sont :","o":["des endotoxines immunogènes","des réserves","dans la paroi des Gram +"],"a":0,"e":"Gram −."},{"n":"cellule-bacterienne","q":"La capsule protège :","o":["contre la phagocytose","contre la lumière","contre la division"],"a":0,"e":"Facteur de virulence."},{"n":"cellule-bacterienne","q":"Les pili sexuels servent à :","o":["la conjugaison","la photosynthèse","la sporulation"],"a":0,"e":"Pont entre bactéries."},{"n":"cellule-bacterienne","q":"Ribosomes bactériens :","o":["70S","80S","60S"],"a":0,"e":"Procaryotes."},{"n":"cellule-bacterienne","q":"Les plasmides portent :","o":["des gènes accessoires","tout le génome essentiel","des protéines de paroi uniquement"],"a":0,"e":"Résistance aux antibiotiques, facteur F."}]},{"id":"nutrition-croissance","t":"Nutrition, croissance et milieux de culture","seance":"Physiologie bactérienne · Types trophiques, facteurs physiques","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir qu&#39;une bactérie se divise en deux (scissiparité).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Une bactérie se divise toutes les 20 min. Combien de bactéries après 1 h à partir d&#39;une seule ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 8<\/b><\/p><p>3 divisions : 2³ = 8.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « source d&#39;énergie + source de carbone ».<\/strong> Photo ou chimio (énergie), auto ou hétéro (carbone) : les deux mots se combinent.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Croire que toutes les bactéries pathogènes sont mésophiles, ou que toutes les bactéries sont pathogènes. Les deux affirmations sont <strong>fausses<\/strong> : l&#39;immense majorité des bactéries est inoffensive ou utile.<\/p>\n<\/aside><p>À la fin, tu sais classer une bactérie par son type trophique et lire une courbe de croissance.<\/p>\n<h2>Idée 1 · Types trophiques<\/h2>\n<figure class=\"grille\"><figcaption>Types trophiques<\/figcaption><table><tr><th>Type,<\/th><th>Énergie,<\/th><th>Carbone,<\/th><th>Exemple<\/th><\/tr><tr><td class=\"h1\">Photoautotrophe,<\/td><td>lumière,<\/td><td>CO₂,<\/td><td>cyanobactéries<\/td><\/tr><tr><td class=\"h1\">Photohétérotrophe,<\/td><td>lumière,<\/td><td>matière<\/td><td>organique,<\/td><td>bactéries<\/td><td>pourpres<\/td><td>non<\/td><td>sulfureuses<\/td><\/tr><tr><td class=\"h1\">Chimioautotrophe,<\/td><td>oxydation<\/td><td>de<\/td><td>minéraux,<\/td><td>CO₂,<\/td><td>bactéries<\/td><td>nitrifiantes<\/td><\/tr><tr><td class=\"h1\">Chimiohétérotrophe,<\/td><td>matière<\/td><td>organique,<\/td><td>matière<\/td><td>organique,<\/td><td>E.<\/td><td>coli,<\/td><td>pathogènes<\/td><\/tr><\/table><\/figure><h2>Idée 2 · La courbe de croissance<\/h2>\n<svg viewBox=\"0 0 320 130\" role=\"img\" aria-label=\"Courbe de croissance : latence, exponentielle, stationnaire, déclin\" style=\"max-width:380px;width:100%\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M30 10v110h280\"/><path d=\"M30 105h40C110 105 120 35 160 30h80c20 0 40 15 60 35\" stroke=\"#D9824F\"/><\/g>\n<g fill=\"currentColor\" font-size=\"10\"><text x=\"32\" y=\"98\">latence<\/text><text x=\"92\" y=\"70\">exponentielle<\/text><text x=\"170\" y=\"22\">stationnaire<\/text><text x=\"260\" y=\"50\">déclin<\/text><\/g>\n<\/svg><h2>Idée 3 · Facteurs physico-chimiques<\/h2>\n<ul>\n<li><strong>Température<\/strong> : psychrophiles, mésophiles (20-45 °C, la plupart des pathogènes), thermophiles.<\/li>\n<li><strong>Oxygène<\/strong> : aérobies stricts, anaérobies stricts, aéro-anaérobies facultatifs (E. coli), microaérophiles.<\/li>\n<li><strong>pH<\/strong> : les bactéries modifient le pH de leur milieu (fermentations acides) ; leur pH intracellulaire reste proche de la neutralité, différent du pH extérieur.<\/li>\n<li><strong>Activité de l&#39;eau (aw)<\/strong> : elle <strong>diminue<\/strong> quand la pression osmotique augmente (sel, sucre) : c&#39;est pourquoi on conserve avec du sel.<\/li>\n<\/ul>\n<p><strong>Milieux de culture<\/strong> : synthétiques (composition exacte connue) ou complexes (bouillon nutritif, extraits) ; ils doivent être stérilisés avant usage (sauf cas particuliers).<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Vrai ou faux<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>« L&#39;activité de l&#39;eau est proportionnelle à la pression osmotique ».<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Faux : elles varient en sens inverse.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>« Le bouillon nutritif est un milieu complexe ».<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Vrai : sa composition exacte n&#39;est pas connue (extraits de viande, peptones).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">E. coli est :<\/div><button class=\"opt\" data-o=\"0\">chimiohétérotrophe<\/button><button class=\"opt\" data-o=\"1\">photoautotrophe<\/button><button class=\"opt\" data-o=\"2\">chimioautotrophe<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Les cyanobactéries sont :<\/div><button class=\"opt\" data-o=\"0\">photoautotrophes<\/button><button class=\"opt\" data-o=\"1\">chimiohétérotrophes<\/button><button class=\"opt\" data-o=\"2\">parasites stricts<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Toutes les bactéries sont pathogènes :<\/div><button class=\"opt\" data-o=\"0\">vrai<\/button><button class=\"opt\" data-o=\"1\">faux<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">La phase de latence correspond à :<\/div><button class=\"opt\" data-o=\"0\">l&#39;adaptation au milieu<\/button><button class=\"opt\" data-o=\"1\">la mort des bactéries<\/button><button class=\"opt\" data-o=\"2\">la division maximale<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Ajouter du sel à un aliment :<\/div><button class=\"opt\" data-o=\"0\">diminue l&#39;activité de l&#39;eau<\/button><button class=\"opt\" data-o=\"1\">augmente l&#39;activité de l&#39;eau<\/button><button class=\"opt\" data-o=\"2\">n&#39;a aucun effet<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Un milieu synthétique a :<\/div><button class=\"opt\" data-o=\"0\">une composition exactement connue<\/button><button class=\"opt\" data-o=\"1\">des extraits de viande<\/button><button class=\"opt\" data-o=\"2\">une composition inconnue<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Les bactéries peuvent modifier le pH de leur milieu :<\/div><button class=\"opt\" data-o=\"0\">vrai<\/button><button class=\"opt\" data-o=\"1\">faux<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Les mésophiles poussent idéalement vers :<\/div><button class=\"opt\" data-o=\"0\">20 à 45 °C<\/button><button class=\"opt\" data-o=\"1\">80 °C<\/button><button class=\"opt\" data-o=\"2\">0 °C<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Une bactérie microaérophile préfère :<\/div><button class=\"opt\" data-o=\"0\">une faible teneur en O₂<\/button><button class=\"opt\" data-o=\"1\">l&#39;absence totale d&#39;O₂<\/button><button class=\"opt\" data-o=\"2\">de l&#39;O₂ pur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Les nitrifiantes sont :<\/div><button class=\"opt\" data-o=\"0\">chimioautotrophes<\/button><button class=\"opt\" data-o=\"1\">photohétérotrophes<\/button><button class=\"opt\" data-o=\"2\">chimiohétérotrophes<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"nutrition-croissance","rep":["8"],"tol":null},{"n":"nutrition-croissance","rep":null,"tol":null},{"n":"nutrition-croissance","rep":null,"tol":null}],"qcm":[{"n":"nutrition-croissance","q":"E. coli est :","o":["chimiohétérotrophe","photoautotrophe","chimioautotrophe"],"a":0,"e":"Matière organique."},{"n":"nutrition-croissance","q":"Les cyanobactéries sont :","o":["photoautotrophes","chimiohétérotrophes","parasites stricts"],"a":0,"e":"Photosynthèse oxygénique."},{"n":"nutrition-croissance","q":"Toutes les bactéries sont pathogènes :","o":["vrai","faux"],"a":1,"e":"Microbiote, environnement."},{"n":"nutrition-croissance","q":"La phase de latence correspond à :","o":["l&#39;adaptation au milieu","la mort des bactéries","la division maximale"],"a":0,"e":"Synthèse d&#39;enzymes."},{"n":"nutrition-croissance","q":"Ajouter du sel à un aliment :","o":["diminue l&#39;activité de l&#39;eau","augmente l&#39;activité de l&#39;eau","n&#39;a aucun effet"],"a":0,"e":"Conservation."},{"n":"nutrition-croissance","q":"Un milieu synthétique a :","o":["une composition exactement connue","des extraits de viande","une composition inconnue"],"a":0,"e":"Défini."},{"n":"nutrition-croissance","q":"Les bactéries peuvent modifier le pH de leur milieu :","o":["vrai","faux"],"a":0,"e":"Fermentations."},{"n":"nutrition-croissance","q":"Les mésophiles poussent idéalement vers :","o":["20 à 45 °C","80 °C","0 °C"],"a":0,"e":"Température du corps humain incluse."},{"n":"nutrition-croissance","q":"Une bactérie microaérophile préfère :","o":["une faible teneur en O₂","l&#39;absence totale d&#39;O₂","de l&#39;O₂ pur"],"a":0,"e":"Campylobacter."},{"n":"nutrition-croissance","q":"Les nitrifiantes sont :","o":["chimioautotrophes","photohétérotrophes","chimiohétérotrophes"],"a":0,"e":"Oxydation de NH₄⁺."}]},{"id":"metabolisme","t":"Métabolisme énergétique bactérien","seance":"Glycolyse, voie des pentoses, respiration, fermentation, O₂","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir que le glucose a 6 carbones et le pyruvate 3.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Combien de pyruvates donne un glucose par la glycolyse ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 2<\/b><\/p><p>Deux (6 C → 2 × 3 C).<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « qui accepte les électrons à la fin ? ».<\/strong> O₂ : respiration aérobie. Un autre minéral (NO₃⁻, SO₄²⁻) : respiration anaérobie. Une molécule organique : fermentation.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Classer comme aérobie stricte une bactérie sans catalase ni superoxyde dismutase. Sans ces enzymes, l&#39;O₂ produit des espèces toxiques qu&#39;elle ne peut pas détruire : c&#39;est une <strong>anaérobie stricte<\/strong>.<\/p>\n<\/aside><p>À la fin, tu sais distinguer respiration et fermentation et relier les enzymes au type respiratoire.<\/p>\n<h2>Idée 1 · Les voies cataboliques<\/h2>\n<figure class=\"grille\"><figcaption>Voies<\/figcaption><table><tr><th>Voie,<\/th><th>Bilan<\/th><th>clé<\/th><\/tr><tr><td class=\"h1\">Glycolyse,<\/td><td>glucose<\/td><td>→<\/td><td>2<\/td><td>pyruvates<\/td><td>(3<\/td><td>C)<\/td><td>;<\/td><td>consomme<\/td><td>2<\/td><td>ATP<\/td><td>puis<\/td><td>en<\/td><td>produit<\/td><td>4<\/td><td>(bilan<\/td><td>net<\/td><td>2<\/td><td>ATP)<\/td><\/tr><tr><td class=\"h1\">Voie<\/td><td>des<\/td><td>pentoses,<\/td><td>produit<\/td><td>NADPH<\/td><td>et<\/td><td>pentoses<\/td><td>;<\/td><td>à<\/td><td>la<\/td><td>fois<\/td><td>anabolique<\/td><td>et<\/td><td>catabolique<\/td><td>;<\/td><td>part<\/td><td>du<\/td><td>glucose-6-phosphate<\/td><td>(et<\/td><td>d'autres<\/td><td>oses)<\/td><\/tr><tr><td class=\"h1\">Cycle<\/td><td>de<\/td><td>Krebs,<\/td><td>oxyde<\/td><td>l'acétyl-CoA,<\/td><td>produit<\/td><td>NADH<\/td><td>et<\/td><td>FADH₂<\/td><\/tr><\/table><\/figure><h2>Idée 2 · Respiration et fermentation<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Classer un métabolisme<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · 1. Respiration aérobie : glycolyse + Krebs + chaîne respiratoire, O₂ accepteur final.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · 2. Respiration anaérobie : chaîne respiratoire avec un autre accepteur (nitrate…). E. coli en est capable.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · 3. Fermentation : pas de chaîne respiratoire ; le pyruvate (ou dérivé) accepte les électrons ; peu d&#39;ATP.<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Idée 3 · L&#39;oxygène et ses dangers<\/h2>\n<p>L&#39;O₂ produit des espèces toxiques (superoxyde, H₂O₂). La <strong>superoxyde dismutase<\/strong> et la <strong>catalase<\/strong> les détruisent.<\/p>\n<figure class=\"grille\"><figcaption>Enzymes et type respiratoire<\/figcaption><table><tr><th>Type,<\/th><th>SOD,<\/th><th>Catalase<\/th><\/tr><tr><td class=\"h1\">Aérobie<\/td><td>strict,<\/td><td>oui,<\/td><td>oui<\/td><\/tr><tr><td class=\"h1\">Aéro-anaérobie<\/td><td>facultatif,<\/td><td>oui,<\/td><td>oui<\/td><td>(le<\/td><td>plus<\/td><td>souvent)<\/td><\/tr><tr><td class=\"h1\">Anaérobie<\/td><td>strict,<\/td><td>non,<\/td><td>non<\/td><\/tr><\/table><\/figure><p>Les autotrophes fixent le CO₂ par <strong>carboxylation<\/strong> du ribulose-1,5-bisphosphate (cycle de Calvin), pas par décarboxylation.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Vrai ou faux<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>« Les bactéries anaérobies possèdent la catalase ».<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Faux pour les anaérobies stricts.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>« La glycolyse consomme et produit de l&#39;ATP ».<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Vrai : 2 consommés, 4 produits.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">L&#39;acide pyruvique a :<\/div><button class=\"opt\" data-o=\"0\">3 carbones<\/button><button class=\"opt\" data-o=\"1\">4 carbones<\/button><button class=\"opt\" data-o=\"2\">6 carbones<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">L&#39;accepteur final de la respiration aérobie :<\/div><button class=\"opt\" data-o=\"0\">O₂<\/button><button class=\"opt\" data-o=\"1\">le pyruvate<\/button><button class=\"opt\" data-o=\"2\">le nitrate<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">E. coli peut faire une respiration anaérobie :<\/div><button class=\"opt\" data-o=\"0\">vrai<\/button><button class=\"opt\" data-o=\"1\">faux<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">La voie des pentoses est :<\/div><button class=\"opt\" data-o=\"0\">anabolique et catabolique<\/button><button class=\"opt\" data-o=\"1\">uniquement anabolique<\/button><button class=\"opt\" data-o=\"2\">uniquement catabolique<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Une bactérie sans SOD ni catalase est :<\/div><button class=\"opt\" data-o=\"0\">anaérobie stricte<\/button><button class=\"opt\" data-o=\"1\">aérobie stricte<\/button><button class=\"opt\" data-o=\"2\">photosynthétique<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Bilan net en ATP de la glycolyse :<\/div><button class=\"opt\" data-o=\"0\">2<\/button><button class=\"opt\" data-o=\"1\">4<\/button><button class=\"opt\" data-o=\"2\">38<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">La fermentation produit :<\/div><button class=\"opt\" data-o=\"0\">peu d&#39;ATP<\/button><button class=\"opt\" data-o=\"1\">plus d&#39;ATP que la respiration<\/button><button class=\"opt\" data-o=\"2\">aucun produit<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Le CO₂ est fixé par :<\/div><button class=\"opt\" data-o=\"0\">carboxylation du ribulose bisphosphate<\/button><button class=\"opt\" data-o=\"1\">décarboxylation du ribulose<\/button><button class=\"opt\" data-o=\"2\">la glycolyse<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">La catalase détruit :<\/div><button class=\"opt\" data-o=\"0\">H₂O₂<\/button><button class=\"opt\" data-o=\"1\">le glucose<\/button><button class=\"opt\" data-o=\"2\">l&#39;ATP<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Oxygéner l&#39;eau élimine les bactéries aérobies :<\/div><button class=\"opt\" data-o=\"0\">vrai<\/button><button class=\"opt\" data-o=\"1\">faux<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"metabolisme","rep":["2"],"tol":null},{"n":"metabolisme","rep":null,"tol":null},{"n":"metabolisme","rep":null,"tol":null}],"qcm":[{"n":"metabolisme","q":"L&#39;acide pyruvique a :","o":["3 carbones","4 carbones","6 carbones"],"a":0,"e":"Moitié de glucose."},{"n":"metabolisme","q":"L&#39;accepteur final de la respiration aérobie :","o":["O₂","le pyruvate","le nitrate"],"a":0,"e":"Avec cycle de Krebs."},{"n":"metabolisme","q":"E. coli peut faire une respiration anaérobie :","o":["vrai","faux"],"a":0,"e":"Nitrate comme accepteur."},{"n":"metabolisme","q":"La voie des pentoses est :","o":["anabolique et catabolique","uniquement anabolique","uniquement catabolique"],"a":0,"e":"NADPH + oses."},{"n":"metabolisme","q":"Une bactérie sans SOD ni catalase est :","o":["anaérobie stricte","aérobie stricte","photosynthétique"],"a":0,"e":"Ne supporte pas l&#39;O₂."},{"n":"metabolisme","q":"Bilan net en ATP de la glycolyse :","o":["2","4","38"],"a":0,"e":"4 produits − 2 consommés."},{"n":"metabolisme","q":"La fermentation produit :","o":["peu d&#39;ATP","plus d&#39;ATP que la respiration","aucun produit"],"a":0,"e":"Pas de chaîne respiratoire."},{"n":"metabolisme","q":"Le CO₂ est fixé par :","o":["carboxylation du ribulose bisphosphate","décarboxylation du ribulose","la glycolyse"],"a":0,"e":"Rubisco."},{"n":"metabolisme","q":"La catalase détruit :","o":["H₂O₂","le glucose","l&#39;ATP"],"a":0,"e":"Eau oxygénée."},{"n":"metabolisme","q":"Oxygéner l&#39;eau élimine les bactéries aérobies :","o":["vrai","faux"],"a":1,"e":"Elle élimine plutôt les anaérobies stricts."}]},{"id":"genetique-bacterienne","t":"Génétique bactérienne","seance":"Transformation, conjugaison, transduction","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir qu&#39;une bactérie a un chromosome circulaire et souvent des plasmides.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Un plasmide est-il indispensable à la survie de la bactérie ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Non : il porte des gènes accessoires (résistance, facteur F).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « trois façons de recevoir de l&#39;ADN ».<\/strong> Le ramasser (transformation), le recevoir par un pont (conjugaison), ou par un virus (transduction).<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Mélanger les trois. La transduction n&#39;utilise <strong>ni pont ni ADN libre<\/strong> : c&#39;est un <strong>bactériophage<\/strong> qui transporte l&#39;ADN.<\/p>\n<\/aside><p>À la fin, tu sais reconnaître chaque mode de transfert et les souches F⁺, F⁻ et Hfr.<\/p>\n<h2>Idée 1 · Les trois modes de transfert<\/h2>\n<figure class=\"grille\"><figcaption>Transferts horizontaux<\/figcaption><table><tr><th>Mode,<\/th><th>Vecteur,<\/th><th>Contact<\/th><th>entre<\/th><th>bactéries<\/th><th>?<\/th><\/tr><tr><td class=\"h1\">Transformation,<\/td><td>ADN<\/td><td>libre<\/td><td>du<\/td><td>milieu,<\/td><td>non<\/td><\/tr><tr><td class=\"h1\">Conjugaison,<\/td><td>pilus<\/td><td>sexuel<\/td><td>(pont),<\/td><td>oui<\/td><\/tr><tr><td class=\"h1\">Transduction,<\/td><td>bactériophage,<\/td><td>non<\/td><\/tr><\/table><\/figure><h2>Idée 2 · Conjugaison et facteur F<\/h2>\n<svg viewBox=\"0 0 320 90\" role=\"img\" aria-label=\"Conjugaison : bactérie F+ reliée par un pilus à une bactérie F-\" style=\"max-width:360px;width:100%\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"20\" y=\"25\" width=\"100\" height=\"40\" rx=\"20\"/><rect x=\"200\" y=\"25\" width=\"100\" height=\"40\" rx=\"20\"/><path d=\"M120 45h80\" stroke=\"#D9824F\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"45\" r=\"8\" stroke=\"#D9824F\"/><\/g>\n<g fill=\"currentColor\" font-size=\"10\"><text x=\"55\" y=\"80\">F⁺<\/text><text x=\"240\" y=\"80\">F⁻<\/text><text x=\"135\" y=\"38\">pilus<\/text><\/g>\n<\/svg><figure class=\"grille\"><figcaption>Souches<\/figcaption><table><tr><th>Souche,<\/th><th>Facteur<\/th><th>F,<\/th><th>Transfert<\/th><\/tr><tr><td class=\"h1\">F⁺,<\/td><td>plasmide<\/td><td>F<\/td><td>libre,<\/td><td>transmet<\/td><td>F<\/td><td>(le<\/td><td>receveur<\/td><td>devient<\/td><td>F⁺)<\/td><\/tr><tr><td class=\"h1\">F⁻,<\/td><td>absent,<\/td><td>receveur<\/td><\/tr><tr><td class=\"h1\">Hfr,<\/td><td>F<\/td><td>intégré<\/td><td>au<\/td><td>chromosome,<\/td><td>transmet<\/td><td>des<\/td><td>gènes<\/td><td>chromosomiques<\/td><td>à<\/td><td>haute<\/td><td>fréquence<\/td><\/tr><\/table><\/figure><h2>Idée 3 · La transduction<\/h2>\n<p>Un phage, en s&#39;assemblant, emporte par erreur un morceau d&#39;ADN bactérien et l&#39;injecte dans une autre bactérie. Généralisée (n&#39;importe quel gène, phage lytique) ou spécialisée (gènes voisins du site d&#39;intégration d&#39;un prophage). Une bactérie qui porte un prophage est dite <strong>lysogène<\/strong>.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Vrai ou faux<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>« Une bactérie contenant le facteur F intégré à son chromosome est une souche Hfr ».<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Vrai.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>« La transduction est réalisée par un pont de conjugaison et de l&#39;ADN libre ».<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Faux : par un bactériophage.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">La transduction utilise :<\/div><button class=\"opt\" data-o=\"0\">un bactériophage<\/button><button class=\"opt\" data-o=\"1\">un pilus<\/button><button class=\"opt\" data-o=\"2\">de l&#39;ADN libre<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Une souche Hfr a le facteur F :<\/div><button class=\"opt\" data-o=\"0\">intégré au chromosome<\/button><button class=\"opt\" data-o=\"1\">libre<\/button><button class=\"opt\" data-o=\"2\">absent<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">La conjugaison nécessite :<\/div><button class=\"opt\" data-o=\"0\">un contact entre bactéries<\/button><button class=\"opt\" data-o=\"1\">un virus<\/button><button class=\"opt\" data-o=\"2\">de l&#39;ADN mort<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Après conjugaison F⁺ × F⁻, le receveur devient :<\/div><button class=\"opt\" data-o=\"0\">F⁺<\/button><button class=\"opt\" data-o=\"1\">Hfr<\/button><button class=\"opt\" data-o=\"2\">lysogène<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Griffith a découvert :<\/div><button class=\"opt\" data-o=\"0\">la transformation<\/button><button class=\"opt\" data-o=\"1\">la transduction<\/button><button class=\"opt\" data-o=\"2\">la conjugaison<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Une bactérie lysogène porte :<\/div><button class=\"opt\" data-o=\"0\">un prophage<\/button><button class=\"opt\" data-o=\"1\">un plasmide F<\/button><button class=\"opt\" data-o=\"2\">une capsule<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Le facteur F est :<\/div><button class=\"opt\" data-o=\"0\">un plasmide<\/button><button class=\"opt\" data-o=\"1\">un ribosome<\/button><button class=\"opt\" data-o=\"2\">une protéine de paroi<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Les transferts horizontaux favorisent la diffusion :<\/div><button class=\"opt\" data-o=\"0\">des résistances aux antibiotiques<\/button><button class=\"opt\" data-o=\"1\">des ribosomes<\/button><button class=\"opt\" data-o=\"2\">des spores<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Transduction spécialisée :<\/div><button class=\"opt\" data-o=\"0\">gènes voisins du site d&#39;intégration<\/button><button class=\"opt\" data-o=\"1\">n&#39;importe quel gène<\/button><button class=\"opt\" data-o=\"2\">aucun gène<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">La transformation nécessite :<\/div><button class=\"opt\" data-o=\"0\">une bactérie compétente<\/button><button class=\"opt\" data-o=\"1\">un pilus<\/button><button class=\"opt\" data-o=\"2\">un phage<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"genetique-bacterienne","rep":null,"tol":null},{"n":"genetique-bacterienne","rep":null,"tol":null},{"n":"genetique-bacterienne","rep":null,"tol":null}],"qcm":[{"n":"genetique-bacterienne","q":"La transduction utilise :","o":["un bactériophage","un pilus","de l&#39;ADN libre"],"a":0,"e":"Virus de bactérie."},{"n":"genetique-bacterienne","q":"Une souche Hfr a le facteur F :","o":["intégré au chromosome","libre","absent"],"a":0,"e":"Haute fréquence de recombinaison."},{"n":"genetique-bacterienne","q":"La conjugaison nécessite :","o":["un contact entre bactéries","un virus","de l&#39;ADN mort"],"a":0,"e":"Pilus."},{"n":"genetique-bacterienne","q":"Après conjugaison F⁺ × F⁻, le receveur devient :","o":["F⁺","Hfr","lysogène"],"a":0,"e":"Il reçoit le plasmide."},{"n":"genetique-bacterienne","q":"Griffith a découvert :","o":["la transformation","la transduction","la conjugaison"],"a":0,"e":"Pneumocoques."},{"n":"genetique-bacterienne","q":"Une bactérie lysogène porte :","o":["un prophage","un plasmide F","une capsule"],"a":0,"e":"Génome viral intégré."},{"n":"genetique-bacterienne","q":"Le facteur F est :","o":["un plasmide","un ribosome","une protéine de paroi"],"a":0,"e":"Fertilité."},{"n":"genetique-bacterienne","q":"Les transferts horizontaux favorisent la diffusion :","o":["des résistances aux antibiotiques","des ribosomes","des spores"],"a":0,"e":"Plasmides R."},{"n":"genetique-bacterienne","q":"Transduction spécialisée :","o":["gènes voisins du site d&#39;intégration","n&#39;importe quel gène","aucun gène"],"a":0,"e":"Prophage."},{"n":"genetique-bacterienne","q":"La transformation nécessite :","o":["une bactérie compétente","un pilus","un phage"],"a":0,"e":"Capable d&#39;absorber l&#39;ADN."}]},{"id":"lutte-antimicrobienne","t":"Lutte contre les microorganismes","seance":"Stérilisation, désinfection, antibiotiques","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut distinguer « tuer » (-cide) et « empêcher de se multiplier » (-statique).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Un agent bactériostatique tue-t-il les bactéries ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Non : il bloque leur multiplication. Un bactéricide les tue.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « objectif zéro ou objectif moins ».<\/strong> Stériliser = zéro microorganisme vivant (spores comprises). Désinfecter = réduire les germes sur une surface inerte.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Dire que la désinfection est aussi efficace que la stérilisation. <strong>Faux<\/strong> : la désinfection ne détruit pas forcément les spores.<\/p>\n<\/aside><p>À la fin, tu sais choisir une méthode et expliquer le mode d&#39;action des grands antibiotiques.<\/p>\n<h2>Idée 1 · Les méthodes physiques et chimiques<\/h2>\n<figure class=\"grille\"><figcaption>Méthodes<\/figcaption><table><tr><th>Méthode,<\/th><th>Principe,<\/th><th>Usage<\/th><\/tr><tr><td class=\"h1\">Autoclave,<\/td><td>chaleur<\/td><td>humide<\/td><td>121<\/td><td>°C<\/td><td>15-20<\/td><td>min,<\/td><td>milieux<\/td><td>de<\/td><td>culture,<\/td><td>instruments<\/td><\/tr><tr><td class=\"h1\">Four<\/td><td>Pasteur,<\/td><td>chaleur<\/td><td>sèche<\/td><td>170-180<\/td><td>°C,<\/td><td>verrerie<\/td><\/tr><tr><td class=\"h1\">Filtration,<\/td><td>pores<\/td><td>de<\/td><td>0,22<\/td><td>µm,<\/td><td>liquides<\/td><td>sensibles<\/td><td>à<\/td><td>la<\/td><td>chaleur<\/td><\/tr><tr><td class=\"h1\">UV,<\/td><td>lésions<\/td><td>de<\/td><td>l'ADN,<\/td><td>surfaces,<\/td><td>air<\/td><\/tr><tr><td class=\"h1\">Antiseptiques,<\/td><td>chimique<\/td><td>sur<\/td><td>tissus<\/td><td>vivants,<\/td><td>peau<\/td><\/tr><tr><td class=\"h1\">Désinfectants,<\/td><td>chimique<\/td><td>sur<\/td><td>surfaces<\/td><td>inertes,<\/td><td>sols,<\/td><td>paillasses<\/td><\/tr><\/table><\/figure><h2>Idée 2 · Les antibiotiques<\/h2>\n<figure class=\"grille\"><figcaption>Cibles<\/figcaption><table><tr><th>Cible,<\/th><th>Famille,<\/th><th>Exemple<\/th><\/tr><tr><td class=\"h1\">Paroi<\/td><td>(peptidoglycane),<\/td><td>β-lactamines,<\/td><td>pénicilline<\/td><\/tr><tr><td class=\"h1\">Ribosome<\/td><td>70S,<\/td><td>aminosides,<\/td><td>tétracyclines,<\/td><td>streptomycine<\/td><\/tr><tr><td class=\"h1\">ADN,<\/td><td>quinolones,<\/td><td>ciprofloxacine<\/td><\/tr><tr><td class=\"h1\">Membrane,<\/td><td>polymyxines,<\/td><td>colistine<\/td><\/tr><\/table><\/figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Les antibiotiques visent des structures propres aux bactéries (peptidoglycane, ribosomes 70S) : c&#39;est ce qui les rend peu toxiques pour nos cellules.<\/p>\n<\/aside><h2>Idée 3 · La résistance<\/h2>\n<p>Mutation ou acquisition de gènes (plasmides R) : enzyme qui détruit l&#39;antibiotique (β-lactamase), modification de la cible, pompe d&#39;efflux. Le mauvais usage des antibiotiques sélectionne les résistants.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Application<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Comment stériliser un milieu contenant une vitamine détruite par la chaleur ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Par filtration sur membrane de 0,22 µm.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>« Le peptidoglycane rend les bactéries insensibles aux pénicillines » ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Faux : c&#39;est justement la cible des pénicillines.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">La désinfection est aussi efficace que la stérilisation :<\/div><button class=\"opt\" data-o=\"0\">vrai<\/button><button class=\"opt\" data-o=\"1\">faux<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">L&#39;autoclave fonctionne à :<\/div><button class=\"opt\" data-o=\"0\">121 °C en chaleur humide<\/button><button class=\"opt\" data-o=\"1\">60 °C<\/button><button class=\"opt\" data-o=\"2\">300 °C sec<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Un antiseptique s&#39;applique sur :<\/div><button class=\"opt\" data-o=\"0\">des tissus vivants<\/button><button class=\"opt\" data-o=\"1\">des sols<\/button><button class=\"opt\" data-o=\"2\">des milieux de culture<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Les tétracyclines ciblent :<\/div><button class=\"opt\" data-o=\"0\">le ribosome<\/button><button class=\"opt\" data-o=\"1\">la paroi<\/button><button class=\"opt\" data-o=\"2\">la membrane<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">La filtration stérilisante utilise des pores de :<\/div><button class=\"opt\" data-o=\"0\">0,22 µm<\/button><button class=\"opt\" data-o=\"1\">2 mm<\/button><button class=\"opt\" data-o=\"2\">10 µm<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Une β-lactamase :<\/div><button class=\"opt\" data-o=\"0\">détruit les pénicillines<\/button><button class=\"opt\" data-o=\"1\">synthétise la paroi<\/button><button class=\"opt\" data-o=\"2\">est un antibiotique<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Bactériostatique signifie :<\/div><button class=\"opt\" data-o=\"0\">qui bloque la multiplication<\/button><button class=\"opt\" data-o=\"1\">qui tue<\/button><button class=\"opt\" data-o=\"2\">qui stimule<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Les milieux de culture doivent être stérilisés avant usage :<\/div><button class=\"opt\" data-o=\"0\">en général oui<\/button><button class=\"opt\" data-o=\"1\">jamais<\/button><button class=\"opt\" data-o=\"2\">seulement les milieux solides<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Les UV agissent sur :<\/div><button class=\"opt\" data-o=\"0\">l&#39;ADN<\/button><button class=\"opt\" data-o=\"1\">la paroi<\/button><button class=\"opt\" data-o=\"2\">la capsule seulement<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Les quinolones ciblent :<\/div><button class=\"opt\" data-o=\"0\">la réplication de l&#39;ADN<\/button><button class=\"opt\" data-o=\"1\">le peptidoglycane<\/button><button class=\"opt\" data-o=\"2\">les ribosomes<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"lutte-antimicrobienne","rep":null,"tol":null},{"n":"lutte-antimicrobienne","rep":null,"tol":null},{"n":"lutte-antimicrobienne","rep":null,"tol":null}],"qcm":[{"n":"lutte-antimicrobienne","q":"La désinfection est aussi efficace que la stérilisation :","o":["vrai","faux"],"a":1,"e":"Les spores résistent."},{"n":"lutte-antimicrobienne","q":"L&#39;autoclave fonctionne à :","o":["121 °C en chaleur humide","60 °C","300 °C sec"],"a":0,"e":"Vapeur sous pression."},{"n":"lutte-antimicrobienne","q":"Un antiseptique s&#39;applique sur :","o":["des tissus vivants","des sols","des milieux de culture"],"a":0,"e":"Peau, plaies."},{"n":"lutte-antimicrobienne","q":"Les tétracyclines ciblent :","o":["le ribosome","la paroi","la membrane"],"a":0,"e":"Synthèse protéique."},{"n":"lutte-antimicrobienne","q":"La filtration stérilisante utilise des pores de :","o":["0,22 µm","2 mm","10 µm"],"a":0,"e":"Retient les bactéries."},{"n":"lutte-antimicrobienne","q":"Une β-lactamase :","o":["détruit les pénicillines","synthétise la paroi","est un antibiotique"],"a":0,"e":"Résistance."},{"n":"lutte-antimicrobienne","q":"Bactériostatique signifie :","o":["qui bloque la multiplication","qui tue","qui stimule"],"a":0,"e":"Statique."},{"n":"lutte-antimicrobienne","q":"Les milieux de culture doivent être stérilisés avant usage :","o":["en général oui","jamais","seulement les milieux solides"],"a":0,"e":"Éviter les contaminants."},{"n":"lutte-antimicrobienne","q":"Les UV agissent sur :","o":["l&#39;ADN","la paroi","la capsule seulement"],"a":0,"e":"Dimères de thymine."},{"n":"lutte-antimicrobienne","q":"Les quinolones ciblent :","o":["la réplication de l&#39;ADN","le peptidoglycane","les ribosomes"],"a":0,"e":"ADN gyrase."}]},{"id":"annale-2020","t":"Annale corrigée · examen du 2/9/2020","seance":"Examen de Microbiologie générale BCG S4 (1 h 15, vrai/faux)","imp":5,"payant":true,"html":"<p>Le vrai sujet : un long vrai/faux. Voici les 34 premières affirmations corrigées, avec la justification en quelques mots.<\/p>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Repère les mots absolus (« toujours », « toutes », « ne… que ») : ils rendent l&#39;affirmation fausse dans la plupart des cas.<\/p>\n<\/aside><section class=\"exo\"><h3>Affirmations 1 à 12<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>1 à 6<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>1 <strong>F<\/strong> (anaérobies stricts sans catalase). 2 <strong>F<\/strong> (la voie des pentoses peut partir d&#39;autres oses que le glucose). 3 <strong>F<\/strong> (3 carbones). 4 <strong>V<\/strong> (sucres aminés, pas de résidus de glucose). 5 <strong>F<\/strong> (le pH intérieur est régulé). 6 <strong>F<\/strong> (il contient azote et acides aminés).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>7 à 12<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>7 <strong>F<\/strong>. 8 <strong>V<\/strong> (sans SOD ni catalase : anaérobie stricte). 9 <strong>V<\/strong> (bactériophage). 10 <strong>F<\/strong>. 11 <strong>V<\/strong> (Hfr). 12 <strong>F<\/strong>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Affirmations 13 à 24<\/h3><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>13 à 18<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>13 <strong>F<\/strong> (pas les anaérobies stricts). 14 <strong>F<\/strong> (l&#39;oxygénation élimine plutôt les anaérobies). 15 <strong>F<\/strong> (fixation par carboxylation du ribulose-1,5-bisphosphate). 16 <strong>V<\/strong>. 17 <strong>F<\/strong> (sens inverse). 18 <strong>V<\/strong>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>19 à 24<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>19 <strong>F<\/strong> (il existe des pathogènes psychrotrophes, comme Listeria). 20 <strong>F<\/strong>. 21 <strong>F<\/strong> (c&#39;est la cible des pénicillines). 22 <strong>F<\/strong> (ce sont les Gram −). 23 <strong>V<\/strong> (2 ATP consommés, 4 produits). 24 <strong>V<\/strong> en règle générale (on accepte « V » ; quelques milieux sélectifs ne le sont pas).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Affirmations 25 à 34<\/h3><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>25 à 29<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>25 <strong>F<\/strong>. 26 <strong>F<\/strong> (LPS des Gram −). 27 <strong>V<\/strong>. 28 <strong>F<\/strong> (70S contre 80S). 29 <strong>V<\/strong>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=       if (m.r === 'a' && i === cur.msgs.length - 1 && !m.d && !busy) {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'mzt-deepbtn'; b.textContent = 'Approfondir cette réponse';
        b.onclick = () => ask('Approfondis ta réponse précédente : explique plus en détail, avec un exemple complet et les pièges.', true); log.appendChild(b);
      }
    });
    dessinerMaths(log); log.scrollTop = 1e9;
  }
  function renderList() {
    const q = norm($('#mztQ').value || ''); const ts = [...ST.threads].reverse().filter((t) => !q || norm(t.msgs.map((m) => m.t).join(' ')).includes(q));
    $('#mztList').innerHTML = ts.length ? ts.map((t) => `<details class="mzt-item"><summary>${esc(t.title)}</summary><div class="mzt-meta">${esc(t.sec)} · ${esc(t.date)}</div>${t.msgs.map((m) => `<div class="mzt-m ${m.r === 'u' ? 'u' : 'a'}" style="margin:6px 0">${m.r === 'u' ? esc(m.t) : md(m.t)}</div>`).join('')}<button type="button" data-cont="${esc(t.id)}">Continuer cette discussion</button></details>`).join('')
      : `<p class="mzt-note">${ST.threads.length ? 'Aucune discussion ne contient ce mot.' : 'Aucune discussion pour l\'instant.'}</p>`;
    dessinerMaths($('#mztList'));
  }
  function renderMem() {
    $('#mztMemL').innerHTML = ST.memos.length ? ST.memos.map((m, i) => `<div class="mzt-item"><div class="mzt-meta">${esc(m.date)}</div>${esc(m.text)}<div><button type="button" data-memdel="${i}" style="margin-top:4px">Effacer</button></div></div>`).join('')
      : '<p class="mzt-note">Aucune note pour l\'instant. Elles apparaîtront au fil de tes questions.</p>';
  }

  // ---------- stockage compte ----------
  async function saveThread(t) {
    saveLocal(); if (!db) return;
    try { await db.collection(base + '/threads').doc(t.id).set({ sec: t.sec, date: t.date, title: t.title, msgs: t.msgs.slice(-40) }); } catch (e) {}
  }
  async function saveMemos() { saveLocal(); if (!db) return; try { await db.doc(base).set({ memos: ST.memos.slice(-30), updated: Date.now() }); } catch (e) {} }

  // ---------- appel au tuteur ----------
  const ERR = { not_granted: 'Tu n\'as pas autorisé la page à utiliser Claude. Recharge-la et accepte la demande, ou change-le dans le menu Autorisations de l\'artifact.', rate_limited: 'Trop de questions d\'un coup, ou limite d\'usage atteinte. Réessaie dans un moment.', prompt_too_large: 'L\'extrait est trop long : ouvre une partie plus précise du cours.', image_rejected: 'Cette photo n\'est pas acceptée. Essaie un JPEG ou un PNG plus léger.', refused: 'Claude n\'a pas pu répondre à cette demande. Reformule ta question.' };
  const visible = (t) => {
    const L = String(t).split('\n');
    for (let i = L.length - 1; i >= Math.max(0, L.length - 3); i--) if (/^\s*M[ÉE]MO\s*:/i.test(L[i])) return L.slice(0, i).join('\n').trim();
    return String(t).trim();
  };
  // rendu léger : on échappe le HTML d'abord, puis gras, italique, code, titres, puces, tableaux et blocs de code.
  // Les formules ($…$, $$…$$, \(…\), \[…\]) sont mises de côté avant le Markdown, puis dessinées par MathJax.
  const MATHS = [];
  const protegerMaths = (t) => {
    MATHS.length = 0;
    const garde = (tex, d) => { MATHS.push({ tex: tex.trim(), d }); return '\u0000' + (MATHS.length - 1) + '\u0000'; };
    const RX = /\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$(?=[^\s$\d])([^$\n]*?[^\s$\\])\$(?!\d)/g;
    // le code (blocs ``` et `…`) n'est jamais lu comme une formule
    return String(t).split(/(```[\s\S]*?(?:```|$))/).map((bloc, i) => i % 2 ? bloc
      : bloc.split(/(`[^`\n]*`)/).map((x, j) => j % 2 ? x : x.replace(RX, (_, a, b, c, d) => a != null ? garde(a, 1) : b != null ? garde(b, 1) : c != null ? garde(c, 0) : garde(d, 0))).join('')).join('');
  };
  const rendreMaths = (h) => h.replace(/\u0000(\d+)\u0000/g, (_, n) => { const m = MATHS[+n]; return m ? `<span class="mzt-tex${m.d ? ' d' : ''}" data-d="${m.d}">${esc(m.tex)}</span>` : ''; });
  const inl = (s) => {
    const p = s.split('`'); if (p.length % 2 === 0) { const last = p.pop(); p[p.length - 1] += '`' + last; }
    return p.map((x, i) => i % 2 ? '<code>' + esc(x) + '</code>' : esc(x).replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*\w])\*([^*\n]+)\*(?![*\w])/g, '$1<em>$2</em>')).join('');
  };
  const cellules = (l) => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim());
  const md = (t) => {
    const out = []; let list = null, code = null, tab = null, olN = 0;
    const flushTab = () => {
      if (!tab) return;
      if (tab.length >= 2 && /^[\s|:-]+$/.test(tab[1]) && tab[1].includes('-')) {
        const [tete, , ...corps] = tab;
        out.push('<div class="mzt-tab"><table><thead><tr>' + cellules(tete).map((c) => '<th>' + inl(c) + '</th>').join('') + '</tr></thead><tbody>'
          + corps.map((r) => '<tr>' + cellules(r).map((c) => '<td>' + inl(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>');
      } else tab.forEach((r) => out.push('<p>' + inl(r) + '</p>'));
      tab = null;
    };
    const flush = () => { flushTab(); if (list) { out.push('</' + list + '>'); list = null; } };
    protegerMaths(t).split('\n').forEach((raw) => {
      if (/^\s*```/.test(raw)) { if (code === null) { flush(); code = []; } else { out.push('<pre>' + esc(code.join('\n')) + '</pre>'); code = null; } return; }
      if (code !== null) { code.push(raw); return; }
      let m;
      if (/^\s*\|.*\|\s*$/.test(raw)) { if (list) { out.push('</' + list + '>'); list = null; } (tab = tab || []).push(raw); return; }
      flushTab();
      if ((m = raw.match(/^\s*#{1,6}\s+(.*)$/))) { flush(); olN = 0; out.push('<p><strong>' + inl(m[1]) + '</strong></p>'); }
      else if ((m = raw.match(/^\s*[-*•]\s+(.*)$/))) { if (list !== 'ul') { flush(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + inl(m[1]) + '</li>'); }
      else if ((m = raw.match(/^\s*(\d+)[.)]\s+(.*)$/))) { if (list !== 'ol') { flush(); const n = +m[1]; olN = (n === 1 && olN > 1) ? olN : n; out.push('<ol start="' + olN + '">'); list = 'ol'; } out.push('<li>' + inl(m[2]) + '</li>'); olN++; }
      else if (!raw.trim()) flush();
      else { flush(); out.push('<p>' + inl(raw) + '</p>'); }
    });
    if (code !== null) out.push('<pre>' + esc(code.join('\n')) + '</pre>');
    flush(); return rendreMaths(out.join(''));
  };

  // ---------- MathJax : celui de la page s'il existe, sinon chargé à la première formule ----------
  let mjPret = null;
  const mathjax = () => mjPret || (mjPret = new Promise((ok, ko) => {
    if (!window.MathJax) {
      window.MathJax = { svg: { fontCache: 'global' }, startup: { typeset: false } };
      const s = document.createElement('script'); s.async = true; s.src = 'https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js';
      s.onerror = () => ko(new Error('MathJax')); document.head.appendChild(s);
    }
    let n = 0; const t = setInterval(() => {
      if (window.MathJax && MathJax.tex2svgPromise && MathJax.startup && MathJax.startup.promise) { clearInterval(t); MathJax.startup.promise.then(ok, ko); }
      else if (++n > 150) { clearInterval(t); ko(new Error('MathJax')); }
    }, 100);
  })).catch((e) => { mjPret = null; throw e; });
  const svgCache = new Map(); let file = Promise.resolve();
  function dessinerMaths(racine) {
    const spans = [...racine.querySelectorAll('.mzt-tex:not([data-ok])')]; if (!spans.length) return;
    mathjax().then(() => spans.forEach((sp) => {
      const cle = sp.dataset.d + '|' + sp.textContent;
      const poser = (n) => { if (!sp.isConnected || sp.dataset.ok) return; sp.textContent = ''; sp.appendChild(n.cloneNode(true)); sp.dataset.ok = '1'; };
      if (svgCache.has(cle)) return poser(svgCache.get(cle));
      file = file.then(() => MathJax.tex2svgPromise(sp.textContent, { display: sp.dataset.d === '1' }).then((n) => { svgCache.set(cle, n); poser(n); })).catch(() => {});
    })).catch(() => {});
  }
  async function ask(q, deep) {
    q = (q || '').trim(); deep = deep || $('#mztDeep').checked;
    if (busy || !q) return; if (!sample) { note(); return; }
    const c = refreshCtx();
    if (!cur || (cur.sec !== c.label && !forced)) { cur = { id: 't' + Date.now().toString(36), sec: c.label, date: today(), title: q.slice(0, 80), msgs: [] }; ST.threads.push(cur); }
    else if (!ST.threads.includes(cur)) ST.threads.push(cur);
    cur.msgs.push({ r: 'u', t: q }); busy = true; renderLog();
    const out = document.createElement('div'); out.className = 'mzt-m a'; out.textContent = deep ? 'Réflexion approfondie…' : 'Réflexion…'; $('#mztLog').appendChild(out);
    $('#mztSend').disabled = true; $('#mztStop').hidden = false;
    const style = deep
      ? 'Réponse APPROFONDIE (400 à 700 mots) : 1) l\'intuition avec une analogie, 2) l\'explication détaillée pas à pas, 3) pourquoi ça marche, 4) un exemple complet chiffré, 5) les pièges fréquents et ce qui tombe à l\'examen, 6) une question pour vérifier la compréhension.'
      : 'Réponse EXPLICATIVE (150 à 250 mots) : 1) l\'idée en une phrase, 2) l\'explication pas à pas, 3) un petit exemple chiffré ou concret, 4) une courte question pour vérifier la compréhension.';
    const mem = [];
    if (ST.memos.length) mem.push('DIFFICULTÉS DÉJÀ REPÉRÉES :\n' + ST.memos.slice(-12).map((m) => `- ${m.date} : ${m.text}`).join('\n'));
    const lastQ = ST.threads.flatMap((t) => t.msgs.filter((m) => m.r === 'u').map((m) => `[${t.sec}] ${m.t.slice(0, 100)}`)).slice(-6);
    if (lastQ.length) mem.push('SES DERNIÈRES QUESTIONS :\n' + lastQ.map((x) => '- ' + x).join('\n'));
    const rules = `Tu es le tuteur de ${C.student}, pour le module ${C.module}${C.prof ? ' du ' + C.prof : ''}. Il apprend souvent la notion pour la première fois.
Règles : réponds en français simple, en Markdown léger (**gras** pour les termes clés, tirets, étapes numérotées). Toute formule ou tout calcul s'écrit en LaTeX : $…$ dans la phrase, $$…$$ seul sur sa ligne pour une formule importante (ex. $\\hat y_i$, $$\\text{MSE}=\\frac{1}{n}\\sum_{i=1}^{n}(y_i-\\hat y_i)^2$$) ; jamais d'accents graves pour une formule, ils sont réservés au code et aux noms de fonctions. Un petit tableau Markdown est permis s'il clarifie (3 colonnes maximum, l'écran est étroit). ${style} Appuie-toi d'abord sur l'EXTRAIT ci-dessous et sur les conventions du prof ; si une source générale diffère du cours, signale l'écart et dis quelle version utiliser à l'examen (celle du prof). Pour un calcul, pose chaque étape et vérifie-la. S'il envoie une réponse ou une photo de brouillon, corrige étape par étape et nomme précisément l'erreur. Si tu n'es pas sûr, dis-le. S'il demande un mini-exercice, donne l'exercice sans la solution.
Utilise sa mémoire pour faire des liens avec ses confusions passées, sans la réciter.
Termine TOUJOURS par une dernière ligne séparée au format exact « MÉMO: … » qui résume en 15 mots maximum la difficulté révélée par sa question (ou « MÉMO: rien »). Cette ligne lui est cachée.
${C.conventions ? 'CONVENTIONS DU PROF : ' + C.conventions + '\n' : ''}MÉMOIRE DE L'ÉLÈVE :
${mem.join('\n\n') || '(rien pour l\'instant)'}
EXTRAIT (${c.label}) :
${c.text.slice(0, deep ? 9000 : 3500)}`;
    const recent = cur.msgs.slice(deep ? -9 : -5, -1).map((m) => ({ role: m.r === 'u' ? 'user' : 'assistant', content: m.t }));
    while (recent.length && recent[0].role !== 'user') recent.shift();
    const msgs = [...recent.filter((m) => m.content && m.content.trim()), { role: 'user', content: q }]; while (msgs.length > 1 && msgs[0].role !== 'user') msgs.shift(); msgs[0] = { role: 'user', content: rules + '\n\n---\nQuestion : ' + msgs[0].content };
    ctl = new AbortController();
    const opts = { modelTier: deep ? 'complex' : 'quick', cache: false, signal: ctl.signal, onText: ({ text }) => { out.innerHTML = md(visible(text)); dessinerMaths(out); $('#mztLog').scrollTop = 1e9; } };
    if (img) opts.images = [img];
    try {
      const r = await sample(msgs, opts);
      const mm = r.text.match(/(?:^|\n)\s*M[ÉE]MO\s*:\s*(.+)\s*$/i);
      cur.msgs.push({ r: 'a', t: visible(r.text) + (r.truncated ? '\n\n(Réponse coupée : pose une question plus ciblée.)' : ''), d: !!deep });
      if (mm && !/^\s*rien/i.test(mm[1])) { ST.memos.push({ date: today(), text: mm[1].trim().slice(0, 160) }); if (ST.memos.length > 30) ST.memos.shift(); saveMemos(); }
      await saveThread(cur);
    } catch (e) {
      const kept = e && e.text ? visible(e.text) : '';
      if (e && e.code === 'cancelled') { if (kept) cur.msgs.push({ r: 'a', t: kept + '\n(Arrêté.)' }); else cur.msgs.pop(); }
      else { cur.msgs.pop(); compacter(!!cur.msgs.length); out.textContent = (kept ? kept + '\n\n' : '') + (ERR[e && e.code] || 'Le tuteur n\'a pas pu répondre. Réessaie dans un instant.'); }
      if (!cur.msgs.length) ST.threads = ST.threads.filter((t) => t !== cur);
      saveLocal();
      if (!(e && e.code === 'cancelled')) { busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImgN').textContent = ''; return; }
    }
    busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImg').value = ''; $('#mztImgN').textContent = ''; renderLog();
  }

  // ---------- événements ----------
  $('#mztBtn').onclick = () => openPanel(null);
  $('#mztX').onclick = closePanel;
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#mztPan').hidden) closePanel(); });
  $('#mztTabH').onclick = () => view($('#mztHist').hidden ? 'hist' : 'chat');
  $('#mztTabM').onclick = () => view($('#mztMem').hidden ? 'mem' : 'chat');
  $('#mztQ').oninput = renderList;
  $('#mztList').onclick = (e) => { const id = e.target.dataset && e.target.dataset.cont; if (!id) return; cur = ST.threads.find((t) => t.id === id); view('chat'); $('#mztCtx').textContent = '· ' + cur.sec; renderLog(); };
  $('#mztMemL').onclick = (e) => { const i = e.target.dataset && e.target.dataset.memdel; if (i == null) return; ST.memos.splice(+i, 1); saveMemos(); renderMem(); };
  $('#mztChips').onclick = (e) => { const b = e.target.closest('[data-chip]'); if (!b) return; const t = $('#mztIn'); t.value = b.dataset.chip + (t.value ? ' : ' + t.value : ''); t.focus(); };
  $('#mztNew').onclick = () => { cur = null; renderLog(); };
  $('#mztStop').onclick = () => { if (ctl) ctl.abort(); };
  $('#mztImg').onchange = (e) => { img = e.target.files[0] || null; $('#mztImgN').textContent = img ? 'Photo : ' + img.name : ''; };
  $('#mztF').onsubmit = (e) => { e.preventDefault(); const v = $('#mztIn').value; $('#mztIn').value = ''; ask(v); };
  $('#mztIn').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#mztF').requestSubmit(); } });

  // ---------- capacités (facultatives) ----------
  const W = window.claude;
  if (W && W.use) {
    W.use('sample').then((s) => { sample = s; ready = true; note();
      if (s && s.limits) s.limits().then((l) => { if (l && l.images) { imgOK = true; $('#mztImgL').hidden = false; if (l.images.mediaTypes) $('#mztImg').accept = l.images.mediaTypes.join(','); } }).catch(() => {});
    }).catch(() => { ready = true; note(); });
    Promise.all([W.use('db'), W.use('user')]).then(async ([d, u]) => {
      if (!d || !u) return; const id = await u.id(); if (!id) return; db = d; base = 'data/users/' + id + '/mzt_' + C.id;
      try {
        const m = await db.doc(base).get(); if (m.exists) { const v = m.data() || {}; if (Array.isArray(v.memos)) ST.memos = JSON.parse(JSON.stringify(v.memos)); }
        const q = await db.collection(base + '/threads').get(); const remote = q.docs.map((x) => Object.assign({ id: x.id }, JSON.parse(JSON.stringify(x.data() || {}))));
        const map = {}; [...ST.threads, ...remote].forEach((t) => { if (!map[t.id] || (t.msgs || []).length > (map[t.id].msgs || []).length) map[t.id] = t; });
        ST.threads = Object.values(map).sort((a, b) => parseInt(a.id.slice(1), 36) - parseInt(b.id.slice(1), 36)); saveLocal();
      } catch (e) {}
    }).catch(() => {});
  } else { ready = true; note(); }

  window.MZT = { open: openPanel, close: closePanel };
})();

</script>

if(window.top===window&&location.protocol==="file:"){a.hidden=true;return}
a.href=p.indexOf("/decouvrir")===0||location.pathname.indexOf("/decouvrir")===0?"/decouvrir":"/app/modules";})();</script>
