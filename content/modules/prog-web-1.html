ass=\"qq\" data-k=\"9\"><div class=\"qq-q\">Selon le prof, <code>&lt;table&gt;<\/code> sert à…<\/div><button class=\"opt\" data-o=\"0\">faire la mise en page du site<\/button><button class=\"opt\" data-o=\"1\">présenter des données en lignes et colonnes<\/button><button class=\"opt\" data-o=\"2\">créer des formulaires<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"tableaux-images-medias","rep":null,"tol":null},{"n":"tableaux-images-medias","rep":["4"],"tol":null},{"n":"tableaux-images-medias","rep":null,"tol":null},{"n":"tableaux-images-medias","rep":null,"tol":null}],"qcm":[{"n":"tableaux-images-medias","q":"Quelle balise représente une rangée de tableau ?","o":["<code>&lt;td&gt;<\/code>","<code>&lt;tr&gt;<\/code>","<code>&lt;th&gt;<\/code>"],"a":1,"e":"tr = table row."},{"n":"tableaux-images-medias","q":"<code>&lt;th&gt;<\/code> désigne…","o":["une cellule fusionnée","une cellule d&#39;en-tête","la légende du tableau"],"a":1,"e":"La légende, c&#39;est <code>&lt;caption&gt;<\/code>."},{"n":"tableaux-images-medias","q":"Où se place <code>&lt;caption&gt;<\/code> ?","o":["juste après <code>&lt;table&gt;<\/code>","à la fin du tableau","dans un <code>&lt;td&gt;<\/code>"],"a":0,"e":"Le cours le précise : immédiatement après la balise ouvrante."},{"n":"tableaux-images-medias","q":"Une cellule qui occupe 2 colonnes utilise…","o":["<code>colspan=&quot;2&quot;<\/code>","<code>rowspan=&quot;2&quot;<\/code>","<code>span=&quot;2&quot;<\/code>"],"a":0,"e":"col = colonne."},{"n":"tableaux-images-medias","q":"Tableau 2 colonnes, 3 rangées, Cellule 1 avec <code>rowspan=&quot;3&quot;<\/code>. Combien de <code>td<\/code> dans la 2e rangée ?","o":["0","1","2"],"a":1,"e":"La 1re colonne est occupée par la Cellule 1."},{"n":"tableaux-images-medias","q":"À quoi sert <code>alt<\/code> ?","o":["à fixer la largeur","à afficher un texte si l&#39;image ne charge pas","à afficher une infobulle de lien"],"a":1,"e":"L&#39;infobulle d&#39;un lien, c&#39;est <code>title<\/code>."},{"n":"tableaux-images-medias","q":"Que se passe-t-il si on donne width et height disproportionnés à une image ?","o":["rien","l&#39;image est déformée","l&#39;image ne s&#39;affiche pas"],"a":1,"e":"Donne une seule dimension pour garder les proportions."},{"n":"tableaux-images-medias","q":"Quel attribut affiche les boutons de lecture d&#39;une vidéo ?","o":["<code>play<\/code>","<code>controls<\/code>","<code>preload<\/code>"],"a":1,"e":"Sans <code>controls<\/code>, aucun bouton."},{"n":"tableaux-images-medias","q":"Pour couper le son d&#39;une vidéo par défaut :","o":["<code>muted<\/code>","<code>silent<\/code>","<code>volume=&quot;0&quot;<\/code>"],"a":0,"e":"<code>muted<\/code> est un attribut booléen."},{"n":"tableaux-images-medias","q":"Selon le prof, <code>&lt;table&gt;<\/code> sert à…","o":["faire la mise en page du site","présenter des données en lignes et colonnes","créer des formulaires"],"a":1,"e":"La mise en page passe par le CSS."}]},{"id":"formulaires","t":"HTML5 (4) · formulaires","seance":"Partie II · HTML5, formulaires","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu dois connaître la différence client / serveur (chapitre 1) et savoir écrire des attributs (chapitre 2). Un formulaire envoie des données du client vers le serveur.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Dans une requête HTTP, où voyagent les données d&#39;un formulaire envoyé en POST ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Dans le <strong>corps<\/strong> de la requête, après la ligne vide (chapitre 1).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Chaque champ = une question posée à l&#39;utilisateur.<\/strong> Pour chaque champ, demande-toi : quel type de réponse (texte, choix unique, choix multiple, date…) ? Le <code>type<\/code> de l&#39;<code>input<\/code> en découle.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Oublier l&#39;attribut <strong><code>name<\/code><\/strong>. Sans <code>name<\/code>, le champ s&#39;affiche mais sa valeur <strong>n&#39;est pas envoyée<\/strong> au serveur. Et <code>id<\/code> (pour le <code>label<\/code>) ne remplace pas <code>name<\/code>.<\/p>\n<\/aside><p>À la fin, tu sais écrire un formulaire complet : zones de texte, mot de passe, liste déroulante, boutons radio et cases à cocher, boutons d&#39;envoi, regroupement en <code>fieldset<\/code>, transfert de fichier.<\/p>\n<h2>Idée 1 · <code>&lt;form&gt;<\/code> : method et action<\/h2>\n<figure class=\"flux\"><figcaption>Le voyage d'un formulaire<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">L&#39;utilisateur remplit les champs<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">clic sur submit<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">le navigateur envoie name=valeur (GET ou POST)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">action=&quot;traitement.php&quot; traite les données<\/div><\/div><\/figure><pre class=\"\"><code>&lt;form method=&quot;post&quot; action=&quot;traitement.php&quot;&gt;\n    ...champs...\n&lt;/form&gt;<\/code><\/pre><table>\n<thead>\n<tr>\n<th>Attribut<\/th>\n<th>Valeurs<\/th>\n<th>Rôle<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>method<\/code><\/td>\n<td><code>get<\/code><\/td>\n<td>données ajoutées à l&#39;URL (<code>?pseudo=midou<\/code>), quantité limitée<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><code>post<\/code><\/td>\n<td>données dans le corps de la requête : <strong>la plus utilisée<\/strong>, grandes quantités<\/td>\n<\/tr>\n<tr>\n<td><code>action<\/code><\/td>\n<td>une URL<\/td>\n<td>la page (souvent <strong>PHP<\/strong>) qui traite les données<\/td>\n<\/tr>\n<\/tbody><\/table>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le cours dit que GET est « limité à 255 caractères ». C&#39;est une limite historique de vieux navigateurs : aujourd&#39;hui la limite dépend du navigateur et du serveur (plusieurs milliers de caractères). Retiens surtout : <strong>GET = données visibles dans l&#39;URL, POST = dans le corps<\/strong>. Un mot de passe ne s&#39;envoie jamais en GET.<\/p>\n<\/aside><h2>Idée 2 · Les champs de saisie<\/h2>\n<pre class=\"\"><code>&lt;form method=&quot;post&quot; action=&quot;traitement.php&quot;&gt;\n    &lt;p&gt;\n        &lt;label for=&quot;pseudo&quot;&gt;Votre pseudo :&lt;/label&gt;\n        &lt;input type=&quot;text&quot; name=&quot;pseudo&quot; id=&quot;pseudo&quot;\n               placeholder=&quot;Ex : midou&quot; size=&quot;30&quot; maxlength=&quot;10&quot;&gt;\n        &lt;br&gt;\n        &lt;label for=&quot;pass&quot;&gt;Votre mot de passe :&lt;/label&gt;\n        &lt;input type=&quot;password&quot; name=&quot;pass&quot; id=&quot;pass&quot;&gt;\n    &lt;/p&gt;\n    &lt;p&gt;\n        &lt;label for=&quot;sugg&quot;&gt;Vos suggestions :&lt;/label&gt;&lt;br&gt;\n        &lt;textarea name=&quot;sugg&quot; id=&quot;sugg&quot; rows=&quot;5&quot; cols=&quot;40&quot;&gt;&lt;/textarea&gt;\n    &lt;/p&gt;\n&lt;/form&gt;<\/code><\/pre><form style=\"border:1px solid currentColor;border-radius:8px;padding:8px 14px;margin:8px 0\" onsubmit=\"return false\">\n<p><label for=\"d-pseudo\">Votre pseudo :<\/label> <input type=\"text\" id=\"d-pseudo\" placeholder=\"Ex : midou\" size=\"20\" maxlength=\"10\"><br>\n<label for=\"d-pass\">Votre mot de passe :<\/label> <input type=\"password\" id=\"d-pass\"><\/p>\n<p><label for=\"d-sugg\">Vos suggestions :<\/label><br><textarea id=\"d-sugg\" rows=\"3\" cols=\"30\"><\/textarea><\/p>\n<\/form><figure class=\"etapes\" data-i=\"0\"><figcaption>Le lien label ↔ input<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · Le champ<\/div><p><code>&lt;input id=&quot;pseudo&quot; name=&quot;pseudo&quot;&gt;<\/code> : <code>id<\/code> l&#39;identifie dans la page, <code>name<\/code> le nomme pour le serveur.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · Le label<\/div><p><code>&lt;label for=&quot;pseudo&quot;&gt;<\/code> : la valeur de <code>for<\/code> = l&#39;<code>id<\/code> du champ.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · L&#39;effet<\/div><p>Cliquer sur le texte du label place le curseur dans le champ.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><table>\n<thead>\n<tr>\n<th>Attribut de <code>input<\/code><\/th>\n<th>Rôle<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>name<\/code><\/td>\n<td>nom de la donnée envoyée<\/td>\n<\/tr>\n<tr>\n<td><code>id<\/code><\/td>\n<td>identifiant (pour <code>label for<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><code>size<\/code><\/td>\n<td>largeur visible de la zone<\/td>\n<\/tr>\n<tr>\n<td><code>maxlength<\/code><\/td>\n<td>nombre maximal de caractères<\/td>\n<\/tr>\n<tr>\n<td><code>value<\/code><\/td>\n<td>valeur pré-remplie<\/td>\n<\/tr>\n<tr>\n<td><code>placeholder<\/code><\/td>\n<td>indication grisée, disparaît à la saisie<\/td>\n<\/tr>\n<tr>\n<td><code>required<\/code><\/td>\n<td>champ obligatoire (utilisé dans le corrigé du TD)<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Les types HTML5 du cours : <code>email<\/code>, <code>url<\/code>, <code>tel<\/code>, <code>number<\/code>, <code>range<\/code> (curseur), <code>color<\/code>, <code>date<\/code>, <code>search<\/code>.<\/p>\n<aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p><code>placeholder<\/code> n&#39;est <strong>pas<\/strong> une valeur : s&#39;il n&#39;est pas remplacé, le champ est envoyé <strong>vide<\/strong>. Pour pré-remplir, c&#39;est <code>value<\/code>.<\/p>\n<\/aside><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Dans l&#39;exemple <code>textarea<\/code> des diapos, le <code>label for=&quot;proposition&quot;<\/code> ne correspond pas à l&#39;<code>id=&quot;Suggestion&quot;<\/code> du champ, et les guillemets de <code>rows=&quot;20&quot;<\/code> sont typographiques (<code>“20&quot;<\/code>). Corrige : <code>for<\/code> doit valoir exactement l&#39;<code>id<\/code>, avec des guillemets droits.<\/p>\n<\/aside><h2>Idée 3 · Les choix : liste, radio, checkbox<\/h2>\n<figure class=\"grille\"><figcaption>Quel élément pour quel choix ?<\/figcaption><table><tr><th>besoin<\/th><th>élément<\/th><\/tr><tr><td>une<\/td><td>option<\/td><td>parmi<\/td><td>beaucoup<\/td><td class=\"h1\">select<\/td><td>+<\/td><td>option<\/td><\/tr><tr><td>une<\/td><td>option<\/td><td>parmi<\/td><td>peu<\/td><td>(exclusif)<\/td><td class=\"h1\">input<\/td><td>type=&quot;radio&quot;<\/td><\/tr><tr><td>plusieurs<\/td><td>options<\/td><td>à<\/td><td>la<\/td><td>fois<\/td><td class=\"h1\">input<\/td><td>type=&quot;checkbox&quot;<\/td><\/tr><\/table><\/figure><pre class=\"\"><code>&lt;label for=&quot;ville&quot;&gt;Ville :&lt;/label&gt;\n&lt;select name=&quot;ville&quot; id=&quot;ville&quot;&gt;\n    &lt;optgroup label=&quot;Béni Mellal-Khénifra&quot;&gt;\n        &lt;option value=&quot;bm&quot;&gt;Béni Mellal&lt;/option&gt;\n        &lt;option value=&quot;kh&quot;&gt;Khouribga&lt;/option&gt;\n    &lt;/optgroup&gt;\n    &lt;optgroup label=&quot;Casablanca-Settat&quot;&gt;\n        &lt;option value=&quot;casa&quot; selected&gt;Casablanca&lt;/option&gt;\n    &lt;/optgroup&gt;\n&lt;/select&gt;\n\n&lt;p&gt;Semestre :\n    &lt;input type=&quot;radio&quot; name=&quot;sem&quot; value=&quot;S3&quot; id=&quot;s3&quot;&gt; &lt;label for=&quot;s3&quot;&gt;S3&lt;/label&gt;\n    &lt;input type=&quot;radio&quot; name=&quot;sem&quot; value=&quot;S4&quot; id=&quot;s4&quot;&gt; &lt;label for=&quot;s4&quot;&gt;S4&lt;/label&gt;\n&lt;/p&gt;\n&lt;p&gt;Modules :\n    &lt;input type=&quot;checkbox&quot; name=&quot;html&quot; id=&quot;html&quot;&gt; &lt;label for=&quot;html&quot;&gt;Le langage HTML&lt;/label&gt;\n    &lt;input type=&quot;checkbox&quot; name=&quot;js&quot; id=&quot;js&quot;&gt; &lt;label for=&quot;js&quot;&gt;Le langage JavaScript&lt;/label&gt;\n&lt;/p&gt;<\/code><\/pre><form style=\"border:1px solid currentColor;border-radius:8px;padding:8px 14px;margin:8px 0\" onsubmit=\"return false\">\n<label for=\"d-ville\">Ville :<\/label> <select id=\"d-ville\"><optgroup label=\"Béni Mellal-Khénifra\"><option>Béni Mellal<\/option><option>Khouribga<\/option><\/optgroup><optgroup label=\"Casablanca-Settat\"><option selected>Casablanca<\/option><\/optgroup><\/select>\n<p>Semestre : <input type=\"radio\" name=\"d-sem\" id=\"d-s3\"> <label for=\"d-s3\">S3<\/label> <input type=\"radio\" name=\"d-sem\" id=\"d-s4\"> <label for=\"d-s4\">S4<\/label><\/p>\n<p>Modules : <input type=\"checkbox\" id=\"d-h\"> <label for=\"d-h\">HTML<\/label> <input type=\"checkbox\" id=\"d-j\"> <label for=\"d-j\">JavaScript<\/label><\/p>\n<\/form><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Des boutons radio forment un groupe <strong>parce qu&#39;ils ont le même <code>name<\/code><\/strong>. Si chaque radio a un <code>name<\/code> différent, on peut tous les cocher : ce n&#39;est plus un choix unique.<\/p>\n<\/aside><h2>Idée 4 · Boutons, fieldset et envoi de fichiers<\/h2>\n<pre class=\"\"><code>&lt;form method=&quot;post&quot; action=&quot;inscription.php&quot; enctype=&quot;multipart/form-data&quot;&gt;\n    &lt;fieldset&gt;\n        &lt;legend&gt;Identité&lt;/legend&gt;\n        &lt;label for=&quot;nom&quot;&gt;Nom :&lt;/label&gt; &lt;input type=&quot;text&quot; name=&quot;nom&quot; id=&quot;nom&quot; required&gt;\n    &lt;/fieldset&gt;\n    &lt;fieldset&gt;\n        &lt;legend&gt;Documents&lt;/legend&gt;\n        &lt;input type=&quot;file&quot; name=&quot;cv&quot;&gt;\n    &lt;/fieldset&gt;\n    &lt;input type=&quot;submit&quot; value=&quot;Envoyer&quot;&gt;\n    &lt;input type=&quot;reset&quot; value=&quot;Annuler&quot;&gt;\n&lt;/form&gt;<\/code><\/pre><table>\n<thead>\n<tr>\n<th><code>type<\/code> du bouton<\/th>\n<th>Effet<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>submit<\/code><\/td>\n<td>envoie le formulaire<\/td>\n<\/tr>\n<tr>\n<td><code>reset<\/code><\/td>\n<td>remet tous les champs à zéro<\/td>\n<\/tr>\n<tr>\n<td><code>image<\/code><\/td>\n<td>bouton d&#39;envoi sous forme d&#39;image<\/td>\n<\/tr>\n<tr>\n<td><code>button<\/code><\/td>\n<td>ne fait rien seul : géré en JavaScript<\/td>\n<\/tr>\n<\/tbody><\/table>\n<ul>\n<li><code>&lt;fieldset&gt;<\/code> regroupe visuellement des champs (un cadre) ; <code>&lt;legend&gt;<\/code> lui donne un titre.<\/li>\n<li><code>&lt;input type=&quot;file&quot;&gt;<\/code> permet d&#39;envoyer un fichier au serveur. Le formulaire doit alors être en <strong>POST<\/strong> avec <strong><code>enctype=&quot;multipart/form-data&quot;<\/code><\/strong>.<\/li>\n<\/ul>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>La diapo écrit <code>enctype=&quot;multipart/formdata&quot;<\/code> (le tiret a disparu à l&#39;extraction ou dans la diapo). La valeur exacte est <strong><code>multipart/form-data<\/code><\/strong>. Sans elle, le fichier n&#39;est pas transmis.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Écrire des formulaires<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Écris un groupe de boutons radio « Sexe » (Homme / Femme) où un seul choix est possible.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><pre class=\"\"><code>&lt;input type=&quot;radio&quot; name=&quot;sexe&quot; value=&quot;H&quot; id=&quot;h&quot;&gt; &lt;label for=&quot;h&quot;&gt;Homme&lt;/label&gt;\n&lt;input type=&quot;radio&quot; name=&quot;sexe&quot; value=&quot;F&quot; id=&quot;f&quot;&gt; &lt;label for=&quot;f&quot;&gt;Femme&lt;/label&gt;<\/code><\/pre><p>Le <strong>même <code>name<\/code><\/strong> rend le choix exclusif.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Un étudiant écrit <code>&lt;input type=&quot;text&quot; id=&quot;cne&quot;&gt;<\/code> et le serveur ne reçoit rien. Pourquoi ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Il manque <strong><code>name=&quot;cne&quot;<\/code><\/strong>. Seuls les champs avec un <code>name<\/code> sont envoyés.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Écris le formulaire du TD, exercice 1, début : champ obligatoire « Num_CIN* » avec son label, dans un tableau, envoyé en POST.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><pre class=\"\"><code>&lt;form method=&quot;post&quot; action=&quot;&quot;&gt;\n    &lt;table border=&quot;1&quot;&gt;\n        &lt;tr&gt;\n            &lt;td&gt;&lt;label for=&quot;cin&quot;&gt;Num_CIN*&lt;/label&gt;&lt;/td&gt;\n            &lt;td&gt;&lt;input type=&quot;text&quot; name=&quot;cin&quot; id=&quot;cin&quot; required&gt;&lt;/td&gt;\n        &lt;/tr&gt;\n    &lt;/table&gt;\n&lt;/form&gt;<\/code><\/pre><p>Le corrigé complet est au chapitre « TD et TP corrigés ».<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Quels attributs doit avoir un <code>&lt;form&gt;<\/code> qui envoie une photo ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>method=&quot;post&quot;<\/code> et <code>enctype=&quot;multipart/form-data&quot;<\/code> (plus <code>action<\/code>), avec un <code>&lt;input type=&quot;file&quot; name=&quot;photo&quot;&gt;<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 9 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quelle méthode met les données dans l&#39;URL ?<\/div><button class=\"opt\" data-o=\"0\">GET<\/button><button class=\"opt\" data-o=\"1\">POST<\/button><button class=\"opt\" data-o=\"2\">PUT<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">L&#39;attribut <code>action<\/code> contient…<\/div><button class=\"opt\" data-o=\"0\">le type d&#39;envoi<\/button><button class=\"opt\" data-o=\"1\">l&#39;adresse du programme qui traite les données<\/button><button class=\"opt\" data-o=\"2\">le nom du formulaire<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Un champ sans <code>name<\/code>…<\/div><button class=\"opt\" data-o=\"0\">est obligatoire<\/button><button class=\"opt\" data-o=\"1\">n&#39;est pas envoyé au serveur<\/button><button class=\"opt\" data-o=\"2\">est caché<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\"><code>label for=&quot;pseudo&quot;<\/code> se relie au champ qui a…<\/div><button class=\"opt\" data-o=\"0\"><code>name=&quot;pseudo&quot;<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>id=&quot;pseudo&quot;<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>value=&quot;pseudo&quot;<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Quel type masque les caractères saisis ?<\/div><button class=\"opt\" data-o=\"0\"><code>text<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>password<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>hidden<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Pour un texte de plusieurs lignes :<\/div><button class=\"opt\" data-o=\"0\"><code>&lt;input type=&quot;text&quot; rows=&quot;5&quot;&gt;<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>&lt;textarea&gt;<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>&lt;input type=&quot;multiline&quot;&gt;<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Trois boutons radio permettent tous d&#39;être cochés en même temps. Cause probable ?<\/div><button class=\"opt\" data-o=\"0\">il manque <code>checked<\/code><\/button><button class=\"opt\" data-o=\"1\">ils n&#39;ont pas le même <code>name<\/code><\/button><button class=\"opt\" data-o=\"2\">il manque <code>value<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Quel bouton remet le formulaire à zéro ?<\/div><button class=\"opt\" data-o=\"0\"><code>submit<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>reset<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>button<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\"><code>&lt;legend&gt;<\/code> s&#39;utilise dans…<\/div><button class=\"opt\" data-o=\"0\"><code>&lt;select&gt;<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>&lt;fieldset&gt;<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>&lt;table&gt;<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Pour envoyer un fichier, l&#39;attribut <code>enctype<\/code> vaut…<\/div><button class=\"opt\" data-o=\"0\"><code>text/plain<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>multipart/formdata<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>multipart/form-data<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"formulaires","rep":null,"tol":null},{"n":"formulaires","rep":null,"tol":null},{"n":"formulaires","rep":null,"tol":null},{"n":"formulaires","rep":null,"tol":null},{"n":"formulaires","rep":null,"tol":null}],"qcm":[{"n":"formulaires","q":"Quelle méthode met les données dans l&#39;URL ?","o":["GET","POST","PUT"],"a":0,"e":"Avec GET on voit <code>?nom=valeur<\/code> dans l&#39;adresse."},{"n":"formulaires","q":"L&#39;attribut <code>action<\/code> contient…","o":["le type d&#39;envoi","l&#39;adresse du programme qui traite les données","le nom du formulaire"],"a":1,"e":"Souvent une page PHP, comme <code>traitement.php<\/code>."},{"n":"formulaires","q":"Un champ sans <code>name<\/code>…","o":["est obligatoire","n&#39;est pas envoyé au serveur","est caché"],"a":1,"e":"<code>name<\/code> est la clé de la donnée envoyée."},{"n":"formulaires","q":"<code>label for=&quot;pseudo&quot;<\/code> se relie au champ qui a…","o":["<code>name=&quot;pseudo&quot;<\/code>","<code>id=&quot;pseudo&quot;<\/code>","<code>value=&quot;pseudo&quot;<\/code>"],"a":1,"e":"<code>for<\/code> pointe vers l&#39;<code>id<\/code>."},{"n":"formulaires","q":"Quel type masque les caractères saisis ?","o":["<code>text<\/code>","<code>password<\/code>","<code>hidden<\/code>"],"a":1,"e":"Les caractères s&#39;affichent en points."},{"n":"formulaires","q":"Pour un texte de plusieurs lignes :","o":["<code>&lt;input type=&quot;text&quot; rows=&quot;5&quot;&gt;<\/code>","<code>&lt;textarea&gt;<\/code>","<code>&lt;input type=&quot;multiline&quot;&gt;<\/code>"],"a":1,"e":"<code>textarea<\/code> avec <code>rows<\/code> et <code>cols<\/code>."},{"n":"formulaires","q":"Trois boutons radio permettent tous d&#39;être cochés en même temps. Cause probable ?","o":["il manque <code>checked<\/code>","ils n&#39;ont pas le même <code>name<\/code>","il manque <code>value<\/code>"],"a":1,"e":"Le groupe exclusif est défini par le <code>name<\/code> commun."},{"n":"formulaires","q":"Quel bouton remet le formulaire à zéro ?","o":["<code>submit<\/code>","<code>reset<\/code>","<code>button<\/code>"],"a":1,"e":"<code>button<\/code> ne fait rien sans JavaScript."},{"n":"formulaires","q":"<code>&lt;legend&gt;<\/code> s&#39;utilise dans…","o":["<code>&lt;select&gt;<\/code>","<code>&lt;fieldset&gt;<\/code>","<code>&lt;table&gt;<\/code>"],"a":1,"e":"Elle donne un titre au cadre du fieldset."},{"n":"formulaires","q":"Pour envoyer un fichier, l&#39;attribut <code>enctype<\/code> vaut…","o":["<code>text/plain<\/code>","<code>multipart/formdata<\/code>","<code>multipart/form-data<\/code>"],"a":2,"e":"Avec le tiret : la version des diapos est fautive."}]},{"id":"css-bases-selecteurs","t":"CSS3 (1) · où écrire le CSS, cascade et sélecteurs","seance":"Partie III · CSS3, bases","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut connaître les balises HTML et les attributs <code>class<\/code> et <code>id<\/code> (chapitres 2 et 3). Le CSS va <strong>viser<\/strong> ces éléments pour les habiller.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Dans <code>&lt;p class=&quot;note&quot; id=&quot;intro&quot;&gt;<\/code>, combien d&#39;éléments de la page peuvent avoir <code>id=&quot;intro&quot;<\/code> ? Et <code>class=&quot;note&quot;<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>id=&quot;intro&quot;<\/code> : <strong>un seul<\/strong> élément (identifiant unique). <code>class=&quot;note&quot;<\/code> : autant qu&#39;on veut.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Une règle CSS = « qui ? » + « quoi ? ».<\/strong> Le sélecteur répond à « qui je vise », les déclarations à « ce que je change ». Lis toujours une règle en commençant par le sélecteur.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Oublier le <strong>point<\/strong> devant une classe (<code>rouge { }<\/code> au lieu de <code>.rouge { }<\/code>) ou le <strong>dièse<\/strong> devant un id. Sans eux, le navigateur cherche une balise <code>&lt;rouge&gt;<\/code>, qui n&#39;existe pas : la règle ne s&#39;applique à rien, <strong>sans message d&#39;erreur<\/strong>.<\/p>\n<\/aside><p>À la fin, tu sais lier une feuille de style, expliquer la cascade, et écrire les sélecteurs du cours : élément, multiple, universel, classe, id, descendant, adjacent, attribut.<\/p>\n<h2>Idée 1 · Trois endroits pour écrire du CSS<\/h2>\n<svg viewBox=\"0 0 600 170\" style=\"width:100%;max-width:600px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Trois façons d'écrire du CSS : en ligne dans l'attribut style, interne dans une balise style du head, externe dans un fichier .css lié par link ; la méthode externe est recommandée\">\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\">\n<rect x=\"10\" y=\"20\" width=\"180\" height=\"120\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<text x=\"100\" y=\"45\" font-weight=\"700\">1. En ligne<\/text><text x=\"100\" y=\"75\" font-family=\"monospace\" font-size=\"11\">&lt;h1 style=\"color:pink\"&gt;<\/text><text x=\"100\" y=\"110\" font-size=\"12\">un seul élément<\/text>\n<rect x=\"210\" y=\"20\" width=\"180\" height=\"120\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<text x=\"300\" y=\"45\" font-weight=\"700\">2. Interne<\/text><text x=\"300\" y=\"75\" font-family=\"monospace\" font-size=\"11\">&lt;style&gt; dans &lt;head&gt;<\/text><text x=\"300\" y=\"110\" font-size=\"12\">une seule page<\/text>\n<rect x=\"410\" y=\"20\" width=\"180\" height=\"120\" rx=\"8\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/>\n<text x=\"500\" y=\"45\" font-weight=\"700\" fill=\"#D9824F\">3. Externe ✔<\/text><text x=\"500\" y=\"75\" font-family=\"monospace\" font-size=\"11\">&lt;link href=\"style.css\"&gt;<\/text><text x=\"500\" y=\"110\" font-size=\"12\">tout le site<\/text>\n<text x=\"300\" y=\"162\" font-size=\"12\">recommandée par le prof : séparation contenu / présentation<\/text>\n<\/g><\/svg><pre class=\"\"><code>&lt;!-- 1. En ligne : attribut style --&gt;\n&lt;h1 style=&quot;color: pink;&quot;&gt;Titre&lt;/h1&gt;\n\n&lt;!-- 2. Interne : dans le head --&gt;\n&lt;head&gt;\n    &lt;style&gt;\n        h2 { color: #fff; }\n    &lt;/style&gt;\n&lt;/head&gt;\n\n&lt;!-- 3. Externe : un fichier séparé, lié dans le head --&gt;\n&lt;head&gt;\n    &lt;link rel=&quot;stylesheet&quot; href=&quot;css/style.css&quot;&gt;\n&lt;/head&gt;<\/code><\/pre><p>CSS (<em>Cascading Style Sheets<\/em>, feuilles de style en cascade) <strong>sépare la structure (HTML) de la présentation (CSS)<\/strong> : <code>index.html<\/code> pour le contenu, <code>style.css<\/code> pour la mise en forme.<\/p>\n<aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>La méthode <strong>externe<\/strong> est « vivement recommandée » : une seule feuille pour tout le site, une modification change toutes les pages, présentation cohérente. Le style en ligne est « long et fastidieux » ; le style interne doit être recopié sur chaque page (20 pages = 20 modifications).<\/p>\n<\/aside><h2>Idée 2 · Syntaxe et cascade<\/h2>\n<figure class=\"grille\"><figcaption>Anatomie d'une règle<\/figcaption><table><tr><th>sélecteur<\/th><th>{<\/th><th>propriété<\/th><th>:<\/th><th>valeur<\/th><th>;<\/th><th>}<\/th><\/tr><tr><td class=\"h1\">h1<\/td><td>{<\/td><td class=\"h2\">color<\/td><td>:<\/td><td>red<\/td><td>;<\/td><td>}<\/td><\/tr><\/table><\/figure><pre class=\"\"><code>/* Un commentaire CSS */\nselecteur {\n    propriete: valeur;\n    propriete: valeur;\n}<\/code><\/pre><p>Une <strong>déclaration<\/strong> = propriété + valeur ; les déclarations sont séparées par des <strong>points-virgules<\/strong>.<\/p>\n<p><strong>La cascade<\/strong> : quand deux règles se contredisent, <strong>la dernière<\/strong> l&#39;emporte (à sélecteur équivalent).<\/p>\n<pre class=\"\"><code>h1, h2 { color: yellow; }\nh1 { color: red; }      /* h1 sera rouge : cette règle vient après */<\/code><\/pre><figure class=\"etapes\" data-i=\"0\"><figcaption>Qui gagne ? (ordre de prise en compte selon le cours)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · 1. Feuille externe<\/div><p>lue en premier.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · 2. Style interne (<style> du head)<\/div><p>écrase l&#39;externe s&#39;il est placé après le <code>&lt;link&gt;<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · 3. Style en ligne (attribut style)<\/div><p>écrase les deux : il est le plus proche de l&#39;élément.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le cours ne parle que de l&#39;<strong>ordre<\/strong>. En réalité, la <strong>spécificité<\/strong> du sélecteur compte avant l&#39;ordre : un sélecteur d&#39;<strong>id<\/strong> bat un sélecteur de <strong>classe<\/strong>, qui bat un sélecteur de <strong>balise<\/strong>, même s&#39;il est écrit avant. Exemple : <code>#titre { color: blue }<\/code> puis <code>h1 { color: red }<\/code> → un <code>&lt;h1 id=&quot;titre&quot;&gt;<\/code> reste <strong>bleu<\/strong>. Et si <code>&lt;style&gt;<\/code> est placé <strong>avant<\/strong> le <code>&lt;link&gt;<\/code>, c&#39;est l&#39;externe qui gagne.<\/p>\n<\/aside><h2>Idée 3 · Sélecteurs simples : balise, groupe, *, classe, id<\/h2>\n<table>\n<thead>\n<tr>\n<th>Sélecteur<\/th>\n<th>Exemple<\/th>\n<th>Vise<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>élément<\/td>\n<td><code>p { }<\/code><\/td>\n<td>tous les <code>&lt;p&gt;<\/code><\/td>\n<\/tr>\n<tr>\n<td>multiple<\/td>\n<td><code>h1, div, p { }<\/code><\/td>\n<td>les <code>h1<\/code>, les <code>div<\/code> <strong>et<\/strong> les <code>p<\/code><\/td>\n<\/tr>\n<tr>\n<td>universel<\/td>\n<td><code>* { }<\/code><\/td>\n<td>tous les éléments<\/td>\n<\/tr>\n<tr>\n<td>classe<\/td>\n<td><code>.rouge { }<\/code><\/td>\n<td>les éléments <code>class=&quot;rouge&quot;<\/code> (plusieurs possibles)<\/td>\n<\/tr>\n<tr>\n<td>balise + classe<\/td>\n<td><code>div.rouge { }<\/code><\/td>\n<td>seulement les <code>div<\/code> de classe rouge<\/td>\n<\/tr>\n<tr>\n<td>identifiant<\/td>\n<td><code>#menu { }<\/code><\/td>\n<td>l&#39;élément unique <code>id=&quot;menu&quot;<\/code><\/td>\n<\/tr>\n<\/tbody><\/table>\n<pre class=\"\"><code>.rouge { background-color: red; }\n#menu  { background-color: navy; }<\/code><\/pre><pre class=\"\"><code>&lt;div class=&quot;rouge&quot;&gt;Item 1&lt;/div&gt;\n&lt;div&gt;Item 2&lt;/div&gt;\n&lt;div class=&quot;rouge&quot;&gt;Item 3&lt;/div&gt;   &lt;!-- Items 1 et 3 sont rouges --&gt;\n&lt;nav id=&quot;menu&quot;&gt;...&lt;/nav&gt;<\/code><\/pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p><strong>Point = classe<\/strong> (réutilisable), <strong>dièse = id<\/strong> (unique dans la page). En HTML, on écrit <code>class=&quot;rouge&quot;<\/code> <strong>sans<\/strong> le point.<\/p>\n<\/aside><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Les exemples des diapos ferment les <code>div<\/code> avec <code>&lt;div&gt;<\/code> au lieu de <strong><code>&lt;/div&gt;<\/code><\/strong> (<code>&lt;div class=&quot;rouge&quot;&gt;Item 1&lt;div&gt;<\/code>) : avec ce code, les div s&#39;imbriquent les unes dans les autres. Mets bien le slash.<\/p>\n<\/aside><h2>Idée 4 · Sélecteurs avancés : descendant, adjacent, attribut<\/h2>\n<figure class=\"grille\"><figcaption>Sur &lt;h3&gt;…&lt;/h3&gt;&lt;p&gt;A&lt;/p&gt;&lt;p&gt;B&lt;/p&gt;&lt;div&gt;&lt;p&gt;C&lt;/p&gt;&lt;/div&gt;, qui est visé ?<\/figcaption><table><tr><th><\/th><th>sélecteur<\/th><th>A<\/th><th>B<\/th><th>C<\/th><\/tr><tr><th>div_p<\/th><td class=\"h0\">div_p<\/td><td class=\"h0\">non<\/td><td class=\"h0\">non<\/td><td class=\"h1\">oui<\/td><\/tr><tr><th>h3+p<\/th><td class=\"h0\">h3+p<\/td><td class=\"h1\">oui<\/td><td class=\"h0\">non<\/td><td class=\"h0\">non<\/td><\/tr><tr><th>p[title]<\/th><td class=\"h0\">p[title]<\/td><td class=\"h0\">si_title<\/td><td class=\"h0\">si_title<\/td><td class=\"h0\">si_title<\/td><\/tr><\/table><\/figure><pre class=\"\"><code>div p { color: blue; }                  /* p situés DANS un div (à n'importe quelle profondeur) */\nh3 + p { color: blue; }                 /* le p qui suit IMMÉDIATEMENT un h3 (même parent) */\nh2[title] { color: red; }               /* h2 qui ont un attribut title, quelle que soit sa valeur */\nh2[title][id] { color: red; }           /* h2 qui ont title ET id */\na[title=&quot;Cliquez ici&quot;] { color: red; }  /* liens dont title vaut exactement &quot;Cliquez ici&quot; */\ninput[type=text] { border: 1px solid red; }  /* utilisé dans le TD */<\/code><\/pre><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p><code>div p<\/code> (avec <strong>espace<\/strong>) = les <code>p<\/code> <strong>dans<\/strong> un <code>div<\/code>. <code>div, p<\/code> (avec <strong>virgule<\/strong>) = les <code>div<\/code> <strong>et<\/strong> les <code>p<\/code>. Une virgule de plus change tout.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Écrire des sélecteurs<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Écris la règle qui met en bleu (<code>color: blue<\/code>) uniquement les paragraphes situés dans un <code>&lt;footer&gt;<\/code>.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>footer p { color: blue; }<\/code> (sélecteur descendant : espace entre les deux).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p><code>p { color: red; }<\/code> puis <code>.important { color: green; }<\/code>. De quelle couleur est <code>&lt;p class=&quot;important&quot;&gt;<\/code> ? Et si on inverse l&#39;ordre des deux règles ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><strong>Vert<\/strong> dans les deux cas : la classe est plus <strong>spécifique<\/strong> que la balise, elle gagne quel que soit l&#39;ordre. (Le cours ne parle que de l&#39;ordre ; c&#39;est la spécificité qui tranche ici.)<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Écris la balise qui lie la feuille <code>css/style.css<\/code> à la page (TP 1, exercice 4). Où la place-t-on ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>&lt;link rel=&quot;stylesheet&quot; href=&quot;css/style.css&quot;&gt;<\/code>, dans le <strong><code>&lt;head&gt;<\/code><\/strong>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Écris la règle du TD : champs texte avec fond <code>lightblue<\/code>, bordure solide de 1 pixel rouge, coins arrondis de 5 pixels.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>input[type=text] { background-color: lightblue; border: 1px solid red; border-radius: 5px; }<\/code><\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 9 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quelle méthode le prof recommande-t-il ?<\/div><button class=\"opt\" data-o=\"0\">le style en ligne<\/button><button class=\"opt\" data-o=\"1\">le style interne<\/button><button class=\"opt\" data-o=\"2\">la feuille de style externe<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Quelle balise lie une feuille externe ?<\/div><button class=\"opt\" data-o=\"0\"><code>&lt;style src=&quot;style.css&quot;&gt;<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>&lt;link rel=&quot;stylesheet&quot; href=&quot;style.css&quot;&gt;<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>&lt;css href=&quot;style.css&quot;&gt;<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Dans <code>p { color: red; }<\/code>, <code>color<\/code> est…<\/div><button class=\"opt\" data-o=\"0\">le sélecteur<\/button><button class=\"opt\" data-o=\"1\">la propriété<\/button><button class=\"opt\" data-o=\"2\">la valeur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\"><code>h1, h2 {color: yellow} h1 {color: red}<\/code> : le h1 est…<\/div><button class=\"opt\" data-o=\"0\">jaune<\/button><button class=\"opt\" data-o=\"1\">rouge<\/button><button class=\"opt\" data-o=\"2\">orange<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Le sélecteur <code>.menu<\/code> vise…<\/div><button class=\"opt\" data-o=\"0\">la balise <code>&lt;menu&gt;<\/code><\/button><button class=\"opt\" data-o=\"1\">les éléments qui ont <code>class=&quot;menu&quot;<\/code><\/button><button class=\"opt\" data-o=\"2\">l&#39;élément <code>id=&quot;menu&quot;<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Combien d&#39;éléments peuvent porter le même id ?<\/div><button class=\"opt\" data-o=\"0\">un seul<\/button><button class=\"opt\" data-o=\"1\">deux<\/button><button class=\"opt\" data-o=\"2\">autant qu&#39;on veut<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\"><code>div p<\/code> sélectionne…<\/div><button class=\"opt\" data-o=\"0\">tous les div et tous les p<\/button><button class=\"opt\" data-o=\"1\">les p contenus dans un div<\/button><button class=\"opt\" data-o=\"2\">le p qui suit un div<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\"><code>h3 + p<\/code> sélectionne…<\/div><button class=\"opt\" data-o=\"0\">tous les p après un h3<\/button><button class=\"opt\" data-o=\"1\">le p qui suit immédiatement un h3<\/button><button class=\"opt\" data-o=\"2\">les p dans un h3<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\"><code>h2[title]<\/code> vise…<\/div><button class=\"opt\" data-o=\"0\">les h2 qui ont un attribut title<\/button><button class=\"opt\" data-o=\"1\">les h2 dont le texte est « title »<\/button><button class=\"opt\" data-o=\"2\">les h2 de classe title<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Le sélecteur universel s&#39;écrit…<\/div><button class=\"opt\" data-o=\"0\"><code>all<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>*<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>#<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"css-bases-selecteurs","rep":null,"tol":null},{"n":"css-bases-selecteurs","rep":null,"tol":null},{"n":"css-bases-selecteurs","rep":null,"tol":null},{"n":"css-bases-selecteurs","rep":null,"tol":null},{"n":"css-bases-selecteurs","rep":null,"tol":null}],"qcm":[{"n":"css-bases-selecteurs","q":"Quelle méthode le prof recommande-t-il ?","o":["le style en ligne","le style interne","la feuille de style externe"],"a":2,"e":"Séparation totale et réutilisation sur tout le site."},{"n":"css-bases-selecteurs","q":"Quelle balise lie une feuille externe ?","o":["<code>&lt;style src=&quot;style.css&quot;&gt;<\/code>","<code>&lt;link rel=&quot;stylesheet&quot; href=&quot;style.css&quot;&gt;<\/code>","<code>&lt;css href=&quot;style.css&quot;&gt;<\/code>"],"a":1,"e":"Dans le head."},{"n":"css-bases-selecteurs","q":"Dans <code>p { color: red; }<\/code>, <code>color<\/code> est…","o":["le sélecteur","la propriété","la valeur"],"a":1,"e":"Sélecteur <code>p<\/code>, propriété <code>color<\/code>, valeur <code>red<\/code>."},{"n":"css-bases-selecteurs","q":"<code>h1, h2 {color: yellow} h1 {color: red}<\/code> : le h1 est…","o":["jaune","rouge","orange"],"a":1,"e":"À sélecteur équivalent, la dernière règle gagne."},{"n":"css-bases-selecteurs","q":"Le sélecteur <code>.menu<\/code> vise…","o":["la balise <code>&lt;menu&gt;<\/code>","les éléments qui ont <code>class=&quot;menu&quot;<\/code>","l&#39;élément <code>id=&quot;menu&quot;<\/code>"],"a":1,"e":"Point = classe."},{"n":"css-bases-selecteurs","q":"Combien d&#39;éléments peuvent porter le même id ?","o":["un seul","deux","autant qu&#39;on veut"],"a":0,"e":"Un id est unique dans le document."},{"n":"css-bases-selecteurs","q":"<code>div p<\/code> sélectionne…","o":["tous les div et tous les p","les p contenus dans un div","le p qui suit un div"],"a":1,"e":"Espace = descendant."},{"n":"css-bases-selecteurs","q":"<code>h3 + p<\/code> sélectionne…","o":["tous les p après un h3","le p qui suit immédiatement un h3","les p dans un h3"],"a":1,"e":"Successeur direct, sans être inclus."},{"n":"css-bases-selecteurs","q":"<code>h2[title]<\/code> vise…","o":["les h2 qui ont un attribut title","les h2 dont le texte est « title »","les h2 de classe title"],"a":0,"e":"Sélecteur d&#39;attribut, quelle que soit la valeur."},{"n":"css-bases-selecteurs","q":"Le sélecteur universel s&#39;écrit…","o":["<code>all<\/code>","<code>*<\/code>","<code>#<\/code>"],"a":1,"e":"<code>* { }<\/code> vise tous les éléments."}]},{"id":"css-pseudo-couleurs-polices","t":"CSS3 (2) · pseudo-classes, unités, couleurs, polices et texte","seance":"Partie III · CSS3, mise en forme du texte","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu dois savoir écrire une règle CSS et un sélecteur (chapitre 6).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Écris la règle qui centre tous les titres <code>h1<\/code>.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>h1 { text-align: center; }<\/code><\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Ce chapitre est un dictionnaire.<\/strong> Ne l&#39;apprends pas d&#39;un bloc : retiens la <strong>famille<\/strong> de chaque propriété (<code>font-…<\/code> = la police, <code>text-…<\/code> = le texte, <code>color<\/code> = la couleur) et retrouve le reste par le nom.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Écrire <code>font-color<\/code> ou <code>text-color<\/code>. Ces propriétés <strong>n&#39;existent pas<\/strong> : la couleur du texte, c&#39;est <strong><code>color<\/code><\/strong>.<\/p>\n<\/aside><p>À la fin, tu sais styler un lien selon son état, lire une couleur hexadécimale, choisir une police avec une famille de secours et utiliser le raccourci <code>font<\/code>.<\/p>\n<h2>Idée 1 · Pseudo-classes : styler un état<\/h2>\n<figure class=\"flux\"><figcaption>Les états d'un lien (ordre conseillé : LoVe HAte)<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">a:link (jamais visité)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">a:visited (déjà visité)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">a:hover (survolé)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">a:active (en train d&#39;être cliqué)<\/div><\/div><\/figure><pre class=\"\"><code>a:link    { color: black; text-decoration: none; }\na:visited { color: purple; }\na:hover   { color: green; text-decoration: underline; }  /* TP 1 */\na:active  { color: red; }\n\n.lettrine::first-letter { font-size: 4em; margin-right: 5px; }\np::first-line { font-weight: bold; }\nh1::before { content: &quot;► &quot;; }\nh2::after  { content: url(new.png); }<\/code><\/pre><p>Syntaxe : <code>sélecteur:pseudo-classe { … }<\/code>. Elle vise un <strong>état<\/strong> ou une <strong>partie<\/strong> de l&#39;élément qu&#39;aucune balise ne marque.<\/p>\n<table>\n<thead>\n<tr>\n<th>Pseudo<\/th>\n<th>Vise<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>:link<\/code>, <code>:visited<\/code><\/td>\n<td>lien non visité, visité<\/td>\n<\/tr>\n<tr>\n<td><code>:hover<\/code><\/td>\n<td>survol de la souris (<strong>sur n&#39;importe quel élément<\/strong>, pas que les liens)<\/td>\n<\/tr>\n<tr>\n<td><code>:active<\/code><\/td>\n<td>moment du clic<\/td>\n<\/tr>\n<tr>\n<td><code>:first-letter<\/code><\/td>\n<td>1re lettre (effet <strong>lettrine<\/strong>)<\/td>\n<\/tr>\n<tr>\n<td><code>:first-line<\/code><\/td>\n<td>1re ligne (dépend de la largeur de la boîte)<\/td>\n<\/tr>\n<tr>\n<td><code>:before<\/code>, <code>:after<\/code><\/td>\n<td>insère un contenu avant / après, <strong>avec <code>content<\/code><\/strong><\/td>\n<\/tr>\n<\/tbody><\/table>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le cours appelle tout cela « pseudo-classes ». En CSS3, <code>first-letter<\/code>, <code>first-line<\/code>, <code>before<\/code>, <code>after<\/code> sont des <strong>pseudo-éléments<\/strong>, notés avec <strong>deux<\/strong> deux-points (<code>::before<\/code>). La notation à un seul <code>:<\/code> marche encore. Les diapos écrivent aussi <code>:firstletter<\/code>, <code>marginleft<\/code> sans tiret : les vrais noms sont <strong><code>:first-letter<\/code><\/strong>, <strong><code>margin-left<\/code><\/strong>.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p><code>:before<\/code> ou <code>:after<\/code> sans propriété <strong><code>content<\/code><\/strong> n&#39;affiche <strong>rien<\/strong>.<\/p>\n<\/aside><h2>Idée 2 · Couleurs : RGB et hexadécimal<\/h2>\n<figure class=\"grille\"><figcaption>Une couleur = 3 octets (rouge, vert, bleu), de 0 à 255 (00 à FF)<\/figcaption><table><tr><th><\/th><th>notation<\/th><th>rouge<\/th><th>vert<\/th><th>bleu<\/th><\/tr><tr><th>blanc<\/th><td>#ffffff<\/td><td class=\"h1\">ff<\/td><td class=\"h2\">ff<\/td><td class=\"h0\">ff<\/td><\/tr><tr><th>orange<\/th><td>#D9824F<\/td><td class=\"h1\">D9<\/td><td class=\"h2\">82<\/td><td class=\"h0\">4F<\/td><\/tr><tr><th>noir<\/th><td>#000<\/td><td class=\"h1\">0<\/td><td class=\"h2\">0<\/td><td class=\"h0\">0<\/td><\/tr><\/table><\/figure><table>\n<thead>\n<tr>\n<th>Notation<\/th>\n<th>Blanc<\/th>\n<th>Remarque<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>hexadécimale<\/td>\n<td><code>#ffffff<\/code><\/td>\n<td>2 chiffres hexa par couleur<\/td>\n<\/tr>\n<tr>\n<td>hexa courte<\/td>\n<td><code>#fff<\/code><\/td>\n<td>chaque chiffre est <strong>doublé<\/strong> : <code>#f80<\/code> = <code>#ff8800<\/code><\/td>\n<\/tr>\n<tr>\n<td>RGB<\/td>\n<td><code>rgb(255, 255, 255)<\/code><\/td>\n<td>0 à 255<\/td>\n<\/tr>\n<tr>\n<td>HSL<\/td>\n<td><code>hsl(0, 0%, 100%)<\/code><\/td>\n<td>teinte, saturation, luminosité<\/td>\n<\/tr>\n<tr>\n<td>mot clé<\/td>\n<td><code>white<\/code><\/td>\n<td>16 couleurs de base (black, red, navy, purple…)<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>256 × 256 × 256 = <strong>16 777 216<\/strong> couleurs (« plus de 16 millions »). La synthèse est <strong>additive<\/strong> : rouge + vert + bleu au maximum = blanc.<\/p>\n<p>Conversion hexa → RGB, vérifiée par programme (code hors supports, pour t&#39;entraîner) :<\/p>\n<pre class=\"\"><code>function hexVersRgb(hex) {\n  let h = hex.replace(&quot;#&quot;, &quot;&quot;);\n  if (h.length === 3) h = h.split(&quot;&quot;).map(c =&gt; c + c).join(&quot;&quot;);  // forme courte doublée\n  const r = parseInt(h.slice(0, 2), 16);\n  const g = parseInt(h.slice(2, 4), 16);\n  const b = parseInt(h.slice(4, 6), 16);\n  return `rgb(${r}, ${g}, ${b})`;\n}\nconsole.log(hexVersRgb(&quot;#000080&quot;));\nconsole.log(hexVersRgb(&quot;#800080&quot;));\nconsole.log(hexVersRgb(&quot;#fc0&quot;));\nconsole.log(256 ** 3);<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>rgb(0, 0, 128)\nrgb(128, 0, 128)\nrgb(255, 204, 0)\n16777216<\/code><\/pre><figure class=\"etapes\" data-i=\"0\"><figcaption>Lire #800080 (couleur des labels du TD) à la main<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · Découpe en 3 paires<\/div><p>80 | 00 | 80.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · Convertis chaque paire<\/div><p>80 en hexa = 8 × 16 + 0 = 128 ; 00 = 0.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · Lis<\/div><p>rgb(128, 0, 128) : autant de rouge que de bleu, pas de vert → violet (<code>purple<\/code>).<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Idée 3 · Polices : font-family, taille, style, raccourci font<\/h2>\n<pre class=\"\"><code>body { font-family: Arial, Helvetica, sans-serif; }   /* liste de secours */\nh1   { font-family: &quot;Times New Roman&quot;, serif; }       /* guillemets si espaces */\nh3   { font-style: italic; }                           /* normal | italic | oblique */\np    { font-weight: bold; }                            /* normal | bold | 100..900 */\np    { font-size: 12pt; }\n.caps { font-variant: small-caps; }                    /* petites majuscules */\n\np { font: italic bold small-caps 24pt Arial, sans-serif; }   /* raccourci */<\/code><\/pre><ul>\n<li>Le navigateur prend la <strong>première police installée<\/strong> de la liste ; termine toujours par une <strong>famille générique<\/strong> : <code>serif<\/code>, <code>sans-serif<\/code>, <code>cursive<\/code>, <code>fantasy<\/code>, <code>monospace<\/code>.<\/li>\n<li>Nom avec espaces → <strong>entre guillemets<\/strong>. Les noms ne sont pas sensibles à la casse.<\/li>\n<\/ul>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Raccourci <code>font<\/code> : style, variante, graisse, puis <strong>taille et famille en dernier<\/strong> (obligatoires), séparés par des espaces.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Le TD demande les polices « Bauhaus » ou « Bodoni MT Black » : elles n&#39;existent que si elles sont installées sur le PC. Ajoute toujours une famille générique de secours : <code>font-family: &quot;Bodoni MT Black&quot;, serif;<\/code>.<\/p>\n<\/aside><h2>Idée 4 · Unités et propriétés du texte<\/h2>\n<table>\n<thead>\n<tr>\n<th>Unités absolues (fixes)<\/th>\n<th>Unités relatives (s&#39;adaptent)<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>px<\/code> pixel, <code>pt<\/code> point, <code>cm<\/code>, <code>mm<\/code>, <code>in<\/code> pouce, <code>pc<\/code> pica<\/td>\n<td><code>%<\/code>, <code>em<\/code> (taille de police du parent), <code>rem<\/code> (de la racine)<\/td>\n<\/tr>\n<\/tbody><\/table>\n<pre class=\"\"><code>h1 { text-align: center; text-transform: uppercase; }\np  { text-indent: 1cm; line-height: 1.5; }\na  { text-decoration: none; }        /* underline | overline | line-through | none */\nh1 { letter-spacing: 2pt; }\nh3 { word-spacing: 5pt; }\npre { white-space: pre; }<\/code><\/pre><table>\n<thead>\n<tr>\n<th>Propriété<\/th>\n<th>Valeurs<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>text-align<\/code><\/td>\n<td>left, center, right, justify<\/td>\n<\/tr>\n<tr>\n<td><code>text-transform<\/code><\/td>\n<td>uppercase, lowercase, capitalize<\/td>\n<\/tr>\n<tr>\n<td><code>text-decoration<\/code><\/td>\n<td>underline, overline, line-through, none<\/td>\n<\/tr>\n<tr>\n<td><code>text-indent<\/code><\/td>\n<td>retrait de la 1re ligne<\/td>\n<\/tr>\n<tr>\n<td><code>line-height<\/code><\/td>\n<td>interligne<\/td>\n<\/tr>\n<tr>\n<td><code>letter-spacing<\/code> / <code>word-spacing<\/code><\/td>\n<td>espace entre lettres / entre mots<\/td>\n<\/tr>\n<\/tbody><\/table>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le cours cite <code>text-decoration: blink<\/code> : cette valeur est <strong>ignorée<\/strong> par les navigateurs actuels. Il écrit aussi <code>heigh: 100px<\/code> (lire <strong><code>height<\/code><\/strong>).<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Mise en forme<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Convertis <code>#C0C0C0<\/code> en rgb : quelle valeur obtiens-tu pour chaque composante ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>C = 12, donc C0 = 12 × 16.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 192<\/b><\/p><p>C0 = 12 × 16 + 0 = 192 pour les trois : <strong>rgb(192, 192, 192)<\/strong>, le gris argent (<code>silver<\/code>).<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Écris les règles du TP 1 : liens rouges, gras, non soulignés ; au survol verts et soulignés.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><pre class=\"\"><code>a { color: red; text-decoration: none; font-weight: bold; }\na:hover { color: green; text-decoration: underline; }<\/code><\/pre><div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Réécris avec le raccourci <code>font<\/code> : <code>font-style: italic; font-weight: bold; font-size: 20pt; font-family: Georgia, serif;<\/code><\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>font: italic bold 20pt Georgia, serif;<\/code><\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Écris la règle du TD pour <code>legend<\/code> : gras, couleur #000080, taille 40 pt, police Bauhaus.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>legend { font-weight: bold; color: #000080; font-size: 40pt; font-family: &quot;Bauhaus 93&quot;, sans-serif; }<\/code> (le nom exact installé sous Windows est souvent « Bauhaus 93 »).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 10 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quelle propriété change la couleur du texte ?<\/div><button class=\"opt\" data-o=\"0\"><code>font-color<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>text-color<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>color<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\"><code>a:hover<\/code> s&#39;applique…<\/div><button class=\"opt\" data-o=\"0\">aux liens déjà visités<\/button><button class=\"opt\" data-o=\"1\">au survol de la souris<\/button><button class=\"opt\" data-o=\"2\">au moment du clic<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Que faut-il pour qu&#39;un <code>h1::before<\/code> affiche quelque chose ?<\/div><button class=\"opt\" data-o=\"0\"><code>display: block<\/code><\/button><button class=\"opt\" data-o=\"1\">la propriété <code>content<\/code><\/button><button class=\"opt\" data-o=\"2\">un attribut <code>before<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\"><code>#f80<\/code> équivaut à…<\/div><button class=\"opt\" data-o=\"0\"><code>#ff8800<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>#f80000<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>#0f0080<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\"><code>rgb(255, 255, 255)<\/code> est…<\/div><button class=\"opt\" data-o=\"0\">noir<\/button><button class=\"opt\" data-o=\"1\">blanc<\/button><button class=\"opt\" data-o=\"2\">rouge<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Pourquoi terminer <code>font-family<\/code> par <code>sans-serif<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">c&#39;est obligatoire en CSS3<\/button><button class=\"opt\" data-o=\"1\">c&#39;est une police de secours si les autres manquent<\/button><button class=\"opt\" data-o=\"2\">pour mettre le texte en gras<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\"><code>font-variant: small-caps<\/code> donne…<\/div><button class=\"opt\" data-o=\"0\">du texte barré<\/button><button class=\"opt\" data-o=\"1\">des petites majuscules<\/button><button class=\"opt\" data-o=\"2\">du texte en exposant<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Quelle unité est relative ?<\/div><button class=\"opt\" data-o=\"0\"><code>px<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>cm<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>em<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\"><code>text-transform: capitalize<\/code> …<\/div><button class=\"opt\" data-o=\"0\">met tout en majuscules<\/button><button class=\"opt\" data-o=\"1\">met la première lettre de chaque mot en majuscule<\/button><button class=\"opt\" data-o=\"2\">met tout en minuscules<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Dans le raccourci <code>font<\/code>, quels éléments sont obligatoires ?<\/div><button class=\"opt\" data-o=\"0\">le style et la graisse<\/button><button class=\"opt\" data-o=\"1\">la taille et la famille<\/button><button class=\"opt\" data-o=\"2\">la variante<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"css-pseudo-couleurs-polices","rep":null,"tol":null},{"n":"css-pseudo-couleurs-polices","rep":["192"],"tol":null},{"n":"css-pseudo-couleurs-polices","rep":null,"tol":null},{"n":"css-pseudo-couleurs-polices","rep":null,"tol":null},{"n":"css-pseudo-couleurs-polices","rep":null,"tol":null}],"qcm":[{"n":"css-pseudo-couleurs-polices","q":"Quelle propriété change la couleur du texte ?","o":["<code>font-color<\/code>","<code>text-color<\/code>","<code>color<\/code>"],"a":2,"e":"<code>font-color<\/code> n&#39;existe pas."},{"n":"css-pseudo-couleurs-polices","q":"<code>a:hover<\/code> s&#39;applique…","o":["aux liens déjà visités","au survol de la souris","au moment du clic"],"a":1,"e":"Le clic, c&#39;est <code>:active<\/code>."},{"n":"css-pseudo-couleurs-polices","q":"Que faut-il pour qu&#39;un <code>h1::before<\/code> affiche quelque chose ?","o":["<code>display: block<\/code>","la propriété <code>content<\/code>","un attribut <code>before<\/code>"],"a":1,"e":"Sans <code>content<\/code>, aucun contenu n&#39;est inséré."},{"n":"css-pseudo-couleurs-polices","q":"<code>#f80<\/code> équivaut à…","o":["<code>#ff8800<\/code>","<code>#f80000<\/code>","<code>#0f0080<\/code>"],"a":0,"e":"Chaque chiffre est doublé."},{"n":"css-pseudo-couleurs-polices","q":"<code>rgb(255, 255, 255)<\/code> est…","o":["noir","blanc","rouge"],"a":1,"e":"Synthèse additive : tout au maximum = blanc."},{"n":"css-pseudo-couleurs-polices","q":"Pourquoi terminer <code>font-family<\/code> par <code>sans-serif<\/code> ?","o":["c&#39;est obligatoire en CSS3","c&#39;est une police de secours si les autres manquent","pour mettre le texte en gras"],"a":1,"e":"Le navigateur prend la première police disponible."},{"n":"css-pseudo-couleurs-polices","q":"<code>font-variant: small-caps<\/code> donne…","o":["du texte barré","des petites majuscules","du texte en exposant"],"a":1,"e":"Petites capitales."},{"n":"css-pseudo-couleurs-polices","q":"Quelle unité est relative ?","o":["<code>px<\/code>","<code>cm<\/code>","<code>em<\/code>"],"a":2,"e":"<code>em<\/code> dépend de la taille de police du parent."},{"n":"css-pseudo-couleurs-polices","q":"<code>text-transform: capitalize<\/code> …","o":["met tout en majuscules","met la première lettre de chaque mot en majuscule","met tout en minuscules"],"a":1,"e":"<code>uppercase<\/code> met tout en majuscules."},{"n":"css-pseudo-couleurs-polices","q":"Dans le raccourci <code>font<\/code>, quels éléments sont obligatoires ?","o":["le style et la graisse","la taille et la famille","la variante"],"a":1,"e":"<code>font: 24pt Arial;<\/code> est valide ; <code>font: italic bold;<\/code> ne l&#39;est pas."}]},{"id":"css-boite-fonds-listes","t":"CSS3 (3) · arrière-plans, modèle de boîte, listes et menu","seance":"Partie III · CSS3, boîtes · TP 2","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu dois savoir écrire une règle CSS et distinguer bloc / en ligne (chapitres 3 et 6).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Par défaut, des <code>&lt;li&gt;<\/code> s&#39;affichent-ils côte à côte ou l&#39;un sous l&#39;autre ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>L&#39;un sous l&#39;autre : ce sont des éléments <strong>bloc<\/strong> (plus précisément <code>list-item<\/code>). Pour en faire un menu horizontal, il faudra changer leur <code>display<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Chaque élément est une boîte rectangulaire.<\/strong> Du centre vers l&#39;extérieur : contenu, padding, bordure, marge. Dès qu&#39;un espacement te gêne, demande-toi : est-il <strong>dedans<\/strong> (padding) ou <strong>dehors<\/strong> (margin) ?<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Confondre <code>padding<\/code> et <code>margin<\/code>. Le padding prend la <strong>couleur de fond<\/strong> de l&#39;élément ; la marge est <strong>transparente<\/strong>. Si le fond « déborde », c&#39;est du padding.<\/p>\n<\/aside><p>À la fin, tu sais poser une image de fond, régler marges, bordures et padding (avec les raccourcis à 1, 2 ou 4 valeurs), arrondir des coins, ajouter une ombre et transformer une liste en menu horizontal.<\/p>\n<h2>Idée 1 · Le modèle de boîte<\/h2>\n<svg viewBox=\"0 0 520 250\" style=\"width:100%;max-width:520px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Modèle de boîte : de l'extérieur vers l'intérieur, margin (transparente), border, padding, puis le contenu\">\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\">\n<rect x=\"10\" y=\"10\" width=\"500\" height=\"230\" fill=\"none\" stroke=\"currentColor\" stroke-dasharray=\"6 4\"/><text x=\"260\" y=\"30\">margin (extérieur, transparente)<\/text>\n<rect x=\"50\" y=\"42\" width=\"420\" height=\"166\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"6\"/><text x=\"260\" y=\"66\" fill=\"#D9824F\">border<\/text>\n<rect x=\"90\" y=\"78\" width=\"340\" height=\"104\" fill=\"#D9824F\" fill-opacity=\"0.15\" stroke=\"currentColor\"/><text x=\"260\" y=\"98\">padding (intérieur, a le fond)<\/text>\n<rect x=\"170\" y=\"110\" width=\"180\" height=\"56\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"260\" y=\"143\" font-weight=\"700\">contenu<\/text>\n<\/g><\/svg><pre class=\"\"><code>section {\n    padding: 20px;               /* espace intérieur */\n    border: 1px solid #ccc;      /* épaisseur, style, couleur */\n    margin: 10px;                /* espace extérieur */\n    border-radius: 8px;          /* coins arrondis */\n    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);   /* ombre : x y flou couleur */\n}<\/code><\/pre><figure class=\"etapes\" data-i=\"0\"><figcaption>Les raccourcis margin / padding (sens des aiguilles d'une montre)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · 1 valeur<\/div><p><code>margin: 10px<\/code> → les 4 côtés.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · 2 valeurs<\/div><p><code>margin: 10px 20px<\/code> → haut et bas 10, gauche et droite 20.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · 4 valeurs<\/div><p><code>margin: 1px 2px 3px 4px<\/code> → <strong>haut, droite, bas, gauche<\/strong> (TRouBLe : Top Right Bottom Left).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Côté seul<\/div><p><code>margin-top<\/code>, <code>margin-right<\/code>, <code>margin-bottom<\/code>, <code>margin-left<\/code> (pareil pour <code>padding-…<\/code>).<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p><strong>Exemple chiffré.<\/strong> Une boîte <code>width: 200px; padding: 10px; border: 2px solid;<\/code> occupe à l&#39;écran 200 + 2×10 + 2×2 = <strong>224 px<\/strong> de large (sans compter les marges).<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Ce calcul suppose <code>box-sizing: content-box<\/code> (valeur par défaut, hors supports). Avec <code>box-sizing: border-box<\/code>, la largeur 200 px <strong>inclut<\/strong> padding et bordure.<\/p>\n<\/aside><h2>Idée 2 · Bordures<\/h2>\n<table>\n<thead>\n<tr>\n<th>Propriété<\/th>\n<th>Valeurs<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>border-width<\/code> (ou <code>border-top-width<\/code>…)<\/td>\n<td><code>thin<\/code>, <code>medium<\/code>, <code>thick<\/code>, ou une longueur<\/td>\n<\/tr>\n<tr>\n<td><code>border-style<\/code><\/td>\n<td><code>none<\/code>, <code>solid<\/code>, <code>dotted<\/code>, <code>dashed<\/code>, <code>double<\/code>, <code>groove<\/code>, <code>ridge<\/code>, <code>inset<\/code>, <code>outset<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>border-color<\/code><\/td>\n<td>une couleur<\/td>\n<\/tr>\n<tr>\n<td><code>border<\/code><\/td>\n<td>raccourci : <code>border: 3px solid red;<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>border-radius<\/code><\/td>\n<td>coins arrondis ; <code>50%<\/code> sur une image carrée = <strong>photo ronde<\/strong> (bonus TP 2)<\/td>\n<\/tr>\n<\/tbody><\/table>\n<aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Sans <code>border-style<\/code>, une bordure <strong>ne s&#39;affiche pas<\/strong>, même avec une épaisseur et une couleur : le style par défaut est <code>none<\/code>.<\/p>\n<\/aside><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>La diapo écrit <code>{border-style: soliddashed}<\/code> : il manque l&#39;espace. <code>border-style: solid dashed;<\/code> donne haut/bas pleins et gauche/droite en tirets.<\/p>\n<\/aside><h2>Idée 3 · Arrière-plans<\/h2>\n<pre class=\"\"><code>header {\n    background-color: #003366;\n    background-image: url(img/fond.jpg);\n    background-repeat: no-repeat;        /* repeat | repeat-x | repeat-y | no-repeat */\n    background-position: right top;\n    background-attachment: fixed;        /* scroll | fixed */\n}\np { background: url(motif.gif) repeat-x fixed; }   /* raccourci */<\/code><\/pre><table>\n<thead>\n<tr>\n<th>Propriété<\/th>\n<th>Rôle<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>background-color<\/code><\/td>\n<td>couleur de fond (ou <code>transparent<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><code>background-image<\/code><\/td>\n<td>image de fond, <strong>avec <code>url(...)<\/code><\/strong><\/td>\n<\/tr>\n<tr>\n<td><code>background-repeat<\/code><\/td>\n<td><code>repeat-x<\/code> : répète <strong>horizontalement<\/strong> ; <code>repeat-y<\/code> : <strong>verticalement<\/strong><\/td>\n<\/tr>\n<tr>\n<td><code>background-position<\/code><\/td>\n<td>position (<code>top/center/bottom<\/code>, <code>left/center/right<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><code>background-attachment<\/code><\/td>\n<td><code>fixed<\/code> : l&#39;image ne défile pas avec la page<\/td>\n<\/tr>\n<\/tbody><\/table>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Erreurs des diapos : <code>background-image: image.gif<\/code> doit s&#39;écrire <strong><code>background-image: url(image.gif)<\/code><\/strong> ; <code>repeat-x<\/code> ne veut pas dire « x = nombre de répétitions » mais « répéter selon l&#39;axe <strong>x<\/strong> » ; <code>background-repeat: repeat4<\/code> n&#39;existe pas ; <code>background-attachement<\/code> s&#39;écrit <strong><code>background-attachment<\/code><\/strong>.<\/p>\n<\/aside><h2>Idée 4 · Listes et menu horizontal (TP 2)<\/h2>\n<pre class=\"\"><code>ul { list-style-type: square; }          /* disc | circle | square | decimal | lower-roman | upper-alpha… */\nol { list-style-image: url(puce.png); }\nul { list-style-position: inside; }      /* inside | outside */<\/code><\/pre><figure class=\"flux\"><figcaption>Transformer une liste en menu (TP 2, exercice 4)<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">nav ul : list-style none + padding 0<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">nav li : display inline-block<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">nav li : margin-right pour espacer<\/div><\/div><\/figure><pre class=\"\"><code>nav ul { list-style: none; padding: 0; }\nnav li { display: inline-block; margin-right: 15px; }\nnav a  { color: white; text-decoration: none; }<\/code><\/pre><nav style=\"background:#003366;padding:10px 14px;border-radius:6px;margin:10px 0\">\n<ul style=\"list-style:none;padding:0;margin:0\">\n<li style=\"display:inline-block;margin-right:15px\"><a href=\"#\" style=\"color:#fff;text-decoration:none\" onclick=\"return false\">Accueil<\/a><\/li>\n<li style=\"display:inline-block;margin-right:15px\"><a href=\"#\" style=\"color:#fff;text-decoration:none\" onclick=\"return false\">À propos<\/a><\/li>\n<li style=\"display:inline-block;margin-right:15px\"><a href=\"#\" style=\"color:#fff;text-decoration:none\" onclick=\"return false\">Contact<\/a><\/li>\n<\/ul><\/nav><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p><code>display: inline-block<\/code> met les éléments <strong>côte à côte<\/strong> (comme en ligne) tout en acceptant <strong>largeur, hauteur, marges et padding<\/strong> (comme un bloc). Le TD l&#39;utilise aussi pour aligner les <code>label<\/code>.<\/p>\n<\/aside><p><strong>Bonus du TD : transition.<\/strong> <code>transition: all 3s;<\/code> anime le changement de style ; <code>transform: translateX(10px);<\/code> déplace l&#39;élément de 10 px vers la droite.<\/p>\n<pre class=\"\"><code>input[type=submit]:hover {\n    transition: all 3s;\n    transform: translateX(10px);\n    background-color: purple;\n    color: #ACF;\n}<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p><code>transition<\/code>, <code>transform<\/code>, <code>box-shadow<\/code> et <code>border-radius<\/code> apparaissent dans le TD et le TP 2 mais <strong>ne sont pas expliqués dans les diapos<\/strong>. Pour que la transition joue aussi au retour, on la place plutôt sur l&#39;état normal (<code>input[type=submit] { transition: all 3s; }<\/code>).<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Boîtes et menu<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Une boîte a <code>width: 300px; padding: 15px; border: 5px solid black; margin: 20px;<\/code>. Quelle largeur occupe sa <strong>bordure extérieure<\/strong> (sans la marge) ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>largeur + 2 × padding + 2 × bordure.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 340<\/b><\/p><p>300 + 2×15 + 2×5 = <strong>340 px<\/strong>. Avec la marge, l&#39;espace total réservé est 380 px.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Que donne <code>padding: 5px 10px 15px 20px;<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Haut 5 px, droite 10 px, bas 15 px, gauche 20 px (sens des aiguilles d&#39;une montre).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Écris le CSS du TP 2, exercice 2 : sections avec padding 20 px, marge 10 px, bordure fine grise ; header fond bleu foncé, texte blanc.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><pre class=\"\"><code>section { padding: 20px; margin: 10px; border: 1px solid #ccc; }\nheader { background-color: #003366; color: white; }<\/code><\/pre><div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Rends ronde une image de profil de classe <code>profile-pic<\/code> large de 150 px.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>.profile-pic { width: 150px; height: 150px; border-radius: 50%; }<\/code> (l&#39;image doit être carrée pour un cercle parfait).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 10 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">De l&#39;intérieur vers l&#39;extérieur, la boîte CSS est…<\/div><button class=\"opt\" data-o=\"0\">contenu, margin, border, padding<\/button><button class=\"opt\" data-o=\"1\">contenu, padding, border, margin<\/button><button class=\"opt\" data-o=\"2\">contenu, border, padding, margin<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Quel espace prend la couleur de fond de l&#39;élément ?<\/div><button class=\"opt\" data-o=\"0\">le padding<\/button><button class=\"opt\" data-o=\"1\">la margin<\/button><button class=\"opt\" data-o=\"2\">aucun des deux<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\"><code>margin: 10px 20px;<\/code> donne…<\/div><button class=\"opt\" data-o=\"0\">haut/bas 10px, gauche/droite 20px<\/button><button class=\"opt\" data-o=\"1\">haut 10px, droite 20px, rien ailleurs<\/button><button class=\"opt\" data-o=\"2\">gauche/droite 10px, haut/bas 20px<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\"><code>width: 100px; padding: 10px; border: 1px solid;<\/code> (content-box) : largeur visible ?<\/div><button class=\"opt\" data-o=\"0\">100 px<\/button><button class=\"opt\" data-o=\"1\">111 px<\/button><button class=\"opt\" data-o=\"2\">122 px<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Pourquoi <code>border: 2px red;<\/code> n&#39;affiche rien ?<\/div><button class=\"opt\" data-o=\"0\">il manque l&#39;unité<\/button><button class=\"opt\" data-o=\"1\">il manque le style (solid…)<\/button><button class=\"opt\" data-o=\"2\"><code>red<\/code> est invalide<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">La bonne écriture d&#39;une image de fond est…<\/div><button class=\"opt\" data-o=\"0\"><code>background-image: fond.jpg;<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>background-image: url(fond.jpg);<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>background: src(fond.jpg);<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\"><code>background-repeat: repeat-y<\/code> …<\/div><button class=\"opt\" data-o=\"0\">répète l&#39;image y fois<\/button><button class=\"opt\" data-o=\"1\">répète l&#39;image verticalement<\/b
