utton><button class=\"opt\" data-o=\"2\">ne répète pas l&#39;image<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Pour enlever les puces d&#39;une liste :<\/div><button class=\"opt\" data-o=\"0\"><code>list-style-type: disc<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>list-style: none<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>display: none<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Pour mettre des <code>li<\/code> côte à côte en gardant marges et padding :<\/div><button class=\"opt\" data-o=\"0\"><code>display: block<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>display: inline-block<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>float: none<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\"><code>border-radius: 50%<\/code> sur une image carrée donne…<\/div><button class=\"opt\" data-o=\"0\">une image cachée<\/button><button class=\"opt\" data-o=\"1\">une image ronde<\/button><button class=\"opt\" data-o=\"2\">une image deux fois plus petite<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"css-boite-fonds-listes","rep":null,"tol":null},{"n":"css-boite-fonds-listes","rep":["340"],"tol":null},{"n":"css-boite-fonds-listes","rep":null,"tol":null},{"n":"css-boite-fonds-listes","rep":null,"tol":null},{"n":"css-boite-fonds-listes","rep":null,"tol":null}],"qcm":[{"n":"css-boite-fonds-listes","q":"De l&#39;intérieur vers l&#39;extérieur, la boîte CSS est…","o":["contenu, margin, border, padding","contenu, padding, border, margin","contenu, border, padding, margin"],"a":1,"e":"Le padding est entre le contenu et la bordure."},{"n":"css-boite-fonds-listes","q":"Quel espace prend la couleur de fond de l&#39;élément ?","o":["le padding","la margin","aucun des deux"],"a":0,"e":"La marge est transparente."},{"n":"css-boite-fonds-listes","q":"<code>margin: 10px 20px;<\/code> donne…","o":["haut/bas 10px, gauche/droite 20px","haut 10px, droite 20px, rien ailleurs","gauche/droite 10px, haut/bas 20px"],"a":0,"e":"Deux valeurs : vertical puis horizontal."},{"n":"css-boite-fonds-listes","q":"<code>width: 100px; padding: 10px; border: 1px solid;<\/code> (content-box) : largeur visible ?","o":["100 px","111 px","122 px"],"a":2,"e":"100 + 2×10 + 2×1."},{"n":"css-boite-fonds-listes","q":"Pourquoi <code>border: 2px red;<\/code> n&#39;affiche rien ?","o":["il manque l&#39;unité","il manque le style (solid…)","<code>red<\/code> est invalide"],"a":1,"e":"Le style par défaut est <code>none<\/code>."},{"n":"css-boite-fonds-listes","q":"La bonne écriture d&#39;une image de fond est…","o":["<code>background-image: fond.jpg;<\/code>","<code>background-image: url(fond.jpg);<\/code>","<code>background: src(fond.jpg);<\/code>"],"a":1,"e":"La diapo oublie <code>url()<\/code>."},{"n":"css-boite-fonds-listes","q":"<code>background-repeat: repeat-y<\/code> …","o":["répète l&#39;image y fois","répète l&#39;image verticalement","ne répète pas l&#39;image"],"a":1,"e":"x = horizontal, y = vertical."},{"n":"css-boite-fonds-listes","q":"Pour enlever les puces d&#39;une liste :","o":["<code>list-style-type: disc<\/code>","<code>list-style: none<\/code>","<code>display: none<\/code>"],"a":1,"e":"<code>display: none<\/code> cacherait toute la liste."},{"n":"css-boite-fonds-listes","q":"Pour mettre des <code>li<\/code> côte à côte en gardant marges et padding :","o":["<code>display: block<\/code>","<code>display: inline-block<\/code>","<code>float: none<\/code>"],"a":1,"e":"C&#39;est la méthode du TP 2."},{"n":"css-boite-fonds-listes","q":"<code>border-radius: 50%<\/code> sur une image carrée donne…","o":["une image cachée","une image ronde","une image deux fois plus petite"],"a":1,"e":"Bonus du TP 2."}]},{"id":"td-tp-corriges","t":"TD et TP 1-2 corrigés","seance":"TD Web 1 (exercices 1 à 3) · TP 1 · TP 2","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut avoir vu les formulaires (chapitre 5) et les sélecteurs CSS (chapitre 6). Le TD réutilise presque tout le cours.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Quel sélecteur CSS vise uniquement les <code>&lt;input type=&quot;text&quot;&gt;<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>input[type=text]<\/code> (sélecteur de valeur d&#39;attribut).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Cherche d&#39;abord, compare ensuite.<\/strong> Lis l&#39;énoncé, écris ta solution dans VS Code, ouvre-la dans le navigateur, puis seulement lis le corrigé.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Le corrigé manuscrit distribué contient des <strong>fautes<\/strong> (balise <code>meta<\/code> à la place de <code>link<\/code>, <code>classe=<\/code> au lieu de <code>class=<\/code>). Ne le recopie pas les yeux fermés : les corrections sont signalées ci-dessous.<\/p>\n<\/aside><p>À la fin, tu sais refaire les trois exercices du TD et le mini-projet portfolio des TP 1 et 2.<\/p>\n<h2>Idée 1 · TD, exercice 1 : formulaire dans un tableau<\/h2>\n<p><strong>Énoncé.<\/strong> Reproduire un formulaire : Num_CIN*, Nom*, Prénom*, Ville, Adresse Email*, la mention « (*) Champs obligatoires », une liste de cases « Modules de formation proposés » (HTML, JavaScript, PHP), et deux boutons Envoyer / Annuler, le tout dans un tableau bordé.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Méthode<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Compter les colonnes<\/div><p>2 colonnes (libellé | champ). Les lignes « Modules » et « boutons » prennent toute la largeur → <code>colspan=&quot;2&quot;<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · Un champ = une rangée<\/div><p><code>&lt;tr&gt;&lt;td&gt;&lt;label&gt;&lt;/td&gt;&lt;td&gt;&lt;input&gt;&lt;/td&gt;&lt;/tr&gt;<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · Obligatoires<\/div><p>les champs avec * reçoivent <code>required<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · Cases<\/div><p><code>type=&quot;checkbox&quot;<\/code>, chacune avec un <code>name<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · Boutons<\/div><p><code>submit<\/code> et <code>reset<\/code>.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><pre class=\"\"><code>&lt;!DOCTYPE html&gt;\n&lt;html lang=&quot;fr&quot;&gt;\n&lt;head&gt;\n    &lt;meta charset=&quot;UTF-8&quot;&gt;\n    &lt;title&gt;Exercice 1&lt;/title&gt;\n&lt;/head&gt;\n&lt;body&gt;\n&lt;form method=&quot;post&quot; action=&quot;&quot;&gt;\n    &lt;table border=&quot;1&quot;&gt;\n        &lt;tr&gt;&lt;td&gt;&lt;label for=&quot;cin&quot;&gt;Num_CIN*&lt;/label&gt;&lt;/td&gt;\n            &lt;td&gt;&lt;input type=&quot;text&quot; name=&quot;cin&quot; id=&quot;cin&quot; required&gt;&lt;/td&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;&lt;label for=&quot;nom&quot;&gt;Nom*&lt;/label&gt;&lt;/td&gt;\n            &lt;td&gt;&lt;input type=&quot;text&quot; name=&quot;nom&quot; id=&quot;nom&quot; required&gt;&lt;/td&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;&lt;label for=&quot;prenom&quot;&gt;Prenom*&lt;/label&gt;&lt;/td&gt;\n            &lt;td&gt;&lt;input type=&quot;text&quot; name=&quot;prenom&quot; id=&quot;prenom&quot; required&gt;&lt;/td&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;&lt;label for=&quot;ville&quot;&gt;Ville&lt;/label&gt;&lt;/td&gt;\n            &lt;td&gt;&lt;input type=&quot;text&quot; name=&quot;ville&quot; id=&quot;ville&quot;&gt;&lt;/td&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;&lt;label for=&quot;email&quot;&gt;Adresse Email*&lt;/label&gt;&lt;/td&gt;\n            &lt;td&gt;&lt;input type=&quot;email&quot; name=&quot;email&quot; id=&quot;email&quot; required&gt;&lt;/td&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;(*) Champs obligatoires&lt;/td&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;Modules de formation proposés&lt;br&gt;\n            &lt;input type=&quot;checkbox&quot; name=&quot;html&quot; id=&quot;m1&quot;&gt; &lt;label for=&quot;m1&quot;&gt;Le Langage HTML&lt;/label&gt;&lt;br&gt;\n            &lt;input type=&quot;checkbox&quot; name=&quot;js&quot; id=&quot;m2&quot;&gt; &lt;label for=&quot;m2&quot;&gt;Le Langage Javascript&lt;/label&gt;&lt;br&gt;\n            &lt;input type=&quot;checkbox&quot; name=&quot;php&quot; id=&quot;m3&quot;&gt; &lt;label for=&quot;m3&quot;&gt;Le Langage PHP&lt;/label&gt;\n        &lt;/td&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;\n            &lt;input type=&quot;submit&quot; value=&quot;Envoyer&quot;&gt; &lt;input type=&quot;reset&quot; value=&quot;Annuler&quot;&gt;\n        &lt;/td&gt;&lt;/tr&gt;\n    &lt;/table&gt;\n&lt;/form&gt;\n&lt;/body&gt;\n&lt;/html&gt;<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le corrigé manuscrit met <code>id<\/code> mais <strong>pas de <code>name<\/code><\/strong> sur les <code>input<\/code> : le formulaire s&#39;affiche, mais rien ne serait envoyé au serveur. On a ajouté <code>name<\/code>. On a aussi utilisé <code>type=&quot;email&quot;<\/code> pour l&#39;adresse (vu en cours), plus juste que <code>text<\/code>.<\/p>\n<\/aside><h2>Idée 2 · TD, exercice 2 : la page « Inscription EVAX VACCIN » et son style.css<\/h2>\n<p><strong>Énoncé.<\/strong> Une page <code>Inscription.html<\/code> (formulaire dans un <code>fieldset<\/code> avec <code>legend<\/code>, champs dans un tableau) liée à <code>style.css<\/code>. Il faut écrire le CSS à partir d&#39;un tableau de consignes.<\/p>\n<pre class=\"\"><code>&lt;head&gt;\n    &lt;meta charset=&quot;UTF-8&quot;&gt;\n    &lt;title&gt;Inscription&lt;/title&gt;\n    &lt;link rel=&quot;stylesheet&quot; href=&quot;style.css&quot;&gt;\n&lt;/head&gt;\n&lt;body&gt;\n&lt;fieldset&gt;\n    &lt;legend&gt;Inscription EVAX VACCIN&lt;/legend&gt;\n    &lt;form method=&quot;post&quot; action=&quot;&quot;&gt;\n        &lt;table&gt;\n            &lt;tr&gt;&lt;td&gt;&lt;label for=&quot;cin&quot;&gt;cin&lt;/label&gt;&lt;/td&gt;&lt;td&gt;&lt;input type=&quot;text&quot; name=&quot;cin&quot; id=&quot;cin&quot;&gt;&lt;/td&gt;&lt;/tr&gt;\n            &lt;!-- nom, prenom, Tel, code client... --&gt;\n            &lt;tr&gt;&lt;td&gt;&lt;label for=&quot;mdp&quot;&gt;Mot de passe :&lt;/label&gt;&lt;/td&gt;&lt;td&gt;&lt;input type=&quot;password&quot; name=&quot;mdp&quot; id=&quot;mdp&quot;&gt;&lt;/td&gt;&lt;/tr&gt;\n            &lt;tr&gt;&lt;td&gt;&lt;input type=&quot;submit&quot; value=&quot;verif inscription&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;input type=&quot;reset&quot; value=&quot;Annuler&quot;&gt;&lt;/td&gt;&lt;/tr&gt;\n        &lt;/table&gt;\n    &lt;/form&gt;\n&lt;/fieldset&gt;\n&lt;/body&gt;<\/code><\/pre><pre class=\"\"><code>/* style.css */\nfieldset {\n    width: 500px; height: 500px; padding: 2px;\n    border-radius: 15px; background-color: lightblue;\n}\nlegend { font-weight: bold; color: #000080; font-size: 40pt; font-family: &quot;Bauhaus 93&quot;, sans-serif; }\nlabel  { font-family: &quot;Bodoni MT Black&quot;, serif; font-size: 20pt; color: #800080; display: inline-block; }\ninput[type=text] {\n    background-color: lightblue; border: 1px solid red;\n    font-family: Georgia, serif; font-size: 12px;\n    border-radius: 5px; box-shadow: 1px 1px 2px #C0C0C0;\n}\ntable { border: 3px solid red; }\ntd {\n    font-family: &quot;Arial Black&quot;, sans-serif; font-size: 12pt; color: #660033;\n    font-weight: bold; border: 2px solid blue;\n}\ninput[type=submit], input[type=reset] {\n    box-shadow: 10px 10px 20px gray;\n    background-color: #4CAF50;\n    font-family: &quot;Bauhaus 93&quot;, sans-serif; font-size: 20pt; color: #000080;\n    transition: all 3s;\n}\nlegend:hover { color: black; text-shadow: #FC0 1px 0 10px; }\ninput[type=submit]:hover, input[type=reset]:hover {\n    transform: translateX(10px);\n    background-color: purple; color: #ACF;   /* bonus */\n}<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Corrections par rapport à l&#39;énoncé et au corrigé : (1) l&#39;énoncé dit « largeur : 500 » <strong>sans unité<\/strong> : en CSS il faut <code>500px<\/code> ; (2) il écrit <code>box-shadow: 10 px 10px 20px gris<\/code> : il faut <code>10px<\/code> collé et <strong><code>gray<\/code><\/strong> (les mots clés sont en anglais) ; (3) le corrigé écrit les règles CSS <strong>au milieu du HTML<\/strong>, après <code>&lt;legend&gt;<\/code> : elles doivent aller dans le fichier <code>style.css<\/code> (ou dans <code>&lt;style&gt;<\/code>) ; (4) <code>text-shadow<\/code> s&#39;écrit d&#39;habitude <code>1px 0 10px #FC0<\/code>, l&#39;ordre de l&#39;énoncé est aussi accepté.<\/p>\n<\/aside><h2>Idée 3 · TD, exercice 3 : la page CV (structure HTML)<\/h2>\n<figure class=\"flux\"><figcaption>Plan de la page CV<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">head (title, meta, link CV.css)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">header (CV_Nom Prénom)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">section profil (photo | présentation + bouton | contact)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">section compétences (barres)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">section centres d&#39;intérêt (vignettes)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">footer<\/div><\/div><\/figure><pre class=\"\"><code>&lt;!DOCTYPE html&gt;\n&lt;html lang=&quot;fr&quot;&gt;\n&lt;head&gt;\n    &lt;meta charset=&quot;UTF-8&quot;&gt;\n    &lt;title&gt;CV de Hamza Alaoui&lt;/title&gt;\n    &lt;link rel=&quot;stylesheet&quot; href=&quot;CV.css&quot;&gt;\n&lt;/head&gt;\n&lt;body&gt;\n&lt;header&gt;&lt;h1&gt;CV_Hamza Alaoui&lt;/h1&gt;&lt;/header&gt;\n\n&lt;section class=&quot;id-section&quot;&gt;\n    &lt;div class=&quot;photo&quot;&gt;&lt;img src=&quot;photo.jpg&quot; alt=&quot;Photo personnelle&quot;&gt;&lt;/div&gt;\n    &lt;div class=&quot;presentation&quot;&gt;\n        &lt;h2&gt;Qui suis-je ?&lt;/h2&gt;\n        &lt;p&gt;Étudiant MIP S3 à la FSABM.&lt;/p&gt;\n        &lt;a href=&quot;cv.pdf&quot; download&gt;Télécharger mon CV&lt;/a&gt;\n    &lt;/div&gt;\n    &lt;div class=&quot;contact&quot;&gt;\n        &lt;p&gt;Email : hamza@exemple.ma&lt;/p&gt;\n        &lt;p&gt;Tél : 06 00 00 00 00&lt;/p&gt;\n    &lt;/div&gt;\n&lt;/section&gt;\n\n&lt;section&gt;\n    &lt;h2&gt;Compétences&lt;/h2&gt;\n    &lt;h3&gt;Professionnelles&lt;/h3&gt;\n    &lt;p&gt;HTML/CSS&lt;/p&gt;\n    &lt;div class=&quot;conteneur-barre&quot;&gt;&lt;span class=&quot;barre l100&quot;&gt;&lt;/span&gt;&lt;/div&gt;\n    &lt;p&gt;JavaScript&lt;/p&gt;\n    &lt;div class=&quot;conteneur-barre&quot;&gt;&lt;span class=&quot;barre l30&quot;&gt;&lt;/span&gt;&lt;/div&gt;\n    &lt;h3&gt;Personnelles&lt;/h3&gt;\n    &lt;p&gt;Créativité 90 %&lt;/p&gt;\n    &lt;div class=&quot;conteneur-barre&quot;&gt;&lt;span class=&quot;barre l90&quot;&gt;&lt;/span&gt;&lt;/div&gt;\n&lt;/section&gt;\n\n&lt;section class=&quot;interets&quot;&gt;\n    &lt;h2&gt;Centres d'intérêt&lt;/h2&gt;\n    &lt;div class=&quot;vignette&quot;&gt;Football&lt;/div&gt;\n    &lt;div class=&quot;vignette&quot;&gt;Musique&lt;/div&gt;\n&lt;/section&gt;\n\n&lt;footer&gt;&lt;p&gt;CV_Hamza Alaoui · 2025&lt;/p&gt;&lt;/footer&gt;\n&lt;/body&gt;\n&lt;/html&gt;<\/code><\/pre><pre class=\"\"><code>/* CV.css : les barres de compétences */\n.conteneur-barre { background-color: #ddd; width: 300px; height: 12px; border-radius: 6px; }\n.barre { display: block; height: 100%; background-color: #003366; border-radius: 6px; }\n.l100 { width: 100%; }\n.l90  { width: 90%; }\n.l30  { width: 30%; }<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Erreurs du corrigé manuscrit : à la question 1, il écrit <strong><code>&lt;meta charset=&quot;stylesheet&quot; href=&quot;CV.CSS&quot;&gt;<\/code><\/strong> : c&#39;est faux, on lie une feuille de style avec <strong><code>&lt;link rel=&quot;stylesheet&quot; href=&quot;CV.css&quot;&gt;<\/code><\/strong> (et il manque le vrai <code>&lt;meta charset=&quot;UTF-8&quot;&gt;<\/code>). Il écrit aussi <code>classe=&quot;...&quot;<\/code> au lieu de <strong><code>class=&quot;...&quot;<\/code><\/strong>. Le <code>span<\/code> d&#39;une barre doit être en <code>display: block<\/code> (ou <code>inline-block<\/code>) pour que <code>width<\/code> s&#39;applique : sur un élément en ligne, <code>width<\/code> est ignoré.<\/p>\n<\/aside><h2>Idée 4 · TP 1 et TP 2 : le mini-projet portfolio<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>TP 1 · Structure &amp; style<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Ex. 1 : dossiers<\/div><p><code>TP_Web_NomPrenom/index.html<\/code> et <code>TP_Web_NomPrenom/css/style.css<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Ex. 2 : squelette<\/div><p>DOCTYPE, <code>html lang=&quot;fr&quot;<\/code>, <code>meta charset=&quot;UTF-8&quot;<\/code>, <code>title<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Ex. 3 : contenu<\/div><p><code>h1<\/code>, <code>h2<\/code> « À propos », deux <code>p<\/code> avec <code>strong<\/code>/<code>em<\/code>, une <code>ul<\/code> de 3 points, un lien <code>target=&quot;_blank&quot;<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Ex. 4 : CSS<\/div><p><code>&lt;link rel=&quot;stylesheet&quot; href=&quot;css/style.css&quot;&gt;<\/code> ; <code>body<\/code> (police, fond), <code>h1<\/code> (couleur, centré), liens sans soulignement + <code>a:hover<\/code>.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><figure class=\"etapes\" data-i=\"0\"><figcaption>TP 2 · Sémantique, médias, boîte, menu<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Ex. 1 : sémantique<\/div><p><code>h1<\/code> + menu dans <code>&lt;header&gt;<\/code> (menu dans <code>&lt;nav&gt;<\/code>), contenu dans <code>&lt;main&gt;<\/code> découpé en <code>&lt;section id=&quot;about&quot;&gt;<\/code>, <code>&lt;section id=&quot;skills&quot;&gt;<\/code>, bas de page dans <code>&lt;footer&gt;<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · Ex. 2 : box model<\/div><p><code>section { padding: 20px; margin: 10px; border: 1px solid #ccc; }<\/code>, header foncé avec texte blanc.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · Ex. 3 : médias<\/div><p><code>&lt;img src=&quot;img/profil.jpg&quot; alt=&quot;...&quot; class=&quot;profile-pic&quot;&gt;<\/code> avec <code>width: 150px<\/code>, vidéo <code>&lt;video controls&gt;<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · Ex. 4 : menu<\/div><p><code>nav ul { list-style: none; padding: 0; }<\/code>, <code>nav li { display: inline-block; margin-right: 15px; }<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · Bonus<\/div><p><code>border-radius: 50%<\/code> (photo ronde), <code>box-shadow: 0 4px 8px rgba(0,0,0,0.1)<\/code>, <code>background-image: url(...)<\/code> sur le header.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><pre class=\"\"><code>&lt;body&gt;\n    &lt;header&gt;\n        &lt;h1&gt;Mon Portfolio&lt;/h1&gt;\n        &lt;nav&gt;\n            &lt;ul&gt;\n                &lt;li&gt;&lt;a href=&quot;#about&quot;&gt;À propos&lt;/a&gt;&lt;/li&gt;\n                &lt;li&gt;&lt;a href=&quot;#skills&quot;&gt;Compétences&lt;/a&gt;&lt;/li&gt;\n            &lt;/ul&gt;\n        &lt;/nav&gt;\n    &lt;/header&gt;\n    &lt;main&gt;\n        &lt;section id=&quot;about&quot;&gt;\n            &lt;h2&gt;À propos&lt;/h2&gt;\n            &lt;img src=&quot;img/profil.jpg&quot; alt=&quot;Photo de Hamza&quot; class=&quot;profile-pic&quot;&gt;\n            &lt;p&gt;Je suis &lt;strong&gt;étudiant&lt;/strong&gt; en &lt;em&gt;MIP&lt;/em&gt;.&lt;/p&gt;\n        &lt;/section&gt;\n        &lt;section id=&quot;skills&quot;&gt;\n            &lt;h2&gt;Compétences&lt;/h2&gt;\n            &lt;ul&gt;&lt;li&gt;HTML5&lt;/li&gt;&lt;li&gt;CSS3&lt;/li&gt;&lt;li&gt;Travail en équipe&lt;/li&gt;&lt;/ul&gt;\n        &lt;/section&gt;\n    &lt;/main&gt;\n    &lt;footer&gt;&lt;a href=&quot;mailto:hamza@exemple.ma&quot;&gt;Contact&lt;/a&gt; · © 2025&lt;/footer&gt;\n&lt;/body&gt;<\/code><\/pre><aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Les liens du menu pointent vers <code>#about<\/code> et <code>#skills<\/code> : ce sont des <strong>liens internes<\/strong> (chapitre 3) grâce aux <code>id<\/code> des sections.<\/p>\n<\/aside><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le code d&#39;exemple du TP 1 en PDF contient des espaces parasites (<code>font - family<\/code>, <code># f4f4f4<\/code>) dus à la mise en page : en vrai, il n&#39;y a <strong>aucun espace<\/strong> dans <code>font-family<\/code> ni dans <code>#f4f4f4<\/code>.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Refaire sans regarder<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Écris la rangée du TD 1 « Modules de formation proposés » avec ses 3 cases à cocher, sur toute la largeur d&#39;un tableau à 2 colonnes.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><pre class=\"\"><code>&lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;Modules de formation proposés&lt;br&gt;\n    &lt;input type=&quot;checkbox&quot; name=&quot;html&quot; id=&quot;m1&quot;&gt; &lt;label for=&quot;m1&quot;&gt;Le Langage HTML&lt;/label&gt;&lt;br&gt;\n    &lt;input type=&quot;checkbox&quot; name=&quot;js&quot; id=&quot;m2&quot;&gt; &lt;label for=&quot;m2&quot;&gt;Le Langage Javascript&lt;/label&gt;&lt;br&gt;\n    &lt;input type=&quot;checkbox&quot; name=&quot;php&quot; id=&quot;m3&quot;&gt; &lt;label for=&quot;m3&quot;&gt;Le Langage PHP&lt;/label&gt;\n&lt;/td&gt;&lt;/tr&gt;<\/code><\/pre><div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Trouve les 2 erreurs : <code>&lt;meta charset=&quot;stylesheet&quot; href=&quot;CV.CSS&quot;&gt;<\/code><\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>On a mélangé deux balises. Il faut <code>&lt;meta charset=&quot;UTF-8&quot;&gt;<\/code> <strong>et<\/strong> <code>&lt;link rel=&quot;stylesheet&quot; href=&quot;CV.css&quot;&gt;<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Écris la règle qui fait glisser les boutons de 10 px vers la droite en 3 secondes au survol.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><pre class=\"\"><code>input[type=submit] { transition: all 3s; }\ninput[type=submit]:hover { transform: translateX(10px); }<\/code><\/pre><div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Pourquoi <code>&lt;span class=&quot;barre&quot; style=&quot;width:90%&quot;&gt;<\/code> n&#39;a pas de largeur visible ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>span<\/code> est un élément <strong>en ligne<\/strong> : <code>width<\/code> ne s&#39;y applique pas. Il faut <code>display: block<\/code> ou <code>inline-block<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Dans le TD 1, quel attribut rend un champ obligatoire ?<\/div><button class=\"opt\" data-o=\"0\"><code>obligatoire<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>required<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>needed<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">La rangée « Modules » sur toute la largeur d&#39;un tableau à 2 colonnes utilise…<\/div><button class=\"opt\" data-o=\"0\"><code>colspan=&quot;2&quot;<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>rowspan=&quot;2&quot;<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>width=&quot;2&quot;<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Quel sélecteur vise les zones de texte du TD 2 ?<\/div><button class=\"opt\" data-o=\"0\"><code>input.text<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>input[type=text]<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>#text<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div ass=\"qq\" data-k=\"8\"><div class=\"qq-q\">Pour mettre les <code>li<\/code> du menu du TP 2 côte à côte :<\/div><button class=\"opt\" data-o=\"0\"><code>float: center<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>display: inline-block<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>list-style: inline<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Que manque-t-il au corrigé manuscrit du TD 1 pour envoyer les données ?<\/div><button class=\"opt\" data-o=\"0\">l&#39;attribut <code>id<\/code><\/button><button class=\"opt\" data-o=\"1\">l&#39;attribut <code>name<\/code> sur les champs<\/button><button class=\"opt\" data-o=\"2\">la balise <code>&lt;table&gt;<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"td-tp-corriges","rep":null,"tol":null},{"n":"td-tp-corriges","rep":null,"tol":null},{"n":"td-tp-corriges","rep":null,"tol":null},{"n":"td-tp-corriges","rep":null,"tol":null},{"n":"td-tp-corriges","rep":null,"tol":null}],"qcm":[{"n":"td-tp-corriges","q":"Dans le TD 1, quel attribut rend un champ obligatoire ?","o":["<code>obligatoire<\/code>","<code>required<\/code>","<code>needed<\/code>"],"a":1,"e":"Attribut booléen HTML5."},{"n":"td-tp-corriges","q":"La rangée « Modules » sur toute la largeur d&#39;un tableau à 2 colonnes utilise…","o":["<code>colspan=&quot;2&quot;<\/code>","<code>rowspan=&quot;2&quot;<\/code>","<code>width=&quot;2&quot;<\/code>"],"a":0,"e":"Elle couvre 2 colonnes."},{"n":"td-tp-corriges","q":"Quel sélecteur vise les zones de texte du TD 2 ?","o":["<code>input.text<\/code>","<code>input[type=text]<\/code>","<code>#text<\/code>"],"a":1,"e":"Sélecteur de valeur d&#39;attribut."},{"n":"td-tp-corriges","q":"<code>width: 500;<\/code> (sans unité) en CSS…","o":["vaut 500 pixels","est ignoré","vaut 500 %"],"a":1,"e":"Une longueur non nulle exige une unité."},{"n":"td-tp-corriges","q":"<code>box-shadow: 10px 10px 20px gris;<\/code> ne marche pas car…","o":["<code>gris<\/code> n&#39;est pas un mot clé CSS","il faut 4 nombres","box-shadow n&#39;existe pas"],"a":0,"e":"Les mots clés sont en anglais : <code>gray<\/code>."},{"n":"td-tp-corriges","q":"Dans le TD 3, comment lier <code>CV.css<\/code> ?","o":["<code>&lt;meta charset=&quot;stylesheet&quot; href=&quot;CV.css&quot;&gt;<\/code>","<code>&lt;link rel=&quot;stylesheet&quot; href=&quot;CV.css&quot;&gt;<\/code>","<code>&lt;style src=&quot;CV.css&quot;&gt;<\/code>"],"a":1,"e":"Le corrigé manuscrit se trompe de balise."},{"n":"td-tp-corriges","q":"Dans le TP 2, la balise qui contient le contenu principal est…","o":["<code>&lt;aside&gt;<\/code>","<code>&lt;main&gt;<\/code>","<code>&lt;nav&gt;<\/code>"],"a":1,"e":"<code>main<\/code> regroupe les sections principales."},{"n":"td-tp-corriges","q":"Un <code>span<\/code> avec <code>width: 90%<\/code> n&#39;a pas de largeur. Pourquoi ?","o":["<code>%<\/code> est interdit","un élément en ligne ignore <code>width<\/code>","il faut <code>height<\/code>"],"a":1,"e":"Ajoute <code>display: block<\/code> ou <code>inline-block<\/code>."},{"n":"td-tp-corriges","q":"Pour mettre les <code>li<\/code> du menu du TP 2 côte à côte :","o":["<code>float: center<\/code>","<code>display: inline-block<\/code>","<code>list-style: inline<\/code>"],"a":1,"e":"Méthode demandée dans l&#39;exercice 4."},{"n":"td-tp-corriges","q":"Que manque-t-il au corrigé manuscrit du TD 1 pour envoyer les données ?","o":["l&#39;attribut <code>id<\/code>","l&#39;attribut <code>name<\/code> sur les champs","la balise <code>&lt;table&gt;<\/code>"],"a":1,"e":"Sans <code>name<\/code>, rien n&#39;est transmis."}]},{"id":"revision-examen-blanc","t":"Révision et examen blanc","seance":"Avant l'examen","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Ce chapitre suppose que tu as fait les QCM des chapitres 1 à 9. Aucune annale de Web 1 n&#39;a été fournie : l&#39;examen blanc ci-dessous reprend <strong>le style du TD<\/strong> (écrire du HTML et du CSS à partir d&#39;une consigne) et des questions de cours.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Sans regarder : écris le squelette HTML5 complet d&#39;une page en français liée à <code>style.css<\/code>.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><pre class=\"\"><code>&lt;!DOCTYPE html&gt;\n&lt;html lang=&quot;fr&quot;&gt;\n&lt;head&gt;\n    &lt;meta charset=&quot;UTF-8&quot;&gt;\n    &lt;title&gt;Page&lt;/title&gt;\n    &lt;link rel=&quot;stylesheet&quot; href=&quot;style.css&quot;&gt;\n&lt;/head&gt;\n&lt;body&gt;\n&lt;/body&gt;\n&lt;/html&gt;<\/code><\/pre><p>Si tu as hésité sur une ligne, relis le chapitre 2 avant l&#39;examen blanc.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Fais l&#39;examen blanc en temps limité (1 h 30), sur papier<\/strong>, comme le jour J. Le TD est écrit à la main : entraîne-toi à écrire du code sans éditeur ni autocomplétion.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>À l&#39;écrit, les fautes qui coûtent le plus : balises mal fermées, <code>name<\/code> oublié, point/dièse oublié devant une classe/un id, unité oubliée (<code>500<\/code> au lieu de <code>500px<\/code>), <code>meta<\/code> confondu avec <code>link<\/code>.<\/p>\n<\/aside><p>À la fin, tu sais où tu en es sur chaque partie du cours.<\/p>\n<h2>Idée 1 · La fiche de révision en une page<\/h2>\n<figure class=\"grille\"><figcaption>Les 12 choses à savoir par cœur<\/figcaption><table><tr><th>thème<\/th><th>à_retenir<\/th><\/tr><tr><td>HTTP<\/td><td class=\"h1\">requête<\/td><td>=<\/td><td>commande<\/td><td>+<\/td><td>en-têtes<\/td><td>+<\/td><td>ligne<\/td><td>vide<\/td><td>+<\/td><td>corps<\/td><\/tr><tr><td>URL<\/td><td class=\"h1\">protocole://hôte/chemin/page?requête<\/td><\/tr><tr><td>Squelette<\/td><td class=\"h1\">DOCTYPE,<\/td><td>html<\/td><td>lang,<\/td><td>head<\/td><td>(meta<\/td><td>charset,<\/td><td>title,<\/td><td>link),<\/td><td>body<\/td><\/tr><tr><td>Sémantique<\/td><td class=\"h1\">header,<\/td><td>nav,<\/td><td>section,<\/td><td>article,<\/td><td>aside,<\/td><td>footer<\/td><td>(+<\/td><td>main)<\/td><\/tr><tr><td>Bloc/en_ligne<\/td><td class=\"h1\">p<\/td><td>h1<\/td><td>div<\/td><td>ul<\/td><td>table<\/td><td>form<\/td><td>/<\/td><td>strong<\/td><td>em<\/td><td>a<\/td><td>img<\/td><td>span<\/td><td>input<\/td><\/tr><tr><td>Liens<\/td><td class=\"h1\">href,<\/td><td>target=&quot;_blank&quot;,<\/td><td>#id,<\/td><td>mailto:<\/td><\/tr><tr><td>Tableaux<\/td><td class=\"h1\">table<\/td><td>caption<\/td><td>tr<\/td><td>th<\/td><td>td,<\/td><td>colspan,<\/td><td>rowspan<\/td><\/tr><tr><td>Formulaires<\/td><td class=\"h1\">method<\/td><td>get/post,<\/td><td>action,<\/td><td>name,<\/td><td>label<\/td><td>for=id<\/td><\/tr><tr><td>Choix<\/td><td class=\"h1\">select/option,<\/td><td>radio<\/td><td>(même<\/td><td>name),<\/td><td>checkbox<\/td><\/tr><tr><td>CSS_où<\/td><td class=\"h1\">en<\/td><td>ligne<\/td><td>&lt;<\/td><td>interne<\/td><td>&lt;<\/td><td>externe<\/td><td>(recommandée)<\/td><\/tr><tr><td>Sélecteurs<\/td><td class=\"h1\">p<\/td><td>.classe<\/td><td>#id<\/td><td>div_p<\/td><td>h3+p<\/td><td>[attr]<\/td><td>:hover<\/td><\/tr><tr><td>Boîte<\/td><td class=\"h1\">contenu<\/td><td>&lt;<\/td><td>padding<\/td><td>&lt;<\/td><td>border<\/td><td>&lt;<\/td><td>margin<\/td><\/tr><\/table><\/figure><figure class=\"flux\"><figcaption>Méthode pour une question « écrire le CSS d'après un tableau de consignes » (TD 2)<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">Une ligne du tableau = une règle<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">traduire l&#39;élément en sélecteur<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">traduire chaque consigne en propriété: valeur<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">vérifier unités et mots clés anglais<\/div><\/div><\/figure><h2>Idée 2 · Examen blanc (1 h 30)<\/h2>\n<p><strong>Partie A · Questions de cours (6 points).<\/strong> Réponds dans les exercices ci-dessous.<\/p>\n<section class=\"exo\"><h3>Partie A · Cours<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>(1 pt) Différence entre internet et le web ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Internet est le réseau mondial de réseaux (TCP/IP). Le web est un service qui l&#39;utilise : des pages reliées par des hyperliens, transmises par HTTP, nommées par des URL, affichées par des navigateurs.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>(1,5 pt) Décris la structure d&#39;une réponse HTTP et donne un exemple de ligne de statut.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Ligne de statut, champs d&#39;en-tête, ligne vide, corps (le document). Exemple : <code>HTTP/1.1 404 Not Found<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>(1 pt) Page statique vs dynamique ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Statique : fichier HTML envoyé tel quel par le serveur. Dynamique : générée à chaque demande par un programme côté serveur (PHP…), selon des données (BD, formulaires, cookies).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>(1,5 pt) Cite les trois façons d&#39;appliquer du CSS et dis laquelle le prof recommande, et pourquoi.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>En ligne (attribut <code>style<\/code>), interne (<code>&lt;style&gt;<\/code> dans <code>&lt;head&gt;<\/code>), externe (<code>&lt;link&gt;<\/code> vers un <code>.css<\/code>). L&#39;externe : une seule feuille pour tout le site, séparation contenu/présentation, cohérence, mise à jour en un endroit.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>(1 pt) GET ou POST pour un formulaire de connexion ? Justifie.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><strong>POST<\/strong> : les données passent dans le corps de la requête et n&#39;apparaissent pas dans l&#39;URL (ni dans l&#39;historique). GET afficherait le mot de passe dans l&#39;adresse.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><p><strong>Partie B · HTML (7 points).<\/strong><\/p>\n<section class=\"exo\"><h3>Partie B · HTML<\/h3><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><p>(4 pts) Écris le formulaire « Inscription au club » : un <code>fieldset<\/code> de légende « Club Info FSABM », Nom (obligatoire), Email (type email), Filière (liste : MIP, MIPC, BCG), Niveau (radio : S1, S3, S5), Intérêts (cases : Web, Réseaux, IA), un fichier « photo », boutons Envoyer et Annuler. Envoi en POST vers <code>club.php<\/code>.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><pre class=\"\"><code>&lt;form method=&quot;post&quot; action=&quot;club.php&quot; enctype=&quot;multipart/form-data&quot;&gt;\n  &lt;fieldset&gt;\n    &lt;legend&gt;Club Info FSABM&lt;/legend&gt;\n    &lt;label for=&quot;nom&quot;&gt;Nom :&lt;/label&gt;\n    &lt;input type=&quot;text&quot; name=&quot;nom&quot; id=&quot;nom&quot; required&gt;&lt;br&gt;\n    &lt;label for=&quot;email&quot;&gt;Email :&lt;/label&gt;\n    &lt;input type=&quot;email&quot; name=&quot;email&quot; id=&quot;email&quot;&gt;&lt;br&gt;\n    &lt;label for=&quot;fil&quot;&gt;Filière :&lt;/label&gt;\n    &lt;select name=&quot;filiere&quot; id=&quot;fil&quot;&gt;\n      &lt;option value=&quot;MIP&quot;&gt;MIP&lt;/option&gt;\n      &lt;option value=&quot;MIPC&quot;&gt;MIPC&lt;/option&gt;\n      &lt;option value=&quot;BCG&quot;&gt;BCG&lt;/option&gt;\n    &lt;/select&gt;&lt;br&gt;\n    Niveau :\n    &lt;input type=&quot;radio&quot; name=&quot;niveau&quot; value=&quot;S1&quot; id=&quot;s1&quot;&gt;&lt;label for=&quot;s1&quot;&gt;S1&lt;/label&gt;\n    &lt;input type=&quot;radio&quot; name=&quot;niveau&quot; value=&quot;S3&quot; id=&quot;s3&quot;&gt;&lt;label for=&quot;s3&quot;&gt;S3&lt;/label&gt;\n    &lt;input type=&quot;radio&quot; name=&quot;niveau&quot; value=&quot;S5&quot; id=&quot;s5&quot;&gt;&lt;label for=&quot;s5&quot;&gt;S5&lt;/label&gt;&lt;br&gt;\n    Intérêts :\n    &lt;input type=&quot;checkbox&quot; name=&quot;web&quot; id=&quot;w&quot;&gt;&lt;label for=&quot;w&quot;&gt;Web&lt;/label&gt;\n    &lt;input type=&quot;checkbox&quot; name=&quot;reseaux&quot; id=&quot;r&quot;&gt;&lt;label for=&quot;r&quot;&gt;Réseaux&lt;/label&gt;\n    &lt;input type=&quot;checkbox&quot; name=&quot;ia&quot; id=&quot;i&quot;&gt;&lt;label for=&quot;i&quot;&gt;IA&lt;/label&gt;&lt;br&gt;\n    &lt;input type=&quot;file&quot; name=&quot;photo&quot;&gt;&lt;br&gt;\n    &lt;input type=&quot;submit&quot; value=&quot;Envoyer&quot;&gt; &lt;input type=&quot;reset&quot; value=&quot;Annuler&quot;&gt;\n  &lt;/fieldset&gt;\n&lt;/form&gt;<\/code><\/pre><p>Barème indicatif : <code>form<\/code> + method/action/enctype (1), champs + labels (1), select (0,5), radio même name (0,5), checkbox (0,5), file + boutons (0,5).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"7\"><div class=\"ex-q\"><p>(3 pts) Écris le tableau : une 1re cellule « Emploi du temps » sur 3 colonnes ; puis une rangée « Lundi | Web 1 | Amphi 2 » ; une cellule « Mardi » sur 2 rangées avec « Analyse | Salle 5 » puis « Algèbre | Salle 7 ».<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><pre class=\"\"><code>&lt;table border=&quot;1&quot;&gt;\n  &lt;tr&gt;&lt;th colspan=&quot;3&quot;&gt;Emploi du temps&lt;/th&gt;&lt;/tr&gt;\n  &lt;tr&gt;&lt;td&gt;Lundi&lt;/td&gt;&lt;td&gt;Web 1&lt;/td&gt;&lt;td&gt;Amphi 2&lt;/td&gt;&lt;/tr&gt;\n  &lt;tr&gt;&lt;td rowspan=&quot;2&quot;&gt;Mardi&lt;/td&gt;&lt;td&gt;Analyse&lt;/td&gt;&lt;td&gt;Salle 5&lt;/td&gt;&lt;/tr&gt;\n  &lt;tr&gt;&lt;td&gt;Algèbre&lt;/td&gt;&lt;td&gt;Salle 7&lt;/td&gt;&lt;/tr&gt;\n&lt;/table&gt;<\/code><\/pre><p>La dernière rangée n&#39;a que <strong>2<\/strong> cellules : « Mardi » occupe déjà la 1re colonne.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><p><strong>Partie C · CSS (7 points).<\/strong><\/p>\n<section class=\"exo\"><h3>Partie C · CSS<\/h3><div class=\"ex\" data-x=\"8\"><div class=\"ex-q\"><p>(4 pts) Écris le CSS : <code>fieldset<\/code> large de 450 px, coins arrondis de 10 px, fond <code>#f4f4f4<\/code> ; <code>legend<\/code> en gras, 24 pt, couleur <code>#003366<\/code> ; les <code>label<\/code> en <code>inline-block<\/code> larges de 120 px ; les zones de texte avec bordure solide 1 px grise et coins de 5 px ; au survol des boutons, fond vert et texte blanc.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><pre class=\"\"><code>fieldset { width: 450px; border-radius: 10px; background-color: #f4f4f4; }\nlegend { font-weight: bold; font-size: 24pt; color: #003366; }\nlabel { display: inline-block; width: 120px; }\ninput[type=text], input[type=email] { border: 1px solid gray; border-radius: 5px; }\ninput[type=submit]:hover, input[type=reset]:hover { background-color: green; color: white; }<\/code><\/pre><div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"9\"><div class=\"ex-q\"><p>(1,5 pt) Une <code>div<\/code> a <code>width: 250px; padding: 20px; border: 5px solid; margin: 10px;<\/code>. Largeur occupée bordure comprise (content-box) ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 300<\/b><\/p><p>250 + 2×20 + 2×5 = <strong>300 px<\/strong> (320 px avec les marges).<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"10\"><div class=\"ex-q\"><p>(1,5 pt) <code>p { color: red; }<\/code>, <code>.info { color: blue; }<\/code>, <code>#a1 { color: green; }<\/code>. Couleur de <code>&lt;p class=&quot;info&quot; id=&quot;a1&quot;&gt;<\/code> ? Et de <code>&lt;p class=&quot;info&quot;&gt;<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Vert (l&#39;id est le plus spécifique), puis bleu (la classe bat la balise).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Pièges de dernière minute<\/h3><div class=\"ex\" data-x=\"11\"><div class=\"ex-q\"><p>Trouve les 4 erreurs : <code>&lt;a href=&quot;#contact&quot; target=&quot;_balnk&quot;&gt;<\/code> … <code>&lt;div id=&quot;contact&quot;&gt;&lt;p class=&quot;.note&quot;&gt;Écrire&lt;/div&gt;&lt;/p&gt;<\/code><\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>_balnk<\/code> → <code>_blank<\/code> ; <code>class=&quot;.note&quot;<\/code> → <code>class=&quot;note&quot;<\/code> (pas de point dans le HTML) ; fermetures inversées : <code>&lt;/p&gt;&lt;/div&gt;<\/code> ; le lien interne est correct (<code>#contact<\/code> vers <code>id=&quot;contact&quot;<\/code>).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"12\"><div class=\"ex-q\"><p>Pourquoi <code>h1:after { color: red; }<\/code> n&#39;affiche rien ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Il manque <code>content<\/code> : <code>h1:after { content: &quot; ★&quot;; color: red; }<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 6 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quel code ouvre un lien dans un nouvel onglet ?<\/div><button class=\"opt\" data-o=\"0\"><code>target=&quot;_new&quot;<\/c     if (lastQ.length) mem.push('SES DERNIÈRES QUESTIONS :\n' + lastQ.map((x) => '- ' + x).join('\n'));
    const rules = `Tu es le tuteur de ${C.student}, pour le module ${C.module}${C.prof ? ' du ' + C.prof : ''}. Il apprend souvent la notion pour la première fois.
Règles : réponds en français simple, en Markdown léger (**gras** pour les termes clés, tirets, étapes numérotées, formules et calculs entre accents graves ; pas de tableaux). ${style} Appuie-toi d'abord sur l'EXTRAIT ci-dessous et sur les conventions du prof ; si une source générale diffère du cours, signale l'écart et dis quelle version utiliser à l'examen (celle du prof). Pour un calcul, pose chaque étape et vérifie-la. S'il envoie une réponse ou une photo de brouillon, corrige étape par étape et nomme précisément l'erreur. Si tu n'es pas sûr, dis-le. S'il demande un mini-exercice, donne l'exercice sans la solution.
Utilise sa mémoire pour faire des liens avec ses confusions passées, sans la réciter.
Termine TOUJOURS par une dernière ligne séparée au format exact « MÉMO: … » qui résume en 15 mots maximum la difficulté révélée par sa question (ou « MÉMO: rien »). Cette ligne lui est cachée.
${C.conventions ? 'CONVENTIONS DU PROF : ' + C.conventions + '\n' : ''}MÉMOIRE DE L'ÉLÈVE :
${mem.join('\n\n') || '(rien pour l\'instant)'}
EXTRAIT (${c.label}) :
${c.text.slice(0, deep ? 9000 : 3500)}`;
    const recent = cur.msgs.slice(deep ? -9 : -5, -1).map((m) => ({ role: m.r === 'u' ? 'user' : 'assistant', content: m.t }));
    while (recent.length && recent[0].role !== 'user') recent.shift();
    const msgs = [...recent.filter((m) => m.content && m.content.trim()), { role: 'user', content: q }]; while (msgs.length > 1 && msgs[0].role !== 'user') msgs.shift(); msgs[0] = { role: 'user', content: rules + '\n\n---\nQuestion : ' + msgs[0].content };
    ctl = new AbortController();
    const opts = { modelTier: deep ? 'complex' : 'quick', cache: false, signal: ctl.signal, onText: ({ text }) => { out.innerHTML = md(visible(text)); $('#mztLog').scrollTop = 1e9; } };
    if (img) opts.images = [img];
    try {
      const r = await sample(msgs, opts);
      const mm = r.text.match(/(?:^|\n)\s*M[ÉE]MO\s*:\s*(.+)\s*$/i);
      cur.msgs.push({ r: 'a', t: visible(r.text) + (r.truncated ? '\n\n(Réponse coupée : pose une question plus ciblée.)' : ''), d: !!deep });
      if (mm && !/^\s*rien/i.test(mm[1])) { ST.memos.push({ date: today(), text: mm[1].trim().slice(0, 160) }); if (ST.memos.length > 30) ST.memos.shift(); saveMemos(); }
      await saveThread(cur);
    } catch (e) {
      const kept = e && e.text ? visible(e.text) : '';
      if (e && e.code === 'cancelled') { if (kept) cur.msgs.push({ r: 'a', t: kept + '\n(Arrêté.)' }); else cur.msgs.pop(); }
      else { cur.msgs.pop(); out.textContent = (kept ? kept + '\n\n' : '') + (ERR[e && e.code] || 'Le tuteur n\'a pas pu répondre. Réessaie dans un instant.'); }
      if (!cur.msgs.length) ST.threads = ST.threads.filter((t) => t !== cur);
      saveLocal();
      if (!(e && e.code === 'cancelled')) { busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImgN').textContent = ''; return; }
    }
    busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImg').value = ''; $('#mztImgN').textContent = ''; renderLog();
  }

  // ---------- événements ----------
  $('#mztBtn').onclick = () => openPanel(null);
  $('#mztX').onclick = closePanel;
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#mztPan').hidden) closePanel(); });
  $('#mztTabH').onclick = () => view($('#mztHist').hidden ? 'hist' : 'chat');
  $('#mztTabM').onclick = () => view($('#mztMem').hidden ? 'mem' : 'chat');
  $('#mztQ').oninput = renderList;
  $('#mztList').onclick = (e) => { const id = e.target.dataset && e.target.dataset.cont; if (!id) return; cur = ST.threads.find((t) => t.id === id); view('chat'); $('#mztCtx').textContent = '· ' + cur.sec; renderLog(); };
  $('#mztMemL').onclick = (e) => { const i = e.target.dataset && e.target.dataset.memdel; if (i == null) return; ST.memos.splice(+i, 1); saveMemos(); renderMem(); };
  $('#mztChips').onclick = (e) => { const b = e.target.closest('[data-chip]'); if (!b) return; const t = $('#mztIn'); t.value = b.dataset.chip + (t.value ? ' : ' + t.value : ''); t.focus(); };
  $('#mztNew').onclick = () => { cur = null; renderLog(); };
  $('#mztStop').onclick = () => { if (ctl) ctl.abort(); };
  $('#mztImg').onchange = (e) => { img = e.target.files[0] || null; $('#mztImgN').textContent = img ? 'Photo : ' + img.name : ''; };
  $('#mztF').onsubmit = (e) => { e.preventDefault(); const v = $('#mztIn').value; $('#mztIn').value = ''; ask(v); };
  $('#mztIn').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#mztF').requestSubmit(); } });

  // ---------- capacités (facultatives) ----------
  const W = window.claude;
  if (W && W.use) {
    W.use('sample').then((s) => { sample = s; ready = true; note();
      if (s && s.limits) s.limits().then((l) => { if (l && l.images) { imgOK = true; $('#mztImgL').hidden = false; if (l.images.mediaTypes) $('#mztImg').accept = l.images.mediaTypes.join(','); } }).catch(() => {});
    }).catch(() => { ready = true; note(); });
    Promise.all([W.use('db'), W.use('user')]).then(async ([d, u]) => {
      if (!d || !u) return; const id = await u.id(); if (!id) return; db = d; base = 'data/users/' + id + '/mzt_' + C.id;
      try {
        const m = await db.doc(base).get(); if (m.exists) { const v = m.data() || {}; if (Array.isArray(v.memos)) ST.memos = JSON.parse(JSON.stringify(v.memos)); }
        const q = await db.collection(base + '/threads').get(); const remote = q.docs.map((x) => Object.assign({ id: x.id }, JSON.parse(JSON.stringify(x.data() || {}))));
        const map = {}; [...ST.threads, ...remote].forEach((t) => { if (!map[t.id] || (t.msgs || []).length > (map[t.id].msgs || []).length) map[t.id] = t; });
        ST.threads = Object.values(map).sort((a, b) => parseInt(a.id.slice(1), 36) - parseInt(b.id.slice(1), 36)); saveLocal();
      } catch (e) {}
    }).catch(() => {});
  } else { ready = true; note(); }

  window.MZT = { open: openPanel, close: closePanel };
})();

</script>

if(window.top===window&&location.protocol==="file:"){a.hidden=true;return}
a.href=p.indexOf("/decouvrir")===0||location.pathname.indexOf("/decouvrir")===0?"/decouvrir":"/app/modules";})();</script>
