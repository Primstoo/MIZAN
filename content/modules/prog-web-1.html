<script>
const MODULE={"slug":"prog-web-1","titre":"Programmation Web 1","cle":"prog-web-1_scores","cleEtat":"prog-web-1_scores_etat","format":"score10","intro":"<p>Ce module suit <strong>le plan du Pr Falih<\/strong> : généralités du web, puis <strong>HTML5<\/strong>, puis <strong>CSS3<\/strong>. Il se termine par <strong>le TD et les deux TP corrigés<\/strong> et un <strong>examen blanc<\/strong>.<\/p>\n<p><strong>Chaque chapitre a trois temps<\/strong><\/p>\n<ol>\n<li><strong>Avant de commencer<\/strong> : ce qu&#39;il faut déjà savoir, avec une question pour vérifier.<\/li>\n<li><strong>Comment l&#39;aborder<\/strong> : l&#39;état d&#39;esprit, et le piège classique.<\/li>\n<li><strong>Les idées, illustrées<\/strong> : un schéma, une phrase, un exemple de code.<\/li>\n<\/ol>\n<p>Termine par le QCM : <strong>8/10 = chapitre maîtrisé<\/strong>.<\/p>\n<p><strong>Le conseil qui change tout<\/strong> : ouvre un fichier <code>index.html<\/code> dans VS Code et tape les exemples. Ouvre-le dans <strong>deux navigateurs<\/strong>, comme le conseille le prof.<\/p>\n<p><strong>À savoir<\/strong> : les diapos datent de 2024-2025 et contiennent quelques balises obsolètes et fautes de frappe. Elles sont signalées dans des encadrés « Attention », avec la version correcte. Le format de l&#39;examen n&#39;est pas public : demande-le au prof.<\/p>\n","annexes":[],"cartes":null,"maths":false};
const CHAPS=[{"id":"generalites-web","t":"Généralités · internet, web, HTTP et client-serveur","seance":"Partie I · Généralités","imp":3,"html":"<h2>Avant de commencer<\/h2>\n<p>Aucun prérequis technique : il suffit d&#39;avoir déjà ouvert un site dans un navigateur. On va mettre des mots précis sur ce que tu fais chaque jour.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Quand tu tapes <code>https://www.google.fr<\/code> dans ton navigateur, qui « fabrique » la page que tu vois : ton ordinateur ou une autre machine ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Une autre machine, le <strong>serveur<\/strong>, envoie le code de la page (HTML, CSS). Ton <strong>navigateur<\/strong> (le client) se contente de l&#39;interpréter et de l&#39;afficher. Tout ce chapitre décrit ce dialogue.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense en dialogue.<\/strong> Le web, c&#39;est un client qui demande et un serveur qui répond. Chaque notion du chapitre (HTTP, URL, statique/dynamique, front/back) se place sur ce dialogue.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Internet et le web, <strong>ce n&#39;est pas la même chose<\/strong>. Internet est le réseau (les câbles, TCP/IP). Le web est <strong>un service<\/strong> qui tourne dessus, comme le mail ou le FTP.<\/p>\n<\/aside><p>À la fin, tu sais définir internet, le web et le W3C, lire une URL, décrire une requête et une réponse HTTP, et classer un langage en front-end ou back-end.<\/p>\n<h2>Idée 1 · Internet est le réseau, le web est un service dessus<\/h2>\n<figure class=\"flux\"><figcaption>Du réseau à la page<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">Internet (réseau de réseaux, TCP/IP)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Web (pages + hyperliens, HTTP)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Navigateur (affiche les pages)<\/div><\/div><\/figure><ul>\n<li><strong>Internet<\/strong> (<em>INTERconnected NETwork<\/em>) : réseau mondial de machines interconnectées. Il porte plusieurs applications : courrier électronique, transfert de fichiers (FTP), messagerie instantanée, peer-to-peer…<\/li>\n<li><strong>Web<\/strong> (<em>World Wide Web<\/em>), créé par <strong>Tim Berners-Lee en 1989<\/strong> : un système d&#39;information réparti en <strong>pages web<\/strong> reliées par des <strong>hyperliens<\/strong>. Il repose sur internet et utilise <strong>HTTP/HTTPS<\/strong>, des adresses (<strong>URL<\/strong>), des langages (HTML, CSS…) et des <strong>navigateurs<\/strong>.<\/li>\n<li><strong>W3C<\/strong> (<em>World Wide Web Consortium<\/em>), fondé par Berners-Lee : l&#39;organisme qui <strong>normalise<\/strong> les technologies du web. Sa devise : « un seul web partout et pour tous ».<\/li>\n<\/ul>\n<p>Exemple : envoyer un mail Gmail via l&#39;application mobile utilise internet <strong>sans<\/strong> passer par une page web.<\/p>\n<figure class=\"grille\"><figcaption>Les quatre âges du web (selon le cours)<\/figcaption><table><tr><th><\/th><th>Version<\/th><th>Nom<\/th><th>Idée<\/th><\/tr><tr><th>1<\/th><td>Web<\/td><td>1.0<\/td><td class=\"h1\">statique<\/td><td>sites<\/td><td>vitrines,<\/td><td>peu<\/td><td>d'interaction<\/td><\/tr><tr><th>2<\/th><td>Web<\/td><td>2.0<\/td><td class=\"h1\">social<\/td><td>partage,<\/td><td>réseaux<\/td><td>sociaux,<\/td><td>blogs,<\/td><td>smartphones<\/td><\/tr><tr><th>3<\/th><td>Web<\/td><td>3.0<\/td><td class=\"h1\">sémantique<\/td><td>la<\/td><td>machine<\/td><td>comprend<\/td><td>les<\/td><td>données,<\/td><td>profil<\/td><\/tr><tr><th>4<\/th><td>Web<\/td><td>4.0<\/td><td class=\"h1\">connecté<\/td><td>objets<\/td><td>connectés<\/td><td>(IoT)<\/td><td>+<\/td><td>IA<\/td><\/tr><\/table><\/figure><h2>Idée 2 · HTTP : une requête, une réponse<\/h2>\n<svg viewBox=\"0 0 600 190\" style=\"width:100%;max-width:600px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Le client envoie une requête HTTP au serveur, qui renvoie une réponse avec un code d'état et le document\">\n<g font-family=\"sans-serif\" font-size=\"14\" fill=\"currentColor\" text-anchor=\"middle\">\n<rect x=\"20\" y=\"50\" width=\"150\" height=\"80\" rx=\"10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<text x=\"95\" y=\"85\">Client<\/text><text x=\"95\" y=\"105\" font-size=\"12\">(navigateur)<\/text>\n<rect x=\"430\" y=\"50\" width=\"150\" height=\"80\" rx=\"10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<text x=\"505\" y=\"85\">Serveur<\/text><text x=\"505\" y=\"105\" font-size=\"12\">(Apache…)<\/text>\n<line x1=\"175\" y1=\"70\" x2=\"420\" y2=\"70\" stroke=\"#D9824F\" stroke-width=\"3\"/><polygon points=\"420,64 430,70 420,76\" fill=\"#D9824F\"/>\n<text x=\"300\" y=\"58\" fill=\"#D9824F\">1. Requête : GET /page.html HTTP/1.1<\/text>\n<line x1=\"425\" y1=\"115\" x2=\"180\" y2=\"115\" stroke=\"currentColor\" stroke-width=\"3\"/><polygon points=\"180,109 170,115 180,121\" fill=\"currentColor\"/>\n<text x=\"300\" y=\"140\">2. Réponse : HTTP/1.1 200 OK + HTML/CSS<\/text>\n<\/g><\/svg><p>HTTP (<em>HyperText Transfer Protocol<\/em>) est le langage du dialogue <strong>client-serveur<\/strong>, sur le modèle <strong>requête / réponse<\/strong>. HTTPS en est la version sécurisée.<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Requête (client → serveur)<\/th>\n<th>Réponse (serveur → client)<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1re ligne<\/td>\n<td><strong>ligne de commande<\/strong> : MÉTHODE URL VERSION<\/td>\n<td><strong>ligne de statut<\/strong> : VERSION CODE EXPLICATION<\/td>\n<\/tr>\n<tr>\n<td>ensuite<\/td>\n<td>champs d&#39;en-tête <code>Nom: valeur<\/code><\/td>\n<td>champs d&#39;en-tête<\/td>\n<\/tr>\n<tr>\n<td>séparateur<\/td>\n<td><strong>une ligne vide<\/strong><\/td>\n<td><strong>une ligne vide<\/strong><\/td>\n<\/tr>\n<tr>\n<td>fin<\/td>\n<td>corps (facultatif, données d&#39;un formulaire en POST)<\/td>\n<td>corps : <strong>le document demandé<\/strong><\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Exemple de requête minimale :<\/p>\n<pre class=\"\"><code>GET /index.html HTTP/1.1\nHost: www.exemple.com\n<\/code><\/pre><p>Et la réponse : <code>HTTP/1.1 200 OK<\/code>, quelques en-têtes, une ligne vide, puis le code HTML.<\/p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Requête = <strong>ligne de commande + en-têtes + ligne vide + corps<\/strong>. Réponse = <strong>ligne de statut + en-têtes + ligne vide + corps<\/strong>. La ligne vide est obligatoire : elle sépare les en-têtes du corps.<\/p>\n<\/aside><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le cours dit que HTTP/1.1 est « la plus utilisée actuellement » et cite une statistique de 2019. C&#39;est daté : aujourd&#39;hui HTTP/2 et HTTP/3 (RFC 9114, 2022) servent une grande partie du trafic. Pour l&#39;examen, retiens les RFC citées par le prof : HTTP/1.0 = RFC 1945, HTTP/1.1 = RFC 2068 et 2616, HTTP/2 = RFC 7540.<\/p>\n<\/aside><h2>Idée 3 · Lire une URL<\/h2>\n<figure class=\"grille\"><figcaption>http://www.exemple.com/chemin/page.html?q=req<\/figcaption><table><tr><th>protocole<\/th><th>hôte<\/th><th>chemin<\/th><th>page<\/th><th>requête<\/th><\/tr><tr><td class=\"h1\">http<\/td><td class=\"h2\">www.exemple.com<\/td><td>/chemin/<\/td><td>page.html<\/td><td class=\"h0\">q=req<\/td><\/tr><\/table><\/figure><p>L&#39;URL (<em>Uniform Resource Locator<\/em>) adresse une ressource du web. On la découpe toujours dans le même ordre.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Découper https://www.usms.ac.ma/fr/etudiants.html?annee=2025<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Protocole<\/div><p><code>https<\/code> (HTTP sécurisé), avant <code>://<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · Hôte<\/div><p><code>www.usms.ac.ma<\/code>, le nom de la machine (serveur).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · Chemin<\/div><p><code>/fr/<\/code>, le dossier sur le serveur.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · Page<\/div><p><code>etudiants.html<\/code>, le fichier demandé.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · Chaîne de requête<\/div><p><code>annee=2025<\/code>, après le <code>?<\/code> : des données transmises à la page.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Idée 4 · Front-end, back-end, statique, dynamique<\/h2>\n<figure class=\"flux\"><figcaption>Les trois temps du dialogue<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">Le client demande une page<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Le serveur génère la page (langage serveur)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Le serveur envoie HTML + CSS<\/div><\/div><\/figure><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Front-end (client)<\/th>\n<th>Back-end (serveur)<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Rôle<\/td>\n<td>comment le site <strong>s&#39;affiche<\/strong><\/td>\n<td>comment le site <strong>se comporte<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Langages<\/td>\n<td>HTML5, CSS3, JavaScript<\/td>\n<td>PHP, Java, C#, Python, Ruby, Perl…<\/td>\n<\/tr>\n<\/tbody><\/table>\n<ul>\n<li><strong>Page statique<\/strong> : le fichier HTML est stocké tel quel ; le serveur l&#39;envoie sans rien calculer.<\/li>\n<li><strong>Page dynamique<\/strong> : un programme côté serveur la <strong>génère<\/strong> à chaque demande, selon les données (formulaires, cookies, base de données SQL…).<\/li>\n<\/ul>\n<p>Autres mots du cours :<\/p>\n<ul>\n<li><strong>Framework<\/strong> = boîte à outils pour coder plus vite (la « pelleteuse » au lieu de creuser à la main) : Symfony (PHP), Django (Python), Ruby on Rails, ASP.NET (C#), Angular (JS).<\/li>\n<li><strong>CMS<\/strong> (WordPress, Joomla) = site prêt à l&#39;emploi, <strong>sans coder<\/strong>. Ce n&#39;est <strong>pas<\/strong> un framework. Le prof le déconseille à un informaticien.<\/li>\n<li><strong>Navigateur<\/strong> : Chrome, Firefox, Edge, Safari, Opera… Il <strong>interprète<\/strong> HTML, CSS, JS.<\/li>\n<li><strong>Serveur web<\/strong> : Apache (le plus répandu, gratuit, modules PHP/MySQL), Microsoft IIS…<\/li>\n<li><strong>SGBD<\/strong> : MySQL, PostgreSQL, Oracle, SQLite… interrogés en <strong>SQL<\/strong> par le langage serveur.<\/li>\n<li><strong>Site responsive<\/strong> : le design s&#39;adapte aux petits écrans (solution la plus simple), contre une <strong>application native<\/strong> (iOS, Android).<\/li>\n<\/ul>\n<aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>Teste toujours ton site <strong>sur au moins deux navigateurs<\/strong> pendant sa création.<\/p>\n<\/aside><p>Les étapes d&#39;un projet de site selon le cours : <strong>spécification des besoins<\/strong> (objectifs, nom de domaine, hébergeur) → <strong>conception<\/strong> (structure des pages, arborescence, charte graphique) → <strong>réalisation<\/strong> (pages, développements dynamiques) → <strong>terminaison et suivi<\/strong> (mise en ligne, annonce, maintenance).<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Les <strong>notes de cours manuscrites<\/strong> fournies ajoutent quelques définitions d&#39;informatique d&#39;entreprise : <strong>intranet<\/strong> (réseau interne à l&#39;entreprise, sur un LAN), <strong>extranet<\/strong> (accessible à des acteurs externes avec droits d&#39;accès : clients, fournisseurs), <strong>ERP<\/strong> (progiciel de gestion intégré : SAP, Odoo, Sage), <strong>CRM<\/strong> (gestion de la relation client), <strong>SI<\/strong> (système d&#39;information). On ne sait pas si elles tombent à l&#39;examen.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Questions de cours<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Donne les trois parties d&#39;une <strong>réponse<\/strong> HTTP, dans l&#39;ordre.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><ol>\n<li>La <strong>ligne de statut<\/strong> (version, code, explication, ex. <code>HTTP/1.1 404 Not Found<\/code>). 2) Les <strong>champs d&#39;en-tête<\/strong>. 3) Après une <strong>ligne vide<\/strong>, le <strong>corps<\/strong> qui contient le document demandé.<\/li>\n<\/ol>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Découpe l&#39;URL <code>http://fsbm.usms.ac.ma/notes/s3.php?cne=R123<\/code> (protocole, hôte, chemin, page, requête).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Protocole <code>http<\/code>, hôte <code>fsbm.usms.ac.ma<\/code>, chemin <code>/notes/<\/code>, page <code>s3.php<\/code>, chaîne de requête <code>cne=R123<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Classe ces langages en front-end ou back-end : CSS, PHP, JavaScript, Python, HTML.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Front-end : HTML, CSS, JavaScript. Back-end : PHP, Python. (JavaScript peut aussi tourner côté serveur avec Node.js, mais le cours le classe en front-end.)<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Quelle est la différence entre un framework et un CMS ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Un <strong>framework<\/strong> est une boîte à outils pour <strong>programmer<\/strong> plus vite (Symfony, Django). Un <strong>CMS<\/strong> (WordPress) est un site <strong>prêt à l&#39;emploi<\/strong> qu&#39;on gère <strong>sans coder<\/strong>, plus simple mais plus limité.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Internet, c&#39;est…<\/div><button class=\"opt\" data-o=\"0\">un synonyme exact du web<\/button><button class=\"opt\" data-o=\"1\">un réseau mondial de réseaux qui communiquent avec TCP/IP<\/button><button class=\"opt\" data-o=\"2\">un navigateur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Qui a inventé le web ?<\/div><button class=\"opt\" data-o=\"0\">Bill Gates<\/button><button class=\"opt\" data-o=\"1\">Tim Berners-Lee<\/button><button class=\"opt\" data-o=\"2\">le W3C<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Le Web 2.0 est surtout caractérisé par…<\/div><button class=\"opt\" data-o=\"0\">des sites vitrines sans interaction<\/button><button class=\"opt\" data-o=\"1\">le partage et les réseaux sociaux<\/button><button class=\"opt\" data-o=\"2\">l&#39;internet des objets<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Dans une requête HTTP, qu&#39;est-ce qui sépare les en-têtes du corps ?<\/div><button class=\"opt\" data-o=\"0\">un point-virgule<\/button><button class=\"opt\" data-o=\"1\">une ligne vide<\/button><button class=\"opt\" data-o=\"2\">le mot BODY<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">La première ligne d&#39;une réponse HTTP s&#39;appelle…<\/div><button class=\"opt\" data-o=\"0\">la ligne de commande<\/button><button class=\"opt\" data-o=\"1\">la ligne de statut<\/button><button class=\"opt\" data-o=\"2\">l&#39;en-tête Host<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Dans <code>http://www.exemple.com/chemin/page.html?q=req<\/code>, <code>q=req<\/code> est…<\/div><button class=\"opt\" data-o=\"0\">le chemin<\/button><button class=\"opt\" data-o=\"1\">l&#39;hôte<\/button><button class=\"opt\" data-o=\"2\">la chaîne de requête<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Lequel est un langage back-end ?<\/div><button class=\"opt\" data-o=\"0\">CSS<\/button><button class=\"opt\" data-o=\"1\">PHP<\/button><button class=\"opt\" data-o=\"2\">HTML<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">WordPress est…<\/div><button class=\"opt\" data-o=\"0\">un framework PHP<\/button><button class=\"opt\" data-o=\"1\">un CMS<\/button><button class=\"opt\" data-o=\"2\">un serveur web<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Une page dynamique est…<\/div><button class=\"opt\" data-o=\"0\">une page avec des animations CSS<\/button><button class=\"opt\" data-o=\"1\">une page générée par un programme côté serveur à chaque demande<\/button><button class=\"opt\" data-o=\"2\">une page stockée telle quelle sur le disque<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Apache est…<\/div><button class=\"opt\" data-o=\"0\">un navigateur<\/button><button class=\"opt\" data-o=\"1\">un SGBD<\/button><button class=\"opt\" data-o=\"2\">un serveur web<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"generalites-web","rep":null,"tol":null},{"n":"generalites-web","rep":null,"tol":null},{"n":"generalites-web","rep":null,"tol":null},{"n":"generalites-web","rep":null,"tol":null},{"n":"generalites-web","rep":null,"tol":null}],"qcm":[{"n":"generalites-web","q":"Internet, c&#39;est…","o":["un synonyme exact du web","un réseau mondial de réseaux qui communiquent avec TCP/IP","un navigateur"],"a":1,"e":"Le web n&#39;est qu&#39;un des services d&#39;internet (avec le mail, FTP…)."},{"n":"generalites-web","q":"Qui a inventé le web ?","o":["Bill Gates","Tim Berners-Lee","le W3C"],"a":1,"e":"Tim Berners-Lee, en 1989. Il a ensuite fondé le W3C."},{"n":"generalites-web","q":"Le Web 2.0 est surtout caractérisé par…","o":["des sites vitrines sans interaction","le partage et les réseaux sociaux","l&#39;internet des objets"],"a":1,"e":"Web 1.0 = statique, 2.0 = social, 3.0 = sémantique, 4.0 = IoT + IA."},{"n":"generalites-web","q":"Dans une requête HTTP, qu&#39;est-ce qui sépare les en-têtes du corps ?","o":["un point-virgule","une ligne vide","le mot BODY"],"a":1,"e":"Une ligne vide (CRLF seul) marque la fin des en-têtes."},{"n":"generalites-web","q":"La première ligne d&#39;une réponse HTTP s&#39;appelle…","o":["la ligne de commande","la ligne de statut","l&#39;en-tête Host"],"a":1,"e":"Ligne de statut : version, code (200, 404…), explication."},{"n":"generalites-web","q":"Dans <code>http://www.exemple.com/chemin/page.html?q=req<\/code>, <code>q=req<\/code> est…","o":["le chemin","l&#39;hôte","la chaîne de requête"],"a":2,"e":"Ce qui suit le <code>?<\/code> est transmis à la page."},{"n":"generalites-web","q":"Lequel est un langage back-end ?","o":["CSS","PHP","HTML"],"a":1,"e":"PHP s&#39;exécute côté serveur."},{"n":"generalites-web","q":"WordPress est…","o":["un framework PHP","un CMS","un serveur web"],"a":1,"e":"Un CMS est un site prêt à l&#39;emploi ; le cours insiste : ce n&#39;est pas un framework."},{"n":"generalites-web","q":"Une page dynamique est…","o":["une page avec des animations CSS","une page générée par un programme côté serveur à chaque demande","une page stockée telle quelle sur le disque"],"a":1,"e":"Dynamique = générée (BD, formulaires, cookies…), pas forcément animée."},{"n":"generalites-web","q":"Apache est…","o":["un navigateur","un SGBD","un serveur web"],"a":2,"e":"Apache est un serveur HTTP ; Chrome est un navigateur ; MySQL est un SGBD."}]},{"id":"structure-html5","t":"HTML5 (1) · balises, attributs et structure d'une page","seance":"Partie II · HTML5, structure du document","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir ce qu&#39;est un navigateur et une page web (chapitre 1). HTML est le langage que le navigateur lit pour construire la page.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>HTML est-il un langage front-end ou back-end ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><strong>Front-end<\/strong> : il décrit ce qui s&#39;affiche, et c&#39;est le navigateur (côté client) qui l&#39;interprète.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense en boîtes qui s&#39;emboîtent.<\/strong> Une page HTML est un arbre : <code>html<\/code> contient <code>head<\/code> et <code>body<\/code>, <code>body<\/code> contient <code>header<\/code>, <code>section<\/code>… Chaque balise ouverte se ferme <strong>dans la boîte où elle a été ouverte<\/strong>.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Fermer les balises dans le mauvais ordre : <code>&lt;b&gt;&lt;i&gt;texte&lt;/b&gt;&lt;/i&gt;<\/code>. La <strong>dernière<\/strong> balise ouverte doit être la <strong>première<\/strong> fermée : <code>&lt;b&gt;&lt;i&gt;texte&lt;/i&gt;&lt;/b&gt;<\/code>.<\/p>\n<\/aside><p>À la fin, tu sais écrire de mémoire le squelette d&#39;une page HTML5 et la découper en zones sémantiques (<code>header<\/code>, <code>nav<\/code>, <code>section<\/code>, <code>article<\/code>, <code>aside<\/code>, <code>footer<\/code>).<\/p>\n<h2>Idée 1 · Une balise ouvre, une balise ferme, les attributs précisent<\/h2>\n<p>HTML (<em>HyperText Markup Language<\/em>) est un langage de <strong>balisage<\/strong> inventé par Tim Berners-Lee (1990-1991). Une <strong>balise<\/strong> marque le début et la fin d&#39;un <strong>élément<\/strong> ; un <strong>attribut<\/strong> donne une précision, toujours dans la balise <strong>ouvrante<\/strong>.<\/p>\n<figure class=\"grille\"><figcaption>Anatomie d'un élément : &lt;a href=&quot;contact.html&quot;&gt;Contact&lt;/a&gt;<\/figcaption><table><tr><th>ouvrante<\/th><th>attribut<\/th><th>valeur<\/th><th>contenu<\/th><th>fermante<\/th><\/tr><tr><td class=\"h2\">&lt;a<\/td><td class=\"h1\">href<\/td><td>=&quot;contact.html&quot;&gt;<\/td><td>Contact<\/td><td class=\"h2\">&lt;/a&gt;<\/td><\/tr><\/table><\/figure><pre class=\"\"><code>&lt;balise attribut1=&quot;valeur&quot; attribut2=&quot;valeur&quot;&gt; contenu &lt;/balise&gt;\n&lt;p&gt;Un paragraphe avec un mot en &lt;strong&gt;gras&lt;/strong&gt;.&lt;/p&gt;\n&lt;br&gt;   &lt;!-- balise orpheline : pas de fermante --&gt;\n&lt;img src=&quot;logo.png&quot; alt=&quot;Logo FSABM&quot;&gt;<\/code><\/pre><ul>\n<li>Plusieurs attributs sont séparés par <strong>un espace<\/strong>, la valeur est <strong>entre guillemets<\/strong>.<\/li>\n<li>Les <strong>balises orphelines<\/strong> n&#39;ont pas de fermante : <code>&lt;br&gt;<\/code>, <code>&lt;hr&gt;<\/code>, <code>&lt;img&gt;<\/code>, <code>&lt;input&gt;<\/code>, <code>&lt;meta&gt;<\/code>, <code>&lt;link&gt;<\/code> (on peut écrire <code>&lt;br /&gt;<\/code>).<\/li>\n<li>Un commentaire s&#39;écrit <code>&lt;!-- commentaire --&gt;<\/code>.<\/li>\n<\/ul>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Les diapos écrivent les commentaires <code>&lt;! ... &gt;<\/code> et citent <code>&lt;image/&gt;<\/code> comme balise orpheline. En HTML correct : un commentaire est <strong><code>&lt;!-- ... --&gt;<\/code><\/strong> (avec les deux tirets), et la balise image est <strong><code>&lt;img&gt;<\/code><\/strong>.<\/p>\n<\/aside><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Imbrication : <strong><code>&lt;a&gt;&lt;b&gt;&lt;c&gt;contenu&lt;/c&gt;&lt;/b&gt;&lt;/a&gt;<\/code><\/strong> est correct, <strong><code>&lt;a&gt;&lt;b&gt;&lt;c&gt;contenu&lt;/a&gt;&lt;/c&gt;&lt;/b&gt;<\/code><\/strong> est faux. La première fermante correspond à la dernière ouvrante non fermée.<\/p>\n<\/aside><h2>Idée 2 · Le squelette d&#39;un document HTML5<\/h2>\n<svg viewBox=\"0 0 560 230\" style=\"width:100%;max-width:560px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Arbre du document : DOCTYPE, puis html qui contient head (meta, title, link) et body (contenu)\">\n<g font-family=\"monospace\" font-size=\"14\" fill=\"currentColor\">\n<text x=\"20\" y=\"28\" fill=\"#D9824F\">&lt;!DOCTYPE html&gt;<\/text>\n<rect x=\"20\" y=\"40\" width=\"520\" height=\"180\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<text x=\"32\" y=\"62\">&lt;html lang=\"fr\"&gt;<\/text>\n<rect x=\"40\" y=\"74\" width=\"230\" height=\"130\" rx=\"6\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/>\n<text x=\"52\" y=\"96\" fill=\"#D9824F\">&lt;head&gt;<\/text>\n<text x=\"62\" y=\"124\" font-size=\"12\">&lt;meta charset=\"utf-8\"&gt;<\/text>\n<text x=\"62\" y=\"148\" font-size=\"12\">&lt;title&gt;…&lt;/title&gt;<\/text>\n<text x=\"62\" y=\"172\" font-size=\"12\">&lt;link rel=\"stylesheet\"…&gt;<\/text>\n<rect x=\"290\" y=\"74\" width=\"230\" height=\"130\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<text x=\"302\" y=\"96\">&lt;body&gt;<\/text>\n<text x=\"312\" y=\"124\" font-size=\"12\">tout ce qui s'affiche :<\/text>\n<text x=\"312\" y=\"148\" font-size=\"12\">titres, textes, images,<\/text>\n<text x=\"312\" y=\"172\" font-size=\"12\">tableaux, formulaires…<\/text>\n<\/g><\/svg><pre class=\"\"><code>&lt;!DOCTYPE html&gt;\n&lt;html lang=&quot;fr&quot;&gt;\n&lt;head&gt;\n    &lt;meta charset=&quot;utf-8&quot;&gt;\n    &lt;title&gt;Titre du document&lt;/title&gt;\n&lt;/head&gt;\n&lt;body&gt;\n    ...\n&lt;/body&gt;\n&lt;/html&gt;<\/code><\/pre><figure class=\"etapes\" data-i=\"0\"><figcaption>Ce que fait chaque ligne<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/6 · <!DOCTYPE html><\/div><p>Préambule (pas une balise) : annonce au navigateur un document HTML5. Avant HTML5, il citait une DTD ; en HTML5 il est simplifié et insensible à la casse.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/6 · <html lang=\"fr\"><\/div><p>La <strong>racine<\/strong> du document. <code>lang<\/code> précise la langue.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/6 · <head><\/div><p>L&#39;<strong>en-tête<\/strong> : propriétés globales, non affichées dans la page (titre, encodage, styles, scripts).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/6 · <meta charset=\"utf-8\"><\/div><p>L&#39;encodage des caractères. Une seule déclaration par document. Sans lui, les accents peuvent s&#39;afficher en « Ã© ».<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/6 · <title><\/div><p>Le titre affiché par le navigateur, dans l&#39;onglet.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">6/6 · <body><\/div><p>Le <strong>corps<\/strong> : tout le contenu visible.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>Le prof demande d&#39;<strong>indenter<\/strong> le code avec Tab : chaque niveau d&#39;imbrication décale d&#39;un cran.<\/p>\n<\/aside><h2>Idée 3 · Découper la page en zones sémantiques<\/h2>\n<svg viewBox=\"0 0 520 260\" style=\"width:100%;max-width:520px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Maquette d'une page HTML5 : header avec nav en haut, section avec trois articles au centre, aside à droite, footer en bas\">\n<g font-family=\"monospace\" font-size=\"14\" fill=\"currentColor\" text-anchor=\"middle\">\n<rect x=\"10\" y=\"10\" width=\"500\" height=\"50\" rx=\"6\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"120\" y=\"40\" fill=\"#D9824F\">&lt;header&gt;<\/text>\n<rect x=\"260\" y=\"20\" width=\"230\" height=\"30\" rx=\"4\" fill=\"none\" stroke=\"currentColor\"/><text x=\"375\" y=\"40\">&lt;nav&gt;<\/text>\n<rect x=\"10\" y=\"70\" width=\"350\" height=\"130\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"185\" y=\"90\">&lt;section&gt;<\/text>\n<rect x=\"20\" y=\"100\" width=\"105\" height=\"90\" rx=\"4\" fill=\"none\" stroke=\"currentColor\"/><text x=\"72\" y=\"150\" font-size=\"12\">&lt;article&gt;<\/text>\n<rect x=\"132\" y=\"100\" width=\"105\" height=\"90\" rx=\"4\" fill=\"none\" stroke=\"currentColor\"/><text x=\"185\" y=\"150\" font-size=\"12\">&lt;article&gt;<\/text>\n<rect x=\"244\" y=\"100\" width=\"105\" height=\"90\" rx=\"4\" fill=\"none\" stroke=\"currentColor\"/><text x=\"297\" y=\"150\" font-size=\"12\">&lt;article&gt;<\/text>\n<rect x=\"370\" y=\"70\" width=\"140\" height=\"130\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><text x=\"440\" y=\"140\">&lt;aside&gt;<\/text>\n<rect x=\"10\" y=\"210\" width=\"500\" height=\"40\" rx=\"6\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"260\" y=\"236\" fill=\"#D9824F\">&lt;footer&gt;<\/text>\n<\/g><\/svg><p>HTML5 donne des <strong>noms<\/strong> aux grandes zones de la page. Le code devient lisible d&#39;un coup d&#39;œil.<\/p>\n<table>\n<thead>\n<tr>\n<th>Balise<\/th>\n<th>Rôle<\/th>\n<th>Exemple de contenu<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>&lt;header&gt;<\/code><\/td>\n<td>en-tête de la page, d&#39;une section ou d&#39;un article<\/td>\n<td>logo, titre <code>h1<\/code>, menu, recherche<\/td>\n<\/tr>\n<tr>\n<td><code>&lt;nav&gt;<\/code><\/td>\n<td>bloc de liens de navigation<\/td>\n<td>menu principal (souvent dans <code>header<\/code>), liens annexes (dans <code>footer<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><code>&lt;section&gt;<\/code><\/td>\n<td>regroupe un contenu sur <strong>une même thématique<\/strong><\/td>\n<td>chapitre, onglet, partie d&#39;un article<\/td>\n<\/tr>\n<tr>\n<td><code>&lt;article&gt;<\/code><\/td>\n<td>contenu <strong>autonome<\/strong>, qu&#39;on pourrait extraire seul<\/td>\n<td>billet de blog, actualité<\/td>\n<\/tr>\n<tr>\n<td><code>&lt;aside&gt;<\/code><\/td>\n<td>contenu <strong>tangentiel<\/strong>, non essentiel<\/td>\n<td>glossaire, biographie, astuces, notes<\/td>\n<\/tr>\n<tr>\n<td><code>&lt;footer&gt;<\/code><\/td>\n<td>pied de page, de section ou d&#39;article<\/td>\n<td>mentions légales, contact, plan du site<\/td>\n<\/tr>\n<\/tbody><\/table>\n<pre class=\"\"><code>&lt;body&gt;\n    &lt;header&gt;\n        &lt;h1&gt;Club Info FSABM&lt;/h1&gt;\n        &lt;nav&gt;\n            &lt;ul&gt;\n                &lt;li&gt;&lt;a href=&quot;index.html&quot;&gt;Accueil&lt;/a&gt;&lt;/li&gt;\n                &lt;li&gt;&lt;a href=&quot;contact.html&quot;&gt;Contact&lt;/a&gt;&lt;/li&gt;\n            &lt;/ul&gt;\n        &lt;/nav&gt;\n    &lt;/header&gt;\n    &lt;section&gt;\n        &lt;h2&gt;Actualités&lt;/h2&gt;\n        &lt;article&gt;\n            &lt;h3&gt;Atelier HTML jeudi&lt;/h3&gt;\n            &lt;p&gt;Salle B12, 14 h.&lt;/p&gt;\n        &lt;/article&gt;\n    &lt;/section&gt;\n    &lt;aside&gt;\n        &lt;h2&gt;Glossaire&lt;/h2&gt;\n        &lt;dl&gt;&lt;dt&gt;CSS&lt;/dt&gt;&lt;dd&gt;Cascading Style Sheets&lt;/dd&gt;&lt;/dl&gt;\n    &lt;/aside&gt;\n    &lt;footer&gt;&lt;p&gt;Tous droits réservés&lt;/p&gt;&lt;/footer&gt;\n&lt;/body&gt;<\/code><\/pre><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Une <code>section<\/code> peut contenir des <code>article<\/code>, <strong>et<\/strong> un <code>article<\/code> peut contenir des <code>section<\/code> (le cours donne les deux exemples : une section d&#39;articles, et un article « Les couleurs » découpé en sections « Le rouge », « Le vert »). Il n&#39;y a pas d&#39;ordre imposé : choisis selon le sens.<\/p>\n<\/aside><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Une diapo dit que les grandes zones sont « l&#39;entête header, la navigation, la zone principale <strong>aside<\/strong>, le pied de page ». C&#39;est une erreur : <code>aside<\/code> est le contenu <strong>secondaire<\/strong>. La zone principale est <code>&lt;main&gt;<\/code> (vue au TP 2) ou une <code>section<\/code>.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Écrire du HTML<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Écris le squelette HTML5 complet d&#39;une page en français, encodée en UTF-8, dont l&#39;onglet affiche « Mon Portfolio - Accueil » (TP 1, exercice 2).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><pre class=\"\"><code>&lt;!DOCTYPE html&gt;\n&lt;html lang=&quot;fr&quot;&gt;\n&lt;head&gt;\n    &lt;meta charset=&quot;UTF-8&quot;&gt;\n    &lt;title&gt;Mon Portfolio - Accueil&lt;/title&gt;\n&lt;/head&gt;\n&lt;body&gt;\n&lt;/body&gt;\n&lt;/html&gt;<\/code><\/pre><div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Corrige : <code>&lt;p&gt;&lt;strong&gt;Bonjour &lt;em&gt;à tous&lt;/p&gt;&lt;/em&gt;&lt;/strong&gt;<\/code><\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Les fermantes vont dans l&#39;ordre inverse des ouvrantes : <code>&lt;p&gt;&lt;strong&gt;Bonjour &lt;em&gt;à tous&lt;/em&gt;&lt;/strong&gt;&lt;/p&gt;<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Pour un blog, quelle balise choisir pour : (a) chaque billet, (b) la liste « Articles récents » à côté, (c) le menu ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>(a) <code>&lt;article&gt;<\/code> (contenu autonome), (b) <code>&lt;aside&gt;<\/code> (contenu annexe), (c) <code>&lt;nav&gt;<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quelle imbrication est correcte ?<\/div><button class=\"opt\" data-o=\"0\"><code>&lt;b&gt;&lt;i&gt;texte&lt;/b&gt;&lt;/i&gt;<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>&lt;b&gt;&lt;i&gt;texte&lt;/i&gt;&lt;/b&gt;<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>&lt;b&gt;&lt;i&gt;texte&lt;/b&gt;<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Où place-t-on les attributs ?<\/div><button class=\"opt\" data-o=\"0\">dans la balise ouvrante<\/button><button class=\"opt\" data-o=\"1\">dans la balise fermante<\/button><button class=\"opt\" data-o=\"2\">entre les deux balises<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\"><code>&lt;!DOCTYPE html&gt;<\/code> est…<\/div><button class=\"opt\" data-o=\"0\">une balise de contenu affichée<\/button><button class=\"opt\" data-o=\"1\">un préambule qui indique au navigateur le type de document<\/button><button class=\"opt\" data-o=\"2\">une feuille de style<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Quelle balise est la racine du document ?<\/div><button class=\"opt\" data-o=\"0\"><code>&lt;head&gt;<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>&lt;body&gt;<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>&lt;html&gt;<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Que contient <code>&lt;head&gt;<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">le contenu visible<\/button><button class=\"opt\" data-o=\"1\">le titre, l&#39;encodage, les liens vers les styles<\/button><button class=\"opt\" data-o=\"2\">uniquement le menu<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Où s&#39;affiche le contenu de <code>&lt;title&gt;<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">en gros en haut de la page<\/button><button class=\"opt\" data-o=\"1\">dans l&#39;onglet du navigateur<\/button><button class=\"opt\" data-o=\"2\">nulle part<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Quelle balise est orpheline ?<\/div><button class=\"opt\" data-o=\"0\"><code>&lt;p&gt;<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>&lt;br&gt;<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>&lt;li&gt;<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Un billet de blog qu&#39;on pourrait publier seul ailleurs se met dans…<\/div><button class=\"opt\" data-o=\"0\"><code>&lt;article&gt;<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>&lt;aside&gt;<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>&lt;nav&gt;<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Un glossaire à côté du texte principal se met dans…<\/div><button class=\"opt\" data-o=\"0\"><code>&lt;header&gt;<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>&lt;aside&gt;<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>&lt;footer&gt;<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Quel attribut de <code>&lt;html&gt;<\/code> précise la langue ?<\/div><button class=\"opt\" data-o=\"0\"><code>charset<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>lang<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>language<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"structure-html5","rep":null,"tol":null},{"n":"structure-html5","rep":null,"tol":null},{"n":"structure-html5","rep":null,"tol":null},{"n":"structure-html5","rep":null,"tol":null}],"qcm":[{"n":"structure-html5","q":"Quelle imbrication est correcte ?","o":["<code>&lt;b&gt;&lt;i&gt;texte&lt;/b&gt;&lt;/i&gt;<\/code>","<code>&lt;b&gt;&lt;i&gt;texte&lt;/i&gt;&lt;/b&gt;<\/code>","<code>&lt;b&gt;&lt;i&gt;texte&lt;/b&gt;<\/code>"],"a":1,"e":"La dernière balise ouverte se ferme en premier."},{"n":"structure-html5","q":"Où place-t-on les attributs ?","o":["dans la balise ouvrante","dans la balise fermante","entre les deux balises"],"a":0,"e":"<code>&lt;a href=&quot;...&quot;&gt;<\/code> : jamais dans <code>&lt;/a&gt;<\/code>."},{"n":"structure-html5","q":"<code>&lt;!DOCTYPE html&gt;<\/code> est…","o":["une balise de contenu affichée","un préambule qui indique au navigateur le type de document","une feuille de style"],"a":1,"e":"Ce n&#39;est pas un tag HTML à part entière."},{"n":"structure-html5","q":"Quelle balise est la racine du document ?","o":["<code>&lt;head&gt;<\/code>","<code>&lt;body&gt;<\/code>","<code>&lt;html&gt;<\/code>"],"a":2,"e":"<code>&lt;html&gt;<\/code> contient <code>&lt;head&gt;<\/code> et <code>&lt;body&gt;<\/code>."},{"n":"structure-html5","q":"Que contient <code>&lt;head&gt;<\/code> ?","o":["le contenu visible","le titre, l&#39;encodage, les liens vers les styles","uniquement le menu"],"a":1,"e":"Le head décrit le document ; le body l&#39;affiche."},{"n":"structure-html5","q":"Où s&#39;affiche le contenu de <code>&lt;title&gt;<\/code> ?","o":["en gros en haut de la page","dans l&#39;onglet du navigateur","nulle part"],"a":1,"e":"Pour un titre visible dans la page, on utilise <code>&lt;h1&gt;<\/code>."},{"n":"structure-html5","q":"Quelle balise est orpheline ?","o":["<code>&lt;p&gt;<\/code>","<code>&lt;br&gt;<\/code>","<code>&lt;li&gt;<\/code>"],"a":1,"e":"<code>br<\/code>, <code>hr<\/code>, <code>img<\/code>, <code>input<\/code>, <code>meta<\/code>, <code>link<\/code> n&#39;ont pas de fermante."},{"n":"structure-html5","q":"Un billet de blog qu&#39;on pourrait publier seul ailleurs se met dans…","o":["<code>&lt;article&gt;<\/code>","<code>&lt;aside&gt;<\/code>","<code>&lt;nav&gt;<\/code>"],"a":0,"e":"Article = contenu autonome."},{"n":"structure-html5","q":"Un glossaire à côté du texte principal se met dans…","o":["<code>&lt;header&gt;<\/code>","<code>&lt;aside&gt;<\/code>","<code>&lt;footer&gt;<\/code>"],"a":1,"e":"Aside = contenu tangentiel."},{"n":"structure-html5","q":"Quel attribut de <code>&lt;html&gt;<\/code> précise la langue ?","o":["<code>charset<\/code>","<code>lang<\/code>","<code>language<\/code>"],"a":1,"e":"<code>&lt;html lang=&quot;fr&quot;&gt;<\/code>. <code>charset<\/code> est un attribut de <code>&lt;meta&gt;<\/code>."}]},{"id":"texte-listes-liens","t":"HTML5 (2) · blocs et en ligne, texte, listes et liens","seance":"Partie II · HTML5, contenu textuel","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu dois savoir écrire le squelette d&#39;une page et placer un attribut (chapitre 2).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Dans <code>&lt;a href=&quot;page2.html&quot;&gt;Suite&lt;/a&gt;<\/code>, quel est le nom de l&#39;attribut et quelle est sa valeur ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>L&#39;attribut est <code>href<\/code>, sa valeur est <code>page2.html<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Demande-toi : « ce morceau prend toute la ligne, ou il reste dans la phrase ? »<\/strong> Toute balise de texte est soit <strong>bloc<\/strong> (elle s&#39;empile), soit <strong>en ligne<\/strong> (elle reste dans le flux).<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Choisir une balise pour son <strong>apparence<\/strong> (<code>&lt;h3&gt;<\/code> parce que « c&#39;est la bonne taille »). HTML décrit le <strong>sens<\/strong> ; la taille, c&#39;est le rôle du CSS.<\/p>\n<\/aside><p>À la fin, tu sais structurer un texte (titres, paragraphes, listes) et créer les quatre sortes de liens du cours : vers un site, vers une page du site, vers une ancre de la même page, vers une adresse mail.<\/p>\n<h2>Idée 1 · Bloc ou en ligne<\/h2>\n<svg viewBox=\"0 0 560 170\" style=\"width:100%;max-width:560px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Les éléments bloc s'empilent sur toute la largeur ; les éléments en ligne restent côte à côte dans la ligne de texte\">\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\">\n<text x=\"20\" y=\"20\" font-weight=\"700\">Bloc : s'empilent<\/text>\n<rect x=\"20\" y=\"30\" width=\"250\" height=\"30\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"30\" y=\"50\">&lt;p&gt; Paragraphe 1<\/text>\n<rect x=\"20\" y=\"70\" width=\"250\" height=\"30\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"30\" y=\"90\">&lt;p&gt; Paragraphe 2<\/text>\n<rect x=\"20\" y=\"110\" width=\"250\" height=\"30\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"30\" y=\"130\">&lt;h2&gt; Titre<\/text>\n<text x=\"300\" y=\"20\" font-weight=\"700\">En ligne : restent dans la phrase<\/text>\n<rect x=\"300\" y=\"30\" width=\"250\" height=\"40\" fill=\"none\" stroke=\"currentColor\"/>\n<text x=\"308\" y=\"55\">texte en<\/text><rect x=\"365\" y=\"40\" width=\"45\" height=\"22\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"370\" y=\"55\">gras<\/text><text x=\"416\" y=\"55\">et en<\/text><rect x=\"453\" y=\"40\" width=\"58\" height=\"22\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"457\" y=\"55\">italique<\/text>\n<\/g><\/svg><table>\n<thead>\n<tr>\n<th>Bloc (toute la largeur, l&#39;un sous l&#39;autre)<\/th>\n<th>En ligne (dans le flux du texte)<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>h1<\/code>…<code>h6<\/code>, <code>p<\/code>, <code>blockquote<\/code>, <code>hr<\/code><\/td>\n<td><code>strong<\/code>, <code>em<\/code>, <code>br<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>ol<\/code>, <code>ul<\/code>, <code>dl<\/code><\/td>\n<td><code>a<\/code>, <code>img<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>table<\/code>, <code>form<\/code><\/td>\n<td><code>input<\/code>, <code>select<\/code>, <code>textarea<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong><code>div<\/code><\/strong> : division générique<\/td>\n<td><strong><code>span<\/code><\/strong> : division en ligne générique<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p><code>&lt;p&gt;Paragraphe 1&lt;/p&gt;&lt;p&gt;Paragraphe 2&lt;/p&gt;<\/code> s&#39;affiche sur <strong>deux lignes<\/strong> ; <code>texte en &lt;strong&gt;gras&lt;/strong&gt; et en &lt;em&gt;italique&lt;/em&gt;<\/code> sur <strong>une seule<\/strong>.<\/p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p><code>div<\/code> et <code>span<\/code> n&#39;ont aucun sens : ce sont des « boîtes vides » qu&#39;on crée pour leur appliquer du <strong>CSS<\/strong>. <code>div<\/code> est bloc, <code>span<\/code> est en ligne.<\/p>\n<\/aside><h2>Idée 2 · Titres, paragraphes et mise en forme du texte<\/h2>\n<figure class=\"grille\"><figcaption>Six niveaux de titres<\/figcaption><table><tr><th>balise<\/th><th>importance<\/th><\/tr><tr><td class=\"h1\">h1<\/td><td>titre<\/td><td>très<\/td><td>important<\/td><td>(un<\/td><td>seul<\/td><td>par<\/td><td>page<\/td><td>en<\/td><td>général)<\/td><\/tr><tr><td>h2<\/td><td>titre<\/td><td>important<\/td><\/tr><tr><td>h3<\/td><td>3e<\/td><td>niveau<\/td><\/tr><tr><td>h4<\/td><td>4e<\/td><td>niveau<\/td><\/tr><tr><td>h5<\/td><td>5e<\/td><td>niveau<\/td><\/tr><tr><td class=\"h0\">h6<\/td><td>6e<\/td><td>niveau<\/td><\/tr><\/table><\/figure><pre class=\"\"><code>&lt;h1&gt;Programmation Web 1&lt;/h1&gt;\n&lt;h2&gt;Chapitre 1&lt;/h2&gt;\n&lt;p&gt;Le &lt;strong&gt;web&lt;/strong&gt; repose sur &lt;em&gt;internet&lt;/em&gt;.&lt;br&gt;\nH&lt;sub&gt;2&lt;/sub&gt;O et x&lt;sup&gt;2&lt;/sup&gt;, et un prix &lt;del&gt;200 DH&lt;/del&gt; 150 DH.&lt;/p&gt;<\/code><\/pre><div style=\"border:1px solid currentColor;border-radius:8px;padding:8px 14px;margin:8px 0\">\n<p style=\"margin:4px 0\">Le <strong>web<\/strong> repose sur <em>internet<\/em>.<br>H<sub>2<\/sub>O et x<sup>2<\/sup>, et un prix <del>200 DH<\/del> 150 DH.<\/p>\n<\/div><table>\n<thead>\n<tr>\n<th>Balise<\/th>\n<th>Effet<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>strong<\/code> / <code>b<\/code><\/td>\n<td>gras (<code>strong<\/code> = important)<\/td>\n<\/tr>\n<tr>\n<td><code>em<\/code> / <code>i<\/code><\/td>\n<td>italique (<code>em<\/code> = mise en valeur)<\/td>\n<\/tr>\n<tr>\n<td><code>sub<\/code> / <code>sup<\/code><\/td>\n<td>indice / exposant<\/td>\n<\/tr>\n<tr>\n<td><code>del<\/code><\/td>\n<td>texte barré<\/td>\n<\/tr>\n<tr>\n<td><code>u<\/code><\/td>\n<td>souligné<\/td>\n<\/tr>\n<tr>\n<td><code>small<\/code><\/td>\n<td>plus petit<\/td>\n<\/tr>\n<\/tbody><\/table>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>La diapo « Traitement de texte » liste aussi <code>&lt;FONT color=…&gt;<\/code>, <code>&lt;FONT size=…&gt;<\/code>, <code>&lt;BIG&gt;<\/code>, <code>&lt;BLINK&gt;<\/code>, <code>&lt;NOBR&gt;<\/code>. Ces balises sont <strong>obsolètes en HTML5<\/strong> (BLINK ne marchait que sur Netscape). Pour la couleur et la taille, utilise le CSS : <code>color<\/code>, <code>font-size<\/code>.<\/p>\n<\/aside><h2>Idée 3 · Trois sortes de listes<\/h2>\n<pre class=\"\"><code>&lt;ol&gt;                          &lt;!-- ordered list : numérotée --&gt;\n    &lt;li&gt;premier élément&lt;/li&gt;  &lt;!-- list item --&gt;\n    &lt;li&gt;deuxième élément&lt;/li&gt;\n&lt;/ol&gt;\n&lt;ul&gt;                          &lt;!-- unordered list : à puces --&gt;\n    &lt;li&gt;HTML&lt;/li&gt;\n    &lt;li&gt;CSS\n        &lt;ol&gt;                  &lt;!-- liste imbriquée : DANS le li --&gt;\n            &lt;li&gt;sélecteurs&lt;/li&gt;\n            &lt;li&gt;cascade&lt;/li&gt;\n        &lt;/ol&gt;\n    &lt;/li&gt;\n&lt;/ul&gt;\n&lt;dl&gt;                          &lt;!-- liste de définitions --&gt;\n    &lt;dt&gt;CSS&lt;/dt&gt;&lt;dd&gt;Cascading Style Sheets&lt;/dd&gt;\n&lt;/dl&gt;<\/code><\/pre><div style=\"border:1px solid currentColor;border-radius:8px;padding:6px 14px;margin:8px 0\">\n<ol><li>premier élément<\/li><li>deuxième élément<\/li><\/ol>\n<ul><li>HTML<\/li><li>CSS<ol><li>sélecteurs<\/li><li>cascade<\/li><\/ol><\/li><\/ul>\n<dl><dt>CSS<\/dt><dd>Cascading Style Sheets<\/dd><\/dl>\n<\/div><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Une liste imbriquée se place <strong>à l&#39;intérieur d&#39;un <code>&lt;li&gt;<\/code><\/strong>, pas directement dans <code>&lt;ul&gt;<\/code> entre deux <code>&lt;li&gt;<\/code>.<\/p>\n<\/aside><h2>Idée 4 · Les liens : <code>&lt;a href&gt;<\/code><\/h2>\n<figure class=\"flux\"><figcaption>Où mène href ?<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\"><a href=\"https://site.com\">https://site.com<\/a> (autre site)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">page2.html (même dossier)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">dossier/page2.html (sous-dossier)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">#id (même page)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">mailto:adresse (mail)<\/div><\/div><\/figure><p><code>a<\/code> = <em>anchor<\/em> (ancre), <code>href<\/code> = <em>hypertext reference<\/em> (où conduit le lien).<\/p>\n<pre class=\"\"><code>&lt;a href=&quot;https://www.usms.ac.ma&quot; target=&quot;_blank&quot; title=&quot;Site de l'université&quot;&gt;USMS&lt;/a&gt;\n&lt;a href=&quot;page2.html&quot;&gt;Page 2&lt;/a&gt;\n&lt;a href=&quot;sous-dossier/page2.html&quot;&gt;Page 2 rangée dans un sous-dossier&lt;/a&gt;\n&lt;a href=&quot;#chap2&quot;&gt;Aller au chapitre 2&lt;/a&gt;\n...\n&lt;h2 id=&quot;chap2&quot;&gt;Chapitre 2&lt;/h2&gt;\n&lt;a href=&quot;mailto:club.info@exemple.ma&quot;&gt;Écrire au club&lt;/a&gt;<\/code><\/pre><figure class=\"etapes\" data-i=\"0\"><figcaption>Créer une table des matières (lien interne)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · Marquer la cible<\/div><p>Donne un <code>id<\/code> unique à l&#39;élément d&#39;arrivée : <code>&lt;h2 id=&quot;chap2&quot;&gt;<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · Créer le lien<\/div><p><code>href<\/code> commence par <code>#<\/code> puis l&#39;id : <code>&lt;a href=&quot;#chap2&quot;&gt;<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · Le « # »<\/div><p>Il dit au navigateur de <strong>rester sur la même page<\/strong> et de défiler jusqu&#39;à l&#39;élément.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><table>\n<thead>\n<tr>\n<th>Attribut<\/th>\n<th>Valeur<\/th>\n<th>Effet<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>target<\/code><\/td>\n<td><code>_self<\/code> (défaut)<\/td>\n<td>même fenêtre<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><code>_blank<\/code><\/td>\n<td>nouvel onglet / nouvelle fenêtre<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><code>_top<\/code><\/td>\n<td>même fenêtre, en plein écran (≈ <code>_self<\/code> sans cadres)<\/td>\n<\/tr>\n<tr>\n<td><code>title<\/code><\/td>\n<td>texte<\/td>\n<td><strong>infobulle<\/strong> au survol<\/td>\n<\/tr>\n<\/tbody><\/table>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>La diapo écrit <code>target=&quot;_balnk&quot;<\/code> : c&#39;est une faute de frappe. La bonne valeur est <strong><code>_blank<\/code><\/strong>. Avec la faute, le navigateur ouvre un onglet nommé « _balnk » et le réutilise.<\/p>\n<\/aside><aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>Un lien <code>mailto:<\/code> ne marche que si un logiciel de messagerie est installé sur l&#39;ordinateur.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Écrire des liens et des listes<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Écris un lien vers Wikipédia (<code>https://fr.wikipedia.org<\/code>) qui s&#39;ouvre dans un nouvel onglet et affiche l&#39;infobulle « Encyclopédie » (TP 1, exercice 3).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>&lt;a href=&quot;https://fr.wikipedia.org&quot; target=&quot;_blank&quot; title=&quot;Encyclopédie&quot;&gt;Wikipédia&lt;/a&gt;<\/code><\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>La page <code>index.html<\/code> est à la racine ; <code>cours.html<\/code> est dans le dossier <code>s3<\/code>. Écris le lien depuis <code>index.html<\/code>.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>&lt;a href=&quot;s3/cours.html&quot;&gt;Cours S3&lt;/a&gt;<\/code> : chemin relatif, dossier puis nom du fichier.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Écris une liste à puces de 3 compétences, dont la deuxième contient une liste numérotée de 2 éléments (bonus TP 1).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><pre class=\"\"><code>&lt;ul&gt;\n    &lt;li&gt;HTML&lt;/li&gt;\n    &lt;li&gt;CSS\n        &lt;ol&gt;\n            &lt;li&gt;Sélecteurs&lt;/li&gt;\n            &lt;li&gt;Couleurs&lt;/li&gt;\n        &lt;/ol&gt;\n    &lt;/li&gt;\n    &lt;li&gt;Travail en équipe&lt;/li&gt;\n&lt;/ul&gt;<\/code><\/pre><div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quelle balise est de type bloc ?<\/div><button class=\"opt\" data-o=\"0\"><code>&lt;strong&gt;<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>&lt;p&gt;<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>&lt;a&gt;<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Quelle balise est en ligne ?<\/div><button class=\"opt\" data-o=\"0\"><code>&lt;div&gt;<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>&lt;ul&gt;<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>&lt;span&gt;<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\"><code>&lt;ol&gt;<\/code> produit…<\/div><button class=\"opt\" data-o=\"0\">une liste numérotée<\/button><button class=\"opt\" data-o=\"1\">une liste à puces<\/button><button class=\"opt\" data-o=\"2\">une liste de définitions<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Comment écrire x² en HTML ?<\/div><button class=\"opt\" data-o=\"0\"><code>x&lt;sub&gt;2&lt;/sub&gt;<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>x&lt;sup&gt;2&lt;/sup&gt;<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>x&lt;big&gt;2&lt;/big&gt;<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Quelle valeur de <code>target<\/code> ouvre un nouvel onglet ?<\/div><button class=\"opt\" data-o=\"0\"><code>_self<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>_top<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>_blank<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Pour lier vers <code>&lt;h2 id=&quot;tp&quot;&gt;<\/code>, on écrit…<\/div><button class=\"opt\" data-o=\"0\"><code>&lt;a href=&quot;tp&quot;&gt;<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>&lt;a href=&quot;#tp&quot;&gt;<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>&lt;a id=&quot;#tp&quot;&gt;<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Quel attribut affiche une infobulle au survol d&#39;un lien ?<\/div><button class=\"opt\" data-o=\"0\"><code>alt<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>title<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>href<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Où se place une liste imbriquée ?<\/div><button class=\"opt\" data-o=\"0\">entre deux <code>&lt;li&gt;<\/code>, directement dans <code>&lt;ul&gt;<\/code><\/button><button class=\"opt\" data-o=\"1\">à l&#39;intérieur d&#39;un <code>&lt;li&gt;<\/code><\/button><button class=\"opt\" data-o=\"2\">après <code>&lt;/ul&gt;<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">En HTML5, pour écrire un texte en rouge, on utilise…<\/div><button class=\"opt\" data-o=\"0\"><code>&lt;font color=&quot;red&quot;&gt;<\/code><\/button><button class=\"opt\" data-o=\"1\">la propriété CSS <code>color: red<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>&lt;blink&gt;<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\"><code>mailto:<\/code> dans un <code>href<\/code> sert à…<\/div><button class=\"opt\" data-o=\"0\">envoyer un formulaire<\/button><button class=\"opt\" data-o=\"1\">ouvrir la messagerie pour écrire à une adresse<\/button><button class=\"opt\" data-o=\"2\">télécharger un fichier<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"texte-listes-liens","rep":null,"tol":null},{"n":"texte-listes-liens","rep":null,"tol":null},{"n":"texte-listes-liens","rep":null,"tol":null},{"n":"texte-listes-liens","rep":null,"tol":null}],"qcm":[{"n":"texte-listes-liens","q":"Quelle balise est de type bloc ?","o":["<code>&lt;strong&gt;<\/code>","<code>&lt;p&gt;<\/code>","<code>&lt;a&gt;<\/code>"],"a":1,"e":"Le paragraphe occupe toute la largeur."},{"n":"texte-listes-liens","q":"Quelle balise est en ligne ?","o":["<code>&lt;div&gt;<\/code>","<code>&lt;ul&gt;<\/code>","<code>&lt;span&gt;<\/code>"],"a":2,"e":"<code>span<\/code> est le conteneur générique en ligne."},{"n":"texte-listes-liens","q":"<code>&lt;ol&gt;<\/code> produit…","o":["une liste numérotée","une liste à puces","une liste de définitions"],"a":0,"e":"ol = ordered list."},{"n":"texte-listes-liens","q":"Comment écrire x² en HTML ?","o":["<code>x&lt;sub&gt;2&lt;/sub&gt;<\/code>","<code>x&lt;sup&gt;2&lt;/sup&gt;<\/code>","<code>x&lt;big&gt;2&lt;/big&gt;<\/code>"],"a":1,"e":"sup = exposant, sub = indice."},{"n":"texte-listes-liens","q":"Quelle valeur de <code>target<\/code> ouvre un nouvel onglet ?","o":["<code>_self<\/code>","<code>_top<\/code>","<code>_blank<\/code>"],"a":2,"e":"<code>_self<\/code> est la valeur par défaut. Attention à la faute <code>_balnk<\/code> des diapos."},{"n":"texte-listes-liens","q":"Pour lier vers <code>&lt;h2 id=&quot;tp&quot;&gt;<\/code>, on écrit…","o":["<code>&lt;a href=&quot;tp&quot;&gt;<\/code>","<code>&lt;a href=&quot;#tp&quot;&gt;<\/code>","<code>&lt;a id=&quot;#tp&quot;&gt;<\/code>"],"a":1,"e":"Le <code>#<\/code> suivi de l&#39;id."},{"n":"texte-listes-liens","q":"Quel attribut affiche une infobulle au survol d&#39;un lien ?","o":["<code>alt<\/code>","<code>title<\/code>","<code>href<\/code>"],"a":1,"e":"<code>title<\/code> donne une brève description."},{"n":"texte-listes-liens","q":"Où se place une liste imbriquée ?","o":["entre deux <code>&lt;li&gt;<\/code>, directement dans <code>&lt;ul&gt;<\/code>","à l&#39;intérieur d&#39;un <code>&lt;li&gt;<\/code>","après <code>&lt;/ul&gt;<\/code>"],"a":1,"e":"Le seul enfant direct autorisé de <code>ul<\/code>/<code>ol<\/code> est <code>li<\/code>."},{"n":"texte-listes-liens","q":"En HTML5, pour écrire un texte en rouge, on utilise…","o":["<code>&lt;font color=&quot;red&quot;&gt;<\/code>","la propriété CSS <code>color: red<\/code>","<code>&lt;blink&gt;<\/code>"],"a":1,"e":"<code>font<\/code> est obsolète ; la présentation passe par le CSS."},{"n":"texte-listes-liens","q":"<code>mailto:<\/code> dans un <code>href<\/code> sert à…","o":["envoyer un formulaire","ouvrir la messagerie pour écrire à une adresse","télécharger un fichier"],"a":1,"e":"Il faut un logiciel de messagerie installé."}]},{"id":"tableaux-images-medias","t":"HTML5 (3) · tableaux, images, audio et vidéo","seance":"Partie II · HTML5, tableaux et médias","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu dois savoir imbriquer des balises et écrire des attributs (chapitre 2).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Dans <code>&lt;img src=&quot;logo.png&quot; alt=&quot;Logo&quot;&gt;<\/code>, pourquoi n&#39;y a-t-il pas de <code>&lt;/img&gt;<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Parce que <code>img<\/code> est une <strong>balise orpheline<\/strong> : elle n&#39;a pas de contenu, donc pas de fermante.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Un tableau se lit ligne par ligne.<\/strong> On n&#39;écrit jamais une colonne : on écrit des <strong>rangées<\/strong> (<code>tr<\/code>), et chaque rangée contient ses <strong>cellules<\/strong> (<code>td<\/code>). Les colonnes apparaissent toutes seules.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Avec <code>colspan<\/code> ou <code>rowspan<\/code>, oublier d&#39;<strong>enlever<\/strong> les cellules recouvertes. Une cellule qui s&#39;étend sur 2 colonnes « prend la place » d&#39;une cellule : la rangée en contient une de moins.<\/p>\n<\/aside><p>À la fin, tu sais construire un tableau avec fusion de cellules, insérer une image avec un texte alternatif, et intégrer un son ou une vidéo avec ses contrôles.<\/p>\n<h2>Idée 1 · table, tr, td, th, caption<\/h2>\n<figure class=\"grille\"><figcaption>Un tableau = des rangées (tr) qui contiennent des cellules (td)<\/figcaption><table><tr><th><\/th><th>colonne1<\/th><th>colonne2<\/th><\/tr><tr><th>tr(en-tête)<\/th><td class=\"h2\">Ville<\/td><td class=\"h2\">Distance<\/td><\/tr><tr><th>tr<\/th><td>Béni<\/td><td>Mellal<\/td><td>0<\/td><td>km<\/td><\/tr><tr><th>tr<\/th><td>Khouribga<\/td><td>100<\/td><td>km<\/td><\/tr><\/table><\/figure><pre class=\"\"><code>&lt;table border=&quot;1&quot;&gt;\n    &lt;caption&gt;Distances depuis Béni Mellal&lt;/caption&gt;\n    &lt;tr&gt;\n        &lt;th&gt;Ville&lt;/th&gt;\n        &lt;th&gt;Distance&lt;/th&gt;\n    &lt;/tr&gt;\n    &lt;tr&gt;\n        &lt;td&gt;Khouribga&lt;/td&gt;\n        &lt;td&gt;100 km&lt;/td&gt;\n    &lt;/tr&gt;\n&lt;/table&gt;<\/code><\/pre><table>\n<thead>\n<tr>\n<th>Balise<\/th>\n<th>Signification<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>table<\/code><\/td>\n<td>le tableau<\/td>\n<\/tr>\n<tr>\n<td><code>caption<\/code><\/td>\n<td>la légende, <strong>juste après<\/strong> <code>&lt;table&gt;<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>tr<\/code><\/td>\n<td><em>table row<\/em> : une rangée<\/td>\n<\/tr>\n<tr>\n<td><code>td<\/code><\/td>\n<td><em>table data<\/em> : une cellule<\/td>\n<\/tr>\n<tr>\n<td><code>th<\/code><\/td>\n<td><em>table header<\/em> : une cellule d&#39;en-tête (en gras, centrée)<\/td>\n<\/tr>\n<\/tbody><\/table>\n<aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>« L&#39;élément <code>&lt;table&gt;<\/code> n&#39;est <strong>pas<\/strong> un outil de mise en page ! » Il sert à présenter des <strong>données<\/strong> en lignes et colonnes. La mise en forme se fait en CSS.<\/p>\n<\/aside><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Les diapos utilisent les attributs <code>border<\/code>, <code>width<\/code>, <code>align<\/code>, <code>valign<\/code> (et écrivent <code>valign=&quot;midlle&quot;<\/code> au lieu de <strong><code>middle<\/code><\/strong>). Ils fonctionnent encore dans les navigateurs mais sont <strong>obsolètes en HTML5<\/strong> : en CSS on écrit <code>border<\/code>, <code>width<\/code>, <code>text-align<\/code>, <code>vertical-align<\/code>. Le corrigé du TD utilise <code>border=&quot;1&quot;<\/code> : c&#39;est accepté en TD.<\/p>\n<\/aside><h2>Idée 2 · Fusionner : colspan et rowspan<\/h2>\n<div style=\"display:flex;flex-wrap:wrap;gap:24px;margin:10px 0\">\n<table style=\"border-collapse:collapse\" aria-label=\"colspan 2\">\n<tr><td colspan=\"2\" style=\"border:2px solid #D9824F;padding:6px 18px;text-align:center\">Cellule 1 (colspan=\"2\")<\/td><\/tr>\n<tr><td style=\"border:1px solid currentColor;padding:6px 18px\">Cellule 2<\/td><td style=\"border:1px solid currentColor;padding:6px 18px\">Cellule 3<\/td><\/tr>\n<\/table>\n<table style=\"border-collapse:collapse\" aria-label=\"rowspan 3\">\n<tr><td rowspan=\"3\" style=\"border:2px solid #D9824F;padding:6px 18px\">Cellule 1<br>(rowspan=\"3\")<\/td><td style=\"border:1px solid currentColor;padding:6px 18px\">Cellule 2<\/td><\/tr>\n<tr><td style=\"border:1px solid currentColor;padding:6px 18px\">Cellule 3<\/td><\/tr>\n<tr><td style=\"border:1px solid currentColor;padding:6px 18px\">Cellule 4<\/td><\/tr>\n<\/table>\n<\/div><pre class=\"\"><code>&lt;table border=&quot;1&quot;&gt;\n    &lt;tr&gt;&lt;td colspan=&quot;2&quot;&gt;Cellule 1&lt;/td&gt;&lt;/tr&gt;             &lt;!-- 1 cellule, 2 colonnes --&gt;\n    &lt;tr&gt;&lt;td&gt;Cellule 2&lt;/td&gt;&lt;td&gt;Cellule 3&lt;/td&gt;&lt;/tr&gt;\n&lt;/table&gt;\n&lt;table border=&quot;1&quot;&gt;\n    &lt;tr&gt;&lt;td rowspan=&quot;3&quot;&gt;Cellule 1&lt;/td&gt;&lt;td&gt;Cellule 2&lt;/td&gt;&lt;/tr&gt;\n    &lt;tr&gt;&lt;td&gt;Cellule 3&lt;/td&gt;&lt;/tr&gt;                         &lt;!-- 1 seule td : la 1re colonne est prise --&gt;\n    &lt;tr&gt;&lt;td&gt;Cellule 4&lt;/td&gt;&lt;/tr&gt;\n&lt;/table&gt;<\/code><\/pre><figure class=\"etapes\" data-i=\"0\"><figcaption>Construire un tableau avec fusion<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Dessine la grille<\/div><p>Compte les colonnes réelles (ici 2) et les rangées (ici 3).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Repère les cellules fusionnées<\/div><p>Cellule 1 couvre 3 rangées → <code>rowspan=&quot;3&quot;<\/code> sur sa <code>td<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Écris rangée par rangée<\/div><p>Rangée 1 : Cellule 1 + Cellule 2. Rangées 2 et 3 : une seule <code>td<\/code> chacune.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Vérifie<\/div><p>Chaque rangée doit « totaliser » le même nombre de colonnes, en comptant les cellules qui débordent d&#39;en haut.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p><code>colspan<\/code> = nombre de <strong>colonnes<\/strong> couvertes (vers la droite). <code>rowspan<\/code> = nombre de <strong>rangées<\/strong> couvertes (vers le bas), <strong>la sienne comprise<\/strong>.<\/p>\n<\/aside><h2>Idée 3 · Images : src et alt<\/h2>\n<pre class=\"\"><code>&lt;img src=&quot;img/profil.jpg&quot; alt=&quot;Photo de Hamza&quot; width=&quot;150&quot;&gt;\n&lt;hr&gt;<\/code><\/pre><ul>\n<li><code>src<\/code> : le chemin de l&#39;image (mêmes règles que <code>href<\/code> : relatif ou URL complète).<\/li>\n<li><code>alt<\/code> : <strong>texte alternatif<\/strong>, affiché si l&#39;image ne charge pas, et lu par les lecteurs d&#39;écran.<\/li>\n<li><code>width<\/code>, <code>height<\/code> : dimensions (en pixels, ou <code>%<\/code> de la page).<\/li>\n<li><code>&lt;hr&gt;<\/code> : ligne horizontale de séparation.<\/li>\n<\/ul>\n<aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>Une grosse image ralentit le chargement : présente une <strong>petite<\/strong> image qui mène vers l&#39;image complète. Et prévois toujours un texte <code>alt<\/code>.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Si tu donnes <strong>width et height<\/strong> qui ne respectent pas les proportions, l&#39;image est <strong>déformée<\/strong>. Donne une seule des deux dimensions, l&#39;autre s&#39;adapte.<\/p>\n<\/aside><h2>Idée 4 · Audio et vidéo<\/h2>\n<figure class=\"flux\"><figcaption>Intégrer un média HTML5<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\"><audio src=\"...\" controls><\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\"><video src=\"...\" controls width=\"...\"><\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">lecture dans la page, sans plugin<\/div><\/div><\/figure><pre class=\"\"><code>&lt;audio src=&quot;ballade.mp3&quot; controls preload=&quot;auto&quot;&gt;&lt;/audio&gt;\n&lt;video src=&quot;presentation.mp4&quot; controls width=&quot;400&quot;&gt;&lt;/video&gt;<\/code><\/pre><table>\n<thead>\n<tr>\n<th>Attribut<\/th>\n<th>Effet<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>controls<\/code><\/td>\n<td>affiche les boutons lecture / pause / volume<\/td>\n<\/tr>\n<tr>\n<td><code>muted<\/code><\/td>\n<td>son coupé<\/td>\n<\/tr>\n<tr>\n<td><code>preload=&quot;auto&quot;<\/code><\/td>\n<td>précharge le fichier<\/td>\n<\/tr>\n<tr>\n<td><code>width<\/code>, <code>height<\/code><\/td>\n<td>taille de la zone vidéo<\/td>\n<\/tr>\n<\/tbody><\/table>\n<aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Sans <code>controls<\/code>, la vidéo s&#39;affiche mais l&#39;utilisateur <strong>ne peut pas la lancer<\/strong> (pas de bouton).<\/p>\n<\/aside><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le cours cite aussi l&#39;attribut <code>mediagroup<\/code> (synchroniser deux vidéos, par exemple une interprétation en langue des signes). Il a été <strong>retiré<\/strong> de la norme HTML et n&#39;est supporté par aucun navigateur actuel. Les autres contenus embarqués cités (<code>canvas<\/code>, <code>iframe<\/code>, <code>object<\/code>, <code>map<\/code>/<code>area<\/code>) ne sont pas détaillés dans le cours.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Tableaux et médias<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Combien de <code>&lt;td&gt;<\/code> faut-il écrire dans un tableau de 3 rangées × 2 colonnes si la première cellule a <code>rowspan=&quot;3&quot;<\/code> ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>6 cellules au total, moins celles recouvertes.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 4<\/b><\/p><p>6 positions, la Cellule 1 en occupe 3 avec <strong>une seule<\/strong> <code>td<\/code> : 6 − 3 + 1 = <strong>4<\/strong> <code>td<\/code> (Cellule 1, 2, 3, 4).<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Écris un tableau avec une légende « Notes S3 », une rangée d&#39;en-tête (Module, Note) et une rangée (Web 1, 14).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><pre class=\"\"><code>&lt;table border=&quot;1&quot;&gt;\n    &lt;caption&gt;Notes S3&lt;/caption&gt;\n    &lt;tr&gt;&lt;th&gt;Module&lt;/th&gt;&lt;th&gt;Note&lt;/th&gt;&lt;/tr&gt;\n    &lt;tr&gt;&lt;td&gt;Web 1&lt;/td&gt;&lt;td&gt;14&lt;/td&gt;&lt;/tr&gt;\n&lt;/table&gt;<\/code><\/pre><div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Écris la balise d&#39;une vidéo <code>intro.mp4<\/code> avec les boutons de contrôle, sans le son (TP 2, exercice 3).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>&lt;video src=&quot;intro.mp4&quot; controls muted&gt;&lt;/video&gt;<\/code><\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 7 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quelle balise représente une rangée de tableau ?<\/div><button class=\"opt\" data-o=\"0\"><code>&lt;td&gt;<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>&lt;tr&gt;<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>&lt;th&gt;<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\"><code>&lt;th&gt;<\/code> désigne…<\/div><button class=\"opt\" data-o=\"0\">une cellule fusionnée<\/button><button class=\"opt\" data-o=\"1\">une cellule d&#39;en-tête<\/button><button class=\"opt\" data-o=\"2\">la légende du tableau<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Où se place <code>&lt;caption&gt;<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">juste après <code>&lt;table&gt;<\/code><\/button><button class=\"opt\" data-o=\"1\">à la fin du tableau<\/button><button class=\"opt\" data-o=\"2\">dans un <code>&lt;td&gt;<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Une cellule qui occupe 2 colonnes utilise…<\/div><button class=\"opt\" data-o=\"0\"><code>colspan=&quot;2&quot;<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>rowspan=&quot;2&quot;<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>span=&quot;2&quot;<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Tableau 2 colonnes, 3 rangées, Cellule 1 avec <code>rowspan=&quot;3&quot;<\/code>. Combien de <code>td<\/code> dans la 2e rangée ?<\/div><button class=\"opt\" data-o=\"0\">0<\/button><button class=\"opt\" data-o=\"1\">1<\/button><button class=\"opt\" data-o=\"2\">2<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">À quoi sert <code>alt<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">à fixer la largeur<\/button><button class=\"opt\" data-o=\"1\">à afficher un texte si l&#39;image ne charge pas<\/button><button class=\"opt\" data-o=\"2\">à afficher une infobulle de lien<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Que se passe-t-il si on donne width et height disproportionnés à une image ?<\/div><button class=\"opt\" data-o=\"0\">rien<\/button><button class=\"opt\" data-o=\"1\">l&#39;image est déformée<\/button><button class=\"opt\" data-o=\"2\">l&#39;image ne s&#39;affiche pas<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Quel attribut affiche les boutons de lecture d&#39;une vidéo ?<\/div><button class=\"opt\" data-o=\"0\"><code>play<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>controls<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>preload<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Pour couper le son d&#39;une vidéo par défaut :<\/div><button class=\"opt\" data-o=\"0\"><code>muted<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>silent<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>volume=&quot;0&quot;<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div cl
