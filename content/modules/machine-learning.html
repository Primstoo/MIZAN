39;échantillon d&#39;entraînement a :<\/div><button class=\"opt\" data-o=\"0\">une régularisation trop forte<\/button><button class=\"opt\" data-o=\"1\">un biais élevé<\/button><button class=\"opt\" data-o=\"2\">une variance élevée<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"12\"><div class=\"qq-q\">Quelle régularisation peut annuler <strong>exactement<\/strong> certains coefficients ?<\/div><button class=\"opt\" data-o=\"0\">L1 (Lasso)<\/button><button class=\"opt\" data-o=\"1\">L2 (Ridge)<\/button><button class=\"opt\" data-o=\"2\">aucune des deux<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"13\"><div class=\"qq-q\">Si $\\lambda \\to \\infty$ en régularisation :<\/div><button class=\"opt\" data-o=\"0\">le modèle surapprend<\/button><button class=\"opt\" data-o=\"1\">les poids tendent vers 0 et le modèle sous-apprend<\/button><button class=\"opt\" data-o=\"2\">on retrouve la régression sans pénalité<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"14\"><div class=\"qq-q\">Comment choisir $\\lambda$ ?<\/div><button class=\"opt\" data-o=\"0\">en minimisant l&#39;erreur d&#39;entraînement<\/button><button class=\"opt\" data-o=\"1\">sur le jeu de test<\/button><button class=\"opt\" data-o=\"2\">sur un jeu de validation ou par validation croisée<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"15\"><div class=\"qq-q\">La régularisation est :<\/div><button class=\"opt\" data-o=\"0\">une modification de la fonction objectif<\/button><button class=\"opt\" data-o=\"1\">une méthode de séparation des données<\/button><button class=\"opt\" data-o=\"2\">un algorithme d&#39;optimisation<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"ml-fondements-maths","rep":["-6"],"tol":null},{"n":"ml-fondements-maths","rep":["13.33"],"tol":0.01},{"n":"ml-fondements-maths","rep":["200"],"tol":null},{"n":"ml-fondements-maths","rep":["3"],"tol":null},{"n":"ml-fondements-maths","rep":["5.25"],"tol":null}],"qcm":[{"n":"ml-fondements-maths","q":"Dans $\\hat y = f_\\theta(x)$, que représente $\\theta$ ?","o":["les paramètres appris du modèle","le bruit irréductible","la valeur réelle de la cible"],"a":0,"e":"$\\theta$ regroupe les paramètres ajustés pendant l&#39;entraînement, par exemple $(w, b)$."},{"n":"ml-fondements-maths","q":"Avec $\\hat y = 10x + 50$ (kDH), le prix prédit pour 100 m² est :","o":["1 000 kDH","1 050 kDH","1 500 kDH"],"a":1,"e":"$10 \\times 100 + 50 = 1\\,050$."},{"n":"ml-fondements-maths","q":"Prix réel 650, prix prédit 630. La perte quadratique vaut :","o":["400 kDH","20","400 kDH²"],"a":2,"e":"$(650 - 630)^2 = 400$, exprimée dans le carré de l&#39;unité."},{"n":"ml-fondements-maths","q":"Quelle métrique est la plus <strong>robuste<\/strong> aux valeurs aberrantes ?","o":["la MAE","la MSE","la RMSE"],"a":0,"e":"La MAE pénalise linéairement ; MSE et RMSE élèvent les erreurs au carré."},{"n":"ml-fondements-maths","q":"Une erreur multipliée par 10 multiplie la contribution à la MSE par :","o":["10","100","20"],"a":1,"e":"Le carré : $10^2 = 100$."},{"n":"ml-fondements-maths","q":"Pourquoi présenter la RMSE plutôt que la MSE à un décideur ?","o":["elle ignore les grandes erreurs","elle est toujours plus petite","elle s&#39;exprime dans l&#39;unité de la cible"],"a":2,"e":"La MSE est en unité², difficile à interpréter ; la racine revient à l&#39;unité de $y$."},{"n":"ml-fondements-maths","q":"La règle de mise à jour de la descente de gradient est :","o":["$w \\leftarrow w - \\eta \\, dJ/dw$","$w \\leftarrow \\eta \\, dJ/dw$","$w \\leftarrow w + \\eta \\, dJ/dw$"],"a":0,"e":"On va à l&#39;opposé du gradient, qui pointe vers la hausse."},{"n":"ml-fondements-maths","q":"$J(w) = (w-3)^2$, $\\eta = 0{,}1$, $w_0 = 0$. Que vaut $w_1$ ?","o":["0,3","0,6","1,08"],"a":1,"e":"$w_1 = 0 - 0{,}1 \\times 2(0 - 3) = 0{,}6$. Ensuite $w_2 = 1{,}08$."},{"n":"ml-fondements-maths","q":"Un taux d&#39;apprentissage trop grand peut provoquer :","o":["un sous-apprentissage garanti","une convergence trop lente","des oscillations ou une divergence"],"a":2,"e":"Les pas sautent par-dessus le minimum."},{"n":"ml-fondements-maths","q":"Le gradient calculé sur <strong>une seule<\/strong> observation tirée au hasard correspond à :","o":["la descente de gradient stochastique (SGD)","la descente par mini-lots","la descente de gradient batch"],"a":0,"e":"La SGD est rapide à chaque pas, mais sa trajectoire est bruitée."},{"n":"ml-fondements-maths","q":"Un modèle linéaire utilisé pour une relation fortement courbe souffre surtout de :","o":["bruit irréductible nul","biais élevé","variance élevée"],"a":1,"e":"Hypothèse trop simple : erreur systématique, sous-apprentissage."},{"n":"ml-fondements-maths","q":"Un modèle dont les prédictions changent beaucoup quand on change un peu l&#39;échantillon d&#39;entraînement a :","o":["une régularisation trop forte","un biais élevé","une variance élevée"],"a":2,"e":"La variance mesure la sensibilité aux fluctuations du train."},{"n":"ml-fondements-maths","q":"Quelle régularisation peut annuler <strong>exactement<\/strong> certains coefficients ?","o":["L1 (Lasso)","L2 (Ridge)","aucune des deux"],"a":0,"e":"Sa contrainte à coins pousse des $w_j$ à 0 : sélection automatique de variables."},{"n":"ml-fondements-maths","q":"Si $\\lambda \\to \\infty$ en régularisation :","o":["le modèle surapprend","les poids tendent vers 0 et le modèle sous-apprend","on retrouve la régression sans pénalité"],"a":1,"e":"C&#39;est $\\lambda = 0$ qui redonne le modèle non régularisé."},{"n":"ml-fondements-maths","q":"Comment choisir $\\lambda$ ?","o":["en minimisant l&#39;erreur d&#39;entraînement","sur le jeu de test","sur un jeu de validation ou par validation croisée"],"a":2,"e":"Sur le train on trouverait toujours $\\lambda = 0$ ; le test doit rester intact."},{"n":"ml-fondements-maths","q":"La régularisation est :","o":["une modification de la fonction objectif","une méthode de séparation des données","un algorithme d&#39;optimisation"],"a":0,"e":"Elle ajoute $\\lambda R(\\theta)$ à $J$ ; on minimise ensuite avec un optimiseur."}]},{"id":"ml-regression","t":"Régression linéaire, polynomiale et régularisée","seance":"Séance 4 · 22 octobre 2026 (+ rappel mathématique)","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il te faut la moyenne, la notion de variance, et la règle de mise à jour de la descente de gradient (chapitre 3).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Calcule la moyenne et la variance de $x = [50, 70, 90, 110]$ (variance = moyenne des carrés des écarts à la moyenne).<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>Écarts à la moyenne : −30, −10, 10, 30.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 500<\/b><\/p><p>Moyenne $\\bar x = 80$. Variance $= (900 + 100 + 100 + 900) / 4 = 500$. Ce sont exactement les valeurs de l&#39;exemple du prof.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « droite qui passe au mieux ».<\/strong> La régression linéaire choisit la droite (ou le plan) qui rend la somme des <strong>carrés des erreurs verticales<\/strong> la plus petite possible. Toutes les formules en découlent.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Croire que « linéaire » veut dire « droite en $x$ ». Le modèle doit être linéaire <strong>en ses paramètres<\/strong>. $\\hat y = w_0 + w_1 x + w_2 x^2$ est une régression <strong>linéaire<\/strong> (polynomiale), même si la courbe est une parabole.<\/p>\n<\/aside><p>À la fin, tu sais calculer $w$ et $b$ par les moindres carrés, interpréter un coefficient, calculer MAE, RMSE et $R^2$, et expliquer quand utiliser la régression polynomiale, Ridge ou Lasso.<\/p>\n<h2>Idée 1 · La régression linéaire simple<\/h2>\n<svg viewBox=\"0 0 340 180\" style=\"width:100%;max-width:420px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Quatre points de prix en fonction de la superficie, la droite des moindres carrés et les résidus verticaux en pointillés\">\n<g font-family=\"sans-serif\" font-size=\"11\" fill=\"currentColor\">\n<path d=\"M40 160H330M40 160V10\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n<line x1=\"60\" y1=\"140\" x2=\"320\" y2=\"25\" stroke=\"#D9824F\" stroke-width=\"2.5\"/>\n<g stroke=\"currentColor\" stroke-dasharray=\"3 3\"><line x1=\"90\" y1=\"128\" x2=\"90\" y2=\"126\"/><line x1=\"150\" y1=\"104\" x2=\"150\" y2=\"100\"/><line x1=\"210\" y1=\"64\" x2=\"210\" y2=\"74\"/><line x1=\"270\" y1=\"52\" x2=\"270\" y2=\"47\"/><\/g>\n<circle cx=\"90\" cy=\"127\" r=\"4.5\"/><circle cx=\"150\" cy=\"104\" r=\"4.5\"/><circle cx=\"210\" cy=\"64\" r=\"4.5\"/><circle cx=\"270\" cy=\"52\" r=\"4.5\"/>\n<text x=\"240\" y=\"22\" fill=\"#D9824F\">ŷ = 9,35x + 34,5<\/text><text x=\"215\" y=\"90\">résidu e₃ = +24<\/text>\n<text x=\"280\" y=\"176\">superficie (m²)<\/text><text x=\"45\" y=\"18\">prix (kDH)<\/text><\/g>\n<\/svg><p>$$\\hat y = wx + b$$<\/p>\n<ul>\n<li>$w$ : la <strong>pente<\/strong>, la hausse prédite pour une unité de $x$ en plus ;<\/li>\n<li>$b$ : l&#39;<strong>ordonnée à l&#39;origine<\/strong>, la valeur prédite pour $x = 0$ ;<\/li>\n<li>le <strong>résidu<\/strong> $e_i = y_i - \\hat y_i$ : distance <strong>verticale<\/strong> entre le point et la droite. $e_i &gt; 0$ : le modèle a <strong>sous-estimé<\/strong> ; $e_i &lt; 0$ : il a <strong>surestimé<\/strong>.<\/li>\n<\/ul>\n<p><strong>Les moindres carrés ordinaires (MCO).<\/strong> On minimise $J(w, b) = \\frac1n \\sum (y_i - wx_i - b)^2$. $J$ est convexe (un bol) : son minimum est là où les dérivées partielles s&#39;annulent. On obtient :<\/p>\n<p>$$w = \\frac{\\text{Cov}(x, y)}{\\text{Var}(x)} = \\frac{\\sum (x_i - \\bar x)(y_i - \\bar y)}{\\sum (x_i - \\bar x)^2}, \\qquad b = \\bar y - w\\,\\bar x$$<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>L'exemple du prof : (50, 500), (70, 680), (90, 900), (110, 1050)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/6 · Moyennes<\/div><p>$\\bar x = 80$ m², $\\bar y = 782{,}5$ kDH.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/6 · Variance de x<\/div><p>$\\text{Var}(x) = (900 + 100 + 100 + 900)/4 = 500$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/6 · Covariance<\/div><p>$\\big[(-30)(-282{,}5) + (-10)(-102{,}5) + (10)(117{,}5) + (30)(267{,}5)\\big]/4 = 18\\,700/4 = 4\\,675$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/6 · Pente<\/div><p>$w = 4\\,675 / 500 = 9{,}35$ kDH par m², soit 9 350 DH/m².<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/6 · Biais<\/div><p>$b = 782{,}5 - 9{,}35 \\times 80 = 34{,}5$ kDH.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">6/6 · Prédiction<\/div><p>$\\hat y(80) = 9{,}35 \\times 80 + 34{,}5 = 782{,}5$ kDH. Normal : la droite passe par le point moyen $(\\bar x, \\bar y)$.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><figure class=\"grille\"><figcaption>Prédictions et résidus de la droite ŷ = 9,35x + 34,5<\/figcaption><table><tr><th><\/th><th>x<\/th><th>y<\/th><th>ŷ<\/th><th>*e<\/th><\/tr><tr><th>L1<\/th><td>50<\/td><td>500<\/td><td>502<\/td><td class=\"h1\">-2<\/td><\/tr><tr><th>L2<\/th><td>70<\/td><td>680<\/td><td>689<\/td><td class=\"h1\">-9<\/td><\/tr><tr><th>L3<\/th><td>90<\/td><td>900<\/td><td>876<\/td><td class=\"h1\">24<\/td><\/tr><tr><th>L4<\/th><td>110<\/td><td>1050<\/td><td>1063<\/td><td class=\"h1\">-13<\/td><\/tr><\/table><\/figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Avec un biais $b$, la somme des résidus MCO est <strong>toujours nulle<\/strong> : $-2 - 9 + 24 - 13 = 0$. C&#39;est pour ça qu&#39;on ne peut pas mesurer l&#39;erreur par $\\sum e_i$ : on prend des carrés ou des valeurs absolues.<\/p>\n<\/aside><p><strong>Interprétation.<\/strong> $b = 34{,}5$ n&#39;a pas de sens économique (un logement de 0 m² n&#39;existe pas), mais il cale la droite. Changer d&#39;unité change $w$, pas la qualité du modèle : en DH au lieu de kDH, $w$ et $b$ sont multipliés par 1 000.<\/p>\n<p><strong>Corrélation n&#39;est pas causalité<\/strong> : le modèle montre une association entre surface et prix, pas que la surface est la seule cause du prix.<\/p>\n<p><strong>Interpolation ou extrapolation ?<\/strong> Les données vont de 50 à 110 m². Prédire pour 80 m² est une <strong>interpolation<\/strong> (risque faible). Prédire pour un château de 1 000 m² est une <strong>extrapolation<\/strong> : on suppose que la droite continue à l&#39;infini, souvent faux.<\/p>\n<h2>Idée 2 · La régression linéaire multiple<\/h2>\n<p>$$\\hat y = w_1 x_1 + w_2 x_2 + \\dots + w_p x_p + b = w^T x + b$$<\/p>\n<p>Avec $p = 1$ c&#39;est une droite, avec $p = 2$ un <strong>plan<\/strong>, au-delà un <strong>hyperplan<\/strong>.<\/p>\n<p>Exemple du prof : $\\hat y = 8x_1 + 30x_2 - 5x_3 + 100$ (surface, chambres, distance en km ; prix en kDH). Pour 80 m², 3 chambres, 5 km :<\/p>\n<p>$$\\hat y = 640 + 90 - 25 + 100 = 805 \\text{ kDH}$$<\/p>\n<p><strong>Toutes choses égales par ailleurs<\/strong> (<em>ceteris paribus<\/em>) : $w_3 = -5$ signifie qu&#39;à surface et chambres identiques, 1 km de plus fait baisser la prédiction de 5 000 DH.<\/p>\n<aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p><strong>Multicolinéarité.<\/strong> Si deux variables sont très corrélées (surface et nombre de chambres), leurs coefficients deviennent instables et difficiles à interpréter un par un. Tu le verras dans le code plus bas.<\/p>\n<\/aside><p><strong>Forme matricielle.<\/strong> On ajoute une colonne de 1 à $X$ pour absorber le biais ($\\tilde X$). On minimise $\\frac1n\\lVert y - \\tilde X \\tilde w \\rVert^2$ ; le gradient s&#39;annule pour les <strong>équations normales<\/strong> :<\/p>\n<p>$$\\tilde X^T \\tilde X\\, \\tilde w = \\tilde X^T y \\quad\\Longrightarrow\\quad \\hat w = (\\tilde X^T \\tilde X)^{-1} \\tilde X^T y$$<\/p>\n<p>Il faut que $\\tilde X^T \\tilde X$ soit inversible : pas de multicolinéarité <strong>parfaite<\/strong>. Géométriquement, $\\hat y = Hy$ est la <strong>projection orthogonale<\/strong> de $y$ sur l&#39;espace engendré par les colonnes de $\\tilde X$, et les résidus sont orthogonaux à ces colonnes : $\\tilde X^T e = 0$.<\/p>\n<aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>Le rappel mathématique du prof démontre ces formules pas à pas (dérivée par rapport à $b$, puis à $w$, règle de la chaîne, propriété $\\sum (y_i - \\bar y) = 0$). En QCM, retiens surtout le résultat et les conditions.<\/p>\n<\/aside><h2>Idée 3 · Évaluer une régression<\/h2>\n<p>$$\\text{MAE} = \\frac1n \\sum |e_i| \\qquad \\text{MSE} = \\frac1n \\sum e_i^2 \\qquad \\text{RMSE} = \\sqrt{\\text{MSE}}$$<\/p>\n<p>$$R^2 = 1 - \\frac{SS_{res}}{SS_{tot}} = 1 - \\frac{\\sum (y_i - \\hat y_i)^2}{\\sum (y_i - \\bar y)^2}$$<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Les 4 logements, e = [−2, −9, 24, −13]<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · MAE<\/div><p>$(2 + 9 + 24 + 13)/4 = 12$ kDH.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · MSE<\/div><p>$(4 + 81 + 576 + 169)/4 = 830/4 = 207{,}5$ kDH².<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · RMSE<\/div><p>$\\sqrt{207{,}5} \\approx 14{,}4$ kDH.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · SS_tot<\/div><p>$282{,}5^2 + 102{,}5^2 + 117{,}5^2 + 267{,}5^2 = 175\\,675$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · R²<\/div><p>$1 - 830 / 175\\,675 \\approx 0{,}9953$, calculé sur le train : il ne prouve pas la généralisation.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>La diapo écrit $SS_{tot} = 178\\,875$. Le bon total est <strong>175 675<\/strong> (refais l&#39;addition : 79 806,25 + 10 506,25 + 13 806,25 + 71 556,25). Le $R^2 \\approx 0{,}9953$ annoncé reste juste à quatre décimales.<\/p>\n<\/aside><table>\n<thead>\n<tr>\n<th>$R^2$<\/th>\n<th>Lecture<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>$= 1$<\/td>\n<td>ajustement parfait<\/td>\n<\/tr>\n<tr>\n<td>$= 0$<\/td>\n<td>le modèle ne fait pas mieux que prédire la moyenne $\\bar y$<\/td>\n<\/tr>\n<tr>\n<td>$&lt; 0$<\/td>\n<td>pire que la moyenne (possible sur le test)<\/td>\n<\/tr>\n<\/tbody><\/table>\n<aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>$R^2 = 0{,}95$ ne veut pas dire « 95 % des prédictions sont exactes ». Il veut dire que <strong>95 % de la variance<\/strong> de $y$ est expliquée par le modèle.<\/p>\n<\/aside><p><strong>MAE ou RMSE ?<\/strong> Modèle A : erreurs $[0, 20]$. Modèle B : $[10, 10]$. Même MAE (10), mais RMSE de A $= \\sqrt{200} \\approx 14{,}14$ contre 10 pour B. La RMSE punit la grosse erreur isolée : choisis-la si les grands écarts sont inacceptables.<\/p>\n<h2>Idée 4 · Quand la droite ne suffit pas : la régression polynomiale<\/h2>\n<p>On enrichit les features : $x \\to (x, x^2, \\dots, x^d)$, puis on applique les MCO.<\/p>\n<p>$$\\hat y = w_0 + w_1 x + w_2 x^2 + \\dots + w_d x^d$$<\/p>\n<p>Non linéaire en $x$, mais <strong>linéaire en $w$<\/strong> : la solution reste $\\hat w = (\\Phi^T\\Phi)^{-1}\\Phi^T y$, avec $\\Phi$ la <strong>matrice de Vandermonde<\/strong>.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Exemple du prof : x = −2, −1, 0, 1, 2 et y = x²<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · Droite (d = 1)<\/div><p>Par symétrie la pente est nulle : $\\hat y = \\bar y = 2$. MSE $= (4 + 1 + 4 + 1 + 4)/5 = 2{,}8$. Biais fort.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · Parabole (d = 2)<\/div><p>Les MCO donnent $\\hat y = x^2$ : MSE = 0, ajustement parfait.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · Degré 9<\/div><p>Erreur d&#39;entraînement nulle, erreur de test qui explose : surapprentissage.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p>Le <strong>degré $d$<\/strong> est un hyperparamètre : on le choisit sur la validation. Pour des degrés élevés, $\\Phi^T\\Phi$ est <strong>mal conditionnée<\/strong> : il faut standardiser.<\/p>\n<p>Avec deux variables, <code>PolynomialFeatures(degree=2)<\/code> crée $x_1, x_2, x_1^2, x_2^2$ et l&#39;<strong>interaction<\/strong> $x_1 x_2$. <code>include_bias=False<\/code> évite une colonne de 1 en double, car <code>LinearRegression<\/code> calcule déjà son biais.<\/p>\n<h2>Idée 5 · Ridge et Lasso en pratique<\/h2>\n<p>$$\\text{Ridge : } \\min\\ \\text{MSE}(w) + \\alpha \\sum w_j^2 \\qquad \\text{Lasso : } \\min\\ \\text{MSE}(w) + \\alpha \\sum |w_j|$$<\/p>\n<p>En scikit-learn, la force de régularisation s&#39;appelle <code>alpha<\/code> ($\\alpha = 0$ : MCO classique ; $\\alpha \\to \\infty$ : tous les poids vers 0). La standardisation est <strong>obligatoire<\/strong> avant Ridge ou Lasso : sinon la pénalité frappe plus fort les variables à petite échelle.<\/p>\n<p>Voici l&#39;atelier du prof, exécuté (10 logements, 70 % / 30 %).<\/p>\n<pre class=\"\"><code>import numpy as np\nimport pandas as pd\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.linear_model import LinearRegression, Ridge, Lasso\nfrom sklearn.preprocessing import PolynomialFeatures, StandardScaler\nfrom sklearn.pipeline import make_pipeline\nfrom sklearn.metrics import mean_absolute_error, mean_squared_error, r2_score\n\ndata = pd.DataFrame({\n    &quot;Surface&quot;: [50, 65, 80, 90, 110, 120, 140, 160, 180, 200],\n    &quot;Chambres&quot;: [1, 2, 2, 3, 3, 4, 4, 4, 5, 5],\n    &quot;Distance_KM&quot;: [12.0, 10.5, 8.0, 6.5, 5.0, 4.0, 3.0, 2.5, 1.5, 1.0],\n    &quot;Prix_kDH&quot;: [150, 185, 230, 270, 310, 360, 410, 450, 520, 580],\n})\nX = data[[&quot;Surface&quot;, &quot;Chambres&quot;, &quot;Distance_KM&quot;]]\ny = data[&quot;Prix_kDH&quot;]\nX_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.3, random_state=42)\n\nlr = LinearRegression().fit(X_train, y_train)\nprint(&quot;w :&quot;, np.round(lr.coef_, 3), &quot; b :&quot;, round(lr.intercept_, 3))\np = lr.predict(X_test)\nprint(f&quot;MAE = {mean_absolute_error(y_test, p):.2f}  RMSE = {np.sqrt(mean_squared_error(y_test, p)):.2f}  R2 = {r2_score(y_test, p):.4f}&quot;)\n\nfor nom, modele in [(&quot;Poly + MCO&quot;, LinearRegression()), (&quot;Poly + Ridge&quot;, Ridge(alpha=10.0)), (&quot;Poly + Lasso&quot;, Lasso(alpha=2.0))]:\n    pipe = make_pipeline(PolynomialFeatures(degree=2, include_bias=False), StandardScaler(), modele)\n    pipe.fit(X_train, y_train)\n    nuls = int(np.sum(np.abs(pipe[-1].coef_) &lt; 1e-9))\n    print(f&quot;{nom} : R2 test = {pipe.score(X_test, y_test):.4f}, coefficients nuls = {nuls}/9&quot;)<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>w : [ 2.637 33.079  9.046]  b : -122.938\nMAE = 12.49  RMSE = 15.57  R2 = 0.9870\nPoly + MCO : R2 test = 0.9646, coefficients nuls = 0/9\nPoly + Ridge : R2 test = 0.9952, coefficients nuls = 0/9\nPoly + Lasso : R2 test = 0.9931, coefficients nuls = 5/9<\/code><\/pre><p>Ce que ce résultat montre :<\/p>\n<ul>\n<li>Le coefficient de la distance est <strong>positif<\/strong> (+9) : absurde « toutes choses égales par ailleurs ». C&#39;est la multicolinéarité : surface, chambres et distance évoluent ensemble dans ces données.<\/li>\n<li>Le polynôme seul fait <strong>moins bien<\/strong> sur le test (0,9646) que le linéaire (0,9870) : 9 features pour 7 logements, il surapprend.<\/li>\n<li>Ridge et Lasso corrigent ce surapprentissage. Lasso met <strong>5 coefficients sur 9 à zéro<\/strong> : sélection de variables.<\/li>\n<li><code>pipe.score(X_test, y_test)<\/code> renvoie directement le $R^2$.<\/li>\n<\/ul>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Sur les diapos, le code de l&#39;atelier a des erreurs de copie : la parenthèse <code>})<\/code> qui ferme le <code>DataFrame<\/code> manque, et la ligne <code>r2 = r2_score(...)<\/code> a perdu son nom de variable. Le commentaire parle de « k€ » et de <code>Prix_kEUR<\/code> alors que tout le cours est en kDH. Le code ci-dessus est corrigé.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Régression à la main<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Données $(1, 2), (2, 3), (3, 5), (4, 6), (5, 9)$ (expérience en années, salaire), exemple du rappel mathématique du prof. Calcule la pente $w$ par les MCO.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>$\\bar x = 3$, $\\bar y = 5$. Écarts de x : −2, −1, 0, 1, 2. Écarts de y : −3, −2, 0, 1, 4.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1.7<\/b><\/p><p>$\\sum (x_i - \\bar x)(y_i - \\bar y) = 6 + 2 + 0 + 1 + 8 = 17$ et $\\sum (x_i - \\bar x)^2 = 10$, donc $w = 1{,}7$.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Même exemple : calcule $b$.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : -0.1<\/b><\/p><p>$b = \\bar y - w\\bar x = 5 - 1{,}7 \\times 3 = -0{,}1$.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Avec $\\hat y = 8x_1 + 30x_2 - 5x_3 + 100$, prédis le prix (kDH) d&#39;un logement de 100 m², 2 chambres, à 4 km.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 940<\/b><\/p><p>$800 + 60 - 20 + 100 = 940$ kDH.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Un résidu vaut $e_i = -15$. Le modèle a-t-il sous-estimé ou surestimé ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Surestimé : $e_i = y_i - \\hat y_i = -15$ donne $\\hat y_i = y_i + 15$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 11 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Les MCO cherchent la droite qui minimise :<\/div><button class=\"opt\" data-o=\"0\">la somme des résidus<\/button><button class=\"opt\" data-o=\"1\">la somme des carrés des résidus<\/button><button class=\"opt\" data-o=\"2\">la plus grande erreur absolue<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">En régression simple, la pente MCO vaut :<\/div><button class=\"opt\" data-o=\"0\">$\\text{Var}(x) / \\text{Cov}(x, y)$<\/button><button class=\"opt\" data-o=\"1\">$\\bar y / \\bar x$<\/button><button class=\"opt\" data-o=\"2\">$\\text{Cov}(x, y) / \\text{Var}(x)$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">La droite des moindres carrés passe toujours par :<\/div><button class=\"opt\" data-o=\"0\">le point moyen $(\\bar x, \\bar y)$<\/button><button class=\"opt\" data-o=\"1\">le premier point des données<\/button><button class=\"opt\" data-o=\"2\">l&#39;origine $(0, 0)$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Dans l&#39;exemple du prof, $w = 9{,}35$ signifie :<\/div><button class=\"opt\" data-o=\"0\">le prix est divisé par 9,35<\/button><button class=\"opt\" data-o=\"1\">chaque m² en plus augmente le prix prédit de 9 350 DH<\/button><button class=\"opt\" data-o=\"2\">un logement coûte 9,35 kDH<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Un résidu $e_i = y_i - \\hat y_i &gt; 0$ signifie que le modèle a :<\/div><button class=\"opt\" data-o=\"0\">surestimé la valeur réelle<\/button><button class=\"opt\" data-o=\"1\">fait une prédiction exacte<\/button><button class=\"opt\" data-o=\"2\">sous-estimé la valeur réelle<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Les données vont de 50 à 110 m². Prédire le prix d&#39;un bien de 1 000 m², c&#39;est :<\/div><button class=\"opt\" data-o=\"0\">une extrapolation risquée<\/button><button class=\"opt\" data-o=\"1\">impossible mathématiquement<\/button><button class=\"opt\" data-o=\"2\">une interpolation sûre<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">La formule $\\hat w = (\\tilde X^T \\tilde X)^{-1} \\tilde X^T y$ exige que :<\/div><button class=\"opt\" data-o=\"0\">$y$ soit centré<\/button><button class=\"opt\" data-o=\"1\">$\\tilde X^T \\tilde X$ soit inversible (pas de multicolinéarité parfaite)<\/button><button class=\"opt\" data-o=\"2\">toutes les variables soient positives<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Avec $\\hat y = 8x_1 + 30x_2 - 5x_3 + 100$, que vaut $\\hat y$ pour $(80, 3, 5)$ ?<\/div><button class=\"opt\" data-o=\"0\">830 kDH<\/button><button class=\"opt\" data-o=\"1\">780 kDH<\/button><button class=\"opt\" data-o=\"2\">805 kDH<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Le terme « linéaire » dans « régression linéaire » signifie :<\/div><button class=\"opt\" data-o=\"0\">le modèle est linéaire par rapport à ses paramètres<\/button><button class=\"opt\" data-o=\"1\">les données sont équidistantes<\/button><button class=\"opt\" data-o=\"2\">la courbe est forcément une droite en $x$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">$R^2 = 0$ signifie que le modèle :<\/div><button class=\"opt\" data-o=\"0\">est parfait<\/button><button class=\"opt\" data-o=\"1\">ne fait pas mieux que prédire la moyenne $\\bar y$<\/button><button class=\"opt\" data-o=\"2\">est pire que la moyenne<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"10\"><div class=\"qq-q\">$R^2 = 0{,}95$ signifie :<\/div><button class=\"opt\" data-o=\"0\">l&#39;erreur moyenne est de 5 %<\/button><button class=\"opt\" data-o=\"1\">95 % des prédictions sont exactes<\/button><button class=\"opt\" data-o=\"2\">95 % de la variance de $y$ est expliquée par le modèle<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"11\"><div class=\"qq-q\">Erreurs du modèle A : $[0, 20]$ ; du modèle B : $[10, 10]$. Lequel a la plus grande RMSE ?<\/div><button class=\"opt\" data-o=\"0\">A<\/button><button class=\"opt\" data-o=\"1\">B<\/button><button class=\"opt\" data-o=\"2\">elles sont égales<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"12\"><div class=\"qq-q\">Pour $x = -2..2$ et $y = x^2$, la meilleure droite a une MSE de :<\/div><button class=\"opt\" data-o=\"0\">0<\/button><button class=\"opt\" data-o=\"1\">2,8<\/button><button class=\"opt\" data-o=\"2\">2<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"13\"><div class=\"qq-q\">Pourquoi <code>include_bias=False<\/code> dans <code>PolynomialFeatures<\/code> suivi de <code>LinearRegression<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">pour standardiser les données<\/button><button class=\"opt\" data-o=\"1\">pour supprimer les termes d&#39;interaction<\/button><button class=\"opt\" data-o=\"2\">parce que <code>LinearRegression<\/code> calcule déjà son propre biais<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"14\"><div class=\"qq-q\">Dans le code exécuté du chapitre, quel modèle met des coefficients exactement à zéro ?<\/div><button class=\"opt\" data-o=\"0\">Lasso<\/button><button class=\"opt\" data-o=\"1\">la régression polynomiale sans pénalité<\/button><button class=\"opt\" data-o=\"2\">Ridge<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"15\"><div class=\"qq-q\">Pourquoi standardiser avant Ridge ou Lasso ?<\/div><button class=\"opt\" data-o=\"0\">pour que $R^2$ soit positif<\/button><button class=\"opt\" data-o=\"1\">pour que la pénalité traite toutes les variables à la même échelle<\/button><button class=\"opt\" data-o=\"2\">parce que ces modèles n&#39;acceptent que des valeurs entre 0 et 1<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"ml-regression","rep":["500"],"tol":null},{"n":"ml-regression","rep":["1.7"],"tol":null},{"n":"ml-regression","rep":["-0.1"],"tol":0.001},{"n":"ml-regression","rep":["940"],"tol":null},{"n":"ml-regression","rep":null,"tol":null}],"qcm":[{"n":"ml-regression","q":"Les MCO cherchent la droite qui minimise :","o":["la somme des résidus","la somme des carrés des résidus","la plus grande erreur absolue"],"a":1,"e":"La somme brute des résidus vaut toujours 0 avec un biais : il faut des carrés."},{"n":"ml-regression","q":"En régression simple, la pente MCO vaut :","o":["$\\text{Var}(x) / \\text{Cov}(x, y)$","$\\bar y / \\bar x$","$\\text{Cov}(x, y) / \\text{Var}(x)$"],"a":2,"e":"Puis $b = \\bar y - w \\bar x$."},{"n":"ml-regression","q":"La droite des moindres carrés passe toujours par :","o":["le point moyen $(\\bar x, \\bar y)$","le premier point des données","l&#39;origine $(0, 0)$"],"a":0,"e":"$b = \\bar y - w\\bar x$ donne $\\hat y(\\bar x) = \\bar y$."},{"n":"ml-regression","q":"Dans l&#39;exemple du prof, $w = 9{,}35$ signifie :","o":["le prix est divisé par 9,35","chaque m² en plus augmente le prix prédit de 9 350 DH","un logement coûte 9,35 kDH"],"a":1,"e":"La pente est la hausse de $\\hat y$ pour une unité de $x$ en plus (ici en kDH)."},{"n":"ml-regression","q":"Un résidu $e_i = y_i - \\hat y_i &gt; 0$ signifie que le modèle a :","o":["surestimé la valeur réelle","fait une prédiction exacte","sous-estimé la valeur réelle"],"a":2,"e":"$y_i &gt; \\hat y_i$ : la prédiction est trop basse."},{"n":"ml-regression","q":"Les données vont de 50 à 110 m². Prédire le prix d&#39;un bien de 1 000 m², c&#39;est :","o":["une extrapolation risquée","impossible mathématiquement","une interpolation sûre"],"a":0,"e":"On suppose que la tendance linéaire continue bien au-delà des données observées."},{"n":"ml-regression","q":"La formule $\\hat w = (\\tilde X^T \\tilde X)^{-1} \\tilde X^T y$ exige que :","o":["$y$ soit centré","$\\tilde X^T \\tilde X$ soit inversible (pas de multicolinéarité parfaite)","toutes les variables soient positives"],"a":1,"e":"Si une colonne est combinaison exacte des autres, la matrice n&#39;est pas inversible."},{"n":"ml-regression","q":"Avec $\\hat y = 8x_1 + 30x_2 - 5x_3 + 100$, que vaut $\\hat y$ pour $(80, 3, 5)$ ?","o":["830 kDH","780 kDH","805 kDH"],"a":2,"e":"$640 + 90 - 25 + 100 = 805$."},{"n":"ml-regression","q":"Le terme « linéaire » dans « régression linéaire » signifie :","o":["le modèle est linéaire par rapport à ses paramètres","les données sont équidistantes","la courbe est forcément une droite en $x$"],"a":0,"e":"C&#39;est pour ça que la régression polynomiale reste une régression linéaire."},{"n":"ml-regression","q":"$R^2 = 0$ signifie que le modèle :","o":["est parfait","ne fait pas mieux que prédire la moyenne $\\bar y$","est pire que la moyenne"],"a":1,"e":"$SS_{res} = SS_{tot}$. Un $R^2$ négatif voudrait dire pire que la moyenne."},{"n":"ml-regression","q":"$R^2 = 0{,}95$ signifie :","o":["l&#39;erreur moyenne est de 5 %","95 % des prédictions sont exactes","95 % de la variance de $y$ est expliquée par le modèle"],"a":2,"e":"C&#39;est une part de variance expliquée, pas un taux de bonnes réponses."},{"n":"ml-regression","q":"Erreurs du modèle A : $[0, 20]$ ; du modèle B : $[10, 10]$. Lequel a la plus grande RMSE ?","o":["A","B","elles sont égales"],"a":0,"e":"Même MAE (10), mais RMSE(A) $\\approx 14{,}14$ contre 10 : la RMSE punit l&#39;erreur isolée de 20."},{"n":"ml-regression","q":"Pour $x = -2..2$ et $y = x^2$, la meilleure droite a une MSE de :","o":["0","2,8","2"],"a":1,"e":"La droite est $\\hat y = 2$ ; MSE $= (4 + 1 + 4 + 1 + 4)/5 = 2{,}8$. Le degré 2 donne 0."},{"n":"ml-regression","q":"Pourquoi <code>include_bias=False<\/code> dans <code>PolynomialFeatures<\/code> suivi de <code>LinearRegression<\/code> ?","o":["pour standardiser les données","pour supprimer les termes d&#39;interaction","parce que <code>LinearRegression<\/code> calcule déjà son propre biais"],"a":2,"e":"Sinon on aurait une colonne de 1 en double."},{"n":"ml-regression","q":"Dans le code exécuté du chapitre, quel modèle met des coefficients exactement à zéro ?","o":["Lasso","la régression polynomiale sans pénalité","Ridge"],"a":0,"e":"Lasso (L1) annule 5 coefficients sur 9 : sélection automatique de variables."},{"n":"ml-regression","q":"Pourquoi standardiser avant Ridge ou Lasso ?","o":["pour que $R^2$ soit positif","pour que la pénalité traite toutes les variables à la même échelle","parce que ces modèles n&#39;acceptent que des valeurs entre 0 et 1"],"a":1,"e":"La pénalité porte sur la taille des coefficients, qui dépend de l&#39;unité de chaque variable."}]},{"id":"ml-classification","t":"Classification · régression logistique, KNN, métriques, ROC","seance":"Séance 5 · 27 octobre 2026","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il te faut la matrice de confusion (TP, TN, FP, FN) du chapitre 2, et la règle $w \\leftarrow w - \\alpha \\cdot \\text{gradient}$ du chapitre 3.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Un détecteur produit 50 alertes, dont 40 sont de vraies attaques. Il y avait 60 attaques en tout. Quelle est sa précision ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>Précision = TP / (TP + FP) = vraies alertes / toutes les alertes.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.8<\/b><\/p><p>$40/50 = 0{,}8$. Son rappel vaut $40/60 \\approx 0{,}667$ : il rate un tiers des attaques.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « score, puis seuil ».<\/strong> Un classifieur calcule d&#39;abord un <strong>score<\/strong> ou une <strong>probabilité<\/strong>, puis un <strong>seuil<\/strong> transforme ce score en classe. Changer le seuil ne change pas le modèle, mais change les FP et les FN.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>La régression logistique porte le mot « régression », mais c&#39;est un modèle de <strong>classification<\/strong>. Elle prédit une probabilité, puis une classe.<\/p>\n<\/aside><p>À la fin, tu sais calculer une probabilité avec la sigmoïde et la softmax, faire un pas de descente de gradient en régression logistique, classer un point avec KNN, calculer toutes les métriques (y compris spécificité, macro et weighted) et lire une courbe ROC.<\/p>\n<h2>Idée 1 · Binaire, multiclasse, multilabel<\/h2>\n<table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Classes<\/th>\n<th>Exemple<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Binaire<\/td>\n<td>2<\/td>\n<td>spam / non-spam<\/td>\n<\/tr>\n<tr>\n<td>Multiclasse<\/td>\n<td>plus de 2, <strong>exclusives<\/strong><\/td>\n<td>chiffre 0 à 9, sentiment positif / neutre / négatif<\/td>\n<\/tr>\n<tr>\n<td>Multilabel<\/td>\n<td>plusieurs étiquettes <strong>à la fois<\/strong><\/td>\n<td>un article à la fois « sport » et « économie »<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Un classifieur peut donner une probabilité par classe (non-spam 0,18 ; spam 0,82). Une probabilité de 0,82 n&#39;est pas une certitude de 82 % : cela dépend du <strong>calibrage<\/strong>. Un modèle bien calibré qui prédit 0,80 pour 100 e-mails doit avoir environ 80 spams parmi eux. Selon le prof, la régression logistique est naturellement bien calibrée ; les arbres et forêts demandent souvent un recalibrage (<code>CalibratedClassifierCV<\/code>).<\/p>\n<h2>Idée 2 · La régression logistique<\/h2>\n<svg viewBox=\"0 0 340 170\" style=\"width:100%;max-width:400px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Courbe sigmoïde en S qui passe de 0 à 1, valant 0,5 en z égal 0, avec le seuil 0,5 en pointillés\">\n<g font-family=\"sans-serif\" font-size=\"11\" fill=\"currentColor\">\n<path d=\"M30 140H320M175 150V15\" stroke=\"currentColor\" stroke-width=\"1.2\"/>\n<path d=\"M30 138C120 136 140 120 175 78S230 22 320 20\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2.5\"/>\n<line x1=\"30\" y1=\"78\" x2=\"320\" y2=\"78\" stroke=\"currentColor\" stroke-dasharray=\"4 4\"/>\n<text x=\"290\" y=\"72\">0,5<\/text><text x=\"290\" y=\"16\">1<\/text><text x=\"290\" y=\"134\">0<\/text><text x=\"180\" y=\"160\">z = 0<\/text>\n<text x=\"40\" y=\"70\">ŷ = 0<\/text><text x=\"230\" y=\"100\">ŷ = 1<\/text><text x=\"200\" y=\"40\" fill=\"#D9824F\">σ(z)<\/text><\/g>\n<\/svg><p>Une régression linéaire peut sortir des valeurs hors de $[0, 1]$. La logistique calcule un <strong>score linéaire<\/strong> $z = w^T x + b$ puis le passe dans la <strong>sigmoïde<\/strong> :<\/p>\n<p>$$P(y = 1 \\mid x) = \\sigma(z) = \\frac{1}{1 + e^{-z}}$$<\/p>\n<p>$\\sigma(0) = 0{,}5$ ; $z$ très négatif → proche de 0 ; $z$ très positif → proche de 1. Et $P(y = 0 \\mid x) = 1 - P(y = 1 \\mid x)$.<\/p>\n<p><strong>Exemple du prof.<\/strong> $z = 0{,}8x - 3$ ($x$ = heures de révision). Pour 5 h : $z = 1$, $P = 1/(1 + e^{-1}) \\approx 0{,}731$.<\/p>\n<p><strong>Seuil.<\/strong> Avec $s = 0{,}5$ : $\\hat y = 1$ si $P \\ge 0{,}5$. Or $\\sigma(z) = 0{,}5 \\iff z = 0$ : la <strong>frontière de décision<\/strong> est l&#39;hyperplan $w^T x + b = 0$. Elle est <strong>linéaire<\/strong>. Le vecteur $w$ est orthogonal à cette frontière et pointe vers la région $\\hat y = 1$.<\/p>\n<p><strong>Apprentissage.<\/strong> La perte est l&#39;<strong>entropie croisée binaire<\/strong> (log loss) :<\/p>\n<p>$$\\ell(y, p) = -\\big[y \\log p + (1 - y)\\log(1 - p)\\big]$$<\/p>\n<p>Si $y = 1$, la perte vaut $-\\log p$ : énorme quand $p \\to 0$. On n&#39;utilise pas la MSE : avec la sigmoïde elle donne une fonction <strong>non convexe<\/strong> (minima locaux), alors que la log loss est convexe. Il n&#39;y a pas de formule fermée : on utilise la <strong>descente de gradient<\/strong>, avec ce gradient remarquablement simple :<\/p>\n<p>$$\\frac{\\partial J}{\\partial w_j} = \\frac1n \\sum (p_i - y_i)\\, x_{ij} \\qquad \\frac{\\partial J}{\\partial b} = \\frac1n \\sum (p_i - y_i)$$<\/p>\n<p>Il vient de la propriété $\\sigma'(z) = \\sigma(z)\\big(1 - \\sigma(z)\\big)$.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Une époque de descente de gradient (exemple du prof)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Données<\/div><p>2 étudiants : $x_1 = 2$ h, $y_1 = 0$ ; $x_2 = 6$ h, $y_2 = 1$. Départ $w = 0{,}5$, $b = -1$, $\\alpha = 0{,}1$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · Scores<\/div><p>$z_1 = 0{,}5 \\times 2 - 1 = 0$ → $p_1 = 0{,}5$. $z_2 = 3 - 1 = 2$ → $p_2 \\approx 0{,}881$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · Erreurs<\/div><p>$p_1 - y_1 = +0{,}5$ ; $p_2 - y_2 = -0{,}119$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · Gradients<\/div><p>$\\partial J/\\partial w = \\frac12(0{,}5 \\times 2 - 0{,}119 \\times 6) = 0{,}143$ ; $\\partial J/\\partial b = \\frac12(0{,}5 - 0{,}119) \\approx 0{,}19$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · Mise à jour<\/div><p>$w = 0{,}5 - 0{,}1 \\times 0{,}143 = 0{,}4857$ ; $b \\approx -1{,}019$.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><table>\n<thead>\n<tr>\n<th>Avantages<\/th>\n<th>Limites<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>simple, rapide<\/td>\n<td>frontière <strong>linéaire<\/strong> dans l&#39;espace d&#39;origine<\/td>\n<\/tr>\n<tr>\n<td>probabilités exploitables<\/td>\n<td>relations complexes difficiles sans transformation des features<\/td>\n<\/tr>\n<tr>\n<td>coefficients interprétables<\/td>\n<td>sensible aux variables redondantes ou mal préparées<\/td>\n<\/tr>\n<tr>\n<td>bonne <strong>référence<\/strong> de départ<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody><\/table>\n<h2>Idée 3 · Plus de deux classes : OvR et Softmax<\/h2>\n<p><strong>One-vs-Rest (OvR)<\/strong> : $K$ classifieurs binaires indépendants (« chat contre le reste »…), puis on prend la plus grande sortie. Exemple : 0,70 / 0,40 / 0,10 → chat. Les sorties ne somment pas à 1 (ici 1,20) : ce n&#39;est pas une vraie distribution.<\/p>\n<p><strong>Softmax<\/strong> (régression logistique multinomiale) : un seul modèle, les classes en compétition.<\/p>\n<p>$$p_k = \\frac{e^{z_k}}{\\sum_{j=1}^{K} e^{z_j}} \\qquad \\sum_k p_k = 1$$<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Exemple du prof : scores z = (−1,6 ; 1,1 ; 1,4) pour Rattrapage, Admis, Mention<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Exponentielles<\/div><p>$e^{-1{,}6} \\approx 0{,}202$ ; $e^{1{,}1} \\approx 3{,}004$ ; $e^{1{,}4} \\approx 4{,}055$. Somme $S \\approx 7{,}261$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Probabilités<\/div><p>$p \\approx (0{,}028 ;\\ 0{,}414 ;\\ 0{,}558)$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Prédiction<\/div><p>Classe 3 (Mention), 55,8 %.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Erreur pour l&#39;apprentissage<\/div><p>Si la vraie classe est Mention, $y = (0, 0, 1)$ en One-Hot et $e = p - y = (0{,}028 ;\\ 0{,}414 ;\\ -0{,}442)$.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p>À retenir pour le QCM : pour $K = 2$, la softmax <strong>redevient la sigmoïde<\/strong> ; ajouter une même constante à tous les $z_k$ ne change rien (on soustrait le max pour éviter l&#39;overflow) ; le gradient par rapport aux scores vaut $p - y$ ; la perte est l&#39;<strong>entropie croisée catégorielle<\/strong>, et la minimiser revient à <strong>maximiser la vraisemblance<\/strong>.<\/p>\n<h2>Idée 4 · Les K plus proches voisins (KNN)<\/h2>\n<svg viewBox=\"0 0 300 170\" style=\"width:100%;max-width:360px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Un point inconnu au centre, un cercle contenant ses trois plus proches voisins : deux rouges et un bleu\">\n<g font-family=\"sans-serif\" font-size=\"11\" fill=\"currentColor\">\n<circle cx=\"150\" cy=\"90\" r=\"52\" fill=\"#D9824F\" fill-opacity=\".08\" stroke=\"#D9824F\" stroke-dasharray=\"5 4\"/>\n<circle cx=\"150\" cy=\"90\" r=\"7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"/><text x=\"160\" y=\"86\">?<\/text>\n<g fill=\"#D9824F\"><circle cx=\"118\" cy=\"70\" r=\"6\"/><circle cx=\"170\" cy=\"128\" r=\"6\"/><circle cx=\"60\" cy=\"40\" r=\"6\"/><\/g>\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"178\" y=\"60\" width=\"11\" height=\"11\"/><rect x=\"240\" y=\"40\" width=\"11\" height=\"11\"/><rect x=\"250\" y=\"120\" width=\"11\" height=\"11\"/><rect x=\"40\" y=\"130\" width=\"11\" height=\"11\"/><\/g>\n<text x=\"10\" y=\"165\">● rouge  ■ bleu : k = 3 → 2 rouges, 1 bleu → rouge<\/text><\/g>\n<\/svg><p>Pour classer un point : on calcule sa distance à <strong>tous<\/strong> les points d&#39;entraînement, on garde les $k$ plus proches, et on vote.<\/p>\n<p><strong>Distances<\/strong> (famille de Minkowski, $q \\ge 1$) :<\/p>\n<p>$$d_q(x, z) = \\Big(\\sum_j |x_j - z_j|^q\\Big)^{1/q}$$<\/p>\n<ul>\n<li>$q = 1$ : <strong>Manhattan<\/strong>, somme des écarts. Pour $A(2, 3)$ et $B(5, 7)$ : $3 + 4 = 7$.<\/li>\n<li>$q = 2$ : <strong>euclidienne<\/strong>, ligne droite : $\\sqrt{9 + 16} = 5$.<\/li>\n<li>Plus $q$ est grand, plus un gros écart sur un seul axe pèse.<\/li>\n<li>Pour du texte : distance <strong>cosinus<\/strong> $1 - \\dfrac{x^T z}{\\lVert x\\rVert \\lVert z\\rVert}$.<\/li>\n<\/ul>\n<aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p><strong>L&#39;échelle.<\/strong> Âge (écart 10 ans) et revenu (écart 50 000) : la distance vaut $\\approx 50\\,000{,}001$, l&#39;âge ne compte plus. <strong>Standardise toujours avant KNN.<\/strong><\/p>\n<\/aside><figure class=\"etapes\" data-i=\"0\"><figcaption>Étude de cas du prof : classer X = (3, 2)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Données<\/div><p>P1 (1, 2) Rouge ; P2 (2, 5) Bleu ; P3 (4, 1) Rouge ; P4 (3, 4) Bleu ; P5 (6, 5) Bleu.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · Distances<\/div><p>P3 : $\\sqrt2 \\approx 1{,}414$ ; P1 : 2 ; P4 : 2 ; P2 : $\\sqrt{10} \\approx 3{,}162$ ; P5 : $\\sqrt{18} \\approx 4{,}243$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · k = 3<\/div><p>P3, P1, P4 → 2 Rouge, 1 Bleu → <strong>Rouge<\/strong>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · k = 5<\/div><p>tous → 2 Rouge, 3 Bleu → <strong>Bleu<\/strong>. Un grand $k$ dilue l&#39;information locale.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · k = 5 pondéré (wᵢ = 1/dᵢ)<\/div><p>Rouge : $0{,}707 + 0{,}5 = 1{,}207$ ; Bleu : $0{,}5 + 0{,}316 + 0{,}236 = 1{,}052$ → <strong>Rouge<\/strong>.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><pre class=\"\"><code>from sklearn.neighbors import KNeighborsClassifier\n\nX = [[1, 2], [2, 5], [4, 1], [3, 4], [6, 5]]\ny = [&quot;Rouge&quot;, &quot;Bleu&quot;, &quot;Rouge&quot;, &quot;Bleu&quot;, &quot;Bleu&quot;]\nfor k in (3, 5):\n    vote = KNeighborsClassifier(n_neighbors=k).fit(X, y).predict([[3, 2]])[0]\n    pondere = KNeighborsClassifier(n_neighbors=k, weights=&quot;distance&quot;).fit(X, y).predict([[3, 2]])[0]\n    print(k, vote, pondere)<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>3 Rouge Rouge\n5 Bleu Rouge<\/code><\/pre><table>\n<thead>\n<tr>\n<th>Petit $k$ (1, 3)<\/th>\n<th>Grand $k$ ($k \\to n$)<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>frontière dentelée<\/td>\n<td>frontière lisse<\/td>\n<\/tr>\n<tr>\n<td>biais faible, <strong>variance élevée<\/strong><\/td>\n<td><strong>biais élevé<\/strong>, variance faible<\/td>\n<\/tr>\n<tr>\n<td>risque de surapprentissage<\/td>\n<td>risque de sous-apprentissage<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Si $k = n$, KNN prédit toujours la classe majoritaire. Règles du prof : $k$ <strong>impair<\/strong> en binaire (pas d&#39;égalité), point de départ $k \\approx \\sqrt n$, puis choix par validation croisée, <strong>jamais<\/strong> sur le test.<\/p>\n<p>KNN <strong>n&#39;apprend rien<\/strong> pendant <code>fit<\/code> (il mémorise les données) et calcule tout à la prédiction : lent et gourmand sur de grands jeux, et fragile en très grande dimension (<strong>fléau de la dimensionnalité<\/strong>). Il est <strong>non paramétrique<\/strong> : aucune hypothèse sur la forme de la frontière.<\/p>\n<h2>Idée 5 · Toutes les métriques d&#39;un classifieur<\/h2>\n<figure class=\"grille\"><figcaption>Exemple du prof : 200 observations<\/figcaption><table><tr><th><\/th><th>Prédit 0<\/th><th>Prédit 1<\/th><\/tr><tr><th>Réel 0<\/th><td>TN = 130<\/td><td class=\"h1\">FP = 10<\/td><\/tr><tr><th>Réel 1<\/th><td class=\"h1\">FN = 20<\/td><td class=\"h2\">TP = 40<\/td><\/tr><\/table><\/figure><table>\n<thead>\n<tr>\n<th>Métrique<\/th>\n<th>Calcul<\/th>\n<th>Valeur<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Accuracy<\/td>\n<td>$(40 + 130)/200$<\/td>\n<td>85,0 %<\/td>\n<\/tr>\n<tr>\n<td>Précision<\/td>\n<td>$40/50$<\/td>\n<td>80,0 %<\/td>\n<\/tr>\n<tr>\n<td>Rappel (sensibilité, TPR)<\/td>\n<td>$40/60$<\/td>\n<td>66,7 %<\/td>\n<\/tr>\n<tr>\n<td><strong>Spécificité<\/strong><\/td>\n<td>$TN/(TN + FP) = 130/140$<\/td>\n<td>92,9 %<\/td>\n<\/tr>\n<tr>\n<td>F1<\/td>\n<td>$2 \\times 0{,}8 \\times 0{,}667 / 1{,}467$<\/td>\n<td>72,7 %<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Le F1 ne tient <strong>pas<\/strong> compte des vrais négatifs.<\/p>\n<p><strong>En multiclasse<\/strong>, on calcule la métrique classe par classe (en OvR), puis on moyenne :<\/p>\n<table>\n<thead>\n<tr>\n<th>Moyenne<\/th>\n<th>Poids de chaque classe<\/th>\n<th>Quand ?<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>Macro<\/strong><\/td>\n<td>égal ($1/K$) : « 1 classe = 1 vote »<\/td>\n<td>la petite classe compte autant (maladie rare)<\/td>\n<\/tr>\n<tr>\n<td><strong>Weighted<\/strong><\/td>\n<td>proportionnel à son effectif $n_k/N$<\/td>\n<td>refléter la distribution réelle<\/td>\n<\/tr>\n<tr>\n<td><strong>Micro<\/strong><\/td>\n<td>on additionne d&#39;abord tous les TP, FP…<\/td>\n<td>« 1 observation = 1 vote », multilabel<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Exemple du prof (spécificités Chat 0,960 ; Chien 0,843 ; Oiseau 0,925 ; effectifs 50 %, 30 %, 20 %) : macro $= 0{,}909$, weighted $= 0{,}918$. La weighted est plus haute car le modèle est bon sur la grosse classe.<\/p>\n<h2>Idée 6 · Seuil, courbe ROC et AUC<\/h2>\n<table>\n<thead>\n<tr>\n<th>Seuil bas (0,2)<\/th>\n<th>Seuil haut (0,8)<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>beaucoup de positifs prédits<\/td>\n<td>peu de positifs prédits<\/td>\n<\/tr>\n<tr>\n<td><strong>rappel ↑<\/strong>, plus de FP<\/td>\n<td><strong>précision ↑<\/strong>, plus de FN<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>La <strong>courbe ROC<\/strong> (<em>Receiver Operating Characteristic<\/em>, née du radar pendant la Seconde Guerre mondiale) trace, pour <strong>tous<\/strong> les seuils :<\/p>\n<ul>\n<li>en ordonnée le <strong>TPR<\/strong> = rappel $= TP/(TP + FN)$ ;<\/li>\n<li>en abscisse le <strong>FPR<\/strong> $= FP/(FP + TN) = 1 -$ spécificité.<\/li>\n<\/ul>\n<svg viewBox=\"0 0 220 200\" style=\"width:100%;max-width:280px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Courbe ROC en escalier passant par les points (0 ; 0,67), (0,5 ; 0,67), (0,5 ; 1) puis (1 ; 1), au-dessus de la diagonale du hasard\">\n<g font-family=\"sans-serif\" font-size=\"11\" fill=\"currentColor\">\n<path d=\"M30 170H200M30 170V10\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n<line x1=\"30\" y1=\"170\" x2=\"200\" y2=\"10\" stroke=\"currentColor\" stroke-dasharray=\"4 4\"/>\n<path d=\"M30 170V63H115V10H200\" fill=\"#D9824F\" fill-opacity=\".15\" stroke=\"#D9824F\" stroke-width=\"2.5\"/>\n<text x=\"120\" y=\"186\">FPR<\/text><text x=\"2\" y=\"90\" transform=\"rotate(-90 12 90)\">TPR<\/text>\n<text x=\"120\" y=\"130\">hasard (AUC 0,5)<\/text><text x=\"40\" y=\"40\" fill=\"#D9824F\">AUC = 5/6<\/text><\/g>\n<\/svg><figure class=\"etapes\" data-i=\"0\"><figcaption>Exemple du prof : 5 individus triés par probabilité<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Données<\/div><p>0,90 (P) ; 0,80 (P) ; 0,60 (N) ; 0,40 (P) ; 0,20 (N). Soit 3 positifs, 2 négatifs.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · Seuil 0,75<\/div><p>TP = 2, FP = 0 → point (0 ; 0,67).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · Seuil 0,50<\/div><p>TP = 2, FP = 1 → point (0,5 ; 0,67).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · Seuil 0,30<\/div><p>TP = 3, FP = 1 → point (0,5 ; 1).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · AUC<\/div><p>L&#39;aire vaut $0{,}5 \\times 0{,}67 + 0{,}5 \\times 1 \\approx 0{,}83$, soit $5/6$ : sur les 6 paires (positif, négatif), 5 sont bien ordonnées.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p>$$\\text{AUC} = P\\big(\\text{Score}(X_+) &gt; \\text{Score}(X_-)\\big)$$<\/p>\n<table>\n<thead>\n<tr>\n<th>AUC<\/th>\n<th>Lecture<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>parfait<\/td>\n<\/tr>\n<tr>\n<td>0,7 à 0,9<\/td>\n<td>bon modèle<\/td>\n<\/tr>\n<tr>\n<td>0,5<\/td>\n<td>hasard, inutile<\/td>\n<\/tr>\n<tr>\n<td>&lt; 0,5<\/td>\n<td>pire que le hasard (inversé)<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>L&#39;AUC est <strong>invariante au seuil<\/strong> et <strong>invariante à l&#39;échelle<\/strong> des scores (elle ne dépend que de leur ordre).<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Régression logistique<\/th>\n<th>KNN<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Principe<\/td>\n<td>apprend $(w, b)$ une fois pour toutes<\/td>\n<td>mémorise les données, cherche les voisins<\/td>\n<\/tr>\n<tr>\n<td>Prédiction<\/td>\n<td>probabilité puis seuil<\/td>\n<td>vote des $k$ voisins<\/td>\n<\/tr>\n<tr>\n<td>Frontière<\/td>\n<td>linéaire<\/td>\n<td>quelconque (non linéaire)<\/td>\n<\/tr>\n<tr>\n<td>Coût<\/td>\n<td>rapide à prédire<\/td>\n<td>lent à prédire sur de gros jeux<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Classification à la main<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>$z = 0{,}8x - 3$. Calcule $z$ pour un étudiant qui a révisé 2 heures, puis dis si $P &gt; 0{,}5$.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : -1.4<\/b><\/p><p>$z = 1{,}6 - 3 = -1{,}4 &lt; 0$, donc $P = \\sigma(-1{,}4) &lt; 0{,}5$ : prédit « échec » avec le seuil 0,5.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>100 malades et 900 sains. TP = 70, FN = 30, FP = 90, TN = 810. Calcule la spécificité.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.9<\/b><\/p><p>$810 / (810 + 90) = 0{,}9$.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Même matrice : calcule le FPR.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.1<\/b><\/p><p>$FPR = 1 - 0{,}9 = 0{,}1$.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Calcule la distance de Manhattan entre $(1, 2)$ et $(4, 6)$.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 7<\/b><\/p><p>$|4 - 1| + |6 - 2| = 7$ ; la distance euclidienne vaut 5.<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 13 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">La régression logistique est principalement utilisée pour :<\/div><button class=\"opt\" data-o=\"0\">le clustering<\/button><button class=\"opt\" data-o=\"1\">la régression d&#39;une valeur continue<\/button><button class=\"opt\" data-o=\"2\">la classification<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Que vaut $\\sigma(0)$ ?<\/div><button class=\"opt\" data-o=\"0\">0,5<\/button><button class=\"opt\" data-o=\"1\">1<\/button><button class=\"opt\" data-o=\"2\">0<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Avec $z = 0{,}8x - 3$, la probabilité de réussite pour $x = 5$ est environ :<\/div><button class=\"opt\" data-o=\"0\">0,5<\/button><button class=\"opt\" data-o=\"1\">0,731<\/button><button class=\"opt\" data-o=\"2\">0,881<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Avec le seuil 0,5, la frontière de décision de la régression logistique est :<\/div><button class=\"opt\" data-o=\"0\">l&#39;ensemble des points où $w^T x + b = 0{,}5$<\/button><button class=\"opt\" data-o=\"1\">une courbe en S dans l&#39;espace des features<\/button><button class=\"opt\" data-o=\"2\">l&#39;ensemble des points où $w^T x + b = 0$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Pourquoi ne pas entraîner la régression logistique avec la MSE ?<\/div><button class=\"opt\" data-o=\"0\">avec la sigmoïde, la MSE donne une fonction de coût non convexe<\/button><button class=\"opt\" data-o=\"1\">la MSE ne s&#39;applique qu&#39;aux entiers<\/button><button class=\"opt\" data-o=\"2\">la MSE est trop lente à calculer<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Pour une observation, le gradient de la log loss par rapport à $w_j$ vaut :<\/div><button class=\"opt\" data-o=\"0\">$p(1 - p)$<\/button><button class=\"opt\" data-o=\"1\">$(p - y)\\,x_j$<\/button><button class=\"opt\" data-o=\"2\">$(y - p)^2$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">En One-vs-Rest à 3 classes, les sorties 0,70 ; 0,40 ; 0,10 :<\/div><button class=\"opt\" data-o=\"0\">sont impossibles<\/button><button class=\"opt\" data-o=\"1\">forment une distribution de probabilité<\/button><button class=\"opt\" data-o=\"2\">ne somment pas à 1, mais on prédit quand même la classe à 0,70<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">La fonction softmax garantit que :<\/div><button class=\"opt\" data-o=\"0\">les probabilités sont dans $]0, 1[$ et somment à 1<\/button><button class=\"opt\" data-o=\"1\">la classe prédite est toujours la première<\/button><button class=\"opt\" data-o=\"2\">chaque probabilité vaut 0 ou 1<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Scores $z = (-1{,}6 ;\\ 1{,}1 ;\\ 1{,}4)$. Quelle classe la softmax prédit-elle ?<\/div><button class=\"opt\" data-o=\"0\">la classe 2<\/button><button class=\"opt\" data-o=\"1\">la classe 3<\/button><button class=\"opt\" data-o=\"2\">la classe 1<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Pour $K = 2$ classes, la softmax est équivalente à :<\/div><button class=\"opt\" data-o=\"0\">la fonction ReLU<\/button><button class=\"opt\" data-o=\"1\">la tangente hyperbolique<\/button><button class=\"opt\" data-o=\"2\">la sigmoïde<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"10\"><div class=\"qq-q\">Distance euclidienne entre $A(2, 3)$ et $B(5, 7)$ :<\/div><button class=\"opt\" data-o=\"0\">5<\/button><button class=\"opt\" data-o=\"1\">7<\/button><button class=\"opt\" data-o=\"2\">25<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"11\"><div class=\"qq-q\">Pourquoi standardiser avant KNN ?<\/div><button class=\"opt\" data-o=\"0\">pour accélérer l&#39;entraînement<\/button><button class=\"opt\" data-o=\"1\">parce qu&#39;une variable à grande échelle écrase les autres dans le calcul des distances<\/button><button class=\"opt\" data-o=\"2\">parce que KNN n&#39;accepte que des valeurs entre 0 et 1<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"12\"><div class=\"qq-q\">Dans l&#39;étude de cas du prof, la prédiction passe de Rouge ($k = 3$) à Bleu ($k = 5$). Cela illustre que :<\/div><button class=\"opt\" data-o=\"0\">le vote pondéré est inutile<\/button><button class=\"opt\" data-o=\"1\">KNN est déterministe<\/button><button class=\"opt\" data-o=\"2\">un grand $k$ dilue l&#39;information locale au profit de la classe globale<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"13\"><div class=\"qq-q\">Un KNN avec $k = 1$ a typiquement :<\/div><button class=\"opt\" data-o=\"0\">un biais faible et une variance élevée<\/button><button class=\"opt\" data-o=\"1\">un biais et une variance nuls<\/button><button class=\"opt\" data-o=\"2\">un biais élevé et une variance faible<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"14\"><div class=\"qq-q\">Pendant <code>fit()<\/code>, KNN :<\/div><button class=\"opt\" data-o=\"0\">calcule des coefficients $w$<\/button><button class=\"opt\" data-o=\"1\">mémorise simplement les données d&#39;entraînement<\/button><button class=\"opt\" data-o=\"2\">construit un arbre de décision<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"15\"><div class=\"qq-q\">200 observations : TP = 40, FN = 20, FP = 10, TN = 130. La spécificité vaut :<\/div><button class=\"opt\" data-o=\"0\">66,7 %<\/button><button class=\"opt\" data-o=\"1\">80 %<\/button><button class=\"opt\" data-o=\"2\">92,9 %<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"16\"><div class=\"qq-q\">Quelle métrique ne tient <strong>pas<\/strong> compte des vrais négatifs ?<\/div><button class=\"opt\" data-o=\"0\">le F1-score<\/button><button class=\"opt\" data-o=\"1\">la spécificité<\/button><button class=\"opt\" data-o=\"2\">l&#39;accuracy<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"17\"><div class=\"qq-q\">Une maladie rare doit absolument être bien détectée. Pour résumer un modèle multiclasse, on préfère la moyenne :<\/div><button class=\"opt\" data-o=\"0\">micro<\/button><button class=\"opt\" data-o=\"1\">macro<\/button><button class=\"opt\" data-o=\"2\">weighted<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"18\"><div class=\"qq-q\">Baisser le seuil de décision de 0,5 à 0,2 :<\/div><button class=\"opt\" data-o=\"0\">augmente la précision et les faux négatifs<\/button><button class=\"opt\" data-o=\"1\">ne change rien aux prédictions<\/button><button class=\"opt\" data-o=\"2\">augmente le rappel et augmente les faux positifs<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"19\"><div class=\"qq-q\">La courbe ROC représente :<\/div><button class=\"opt\" data-o=\"0\">le TPR en fonction du FPR pour tous les seuils<\/button><button class=\"opt\" data-o=\"1\">l&#39;accuracy en fonction de $k$<\/button><button class=\"opt\" data-o=\"2\">la précision en fonction du rappel<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"20\"><div class=\"qq-q\">Une AUC de 0,5 signifie :<\/div><button class=\"opt\" data-o=\"0\">un modèle parfait<\/button><button class=\"opt\" data-o=\"1\">un modèle équivalent au hasard<\/button><button class=\"opt\" data-o=\"2\">un modèle pire que le hasard<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"21\"><div class=\"qq-q\">Une AUC de 0,85 signifie :<\/div><button class=\"opt\" data-o=\"0\">85 % des prédictions sont correctes<\/button><button class=\"opt\" data-o=\"1\">le seuil optimal vaut 0,85<\/button><button class=\"opt\" data-o=\"2\">85 % de chances qu&#39;un positif tiré au hasard ait un score plus élevé qu&#39;un négatif tiré au hasard<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"ml-classification","rep":["0.8"],"tol":null},{"n":"ml-classification","rep":["-1.4"],"tol":0.001},{"n":"ml-classification","rep":["0.9"],"tol":null},{"n":"ml-classification","rep":["0.1"],"tol":null},{"n":"ml-classification","rep":["7"],"tol":null}],"qcm":[{"n":"ml-classification","q":"La régression logistique est principalement utilisée pour :","o":["le clustering","la régression d&#39;une valeur continue","la classification"],"a":2,"e":"Malgré son nom, elle prédit une probabilité puis une classe."},{"n":"ml-classification","q":"Que vaut $\\sigma(0)$ ?","o":["0,5","1","0"],"a":0,"e":"$1/(1 + e^0) = 1/2$."},{"n":"ml-classification","q":"Avec $z = 0{,}8x - 3$, la probabilité de réussite pour $x = 5$ est environ :","o":["0,5","0,731","0,881"],"a":1,"e":"$z = 1$ et $\\sigma(1) \\approx 0{,}731$."},{"n":"ml-classification","q":"Avec le seuil 0,5, la frontière de décision de la régression logistique est :","o":["l&#39;ensemble des points où $w^T x + b = 0{,}5$","une courbe en S dans l&#39;espace des features","l&#39;ensemble des points où $w^T x + b = 0$"],"a":2,"e":"$\\sigma(z) = 0{,}5 \\iff z = 0$ : c&#39;est un hyperplan, la frontière est linéaire."},{"n":"ml-classification","q":"Pourquoi ne pas entraîner la régression logistique avec la MSE ?","o":["avec la sigmoïde, la MSE donne une fonction de coût non convexe","la MSE ne s&#39;applique qu&#39;aux entiers","la MSE est trop lente à calculer"],"a":0,"e":"La log loss garantit un coût convexe, sans minima locaux secondaires."},{"n":"ml-classification","q":"Pour une observation, le gradient de la log loss par rapport à $w_j$ vaut :","o":["$p(1 - p)$","$(p - y)\\,x_j$","$(y - p)^2$"],"a":1,"e":"C&#39;est la simplification remarquable vue en cours ; $p(1-p)$ est la dérivée de la sigmoïde."},{"n":"ml-classification","q":"En One-vs-Rest à 3 classes, les sorties 0,70 ; 0,40 ; 0,10 :","o":["sont impossibles","forment une distribution de probabilité","ne somment pas à 1, mais on prédit quand même la classe à 0,70"],"a":2,"e":"Les 3 modèles sont indépendants ; on applique un argmax."},{"n":"ml-classification","q":"La fonction softmax garantit que :","o":["les probabilités sont dans $]0, 1[$ et somment à 1","la classe prédite est toujours la première","chaque probabilité vaut 0 ou 1"],"a":0,"e":"C&#39;est une vraie distribution, contrairement à l&#39;OvR."},{"n":"ml-classification","q":"Scores $z = (-1{,}6 ;\\ 1{,}1 ;\\ 1{,}4)$. Quelle classe la softmax prédit-elle ?","o":["la classe 2","la classe 3","la classe 1"],"a":1,"e":"Le score le plus haut donne la plus grande probabilité (≈ 55,8 %)."},{"n":"ml-classification","q":"Pour $K = 2$ classes, la softmax est équivalente à :","o":["la fonction ReLU","la tangente hyperbolique","la sigmoïde"],"a":2,"e":"En posant $z_2 = 0$, $p_1 = e^z/(e^z + 1) = \\sigma(z)$."},{"n":"ml-classification","q":"Distance euclidienne entre $A(2, 3)$ et $B(5, 7)$ :","o":["5","7","25"],"a":0,"e":"$\\sqrt{3^2 + 4^2} = 5$. La distance de Manhattan vaut 7."},{"n":"ml-classification","q":"Pourquoi standardiser avant KNN ?","o":["pour accélérer l&#39;entraînement","parce qu&#39;une variable à grande échelle écrase les autres dans le calcul des distances","parce que KNN n&#39;accepte que des valeurs entre 0 et 1"],"a":1,"e":"Un écart de revenu de 50 000 noie un écart d&#39;âge de 10."},{"n":"ml-classification","q":"Dans l&#39;étude de cas du prof, la prédiction passe de Rouge ($k = 3$) à Bleu ($k = 5$). Cela illustre que :","o":["le vote pondéré est inutile","KNN est déterministe","un grand $k$ dilue l&#39;information locale au profit de la classe globale"],"a":2,"e":"Avec $k = 5$, tous les points votent : la classe majoritaire globale (Bleu) gagne."},{"n":"ml-classification","q":"Un KNN avec $k = 1$ a typiquement :","o":["un biais faible et une variance élevée","un biais et une variance nuls","un biais élevé et une variance faible"],"a":0,"e":"Il suit chaque point, y compris le bruit : risque de surapprentissage."},{"n":"ml-classification","q":"Pendant <code>fit()<\/code>, KNN :","o":["calcule des coefficients $w$","mémorise simplement les données d&#39;entraînement","construit un arbre de décision"],"a":1,"e":"Tout le calcul (distances, vote) se fait à la prédiction."},{"n":"ml-classification","q":"200 observations : TP = 40, FN = 20, FP = 10, TN = 130. La spécificité vaut :","o":["66,7 %","80 %","92,9 %"],"a":2,"e":"$TN/(TN + FP) = 130/140$."},{"n":"ml-classification","q":"Quelle métrique ne tient <strong>pas<\/strong> compte des vrais négatifs ?","o":["le F1-score","la spécificité","l&#39;accuracy"],"a":0,"e":"Le F1 combine précision et rappel, qui n&#39;utilisent pas TN."},{"n":"ml-classification","q":"Une maladie rare doit absolument être bien détectée. Pour résumer un modèle multiclasse, on préfère la moyenne :","o":["micro","macro","weighted"],"a":1,"e":"Macro donne le même poids à chaque classe : une mauvaise performance sur la petite classe se voit."},{"n":"ml-classification","q":"Baisser le seuil de décision de 0,5 à 0,2 :","o":["augmente la précision et les faux négatifs","ne change rien aux prédictions","augmente le rappel et augmente les faux positifs"],"a":2,"e":"Plus d&#39;observations passent en positif."},{"n":"ml-classification","q":"La courbe ROC représente :","o":["le TPR en fonction du FPR pour tous les seuils","l&#39;accuracy en fonction de $k$","la précision en fonction du rappel"],"a":0,"e":"TPR = rappel, FPR = 1 − spécificité."},{"n":"ml-classification","q":"Une AUC de 0,5 signifie :","o":["un modèle parfait","un modèle équivalent au hasard","un modèle pire que le hasard"],"a":1,"e":"Moins de 0,5 serait pire que le hasard ; 1 serait parfait."},{"n":"ml-classification","q":"Une AUC de 0,85 signifie :","o":["85 % des prédictions sont correctes","le seuil optimal vaut 0,85","85 % de chances qu&#39;un positif tiré au hasard ait un score plus élevé qu&#39;un négatif tiré au hasard"],"a":2,"e":"C&#39;est l&#39;interprétation probabiliste de l&#39;AUC."}]},{"id":"ml-arbres-forets","t":"Arbres de décision et forêts aléatoires","seance":"Séance 6 · 3 novembre 2026","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il te faut deux choses : une proportion ($6$ réussites sur $10$ = $0{,}6$) et le logarithme en base 2 ($\\log_2 1 = 0$, $\\log_2 0{,}5 = -1$).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Un groupe contient 8 réussites et 2 échecs. Quelles sont les proportions $p_+$ et $p_-$ ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.8<\/b><\/p><p>$p_+ = 8/10 = 0{,}8$ et $p_- = 0{,}2$. Elles somment toujours à 1.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « jeu des questions ».<\/strong> Un arbre pose une question (« Note ≤ 10 ? »), coupe le groupe en deux, et recommence dans chaque sous-groupe. Il choisit à chaque fois la question qui <strong>trie le mieux<\/strong>, c&#39;est-à-dire qui rend les groupes les plus <strong>purs<\/strong>.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Croire que l&#39;arbre cherche le meilleur arbre global. Il est <strong>glouton<\/strong> : il prend la meilleure question <strong>maintenant<\/strong>, sans anticiper et sans jamais revenir en arrière.<\/p>\n<\/aside><p>À la fin, tu sais calculer une entropie, un gain d&#39;information, un Gini et sa réduction, distinguer ID3, C4.5 et CART, expliquer l&#39;élagage, le bootstrap, le bagging et le fonctionnement d&#39;une forêt aléatoire.<\/p>\n<h2>Idée 1 · Un arbre = des questions successives<\/h2>\n<svg viewBox=\"0 0 340 170\" style=\"width:100%;max-width:400px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Arbre de décision : la racine teste la note, la branche gauche teste les absences, et les feuilles donnent réussite ou échec\">\n<g font-family=\"sans-serif\" font-size=\"11\" fill=\"currentColor\" text-anchor=\"middle\">\n<rect x=\"120\" y=\"10\" width=\"100\" height=\"28\" rx=\"6\" fill=\"#D9824F\" fill-opacity=\".2\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"170\" y=\"28\">Note ≤ 10 ?<\/text>\n<path d=\"M150 38L90 70M190 38L250 70\" stroke=\"currentColor\"/><text x=\"108\" y=\"56\">oui<\/text><text x=\"232\" y=\"56\">non<\/text>\n<rect x=\"40\" y=\"70\" width=\"100\" height=\"28\" rx=\"6\" fill=\"none\" stroke=\"currentColor\"/><text x=\"90\" y=\"88\">Absences ≤ 1 ?<\/text>\n<rect x=\"210\" y=\"70\" width=\"80\" height=\"28\" rx=\"14\" fill=\"currentColor\" fill-opacity=\".12\" stroke=\"currentColor\"/><text x=\"250\" y=\"88\">Réussite<\/text>\n<path d=\"M70 98L45 130M110 98L135 130\" stroke=\"currentColor\"/>\n<rect x=\"5\" y=\"130\" width=\"80\" height=\"28\" rx=\"14\" fill=\"currentColor\" fill-opacity=\".12\" stroke=\"currentColor\"/><text x=\"45\" y=\"148\">Réussite<\/text>\n<rect x=\"95\" y=\"130\" width=\"80\" height=\"28\" rx=\"14\" fill=\"currentColor\" fill-opacity=\".12\" stroke=\"currentColor\"/><text x=\"135\" y=\"148\">Échec<\/text>\n<text x=\"300\" y=\"150\" font-size=\"10\">nœud → test<\/text><text x=\"300\" y=\"164\" font-size=\"10\">feuille → décision<\/text><\/g>\n<\/svg><p>Un arbre résout la <strong>classification<\/strong> (feuille = une classe) comme la <strong>régression<\/strong> (feuille = une valeur). La construction est <strong>récursive<\/strong> :<\/p>\n<figure class=\"flux\"><figcaption>Construction gloutonne<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">Nœud<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Chercher la meilleure séparation<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Créer deux sous-groupes<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Recommencer sur chacun<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Arrêt : feuille<\/div><\/div><\/figure><p><strong>Conditions d&#39;arrêt<\/strong> : nœud <strong>pur<\/strong> (une seule classe), profondeur maximale atteinte, trop peu d&#39;observations, ou aucune séparation n&#39;améliore assez le critère.<\/p>\n<p>Dans les arbres CART, chaque question porte sur <strong>une seule variable<\/strong> à la fois : l&#39;arbre ne fait pas de combinaison linéaire des variables.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le comportement glouton a un prix (exemple du prof) : la variable A rapporte +40 % tout de suite puis +10 % ; la variable B rapporte +15 % puis +65 %. L&#39;arbre choisit A (gain total 50 %) et rate B (80 %). En échange, il construit un bon arbre en une fraction de seconde.<\/p>\n<\/aside><h2>Idée 2 · Mesurer le désordre : l&#39;entropie<\/h2>\n<p>$$H(S) = -\\sum_k p_k \\log_2 p_k$$<\/p>\n<ul>\n<li>nœud pur : $H = 0$ ;<\/li>\n<li>deux classes à 50 / 50 : $H = -0{,}5\\log_2 0{,}5 - 0{,}5\\log_2 0{,}5 = 1$ (le maximum en binaire).<\/li>\n<\/ul>\n<p>Le <strong>gain d&#39;information<\/strong> d&#39;une séparation $A$ est la baisse d&#39;entropie, avec une moyenne <strong>pondérée par la taille<\/strong> des enfants :<\/p>\n<p>$$\\text{Gain}(S, A) = H(S) - \\sum_j \\frac{|S_j|}{|S|} H(S_j)$$<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>L'exemple du prof : 10 étudiants (6 réussites, 4 échecs), règle « Heures &gt; 5 ? »<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Parent<\/div><p>$p_+ = 0{,}6$ et $p_- = 0{,}4$. Donc $H(S) \\approx 0{,}442 + 0{,}529$, soit $H(S) \\approx 0{,}971$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · Groupe 1 (&gt; 5 h)<\/div><p>4 étudiants : 3 réussites, 1 échec → $H(S_1) \\approx 0{,}811$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · Groupe 2 (≤ 5 h)<\/div><p>6 étudiants : 3 et 3 → $H(S_2) = 1$ (chaos total).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · Après séparation<\/div><p>$\\frac{4}{10} \\times 0{,}811 + \\frac{6}{10} \\times 1 \\approx 0{,}924$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · Gain<\/div><p>$0{,}971 - 0{,}924 \\approx 0{,}046$ : séparation très faible.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p>L&#39;algorithme teste <strong>tous les seuils<\/strong> de <strong>toutes les variables<\/strong>, garde le meilleur seuil de chacune, puis la meilleure de toutes. Dans l&#39;exemple du prof : Heures ≤ 5 (gain 0,046), Absences ≤ 3 (0,120), <strong>Note ≤ 10 (0,250)<\/strong> → la racine sera « Note ≤ 10 ».<\/p>\n<h2>Idée 3 · ID3 et C4.5<\/h2>\n<p><strong>ID3<\/strong> (Ross Quinlan, 1986) : descendant et glouton, critère = <strong>gain d&#39;information<\/strong>. Il traite surtout des variables <strong>catégorielles<\/strong> et crée <strong>une branche par modalité<\/strong> (une variable à 4 valeurs donne 4 branches). Pas d&#39;élagage dans sa version originale.<\/p>\n<aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p><strong>Le piège de l&#39;identifiant.<\/strong> Le gain d&#39;information favorise les variables à <strong>beaucoup de modalités<\/strong>. Un numéro d&#39;étudiant crée une branche par étudiant : chaque feuille est pure, le gain est maximal… et le modèle ne sait rien prédire pour un nouvel étudiant.<\/p>\n<\/aside><p><strong>C4.5<\/strong> (Quinlan, 1993) corrige cela avec le <strong>Gai
