roïdes<\/button><button class=\"opt\" data-o=\"2\">il ne peut pas traiter deux dimensions<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Sur les lunes, DBSCAN avec <code>eps = 0.02<\/code> et <code>min_samples = 5<\/code> donne :<\/div><button class=\"opt\" data-o=\"0\">2 clusters<\/button><button class=\"opt\" data-o=\"1\">1 cluster<\/button><button class=\"opt\" data-o=\"2\">aucun cluster, tous les points en bruit<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Pourquoi la CAH est-elle peu adaptée à 500 000 observations ?<\/div><button class=\"opt\" data-o=\"0\">elle doit calculer et stocker les distances entre toutes les paires de points<\/button><button class=\"opt\" data-o=\"1\">elle ne fonctionne qu&#39;avec la méthode de Ward<\/button><button class=\"opt\" data-o=\"2\">elle exige de connaître $K$ à l&#39;avance<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"ml-tp-corriges","rep":null,"tol":null},{"n":"ml-tp-corriges","rep":["14"],"tol":null},{"n":"ml-tp-corriges","rep":null,"tol":null},{"n":"ml-tp-corriges","rep":["0"],"tol":null}],"qcm":[{"n":"ml-tp-corriges","q":"Dans le TP 1, la baseline qui prédit la moyenne du train obtient sur le test un $R^2$ :","o":["proche de 0","proche de 1","toujours égal à 0,5"],"a":0,"e":"Elle ne fait que prédire $\\bar y$ ; c&#39;est la définition de $R^2 = 0$."},{"n":"ml-tp-corriges","q":"Pourquoi résoudre $(X^TX)w = X^Ty$ avec <code>np.linalg.solve<\/code> plutôt que calculer l&#39;inverse ?","o":["l&#39;inverse donne un autre résultat","c&#39;est plus stable numériquement et plus rapide","<code>solve<\/code> ajoute automatiquement la régularisation"],"a":1,"e":"Mathématiquement c&#39;est la même solution, mais l&#39;inversion explicite est plus fragile."},{"n":"ml-tp-corriges","q":"Dans le TP 1, la fonction <code>Standardiseur.fit<\/code> doit être appelée sur :","o":["le jeu de test","toute la base","le jeu d&#39;entraînement seulement"],"a":2,"e":"Sinon on introduit une fuite de données."},{"n":"ml-tp-corriges","q":"La règle de mise à jour de <code>fit_gd<\/code> pour la MSE est :","o":["$w \\leftarrow w - lr \\cdot \\frac{2}{n} X^T(Xw - y)$","$w \\leftarrow (X^TX)^{-1}X^Ty$","$w \\leftarrow w + lr \\cdot X^T(Xw - y)$"],"a":0,"e":"C&#39;est le gradient de la MSE ; $w = (X^TX)^{-1}X^Ty$ est la formule fermée, pas une itération."},{"n":"ml-tp-corriges","q":"Dans <code>GridSearchCV<\/code> sur un <code>Pipeline<\/code> dont l&#39;étape KNN s&#39;appelle <code>modele<\/code>, la clé de la grille est :","o":["<code>n_neighbors<\/code>","<code>modele__n_neighbors<\/code>","<code>modele.n_neighbors<\/code>"],"a":1,"e":"Nom de l&#39;étape, deux tirets bas, nom du paramètre."},{"n":"ml-tp-corriges","q":"Pour un filtre anti-spam, l&#39;erreur la plus gênante pour l&#39;utilisateur est en général :","o":["le faux négatif (un spam qui passe)","le vrai négatif","le faux positif (un vrai e-mail classé spam)"],"a":2,"e":"Perdre un vrai message est plus grave que voir passer un spam."},{"n":"ml-tp-corriges","q":"Dans le TP 4, l&#39;inertie passe de 1 841 ($K = 3$) à 278 ($K = 4$) puis à 251 ($K = 5$). On choisit :","o":["$K = 4$","$K = 5$","$K = 3$"],"a":0,"e":"Au-delà de 4, le gain devient marginal : c&#39;est le coude."},{"n":"ml-tp-corriges","q":"Sur <code>make_moons<\/code>, K-Means avec $K = 2$ échoue parce que :","o":["il détecte trop de bruit","il sépare les points par une frontière droite entre les deux centroïdes","il ne peut pas traiter deux dimensions"],"a":1,"e":"Chaque point va au centroïde le plus proche : la frontière est la médiatrice."},{"n":"ml-tp-corriges","q":"Sur les lunes, DBSCAN avec <code>eps = 0.02<\/code> et <code>min_samples = 5<\/code> donne :","o":["2 clusters","1 cluster","aucun cluster, tous les points en bruit"],"a":2,"e":"Le rayon est trop petit pour atteindre 5 voisins."},{"n":"ml-tp-corriges","q":"Pourquoi la CAH est-elle peu adaptée à 500 000 observations ?","o":["elle doit calculer et stocker les distances entre toutes les paires de points","elle ne fonctionne qu&#39;avec la méthode de Ward","elle exige de connaître $K$ à l&#39;avance"],"a":0,"e":"La mémoire et le temps explosent ; K-Means reste linéaire en $n$."}]},{"id":"ml-revision","t":"Révision express et examen blanc QCM","seance":"Préparation de l'examen · décembre 2026","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Ce chapitre résume les chapitres 1 à 8. Fais-le <strong>après<\/strong> les QCM des chapitres, puis refais-le la veille de l&#39;examen. Le prof a annoncé un examen à au moins 90 % de QCM, entre la 3e et la 4e semaine de décembre.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Sans regarder le cours : donne les formules de la précision et du rappel.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Précision $= TP/(TP + FP)$. Rappel $= TP/(TP + FN)$. Si tu as hésité, refais le QCM du chapitre 2 avant de continuer.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « élimination ».<\/strong> En QCM, deux options sont souvent fausses pour une raison évidente (mauvaise formule, mauvais sens d&#39;une inégalité). Élimine-les, puis départage les deux restantes avec un mini-calcul.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Les trois inversions qui coûtent le plus de points : précision ↔ rappel, L1 ↔ L2, biais ↔ variance. Relis le tableau ci-dessous jusqu&#39;à pouvoir le refaire de tête.<\/p>\n<\/aside><p>À la fin, tu as revu en une page tout ce qui tombe en QCM et tu t&#39;es entraîné sur un examen blanc de 30 questions qui mélange les chapitres.<\/p>\n<h2>Idée 1 · La fiche d&#39;une page<\/h2>\n<table>\n<thead>\n<tr>\n<th>Thème<\/th>\n<th>À savoir par cœur<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Paradigmes<\/td>\n<td>supervisé $(X, y)$ ; non supervisé $X$ seul ; renforcement (agent, état, action, récompense)<\/td>\n<\/tr>\n<tr>\n<td>Cible<\/td>\n<td>catégorie → classification ; nombre → régression<\/td>\n<\/tr>\n<tr>\n<td>Données<\/td>\n<td>train : paramètres ; validation : hyperparamètres ; test : une seule fois à la fin<\/td>\n<\/tr>\n<tr>\n<td>Fuite<\/td>\n<td>tout ce qui apprend ($\\mu$, $\\sigma$, médiane) se calcule sur le train → <code>Pipeline<\/code><\/td>\n<\/tr>\n<tr>\n<td>Encodage<\/td>\n<td>nominale → One-Hot ; ordinale → Ordinal<\/td>\n<\/tr>\n<tr>\n<td>Échelle<\/td>\n<td>sensibles : KNN, K-Means, SVM, logistique, Ridge/Lasso ; insensibles : arbres, forêts<\/td>\n<\/tr>\n<tr>\n<td>Erreurs<\/td>\n<td>MAE linéaire, robuste ; MSE carré, sensible ; RMSE racine, unité de $y$<\/td>\n<\/tr>\n<tr>\n<td>Gradient<\/td>\n<td>$w \\leftarrow w - \\eta\\, dJ/dw$ ; $\\eta$ trop grand → divergence<\/td>\n<\/tr>\n<tr>\n<td>Biais / variance<\/td>\n<td>biais = trop simple (sous-app.) ; variance = trop sensible (sur-app.)<\/td>\n<\/tr>\n<tr>\n<td>L1 / L2<\/td>\n<td>Lasso annule des poids (sélection) ; Ridge les réduit (colinéarité)<\/td>\n<\/tr>\n<tr>\n<td>MCO<\/td>\n<td>$w = \\text{Cov}/\\text{Var}$, $b = \\bar y - w\\bar x$, $\\sum e_i = 0$<\/td>\n<\/tr>\n<tr>\n<td>$R^2$<\/td>\n<td>$1 - SS_{res}/SS_{tot}$ ; 0 = moyenne ; &lt; 0 possible sur le test<\/td>\n<\/tr>\n<tr>\n<td>Logistique<\/td>\n<td>$\\sigma(z)$, frontière $w^Tx + b = 0$, log loss, $\\nabla = (p - y)x$<\/td>\n<\/tr>\n<tr>\n<td>Softmax<\/td>\n<td>$e^{z_k}/\\sum e^{z_j}$ ; somme 1 ; $K = 2$ → sigmoïde<\/td>\n<\/tr>\n<tr>\n<td>KNN<\/td>\n<td>standardiser ; petit $k$ → variance ; grand $k$ → biais ; $k$ impair<\/td>\n<\/tr>\n<tr>\n<td>Métriques<\/td>\n<td>précision $TP/(TP+FP)$ ; rappel $TP/(TP+FN)$ ; spécificité $TN/(TN+FP)$ ; F1 harmonique<\/td>\n<\/tr>\n<tr>\n<td>ROC / AUC<\/td>\n<td>TPR vs FPR ; AUC 0,5 = hasard ; 1 = parfait<\/td>\n<\/tr>\n<tr>\n<td>Arbres<\/td>\n<td>entropie (max 1) ; Gini (max 0,5) ; ID3 gain ; C4.5 gain ratio ; CART Gini binaire<\/td>\n<\/tr>\n<tr>\n<td>Forêts<\/td>\n<td>bootstrap 63,2 % ; OOB 36,8 % ; <code>max_features<\/code> à chaque nœud ; vote / moyenne<\/td>\n<\/tr>\n<tr>\n<td>K-Means<\/td>\n<td>inertie ↓ quand $K$ ↑ ; coude ; silhouette $(b - a)/\\max(a, b)$<\/td>\n<\/tr>\n<tr>\n<td>CAH<\/td>\n<td>Single (chaîne), Complete (compacts), Average, Ward (inertie) ; couper au plus grand saut<\/td>\n<\/tr>\n<tr>\n<td>DBSCAN<\/td>\n<td>cœur ≥ MinPts dans $\\varepsilon$ ; frontière ; bruit = −1 ; formes quelconques<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h2>Idée 2 · Les calculs qui tombent<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Les dix mini-calculs à savoir faire en 30 secondes<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/10 · Métriques<\/div><p>TP = 40, FP = 10, FN = 20, TN = 130 → précision 0,8 ; rappel 0,667 ; accuracy 0,85 ; spécificité 0,929.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/10 · F1<\/div><p>$P = 0{,}9$, $R = 0{,}6$ → $F_1 = 2 \\times 0{,}54 / 1{,}5 = 0{,}72$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/10 · MAE / MSE<\/div><p>$e = [20, -40, 50]$ → MAE ≈ 36,67 ; MSE = 1 500 ; RMSE ≈ 38,73.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/10 · Gradient<\/div><p>$J = (w - 3)^2$, $\\eta = 0{,}1$, $w_0 = 0$ → $w_1 = 0{,}6$, $w_2 = 1{,}08$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/10 · MCO<\/div><p>$\\text{Cov} = 4\\,675$, $\\text{Var} = 500$, $\\bar x = 80$, $\\bar y = 782{,}5$ → $w = 9{,}35$, $b = 34{,}5$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">6/10 · Sigmoïde<\/div><p>$z = 1$ → 0,731 ; $z = 0$ → 0,5 ; $z = 2$ → 0,881.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">7/10 · Entropie<\/div><p>6 / 4 → 0,971 ; 50 / 50 → 1 ; pur → 0.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">8/10 · Gini<\/div><p>6 / 4 → 0,48 ; 50 / 50 → 0,5 ; 8 / 2 → 0,32.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">9/10 · Distances<\/div><p>(1, 2) et (4, 6) → euclidienne 5, Manhattan 7.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">10/10 · Silhouette<\/div><p>$a = 2$, $b = 5$ → 0,6.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Idée 3 · Les erreurs des diapos à connaître<\/h2>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Ces points ont été repérés en refaisant les calculs des séances. Si une question d&#39;examen reprend l&#39;un de ces exemples, fie-toi à la valeur correcte.<\/p>\n<\/aside><table>\n<thead>\n<tr>\n<th>Séance<\/th>\n<th>Ce qui est écrit<\/th>\n<th>Correction<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>4 · évaluation<\/td>\n<td>$SS_{tot} = 178\\,875$<\/td>\n<td><strong>175 675<\/strong> ; le $R^2 \\approx 0{,}9953$ reste juste<\/td>\n<\/tr>\n<tr>\n<td>4 · atelier<\/td>\n<td><code>DataFrame({...<\/code> sans <code>})<\/code>, <code>= r2_score(...)<\/code> sans variable, unité k€<\/td>\n<td>code corrigé au chapitre 4, unité kDH<\/td>\n<\/tr>\n<tr>\n<td>2 · mise à l&#39;échelle<\/td>\n<td>standardisation « robuste aux outliers »<\/td>\n<td>seulement <strong>moins<\/strong> sensible que Min-Max<\/td>\n<\/tr>\n<tr>\n<td>6 · gain d&#39;information<\/td>\n<td>gain = 0,0466, gain ratio = 0,0480<\/td>\n<td>valeurs exactes 0,0464 et 0,0478 (arrondis intermédiaires)<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Trois questions ouvertes de synthèse<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Un modèle de détection de fraude a 99 % d&#39;accuracy sur des données à 1 % de fraudes. Est-ce un bon modèle ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>On ne peut pas conclure : un modèle qui dit toujours « pas de fraude » a aussi 99 %. Il faut regarder le <strong>rappel<\/strong> de la classe fraude, le F1, la matrice de confusion ou la PR-AUC.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Pourquoi la forêt aléatoire ne demande-t-elle pas de standardisation, alors que KNN si ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Une forêt combine des arbres qui posent des seuils sur une variable à la fois : changer d&#39;unité déplace le seuil sans changer la séparation. KNN calcule des <strong>distances<\/strong> entre points, qui dépendent directement des unités.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Tu as 3 groupes de forme allongée et quelques points isolés. K-Means, CAH ou DBSCAN ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>DBSCAN : il suit les zones denses (formes quelconques), découvre seul le nombre de groupes et marque les points isolés en bruit (−1). La CAH en Single linkage pourrait aussi suivre des formes allongées, mais sans détecter le bruit.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 5 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Un détecteur d&#39;intrusion doit rater le moins d&#39;attaques possible. On maximise :<\/div><button class=\"opt\" data-o=\"0\">la précision<\/button><button class=\"opt\" data-o=\"1\">le rappel<\/button><button class=\"opt\" data-o=\"2\">la spécificité<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">On règle <code>max_depth<\/code> d&#39;un arbre en comparant plusieurs valeurs sur le jeu de test. Conséquence :<\/div><button class=\"opt\" data-o=\"0\">le modèle sous-apprend forcément<\/button><button class=\"opt\" data-o=\"1\">aucune, c&#39;est la méthode recommandée<\/button><button class=\"opt\" data-o=\"2\">le score de test devient optimiste : le test a servi à choisir le modèle<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Quelle étape doit venir <strong>en premier<\/strong> ?<\/div><button class=\"opt\" data-o=\"0\">séparer train et test<\/button><button class=\"opt\" data-o=\"1\">standardiser toutes les données<\/button><button class=\"opt\" data-o=\"2\">imputer avec la médiane globale<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Erreurs $[3, -3, 6]$. La MAE vaut :<\/div><button class=\"opt\" data-o=\"0\">2<\/button><button class=\"opt\" data-o=\"1\">4<\/button><button class=\"opt\" data-o=\"2\">18<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Toujours avec $[3, -3, 6]$, la MSE vaut :<\/div><button class=\"opt\" data-o=\"0\">54<\/button><button class=\"opt\" data-o=\"1\">4<\/button><button class=\"opt\" data-o=\"2\">18<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Le taux d&#39;apprentissage est trop grand. On observe :<\/div><button class=\"opt\" data-o=\"0\">une fonction de coût qui oscille ou explose<\/button><button class=\"opt\" data-o=\"1\">un minimum global garanti<\/button><button class=\"opt\" data-o=\"2\">une convergence très lente mais sûre<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Un modèle a 99 % sur le train et 70 % sur le test. Le diagnostic est :<\/div><button class=\"opt\" data-o=\"0\">un biais élevé<\/button><button class=\"opt\" data-o=\"1\">une variance élevée (surapprentissage)<\/button><button class=\"opt\" data-o=\"2\">une bonne généralisation<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Quelle méthode réalise une <strong>sélection automatique de variables<\/strong> ?<\/div><button class=\"opt\" data-o=\"0\">Ridge<\/button><button class=\"opt\" data-o=\"1\">les MCO sans pénalité<\/button><button class=\"opt\" data-o=\"2\">Lasso<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Une régression avec biais a des résidus $-4,\\ 1,\\ x$. Que vaut $x$ ?<\/div><button class=\"opt\" data-o=\"0\">3<\/button><button class=\"opt\" data-o=\"1\">0<\/button><button class=\"opt\" data-o=\"2\">−3<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">$R^2 = -0{,}3$ sur le test signifie que le modèle :<\/div><button class=\"opt\" data-o=\"0\">explique 30 % de la variance<\/button><button class=\"opt\" data-o=\"1\">fait pire que prédire la moyenne<\/button><button class=\"opt\" data-o=\"2\">est impossible<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"10\"><div class=\"qq-q\">La régression polynomiale de degré 3 est :<\/div><button class=\"opt\" data-o=\"0\">non linéaire en ses paramètres<\/button><button class=\"opt\" data-o=\"1\">un modèle de classification<\/button><button class=\"opt\" data-o=\"2\">linéaire en ses paramètres, donc résoluble par les MCO<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"11\"><div class=\"qq-q\">$z = w^Tx + b = -2$. La régression logistique prédit, avec le seuil 0,5 :<\/div><button class=\"opt\" data-o=\"0\">la classe 0<\/button><button class=\"opt\" data-o=\"1\">une probabilité de −2<\/button><button class=\"opt\" data-o=\"2\">la classe 1<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"12\"><div class=\"qq-q\">La perte utilisée pour entraîner la régression logistique est :<\/div><button class=\"opt\" data-o=\"0\">la MSE<\/button><button class=\"opt\" data-o=\"1\">l&#39;entropie croisée (log loss)<\/button><button class=\"opt\" data-o=\"2\">l&#39;indice de Gini<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"13\"><div class=\"qq-q\">Classification à 10 classes exclusives avec un modèle unique dont les probabilités somment à 1 :<\/div><button class=\"opt\" data-o=\"0\">sigmoïde seule<\/button><button class=\"opt\" data-o=\"1\">One-vs-Rest<\/button><button class=\"opt\" data-o=\"2\">Softmax<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"14\"><div class=\"qq-q\">KNN avec $k = n$ (toutes les observations) prédit :<\/div><button class=\"opt\" data-o=\"0\">toujours la classe majoritaire du jeu d&#39;entraînement<\/button><button class=\"opt\" data-o=\"1\">toujours la classe du point le plus proche<\/button><button class=\"opt\" data-o=\"2\">une classe au hasard<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"15\"><div class=\"qq-q\">TN = 90, FP = 10. La spécificité vaut :<\/div><button class=\"opt\" data-o=\"0\">0,1<\/button><button class=\"opt\" data-o=\"1\">0,9<\/button><button class=\"opt\" data-o=\"2\">0,5<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"16\"><div class=\"qq-q\">Une AUC de 0,3 indique un modèle :<\/div><button class=\"opt\" data-o=\"0\">parfait<\/button><button class=\"opt\" data-o=\"1\">au hasard<\/button><button class=\"opt\" data-o=\"2\">pire que le hasard (inverser ses prédictions l&#39;améliorerait)<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"17\"><div class=\"qq-q\">Courbe ROC : l&#39;axe horizontal est :<\/div><button class=\"opt\" data-o=\"0\">le FPR = 1 − spécificité<\/button><button class=\"opt\" data-o=\"1\">le rappel<\/button><button class=\"opt\" data-o=\"2\">la précision<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"18\"><div class=\"qq-q\">Entropie d&#39;un nœud contenant 4 observations d&#39;une seule classe :<\/div><button class=\"opt\" data-o=\"0\">0,5<\/button><button class=\"opt\" data-o=\"1\">0<\/button><button class=\"opt\" data-o=\"2\">1<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"19\"><div class=\"qq-q\">Gini d&#39;un nœud binaire 50 / 50 :<\/div><button class=\"opt\" data-o=\"0\">0,25<\/button><button class=\"opt\" data-o=\"1\">1<\/button><button class=\"opt\" data-o=\"2\">0,5<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"20\"><div class=\"qq-q\">Quel algorithme utilise le <strong>gain ratio<\/strong> ?<\/div><button class=\"opt\" data-o=\"0\">C4.5<\/button><button class=\"opt\" data-o=\"1\">CART<\/button><button class=\"opt\" data-o=\"2\">ID3<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"21\"><div class=\"qq-q\">Arbre de régression : une feuille contient les prix 200, 220, 240. Elle prédit :<\/div><button class=\"opt\" data-o=\"0\">200<\/button><button class=\"opt\" data-o=\"1\">220<\/button><button class=\"opt\" data-o=\"2\">240<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"22\"><div class=\"qq-q\">Dans une forêt aléatoire, les observations out-of-bag d&#39;un arbre sont :<\/div><button class=\"opt\" data-o=\"0\">celles du jeu de test<\/button><button class=\"opt\" data-o=\"1\">les observations aberrantes<\/button><button class=\"opt\" data-o=\"2\">celles absentes de son échantillon bootstrap<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"23\"><div class=\"qq-q\">Le bagging réduit surtout :<\/div><button class=\"opt\" data-o=\"0\">la variance<\/button><button class=\"opt\" data-o=\"1\">le bruit irréductible<\/button><button class=\"opt\" data-o=\"2\">le biais<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"24\"><div class=\"qq-q\">Quand $K$ augmente, l&#39;inertie de K-Means :<\/div><button class=\"opt\" data-o=\"0\">augmente<\/button><button class=\"opt\" data-o=\"1\">diminue<\/button><button class=\"opt\" data-o=\"2\">reste stable<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"25\"><div class=\"qq-q\">Silhouette d&#39;un point avec $a(i) = 3$ et $b(i) = 3$ :<\/div><button class=\"opt\" data-o=\"0\">1<\/button><button class=\"opt\" data-o=\"1\">−1<\/button><button class=\"opt\" data-o=\"2\">0, le point est à la frontière<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"26\"><div class=\"qq-q\">Pour des groupes très compacts en CAH, avec prise en compte des effectifs, on choisit :<\/div><button class=\"opt\" data-o=\"0\">Ward<\/button><button class=\"opt\" data-o=\"1\">Single<\/button><button class=\"opt\" data-o=\"2\">Average<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"27\"><div class=\"qq-q\">Un dendrogramme montre des fusions à 1 ; 1 ; 1,58 et 5,15. Combien de groupes en coupant au plus grand saut ?<\/div><button class=\"opt\" data-o=\"0\">1<\/button><button class=\"opt\" data-o=\"1\">2<\/button><button class=\"opt\" data-o=\"2\">3<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"28\"><div class=\"qq-q\">DBSCAN, $\\varepsilon = 1$, MinPts = 3. Un point a 2 points dans son voisinage (lui compris) et n&#39;est voisin d&#39;aucun point cœur. C&#39;est :<\/div><button class=\"opt\" data-o=\"0\">un point cœur<\/button><button class=\"opt\" data-o=\"1\">un point frontière<\/button><button class=\"opt\" data-o=\"2\">du bruit (−1)<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"29\"><div class=\"qq-q\">Quel algorithme découvre <strong>seul<\/strong> le nombre de groupes et détecte le bruit ?<\/div><button class=\"opt\" data-o=\"0\">DBSCAN<\/button><button class=\"opt\" data-o=\"1\">K-Means<\/button><button class=\"opt\" data-o=\"2\">la CAH<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"ml-revision","rep":null,"tol":null},{"n":"ml-revision","rep":null,"tol":null},{"n":"ml-revision","rep":null,"tol":null},{"n":"ml-revision","rep":null,"tol":null}],"qcm":[{"n":"ml-revision","q":"Un détecteur d&#39;intrusion doit rater le moins d&#39;attaques possible. On maximise :","o":["la précision","le rappel","la spécificité"],"a":1,"e":"Rater une attaque = faux négatif ; le rappel $TP/(TP + FN)$ les pénalise."},{"n":"ml-revision","q":"On règle <code>max_depth<\/code> d&#39;un arbre en comparant plusieurs valeurs sur le jeu de test. Conséquence :","o":["le modèle sous-apprend forcément","aucune, c&#39;est la méthode recommandée","le score de test devient optimiste : le test a servi à choisir le modèle"],"a":2,"e":"Le réglage se fait par validation ou validation croisée."},{"n":"ml-revision","q":"Quelle étape doit venir <strong>en premier<\/strong> ?","o":["séparer train et test","standardiser toutes les données","imputer avec la médiane globale"],"a":0,"e":"Toute transformation qui apprend se fait après la séparation, sur le train."},{"n":"ml-revision","q":"Erreurs $[3, -3, 6]$. La MAE vaut :","o":["2","4","18"],"a":1,"e":"$(3 + 3 + 6)/3 = 4$."},{"n":"ml-revision","q":"Toujours avec $[3, -3, 6]$, la MSE vaut :","o":["54","4","18"],"a":2,"e":"$(9 + 9 + 36)/3 = 18$."},{"n":"ml-revision","q":"Le taux d&#39;apprentissage est trop grand. On observe :","o":["une fonction de coût qui oscille ou explose","un minimum global garanti","une convergence très lente mais sûre"],"a":0,"e":"Les pas sautent par-dessus le minimum."},{"n":"ml-revision","q":"Un modèle a 99 % s :"Tous les points votent, quelle que soit la position du nouveau point."},{"n":"ml-revision","q":"TN = 90, FP = 10. La spécificité vaut :","o":["0,1","0,9","0,5"],"a":1,"e":"$90/100$ ; le FPR vaut 0,1."},{"n":"ml-revision","q":"Une AUC de 0,3 indique un modèle :","o":["parfait","au hasard","pire que le hasard (inverser ses prédictions l&#39;améliorerait)"],"a":2,"e":"Sous 0,5, l&#39;ordre des scores est majoritairement inversé."},{"n":"ml-revision","q":"Courbe ROC : l&#39;axe horizontal est :","o":["le FPR = 1 − spécificité","le rappel","la précision"],"a":0,"e":"L&#39;axe vertical est le TPR (rappel)."},{"n":"ml-revision","q":"Entropie d&#39;un nœud contenant 4 observations d&#39;une seule classe :","o":["0,5","0","1"],"a":1,"e":"Nœud pur."},{"n":"ml-revision","q":"Gini d&#39;un nœud binaire 50 / 50 :","o":["0,25","1","0,5"],"a":2,"e":"$1 - 0{,}25 - 0{,}25$."},{"n":"ml-revision","q":"Quel algorithme utilise le <strong>gain ratio<\/strong> ?","o":["C4.5","CART","ID3"],"a":0,"e":"ID3 : gain d&#39;information ; CART : Gini."},{"n":"ml-revision","q":"Arbre de régression : une feuille contient les prix 200, 220, 240. Elle prédit :","o":["200","220","240"],"a":1,"e":"La moyenne des valeurs cibles de la feuille."},{"n":"ml-revision","q":"Dans une forêt aléatoire, les observations out-of-bag d&#39;un arbre sont :","o":["celles du jeu de test","les observations aberrantes","celles absentes de son échantillon bootstrap"],"a":2,"e":"Environ 36,8 % ; elles servent à estimer l&#39;erreur."},{"n":"ml-revision","q":"Le bagging réduit surtout :","o":["la variance","le bruit irréductible","le biais"],"a":0,"e":"Moyenner des modèles instables les stabilise."},{"n":"ml-revision","q":"Quand $K$ augmente, l&#39;inertie de K-Means :","o":["augmente","diminue","reste stable"],"a":1,"e":"D&#39;où la méthode du coude, et la silhouette qui ne baisse pas mécaniquement."},{"n":"ml-revision","q":"Silhouette d&#39;un point avec $a(i) = 3$ et $b(i) = 3$ :","o":["1","−1","0, le point est à la frontière"],"a":2,"e":"$(3 - 3)/3 = 0$."},{"n":"ml-revision","q":"Pour des groupes très compacts en CAH, avec prise en compte des effectifs, on choisit :","o":["Ward","Single","Average"],"a":0,"e":"Ward minimise la hausse d&#39;inertie à chaque fusion."},{"n":"ml-revision","q":"Un dendrogramme montre des fusions à 1 ; 1 ; 1,58 et 5,15. Combien de groupes en coupant au plus grand saut ?","o":["1","2","3"],"a":1,"e":"Le plus grand saut est entre 1,58 et 5,15 : la coupe traverse 2 branches."},{"n":"ml-revision","q":"DBSCAN, $\\varepsilon = 1$, MinPts = 3. Un point a 2 points dans son voisinage (lui compris) et n&#39;est voisin d&#39;aucun point cœur. C&#39;est :","o":["un point cœur","un point frontière","du bruit (−1)"],"a":2,"e":"Ni assez de voisins, ni rattaché à un cœur."},{"n":"ml-revision","q":"Quel algorithme découvre <strong>seul<\/strong> le nombre de groupes et détecte le bruit ?","o":["DBSCAN","K-Means","la CAH"],"a":0,"e":"K-Means demande $K$ ; la CAH demande une coupe ; aucun des deux ne marque le bruit."}]}];

const CARTES=[{"n":"ml-fondements","k":0,"ch":"ml-fondements","q":"<p>Définition du ML (Pr Madani)<\/p>\n","r":"<p>Domaine de l&#39;IA : construire un modèle à partir de données pour prédire ou classer de nouvelles données.<\/p>\n"},{"n":"ml-fondements","k":1,"ch":"ml-fondements","q":"<p>Définition de Mitchell<\/p>\n","r":"<p>Un programme apprend d&#39;une expérience E, pour une tâche T, selon une performance P, si P sur T s&#39;améliore avec E.<\/p>\n"},{"n":"ml-fondements","k":2,"ch":"ml-fondements","q":"<p>IA, ML, DL<\/p>\n","r":"<p>IA ⊃ ML ⊃ Deep Learning. Le DL utilise des réseaux de neurones à plusieurs couches.<\/p>\n"},{"n":"ml-fondements","k":3,"ch":"ml-fondements","q":"<p>Feature et cible<\/p>\n","r":"<p>Feature = information en entrée (colonne de X). Cible y = ce qu&#39;on veut prédire.<\/p>\n"},{"n":"ml-fondements","k":4,"ch":"ml-fondements","q":"<p>n et p<\/p>\n","r":"<p>n = nombre d&#39;observations (lignes), p = nombre de caractéristiques (colonnes). X ∈ R^(n×p).<\/p>\n"},{"n":"ml-fondements","k":5,"ch":"ml-fondements","q":"<p>Classification ou régression<\/p>\n","r":"<p>Cible catégorielle → classification. Cible numérique → régression.<\/p>\n"},{"n":"ml-fondements","k":6,"ch":"ml-fondements","q":"<p>Renforcement<\/p>\n","r":"<p>Un agent choisit des actions selon des états et cherche à maximiser la récompense cumulée.<\/p>\n"},{"n":"ml-fondements","k":7,"ch":"ml-fondements","q":"<p>Généralisation<\/p>\n","r":"<p>Capacité à bien prédire sur des données jamais vues pendant l&#39;apprentissage.<\/p>\n"},{"n":"ml-fondements","k":8,"ch":"ml-fondements","q":"<p>fit() et predict()<\/p>\n","r":"<p>fit apprend les paramètres sur le train ; predict applique le modèle appris à de nouvelles données.<\/p>\n"},{"n":"ml-cycle-de-vie","k":9,"ch":"ml-cycle-de-vie","q":"<p>Data leakage<\/p>\n","r":"<p>Une information indisponible au moment de la prédiction (souvent issue du test) influence l&#39;apprentissage ou l&#39;évaluation.<\/p>\n"},{"n":"ml-cycle-de-vie","k":10,"ch":"ml-cycle-de-vie","q":"<p>Imputation sans fuite<\/p>\n","r":"<p>La médiane (ou moyenne) se calcule sur X_train seulement, puis s&#39;applique au test.<\/p>\n"},{"n":"ml-cycle-de-vie","k":11,"ch":"ml-cycle-de-vie","q":"<p>Nominale vs ordinale<\/p>\n","r":"<p>Nominale (pas d&#39;ordre) → One-Hot. Ordinale (ordre réel) → Ordinal Encoding.<\/p>\n"},{"n":"ml-cycle-de-vie","k":12,"ch":"ml-cycle-de-vie","q":"<p>Forte cardinalité<\/p>\n","r":"<p>Trop de catégories pour le One-Hot : regrouper les rares, frequency encoding, target encoding.<\/p>\n"},{"n":"ml-cycle-de-vie","k":13,"ch":"ml-cycle-de-vie","q":"<p>Z-score vs Min-Max<\/p>\n","r":"<p>Z-score : moyenne 0, écart-type 1, sans bornes. Min-Max : [0, 1], très sensible aux outliers.<\/p>\n"},{"n":"ml-cycle-de-vie","k":14,"ch":"ml-cycle-de-vie","q":"<p>Train / validation / test<\/p>\n","r":"<p>Train : apprendre θ. Validation : choisir les hyperparamètres. Test : évaluation finale unique.<\/p>\n"},{"n":"ml-cycle-de-vie","k":15,"ch":"ml-cycle-de-vie","q":"<p>Stratification<\/p>\n","r":"<p>Garder les proportions des classes dans train et test (stratify=y, StratifiedKFold).<\/p>\n"},{"n":"ml-cycle-de-vie","k":16,"ch":"ml-cycle-de-vie","q":"<p>K-fold<\/p>\n","r":"<p>K entraînements sur K−1 blocs, validation sur le bloc restant, score = moyenne des K.<\/p>\n"},{"n":"ml-cycle-de-vie","k":17,"ch":"ml-cycle-de-vie","q":"<p>Précision<\/p>\n","r":"<p>TP / (TP + FP) : fiabilité des alertes.<\/p>\n"},{"n":"ml-cycle-de-vie","k":18,"ch":"ml-cycle-de-vie","q":"<p>Rappel<\/p>\n","r":"<p>TP / (TP + FN) : part des vrais positifs détectés.<\/p>\n"},{"n":"ml-cycle-de-vie","k":19,"ch":"ml-cycle-de-vie","q":"<p>F1<\/p>\n","r":"<p>2PR / (P + R), moyenne harmonique de la précision et du rappel.<\/p>\n"},{"n":"ml-cycle-de-vie","k":20,"ch":"ml-cycle-de-vie","q":"<p>Paradoxe de l&#39;accuracy<\/p>\n","r":"<p>Sur 98 % / 2 %, prédire toujours la classe majoritaire donne 98 % d&#39;accuracy et 0 détection.<\/p>\n"},{"n":"ml-cycle-de-vie","k":21,"ch":"ml-cycle-de-vie","q":"<p>Data drift<\/p>\n","r":"<p>La distribution des données réelles change après le déploiement ; il faut surveiller et réentraîner.<\/p>\n"},{"n":"ml-fondements-maths","k":22,"ch":"ml-fondements-maths","q":"<p>θ* = argmin J(θ)<\/p>\n","r":"<p>Apprendre = trouver les paramètres qui minimisent la fonction objectif sur le train.<\/p>\n"},{"n":"ml-fondements-maths","k":23,"ch":"ml-fondements-maths","q":"<p>Erreur, perte, objectif<\/p>\n","r":"<p>Erreur e = y − ŷ (signée) ; perte L ≥ 0 sur une observation ; objectif J = moyenne des pertes.<\/p>\n"},{"n":"ml-fondements-maths","k":24,"ch":"ml-fondements-maths","q":"<p>MAE vs MSE<\/p>\n","r":"<p>MAE : pénalité linéaire, robuste, unité de y. MSE : pénalité quadratique, sensible aux outliers, unité².<\/p>\n"},{"n":"ml-fondements-maths","k":25,"ch":"ml-fondements-maths","q":"<p>RMSE<\/p>\n","r":"<p>Racine de la MSE : pénalise les grandes erreurs mais revient à l&#39;unité de y.<\/p>\n"},{"n":"ml-fondements-maths","k":26,"ch":"ml-fondements-maths","q":"<p>Descente de gradient<\/p>\n","r":"<p>w ← w − η · dJ/dw : on avance à l&#39;opposé du gradient.<\/p>\n"},{"n":"ml-fondements-maths","k":27,"ch":"ml-fondements-maths","q":"<p>Taux d&#39;apprentissage η<\/p>\n","r":"<p>Trop petit : lent. Trop grand : oscillations ou divergence.<\/p>\n"},{"n":"ml-fondements-maths","k":28,"ch":"ml-fondements-maths","q":"<p>SGD vs mini-batch<\/p>\n","r":"<p>SGD : une observation par pas (bruité). Mini-batch : un lot de B observations (standard).<\/p>\n"},{"n":"ml-fondements-maths","k":29,"ch":"ml-fondements-maths","q":"<p>Biais<\/p>\n","r":"<p>Erreur due à un modèle trop simple → sous-apprentissage.<\/p>\n"},{"n":"ml-fondements-maths","k":30,"ch":"ml-fondements-maths","q":"<p>Variance<\/p>\n","r":"<p>Sensibilité aux fluctuations du train → surapprentissage.<\/p>\n"},{"n":"ml-fondements-maths","k":31,"ch":"ml-fondements-maths","q":"<p>Lasso (L1)<\/p>\n","r":"<p>Pénalité Σ|wj| : annule certains coefficients → sélection de variables.<\/p>\n"},{"n":"ml-fondements-maths","k":32,"ch":"ml-fondements-maths","q":"<p>Ridge (L2)<\/p>\n","r":"<p>Pénalité Σwj² : réduit les coefficients sans les annuler → stabilité face à la colinéarité.<\/p>\n"},{"n":"ml-fondements-maths","k":33,"ch":"ml-fondements-maths","q":"<p>Choisir λ<\/p>\n","r":"<p>Sur la validation ou par validation croisée, jamais sur le train ni sur le test.<\/p>\n"},{"n":"ml-regression","k":34,"ch":"ml-regression","q":"<p>MCO (simple)<\/p>\n","r":"<p>w = Cov(x, y) / Var(x) ; b = ȳ − w x̄. La droite passe par (x̄, ȳ).<\/p>\n"},{"n":"ml-regression","k":35,"ch":"ml-regression","q":"<p>Résidu<\/p>\n","r":"<p>e = y − ŷ, distance verticale. e &gt; 0 : sous-estimation ; e &lt; 0 : surestimation.<\/p>\n"},{"n":"ml-regression","k":36,"ch":"ml-regression","q":"<p>Somme des résidus MCO<\/p>\n","r":"<p>Toujours nulle quand le modèle a un biais b.<\/p>\n"},{"n":"ml-regression","k":37,"ch":"ml-regression","q":"<p>Équations normales<\/p>\n","r":"<p>X̃ᵀX̃ w̃ = X̃ᵀy, donc ŵ = (X̃ᵀX̃)⁻¹X̃ᵀy si X̃ᵀX̃ est inversible.<\/p>\n"},{"n":"ml-regression","k":38,"ch":"ml-regression","q":"<p>Ceteris paribus<\/p>\n","r":"<p>Un coefficient wj mesure l&#39;effet de xj quand toutes les autres variables restent fixes.<\/p>\n"},{"n":"ml-regression","k":39,"ch":"ml-regression","q":"<p>Multicolinéarité<\/p>\n","r":"<p>Variables très corrélées : coefficients instables et difficiles à interpréter.<\/p>\n"},{"n":"ml-regression","k":40,"ch":"ml-regression","q":"<p>R²<\/p>\n","r":"<p>1 − SSres/SStot : part de la variance de y expliquée. 0 = pas mieux que la moyenne ; &lt; 0 possible sur le test.<\/p>\n"},{"n":"ml-regression","k":41,"ch":"ml-regression","q":"<p>Interpolation vs extrapolation<\/p>\n","r":"<p>Prédire dans l&#39;intervalle des données (sûr) ou en dehors (dangereux).<\/p>\n"},{"n":"ml-regression","k":42,"ch":"ml-regression","q":"<p>Régression polynomiale<\/p>\n","r":"<p>Features x, x², …, x^d ; non linéaire en x mais linéaire en w.<\/p>\n"},{"n":"ml-regression","k":43,"ch":"ml-regression","q":"<p>include_bias=False<\/p>\n","r":"<p>Dans PolynomialFeatures, évite une colonne de 1 en double avec LinearRegression.<\/p>\n"},{"n":"ml-regression","k":44,"ch":"ml-regression","q":"<p>alpha en scikit-learn<\/p>\n","r":"<p>Force de régularisation de Ridge et Lasso (λ dans le cours).<\/p>\n"},{"n":"ml-classification","k":45,"ch":"ml-classification","q":"<p>Sigmoïde<\/p>\n","r":"<p>σ(z) = 1/(1 + e^(−z)) ; σ(0) = 0,5. Transforme un score en probabilité.<\/p>\n"},{"n":"ml-classification","k":46,"ch":"ml-classification","q":"<p>Frontière de la logistique<\/p>\n","r":"<p>wᵀx + b = 0 (seuil 0,5) : un hyperplan, donc une frontière linéaire.<\/p>\n"},{"n":"ml-classification","k":47,"ch":"ml-classification","q":"<p>Log loss<\/p>\n","r":"<p>−[y log p + (1 − y) log(1 − p)]. Convexe avec la sigmoïde, contrairement à la MSE.<\/p>\n"},{"n":"ml-classification","k":48,"ch":"ml-classification","q":"<p>Gradient de la logistique<\/p>\n","r":"<p>∂J/∂wj = (1/n) Σ (pi − yi) xij. Pas de formule fermée : descente de gradient.<\/p>\n"},{"n":"ml-classification","k":49,"ch":"ml-classification","q":"<p>Softmax<\/p>\n","r":"<p>pk = e^(zk) / Σ e^(zj) : vraie distribution (somme 1). Pour K = 2, c&#39;est la sigmoïde.<\/p>\n"},{"n":"ml-classification","k":50,"ch":"ml-classification","q":"<p>OvR<\/p>\n","r":"<p>K classifieurs binaires indépendants ; les sorties ne somment pas à 1.<\/p>\n"},{"n":"ml-classification","k":51,"ch":"ml-classification","q":"<p>KNN<\/p>\n","r":"<p>Vote des k plus proches voisins. Non paramétrique, sensible à l&#39;échelle, coûteux à la prédiction.<\/p>\n"},{"n":"ml-classification","k":52,"ch":"ml-classification","q":"<p>Petit k / grand k<\/p>\n","r":"<p>Petit k : variance élevée (surapprentissage). Grand k : biais élevé. k = n : classe majoritaire.<\/p>\n"},{"n":"ml-classification","k":53,"ch":"ml-classification","q":"<p>Manhattan vs euclidienne<\/p>\n","r":"<p>q = 1 : somme des |écarts|. q = 2 : racine de la somme des carrés.<\/p>\n"},{"n":"ml-classification","k":54,"ch":"ml-classification","q":"<p>Spécificité<\/p>\n","r":"<p>TN / (TN + FP). FPR = 1 − spécificité.<\/p>\n"},{"n":"ml-classification","k":55,"ch":"ml-classification","q":"<p>Macro vs weighted<\/p>\n","r":"<p>Macro : chaque classe pèse pareil. Weighted : pondérée par l&#39;effectif.<\/p>\n"},{"n":"ml-classification","k":56,"ch":"ml-classification","q":"<p>ROC<\/p>\n","r":"<p>TPR (rappel) en fonction du FPR, pour tous les seuils.<\/p>\n"},{"n":"ml-classification","k":57,"ch":"ml-classification","q":"<p>AUC<\/p>\n","r":"<p>Probabilité qu&#39;un positif ait un score plus haut qu&#39;un négatif. 0,5 = hasard, 1 = parfait.<\/p>\n"},{"n":"ml-arbres-forets","k":58,"ch":"ml-arbres-forets","q":"<p>Algorithme glouton<\/p>\n","r":"<p>Choisit la meilleure séparation immédiate, sans anticipation ni retour en arrière.<\/p>\n"},{"n":"ml-arbres-forets","k":59,"ch":"ml-arbres-forets","q":"<p>Entropie<\/p>\n","r":"<p>H = −Σ pk log2 pk. 0 si pur, 1 pour 50/50 en binaire.<\/p>\n"},{"n":"ml-arbres-forets","k":60,"ch":"ml-arbres-forets","q":"<p>Gain d&#39;information<\/p>\n","r":"<p>H(parent) − moyenne pondérée des H(enfants).<\/p>\n"},{"n":"ml-arbres-forets","k":61,"ch":"ml-arbres-forets","q":"<p>Gini<\/p>\n","r":"<p>1 − Σ pk². 0 si pur, 0,5 pour 50/50 en binaire. Utilisé par CART.<\/p>\n"},{"n":"ml-arbres-forets","k":62,"ch":"ml-arbres-forets","q":"<p>ID3<\/p>\n","r":"<p>Quinlan 1986, gain d&#39;information, variables catégorielles, une branche par modalité, pas d&#39;élagage.<\/p>\n"},{"n":"ml-arbres-forets","k":63,"ch":"ml-arbres-forets","q":"<p>C4.5<\/p>\n","r":"<p>Quinlan 1993, gain ratio = gain / SplitInfo, variables numériques, manquants, post-élagage.<\/p>\n"},{"n":"ml-arbres-forets","k":64,"ch":"ml-arbres-forets","q":"<p>CART<\/p>\n","r":"<p>Breiman 1984, séparations binaires, Gini (classification) ou SSE (régression). Celui de scikit-learn.<\/p>\n"},{"n":"ml-arbres-forets","k":65,"ch":"ml-arbres-forets","q":"<p>Arbre de régression<\/p>\n","r":"<p>La feuille prédit la moyenne des valeurs cibles de ses observations.<\/p>\n"},{"n":"ml-arbres-forets","k":66,"ch":"ml-arbres-forets","q":"<p>Élagage coût-complexité<\/p>\n","r":"<p>Rα(T) = R(T) + α|T| ; α choisi par validation croisée.<\/p>\n"},{"n":"ml-arbres-forets","k":67,"ch":"ml-arbres-forets","q":"<p>Bootstrap<\/p>\n","r":"<p>Tirage de N parmi N avec remise : ≈ 63,2 % d&#39;observations distinctes, 36,8 % out-of-bag.<\/p>\n"},{"n":"ml-arbres-forets","k":68,"ch":"ml-arbres-forets","q":"<p>Random Forest<\/p>\n","r":"<p>Bagging + sous-ensemble aléatoire de variables à chaque nœud ; vote ou moyenne.<\/p>\n"},{"n":"ml-arbres-forets","k":69,"ch":"ml-arbres-forets","q":"<p>Bagging vs boosting<\/p>\n","r":"<p>Bagging : modèles en parallèle sur bootstrap. Boosting : modèles successifs qui corrigent les erreurs.<\/p>\n"},{"n":"ml-arbres-forets","k":70,"ch":"ml-arbres-forets","q":"<p>MDI vs MDA<\/p>\n","r":"<p>MDI : baisse d&#39;impureté (rapide, biaisée). MDA : baisse du score après permutation.<\/p>\n"},{"n":"ml-clustering","k":71,"ch":"ml-clustering","q":"<p>Non supervisé<\/p>\n","r":"<p>Pas de cible y ; on découvre une structure (groupes, dimensions, anomalies, associations).<\/p>\n"},{"n":"ml-clustering","k":72,"ch":"ml-clustering","q":"<p>Cohésion et séparation<\/p>\n","r":"<p>Points proches dans un groupe ; groupes éloignés entre eux.<\/p>\n"},{"n":"ml-clustering","k":73,"ch":"ml-clustering","q":"<p>Similarité cosinus<\/p>\n","r":"<p>A·B / (‖A‖‖B‖) ∈ [−1, 1] ; mesure l&#39;orientation, pas la longueur. Utile pour le texte.<\/p>\n"},{"n":"ml-clustering","k":74,"ch":"ml-clustering","q":"<p>Variables catégorielles et distance<\/p>\n","r":"<p>One-Hot, Hamming, Gower (mixte) ou K-Modes ; jamais un codage 1, 2, 3 arbitraire.<\/p>\n"},{"n":"ml-clustering","k":75,"ch":"ml-clustering","q":"<p>Inertie (WCSS)<\/p>\n","r":"<p>Σ ‖xi − μk‖² ; diminue toujours quand K augmente (0 si K = n).<\/p>\n"},{"n":"ml-clustering","k":76,"ch":"ml-clustering","q":"<p>Lloyd<\/p>\n","r":"<p>Affecter au centroïde le plus proche, recalculer les moyennes, répéter. Converge vers un minimum local.<\/p>\n"},{"n":"ml-clustering","k":77,"ch":"ml-clustering","q":"<p>K-Means++<\/p>\n","r":"<p>Initialisation qui éloigne les centroïdes de départ (défaut de scikit-learn).<\/p>\n"},{"n":"ml-clustering","k":78,"ch":"ml-clustering","q":"<p>Silhouette<\/p>\n","r":"<p>s = (b − a)/max(a, b) ∈ [−1, 1] ; on choisit le K qui la maximise.<\/p>\n"},{"n":"ml-clustering","k":79,"ch":"ml-clustering","q":"<p>Single / Complete / Average<\/p>\n","r":"<p>Distance min (effet de chaîne) / max (compacts, outliers) / moyenne (compromis).<\/p>\n"},{"n":"ml-clustering","k":80,"ch":"ml-clustering","q":"<p>Ward<\/p>\n","r":"<p>Fusion qui augmente le moins l&#39;inertie : n1n2/(n1 + n2) ‖μ1 − μ2‖².<\/p>\n"},{"n":"ml-clustering","k":81,"ch":"ml-clustering","q":"<p>Couper un dendrogramme<\/p>\n","r":"<p>Là où le saut vertical sans fusion est le plus grand.<\/p>\n"},{"n":"ml-clustering","k":82,"ch":"ml-clustering","q":"<p>DBSCAN<\/p>\n","r":"<p>Cœur (≥ MinPts dans ε), frontière (voisin d&#39;un cœur), bruit (−1). Trouve seul le nombre de groupes.<\/p>\n"},{"n":"ml-clustering","k":83,"ch":"ml-clustering","q":"<p>Choisir ε<\/p>\n","r":"<p>Graphe des k-distances (k = MinPts) : ε = ordonnée du coude.<\/p>\n"},{"n":"ml-tp-corriges","k":84,"ch":"ml-tp-corriges","q":"<p>Baseline<\/p>\n","r":"<p>Prédire la moyenne du train pour tout le test ; R² ≈ 0. Référence minimale à battre.<\/p>\n"},{"n":"ml-tp-corriges","k":85,"ch":"ml-tp-corriges","q":"<p>fit_mco<\/p>\n","r":"<p>np.linalg.solve(XᵀX, Xᵀy) plutôt que l&#39;inverse explicite.<\/p>\n"},{"n":"ml-tp-corriges","k":86,"ch":"ml-tp-corriges","q":"<p>fit_gd<\/p>\n","r":"<p>w ← w − lr · (2/n) Xᵀ(Xw − y), en partant de w = 0.<\/p>\n"},{"n":"ml-tp-corriges","k":87,"ch":"ml-tp-corriges","q":"<p>Standardiseur sans fuite<\/p>\n","r":"<p>fit (μ, σ) sur le train, transform du train et du test.<\/p>\n"},{"n":"ml-tp-corriges","k":88,"ch":"ml-tp-corriges","q":"<p>Ridge sans pénaliser le biais<\/p>\n","r":"<p>(XᵀX + αP)w = Xᵀy, P = identité avec un 0 pour le biais.<\/p>\n"},{"n":"ml-tp-corriges","k":89,"ch":"ml-tp-corriges","q":"<p>Grille d&#39;un Pipeline<\/p>\n","r":"<p>Paramètres nommés etape__parametre (ex. modele__n_neighbors).<\/p>\n"},{"n":"ml-tp-corriges","k":90,"ch":"ml-tp-corriges","q":"<p>Filtre anti-spam<\/p>\n","r":"<p>Un FP perd un vrai e-mail : on privilégie la précision.<\/p>\n"},{"n":"ml-tp-corriges","k":91,"ch":"ml-tp-corriges","q":"<p>Coude du TP 4<\/p>\n","r":"<p>Inertie 1 841 → 278 à K = 4, puis presque plate : K = 4.<\/p>\n"},{"n":"ml-tp-corriges","k":92,"ch":"ml-tp-corriges","q":"<p>DBSCAN sur les lunes<\/p>\n","r":"<p>eps = 0,2 : 2 clusters ; 0,8 : 1 cluster ; 0,02 : tout en bruit.<\/p>\n"},{"n":"ml-revision","k":93,"ch":"ml-revision","q":"<p>Les 3 inversions à éviter<\/p>\n","r":"<p>Précision ↔ rappel ; L1 (annule) ↔ L2 (réduit) ; biais (trop simple) ↔ variance (trop sensible).<\/p>\n"},{"n":"ml-revision","k":94,"ch":"ml-revision","q":"<p>Accuracy sur classes déséquilibrées<\/p>\n","r":"<p>Trompeuse : regarder rappel, F1, matrice de confusion, PR-AUC.<\/p>\n"},{"n":"ml-revision","k":95,"ch":"ml-revision","q":"<p>Modèles insensibles à l&#39;échelle<\/p>\n","r":"<p>Arbres de décision, forêts aléatoires (et boosting d&#39;arbres).<\/p>\n"},{"n":"ml-revision","k":96,"ch":"ml-revision","q":"<p>Où se calcule tout prétraitement<\/p>\n","r":"<p>Sur le train seulement, idéalement dans un Pipeline.<\/p>\n"},{"n":"ml-revision","k":97,"ch":"ml-revision","q":"<p>Valeurs maximales en binaire<\/p>\n","r":"<p>Entropie : 1. Gini : 0,5. Les deux valent 0 pour un nœud pur.<\/p>\n"}];

// Format « essais » : un objet partagé avec l'ancien module (attempts par notion, cards par indice) ; on ne touche qu'à ces deux champs.
// Format « score10 » : scores des chapitres dans MODULE.cle, essais et cartes dans MODULE.cleEtat.
const lireJ = (k) => { try { return JSON.parse(localStorage.getItem(k) || "{}") || {}; } catch (e) { return {}; } };
const ecrireJ = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const etat = () => { const S = lireJ(MODULE.cleEtat); S.attempts = S.attempts || {}; S.cards = S.cards || {}; return S; };
function noter(n, ok) { const S = etat(); (S.attempts[n] = S.attempts[n] || []).push(ok ? 1 : 0); if (S.attempts[n].length > 30) S.attempts[n].shift(); ecrireJ(MODULE.cleEtat, S); }
// Maîtrisé = au moins 3 essais et 80 % de réussite sur les 5 derniers (règle commune à la plateforme).
function statut(n) {
  if (MODULE.format === "score10") { const v = lireJ(MODULE.cle)[n]; if (v !== undefined) return [v >= 8 ? "ok" : "fragile", v / 10]; }
  if (MODULE.format === "best") { const v = (lireJ(MODULE.cle).notions || {})[n]; return v && v.best != null ? [v.best >= 0.8 ? "ok" : "fragile", v.best] : ["jamais", null]; }
  if (MODULE.format === "pc") { const v = lireJ(MODULE.cle)[n]; return v && v.pc !== undefined ? [v.pc >= 80 ? "ok" : "fragile", v.pc / 100] : ["jamais", null]; } const a = (etat().attempts[n] || []).slice(-5); if (!a.length) return ["jamais", null]; const r = a.reduce((x, y) => x + y, 0) / a.length; return [(etat().attempts[n].length >= 3 && r >= 0.8) ? "ok" : "fragile", r]; }
const NCH = {}; NOTIONS.forEach((n) => (NCH[n.ch] = NCH[n.ch] || []).push(n));
function scoreChap(c) {
  if (MODULE.format === "score10") return lireJ(MODULE.cle)[c.id];
  if (MODULE.format === "pc") { const v = lireJ(MODULE.cle)[c.id]; return v && v.pc !== undefined ? Math.round(v.pc / 10) : undefined; }
  if (MODULE.format === "best") { const v = (lireJ(MODULE.cle).notions || {})[c.id]; return v && v.best != null ? Math.round(v.best * 10) : undefined; }
  const l = NCH[c.id] || []; if (!l.length || !l.some((n) => statut(n.id)[0] !== "jamais")) return undefined;
  return Math.round((10 * l.filter((n) => statut(n.id)[0] === "ok").length) / l.length);
}

const CFG_C = MODULE.cartes || { champ: "box", intervalles: [0, 1, 3, 7, 14, 30], echec: 1, depart: 0 };
const INTV = CFG_C.intervalles, CHAMP = CFG_C.champ;
const jour = () => new Date().toISOString().slice(0, 10);
const numJour = (d) => Math.floor(new Date(d + "T00:00:00").getTime() / 864e5);
const dansJours = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const aRevoir = () => { const S = etat(), t = numJour(jour()); return CARTES.map((_, i) => i).filter((i) => { const st = S.cards[CARTES[i].k]; return !st || numJour(st.due) <= t; }); };

    <span class="mzt-note" id="mztImgN"></span>
    <label title="Modèle plus puissant : réponse plus longue et plus détaillée, consomme davantage"><input type="checkbox" id="mztDeep"> Approfondi</label>
    <button type="button" id="mztNew">Nouvelle discussion</button>
   </div>
   <p class="mzt-note" id="mztNote"></p>
  </form>
 </div>
 <div class="mzt-body" id="mztHist" hidden><div style="padding:10px"><input type="search" id="mztQ" placeholder="Chercher dans toutes mes anciennes questions…"></div><div class="mzt-list" id="mztList"></div></div>
 <div class="mzt-body" id="mztMem" hidden><div class="mzt-list"><p class="mzt-note">Ce que le tuteur retient de tes difficultés d'une conversation à l'autre. Il s'en sert pour faire des liens avec tes confusions passées. Tu peux effacer une note.</p><div id="mztMemL"></div></div></div>
</div>`);

  const CHIPS = ['Explique plus simplement', 'Donne un exemple concret', "Pourquoi c'est un piège ?", 'Fais-moi un mini-exercice'];
  $('#mztChips').innerHTML = CHIPS.map((c) => `<button type="button" data-chip="${esc(c)}">${esc(c)}</button>`).join('');

  function view(v) {
    $('#mztChat').hidden = v !== 'chat'; $('#mztHist').hidden = v !== 'hist'; $('#mztMem').hidden = v !== 'mem';
    $('#mztTabH').textContent = v === 'hist' ? 'Retour' : 'Historique'; $('#mztTabM').textContent = v === 'mem' ? 'Retour' : 'Mémoire';
    if (v === 'hist') renderList(); if (v === 'mem') renderMem();
  }
  function note() {
    $('#mztNote').textContent = !ready ? 'Connexion au tuteur…' : sample
      ? 'Mode rapide (économe) par défaut. « Approfondi » ou « Approfondir cette réponse » utilise un modèle supérieur. Pense à chercher dans l\'Historique avant de reposer une question.'
      : 'Le tuteur n\'est pas disponible ici (il faut ouvrir la page dans Claude et accepter la demande d\'autorisation). L\'historique reste consultable.';
  }
  function refreshCtx() {
    const c = context(); $('#mztCtx').textContent = '· ' + c.label; $('#mztPrev').textContent = c.text.slice(0, 2500) + (c.text.length > 2500 ? '\n…' : '');
    return c;
  }
  function openPanel(ctx) {
    forced = ctx && ctx.text ? ctx : null;
    $('#mztPan').hidden = false; $('#mztBtn').hidden = true; view('chat');
    const c = refreshCtx();
    if (!cur || cur.sec !== c.label) { const ts = ST.threads.filter((t) => t.sec === c.label); cur = forced ? null : ts[ts.length - 1] || null; }
    renderLog(); note(); setTimeout(() => $('#mztIn').focus(), 30);
  }
  function closePanel() { $('#mztPan').hidden = true; $('#mztBtn').hidden = false; forced = null; }

  function renderLog() {
    const log = $('#mztLog'); log.innerHTML = '';
    if (!cur || !cur.msgs.length) {
      log.innerHTML = `<div class="mzt-m a">Pose ta question sur « ${esc(context().label)} » : une phrase que tu ne comprends pas, un calcul à vérifier, un exemple en plus… Tu peux joindre une photo de ton brouillon.</div>`; return;
    }
    cur.msgs.forEach((m, i) => {
      const d = document.createElement('div'); d.className = 'mzt-m ' + (m.r === 'u' ? 'u' : 'a');
      if (m.d) d.innerHTML = '<span class="mzt-tag">Réponse approfondie</span>';
      if (m.r === 'u') d.appendChild(document.createTextNode(m.t)); else d.insertAdjacentHTML('beforeend', md(m.t)); log.appendChild(d);
      if (m.r === 'a' && i === cur.msgs.length - 1 && !m.d && !busy) {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'mzt-deepbtn'; b.textContent = 'Approfondir cette réponse';
        b.onclick = () => ask('Approfondis ta réponse précédente : explique plus en détail, avec un exemple complet et les pièges.', true); log.appendChild(b);
      }
    });
    log.scrollTop = 1e9;
  }
  function renderList() {
    const q = norm($('#mztQ').value || ''); const ts = [...ST.threads].reverse().filter((t) => !q || norm(t.msgs.map((m) => m.t).join(' ')).includes(q));
    $('#mztList').innerHTML = ts.length ? ts.map((t) => `<details class="mzt-item"><summary>${esc(t.title)}</summary><div class="mzt-meta">${esc(t.sec)} · ${esc(t.date)}</div>${t.msgs.map((m) => `<div class="mzt-m ${m.r === 'u' ? 'u' : 'a'}" style="margin:6px 0">${m.r === 'u' ? esc(m.t) : md(m.t)}</div>`).join('')}<button type="button" data-cont="${esc(t.id)}">Continuer cette discussion</button></details>`).join('')
      : `<p class="mzt-note">${ST.threads.length ? 'Aucune discussion ne contient ce mot.' : 'Aucune discussion pour l\'instant.'}</p>`;
  }
  function renderMem() {
    $('#mztMemL').innerHTML = ST.memos.length ? ST.memos.map((m, i) => `<div class="mzt-item"><div class="mzt-meta">${esc(m.date)}</div>${esc(m.text)}<div><button type="button" data-memdel="${i}" style="margin-top:4px">Effacer</button></div></div>`).join('')
      : '<p class="mzt-note">Aucune note pour l\'instant. Elles apparaîtront au fil de tes questions.</p>';
  }

  // ---------- stockage compte ----------
  async function saveThread(t) {
    saveLocal(); if (!db) return;
    try { await db.collection(base + '/threads').doc(t.id).set({ sec: t.sec, date: t.date, title: t.title, msgs: t.msgs.slice(-40) }); } catch (e) {}
  }
  async function saveMemos() { saveLocal(); if (!db) return; try { await db.doc(base).set({ memos: ST.memos.slice(-30), updated: Date.now() }); } catch (e) {} }

  // ---------- appel au tuteur ----------
  const ERR = { not_granted: 'Tu n\'as pas autorisé la page à utiliser Claude. Recharge-la et accepte la demande, ou change-le dans le menu Autorisations de l\'artifact.', rate_limited: 'Trop de questions d\'un coup, ou limite d\'usage atteinte. Réessaie dans un moment.', prompt_too_large: 'L\'extrait est trop long : ouvre une partie plus précise du cours.', image_rejected: 'Cette photo n\'est pas acceptée. Essaie un JPEG ou un PNG plus léger.', refused: 'Claude n\'a pas pu répondre à cette demande. Reformule ta question.' };
  const visible = (t) => {
    const L = String(t).split('\n');
    for (let i = L.length - 1; i >= Math.max(0, L.length - 3); i--) if (/^\s*M[ÉE]MO\s*:/i.test(L[i])) return L.slice(0, i).join('\n').trim();
    return String(t).trim();
  };
  // rendu léger : on échappe le HTML d'abord, puis gras, italique, code, titres, puces et blocs de code
  const inl = (s) => {
    const p = s.split('`'); if (p.length % 2 === 0) { const last = p.pop(); p[p.length - 1] += '`' + last; }
    return p.map((x, i) => i % 2 ? '<code>' + esc(x) + '</code>' : esc(x).replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*\w])\*([^*\n]+)\*(?![*\w])/g, '$1<em>$2</em>')).join('');
  };
  const md = (t) => {
    const out = []; let list = null, code = null;
    const flush = () => { if (list) { out.push('</' + list + '>'); list = null; } };
    String(t).split('\n').forEach((raw) => {
      if (/^\s*```/.test(raw)) { if (code === null) { flush(); code = []; } else { out.push('<pre>' + esc(code.join('\n')) + '</pre>'); code = null; } return; }
      if (code !== null) { code.push(raw); return; }
      let m;
      if ((m = raw.match(/^\s*#{1,6}\s+(.*)$/))) { flush(); out.push('<p><strong>' + inl(m[1]) + '</strong></p>'); }
      else if ((m = raw.match(/^\s*[-*•]\s+(.*)$/))) { if (list !== 'ul') { flush(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + inl(m[1]) + '</li>'); }
      else if ((m = raw.match(/^\s*\d+[.)]\s+(.*)$/))) { if (list !== 'ol') { flush(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + inl(m[1]) + '</li>'); }
      else if (!raw.trim()) flush();
      else { flush(); out.push('<p>' + inl(raw) + '</p>'); }
    });
    if (code !== null) out.push('<pre>' + esc(code.join('\n')) + '</pre>');
    flush(); return out.join('');
  };
  async function ask(q, deep) {
    q = (q || '').trim(); deep = deep || $('#mztDeep').checked;
    if (busy || !q) return; if (!sample) { note(); return; }
    const c = refreshCtx();
    if (!cur || (cur.sec !== c.label && !forced)) { cur = { id: 't' + Date.now().toString(36), sec: c.label, date: today(), title: q.slice(0, 80), msgs: [] }; ST.threads.push(cur); }
    else if (!ST.threads.includes(cur)) ST.threads.push(cur);
    cur.msgs.push({ r: 'u', t: q }); busy = true; renderLog();
    const out = document.createElement('div'); out.className = 'mzt-m a'; out.textContent = deep ? 'Réflexion approfondie…' : 'Réflexion…'; $('#mztLog').appendChild(out);
    $('#mztSend').disabled = true; $('#mztStop').hidden = false;
    const style = deep
      ? 'Réponse APPROFONDIE (400 à 700 mots) : 1) l\'intuition avec une analogie, 2) l\'explication détaillée pas à pas, 3) pourquoi ça marche, 4) un exemple complet chiffré, 5) les pièges fréquents et ce qui tombe à l\'examen, 6) une question pour vérifier la compréhension.'
      : 'Réponse EXPLICATIVE (150 à 250 mots) : 1) l\'idée en une phrase, 2) l\'explication pas à pas, 3) un petit exemple chiffré ou concret, 4) une courte question pour vérifier la compréhension.';
    const mem = [];
    if (ST.memos.length) mem.push('DIFFICULTÉS DÉJÀ REPÉRÉES :\n' + ST.memos.slice(-12).map((m) => `- ${m.date} : ${m.text}`).join('\n'));
    const lastQ = ST.threads.flatMap((t) => t.msgs.filter((m) => m.r === 'u').map((m) => `[${t.sec}] ${m.t.slice(0, 100)}`)).slice(-6);
    if (lastQ.length) mem.push('SES DERNIÈRES QUESTIONS :\n' + lastQ.map((x) => '- ' + x).join('\n'));
    const rules = `Tu es le tuteur de ${C.student}, pour le module ${C.module}${C.prof ? ' du ' + C.prof : ''}. Il apprend souvent la notion pour la première fois.
Règles : réponds en français simple, en Markdown léger (**gras** pour les termes clés, tirets, étapes numérotées, formules et calculs entre accents graves ; pas de tableaux). ${style} Appuie-toi d'abord sur l'EXTRAIT ci-dessous et sur les conventions du prof ; si une source générale diffère du cours, signale l'écart et dis quelle version utiliser à l'examen (celle du prof). Pour un calcul, pose chaque étape et vérifie-la. S'il envoie une réponse ou une photo de brouillon, corrige étape par étape et nomme précisément l'erreur. Si tu n'es pas sûr, dis-le. S'il demande un mini-exercice, donne l'exercice sans la solution.
Utilise sa mémoire pour faire des liens avec ses confusions passées, sans la réciter.
Termine TOUJOURS par une dernière ligne séparée au format exact « MÉMO: … » qui résume en 15 mots maximum la difficulté révélée par sa question (ou « MÉMO: rien »). Cette ligne lui est cachée.
${C.conventions ? 'CONVENTIONS DU PROF : ' + C.conventions + '\n' : ''}MÉMOIRE DE L'ÉLÈVE :
${mem.join('\n\n') || '(rien pour l\'instant)'}
EXTRAIT (${c.label}) :
${c.text.slice(0, deep ? 9000 : 3500)}`;
    const recent = cur.msgs.slice(deep ? -9 : -5, -1).map((m) => ({ role: m.r === 'u' ? 'user' : 'assistant', content: m.t }));
    while (recent.length && recent[0].role !== 'user') recent.shift();
    const msgs = [...recent.filter((m) => m.content && m.content.trim()), { role: 'user', content: q }]; while (msgs.length > 1 && msgs[0].role !== 'user') msgs.shift(); msgs[0] = { role: 'user', content: rules + '\n\n---\nQuestion : ' + msgs[0].content };
    ctl = new AbortController();
    const opts = { modelTier: deep ? 'complex' : 'quick', cache: false, signal: ctl.signal, onText: ({ text }) => { out.innerHTML = md(visible(text)); $('#mztLog').scrollTop = 1e9; } };
    if (img) opts.images = [img];
    try {
      const r = await sample(msgs, opts);
      const mm = r.text.match(/(?:^|\n)\s*M[ÉE]MO\s*:\s*(.+)\s*$/i);
      cur.msgs.push({ r: 'a', t: visible(r.text) + (r.truncated ? '\n\n(Réponse coupée : pose une question plus ciblée.)' : ''), d: !!deep });
      if (mm && !/^\s*rien/i.test(mm[1])) { ST.memos.push({ date: today(), text: mm[1].trim().slice(0, 160) }); if (ST.memos.length > 30) ST.memos.shift(); saveMemos(); }
      await saveThread(cur);
    } catch (e) {
      const kept = e && e.text ? visible(e.text) : '';
      if (e && e.code === 'cancelled') { if (kept) cur.msgs.push({ r: 'a', t: kept + '\n(Arrêté.)' }); else cur.msgs.pop(); }
      else { cur.msgs.pop(); out.textContent = (kept ? kept + '\n\n' : '') + (ERR[e && e.code] || 'Le tuteur n\'a pas pu répondre. Réessaie dans un instant.'); }
      if (!cur.msgs.length) ST.threads = ST.threads.filter((t) => t !== cur);
      saveLocal();
      if (!(e && e.code === 'cancelled')) { busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImgN').textContent = ''; return; }
    }
    busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImg').value = ''; $('#mztImgN').textContent = ''; renderLog();
  }

  // ---------- événements ----------
  $('#mztBtn').onclick = () => openPanel(null);
  $('#mztX').onclick = closePanel;
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#mztPan').hidden) closePanel(); });
  $('#mztTabH').onclick = () => view($('#mztHist').hidden ? 'hist' : 'chat');
  $('#mztTabM').onclick = () => view($('#mztMem').hidden ? 'mem' : 'chat');
  $('#mztQ').oninput = renderList;
  $('#mztList').onclick = (e) => { const id = e.target.dataset && e.target.dataset.cont; if (!id) return; cur = ST.threads.find((t) => t.id === id); view('chat'); $('#mztCtx').textContent = '· ' + cur.sec; renderLog(); };
  $('#mztMemL').onclick = (e) => { const i = e.target.dataset && e.target.dataset.memdel; if (i == null) return; ST.memos.splice(+i, 1); saveMemos(); renderMem(); };
  $('#mztChips').onclick = (e) => { const b = e.target.closest('[data-chip]'); if (!b) return; const t = $('#mztIn'); t.value = b.dataset.chip + (t.value ? ' : ' + t.value : ''); t.focus(); };
  $('#mztNew').onclick = () => { cur = null; renderLog(); };
  $('#mztStop').onclick = () => { if (ctl) ctl.abort(); };
  $('#mztImg').onchange = (e) => { img = e.target.files[0] || null; $('#mztImgN').textContent = img ? 'Photo : ' + img.name : ''; };
  $('#mztF').onsubmit = (e) => { e.preventDefault(); const v = $('#mztIn').value; $('#mztIn').value = ''; ask(v); };
  $('#mztIn').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#mztF').requestSubmit(); } });

  // ---------- capacités (facultatives) ----------
  const W = window.claude;
  if (W && W.use) {
    W.use('sample').then((s) => { sample = s; ready = true; note();
      if (s && s.limits) s.limits().then((l) => { if (l && l.images) { imgOK = true; $('#mztImgL').hidden = false; if (l.images.mediaTypes) $('#mztImg').accept = l.images.mediaTypes.join(','); } }).catch(() => {});
    }).catch(() => { ready = true; note(); });
    Promise.all([W.use('db'), W.use('user')]).then(async ([d, u]) => {
      if (!d || !u) return; const id = await u.id(); if (!id) return; db = d; base = 'data/users/' + id + '/mzt_' + C.id;
      try {
        const m = await db.doc(base).get(); if (m.exists) { const v = m.data() || {}; if (Array.isArray(v.memos)) ST.memos = JSON.parse(JSON.stringify(v.memos)); }
        const q = await db.collection(base + '/threads').get(); const remote = q.docs.map((x) => Object.assign({ id: x.id }, JSON.parse(JSON.stringify(x.data() || {}))));
        const map = {}; [...ST.threads, ...remote].forEach((t) => { if (!map[t.id] || (t.msgs || []).length > (map[t.id].msgs || []).length) map[t.id] = t; });
        ST.threads = Object.values(map).sort((a, b) => parseInt(a.id.slice(1), 36) - parseInt(b.id.slice(1), 36)); saveLocal();
      } catch (e) {}
    }).catch(() => {});
  } else { ready = true; note(); }

  window.MZT = { open: openPanel, close: closePanel };
})();

</script>

if(window.top===window&&location.protocol==="file:"){a.hidden=true;return}
a.href=p.indexOf("/decouvrir")===0||location.pathname.indexOf("/decouvrir")===0?"/decouvrir":"/app/modules";})();</script>
