const CHAPS=[{"id":"reseaux-rayons-x","t":"Réseau cristallin et diffraction des rayons X","seance":"Chapitre 1 · Chimie du solide (réseau, Bravais, Miller, RX)","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir calculer un sinus inverse et convertir : 1 Å = 100 pm = 10⁻¹⁰ m.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>398 pm en ångströms ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 3.98<\/b><\/p><p>3,98 Å.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « un motif répété ».<\/strong> Un cristal = un réseau (des points) + un motif (les atomes posés sur chaque point). On étudie la plus petite boîte qui se répète : la maille.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Compter un atome de sommet comme 1. Un sommet de cube est partagé par 8 mailles : il compte pour 1/8. Une face : 1/2. Une arête : 1/4.<\/p>\n<\/aside><p>À la fin, tu sais compter Z, nommer un réseau de Bravais et placer le premier pic de diffraction.<\/p>\n<h2>Idée 1 · Maille et comptage<\/h2>\n<figure class=\"grille\"><figcaption>Contribution d'un atome à la maille cubique<\/figcaption><table><tr><th>Position,<\/th><th>Partagé<\/th><th>entre,<\/th><th>Compte<\/th><th>pour<\/th><\/tr><tr><td class=\"h1\">Sommet,<\/td><td>8<\/td><td>mailles,<\/td><td>1/8<\/td><\/tr><tr><td class=\"h1\">Arête,<\/td><td>4<\/td><td>mailles,<\/td><td>1/4<\/td><\/tr><tr><td class=\"h1\">Face,<\/td><td>2<\/td><td>mailles,<\/td><td>1/2<\/td><\/tr><tr><td class=\"h1\">Centre,<\/td><td>1<\/td><td>maille,<\/td><td>1<\/td><\/tr><\/table><\/figure><figure class=\"grille\"><figcaption>Les trois réseaux cubiques<\/figcaption><table><tr><th>Réseau,<\/th><th>Symbole,<\/th><th>Nœuds<\/th><th>par<\/th><th>maille<\/th><\/tr><tr><td class=\"h1\">Cubique<\/td><td>simple,<\/td><td>P,<\/td><td>8<\/td><td>×<\/td><td>1/8<\/td><td>=<\/td><td>1<\/td><\/tr><tr><td class=\"h1\">Cubique<\/td><td>centré,<\/td><td>I,<\/td><td>1<\/td><td>+<\/td><td>1<\/td><td>=<\/td><td>2<\/td><\/tr><tr><td class=\"h1\">Cubique<\/td><td>à<\/td><td>faces<\/td><td>centrées,<\/td><td>F,<\/td><td>1<\/td><td>+<\/td><td>6<\/td><td>×<\/td><td>1/2<\/td><td>=<\/td><td>4<\/td><\/tr><\/table><\/figure><p>Il existe 7 systèmes cristallins et 14 réseaux de Bravais.<\/p>\n<h2>Idée 2 · Plans et indices de Miller<\/h2>\n<svg viewBox=\"0 0 320 130\" role=\"img\" aria-label=\"Cube avec le plan (111) coupant les trois axes à 1\" style=\"max-width:300px;width:100%\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M60 110h100v-80H60zM60 30l40-20h100l-40 20M160 110l40-20V10\"/><path d=\"M100 10v80h100\" stroke-dasharray=\"4 4\"/><path d=\"M60 30L160 110L200 10z\" fill=\"#D9824F\" fill-opacity=\".3\" stroke=\"#D9824F\"/><\/g>\n<g fill=\"currentColor\" font-size=\"11\"><text x=\"215\" y=\"60\">plan (111)<\/text><\/g>\n<\/svg><figure class=\"etapes\" data-i=\"0\"><figcaption>Trouver (hkl)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · 1. Lis les intersections du plan avec les axes, en unités de a, b, c.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · 2. Prends les inverses.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · 3. Ramène à des entiers les plus petits possibles.<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p>En cubique : $d_{hkl} = \\dfrac{a}{\\sqrt{h^2+k^2+l^2}}$.<\/p>\n<h2>Idée 3 · Diffraction : loi de Bragg<\/h2>\n<p>$$2\\,d_{hkl}\\sin\\theta = n\\lambda$$<\/p>\n<figure class=\"grille\"><figcaption>Premier pic data-o=\"0\">2 nœuds<\/button><button class=\"opt\" data-o=\"1\">1 nœud<\/button><button class=\"opt\" data-o=\"2\">4 nœuds<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">La raie Kα du cuivre vaut environ :<\/div><button class=\"opt\" data-o=\"0\">1,54 Å<\/button><button class=\"opt\" data-o=\"1\">15,4 Å<\/button><button class=\"opt\" data-o=\"2\">0,154 Å<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Un cristal est :<\/div><button class=\"opt\" data-o=\"0\">un réseau + un motif<\/button><button class=\"opt\" data-o=\"1\">un ensemble désordonné<\/button><button class=\"opt\" data-o=\"2\">un seul atome<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"reseaux-rayons-x","rep":["3.98"],"tol":null},{"n":"reseaux-rayons-x","rep":["4"],"tol":null},{"n":"reseaux-rayons-x","rep":["25.6"],"tol":null}],"qcm":[{"n":"reseaux-rayons-x","q":"Un atome au centre d&#39;une face compte pour :","o":["1/8","1/2","1"],"a":1,"e":"Partagé entre 2 mailles."},{"n":"reseaux-rayons-x","q":"Nombre de réseaux de Bravais :","o":["7","14","32"],"a":1,"e":"7 systèmes, 14 réseaux."},{"n":"reseaux-rayons-x","q":"$d_{110}$ en cubique vaut :","o":["$a/\\sqrt2$","$a\\sqrt2$","$a/2$"],"a":0,"e":"$\\sqrt{1+1+0}$."},{"n":"reseaux-rayons-x","q":"En réseau I, la réflexion (100) est :","o":["observée","éteinte","la plus intense"],"a":1,"e":"h + k + l = 1, impair."},{"n":"reseaux-rayons-x","q":"Le premier pic d&#39;un réseau F est :","o":["(100)","(110)","(111)"],"a":2,"e":"Indices de même parité."},{"n":"reseaux-rayons-x","q":"Plan coupant les axes en 1, 1, ∞ :","o":["(110)","(111)","(001)"],"a":0,"e":"Inverses : 1, 1, 0."},{"n":"reseaux-rayons-x","q":"Si d augmente, θ :","o":["diminue","augmente","ne change pas"],"a":0,"e":"$\\sin\\theta = \\lambda/(2d)$."},{"n":"reseaux-rayons-x","q":"Un cube centré contient :","o":["2 nœuds","1 nœud","4 nœuds"],"a":0,"e":"Sommets + centre."},{"n":"reseaux-rayons-x","q":"La raie Kα du cuivre vaut environ :","o":["1,54 Å","15,4 Å","0,154 Å"],"a":0,"e":"Source classique des diffractomètres."},{"n":"reseaux-rayons-x","q":"Un cristal est :","o":["un réseau + un motif","un ensemble désordonné","un seul atome"],"a":0,"e":"Définition."}]},{"id":"metaux-empilements","t":"Métaux · empilements compacts et sites","seance":"Chapitre 1 · Structures métalliques (CFC, HC, CC)","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut connaître le volume d&#39;une sphère : $\\frac43\\pi r^3$.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Volume (en Å³) d&#39;un atome de rayon 1 Å, à 0,1 près ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 4.2<\/b><\/p><p>$\\frac43\\pi \\approx 4{,}2$ Å³.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « où les sphères se touchent ».<\/strong> Toute relation entre a et r vient de la direction où les atomes sont tangents : la diagonale d&#39;une face en CFC, la grande diagonale en CC, l&#39;arête en HC.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Écrire a = 2r en CFC. Les atomes ne se touchent pas le long de l&#39;arête, mais le long de la diagonale d&#39;une face : $a\\sqrt2 = 4r$.<\/p>\n<\/aside><p>À la fin, tu sais calculer coordinence, compacité, masse volumique et taille des sites.<\/p>\n<h2>Idée 1 · Les trois structures<\/h2>\n<figure class=\"grille\"><figcaption>Comparaison<\/figcaption><table><tr><th>Structure,<\/th><th>Contact,<\/th><th>Z,<\/th><th>Coordinence,<\/th><th>Compacité<\/th><\/tr><tr><td class=\"h1\">CFC,<\/td><td>a√2<\/td><td>=<\/td><td>4r,<\/td><td>4,<\/td><td>12,<\/td><td>0,74<\/td><\/tr><tr><td class=\"h1\">HC,<\/td><td>a<\/td><td>=<\/td><td>2r<\/td><td>et<\/td><td>c/a<\/td><td>=<\/td><td>√(8/3)<\/td><td>≈<\/td><td>1,633,<\/td><td>2<\/td><td>(6<\/td><td>pour<\/td><td>la<\/td><td>maille<\/td><td>triple),<\/td><td>12,<\/td><td>0,74<\/td><\/tr><tr><td class=\"h1\">CC,<\/td><td>a√3<\/td><td>=<\/td><td>4r,<\/td><td>2,<\/td><td>8,<\/td><td>0,68<\/td><\/tr><\/table><\/figure><svg viewBox=\"0 0 320 120\" role=\"img\" aria-label=\"Empilements ABAB pour HC et ABCABC pour CFC\" style=\"max-width:360px;width:100%\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><g stroke=\"#D9824F\"><circle cx=\"40\" cy=\"95\" r=\"12\"/><circle cx=\"64\" cy=\"95\" r=\"12\"/><circle cx=\"52\" cy=\"73\" r=\"12\" stroke=\"currentColor\"/><circle cx=\"40\" cy=\"51\" r=\"12\"/><circle cx=\"64\" cy=\"51\" r=\"12\"/><\/g>\n<g><circle cx=\"200\" cy=\"95\" r=\"12\" stroke=\"#D9824F\"/><circle cx=\"224\" cy=\"95\" r=\"12\" stroke=\"#D9824F\"/><circle cx=\"212\" cy=\"73\" r=\"12\"/><circle cx=\"224\" cy=\"51\" r=\"12\" stroke-dasharray=\"3 3\"/><\/g><\/g>\n<g fill=\"currentColor\" font-size=\"11\"><text x=\"90\" y=\"75\">HC : A B A B<\/text><text x=\"245\" y=\"75\">CFC : A B C<\/text><\/g>\n<\/svg><h2>Idée 2 · Masse volumique et compacité<\/h2>\n<p>$$\\rho = \\frac{Z\\,M}{N_A\\,V_{\\text{maille}}} \\qquad C = \\frac{Z\\cdot\\frac43\\pi r^3}{V_{\\text{maille}}}$$<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Calcul type (cobalt HC, examen corrigé)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · 1. Tangence selon l&#39;arête : a = 2r = 2,5 Å.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · 2. c = a√(8/3) = 4,08 Å.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · 3. Maille triple (prisme hexagonal) : V = 3a²c·sin 120°, Z = 6.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · 4. ρ = 6 × 58,93 / (6,02·10²³ × V) ≈ 8,86 g/cm³, la même que la variété CFC : même compacité.<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Idée 3 · Les sites interstitiels<\/h2>\n<figure class=\"grille\"><figcaption>Sites du CFC<\/figcaption><table><tr><th>Site,<\/th><th>Nombre<\/th><th>par<\/th><th>maille,<\/th><th>Position,<\/th><th>Rayon<\/th><th>max<\/th><th>du<\/th><th>site<\/th><\/tr><tr><td class=\"h1\">Octaédrique<\/td><td>[6],<\/td><td>4,<\/td><td>centre<\/td><td>+<\/td><td>milieux<\/td><td>des<\/td><td>arêtes,<\/td><td>0,414<\/td><td>r<\/td><\/tr><tr><td class=\"h1\">Tétraédrique<\/td><td>[4],<\/td><td>8,<\/td><td>centres<\/td><td>des<\/td><td>8<\/td><td>petits<\/td><td>cubes,<\/td><td>0,225<\/td><td>r<\/td><\/tr><\/table><\/figure><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Application<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Cuivre CFC, r = 1,28 Å. Paramètre a ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 3.62<\/b><\/p><p>$a = 4r/\\sqrt2 = 2\\sqrt2\\,r \\approx 3{,}62$ Å.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Compacité du CC ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.68<\/b><\/p><p>Z = 2, $a\\sqrt3 = 4r$ : $C = \\frac{2\\cdot\\frac43\\pi r^3}{(4r/\\sqrt3)^3} = \\frac{\\pi\\sqrt3}{8} \\approx 0{,}68$.<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Coordinence dans un empilement compact :<\/div><button class=\"opt\" data-o=\"0\">8<\/button><button class=\"opt\" data-o=\"1\">12<\/button><button class=\"opt\" data-o=\"2\">6<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Compacité du CC :<\/div><button class=\"opt\" data-o=\"0\">0,68<\/button><button class=\"opt\" data-o=\"1\">0,74<\/button><button class=\"opt\" data-o=\"2\">0,52<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Le CFC correspond à l&#39;empilement :<\/div><button class=\"opt\" data-o=\"0\">ABAB<\/button><button class=\"opt\" data-o=\"1\">ABCABC<\/button><button class=\"opt\" data-o=\"2\">AAAA<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">En CFC, Z vaut :<\/div><button class=\"opt\" data-o=\"0\">4<\/button><button class=\"opt\" data-o=\"1\">2<\/button><button class=\"opt\" data-o=\"2\">6<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Rapport c/a idéal en HC :<\/div><button class=\"opt\" data-o=\"0\">1,633<\/button><button class=\"opt\" data-o=\"1\">1,414<\/button><button class=\"opt\" data-o=\"2\">2<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Nombre de sites octaédriques par maille CFC :<\/div><button class=\"opt\" data-o=\"0\">4<\/button><button class=\"opt\" data-o=\"1\">8<\/button><button class=\"opt\" data-o=\"2\">12<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Nombre de sites tétraédriques par maille CFC :<\/div><button class=\"opt\" data-o=\"0\">4<\/button><button class=\"opt\" data-o=\"1\">8<\/button><button class=\"opt\" data-o=\"2\">6<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">En CFC, a vaut :<\/div><button class=\"opt\" data-o=\"0\">$2\\sqrt2\\,r$<\/button><button class=\"opt\" data-o=\"1\">$2r$<\/button><button class=\"opt\" data-o=\"2\">$4r/\\sqrt3$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Le cobalt HC et le cobalt CFC ont :<\/div><button class=\"opt\" data-o=\"0\">la même masse volumique<\/button><button class=\"opt\" data-o=\"1\">des masses volumiques très différentes<\/button><button class=\"opt\" data-o=\"2\">des coordinences différentes<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">La coordinence en CC vaut :<\/div><button class=\"opt\" data-o=\"0\">8<\/button><button class=\"opt\" data-o=\"1\">12<\/button><button class=\"opt\" data-o=\"2\">4<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"metaux-empilements","rep":["4.2"],"tol":null},{"n":"metaux-empilements","rep":["3.62"],"tol":null},{"n":"metaux-empilements","rep":["0.68"],"tol":null}],"qcm":[{"n":"metaux-empilements","q":"Coordinence dans un empilement compact :","o":["8","12","6"],"a":1,"e":"CFC et HC."},{"n":"metaux-empilements","q":"Compacité du CC :","o":["0,68","0,74","0,52"],"a":0,"e":"Moins compact."},{"n":"metaux-empilements","q":"Le CFC correspond à l&#39;empilement :","o":["ABAB","ABCABC","AAAA"],"a":1,"e":"HC = ABAB."},{"n":"metaux-empilements","q":"En CFC, Z vaut :","o":["4","2","6"],"a":0,"e":"8 × 1/8 + 6 × 1/2."},{"n":"metaux-empilements","q":"Rapport c/a idéal en HC :","o":["1,633","1,414","2"],"a":0,"e":"√(8/3)."},{"n":"metaux-empilements","q":"Nombre de sites octaédriques par maille CFC :","o":["4","8","12"],"a":0,"e":"Autant que d&#39;atomes."},{"n":"metaux-empilements","q":"Nombre de sites tétraédriques par maille CFC :","o":["4","8","6"],"a":1,"e":"Deux fois plus que d&#39;atomes."},{"n":"metaux-empilements","q":"En CFC, a vaut :","o":["$2\\sqrt2\\,r$","$2r$","$4r/\\sqrt3$"],"a":0,"e":"Contact sur la diagonale de face."},{"n":"metaux-empilements","q":"Le cobalt HC et le cobalt CFC ont :","o":["la même masse volumique","des masses volumiques très différentes","des coordinences différentes"],"a":0,"e":"Même compacité 0,74."},{"n":"metaux-empilements","q":"La coordinence en CC vaut :","o":["8","12","4"],"a":0,"e":"8 voisins aux sommets."}]},{"id":"cristaux-ioniques","t":"Cristaux ioniques","seance":"Chapitre 1 · Structures ioniques (TD cristaux ioniques)","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir que, dans un cristal ionique, un cation est entouré d&#39;anions et réciproquement.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Dans NaCl, combien de Cl⁻ entourent un Na⁺ ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 6<\/b><\/p><p>6 (coordinence octaédrique).<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « les anions font l&#39;empilement, les cations remplissent les trous ».<\/strong> Le rapport des rayons $r^+/r^-$ dit quel trou le cation peut occuper.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Oublier de vérifier la neutralité. Dans la maille, le nombre de charges + doit égaler le nombre de charges −.<\/p>\n<\/aside><p>À la fin, tu sais identifier la structure d&#39;un composé AB à partir de Z et du rapport des rayons.<\/p>\n<h2>Idée 1 · Les quatre structures à connaître<\/h2>\n<figure class=\"grille\"><figcaption>Structures types<\/figcaption><table><tr><th>Type,<\/th><th>Réseau,<\/th><th>Coordinence,<\/th><th>Z<\/th><th>(motifs<\/th><th>AB),<\/th><th>Contact<\/th><th>anion-cation<\/th><\/tr><tr><td class=\"h1\">CsCl,<\/td><td>cubique<\/td><td>P,<\/td><td>8-8,<\/td><td>1,<\/td><td>a√3/2<\/td><td>=<\/td><td>r⁺<\/td><td>+<\/td><td>r⁻<\/td><\/tr><tr><td class=\"h1\">NaCl,<\/td><td>cubique<\/td><td>F,<\/td><td>6-6,<\/td><td>4,<\/td><td>a/2<\/td><td>=<\/td><td>r⁺<\/td><td>+<\/td><td>r⁻<\/td><\/tr><tr><td class=\"h1\">ZnS<\/td><td>blende,<\/td><td>cubique<\/td><td>F,<\/td><td>4-4,<\/td><td>4,<\/td><td>a√3/4<\/td><td>=<\/td><td>r⁺<\/td><td>+<\/td><td>r⁻<\/td><\/tr><tr><td class=\"h1\">CaF₂<\/td><td>fluorine,<\/td><td>cubique<\/td><td>F,<\/td><td>8-4,<\/td><td>4<\/td><td>(CaF₂),<\/td><td>a√3/4<\/td><td>=<\/td><td>r⁺<\/td><td>+<\/td><td>r⁻<\/td><\/tr><\/table><\/figure><h2>Idée 2 · Le rapport des rayons<\/h2>\n<svg viewBox=\"0 0 320 70\" role=\"img\" aria-label=\"Échelle du rapport r+/r- : 0,225 tétraédrique, 0,414 octaédrique, 0,732 cubique\" style=\"max-width:400px;width:100%\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M10 35h300\"/><path d=\"M80 28v14M160 28v14M250 28v14\" stroke=\"#D9824F\"/><\/g>\n<g fill=\"currentColor\" font-size=\"10\"><text x=\"70\" y=\"22\">0,225<\/text><text x=\"150\" y=\"22\">0,414<\/text><text x=\"240\" y=\"22\">0,732<\/text><text x=\"92\" y=\"58\">ZnS (4)<\/text><text x=\"180\" y=\"58\">NaCl (6)<\/text><text x=\"262\" y=\"58\">CsCl (8)<\/text><\/g>\n<\/svg><figure class=\"etapes\" data-i=\"0\"><figcaption>Identifier une structure AB<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · 1. Calcule Z = ρ·a³·N_A / M.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · 2. Z = 1 : CsCl. Z = 4 : NaCl ou ZnS.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · 3. Pour départager : rapport r⁺/r⁻, ou relation de contact avec les rayons connus.<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Idée 3 · Masse volumique d&#39;un cristal ionique<\/h2>\n<p><strong>Exemple (NaCl).<\/strong> a = 564 pm, M = 58,44 g/mol, Z = 4 : $\\rho = \\frac{4\\times58{,}44}{6{,}02\\cdot10^{23}\\times(5{,}64\\cdot10^{-8})^3} \\approx 2{,}16$ g/cm³.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Application<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Composé AB : a = 398 pm, ρ = 2,10 g/cm³, M = 79,9 g/mol. Z ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1<\/b><\/p><p>$Z = \\frac{2{,}10\\times(3{,}98\\cdot10^{-8})^3\\times6{,}02\\cdot10^{23}}{79{,}9} \\approx 1{,}0$ : <strong>type CsCl<\/strong>.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Rapport $r^+/r^- = 0{,}5$ : quelle coordinence attendue ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 6<\/b><\/p><p>Entre 0,414 et 0,732 : coordinence 6, type NaCl.<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Coordinence dans CsCl :<\/div><button class=\"opt\" data-o=\"0\">8-8<\/button><button class=\"opt\" data-o=\"1\">6-6<\/button><button class=\"opt\" data-o=\"2\">4-4<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Z pour NaCl :<\/div><button class=\"opt\" data-o=\"0\">1<\/button><button class=\"opt\" data-o=\"1\">4<\/button><button class=\"opt\" data-o=\"2\">8<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Dans la blende, Zn²⁺ occupe :<\/div><button class=\"opt\" data-o=\"0\">la moitié des sites tétraédriques<\/button><button class=\"opt\" data-o=\"1\">tous les sites octaédriques<\/button><button class=\"opt\" data-o=\"2\">les sommets<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Relation de contact dans NaCl :<\/div><button class=\"opt\" data-o=\"0\">a = 2(r⁺ + r⁻)<\/button><button class=\"opt\" data-o=\"1\">a√3 = 2(r⁺ + r⁻)<\/button><button class=\"opt\" data-o=\"2\">a = r⁺ + r⁻<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">r⁺/r⁻ = 0,8 favorise :<\/div><button class=\"opt\" data-o=\"0\">CsCl<\/button><button class=\"opt\" data-o=\"1\">NaCl<\/button><button class=\"opt\" data-o=\"2\">ZnS<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Dans la fluorine CaF₂, F⁻ est en coordinence :<\/div><button class=\"opt\" data-o=\"0\">4<\/button><button class=\"opt\" data-o=\"1\">8<\/button><button class=\"opt\" data-o=\"2\">6<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Le réseau de NaCl est :<\/div><button class=\"opt\" data-o=\"0\">cubique P<\/button><button class=\"opt\" data-o=\"1\">cubique F<\/button><button class=\"opt\" data-o=\"2\">cubique I<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Z = 1 avec un composé AB indique :<\/div><button class=\"opt\" data-o=\"0\">CsCl<\/button><button class=\"opt\" data-o=\"1\">NaCl<\/button><button class=\"opt\" data-o=\"2\">ZnS<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Une maille doit être :<\/div><button class=\"opt\" data-o=\"0\">électriquement neutre<\/button><button class=\"opt\" data-o=\"1\">chargée positivement<\/button><button class=\"opt\" data-o=\"2\">vide au centre<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">CsCl n&#39;est pas un cubique centré parce que :<\/div><button class=\"opt\" data-o=\"0\">le nœud du centre porte un ion différent<\/button><button class=\"opt\" data-o=\"1\">il n&#39;a pas d&#39;ion au centre<\/button><button class=\"opt\" data-o=\"2\">il est hexagonal<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"cristaux-ioniques","rep":["6"],"tol":null},{"n":"cristaux-ioniques","rep":["1"],"tol":null},{"n":"cristaux-ioniques","rep":["6"],"tol":null}],"qcm":[{"n":"cristaux-ioniques","q":"Coordinence dans CsCl :","o":["8-8","6-6","4-4"],"a":0,"e":"Cubique simple."},{"n":"cristaux-ioniques","q":"Z pour NaCl :","o":["1","4","8"],"a":1,"e":"4 Na⁺ et 4 Cl⁻."},{"n":"cristaux-ioniques","q":"Dans la blende, Zn²⁺ occupe :","o":["la moitié des sites tétraédriques","tous les sites octaédriques","les sommets"],"a":0,"e":"4 sur 8."},{"n":"cristaux-ioniques","q":"Relation de contact dans NaCl :","o":["a = 2(r⁺ + r⁻)","a√3 = 2(r⁺ + r⁻)","a = r⁺ + r⁻"],"a":0,"e":"Le long de l&#39;arête."},{"n":"cristaux-ioniques","q":"r⁺/r⁻ = 0,8 favorise :","o":["CsCl","NaCl","ZnS"],"a":0,"e":"Au-dessus de 0,732."},{"n":"cristaux-ioniques","q":"Dans la fluorine CaF₂, F⁻ est en coordinence :","o":["4","8","6"],"a":0,"e":"Ca²⁺ en coordinence 8."},{"n":"cristaux-ioniques","q":"Le réseau de NaCl est :","o":["cubique P","cubique F","cubique I"],"a":1,"e":"Deux sous-réseaux F imbriqués."},{"n":"cristaux-ioniques","q":"Z = 1 avec un composé AB indique :","o":["CsCl","NaCl","ZnS"],"a":0,"e":"Seule structure à 1 motif."},{"n":"cristaux-ioniques","q":"Une maille doit être :","o":["électriquement neutre","chargée positivement","vide au centre"],"a":0,"e":"Neutralité."},{"n":"cristaux-ioniques","q":"CsCl n&#39;est pas un cubique centré parce que :","o":["le nœud du centre porte un ion différent","il n&#39;a pas d&#39;ion au centre","il est hexagonal"],"a":0,"e":"Réseau P avec un motif de deux ions."}]},{"id":"diagrammes-de-phases","t":"Diagrammes de phases binaires","seance":"Chapitre 2 · Diagrammes de phases","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir lire une composition en fraction massique ou molaire : $x_B = \\frac{n_B}{n_A + n_B}$.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>3 mol de A et 1 mol de B : fraction molaire de B ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.25<\/b><\/p><p>1/4 = 0,25.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « verticale et horizontale ».<\/strong> Un refroidissement se lit sur une verticale (composition fixe). Dans un domaine à deux phases, une horizontale (isotherme) donne la composition de chaque phase.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Lire la proportion des phases à l&#39;envers. Avec la règle des moments (des leviers), la quantité d&#39;une phase est proportionnelle au segment <strong>opposé<\/strong>.<\/p>\n<\/aside><p>À la fin, tu sais lire un diagramme à eutectique et tracer une courbe de refroidissement.<\/p>\n<h2>Idée 1 · La règle des phases<\/h2>\n<p>Variance $v = c + 2 - \\varphi$ ; à pression fixée, $v = c + 1 - \\varphi$. Pour un binaire (c = 2) à P fixée : un point eutectique (3 phases) a v = 0, d&#39;où le palier de température.<\/p>\n<h2>Idée 2 · Le diagramme à eutectique<\/h2>\n<svg viewBox=\"0 0 320 150\" role=\"img\" aria-label=\"Diagramme binaire à eutectique : liquidus en V, palier eutectique horizontal\" style=\"max-width:380px;width:100%\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M30 10v120h260V10\"/><path d=\"M30 30Q120 60 170 100Q220 60 290 20\" stroke=\"#D9824F\"/><path d=\"M30 100h260\"/><path d=\"M110 15v115\" stroke-dasharray=\"4 4\"/><\/g>\n<g fill=\"currentColor\" font-size=\"10\"><text x=\"120\" y=\"45\">liquide<\/text><text x=\"40\" y=\"90\">L + A<\/text><text x=\"230\" y=\"90\">L + B<\/text><text x=\"140\" y=\"118\">A + B solides<\/text><text x=\"160\" y=\"96\">E<\/text><text x=\"24\" y=\"145\">A<\/text><text x=\"286\" y=\"145\">B<\/text><\/g>\n<\/svg><figure class=\"grille\"><figcaption>Les lignes<\/figcaption><table><tr><th>Ligne,<\/th><th>Sens<\/th><\/tr><tr><td class=\"h1\">Liquidus,<\/td><td>au-dessus<\/td><td>:<\/td><td>tout<\/td><td>est<\/td><td>liquide<\/td><\/tr><tr><td class=\"h1\">Solidus<\/td><td>(palier<\/td><td>eutectique),<\/td><td>en<\/td><td>dessous<\/td><td>:<\/td><td>tout<\/td><td>est<\/td><td>solide<\/td><\/tr><tr><td class=\"h1\">Point<\/td><td>eutectique<\/td><td>E,<\/td><td>liquide<\/td><td>→<\/td><td>solide<\/td><td>A<\/td><td>+<\/td><td>solide<\/td><td>B<\/td><td>à<\/td><td>température<\/td><td>constante<\/td><\/tr><\/table><\/figure><h2>Idée 3 · Règle des moments<\/h2>\n<p>Sur l&#39;isotherme, pour un mélange de composition $x_0$ entre une phase de composition $x_1$ et une autre $x_2$ :<\/p>\n<p>$$\\frac{m_1}{m_2} = \\frac{x_2 - x_0}{x_0 - x_1}$$<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Lire un refroidissement<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · 1. Pars du liquide sur la verticale de ta composition.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · 2. Au liquidus : premier cristal (rupture de pente sur la courbe de refroidissement).<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · 3. Entre liquidus et palier : cristallisation d&#39;un solide pur, le liquide s&#39;enrichit vers E.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · 4. Au palier eutectique : le liquide restant cristallise en A + B à T constante (palier horizontal).<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Application<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Variance au point eutectique d&#39;un binaire à P fixée ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0<\/b><\/p><p>$v = 2 + 1 - 3 = 0$ : la température est imposée, d&#39;où le palier.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Mélange $x_0 = 0{,}3$ entre un solide pur A ($x_1 = 0$) et un liquide $x_2 = 0{,}5$. Fraction de solide ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.4<\/b><\/p><p>$\\frac{m_{solide}}{m_{total}} = \\frac{0{,}5 - 0{,}3}{0{,}5 - 0} = 0{,}4$.<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Au point eutectique, la variance vaut :<\/div><button class=\"opt\" data-o=\"0\">0<\/button><button class=\"opt\" data-o=\"1\">1<\/button><button class=\"opt\" data-o=\"2\">2<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Sous le palier eutectique, on a :<\/div><button class=\"opt\" data-o=\"0\">deux solides<\/button><button class=\"opt\" data-o=\"1\">un liquide<\/button><button class=\"opt\" data-o=\"2\">un gaz<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Sur une courbe de refroidissement, l&#39;eutectique donne :<\/div><button class=\"opt\" data-o=\"0\">un palier horizontal<\/button><button class=\"opt\" data-o=\"1\">une rupture de pente<\/button><button class=\"opt\" data-o=\"2\">une droite verticale<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Le liquidus marque :<\/div><button class=\"opt\" data-o=\"0\">l&#39;apparition du premier cristal<\/button><button class=\"opt\" data-o=\"1\">la fin de la solidification<\/button><button class=\"opt\" data-o=\"2\">l&#39;ébullition<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">La règle des moments donne :<\/div><button class=\"opt\" data-o=\"0\">les proportions des phases<\/button><button class=\"opt\" data-o=\"1\">la température de fusion<\/button><button class=\"opt\" data-o=\"2\">la variance<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Au-dessus du liquidus :<\/div><button class=\"opt\" data-o=\"0\">une seule phase liquide<\/button><button class=\"opt\" data-o=\"1\">deux phases<\/button><button class=\"opt\" data-o=\"2\">trois phases<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Un mélange de composition eutectique :<\/div><button class=\"opt\" data-o=\"0\">fond à température constante, comme un corps pur<\/button><button class=\"opt\" data-o=\"1\">ne fond jamais<\/button><button class=\"opt\" data-o=\"2\">fond sur un intervalle<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Pour un binaire à P fixée, la variance maximale est :<\/div><button class=\"opt\" data-o=\"0\">2<\/button><button class=\"opt\" data-o=\"1\">3<\/button><button class=\"opt\" data-o=\"2\">1<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Pendant la cristallisation de A, le liquide :<\/div><button class=\"opt\" data-o=\"0\">s&#39;enrichit en B<\/button><button class=\"opt\" data-o=\"1\">s&#39;enrichit en A<\/button><button class=\"opt\" data-o=\"2\">garde sa composition<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Une isotherme dans un domaine biphasé relie :<\/div><button class=\"opt\" data-o=\"0\">les compositions des deux phases<\/button><button class=\"opt\" data-o=\"1\">deux températures<\/button><button class=\"opt\" data-o=\"2\">deux pressions<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"diagrammes-de-phases","rep":["0.25"],"tol":null},{"n":"diagrammes-de-phases","rep":["0"],"tol":null},{"n":"diagrammes-de-phases","rep":["0.4"],"tol":null}],"qcm":[{"n":"diagrammes-de-phases","q":"Au point eutectique, la variance vaut :","o":["0","1","2"],"a":0,"e":"Trois phases."},{"n":"diagrammes-de-phases","q":"Sous le palier eutectique, on a :","o":["deux solides","un liquide","un gaz"],"a":0,"e":"Tout est solide."},{"n":"diagrammes-de-phases","q":"Sur une courbe de refroidissement, l&#39;eutectique donne :","o":["un palier horizontal","une rupture de pente","une droite verticale"],"a":0,"e":"T constante."},{"n":"diagrammes-de-phases","q":"Le liquidus marque :","o":["l&#39;apparition du premier cristal","la fin de la solidification","l&#39;ébullition"],"a":0,"e":"En refroidissant."},{"n":"diagrammes-de-phases","q":"La règle des moments donne :","o":["les proportions des phases","la température de fusion","la variance"],"a":0,"e":"Bras de levier."},{"n":"diagrammes-de-phases","q":"Au-dessus du liquidus :","o":["une seule phase liquide","deux phases","trois phases"],"a":0,"e":"Domaine liquide."},{"n":"diagrammes-de-phases","q":"Un mélange de composition eutectique :","o":["fond à température constante, comme un corps pur","ne fond jamais","fond sur un intervalle"],"a":0,"e":"Palier unique."},{"n":"diagrammes-de-phases","q":"Pour un binaire à P fixée, la variance maximale est :","o":["2","3","1"],"a":0,"e":"Une seule phase."},{"n":"diagrammes-de-phases","q":"Pendant la cristallisation de A, le liquide :","o":["s&#39;enrichit en B","s&#39;enrichit en A","garde sa composition"],"a":0,"e":"A le quitte."},{"n":"diagrammes-de-phases","q":"Une isotherme dans un domaine biphasé relie :","o":["les compositions des deux phases","deux températures","deux pressions"],"a":0,"e":"Conode."}]},{"id":"ellingham","t":"Diagrammes d'Ellingham","seance":"Chapitre 3 · Initiation à la réactivité en chimie minérale","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut connaître $\\Delta_rG° = \\Delta_rH° - T\\Delta_rS°$ et savoir que $\\Delta_rG° &lt; 0$ favorise la réaction.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>ΔH° = −1000 kJ/mol, ΔS° = −0,2 kJ/(mol·K). ΔG° à 1000 K ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : -800<\/b><\/p><p>−1000 − 1000 × (−0,2) = −800 kJ/mol.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « une droite par couple oxyde/métal, toujours pour 1 mol de O₂ ».<\/strong> Plus une droite est basse, plus l&#39;oxyde est stable. Un métal réduit l&#39;oxyde d&#39;un couple situé <strong>au-dessus<\/strong> de lui.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Écrire les réactions avec des coefficients quelconques. Les droites ne se comparent que si chaque réaction consomme <strong>1 mol de O₂<\/strong>.<\/p>\n<\/aside><p>À la fin, tu sais tracer $\\Delta_rG°(T)$, trouver une température d&#39;inversion et prévoir une réduction.<\/p>\n<h2>Idée 1 · L&#39;approximation d&#39;Ellingham<\/h2>\n<p>ΔH° et ΔS° sont supposés indépendants de T : $\\Delta_rG°(T) = \\Delta_rH° - T\\Delta_rS°$ est une <strong>droite<\/strong>. Pour une oxydation $2M + O_2 \\to 2MO$, un gaz disparaît : ΔS° &lt; 0, donc la pente $-\\Delta_rS°$ est <strong>positive<\/strong>.<\/p>\n<svg viewBox=\"0 0 320 140\" role=\"img\" aria-label=\"Deux droites d'Ellingham : la plus basse correspond à l'oxyde le plus stable ; le métal du bas réduit l'oxyde du haut\" style=\"max-width:380px;width:100%\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M30 10v120h270\"/><path d=\"M30 40L290 20\"/><path d=\"M30 100L290 60\" stroke=\"#D9824F\"/><\/g>\n<g fill=\"currentColor\" font-size=\"10\"><text x=\"200\" y=\"22\">Cu₂O/Cu<\/text><text x=\"200\" y=\"68\">Al₂O₃/Al<\/text><text x=\"230\" y=\"140\">T<\/text><text x=\"0\" y=\"12\">ΔG°<\/text><\/g>\n<\/svg><h2>Idée 2 · Domaines de stabilité<\/h2>\n<p>Pour un couple, au-dessus de la droite (si la pression de O₂ est supérieure) l&#39;oxyde est stable ; en dessous, le métal. Quand un métal a plusieurs oxydes (MO, M₃O₄, M₂O₃), un oxyde intermédiaire n&#39;est stable que si son domaine existe : là où deux droites se croisent, il peut disparaître (<strong>dismutation<\/strong>).<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Trouver une température d'inversion Ti<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · 1. Écris les deux réactions pour 1 mol de O₂.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · 2. Exprime $\\Delta_rG°_1(T)$ et $\\Delta_rG°_2(T)$.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · 3. Résous $\\Delta_rG°_1(T_i) = \\Delta_rG°_2(T_i)$ : $T_i = \\frac{\\Delta H_1 - \\Delta H_2}{\\Delta S_1 - \\Delta S_2}$.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · 4. De part et d&#39;autre de Ti, l&#39;ordre des droites s&#39;inverse.<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Idée 3 · Combiner des réactions<\/h2>\n<p>Si (4) = a·(1) + b·(2), alors $\\Delta_rG°_4 = a\\,\\Delta_rG°_1 + b\\,\\Delta_rG°_2$ (loi de Hess).<\/p>\n<p><strong>Exemple.<\/strong> $6MO + O_2 \\to 2M_3O_4$ (2) et $2M + O_2 \\to 2MO$ (1). Pour $\\frac32M + O_2 \\to \\frac12M_3O_4$ (4) : (4) = ¾·(1) + ¼·(2), donc $\\Delta_rG°_4 = \\frac34\\Delta_rG°_1 + \\frac14\\Delta_rG°_2$.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Application<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Équilibre $4M + 3O_2 \\to 2M_2O_3$ pour 1 mol de O₂ ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>On divise par 3 : $\\frac43M + O_2 \\to \\frac23M_2O_3$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Réaction 1 : ΔH = −500 kJ, ΔS = −0,1 kJ/K. Réaction 2 : ΔH = −600 kJ, ΔS = −0,2 kJ/K. Ti ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1000<\/b><\/p><p>$T_i = \\frac{-500 - (-600)}{-0{,}1 - (-0{,}2)} = \\frac{100}{0{,}1} = 1000$ K.<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Les réactions d&#39;Ellingham sont écrites pour :<\/div><button class=\"opt\" data-o=\"0\">1 mol de O₂<\/button><button class=\"opt\" data-o=\"1\">1 mol de métal<\/button><button class=\"opt\" data-o=\"2\">1 mol d&#39;oxyde<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">La pente d&#39;une droite d&#39;oxydation est généralement :<\/div><button class=\"opt\" data-o=\"0\">positive<\/button><button class=\"opt\" data-o=\"1\">négative<\/button><button class=\"opt\" data-o=\"2\">nulle<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">L&#39;oxyde le plus stable a la droite :<\/div><button class=\"opt\" data-o=\"0\">la plus basse<\/button><button class=\"opt\" data-o=\"1\">la plus haute<\/button><button class=\"opt\" data-o=\"2\">la plus pentue<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">L&#39;aluminium peut réduire Cu₂O car :<\/div><button class=\"opt\" data-o=\"0\">sa droite est en dessous<\/button><button class=\"opt\" data-o=\"1\">sa droite est au-dessus<\/button><button class=\"opt\" data-o=\"2\">il est plus lourd<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Ti s&#39;obtient en égalant :<\/div><button class=\"opt\" data-o=\"0\">deux ΔG°(T)<\/button><button class=\"opt\" data-o=\"1\">deux ΔH°<\/button><button class=\"opt\" data-o=\"2\">deux ΔS°<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Une dismutation transforme :<\/div><button class=\"opt\" data-o=\"0\">un oxyde intermédiaire en un oxyde supérieur et un inférieur<\/button><button class=\"opt\" data-o=\"1\">un métal en gaz<\/button><button class=\"opt\" data-o=\"2\">un oxyde en métal seul<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Changement de pente sur une droite d&#39;Ellingham :<\/div><button class=\"opt\" data-o=\"0\">changement d&#39;état (fusion, ébullition)<\/button><button class=\"opt\" data-o=\"1\">erreur de tracé<\/button><button class=\"opt\" data-o=\"2\">changement de catalyseur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">$\\Delta_rG°_4 = \\frac34\\Delta_rG°_1 + \\frac14\\Delta_rG°_2$ découle de :<\/div><button class=\"opt\" data-o=\"0\">la loi de Hess<\/button><button class=\"opt\" data-o=\"1\">la loi de Bragg<\/button><button class=\"opt\" data-o=\"2\">la règle des phases<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">ΔG° &lt; 0 signifie que la réaction est :<\/div><button class=\"opt\" data-o=\"0\">favorisée dans le sens direct<\/button><button class=\"opt\" data-o=\"1\">impossible<\/button><button class=\"opt\" data-o=\"2\">à l&#39;équilibre<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Le carbone réduit beaucoup d&#39;oxydes à haute T car sa droite C/CO :<\/div><button class=\"opt\" data-o=\"0\">descend quand T augmente<\/button><button class=\"opt\" data-o=\"1\">monte très vite<\/button><button class=\"opt\" data-o=\"2\">est horizontale<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"ellingham","rep":["-800"],"tol":null},{"n":"ellingham","rep":null,"tol":null},{"n":"ellingham","rep":["1000"],"tol":null}],"qcm":[{"n":"ellingham","q":"Les réactions d&#39;Ellingham sont écrites pour :","o":["1 mol de O₂","1 mol de métal","1 mol d&#39;oxyde"],"a":0,"e":"Pour pouvoir comparer."},{"n":"ellingham","q":"La pente d&#39;une droite d&#39;oxydation est généralement :","o":["positive","négative","nulle"],"a":0,"e":"ΔS° &lt; 0."},{"n":"ellingham","q":"L&#39;oxyde le plus stable a la droite :","o":["la plus basse","la plus haute","la plus pentue"],"a":0,"e":"ΔG° le plus négatif."},{"n":"ellingham","q":"L&#39;aluminium peut réduire Cu₂O car :","o":["sa droite est en dessous","sa droite est au-dessus","il est plus lourd"],"a":0,"e":"Aluminothermie."},{"n":"ellingham","q":"Ti s&#39;obtient en égalant :","o":["deux ΔG°(T)","deux ΔH°","deux ΔS°"],"a":0,"e":"Intersection des droites."},{"n":"ellingham","q":"Une dismutation transforme :","o":["un oxyde intermédiaire en un oxyde supérieur et un inférieur","un métal en gaz","un oxyde en métal seul"],"a":0,"e":"Ex. 4MO → M + M₃O₄."},{"n":"ellingham","q":"Changement de pente sur une droite d&#39;Ellingham :","o":["changement d&#39;état (fusion, ébullition)","erreur de tracé","changement de catalyseur"],"a":0,"e":"ΔS° change."},{"n":"ellingham","q":"$\\Delta_rG°_4 = \\frac34\\Delta_rG°_1 + \\frac14\\Delta_rG°_2$ découle de :","o":["la loi de Hess","la loi de Bragg","la règle des phases"],"a":0,"e":"Combinaison linéaire."},{"n":"ellingham","q":"ΔG° &lt; 0 signifie que la réaction est :","o":["favorisée dans le sens direct","impossible","à l&#39;équilibre"],"a":0,"e":"K &gt; 1."},{"n":"ellingham","q":"Le carbone réduit beaucoup d&#39;oxydes à haute T car sa droite C/CO :","o":["descend quand T augmente","monte très vite","est horizontale"],"a":0,"e":"2C + O₂ → 2CO : un gaz se forme, ΔS° &gt; 0."}]},{"id":"annales-corrigees","t":"Annales corrigées · examen BCG et contrôle de cristallochimie","seance":"Examen de Chimie minérale 1 (BCG S3, 1 h 30) et contrôle corrigé 2015-16","imp":5,"payant":true,"html":"<p>Le sujet d&#39;examen de Chimie minérale 1 de la filière BCG, puis un contrôle corrigé de cristallochimie (Pr N. El Jouhari) qui sert d&#39;entraînement.<\/p>\n<h2>Examen BCG · partie A (composé ionique AB)<\/h2>\n<p><strong>Énoncé.<\/strong> AB cristallise en deux variétés cubiques : α (a = 398 pm, ρ = 2,10 g/cm³) et β (a = 602 pm, ρ = 2,43 g/cm³). M = 79,9 g/mol ; r(B⁺) = 150 pm ; λ(CuKα) = 1,541 Å.<\/p>\n<section class=\"exo\"><h3>Partie A<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>a) Structure de α.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1<\/b><\/p><p>$Z = \\rho a^3 N_A / M \\approx 1{,}0$ : <strong>type CsCl<\/strong> (cubique P, 8-8).<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>a) Structure de β.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 4<\/b><\/p><p>$Z \\approx 4{,}0$ : type NaCl ou ZnS (cubique F).<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>b) Avec des rayons invariants, laquelle ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Dans α : $r^+ + r^- = a\\sqrt3/2 \\approx 344{,}7$ pm, donc $r^- \\approx 195$ pm. Si β était NaCl : a = 2 × 344,7 ≈ 689 pm ; si ZnS : a = 4 × 344,7 / √3 ≈ 796 pm. La valeur 602 pm est la plus proche de NaCl, et $r^+/r^- = 150/195 \\approx 0{,}77$ exclut la coordinence 4. <strong>β est de type NaCl.<\/strong><\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>c, d) Réseaux de Bravais et premier pic.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 22.3<\/b><\/p><p>α : cubique <strong>P<\/strong>, premier pic <strong>(100)<\/strong>, d = 3,98 Å, <strong>2θ ≈ 22,3°<\/strong>. β : cubique <strong>F<\/strong>, premier pic <strong>(111)<\/strong>, d = 3,48 Å, <strong>2θ ≈ 25,6°<\/strong>.<\/p>\n<\/div><\/div><\/section><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Les données ne sont pas parfaitement cohérentes : avec des rayons strictement invariants, β de type NaCl aurait a ≈ 689 pm, pas 602 pm. Sur ta copie, justifie ton choix par Z et par le rapport des rayons, et signale l&#39;écart.<\/p>\n<\/aside><h2>Examen BCG · partie B (Ellingham, métal à trois oxydes)<\/h2>\n<p>Le diagramme et les valeurs de ΔH° et ΔS° sont dans une figure absente du fichier. Méthode à rédiger (chapitre 5) :<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Partie B<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · 1. a) Équilibre pour 1 mol de O₂ : 2M + O₂ → 2MO ; 6MO + O₂ → 2M₃O₄ ; 4M₃O₄ + O₂ → 6M₂O₃.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · 2. b) MO n&#39;est stable qu&#39;au-dessus de la température Ti où les droites (1) et (2) se croisent ; en dessous, il se dismute : 4MO → M + M₃O₄.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · 3. c, d) ΔG°ᵢ(T) = ΔH°ᵢ − TΔS°ᵢ ; Ti = (ΔH°₁ − ΔH°₂)/(ΔS°₁ − ΔS°₂).<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · 4. e) (4) : ³⁄₂M + O₂ → ½M₃O₄ = ¾(1) + ¼(2), donc ΔG°₄ = ¾ΔG°₁ + ¼ΔG°₂.<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Contrôle corrigé · cobalt et carbone<\/h2>\n<section class=\"exo\"><h3>Contrôle 2015-16<\/h3><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Les liaisons présentes dans tous les états (solide, liquide, gaz) ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Les liaisons de Van der Waals.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>Graphite et diamant : hybridation et coordinence.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Graphite : sp², coordinence 3, covalent dans les plans et Van der Waals entre les plans. Diamant : sp³, coordinence 4, covalent en 3D.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><p>Cobalt HC (r = 1,25 Å) : a, c, ρ.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 8.86<\/b><\/p><p>a = 2r = 2,5 Å ; c = a√(8/3) ≈ 4,08 Å ; maille triple Z = 6 ; <strong>ρ ≈ 8,86 g/cm³<\/strong>, égale à celle de la variété CFC (même compacité 0,74).<\/p>\n<\/div><\/div><\/section><h2>QCM<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Z ≈ 1 pour un composé AB cubique :<\/div><button class=\"opt\" data-o=\"0\">CsCl<\/button><button class=\"opt\" data-o=\"1\">NaCl<\/button><button class=\"opt\" data-o=\"2\">ZnS<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">r⁺/r⁻ ≈ 0,77 exclut :<\/div><button class=\"opt\" data-o=\"0\">la coordinence 4<\/button><button class=\"opt\" data-o=\"1\">la coordinence 8<\/button><button class=\"opt\" data-o=\"2\">tout cristal ionique<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Premier pic d&#39;un cubique P :<\/div><button class=\"opt\" data-o=\"0\">(100)<\/button><button class=\"opt\" data-o=\"1\">(111)<\/button><button class=\"opt\" data-o=\"2\">(110)<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Coordinence du cobalt HC :<\/div><button class=\"opt\" data-o=\"0\">12<\/button><button class=\"opt\" data-o=\"1\">8<\/button><button class=\"opt\" data-o=\"2\">6<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Multiplicité de la maille triple HC :<\/div><button class=\"opt\" data-o=\"0\">6<\/button><button class=\"opt\" data-o=\"1\">2<\/button><button class=\"opt\" data-o=\"2\">4<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Le graphite est hybridé :<\/div><button class=\"opt\" data-o=\"0\">sp²<\/button><button class=\"opt\" data-o=\"1\">sp³<\/button><button class=\"opt\" data-o=\"2\">sp<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">MO instable sous Ti se transforme en :<\/div><button class=\"opt\" data-o=\"0\">M + M₃O₄<\/button><button class=\"opt\" data-o=\"1\">M₂O₃ seul<\/button><button class=\"opt\" data-o=\"2\">O₂<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Liaisons entre feuillets du graphite :<\/div><button class=\"opt\" data-o=\"0\">Van der Waals<\/button><button class=\"opt\" data-o=\"1\">covalentes<\/button><button class=\"opt\" data-o=\"2\">ioniques<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">2θ augmente quand a :<\/div><button class=\"opt\" data-o=\"0\">diminue<\/button><button class=\"opt\" data-o=\"1\">augmente<\/button><button class=\"opt\" data-o=\"2\">ne change pas<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Les droites d&#39;Ellingham sont comparables si :<\/div><button class=\"opt\" data-o=\"0\">elles sont écrites pour 1 mol de O₂<\/button><button class=\"opt\" data-o=\"1\">elles ont la même pente<\/button><button class=\"opt\" data-o=\"2\">les métaux ont la même masse<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"annales-corrigees","rep":["1"],"tol":null},{"n":"annales-corrigees","rep":["4"],"tol":null},{"n":"annales-corrigees","rep":null,"tol":null},{"n":"annales-corrigees","rep":["22.3"],"tol":null},{"n":"annales-corrigees","rep":null,"tol":null} // Maîtrisé = au moins 3 essais et 80 % de réussite sur les 5 derniers (règle commune à la plateforme).
function statut(n) {

.mzt-chips{display:flex;gap:5px;flex-wrap:wrap;padding:4px 10px}
.mzt-f{display:flex;flex-direction:column;gap:6px;padding:8px 10px;border-top:1px solid var(--l)}
.mzt-f textarea{width:100%;min-height:54px;max-height:140px;resize:vertical;font:16px system-ui,sans-serif;padding:7px;border:1px solid var(--l);border-radius:8px;background:var(--s);color:var(--i)}
.mzt-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

.mzt-note{font-size:11.5px;color:var(--m);margin:0}
.mzt-pan details{padding:0 10px}.mzt-pan summary{cursor:pointer;font-size:12px;color:var(--a);font-weight:600;padding:4px 0}

.mzt-list{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.mzt-item{border:1px solid var(--l);border-radius:8px;padding:8px}
.mzt-item .mzt-meta{font-size:11px;color:var(--m)}
.mzt-pan input[type=search]{width:100%;font:16px system-ui,sans-serif;padding:7px;border:1px solid var(--l);border-radius:8px;background:var(--s);color:var(--i)}
.mzt-pan input[type=checkbox]{width:auto}
.mzt-pan[hidden],.mzt-btn[hidden],.mzt-pan [hidden]{display:none!important}
.mzt-h button{flex:0 0 auto;white-space:nowrap}
.mzt-pan #mztX{background:var(--bad);border-color:var(--bad);color:#fff}
.mzt-m.a{white-space:normal}.mzt-m.a p{margin:0 0 6px}.mzt-m.a p:last-child{margin-bottom:0}

.mzt-m code{font:12.5px ui-monospace,Menlo,Consolas,monospace;background:color-mix(in srgb,var(--i) 10%,transparent);padding:1px 4px;border-radius:4px;overflow-wrap:anywhere}

  $('#mztX').onclick = closePanel;
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#mztPan').hidden) closePanel(); });
  $('#mztTabH').onclick = () => view($('#mztHist').hidden ? 'hist' : 'chat');
  $('#mztTabM').onclick = () => view($('#mztMem').hidden ? 'mem' : 'chat');
  $('#mztQ').oninput = renderList;
  $('#mztList').onclick = (e) => { const id = e.target.dataset && e.target.dataset.cont; if (!id) return; cur = ST.threads.find((t) => t.id === id); view('chat'); $('#mztCtx').textContent = '· ' + cur.sec; renderLog(); };
  $('#mztMemL').onclick = (e) => { const i = e.target.dataset && e.target.dataset.memdel; if (i == null) return; ST.memos.splice(+i, 1); saveMemos(); renderMem(); };
  $('#mztChips').onclick = (e) => { const b = e.target.closest('[data-chip]'); if (!b) return; const t = $('#mztIn'); t.value = b.dataset.chip + (t.value ? ' : ' + t.value : ''); t.focus(); };
  $('#mztNew').onclick = () => { cur = null; renderLog(); };
  $('#mztStop').onclick = () => { if (ctl) ctl.abort(); };
  $('#mztImg').onchange = (e) => { img = e.target.files[0] || null; $('#mztImgN').textContent = img ? 'Photo : ' + img.name : ''; };
  $('#mztF').onsubmit = (e) => { e.preventDefault(); const v = $('#mztIn').value; $('#mztIn').value = ''; ask(v); };
  $('#mztIn').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#mztF').requestSubmit(); } });

  // ---------- capacités (facultatives) ----------
  const W = window.claude;
  if (W && W.use) {
    W.use('sample').then((s) => { sample = s; ready = true; note();
      if (s && s.limits) s.limits().then((l) => { if (l && l.images) { imgOK = true; $('#mztImgL').hidden = false; if (l.images.mediaTypes) $('#mztImg').accept = l.images.mediaTypes.join(','); } }).catch(() => {});
    }).catch(() => { ready = true; note(); });
    Promise.all([W.use('db'), W.use('user')]).then(async ([d, u]) => {
      if (!d || !u) return; const id = await u.id(); if (!id) return; db = d; base = 'data/users/' + id + '/mzt_' + C.id;
      try {
        const m = await db.doc(base).get(); if (m.exists) { const v = m.data() || {}; if (Array.isArray(v.memos)) ST.memos = JSON.parse(JSON.stringify(v.memos)); }
        const q = await db.collection(base + '/threads').get(); const remote = q.docs.map((x) => Object.assign({ id: x.id }, JSON.parse(JSON.stringify(x.data() || {}))));
        const map = {}; [...ST.threads, ...remote].forEach((t) => { if (!map[t.id] || (t.msgs || []).length > (map[t.id].msgs || []).length) map[t.id] = t; });
        ST.threads = Object.values(map).sort((a, b) => parseInt(a.id.slice(1), 36) - parseInt(b.id.slice(1), 36)); saveLocal();
      } catch (e) {}
    }).catch(() => {});
  } else { ready = true; note(); }

  window.MZT = { open: openPanel, close: closePanel };
})();

</script>

if(window.top===window&&location.protocol==="file:"){a.hidden=true;return}
a.href=p.indexOf("/decouvrir")===0||location.pathname.indexOf("/decouvrir")===0?"/decouvrir":"/app/modules";})();</script>
