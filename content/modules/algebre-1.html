<script>
const MODULE={"slug":"algebre-1","titre":"Algèbre 1","cle":"algebre-1_scores","cleEtat":"algebre-1_scores_etat","format":"score10","intro":"<p>Ce module suit <strong>le polycopié du Pr El Omari<\/strong> (Algèbre 1, MIP, 2024-2025) chapitre par chapitre, puis corrige les <strong>TD 1, 2 et 3<\/strong>.<\/p>\n<p><strong>Chaque chapitre a trois temps<\/strong><\/p>\n<ol>\n<li><strong>Avant de commencer<\/strong> : le prérequis, avec une question pour vérifier.<\/li>\n<li><strong>Comment l&#39;aborder<\/strong> : l&#39;état d&#39;esprit et le piège classique.<\/li>\n<li><strong>Les idées, illustrées<\/strong> : un schéma, une phrase, un exemple chiffré.<\/li>\n<\/ol>\n<p>Termine par le QCM : <strong>8/10 = chapitre maîtrisé<\/strong>.<\/p>\n<p><strong>Ce qui est sûr<\/strong> : le plan, les notations et les exemples viennent du polycopié ; les calculs des exemples et des corrigés ont été vérifiés par ordinateur.\n<strong>À savoir<\/strong> : le polycopié contient des coquilles (signalées en encadré « Attention » avec la correction). Le barème et le format de l&#39;examen ne sont pas fournis : demande-les au prof.<\/p>\n","annexes":[],"cartes":null,"maths":true};
const CHAPS=[{"id":"logique","t":"Éléments de logique","seance":"Chapitre 1 · §1.1 du polycopié","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il te faut une seule chose : savoir dire si une phrase mathématique simple est vraie ou fausse, comme « $2 &lt; 4$ » ou « $\\sqrt 2$ est rationnel ».<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>La phrase « $x^2 = 4$ » est-elle une proposition (au sens du cours) ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Peut-on lui donner une valeur vraie ou fausse sans connaître x ?<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Non. Elle dépend de la variable $x$ : c&#39;est un <strong>prédicat<\/strong>. Elle devient une proposition quand on fixe $x$ (vraie pour $x = 2$, fausse pour $x = 3$) ou quand on la quantifie : « $\\exists x \\in \\mathbb R,\\ x^2 = 4$ » est une proposition vraie.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Tout se ramène à des tables de vérité.<\/strong> Quand tu doutes d&#39;une règle (négation, implication), dresse la table : 4 lignes pour deux propositions, et le doute disparaît.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Croire que « $A \\Rightarrow B$ » est faux quand $A$ est faux. C&#39;est l&#39;inverse : <strong>si l&#39;hypothèse est fausse, l&#39;implication est vraie<\/strong>. « La Terre est plate $\\Rightarrow$ l&#39;Homme est un poisson » est une implication vraie.<\/p>\n<\/aside><p>À la fin, tu sais nier n&#39;importe quelle phrase avec quantificateurs et distinguer condition nécessaire et condition suffisante.<\/p>\n<h2>Idée 1 · Trois connecteurs et leur table<\/h2>\n<p>Le cours définit, pour deux propositions $A$ et $B$ : la négation $\\neg A$, la conjonction $A \\wedge B$ (« et ») et la disjonction $A \\vee B$ (« ou » <strong>non exclusif<\/strong>).<\/p>\n<figure class=\"grille\"><figcaption>Table de vérité (V = vrai, F = faux)<\/figcaption><table><tr><th><\/th><th>A<\/th><th>B<\/th><th>¬A<\/th><th>A∧B<\/th><th>A∨B<\/th><th>A⇒B<\/th><th>A⇔B<\/th><\/tr><tr><th>1<\/th><td>V<\/td><td>V<\/td><td>F<\/td><td class=\"h1\">V<\/td><td class=\"h1\">V<\/td><td class=\"h1\">V<\/td><td class=\"h1\">V<\/td><\/tr><tr><th>2<\/th><td>V<\/td><td>F<\/td><td>F<\/td><td>F<\/td><td class=\"h1\">V<\/td><td class=\"h2\">F<\/td><td>F<\/td><\/tr><tr><th>3<\/th><td>F<\/td><td>V<\/td><td>V<\/td><td>F<\/td><td class=\"h1\">V<\/td><td class=\"h1\">V<\/td><td>F<\/td><\/tr><tr><th>4<\/th><td>F<\/td><td>F<\/td><td>V<\/td><td>F<\/td><td>F<\/td><td class=\"h1\">V<\/td><td class=\"h1\">V<\/td><\/tr><\/table><\/figure><p>Lis la colonne $A \\Rightarrow B$ : elle n&#39;est fausse <strong>qu&#39;une seule fois<\/strong>, quand $A$ est vrai et $B$ faux (« du vrai n&#39;entraîne pas du faux »).<\/p>\n<p>Règles à connaître (Résultat 1 du polycopié) : $\\wedge$ et $\\vee$ sont commutatifs et associatifs, et chacun est distributif sur l&#39;autre :\n$A \\wedge (B \\vee C) \\equiv (A \\wedge B) \\vee (A \\wedge C)$ et $A \\vee (B \\wedge C) \\equiv (A \\vee B) \\wedge (A \\vee C)$.<\/p>\n<p>Lois de De Morgan : $\\neg(A \\wedge B) \\equiv \\neg A \\vee \\neg B$ et $\\neg(A \\vee B) \\equiv \\neg A \\wedge \\neg B$.<\/p>\n<h2>Idée 2 · L&#39;implication est un « ou » déguisé<\/h2>\n<p>Le prof <strong>définit<\/strong> $A \\Rightarrow B$ comme la proposition $(\\neg A) \\vee B$. Tout le reste en découle.<\/p>\n<figure class=\"flux\"><figcaption>De la définition à la négation<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">A ⇒ B<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">(¬A) ∨ B<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">négation : A ∧ ¬B<\/div><\/div><\/figure><ul>\n<li>Négation : $\\neg(A \\Rightarrow B) \\equiv A \\wedge \\neg B$. « Il pleut et je ne prends pas mon parapluie » contredit « s&#39;il pleut, je prends mon parapluie ».<\/li>\n<li>Contraposée : $(A \\Rightarrow B) \\equiv (\\neg B \\Rightarrow \\neg A)$, car les deux valent $\\neg A \\vee B$.<\/li>\n<li>Équivalence : $A \\Leftrightarrow B$ signifie $(A \\Rightarrow B)$ et $(B \\Rightarrow A)$.<\/li>\n<\/ul>\n<p><strong>Exemple chiffré.<\/strong> $A$ : « $x = 2$ », $B$ : « $x^2 = 4$ ». $A \\Rightarrow B$ est vraie pour tout réel $x$. Sa réciproque $B \\Rightarrow A$ est fausse pour $x = -2$.<\/p>\n<aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>On n&#39;emploie <strong>jamais<\/strong> les symboles $\\Rightarrow$ et $\\Leftrightarrow$ dans une rédaction : on écrit « donc », « si… alors », « or », « car ». Écrire « $2$ pair $\\Rightarrow 3$ impair » n&#39;affirme pas que 3 est impair ; écrire « donc 3 impair » l&#39;affirme.<\/p>\n<\/aside><h2>Idée 3 · Condition nécessaire, condition suffisante<\/h2>\n<svg viewBox=\"0 0 420 170\" style=\"width:100%;max-width:460px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Le disque A est inclus dans le disque B : A est suffisant pour B, B est nécessaire pour A\">\n<ellipse cx=\"210\" cy=\"85\" rx=\"190\" ry=\"75\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<ellipse cx=\"170\" cy=\"90\" rx=\"80\" ry=\"42\" fill=\"#D9824F\" fill-opacity=\"0.25\" stroke=\"#D9824F\" stroke-width=\"2\"/>\n<g font-family=\"sans-serif\" font-size=\"14\" fill=\"currentColor\">\n<text x=\"150\" y=\"95\" font-weight=\"700\">A<\/text>\n<text x=\"320\" y=\"60\" font-weight=\"700\">B<\/text>\n<text x=\"40\" y=\"160\" font-size=\"12\">A ⇒ B : A est suffisant pour B, B est nécessaire pour A<\/text><\/g>\n<\/svg><p>Quand $A \\Rightarrow B$ :<\/p>\n<ul>\n<li>$A$ est une <strong>condition suffisante<\/strong> pour $B$ : il suffit que $A$ soit vraie pour que $B$ le soit ;<\/li>\n<li>$B$ est une <strong>condition nécessaire<\/strong> pour $A$ : pour que $A$ soit vraie, il faut que $B$ le soit.<\/li>\n<\/ul>\n<p><strong>Exemple (exercice 6 du polycopié).<\/strong> « Pour que $\\ln(x + 2)$ soit défini, il faut que $x &gt; -2$. » C&#39;est même nécessaire et suffisant.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>L&#39;exercice 6 du polycopié liste des phrases volontairement fausses à <strong>corriger<\/strong> (« pour qu&#39;un réel soit positif, il faut que $x &gt; 0$ » est faux : $0$ est positif sans être $&gt; 0$ ; la bonne phrase est « il suffit que $x &gt; 0$ »). Ne les apprends pas telles quelles.<\/p>\n<\/aside><h2>Idée 4 · Quantificateurs et négation<\/h2>\n<p>$\\forall x \\in E,\\ A(x)$ : « pour tout $x$ de $E$ » ; $\\exists x \\in E,\\ A(x)$ : « il existe au moins un $x$ » ; $\\exists !$ : « il existe un unique ».<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Nier une phrase quantifiée<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · On échange les quantificateurs<\/div><p>$\\forall$ devient $\\exists$ et $\\exists$ devient $\\forall$, sans changer leur place ni l&#39;ensemble.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · On nie la propriété finale<\/div><p>$=$ devient $\\neq$, $&lt;$ devient $\\ge$, $\\le$ devient $&gt;$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · On échange « et » et « ou »<\/div><p>et $\\neg(A \\Rightarrow B)$ devient $A \\wedge \\neg B$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Exemple<\/div><p>La négation de $\\forall x &gt; 0,\\ e^x &gt; 1$ est $\\exists x &gt; 0,\\ e^x \\le 1$.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p><strong>On ne permute pas un $\\forall$ et un $\\exists$.<\/strong> « $\\forall y \\in \\mathbb R,\\ \\exists x \\in \\mathbb R,\\ 2x = y$ » est vraie ($x = y/2$). « $\\exists x \\in \\mathbb R,\\ \\forall y \\in \\mathbb R,\\ 2x = y$ » est fausse (un seul $x$ ne peut pas donner tous les $y$). Deux $\\forall$ (ou deux $\\exists$) consécutifs, eux, s&#39;échangent.<\/p>\n<\/aside><p>Résultat 5 du polycopié : « $\\forall x,\\ (P(x) \\vee Q(x))$ » n&#39;équivaut <strong>pas<\/strong> à « $(\\forall x,\\ P(x)) \\vee (\\forall x,\\ Q(x))$ ». Contre-exemple : tout entier est pair ou impair, mais tous les entiers ne sont pas pairs, ni tous impairs.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices du polycopié<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Écris la négation de : $\\forall x \\in E,\\ (|x| &gt; 2 \\Rightarrow x &gt; 2)$. Puis dis si la phrase est vraie dans $E = \\mathbb R$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>¬(A ⇒ B) ≡ A ∧ ¬B.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Négation : $\\exists x \\in E,\\ (|x| &gt; 2 \\text{ et } x \\le 2)$. Dans $\\mathbb R$, $x = -3$ convient ($|-3| = 3 &gt; 2$ et $-3 \\le 2$) : la négation est vraie, donc la phrase de départ est <strong>fausse<\/strong>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>On donne : « J&#39;ai une fille $\\Rightarrow$ l&#39;Homme est un poisson » et « l&#39;Homme est un poisson $\\Rightarrow$ j&#39;ai quatre filles ». Ai-je une fille ? Ai-je quatre filles ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>L&#39;Homme n&#39;est pas un poisson. Utilise la contraposée.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>« L&#39;Homme est un poisson » est faux. Par contraposée de la première, « je n&#39;ai pas de fille » : <strong>non<\/strong>, je n&#39;ai pas de fille, donc <strong>non<\/strong> plus quatre. La seconde implication est vraie (hypothèse fausse) et n&#39;apprend rien.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Valeur logique de $P$ : $\\exists x \\in \\mathbb R,\\ \\forall y \\in \\mathbb R,\\ x^2 + 2xy = 1$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Essaie y = 0 puis y = 1 avec le même x.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Fausse. Si un tel $x$ existe, $y = 0$ donne $x^2 = 1$, et $y = 1$ donne $x^2 + 2x = 1$, donc $2x = 0$, $x = 0$, ce qui contredit $x^2 = 1$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Si $A$ est fausse, l&#39;implication $A \\Rightarrow B$ est :<\/div><button class=\"opt\" data-o=\"0\">toujours fausse<\/button><button class=\"opt\" data-o=\"1\">toujours vraie<\/button><button class=\"opt\" data-o=\"2\">vraie seulement si $B$ est vraie<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">La négation de $A \\Rightarrow B$ est :<\/div><button class=\"opt\" data-o=\"0\">$\\neg A \\Rightarrow \\neg B$<\/button><button class=\"opt\" data-o=\"1\">$A \\wedge \\neg B$<\/button><button class=\"opt\" data-o=\"2\">$\\neg A \\vee B$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">La contraposée de « si $n$ est pair, alors $n^2$ est pair » est :<\/div><button class=\"opt\" data-o=\"0\">si $n^2$ est pair, alors $n$ est pair<\/button><button class=\"opt\" data-o=\"1\">si $n^2$ est impair, alors $n$ est impair<\/button><button class=\"opt\" data-o=\"2\">si $n$ est impair, alors $n^2$ est impair<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">La négation de $\\forall x &gt; 0,\\ e^x &gt; 1$ est :<\/div><button class=\"opt\" data-o=\"0\">$\\forall x &gt; 0,\\ e^x \\le 1$<\/button><button class=\"opt\" data-o=\"1\">$\\exists x &gt; 0,\\ e^x \\le 1$<\/button><button class=\"opt\" data-o=\"2\">$\\exists x \\le 0,\\ e^x \\le 1$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">« $\\forall y \\in \\mathbb R,\\ \\exists x \\in \\mathbb R,\\ 2x = y$ » est :<\/div><button class=\"opt\" data-o=\"0\">vraie<\/button><button class=\"opt\" data-o=\"1\">fausse<\/button><button class=\"opt\" data-o=\"2\">ni vraie ni fausse<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">« $\\exists x \\in \\mathbb R,\\ \\forall y \\in \\mathbb R,\\ 2x = y$ » est :<\/div><button class=\"opt\" data-o=\"0\">vraie<\/button><button class=\"opt\" data-o=\"1\">fausse<\/button><button class=\"opt\" data-o=\"2\">équivalente à la question précédente<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">« Pour que $x \\ge 1$, il suffit que $x &gt; 2$ ». Ici $x &gt; 2$ est :<\/div><button class=\"opt\" data-o=\"0\">une condition suffisante pour $x \\ge 1$<\/button><button class=\"opt\" data-o=\"1\">une condition nécessaire pour $x \\ge 1$<\/button><button class=\"opt\" data-o=\"2\">une condition nécessaire et suffisante<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">$A \\vee (B \\wedge C)$ équivaut à :<\/div><button class=\"opt\" data-o=\"0\">$(A \\vee B) \\vee C$<\/button><button class=\"opt\" data-o=\"1\">$(A \\vee B) \\wedge (A \\vee C)$<\/button><button class=\"opt\" data-o=\"2\">$(A \\wedge B) \\vee (A \\wedge C)$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">La négation de « tous les chats sont gris » est :<\/div><button class=\"opt\" data-o=\"0\">tous les chats ne sont pas gris<\/button><button class=\"opt\" data-o=\"1\">il existe au moins un chat qui n&#39;est pas gris<\/button><button class=\"opt\" data-o=\"2\">aucun chat n&#39;est gris<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Le « ou » mathématique est :<\/div><button class=\"opt\" data-o=\"0\">inclusif : $A \\vee B$ est vraie si au moins une des deux est vraie<\/button><button class=\"opt\" data-o=\"1\">exclusif : une seule des deux doit être vraie<\/button><button class=\"opt\" data-o=\"2\">vrai seulement si les deux sont vraies<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"logique","rep":null,"tol":null},{"n":"logique","rep":null,"tol":null},{"n":"logique","rep":null,"tol":null},{"n":"logique","rep":null,"tol":null}],"qcm":[{"n":"logique","q":"Si $A$ est fausse, l&#39;implication $A \\Rightarrow B$ est :","o":["toujours fausse","toujours vraie","vraie seulement si $B$ est vraie"],"a":1,"e":"$A \\Rightarrow B$ vaut $(\\neg A) \\vee B$ ; avec $\\neg A$ vraie, le « ou » est vrai."},{"n":"logique","q":"La négation de $A \\Rightarrow B$ est :","o":["$\\neg A \\Rightarrow \\neg B$","$A \\wedge \\neg B$","$\\neg A \\vee B$"],"a":1,"e":"La seule ligne où l&#39;implication est fausse : $A$ vraie et $B$ fausse."},{"n":"logique","q":"La contraposée de « si $n$ est pair, alors $n^2$ est pair » est :","o":["si $n^2$ est pair, alors $n$ est pair","si $n^2$ est impair, alors $n$ est impair","si $n$ est impair, alors $n^2$ est impair"],"a":1,"e":"Contraposée de $A \\Rightarrow B$ : $\\neg B \\Rightarrow \\neg A$. La première option est la réciproque."},{"n":"logique","q":"La négation de $\\forall x &gt; 0,\\ e^x &gt; 1$ est :","o":["$\\forall x &gt; 0,\\ e^x \\le 1$","$\\exists x &gt; 0,\\ e^x \\le 1$","$\\exists x \\le 0,\\ e^x \\le 1$"],"a":1,"e":"On change $\\forall$ en $\\exists$ sans toucher au domaine $x &gt; 0$, et $&gt;$ devient $\\le$."},{"n":"logique","q":"« $\\forall y \\in \\mathbb R,\\ \\exists x \\in \\mathbb R,\\ 2x = y$ » est :","o":["vraie","fausse","ni vraie ni fausse"],"a":0,"e":"Pour chaque $y$, on prend $x = y/2$."},{"n":"logique","q":"« $\\exists x \\in \\mathbb R,\\ \\forall y \\in \\mathbb R,\\ 2x = y$ » est :","o":["vraie","fausse","équivalente à la question précédente"],"a":1,"e":"Un seul $x$ fixé donne une seule valeur $2x$ ; $y = 2x + 1$ est un contre-exemple. Permuter $\\forall$ et $\\exists$ change le sens."},{"n":"logique","q":"« Pour que $x \\ge 1$, il suffit que $x &gt; 2$ ». Ici $x &gt; 2$ est :","o":["une condition suffisante pour $x \\ge 1$","une condition nécessaire pour $x \\ge 1$","une condition nécessaire et suffisante"],"a":0,"e":"$x &gt; 2 \\Rightarrow x \\ge 1$, mais pas l&#39;inverse ($x = 1$)."},{"n":"logique","q":"$A \\vee (B \\wedge C)$ équivaut à :","o":["$(A \\vee B) \\vee C$","$(A \\vee B) \\wedge (A \\vee C)$","$(A \\wedge B) \\vee (A \\wedge C)$"],"a":1,"e":"$\\vee$ est distributif sur $\\wedge$ (Résultat 1 du cours)."},{"n":"logique","q":"La négation de « tous les chats sont gris » est :","o":["tous les chats ne sont pas gris","il existe au moins un chat qui n&#39;est pas gris","aucun chat n&#39;est gris"],"a":1,"e":"$\\neg(\\forall x,\\ P(x)) \\equiv \\exists x,\\ \\neg P(x)$ : un seul contre-exemple suffit."},{"n":"logique","q":"Le « ou » mathématique est :","o":["inclusif : $A \\vee B$ est vraie si au moins une des deux est vraie","exclusif : une seule des deux doit être vraie","vrai seulement si les deux sont vraies"],"a":0,"e":"Le cours précise que « ou » n&#39;est pas exclusif."}]},{"id":"ensembles-raisonnements","t":"Ensembles et types de raisonnement","seance":"Chapitre 1 · §1.2 à 1.5 du polycopié","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il te faut le chapitre précédent : implication, contraposée et négation d&#39;une phrase avec $\\forall$ et $\\exists$.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Écris la contraposée de « si $x^2 \\neq 4$, alors $x \\neq 2$ ».<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>¬B ⇒ ¬A.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>« Si $x = 2$, alors $x^2 = 4$ », qui est évidente. Prouver la contraposée suffit (exercice 19.1 du polycopié).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Choisis le raisonnement selon la forme de la phrase.<\/strong> $\\exists$ : un exemple. $\\forall$ : « Soit $x$ quelconque ». $\\Rightarrow$ : direct ou contraposée. Propriété sur tous les entiers : récurrence. « Trouver toutes les solutions » : analyse-synthèse.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Confondre $\\in$ et $\\subseteq$. On écrit $2 \\in [0 ; 2]$ (un élément) mais $\\{2\\} \\subseteq [0 ; 2]$ (un ensemble). Et $\\{2\\} \\in [0 ; 2]$ n&#39;a aucun sens.<\/p>\n<\/aside><p>À la fin, tu sais manipuler réunion, intersection et produit cartésien, et rédiger les six types de preuves du cours.<\/p>\n<h2>Idée 1 · Décrire et comparer des ensembles<\/h2>\n<p>Un ensemble s&#39;écrit <strong>en extension<\/strong> (on liste : $\\{2, 4, 6\\}$) ou <strong>en compréhension<\/strong> (une propriété : $\\{x \\in \\mathbb R \\mid x^2 = 4\\} = \\{-2, 2\\}$).<\/p>\n<svg viewBox=\"0 0 420 160\" style=\"width:100%;max-width:460px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Deux ensembles A et B qui se chevauchent : la zone commune est l'intersection, le tout est la réunion\">\n<circle cx=\"160\" cy=\"80\" r=\"65\" fill=\"#D9824F\" fill-opacity=\"0.15\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<circle cx=\"260\" cy=\"80\" r=\"65\" fill=\"#D9824F\" fill-opacity=\"0.15\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<path d=\"M210 38 A65 65 0 0 1 210 122 A65 65 0 0 1 210 38 Z\" fill=\"#D9824F\" fill-opacity=\"0.6\"/>\n<g font-family=\"sans-serif\" font-size=\"14\" fill=\"currentColor\" font-weight=\"700\">\n<text x=\"120\" y=\"85\">A<\/text><text x=\"290\" y=\"85\">B<\/text><text x=\"196\" y=\"85\" font-size=\"12\">A∩B<\/text><\/g>\n<\/svg><ul>\n<li>$A \\subseteq B$ : $\\forall x \\in A,\\ x \\in B$. Égalité : $A \\subseteq B$ <strong>et<\/strong> $B \\subseteq A$ (double inclusion).<\/li>\n<li>$x \\in A \\cup B \\iff x \\in A$ ou $x \\in B$ ; $x \\in A \\cap B \\iff x \\in A$ et $x \\in B$.<\/li>\n<li>$B \\setminus A$ : les éléments de $B$ qui ne sont pas dans $A$. Ex. $\\mathbb R^* = \\mathbb R \\setminus \\{0\\}$.<\/li>\n<li>$E \\times F$ : les couples $(x, y)$ avec $x \\in E$, $y \\in F$. Dans un couple, <strong>l&#39;ordre compte<\/strong> : $(2, 3) \\neq (3, 2)$ mais $\\{2, 3\\} = \\{3, 2\\}$.<\/li>\n<\/ul>\n<p><strong>Exemple chiffré.<\/strong> $A = \\{1, 2\\}$, $B = \\{a, b, c\\}$ : $\\mathrm{card}(A \\times B) = 2 \\times 3 = 6$.<\/p>\n<h2>Idée 2 · Démontrer un $\\forall$, un $\\exists$, une implication<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Rédiger une preuve de « ∀x ∈ E, A(x) »<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · On fixe l&#39;objet<\/div><p>« Soit $x \\in E$ quelconque. »<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · On démontre A(x)<\/div><p>avec des mots : donc, alors, par conséquent.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · On conclut<\/div><p>« Ceci étant vrai pour tout $x \\in E$, on a montré $\\forall x \\in E,\\ A(x)$. »<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Pour un ∃<\/div><p>un seul exemple bien choisi suffit. Pour réfuter un ∀, un seul contre-exemple suffit.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p><strong>Exemple (exercice 4.2 du polycopié).<\/strong> Montrer $xy \\le \\frac12 (x^2 + y^2)$. Soient $x, y$ réels. $x^2 + y^2 - 2xy = (x - y)^2 \\ge 0$, donc $2xy \\le x^2 + y^2$. Vrai pour tous $x, y$.<\/p>\n<p>Pour $P \\Rightarrow Q$ : soit « Supposons $P$… donc $Q$ », soit la contraposée « Supposons $\\neg Q$… donc $\\neg P$ ». Pour $P \\Leftrightarrow Q$ : double implication.<\/p>\n<h2>Idée 3 · L&#39;absurde et l&#39;analyse-synthèse<\/h2>\n<p><strong>Absurde.<\/strong> On suppose $P$ fausse et on arrive à une contradiction.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>√2 est irrationnel (exercice 20 du polycopié)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · On suppose le contraire<\/div><p>$\\sqrt 2 = p/q$ avec $p, q$ entiers, $q \\neq 0$, fraction irréductible.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · On élève au carré<\/div><p>$p^2 = 2q^2$, donc $p^2$ est pair, donc $p$ est pair : $p = 2k$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · On remplace<\/div><p>$4k^2 = 2q^2$, donc $q^2 = 2k^2$ : $q$ est pair aussi.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Contradiction<\/div><p>$p$ et $q$ pairs, alors que la fraction était irréductible. Donc $\\sqrt 2 \\notin \\mathbb Q$.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p><strong>Analyse-synthèse<\/strong> (pour « trouver <strong>tous<\/strong> les objets qui vérifient… ») :<\/p>\n<figure class=\"flux\"><figcaption>Trois temps<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">Analyse : soit f une solution, on trouve sa forme<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Construction : on pose les candidats<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Synthèse : on vérifie qu&#39;ils marchent<\/div><\/div><\/figure><p><strong>Exemple (exercice 21.4).<\/strong> Résoudre $\\sqrt{x + 4} + \\sqrt{x + 2} = \\frac12$. Analyse : $(\\sqrt{x+4} + \\sqrt{x+2})(\\sqrt{x+4} - \\sqrt{x+2}) = 2$, donc $\\sqrt{x+4} - \\sqrt{x+2} = 4$. En additionnant : $2\\sqrt{x+4} = \\frac92$, $x + 4 = \\frac{81}{16}$, $x = \\frac{17}{16}$. Synthèse : $\\sqrt{x + 2} = \\sqrt{49/16} = \\frac74$ et $\\sqrt{x+4} = \\frac94$, dont la somme vaut $4 \\neq \\frac12$. <strong>Aucune solution.<\/strong> Sans la synthèse, on aurait donné une fausse réponse !<\/p>\n<h2>Idée 4 · La récurrence sous ses trois formes<\/h2>\n<figure class=\"grille\"><figcaption>Trois récurrences<\/figcaption><table><tr><th><\/th><th>forme<\/th><th>initialisation<\/th><th>hérédité<\/th><\/tr><tr><th>simple<\/th><td>.<\/td><td>P(0)<\/td><td class=\"h1\">P(n)⇒P(n+1)<\/td><\/tr><tr><th>ordre_2<\/th><td>.<\/td><td>P(0),P(1)<\/td><td class=\"h1\">P(n),P(n+1)⇒P(n+2)<\/td><\/tr><tr><th>forte<\/th><td>.<\/td><td>P(0)<\/td><td class=\"h1\">P(0..n)⇒P(n+1)<\/td><\/tr><\/table><\/figure><p><strong>Exemple (exercice 23).<\/strong> $u_0 = u_1 = 1$, $u_{n+2} = u_{n+1} + u_n$. Montrer $u_n \\ge n$ pour tout $n$… mais attention :<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le polycopié demande « $u_n &gt; n$ », qui est <strong>faux<\/strong> pour $n = 1$ ($u_1 = 1$). L&#39;énoncé correct est $u_n \\ge n$. Initialisation : $u_0 = 1 \\ge 0$, $u_1 = 1 \\ge 1$. Hérédité (ordre 2) : si $u_n \\ge n$ et $u_{n+1} \\ge n + 1$, alors $u_{n+2} \\ge 2n + 1 \\ge n + 2$ dès que $n \\ge 1$ ; pour $n = 0$, $u_2 = 2 \\ge 2$ directement.<\/p>\n<\/aside><aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>Le symbole $\\forall n$ ne doit figurer <strong>que dans la conclusion<\/strong>. Et si ton hérédité n&#39;utilise pas l&#39;hypothèse de récurrence, la récurrence était inutile.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices du polycopié<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Montre par récurrence que $2^n &gt; n + 1$ pour tout entier $n \\ge 2$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>2^(n+1) = 2·2^n.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Initialisation : $2^2 = 4 &gt; 3$. Hérédité : si $2^n &gt; n + 1$ pour un $n \\ge 2$, alors $2^{n+1} = 2 \\cdot 2^n &gt; 2n + 2 &gt; n + 2$. Conclusion : vrai pour tout $n \\ge 2$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Déterminer $\\bigcup_{n \\in \\mathbb N} A_n$ et $\\bigcap_{n \\in \\mathbb N} A_n$ pour $A_n = ]n ; n + 1[$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Ces intervalles sont disjoints deux à deux.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>La réunion est $\\mathbb R_+ \\setminus \\mathbb N$ (les réels positifs non entiers). L&#39;intersection est vide, car $A_0 \\cap A_1 = \\emptyset$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>$\\{2, 3\\}$, $(2, 3)$ et $\\{(2,3)\\}$ sont-ils égaux à $\\{3,2\\}$, $(3,2)$, $\\{(3,2)\\}$ ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$\\{2,3\\} = \\{3,2\\}$ (un ensemble n&#39;est pas ordonné). $(2,3) \\neq (3,2)$ (couple ordonné). Donc $\\{(2,3)\\} \\neq \\{(3,2)\\}$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Laquelle est correcte ?<\/div><button class=\"opt\" data-o=\"0\">$\\{2\\} \\in [0 ; 2]$<\/button><button class=\"opt\" data-o=\"1\">$\\{2\\} \\subseteq [0 ; 2]$<\/button><button class=\"opt\" data-o=\"2\">$2 \\subseteq [0 ; 2]$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">$\\{x \\in \\mathbb R \\mid x^2 = 4\\}$ vaut :<\/div><button class=\"opt\" data-o=\"0\">$\\{2\\}$<\/button><button class=\"opt\" data-o=\"1\">$\\{-2, 2\\}$<\/button><button class=\"opt\" data-o=\"2\">$\\{4\\}$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Pour montrer qu&#39;un énoncé « $\\exists x \\in E,\\ A(x)$ » est vrai, il suffit :<\/div><button class=\"opt\" data-o=\"0\">de donner un $x$ précis qui vérifie $A(x)$<\/button><button class=\"opt\" data-o=\"1\">de vérifier $A(x)$ pour plusieurs $x$ puis de conclure pour tous<\/button><button class=\"opt\" data-o=\"2\">de supposer $A(x)$ faux pour tout $x$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Pour réfuter « $\\forall x \\in E,\\ A(x)$ », il suffit :<\/div><button class=\"opt\" data-o=\"0\">de trouver des $x$ qui vérifient $A(x)$<\/button><button class=\"opt\" data-o=\"1\">de trouver un $x$ qui ne vérifie pas $A(x)$<\/button><button class=\"opt\" data-o=\"2\">de montrer que $A(x)$ est vrai pour $x = 0$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Dans une preuve par l&#39;absurde de « $P$ », on commence par :<\/div><button class=\"opt\" data-o=\"0\">supposer $P$<\/button><button class=\"opt\" data-o=\"1\">supposer $\\neg P$<\/button><button class=\"opt\" data-o=\"2\">montrer la contraposée<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Pour la suite $u_{n+2} = u_{n+1} + u_n$, quelle récurrence est naturelle ?<\/div><button class=\"opt\" data-o=\"0\">simple<\/button><button class=\"opt\" data-o=\"1\">d&#39;ordre 2<\/button><button class=\"opt\" data-o=\"2\">aucune<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Lors d&#39;une analyse-synthèse, la synthèse sert à :<\/div><button class=\"opt\" data-o=\"0\">trouver la forme des solutions<\/button><button class=\"opt\" data-o=\"1\">vérifier que les candidats trouvés sont bien solutions<\/button><button class=\"opt\" data-o=\"2\">prouver l&#39;unicité par l&#39;absurde<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">$(2, 3) = (3, 2)$ ?<\/div><button class=\"opt\" data-o=\"0\">oui<\/button><button class=\"opt\" data-o=\"1\">non<\/button><button class=\"opt\" data-o=\"2\">seulement dans $\\mathbb N^2$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Si $A \\subseteq B$, alors $A \\cup B$ vaut :<\/div><button class=\"opt\" data-o=\"0\">$A$<\/button><button class=\"opt\" data-o=\"1\">$B$<\/button><button class=\"opt\" data-o=\"2\">$A \\cap B$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Si $\\mathrm{card}(E) = 3$ et $\\mathrm{card}(F) = 4$, $\\mathrm{card}(E \\times F)$ vaut :<\/div><button class=\"opt\" data-o=\"0\">7<\/button><button class=\"opt\" data-o=\"1\">12<\/button><button class=\"opt\" data-o=\"2\">81<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"ensembles-raisonnements","rep":null,"tol":null},{"n":"ensembles-raisonnements","rep":null,"tol":null},{"n":"ensembles-raisonnements","rep":null,"tol":null},{"n":"ensembles-raisonnements","rep":null,"tol":null}],"qcm":[{"n":"ensembles-raisonnements","q":"Laquelle est correcte ?","o":["$\\{2\\} \\in [0 ; 2]$","$\\{2\\} \\subseteq [0 ; 2]$","$2 \\subseteq [0 ; 2]$"],"a":1,"e":"Un singleton est un ensemble : il est <strong>inclus<\/strong>, pas élément."},{"n":"ensembles-raisonnements","q":"$\\{x \\in \\mathbb R \\mid x^2 = 4\\}$ vaut :","o":["$\\{2\\}$","$\\{-2, 2\\}$","$\\{4\\}$"],"a":1,"e":"Les réels de carré 4 sont $2$ et $-2$."},{"n":"ensembles-raisonnements","q":"Pour montrer qu&#39;un énoncé « $\\exists x \\in E,\\ A(x)$ » est vrai, il suffit :","o":["de donner un $x$ précis qui vérifie $A(x)$","de vérifier $A(x)$ pour plusieurs $x$ puis de conclure pour tous","de supposer $A(x)$ faux pour tout $x$"],"a":0,"e":"Un exemple suffit pour un « il existe »."},{"n":"ensembles-raisonnements","q":"Pour réfuter « $\\forall x \\in E,\\ A(x)$ », il suffit :","o":["de trouver des $x$ qui vérifient $A(x)$","de trouver un $x$ qui ne vérifie pas $A(x)$","de montrer que $A(x)$ est vrai pour $x = 0$"],"a":1,"e":"Un contre-exemple prouve la négation $\\exists x,\\ \\neg A(x)$."},{"n":"ensembles-raisonnements","q":"Dans une preuve par l&#39;absurde de « $P$ », on commence par :","o":["supposer $P$","supposer $\\neg P$","montrer la contraposée"],"a":1,"e":"On suppose $P$ fausse et on cherche une contradiction."},{"n":"ensembles-raisonnements","q":"Pour la suite $u_{n+2} = u_{n+1} + u_n$, quelle récurrence est naturelle ?","o":["simple","d&#39;ordre 2","aucune"],"a":1,"e":"Le rang $n+2$ dépend des <strong>deux<\/strong> rangs précédents."},{"n":"ensembles-raisonnements","q":"Lors d&#39;une analyse-synthèse, la synthèse sert à :","o":["trouver la forme des solutions","vérifier que les candidats trouvés sont bien solutions","prouver l&#39;unicité par l&#39;absurde"],"a":1,"e":"L&#39;analyse ne donne que des conditions nécessaires ; la synthèse vérifie qu&#39;elles suffisent."},{"n":"ensembles-raisonnements","q":"$(2, 3) = (3, 2)$ ?","o":["oui","non","seulement dans $\\mathbb N^2$"],"a":1,"e":"Dans un couple, l&#39;ordre des composantes compte."},{"n":"ensembles-raisonnements","q":"Si $A \\subseteq B$, alors $A \\cup B$ vaut :","o":["$A$","$B$","$A \\cap B$"],"a":1,"e":"Tout élément de $A$ est déjà dans $B$."},{"n":"ensembles-raisonnements","q":"Si $\\mathrm{card}(E) = 3$ et $\\mathrm{card}(F) = 4$, $\\mathrm{card}(E \\times F)$ vaut :","o":["7","12","81"],"a":1,"e":"On forme $3 \\times 4$ couples."}]},{"id":"applications","t":"Applications, injections, surjections, bijections","seance":"Chapitre 2 · §2.1 et 2.2 du polycopié","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il te faut savoir rédiger un « Soit $x \\in E$ » et une implication (chapitre 2).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>$f(x) = 1/x$ définit-elle une application de $\\mathbb R$ dans $\\mathbb R$ ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Non : $0$ n&#39;a pas d&#39;image. Sa restriction à $\\mathbb R^*$ est une application (exemple 4 du polycopié).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « équation ».<\/strong> Pour $y \\in F$, combien de solutions a $f(x) = y$ ? Au plus une : injective. Au moins une : surjective. Exactement une : bijective.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Oublier que l&#39;injectivité dépend des ensembles. $x \\mapsto x^2$ n&#39;est pas injective sur $\\mathbb R$, mais l&#39;est sur $[0 ; 1[$.<\/p>\n<\/aside><p>À la fin, tu sais prouver qu&#39;une application est injective, surjective ou bijective et calculer images directes et réciproques.<\/p>\n<h2>Idée 1 · Une application, des ensembles et un graphe<\/h2>\n<p>Une application $f : E \\to F$ associe à <strong>chaque<\/strong> $x \\in E$ <strong>une seule<\/strong> image $f(x) \\in F$. Deux applications sont égales si elles ont même départ, même arrivée et même graphe.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le polycopié écrit que $f : \\mathbb R \\to \\mathbb R,\\ x \\mapsto x^2$ et $g : \\mathbb R \\to \\mathbb R,\\ x \\mapsto x^2$ « ne sont pas égales » : l&#39;ensemble d&#39;arrivée de $g$ a été perdu. Lis $g : \\mathbb R \\to \\mathbb R_+$. Même formule, arrivées différentes : applications différentes.<\/p>\n<\/aside><p>Composée : $(g \\circ f)(x) = g(f(x))$. Elle est associative mais <strong>pas commutative<\/strong>. Ex. $f(x) = x + 1$ : $f^n(x) = x + n$.<\/p>\n<h2>Idée 2 · Injective, surjective, bijective<\/h2>\n<svg viewBox=\"0 0 600 170\" style=\"width:100%;max-width:620px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Trois diagrammes sagittaux : injective, surjective, bijective\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\n<ellipse cx=\"40\" cy=\"85\" rx=\"25\" ry=\"60\"/><ellipse cx=\"140\" cy=\"85\" rx=\"25\" ry=\"70\"/>\n<ellipse cx=\"240\" cy=\"85\" rx=\"25\" ry=\"70\"/><ellipse cx=\"340\" cy=\"85\" rx=\"25\" ry=\"50\"/>\n<ellipse cx=\"440\" cy=\"85\" rx=\"25\" ry=\"60\"/><ellipse cx=\"540\" cy=\"85\" rx=\"25\" ry=\"60\"/><\/g>\n<g stroke=\"#D9824F\" stroke-width=\"2\">\n<line x1=\"45\" y1=\"50\" x2=\"135\" y2=\"35\"/><line x1=\"45\" y1=\"85\" x2=\"135\" y2=\"75\"/><line x1=\"45\" y1=\"120\" x2=\"135\" y2=\"115\"/>\n<line x1=\"245\" y1=\"40\" x2=\"335\" y2=\"60\"/><line x1=\"245\" y1=\"75\" x2=\"335\" y2=\"60\"/><line x1=\"245\" y1=\"110\" x2=\"335\" y2=\"110\"/><line x1=\"245\" y1=\"140\" x2=\"335\" y2=\"110\"/>\n<line x1=\"445\" y1=\"50\" x2=\"535\" y2=\"50\"/><line x1=\"445\" y1=\"85\" x2=\"535\" y2=\"85\"/><line x1=\"445\" y1=\"120\" x2=\"535\" y2=\"120\"/><\/g>\n<g fill=\"currentColor\"><circle cx=\"135\" cy=\"150\" r=\"4\"/><\/g>\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\">\n<text x=\"90\" y=\"166\">injective<\/text><text x=\"290\" y=\"166\">surjective<\/text><text x=\"490\" y=\"166\">bijective<\/text><\/g>\n<\/svg><ul>\n<li><strong>Injective<\/strong> : $\\forall x, x' \\in E,\\ f(x) = f(x') \\Rightarrow x = x'$ (un point d&#39;arrivée isolé est permis, pas deux flèches vers le même point).<\/li>\n<li><strong>Surjective<\/strong> : $\\forall y \\in F,\\ \\exists x \\in E,\\ y = f(x)$, c&#39;est-à-dire $f(E) = F$.<\/li>\n<li><strong>Bijective<\/strong> : injective et surjective ; alors $f^{-1}$ existe, $f^{-1} \\circ f = \\mathrm{id}_E$, $f \\circ f^{-1} = \\mathrm{id}_F$, et $(g \\circ f)^{-1} = f^{-1} \\circ g^{-1}$.<\/li>\n<\/ul>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Prouver que f(x) = (x+1)/(x−1) est injective sur R∖{1} (exemple 7)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · On suppose f(x) = f(x&#39;)<\/div><p>$\\frac{x+1}{x-1} = \\frac{x'+1}{x'-1}$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · On fait le produit en croix<\/div><p>$(x+1)(x'-1) = (x'+1)(x-1)$, soit $xx' - x + x' - 1 = xx' - x' + x - 1$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · On simplifie<\/div><p>$2x' = 2x$, donc $x = x'$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Conclusion<\/div><p>$f$ est injective. Elle n&#39;est pas surjective sur $\\mathbb R$ : $f(x) = 1$ n&#39;a pas de solution.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p>Composition (théorèmes 7 et 8) : si $g \\circ f$ est injective, alors $f$ est injective ; si $g \\circ f$ est surjective, alors $g$ est surjective.<\/p>\n<h2>Idée 3 · Images directes et réciproques<\/h2>\n<p>$f(A) = \\{f(x) \\mid x \\in A\\}$ (dans $F$) et $f^{-1}(B) = \\{x \\in E \\mid f(x) \\in B\\}$ (dans $E$). La notation $f^{-1}(B)$ a un sens <strong>même si $f$ n&#39;est pas bijective<\/strong>.<\/p>\n<figure class=\"grille\"><figcaption>Ce qui est toujours vrai (orange) et ce qui ne l'est qu'en inclusion (bleu)<\/figcaption><table><tr><th>1<\/th><td class=\"h1\">f(A∪B)=f(A)∪f(B)<\/td><\/tr><tr><th>2<\/th><td class=\"h2\">f(A∩B)⊆f(A)∩f(B)<\/td><\/tr><tr><th>3<\/th><td class=\"h1\">f⁻¹(A∩B)=f⁻¹(A)∩f⁻¹(B)<\/td><\/tr><tr><th>4<\/th><td class=\"h2\">A⊆f⁻¹(f(A))<\/td><\/tr><\/table><\/figure><p><strong>Exemple.<\/strong> Avec $f = \\cos$ : $A = [-\\pi ; 0]$, $B = [0 ; \\pi]$ donnent $f(A) \\cap f(B) = [-1 ; 1]$ mais $f(A \\cap B) = f(\\{0\\}) = \\{1\\}$.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le contre-exemple du polycopié (remarque 21) prend $A = [-\\frac\\pi2, -\\frac{3\\pi}2]$, intervalle mal écrit (bornes inversées). L&#39;exemple ci-dessus le remplace.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices du polycopié<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Montre que si $g \\circ f$ est injective, alors $f$ est injective.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Pars de f(x) = f(x&#39;) et applique g.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Soient $x, x'$ avec $f(x) = f(x')$. Alors $g(f(x)) = g(f(x'))$, donc $x = x'$ par injectivité de $g \\circ f$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>$f : E \\to F$ et $g : F \\to E$ vérifient $f \\circ g = \\mathrm{id}_F$ et $g \\circ f = \\mathrm{id}_E$. Montre que $f$ est bijective de réciproque $g$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$g \\circ f = \\mathrm{id}_E$ est injective, donc $f$ est injective. $f \\circ g = \\mathrm{id}_F$ est surjective, donc $f$ est surjective. Donc $f$ est bijective, et $f^{-1} = f^{-1} \\circ (f \\circ g) = g$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Avec $f = \\sin$, que vaut $f([0 ; \\pi[)$ ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$[0 ; 1]$ (exemple 12 du polycopié) : $\\sin$ croît de 0 à 1 sur $[0 ; \\frac\\pi2]$ puis redescend sans atteindre 0.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">$h : \\mathbb R \\to \\mathbb R,\\ x \\mapsto x^2$ est :<\/div><button class=\"opt\" data-o=\"0\">injective<\/button><button class=\"opt\" data-o=\"1\">surjective<\/button><button class=\"opt\" data-o=\"2\">ni injective ni surjective<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">$\\exp : \\mathbb R \\to ]0 ; +\\infty[$ est :<\/div><button class=\"opt\" data-o=\"0\">injective seulement<\/button><button class=\"opt\" data-o=\"1\">bijective<\/button><button class=\"opt\" data-o=\"2\">surjective seulement<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">$f$ est surjective si et seulement si :<\/div><button class=\"opt\" data-o=\"0\">$f(E) = F$<\/button><button class=\"opt\" data-o=\"1\">$f^{-1}(F) = E$<\/button><button class=\"opt\" data-o=\"2\">$f(x) = f(x') \\Rightarrow x = x'$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Si $g \\circ f$ est surjective, on peut conclure que :<\/div><button class=\"opt\" data-o=\"0\">$f$ est surjective<\/button><button class=\"opt\" data-o=\"1\">$g$ est surjective<\/button><button class=\"opt\" data-o=\"2\">$f$ et $g$ sont bijectives<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">$(g \\circ f)^{-1}$ vaut, pour $f$ et $g$ bijectives :<\/div><button class=\"opt\" data-o=\"0\">$g^{-1} \\circ f^{-1}$<\/button><button class=\"opt\" data-o=\"1\">$f^{-1} \\circ g^{-1}$<\/button><button class=\"opt\" data-o=\"2\">$f \\circ g$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">La notation $f^{-1}(B)$ (image réciproque) a un sens :<\/div><button class=\"opt\" data-o=\"0\">seulement si $f$ est bijective<\/button><button class=\"opt\" data-o=\"1\">pour toute application $f$<\/button><button class=\"opt\" data-o=\"2\">seulement si $f$ est injective<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Toujours vrai :<\/div><button class=\"opt\" data-o=\"0\">$f(A \\cap B) = f(A) \\cap f(B)$<\/button><button class=\"opt\" data-o=\"1\">$f(A \\cup B) = f(A) \\cup f(B)$<\/button><button class=\"opt\" data-o=\"2\">$f^{-1}(f(A)) = A$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Une fonction strictement monotone sur un intervalle est :<\/div><button class=\"opt\" data-o=\"0\">injective<\/button><button class=\"opt\" data-o=\"1\">surjective<\/button><button class=\"opt\" data-o=\"2\">constante<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">$f : \\mathbb R^* \\to \\mathbb R^*,\\ x \\mapsto 1/x$ est :<\/div><button class=\"opt\" data-o=\"0\">non injective<\/button><button class=\"opt\" data-o=\"1\">une involution<\/button><button class=\"opt\" data-o=\"2\">non surjective<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Deux applications sont égales si :<\/div><button class=\"opt\" data-o=\"0\">elles ont la même formule<\/button><button class=\"opt\" data-o=\"1\">elles ont même départ, même arrivée et mêmes images<\/button><button class=\"opt\" data-o=\"2\">elles ont le même ensemble image<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"applications","rep":null,"tol":null},{"n":"applications","rep":null,"tol":null},{"n":"applications","rep":null,"tol":null},{"n":"applications","rep":null,"tol":null}],"qcm":[{"n":"applications","q":"$h : \\mathbb R \\to \\mathbb R,\\ x \\mapsto x^2$ est :","o":["injective","surjective","ni injective ni surjective"],"a":2,"e":"$h(-1) = h(1)$ et $-1$ n&#39;a pas d&#39;antécédent."},{"n":"applications","q":"$\\exp : \\mathbb R \\to ]0 ; +\\infty[$ est :","o":["injective seulement","bijective","surjective seulement"],"a":1,"e":"Strictement croissante et d&#39;image $]0;+\\infty[$ ; sa réciproque est $\\ln$."},{"n":"applications","q":"$f$ est surjective si et seulement si :","o":["$f(E) = F$","$f^{-1}(F) = E$","$f(x) = f(x') \\Rightarrow x = x'$"],"a":0,"e":"$f^{-1}(F) = E$ est toujours vrai ; la dernière définit l&#39;injectivité."},{"n":"applications","q":"Si $g \\circ f$ est surjective, on peut conclure que :","o":["$f$ est surjective","$g$ est surjective","$f$ et $g$ sont bijectives"],"a":1,"e":"Théorème 8 du cours."},{"n":"applications","q":"$(g \\circ f)^{-1}$ vaut, pour $f$ et $g$ bijectives :","o":["$g^{-1} \\circ f^{-1}$","$f^{-1} \\circ g^{-1}$","$f \\circ g$"],"a":1,"e":"On défait d&#39;abord $g$, puis $f$."},{"n":"applications","q":"La notation $f^{-1}(B)$ (image réciproque) a un sens :","o":["seulement si $f$ est bijective","pour toute application $f$","seulement si $f$ est injective"],"a":1,"e":"C&#39;est l&#39;ensemble $\\{x \\mid f(x) \\in B\\}$."},{"n":"applications","q":"Toujours vrai :","o":["$f(A \\cap B) = f(A) \\cap f(B)$","$f(A \\cup B) = f(A) \\cup f(B)$","$f^{-1}(f(A)) = A$"],"a":1,"e":"Pour l&#39;intersection et $f^{-1}(f(A))$, on n&#39;a qu&#39;une inclusion en général."},{"n":"applications","q":"Une fonction strictement monotone sur un intervalle est :","o":["injective","surjective","constante"],"a":0,"e":"Deux points distincts ont des images distinctes."},{"n":"applications","q":"$f : \\mathbb R^* \\to \\mathbb R^*,\\ x \\mapsto 1/x$ est :","o":["non injective","une involution","non surjective"],"a":1,"e":"$f \\circ f = \\mathrm{id}$, donc bijective et égale à sa réciproque."},{"n":"applications","q":"Deux applications sont égales si :","o":["elles ont la même formule","elles ont même départ, même arrivée et mêmes images","elles ont le même ensemble image"],"a":1,"e":"C&#39;est la définition du cours (§2.1.5)."}]},{"id":"relations-binaires","t":"Relations d'équivalence et relations d'ordre","seance":"Chapitre 2 · §2.3 du polycopié","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Il te faut les quantificateurs et la notion de produit cartésien $E \\times E$.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Dans $\\mathbb Z$, $7 - 1$ appartient-il à $2\\mathbb Z$ ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : oui<\/b><\/p><p>Oui : $6 = 2 \\times 3$.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Quatre propriétés, deux recettes.<\/strong> Réflexive + symétrique + transitive = <strong>équivalence<\/strong> (on regroupe). Réflexive + antisymétrique + transitive = <strong>ordre<\/strong> (on classe).<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Croire qu&#39;« antisymétrique » est le contraire de « symétrique ». L&#39;égalité est les deux à la fois ; « divise » sur $\\mathbb Z$ n&#39;est ni l&#39;un ni l&#39;autre ($2 \\mid -2$ et $-2 \\mid 2$ mais $2 \\neq -2$).<\/p>\n<\/aside><p>À la fin, tu sais reconnaître une relation d&#39;équivalence, décrire ses classes, et parler de majorant, maximum, ordre total ou partiel.<\/p>\n<h2>Idée 1 · Les quatre propriétés<\/h2>\n<figure class=\"grille\"><figcaption>Qui a quoi ? (orange = oui)<\/figcaption><table><tr><th><\/th><th>réflexive<\/th><th>symétrique<\/th><th>antisym.<\/th><th>transitive<\/th><\/tr><tr><th>x≤y_(R)<\/th><td class=\"h1\">oui<\/td><td>non<\/td><td class=\"h1\">oui<\/td><td class=\"h1\">oui<\/td><\/tr><tr><th>x−y∈2Z<\/th><td class=\"h1\">oui<\/td><td class=\"h1\">oui<\/td><td>non<\/td><td class=\"h1\">oui<\/td><\/tr><tr><th>A⊆B<\/th><td class=\"h1\">oui<\/td><td>non<\/td><td class=\"h1\">oui<\/td><td class=\"h1\">oui<\/td><\/tr><tr><th>a∣b_(Z)<\/th><td class=\"h1\">oui<\/td><td>non<\/td><td>non<\/td><td class=\"h1\">oui<\/td><\/tr><\/table><\/figure><ul>\n<li>Réflexive : $\\forall x,\\ x\\mathcal R x$. Symétrique : $x \\mathcal R y \\Rightarrow y \\mathcal R x$.<\/li>\n<li>Antisymétrique : $x\\mathcal R y$ et $y \\mathcal R x \\Rightarrow x = y$. Transitive : $x\\mathcal R y$ et $y \\mathcal R z \\Rightarrow x \\mathcal R z$.<\/li>\n<\/ul>\n<h2>Idée 2 · Équivalence et classes : une partition<\/h2>\n<svg viewBox=\"0 0 520 120\" style=\"width:100%;max-width:560px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Z découpé en cinq classes modulo 5\">\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\">\n<rect x=\"10\" y=\"20\" width=\"92\" height=\"70\" rx=\"8\" fill=\"#D9824F\" fill-opacity=\"0.2\" stroke=\"currentColor\"/><text x=\"56\" y=\"45\">Cl(0)<\/text><text x=\"56\" y=\"70\">…,−5,0,5,10…<\/text>\n<rect x=\"112\" y=\"20\" width=\"92\" height=\"70\" rx=\"8\" fill=\"none\" stroke=\"currentColor\"/><text x=\"158\" y=\"45\">Cl(1)<\/text><text x=\"158\" y=\"70\">…,−4,1,6…<\/text>\n<rect x=\"214\" y=\"20\" width=\"92\" height=\"70\" rx=\"8\" fill=\"#D9824F\" fill-opacity=\"0.2\" stroke=\"currentColor\"/><text x=\"260\" y=\"45\">Cl(2)<\/text><text x=\"260\" y=\"70\">…,−3,2,7…<\/text>\n<rect x=\"316\" y=\"20\" width=\"92\" height=\"70\" rx=\"8\" fill=\"none\" stroke=\"currentColor\"/><text x=\"362\" y=\"45\">Cl(3)<\/text><text x=\"362\" y=\"70\">…,−2,3,8…<\/text>\n<rect x=\"418\" y=\"20\" width=\"92\" height=\"70\" rx=\"8\" fill=\"#D9824F\" fill-opacity=\"0.2\" stroke=\"currentColor\"/><text x=\"464\" y=\"45\">Cl(4)<\/text><text x=\"464\" y=\"70\">…,−1,4,9…<\/text>\n<text x=\"260\" y=\"112\">Les classes sont non vides, disjointes, et leur réunion est Z<\/text><\/g>\n<\/svg><p>Classe de $a$ : $\\mathrm{Cl}(a) = \\{x \\in E \\mid x \\mathcal R a\\}$. Théorème 13 : $\\mathrm{Cl}(a) = \\mathrm{Cl}(b) \\iff a \\mathcal R b$, et les classes forment une <strong>partition<\/strong> de $E$.<\/p>\n<p><strong>Exemple (congruence modulo 5).<\/strong> $x \\equiv y \\pmod 5 \\iff 5 \\mid x - y$. $\\mathrm{Cl}(n) = \\{n + 5k \\mid k \\in \\mathbb Z\\}$ ; il y a exactement 5 classes. $17 \\in \\mathrm{Cl}(2)$ car $17 - 2 = 15$.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Montrer que la congruence modulo n est une équivalence<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Réflexive<\/div><p>$x - x = 0 = 0 \\cdot n$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Symétrique<\/div><p>si $x - y = kn$, alors $y - x = (-k)n$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Transitive<\/div><p>si $x - y = kn$ et $y - z = k'n$, alors $x - z = (k + k')n$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Conclusion<\/div><p>c&#39;est une relation d&#39;équivalence.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Idée 3 · Ordre, majorant, maximum<\/h2>\n<p>Un <strong>ordre<\/strong> est réflexif, antisymétrique, transitif. Il est <strong>total<\/strong> si deux éléments sont toujours comparables ($\\le$ sur $\\mathbb R$), <strong>partiel<\/strong> sinon ($\\subseteq$ sur $\\mathcal P(E)$ : $\\{1\\}$ et $\\{2\\}$ ne sont pas comparables).<\/p>\n<ul>\n<li>$M$ <strong>majorant<\/strong> de $A$ : $\\forall x \\in A,\\ x \\le M$ ($M$ n&#39;est pas forcément dans $A$).<\/li>\n<li><strong>Maximum<\/strong> : un majorant qui appartient à $A$. Il est unique. $[0 ; 1[$ est majoré par 1 mais n&#39;a pas de maximum.<\/li>\n<\/ul>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Deux coquilles du polycopié. (1) Ordre lexicographique : il faut lire $(x,y) \\le (x',y') \\iff x &lt; x'$ <strong>ou<\/strong> ($x = x'$ et $y \\le y'$) ; avec « $x \\le x'$ » la relation n&#39;est pas antisymétrique. (2) $(\\mathcal P(E), \\subseteq)$ est partiellement ordonné dès que $\\mathrm{card}(E) \\ge 2$ (et pas « $&gt; 2$ »).<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Pour un ordre partiel, la négation de $x \\le y$ n&#39;est <strong>pas<\/strong> $x &gt; y$ : $x$ et $y$ peuvent être non comparables.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices du polycopié<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Montre que le maximum d&#39;une partie $A$, s&#39;il existe, est unique.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Si $a$ et $a'$ sont deux maximums, $a' \\le a$ (car $a$ majore $A$ et $a' \\in A$) et $a \\le a'$. Par antisymétrie, $a = a'$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Dans $\\mathbb Z$, on pose $x \\mathcal S y \\iff x - y \\in 2\\mathbb Z$. Combien de classes ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 2<\/b><\/p><p>Deux : les pairs $\\mathrm{Cl}(0)$ et les impairs $\\mathrm{Cl}(1)$.<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">$\\le$ sur $\\mathbb R$ est :<\/div><button class=\"opt\" data-o=\"0\">une relation d&#39;ordre total<\/button><button class=\"opt\" data-o=\"1\">une relation d&#39;équivalence<\/button><button class=\"opt\" data-o=\"2\">une relation d&#39;ordre partiel<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">L&#39;inclusion sur $\\mathcal P(\\{1,2\\})$ est :<\/div><button class=\"opt\" data-o=\"0\">un ordre total<\/button><button class=\"opt\" data-o=\"1\">un ordre partiel<\/button><button class=\"opt\" data-o=\"2\">une équivalence<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">« $x - y \\in 2\\mathbb Z$ » sur $\\mathbb Z$ est :<\/div><button class=\"opt\" data-o=\"0\">une relation d&#39;équivalence<\/button><button class=\"opt\" data-o=\"1\">une relation d&#39;ordre<\/button><button class=\"opt\" data-o=\"2\">ni l&#39;une ni l&#39;autre<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">$17$ et $2$ sont-ils dans la même classe modulo 5 ?<\/div><button class=\"opt\" data-o=\"0\">oui<\/button><button class=\"opt\" data-o=\"1\">non<\/button><button class=\"opt\" data-o=\"2\">on ne peut pas savoir<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">La relation « divise » sur $\\mathbb Z$ est :<\/div><button class=\"opt\" data-o=\"0\">une relation d&#39;ordre<\/button><button class=\"opt\" data-o=\"1\">une relation d&#39;équivalence<\/button><button class=\"opt\" data-o=\"2\">ni l&#39;une ni l&#39;autre<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Deux classes d&#39;équivalence distinctes sont :<\/div><button class=\"opt\" data-o=\"0\">incluses l&#39;une dans l&#39;autre<\/button><button class=\"opt\" data-o=\"1\">disjointes<\/button><button class=\"opt\" data-o=\"2\">égales<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">$[0 ; 1[$ dans $\\mathbb R$ :<\/div><button class=\"opt\" data-o=\"0\">a un maximum égal à 1<\/button><button class=\"opt\" data-o=\"1\">est majoré mais n&#39;a pas de maximum<\/button><button class=\"opt\" data-o=\"2\">n&#39;est pas majoré<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Une relation à la fois symétrique et antisymétrique peut-elle exister ?<\/div><button class=\"opt\" data-o=\"0\">oui, l&#39;égalité par exemple<\/button><button class=\"opt\" data-o=\"1\">non, c&#39;est contradictoire<\/button><button class=\"opt\" data-o=\"2\">seulement sur un ensemble vide<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Dans un ordre partiel, la négation de $x \\le y$ est :<\/div><button class=\"opt\" data-o=\"0\">$x &gt; y$<\/button><button class=\"opt\" data-o=\"1\">$x$ et $y$ non comparables, ou $y &lt; x$<\/button><button class=\"opt\" data-o=\"2\">$x = y$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">L&#39;ordre lexicographique correct sur $\\mathbb R^2$ est :<\/div><button class=\"opt\" data-o=\"0\">$x \\le x'$ ou ($x = x'$ et $y \\le y'$)<\/button><button class=\"opt\" data-o=\"1\">$x &lt; x'$ ou ($x = x'$ et $y \\le y'$)<\/button><button class=\"opt\" data-o=\"2\">$x \\le x'$ et $y \\le y'$<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"relations-binaires","rep":["oui"],"tol":null},{"n":"relations-binaires","rep":null,"tol":null},{"n":"relations-binaires","rep":["2"],"tol":null}],"qcm":[{"n":"relations-binaires","q":"$\\le$ sur $\\mathbb R$ est :","o":["une relation d&#39;ordre total","une relation d&#39;équivalence","une relation d&#39;ordre partiel"],"a":0,"e":"Réflexive, antisymétrique, transitive, et deux réels sont toujours comparables."},{"n":"relations-binaires","q":"L&#39;inclusion sur $\\mathcal P(\\{1,2\\})$ est :","o":["un ordre total","un ordre partiel","une équivalence"],"a":1,"e":"$\\{1\\}$ et $\\{2\\}$ ne sont pas comparables."},{"n":"relations-binaires","q":"« $x - y \\in 2\\mathbb Z$ » sur $\\mathbb Z$ est :","o":["une relation d&#39;équivalence","une relation d&#39;ordre","ni l&#39;une ni l&#39;autre"],"a":0,"e":"Réflexive, symétrique, transitive (exemple 13)."},{"n":"relations-binaires","q":"$17$ et $2$ sont-ils dans la même classe modulo 5 ?","o":["oui","non","on ne peut pas savoir"],"a":0,"e":"$17 - 2 = 15 = 3 \\times 5$."},{"n":"relations-binaires","q":"La relation « divise » sur $\\mathbb Z$ est :","o":["une relation d&#39;ordre","une relation d&#39;équivalence","ni l&#39;une ni l&#39;autre"],"a":2,"e":"Elle n&#39;est ni symétrique, ni antisymétrique ($2 \\mid -2$ et $-2 \\mid 2$)."},{"n":"relations-binaires","q":"Deux classes d&#39;équivalence distinctes sont :","o":["incluses l&#39;une dans l&#39;autre","disjointes","égales"],"a":1,"e":"Elles forment une partition."},{"n":"relations-binaires","q":"$[0 ; 1[$ dans $\\mathbb R$ :","o":["a un maximum égal à 1","est majoré mais n&#39;a pas de maximum","n&#39;est pas majoré"],"a":1,"e":"$1$ majore mais n&#39;appartient pas à l&#39;ensemble."},{"n":"relations-binaires","q":"Une relation à la fois symétrique et antisymétrique peut-elle exister ?","o":["oui, l&#39;égalité par exemple","non, c&#39;est contradictoire","seulement sur un ensemble vide"],"a":0,"e":"Antisymétrique n&#39;est pas la négation de symétrique."},{"n":"relations-binaires","q":"Dans un ordre partiel, la négation de $x \\le y$ est :","o":["$x &gt; y$","$x$ et $y$ non comparables, ou $y &lt; x$","$x = y$"],"a":1,"e":"Remarque 22 du polycopié."},{"n":"relations-binaires","q":"L&#39;ordre lexicographique correct sur $\\mathbb R^2$ est :","o":["$x \\le x'$ ou ($x = x'$ et $y \\le y'$)","$x &lt; x'$ ou ($x = x'$ et $y \\le y'$)","$x \\le x'$ et $y \\le y'$"],"a":1,"e":"Avec $x \\le x'$, on aurait $(0,1) \\le (0,0)$ et $(0,0) \\le (0,1)$ : pas antisymétrique. La troisième est l&#39;ordre produit, partiel."}]},{"id":"arithmetique","t":"Arithmétique dans Z","seance":"Chapitre 3 du polycopié","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il te faut la division « à la main » avec quotient et reste, et la récurrence.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Quotient et reste de la division de 366 par 43 ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$366 = 43 \\times 8 + 22$ : quotient 8, reste 22 (et $0 \\le 22 &lt; 43$).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Tout passe par Euclide et Bézout.<\/strong> L&#39;algorithme d&#39;Euclide donne le PGCD ; en remontant ses lignes, il donne $u, v$ avec $au + bv = a \\wedge b$. Gauss et la résolution de $ax + by = c$ en découlent.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Oublier que le reste d&#39;une division par $b$ vérifie $0 \\le r &lt; b$. Pour $a = -7$ et $b = 3$ : $-7 = 3 \\times (-3) + 2$, et non $3 \\times (-2) - 1$.<\/p>\n<\/aside><p>À la fin, tu sais calculer un PGCD, un couple de Bézout, résoudre $ax + by = c$ dans $\\mathbb Z^2$ et utiliser la décomposition en facteurs premiers.<\/p>\n<h2>Idée 1 · Divisibilité et division euclidienne<\/h2>\n<p>$a \\mid b \\iff \\exists k \\in \\mathbb Z,\\ b = ka$. Si $a \\mid b$ et $a \\mid c$, alors $a \\mid k_1 b + k_2 c$ (propriété 3) : c&#39;est l&#39;outil n°1 des TD.<\/p>\n<p>Théorème 15 : pour $a \\in \\mathbb Z$ et $b \\in \\mathbb N^*$, il existe un <strong>unique<\/strong> $(q, r)$ avec $a = bq + r$ et $0 \\le r &lt; b$.<\/p>\n<p><strong>Exemple (TD 2, ex. 2).<\/strong> $n - 1 \\mid n + 3$. Or $n + 3 = (n - 1) + 4$, donc $n - 1 \\mid 4$ : $n - 1 \\in \\{1, 2, 4\\}$ ou $n - 1 = -1$, soit $n \\in \\{0, 2, 3, 5\\}$.<\/p>\n<h2>Idée 2 · Algorithme d&#39;Euclide et Bézout<\/h2>\n<p>Théorème 14 : si $a = bq + r$, alors $a \\wedge b = b \\wedge r$. Le dernier reste non nul est le PGCD.<\/p>\n<figure class=\"grille\"><figcaption>Euclide pour 22 et 17 (exemple 18 du polycopié)<\/figcaption><table><tr><th><\/th><th>division<\/th><th>reste<\/th><th>u<\/th><th>v<\/th><\/tr><tr><th>r0<\/th><td>.<\/td><td>22<\/td><td>1<\/td><td>0<\/td><\/tr><tr><th>r1<\/th><td>.<\/td><td>17<\/td><td>0<\/td><td>1<\/td><\/tr><tr><th>r2<\/th><td>22=17×1+5<\/td><td>5<\/td><td>1<\/td><td>−1<\/td><\/tr><tr><th>r3<\/th><td>17=5×3+2<\/td><td>2<\/td><td>−3<\/td><td>4<\/td><\/tr><tr><th>r4<\/th><td>5=2×2+1<\/td><td class=\"h1\">1<\/td><td class=\"h1\">7<\/td><td class=\"h1\">−9<\/td><\/tr><\/table><\/figure><p>Chaque ligne vérifie $r_k = u_k \\cdot 22 + v_k \\cdot 17$ ; on calcule $u_{k+1} = u_{k-1} - q_k u_k$ (idem pour $v$). Donc $1 = 7 \\times 22 - 9 \\times 17$ ($154 - 153 = 1$).<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Dans la remarque 26, le polycopié écrit « $0 &lt; r_{k+1} \\le r_k$ » : il faut lire $0 \\le r_{k+1} &lt; r_k$ (reste strictement plus petit que le diviseur).<\/p>\n<\/aside><p><strong>Bézout (théorème 16)<\/strong> : $a \\wedge b = 1 \\iff \\exists (u, v) \\in \\mathbb Z^2,\\ au + bv = 1$.\n<strong>Gauss (théorème 17)<\/strong> : si $a \\mid bc$ et $a \\wedge b = 1$, alors $a \\mid c$.\n<strong>PPCM<\/strong> : $(a \\wedge b)(a \\vee b) = |ab|$.<\/p>\n<h2>Idée 3 · Résoudre $ax + by = c$<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Résoudre 15x + 8y = 1000 dans Z² (TD 2, ex. 10)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Solution particulière de 15x + 8y = 1<\/div><p>$15 = 8 + 7$, $8 = 7 + 1$, donc $1 = 8 - 7 = 8 - (15 - 8) = 2 \\times 8 - 15$ : $(x_0, y_0) = (-1, 2)$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Pour 1000 on multiplie<\/div><p>$(-1000, 2000)$ est solution.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · On soustrait<\/div><p>$15(x + 1000) = -8(y - 2000)$. Comme $15 \\wedge 8 = 1$, Gauss donne $8 \\mid x + 1000$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Solutions<\/div><p>$x = -1000 + 8k$, $y = 2000 - 15k$, $k \\in \\mathbb Z$ (et toutes conviennent).<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p><strong>Exemple.<\/strong> $11x + 16y = 0$ (TD 2, ex. 8) : $11x = -16y$, $11 \\wedge 16 = 1$, donc $16 \\mid x$ : $(x, y) = (16k, -11k)$.<\/p>\n<h2>Idée 4 · Nombres premiers<\/h2>\n<p>$p$ est premier si $p \\ge 2$ et ses seuls diviseurs positifs sont 1 et $p$. Tout entier $\\ge 2$ a un diviseur premier, et il y a une infinité de premiers (preuve : $n! + 1$).<\/p>\n<p><strong>Décomposition (théorème 19)<\/strong> : $n = p_1^{\\alpha_1} \\cdots p_m^{\\alpha_m}$, unique. Puis $a \\wedge b = \\prod p^{\\min}$ et $a \\vee b = \\prod p^{\\max}$.<\/p>\n<p><strong>Exemple.<\/strong> $360 = 2^3 \\cdot 3^2 \\cdot 5$ et $84 = 2^2 \\cdot 3 \\cdot 7$ : PGCD $= 2^2 \\cdot 3 = 12$, PPCM $= 2^3 \\cdot 3^2 \\cdot 5 \\cdot 7 = 2520$. Vérif : $12 \\times 2520 = 30240 = 360 \\times 84$.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Propriété 7.1 du polycopié : « $n \\mid a$ ou bien $n \\nmid a$ » est une tautologie. L&#39;énoncé voulu : si $p$ est premier, alors $p \\mid a$ <strong>ou<\/strong> $p \\wedge a = 1$.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices du TD 2<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Calcule $\\mathrm{PGCD}(n, 2n+1)$ pour $n \\ge 1$.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1<\/b><\/p><p>$2n + 1 = 2 \\times n + 1$, donc $n \\wedge (2n+1) = n \\wedge 1 = 1$. Le PPCM vaut donc $n(2n+1)$.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>$a \\wedge b = d$. Que vaut $\\mathrm{PGCD}(13a + 5b,\\ 5a + 2b)$ ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Le déterminant 13·2 − 5·5 vaut 1.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Soit $\\delta$ ce PGCD. $\\delta$ divise $x = 13a + 5b$ et $y = 5a + 2b$, donc $2x - 5y = a$ et $13y - 5x = b$ : $\\delta \\mid d$. Inversement $d \\mid x$ et $d \\mid y$. Donc $\\delta = d$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Montre que le carré de tout entier naturel est de la forme $5n - 1$, $5n$ ou $5n + 1$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>On écrit $a = 5q + r$, $r \\in \\{0,\\dots,4\\}$. $a^2 \\equiv r^2 \\pmod 5$ et $r^2 \\in \\{0, 1, 4, 9, 16\\} \\equiv \\{0, 1, -1, -1, 1\\}$. Donc $a^2 \\equiv 0$ ou $\\pm 1 \\pmod 5$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">$366 \\wedge 43$ vaut :<\/div><button class=\"opt\" data-o=\"0\">1<\/button><button class=\"opt\" data-o=\"1\">43<\/button><button class=\"opt\" data-o=\"2\">22<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Le reste de la division euclidienne de $-7$ par $3$ est :<\/div><button class=\"opt\" data-o=\"0\">$-1$<\/button><button class=\"opt\" data-o=\"1\">$2$<\/button><button class=\"opt\" data-o=\"2\">$1$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Si $a \\mid bc$ et $a \\wedge b = 1$, alors :<\/div><button class=\"opt\" data-o=\"0\">$a \\mid c$<\/button><button class=\"opt\" data-o=\"1\">$a \\mid b$<\/button><button class=\"opt\" data-o=\"2\">$a = c$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">$12 \\vee 18$ (PPCM) vaut :<\/div><button class=\"opt\" data-o=\"0\">6<\/button><button class=\"opt\" data-o=\"1\">36<\/button><button class=\"opt\" data-o=\"2\">216<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">$1 = 7 \\times 22 - 9 \\times 17$ montre que :<\/div><button class=\"opt\" data-o=\"0\">$22 \\wedge 17 = 1$<\/button><button class=\"opt\" data-o=\"1\">$22 \\wedge 17 = 7$<\/button><button class=\"opt\" data-o=\"2\">$22$ divise $17$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Les solutions entières de $11x + 16y = 0$ sont :<\/div><button class=\"opt\" data-o=\"0\">$(16k, -11k)$, $k \\in \\mathbb Z$<\/button><button class=\"opt\" data-o=\"1\">$(11k, -16k)$<\/button><button class=\"opt\" data-o=\"2\">seulement $(0, 0)$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Si $a \\mid b$ et $a \\mid c$, alors :<\/div><button class=\"opt\" data-o=\"0\">$a \\mid bc$ seulement<\/button><button class=\"opt\" data-o=\"1\">$a \\mid 3b - 5c$<\/button><button class=\"opt\" data-o=\"2\">$b \\mid c$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">$\\mathrm{PGCD}(2n+2, 4n+2)$ vaut :<\/div><button class=\"opt\" data-o=\"0\">1<\/button><button class=\"opt\" data-o=\"1\">2<\/button><button class=\"opt\" data-o=\"2\">$2n + 2$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">$360 = 2^3 \\cdot 3^2 \\cdot 5$ et $84 = 2^2 \\cdot 3 \\cdot 7$. Leur PGCD vaut :<\/div><button class=\"opt\" data-o=\"0\">12<\/button><button class=\"opt\" data-o=\"1\">6<\/button><button class=\"opt\" data-o=\"2\">2520<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Un carré d&#39;entier peut-il être de la forme $5n + 2$ ?<\/div><button class=\"opt\" data-o=\"0\">oui<\/button><button class=\"opt\" data-o=\"1\">non<\/button><button class=\"opt\" data-o=\"2\">seulement si l&#39;entier est pair<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"arithmetique","rep":null,"tol":null},{"n":"arithmetique","rep":["1"],"tol":null},{"n":"arithmetique","rep":null,"tol":null},{"n":"arithmetique","rep":null,"tol":null}],"qcm":[{"n":"arithmetique","q":"$366 \\wedge 43$ vaut :","o":["1","43","22"],"a":0,"e":"Euclide : restes 22, 21, 1, 0 (exemple 17)."},{"n":"arithmetique","q":"Le reste de la division euclidienne de $-7$ par $3$ est :","o":["$-1$","$2$","$1$"],"a":1,"e":"$-7 = 3 \\times (-3) + 2$ avec $0 \\le 2 &lt; 3$."},{"n":"arithmetique","q":"Si $a \\mid bc$ et $a \\wedge b = 1$, alors :","o":["$a \\mid c$","$a \\mid b$","$a = c$"],"a":0,"e":"C&#39;est le lemme de Gauss."},{"n":"arithmetique","q":"$12 \\vee 18$ (PPCM) vaut :","o":["6","36","216"],"a":1,"e":"$12 \\wedge 18 = 6$ et $6 \\times \\mathrm{PPCM} = 216$."},{"n":"arithmetique","q":"$1 = 7 \\times 22 - 9 \\times 17$ montre que :","o":["$22 \\wedge 17 = 1$","$22 \\wedge 17 = 7$","$22$ divise $17$"],"a":0,"e":"Bézout : une combinaison égale à 1 prouve que le PGCD vaut 1."},{"n":"arithmetique","q":"Les solutions entières de $11x + 16y = 0$ sont :","o":["$(16k, -11k)$, $k \\in \\mathbb Z$","$(11k, -16k)$","seulement $(0, 0)$"],"a":0,"e":"$16 \\mid 11x$ et $16 \\wedge 11 = 1$, donc $16 \\mid x$."},{"n":"arithmetique","q":"Si $a \\mid b$ et $a \\mid c$, alors :","o":["$a \\mid bc$ seulement","$a \\mid 3b - 5c$","$b \\mid c$"],"a":1,"e":"$a$ divise toute combinaison $k_1 b + k_2 c$."},{"n":"arithmetique","q":"$\\mathrm{PGCD}(2n+2, 4n+2)$ vaut :","o":["1","2","$2n + 2$"],"a":1,"e":"$= 2 \\cdot \\mathrm{PGCD}(n+1, 2n+1) = 2 \\cdot \\mathrm{PGCD}(n+1, 1) = 2$, car $2n+1 = 2(n+1) - 1$."},{"n":"arithmetique","q":"$360 = 2^3 \\cdot 3^2 \\cdot 5$ et $84 = 2^2 \\cdot 3 \\cdot 7$. Leur PGCD vaut :","o":["12","6","2520"],"a":0,"e":"On prend les plus petits exposants : $2^2 \\cdot 3$."},{"n":"arithmetique","q":"Un carré d&#39;entier peut-il être de la forme $5n + 2$ ?","o":["oui","non","seulement si l&#39;entier est pair"],"a":1,"e":"Les carrés modulo 5 sont 0, 1 ou 4."}]},{"id":"groupes","t":"Lois de composition interne et groupes","seance":"Chapitre 4 · §4.1 à 4.4 du polycopié","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il te faut savoir prouver un « pour tout » et connaître les applications bijectives (chapitre 3).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>La soustraction est-elle associative sur $\\mathbb Z$ ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Non : $(5 - 3) - 1 = 1$ mais $5 - (3 - 1) = 3$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Un groupe, c&#39;est une liste de contrôle.<\/strong> Loi interne, associative, neutre, inverses. Coche les quatre cases dans l&#39;ordre. Pour un sous-groupe, on a un raccourci qui évite l&#39;associativité.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Chercher des inverses <strong>avant<\/strong> d&#39;avoir trouvé le neutre. Sans neutre, la notion d&#39;inverse n&#39;a pas de sens (remarque 32).<\/p>\n<\/aside><p>À la fin, tu sais montrer qu&#39;un ensemble est un groupe, un sous-groupe, et qu&#39;une application est un morphisme.<\/p>\n<h2>Idée 1 · Loi de composition interne et ses propriétés<\/h2>\n<p>Une lci sur $E$ est une application $E \\times E \\to E$, notée $(a, b) \\mapsto a \\star b$. Elle peut être commutative, associative, avoir un neutre $e$ (unique s&#39;il existe), et des éléments inversibles.<\/p>\n<figure class=\"grille\"><figcaption>Exemples du c
