ours<\/figcaption><table><tr><th><\/th><th>loi<\/th><th>assoc.<\/th><th>comm.<\/th><th>neutre<\/th><\/tr><tr><th>(N,+)<\/th><td>+<\/td><td class=\"h1\">oui<\/td><td class=\"h1\">oui<\/td><td>0<\/td><\/tr><tr><th>(Z,×)<\/th><td>×<\/td><td class=\"h1\">oui<\/td><td class=\"h1\">oui<\/td><td>1<\/td><\/tr><tr><th>(F(R,R),∘)<\/th><td>∘<\/td><td class=\"h1\">oui<\/td><td class=\"h2\">non<\/td><td>id<\/td><\/tr><tr><th>(P(G),∪)<\/th><td>∪<\/td><td class=\"h1\">oui<\/td><td class=\"h1\">oui<\/td><td>∅<\/td><\/tr><\/table><\/figure><p><strong>Exemple (exercice 32 du polycopié).<\/strong> Sur $\\mathbb R^2$ : $(x, y) \\star (x', y') = (xx' - yy',\\ xy' + yx')$. C&#39;est le produit des complexes $x + iy$ ! Donc $\\star$ est commutative, associative, de neutre $(1, 0)$.<\/p>\n<p>Inverse d&#39;un produit : $(a \\star b)^{-1} = b^{-1} \\star a^{-1}$ (l&#39;ordre s&#39;inverse).<\/p>\n<h2>Idée 2 · Groupe<\/h2>\n<figure class=\"flux\"><figcaption>Les quatre axiomes<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">lci<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">associative<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">neutre e<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">tout x a un inverse<\/div><\/div><\/figure><p>Si en plus la loi est commutative, le groupe est <strong>abélien<\/strong>. Groupes de référence : $(\\mathbb Z, +)$, $(\\mathbb R^*, \\times)$, $(\\mathbb U, \\times)$, $(\\mathcal S_E, \\circ)$ (non abélien si $\\mathrm{card}\\,E \\ge 3$).<\/p>\n<p><strong>Contre-exemples.<\/strong> $(\\mathbb N, +)$ : seul 0 a un opposé. $(\\mathbb Z, \\times)$ : seuls $\\pm 1$ sont inversibles.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le polycopié écrit (remarque 36) que $(\\mathcal S_E, \\circ)$ est non abélien « si $E$ est non vide ». C&#39;est faux pour $\\mathrm{card}\\,E \\le 2$ : il faut au moins 3 éléments.<\/p>\n<\/aside><h2>Idée 3 · Sous-groupe : le test en 4 étapes<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>H est un sous-groupe de (G, ⋆)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Partie<\/div><p>$H \\subseteq G$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Neutre<\/div><p>$e_G \\in H$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Stable par la loi<\/div><p>$\\forall x, y \\in H,\\ x \\star y \\in H$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Stable par inverse<\/div><p>$\\forall x \\in H,\\ x^{-1} \\in H$. Pas besoin de vérifier l&#39;associativité.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p><strong>Exemple.<\/strong> $\\mathbb U = \\{z \\in \\mathbb C \\mid |z| = 1\\}$ dans $(\\mathbb C^*, \\times)$ : $|1| = 1$ ; $|zz'| = |z||z'| = 1$ ; $|1/z| = 1/|z| = 1$. Sous-groupe.<\/p>\n<p><strong>Contre-exemple.<\/strong> $2\\mathbb Z + 1$ (les impairs) ne contient pas 0 : pas un sous-groupe de $(\\mathbb Z, +)$.<\/p>\n<p>Les sous-groupes de $(\\mathbb Z, +)$ sont exactement les $n\\mathbb Z$ (exercice 34).<\/p>\n<h2>Idée 4 · Morphismes de groupes<\/h2>\n<p>$f : (G_1, \\star) \\to (G_2, \\cdot)$ est un morphisme si $f(x \\star y) = f(x) \\cdot f(y)$ pour tous $x, y$. Alors $f(e_1) = e_2$ et $f(x^{-1}) = f(x)^{-1}$.<\/p>\n<p><strong>Exemple.<\/strong> $\\exp : (\\mathbb R, +) \\to (\\mathbb R_+^*, \\times)$, car $e^{x+y} = e^x e^y$. Autre : $n \\mapsto a^n$ de $(\\mathbb Z, +)$ dans $(G, \\cdot)$ (exemple 31), et $\\theta \\mapsto e^{i\\theta}$ de $(\\mathbb R, +)$ dans $(\\mathbb U, \\times)$.<\/p>\n<aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>$(ab)^n = a^n b^n$ n&#39;est vrai que si $a$ et $b$ commutent (remarque 39).<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices du polycopié et du TD 3<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Montre que le centre $C = \\{x \\in G \\mid \\forall g,\\ gx = xg\\}$ est un sous-groupe de $G$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$C \\subseteq G$ ; $e \\in C$ car $ge = eg = g$. Si $x, y \\in C$ : $g(xy) = (gx)y = x(gy) = x(yg) = (xy)g$, donc $xy \\in C$. Si $x \\in C$ : de $gx = xg$, on multiplie par $x^{-1}$ à gauche et à droite : $x^{-1}g = gx^{-1}$, donc $x^{-1} \\in C$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Soit $G$ un groupe. Montre que $f(x) = x^{-1}$ est un morphisme si et seulement si $G$ est abélien.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$f(xy) = (xy)^{-1} = y^{-1}x^{-1}$ et $f(x)f(y) = x^{-1}y^{-1}$. Si $G$ est abélien, ils sont égaux. Réciproquement, si $f$ est un morphisme, $y^{-1}x^{-1} = x^{-1}y^{-1}$ pour tous $x, y$ ; en passant à l&#39;inverse, $xy = yx$. De plus $f$ est une involution, donc bijective : c&#39;est un isomorphisme.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Pour la loi $(x,y) \\star (x',y') = (xx' - yy', xy' + yx')$, quel est l&#39;inverse de $(0, 2)$ ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>(0, 2) correspond à 2i.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>$1/(2i) = -i/2$, donc $(0, -\\tfrac12)$. Vérif : $(0 \\cdot 0 - 2 \\cdot (-\\tfrac12),\\ 0) = (1, 0)$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">$(\\mathbb N, +)$ est-il un groupe ?<\/div><button class=\"opt\" data-o=\"0\">oui<\/button><button class=\"opt\" data-o=\"1\">non, seul 0 a un opposé dans $\\mathbb N$<\/button><button class=\"opt\" data-o=\"2\">non, + n&#39;est pas associative<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Le neutre de $(\\mathcal P(G), \\cup)$ est :<\/div><button class=\"opt\" data-o=\"0\">$\\emptyset$<\/button><button class=\"opt\" data-o=\"1\">$G$<\/button><button class=\"opt\" data-o=\"2\">il n&#39;y en a pas<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Dans un groupe, $(ab)^{-1}$ vaut :<\/div><button class=\"opt\" data-o=\"0\">$a^{-1}b^{-1}$<\/button><button class=\"opt\" data-o=\"1\">$b^{-1}a^{-1}$<\/button><button class=\"opt\" data-o=\"2\">$ab$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Pour montrer qu&#39;une partie $H$ est un sous-groupe, on n&#39;a pas besoin de vérifier :<\/div><button class=\"opt\" data-o=\"0\">l&#39;associativité<\/button><button class=\"opt\" data-o=\"1\">que $e \\in H$<\/button><button class=\"opt\" data-o=\"2\">la stabilité par inverse<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">$(\\mathbb U, \\times)$ est :<\/div><button class=\"opt\" data-o=\"0\">un sous-groupe de $(\\mathbb C^*, \\times)$<\/button><button class=\"opt\" data-o=\"1\">un sous-groupe de $(\\mathbb C, +)$<\/button><button class=\"opt\" data-o=\"2\">pas un groupe<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">$\\exp : (\\mathbb R, +) \\to (\\mathbb R_+^*, \\times)$ est un morphisme car :<\/div><button class=\"opt\" data-o=\"0\">$e^{xy} = e^x + e^y$<\/button><button class=\"opt\" data-o=\"1\">$e^{x+y} = e^x e^y$<\/button><button class=\"opt\" data-o=\"2\">$e^0 = 0$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">$(\\mathbb Z, \\times)$ :<\/div><button class=\"opt\" data-o=\"0\">est un groupe<\/button><button class=\"opt\" data-o=\"1\">n&#39;est pas un groupe : seuls $1$ et $-1$ sont inversibles<\/button><button class=\"opt\" data-o=\"2\">n&#39;a pas de neutre<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">La loi $(x,y)\\star(x',y') = (xx'-yy', xy'+yx')$ a pour neutre :<\/div><button class=\"opt\" data-o=\"0\">$(0, 0)$<\/button><button class=\"opt\" data-o=\"1\">$(1, 0)$<\/button><button class=\"opt\" data-o=\"2\">$(1, 1)$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Dans un groupe non abélien, $(ab)^2$ vaut :<\/div><button class=\"opt\" data-o=\"0\">toujours $a^2 b^2$<\/button><button class=\"opt\" data-o=\"1\">$abab$, différent de $a^2b^2$ en général<\/button><button class=\"opt\" data-o=\"2\">$e$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Le neutre d&#39;un magma, s&#39;il existe, est :<\/div><button class=\"opt\" data-o=\"0\">unique<\/button><button class=\"opt\" data-o=\"1\">jamais unique<\/button><button class=\"opt\" data-o=\"2\">unique seulement si la loi est commutative<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"groupes","rep":null,"tol":null},{"n":"groupes","rep":null,"tol":null},{"n":"groupes","rep":null,"tol":null},{"n":"groupes","rep":null,"tol":null}],"qcm":[{"n":"groupes","q":"$(\\mathbb N, +)$ est-il un groupe ?","o":["oui","non, seul 0 a un opposé dans $\\mathbb N$","non, + n&#39;est pas associative"],"a":1,"e":"$-1 \\notin \\mathbb N$."},{"n":"groupes","q":"Le neutre de $(\\mathcal P(G), \\cup)$ est :","o":["$\\emptyset$","$G$","il n&#39;y en a pas"],"a":0,"e":"$A \\cup \\emptyset = A$."},{"n":"groupes","q":"Dans un groupe, $(ab)^{-1}$ vaut :","o":["$a^{-1}b^{-1}$","$b^{-1}a^{-1}$","$ab$"],"a":1,"e":"$(ab)(b^{-1}a^{-1}) = e$."},{"n":"groupes","q":"Pour montrer qu&#39;une partie $H$ est un sous-groupe, on n&#39;a pas besoin de vérifier :","o":["l&#39;associativité","que $e \\in H$","la stabilité par inverse"],"a":0,"e":"Elle est héritée de $G$."},{"n":"groupes","q":"$(\\mathbb U, \\times)$ est :","o":["un sous-groupe de $(\\mathbb C^*, \\times)$","un sous-groupe de $(\\mathbb C, +)$","pas un groupe"],"a":0,"e":"Module 1 stable par produit et inverse."},{"n":"groupes","q":"$\\exp : (\\mathbb R, +) \\to (\\mathbb R_+^*, \\times)$ est un morphisme car :","o":["$e^{xy} = e^x + e^y$","$e^{x+y} = e^x e^y$","$e^0 = 0$"],"a":1,"e":"La loi de départ est $+$, celle d&#39;arrivée $\\times$."},{"n":"groupes","q":"$(\\mathbb Z, \\times)$ :","o":["est un groupe","n&#39;est pas un groupe : seuls $1$ et $-1$ sont inversibles","n&#39;a pas de neutre"],"a":1,"e":"$2$ n&#39;a pas d&#39;inverse dans $\\mathbb Z$."},{"n":"groupes","q":"La loi $(x,y)\\star(x',y') = (xx'-yy', xy'+yx')$ a pour neutre :","o":["$(0, 0)$","$(1, 0)$","$(1, 1)$"],"a":1,"e":"C&#39;est le produit des complexes ; le neutre est $1 = (1, 0)$."},{"n":"groupes","q":"Dans un groupe non abélien, $(ab)^2$ vaut :","o":["toujours $a^2 b^2$","$abab$, différent de $a^2b^2$ en général","$e$"],"a":1,"e":"$a^2b^2 = abab$ équivaut à $ab = ba$."},{"n":"groupes","q":"Le neutre d&#39;un magma, s&#39;il existe, est :","o":["unique","jamais unique","unique seulement si la loi est commutative"],"a":0,"e":"Si $e$ et $e'$ sont neutres, $e = e \\star e' = e'$."}]},{"id":"anneaux-corps","t":"Anneaux et corps","seance":"Chapitre 4 §4.5 et chapitre 5 du polycopié","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Il te faut la définition d&#39;un groupe abélien (chapitre précédent).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>$(\\mathbb Q^*, \\times)$ est-il un groupe abélien ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : oui<\/b><\/p><p>Oui : produit associatif et commutatif, neutre 1, inverse $1/x$.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Un anneau = un groupe pour + et « presque » un groupe pour ×.<\/strong> On garde associativité, neutre 1 et distributivité, mais pas les inverses. Un corps, c&#39;est quand tous les non nuls deviennent inversibles.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Simplifier $ab = 0$ en « $a = 0$ ou $b = 0$ » dans n&#39;importe quel anneau. Dans $\\mathbb Z/4\\mathbb Z$, $2 \\times 2 = 0$ avec $2 \\neq 0$.<\/p>\n<\/aside><p>À la fin, tu sais vérifier qu&#39;un ensemble est un anneau, trouver ses inversibles et ses diviseurs de zéro, et utiliser le binôme.<\/p>\n<h2>Idée 1 · Anneau<\/h2>\n<figure class=\"flux\"><figcaption>Définition (A, +, ×)<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">(A,+) groupe abélien<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">× associative<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">× distributive sur +<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">neutre 1 pour ×<\/div><\/div><\/figure><p>Exemples : $\\mathbb Z, \\mathbb Q, \\mathbb R, \\mathbb C$, $\\mathbb R[X]$, $\\mathbb R^{\\mathbb N}$, $M_n(\\mathbb R)$ (non commutatif).<\/p>\n<p>Règles (théorème 28) : $a \\times 0 = 0$, $(-a)b = -(ab)$, $(-a)(-b) = ab$.<\/p>\n<p><strong>Inversibles<\/strong> : $A^* = \\{a \\mid \\exists a',\\ aa' = a'a = 1\\}$ est un <strong>groupe<\/strong> (groupe des unités). Dans $\\mathbb Z$ : $\\{1, -1\\}$.<\/p>\n<h2>Idée 2 · $\\mathbb Z/n\\mathbb Z$ et les diviseurs de zéro<\/h2>\n<figure class=\"grille\"><figcaption>Table de × dans Z/4Z (orange : produit nul avec facteurs non nuls)<\/figcaption><table><tr><th><\/th><th>×<\/th><th>0<\/th><th>1<\/th><th>2<\/th><th>3<\/th><\/tr><tr><th>0<\/th><td>0<\/td><td>0<\/td><td>0<\/td><td>0<\/td><td>0<\/td><\/tr><tr><th>1<\/th><td>0<\/td><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><\/tr><tr><th>2<\/th><td>0<\/td><td>0<\/td><td>2<\/td><td class=\"h1\">0<\/td><td>2<\/td><\/tr><tr><th>3<\/th><td>0<\/td><td>0<\/td><td>3<\/td><td>2<\/td><td>1<\/td><\/tr><\/table><\/figure><p>Dans $\\mathbb Z/n\\mathbb Z$, on calcule puis on prend le reste modulo $n$. Ici $2 \\times 2 = 4 \\equiv 0$ : 2 est un <strong>diviseur de zéro<\/strong>. Inversibles de $\\mathbb Z/4\\mathbb Z$ : $1$ et $3$ ($3 \\times 3 = 9 \\equiv 1$).<\/p>\n<p>Un anneau commutatif sans diviseur de zéro est <strong>intègre<\/strong> (ex. $\\mathbb Z$, $K[X]$).<\/p>\n<h2>Idée 3 · Binôme et factorisation (si $ab = ba$)<\/h2>\n<p>$$(a + b)^n = \\sum_{k=0}^n \\binom nk a^k b^{n-k}, \\qquad a^n - b^n = (a - b)\\sum_{k=0}^{n-1} a^{n-1-k}b^k.$$<\/p>\n<p>En particulier $1 - a^n = (1 - a)(1 + a + \\dots + a^{n-1})$.<\/p>\n<p><strong>Exemple (TD 3, ex. 6).<\/strong> Si $x^m = 0$ ($x$ nilpotent), alors $1 = 1 - x^m = (1 - x)(1 + x + \\dots + x^{m-1})$ : $1 - x$ est inversible, d&#39;inverse $\\sum_{k=0}^{m-1} x^k$.<\/p>\n<aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Dans $M_2(\\mathbb R)$, $(A + B)^2 = A^2 + AB + BA + B^2$, pas $A^2 + 2AB + B^2$ : le binôme exige $AB = BA$.<\/p>\n<\/aside><h2>Idée 4 · Corps et corps des fractions<\/h2>\n<p>Un <strong>corps<\/strong> est un anneau commutatif non réduit à $\\{0\\}$ où tout élément non nul est inversible : $\\mathbb Q, \\mathbb R, \\mathbb C, K(X)$. Dans un corps, $xy = 0 \\Rightarrow x = 0$ ou $y = 0$. $\\mathbb Z/p\\mathbb Z$ est un corps quand $p$ est premier (Bézout donne l&#39;inverse).<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Construire Q à partir de Z (corps des fractions)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Couples<\/div><p>on prend $(a, b)$ avec $b \\neq 0$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Relation<\/div><p>$(a, b) \\mathcal R (a', b') \\iff ab' = a'b$ ; c&#39;est une équivalence.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Classes<\/div><p>la classe de $(a, b)$ se note $\\frac ab$ ; $(1, 2)$ et $(2, 4)$ donnent la même.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Lois<\/div><p>$\\frac ab + \\frac{a'}{b'} = \\frac{ab' + a'b}{bb'}$ et $\\frac ab \\cdot \\frac{a'}{b'} = \\frac{aa'}{bb'}$.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le polycopié prend les couples dans $A \\times A^*$ en notant $A^*$… alors que $A^*$ désigne aussi les inversibles. Il faut lire $A \\times (A \\setminus \\{0\\})$, et supposer $A$ <strong>commutatif et intègre<\/strong> (sinon la relation n&#39;est pas transitive).<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices du TD 3<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Anneau de Boole ($x^2 = x$ pour tout $x$). Montre que $x + x = 0$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Développe (x + y)² = x + y.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>$(x+y)^2 = x^2 + xy + yx + y^2 = x + xy + yx + y$, et vaut aussi $x + y$, donc $xy + yx = 0$. Avec $y = x$ : $x^2 + x^2 = 0$, soit $x + x = 0$. Donc $-z = z$ pour tout $z$, et $xy = -yx = yx$ : l&#39;anneau est commutatif.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Si $ab$ est nilpotent ($(ab)^m = 0$), donne l&#39;inverse de $1 - ab$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$(1 - ab)^{-1} = 1 + ab + (ab)^2 + \\dots + (ab)^{m-1}$, par la factorisation $1 - x^m = (1-x)(1 + \\dots + x^{m-1})$ avec $x = ab$ (qui commute avec 1).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Quels sont les inversibles de $\\mathbb Z/6\\mathbb Z$ ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$1$ et $5$ ($5 \\times 5 = 25 \\equiv 1$). Les autres (2, 3, 4) ont un facteur commun avec 6.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Dans $\\mathbb Z/4\\mathbb Z$, $2 \\times 2$ vaut :<\/div><button class=\"opt\" data-o=\"0\">$0$<\/button><button class=\"opt\" data-o=\"1\">$4$<\/button><button class=\"opt\" data-o=\"2\">$2$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">$(\\mathbb Z, +, \\times)$ est :<\/div><button class=\"opt\" data-o=\"0\">un corps<\/button><button class=\"opt\" data-o=\"1\">un anneau intègre qui n&#39;est pas un corps<\/button><button class=\"opt\" data-o=\"2\">un anneau avec diviseurs de zéro<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Les inversibles de $\\mathbb Z/4\\mathbb Z$ sont :<\/div><button class=\"opt\" data-o=\"0\">1 seulement<\/button><button class=\"opt\" data-o=\"1\">1 et 3<\/button><button class=\"opt\" data-o=\"2\">1, 2 et 3<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">La formule du binôme est valable dans un anneau quand :<\/div><button class=\"opt\" data-o=\"0\">$ab = ba$<\/button><button class=\"opt\" data-o=\"1\">toujours<\/button><button class=\"opt\" data-o=\"2\">jamais<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Dans un corps, $xy = 0$ implique :<\/div><button class=\"opt\" data-o=\"0\">$x = 0$ ou $y = 0$<\/button><button class=\"opt\" data-o=\"1\">$x = y$<\/button><button class=\"opt\" data-o=\"2\">rien de particulier<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">$M_2(\\mathbb R)$ est :<\/div><button class=\"opt\" data-o=\"0\">un corps<\/button><button class=\"opt\" data-o=\"1\">un anneau non commutatif<\/button><button class=\"opt\" data-o=\"2\">un anneau intègre<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Dans tout anneau, $a \\times 0$ vaut :<\/div><button class=\"opt\" data-o=\"0\">$0$<\/button><button class=\"opt\" data-o=\"1\">$a$<\/button><button class=\"opt\" data-o=\"2\">dépend de l&#39;anneau<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Si $x^3 = 0$, l&#39;inverse de $1 - x$ est :<\/div><button class=\"opt\" data-o=\"0\">$1 + x$<\/button><button class=\"opt\" data-o=\"1\">$1 + x + x^2$<\/button><button class=\"opt\" data-o=\"2\">$1 - x^2$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">$\\mathbb Z/5\\mathbb Z$ est :<\/div><button class=\"opt\" data-o=\"0\">un corps<\/button><button class=\"opt\" data-o=\"1\">un anneau non intègre<\/button><button class=\"opt\" data-o=\"2\">pas un anneau<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Le corps des fractions de $\\mathbb Z$ est :<\/div><button class=\"opt\" data-o=\"0\">$\\mathbb R$<\/button><button class=\"opt\" data-o=\"1\">$\\mathbb Q$<\/button><button class=\"opt\" data-o=\"2\">$\\mathbb Z$ lui-même<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"anneaux-corps","rep":["oui"],"tol":null},{"n":"anneaux-corps","rep":null,"tol":null},{"n":"anneaux-corps","rep":null,"tol":null},{"n":"anneaux-corps","rep":null,"tol":null}],"qcm":[{"n":"anneaux-corps","q":"Dans $\\mathbb Z/4\\mathbb Z$, $2 \\times 2$ vaut :","o":["$0$","$4$","$2$"],"a":0,"e":"$4 \\equiv 0 \\pmod 4$."},{"n":"anneaux-corps","q":"$(\\mathbb Z, +, \\times)$ est :","o":["un corps","un anneau intègre qui n&#39;est pas un corps","un anneau avec diviseurs de zéro"],"a":1,"e":"Seuls $\\pm 1$ sont inversibles."},{"n":"anneaux-corps","q":"Les inversibles de $\\mathbb Z/4\\mathbb Z$ sont :","o":["1 seulement","1 et 3","1, 2 et 3"],"a":1,"e":"$3 \\times 3 = 9 \\equiv 1$ ; 2 est diviseur de zéro."},{"n":"anneaux-corps","q":"La formule du binôme est valable dans un anneau quand :","o":["$ab = ba$","toujours","jamais"],"a":0,"e":"Il faut pouvoir regrouper $ab$ et $ba$."},{"n":"anneaux-corps","q":"Dans un corps, $xy = 0$ implique :","o":["$x = 0$ ou $y = 0$","$x = y$","rien de particulier"],"a":0,"e":"Si $x \\neq 0$, on multiplie par $x^{-1}$."},{"n":"anneaux-corps","q":"$M_2(\\mathbb R)$ est :","o":["un corps","un anneau non commutatif","un anneau intègre"],"a":1,"e":"Il y a des matrices non nulles de produit nul."},{"n":"anneaux-corps","q":"Dans tout anneau, $a \\times 0$ vaut :","o":["$0$","$a$","dépend de l&#39;anneau"],"a":0,"e":"$a \\times 0 = a \\times (0 + 0) = a\\times 0 + a \\times 0$."},{"n":"anneaux-corps","q":"Si $x^3 = 0$, l&#39;inverse de $1 - x$ est :","o":["$1 + x$","$1 + x + x^2$","$1 - x^2$"],"a":1,"e":"$(1 - x)(1 + x + x^2) = 1 - x^3 = 1$."},{"n":"anneaux-corps","q":"$\\mathbb Z/5\\mathbb Z$ est :","o":["un corps","un anneau non intègre","pas un anneau"],"a":0,"e":"5 est premier."},{"n":"anneaux-corps","q":"Le corps des fractions de $\\mathbb Z$ est :","o":["$\\mathbb R$","$\\mathbb Q$","$\\mathbb Z$ lui-même"],"a":1,"e":"On construit $\\mathbb Q$ par les classes de couples $(a, b)$."}]},{"id":"polynomes","t":"Polynômes","seance":"Chapitre 6 du polycopié","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il te faut la division euclidienne des entiers et l&#39;algorithme d&#39;Euclide (chapitre 5) : on va faire exactement pareil avec des polynômes.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Développe $(X - 1)^2(X + 2)$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$(X^2 - 2X + 1)(X + 2) = X^3 - 3X + 2$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>$K[X]$ ressemble à $\\mathbb Z$.<\/strong> Le degré joue le rôle de la taille : division euclidienne, PGCD, Bézout, Gauss, « irréductibles » au lieu de « premiers ». Ce que tu sais sur les entiers se transpose.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Oublier que $\\deg(P + Q)$ peut être <strong>plus petit<\/strong> que le max : $(X^2 + 1) + (-X^2) = 1$.<\/p>\n<\/aside><p>À la fin, tu sais diviser, trouver racines et multiplicités, factoriser sur $\\mathbb R$ et $\\mathbb C$, et calculer un PGCD de polynômes.<\/p>\n<h2>Idée 1 · Degré et division euclidienne<\/h2>\n<p>$\\deg(PQ) = \\deg P + \\deg Q$ et $\\deg(P+Q) \\le \\max(\\deg P, \\deg Q)$. Le polycopié pose $\\deg 0 = -1$.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Avec $\\deg 0 = -1$, la formule $\\deg(PQ) = \\deg P + \\deg Q$ est fausse si $P = 0$ ($-1 \\neq -1 + \\deg Q$). La plupart des livres posent $\\deg 0 = -\\infty$. Garde la convention du prof, mais traite le polynôme nul à part.<\/p>\n<\/aside><p>Pour $B \\neq 0$, il existe $Q$, $R$ uniques avec $A = BQ + R$ et $\\deg R &lt; \\deg B$.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Diviser X⁵ + X + 1 par X² + X + 1<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · X⁵ ÷ X² = X³<\/div><p>on retire $X^3(X^2+X+1)$ ; reste $-X^4 - X^3 + X + 1$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · −X⁴ ÷ X² = −X²<\/div><p>on ajoute $X^2(X^2+X+1)$ ; reste $X^2 + X + 1$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · X² ÷ X² = 1<\/div><p>on retire $X^2+X+1$ ; reste $0$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Résultat<\/div><p>$X^5 + X + 1 = (X^2+X+1)(X^3 - X^2 + 1)$ : la division tombe juste.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Exemple 36 du polycopié : pour $A = X^4 - aX^2 - bX - c$ et $B = X^2 - X - 1$, le quotient correct est $X^2 + X + (2 - a)$ et le reste $(3 - a - b)X + (2 - a - c)$ (vérifié par calcul formel), et non ceux annoncés.<\/p>\n<\/aside><h2>Idée 2 · Racines et multiplicité<\/h2>\n<p>$a$ est racine de $P$ $\\iff$ $(X - a) \\mid P$. Un polynôme non nul de degré $n$ a au plus $n$ racines.<\/p>\n<svg viewBox=\"0 0 400 170\" style=\"width:100%;max-width:440px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Courbe de X³−3X+2 : elle touche l'axe en 1 (racine double) et le traverse en −2 (racine simple)\">\n<line x1=\"10\" y1=\"120\" x2=\"390\" y2=\"120\" stroke=\"currentColor\"/>\n<path d=\"M40 165 C 70 40, 110 30, 150 60 S 230 122, 260 120 S 300 90, 340 20\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/>\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\"><circle cx=\"62\" cy=\"120\" r=\"4\"/><text x=\"40\" y=\"140\">−2 simple<\/text><circle cx=\"260\" cy=\"120\" r=\"4\"/><text x=\"235\" y=\"140\">1 double<\/text><\/g>\n<\/svg><p>La <strong>multiplicité<\/strong> $m$ de $a$ : $(X - a)^m \\mid P$ mais pas $(X-a)^{m+1}$. Par Taylor : $P(a) = P'(a) = \\dots = P^{(m-1)}(a) = 0$ et $P^{(m)}(a) \\neq 0$.<\/p>\n<p><strong>Exemple.<\/strong> $P = X^3 - 3X + 2$ : $P(1) = 0$, $P' = 3X^2 - 3$, $P'(1) = 0$, $P'' = 6X$, $P''(1) = 6 \\neq 0$. Racine double : $P = (X-1)^2(X+2)$.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Exercice 40 du polycopié : avec $X^3 - 3X^2 - 2$ et $X^3 - 4X^2 - 5X - 2$, 1 n&#39;est même pas racine ($P(1) = -4$, $Q(1) = -10$) : énoncés sans doute mal recopiés. Les versions $X^3 - 3X + 2$ et $X^3 - 4X^2 + 5X - 2 = (X-1)^2(X-2)$ donnent 1 racine double. Aussi, remarque 73 : « $a$ racine $\\iff m_P(a) \\ge 1$ » (pas $&gt; 1$), et dans la formule de Taylor, $P^{(r)} = \\sum_{k \\ge r} \\frac{k!}{(k-r)!} a_k X^{k-r}$.<\/p>\n<\/aside><h2>Idée 3 · Factoriser sur $\\mathbb C$ et sur $\\mathbb R$<\/h2>\n<p>$\\mathbb C$ est <strong>algébriquement clos<\/strong> : tout polynôme non constant y est scindé, $P = \\lambda \\prod (X - a_k)^{m_k}$. Sur $\\mathbb R$, on regroupe les racines complexes conjuguées en facteurs de degré 2 à discriminant négatif.<\/p>\n<figure class=\"grille\"><figcaption>Exemples du polycopié<\/figcaption><table><tr><th>1<\/th><td>X⁴+X²+1<\/td><td>=<\/td><td class=\"h1\">(X²−X+1)(X²+X+1)<\/td><\/tr><tr><th>2<\/th><td>X²+1<\/td><td>=<\/td><td class=\"h1\">(X−i)(X+i)_sur_C<\/td><\/tr><tr><th>3<\/th><td>X⁴−X²−1<\/td><td>=<\/td><td class=\"h1\">(X²+(√5−1)/2)(X²−(1+√5)/2)<\/td><\/tr><\/table><\/figure><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le polycopié termine la factorisation de $X^4 - X^2 - 1$ par un facteur $X^2 - \\frac{1+\\sqrt5}2$ en trop. La factorisation dans $\\mathbb R[X]$ est $\\left(X^2 + \\frac{\\sqrt5 - 1}2\\right)\\left(X - \\sqrt{\\tfrac{1+\\sqrt5}2}\\right)\\left(X + \\sqrt{\\tfrac{1+\\sqrt5}2}\\right)$. De même, dans l&#39;exemple 38, le produit doit porter sur $k = 0, \\dots, 2n - 1$ (les $2n$ racines $2n$-ièmes de l&#39;unité).<\/p>\n<\/aside><p><strong>Relations coefficients-racines.<\/strong> Pour $aX^2 + bX + c$ de racines $x_1, x_2$ : $x_1 + x_2 = -b/a$, $x_1 x_2 = c/a$. En général $\\alpha_{n-k} = (-1)^k \\alpha_n \\sigma_k$.<\/p>\n<h2>Idée 4 · PGCD et Bézout dans $K[X]$<\/h2>\n<p>Même algorithme d&#39;Euclide ; le PGCD est le dernier reste non nul <strong>rendu unitaire<\/strong>.<\/p>\n<p><strong>Exemple 39 (vérifié).<\/strong> $P = X^5 - 2X^3 - 2X^2 - 3X - 2$, $Q = X^5 - 3X^4 + 2X^3 - 3X^2 + X$ : dernier reste non nul $18X^2 + 18$, donc $P \\wedge Q = X^2 + 1$, et\n$$\\left(-\\tfrac{1}{10}X^2 + \\tfrac12 X - \\tfrac12\\right)P + \\left(\\tfrac1{10}X^2 - \\tfrac15 X - \\tfrac12\\right)Q = X^2 + 1.$$<\/p>\n<p>Gauss : si $P \\mid QR$ et $P \\wedge Q = 1$, alors $P \\mid R$. Tout polynôme non nul est produit (unique) d&#39;une constante et d&#39;irréductibles unitaires.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices types<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Quelle est la multiplicité de 2 dans $X^3 - 4X^2 + 5X - 2$ ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1<\/b><\/p><p>$P(2) = 8 - 16 + 10 - 2 = 0$ ; $P' = 3X^2 - 8X + 5$, $P'(2) = 1 \\neq 0$ : racine simple. (1 est racine double.)<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Calcule $(X^4 - 1) \\wedge (X^3 - 1)$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$X^4 - 1 = X(X^3 - 1) + (X - 1)$, puis $X^3 - 1 = (X-1)(X^2+X+1) + 0$. PGCD : $X - 1$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Soit $P$ de degré $\\le 2$. Montre que $P = \\frac{X(X-1)}{2}P(-1) + (1 - X^2)P(0) + \\frac{X(X+1)}{2}P(1)$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Compare les valeurs en −1, 0, 1.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>La différence est de degré $\\le 2$ et s&#39;annule en $-1$, $0$ et $1$ : trois racines pour un degré $\\le 2$, donc elle est nulle. (Le polycopié, ex. 39, a perdu les « /2 ».)<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">$\\deg\\big((X^3 + 1)(2X^2 - X)\\big)$ vaut :<\/div><button class=\"opt\" data-o=\"0\">5<\/button><button class=\"opt\" data-o=\"1\">6<\/button><button class=\"opt\" data-o=\"2\">3<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">$\\deg\\big((X^2 + X) + (-X^2 + 1)\\big)$ vaut :<\/div><button class=\"opt\" data-o=\"0\">2<\/button><button class=\"opt\" data-o=\"1\">1<\/button><button class=\"opt\" data-o=\"2\">0<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">$1$ est racine de $P$ si et seulement si :<\/div><button class=\"opt\" data-o=\"0\">$(X - 1) \\mid P$<\/button><button class=\"opt\" data-o=\"1\">$(X + 1) \\mid P$<\/button><button class=\"opt\" data-o=\"2\">$P'(1) = 0$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Multiplicité de 1 dans $X^3 - 3X + 2$ :<\/div><button class=\"opt\" data-o=\"0\">1<\/button><button class=\"opt\" data-o=\"1\">2<\/button><button class=\"opt\" data-o=\"2\">3<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Un polynôme de degré 3 à coefficients réels a toujours :<\/div><button class=\"opt\" data-o=\"0\">au moins une racine réelle<\/button><button class=\"opt\" data-o=\"1\">trois racines réelles<\/button><button class=\"opt\" data-o=\"2\">aucune racine réelle<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">$X^2 + 1$ est :<\/div><button class=\"opt\" data-o=\"0\">scindé sur $\\mathbb R$<\/button><button class=\"opt\" data-o=\"1\">scindé sur $\\mathbb C$ mais pas sur $\\mathbb R$<\/button><button class=\"opt\" data-o=\"2\">scindé sur $\\mathbb Q$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Le reste de la division de $P$ par $X - a$ est :<\/div><button class=\"opt\" data-o=\"0\">$P(a)$<\/button><button class=\"opt\" data-o=\"1\">$P'(a)$<\/button><button class=\"opt\" data-o=\"2\">$0$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Le PGCD de $X^4 - 1$ et $X^3 - 1$ est :<\/div><button class=\"opt\" data-o=\"0\">$1$<\/button><button class=\"opt\" data-o=\"1\">$X - 1$<\/button><button class=\"opt\" data-o=\"2\">$X^2 - 1$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Les racines de $2X^2 - 6X + 4$ ont pour somme :<\/div><button class=\"opt\" data-o=\"0\">3<\/button><button class=\"opt\" data-o=\"1\">$-3$<\/button><button class=\"opt\" data-o=\"2\">2<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">$X^4 + X^2 + 1$ se factorise dans $\\mathbb R[X]$ en :<\/div><button class=\"opt\" data-o=\"0\">$(X^2 - X + 1)(X^2 + X + 1)$<\/button><button class=\"opt\" data-o=\"1\">$(X^2 + 1)^2$<\/button><button class=\"opt\" data-o=\"2\">il est irréductible<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"polynomes","rep":null,"tol":null},{"n":"polynomes","rep":["1"],"tol":null},{"n":"polynomes","rep":null,"tol":null},{"n":"polynomes","rep":null,"tol":null}],"qcm":[{"n":"polynomes","q":"$\\deg\\big((X^3 + 1)(2X^2 - X)\\big)$ vaut :","o":["5","6","3"],"a":0,"e":"$3 + 2 = 5$."},{"n":"polynomes","q":"$\\deg\\big((X^2 + X) + (-X^2 + 1)\\big)$ vaut :","o":["2","1","0"],"a":1,"e":"Les termes dominants s&#39;annulent : il reste $X + 1$."},{"n":"polynomes","q":"$1$ est racine de $P$ si et seulement si :","o":["$(X - 1) \\mid P$","$(X + 1) \\mid P$","$P'(1) = 0$"],"a":0,"e":"Théorème 39."},{"n":"polynomes","q":"Multiplicité de 1 dans $X^3 - 3X + 2$ :","o":["1","2","3"],"a":1,"e":"$P(1) = P'(1) = 0$ et $P''(1) = 6 \\neq 0$."},{"n":"polynomes","q":"Un polynôme de degré 3 à coefficients réels a toujours :","o":["au moins une racine réelle","trois racines réelles","aucune racine réelle"],"a":0,"e":"Les racines non réelles vont par paires conjuguées : il en reste au moins une réelle."},{"n":"polynomes","q":"$X^2 + 1$ est :","o":["scindé sur $\\mathbb R$","scindé sur $\\mathbb C$ mais pas sur $\\mathbb R$","scindé sur $\\mathbb Q$"],"a":1,"e":"$X^2 + 1 = (X - i)(X + i)$."},{"n":"polynomes","q":"Le reste de la division de $P$ par $X - a$ est :","o":["$P(a)$","$P'(a)$","$0$"],"a":0,"e":"$P = Q(X - a) + R$ avec $R$ constant ; on évalue en $a$."},{"n":"polynomes","q":"Le PGCD de $X^4 - 1$ et $X^3 - 1$ est :","o":["$1$","$X - 1$","$X^2 - 1$"],"a":1,"e":"Racines communes réelles et complexes : seulement 1."},{"n":"polynomes","q":"Les racines de $2X^2 - 6X + 4$ ont pour somme :","o":["3","$-3$","2"],"a":0,"e":"$-b/a = 6/2$. (Et produit $4/2 = 2$.)"},{"n":"polynomes","q":"$X^4 + X^2 + 1$ se factorise dans $\\mathbb R[X]$ en :","o":["$(X^2 - X + 1)(X^2 + X + 1)$","$(X^2 + 1)^2$","il est irréductible"],"a":0,"e":"$(X^2 + 1)^2 - X^2$, différence de deux carrés."}]},{"id":"fractions-rationnelles","t":"Fractions rationnelles et éléments simples","seance":"Chapitre 7 du polycopié","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Il te faut la division euclidienne des polynômes et la factorisation sur $\\mathbb R$ et $\\mathbb C$ (chapitre 8).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Factorise $X^3 - X$ dans $\\mathbb R[X]$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$X(X - 1)(X + 1)$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Une recette, toujours la même.<\/strong> Partie entière par division, factorisation du dénominateur, forme a priori, puis calcul des coefficients en commençant par les pôles simples (« cache-pôle »).<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Oublier la partie entière quand $\\deg P \\ge \\deg Q$. $\\frac{X^3}{X^2 - 1}$ contient un $X$ qui n&#39;apparaît dans aucun élément simple.<\/p>\n<\/aside><p>À la fin, tu sais décomposer une fraction en éléments simples dans $\\mathbb C(X)$ et dans $\\mathbb R(X)$.<\/p>\n<h2>Idée 1 · Fraction, degré, pôles<\/h2>\n<p>$F = P/Q$ avec $P \\wedge Q = 1$ et $Q$ unitaire (forme irréductible). $\\deg F = \\deg P - \\deg Q \\in \\mathbb Z$. Les racines de $Q$ sont les <strong>pôles<\/strong>, celles de $P$ les <strong>zéros<\/strong>.<\/p>\n<p><strong>Exemple.<\/strong> $F = \\frac{X^2 + 1}{(X-1)^2(X+2)}$ : degré $2 - 3 = -1$, pôle double 1, pôle simple $-2$.<\/p>\n<h2>Idée 2 · La forme a priori<\/h2>\n<figure class=\"flux\"><figcaption>Décomposition<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">F<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">partie entière E (division)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">une partie polaire par pôle<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">coefficients<\/div><\/div><\/figure><p>Théorème 56 : dans $\\mathbb C(X)$, si $Q = \\prod (X - a_j)^{r_j}$,\n$$F = E + \\sum_j \\sum_{p=1}^{r_j} \\frac{C_{jp}}{(X - a_j)^p}.$$\nUn pôle d&#39;ordre $r$ donne $r$ termes. Dans $\\mathbb R(X)$, un facteur irréductible $X^2 + bX + c$ donne un terme $\\frac{\\alpha X + \\beta}{X^2 + bX + c}$.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Théorème 55 du polycopié : la partie polaire est $\\frac{D}{(X-a)^k}$ (et non $\\frac{A}{(X-a)^k}$). Remarque 80 : pour un pôle simple $a$ de $Q = (X-a)V$, le coefficient est $C = \\frac{P(a)}{V(a)} = \\frac{P(a)}{Q'(a)}$. Théorème 53 : avec la convention du prof, $\\deg 0 = -1$ ; mais pour les fractions, mieux vaut $-\\infty$, car une fraction peut avoir le degré $-1$ sans être nulle.<\/p>\n<\/aside><h2>Idée 3 · Calculer les coefficients<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Décomposer F = (X² + 1) / ((X − 1)²(X + 2))<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Forme a priori<\/div><p>$\\deg F &lt; 0$ donc $E = 0$ ; $F = \\frac{a}{X + 2} + \\frac{b}{X - 1} + \\frac{c}{(X-1)^2}$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · Pôle simple −2<\/div><p>on multiplie par $X + 2$ et on prend $x = -2$ : $a = \\frac{4 + 1}{(-3)^2} = \\frac59$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · Pôle double 1, plus haute puissance<\/div><p>on multiplie par $(X-1)^2$, $x = 1$ : $c = \\frac{2}{3}$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · Coefficient restant<\/div><p>on prend $x = 0$ : $-\\frac12 = \\frac a2 - b + c$, donc $b = \\frac{5}{18} + \\frac23 + \\frac12 = \\frac49$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · Résultat<\/div><p>$F = \\frac{5}{9(X+2)} + \\frac{4}{9(X-1)} + \\frac{2}{3(X-1)^2}$ (vérifié par calcul formel).<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p><strong>Exemple avec partie entière.<\/strong> $\\frac{X^3}{X^2 - 1}$ : $X^3 = X(X^2 - 1) + X$, donc $E = X$ et $\\frac{X}{X^2 - 1} = \\frac{1/2}{X - 1} + \\frac{1/2}{X + 1}$.<\/p>\n<h2>Idée 4 · Sur $\\mathbb R$ ou sur $\\mathbb C$<\/h2>\n<figure class=\"grille\"><figcaption>1 / (X(X² + 1)) selon le corps<\/figcaption><table><tr><th>dans_C(X)<\/th><td class=\"h1\">1/X<\/td><td>−1/(2(X−i))<\/td><td>−1/(2(X+i))<\/td><\/tr><tr><th>dans_R(X)<\/th><td class=\"h1\">1/X<\/td><td>−X/(X²+1)<\/td><\/tr><\/table><\/figure><p>Sur $\\mathbb C$, tout se décompose en $\\frac{c}{(X-a)^p}$ ; sur $\\mathbb R$, on regroupe les pôles conjugués : $\\frac{-1/2}{X - i} + \\frac{-1/2}{X + i} = \\frac{-X}{X^2 + 1}$.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices types<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Décompose $\\frac{1}{X^3 - X}$ dans $\\mathbb R(X)$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Trois pôles simples 0, 1, −1 ; utilise C = P(a)/Q&#39;(a) avec Q&#39; = 3X² − 1.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>$Q' = 3X^2 - 1$ : en 0, $C = 1/(-1) = -1$ ; en 1, $1/2$ ; en $-1$, $1/2$. Donc $\\frac{1}{X^3 - X} = -\\frac1X + \\frac{1}{2(X-1)} + \\frac{1}{2(X+1)}$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Partie entière de $\\frac{X^3 + 2}{X^2 - 1}$ ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$X^3 + 2 = X(X^2 - 1) + X + 2$ : partie entière $X$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Coefficient de $\\frac{1}{X - 2}$ dans $\\frac{X + 1}{(X - 2)(X + 3)}$ ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.6<\/b><\/p><p>Cache-pôle : $\\frac{2 + 1}{2 + 3} = \\frac35 = 0{,}6$.<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 7 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Le degré de $\\frac{X^3 + 1}{X^5 - X}$ est :<\/div><button class=\"opt\" data-o=\"0\">$-2$<\/button><button class=\"opt\" data-o=\"1\">$2$<\/button><button class=\"opt\" data-o=\"2\">$8$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">La partie entière de $\\frac{X^3}{X^2 - 1}$ est :<\/div><button class=\"opt\" data-o=\"0\">$X$<\/button><button class=\"opt\" data-o=\"1\">$0$<\/button><button class=\"opt\" data-o=\"2\">$X^2$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Combien de termes pour un pôle triple ?<\/div><button class=\"opt\" data-o=\"0\">1<\/button><button class=\"opt\" data-o=\"1\">3<\/button><button class=\"opt\" data-o=\"2\">6<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Dans $\\frac{1}{X^2 - 1}$, le coefficient de $\\frac{1}{X - 1}$ est :<\/div><button class=\"opt\" data-o=\"0\">$\\frac12$<\/button><button class=\"opt\" data-o=\"1\">$1$<\/button><button class=\"opt\" data-o=\"2\">$-\\frac12$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Si $\\deg P &lt; \\deg Q$, la partie entière de $P/Q$ est :<\/div><button class=\"opt\" data-o=\"0\">nulle<\/button><button class=\"opt\" data-o=\"1\">égale à $P$<\/button><button class=\"opt\" data-o=\"2\">égale à $Q$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Sur $\\mathbb R$, $X^2 + X + 1$ au dénominateur donne un terme :<\/div><button class=\"opt\" data-o=\"0\">$\\frac{a}{X^2 + X + 1}$ seulement<\/button><button class=\"opt\" data-o=\"1\">$\\frac{aX + b}{X^2 + X + 1}$<\/button><button class=\"opt\" data-o=\"2\">deux termes $\\frac{a}{X - r}$ réels<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Les pôles de $\\frac{X - 1}{X^2 - 1}$ (après simplification) :<\/div><button class=\"opt\" data-o=\"0\">1 et $-1$<\/button><button class=\"opt\" data-o=\"1\">seulement $-1$<\/button><button class=\"opt\" data-o=\"2\">aucun<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">$\\frac{1}{X(X^2+1)}$ dans $\\mathbb R(X)$ vaut :<\/div><button class=\"opt\" data-o=\"0\">$\\frac1X - \\frac{X}{X^2 + 1}$<\/button><button class=\"opt\" data-o=\"1\">$\\frac1X + \\frac{1}{X^2+1}$<\/button><button class=\"opt\" data-o=\"2\">$\\frac1X - \\frac{1}{X^2 + 1}$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">$(K(X), +, \\times)$ est :<\/div><button class=\"opt\" data-o=\"0\">un corps<\/button><button class=\"opt\" data-o=\"1\">un anneau non intègre<\/button><button class=\"opt\" data-o=\"2\">un groupe pour $\\times$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Pour le coefficient de $\\frac{1}{(X-1)^2}$ dans $\\frac{X^2+1}{(X-1)^2(X+2)}$, on multiplie par $(X-1)^2$ puis on évalue en :<\/div><button class=\"opt\" data-o=\"0\">$1$<\/button><button class=\"opt\" data-o=\"1\">$-2$<\/button><button class=\"opt\" data-o=\"2\">$0$<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"fractions-rationnelles","rep":null,"tol":null},{"n":"fractions-rationnelles","rep":null,"tol":null},{"n":"fractions-rationnelles","rep":null,"tol":null},{"n":"fractions-rationnelles","rep":["0.6"],"tol":0.01}],"qcm":[{"n":"fractions-rationnelles","q":"Le degré de $\\frac{X^3 + 1}{X^5 - X}$ est :","o":["$-2$","$2$","$8$"],"a":0,"e":"$3 - 5$."},{"n":"fractions-rationnelles","q":"La partie entière de $\\frac{X^3}{X^2 - 1}$ est :","o":["$X$","$0$","$X^2$"],"a":0,"e":"$X^3 = X(X^2 - 1) + X$."},{"n":"fractions-rationnelles","q":"Combien de termes pour un pôle triple ?","o":["1","3","6"],"a":1,"e":"$\\frac{c_1}{X-a} + \\frac{c_2}{(X-a)^2} + \\frac{c_3}{(X-a)^3}$."},{"n":"fractions-rationnelles","q":"Dans $\\frac{1}{X^2 - 1}$, le coefficient de $\\frac{1}{X - 1}$ est :","o":["$\\frac12$","$1$","$-\\frac12$"],"a":0,"e":"$\\frac{P(1)}{Q'(1)} = \\frac12$."},{"n":"fractions-rationnelles","q":"Si $\\deg P &lt; \\deg Q$, la partie entière de $P/Q$ est :","o":["nulle","égale à $P$","égale à $Q$"],"a":0,"e":"Le quotient de la division est 0."},{"n":"fractions-rationnelles","q":"Sur $\\mathbb R$, $X^2 + X + 1$ au dénominateur donne un terme :","o":["$\\frac{a}{X^2 + X + 1}$ seulement","$\\frac{aX + b}{X^2 + X + 1}$","deux termes $\\frac{a}{X - r}$ réels"],"a":1,"e":"Discriminant $-3 &lt; 0$ : facteur irréductible sur $\\mathbb R$."},{"n":"fractions-rationnelles","q":"Les pôles de $\\frac{X - 1}{X^2 - 1}$ (après simplification) :","o":["1 et $-1$","seulement $-1$","aucun"],"a":1,"e":"$\\frac{X-1}{(X-1)(X+1)} = \\frac1{X+1}$ : il faut d&#39;abord rendre la fraction irréductible."},{"n":"fractions-rationnelles","q":"$\\frac{1}{X(X^2+1)}$ dans $\\mathbb R(X)$ vaut :","o":["$\\frac1X - \\frac{X}{X^2 + 1}$","$\\frac1X + \\frac{1}{X^2+1}$","$\\frac1X - \\frac{1}{X^2 + 1}$"],"a":0,"e":"On vérifie : $\\frac{X^2 + 1 - X^2}{X(X^2+1)}$."},{"n":"fractions-rationnelles","q":"$(K(X), +, \\times)$ est :","o":["un corps","un anneau non intègre","un groupe pour $\\times$"],"a":0,"e":"Toute fraction non nulle a un inverse (définition 68 du polycopié)."},{"n":"fractions-rationnelles","q":"Pour le coefficient de $\\frac{1}{(X-1)^2}$ dans $\\frac{X^2+1}{(X-1)^2(X+2)}$, on multiplie par $(X-1)^2$ puis on évalue en :","o":["$1$","$-2$","$0$"],"a":0,"e":"On obtient $\\frac{1 + 1}{1 + 2} = \\frac23$."}]},{"id":"td-corriges","t":"TD 1, 2 et 3 corrigés","seance":"Travaux dirigés · Faculté Polydisciplinaire, MIP","imp":5,"html":"<p>Les trois feuilles de TD du module, corrigées en entier. Cherche chaque exercice <strong>au moins 15 minutes<\/strong> avant d&#39;ouvrir le corrigé.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Ce qui manque dans les supports : l&#39;<strong>exercice 5 du TD 2<\/strong> est vide (seul le titre est imprimé), la <strong>cible<\/strong> de l&#39;exercice 10 du TD 2 n&#39;apparaît pas (on suppose deux zones à 15 et 8 points, cohérentes avec l&#39;équation), et le nombre $\\omega$ de l&#39;exercice 1 du TD 3 est illisible (on traite un $\\omega \\in \\mathbb C$ quelconque, la preuve ne dépend pas de sa valeur).<\/p>\n<\/aside><h2>TD 1 · Logique, ensembles, applications, relations<\/h2>\n<section class=\"exo\"><h3>TD 1 · Récurrences<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p><strong>Ex. 1.<\/strong> Montre que pour tout $n \\ge 2$ : $1 + \\frac1{2^2} + \\dots + \\frac1{n^2} &gt; \\frac{3n}{2n+1}$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Compare 3(n+1)/(2n+3) − 3n/(2n+1) à 1/(n+1)².<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Notons $S_n$ la somme. <strong>Initialisation<\/strong> : $S_2 = \\frac54 = 1{,}25 &gt; \\frac65 = 1{,}2$.\n<strong>Hérédité<\/strong> : supposons $S_n &gt; \\frac{3n}{2n+1}$ pour un $n \\ge 2$. Alors $S_{n+1} &gt; \\frac{3n}{2n+1} + \\frac1{(n+1)^2}$. Or\n$\\frac{3(n+1)}{2n+3} - \\frac{3n}{2n+1} = \\frac{3[(n+1)(2n+1) - n(2n+3)]}{(2n+1)(2n+3)} = \\frac{3}{(2n+1)(2n+3)}$.\nEt $(2n+1)(2n+3) - 3(n+1)^2 = n^2 + 2n &gt; 0$, donc $\\frac{1}{(n+1)^2} &gt; \\frac{3}{(2n+1)(2n+3)}$. D&#39;où $S_{n+1} &gt; \\frac{3(n+1)}{2n+3}$.\n<strong>Conclusion<\/strong> : vrai pour tout $n \\ge 2$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p><strong>Ex. 2.<\/strong> Montre que $1! \\cdot 3! \\cdot 5! \\cdots (2n+1)! &gt; ((n+1)!)^{n+1}$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>(2n+3)! = (n+2)! × (n+3)(n+4)···(2n+3).<\/p>\n<\/div><div class=\"ex-c\" hidden><p><strong>Attention<\/strong> : Pour $n = 0$, on a $1 = 1$ : l&#39;inégalité stricte est fausse. On prouve $\\ge$ pour tout $n$, et $&gt;$ pour $n \\ge 1$.\nNotons $P_n$ le produit. <strong>Initialisation<\/strong> : $P_1 = 1 \\times 6 = 6 &gt; (2!)^2 = 4$.\n<strong>Hérédité<\/strong> : si $P_n &gt; ((n+1)!)^{n+1}$, alors $P_{n+1} = P_n \\cdot (2n+3)! &gt; ((n+1)!)^{n+1}(2n+3)!$. Il suffit de montrer $((n+1)!)^{n+1}(2n+3)! \\ge ((n+2)!)^{n+2}$, c&#39;est-à-dire, en divisant par $((n+1)!)^{n+1}$ : $(2n+3)! \\ge (n+2)^{n+1}(n+2)!$.\nOr $(2n+3)! = (n+2)! \\times (n+3)(n+4)\\cdots(2n+3)$ : ce sont $n+1$ facteurs tous $&gt; n+2$. Donc c&#39;est vrai.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p><strong>Ex. 3.<\/strong> $x \\neq 0$ et $x + \\frac1x \\in \\mathbb Z$. Montre que $x^n + \\frac{1}{x^n} \\in \\mathbb Z$ pour tout $n$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Récurrence d&#39;ordre 2 : multiplie S_n par S_1.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Posons $S_n = x^n + x^{-n}$. On a $S_1 S_n = x^{n+1} + x^{n-1} + x^{-(n-1)} + x^{-(n+1)} = S_{n+1} + S_{n-1}$, donc $S_{n+1} = S_1 S_n - S_{n-1}$.\n<strong>Initialisation<\/strong> : $S_0 = 2 \\in \\mathbb Z$, $S_1 \\in \\mathbb Z$.\n<strong>Hérédité (ordre 2)<\/strong> : si $S_{n-1}$ et $S_n$ sont entiers, $S_{n+1} = S_1S_n - S_{n-1}$ l&#39;est aussi.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p><strong>Ex. 4.<\/strong> Trouve toutes les $f : \\mathbb R \\to \\mathbb R$ telles que $f(x) + x f(1 - x) = 1 + x$ pour tout $x$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Analyse-synthèse : remplace x par 1 − x.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><strong>Analyse.<\/strong> Soit $f$ solution. En remplaçant $x$ par $1 - x$ : $f(1-x) + (1-x)f(x) = 2 - x$, donc $f(1 - x) = 2 - x - (1-x)f(x)$. On reporte :\n$f(x) + x(2 - x) - x(1-x)f(x) = 1 + x$, soit $f(x)(x^2 - x + 1) = x^2 - x + 1$.\nComme $x^2 - x + 1 = (x - \\frac12)^2 + \\frac34 &gt; 0$, on obtient $f(x) = 1$.\n<strong>Synthèse.<\/strong> $f = 1$ vérifie $1 + x \\cdot 1 = 1 + x$. Unique solution : la fonction constante 1.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>TD 1 · Applications et relations<\/h3><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p><strong>Ex. 5.<\/strong> Montre que $f : E \\to F$ est bijective si et seulement si $f(\\overline A) = \\overline{f(A)}$ pour toute partie $A$ de $E$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><strong>(⇒)<\/strong> Soit $A \\subseteq E$. Si $y \\in f(\\overline A)$, $y = f(x)$ avec $x \\notin A$ ; si on avait $y \\in f(A)$, $y = f(a)$ avec $a \\in A$, et l&#39;injectivité donnerait $x = a \\in A$ : absurde. Donc $f(\\overline A) \\subseteq \\overline{f(A)}$. Si $y \\notin f(A)$, par surjectivité $y = f(x)$, et $x \\notin A$ (sinon $y \\in f(A)$) : $y \\in f(\\overline A)$.\n<strong>(⇐)<\/strong> Avec $A = \\emptyset$ : $f(E) = \\overline{f(\\emptyset)} = \\overline{\\emptyset} = F$, donc $f$ est surjective. Soient $x \\neq x'$ ; avec $A = \\{x\\}$, $x' \\in \\overline A$, donc $f(x') \\in f(\\overline A) = \\overline{\\{f(x)\\}}$ : $f(x') \\neq f(x)$. Donc $f$ est injective.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p><strong>Ex. 6.<\/strong> $E$ de cardinal $n$, $\\mathcal R$ une équivalence à $k$ classes, de graphe $G$ de cardinal $p$. Montre $n^2 \\le kp$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Si la classe i a n_i éléments, combien de couples (x, y) avec x R y dans cette classe ?<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Soient $C_1, \\dots, C_k$ les classes, de cardinaux $n_1, \\dots, n_k$. Elles forment une partition : $\\sum n_i = n$. On a $x \\mathcal R y$ ssi $x$ et $y$ sont dans la même classe, donc $p = \\sum n_i^2$. Par l&#39;inégalité de Cauchy-Schwarz : $n^2 = \\left(\\sum_{i=1}^k n_i \\cdot 1\\right)^2 \\le \\left(\\sum n_i^2\\right)\\left(\\sum 1^2\\right) = pk$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><p><strong>Ex. 7.<\/strong> Compare $V_1 = \\max_j \\min_i a_{i,j}$ et $V_2 = \\min_i \\max_j a_{i,j}$ ($E$ totalement ordonné). Donne un exemple où ils diffèrent.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Pour tous $i, j$ : $\\min_{i'} a_{i',j} \\le a_{i,j} \\le \\max_{j'} a_{i,j'}$. Le membre de gauche ne dépend que de $j$, celui de droite que de $i$. On prend le max en $j$ à gauche et le min en $i$ à droite : $V_1 \\le V_2$.\nExemple : $\\begin{pmatrix} 0 &amp; 1 \\\\ 1 &amp; 0 \\end{pmatrix}$. Minimums des colonnes : 0 et 0, donc $V_1 = 0$. Maximums des lignes : 1 et 1, donc $V_2 = 1$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"7\"><div class=\"ex-q\"><p><strong>Ex. 8.<\/strong> $E$ ordonné. Montre : toute partie non vide de $E$ a un élément maximal $\\iff$ toute suite croissante de $E$ est stationnaire.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><strong>(⇒)<\/strong> Soit $(u_n)$ croissante. La partie $\\{u_n\\}$ a un élément maximal $u_N$. Pour $n \\ge N$, $u_N \\le u_n$, et $u_N &lt; u_n$ est impossible (maximalité) : $u_n = u_N$.\n<strong>(⇐)<\/strong> par contraposée : soit $A$ non vide sans élément maximal. On choisit $u_0 \\in A$ ; $u_0$ n&#39;est pas maximal, donc il existe $u_1 \\in A$ avec $u_0 &lt; u_1$, et ainsi de suite. La suite $(u_n)$ est strictement croissante, donc non stationnaire.\n<strong>Attention<\/strong> : l&#39;énoncé du TD dit « toute partie » : il faut « toute partie <strong>non vide<\/strong> » (le vide n&#39;a pas d&#39;élément maximal).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>TD 2 · Arithmétique<\/h2>\n<section class=\"exo\"><h3>TD 2 · Divisibilité<\/h3><div class=\"ex\" data-x=\"8\"><div class=\"ex-q\"><p><strong>Ex. 1.<\/strong> (1) Montre $a \\mid b \\iff \\forall k \\in \\mathbb Z,\\ a \\mid b - ka$. (2) Trouve les $a \\in \\mathbb Z$ tels que $(a - 5) \\mid (a + 7)$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>(1) Si $a \\mid b$, comme $a \\mid ka$, $a$ divise la combinaison $b - ka$. Réciproquement, $k = 0$ donne $a \\mid b$.\n(2) $a + 7 = (a - 5) + 12$, donc, d&#39;après (1), $(a - 5) \\mid (a+7) \\iff (a - 5) \\mid 12$. Les diviseurs de 12 sont $\\pm1, \\pm2, \\pm3, \\pm4, \\pm6, \\pm12$, d&#39;où $a \\in \\{-7, -1, 1, 2, 3, 4, 6, 7, 8, 9, 11, 17\\}$ (vérifié par ordinateur).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"9\"><div class=\"ex-q\"><p><strong>Ex. 2.<\/strong> Les entiers naturels $n$ tels que $n - 1$ divise $n + 3$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$n + 3 = (n - 1) + 4$ donc $(n-1) \\mid 4$. Avec $n \\in \\mathbb N$ : $n - 1 \\in \\{-1, 1, 2, 4\\}$, soit $n \\in \\{0, 2, 3, 5\\}$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"10\"><div class=\"ex-q\"><p><strong>Ex. 3.<\/strong> (1) Résous $x^2 - y^2 = 13$ dans $\\mathbb N^2$. (2) Résous $2x^3 + xy - 11 = 0$ dans $\\mathbb Z^2$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>(1) $(x - y)(x + y) = 13$, premier, avec $0 \\le x - y \\le x + y$ : $x + y = 13$ et $x - y = 1$, donc $(x, y) = (7, 6)$.\n(2) $x(2x^2 + y) = 11$, donc $x \\mid 11$ : $x \\in \\{\\pm1, \\pm11\\}$, et $y = \\frac{11}{x} - 2x^2$. On obtient $(1, 9)$, $(-1, -13)$, $(11, -241)$, $(-11, -243)$. Vérif : $2 \\cdot 1331 - 11 \\cdot 241 - 11 = 2662 - 2651 - 11 = 0$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"11\"><div class=\"ex-q\"><p><strong>Ex. 4.<\/strong> $q_n = \\frac{n - 7}{n + 19}$, $n &gt; 7$. (1) Quand est-elle simplifiable ? (2) Quand est-elle un entier naturel ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>(1) $\\mathrm{PGCD}(n - 7, n + 19) = \\mathrm{PGCD}(n - 7, 26)$, car $(n + 19) - (n - 7) = 26 = 2 \\times 13$. Simplifiable ssi $2 \\mid n - 7$ ou $13 \\mid n - 7$ : $n$ impair, ou $n \\equiv 7 \\pmod{13}$.\n(2) Pour $n &gt; 7$, $0 &lt; n - 7 &lt; n + 19$, donc $0 &lt; q_n &lt; 1$ : <strong>jamais<\/strong> un entier naturel.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>TD 2 · PGCD, Bézout<\/h3><div class=\"ex\" data-x=\"12\"><div class=\"ex-q\"><p><strong>Ex. 6.<\/strong> Calcule $\\mathrm{PGCD}$ et $\\mathrm{PPCM}$ de $(n, 2n+1)$ puis de $(2n+2, 4n+2)$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$2n + 1 = 2 \\times n + 1$ donne $n \\wedge (2n+1) = n \\wedge 1 = 1$, PPCM $= n(2n+1)$.\n$(2n+2) \\wedge (4n+2) = 2\\big((n+1) \\wedge (2n+1)\\big)$ et $2n + 1 = 2(n+1) - 1$, donc ce PGCD vaut $2$. PPCM $= \\frac{(2n+2)(4n+2)}{2} = 2(n+1)(2n+1)$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"13\"><div class=\"ex-q\"><p><strong>Ex. 7.<\/strong> $a \\wedge b = d$. Que vaut $(13a + 5b) \\wedge (5a + 2b)$ ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$d$. Soit $\\delta$ le PGCD cherché. $d$ divise $x$ et $y$, donc $d \\mid \\delta$. Et $2x - 5y = a$, $13y - 5x = b$, donc $\\delta \\mid a$ et $\\delta \\mid b$ : $\\delta \\mid d$. Ce sont des entiers positifs : $\\delta = d$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"14\"><div class=\"ex-q\"><p><strong>Ex. 8.<\/strong> Résous $11x + 16y = 0$ dans $\\mathbb Z^2$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$11x = -16y$, donc $16 \\mid 11x$ avec $16 \\wedge 11 = 1$ : par Gauss, $x = 16k$, puis $y = -11k$. Solutions : $(16k, -11k)$, $k \\in \\mathbb Z$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"15\"><div class=\"ex-q\"><p><strong>Ex. 9.<\/strong> Le carré de tout entier naturel est de la forme $5n - 1$, $5n$ ou $5n + 1$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Selon le reste $r \\in \\{0,1,2,3,4\\}$ de $a$ modulo 5, $a^2 \\equiv r^2 \\in \\{0, 1, 4, 9, 16\\}$, soit $\\{0, 1, 4, 4, 1\\}$ modulo 5. Et $4 \\equiv -1$. Donc $a^2 = 5n$, $5n + 1$ ou $5n - 1$ (avec $n \\ge 1$ dans le dernier cas, car $a^2 \\ge 4$).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"16\"><div class=\"ex-q\"><p><strong>Ex. 10.<\/strong> (1) Solution particulière de $15x + 8y = 1$. (2) Résous $15x + 8y = 1000$. (3) Nombre de façons de marquer 1000 points (zones à 15 et 8 points).<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 9<\/b><\/p><p>(1) $15 = 8 + 7$, $8 = 7 + 1$ : $1 = 8 - 7 = 2 \\times 8 - 15$, donc $(-1, 2)$.\n(2) $(-1000, 2000)$ est solution. Si $(x, y)$ est solution, $15(x + 1000) = 8(2000 - y)$ ; $15 \\wedge 8 = 1$ donc $8 \\mid x + 1000$ : $x = -1000 + 8k$, $y = 2000 - 15k$, $k \\in \\mathbb Z$ (réciproque immédiate).\n(3) Il faut $x \\ge 0$ et $y \\ge 0$ : $k \\ge 125$ et $k \\le 133$. Donc <strong>9 façons<\/strong> : $(0,125), (8,110), \\dots, (64, 5)$ (énumérées par ordinateur).<\/p>\n<\/div><\/div><\/section><h2>TD 3 · Structures algébriques<\/h2>\n<section class=\"exo\"><h3>TD 3 · Groupes<\/h3><div class=\"ex\" data-x=\"17\"><div class=\"ex-q\"><p><strong>Ex. 1.<\/strong> $\\omega \\in \\mathbb C$ et $H = \\{a + \\omega b \\mid (a, b) \\in \\mathbb Z^2\\}$. Montre que $H$ est un sous-groupe de $(\\mathbb C, +)$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$H \\subseteq \\mathbb C$ ; $0 = 0 + \\omega \\cdot 0 \\in H$. Si $z = a + \\omega b$ et $z' = a' + \\omega b'$, alors $z + z' = (a + a') + \\omega(b + b') \\in H$ et $-z = (-a) + \\omega(-b) \\in H$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"18\"><div class=\"ex-q\"><p><strong>Ex. 2 et 3.<\/strong> Centre d&#39;un groupe, et $x \\mapsto x^{-1}$ morphisme ssi $G$ abélien.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Corrigés dans le chapitre « Lois de composition interne et groupes », section S&#39;exercer.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"19\"><div class=\"ex-q\"><p><strong>Ex. 4.<\/strong> Trouve tous les morphismes de $(\\mathbb Q, +)$ vers $(\\mathbb Z, +)$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>f(x) = 2^k f(x / 2^k).<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Soit $f$ un tel morphisme et $x \\in \\mathbb Q$. Pour tout $k \\in \\mathbb N$, $x = 2^k \\cdot \\frac{x}{2^k}$, donc $f(x) = 2^k f\\left(\\frac{x}{2^k}\\right)$ : l&#39;entier $f(x)$ est divisible par toutes les puissances de 2, donc $f(x) = 0$. Seul le <strong>morphisme nul<\/strong> convient (et il convient).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>TD 3 · Anneaux<\/h3><div class=\"ex\" data-x=\"20\"><div class=\"ex-q\"><p><strong>Ex. 5.<\/strong> Anneau de Boole ($x^2 = x$). (1) $xy + yx = 0$, $x + x = 0$, $A$ commutatif. (2) $x \\le y \\iff yx = x$ est un ordre. (3) $xy(x+y) = 0$ ; un anneau de Boole intègre a deux éléments.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>(1) $(x + y)^2 = x + y$ donne $x + xy + yx + y = x + y$, donc $xy + yx = 0$. Avec $y = x$ : $2x^2 = 2x = 0$. Donc $-z = z$ et $xy = -yx = yx$.\n(2) Réflexive : $xx = x$. Antisymétrique : $yx = x$ et $xy = y$ avec $xy = yx$ donnent $x = y$. Transitive : $yx = x$ et $zy = y$ donnent $zx = z(yx) = (zy)x = yx = x$.\n(3) $xy(x+y) = x^2y + xy^2 = xy + xy = 0$. Si $A$ est intègre et $x \\neq 0$ : $x(1 + x) = x + x^2 = x + x = 0$, donc $1 + x = 0$, soit $x = -1 = 1$. Ainsi $A = \\{0, 1\\}$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"21\"><div class=\"ex-q\"><p><strong>Ex. 6.<\/strong> (1) $ab$ nilpotent : $1 - ab$ inversible. (2) et (3) Si $1 - ab$ est inversible, alors $1 - ba$ aussi.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>(1) Si $(ab)^m = 0$ : $(1 - ab)^{-1} = \\sum_{k=0}^{m-1}(ab)^k$ (chapitre anneaux).\n(2)-(3) Soit $u = (1 - ab)^{-1}$. On pose $v = 1 + bua$. Alors $(1 - ba)v = 1 - ba + bua - babua = 1 - ba + b(1 - ab)ua = 1 - ba + ba = 1$, et de même $v(1 - ba) = 1 - ba + bua - buaba = 1 - ba + bu(1 - ab)a = 1$. Donc $(1 - ba)^{-1} = 1 + b(1 - ab)^{-1}a$, que $ab$ soit nilpotent ou non.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"22\"><div class=\"ex-q\"><p><strong>Ex. 7.<\/strong> $\\mathbb Z[\\sqrt2]$ : $\\mathbb Z^2$ avec $(a,a') + (b,b') = (a+b, a'+b')$ et $(a,a')(b,b') = (ab + 2a'b', ab' + a'b)$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Idée : $(a, a')$ code $a + a'\\sqrt2$ ; la multiplication est celle de $(a + a'\\sqrt2)(b + b'\\sqrt2)$.\n(1) $(\\mathbb Z^2, +)$ est un groupe abélien ; $\\times$ est commutative (formule symétrique), associative et distributive (on le vérifie en développant, ou via le codage dans $\\mathbb R$). Neutre : $(1, 0)$.\n(2) $\\mathbb Z_0 = \\{(a, 0)\\}$ contient $(1, 0)$, est stable par différence et par produit : $(a,0)(b,0) = (ab, 0)$. Sous-anneau.\n(3) $(a, a') = (a, 0) + (a', 0)(0, 1)$, car $(a',0)(0,1) = (0, a')$. Unicité : les composantes sont déterminées.\n(4) $X = (0, 1)$ : $X^2 = (0 + 2, 0) = (2, 0) = 2$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 6 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p>","ex":[{"n":"td-corriges","rep":null,"tol":null},{"n":"td-corriges","rep":null,"tol":null},{"n":"td-corriges","rep":null,"tol":null},{"n":"td-corriges","rep":null,"tol":null},{"n":"td-corriges","rep":null,"tol":null},{"n":"td-corriges","rep":null,"tol":null},{"n":"td-corriges","rep":null,"tol":null},{"n":"td-corriges","rep":null,"tol":null},{"n":"td-corriges","rep":null,"tol":null},{"n":"td-corriges","rep":null,"tol":null},{"n":"td-corriges","rep":null,"tol":null},{"n":"td-corriges","rep":null,"tol":null},{"n":"td-corriges","rep":null,"tol":null},{"n":"td-corriges","rep":null,"tol":null},{"n":"td-corriges","rep":null,"tol":null},{"n":"td-corriges","rep":null,"tol":null},{"n":"td-corriges","rep":["9"],"tol":null},{"n":"td-corriges","rep":null,"tol":null},{"n":"td-corriges","rep":null,"tol":null},{"n":"td-corriges","rep":null,"tol":null},{"n":"td-corriges","rep":null,"tol":null},{"n":"td-corriges","rep":null,"tol":null},{"n":"td-corriges","rep":null,"tol":null}],"qcm":[]},{"id":"revision","t":"Révision et examen blanc","seance":"Fin de semestre","imp":5,"html":"<h2>Fiche de révision<\/h2>\n<figure class=\"grille\"><figcaption>Les méthodes à savoir refaire sans notes<\/figcaption><table><tr><th><\/th><th>question<\/th><th>méthode<\/th><\/tr><tr><th>1<\/th><td>nier_une_phrase<\/td><td class=\"h1\">∀↔∃,_nier_la_fin<\/td><\/tr><tr><th>2<\/th><td>injective?<\/td><td class=\"h1\">f(x)=f(x')⇒x=x'<\/td><\/tr><tr><th>3<\/th><td>équivalence?<\/td><td class=\"h1\">réfl.,_sym.,_trans.<\/td><\/tr><tr><th>4<\/th><td>PGCD<\/td><td class=\"h1\">Euclide,_dernier_reste_non_nul<\/td><\/tr><tr><th>5<\/th><td>ax+by=c<\/td><td class=\"h1\">Bézout_puis_Gauss<\/td><\/tr><tr><th>6<\/th><td>sous-groupe?<\/td><td class=\"h1\">e∈H,_stable_loi_et_inverse<\/td><\/tr><tr><th>7<\/th><td>multiplicité<\/td><td class=\"h1\">P(a)=…=P^(m−1)(a)=0<\/td><\/tr><tr><th>8<\/th><td>éléments_simples<\/td><td class=\"h1\">partie_entière_puis_pôles<\/td><\/tr><\/table><\/figure><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Aucune annale d&#39;Algèbre 1 n&#39;a été fournie. L&#39;examen blanc ci-dessous imite le style du polycopié et des TD (2 h, sans calculatrice, à titre indicatif). Le vrai barème et le format sont à demander au prof.<\/p>\n<\/aside><h2>Examen blanc (2 heures)<\/h2>\n<section class=\"exo\"><h3>Exercice 1 · Logique et ensembles (4 points)<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>(a) Écris la négation de : $\\forall \\varepsilon &gt; 0,\\ \\exists N \\in \\mathbb N,\\ \\forall n \\ge N,\\ |u_n| &lt; \\varepsilon$. (b) Montre par récurrence que $\\sum_{k=1}^n k = \\frac{n(n+1)}2$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>(a) $\\exists \\varepsilon &gt; 0,\\ \\forall N \\in \\mathbb N,\\ \\exists n \\ge N,\\ |u_n| \\ge \\varepsilon$.\n(b) $n = 1$ : $1 = 1$. Si vrai au rang $n$, $\\sum_{k=1}^{n+1} k = \\frac{n(n+1)}2 + n + 1 = \\frac{(n+1)(n+2)}2$. Vrai pour tout $n \\ge 1$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Exercice 2 · Applications et relations (4 points)<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>(a) $f : \\mathbb R \\setminus \\{1\\} \\to \\mathbb R \\setminus \\{1\\}$, $f(x) = \\frac{x+1}{x-1}$. Montre que $f$ est bijective et calcule $f^{-1}$. (b) Sur $\\mathbb R$, $x \\mathcal R y \\iff x^2 - y^2 = x - y$. Est-ce une équivalence ? Donne la classe de $2$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>(a) Résous y = f(x). (b) x² − x = y² − y.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>(a) $y = \\frac{x+1}{x-1} \\iff y(x - 1) = x + 1 \\iff x(y - 1) = y + 1 \\iff x = \\frac{y+1}{y-1}$ (avec $y \\neq 1$, et on vérifie $x \\neq 1$). Chaque $y$ a un unique antécédent : bijective, et $f^{-1} = f$ (involution).\n(b) $x \\mathcal R y \\iff g(x) = g(y)$ avec $g(t) = t^2 - t$ : c&#39;est réflexif, symétrique, transitif (égalité des images). $\\mathrm{Cl}(2) = \\{y \\mid y^2 - y = 2\\} = \\{2, -1\\}$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Exercice 3 · Arithmétique (4 points)<\/h3><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>(a) Calcule $\\mathrm{PGCD}(252, 198)$ et un couple de Bézout. (b) Résous $252x + 198y = 36$ dans $\\mathbb Z^2$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>(a) $252 = 198 + 54$ ; $198 = 3 \\times 54 + 36$ ; $54 = 36 + 18$ ; $36 = 2 \\times 18$. PGCD $= 18$. En remontant : $18 = 54 - 36 = 54 - (198 - 3 \\cdot 54) = 4 \\cdot 54 - 198 = 4(252 - 198) - 198 = 4 \\cdot 252 - 5 \\cdot 198$.\n(b) On divise par 18 : $14x + 11y = 2$. Solution particulière : $(8, -10)$ (deux fois $(4, -5)$). Puis $14(x - 8) = -11(y + 10)$, $14 \\wedge 11 = 1$ : $x = 8 + 11k$, $y = -10 - 14k$, $k \\in \\mathbb Z$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Exercice 4 · Structures (4 points)<\/h3><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>$G = \\{x + y\\sqrt3 \\mid x, y \\in \\mathbb Q\\} \\setminus \\{0\\}$. Montre que $(G, \\times)$ est un sous-groupe de $(\\mathbb R^*, \\times)$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Pour l&#39;inverse, multiplie par le conjugué x − y√3.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>$G \\subseteq \\mathbb R^*$ ; $1 = 1 + 0\\sqrt3 \\in G$. Produit : $(x + y\\sqrt3)(x' + y'\\sqrt3) = (xx' + 3yy') + (xy' + yx')\\sqrt3$, non nul comme produit de réels non nuls. Inverse : $\\frac{1}{x + y\\sqrt3} = \\frac{x - y\\sqrt3}{x^2 - 3y^2}$ ; le dénominateur est non nul car $\\sqrt3 \\notin \\mathbb Q$ (si $x^2 = 3y^2$ avec $y \\neq 0$, alors $\\sqrt3 = |x/y|$ serait rationnel ; si $y = 0$, $x \\neq 0$). Donc l&#39;inverse est dans $G$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Exercice 5 · Polynômes et fractions (4 points)<\/h3><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>(a) Montre que 1 est racine double de $P = X^3 - 3X + 2$ et factorise $P$. (b) Décompose $\\frac{1}{P}$ en éléments simples.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><d
