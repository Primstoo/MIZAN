const MODULE={"slug":"culture-digitale","titre":"Culture digitale (Digital skills)","cle":"culture-digitale_scores","cleEtat":"culture-digitale_scores_etat","format":"score10","intro":"<p>Ce module suit <strong>les 4 séquences du cours<\/strong> : matériel, logiciel, Internet et le Web, intelligence artificielle.<\/p>\n<p><strong>Comment l&#39;utiliser<\/strong><\/p>\n<ol>\n<li>Lis un chapitre, puis fais son QCM. <strong>8/10 = chapitre maîtrisé.<\/strong><\/li>\n<li>L&#39;évaluation est un quiz : les dates, définitions et « qui a fait quoi » comptent. Les flashcards servent à ça.<\/li>\n<li>Termine par le <strong>quiz d&#39;entraînement final<\/strong> (20 questions).<\/li>\n<\/ol>\n<p><strong>Ce qui est sûr<\/strong> : le contenu vient du résumé détaillé des séquences et des quiz.\n<strong>À vérifier<\/strong> : le nombre de questions et la durée du quiz officiel. Les compléments hors support sont signalés par un encadré « Attention ».<\/p>\n","annexes":[],"cartes":null,"maths":false};
const CHAPS=[{"id":"materiel","t":"Environnement de travail · le matériel","seance":"Séquence 1","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Aucun prérequis technique. Il faut juste savoir qu&#39;un ordinateur manipule des informations codées en <strong>0 et 1<\/strong>.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Combien de bits contient un octet ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 8<\/b><\/p><p>Un octet = 8 bits. Un bit vaut 0 ou 1.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Pense à l&#39;ordinateur comme à une équipe : chaque composant a <strong>un seul rôle<\/strong>. Retiens le rôle, pas la fiche technique.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Confondre <strong>RAM<\/strong> et <strong>ROM<\/strong>. La RAM est <strong>volatile<\/strong> (effacée à l&#39;extinction). La ROM est <strong>permanente<\/strong> et contient le démarrage (BIOS).<\/p>\n<\/aside><p>À la fin, tu sais nommer les composants, raconter l&#39;évolution du microprocesseur et classer un périphérique.<\/p>\n<h2>Idée 1 · Les composants principaux<\/h2>\n<p>Chaque composant a un rôle précis ; la carte mère les relie tous.<\/p>\n<p><strong>Qui fait quoi ?<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Composant<\/th>\n<th>Rôle<\/th>\n<th>À retenir<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>Carte mère<\/strong><\/td>\n<td>relie et fait communiquer tout<\/td>\n<td>spécifique à certains processeurs<\/td>\n<\/tr>\n<tr>\n<td><strong>CPU<\/strong><\/td>\n<td>exécute les instructions<\/td>\n<td>vitesse en Hertz<\/td>\n<\/tr>\n<tr>\n<td><strong>RAM<\/strong><\/td>\n<td>stockage temporaire<\/td>\n<td>volatile, &gt; 4 Go = plus fluide<\/td>\n<\/tr>\n<tr>\n<td><strong>ROM<\/strong><\/td>\n<td>stockage permanent<\/td>\n<td>contient le BIOS<\/td>\n<\/tr>\n<tr>\n<td><strong>Disque dur<\/strong><\/td>\n<td>stockage permanent des fichiers<\/td>\n<td>IDE, SATA, SSD<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Exemple : tu ouvres Word. Le fichier est lu sur le <strong>disque<\/strong>, copié en <strong>RAM<\/strong>, et le <strong>CPU<\/strong> exécute le programme. Si le courant coupe, ce qui n&#39;était pas enregistré (en RAM) est perdu.<\/p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Disques : <strong>IDE<\/strong> (ancien) → <strong>SATA<\/strong> (plus rapide) → <strong>SSD<\/strong> (le plus rapide, résiste aux chocs, plus cher).<\/p>\n<\/aside><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le résumé dit que les SSD sont « résistants aux chocs, mais aussi les plus fragiles ». C&#39;est contradictoire. En pratique, un SSD n&#39;a pas de pièce mobile : il résiste <strong>mieux<\/strong> aux chocs qu&#39;un disque dur classique ; sa limite est l&#39;usure après de très nombreuses écritures. Au quiz, retiens « plus rapides et plus chers ».<\/p>\n<\/aside><h2>Idée 2 · L&#39;évolution du microprocesseur<\/h2>\n<figure class=\"flux\"><figcaption>De la lampe à la puce<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">Tubes à vide (ENIAC, 1945)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Transistor (TRADIC, 1955)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Microprocesseur (Intel 4004, 1971)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Quantique (Sycamore, 54 Q-bits)<\/div><\/div><\/figure><p>L&#39;Intel 4004 (1971) : <strong>2300 transistors<\/strong>, <strong>92 600 opérations/s<\/strong>. La <strong>loi de Moore<\/strong> (Gordon Moore) : le nombre de transistors sur une puce <strong>double tous les deux ans<\/strong>. Aujourd&#39;hui, la gravure descend <strong>sous 10 nm<\/strong>.<\/p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Q-bit = 0, 1 <strong>ou une superposition des deux<\/strong>. Les ordinateurs quantiques sont puissants mais encore instables.<\/p>\n<\/aside><h2>Idée 3 · Comment le processeur travaille<\/h2>\n<p>Le CPU ne comprend que le <strong>binaire<\/strong>. Les transistors sont des interrupteurs ; combinés, ils forment des <strong>portes logiques<\/strong> (ET, OU…). Le code <strong>ASCII<\/strong> facilite la communication homme-machine.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Le cycle d'exécution<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Charger<\/div><p>l&#39;instruction est lue en mémoire<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Décoder<\/div><p>le processeur comprend ce qu&#39;il faut faire<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Exécuter<\/div><p>l&#39;UAL fait le calcul<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Stocker<\/div><p>le résultat est rangé (registre, mémoire)<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p><strong>Les unités internes<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Unité<\/th>\n<th>Rôle<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>Registres<\/strong><\/td>\n<td>mémoire ultra-rapide, temporaire<\/td>\n<\/tr>\n<tr>\n<td><strong>Cache<\/strong><\/td>\n<td>réduit l&#39;attente vers la RAM<\/td>\n<\/tr>\n<tr>\n<td><strong>Unité d&#39;instruction<\/strong><\/td>\n<td>lit, code et envoie à l&#39;unité de contrôle<\/td>\n<\/tr>\n<tr>\n<td><strong>Unité de contrôle<\/strong><\/td>\n<td>synchronise (séquenceur, compteur ordinal, registre d&#39;instructions)<\/td>\n<\/tr>\n<tr>\n<td><strong>UAL<\/strong><\/td>\n<td>calculs de base et logique<\/td>\n<\/tr>\n<tr>\n<td><strong>FPU<\/strong><\/td>\n<td>calculs complexes (virgule flottante)<\/td>\n<\/tr>\n<tr>\n<td><strong>Gestion des bus<\/strong><\/td>\n<td>flux entre CPU et RAM<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h2>Idée 4 · Les périphériques<\/h2>\n<p>Un périphérique permet à l&#39;ordinateur de communiquer avec l&#39;extérieur. On le classe selon <strong>le sens<\/strong> de l&#39;information.<\/p>\n<p><strong>Classer un périphérique<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Entrée<\/th>\n<th>Sortie<\/th>\n<th>Entrée-Sortie<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>Clavier, souris<\/strong><\/td>\n<td>Écran<\/td>\n<td>Clé USB<\/td>\n<\/tr>\n<tr>\n<td><strong>Scanner, micro, webcam<\/strong><\/td>\n<td>Haut-parleurs<\/td>\n<td>Graveur CD/DVD<\/td>\n<\/tr>\n<tr>\n<td><strong>Écran tactile, manette<\/strong><\/td>\n<td>Imprimante<\/td>\n<td>Routeur<\/td>\n<\/tr>\n<\/tbody><\/table>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Méthode pour classer<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Question<\/div><p>l&#39;information va-t-elle vers l&#39;ordinateur, vers l&#39;utilisateur, ou les deux ?<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Vers l&#39;ordinateur<\/div><p>entrée (le scanner numérise)<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Vers l&#39;utilisateur<\/div><p>sortie (l&#39;imprimante reproduit)<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Les deux<\/div><p>entrée-sortie (la clé USB lit et reçoit)<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le support classe le « lecteur CD/DVD » en entrée et le « lecteur/graveur » en entrée-sortie. La nuance : un lecteur ne fait que lire, un graveur écrit aussi. L&#39;écran tactile est en entrée dans le support (il est aussi un écran, donc souvent classé entrée-sortie ailleurs).<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Un PC perd le document non enregistré après une coupure de courant. Quel composant est en cause et pourquoi ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>La RAM : elle est volatile, son contenu disparaît sans alimentation.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Selon la loi de Moore, une puce a 1 million de transistors. Combien en aura-t-elle environ 4 ans plus tard ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 4000000<\/b><\/p><p>Doublement tous les 2 ans : ×2 après 2 ans, ×4 après 4 ans, donc 4 millions.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Classe : webcam, imprimante, routeur.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Webcam : entrée. Imprimante : sortie. Routeur : entrée-sortie.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quel composant relie tous les autres ?<\/div><button class=\"opt\" data-o=\"0\">Le disque dur<\/button><button class=\"opt\" data-o=\"1\">La carte mère<\/button><button class=\"opt\" data-o=\"2\">La RAM<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">La mémoire vive (RAM) est…<\/div><button class=\"opt\" data-o=\"0\">volatile<\/button><button class=\"opt\" data-o=\"1\">permanente<\/button><button class=\"opt\" data-o=\"2\">en lecture seule<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Où se trouvent les instructions de démarrage (BIOS) ?<\/div><button class=\"opt\" data-o=\"0\">RAM<\/button><button class=\"opt\" data-o=\"1\">ROM<\/button><button class=\"opt\" data-o=\"2\">Cache<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">En quelle unité mesure-t-on la vitesse d&#39;un microprocesseur ?<\/div><button class=\"opt\" data-o=\"0\">Octets<\/button><button class=\"opt\" data-o=\"1\">Hertz<\/button><button class=\"opt\" data-o=\"2\">Watts<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Quelle technologie de disque est la plus rapide ?<\/div><button class=\"opt\" data-o=\"0\">IDE<\/button><button class=\"opt\" data-o=\"1\">SATA<\/button><button class=\"opt\" data-o=\"2\">SSD<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Premier microprocesseur commercialisé par Intel ?<\/div><button class=\"opt\" data-o=\"0\">Intel 8086<\/button><button class=\"opt\" data-o=\"1\">Intel 4004<\/button><button class=\"opt\" data-o=\"2\">Pentium<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">La loi de Moore prédit que le nombre de transistors…<\/div><button class=\"opt\" data-o=\"0\">double chaque année<\/button><button class=\"opt\" data-o=\"1\">double tous les deux ans<\/button><button class=\"opt\" data-o=\"2\">triple tous les dix ans<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Quelle unité synchronise l&#39;exécution des instructions ?<\/div><button class=\"opt\" data-o=\"0\">UAL<\/button><button class=\"opt\" data-o=\"1\">Unité de contrôle<\/button><button class=\"opt\" data-o=\"2\">FPU<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Un scanner est un périphérique…<\/div><button class=\"opt\" data-o=\"0\">d&#39;entrée<\/button><button class=\"opt\" data-o=\"1\">de sortie<\/button><button class=\"opt\" data-o=\"2\">d&#39;entrée-sortie<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Un Q-bit peut valoir…<\/div><button class=\"opt\" data-o=\"0\">seulement 0<\/button><button class=\"opt\" data-o=\"1\">0 ou 1 uniquement<\/button><button class=\"opt\" data-o=\"2\">0, 1 ou une superposition des deux<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"materiel","rep":["8"],"tol":null},{"n":"materiel","rep":null,"tol":null},{"n":"materiel","rep":["4000000"],"tol":null},{"n":"materiel","rep":null,"tol":null}],"qcm":[{"n":"materiel","q":"Quel composant relie tous les autres ?","o":["Le disque dur","La carte mère","La RAM"],"a":1,"e":"La carte mère assure la connexion et la communication entre les composants."},{"n":"materiel","q":"La mémoire vive (RAM) est…","o":["volatile","permanente","en lecture seule"],"a":0,"e":"Son contenu est perdu à l&#39;extinction."},{"n":"materiel","q":"Où se trouvent les instructions de démarrage (BIOS) ?","o":["RAM","ROM","Cache"],"a":1,"e":"La ROM garde les informations sans alimentation."},{"n":"materiel","q":"En quelle unité mesure-t-on la vitesse d&#39;un microprocesseur ?","o":["Octets","Hertz","Watts"],"a":1,"e":"La fréquence du CPU se mesure en Hertz (souvent GHz)."},{"n":"materiel","q":"Quelle technologie de disque est la plus rapide ?","o":["IDE","SATA","SSD"],"a":2,"e":"Le SSD est le plus rapide (et le plus cher)."},{"n":"materiel","q":"Premier microprocesseur commercialisé par Intel ?","o":["Intel 8086","Intel 4004","Pentium"],"a":1,"e":"Intel 4004, 1971, 2300 transistors."},{"n":"materiel","q":"La loi de Moore prédit que le nombre de transistors…","o":["double chaque année","double tous les deux ans","triple tous les dix ans"],"a":1,"e":"Formulée par Gordon Moore : doublement tous les deux ans."},{"n":"materiel","q":"Quelle unité synchronise l&#39;exécution des instructions ?","o":["UAL","Unité de contrôle","FPU"],"a":1,"e":"Elle contient séquenceur, compteur ordinal et registre d&#39;instructions."},{"n":"materiel","q":"Un scanner est un périphérique…","o":["d&#39;entrée","de sortie","d&#39;entrée-sortie"],"a":0,"e":"Il numérise un document vers l&#39;ordinateur."},{"n":"materiel","q":"Un Q-bit peut valoir…","o":["seulement 0","0 ou 1 uniquement","0, 1 ou une superposition des deux"],"a":2,"e":"C&#39;est la particularité de l&#39;informatique quantique."}]},{"id":"logiciel","t":"Environnement de travail · le logiciel","seance":"Séquence 2","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut connaître les composants matériels de la séquence 1 (CPU, RAM, disque) : le système d&#39;exploitation sert justement à les gérer.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Quel composant stocke les fichiers de façon permanente ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Le disque dur (ou SSD).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Le système d&#39;exploitation (SE, ou OS) est un <strong>chef d&#39;orchestre<\/strong> entre toi, les applications et le matériel. Tout le chapitre tourne autour de cette image.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Mélanger les dates Windows. Retiens les tournants : <strong>1985<\/strong> Windows 1, <strong>1995<\/strong> menu Démarrer, <strong>2001<\/strong> XP, <strong>2007<\/strong> Vista (échec), <strong>2015<\/strong> Windows 10, <strong>2021<\/strong> Windows 11.<\/p>\n<\/aside><p>À la fin, tu sais décrire les parties d&#39;un SE, ses quatre phases historiques et la chronologie de Windows.<\/p>\n<h2>Idée 1 · À quoi sert un système d&#39;exploitation<\/h2>\n<p>Le SE fait le lien entre le matériel, l&#39;utilisateur et les applications : il gère mémoire, fichiers, matériel et connexion Internet.<\/p>\n<figure class=\"flux\"><figcaption>Le SE au milieu<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">Utilisateur<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Applications<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Système d&#39;exploitation (noyau)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Matériel<\/div><\/div><\/figure><table>\n<thead>\n<tr>\n<th>Partie<\/th>\n<th>Rôle<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>Noyau (kernel)<\/strong><\/td>\n<td>cœur : processus, mémoire, fichiers, entrées/sorties, réseau. Accès direct restreint (sécurité)<\/td>\n<\/tr>\n<tr>\n<td><strong>API<\/strong><\/td>\n<td>outils pour que les développeurs créent des programmes compatibles<\/td>\n<\/tr>\n<tr>\n<td><strong>GUI<\/strong><\/td>\n<td>interface graphique : icônes, menus<\/td>\n<\/tr>\n<tr>\n<td><strong>Terminal<\/strong><\/td>\n<td>commandes en ligne, pour utilisateurs avancés<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Exemple : tu double-cliques sur une icône (GUI) ; le noyau charge le programme du disque vers la RAM et lui donne du temps processeur.<\/p>\n<h2>Idée 2 · Les quatre phases de l&#39;histoire des SE<\/h2>\n<table>\n<thead>\n<tr>\n<th>Phase<\/th>\n<th>Période<\/th>\n<th>Ce qui change<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Préhistoire<\/td>\n<td>1949-1955<\/td>\n<td>pas de SE, tubes à vide, le constructeur est aussi programmeur et opérateur<\/td>\n<\/tr>\n<tr>\n<td>2e phase<\/td>\n<td>1956-1965<\/td>\n<td>transistors, premiers SE, cartes perforées, <strong>traitement par lots<\/strong><\/td>\n<\/tr>\n<tr>\n<td>3e phase<\/td>\n<td>1961-1972<\/td>\n<td>circuits intégrés, <strong>multiprogrammation<\/strong>, <strong>temps partagé<\/strong> (plusieurs utilisateurs via terminaux)<\/td>\n<\/tr>\n<tr>\n<td>4e phase<\/td>\n<td>1972-aujourd&#39;hui<\/td>\n<td>ordinateurs personnels : MS-DOS, CP/M, MacOS, Unix, Linux, Windows<\/td>\n<\/tr>\n<\/tbody><\/table>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>MS-DOS : mode réel, <strong>mono-tâche<\/strong>, <strong>mono-utilisateur<\/strong>, ligne de commande.<\/p>\n<\/aside><h2>Idée 3 · La chronologie de Windows<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>De MS-DOS à Windows 11<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/10 · 1975<\/div><p>Bill Gates et Paul Allen créent Microsoft<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/10 · 1981 · MS-DOS<\/div><p>premier SE de Microsoft, lignes de commande, pas d&#39;interface graphique<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/10 · 1985 · Windows 1<\/div><p>première interface graphique sur MS-DOS, souris obligatoire (jeu Reversi)<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/10 · 1990 · Windows 3<\/div><p>CD-ROM et cartes son, arrivée du Solitaire<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/10 · 1995 · Windows 95<\/div><p>barre des tâches, menu Démarrer, corbeille<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">6/10 · 2001 · XP<\/div><p>interface assouplie, sécurité accrue, bureau à distance<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">7/10 · 2007 · Vista<\/div><p>échec commercial (performances, compatibilité)<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">8/10 · 2009 · Windows 7<\/div><p>retour de la satisfaction des utilisateurs<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">9/10 · 2015 · Windows 10<\/div><p>« en tant que service », Cortana, Edge<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">10/10 · 2021 · Windows 11<\/div><p>nouveau design, applications Android<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le support décrit « Windows 365 » comme un abonnement à la dernière version de Microsoft Office. En réalité, l&#39;offre Office s&#39;appelle Microsoft 365 ; Windows 365 est un PC Windows dans le cloud. Au quiz, réponds selon le cours si la question reprend sa formulation.<\/p>\n<\/aside><h2>Idée 4 · Les TP Windows<\/h2>\n<p>Les TP portent sur le bureau, la barre des tâches, le menu Démarrer, les paramètres et la gestion des fichiers.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Gérer un fichier (TP)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/6 · Naviguer<\/div><p>ouvre l&#39;Explorateur et va dans le bon dossier<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/6 · Créer<\/div><p>clic droit &gt; Nouveau &gt; Dossier, puis renomme<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/6 · Copier ou déplacer<\/div><p>Ctrl+C / Ctrl+X puis Ctrl+V<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/6 · Supprimer<\/div><p>le fichier part dans la corbeille<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/6 · Restaurer<\/div><p>dans la corbeille, clic droit &gt; Restaurer<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">6/6 · Compresser<\/div><p>avec WinRAR, pour envoyer un dossier en un seul fichier<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Les raccourcis Ctrl+C, Ctrl+X, Ctrl+V ne figurent pas dans le résumé : ce sont des compléments utiles pour le TP.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Quelle notion de la 3e phase permet à plusieurs utilisateurs d&#39;utiliser le même ordinateur en même temps ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : temps partagé<\/b><\/p><p>Le temps partagé, rendu possible par la multiprogrammation.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Quelle version de Windows a introduit le menu Démarrer et la corbeille ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : Windows 95<\/b><\/p><p>Windows 95 (1995).<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Pourquoi l&#39;accès direct au noyau est-il restreint ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Pour la sécurité : une erreur ou un programme malveillant pourrait bloquer tout le système.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quelle est la partie principale du système d&#39;exploitation ?<\/div><button class=\"opt\" data-o=\"0\">L&#39;interface graphique<\/button><button class=\"opt\" data-o=\"1\">Le noyau<\/button><button class=\"opt\" data-o=\"2\">Le terminal<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">À quoi servent les API ?<\/div><button class=\"opt\" data-o=\"0\">À afficher des icônes<\/button><button class=\"opt\" data-o=\"1\">À aider les développeurs à créer des programmes compatibles<\/button><button class=\"opt\" data-o=\"2\">À refroidir le processeur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Pendant la préhistoire des SE (1949-1955)…<\/div><button class=\"opt\" data-o=\"0\">il n&#39;y avait pas de SE<\/button><button class=\"opt\" data-o=\"1\">on utilisait Windows<\/button><button class=\"opt\" data-o=\"2\">on utilisait le temps partagé<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Les cartes perforées et le traitement par lots caractérisent…<\/div><button class=\"opt\" data-o=\"0\">la préhistoire<\/button><button class=\"opt\" data-o=\"1\">la 2e phase (1956-1965)<\/button><button class=\"opt\" data-o=\"2\">la 4e phase<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Qui a fondé Microsoft en 1975 ?<\/div><button class=\"opt\" data-o=\"0\">Steve Jobs et Steve Wozniak<\/button><button class=\"opt\" data-o=\"1\">Bill Gates et Paul Allen<\/button><button class=\"opt\" data-o=\"2\">Tim Berners-Lee<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">MS-DOS est…<\/div><button class=\"opt\" data-o=\"0\">mono-tâche et en ligne de commande<\/button><button class=\"opt\" data-o=\"1\">multitâche avec interface graphique<\/button><button class=\"opt\" data-o=\"2\">un navigateur web<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Quel jeu accompagnait Windows 1 pour apprendre la souris ?<\/div><button class=\"opt\" data-o=\"0\">Solitaire<\/button><button class=\"opt\" data-o=\"1\">Reversi<\/button><button class=\"opt\" data-o=\"2\">Démineur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Quelle version a été un échec commercial ?<\/div><button class=\"opt\" data-o=\"0\">Windows 7<\/button><button class=\"opt\" data-o=\"1\">Windows Vista<\/button><button class=\"opt\" data-o=\"2\">Windows XP<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Quelle version permet d&#39;installer des applications Android ?<\/div><button class=\"opt\" data-o=\"0\">Windows 10<\/button><button class=\"opt\" data-o=\"1\">Windows 11<\/button><button class=\"opt\" data-o=\"2\">Windows 95<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Windows 10 a introduit…<\/div><button class=\"opt\" data-o=\"0\">la corbeille<\/button><button class=\"opt\" data-o=\"1\">Cortana et Microsoft Edge<\/button><button class=\"opt\" data-o=\"2\">le Solitaire<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"logiciel","rep":null,"tol":null},{"n":"logiciel","rep":["temps partagé"],"tol":null},{"n":"logiciel","rep":["Windows 95"],"tol":null},{"n":"logiciel","rep":null,"tol":null}],"qcm":[{"n":"logiciel","q":"Quelle est la partie principale du système d&#39;exploitation ?","o":["L&#39;interface graphique","Le noyau","Le terminal"],"a":1,"e":"Le noyau gère processus, mémoire, fichiers, E/S et réseau."},{"n":"logiciel","q":"À quoi servent les API ?","o":["À afficher des icônes","À aider les développeurs à créer des programmes compatibles","À refroidir le processeur"],"a":1,"e":"Interfaces de programmation d&#39;application."},{"n":"logiciel","q":"Pendant la préhistoire des SE (1949-1955)…","o":["il n&#39;y avait pas de SE","on utilisait Windows","on utilisait le temps partagé"],"a":0,"e":"Le constructeur était programmeur et opérateur."},{"n":"logiciel","q":"Les cartes perforées et le traitement par lots caractérisent…","o":["la préhistoire","la 2e phase (1956-1965)","la 4e phase"],"a":1,"e":"Avec l&#39;arrivée des transistors."},{"n":"logiciel","q":"Qui a fondé Microsoft en 1975 ?","o":["Steve Jobs et Steve Wozniak","Bill Gates et Paul Allen","Tim Berners-Lee"],"a":1,"e":"Bill Gates et Paul Allen."},{"n":"logiciel","q":"MS-DOS est…","o":["mono-tâche et en ligne de commande","multitâche avec interface graphique","un navigateur web"],"a":0,"e":"Mode réel, mono-tâche, mono-utilisateur."},{"n":"logiciel","q":"Quel jeu accompagnait Windows 1 pour apprendre la souris ?","o":["Solitaire","Reversi","Démineur"],"a":1,"e":"Reversi (le Solitaire arrive avec Windows 3)."},{"n":"logiciel","q":"Quelle version a été un échec commercial ?","o":["Windows 7","Windows Vista","Windows XP"],"a":1,"e":"Problèmes de performance et de compatibilité."},{"n":"logiciel","q":"Quelle version permet d&#39;installer des applications Android ?","o":["Windows 10","Windows 11","Windows 95"],"a":1,"e":"Windows 11 (2021)."},{"n":"logiciel","q":"Windows 10 a introduit…","o":["la corbeille","Cortana et Microsoft Edge","le Solitaire"],"a":1,"e":"Avec une approche « en tant que service »."}]},{"id":"internet-web","t":"Internet et le Web","seance":"Séquence 3","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir ce qu&#39;est un périphérique d&#39;entrée-sortie comme le <strong>routeur<\/strong> (séquence 1) : il revient ici comme pièce clé d&#39;Internet.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Le routeur est-il un périphérique d&#39;entrée, de sortie ou d&#39;entrée-sortie ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>D&#39;entrée-sortie : il reçoit et envoie des données.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Internet<\/strong> est la route, <strong>le Web<\/strong> est un service qui roule dessus (comme l&#39;e-mail). Garde cette image.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Dire « Internet = Web ». Le Web (1991, Tim Berners-Lee) est arrivé 20 ans après ARPANET (1971).<\/p>\n<\/aside><p>À la fin, tu sais dater les étapes d&#39;Internet, expliquer IP, DNS et routeurs, et décrire une URL et le trio HTML/CSS/JavaScript.<\/p>\n<h2>Idée 1 · L&#39;histoire d&#39;Internet<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Les grandes dates<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/11 · 1971 · ARPANET<\/div><p>réseau américain (Guerre froide) qui multiplie les chemins pour survivre à une attaque<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/11 · 1971 · e-mail<\/div><p>premier courrier électronique, par Tomlinson<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/11 · 1983<\/div><p>adoption du mot « Internet » (interconnexion de réseaux)<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/11 · 1984 → 1989<\/div><p>de 1 000 à 100 000 ordinateurs connectés (usage scientifique)<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/11 · 1991 · Web<\/div><p>inventé par Tim Berners-Lee<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">6/11 · 1993 / 1995<\/div><p>navigateurs Mosaic puis Internet Explorer<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">7/11 · 1995 / 1998<\/div><p>moteurs de recherche Yahoo puis Google<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">8/11 · 1996<\/div><p>36 millions d&#39;ordinateurs connectés<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">9/11 · Années 2000<\/div><p>Web 2.0, les utilisateurs créent du contenu (Facebook, Twitter, LinkedIn)<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">10/11 · Années 2010<\/div><p>mobilité, smartphones<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">11/11 · Aujourd&#39;hui<\/div><p>Internet des objets (IoT)<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Web 1.0 = contenu <strong>statique<\/strong> ; Web 2.0 = les utilisateurs <strong>créent et partagent<\/strong>.<\/p>\n<\/aside><h2>Idée 2 · IP, DNS, routeurs<\/h2>\n<figure class=\"flux\"><figcaption>Ce qui se passe quand tu tapes www.google.com<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">Navigateur<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Serveur DNS (nom → adresse IP)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Routeurs (tables de routage)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Serveur de Google<\/div><\/div><\/figure><table>\n<thead>\n<tr>\n<th>Notion<\/th>\n<th>Rôle<\/th>\n<th>Exemple<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>Adresse IP<\/strong><\/td>\n<td>identifiant unique d&#39;un appareil<\/td>\n<td>IPv4 : 203.0.113.45<\/td>\n<\/tr>\n<tr>\n<td><strong>IPv4<\/strong><\/td>\n<td>4 nombres, ~4,3 milliards d&#39;adresses, en voie d&#39;épuisement<\/td>\n<td>203.0.113.45<\/td>\n<\/tr>\n<tr>\n<td><strong>IPv6<\/strong><\/td>\n<td>format long, résout la pénurie<\/td>\n<td>2001:0db8:85a3:0000:0000:8a2e:0370:7334<\/td>\n<\/tr>\n<tr>\n<td><strong>DNS<\/strong><\/td>\n<td>traduit un nom de domaine en adresse IP<\/td>\n<td><a href=\"http://www.google.com\">www.google.com<\/a> → IP<\/td>\n<\/tr>\n<tr>\n<td><strong>Routeur<\/strong><\/td>\n<td>relie les réseaux et achemine les paquets<\/td>\n<td>choisit le chemin le plus court et fiable<\/td>\n<\/tr>\n<\/tbody><\/table>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Complément hors support : 4,3 milliards vient de 2³² (adresses IPv4 sur 32 bits). IPv6 utilise 128 bits.<\/p>\n<\/aside><h2>Idée 3 · Le Web : client, serveur, URL<\/h2>\n<p>Le <strong>client<\/strong> (navigateur) envoie une requête ; le <strong>serveur<\/strong> la traite et renvoie la ressource.<\/p>\n<figure class=\"flux\"><figcaption>Une URL décortiquée<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">https:// (protocole)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\"><a href=\"http://www.fsabm.ma\">www.fsabm.ma<\/a> (nom de domaine)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">/cours/s1 (chemin)<\/div><\/div><\/figure><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>L&#39;adresse <a href=\"http://www.fsabm.ma\">www.fsabm.ma<\/a> est un exemple de construction d&#39;URL, pas une adresse vérifiée.<\/p>\n<\/aside><ul>\n<li><strong>HTTP<\/strong> : protocole standard d&#39;échange sur le Web.<\/li>\n<li><strong>HTTPS<\/strong> : version sécurisée, <strong>chiffrée<\/strong> (confidentialité et intégrité). À exiger pour mots de passe et paiements.<\/li>\n<\/ul>\n<h2>Idée 4 · HTML, CSS, JavaScript<\/h2>\n<table>\n<thead>\n<tr>\n<th>Langage<\/th>\n<th>Rôle<\/th>\n<th>Image<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>HTML<\/strong><\/td>\n<td>structure : titres, paragraphes, images<\/td>\n<td>le squelette<\/td>\n<\/tr>\n<tr>\n<td><strong>CSS<\/strong><\/td>\n<td>apparence : couleurs, polices, marges<\/td>\n<td>les vêtements<\/td>\n<\/tr>\n<tr>\n<td><strong>JavaScript<\/strong><\/td>\n<td>interactivité<\/td>\n<td>les muscles<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p style=\"color:#D9824F\">Bonjour<\/p><p>Ici, <code>&lt;p&gt;<\/code> est du HTML (un paragraphe) et <code>color:#D9824F<\/code> du CSS (la couleur).<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Quel système traduit « <a href=\"http://www.google.com\">www.google.com<\/a> » en adresse IP ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : DNS<\/b><\/p><p>Le DNS (Domain Name System).<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Pourquoi a-t-on créé IPv6 ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Parce que les ~4,3 milliards d&#39;adresses IPv4 sont en voie d&#39;épuisement.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Dans <a href=\"https://www.exemple.com/page\">https://www.exemple.com/page<\/a>, donne le protocole, le domaine et le chemin.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Protocole : https. Domaine : <a href=\"http://www.exemple.com\">www.exemple.com<\/a>. Chemin : /page.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">En quelle année ARPANET a-t-il été créé (selon le cours) ?<\/div><button class=\"opt\" data-o=\"0\">1945<\/button><button class=\"opt\" data-o=\"1\">1971<\/button><button class=\"opt\" data-o=\"2\">1991<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Qui a envoyé le premier e-mail ?<\/div><button class=\"opt\" data-o=\"0\">Tomlinson<\/button><button class=\"opt\" data-o=\"1\">Tim Berners-Lee<\/button><button class=\"opt\" data-o=\"2\">Bill Gates<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Qui a inventé le World Wide Web ?<\/div><button class=\"opt\" data-o=\"0\">Gordon Moore<\/button><button class=\"opt\" data-o=\"1\">Tim Berners-Lee<\/button><button class=\"opt\" data-o=\"2\">Alan Turing<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Quel navigateur est sorti en 1993 ?<\/div><button class=\"opt\" data-o=\"0\">Mosaic<\/button><button class=\"opt\" data-o=\"1\">Internet Explorer<\/button><button class=\"opt\" data-o=\"2\">Chrome<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Le Web 2.0 se caractérise par…<\/div><button class=\"opt\" data-o=\"0\">des pages statiques<\/button><button class=\"opt\" data-o=\"1\">du contenu créé et partagé par les utilisateurs<\/button><button class=\"opt\" data-o=\"2\">l&#39;invention des transistors<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Combien d&#39;adresses environ offre IPv4 ?<\/div><button class=\"opt\" data-o=\"0\">4,3 millions<\/button><button class=\"opt\" data-o=\"1\">4,3 milliards<\/button><button class=\"opt\" data-o=\"2\">illimité<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Le rôle du DNS est de…<\/div><button class=\"opt\" data-o=\"0\">convertir un nom de domaine en adresse IP<\/button><button class=\"opt\" data-o=\"1\">chiffrer les données<\/button><button class=\"opt\" data-o=\"2\">afficher les pages<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Le routeur…<\/div><button class=\"opt\" data-o=\"0\">stocke les sites web<\/button><button class=\"opt\" data-o=\"1\">relie les réseaux et achemine les paquets<\/button><button class=\"opt\" data-o=\"2\">traduit les noms de domaine<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Quelle version du protocole chiffre les échanges ?<\/div><button class=\"opt\" data-o=\"0\">HTTP<\/button><button class=\"opt\" data-o=\"1\">HTTPS<\/button><button class=\"opt\" data-o=\"2\">HTML<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Quel langage structure le contenu d&#39;une page ?<\/div><button class=\"opt\" data-o=\"0\">HTML<\/button><button class=\"opt\" data-o=\"1\">CSS<\/button><button class=\"opt\" data-o=\"2\">JavaScript<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"internet-web","rep":null,"tol":null},{"n":"internet-web","rep":["DNS"],"tol":null},{"n":"internet-web","rep":null,"tol":null},{"n":"internet-web","rep":null,"tol":null}],"qcm":[{"n":"internet-web","q":"En quelle année ARPANET a-t-il été créé (selon le cours) ?","o":["1945","1971","1991"],"a":1,"e":"En pleine Guerre froide, par les États-Unis."},{"n":"internet-web","q":"Qui a envoyé le premier e-mail ?","o":["Tomlinson","Tim Berners-Lee","Bill Gates"],"a":0,"e":"En 1971."},{"n":"internet-web","q":"Qui a inventé le World Wide Web ?","o":["Gordon Moore","Tim Berners-Lee","Alan Turing"],"a":1,"e":"En 1991."},{"n":"internet-web","q":"Quel navigateur est sorti en 1993 ?","o":["Mosaic","Internet Explorer","Chrome"],"a":0,"e":"Internet Explorer arrive en 1995."},{"n":"internet-web","q":"Le Web 2.0 se caractérise par…","o":["des pages statiques","du contenu créé et partagé par les utilisateurs","l&#39;invention des transistors"],"a":1,"e":"Réseaux sociaux : Facebook, Twitter, LinkedIn."},{"n":"internet-web","q":"Combien d&#39;adresses environ offre IPv4 ?","o":["4,3 millions","4,3 milliards","illimité"],"a":1,"e":"D&#39;où son épuisement et la création d&#39;IPv6."},{"n":"internet-web","q":"Le rôle du DNS est de…","o":["convertir un nom de domaine en adresse IP","chiffrer les données","afficher les pages"],"a":0,"e":"C&#39;est le traducteur d&#39;Internet."},{"n":"internet-web","q":"Le routeur…","o":["stocke les sites web","relie les réseaux et achemine les paquets","traduit les noms de domaine"],"a":1,"e":"Avec des tables de routage."},{"n":"internet-web","q":"Quelle version du protocole chiffre les échanges ?","o":["HTTP","HTTPS","HTML"],"a":1,"e":"HTTPS garantit confidentialité et intégrité."},{"n":"internet-web","q":"Quel langage structure le contenu d&#39;une page ?","o":["HTML","CSS","JavaScript"],"a":0,"e":"CSS gère l&#39;apparence, JavaScript l&#39;interactivité."}]},{"id":"intelligence-artificielle","t":"L'intelligence artificielle","seance":"Séquence 4","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut se souvenir que le <strong>GPU<\/strong>, le <strong>cloud<\/strong> et la puissance des processeurs (loi de Moore) ont progressé : l&#39;IA moderne en dépend.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Que prédit la loi de Moore ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Le nombre de transistors sur une puce double tous les deux ans.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Range tout dans <strong>trois vagues<\/strong> : prémices (1940-1970), Machine/Deep Learning (1980-2010), explosion (2020-…). Chaque nom célèbre a sa vague.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Croire que l&#39;IA « pense ». Pour le cours, l&#39;IA est une <strong>imitation<\/strong> de l&#39;intelligence, pas une intelligence biologique.<\/p>\n<\/aside><p>À la fin, tu sais définir l&#39;IA, citer ses usages, dater ses grandes étapes et distinguer IA classique et IA générative.<\/p>\n<h2>Idée 1 · Définition et usages<\/h2>\n<p>L&#39;IA vise à rendre les machines capables d&#39;agir de façon appropriée et prévoyante dans leur environnement.<\/p>\n<table>\n<thead>\n<tr>\n<th>Usage<\/th>\n<th>Ce qu&#39;elle fait<\/th>\n<th>Exemple<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>Prédiction<\/strong><\/td>\n<td>apprend une relation f : x → y<\/td>\n<td>prix d&#39;une maison, score d&#39;un match<\/td>\n<\/tr>\n<tr>\n<td><strong>Classification<\/strong><\/td>\n<td>range dans des groupes<\/td>\n<td>trier les spams, classer des fruits<\/td>\n<\/tr>\n<tr>\n<td><strong>Contrôle<\/strong><\/td>\n<td>agit dans un environnement<\/td>\n<td>déplacer un robot, jouer à un jeu<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Deux façons d&#39;interagir : avec une <strong>base de données<\/strong> (images → résultats) ou avec un <strong>environnement<\/strong> (état → action).<\/p>\n<h2>Idée 2 · Les trois vagues<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Histoire de l'IA<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/8 · Guerre mondiale<\/div><p>Alan Turing décrypte ENIGMA avec la machine « Victory »<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/8 · Années 50 · test de Turing<\/div><p>une machine peut-elle imiter une conversation humaine ?<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/8 · Années 60 · Arthur Samuel<\/div><p>IA qui apprend seule à jouer aux dames<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/8 · Années 70 · hiver de l&#39;IA<\/div><p>moins d&#39;investissements après un optimisme excessif<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/8 · Années 80 · Machine Learning<\/div><p>la machine apprend des données, sans programmation explicite<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">6/8 · Années 90 · Deep Blue (IBM)<\/div><p>bat Garry Kasparov aux échecs<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">7/8 · 2000-2010 · Deep Learning<\/div><p>réseaux de neurones ; AlphaGo (DeepMind/Google) bat le champion de Go<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">8/8 · 2020-…<\/div><p>Big Data, GPU, Cloud, IA générative<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le support dit qu&#39;Arthur Samuel a « battu le champion du monde » de dames. Les sources historiques parlent d&#39;une victoire contre un bon joueur (1962), pas contre un champion du monde. De même, Deep Blue (1997) reposait surtout sur la recherche par force brute plutôt que sur le Machine Learning. Au quiz, suis la formulation du cours.<\/p>\n<\/aside><h2>Idée 3 · L&#39;IA générative<\/h2>\n<figure class=\"flux\"><figcaption>Comment elle répond<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">Prompt (instruction)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Modèle statistique (prédit la suite)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Nouveau contenu (texte, image, son)<\/div><\/div><\/figure><table>\n<thead>\n<tr>\n<th><\/th>\n<th>IA classique (discriminante)<\/th>\n<th>IA générative<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Sortie<\/td>\n<td>un nombre, une probabilité, une classe<\/td>\n<td>du langage, de la parole, une image<\/td>\n<\/tr>\n<tr>\n<td>Exemple<\/td>\n<td>« c&#39;est un chien »<\/td>\n<td>génère une nouvelle image de chien<\/td>\n<\/tr>\n<\/tbody><\/table>\n<ul>\n<li>C&#39;est un sous-domaine du <strong>Deep Learning<\/strong>.<\/li>\n<li>Ses modèles font partie des <strong>modèles de fondation<\/strong> (entraînés sur d&#39;énormes données, adaptables).<\/li>\n<li><strong>Multimodalité<\/strong> : texte → vidéo, vidéo → podcast, audio → slides.<\/li>\n<li>Bill Gates y voit la <strong>3e grande époque<\/strong> de l&#39;informatique, après Internet et le mobile.<\/li>\n<\/ul>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le quiz officiel a un thème « ChatGPT », absent du résumé. Complément : ChatGPT (OpenAI, novembre 2022) est un assistant conversationnel d&#39;IA générative basé sur un grand modèle de langage (GPT).<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Trier des e-mails entre « spam » et « non spam » : prédiction, classification ou contrôle ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : classification<\/b><\/p><p>Classification : on range chaque e-mail dans un groupe.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Quel programme d&#39;IBM a battu Garry Kasparov ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : Deep Blue<\/b><\/p><p>Deep Blue, dans les années 90.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Donne la différence clé entre IA classique et IA générative.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>La classique produit un nombre, une probabilité ou une classe ; la générative produit un nouveau contenu (texte, parole, image).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Selon le cours, l&#39;IA est…<\/div><button class=\"opt\" data-o=\"0\">une intelligence biologique<\/button><button class=\"opt\" data-o=\"1\">une imitation de l&#39;intelligence<\/button><button class=\"opt\" data-o=\"2\">un composant matériel<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Prévoir le prix d&#39;une maison relève de…<\/div><button class=\"opt\" data-o=\"0\">la prédiction<\/button><button class=\"opt\" data-o=\"1\">la classification<\/button><button class=\"opt\" data-o=\"2\">du contrôle<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Diriger les déplacements d&#39;un robot relève de…<\/div><button class=\"opt\" data-o=\"0\">la prédiction<\/button><button class=\"opt\" data-o=\"1\">la classification<\/button><button class=\"opt\" data-o=\"2\">du contrôle<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Qui a décrypté la machine ENIGMA ?<\/div><button class=\"opt\" data-o=\"0\">Alan Turing et son équipe<\/button><button class=\"opt\" data-o=\"1\">Arthur Samuel<\/button><button class=\"opt\" data-o=\"2\">Garry Kasparov<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">L&#39;« hiver de l&#39;IA » correspond aux années…<\/div><button class=\"opt\" data-o=\"0\">50<\/button><button class=\"opt\" data-o=\"1\">70<\/button><button class=\"opt\" data-o=\"2\">2020<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">       if (svgCache.has(cle)) return poser(svgCache.get(cle));
      file = file.then(() => MathJax.tex2svgPromise(sp.textContent, { display: sp.dataset.d === '1' }).then((n) => { svgCache.set(cle, n); poser(n); })).catch(() => {});
    })).catch(() => {});
  }
  async function ask(q, deep) {
    q = (q || '').trim(); deep = deep || $('#mztDeep').checked;
    if (busy || !q) return; if (!sample) { note(); return; }
    const c = refreshCtx();
    if (!cur || (cur.sec !== c.label && !forced)) { cur = { id: 't' + Date.now().toString(36), sec: c.label, date: today(), title: q.slice(0, 80), msgs: [] }; ST.threads.push(cur); }
    else if (!ST.threads.includes(cur)) ST.threads.push(cur);
    cur.msgs.push({ r: 'u', t: q }); busy = true; renderLog();
    const out = document.createElement('div'); out.className = 'mzt-m a'; out.textContent = deep ? 'Réflexion approfondie…' : 'Réflexion…'; $('#mztLog').appendChild(out);
    $('#mztSend').disabled = true; $('#mztStop').hidden = false;
    const style = deep
      ? 'Réponse APPROFONDIE (400 à 700 mots) : 1) l\'intuition avec une analogie, 2) l\'explication détaillée pas à pas, 3) pourquoi ça marche, 4) un exemple complet chiffré, 5) les pièges fréquents et ce qui tombe à l\'examen, 6) une question pour vérifier la compréhension.'
      : 'Réponse EXPLICATIVE (150 à 250 mots) : 1) l\'idée en une phrase, 2) l\'explication pas à pas, 3) un petit exemple chiffré ou concret, 4) une courte question pour vérifier la compréhension.';
    const mem = [];
    if (ST.memos.length) mem.push('DIFFICULTÉS DÉJÀ REPÉRÉES :\n' + ST.memos.slice(-12).map((m) => `- ${m.date} : ${m.text}`).join('\n'));
    const lastQ = ST.threads.flatMap((t) => t.msgs.filter((m) => m.r === 'u').map((m) => `[${t.sec}] ${m.t.slice(0, 100)}`)).slice(-6);
    if (lastQ.length) mem.push('SES DERNIÈRES QUESTIONS :\n' + lastQ.map((x) => '- ' + x).join('\n'));
    const rules = `Tu es le tuteur de ${C.student}, pour le module ${C.module}${C.prof ? ' du ' + C.prof : ''}. Il apprend souvent la notion pour la première fois.
Règles : réponds en français simple, en Markdown léger (**gras** pour les termes clés, tirets, étapes numérotées). Toute formule ou tout calcul s'écrit en LaTeX : $…$ dans la phrase, $$…$$ seul sur sa ligne pour une formule importante (ex. $\\hat y_i$, $$\\text{MSE}=\\frac{1}{n}\\sum_{i=1}^{n}(y_i-\\hat y_i)^2$$) ; jamais d'accents graves pour une formule, ils sont réservés au code et aux noms de fonctions. Un petit tableau Markdown est permis s'il clarifie (3 colonnes maximum, l'écran est étroit). ${style} Appuie-toi d'abord sur l'EXTRAIT ci-dessous et sur les conventions du prof ; si une source générale diffère du cours, signale l'écart et dis quelle version utiliser à l'examen (celle du prof). Pour un calcul, pose chaque étape et vérifie-la. S'il envoie une réponse ou une photo de brouillon, corrige étape par étape et nomme précisément l'erreur. Si tu n'es pas sûr, dis-le. S'il demande un mini-exercice, donne l'exercice sans la solution.
Utilise sa mémoire pour faire des liens avec ses confusions passées, sans la réciter.
Termine TOUJOURS par une dernière ligne séparée au format exact « MÉMO: … » qui résume en 15 mots maximum la difficulté révélée par sa question (ou « MÉMO: rien »). Cette ligne lui est cachée.
${C.conventions ? 'CONVENTIONS DU PROF : ' + C.conventions + '\n' : ''}MÉMOIRE DE L'ÉLÈVE :
${mem.join('\n\n') || '(rien pour l\'instant)'}
EXTRAIT (${c.label}) :
${c.text.slice(0, deep ? 9000 : 3500)}`;
    const recent = cur.msgs.slice(deep ? -9 : -5, -1).map((m) => ({ role: m.r === 'u' ? 'user' : 'assistant', content: m.t }));
    while (recent.length && recent[0].role !== 'user') recent.shift();
    const msgs = [...recent.filter((m) => m.content && m.content.trim()), { role: 'user', content: q }]; while (msgs.length > 1 && msgs[0].role !== 'user') msgs.shift(); msgs[0] = { role: 'user', content: rules + '\n\n---\nQuestion : ' + msgs[0].content };
    ctl = new AbortController();
    const opts = { modelTier: deep ? 'complex' : 'quick', cache: false, signal: ctl.signal, onText: ({ text }) => { out.innerHTML = md(visible(text)); dessinerMaths(out); $('#mztLog').scrollTop = 1e9; } };
    if (img) opts.images = [img];
    try {
      const r = await sample(msgs, opts);
      const mm = r.text.match(/(?:^|\n)\s*M[ÉE]MO\s*:\s*(.+)\s*$/i);
      cur.msgs.push({ r: 'a', t: visible(r.text) + (r.truncated ? '\n\n(Réponse coupée : pose une question plus ciblée.)' : ''), d: !!deep });
      if (mm && !/^\s*rien/i.test(mm[1])) { ST.memos.push({ date: today(), text: mm[1].trim().slice(0, 160) }); if (ST.memos.length > 30) ST.memos.shift(); saveMemos(); }
      await saveThread(cur);
    } catch (e) {
      const kept = e && e.text ? visible(e.text) : '';
      if (e && e.code === 'cancelled') { if (kept) cur.msgs.push({ r: 'a', t: kept + '\n(Arrêté.)' }); else cur.msgs.pop(); }
      else { cur.msgs.pop(); compacter(!!cur.msgs.length); out.textContent = (kept ? kept + '\n\n' : '') + (ERR[e && e.code] || 'Le tuteur n\'a pas pu répondre. Réessaie dans un instant.'); }
      if (!cur.msgs.length) ST.threads = ST.threads.filter((t) => t !== cur);
      saveLocal();
      if (!(e && e.code === 'cancelled')) { busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImgN').textContent = ''; return; }
    }
    busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImg').value = ''; $('#mztImgN').textContent = ''; renderLog();
  }

  // ---------- événements ----------
  $('#mztBtn').onclick = () => openPanel(null);
  $('#mztX').onclick = closePanel;
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#mztPan').hidden) closePanel(); });
  $('#mztTabH').onclick = () => view($('#mztHist').hidden ? 'hist' : 'chat');
  $('#mztTabM').onclick = () => view($('#mztMem').hidden ? 'mem' : 'chat');
  $('#mztQ').oninput = renderList;
  $('#mztList').onclick = (e) => { const id = e.target.dataset && e.target.dataset.cont; if (!id) return; cur = ST.threads.find((t) => t.id === id); view('chat'); $('#mztCtx').textContent = '· ' + cur.sec; renderLog(); };
  $('#mztMemL').onclick = (e) => { const i = e.target.dataset && e.target.dataset.memdel; if (i == null) return; ST.memos.splice(+i, 1); saveMemos(); renderMem(); };
  $('#mztChips').onclick = (e) => { const b = e.target.closest('[data-chip]'); if (!b) return; const t = $('#mztIn'); t.value = b.dataset.chip + (t.value ? ' : ' + t.value : ''); t.focus(); };
  $('#mztNew').onclick = () => { cur = null; renderLog(); };
  $('#mztStop').onclick = () => { if (ctl) ctl.abort(); };
  $('#mztImg').onchange = (e) => { img = e.target.files[0] || null; $('#mztImgN').textContent = img ? 'Photo : ' + img.name : ''; };
  $('#mztF').onsubmit = (e) => { e.preventDefault(); const v = $('#mztIn').value; $('#mztIn').value = ''; ask(v); };
  $('#mztIn').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#mztF').requestSubmit(); } });

  // ---------- capacités (facultatives) ----------
  const W = window.claude;
  if (W && W.use) {
    W.use('sample').then((s) => { sample = s; ready = true; note();
      if (s && s.limits) s.limits().then((l) => { if (l && l.images) { imgOK = true; $('#mztImgL').hidden = false; if (l.images.mediaTypes) $('#mztImg').accept = l.images.mediaTypes.join(','); } }).catch(() => {});
    }).catch(() => { ready = true; note(); });
    Promise.all([W.use('db'), W.use('user')]).then(async ([d, u]) => {
      if (!d || !u) return; const id = await u.id(); if (!id) return; db = d; base = 'data/users/' + id + '/mzt_' + C.id;
      try {
        const m = await db.doc(base).get(); if (m.exists) { const v = m.data() || {}; if (Array.isArray(v.memos)) ST.memos = JSON.parse(JSON.stringify(v.memos)); }
        const q = await db.collection(base + '/threads').get(); const remote = q.docs.map((x) => Object.assign({ id: x.id }, JSON.parse(JSON.stringify(x.data() || {}))));
        const map = {}; [...ST.threads, ...remote].forEach((t) => { if (!map[t.id] || (t.msgs || []).length > (map[t.id].msgs || []).length) map[t.id] = t; });
        ST.threads = Object.values(map).sort((a, b) => parseInt(a.id.slice(1), 36) - parseInt(b.id.slice(1), 36)); saveLocal();
      } catch (e) {}
    }).catch(() => {});
  } else { ready = true; note(); }

  window.MZT = { open: openPanel, close: closePanel };
})();

</script>

a.href=p.indexOf("/decouvrir")===0||location.pathname.indexOf("/decouvrir")===0?"/decouvrir":"/app/modules";})();</script>
