class=\"\"><code>#include &lt;iostream&gt;\n#include &lt;string&gt;\nusing namespace std;\n\nclass Individu {\nprotected:\n    string nom, prenom, mail;\npublic:\n    Individu(string n = &quot;&quot;, string p = &quot;&quot;, string m = &quot;&quot;) : nom(n), prenom(p), mail(m) {} // Q4\n    Individu(const Individu&amp; i) : nom(i.nom), prenom(i.prenom), mail(i.mail) {}          // Q5\n    virtual ~Individu() {}\n    string ObtenirNom() const { return nom; }          // Q2\n    string ObtenirPrenom() const { return prenom; }\n    string ObtenirMail() const { return mail; }\n    void ModifierNom(string n) { nom = n; }            // Q3\n    void ModifierPrenom(string p) { prenom = p; }\n    void ModifierMail(string m) { mail = m; }\n    virtual void Affiche() const {                     // Q6 (const + virtual)\n        cout &lt;&lt; prenom &lt;&lt; &quot; &quot; &lt;&lt; nom &lt;&lt; &quot; &lt;&quot; &lt;&lt; mail &lt;&lt; &quot;&gt;&quot;;\n    }\n    Individu&amp; operator=(const Individu&amp; i) {           // Q7\n        if (this != &amp;i) { nom = i.nom; prenom = i.prenom; mail = i.mail; }\n        return *this;\n    }\n};\n\nclass Etudiant : public Individu {                     // Q8\n    int Promo;\n    string groupe;\npublic:\n    Etudiant(string n = &quot;&quot;, string p = &quot;&quot;, string m = &quot;&quot;, int pr = 0, string g = &quot;&quot;)\n        : Individu(n, p, m), Promo(pr), groupe(g) {}   // Q10\n    void Affiche() const override {                    // Q9\n        cout &lt;&lt; &quot;Etudiant : &quot;; Individu::Affiche();\n        cout &lt;&lt; &quot;, promo &quot; &lt;&lt; Promo &lt;&lt; &quot;, groupe &quot; &lt;&lt; groupe &lt;&lt; endl;\n    }\n};\n\nclass Enseignant : public Individu {                   // Q11\n    string matiere;\npublic:\n    Enseignant(string n = &quot;&quot;, string p = &quot;&quot;, string m = &quot;&quot;, string mat = &quot;&quot;)\n        : Individu(n, p, m), matiere(mat) {}           // Q13\n    void Affiche() const override {                    // Q12\n        cout &lt;&lt; &quot;Enseignant : &quot;; Individu::Affiche();\n        cout &lt;&lt; &quot;, matiere &quot; &lt;&lt; matiere &lt;&lt; endl;\n    }\n};\n\nclass Departement {                                    // Q14\n    Etudiant** etudiants;\n    Enseignant** enseignants;\n    int nbEtudiants, nbEnseignants, maxEt, maxEns;\npublic:\n    Departement(int me = 100, int mens = 20)           // Q15\n        : nbEtudiants(0), nbEnseignants(0), maxEt(me), maxEns(mens) {\n        etudiants = new Etudiant*[maxEt];\n        enseignants = new Enseignant*[maxEns];\n    }\n    ~Departement() { delete[] etudiants; delete[] enseignants; }\n    Departement(const Departement&amp;) = delete;\n    Departement&amp; operator=(const Departement&amp;) = delete;\n    void AjouterEtudiant(Etudiant* e) {                // Q16\n        if (nbEtudiants &lt; maxEt) etudiants[nbEtudiants++] = e;\n    }\n    void AjouterEnseignant(Enseignant* e) {            // Q17\n        if (nbEnseignants &lt; maxEns) enseignants[nbEnseignants++] = e;\n    }\n    void EnleverEtudiant(Etudiant* e) {                // Q18\n        for (int i = 0; i &lt; nbEtudiants; i++)\n            if (etudiants[i] == e) {\n                etudiants[i] = etudiants[--nbEtudiants]; // l'ordre n'a pas d'importance\n                return;\n            }\n    }\n    int EffectifEtudiants() const { return nbEtudiants; } // Q19\n    void Affiche() const {\n        for (int i = 0; i &lt; nbEnseignants; i++) enseignants[i]-&gt;Affiche();\n        for (int i = 0; i &lt; nbEtudiants; i++) etudiants[i]-&gt;Affiche();\n    }\n};\n\nint main() {\n    Etudiant e1(&quot;Idrissi&quot;, &quot;Ali&quot;, &quot;ali@usms.ma&quot;, 2022, &quot;G1&quot;);\n    Etudiant e2(&quot;Bennani&quot;, &quot;Hiba&quot;, &quot;hiba@usms.ma&quot;, 2022, &quot;G2&quot;);\n    Enseignant p1(&quot;Safi&quot;, &quot;Karim&quot;, &quot;safi@usms.ma&quot;, &quot;C++&quot;);\n    Individu* tab[2] = { &amp;e1, &amp;p1 };\n    for (Individu* i : tab) i-&gt;Affiche();   // liaison dynamique\n    Departement info;\n    info.AjouterEtudiant(&amp;e1);\n    info.AjouterEtudiant(&amp;e2);\n    info.AjouterEnseignant(&amp;p1);\n    cout &lt;&lt; &quot;Effectif : &quot; &lt;&lt; info.EffectifEtudiants() &lt;&lt; endl;\n    info.EnleverEtudiant(&amp;e1);\n    cout &lt;&lt; &quot;Effectif : &quot; &lt;&lt; info.EffectifEtudiants() &lt;&lt; endl;\n    info.Affiche();\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Etudiant : Ali Idrissi &lt;ali@usms.ma&gt;, promo 2022, groupe G1\nEnseignant : Karim Safi &lt;safi@usms.ma&gt;, matiere C++\nEffectif : 2\nEffectif : 1\nEnseignant : Karim Safi &lt;safi@usms.ma&gt;, matiere C++\nEtudiant : Hiba Bennani &lt;hiba@usms.ma&gt;, promo 2022, groupe G2<\/code><\/pre><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Oublier <code>virtual<\/code> devant <code>Affiche()<\/code> dans <code>Individu<\/code> : la boucle sur <code>Individu*<\/code> afficherait alors deux fois la version de la base, sans promo ni matière.<\/p>\n<\/aside><section class=\"exo\"><h3>Questions de l&#39;examen 2021-2022<\/h3><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Q10 : écris le constructeur d&#39;<code>Etudiant<\/code> qui initialise tous les attributs.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>Etudiant(string n, string p, string m, int pr, string g) : Individu(n, p, m), Promo(pr), groupe(g) {}<\/code> : la partie <code>Individu<\/code> est construite par le constructeur de la base, dans la liste d&#39;initialisation.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>Q9 : comment <code>Etudiant::Affiche()<\/code> réutilise-t-elle l&#39;affichage de la base ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>En appelant <code>Individu::Affiche();<\/code> (opérateur de résolution de portée), puis en affichant <code>Promo<\/code> et <code>groupe<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><p>Q5 : le constructeur de recopie d&#39;<code>Individu<\/code> est-il indispensable ici ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Non : les attributs sont des <code>string<\/code>, qui savent se recopier. La recopie par défaut suffit ; on l&#39;écrit parce que le sujet la demande. Elle devient indispensable dès qu&#39;il y a un pointeur avec <code>new<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"7\"><div class=\"ex-q\"><p>Q18 : <code>EnleverEtudiant<\/code> doit-elle faire <code>delete<\/code> sur l&#39;étudiant ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Non : le département ne fait que <strong>référencer<\/strong> des étudiants créés ailleurs (ici sur la pile). Un <code>delete<\/code> sur un objet non alloué par <code>new<\/code> est une erreur.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quelle signature permet d&#39;appeler <code>Affiche()<\/code> sur un <code>const Client<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">void Affiche()<\/button><button class=\"opt\" data-o=\"1\">void Affiche() const<\/button><button class=\"opt\" data-o=\"2\">const void Affiche()<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Que doit renvoyer <code>operator=<\/code> pour permettre <code>a = b = c<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">void<\/button><button class=\"opt\" data-o=\"1\">Client (par valeur)<\/button><button class=\"opt\" data-o=\"2\">Client&amp; (*this)<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Où écrit-on les valeurs par défaut d&#39;un constructeur ?<\/div><button class=\"opt\" data-o=\"0\">Dans sa déclaration (prototype)<\/button><button class=\"opt\" data-o=\"1\">Dans le corps du constructeur<\/button><button class=\"opt\" data-o=\"2\">Dans le main<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Dans <code>Etudiant(...) : Individu(n, p, m), Promo(pr)<\/code>, qui est construit en premier ?<\/div><button class=\"opt\" data-o=\"0\">La partie Individu<\/button><button class=\"opt\" data-o=\"1\">Promo<\/button><button class=\"opt\" data-o=\"2\">groupe<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Un <code>Individu* p = &amp;etudiant; p-&gt;Affiche();<\/code> appelle <code>Etudiant::Affiche<\/code> si :<\/div><button class=\"opt\" data-o=\"0\">Affiche est publique<\/button><button class=\"opt\" data-o=\"1\">Affiche est virtual dans Individu<\/button><button class=\"opt\" data-o=\"2\">Etudiant hérite en protected<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Pourquoi <code>LigneCommande<\/code> garde-t-elle un <code>Article*<\/code> sans le détruire ?<\/div><button class=\"opt\" data-o=\"0\">L&#39;article existe en dehors de la ligne (il ne lui appartient pas)<\/button><button class=\"opt\" data-o=\"1\">Parce que delete est interdit dans une classe<\/button><button class=\"opt\" data-o=\"2\">Pour gagner de la mémoire sur la pile<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Que fait <code>Commande(const Commande&amp;) = delete;<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">Il détruit la commande<\/button><button class=\"opt\" data-o=\"1\">Il interdit la copie d&#39;une commande<\/button><button class=\"opt\" data-o=\"2\">Il crée une copie vide<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Pour enlever l&#39;élément d&#39;indice i d&#39;un tableau de n pointeurs en gardant l&#39;ordre :<\/div><button class=\"opt\" data-o=\"0\">on fait delete tab[i]<\/button><button class=\"opt\" data-o=\"1\">on décale tab[j] = tab[j+1] pour j de i à n−2, puis n--<\/button><button class=\"opt\" data-o=\"2\">on met tab[i] = nullptr sans changer n<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Les attributs d&#39;<code>Individu<\/code> doivent être lisibles directement dans <code>Etudiant<\/code>. On les déclare :<\/div><button class=\"opt\" data-o=\"0\">private<\/button><button class=\"opt\" data-o=\"1\">protected<\/button><button class=\"opt\" data-o=\"2\">static<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Combien d&#39;appels de constructeur de recopie dans <code>Client c2 = c1;<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">0<\/button><button class=\"opt\" data-o=\"1\">1<\/button><button class=\"opt\" data-o=\"2\">2<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"annales-2022-2023-2021-2022","rep":null,"tol":null},{"n":"annales-2022-2023-2021-2022","rep":null,"tol":null},{"n":"annales-2022-2023-2021-2022","rep":null,"tol":null},{"n":"annales-2022-2023-2021-2022","rep":null,"tol":null},{"n":"annales-2022-2023-2021-2022","rep":null,"tol":null},{"n":"annales-2022-2023-2021-2022","rep":null,"tol":null},{"n":"annales-2022-2023-2021-2022","rep":null,"tol":null},{"n":"annales-2022-2023-2021-2022","rep":null,"tol":null}],"qcm":[{"n":"annales-2022-2023-2021-2022","q":"Quelle signature permet d&#39;appeler <code>Affiche()<\/code> sur un <code>const Client<\/code> ?","o":["void Affiche()","void Affiche() const","const void Affiche()"],"a":1,"e":"Le <code>const<\/code> après la parenthèse s&#39;applique à l&#39;objet courant (<code>this<\/code>)."},{"n":"annales-2022-2023-2021-2022","q":"Que doit renvoyer <code>operator=<\/code> pour permettre <code>a = b = c<\/code> ?","o":["void","Client (par valeur)","Client&amp; (*this)"],"a":2,"e":"On renvoie une référence sur l&#39;objet modifié."},{"n":"annales-2022-2023-2021-2022","q":"Où écrit-on les valeurs par défaut d&#39;un constructeur ?","o":["Dans sa déclaration (prototype)","Dans le corps du constructeur","Dans le main"],"a":0,"e":"Elles appartiennent à la déclaration ; on ne les répète pas dans la définition séparée."},{"n":"annales-2022-2023-2021-2022","q":"Dans <code>Etudiant(...) : Individu(n, p, m), Promo(pr)<\/code>, qui est construit en premier ?","o":["La partie Individu","Promo","groupe"],"a":0,"e":"La base est toujours construite avant les membres de la dérivée."},{"n":"annales-2022-2023-2021-2022","q":"Un <code>Individu* p = &amp;etudiant; p-&gt;Affiche();<\/code> appelle <code>Etudiant::Affiche<\/code> si :","o":["Affiche est publique","Affiche est virtual dans Individu","Etudiant hérite en protected"],"a":1,"e":"Sans <code>virtual<\/code>, c&#39;est le type du pointeur qui décide."},{"n":"annales-2022-2023-2021-2022","q":"Pourquoi <code>LigneCommande<\/code> garde-t-elle un <code>Article*<\/code> sans le détruire ?","o":["L&#39;article existe en dehors de la ligne (il ne lui appartient pas)","Parce que delete est interdit dans une classe","Pour gagner de la mémoire sur la pile"],"a":0,"e":"Le propriétaire (ici le main) crée et détruit l&#39;article."},{"n":"annales-2022-2023-2021-2022","q":"Que fait <code>Commande(const Commande&amp;) = delete;<\/code> ?","o":["Il détruit la commande","Il interdit la copie d&#39;une commande","Il crée une copie vide"],"a":1,"e":"Toute tentative de copie devient une erreur de compilation."},{"n":"annales-2022-2023-2021-2022","q":"Pour enlever l&#39;élément d&#39;indice i d&#39;un tableau de n pointeurs en gardant l&#39;ordre :","o":["on fait delete tab[i]","on décale tab[j] = tab[j+1] pour j de i à n−2, puis n--","on met tab[i] = nullptr sans changer n"],"a":1,"e":"Le décalage supprime le trou ; n diminue de 1."},{"n":"annales-2022-2023-2021-2022","q":"Les attributs d&#39;<code>Individu<\/code> doivent être lisibles directement dans <code>Etudiant<\/code>. On les déclare :","o":["private","protected","static"],"a":1,"e":"protected : accessibles aux classes dérivées, pas à l&#39;extérieur."},{"n":"annales-2022-2023-2021-2022","q":"Combien d&#39;appels de constructeur de recopie dans <code>Client c2 = c1;<\/code> ?","o":["0","1","2"],"a":1,"e":"Une déclaration avec initialisation par un objet du même type appelle la recopie (pas <code>operator=<\/code>)."}]},{"id":"annale-2020-2021","t":"Annale corrigée · 2020-2021 (Polynome, Employe)","seance":"Examen de fin de semestre (session normale, 2 h)","imp":4,"payant":true,"html":"<aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>Deux exercices : une classe <strong>à pointeur<\/strong> avec toute la panoplie d&#39;opérateurs, puis une <strong>hiérarchie<\/strong> avec redéfinition et liaison dynamique. Ce sont exactement les deux blocs du cours (chapitres 4-5 et 7-8).<\/p>\n<\/aside><h2>Exercice 1 · La classe Polynome<\/h2>\n<p><strong>Énoncé (résumé).<\/strong> Un polynôme a0 + a1x + … + anxⁿ est stocké par son degré (<code>int degre<\/code>) et un tuple de coefficients (<code>int *Tuple<\/code>), par exemple 7 + 2x − 9x² + 8x⁴ → (7, 2, −9, 0, 8). Écrire : 1) le constructeur <code>Polynome(int d, const int *T)<\/code> ; 2) la recopie ; 3) le destructeur ; 4) <code>Afficher()<\/code> ; 5) à 8) <code>operator+<\/code>, <code>*<\/code>, <code>/<\/code> (division entière), <code>%<\/code> ; 9) <code>operator==<\/code> ; 10) <code>operator=<\/code> ; 11) <code>evaluer(int x)<\/code> ; 12) <code>getDegre()<\/code>.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le sujet écrit <code>Operator<\/code> avec une majuscule et <code>Plynome<\/code> : en C++, c&#39;est <code>operator<\/code> et <code>Polynome<\/code>. Autre limite : avec des coefficients <strong>entiers<\/strong>, la division euclidienne n&#39;est exacte que si le coefficient dominant du diviseur divise les coefficients rencontrés (c&#39;est le cas avec x − 1). Le corrigé fait une division entière des coefficients et s&#39;arrête sinon ; écris cette hypothèse sur ta copie.<\/p>\n<\/aside><figure class=\"etapes\" data-i=\"0\"><figcaption>Méthode<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/6 · Constructeur<\/div><p><code>Tuple = new int[degre + 1]<\/code>, puis copie des d + 1 coefficients.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/6 · Recopie et =<\/div><p>copie <strong>profonde<\/strong> (nouveau tableau) ; dans <code>=<\/code>, test d&#39;auto-affectation et <code>delete[]<\/code> de l&#39;ancien.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/6 · Addition<\/div><p>degré max des deux, on additionne terme à terme (0 au-delà du degré).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/6 · Produit<\/div><p>degré d1 + d2, <code>r[i+j] += a[i] * b[j]<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/6 · Division<\/div><p>tant que deg(reste) ≥ deg(diviseur), on retire c·x^k·diviseur, c = dominant(reste) / dominant(diviseur).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">6/6 · Évaluer<\/div><p>schéma de Horner, du coefficient de plus haut degré vers a0.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><pre class=\"\"><code>#include &lt;iostream&gt;\nusing namespace std;\n\nclass Polynome {\n    int degre;\n    int* Tuple;            // Tuple[i] = coefficient de x^i\n    void normaliser() {    // enlève les zéros de tête (garde au moins une valeur)\n        while (degre &gt; 0 &amp;&amp; Tuple[degre] == 0) degre--;\n    }\npublic:\n    Polynome(int d = 0, const int* T = nullptr) : degre(d) {           // 1)\n        Tuple = new int[degre + 1];\n        for (int i = 0; i &lt;= degre; i++) Tuple[i] = T ? T[i] : 0;\n        if (T) normaliser();   // sans tuple : polynôme nul de taille d (pour les calculs)\n    }\n    Polynome(const Polynome&amp; p) : degre(p.degre) {                     // 2)\n        Tuple = new int[degre + 1];\n        for (int i = 0; i &lt;= degre; i++) Tuple[i] = p.Tuple[i];\n    }\n    ~Polynome() { delete[] Tuple; }                                    // 3)\n    void Afficher() const {                                            // 4)\n        bool premier = true;\n        for (int i = 0; i &lt;= degre; i++) {\n            if (Tuple[i] == 0 &amp;&amp; degre &gt; 0) continue;\n            int c = Tuple[i];\n            if (!premier) cout &lt;&lt; (c &lt; 0 ? &quot; - &quot; : &quot; + &quot;);\n            else if (c &lt; 0) cout &lt;&lt; &quot;-&quot;;\n            cout &lt;&lt; (c &lt; 0 ? -c : c);\n            if (i &gt;= 1) cout &lt;&lt; &quot;x&quot;;\n            if (i &gt;= 2) cout &lt;&lt; &quot;^&quot; &lt;&lt; i;\n            premier = false;\n        }\n        cout &lt;&lt; endl;\n    }\n    Polynome operator+(const Polynome&amp; p) const {                      // 5)\n        int d = degre &gt; p.degre ? degre : p.degre;\n        Polynome r(d);\n        for (int i = 0; i &lt;= d; i++)\n            r.Tuple[i] = (i &lt;= degre ? Tuple[i] : 0) + (i &lt;= p.degre ? p.Tuple[i] : 0);\n        r.normaliser();\n        return r;\n    }\n    Polynome operator*(const Polynome&amp; p) const {                      // 6)\n        Polynome r(degre + p.degre);\n        for (int i = 0; i &lt;= degre; i++)\n            for (int j = 0; j &lt;= p.degre; j++)\n                r.Tuple[i + j] += Tuple[i] * p.Tuple[j];\n        r.normaliser();\n        return r;\n    }\n    // division euclidienne : *this = q * p + r, deg r &lt; deg p\n    void diviser(const Polynome&amp; p, Polynome&amp; q, Polynome&amp; r) const {\n        r = *this;\n        q = Polynome(degre &gt;= p.degre ? degre - p.degre : 0);\n        while (r.degre &gt;= p.degre &amp;&amp; !(r.degre == 0 &amp;&amp; r.Tuple[0] == 0)) {\n            int k = r.degre - p.degre;\n            int c = r.Tuple[r.degre] / p.Tuple[p.degre];   // division entière\n            if (c == 0) break;                              // plus divisible dans Z\n            q.Tuple[k] = c;\n            for (int j = 0; j &lt;= p.degre; j++) r.Tuple[j + k] -= c * p.Tuple[j];\n            int avant = r.degre;\n            r.normaliser();\n            if (r.degre == avant) break;                    // reste non annulable\n        }\n        q.normaliser();\n    }\n    Polynome operator/(const Polynome&amp; p) const { Polynome q, r; diviser(p, q, r); return q; } // 7)\n    Polynome operator%(const Polynome&amp; p) const { Polynome q, r; diviser(p, q, r); return r; } // 8)\n    int operator==(const Polynome&amp; p) const {                          // 9)\n        if (degre != p.degre) return 0;\n        for (int i = 0; i &lt;= degre; i++) if (Tuple[i] != p.Tuple[i]) return 0;\n        return 1;\n    }\n    Polynome&amp; operator=(const Polynome&amp; p) {                           // 10)\n        if (this != &amp;p) {\n            delete[] Tuple;\n            degre = p.degre;\n            Tuple = new int[degre + 1];\n            for (int i = 0; i &lt;= degre; i++) Tuple[i] = p.Tuple[i];\n        }\n        return *this;\n    }\n    int evaluer(int x) const {                                         // 11) Horner\n        int s = 0;\n        for (int i = degre; i &gt;= 0; i--) s = s * x + Tuple[i];\n        return s;\n    }\n    int getDegre() const { return degre; }                             // 12)\n};\n\nint main() {\n    int t1[] = {7, 2, -9, 0, 8};          // 7 + 2x - 9x^2 + 8x^4\n    int t2[] = {-1, 1};                   // x - 1\n    Polynome P(4, t1), Q(1, t2);\n    cout &lt;&lt; &quot;P = &quot;; P.Afficher();\n    cout &lt;&lt; &quot;Q = &quot;; Q.Afficher();\n    cout &lt;&lt; &quot;P + Q = &quot;; (P + Q).Afficher();\n    cout &lt;&lt; &quot;P * Q = &quot;; (P * Q).Afficher();\n    cout &lt;&lt; &quot;P / Q = &quot;; (P / Q).Afficher();\n    cout &lt;&lt; &quot;P % Q = &quot;; (P % Q).Afficher();\n    cout &lt;&lt; &quot;P(1) = &quot; &lt;&lt; P.evaluer(1) &lt;&lt; &quot;, P(2) = &quot; &lt;&lt; P.evaluer(2) &lt;&lt; endl;\n    Polynome R = (P / Q) * Q + (P % Q);\n    cout &lt;&lt; &quot;(P/Q)*Q + P%Q == P ? &quot; &lt;&lt; (R == P) &lt;&lt; endl;\n    cout &lt;&lt; &quot;degre de P : &quot; &lt;&lt; P.getDegre() &lt;&lt; endl;\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>P = 7 + 2x - 9x^2 + 8x^4\nQ = -1 + 1x\nP + Q = 6 + 3x - 9x^2 + 8x^4\nP * Q = -7 + 5x + 11x^2 - 9x^3 - 8x^4 + 8x^5\nP / Q = 1 - 1x + 8x^2 + 8x^3\nP % Q = 8\nP(1) = 8, P(2) = 103\n(P/Q)*Q + P%Q == P ? 1\ndegre de P : 4<\/code><\/pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Vérification gratuite à l&#39;examen : le reste de la division par x − 1 vaut P(1). Ici P(1) = 7 + 2 − 9 + 8 = <strong>8<\/strong>, c&#39;est bien <code>P % Q<\/code>.<\/p>\n<\/aside><section class=\"exo\"><h3>Questions de l&#39;exercice 1<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Écris le constructeur de recopie de <code>Polynome<\/code>.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>Polynome(const Polynome&amp; p) : degre(p.degre) { Tuple = new int[degre + 1]; for (int i = 0; i &lt;= degre; i++) Tuple[i] = p.Tuple[i]; }<\/code> : nouveau tableau, puis copie des valeurs (copie profonde).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Pourquoi <code>operator=<\/code> commence-t-il par <code>delete[] Tuple<\/code> (après le test <code>this != &amp;p<\/code>) ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>L&#39;objet de gauche possède déjà un tableau, peut-être de taille différente : on le libère pour ne pas avoir de fuite, puis on en alloue un de la bonne taille.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Calcule P(2) pour P = 7 + 2x − 9x² + 8x⁴ avec Horner.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 103<\/b><\/p><p>Coefficients de haut en bas : 8, 0, −9, 2, 7. s = 8 → 16 → 23 → 48 → <strong>103<\/strong>.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Quel est le degré de P × Q avec deg P = 4 et deg Q = 1 ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 5<\/b><\/p><p>4 + 1 = <strong>5<\/strong> (le produit des coefficients dominants 8 × 1 n&#39;est pas nul).<\/p>\n<\/div><\/div><\/section><h2>Exercice 2 · Employe, Responsable, Commercial, Personnel<\/h2>\n<p><strong>Énoncé (résumé).<\/strong> Un employé a un nom, un matricule et un indice salarial ; salaire = indiceSalarial × valeur, avec valeur = 10 pour tous. a) constructeur, b) <code>afficher<\/code>, c) <code>salaire<\/code>. Un <code>Responsable<\/code> (dérivé) a un titre et un tableau de subordonnés directs : d) constructeur, e) <code>afficher<\/code> redéfinie, f) <code>afficherSubordonnesDirects<\/code>. Un <code>Commercial<\/code> (dérivé) a un fixe et un intéressement sur ses ventes du mois : g) constructeur, h) <code>enregistreVentes<\/code>, i) <code>salaire<\/code> = indiceSalarial × valeur + venteDuMois / 10. Enfin une classe <code>personnel<\/code> qui calcule la somme des salaires à verser.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Méthode<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · valeur commune<\/div><p><code>static const int valeur = 10;<\/code> (un seul exemplaire pour la classe).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · salaire et afficher<\/div><p><code>virtual<\/code> dans <code>Employe<\/code> : <code>Personnel<\/code> manipule des <code>Employe*<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Subordonnés<\/div><p><code>Employe**<\/code> + compteur : un responsable peut diriger des commerciaux comme des employés.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Somme<\/div><p>une boucle <code>s += tab[i]-&gt;salaire();<\/code> : la liaison dynamique choisit la bonne formule.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><pre class=\"\"><code>#include &lt;iostream&gt;\n#include &lt;string&gt;\nusing namespace std;\n\nclass Employe {\nprotected:\n    string nom;\n    int matricule;\n    double indiceSalarial;\n    static const int valeur = 10;          // la même pour tous les employés\npublic:\n    Employe(string n, int m, double ind) : nom(n), matricule(m), indiceSalarial(ind) {} // a)\n    virtual ~Employe() {}\n    virtual void afficher() const {                                                     // b)\n        cout &lt;&lt; nom &lt;&lt; &quot; (matricule &quot; &lt;&lt; matricule &lt;&lt; &quot;, indice &quot; &lt;&lt; indiceSalarial &lt;&lt; &quot;)&quot;;\n    }\n    virtual double salaire() const { return indiceSalarial * valeur; }                  // c)\n};\n\nclass Responsable : public Employe {\n    string titre;\n    Employe** subordonnes;     // inférieurs directs\n    int nbSub, maxSub;\npublic:\n    Responsable(string n, int m, double ind, string t, int max = 10)                    // d)\n        : Employe(n, m, ind), titre(t), nbSub(0), maxSub(max) {\n        subordonnes = new Employe*[maxSub];\n    }\n    ~Responsable() { delete[] subordonnes; }\n    Responsable(const Responsable&amp;) = delete;\n    Responsable&amp; operator=(const Responsable&amp;) = delete;\n    void ajouterSubordonne(Employe* e) { if (nbSub &lt; maxSub) subordonnes[nbSub++] = e; }\n    void afficher() const override {                                                    // e)\n        Employe::afficher(); cout &lt;&lt; &quot;, &quot; &lt;&lt; titre;\n    }\n    void afficherSubordonnesDirects() const {                                           // f)\n        cout &lt;&lt; &quot;Subordonnes de &quot; &lt;&lt; nom &lt;&lt; &quot; :&quot; &lt;&lt; endl;\n        for (int i = 0; i &lt; nbSub; i++) { cout &lt;&lt; &quot;  &quot;; subordonnes[i]-&gt;afficher(); cout &lt;&lt; endl; }\n    }\n};\n\nclass Commercial : public Employe {\n    double venteDuMois;\npublic:\n    Commercial(string n, int m, double ind, double v = 0) : Employe(n, m, ind), venteDuMois(v) {} // g)\n    void enregistreVentes(double v) { venteDuMois = v; }                                // h)\n    double salaire() const override { return indiceSalarial * valeur + venteDuMois / 10; } // i)\n    void afficher() const override { Employe::afficher(); cout &lt;&lt; &quot;, commercial&quot;; }\n};\n\nclass Personnel {\n    Employe** tab;\n    int nb, max;\npublic:\n    Personnel(int m = 100) : nb(0), max(m) { tab = new Employe*[max]; }\n    ~Personnel() { delete[] tab; }\n    Personnel(const Personnel&amp;) = delete;\n    Personnel&amp; operator=(const Personnel&amp;) = delete;\n    void ajouter(Employe* e) { if (nb &lt; max) tab[nb++] = e; }\n    double masseSalariale() const {\n        double s = 0;\n        for (int i = 0; i &lt; nb; i++) s += tab[i]-&gt;salaire();   // virtual : bon salaire\n        return s;\n    }\n};\n\nint main() {\n    Employe e1(&quot;Amine&quot;, 1, 300);\n    Commercial c1(&quot;Nora&quot;, 2, 250);\n    c1.enregistreVentes(5000);\n    Responsable r1(&quot;Youssef&quot;, 3, 500, &quot;Chef de service&quot;);\n    r1.ajouterSubordonne(&amp;e1);\n    r1.ajouterSubordonne(&amp;c1);\n    r1.afficher(); cout &lt;&lt; endl;\n    r1.afficherSubordonnesDirects();\n    Personnel p;\n    p.ajouter(&amp;e1); p.ajouter(&amp;c1); p.ajouter(&amp;r1);\n    cout &lt;&lt; &quot;Salaire de Nora : &quot; &lt;&lt; c1.salaire() &lt;&lt; endl;\n    cout &lt;&lt; &quot;Total a verser : &quot; &lt;&lt; p.masseSalariale() &lt;&lt; endl;\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Youssef (matricule 3, indice 500), Chef de service\nSubordonnes de Youssef :\n  Amine (matricule 1, indice 300)\n  Nora (matricule 2, indice 250), commercial\nSalaire de Nora : 3000\nTotal a verser : 11000<\/code><\/pre><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Sans <code>virtual double salaire()<\/code>, <code>Personnel<\/code> calculerait le salaire de Nora comme un employé ordinaire (2 500 au lieu de 3 000), et le total serait faux sans aucune erreur de compilation.<\/p>\n<\/aside><section class=\"exo\"><h3>Questions de l&#39;exercice 2<\/h3><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Pourquoi <code>valeur<\/code> est-elle <code>static<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Elle est la même pour tous les employés : un seul exemplaire partagé par la classe, au lieu d&#39;une copie par objet.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>Salaire de Nora : indice 250, ventes 5 000 ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 3000<\/b><\/p><p>250 × 10 + 5 000 / 10 = 2 500 + 500 = <strong>3 000<\/strong>.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><p>Total versé pour Amine (indice 300), Nora (ci-dessus) et Youssef (responsable, indice 500) ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 11000<\/b><\/p><p>3 000 + 3 000 + 5 000 = <strong>11 000<\/strong> (le responsable est payé comme un employé : <code>salaire<\/code> n&#39;est pas redéfinie pour lui).<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Taille à allouer pour un polynôme de degré d ?<\/div><button class=\"opt\" data-o=\"0\">d<\/button><button class=\"opt\" data-o=\"1\">d + 1<\/button><button class=\"opt\" data-o=\"2\">2d<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Degré de la somme de deux polynômes de degrés 4 et 1 (au plus) ?<\/div><button class=\"opt\" data-o=\"0\">5<\/button><button class=\"opt\" data-o=\"1\">4<\/button><button class=\"opt\" data-o=\"2\">1<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Que provoque l&#39;absence de constructeur de recopie dans <code>Polynome<\/code> lors d&#39;un passage par valeur ?<\/div><button class=\"opt\" data-o=\"0\">Deux objets partagent le même Tuple, libéré deux fois<\/button><button class=\"opt\" data-o=\"1\">Le compilateur refuse le programme<\/button><button class=\"opt\" data-o=\"2\">Rien de grave<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Le reste de P = 7 + 2x − 9x² + 8x⁴ divisé par x − 1 vaut :<\/div><button class=\"opt\" data-o=\"0\">0<\/button><button class=\"opt\" data-o=\"1\">7<\/button><button class=\"opt\" data-o=\"2\">8<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Pour écrire <code>operator==<\/code>, le sujet impose le type de retour :<\/div><button class=\"opt\" data-o=\"0\">int<\/button><button class=\"opt\" data-o=\"1\">void<\/button><button class=\"opt\" data-o=\"2\">Polynome<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\"><code>static const int valeur = 10;<\/code> dans <code>Employe<\/code> :<\/div><button class=\"opt\" data-o=\"0\">est partagé par tous les employés<\/button><button class=\"opt\" data-o=\"1\">est recopié dans chaque objet<\/button><button class=\"opt\" data-o=\"2\">ne peut pas être lu par les dérivées<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Le salaire d&#39;un commercial (indice 200, ventes 3 000) vaut :<\/div><button class=\"opt\" data-o=\"0\">2 000<\/button><button class=\"opt\" data-o=\"1\">2 300<\/button><button class=\"opt\" data-o=\"2\">5 000<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Pour que <code>Personnel<\/code> appelle le bon <code>salaire()<\/code>, il faut :<\/div><button class=\"opt\" data-o=\"0\">que Commercial hérite en private<\/button><button class=\"opt\" data-o=\"1\">déclarer salaire() virtual dans Employe<\/button><button class=\"opt\" data-o=\"2\">surcharger salaire(int)<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Le tableau de subordonnés d&#39;un responsable a pour type :<\/div><button class=\"opt\" data-o=\"0\">Employe<\/button><button class=\"opt\" data-o=\"1\">Employe**<\/button><button class=\"opt\" data-o=\"2\">Responsable<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Une classe qui possède une méthode virtuelle et est détruite via un pointeur de base doit avoir :<\/div><button class=\"opt\" data-o=\"0\">un destructeur virtual<\/button><button class=\"opt\" data-o=\"1\">un constructeur virtual<\/button><button class=\"opt\" data-o=\"2\">un operator= virtual<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"annale-2020-2021","rep":null,"tol":null},{"n":"annale-2020-2021","rep":null,"tol":null},{"n":"annale-2020-2021","rep":["103"],"tol":null},{"n":"annale-2020-2021","rep":["5"],"tol":null},{"n":"annale-2020-2021","rep":null,"tol":null},{"n":"annale-2020-2021","rep":["3000"],"tol":null},{"n":"annale-2020-2021","rep":["11000"],"tol":null}],"qcm":[{"n":"annale-2020-2021","q":"Taille à allouer pour un polynôme de degré d ?","o":["d","d + 1","2d"],"a":1,"e":"Les coefficients vont de a0 à ad."},{"n":"annale-2020-2021","q":"Degré de       if (code !== null) { code.push(raw); return; }
      let m;
      if ((m = raw.match(/^\s*#{1,6}\s+(.*)$/))) { flush(); out.push('<p><strong>' + inl(m[1]) + '</strong></p>'); }
      else if ((m = raw.match(/^\s*[-*•]\s+(.*)$/))) { if (list !== 'ul') { flush(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + inl(m[1]) + '</li>'); }
      else if ((m = raw.match(/^\s*\d+[.)]\s+(.*)$/))) { if (list !== 'ol') { flush(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + inl(m[1]) + '</li>'); }
      else if (!raw.trim()) flush();
      else { flush(); out.push('<p>' + inl(raw) + '</p>'); }
    });
    if (code !== null) out.push('<pre>' + esc(code.join('\n')) + '</pre>');
    flush(); return out.join('');
  };
  async function ask(q, deep) {
    q = (q || '').trim(); deep = deep || $('#mztDeep').checked;
    if (busy || !q) return; if (!sample) { note(); return; }
    const c = refreshCtx();
    if (!cur || (cur.sec !== c.label && !forced)) { cur = { id: 't' + Date.now().toString(36), sec: c.label, date: today(), title: q.slice(0, 80), msgs: [] }; ST.threads.push(cur); }
    else if (!ST.threads.includes(cur)) ST.threads.push(cur);
    cur.msgs.push({ r: 'u', t: q }); busy = true; renderLog();
    const out = document.createElement('div'); out.className = 'mzt-m a'; out.textContent = deep ? 'Réflexion approfondie…' : 'Réflexion…'; $('#mztLog').appendChild(out);
    $('#mztSend').disabled = true; $('#mztStop').hidden = false;
    const style = deep
      ? 'Réponse APPROFONDIE (400 à 700 mots) : 1) l\'intuition avec une analogie, 2) l\'explication détaillée pas à pas, 3) pourquoi ça marche, 4) un exemple complet chiffré, 5) les pièges fréquents et ce qui tombe à l\'examen, 6) une question pour vérifier la compréhension.'
      : 'Réponse EXPLICATIVE (150 à 250 mots) : 1) l\'idée en une phrase, 2) l\'explication pas à pas, 3) un petit exemple chiffré ou concret, 4) une courte question pour vérifier la compréhension.';
    const mem = [];
    if (ST.memos.length) mem.push('DIFFICULTÉS DÉJÀ REPÉRÉES :\n' + ST.memos.slice(-12).map((m) => `- ${m.date} : ${m.text}`).join('\n'));
    const lastQ = ST.threads.flatMap((t) => t.msgs.filter((m) => m.r === 'u').map((m) => `[${t.sec}] ${m.t.slice(0, 100)}`)).slice(-6);
    if (lastQ.length) mem.push('SES DERNIÈRES QUESTIONS :\n' + lastQ.map((x) => '- ' + x).join('\n'));
    const rules = `Tu es le tuteur de ${C.student}, pour le module ${C.module}${C.prof ? ' du ' + C.prof : ''}. Il apprend souvent la notion pour la première fois.
Règles : réponds en français simple, en Markdown léger (**gras** pour les termes clés, tirets, étapes numérotées, formules et calculs entre accents graves ; pas de tableaux). ${style} Appuie-toi d'abord sur l'EXTRAIT ci-dessous et sur les conventions du prof ; si une source générale diffère du cours, signale l'écart et dis quelle version utiliser à l'examen (celle du prof). Pour un calcul, pose chaque étape et vérifie-la. S'il envoie une réponse ou une photo de brouillon, corrige étape par étape et nomme précisément l'erreur. Si tu n'es pas sûr, dis-le. S'il demande un mini-exercice, donne l'exercice sans la solution.
Utilise sa mémoire pour faire des liens avec ses confusions passées, sans la réciter.
Termine TOUJOURS par une dernière ligne séparée au format exact « MÉMO: … » qui résume en 15 mots maximum la difficulté révélée par sa question (ou « MÉMO: rien »). Cette ligne lui est cachée.
${C.conventions ? 'CONVENTIONS DU PROF : ' + C.conventions + '\n' : ''}MÉMOIRE DE L'ÉLÈVE :
${mem.join('\n\n') || '(rien pour l\'instant)'}
EXTRAIT (${c.label}) :
${c.text.slice(0, deep ? 9000 : 3500)}`;
    const recent = cur.msgs.slice(deep ? -9 : -5, -1).map((m) => ({ role: m.r === 'u' ? 'user' : 'assistant', content: m.t }));
    while (recent.length && recent[0].role !== 'user') recent.shift();
    const msgs = [...recent.filter((m) => m.content && m.content.trim()), { role: 'user', content: q }]; while (msgs.length > 1 && msgs[0].role !== 'user') msgs.shift(); msgs[0] = { role: 'user', content: rules + '\n\n---\nQuestion : ' + msgs[0].content };
    ctl = new AbortController();
    const opts = { modelTier: deep ? 'complex' : 'quick', cache: false, signal: ctl.signal, onText: ({ text }) => { out.innerHTML = md(visible(text)); $('#mztLog').scrollTop = 1e9; } };
    if (img) opts.images = [img];
    try {
      const r = await sample(msgs, opts);
      const mm = r.text.match(/(?:^|\n)\s*M[ÉE]MO\s*:\s*(.+)\s*$/i);
      cur.msgs.push({ r: 'a', t: visible(r.text) + (r.truncated ? '\n\n(Réponse coupée : pose une question plus ciblée.)' : ''), d: !!deep });
      if (mm && !/^\s*rien/i.test(mm[1])) { ST.memos.push({ date: today(), text: mm[1].trim().slice(0, 160) }); if (ST.memos.length > 30) ST.memos.shift(); saveMemos(); }
      await saveThread(cur);
    } catch (e) {
      const kept = e && e.text ? visible(e.text) : '';
      if (e && e.code === 'cancelled') { if (kept) cur.msgs.push({ r: 'a', t: kept + '\n(Arrêté.)' }); else cur.msgs.pop(); }
      else { cur.msgs.pop(); out.textContent = (kept ? kept + '\n\n' : '') + (ERR[e && e.code] || 'Le tuteur n\'a pas pu répondre. Réessaie dans un instant.'); }
      if (!cur.msgs.length) ST.threads = ST.threads.filter((t) => t !== cur);
      saveLocal();
      if (!(e && e.code === 'cancelled')) { busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImgN').textContent = ''; return; }
    }
    busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImg').value = ''; $('#mztImgN').textContent = ''; renderLog();
  }

  // ---------- événements ----------
  $('#mztBtn').onclick = () => openPanel(null);
  $('#mztX').onclick = closePanel;
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#mztPan').hidden) closePanel(); });
  $('#mztTabH').onclick = () => view($('#mztHist').hidden ? 'hist' : 'chat');
  $('#mztTabM').onclick = () => view($('#mztMem').hidden ? 'mem' : 'chat');
  $('#mztQ').oninput = renderList;
  $('#mztList').onclick = (e) => { const id = e.target.dataset && e.target.dataset.cont; if (!id) return; cur = ST.threads.find((t) => t.id === id); view('chat'); $('#mztCtx').textContent = '· ' + cur.sec; renderLog(); };
  $('#mztMemL').onclick = (e) => { const i = e.target.dataset && e.target.dataset.memdel; if (i == null) return; ST.memos.splice(+i, 1); saveMemos(); renderMem(); };
  $('#mztChips').onclick = (e) => { const b = e.target.closest('[data-chip]'); if (!b) return; const t = $('#mztIn'); t.value = b.dataset.chip + (t.value ? ' : ' + t.value : ''); t.focus(); };
  $('#mztNew').onclick = () => { cur = null; renderLog(); };
  $('#mztStop').onclick = () => { if (ctl) ctl.abort(); };
  $('#mztImg').onchange = (e) => { img = e.target.files[0] || null; $('#mztImgN').textContent = img ? 'Photo : ' + img.name : ''; };
  $('#mztF').onsubmit = (e) => { e.preventDefault(); const v = $('#mztIn').value; $('#mztIn').value = ''; ask(v); };
  $('#mztIn').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#mztF').requestSubmit(); } });

  // ---------- capacités (facultatives) ----------
  const W = window.claude;
  if (W && W.use) {
    W.use('sample').then((s) => { sample = s; ready = true; note();
      if (s && s.limits) s.limits().then((l) => { if (l && l.images) { imgOK = true; $('#mztImgL').hidden = false; if (l.images.mediaTypes) $('#mztImg').accept = l.images.mediaTypes.join(','); } }).catch(() => {});
    }).catch(() => { ready = true; note(); });
    Promise.all([W.use('db'), W.use('user')]).then(async ([d, u]) => {
      if (!d || !u) return; const id = await u.id(); if (!id) return; db = d; base = 'data/users/' + id + '/mzt_' + C.id;
      try {
        const m = await db.doc(base).get(); if (m.exists) { const v = m.data() || {}; if (Array.isArray(v.memos)) ST.memos = JSON.parse(JSON.stringify(v.memos)); }
        const q = await db.collection(base + '/threads').get(); const remote = q.docs.map((x) => Object.assign({ id: x.id }, JSON.parse(JSON.stringify(x.data() || {}))));
        const map = {}; [...ST.threads, ...remote].forEach((t) => { if (!map[t.id] || (t.msgs || []).length > (map[t.id].msgs || []).length) map[t.id] = t; });
        ST.threads = Object.values(map).sort((a, b) => parseInt(a.id.slice(1), 36) - parseInt(b.id.slice(1), 36)); saveLocal();
      } catch (e) {}
    }).catch(() => {});
  } else { ready = true; note(); }

  window.MZT = { open: openPanel, close: closePanel };
})();

</script>

a.href=p.indexOf("/decouvrir")===0||location.pathname.indexOf("/decouvrir")===0?"/decouvrir":"/app/modules";})();</script>
