n class=\"opt\" data-o=\"0\">Un objet temporaire, affecté à a puis détruit<\/button><button class=\"opt\" data-o=\"1\">Un nouvel objet nommé point<\/button><button class=\"opt\" data-o=\"2\">Rien, c&#39;est une erreur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Pourquoi un compilateur moderne peut-il afficher moins de recopies que les diapos pour un retour par valeur ?<\/div><button class=\"opt\" data-o=\"0\">Parce que le constructeur de recopie est ignoré s&#39;il affiche du texte<\/button><button class=\"opt\" data-o=\"1\">Parce qu&#39;il supprime la copie inutile (élision de copie)<\/button><button class=\"opt\" data-o=\"2\">Parce que les objets locaux ne sont jamais copiés en C++<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"recopie-objets-membres","rep":null,"tol":null},{"n":"recopie-objets-membres","rep":["1"],"tol":null},{"n":"recopie-objets-membres","rep":null,"tol":null},{"n":"recopie-objets-membres","rep":null,"tol":null}],"qcm":[{"n":"recopie-objets-membres","q":"Quel est le prototype usuel du constructeur de recopie de point ?","o":["<code>point(point p);<\/code>","<code>point(const point &amp;p);<\/code>","<code>point operator=(const point &amp;p);<\/code>"],"a":1,"e":"Référence obligatoire, const conseillé."},{"n":"recopie-objets-membres","q":"Lequel n&#39;appelle PAS le constructeur de recopie ?","o":["<code>point b = a;<\/code>","<code>fct(a);<\/code> avec <code>void fct(point p)<\/code>","<code>b = a;<\/code> avec b déjà déclaré"],"a":2,"e":"Pour deux objets existants, c&#39;est l&#39;opérateur =."},{"n":"recopie-objets-membres","q":"Quand la recopie par défaut pose-t-elle problème ?","o":["Quand la classe a des membres int","Quand la classe contient un pointeur vers une zone allouée dynamiquement","Jamais"],"a":1,"e":"Elle copie l&#39;adresse, pas la zone pointée."},{"n":"recopie-objets-membres","q":"<code>void fct(point p)<\/code> appelée avec <code>fct(a)<\/code> : combien de destructeurs s&#39;exécutent à la fin de main ?","o":["1","2","3"],"a":1,"e":"Celui de la copie p (en sortant de fct) et celui de a."},{"n":"recopie-objets-membres","q":"Dans un constructeur de recopie profonde de vect, on doit :","o":["Allouer un nouveau tableau et recopier les éléments","Copier le pointeur adr","Appeler delete[] v.adr"],"a":0,"e":"On crée une zone propre au nouvel objet."},{"n":"recopie-objets-membres","q":"Comment initialiser l&#39;objet membre centre dans cercle ?","o":["<code>cercle(int a, int o, int r) { centre(a, o); }<\/code>","<code>cercle(int a, int o, int r) : centre(a, o) { ... }<\/code>","<code>cercle(int a, int o, int r) : point(a, o) { ... }<\/code>"],"a":1,"e":"On nomme le membre dans la liste d&#39;initialisation."},{"n":"recopie-objets-membres","q":"Ordre d&#39;affichage pour <code>cercle c(1,2,5);<\/code> puis fin de main ?","o":["Constr. point, Constr. cercle, Destr. cercle, Destr. point","Constr. cercle, Constr. point, Destr. point, Destr. cercle","Constr. point, Constr. cercle, Destr. point, Destr. cercle"],"a":0,"e":"Membres construits d&#39;abord, détruits en dernier."},{"n":"recopie-objets-membres","q":"Un objet créé par <code>new point(1,4)<\/code> est détruit :","o":["À la fin du bloc","À la fin de main","Par <code>delete<\/code>"],"a":2,"e":"Un objet dynamique n&#39;a pas de durée de vie fixée d&#39;avance."},{"n":"recopie-objets-membres","q":"Que crée <code>a = point(1, 2);<\/code> ?","o":["Un objet temporaire, affecté à a puis détruit","Un nouvel objet nommé point","Rien, c&#39;est une erreur"],"a":0,"e":"Appel explicite du constructeur : objet temporaire."},{"n":"recopie-objets-membres","q":"Pourquoi un compilateur moderne peut-il afficher moins de recopies que les diapos pour un retour par valeur ?","o":["Parce que le constructeur de recopie est ignoré s&#39;il affiche du texte","Parce qu&#39;il supprime la copie inutile (élision de copie)","Parce que les objets locaux ne sont jamais copiés en C++"],"a":1,"e":"C++17 autorise, et parfois impose, cette optimisation."}]},{"id":"amies-operateurs","t":"Fonctions amies et surdéfinition d'opérateurs","seance":"Partie II · Fonctions amies, surcharge des opérateurs","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu dois connaître public/private et le passage par référence (chapitres 2 et 3).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Une fonction indépendante <code>int coincide(point p, point q)<\/code> peut-elle lire <code>p.x<\/code> si x est privé ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : non<\/b><\/p><p>Non : un membre privé n&#39;est accessible qu&#39;aux fonctions membres de la classe… sauf si la classe déclare la fonction <strong>amie<\/strong>. C&#39;est l&#39;objet de ce chapitre.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Un opérateur, c&#39;est <strong>une fonction avec un nom spécial<\/strong> : <code>a + b<\/code> est traduit en <code>operator+(a, b)<\/code> (fonction amie) ou en <code>a.operator+(b)<\/code> (fonction membre). Une fois ce réflexe acquis, tout le chapitre se lit facilement.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>En fonction membre, l&#39;opérateur binaire n&#39;a <strong>qu&#39;un<\/strong> argument explicite : le premier opérande est l&#39;objet lui-même (<code>this<\/code>). Écrire <code>vecteur3d operator+(vecteur3d, vecteur3d)<\/code> comme membre est une erreur.<\/p>\n<\/aside><p>À la fin, tu sais déclarer une amie dans les quatre situations du cours, surdéfinir +, ==, [], ++ et =, et choisir entre membre et amie.<\/p>\n<h2>Idée 1 · Les fonctions amies<\/h2>\n<p>Une classe peut autoriser une fonction extérieure à lire ses membres privés avec <code>friend<\/code>. Quatre situations :<\/p>\n<figure class=\"grille\"><figcaption>Situations d'amitié<\/figcaption><table><tr><th>Situation<\/th><th>Déclaration dans la classe A<\/th><\/tr><tr><td>Fonction indépendante amie<\/td><td>friend int coincide(point, point);<\/td><\/tr><tr><td>Membre de B amie de A<\/td><td>friend int B::fct(A);<\/td><\/tr><tr><td>Amie de plusieurs classes<\/td><td>friend void fct(A, B); dans A et dans B<\/td><\/tr><tr><td>Toute la classe B amie<\/td><td>friend class B;<\/td><\/tr><\/table><\/figure><pre class=\"\"><code>#include &lt;iostream&gt;\nusing namespace std;\nclass matrice;                         // annonce, pour compiler vect\nclass vect {\n    double v[3];\npublic:\n    vect(double v1 = 0, double v2 = 0, double v3 = 0) { v[0] = v1; v[1] = v2; v[2] = v3; }\n    friend vect prod(matrice, vect);   // amie de vect\n    void affiche() { for (int i = 0; i &lt; 3; i++) cout &lt;&lt; v[i] &lt;&lt; &quot; &quot;; cout &lt;&lt; &quot;\\n&quot;; }\n};\nclass matrice {\n    double mat[3][3];\npublic:\n    matrice(double t[3][3]) { for (int i = 0; i &lt; 3; i++) for (int j = 0; j &lt; 3; j++) mat[i][j] = t[i][j]; }\n    friend vect prod(matrice, vect);   // amie de matrice aussi\n};\nvect prod(matrice m, vect x) {\n    vect res;\n    for (int i = 0; i &lt; 3; i++) {\n        double som = 0;\n        for (int j = 0; j &lt; 3; j++) som += m.mat[i][j] * x.v[j];\n        res.v[i] = som;\n    }\n    return res;\n}\nint main() {\n    vect w(1, 2, 3);\n    double tb[3][3] = {{1, 2, 3}, {4, 5, 6}, {7, 8, 9}};\n    matrice a = tb;\n    prod(a, w).affiche();\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>14 32 50 <\/code><\/pre><p>Vérification de la première ligne : 1×1 + 2×2 + 3×3 = 14.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>L&#39;affichage des diapos contient <code>&quot; «<\/code> (guillemet typographique) : il faut des guillemets droits <code>&quot; &quot;<\/code> pour compiler.<\/p>\n<\/aside><h2>Idée 2 · Surdéfinir un opérateur : amie ou membre<\/h2>\n<svg viewBox=\"0 0 640 130\" style=\"width:100%;max-width:640px;display:block;margin:10px auto\" role=\"img\" aria-label=\"a plus b se traduit en operator+(a,b) pour une fonction amie, ou en a.operator+(b) pour une fonction membre\">\n<g font-family=\"sans-serif\" font-size=\"14\" fill=\"currentColor\" text-anchor=\"middle\">\n<rect x=\"250\" y=\"45\" width=\"140\" height=\"40\" rx=\"8\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/><text x=\"320\" y=\"70\" font-weight=\"700\">a + b<\/text>\n<line x1=\"250\" y1=\"65\" x2=\"170\" y2=\"65\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"390\" y1=\"65\" x2=\"470\" y2=\"65\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<text x=\"95\" y=\"60\">operator+(a, b)<\/text><text x=\"95\" y=\"82\" font-size=\"12\">amie : 2 arguments<\/text>\n<text x=\"550\" y=\"60\">a.operator+(b)<\/text><text x=\"550\" y=\"82\" font-size=\"12\">membre : 1 argument<\/text>\n<\/g><\/svg><pre class=\"\"><code>#include &lt;iostream&gt;\nusing namespace std;\nclass vecteur3d {\n    float x, y, z;\npublic:\n    vecteur3d(float a = 0, float b = 0, float c = 0) { x = a; y = b; z = c; }\n    friend vecteur3d operator+(vecteur3d, vecteur3d);       // version amie\n    float operator*(const vecteur3d &amp;v) const {              // version membre : produit scalaire\n        return x * v.x + y * v.y + z * v.z;\n    }\n    bool operator==(const vecteur3d &amp;v) const { return x == v.x &amp;&amp; y == v.y &amp;&amp; z == v.z; }\n    bool operator!=(const vecteur3d &amp;v) const { return !(*this == v); }\n    void affiche() { cout &lt;&lt; &quot;coordonnees : &quot; &lt;&lt; x &lt;&lt; &quot; &quot; &lt;&lt; y &lt;&lt; &quot; &quot; &lt;&lt; z &lt;&lt; &quot;\\n&quot;; }\n};\nvecteur3d operator+(vecteur3d a, vecteur3d b) {\n    vecteur3d p;\n    p.x = a.x + b.x; p.y = a.y + b.y; p.z = a.z + b.z;\n    return p;\n}\nint main() {\n    vecteur3d a(1, 2, 3), b(2, 5, 8), c;\n    c = a + b;  c.affiche();\n    cout &lt;&lt; &quot;a*b = &quot; &lt;&lt; a * b &lt;&lt; &quot;\\n&quot;;\n    cout &lt;&lt; &quot;a==b : &quot; &lt;&lt; (a == b) &lt;&lt; &quot;  a!=b : &quot; &lt;&lt; (a != b) &lt;&lt; &quot;\\n&quot;;\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>coordonnees : 3 7 11\na*b = 36\na==b : 0  a!=b : 1<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Dans les diapos, <code>&lt;&lt;z&quot;\\n&quot;<\/code> oublie un <code>&lt;&lt;<\/code> (il faut <code>&lt;&lt; z &lt;&lt; &quot;\\n&quot;<\/code>), et <code>Vecteur3d<\/code> avec une majuscule ne correspond pas à la classe <code>vecteur3d<\/code> : C++ distingue majuscules et minuscules.<\/p>\n<\/aside><figure class=\"etapes\" data-i=\"0\"><figcaption>Membre ou amie ?<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · Premier opérande d&#39;un type de base ?<\/div><p><code>3 * v<\/code> ou <code>6 + p<\/code> avec 6 converti : il faut une <strong>amie<\/strong> (une méthode reçoit forcément un objet de sa classe en premier).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · Opérateur imposé membre ?<\/div><p><code>=<\/code>, <code>[]<\/code>, <code>()<\/code>, <code>-&gt;<\/code> et les cast doivent être des <strong>membres<\/strong>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · Sinon<\/div><p>libre choix. Une amie traite les deux opérandes de façon symétrique.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Idée 3 · ++ préfixé et postfixé, [] et const<\/h2>\n<ul>\n<li><code>T operator++()<\/code> : notation <strong>préfixée<\/strong> <code>++a<\/code> (incrémente puis renvoie).<\/li>\n<li><code>T operator++(int)<\/code> : notation <strong>postfixée<\/strong> <code>a++<\/code> ; l&#39;<code>int<\/code> est un argument fictif qui sert juste à distinguer.<\/li>\n<\/ul>\n<pre class=\"\"><code>#include &lt;iostream&gt;\nusing namespace std;\nclass point {\npublic:\n    int x, y;\n    point(int abs = 0, int ord = 0) { x = abs; y = ord; }\n    point operator++()    { x++; y++; return *this; }          // préfixé\n    point operator++(int) { point p = *this; x++; y++; return p; } // postfixé\n    void affiche() { cout &lt;&lt; x &lt;&lt; &quot; &quot; &lt;&lt; y &lt;&lt; &quot;\\n&quot;; }\n};\nclass vecteur3d {\n    float v[3];\npublic:\n    vecteur3d(float c1 = 0, float c2 = 0, float c3 = 0) { v[0] = c1; v[1] = c2; v[2] = c3; }\n    float &amp;operator[](int i)      { if (i &lt; 0 || i &gt; 2) i = 0; return v[i]; }  // lecture/écriture\n    float operator[](int i) const { if (i &lt; 0 || i &gt; 2) i = 0; return v[i]; }  // objet constant\n};\nint main() {\n    point a1(2, 5), a2(2, 5), b;\n    b = ++a1; cout &lt;&lt; &quot;a1 : &quot;; a1.affiche(); cout &lt;&lt; &quot;b : &quot;; b.affiche();\n    b = a2++; cout &lt;&lt; &quot;a2 : &quot;; a2.affiche(); cout &lt;&lt; &quot;b : &quot;; b.affiche();\n    vecteur3d v(1, 2, 3);\n    v[1] = 20;                       // possible car [] renvoie float&amp;\n    const vecteur3d w(7, 8, 9);\n    cout &lt;&lt; v[1] &lt;&lt; &quot; &quot; &lt;&lt; w[2] &lt;&lt; &quot; &quot; &lt;&lt; v[9] &lt;&lt; &quot;\\n&quot;;   // v[9] -&gt; protégé : v[0]\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>a1 : 3 6\nb : 3 6\na2 : 3 6\nb : 2 5\n20 9 1<\/code><\/pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Pour que <code>v[i] = ...<\/code> marche, <code>operator[]<\/code> doit renvoyer une <strong>référence<\/strong>. La version <code>const<\/code> renvoie une valeur : <code>w[i] = ...<\/code> est alors refusé à la compilation.<\/p>\n<\/aside><h2>Idée 4 · L&#39;opérateur = pour une classe à pointeur<\/h2>\n<p>Même problème que la recopie : l&#39;affectation par défaut copie le pointeur. On écrit donc <code>vect &amp; operator=(const vect &amp;)<\/code>.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Les 4 temps d'un operator= correct<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Auto-affectation ?<\/div><p><code>if (this != &amp;v)<\/code> : pour <code>c = c<\/code>, on ne fait rien (sinon on détruirait la zone qu&#39;on veut copier).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Libérer<\/div><p><code>delete[] adr;<\/code> l&#39;ancienne zone de l&#39;objet de gauche.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Réallouer et copier<\/div><p><code>adr = new int[nelem = v.nelem];<\/code> puis copie élément par élément.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Renvoyer *this par référence<\/div><p>permet d&#39;enchaîner <code>a = b = c;<\/code>.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><pre class=\"\"><code>#include &lt;iostream&gt;\nusing namespace std;\nclass vect {\n    int nelem; int *adr;\npublic:\n    vect(int n) { nelem = n; adr = new int[nelem]; for (int i = 0; i &lt; nelem; i++) adr[i] = n; }\n    ~vect() { delete[] adr; }\n    vect &amp;operator=(const vect &amp;v) {\n        if (this != &amp;v) {\n            cout &lt;&lt; &quot;copie de &quot; &lt;&lt; v.nelem &lt;&lt; &quot; elements\\n&quot;;\n            delete[] adr;\n            adr = new int[nelem = v.nelem];\n            for (int i = 0; i &lt; nelem; i++) adr[i] = v.adr[i];\n        } else cout &lt;&lt; &quot;on ne fait rien\\n&quot;;\n        return *this;\n    }\n    void affiche() { for (int i = 0; i &lt; nelem; i++) cout &lt;&lt; adr[i] &lt;&lt; &quot; &quot;; cout &lt;&lt; &quot;\\n&quot;; }\n};\nint main() {\n    vect a(5), b(3), c(4);\n    b = a;  b.affiche();\n    c = c;\n    a = b = c;  a.affiche();\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>copie de 5 elements\n5 5 5 5 5 \non ne fait rien\ncopie de 4 elements\ncopie de 4 elements\n4 4 4 4 <\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Les diapos libèrent avec <code>delete adr;<\/code> une zone allouée par <code>new int[...]<\/code> : la forme correcte est <code>delete[] adr;<\/code>.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices du cours et du TD2<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>(TD2, ex. 2.1) Classe point avec constructeur <code>point(int abs=0, int ord=0)<\/code> et <code>friend point operator+(point, point)<\/code>. Que font <code>a = b + 6;<\/code> et <code>a = 6 + b;<\/code> ? Et si + était membre ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Le constructeur à un argument sert de conversion int → point.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Avec l&#39;amie : 6 est converti en point(6, 0) par le constructeur, dans les deux cas. Les deux affectations marchent. Avec un membre : <code>b + 6<\/code> marche (<code>b.operator+(point(6))<\/code>), mais <code>6 + b<\/code> est refusé : 6 n&#39;est pas un objet, on ne peut pas appeler 6.operator+.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>(TD2, ex. 2.1, q. 3 et 4) Et avec <code>friend point operator+(point &amp;, point &amp;)<\/code> ? Puis avec <code>const point &amp;<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Avec <code>point &amp;<\/code> : <code>b + 6<\/code> et <code>6 + b<\/code> sont <strong>refusés<\/strong> : une référence non constante ne peut pas désigner le point temporaire issu de la conversion de 6. Avec <code>const point &amp;<\/code> : tout redevient correct, le temporaire est accepté.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Combien de lignes « copie de… » affiche le programme de l&#39;idée 4 ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 3<\/b><\/p><p><code>b = a<\/code> (1), <code>c = c<\/code> affiche « on ne fait rien », puis <code>a = b = c<\/code> fait b = c (2) et a = b (3).<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Où se place la déclaration <code>friend int coincide(point, point);<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">Dans la classe point<\/button><button class=\"opt\" data-o=\"1\">Dans main<\/button><button class=\"opt\" data-o=\"2\">Dans la fonction coincide<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Un opérateur binaire défini comme fonction membre a :<\/div><button class=\"opt\" data-o=\"0\">2 arguments explicites<\/button><button class=\"opt\" data-o=\"1\">1 argument explicite<\/button><button class=\"opt\" data-o=\"2\">0 argument<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Avec <code>point operator+(point)<\/code> membre et un constructeur point(int), quelle expression est refusée ?<\/div><button class=\"opt\" data-o=\"0\"><code>b + 6<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>6 + b<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>a + b<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Quel opérateur doit obligatoirement être membre ?<\/div><button class=\"opt\" data-o=\"0\">+<\/button><button class=\"opt\" data-o=\"1\">==<\/button><button class=\"opt\" data-o=\"2\">[]<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Quel en-tête correspond à <code>a++<\/code> ?<\/div><button class=\"opt\" data-o=\"0\"><code>point operator++()<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>point operator++(int)<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>point operator++(point)<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Avec <code>point a(2,5), b; b = a++;<\/code>, que contient b ?<\/div><button class=\"opt\" data-o=\"0\">2 5<\/button><button class=\"opt\" data-o=\"1\">3 6<\/button><button class=\"opt\" data-o=\"2\">0 0<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Pour pouvoir écrire <code>v[1] = 20;<\/code>, operator[] doit renvoyer :<\/div><button class=\"opt\" data-o=\"0\">float<\/button><button class=\"opt\" data-o=\"1\">float&amp;<\/button><button class=\"opt\" data-o=\"2\">void<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Pourquoi tester <code>this != &amp;v<\/code> dans operator= ?<\/div><button class=\"opt\" data-o=\"0\">Pour accélérer le programme<\/button><button class=\"opt\" data-o=\"1\">Pour éviter de détruire la zone qu&#39;on veut copier lors de <code>c = c<\/code><\/button><button class=\"opt\" data-o=\"2\">Parce que C++ l&#39;impose<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Pourquoi operator= renvoie-t-il <code>*this<\/code> par référence ?<\/div><button class=\"opt\" data-o=\"0\">Pour libérer la mémoire<\/button><button class=\"opt\" data-o=\"1\">Pour permettre <code>a = b = c<\/code><\/button><button class=\"opt\" data-o=\"2\">Pour appeler le destructeur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\"><code>friend point operator+(point &amp;, point &amp;);<\/code> et l&#39;appel <code>b + 6<\/code> :<\/div><button class=\"opt\" data-o=\"0\">Correct<\/button><button class=\"opt\" data-o=\"1\">Refusé : le temporaire point(6) ne peut pas se lier à point&amp;<\/button><button class=\"opt\" data-o=\"2\">Correct mais 6 est ignoré<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"amies-operateurs","rep":["non"],"tol":null},{"n":"amies-operateurs","rep":null,"tol":null},{"n":"amies-operateurs","rep":null,"tol":null},{"n":"amies-operateurs","rep":["3"],"tol":null}],"qcm":[{"n":"amies-operateurs","q":"Où se place la déclaration <code>friend int coincide(point, point);<\/code> ?","o":["Dans la classe point","Dans main","Dans la fonction coincide"],"a":0,"e":"C&#39;est la classe qui accorde l&#39;amitié."},{"n":"amies-operateurs","q":"Un opérateur binaire défini comme fonction membre a :","o":["2 arguments explicites","1 argument explicite","0 argument"],"a":1,"e":"Le premier opérande est l&#39;objet appelant (this)."},{"n":"amies-operateurs","q":"Avec <code>point operator+(point)<\/code> membre et un constructeur point(int), quelle expression est refusée ?","o":["<code>b + 6<\/code>","<code>6 + b<\/code>","<code>a + b<\/code>"],"a":1,"e":"On ne peut pas appeler une méthode sur l&#39;entier 6."},{"n":"amies-operateurs","q":"Quel opérateur doit obligatoirement être membre ?","o":["+","==","[]"],"a":2,"e":"=, [], () et -&gt; sont toujours membres."},{"n":"amies-operateurs","q":"Quel en-tête correspond à <code>a++<\/code> ?","o":["<code>point operator++()<\/code>","<code>point operator++(int)<\/code>","<code>point operator++(point)<\/code>"],"a":1,"e":"L&#39;int fictif signale la notation postfixée."},{"n":"amies-operateurs","q":"Avec <code>point a(2,5), b; b = a++;<\/code>, que contient b ?","o":["2 5","3 6","0 0"],"a":0,"e":"Le postfixé renvoie l&#39;ancienne valeur."},{"n":"amies-operateurs","q":"Pour pouvoir écrire <code>v[1] = 20;<\/code>, operator[] doit renvoyer :","o":["float","float&amp;","void"],"a":1,"e":"Il faut une référence vers l&#39;élément."},{"n":"amies-operateurs","q":"Pourquoi tester <code>this != &amp;v<\/code> dans operator= ?","o":["Pour accélérer le programme","Pour éviter de détruire la zone qu&#39;on veut copier lors de <code>c = c<\/code>","Parce que C++ l&#39;impose"],"a":1,"e":"Sans ce test, delete[] adr détruirait aussi v.adr."},{"n":"amies-operateurs","q":"Pourquoi operator= renvoie-t-il <code>*this<\/code> par référence ?","o":["Pour libérer la mémoire","Pour permettre <code>a = b = c<\/code>","Pour appeler le destructeur"],"a":1,"e":"b = c renvoie b, qui est ensuite affecté à a."},{"n":"amies-operateurs","q":"<code>friend point operator+(point &amp;, point &amp;);<\/code> et l&#39;appel <code>b + 6<\/code> :","o":["Correct","Refusé : le temporaire point(6) ne peut pas se lier à point&amp;","Correct mais 6 est ignoré"],"a":1,"e":"Il faut const point&amp; pour accepter un temporaire."}]},{"id":"conversions","t":"Conversions de type définies par l'utilisateur","seance":"Partie II · Les conversions de type","imp":3,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu dois savoir surdéfinir un opérateur (chapitre 5) et connaître les conversions implicites du C (int → double…).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Avec <code>int n; double z = 3.85; n = z;<\/code>, que vaut n ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 3<\/b><\/p><p>L&#39;affectation convertit le double en int en tronquant : n vaut 3.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Deux sens, deux outils. <strong>Classe → type de base<\/strong> : un opérateur de cast <code>operator int()<\/code>. <strong>Type de base → classe<\/strong> : un constructeur à un argument. Pour classe → classe, l&#39;un ou l&#39;autre.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Oublier que ces conversions sont <strong>implicites<\/strong> : <code>a = 12;<\/code> crée en douce un <code>point(12)<\/code>. Pratique, mais source de surprises. Le mot-clé <code>explicit<\/code> les interdit.<\/p>\n<\/aside><p>À la fin, tu sais écrire un opérateur de cast, prévoir quand un constructeur sert de conversion, et bloquer cette conversion avec explicit.<\/p>\n<h2>Idée 1 · L&#39;opérateur de cast : classe → type de base<\/h2>\n<figure class=\"flux\"><figcaption>Deux sens de conversion<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">point<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">operator int()<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">int<\/div><\/div><div class=\"flux-l\"><div class=\"flux-b\">int<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">constructeur point(int)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">point<\/div><\/div><\/figure><p>L&#39;opérateur de cast est une <strong>fonction membre<\/strong>, sans argument, <strong>sans type de retour écrit<\/strong> (le type est dans le nom).<\/p>\n<pre class=\"\"><code>#include &lt;iostream&gt;\nusing namespace std;\nclass point {\n    int x, y;\npublic:\n    point(int abs = 0, int ord = 0) { x = abs; y = ord; }\n    operator int() { cout &lt;&lt; &quot;== appel int() pour &quot; &lt;&lt; x &lt;&lt; &quot; &quot; &lt;&lt; y &lt;&lt; &quot;\\n&quot;; return x; }\n};\nint main() {\n    point a(3, 4), b(5, 7);\n    int n1 = int(a);          // appel explicite\n    cout &lt;&lt; &quot;n1 = &quot; &lt;&lt; n1 &lt;&lt; &quot;\\n&quot;;\n    int n2 = b;               // appel implicite\n    cout &lt;&lt; &quot;n2 = &quot; &lt;&lt; n2 &lt;&lt; &quot;\\n&quot;;\n    int n3 = a + b;           // les deux points convertis en int, puis addition\n    cout &lt;&lt; &quot;n3 = &quot; &lt;&lt; n3 &lt;&lt; &quot;\\n&quot;;\n    double z = a + 3.85;      // conversion en chaîne : point -&gt; int -&gt; double\n    cout &lt;&lt; &quot;z = &quot; &lt;&lt; z &lt;&lt; &quot;\\n&quot;;\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>== appel int() pour 3 4\nn1 = 3\n== appel int() pour 5 7\nn2 = 5\n== appel int() pour 3 4\n== appel int() pour 5 7\nn3 = 8\n== appel int() pour 3 4\nz = 6.85<\/code><\/pre><h2>Idée 2 · Le constructeur comme conversion : type de base → classe<\/h2>\n<p>Tout constructeur appelable avec <strong>un seul argument<\/strong> définit une conversion. Avec <code>point(int abs = 0, int ord = 0)<\/code> :<\/p>\n<ul>\n<li><code>a = point(12);<\/code> : conversion explicite (objet temporaire, puis affectation) ;<\/li>\n<li><code>a = 12;<\/code> : même chose, implicitement ;<\/li>\n<li><code>fct(4);<\/code> avec <code>void fct(point)<\/code> : 4 devient <code>point(4, 0)<\/code>.<\/li>\n<\/ul>\n<pre class=\"\"><code>#include &lt;iostream&gt;\nusing namespace std;\nclass point {\n    int x, y;\npublic:\n    point(int abs = 0, int ord = 0) { x = abs; y = ord; cout &lt;&lt; &quot;++ construction point &quot; &lt;&lt; x &lt;&lt; &quot; &quot; &lt;&lt; y &lt;&lt; &quot;\\n&quot;; }\n};\nvoid fct(point p) { cout &lt;&lt; &quot;** appel fct\\n&quot;; }\nint main() {\n    point a(3, 4);\n    a = point(12);     // explicite\n    a = 12;            // implicite\n    fct(4);            // implicite\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>++ construction point 3 4\n++ construction point 12 0\n++ construction point 12 0\n++ construction point 4 0\n** appel fct<\/code><\/pre><pre class=\"\"><code>class point {\n    int x, y;\npublic:\n    explicit point(int);            // plus de conversion implicite\n};\npoint a(0), b(1);\na = 12;               // refusé\na = point(3);         // accepté : conversion explicite<\/code><\/pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p><code>explicit<\/code> devant un constructeur interdit les conversions implicites (simples ou en chaîne), mais laisse la conversion explicite <code>point(3)<\/code>.<\/p>\n<\/aside><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Les diapos écrivent <code>friend operator + (point, point);<\/code> sans type de retour : il faut <code>friend point operator+(point, point);<\/code>.<\/p>\n<\/aside><h2>Idée 3 · Conversion entre deux classes<\/h2>\n<p>Pour convertir un <code>point<\/code> en <code>complexe<\/code>, deux possibilités : un cast <code>operator complexe()<\/code> dans <strong>point<\/strong>, ou un constructeur <code>complexe(point)<\/code> dans <strong>complexe<\/strong>. Le cours utilise le cast, déclaré ami de complexe pour remplir ses champs privés.<\/p>\n<pre class=\"\"><code>#include &lt;iostream&gt;\nusing namespace std;\nclass complexe;\nclass point {\n    int x, y;\npublic:\n    point(int abs = 0, int ord = 0) { x = abs; y = ord; }\n    operator complexe();               // point -&gt; complexe\n};\nclass complexe {\n    double reel, imag;\npublic:\n    complexe(double r = 0, double i = 0) { reel = r; imag = i; }\n    friend point::operator complexe();\n    void affiche() { cout &lt;&lt; reel &lt;&lt; &quot; + &quot; &lt;&lt; imag &lt;&lt; &quot;i\\n&quot;; }\n};\npoint::operator complexe() { complexe r; r.reel = x; r.imag = y; return r; }\nint main() {\n    point a(2, 5);\n    complexe c;\n    c = (complexe) a; c.affiche();   // explicite\n    point b(9, 12);\n    c = b;            c.affiche();   // implicite\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>2 + 5i\n9 + 12i<\/code><\/pre><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Ne définis pas <strong>les deux<\/strong> (cast dans A et constructeur dans B) pour la même conversion : le compilateur ne saura pas lequel choisir (ambiguïté).<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>S&#39;entraîner<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Avec la classe point de l&#39;idée 1 (cast vers int renvoyant x), que vaut <code>n = a + b;<\/code> pour <code>point a(3,4), b(5,7);<\/code> ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 8<\/b><\/p><p>a → 3 et b → 5 par operator int(), puis 3 + 5 = 8.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Combien de « ++ construction » affiche le programme de l&#39;idée 2 ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 4<\/b><\/p><p>a(3,4), point(12), le temporaire de <code>a = 12<\/code>, et le point(4) de <code>fct(4)<\/code>.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Comment empêcher <code>a = 12;<\/code> tout en gardant <code>a = point(12);<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Déclarer le constructeur <code>explicit point(int abs = 0, int ord = 0);<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 6 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Comment s&#39;écrit l&#39;opérateur de cast point → int ?<\/div><button class=\"opt\" data-o=\"0\"><code>int operator int();<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>operator int();<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>friend int operator(point);<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Un opérateur de cast doit être :<\/div><button class=\"opt\" data-o=\"0\">Une fonction membre<\/button><button class=\"opt\" data-o=\"1\">Une fonction amie<\/button><button class=\"opt\" data-o=\"2\">Une fonction statique<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Avec <code>point(int abs=0, int ord=0)<\/code>, l&#39;instruction <code>a = 12;<\/code> :<\/div><button class=\"opt\" data-o=\"0\">Est refusée<\/button><button class=\"opt\" data-o=\"1\">Crée un point(12, 0) temporaire puis l&#39;affecte<\/button><button class=\"opt\" data-o=\"2\">Met x et y à 12<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Avec <code>explicit point(int);<\/code>, laquelle est acceptée ?<\/div><button class=\"opt\" data-o=\"0\"><code>a = 12;<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>a = b + 5;<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>a = point(3);<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\"><code>double z = a + 3.85;<\/code> avec <code>operator int()<\/code> renvoyant x = 3 donne :<\/div><button class=\"opt\" data-o=\"0\">3<\/button><button class=\"opt\" data-o=\"1\">6.85<\/button><button class=\"opt\" data-o=\"2\">7<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\"><code>fct(4);<\/code> avec <code>void fct(point)<\/code> et point(int) :<\/div><button class=\"opt\" data-o=\"0\">Construit point(4) puis appelle fct<\/button><button class=\"opt\" data-o=\"1\">Erreur de type<\/button><button class=\"opt\" data-o=\"2\">Appelle fct avec un int<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Pour convertir un point en complexe, on peut :<\/div><button class=\"opt\" data-o=\"0\">Seulement surdéfinir =<\/button><button class=\"opt\" data-o=\"1\">Écrire <code>operator complexe()<\/code> dans point, ou <code>complexe(point)<\/code> dans complexe<\/button><button class=\"opt\" data-o=\"2\">Écrire <code>operator point()<\/code> dans complexe<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Pourquoi <code>point::operator complexe()<\/code> est-il déclaré ami de complexe ?<\/div><button class=\"opt\" data-o=\"0\">Pour pouvoir être virtuel<\/button><button class=\"opt\" data-o=\"1\">Pour accéder aux membres privés reel et imag<\/button><button class=\"opt\" data-o=\"2\">C&#39;est obligatoire pour tout cast<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Quel risque si on définit à la fois <code>operator complexe()<\/code> dans point et <code>complexe(point)<\/code> dans complexe ?<\/div><button class=\"opt\" data-o=\"0\">Ambiguïté à la compilation<\/button><button class=\"opt\" data-o=\"1\">Double appel à l&#39;exécution<\/button><button class=\"opt\" data-o=\"2\">Aucun<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\"><code>int n1 = int(a);<\/code> est :<\/div><button class=\"opt\" data-o=\"0\">Un appel explicite de operator int()<\/button><button class=\"opt\" data-o=\"1\">Un appel du constructeur de recopie<\/button><button class=\"opt\" data-o=\"2\">Une erreur<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"conversions","rep":["3"],"tol":null},{"n":"conversions","rep":["8"],"tol":null},{"n":"conversions","rep":["4"],"tol":null},{"n":"conversions","rep":null,"tol":null}],"qcm":[{"n":"conversions","q":"Comment s&#39;écrit l&#39;opérateur de cast point → int ?","o":["<code>int operator int();<\/code>","<code>operator int();<\/code>","<code>friend int operator(point);<\/code>"],"a":1,"e":"Pas de type de retour écrit : il est dans le nom."},{"n":"conversions","q":"Un opérateur de cast doit être :","o":["Une fonction membre","Une fonction amie","Une fonction statique"],"a":0,"e":"Le cours l&#39;impose : fonction membre."},{"n":"conversions","q":"Avec <code>point(int abs=0, int ord=0)<\/code>, l&#39;instruction <code>a = 12;<\/code> :","o":["Est refusée","Crée un point(12, 0) temporaire puis l&#39;affecte","Met x et y à 12"],"a":1,"e":"Le constructeur sert de conversion implicite."},{"n":"conversions","q":"Avec <code>explicit point(int);<\/code>, laquelle est acceptée ?","o":["<code>a = 12;<\/code>","<code>a = b + 5;<\/code>","<code>a = point(3);<\/code>"],"a":2,"e":"explicit n&#39;interdit que l&#39;usage implicite."},{"n":"conversions","q":"<code>double z = a + 3.85;<\/code> avec <code>operator int()<\/code> renvoyant x = 3 donne :","o":["3","6.85","7"],"a":1,"e":"a → 3 (int), puis 3 + 3.85 en double."},{"n":"conversions","q":"<code>fct(4);<\/code> avec <code>void fct(point)<\/code> et point(int) :","o":["Construit point(4) puis appelle fct","Erreur de type","Appelle fct avec un int"],"a":0,"e":"Conversion implicite par le constructeur."},{"n":"conversions","q":"Pour convertir un point en complexe, on peut :","o":["Seulement surdéfinir =","Écrire <code>operator complexe()<\/code> dans point, ou <code>complexe(point)<\/code> dans complexe","Écrire <code>operator point()<\/code> dans complexe"],"a":1,"e":"Un cast dans la classe source ou un constructeur dans la classe cible."},{"n":"conversions","q":"Pourquoi <code>point::operator complexe()<\/code> est-il déclaré ami de complexe ?","o":["Pour pouvoir être virtuel","Pour accéder aux membres privés reel et imag","C&#39;est obligatoire pour tout cast"],"a":1,"e":"Il remplit directement les champs privés de complexe."},{"n":"conversions","q":"Quel risque si on définit à la fois <code>operator complexe()<\/code> dans point et <code>complexe(point)<\/code> dans complexe ?","o":["Ambiguïté à la compilation","Double appel à l&#39;exécution","Aucun"],"a":0,"e":"Deux chemins équivalents : le compilateur refuse."},{"n":"conversions","q":"<code>int n1 = int(a);<\/code> est :","o":["Un appel explicite de operator int()","Un appel du constructeur de recopie","Une erreur"],"a":0,"e":"Notation fonctionnelle du cast, comme <code>(int) a<\/code>."}]},{"id":"heritage-simple","t":"Héritage simple · dérivation, redéfinition, protected, constructeurs","seance":"Partie III · Héritage","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir écrire une classe avec constructeur et liste d&#39;initialisation (chapitres 3 et 4).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Comment le constructeur de <code>cercle<\/code> transmet-il (abs, ord) à son objet membre <code>centre<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Dans la liste d&#39;initialisation : <code>cercle(int abs, int ord, int r) : centre(abs, ord) { rayon = r; }<\/code>. L&#39;héritage utilise exactement la même syntaxe, avec le nom de la classe de base.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>L&#39;héritage traduit « <strong>est un<\/strong> » : un point coloré <strong>est un<\/strong> point. La classe dérivée reçoit tout ce qu&#39;a la base et y ajoute ses propres membres. Un objet membre traduit plutôt « <strong>a un<\/strong> » : un cercle <strong>a un<\/strong> centre.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Croire que la classe dérivée voit les membres <strong>privés<\/strong> de sa base. Non : ils existent dans l&#39;objet, mais seules les méthodes de la base y accèdent. Pour les ouvrir aux dérivées, il faut <code>protected<\/code>.<\/p>\n<\/aside><p>À la fin, tu sais dériver une classe, redéfinir une méthode en appelant celle de la base, transmettre des arguments au constructeur de base et lire le tableau des modes de dérivation.<\/p>\n<h2>Idée 1 · Dériver et redéfinir<\/h2>\n<svg viewBox=\"0 0 640 190\" style=\"width:100%;max-width:640px;display:block;margin:10px auto\" role=\"img\" aria-label=\"pointcol hérite de point : il garde x, y, deplace et affiche, et ajoute couleur et colore\">\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\">\n<rect x=\"220\" y=\"10\" width=\"200\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<text x=\"320\" y=\"30\" text-anchor=\"middle\" font-weight=\"700\">point<\/text>\n<text x=\"235\" y=\"52\">x, y<\/text><text x=\"235\" y=\"70\">initialise, deplace, affiche<\/text>\n<line x1=\"320\" y1=\"115\" x2=\"320\" y2=\"80\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<polygon points=\"320,80 312,95 328,95\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<rect x=\"220\" y=\"115\" width=\"200\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/>\n<text x=\"320\" y=\"135\" text-anchor=\"middle\" font-weight=\"700\">pointcol : public point<\/text>\n<text x=\"235\" y=\"157\" fill=\"#D9824F\">+ couleur<\/text><text x=\"235\" y=\"175\" fill=\"#D9824F\">+ colore ; affiche redéfinie<\/text>\n<text x=\"440\" y=\"100\">« est un »<\/text>\n<\/g><\/svg><pre class=\"\"><code>#include &lt;iostream&gt;\nusing namespace std;\nclass point {\n    int x, y;\npublic:\n    void initialise(int abs, int ord) { x = abs; y = ord; }\n    void deplace(int dx, int dy) { x += dx; y += dy; }\n    void affiche() { cout &lt;&lt; &quot;Je suis en &quot; &lt;&lt; x &lt;&lt; &quot; &quot; &lt;&lt; y &lt;&lt; &quot;\\n&quot;; }\n};\nclass pointcol : public point {\n    short couleur;\npublic:\n    void colore(short cl) { couleur = cl; }\n    void affiche() {                       // redéfinition\n        point::affiche();                  // appel de la version de la base\n        cout &lt;&lt; &quot;  et ma couleur est : &quot; &lt;&lt; couleur &lt;&lt; &quot;\\n&quot;;\n    }\n    void initialise(int abs, int ord, short cl) { point::initialise(abs, ord); couleur = cl; }\n};\nint main() {\n    pointcol p;\n    p.initialise(10, 20, 5);\n    p.affiche();\n    p.point::affiche();        // on force la version de point\n    p.deplace(2, 4);\n    p.colore(2);\n    p.affiche();\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Je suis en 10 20\n  et ma couleur est : 5\nJe suis en 10 20\nJe suis en 12 24\n  et ma couleur est : 2<\/code><\/pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p><strong>Surdéfinition<\/strong> (overloading) : même nom, signatures <strong>différentes<\/strong>, dans la même portée. <strong>Redéfinition<\/strong> (overriding) : même signature, dans une classe <strong>dérivée<\/strong>, pour remplacer la méthode de la base. <code>classe::methode()<\/code> permet d&#39;appeler la version de la base.<\/p>\n<\/aside><p>Si une dérivée redéfinit un <strong>membre donnée<\/strong> (<code>float a<\/code> dans B, <code>int a<\/code> dans A), <code>p.a<\/code> désigne celui de B et <code>p.A::a<\/code> celui de A.<\/p>\n<h2>Idée 2 · Constructeurs et destructeurs dans une hiérarchie<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Ordre d'appel<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Construction<\/div><p>d&#39;abord le constructeur de la <strong>base<\/strong>, puis celui de la <strong>dérivée<\/strong>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Arguments<\/div><p><code>pointcol(int abs, int ord, char cl) : point(abs, ord) { ... }<\/code> ; sans liste, c&#39;est le constructeur par défaut de la base qui est appelé (il doit exister).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Destruction<\/div><p>ordre inverse : la <strong>dérivée<\/strong>, puis la <strong>base<\/strong>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Non hérités<\/div><p>constructeurs, destructeur et opérateur = de la base ne sont pas hérités.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><pre class=\"\"><code>#include &lt;iostream&gt;\nusing namespace std;\nclass point {\nprotected:\n    int x, y;                  // visibles dans les dérivées\npublic:\n    point(int abs = 0, int ord = 0) : x(abs), y(ord) { cout &lt;&lt; &quot;++ point &quot; &lt;&lt; x &lt;&lt; &quot; &quot; &lt;&lt; y &lt;&lt; &quot;\\n&quot;; }\n    ~point() { cout &lt;&lt; &quot;-- point\\n&quot;; }\n};\nclass pointcol : public point {\n    int coul;\npublic:\n    pointcol(int abs = 0, int ord = 0, int cl = 1) : point(abs, ord) { coul = cl; cout &lt;&lt; &quot;++ pointcol &quot; &lt;&lt; coul &lt;&lt; &quot;\\n&quot;; }\n    ~pointcol() { cout &lt;&lt; &quot;-- pointcol\\n&quot;; }\n    void affiche() { cout &lt;&lt; &quot;Je suis en &quot; &lt;&lt; x &lt;&lt; &quot; &quot; &lt;&lt; y &lt;&lt; &quot; couleur &quot; &lt;&lt; coul &lt;&lt; &quot;\\n&quot;; }  // x, y protected\n};\nint main() {\n    pointcol a(2, 3, 4);\n    a.affiche();\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>++ point 2 3\n++ pointcol 4\nJe suis en 2 3 couleur 4\n-- pointcol\n-- point<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Dans l&#39;exemple de recopie des diapos, la couleur est un <code>char<\/code> et s&#39;affiche avec <code>cout &lt;&lt; coul<\/code> : on obtient le <strong>caractère<\/strong> de code 4, pas le chiffre 4. Il faut <code>int(coul)<\/code>, comme le fait d&#39;ailleurs le constructeur usuel de la même diapo.<\/p>\n<\/aside><h2>Idée 3 · Modes de dérivation<\/h2>\n<figure class=\"grille\"><figcaption>Statut d'un membre hérité<\/figcaption><table><tr><th>Dans la base<\/th><th>dérivation public<\/th><th>dérivation protected<\/th><th>dérivation private<\/th><\/tr><tr><td>public<\/td><td>public<\/td><td class=\"h1\">protected<\/td><td class=\"h1\">private<\/td><\/tr><tr><td>protected<\/td><td>protected<\/td><td>protected<\/td><td class=\"h1\">private<\/td><\/tr><tr><td>private<\/td><td class=\"h0\">inaccessible<\/td><td class=\"h0\">inaccessible<\/td><td class=\"h0\">inaccessible<\/td><\/tr><\/table><\/figure><ul>\n<li><strong>public<\/strong> (le cas courant) : l&#39;utilisateur de pointcol peut encore appeler <code>p.affiche()<\/code> de point.<\/li>\n<li><strong>private<\/strong> : <code>p.deplace(...)<\/code> est refusé, même écrit <code>p.point::deplace(...)<\/code>.<\/li>\n<li><strong>protected<\/strong> : intermédiaire ; les membres publics de la base deviennent protégés pour les dérivations suivantes.<\/li>\n<\/ul>\n<h2>Idée 4 · Conversions entre base et dérivée<\/h2>\n<figure class=\"flux\"><figcaption>Ce qui est permis<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">pointcol<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">point (a = b : on garde la partie point)<\/div><\/div><div class=\"flux-l\"><div class=\"flux-b\">pointcol*<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">point* (adp = adpc)<\/div><\/div><\/figure><p>L&#39;inverse (<code>b = a;<\/code>, <code>adpc = adp;<\/code>) est refusé : un point n&#39;a pas de couleur.<\/p>\n<aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Avec <code>point *adp = &amp;pc;<\/code> (pc est un pointcol), <code>adp-&gt;affiche()<\/code> appelle <strong>point::affiche()<\/strong>. Le choix est fait à la compilation d&#39;après le type du <strong>pointeur<\/strong> (typage statique). Pour obtenir pointcol::affiche, il faudra une fonction <strong>virtuelle<\/strong> (chapitre 8).<\/p>\n<\/aside><p>Recopie et affectation : si la dérivée <strong>ne définit pas<\/strong> son constructeur de recopie (ou son =), la version par défaut appelle celle de la base pour la partie héritée. Si elle <strong>en définit un<\/strong>, c&#39;est à elle de traiter la partie base : <code>pointcol(const pointcol &amp;p) : point(p) {...}<\/code>.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices du TD3<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>(TD3, ex. 1) À partir de <code>class point { float x, y; public: point(float abs=0.0, float ord=0.0); void affiche(); void deplace(float, float); };<\/code>, écris pointcol avec un membre <code>int cl<\/code>, <code>affiche<\/code> redéfinie, <code>colore(int)<\/code> et un constructeur (non en ligne).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>class pointcol : public point { int cl; public: pointcol(float = 0.0, float = 0.0, int = 0); void affiche(); void colore(int c) { cl = c; } };<\/code> puis hors classe : <code>pointcol::pointcol(float a, float o, int c) : point(a, o) { cl = c; }<\/code> et <code>void pointcol::affiche() { point::affiche(); cout &lt;&lt; &quot; couleur : &quot; &lt;&lt; cl &lt;&lt; &quot;\\n&quot;; }<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Avec <code>class B : private A<\/code>, l&#39;utilisateur peut-il appeler une méthode publique de A sur un objet B ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : non<\/b><\/p><p>Non : en dérivation privée, les membres publics de A deviennent privés dans B.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Écris l&#39;operator= de pointcol qui affecte aussi la partie point, en réutilisant l&#39;operator= de point.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>pointcol &amp; operator=(const pointcol &amp;b) { point::operator=(b); coul = b.coul; return *this; }<\/code>. Le cours obtient le même effet avec deux pointeurs : <code>point *ad1 = this, *ad2 = (point*)&amp;b; *ad1 = *ad2;<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quelle relation traduit l&#39;héritage public ?<\/div><button class=\"opt\" data-o=\"0\">« est un »<\/button><button class=\"opt\" data-o=\"1\">« a un »<\/button><button class=\"opt\" data-o=\"2\">« utilise un »<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Une méthode de pointcol peut-elle lire x si x est private dans point ?<\/div><button class=\"opt\" data-o=\"0\">Oui, toujours<\/button><button class=\"opt\" data-o=\"1\">Non<\/button><button class=\"opt\" data-o=\"2\">Oui si la dérivation est publique<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Ordre d&#39;exécution pour <code>pointcol a(2,3,4);<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">Constructeur de point, puis de pointcol<\/button><button class=\"opt\" data-o=\"1\">Constructeur de pointcol, puis de point<\/button><button class=\"opt\" data-o=\"2\">Seulement le constructeur de pointcol<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Ordre de destruction de a ?<\/div><button class=\"opt\" data-o=\"0\">point puis pointcol<\/button><button class=\"opt\" data-o=\"1\">pointcol puis point<\/button><button class=\"opt\" data-o=\"2\">Seulement point<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Redéfinir une méthode signifie :<\/div><button class=\"opt\" data-o=\"0\">Lui donner une autre signature dans la même classe<\/button><button class=\"opt\" data-o=\"1\">La réécrire avec la même signature dans une classe dérivée<\/button><button class=\"opt\" data-o=\"2\">La déclarer static<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">En dérivation publique, un membre protected de la base devient :<\/div><button class=\"opt\" data-o=\"0\">public<\/button><button class=\"opt\" data-o=\"1\">protected<\/button><button class=\"opt\" data-o=\"2\">private<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">En dérivation privée, un membre public de la base devient :<\/div><button class=\"opt\" data-o=\"0\">public<\/button><button class=\"opt\" data-o=\"1\">protected<\/button><button class=\"opt\" data-o=\"2\">private<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Avec <code>point a; pointcol b;<\/code>, quelle affectation est légale ?<\/div><button class=\"opt\" data-o=\"0\"><code>a = b;<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>b = a;<\/code><\/button><button class=\"opt\" data-o=\"2\">Aucune<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\"><code>point *adp = &amp;pc;<\/code> (pc est un pointcol), sans virtual, <code>adp-&gt;affiche()<\/code> appelle :<\/div><button class=\"opt\" data-o=\"0\">point::affiche<\/button><button class=\"opt\" data-o=\"1\">pointcol::affiche<\/button><button class=\"opt\" data-o=\"2\">Une erreur de compilation<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Qu&#39;est-ce qui est hérité par la classe dérivée ?<\/div><button class=\"opt\" data-o=\"0\">Le constructeur de la base<\/button><button class=\"opt\" data-o=\"1\">L&#39;opérateur = de la base<\/button><button class=\"opt\" data-o=\"2\">Les fonctions membres publiques ordinaires<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"heritage-simple","rep":null,"tol":null},{"n":"heritage-simple","rep":null,"tol":null},{"n":"heritage-simple","rep":["non"],"tol":null},{"n":"heritage-simple","rep":null,"tol":null}],"qcm":[{"n":"heritage-simple","q":"Quelle relation traduit l&#39;héritage public ?","o":["« est un »","« a un »","« utilise un »"],"a":0,"e":"Un pointcol est un point."},{"n":"heritage-simple","q":"Une méthode de pointcol peut-elle lire x si x est private dans point ?","o":["Oui, toujours","Non","Oui si la dérivation est publique"],"a":1,"e":"Il faut que x soit protected (ou public)."},{"n":"heritage-simple","q":"Ordre d&#39;exécution pour <code>pointcol a(2,3,4);<\/code> ?","o":["Constructeur de point, puis de pointcol","Constructeur de pointcol, puis de point","Seulement le constructeur de pointcol"],"a":0,"e":"La base est construite d&#39;abord."},{"n":"heritage-simple","q":"Ordre de destruction de a ?","o":["point puis pointcol","pointcol puis point","Seulement point"],"a":1,"e":"Inverse de la construction."},{"n":"heritage-simple","q":"Redéfinir une méthode signifie :","o":["Lui donner une autre signature dans la même classe","La réécrire avec la même signature dans une classe dérivée","La déclarer static"],"a":1,"e":"Avec une autre signature, ce serait une surdéfinition."},{"n":"heritage-simple","q":"En dérivation publique, un membre protected de la base devient :","o":["public","protected","private"],"a":1,"e":"Le statut est conservé."},{"n":"heritage-simple","q":"En dérivation privée, un membre public de la base devient :","o":["public","protected","private"],"a":2,"e":"Il n&#39;est plus accessible à l&#39;utilisateur de la dérivée."},{"n":"heritage-simple","q":"Avec <code>point a; pointcol b;<\/code>, quelle affectation est légale ?","o":["<code>a = b;<\/code>","<code>b = a;<\/code>","Aucune"],"a":0,"e":"Conversion dérivée → base seulement."},{"n":"heritage-simple","q":"<code>point *adp = &amp;pc;<\/code> (pc est un pointcol), sans virtual, <code>adp-&gt;affiche()<\/code> appelle :","o":["point::affiche","pointcol::affiche","Une erreur de compilation"],"a":0,"e":"Le choix suit le type du pointeur."},{"n":"heritage-simple","q":"Qu&#39;est-ce qui est hérité par la classe dérivée ?","o":["Le constructeur de la base","L&#39;opérateur = de la base","Les fonctions membres publiques ordinaires"],"a":2,"e":"Constructeurs, destructeur et = ne sont pas hérités."}]},{"id":"multiple-polymorphisme","t":"Héritage multiple, fonctions virtuelles et classes abstraites","seance":"Partie III · Héritage multiple et polymorphisme","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut maîtriser l&#39;héritage simple, en particulier la conversion <code>pointcol*<\/code> → <code>point*<\/code> (chapitre 7).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p><code>point *adp = &amp;pc;<\/code> où pc est un pointcol, sans mot-clé virtual. Quelle version d&#39;affiche est appelée par <code>adp-&gt;affiche()<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>point::affiche : le compilateur choisit d&#39;après le type du pointeur (point*). Ce chapitre montre comment obtenir pointcol::affiche.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Pose toujours deux questions : quel est le <strong>type déclaré<\/strong> (du pointeur ou de la référence) ? quel est le <strong>type réel<\/strong> de l&#39;objet ? Sans <code>virtual<\/code>, c&#39;est le type déclaré qui décide. Avec <code>virtual<\/code>, c&#39;est le type réel.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Oublier le <strong>destructeur virtuel<\/strong>. Avec <code>Graphic *og = new Fenetre; delete og;<\/code>, seul ~Graphic est appelé si le destructeur n&#39;est pas virtuel : la partie Fenetre n&#39;est jamais détruite.<\/p>\n<\/aside><p>À la fin, tu sais écrire une classe à deux bases, éviter la duplication avec l&#39;héritage virtuel, prédire l&#39;effet de virtual, et définir une classe abstraite.<\/p>\n<h2>Idée 1 · Héritage multiple<\/h2>\n<p><code>class pointcoul : public point, public coul { ... };<\/code>. Les constructeurs des bases s&#39;appellent <strong>dans l&#39;ordre de déclaration des bases<\/strong>, les destructeurs dans l&#39;ordre inverse.<\/p>\n<pre class=\"\"><code>#include &lt;iostream&gt;\nusing namespace std;\nclass point {\n    int x, y;\npublic:\n    point(int abs, int ord) { cout &lt;&lt; &quot;++ Constr. point\\n&quot;; x = abs; y = ord; }\n    ~point() { cout &lt;&lt; &quot;-- Destr. point\\n&quot;; }\n    void affiche() { cout &lt;&lt; &quot;Coordonnees : &quot; &lt;&lt; x &lt;&lt; &quot; &quot; &lt;&lt; y &lt;&lt; &quot;\\n&quot;; }\n};\nclass coul {\n    short couleur;\npublic:\n    coul(int cl) { cout &lt;&lt; &quot;++ Constr. coul\\n&quot;; couleur = cl; }\n    ~coul() { cout &lt;&lt; &quot;-- Destr. coul\\n&quot;; }\n    void affiche() { cout &lt;&lt; &quot;Couleur : &quot; &lt;&lt; couleur &lt;&lt; &quot;\\n&quot;; }\n};\nclass pointcoul : public point, public coul {\npublic:\n    pointcoul(int abs, int ord, int cl) : point(abs, ord), coul(cl) { cout &lt;&lt; &quot;++++ Constr. pointcoul\\n&quot;; }\n    ~pointcoul() { cout &lt;&lt; &quot;---- Destr. pointcoul\\n&quot;; }\n    void affiche() { point::affiche(); coul::affiche(); }\n};\nint main() {\n    pointcoul p(3, 9, 2);\n    p.affiche();\n    p.coul::affiche();         // on force la version de coul\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>++ Constr. point\n++ Constr. coul\n++++ Constr. pointcoul\nCoordonnees : 3 9\nCouleur : 2\nCouleur : 2\n---- Destr. pointcoul\n-- Destr. coul\n-- Destr. point<\/code><\/pre><p>Les deux bases ont une méthode <code>affiche<\/code> : il faut lever l&#39;ambiguïté avec <code>point::<\/code> ou <code>coul::<\/code>.<\/p>\n<h2>Idée 2 · Le losange et l&#39;héritage virtuel<\/h2>\n<svg viewBox=\"0 0 640 200\" style=\"width:100%;max-width:640px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Losange : B et C héritent de A, D hérite de B et C. Sans virtual, D contient deux copies de A ; avec virtual, une seule\">\n<g font-family=\"sans-serif\" font-size=\"14\" fill=\"currentColor\" text-anchor=\"middle\">\n<rect x=\"270\" y=\"10\" width=\"100\" height=\"34\" rx=\"6\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/><text x=\"320\" y=\"32\">A (x, y)<\/text>\n<rect x=\"150\" y=\"80\" width=\"100\" height=\"34\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"200\" y=\"102\">B<\/text>\n<rect x=\"390\" y=\"80\" width=\"100\" height=\"34\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"440\" y=\"102\">C<\/text>\n<rect x=\"270\" y=\"150\" width=\"100\" height=\"34\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"320\" y=\"172\">D<\/text>\n<line x1=\"200\" y1=\"80\" x2=\"290\" y2=\"44\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"440\" y1=\"80\" x2=\"350\" y2=\"44\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<line x1=\"290\" y1=\"150\" x2=\"200\" y2=\"114\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"350\" y1=\"150\" x2=\"440\" y2=\"114\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<text x=\"140\" y=\"60\" font-size=\"12\" fill=\"#D9824F\">virtual<\/text><text x=\"500\" y=\"60\" font-size=\"12\" fill=\"#D9824F\">virtual<\/text>\n<text x=\"560\" y=\"170\" font-size=\"12\">un seul A dans D<\/text>\n<\/g><\/svg><p>Sans précaution, D hérite <strong>deux fois<\/strong> de A (via B et via C) : deux x, deux y, à distinguer par <code>B::x<\/code> et <code>C::x<\/code>. Avec <code>class B : public virtual A<\/code> et <code>class C : public virtual A<\/code>, A n&#39;est incorporée qu&#39;<strong>une fois<\/strong>.<\/p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Avec une base virtuelle, c&#39;est la classe <strong>la plus dérivée<\/strong> (D) qui appelle le constructeur de A ; les arguments que B et C transmettraient à A sont ignorés. Sans indication, A doit avoir un constructeur <strong>par défaut<\/strong>.<\/p>\n<\/aside><pre class=\"\"><code>#include &lt;iostream&gt;\n#include &lt;string&gt;\nusing namespace std;\nclass Personne {\nprotected:\n    string nom;\npublic:\n    Personne(string n = &quot;?&quot;) : nom(n) { cout &lt;&lt; &quot;++ Personne &quot; &lt;&lt; nom &lt;&lt; &quot;\\n&quot;; }\n    virtual ~Personne() {}\n};\nclass Etudiant : public virtual Personne {\npublic:\n    Etudiant(string n = &quot;?&quot;) : Personne(n) { cout &lt;&lt; &quot;++ Etudiant\\n&quot;; }\n};\nclass Employe : public virtual Personne {\npublic:\n    Employe(string n = &quot;?&quot;) : Personne(n) { cout &lt;&lt; &quot;++ Employe\\n&quot;; }\n};\nclass EmployeEtudiant : public Employe, public Etudiant {\npublic:\n    EmployeEtudiant(string n) : Personne(n), Employe(n), Etudiant(n) { cout &lt;&lt; &quot;++ EmployeEtudiant\\n&quot;; }\n    void qui() { cout &lt;&lt; &quot;Je suis &quot; &lt;&lt; nom &lt;&lt; &quot;\\n&quot;; }   // nom non ambigu : un seul Personne\n};\nint main() {\n    EmployeEtudiant ee(&quot;Amine&quot;);\n    ee.qui();\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>++ Personne Amine\n++ Employe\n++ Etudiant\n++ EmployeEtudiant\nJe suis Amine<\/code><\/pre><p>Une seule ligne « ++ Personne » : la base virtuelle n&#39;est construite qu&#39;une fois, et en premier.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Dans l&#39;exemple pointcolmasse des diapos, <code>&lt;&lt; abs + &quot; &quot; &lt;&lt;<\/code> additionne un entier et une chaîne (arithmétique de pointeur) : l&#39;affichage montré « 2 5 10 20 » ne correspond pas à ce code. Il faut <code>&lt;&lt; abs &lt;&lt; &quot; &quot; &lt;&lt;<\/code>.<\/p>\n<\/aside><h2>Idée 3 · Fonctions virtuelles : le polymorphisme<\/h2>\n<pre class=\"\"><code>#include &lt;iostream&gt;\nusing namespace std;\nclass Graphic {\npublic:\n    void print() const { cout &lt;&lt; &quot;Graphic::print()\\n&quot;; }            // NON virtuelle\n    virtual void printV() const { cout &lt;&lt; &quot;Graphic::printV()\\n&quot;; }  // virtuelle\n    virtual ~Graphic() { cout &lt;&lt; &quot;fin de Graphic\\n&quot;; }\n};\nclass Bouton : public Graphic {\npublic:\n    void print() const { cout &lt;&lt; &quot;Bouton::print()\\n&quot;; }\n    void printV() const { cout &lt;&lt; &quot;Bouton::printV()\\n&quot;; }\n};\nclass Fenetre : public Graphic {\npublic:\n    void print() const { cout &lt;&lt; &quot;Fenetre::print()\\n&quot;; }\n    void printV() const { cout &lt;&lt; &quot;Fenetre::printV()\\n&quot;; }\n    ~Fenetre() { cout &lt;&lt; &quot;fin de Fenetre\\n&quot;; }\n};\nvoid traitement(const Graphic &amp;og) { og.print(); og.printV(); }\nint main() {\n    Bouton OK; Fenetre Window;\n    traitement(OK);\n    traitement(Window);\n    Graphic *og = new Fenetre;\n    delete og;                  // destructeur virtuel : Fenetre puis Graphic\n    cout &lt;&lt; &quot;--- fin de main\\n&quot;;\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Graphic::print()\nBouton::printV()\nGraphic::print()\nFenetre::printV()\nfin de Fenetre\nfin de Graphic\n--- fin de main\nfin de Fenetre\nfin de Graphic\nfin de Graphic<\/code><\/pre><p>Les trois dernières lignes viennent de la destruction automatique de Window (Fenetre puis Graphic) et de OK (Graphic seul, Bouton n&#39;ayant pas de destructeur propre) à la fin de main.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Quelle méthode est appelée ?<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Appel par objet<\/div><p><code>OK.print()<\/code> : le type de OK décide, virtuel ou non.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Appel par pointeur/référence, méthode non virtuelle<\/div><p>le type <strong>déclaré<\/strong> décide (liaison statique, à la compilation).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Appel par pointeur/référence, méthode virtuelle<\/div><p>le type <strong>réel<\/strong> de l&#39;objet décide (liaison dynamique, à l&#39;exécution).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Redéfinition<\/div><p>une méthode virtuelle dans la base reste virtuelle dans les dérivées, même sans réécrire virtual.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p>Règles du cours : un <strong>constructeur<\/strong> ne peut pas être virtuel ; une méthode <strong>statique<\/strong> non plus ; le statut d&#39;accès d&#39;une méthode virtuelle est celui de la <strong>base<\/strong>.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Les diapos utilisent <code>void main()<\/code> : ce n&#39;est pas du C++ standard, écris <code>int main()<\/code>. Et le commentaire « fin de Fenêtre fin de Graphic » suppose un destructeur ~Fenetre que la diapo ne montre pas : on l&#39;a ajouté ici.<\/p>\n<\/aside><h2>Idée 4 · Classes abstraites<\/h2>\n<p>Une <strong>fonction virtuelle pure<\/strong> se déclare <code>virtual void affiche() = 0;<\/code>. Une classe qui en contient au moins une est <strong>abstraite<\/strong> : on ne peut pas créer d&#39;objet de ce type, seulement des pointeurs ou références. Toute dérivée concrète doit définir les fonctions pures.<\/p>\n<pre class=\"\"><code>#include &lt;iostream&gt;\nusing namespace std;\nclass Forme {                          // abstraite\npublic:\n    virtual double surface() const = 0;\n    virtual ~Forme() {}\n};\nclass Rectangle : public Forme {\n    double l, h;\npublic:\n    Rectangle(double a, double b) : l(a), h(b) {}\n    double surface() const { return l * h; }\n};\nclass Cercle : public Forme {\n    double r;\npublic:\n    Cercle(double a) : r(a) {}\n    double surface() const { return 3.14 * r * r; }\n};\nint main() {\n    Forme *t[2] = { new Rectangle(3, 4), new Cercle(1) };   // Forme f; serait refusé\n    for (int i = 0; i &lt; 2; i++) cout &lt;&lt; &quot;surface : &quot; &lt;&lt; t[i]-&gt;surface() &lt;&lt; &quot;\\n&quot;;\n    for (int i = 0; i &lt; 2; i++) delete t[i];\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>surface : 12\nsurface : 3.14<\/code><\/pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Tableau de pointeurs vers la base + méthode virtuelle = <strong>polymorphisme<\/strong> : la même boucle traite des objets de classes différentes. C&#39;est l&#39;exercice type du TD4 (Personne, Etudiant, Employe).<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices du TD4<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>(TD4, ex. 4.1) Donne la déclaration des quatre classes : Personne (nom, prenom, <code>virtual afficher()<\/code>), Etudiant et Employe (héritage virtuel, numeroApogee / numeroSomme), EmployeEtudiant.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>class Personne { protected: string nom, prenom; public: Personne(string n=&quot;&quot;, string p=&quot;&quot;); virtual ~Personne(); virtual void afficher() const; };<\/code>\n<code>class Etudiant : virtual public Personne { protected: int numeroApogee; public: Etudiant(string n=&quot;&quot;, string p=&quot;&quot;, int a=0) : Personne(n,p), numeroApogee(a) {} void afficher() const; };<\/code> (Employe idem avec numeroSomme.)\n<code>class EmployeEtudiant : public Employe, public Etudiant { public: EmployeEtudiant(string n, string p, int s, int a) : Personne(n,p), Employe(n,p,s), Etudiant(n,p,a) {} void afficher() const; };<\/code>\nDans main : <code>Personne *tab[3] = { new Etudiant(...), new Employe(...), new EmployeEtudiant(...) };<\/code> puis <code>tab[i]-&gt;afficher();<\/code> et <code>delete tab[i];<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Pourquoi faut-il <code>: Personne(n,p)<\/code> dans le constructeur de EmployeEtudiant ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Personne est une base virtuelle : c&#39;est la classe la plus dérivée qui la construit. Sans cela, le constructeur par défaut de Personne serait appelé et nom/prénom resteraient vides.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p><code>class X { virtual void affiche() = 0; };<\/code> puis <code>X a;<\/code> dans main. Que se passe-t-il ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Erreur de compilation : X est abstraite (fonction virtuelle pure), on ne peut pas l&#39;instancier. On peut seulement déclarer <code>X *p;<\/code> ou <code>X &amp;r = ...;<\/code> vers une dérivée concrète.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 9 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Pour <code>class D : public B, public C<\/code>, quel constructeur s&#39;exécute en premier ?<\/div><button class=\"opt\" data-o=\"0\">Celui de B<\/button><button class=\"opt\" data-o=\"1\">Celui de C<\/button><button class=\"opt\" data-o=\"2\">Celui de D<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Sans héritage virtuel, dans le losange A → B, C → D, combien de copies de A contient D ?<\/div><button class=\"opt\" data-o=\"0\">1<\/button><button class=\"opt\" data-o=\"1\">2<\/button><button class=\"opt\" data-o=\"2\">0<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Où écrit-on virtual pour éviter la duplication de A ?<\/div><button class=\"opt\" data-o=\"0\">Dans la déclaration de D<\/button><button class=\"opt\" data-o=\"1\">Dans les déclarations de B et de C<\/button><button class=\"opt\" data-o=\"2\">Dans la classe A<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Sans virtual, <code>Graphic &amp;og = OK; og.print();<\/code> (OK est un Bouton) appelle :<\/div><button class=\"opt\" data-o=\"0\">Graphic::print<\/button><button class=\"opt\" data-o=\"1\">Bouton::print<\/button><button class=\"opt\" data-o=\"2\">Une erreur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Avec <code>virtual void print() const<\/code> dans Graphic, le même appel donne :<\/div><button class=\"opt\" data-o=\"0\">Graphic::print<\/button><button class=\"opt\" data-o=\"1\">Bouton::print<\/button><button class=\"opt\" data-o=\"2\">Les deux<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\"><code>Graphic *og = new Fenetre; delete og;<\/code> sans destructeur virtuel :<\/div><button class=\"opt\" data-o=\"0\">Appelle ~Fenetre puis ~Graphic<\/button><button class=\"opt\" data-o=\"1\">N&#39;appelle que ~Graphic<\/button><button class=\"opt\" data-o=\"2\">Ne compile pas<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Lequel ne peut pas être virtuel ?<\/div><button class=\"opt\" data-o=\"0\">Un constructeur<\/button><button class=\"opt\" data-o=\"1\">Un destructeur<\/button><button class=\"opt\" data-o=\"2\">Une méthode const<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Une classe est abstraite si :<\/div><button class=\"opt\" data-o=\"0\">Elle n&#39;a que des méthodes virtuelles<\/button><button class=\"opt\" data-o=\"1\">Elle contient au moins une fonction virtuelle pure<\/button><button class=\"opt\" data-o=\"2\">Elle n&#39;a pas de constructeur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Avec <code>class X { public: virtual void f() = 0; };<\/code>, laquelle est correcte ?<\/div><button class=\"opt\" data-o=\"0\"><code>X a;<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>X *p;<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>X t[3];<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Une méthode déclarée virtual dans la base et redéfinie sans le mot virtual dans la dérivée :<\/div><button class=\"opt\" data-o=\"0\">Reste virtuelle<\/button><button class=\"opt\" data-o=\"1\">Devient non virtuelle<\/button><button class=\"opt\" data-o=\"2\">Provoque une erreur<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"multiple-polymorphisme","rep":null,"tol":null},{"n":"multiple-polymorphisme","rep":null,"tol":null},{"n":"multiple-polymorphisme","rep":null,"tol":null},{"n":"multiple-polymorphisme","rep":null,"tol":null}],"qcm":[{"n":"multiple-polymorphisme","q":"Pour <code>class D : public B, public C<\/code>, quel constructeur s&#39;exécute en premier ?","o":["Celui de B","Celui de C","Celui de D"],"a":0,"e":"Les bases sont construites dans l&#39;ordre de déclaration."},{"n":"multiple-polymorphisme","q":"Sans héritage virtuel, dans le losange A → B, C → D, combien de copies de A contient D ?","o":["1","2","0"],"a":1,"e":"Une via B, une via C."},{"n":"multiple-polymorphisme","q":"Où écrit-on virtual pour éviter la duplication de A ?","o":["Dans la déclaration de D","Dans les déclarations de B et de C","Dans la classe A"],"a":1,"e":"<code>class B : public virtual A<\/code> et <code>class C : public virtual A<\/code>."},{"n":"multiple-polymorphisme","q":"Sans virtual, <code>Graphic &amp;og = OK; og.print();<\/code> (OK est un Bouton) appelle :","o":["Graphic::print","Bouton::print","Une erreur"],"a":0,"e":"Liaison statique : type déclaré."},{"n":"multiple-polymorphisme","q":"Avec <code>virtual void print() const<\/code> dans Graphic, le même appel donne :","o":["Graphic::print","Bouton::print","Les deux"],"a":1,"e":"Liaison dynamique : type réel."},{"n":"multiple-polymor
