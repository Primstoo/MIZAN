phisme","q":"<code>Graphic *og = new Fenetre; delete og;<\/code> sans destructeur virtuel :","o":["Appelle ~Fenetre puis ~Graphic","N&#39;appelle que ~Graphic","Ne compile pas"],"a":1,"e":"Il faut un destructeur virtuel dans la base."},{"n":"multiple-polymorphisme","q":"Lequel ne peut pas être virtuel ?","o":["Un constructeur","Un destructeur","Une méthode const"],"a":0,"e":"Le cours le précise ; une méthode statique non plus."},{"n":"multiple-polymorphisme","q":"Une classe est abstraite si :","o":["Elle n&#39;a que des méthodes virtuelles","Elle contient au moins une fonction virtuelle pure","Elle n&#39;a pas de constructeur"],"a":1,"e":"Une seule <code>= 0<\/code> suffit."},{"n":"multiple-polymorphisme","q":"Avec <code>class X { public: virtual void f() = 0; };<\/code>, laquelle est correcte ?","o":["<code>X a;<\/code>","<code>X *p;<\/code>","<code>X t[3];<\/code>"],"a":1,"e":"On ne peut pas instancier X, mais on peut déclarer des pointeurs."},{"n":"multiple-polymorphisme","q":"Une méthode déclarée virtual dans la base et redéfinie sans le mot virtual dans la dérivée :","o":["Reste virtuelle","Devient non virtuelle","Provoque une erreur"],"a":0,"e":"Le caractère virtuel se transmet."}]},{"id":"patrons-exceptions","t":"Patrons de fonctions et de classes, gestion des exceptions","seance":"Parties IV et V · Templates et exceptions","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut connaître la surdéfinition de fonctions (chapitre 1) et la surdéfinition d&#39;opérateurs (chapitre 5).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Pour avoir une fonction min sur des int et sur des float, combien de fonctions faut-il écrire avec la seule surdéfinition ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 2<\/b><\/p><p>Deux : <code>int min(int, int)<\/code> et <code>float min(float, float)<\/code>, au corps identique. Un patron évite cette répétition.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Un patron (template) est un <strong>moule<\/strong> : tu écris le code une fois avec un type T, et le compilateur fabrique la version int, float, vect… quand il en a besoin. Une exception est un <strong>signal d&#39;erreur<\/strong> qui remonte jusqu&#39;au premier <code>catch<\/code> capable de la traiter.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Avec <code>using namespace std;<\/code>, nommer son patron <code>min<\/code> entre en conflit avec <code>std::min<\/code> : l&#39;appel devient ambigu. Les diapos le font ; dans tes programmes, appelle-le <code>minimum<\/code> (ou n&#39;utilise pas <code>using namespace std<\/code>).<\/p>\n<\/aside><p>À la fin, tu sais écrire un patron de fonction et de classe, prévoir quelle fonction le compilateur choisit, et structurer un <code>try / throw / catch<\/code>.<\/p>\n<h2>Idée 1 · Patrons de fonctions<\/h2>\n<figure class=\"flux\"><figcaption>Instanciation d'un patron<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">template <class T> T minimum(T a, T b)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">appel minimum(4, 12)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">T = int<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">int minimum(int, int)<\/div><\/div><\/figure><pre class=\"\"><code>#include &lt;iostream&gt;\nusing namespace std;\ntemplate &lt;class T&gt; T minimum(T a, T b) {\n    if (a &lt; b) return a;\n    else return b;\n}\nclass vect {\n    int x, y;\npublic:\n    vect(int abs = 0, int ord = 0) { x = abs; y = ord; }\n    void affiche() { cout &lt;&lt; x &lt;&lt; &quot; &quot; &lt;&lt; y; }\n    friend int operator&lt;(vect, vect);\n};\nint operator&lt;(vect a, vect b) { return a.x*a.x + a.y*a.y &lt; b.x*b.x + b.y*b.y; }   // compare les modules\nint main() {\n    int n = 4, p = 12;\n    float x = 2.5, y = 3.25;\n    cout &lt;&lt; &quot;minimum(n, p) = &quot; &lt;&lt; minimum(n, p) &lt;&lt; &quot;\\n&quot;;\n    cout &lt;&lt; &quot;minimum(x, y) = &quot; &lt;&lt; minimum(x, y) &lt;&lt; &quot;\\n&quot;;\n    vect u(3, 2), v(4, 1);\n    cout &lt;&lt; &quot;minimum(u, v) = &quot;; minimum(u, v).affiche(); cout &lt;&lt; &quot;\\n&quot;;\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>minimum(n, p) = 4\nminimum(x, y) = 2.5\nminimum(u, v) = 3 2<\/code><\/pre><p>Pour appliquer le patron à une classe, l&#39;opérateur <code>&lt;<\/code> doit exister pour cette classe : ici 3²+2² = 13 &lt; 4²+1² = 17, donc u.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Ordre de recherche du compilateur<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · 1. Fonction ordinaire exacte<\/div><p>une fonction non patron dont la signature correspond exactement.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · 2. Patron exact<\/div><p>un patron qui produit exactement ces types (sans conversion).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · 3. Fonction ordinaire avec conversions<\/div><p>une fonction normale en acceptant des conversions.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · 4. Sinon<\/div><p>erreur de compilation. Note : <code>minimum(n, x)<\/code> (int et float) échoue, car T ne peut pas être à la fois int et float.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Les diapos utilisent le nom <code>min<\/code> et, dans un premier exemple, des paramètres <code>T &amp;a, T &amp;b<\/code>. Avec <code>using namespace std;<\/code> et <code>&lt;iostream&gt;<\/code>, g++ peut signaler l&#39;ambiguïté avec <code>std::min<\/code> ; on a renommé en <code>minimum<\/code>.<\/p>\n<\/aside><h2>Idée 2 · Patrons de classes<\/h2>\n<pre class=\"\"><code>#include &lt;iostream&gt;\nusing namespace std;\ntemplate &lt;class T&gt; class point {\n    T x, y;\npublic:\n    point(T abs = 0, T ord = 0) { x = abs; y = ord; }\n    void affiche();\n};\ntemplate &lt;class T&gt; void point&lt;T&gt;::affiche() {      // définition hors classe\n    cout &lt;&lt; &quot;Coordonnees : &quot; &lt;&lt; x &lt;&lt; &quot; &quot; &lt;&lt; y &lt;&lt; &quot;\\n&quot;;\n}\nint main() {\n    point&lt;int&gt; a(1, 13);\n    point&lt;float&gt; b(2.5, 5.25);\n    a.affiche();\n    b.affiche();\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Coordonnees : 1 13\nCoordonnees : 2.5 5.25<\/code><\/pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Pour une classe patron, le type se donne <strong>explicitement<\/strong> entre chevrons : <code>point&lt;int&gt;<\/code>. Une méthode définie hors de la classe répète <code>template &lt;class T&gt;<\/code> et écrit <code>point&lt;T&gt;::<\/code>.<\/p>\n<\/aside><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Les diapos écrivent <code>class point&lt;int&gt; a(1, 13);<\/code> : le mot <code>class<\/code> y est permis mais inutile, <code>point&lt;int&gt; a(1, 13);<\/code> suffit.<\/p>\n<\/aside><h2>Idée 3 · Lancer et attraper une exception<\/h2>\n<svg viewBox=\"0 0 640 150\" style=\"width:100%;max-width:640px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Dans le bloc try, throw lance une exception ; le contrôle saute au catch du bon type, puis le programme continue après le dernier catch\">\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\">\n<rect x=\"20\" y=\"30\" width=\"170\" height=\"80\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"105\" y=\"55\" font-weight=\"700\">try { ... }<\/text><text x=\"105\" y=\"85\" fill=\"#D9824F\">throw x;<\/text>\n<rect x=\"240\" y=\"20\" width=\"150\" height=\"40\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-dasharray=\"5 4\"/><text x=\"315\" y=\"45\">catch (int)<\/text>\n<rect x=\"240\" y=\"80\" width=\"150\" height=\"40\" rx=\"8\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/><text x=\"315\" y=\"105\">catch (string e)<\/text>\n<rect x=\"450\" y=\"80\" width=\"170\" height=\"40\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"535\" y=\"105\">suite du programme<\/text>\n<line x1=\"190\" y1=\"88\" x2=\"240\" y2=\"100\" stroke=\"#D9824F\" stroke-width=\"2\"/><line x1=\"390\" y1=\"100\" x2=\"450\" y2=\"100\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<text x=\"215\" y=\"140\" font-size=\"12\">x est une string : le catch(int) est sauté<\/text>\n<\/g><\/svg><pre class=\"\"><code>#include &lt;iostream&gt;\n#include &lt;string&gt;\nusing namespace std;\nclass exception_div_by_zero {\n    string message;\npublic:\n    exception_div_by_zero() { message = &quot;division par zero!&quot;; }\n    string getMessage() const { return message; }\n};\nint diviser(int a, int b) {\n    if (b == 0) throw exception_div_by_zero();   // on lance un objet\n    return a / b;\n}\nint main() {\n    try {\n        cout &lt;&lt; &quot;c: &quot; &lt;&lt; diviser(7, 2) &lt;&lt; endl;\n        cout &lt;&lt; &quot;c: &quot; &lt;&lt; diviser(1, 0) &lt;&lt; endl;  // lance l'exception\n        cout &lt;&lt; &quot;jamais affiche\\n&quot;;\n    }\n    catch (exception_div_by_zero err) { cout &lt;&lt; err.getMessage() &lt;&lt; endl; }\n    cout &lt;&lt; &quot;suite du programme!\\n&quot;;\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>c: 3\nc: division par zero!\nsuite du programme!<\/code><\/pre><p>Remarque le « c: » orphelin : il est affiché <strong>avant<\/strong> l&#39;appel de <code>diviser(1, 0)<\/code>, qui lance l&#39;exception au milieu de l&#39;instruction.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Les règles du try/catch (cours)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · 1<\/div><p>Une exception lancée dans un try donne la main au catch de son type.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · 2<\/div><p>Un try est suivi d&#39;au moins un catch ; plusieurs catch interceptent des types différents.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · 3<\/div><p>Avant d&#39;entrer dans le catch, les destructeurs des objets du try sont exécutés.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · 4<\/div><p>Après le catch, on continue à l&#39;instruction qui suit le dernier catch.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · 5<\/div><p>Aucun catch adapté : la fonction terminate est appelée (arrêt du programme).<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le premier exemple des diapos fait <code>c = a/b;<\/code> avec b = 0 et parle d&#39;une erreur générée : une division entière par zéro n&#39;est <strong>pas<\/strong> une exception C++, c&#39;est un comportement indéfini (souvent un plantage). C&#39;est bien pour cela qu&#39;on teste <code>b == 0<\/code> et qu&#39;on fait <code>throw<\/code> soi-même.<\/p>\n<\/aside><h2>Idée 4 · catch(...), throw; et stdexcept<\/h2>\n<ul>\n<li><code>catch(T)<\/code> attrape T <strong>et ses classes dérivées<\/strong> ; <code>catch(T info)<\/code> donne en plus l&#39;objet.<\/li>\n<li><code>catch(...)<\/code> attrape tout ce qui n&#39;a pas été traité avant.<\/li>\n<li><code>throw;<\/code> seul, dans un catch, <strong>relance<\/strong> l&#39;exception vers le try englobant le plus proche.<\/li>\n<\/ul>\n<pre class=\"\"><code>#include &lt;iostream&gt;\n#include &lt;string&gt;\n#include &lt;stdexcept&gt;\nusing namespace std;\nvoid fct(int i) {\n    try { throw i; }\n    catch (int e) {\n        if (e) cout &lt;&lt; &quot;catch in\\n&quot;;\n        else cout &lt;&lt; &quot;e: &quot; &lt;&lt; e &lt;&lt; endl;\n        throw;                       // relance\n    }\n    cout &lt;&lt; &quot;OK!\\n&quot;;\n}\nint main() {\n    try { fct(0); fct(1); }\n    catch (string x) { cout &lt;&lt; &quot;catch_string !\\n&quot;; }\n    catch (int) { cout &lt;&lt; &quot;catch_int!\\n&quot;; }\n    try { throw out_of_range(&quot;indice 9 hors limites&quot;); }\n    catch (logic_error &amp;e) { cout &lt;&lt; &quot;logic_error : &quot; &lt;&lt; e.what() &lt;&lt; &quot;\\n&quot;; }  // out_of_range dérive de logic_error\n    cout &lt;&lt; &quot;fin du programme!\\n&quot;;\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>e: 0\ncatch_int!\nlogic_error : indice 9 hors limites\nfin du programme!<\/code><\/pre><p><code>fct(1)<\/code> n&#39;est jamais exécuté : l&#39;exception relancée par <code>fct(0)<\/code> a quitté le bloc try de main.<\/p>\n<figure class=\"grille\"><figcaption>Quelques classes de stdexcept<\/figcaption><table><tr><th>Classe<\/th><th>Quand l'utiliser<\/th><\/tr><tr><td>logic_error<\/td><td>erreur de logique du programme<\/td><\/tr><tr><td>invalid_argument<\/td><td>argument invalide<\/td><\/tr><tr><td>out_of_range<\/td><td>indice hors limites<\/td><\/tr><tr><td>domain_error<\/td><td>hors du domaine (racine d'un négatif)<\/td><\/tr><tr><td>runtime_error<\/td><td>erreur détectée à l'exécution<\/td><\/tr><tr><td>overflow_error<\/td><td>dépassement arithmétique<\/td><\/tr><\/table><\/figure><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>S&#39;entraîner<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Écris un patron <code>echange<\/code> qui échange deux variables de même type.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>template &lt;class T&gt; void echange(T &amp;a, T &amp;b) { T c = a; a = b; b = c; }<\/code>. Les références sont indispensables, sinon on échange des copies.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Dans le programme de l&#39;idée 4, combien de lignes sont affichées ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 4<\/b><\/p><p>« e: 0 », « catch_int! », « logic_error : indice 9 hors limites », « fin du programme! ».<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Modifie <code>vecteur3d::operator[]<\/code> (chapitre 5) pour qu&#39;un indice hors de 0..2 lance une exception au lieu de renvoyer v[0].<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>float &amp; operator[](int i) { if (i &lt; 0 || i &gt; 2) throw out_of_range(&quot;indice invalide&quot;); return v[i]; }<\/code>, avec <code>#include &lt;stdexcept&gt;<\/code>. L&#39;appelant écrit <code>try { v[5] = 1; } catch (out_of_range &amp;e) { cout &lt;&lt; e.what(); }<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quelle ligne déclare un patron de fonction ?<\/div><button class=\"opt\" data-o=\"0\"><code>template &lt;class T&gt; T f(T a);<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>template T f(T a);<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>class &lt;T&gt; T f(T a);<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\"><code>minimum(4, 2.5)<\/code> avec <code>template &lt;class T&gt; T minimum(T, T)<\/code> :<\/div><button class=\"opt\" data-o=\"0\">Renvoie 2.5<\/button><button class=\"opt\" data-o=\"1\">Ne compile pas : T ne peut pas être à la fois int et double<\/button><button class=\"opt\" data-o=\"2\">Renvoie 2<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Que faut-il pour appliquer minimum à des objets vect ?<\/div><button class=\"opt\" data-o=\"0\">Un constructeur de recopie<\/button><button class=\"opt\" data-o=\"1\">Un opérateur &lt; pour vect<\/button><button class=\"opt\" data-o=\"2\">Une fonction virtuelle<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">En cas de choix, le compilateur préfère :<\/div><button class=\"opt\" data-o=\"0\">Une fonction ordinaire de signature exacte<\/button><button class=\"opt\" data-o=\"1\">Toujours le patron<\/button><button class=\"opt\" data-o=\"2\">La fonction déclarée en premier<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Comment déclare-t-on un point de coordonnées float avec le patron point ?<\/div><button class=\"opt\" data-o=\"0\"><code>point a(2.5, 5.25);<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>point&lt;float&gt; a(2.5, 5.25);<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>template point&lt;float&gt; a;<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Après l&#39;exécution d&#39;un catch, le programme :<\/div><button class=\"opt\" data-o=\"0\">Revient à l&#39;instruction qui a lancé l&#39;exception<\/button><button class=\"opt\" data-o=\"1\">Continue après le dernier catch<\/button><button class=\"opt\" data-o=\"2\">S&#39;arrête<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Que fait <code>throw;<\/code> sans argument dans un catch ?<\/div><button class=\"opt\" data-o=\"0\">Lance une exception vide<\/button><button class=\"opt\" data-o=\"1\">Relance l&#39;exception courante<\/button><button class=\"opt\" data-o=\"2\">Termine le programme<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\"><code>catch(...)<\/code> :<\/div><button class=\"opt\" data-o=\"0\">Attrape tous les types d&#39;exception<\/button><button class=\"opt\" data-o=\"1\">Attrape uniquement les int<\/button><button class=\"opt\" data-o=\"2\">Est une erreur de syntaxe<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\"><code>int c = 1 / 0;<\/code> (entiers) en C++ :<\/div><button class=\"opt\" data-o=\"0\">Lance automatiquement une exception attrapable<\/button><button class=\"opt\" data-o=\"1\">Est un comportement indéfini, pas une exception<\/button><button class=\"opt\" data-o=\"2\">Donne 0<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\"><code>catch (logic_error &amp;e)<\/code> attrape-t-il un <code>out_of_range<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">Oui, car out_of_range dérive de logic_error<\/button><button class=\"opt\" data-o=\"1\">Non, il faut catch(out_of_range)<\/button><button class=\"opt\" data-o=\"2\">Seulement avec catch(...)<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"patrons-exceptions","rep":["2"],"tol":null},{"n":"patrons-exceptions","rep":null,"tol":null},{"n":"patrons-exceptions","rep":["4"],"tol":null},{"n":"patrons-exceptions","rep":null,"tol":null}],"qcm":[{"n":"patrons-exceptions","q":"Quelle ligne déclare un patron de fonction ?","o":["<code>template &lt;class T&gt; T f(T a);<\/code>","<code>template T f(T a);<\/code>","<code>class &lt;T&gt; T f(T a);<\/code>"],"a":0,"e":"template, puis la liste des paramètres de type entre chevrons."},{"n":"patrons-exceptions","q":"<code>minimum(4, 2.5)<\/code> avec <code>template &lt;class T&gt; T minimum(T, T)<\/code> :","o":["Renvoie 2.5","Ne compile pas : T ne peut pas être à la fois int et double","Renvoie 2"],"a":1,"e":"Le patron exige deux arguments du même type."},{"n":"patrons-exceptions","q":"Que faut-il pour appliquer minimum à des objets vect ?","o":["Un constructeur de recopie","Un opérateur &lt; pour vect","Une fonction virtuelle"],"a":1,"e":"Le corps du patron utilise a &lt; b."},{"n":"patrons-exceptions","q":"En cas de choix, le compilateur préfère :","o":["Une fonction ordinaire de signature exacte","Toujours le patron","La fonction déclarée en premier"],"a":0,"e":"Fonction ordinaire exacte d&#39;abord, puis patron exact."},{"n":"patrons-exceptions","q":"Comment déclare-t-on un point de coordonnées float avec le patron point ?","o":["<code>point a(2.5, 5.25);<\/code>","<code>point&lt;float&gt; a(2.5, 5.25);<\/code>","<code>template point&lt;float&gt; a;<\/code>"],"a":1,"e":"Pour un patron de classe, on précise le type."},{"n":"patrons-exceptions","q":"Après l&#39;exécution d&#39;un catch, le programme :","o":["Revient à l&#39;instruction qui a lancé l&#39;exception","Continue après le dernier catch","S&#39;arrête"],"a":1,"e":"Il n&#39;y a pas de retour dans le try."},{"n":"patrons-exceptions","q":"Que fait <code>throw;<\/code> sans argument dans un catch ?","o":["Lance une exception vide","Relance l&#39;exception courante","Termine le programme"],"a":1,"e":"Elle est transmise au try englobant le plus proche."},{"n":"patrons-exceptions","q":"<code>catch(...)<\/code> :","o":["Attrape tous les types d&#39;exception","Attrape uniquement les int","Est une erreur de syntaxe"],"a":0,"e":"Les trois points signifient « n&#39;importe quel type »."},{"n":"patrons-exceptions","q":"<code>int c = 1 / 0;<\/code> (entiers) en C++ :","o":["Lance automatiquement une exception attrapable","Est un comportement indéfini, pas une exception","Donne 0"],"a":1,"e":"Il faut tester b == 0 et lancer soi-même l&#39;exception."},{"n":"patrons-exceptions","q":"<code>catch (logic_error &amp;e)<\/code> attrape-t-il un <code>out_of_range<\/code> ?","o":["Oui, car out_of_range dérive de logic_error","Non, il faut catch(out_of_range)","Seulement avec catch(...)"],"a":0,"e":"catch(T) attrape T et ses dérivées."}]},{"id":"td-tp-corriges","t":"TD et TP corrigés","seance":"TD1 à TD4 et TP1 · A.U. 2025-2026","imp":4,"html":"<p>Les énoncés viennent des fiches de TD et de TP du Pr Farchane. Les corrigés ci-dessous sont <strong>réécrits et testés<\/strong> (g++, C++17) ; ils suivent la démarche des corrections du prof.<\/p>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Essaie d&#39;abord seul chaque exercice (15 minutes au plus), puis compare. Les petits exercices du TD1 sont corrigés dans les chapitres 1 à 3.<\/p>\n<\/aside><h2>Où trouver chaque exercice<\/h2>\n<figure class=\"grille\"><figcaption>Plan des TD et TP<\/figcaption><table><tr><th>Fiche<\/th><th>Thème<\/th><th>Corrigé<\/th><\/tr><tr><td>TD1 ex. 1.1 à 1.6<\/td><td>du C au C++, références, new/delete<\/td><td>chapitres 1 et 2<\/td><\/tr><tr><td>TD1 ex. 1.7, 1.8<\/td><td>classe point, compteur statique<\/td><td>chapitre 3 et ci-dessous<\/td><\/tr><tr><td>TD2 ex. 2.1<\/td><td>opérateur + ami ou membre, conversions<\/td><td>ci-dessous<\/td><\/tr><tr><td>TD3 ex. 1<\/td><td>héritage : pointcol<\/td><td>ci-dessous<\/td><\/tr><tr><td>TD4 ex. 4.1<\/td><td>héritage multiple virtuel, polymorphisme<\/td><td>ci-dessous<\/td><\/tr><tr><td>TP1<\/td><td>classe vecteur3d complète<\/td><td>ci-dessous<\/td><\/tr><\/table><\/figure><h2>TD1 · Exercices 1.7 et 1.8 : la classe point<\/h2>\n<p>On réunit les deux exercices : coordonnées float privées, accesseurs, distance à l&#39;origine, et un compteur d&#39;objets.<\/p>\n<pre class=\"\"><code>#include &lt;iostream&gt;\n#include &lt;cmath&gt;\nusing namespace std;\n// --- point.h (déclaration) ---\nclass point {\n    float x, y;\n    static int nb;                    // ex. 1.8 : nombre d'objets existants\npublic:\n    point(float, float);\n    ~point();\n    void deplace(float, float);\n    void affiche();\n    float distance();\n    float abscisse() { return x; }\n    float ordonnee() { return y; }\n};\n// --- point.cpp (définition) ---\nint point::nb = 0;\npoint::point(float a, float b) { x = a; y = b; nb++; }\npoint::~point() { nb--; }\nvoid point::deplace(float dx, float dy) { x += dx; y += dy; }\nvoid point::affiche() { cout &lt;&lt; &quot;point (&quot; &lt;&lt; x &lt;&lt; &quot;, &quot; &lt;&lt; y &lt;&lt; &quot;) ; il y a &quot; &lt;&lt; nb &lt;&lt; &quot; point(s)\\n&quot;; }\nfloat point::distance() { return sqrt(x * x + y * y); }\n// --- programme d'essai ---\nint main() {\n    point a(3, 4);\n    a.affiche();\n    cout &lt;&lt; &quot;distance a l'origine : &quot; &lt;&lt; a.distance() &lt;&lt; &quot;\\n&quot;;\n    a.deplace(1, -1);\n    point b(0, 0);\n    a.affiche();\n    cout &lt;&lt; &quot;abscisse : &quot; &lt;&lt; a.abscisse() &lt;&lt; &quot;, ordonnee : &quot; &lt;&lt; a.ordonnee() &lt;&lt; &quot;\\n&quot;;\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>point (3, 4) ; il y a 1 point(s)\ndistance a l'origine : 5\npoint (4, 3) ; il y a 2 point(s)\nabscisse : 4, ordonnee : 3<\/code><\/pre><h2>TD2 · Exercice 2.1 : opérateur + et conversions<\/h2>\n<p>Énoncé : <code>point(int abs=0, int ord=0)<\/code> affiche « construction point », <code>friend point operator+(point, point)<\/code>. Que donnent <code>a = b + 6;<\/code> puis <code>a = 6 + b;<\/code> ?<\/p>\n<pre class=\"\"><code>#include &lt;iostream&gt;\nusing namespace std;\nclass point {\n    int x, y;\npublic:\n    point(int abs = 0, int ord = 0) { x = abs; y = ord; cout &lt;&lt; &quot;construction point : &quot; &lt;&lt; x &lt;&lt; &quot; &quot; &lt;&lt; y &lt;&lt; &quot;\\n&quot;; }\n    friend point operator+(point, point);\n    void affiche() { cout &lt;&lt; &quot;Coordonnees : &quot; &lt;&lt; x &lt;&lt; &quot; &quot; &lt;&lt; y &lt;&lt; &quot;\\n&quot;; }\n};\npoint operator+(point a, point b) { point r; r.x = a.x + b.x; r.y = a.y + b.y; return r; }\nint main() {\n    point a, b(2, 4);\n    a = b + 6;    // affectation 1\n    a.affiche();\n    a = 6 + b;    // affectation 2\n    b.affiche();\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>construction point : 0 0\nconstruction point : 2 4\nconstruction point : 6 0\nconstruction point : 0 0\nCoordonnees : 8 4\nconstruction point : 6 0\nconstruction point : 0 0\nCoordonnees : 2 4<\/code><\/pre><figure class=\"etapes\" data-i=\"0\"><figcaption>Lire cette trace<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · a et b<\/div><p>« 0 0 » puis « 2 4 ».<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · b + 6<\/div><p>6 est converti en point(6, 0) (« 6 0 »), puis operator+ crée r (« 0 0 »). a vaut (8, 4).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · 6 + b<\/div><p>même chose dans l&#39;autre sens : « 6 0 » puis « 0 0 ».<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Dernière ligne<\/div><p>on affiche <strong>b<\/strong>, resté (2, 4).<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><figure class=\"grille\"><figcaption>Les quatre variantes de l'énoncé<\/figcaption><table><tr><th>Déclaration de +<\/th><th>b + 6<\/th><th>6 + b<\/th><\/tr><tr><td>friend point operator+(point, point)<\/td><td>oui<\/td><td>oui<\/td><\/tr><tr><td>membre point operator+(point)<\/td><td>oui<\/td><td class=\"h1\">non<\/td><\/tr><tr><td>friend point operator+(point &amp;, point &amp;)<\/td><td class=\"h1\">non<\/td><td class=\"h1\">non<\/td><\/tr><tr><td>friend point operator+(const point &amp;, const point &amp;)<\/td><td>oui<\/td><td>oui<\/td><\/tr><\/table><\/figure><p>Avec un membre, <code>6 + b<\/code> voudrait dire <code>6.operator+(b)<\/code> : impossible. Avec <code>point &amp;<\/code>, le point temporaire issu de 6 ne peut pas se lier à une référence non constante. Avec <code>const point &amp;<\/code>, si.<\/p>\n<h2>TD3 · Exercice 1 : la classe pointcol<\/h2>\n<pre class=\"\"><code>#include &lt;iostream&gt;\nusing namespace std;\nclass point {\n    float x, y;\npublic:\n    point(float abs = 0.0, float ord = 0.0) { x = abs; y = ord; }\n    void affiche() { cout &lt;&lt; &quot;Coordonnees : &quot; &lt;&lt; x &lt;&lt; &quot; &quot; &lt;&lt; y &lt;&lt; &quot;\\n&quot;; }\n    void deplace(float dx, float dy) { x = x + dx; y = y + dy; }\n};\nclass pointcol : public point {\n    int cl;\npublic:\n    pointcol(float = 0.0, float = 0.0, int = 0);      // non en ligne\n    void affiche();                                    // redéfinie\n    void colore(int couleur) { cl = couleur; }\n};\npointcol::pointcol(float abs, float ord, int couleur) : point(abs, ord) { cl = couleur; }\nvoid pointcol::affiche() { point::affiche(); cout &lt;&lt; &quot;  couleur : &quot; &lt;&lt; cl &lt;&lt; &quot;\\n&quot;; }\nint main() {\n    pointcol p(2.5, 3.25, 5);\n    p.affiche();\n    p.deplace(1, 1);\n    p.colore(9);\n    p.affiche();\n    pointcol q;          // valeurs par défaut : 0 0, couleur 0\n    q.affiche();\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Coordonnees : 2.5 3.25\n  couleur : 5\nCoordonnees : 3.5 4.25\n  couleur : 9\nCoordonnees : 0 0\n  couleur : 0<\/code><\/pre><aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>La correction du TD3 trace aussi les appels (« constructeur de point »…) pour montrer que le constructeur de la base passe <strong>avant<\/strong> celui de la dérivée. Ajoute des cout dans les constructeurs pour le vérifier toi-même.<\/p>\n<\/aside><h2>TD4 · Exercice 4.1 : Personne, Etudiant, Employe, EmployeEtudiant<\/h2>\n<pre class=\"\"><code>#include &lt;iostream&gt;\n#include &lt;string&gt;\nusing namespace std;\nclass Personne {\nprotected:\n    string nom, prenom;\npublic:\n    Personne(string n = &quot;&quot;, string p = &quot;&quot;) : nom(n), prenom(p) {}\n    virtual ~Personne() {}\n    virtual void afficher() const { cout &lt;&lt; &quot;Personne : &quot; &lt;&lt; nom &lt;&lt; &quot; &quot; &lt;&lt; prenom &lt;&lt; &quot;\\n&quot;; }\n};\nclass Etudiant : virtual public Personne {\nprotected:\n    int numeroApogee;\npublic:\n    Etudiant(string n = &quot;&quot;, string p = &quot;&quot;, int a = 0) : Personne(n, p), numeroApogee(a) {}\n    void afficher() const { cout &lt;&lt; &quot;Etudiant : &quot; &lt;&lt; nom &lt;&lt; &quot; &quot; &lt;&lt; prenom &lt;&lt; &quot;, Apogee &quot; &lt;&lt; numeroApogee &lt;&lt; &quot;\\n&quot;; }\n};\nclass Employe : virtual public Personne {\nprotected:\n    int numeroSomme;\npublic:\n    Employe(string n = &quot;&quot;, string p = &quot;&quot;, int s = 0) : Personne(n, p), numeroSomme(s) {}\n    void afficher() const { cout &lt;&lt; &quot;Employe : &quot; &lt;&lt; nom &lt;&lt; &quot; &quot; &lt;&lt; prenom &lt;&lt; &quot;, Somme &quot; &lt;&lt; numeroSomme &lt;&lt; &quot;\\n&quot;; }\n};\nclass EmployeEtudiant : public Employe, public Etudiant {\npublic:\n    EmployeEtudiant(string n, string p, int s, int a) : Personne(n, p), Employe(n, p, s), Etudiant(n, p, a) {}\n    void afficher() const {\n        cout &lt;&lt; &quot;Employe-etudiant : &quot; &lt;&lt; nom &lt;&lt; &quot; &quot; &lt;&lt; prenom\n             &lt;&lt; &quot;, Somme &quot; &lt;&lt; numeroSomme &lt;&lt; &quot;, Apogee &quot; &lt;&lt; numeroApogee &lt;&lt; &quot;\\n&quot;;\n    }\n};\nint main() {\n    Personne *tab[4] = {\n        new Personne(&quot;Alaoui&quot;, &quot;Sara&quot;),\n        new Etudiant(&quot;Bennani&quot;, &quot;Omar&quot;, 21004567),\n        new Employe(&quot;Idrissi&quot;, &quot;Nadia&quot;, 1234),\n        new EmployeEtudiant(&quot;Tazi&quot;, &quot;Youssef&quot;, 5678, 22001122)\n    };\n    for (int i = 0; i &lt; 4; i++) tab[i]-&gt;afficher();    // polymorphisme\n    for (int i = 0; i &lt; 4; i++) delete tab[i];          // destructeur virtuel\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Personne : Alaoui Sara\nEtudiant : Bennani Omar, Apogee 21004567\nEmploye : Idrissi Nadia, Somme 1234\nEmploye-etudiant : Tazi Youssef, Somme 5678, Apogee 22001122<\/code><\/pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Trois points font gagner les points de cet exercice : <code>virtual public Personne<\/code> dans <strong>Etudiant et Employe<\/strong> ; <code>Personne(n, p)<\/code> appelé <strong>par EmployeEtudiant<\/strong> ; destructeur <strong>virtuel<\/strong> dans Personne, puisqu&#39;on détruit via des <code>Personne*<\/code>.<\/p>\n<\/aside><h2>TP1 · La classe vecteur3d<\/h2>\n<p>Énoncé : constructeurs (surdéfinis puis un seul), affichage <code>&lt; x, y, z &gt;<\/code>, <code>coincide<\/code> amie (par adresse puis par référence), <code>normax<\/code> (par valeur, référence, adresse), <code>==<\/code> et <code>!=<\/code>, <code>+<\/code> et <code>*<\/code> (produit scalaire) en membres, puis un main avec un vecteur automatique et un dynamique.<\/p>\n<pre class=\"\"><code>#include &lt;iostream&gt;\n#include &lt;cmath&gt;\nusing namespace std;\nclass vecteur3d {\n    float x, y, z;\npublic:\n    // I.b : un seul constructeur grâce aux valeurs par défaut\n    // (I.a serait : vecteur3d() { x = y = z = 0; } et vecteur3d(float, float, float);)\n    vecteur3d(float c1 = 0, float c2 = 0, float c3 = 0) { x = c1; y = c2; z = c3; }\n    void affiche() const { cout &lt;&lt; &quot;&lt; &quot; &lt;&lt; x &lt;&lt; &quot;, &quot; &lt;&lt; y &lt;&lt; &quot;, &quot; &lt;&lt; z &lt;&lt; &quot; &gt;\\n&quot;; }     // II\n    friend bool coincide(const vecteur3d *, const vecteur3d *);                          // III.a\n    friend bool coincide(const vecteur3d &amp;, const vecteur3d &amp;);                          // III.b\n    float norme() const { return sqrt(x * x + y * y + z * z); }\n    vecteur3d normax(vecteur3d v) const { return norme() &gt; v.norme() ? *this : v; }     // IV.a\n    vecteur3d &amp;normax(vecteur3d &amp;v) { return norme() &gt; v.norme() ? *this : v; }         // IV.b\n    vecteur3d *normax(vecteur3d *v) { return norme() &gt; v-&gt;norme() ? this : v; }         // IV.c\n    bool operator==(const vecteur3d &amp;v) const { return x == v.x &amp;&amp; y == v.y &amp;&amp; z == v.z; } // V.a\n    bool operator!=(const vecteur3d &amp;v) const { return !(*this == v); }\n    vecteur3d operator+(const vecteur3d &amp;v) const { return vecteur3d(x + v.x, y + v.y, z + v.z); } // VI\n    float operator*(const vecteur3d &amp;v) const { return x * v.x + y * v.y + z * v.z; }\n};\nbool coincide(const vecteur3d *a, const vecteur3d *b) { return a-&gt;x == b-&gt;x &amp;&amp; a-&gt;y == b-&gt;y &amp;&amp; a-&gt;z == b-&gt;z; }\nbool coincide(const vecteur3d &amp;a, const vecteur3d &amp;b) { return a.x == b.x &amp;&amp; a.y == b.y &amp;&amp; a.z == b.z; }\nint main() {                                     // VII\n    vecteur3d a(1, 2, 3);                        // automatique\n    vecteur3d *b = new vecteur3d(4, 0, 0);       // dynamique\n    a.affiche(); b-&gt;affiche();\n    cout &lt;&lt; &quot;coincide (adresse)   : &quot; &lt;&lt; coincide(&amp;a, b) &lt;&lt; &quot;\\n&quot;;\n    cout &lt;&lt; &quot;coincide (reference) : &quot; &lt;&lt; coincide(a, a) &lt;&lt; &quot;\\n&quot;;\n    cout &lt;&lt; &quot;normax par reference : &quot;; a.normax(*b).affiche();\n    cout &lt;&lt; &quot;normax par adresse   : &quot;; a.normax(b)-&gt;affiche();\n    cout &lt;&lt; &quot;a + b : &quot;; (a + *b).affiche();\n    cout &lt;&lt; &quot;a * b = &quot; &lt;&lt; a * *b &lt;&lt; &quot;\\n&quot;;\n    cout &lt;&lt; &quot;a == b : &quot; &lt;&lt; (a == *b) &lt;&lt; &quot;, a != b : &quot; &lt;&lt; (a != *b) &lt;&lt; &quot;\\n&quot;;\n    delete b;\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>&lt; 1, 2, 3 &gt;\n&lt; 4, 0, 0 &gt;\ncoincide (adresse)   : 0\ncoincide (reference) : 1\nnormax par reference : &lt; 4, 0, 0 &gt;\nnormax par adresse   : &lt; 4, 0, 0 &gt;\na + b : &lt; 5, 2, 3 &gt;\na * b = 4\na == b : 0, a != b : 1<\/code><\/pre><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Pour normax par valeur et par référence, les deux versions ont presque la même signature : l&#39;appel <code>a.normax(*b)<\/code> choisit la version par <strong>référence<\/strong> (correspondance exacte avec un objet modifiable). Si tu gardes les trois dans la même classe, donne des noms différents à l&#39;examen pour éviter tout doute (<code>normaxV<\/code>, <code>normaxR<\/code>, <code>normaxA<\/code>).<\/p>\n<\/aside><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>L&#39;énoncé du TP dit « tester la coïncidence de deux <strong>points<\/strong> » à la question V : il s&#39;agit bien de deux <strong>vecteurs<\/strong>.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Vérifie que tu as compris les corrigés<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Dans le TD2, combien de lignes « construction point » affiche <code>a = b + 6;<\/code> seule ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 2<\/b><\/p><p>Une pour la conversion de 6 en point(6, 0), une pour l&#39;objet r créé dans operator+. Le retour par valeur est ici optimisé (pas de recopie affichée, et il n&#39;y a d&#39;ailleurs pas de constructeur de recopie qui affiche).<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Dans le TD4, que se passe-t-il si on enlève <code>virtual<\/code> devant <code>afficher()<\/code> dans Personne ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Les quatre appels <code>tab[i]-&gt;afficher()<\/code> exécutent Personne::afficher : quatre lignes « Personne : nom prénom », sans numéros.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Dans le TD4, que se passe-t-il si on enlève <code>Personne(n, p)<\/code> de la liste d&#39;initialisation d&#39;EmployeEtudiant ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>La base virtuelle Personne est construite avec son constructeur par défaut : nom et prénom vides pour l&#39;employé-étudiant, même si Employe et Etudiant transmettent n et p.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Dans le TD1 (ex. 1.8), pourquoi décrémenter le compteur dans le destructeur ?<\/div><button class=\"opt\" data-o=\"0\">Pour compter les objets existants, et pas seulement ceux créés<\/button><button class=\"opt\" data-o=\"1\">Parce que static l&#39;impose<\/button><button class=\"opt\" data-o=\"2\">Pour libérer la mémoire du compteur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">TD2 : avec <code>friend point operator+(point, point)<\/code>, <code>a = 6 + b;<\/code> :<\/div><button class=\"opt\" data-o=\"0\">Compile : 6 est converti en point(6, 0)<\/button><button class=\"opt\" data-o=\"1\">Est refusé<\/button><button class=\"opt\" data-o=\"2\">Additionne 6 à x et à y<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">TD2 : avec <code>+<\/code> en fonction membre, quelle affectation est refusée ?<\/div><button class=\"opt\" data-o=\"0\"><code>a = b + 6;<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>a = 6 + b;<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>a = a + b;<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">TD2 : avec <code>friend point operator+(point &amp;, point &amp;)<\/code>, <code>a = b + 6;<\/code> :<\/div><button class=\"opt\" data-o=\"0\">Compile<\/button><button class=\"opt\" data-o=\"1\">Est refusé à la compilation<\/button><button class=\"opt\" data-o=\"2\">Plante à l&#39;exécution<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">TD3 : comment le constructeur de pointcol transmet-il les coordonnées ?<\/div><button class=\"opt\" data-o=\"0\"><code>pointcol::pointcol(float a, float o, int c) : point(a, o) { cl = c; }<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>pointcol::pointcol(float a, float o, int c) { point(a, o); cl = c; }<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>pointcol::pointcol(float a, float o, int c) : x(a), y(o) { cl = c; }<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">TD4 : où place-t-on le mot virtual pour n&#39;avoir qu&#39;une Personne dans EmployeEtudiant ?<\/div><button class=\"opt\" data-o=\"0\">Devant la classe EmployeEtudiant<\/button><button class=\"opt\" data-o=\"1\">Dans la dérivation d&#39;Etudiant et d&#39;Employe<\/button><button class=\"opt\" data-o=\"2\">Devant le constructeur de Personne<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">TD4 : pourquoi Personne a-t-elle un destructeur virtuel ?<\/div><button class=\"opt\" data-o=\"0\">Pour pouvoir l&#39;appeler explicitement<\/button><button class=\"opt\" data-o=\"1\">Parce qu&#39;on détruit des objets dérivés via des Personne*<\/button><button class=\"opt\" data-o=\"2\">Parce que la classe est abstraite<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">TP1 : quel prototype permet l&#39;affichage <code>&lt; 1, 2, 3 &gt;<\/code> sans modifier l&#39;objet ?<\/div><button class=\"opt\" data-o=\"0\"><code>void affiche() const;<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>void affiche(vecteur3d);<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>vecteur3d affiche();<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">TP1 : normax « par adresse » a pour prototype :<\/div><button class=\"opt\" data-o=\"0\"><code>vecteur3d normax(vecteur3d);<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>vecteur3d &amp; normax(vecteur3d &amp;);<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>vecteur3d * normax(vecteur3d *);<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">TP1 : le produit scalaire de (1,2,3) et (4,0,0) vaut :<\/div><button class=\"opt\" data-o=\"0\">0<\/button><button class=\"opt\" data-o=\"1\">4<\/button><button class=\"opt\" data-o=\"2\">7<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 6 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p>","ex":[{"n":"td-tp-corriges","rep":["2"],"tol":null},{"n":"td-tp-corriges","rep":null,"tol":null},{"n":"td-tp-corriges","rep":null,"tol":null}],"qcm":[{"n":"td-tp-corriges","q":"Dans le TD1 (ex. 1.8), pourquoi décrémenter le compteur dans le destructeur ?","o":["Pour compter les objets existants, et pas seulement ceux créés","Parce que static l&#39;impose","Pour libérer la mémoire du compteur"],"a":0,"e":"Sans nb-- dans le destructeur, le compteur ne ferait qu&#39;augmenter."},{"n":"td-tp-corriges","q":"TD2 : avec <code>friend point operator+(point, point)<\/code>, <code>a = 6 + b;<\/code> :","o":["Compile : 6 est converti en point(6, 0)","Est refusé","Additionne 6 à x et à y"],"a":0,"e":"L&#39;amie accepte une conversion sur ses deux arguments."},{"n":"td-tp-corriges","q":"TD2 : avec <code>+<\/code> en fonction membre, quelle affectation est refusée ?","o":["<code>a = b + 6;<\/code>","<code>a = 6 + b;<\/code>","<code>a = a + b;<\/code>"],"a":1,"e":"Le premier opérande d&#39;une méthode doit être un objet."},{"n":"td-tp-corriges","q":"TD2 : avec <code>friend point operator+(point &amp;, point &amp;)<\/code>, <code>a = b + 6;<\/code> :","o":["Compile","Est refusé à la compilation","Plante à l&#39;exécution"],"a":1,"e":"Un temporaire ne se lie pas à une référence non constante."},{"n":"td-tp-corriges","q":"TD3 : comment le constructeur de pointcol transmet-il les coordonnées ?","o":["<code>pointcol::pointcol(float a, float o, int c) : point(a, o) { cl = c; }<\/code>","<code>pointcol::pointcol(float a, float o, int c) { point(a, o); cl = c; }<\/code>","<code>pointcol::pointcol(float a, float o, int c) : x(a), y(o) { cl = c; }<\/code>"],"a":0,"e":"La base se construit dans la liste d&#39;initialisation ; x et y sont privés de point."},{"n":"td-tp-corriges","q":"TD4 : où place-t-on le mot virtual pour n&#39;avoir qu&#39;une Personne dans EmployeEtudiant ?","o":["Devant la classe EmployeEtudiant","Dans la dérivation d&#39;Etudiant et d&#39;Employe","Devant le constructeur de Personne"],"a":1,"e":"<code>class Etudiant : virtual public Personne<\/code>, idem pour Employe."},{"n":"td-tp-corriges","q":"TD4 : pourquoi Personne a-t-elle un destructeur virtuel ?","o":["Pour pouvoir l&#39;appeler explicitement","Parce qu&#39;on détruit des objets dérivés via des Personne*","Parce que la classe est abstraite"],"a":1,"e":"Sinon delete tab[i] n&#39;appellerait que ~Personne."},{"n":"td-tp-corriges","q":"TP1 : quel prototype permet l&#39;affichage <code>&lt; 1, 2, 3 &gt;<\/code> sans modifier l&#39;objet ?","o":["<code>void affiche() const;<\/code>","<code>void affiche(vecteur3d);<\/code>","<code>vecteur3d affiche();<\/code>"],"a":0,"e":"Une méthode const, utilisable même sur un vecteur constant."},{"n":"td-tp-corriges","q":"TP1 : normax « par adresse » a pour prototype :","o":["<code>vecteur3d normax(vecteur3d);<\/code>","<code>vecteur3d &amp; normax(vecteur3d &amp;);<\/code>","<code>vecteur3d * normax(vecteur3d *);<\/code>"],"a":2,"e":"L&#39;argument et le résultat sont des pointeurs ; on renvoie this ou v."},{"n":"td-tp-corriges","q":"TP1 : le produit scalaire de (1,2,3) et (4,0,0) vaut :","o":["0","4","7"],"a":1,"e":"1×4 + 2×0 + 3×0 = 4."}]},{"id":"revision-examen","t":"Révision et examen blanc","seance":"Préparation de l'examen","imp":5,"html":"<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Cet examen blanc a été <strong>construit à partir des TD et du cours<\/strong> (même style : « quels résultats fournira ce programme ? », « écrire la classe… »). Les vrais sujets (2020-2021 à 2022-2023) sont corrigés dans les chapitres d&#39;annales à la fin du module : ce sont des <strong>problèmes guidés<\/strong> (une classe enrichie question par question, puis héritage et composition).<\/p>\n<\/aside><h2>La carte du module<\/h2>\n<figure class=\"flux\"><figcaption>Ce qui s'enchaîne<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">C → C++ (références, surdéfinition, new/delete)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">classes (constructeur, static, this)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">recopie et opérateurs (=, [], +)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">héritage (protected, constructeurs)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">virtual et classes abstraites<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">patrons et exceptions<\/div><\/div><\/figure><figure class=\"grille\"><figcaption>Les 8 réflexes de l'examen<\/figcaption><table><tr><th>Si tu vois…<\/th><th>…pense à<\/th><\/tr><tr><td>un pointeur membre + new<\/td><td>destructeur, constructeur de recopie, operator=<\/td><\/tr><tr><td>un objet passé par valeur<\/td><td>appel du constructeur de recopie + destruction de la copie<\/td><\/tr><tr><td>`6 + p`<\/td><td>operator+ ami (pas membre)<\/td><\/tr><tr><td>`a[i] = ...`<\/td><td>operator[] qui renvoie une référence<\/td><\/tr><tr><td>un pointeur de base vers un objet dérivé<\/td><td>virtual ? sinon méthode de la base<\/td><\/tr><tr><td>un losange d'héritage<\/td><td>dérivation virtuelle + constructeur appelé par la plus dérivée<\/td><\/tr><tr><td>delete via pointeur de base<\/td><td>destructeur virtuel<\/td><\/tr><tr><td>`throw`<\/td><td>catch du bon type, puis suite après le dernier catch<\/td><\/tr><\/table><\/figure><figure class=\"etapes\" data-i=\"0\"><figcaption>Méthode pour « quels résultats fournira ce programme ? »<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · 1. Repère chaque création d&#39;objet<\/div><p>déclarations, temporaires (conversions, <code>point(12)<\/code>), passages par valeur, new.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · 2. Écris la trace des constructeurs<\/div><p>base avant dérivée, membres avant englobant, bases dans l&#39;ordre de déclaration.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · 3. Suis les appels<\/div><p>pour chaque appel via pointeur/référence, regarde si la méthode est virtuelle.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · 4. Ferme les blocs<\/div><p>à chaque <code>}<\/code>, détruis les objets automatiques dans l&#39;ordre inverse de création.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · 5. Vérifie les cas pièges<\/div><p>char affiché comme caractère, postfixé qui renvoie l&#39;ancienne valeur, auto-affectation.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>Les TD du Pr Farchane posent systématiquement des questions de <strong>trace<\/strong> (TD2 : « quels résultats fournira le programme »), des <strong>variantes<\/strong> d&#39;une même déclaration (ami/membre, <code>point&amp;<\/code>/<code>const point&amp;<\/code>) et l&#39;écriture d&#39;une <strong>hiérarchie complète<\/strong> (TD3, TD4). Entraîne-toi sur ces trois formats.<\/p>\n<\/aside><h2>Examen blanc · 1 h 30<\/h2>\n<h3>Exercice 1 · Questions de cours (4 points)<\/h3>\n<section class=\"exo\"><h3>Exercice 1<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><ol>\n<li>Différence entre surdéfinition et redéfinition ? 2) Trois situations où le constructeur de recopie est appelé ? 3) Qu&#39;est-ce qu&#39;une classe abstraite ? 4) Pourquoi un destructeur virtuel ?<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><ol>\n<li>Surdéfinition : même nom, signatures différentes (même portée). Redéfinition : même signature dans une classe dérivée, pour remplacer la méthode de la base.<\/li>\n<li>Initialisation d&#39;un objet par un autre (<code>point b = a;<\/code>), passage par valeur, retour par valeur.<\/li>\n<li>Une classe qui contient au moins une fonction virtuelle pure (<code>= 0<\/code>) ; on ne peut pas l&#39;instancier.<\/li>\n<li>Pour que <code>delete p<\/code> (p pointeur sur la base, objet dérivé) appelle aussi le destructeur de la dérivée.<\/li>\n<\/ol>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h3>Exercice 2 · Trace d&#39;exécution (5 points)<\/h3>\n<p>Quels résultats fournit ce programme ?<\/p>\n<pre class=\"\"><code>#include &lt;iostream&gt;\nusing namespace std;\nclass A {\npublic:\n    A()  { cout &lt;&lt; &quot;+A &quot;; }\n    virtual void f() { cout &lt;&lt; &quot;A::f &quot;; }\n    void g() { cout &lt;&lt; &quot;A::g &quot;; }\n    virtual ~A() { cout &lt;&lt; &quot;-A &quot;; }\n};\nclass B : public A {\npublic:\n    B()  { cout &lt;&lt; &quot;+B &quot;; }\n    void f() { cout &lt;&lt; &quot;B::f &quot;; }\n    void g() { cout &lt;&lt; &quot;B::g &quot;; }\n    ~B() { cout &lt;&lt; &quot;-B &quot;; }\n};\nvoid h(A a) { a.f(); }\nint main() {\n    A *p = new B;\n    cout &lt;&lt; &quot;\\n&quot;;\n    p-&gt;f(); p-&gt;g();\n    cout &lt;&lt; &quot;\\n&quot;;\n    h(*p);\n    cout &lt;&lt; &quot;\\n&quot;;\n    delete p;\n    cout &lt;&lt; &quot;\\n&quot;;\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>+A +B \nB::f A::g \nA::f -A \n-B -A <\/code><\/pre><section class=\"exo\"><h3>Corrigé de l&#39;exercice 2<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Explique chaque ligne de la trace ci-dessus.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Ligne 1 : <code>new B<\/code> construit A puis B : « +A +B ».\nLigne 2 : f est virtuelle, l&#39;objet réel est un B : « B::f ». g ne l&#39;est pas, le pointeur est un A* : « A::g ».\nLigne 3 : h reçoit <strong>par valeur<\/strong> un A : la copie ne garde que la partie A (le constructeur de recopie par défaut n&#39;affiche rien), donc « A::f » ; la copie est détruite en sortie : « -A ».\nLigne 4 : destructeur virtuel : « -B -A ».<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h3>Exercice 3 · Une classe avec un tableau dynamique (6 points)<\/h3>\n<section class=\"exo\"><h3>Exercice 3<\/h3><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Écris une classe <code>pile<\/code> d&#39;entiers : constructeur <code>pile(int n = 20)<\/code> qui alloue un tableau de n entiers, destructeur, constructeur de recopie, <code>operator=<\/code>, <code>void empiler(int)<\/code>, <code>int depiler()<\/code>, <code>bool vide() const<\/code>. Empiler sur une pile pleine ou dépiler une pile vide lance une exception <code>out_of_range<\/code>.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Membres : int *t ; int taille ; int sommet. Recopie profonde dans le constructeur de recopie et dans operator=.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Voir le programme corrigé ci-dessous : il teste la recopie, l&#39;affectation et l&#39;exception.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><pre class=\"\"><code>#include &lt;iostream&gt;\n#include &lt;stdexcept&gt;\nusing namespace std;\nclass pile {\n    int *t; int taille; int sommet;\npublic:\n    pile(int n = 20) : taille(n), sommet(0) { t = new int[taille]; }\n    ~pile() { delete[] t; }\n    pile(const pile &amp;p) : taille(p.taille), sommet(p.sommet) {\n        t = new int[taille];\n        for (int i = 0; i &lt; sommet; i++) t[i] = p.t[i];\n    }\n    pile &amp;operator=(const pile &amp;p) {\n        if (this != &amp;p) {\n            delete[] t;\n            taille = p.taille; sommet = p.sommet;\n            t = new int[taille];\n            for (int i = 0; i &lt; sommet; i++) t[i] = p.t[i];\n        }\n        return *this;\n    }\n    void empiler(int x) { if (sommet == taille) throw out_of_range(&quot;pile pleine&quot;); t[sommet++] = x; }\n    int depiler() { if (vide()) throw out_of_range(&quot;pile vide&quot;); return t[--sommet]; }\n    bool vide() const { return sommet == 0; }\n};\nint main() {\n    pile a(3);\n    a.empiler(1); a.empiler(2);\n    pile b = a;            // recopie\n    b.empiler(30);\n    pile c; c = b;         // affectation\n    while (!c.vide()) cout &lt;&lt; c.depiler() &lt;&lt; &quot; &quot;;\n    cout &lt;&lt; &quot;| a : &quot; &lt;&lt; a.depiler() &lt;&lt; &quot;\\n&quot;;\n    try { b.empiler(4); }\n    catch (out_of_range &amp;e) { cout &lt;&lt; &quot;erreur : &quot; &lt;&lt; e.what() &lt;&lt; &quot;\\n&quot;; }\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>30 2 1 | a : 2\nerreur : pile pleine<\/code><\/pre><h3>Exercice 4 · Hiérarchie et polymorphisme (5 points)<\/h3>\n<section class=\"exo\"><h3>Exercice 4<\/h3><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Écris une classe abstraite <code>Employe<\/code> (nom, <code>virtual double salaire() const = 0<\/code>, <code>afficher()<\/code> qui affiche le nom et le salaire) et deux dérivées : <code>Permanent<\/code> (salaire fixe) et <code>Vacataire<\/code> (nombre d&#39;heures × taux horaire). Dans main, range un Permanent (« Amal », 8000 DH) et un Vacataire (« Karim », 40 h à 150 DH) dans un tableau <code>Employe*<\/code> et affiche-les.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>afficher() peut rester non virtuelle : elle appelle salaire(), qui l&#39;est.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Voir le programme corrigé ci-dessous.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><pre class=\"\"><code>#include &lt;iostream&gt;\n#include &lt;string&gt;\nusing namespace std;\nclass Employe {\nprotected:\n    string nom;\npublic:\n    Employe(string n) : nom(n) {}\n    virtual ~Employe() {}\n    virtual double salaire() const = 0;            // virtuelle pure : classe abstraite\n    void afficher() const { cout &lt;&lt; nom &lt;&lt; &quot; : &quot; &lt;&lt; salaire() &lt;&lt; &quot; DH\\n&quot;; }\n};\nclass Permanent : public Employe {\n    double fixe;\npublic:\n    Permanent(string n, double f) : Employe(n), fixe(f) {}\n    double salaire() const { return fixe; }\n};\nclass Vacataire : public Employe {\n    int heures; double taux;\npublic:\n    Vacataire(string n, int h, double t) : Employe(n), heures(h), taux(t) {}\n    double salaire() const { return heures * taux; }\n};\nint main() {\n    Employe *tab[2] = { new Permanent(&quot;Amal&quot;, 8000), new Vacataire(&quot;Karim&quot;, 40, 150) };\n    for (int i = 0; i &lt; 2; i++) tab[i]-&gt;afficher();\n    for (int i = 0; i &lt; 2; i++) delete tab[i];\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Amal : 8000 DH\nKarim : 6000 DH<\/code><\/pre><h2>Flashcards de révision<\/h2>\n<p class=\"cartes-info\">🃏 6 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM de révision<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Dans <code>A *p = new B;<\/code> (B dérive de A), <code>p-&gt;g()<\/code> avec g non virtuelle appelle :<\/div><button class=\"opt\" data-o=\"0\">A::g<\/button><button class=\"opt\" data-o=\"1\">B::g<\/button><button class=\"opt\" data-o=\"2\">Une erreur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Un objet B passé par valeur à <code>void h(A a)<\/code> :<\/div><button class=\"opt\" data-o=\"0\">Reste un B dans h<\/button><button class=\"opt\" data-o=\"1\">Est copié en un A (seule la partie A est conservée)<\/button><button class=\"opt\" data-o=\"2\">Provoque une erreur de compilation<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Pour une classe contenant <code>int *t<\/code> alloué par new[], laquelle n&#39;est PAS indispensable ?<\/div><button class=\"opt\" data-o=\"0\">Le destructeur<\/button><button class=\"opt\" data-o=\"1\">Le constructeur de recopie<\/button><button class=\"opt\" data-o=\"2\">Une fonction amie<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Quel mot-clé interdit les conversions implicites par un constructeur ?<\/div><button class=\"opt\" data-o=\"0\">const<\/button><button class=\"opt\" data-o=\"1\">explicit<\/button><button class=\"opt\" data-o=\"2\">static<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Quelle déclaration rend une classe abstraite ?<\/div><button class=\"opt\" data-o=\"0\"><code>virtual void f();<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>virtual void f() = 0;<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>static void f();<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Ordre de destruction de <code>pointcoul p<\/code> (bases point puis coul) :<\/div><button class=\"opt\" data-o=\"0\">pointcoul, coul, point<\/button><button class=\"opt\" data-o=\"1\">point, coul, pointcoul<\/button><button class=\"opt\" data-o=\"2\">coul, point, pointcoul<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Quelle surdéfinition permet <code>cout &lt;&lt; v[i]<\/code> sur un <code>const vecteur3d v<\/code> ?<\/div><button class=\"opt\" data-o=\"0\"><code>float &amp; operator[](int);<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>float operator[](int) const;<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>float operator[](int);<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Quelle instruction appelle l&#39;opérateur = ?<\/div><button class=\"opt\" data-o=\"0\"><code>point b = a;<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>b = a;<\/code> avec b déjà déclaré<\/button><button class=\"opt\" data-o=\"2\"><code>point b(a);<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\"><code>template &lt;class T&gt; class pile<\/code> : comment déclarer une pile d&#39;entiers ?<\/div><button class=\"opt\" data-o=\"0\"><code>pile&lt;int&gt; p;<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>pile p&lt;int&gt;;<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>template pile&lt;int&gt; p;<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Exception lancée, aucun catch du bon type :<\/div><button class=\"opt\" data-o=\"0\">Le programme continue après le try<\/button><button class=\"opt\" data-o=\"1\">La fonction terminate est appelée<\/button><button class=\"opt\" data-o=\"2\">L&#39;exception est ignorée<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"revision-examen","rep":null,"tol":null},{"n":"revision-examen","rep":null,"tol":null},{"n":"revision-examen","rep":null,"tol":null},{"n":"revision-examen","rep":null,"tol":null}],"qcm":[{"n":"revision-examen","q":"Dans <code>A *p = new B;<\/code> (B dérive de A), <code>p-&gt;g()<\/code> avec g non virtuelle appelle :","o":["A::g","B::g","Une erreur"],"a":0,"e":"Liaison statique."},{"n":"revision-examen","q":"Un objet B passé par valeur à <code>void h(A a)<\/code> :","o":["Reste un B dans h","Est copié en un A (seule la partie A est conservée)","Provoque une erreur de compilation"],"a":1,"e":"C&#39;est le « tranchage » de l&#39;objet."},{"n":"revision-examen","q":"Pour une classe contenant <code>int *t<\/code> alloué par new[], laquelle n&#39;est PAS indispensable ?","o":["Le destructeur","Le constructeur de recopie","Une fonction amie"],"a":2,"e":"Destructeur, recopie et = gèrent la zone dynamique."},{"n":"revision-examen","q":"Quel mot-clé interdit les conversions implicites par un constructeur ?","o":["const","explicit","static"],"a":1,"e":"explicit point(int);"},{"n":"revision-examen","q":"Quelle déclaration rend une classe abstraite ?","o":["<code>virtual void f();<\/code>","<code>virtual void f() = 0;<\/code>","<code>static void f();<\/code>"],"a":1,"e":"Une fonction virtuelle pure."},{"n":"revision-examen","q":"Ordre de destruction de <code>pointcoul p<\/code> (bases point puis coul) :","o":["pointcoul, coul, point","point, coul, pointcoul","coul, point, pointcoul"],"a":0,"e":"Ordre inverse de la construction."},{"n":"revision-examen","q":"Quelle surdéfinition permet <code>cout &lt;&lt; v[i]<\/code> sur un <code>const vecteur3d v<\/code> ?","o":["<code>float &amp; operator[](int);<\/code>","<code>float operator[](int) const;<\/code>","<code>float operator[](int);<\/code>"],"a":1,"e":"Sur un objet constant, seule une méthode const est appelable."},{"n":"revision-examen","q":"Quelle instruction appelle l&#39;opérateur = ?","o":["<code>point b = a;<\/code>","<code>b = a;<\/code> avec b déjà déclaré","<code>point b(a);<\/code>"],"a":1,"e":"Les deux autres sont des initialisations (recopie)."},{"n":"revision-examen","q":"<code>template &lt;class T&gt; class pile<\/code> : comment déclarer une pile d&#39;entiers ?","o":["<code>pile&lt;int&gt; p;<\/code>","<code>pile p&lt;int&gt;;<\/code>","<code>template pile&lt;int&gt; p;<\/code>"],"a":0,"e":"Le type se précise entre chevrons après le nom."},{"n":"revision-examen","q":"Exception lancée, aucun catch du bon type :","o":["Le programme continue après le try","La fonction terminate est appelée","L&#39;exception est ignorée"],"a":1,"e":"Le programme s&#39;arrête."}]},{"id":"annales-2022-2023-2021-2022","t":"Annales corrigées · 2022-2023 et 2021-2022","seance":"Examens de fin de semestre (session normale)","imp":5,"payant":true,"html":"<aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>Ces deux examens sont des <strong>problèmes guidés<\/strong> (« Définir… », « Surdéfinir… ») : une seule grande classe qu&#39;on enrichit question par question. Chaque question vaut à peu près le même nombre de points : écris <strong>toutes<\/strong> les signatures, même si un corps te bloque.<\/p>\n<\/aside><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Ces sujets portent l&#39;en-tête « Master STRI S1 » : c&#39;est le recueil d&#39;annales qui circule à la FSABM pour ce module. Le niveau et le style correspondent au cours (classes, recopie, affectation, héritage, composition).<\/p>\n<\/aside><h2>Examen 2022-2023 · Client, Article, LigneCommande, Commande (1 h 30)<\/h2>\n<p><strong>Énoncé (résumé).<\/strong> Un client a un nom, un prénom (string) et un numéro (int). Q1–Q7 : classe <code>Client<\/code>, accesseurs <code>getNom/getPrenom/getNumero<\/code>, mutateurs <code>setNom/setPrenom/setNumero<\/code>, constructeur, constructeur de recopie, <code>Affiche()<\/code> utilisable sur des objets constants, <code>operator=<\/code>. Q8–Q12 : classe <code>Article<\/code> (titre string, prix double) avec accesseurs, mutateurs, constructeur, <code>Affiche()<\/code>. Q13–Q17 : classe <code>LingeCommande<\/code> (sic) avec <code>myArticle<\/code> (Article) et <code>quantite<\/code> (long), accesseurs, mutateurs, constructeur, <code>Affiche()<\/code>. Q18–Q22 : classe <code>Commande<\/code> composée de lignes de commande, d&#39;un client, d&#39;une référence et d&#39;une date (string) : constructeur avec valeurs par défaut, <code>AjouterLigneCommande(...)<\/code>, <code>EnleverLigneCommande(...)<\/code>, <code>print()<\/code>.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le sujet écrit « LingeCommande » : c&#39;est une coquille pour <strong>LigneCommande<\/strong>. Le corrigé garde <code>myArticle<\/code> comme <strong>pointeur<\/strong> : l&#39;article existe en dehors de la ligne (catalogue), la ligne ne doit donc pas le détruire.<\/p>\n<\/aside><figure class=\"etapes\" data-i=\"0\"><figcaption>Les points qui rapportent<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Q6 const<\/div><p><code>void Affiche() const<\/code> : sinon <code>c1.Affiche()<\/code> sur un <code>const Client<\/code> ne compile pas.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · Q7 affectation<\/div><p>test <code>this != &amp;c<\/code>, copie des champs, <code>return *this<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · Q19 valeurs par défaut<\/div><p>dans la <strong>déclaration<\/strong> du constructeur : <code>Commande(Client c = Client(), string ref = &quot;&quot;, ...)<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · Q20/Q21<\/div><p>tableau de pointeurs + compteur ; enlever = chercher puis <strong>décaler<\/strong> les suivants.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · Destructeur<\/div><p><code>delete[]<\/code> du tableau de pointeurs, pas des lignes (elles ne sont pas à la commande).<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><pre class=\"\"><code>#include &lt;iostream&gt;\n#include &lt;string&gt;\nusing namespace std;\n\nclass Client {\n    string nom, prenom;\n    int numero;\npublic:\n    // Q4 : constructeur (valeurs par défaut)\n    Client(string n = &quot;&quot;, string p = &quot;&quot;, int num = 0) : nom(n), prenom(p), numero(num) {}\n    // Q5 : constructeur de recopie\n    Client(const Client&amp; c) : nom(c.nom), prenom(c.prenom), numero(c.numero) {}\n    // Q2 : lecture\n    string getNom() const { return nom; }\n    string getPrenom() const { return prenom; }\n    int getNumero() const { return numero; }\n    // Q3 : modification\n    void setNom(string n) { nom = n; }\n    void setPrenom(string p) { prenom = p; }\n    void setNumero(int num) { numero = num; }\n    // Q6 : const pour accepter les objets constants\n    void Affiche() const { cout &lt;&lt; &quot;Client &quot; &lt;&lt; numero &lt;&lt; &quot; : &quot; &lt;&lt; prenom &lt;&lt; &quot; &quot; &lt;&lt; nom &lt;&lt; endl; }\n    // Q7 : affectation\n    Client&amp; operator=(const Client&amp; c) {\n        if (this != &amp;c) { nom = c.nom; prenom = c.prenom; numero = c.numero; }\n        return *this;\n    }\n};\n\nclass Article {\n    string titre;\n    double prix;\npublic:\n    Article(string t = &quot;&quot;, double p = 0) : titre(t), prix(p) {}     // Q11\n    string getTitre() const { return titre; }                       // Q9\n    double getPrix() const { return prix; }\n    void setTitre(string t) { titre = t; }                          // Q10\n    void setPrix(double p) { prix = p; }\n    void Affiche() const { cout &lt;&lt; titre &lt;&lt; &quot; (&quot; &lt;&lt; prix &lt;&lt; &quot; DH)&quot;; } // Q12\n};\n\nclass LigneCommande {\n    Article* myArticle;   // l'article n'appartient pas à la ligne : pas de delete\n    long quantite;\npublic:\n    LigneCommande(Article* a = nullptr, long q = 0) : myArticle(a), quantite(q) {} // Q16\n    Article* getMyArticle() const { return myArticle; }  // Q14\n    long getQuantite() const { return quantite; }\n    void setMyArticle(Article* a) { myArticle = a; }     // Q15\n    void setQuantite(long q) { quantite = q; }\n    void Affiche() const {                                // Q17\n        myArticle-&gt;Affiche();\n        cout &lt;&lt; &quot; x &quot; &lt;&lt; quantite &lt;&lt; &quot; = &quot; &lt;&lt; myArticle-&gt;getPrix() * quantite &lt;&lt; &quot; DH&quot; &lt;&lt; endl;\n    }\n};\n\nclass Commande {\n    Client client;\n    LigneCommande** lignes;   // tableau de pointeurs vers les lignes\n    int nbLignes, capacite;\n    string reference, date;\npublic:\n    // Q19 : constructeur avec valeurs par défaut\n    Commande(Client c = Client(), string ref = &quot;&quot;, string d = &quot;&quot;, int cap = 10)\n        : client(c), nbLignes(0), capacite(cap), reference(ref), date(d) {\n        lignes = new LigneCommande*[capacite];\n    }\n    ~Commande() { delete[] lignes; }   // on libère le tableau, pas les lignes\n    Commande(const Commande&amp;) = delete; // évite la double libération\n    Commande&amp; operator=(const Commande&amp;) = delete;\n    // Q20\n    void AjouterLigneCommande(LigneCommande* l) {\n        if (nbLignes &lt; capacite) lignes[nbLignes++] = l;\n        else cout &lt;&lt; &quot;Commande pleine&quot; &lt;&lt; endl;\n    }\n    // Q21 : on décale les lignes suivantes\n    void EnleverLigneCommande(LigneCommande* l) {\n        for (int i = 0; i &lt; nbLignes; i++)\n            if (lignes[i] == l) {\n                for (int j = i; j &lt; nbLignes - 1; j++) lignes[j] = lignes[j + 1];\n                nbLignes--;\n                return;\n            }\n        cout &lt;&lt; &quot;Ligne introuvable&quot; &lt;&lt; endl;\n    }\n    // Q22\n    void print() const {\n        cout &lt;&lt; &quot;Commande &quot; &lt;&lt; reference &lt;&lt; &quot; du &quot; &lt;&lt; date &lt;&lt; endl;\n        client.Affiche();\n        double total = 0;\n        for (int i = 0; i &lt; nbLignes; i++) {\n            cout &lt;&lt; &quot;  - &quot;; lignes[i]-&gt;Affiche();\n            total += lignes[i]-&gt;getQuantite() * lignes[i]-&gt;getMyArticle()-&gt;getPrix();\n        }\n        cout &lt;&lt; &quot;Total : &quot; &lt;&lt; total &lt;&lt; &quot; DH&quot; &lt;&lt; endl;\n    }\n};\n\nint main() {\n    const Client c1(&quot;Alaoui&quot;, &quot;Sara&quot;, 7);\n    c1.Affiche();                      // objet constant : OK grâce à const\n    Client c2 = c1;                    // recopie\n    c2.setPrenom(&quot;Omar&quot;);\n    c2.Affiche();\n    Article* a1 = new Article(&quot;Python for Data Science&quot;, 200);\n    Article* a2 = new Article(&quot;Cryptographie&quot;, 300);\n    LigneCommande* l1 = new LigneCommande(a1, 2);\n    LigneCommande* l2 = new LigneCommande(a2, 1);\n    Commande com(c2, &quot;com1&quot;, &quot;12-6-2024&quot;);\n    com.AjouterLigneCommande(l1);\n    com.AjouterLigneCommande(l2);\n    com.print();\n    com.EnleverLigneCommande(l1);\n    com.print();\n    delete l1; delete l2; delete a1; delete a2;\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Client 7 : Sara Alaoui\nClient 7 : Omar Alaoui\nCommande com1 du 12-6-2024\nClient 7 : Omar Alaoui\n  - Python for Data Science (200 DH) x 2 = 400 DH\n  - Cryptographie (300 DH) x 1 = 300 DH\nTotal : 700 DH\nCommande com1 du 12-6-2024\nClient 7 : Omar Alaoui\n  - Cryptographie (300 DH) x 1 = 300 DH\nTotal : 300 DH<\/code><\/pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Dès qu&#39;une classe fait <code>new<\/code> dans son constructeur, il faut trancher sur la recopie : soit tu écris recopie + <code>operator=<\/code> en profondeur, soit tu les interdis (<code>= delete<\/code>). Sinon deux objets libèrent le même tableau.<\/p>\n<\/aside><section class=\"exo\"><h3>Questions de l&#39;examen 2022-2023<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Q6 : pourquoi <code>Affiche()<\/code> doit-elle être déclarée <code>const<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Parce qu&#39;on ne peut appeler sur un objet constant (<code>const Client c1(...)<\/code>) que des méthodes <code>const<\/code>. Le mot-clé promet que la méthode ne modifie pas l&#39;objet.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Q7 : écris l&#39;en-tête et le squelette de <code>operator=<\/code> pour <code>Client<\/code>.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>Client&amp; operator=(const Client&amp; c) { if (this != &amp;c) { nom = c.nom; prenom = c.prenom; numero = c.numero; } return *this; }<\/code> : le test évite l&#39;auto-affectation, le retour par référence permet <code>a = b = c<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Q21 : comment enlever une ligne d&#39;un tableau de pointeurs sans laisser de trou ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>On cherche l&#39;indice i de la ligne, on décale <code>lignes[j] = lignes[j+1]<\/code> pour j de i à nbLignes − 2, puis <code>nbLignes--<\/code>. On ne fait pas <code>delete<\/code> : la ligne appartient à l&#39;appelant.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Que se passe-t-il si <code>Commande<\/code> a un <code>new<\/code> dans son constructeur, un <code>delete[]<\/code> dans son destructeur, et qu&#39;on copie une commande sans constructeur de recopie ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>La copie par défaut recopie le <strong>pointeur<\/strong> : les deux commandes partagent le même tableau, et il est libéré deux fois à la destruction (comportement indéfini, souvent un plantage).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Examen 2021-2022 · Individu, Etudiant, Enseignant, Departement (2 h)<\/h2>\n<p><strong>Énoncé (résumé).<\/strong> Q1–Q7 : classe <code>Individu<\/code> (nom, prenom, mail : string), <code>ObtenirNom/Prenom/Mail<\/code>, <code>ModifierNom/Prenom/Mail<\/code>, constructeur, recopie, <code>Affiche()<\/code> pour objets constants, <code>operator=<\/code>. Q8–Q10 : <code>Etudiant<\/code> hérite publiquement d&#39;<code>Individu<\/code> avec <code>Promo<\/code> (int) et <code>groupe<\/code> (string), redéfinit <code>Affiche()<\/code>, constructeur. Q11–Q13 : <code>Enseignant<\/code> avec <code>matiere<\/code> (string), même chose. Q14–Q19 : <code>Departement<\/code> composé de <code>nbEtudiants<\/code> étudiants et <code>nbEnseignants<\/code> enseignants : constructeur avec valeurs par défaut, <code>AjouterEtudiant()<\/code>, <code>AjouterEnseignant()<\/code>, <code>EnleverEtudiant()<\/code>, <code>EffectifEtudiants()<\/code>.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Les points qui rapportent<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Attributs protected<\/div><p>pour que <code>Etudiant::Affiche<\/code> puisse les lire (sinon passer par <code>ObtenirNom()<\/code>).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · Constructeur dérivé<\/div><p>liste d&#39;initialisation qui appelle <code>Individu(n, p, m)<\/code> en premier.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · Redéfinition<\/div><p>même signature, <code>virtual<\/code> dans la base pour qu&#39;un <code>Individu*<\/code> appelle la bonne version.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · Affiche de la base<\/div><p>réutilisée avec <code>Individu::Affiche();<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · Departement<\/div><p>deux tableaux de pointeurs + deux compteurs ; <code>EffectifEtudiants()<\/code> renvoie le compteur.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><pre
