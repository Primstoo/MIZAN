<script>
const MODULE={"slug":"poo-cpp","titre":"Programmation orientée objet en C++","cle":"poo-cpp_scores","cleEtat":"poo-cpp_scores_etat","format":"score10","intro":"<p>Ce module suit le <strong>cours du Pr A. Farchane<\/strong> (parties I à V : syntaxe C++, classes, héritage et polymorphisme, patrons, exceptions) et corrige les <strong>TD1 à TD4<\/strong> et le <strong>TP1<\/strong>.<\/p>\n<p><strong>Comment l&#39;utiliser<\/strong><\/p>\n<ol>\n<li>Lis un chapitre en entier, puis recopie et compile les exemples (g++ ou un compilateur en ligne).<\/li>\n<li>Pour chaque programme, essaie de <strong>prévoir l&#39;affichage<\/strong> avant de regarder la sortie : c&#39;est l&#39;exercice favori des TD.<\/li>\n<li>Fais le QCM du chapitre. <strong>8/10 = chapitre maîtrisé.<\/strong><\/li>\n<li>Termine par l&#39;examen blanc du dernier chapitre.<\/li>\n<\/ol>\n<p><strong>Ce qui est sûr<\/strong> : tout le contenu suit les diapositives et les fiches de TD/TP ; chaque exemple de code a été compilé et exécuté, et les sorties affichées sont les sorties réelles.\n<strong>À vérifier<\/strong> : la partie VI (STL) annoncée dans le plan n&#39;est pas développée dans les diapositives fournies, et aucune annale de C++ n&#39;a été fournie. Demande au prof le format de l&#39;examen.<\/p>\n","annexes":[],"cartes":null,"maths":false};
const CHAPS=[{"id":"du-c-au-cpp","t":"Du C au C++ · prototypes, cout/cin, surdéfinition, arguments par défaut","seance":"Partie I · Syntaxe du C++ (différences avec le C)","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu dois savoir écrire une fonction en C : en-tête, prototype, appel. Le C++ part de là et ajoute des règles plus strictes et quelques facilités.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>En C, quelle est la différence entre le <strong>prototype<\/strong> et la <strong>définition<\/strong> d&#39;une fonction ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>L&#39;un se termine par un point-virgule, l&#39;autre par un bloc { }.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Le prototype annonce la fonction (type de retour, types des arguments) : <code>double Add(int, double);<\/code>. La définition donne son corps : <code>double Add(int u, double v) { return u + v; }<\/code>. Le compilateur a besoin du prototype pour vérifier un appel placé avant la définition.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Le prof résume le langage par une formule : <strong>C++ = C + E + S + P<\/strong>. C, c&#39;est le C ANSI. E, les <strong>écarts<\/strong> (règles plus strictes). S, les <strong>spécificités<\/strong> hors objet (références, surdéfinition, new/delete, inline…). P, la <strong>programmation objet<\/strong>. Ce chapitre couvre E et une partie de S.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Croire que tout programme C compile en C++. Faux : <code>fct(int, double);<\/code> sans type de retour, <code>float f(void)<\/code> mélangé, ou <code>int *p = malloc(...)<\/code> sans cast sont refusés ou interprétés autrement.<\/p>\n<\/aside><p>À la fin, tu sais repérer ce qu&#39;un compilateur C++ refuse dans un code C, afficher et lire avec <code>cout<\/code>/<code>cin<\/code>, et prédire quelle version d&#39;une fonction surdéfinie est appelée.<\/p>\n<h2>Idée 1 · Les quatre piliers de la POO<\/h2>\n<svg viewBox=\"0 0 640 150\" style=\"width:100%;max-width:640px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Quatre notions : objet égale méthodes plus données, encapsulation, classe, héritage et polymorphisme\">\n<g font-family=\"sans-serif\" font-size=\"13\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"10\" y=\"20\" width=\"140\" height=\"100\" rx=\"10\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/>\n<text x=\"80\" y=\"50\" font-weight=\"700\">Objet<\/text><text x=\"80\" y=\"75\">méthodes<\/text><text x=\"80\" y=\"95\">+ données<\/text>\n<rect x=\"170\" y=\"20\" width=\"140\" height=\"100\" rx=\"10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<text x=\"240\" y=\"50\" font-weight=\"700\">Encapsulation<\/text><text x=\"240\" y=\"75\">accès aux données<\/text><text x=\"240\" y=\"95\">par les méthodes<\/text>\n<rect x=\"330\" y=\"20\" width=\"140\" height=\"100\" rx=\"10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<text x=\"400\" y=\"50\" font-weight=\"700\">Classe<\/text><text x=\"400\" y=\"75\">un « type » ;<\/text><text x=\"400\" y=\"95\">objet = instance<\/text>\n<rect x=\"490\" y=\"20\" width=\"140\" height=\"100\" rx=\"10\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/>\n<text x=\"560\" y=\"50\" font-weight=\"700\">Héritage<\/text><text x=\"560\" y=\"75\">+ polymorphisme :<\/text><text x=\"560\" y=\"95\">spécialiser, redéfinir<\/text>\n<\/g><\/svg><p>Un <strong>objet<\/strong> associe des données et les fonctions qui agissent dessus (Méthodes + Données = Objet). L&#39;<strong>encapsulation<\/strong> interdit de toucher aux données directement : on passe par les méthodes. Une <strong>classe<\/strong> décrit un ensemble d&#39;objets de même structure ; chaque objet est une <strong>instance<\/strong>. En C++, on dit « membres données » et « fonctions membres ».<\/p>\n<h2>Idée 2 · Ce que le C++ refuse alors que le C l&#39;acceptait<\/h2>\n<figure class=\"grille\"><figcaption>Écarts C → C++<\/figcaption><table><tr><th>Situation<\/th><th>C ANSI<\/th><th>C++<\/th><\/tr><tr><td>En-tête ancienne forme<\/td><td>accepté<\/td><td class=\"h1\">refusé<\/td><\/tr><tr><td>Appel sans prototype<\/td><td>int supposé<\/td><td class=\"h1\">refusé<\/td><\/tr><tr><td>Fonction sans argument<\/td><td>f(void)<\/td><td>f()<\/td><\/tr><tr><td>Fonction sans retour<\/td><td>void conseillé<\/td><td class=\"h1\">void obligatoire<\/td><\/tr><tr><td>void* vers int*<\/td><td>implicite<\/td><td class=\"h1\">cast obligatoire<\/td><\/tr><\/table><\/figure><p>Trois règles à retenir :<\/p>\n<ul>\n<li>Un appel n&#39;est accepté que si le compilateur connaît <strong>le type des arguments et du retour<\/strong> (prototype ou définition placée avant).<\/li>\n<li>Écrire <code>fct(int, double);<\/code> déclare une fonction qui <strong>renvoie un int<\/strong>. Pour « rien », écris <code>void<\/code>.<\/li>\n<li><code>int* → void*<\/code> est implicite, mais <code>void* → int*<\/code> demande un cast : <code>adi = (int*) gen;<\/code>.<\/li>\n<\/ul>\n<p>Au moment de l&#39;appel, le compilateur convertit les arguments si besoin, même avec perte (<code>double → int<\/code>) : <code>Add(z, n)<\/code> convertit z en int et n en double.<\/p>\n<h2>Idée 3 · Entrées-sorties avec cout et cin<\/h2>\n<figure class=\"flux\"><figcaption>Le flot de sortie<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">valeurs<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">opérateur &lt;&lt;<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">cout<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">écran<\/div><\/div><\/figure><p><code>cout &lt;&lt; &quot;valeur : &quot; &lt;&lt; n;<\/code> remplace <code>printf<\/code>. <code>cin &gt;&gt; n &gt;&gt; x;<\/code> remplace <code>scanf<\/code>, sans <code>&amp;<\/code> ni <code>%d<\/code>. Il faut <code>#include &lt;iostream&gt;<\/code> et <code>using namespace std;<\/code>.<\/p>\n<pre class=\"\"><code>#include &lt;iostream&gt;\nusing namespace std;\nint main() {\n    int n = 25;\n    float x = 12.3456789;\n    double y = 12.3456789e16;\n    char c = 'a';\n    cout &lt;&lt; &quot;valeur de n : &quot; &lt;&lt; n &lt;&lt; &quot;\\n&quot;;\n    cout &lt;&lt; &quot;caractere c : &quot; &lt;&lt; c &lt;&lt; &quot;\\n&quot;;\n    cout &lt;&lt; &quot;valeur de x : &quot; &lt;&lt; x &lt;&lt; &quot;\\n&quot;;\n    cout &lt;&lt; &quot;valeur de y : &quot; &lt;&lt; y &lt;&lt; &quot;\\n&quot;;\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>valeur de n : 25\ncaractere c : a\nvaleur de x : 12.3457\nvaleur de y : 1.23457e+17<\/code><\/pre><p><code>cout<\/code> affiche par défaut 6 chiffres significatifs : 12.3456789 devient 12.3457.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Les diapos écrivent <code>main()<\/code> sans type. Un compilateur récent l&#39;accepte parfois avec un avertissement, mais la forme correcte est <code>int main()<\/code>. Les diapos montrent aussi <code>1.23457e+017<\/code> : c&#39;est l&#39;affichage de l&#39;ancien compilateur Windows. Avec g++ tu obtiens <code>1.23457e+17<\/code>.<\/p>\n<\/aside><p>En C++, tu peux aussi déclarer une variable <strong>là où tu en as besoin<\/strong>, y compris dans un <code>for<\/code> : <code>for (int i = 0; i &lt; n; i++)<\/code>. Sa portée est limitée à la boucle. Et <code>//<\/code> commente jusqu&#39;à la fin de la ligne.<\/p>\n<h2>Idée 4 · Surdéfinition et arguments par défaut<\/h2>\n<p><strong>Surdéfinir<\/strong> (surcharger), c&#39;est donner le même nom à plusieurs fonctions. Le compilateur choisit d&#39;après la <strong>signature<\/strong> : nombre et types des arguments. Le type de retour ne compte pas.<\/p>\n<pre class=\"\"><code>#include &lt;iostream&gt;\nusing namespace std;\nvoid test(int a)    { cout &lt;&lt; &quot;test numero I a = &quot; &lt;&lt; a &lt;&lt; &quot;\\n&quot;; }\nvoid test(double a) { cout &lt;&lt; &quot;test numero II a = &quot; &lt;&lt; a &lt;&lt; &quot;\\n&quot;; }\nvoid fct(int a, int b = 12) {          // b vaut 12 si on l'omet\n    cout &lt;&lt; &quot;premier : &quot; &lt;&lt; a &lt;&lt; &quot; second : &quot; &lt;&lt; b &lt;&lt; &quot;\\n&quot;;\n}\nint main() {\n    int n = 5; double x = 2.5; char c = 'A'; float y = 1.5;\n    test(n); test(x);\n    test(c);   // char -&gt; int : test I\n    test(y);   // float -&gt; double : test II\n    fct(10, 20);\n    fct(10);\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>test numero I a = 5\ntest numero II a = 2.5\ntest numero I a = 65\ntest numero II a = 1.5\npremier : 10 second : 20\npremier : 10 second : 12<\/code><\/pre><figure class=\"etapes\" data-i=\"0\"><figcaption>Choisir la fonction appelée<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Correspondance exacte<\/div><p>si un prototype a exactement les types des arguments, il gagne.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Promotions<\/div><p>sinon char et short deviennent int, float devient double.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Conversions usuelles<\/div><p>sinon on essaie les autres conversions (int ↔ double…).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Une seule gagnante ?<\/div><p>si deux candidates sont aussi bonnes l&#39;une que l&#39;autre : erreur de compilation (ambiguïté).<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p>Exemple d&#39;ambiguïté du cours : avec <code>essai(int, double)<\/code> et <code>essai(double, int)<\/code>, l&#39;appel <code>essai(n, p)<\/code> (deux int) est refusé. Il faudrait convertir un argument dans les deux cas : aucune n&#39;est meilleure.<\/p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Les arguments par défaut se mettent <strong>dans le prototype<\/strong>, de <strong>droite à gauche<\/strong> : <code>void f(int a, int b = 12);<\/code> est valide, <code>void f(int a = 0, int b);<\/code> ne l&#39;est pas.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p><code>void truc(int)<\/code> et <code>void truc(const int)<\/code> sont <strong>la même<\/strong> signature (erreur). En revanche <code>chose(int*)<\/code> et <code>chose(const int*)<\/code>, ou <code>chose(int&amp;)<\/code> et <code>chose(const int&amp;)<\/code>, sont <strong>différentes<\/strong> : la seconde est choisie pour une constante.<\/p>\n<\/aside><p>Une fonction <strong>en ligne<\/strong> (<code>inline<\/code>) demande au compilateur de recopier son corps à l&#39;endroit de l&#39;appel : plus rapide pour les fonctions courtes.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices du TD1<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>(TD1, ex. 1.1) Ce code C est compilé en C++ : <code>int main(){ int a=10,b=20,c; c=fct(a,b); printf(...); return 0; } fct(int x, int y){ return x*x + x*y + y*y; }<\/code>. Quelles erreurs ? Rends <code>fct<\/code> en ligne.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Que sait le compilateur de fct au moment de l&#39;appel ? Et quel est son type de retour ?<\/p>\n<\/div><div class=\"ex-c\" hidden><ol>\n<li><code>fct<\/code> est appelée avant d&#39;être déclarée : C++ exige un prototype. 2) L&#39;en-tête <code>fct(int x, int y)<\/code> n&#39;a pas de type de retour : écris <code>int<\/code>. 3) <code>printf<\/code> exige <code>#include &lt;cstdio&gt;<\/code>.\nCorrection : placer avant main <code>inline int fct(int x, int y) { return x*x + x*y + y*y; }<\/code> (définition en ligne placée avant l&#39;appel).<\/li>\n<\/ol>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>(TD1, ex. 1.5) Prototypes : I <code>int fct(int)<\/code>, II <code>int fct(float)<\/code>, III <code>void fct(int,float)<\/code>, IV <code>void fct(float,int)<\/code>. Variables : int n,p ; float x ; char c ; double z. Quelle fonction pour <code>fct(n)<\/code>, <code>fct(c)<\/code>, <code>fct(n,x)<\/code>, <code>fct(n,p)<\/code>, <code>fct(z)<\/code>, <code>fct(n,z)<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Correspondance exacte d&#39;abord, puis promotions, puis conversions. Deux candidates équivalentes = erreur.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><code>fct(n)<\/code> → I. <code>fct(c)<\/code> → I (promotion char → int). <code>fct(n,x)<\/code> → III. <code>fct(n,p)<\/code> → <strong>erreur<\/strong> : III et IV demandent chacune une conversion, ambiguïté. <code>fct(z)<\/code> → <strong>erreur<\/strong> : double → int et double → float sont deux conversions de même rang. <code>fct(n,z)<\/code> → III (z converti en float ; IV demanderait deux conversions).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>(TD1, ex. 1.3) Réécris en C++ sans printf ni scanf : lire un entier n et un flottant x, puis afficher leur produit.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>#include &lt;iostream&gt;<\/code> puis <code>using namespace std;<\/code>, et dans <code>int main()<\/code> : <code>int n; float x; cout &lt;&lt; &quot;donnez un entier et un flottant\\n&quot;; cin &gt;&gt; n &gt;&gt; x; cout &lt;&lt; &quot;le produit de &quot; &lt;&lt; n &lt;&lt; &quot; par &quot; &lt;&lt; x &lt;&lt; &quot;\\nest : &quot; &lt;&lt; n*x &lt;&lt; &quot;\\n&quot;;<\/code><\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Dans la formule C++ = C + E + S + P, que désigne P ?<\/div><button class=\"opt\" data-o=\"0\">Les pointeurs<\/button><button class=\"opt\" data-o=\"1\">Les possibilités de programmation orientée objet<\/button><button class=\"opt\" data-o=\"2\">Les prototypes<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">En C++, une fonction sans argument se déclare plutôt :<\/div><button class=\"opt\" data-o=\"0\"><code>float fct(void...);<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>float fct();<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>fct float();<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Que signifie la déclaration <code>fct(int, double);<\/code> en C++ ?<\/div><button class=\"opt\" data-o=\"0\">fct ne renvoie rien<\/button><button class=\"opt\" data-o=\"1\">fct renvoie un int<\/button><button class=\"opt\" data-o=\"2\">C&#39;est une erreur de syntaxe toujours<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Avec <code>void* gen; int* adi;<\/code>, laquelle est acceptée en C++ sans cast ?<\/div><button class=\"opt\" data-o=\"0\"><code>gen = adi;<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>adi = gen;<\/code><\/button><button class=\"opt\" data-o=\"2\">Aucune des deux<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Quel fichier d&#39;en-tête pour cout et cin ?<\/div><button class=\"opt\" data-o=\"0\">stdio.h<\/button><button class=\"opt\" data-o=\"1\">iostream<\/button><button class=\"opt\" data-o=\"2\">stdlib.h<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\"><code>float x = 12.3456789; cout &lt;&lt; x;<\/code> affiche :<\/div><button class=\"opt\" data-o=\"0\">12.3456789<\/button><button class=\"opt\" data-o=\"1\">12.3457<\/button><button class=\"opt\" data-o=\"2\">12.34<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Avec <code>void test(int); void test(double); float y;<\/code>, l&#39;appel <code>test(y)<\/code> appelle :<\/div><button class=\"opt\" data-o=\"0\">test(int)<\/button><button class=\"opt\" data-o=\"1\">test(double)<\/button><button class=\"opt\" data-o=\"2\">Erreur d&#39;ambiguïté<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Avec <code>essai(int,double)<\/code> et <code>essai(double,int)<\/code>, l&#39;appel <code>essai(n,p)<\/code> avec deux int :<\/div><button class=\"opt\" data-o=\"0\">Appelle essai(int,double)<\/button><button class=\"opt\" data-o=\"1\">Appelle essai(double,int)<\/button><button class=\"opt\" data-o=\"2\">Provoque une erreur d&#39;ambiguïté<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Quelle déclaration est correcte ?<\/div><button class=\"opt\" data-o=\"0\"><code>void f(int a, int b = 12);<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>void f(int a = 0, int b);<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>void f(int = 0, int);<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Quelles déclarations peuvent coexister ?<\/div><button class=\"opt\" data-o=\"0\"><code>void truc(int);<\/code> et <code>void truc(const int);<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>void chose(int&amp;);<\/code> et <code>void chose(const int&amp;);<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>int g(int);<\/code> et <code>double g(int);<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"du-c-au-cpp","rep":null,"tol":null},{"n":"du-c-au-cpp","rep":null,"tol":null},{"n":"du-c-au-cpp","rep":null,"tol":null},{"n":"du-c-au-cpp","rep":null,"tol":null}],"qcm":[{"n":"du-c-au-cpp","q":"Dans la formule C++ = C + E + S + P, que désigne P ?","o":["Les pointeurs","Les possibilités de programmation orientée objet","Les prototypes"],"a":1,"e":"E = écarts, S = spécificités hors objet, P = POO."},{"n":"du-c-au-cpp","q":"En C++, une fonction sans argument se déclare plutôt :","o":["<code>float fct(void...);<\/code>","<code>float fct();<\/code>","<code>fct float();<\/code>"],"a":1,"e":"Le C++ accepte une liste vide ; <code>void<\/code> reste toléré mais n&#39;est pas nécessaire."},{"n":"du-c-au-cpp","q":"Que signifie la déclaration <code>fct(int, double);<\/code> en C++ ?","o":["fct ne renvoie rien","fct renvoie un int","C&#39;est une erreur de syntaxe toujours"],"a":1,"e":"Sans type de retour, l&#39;ancienne règle « int par défaut » s&#39;applique dans le cours. Pour ne rien renvoyer, il faut <code>void<\/code>."},{"n":"du-c-au-cpp","q":"Avec <code>void* gen; int* adi;<\/code>, laquelle est acceptée en C++ sans cast ?","o":["<code>gen = adi;<\/code>","<code>adi = gen;<\/code>","Aucune des deux"],"a":0,"e":"Seule la conversion vers void* est implicite."},{"n":"du-c-au-cpp","q":"Quel fichier d&#39;en-tête pour cout et cin ?","o":["stdio.h","iostream","stdlib.h"],"a":1,"e":"Les entrées-sorties du C++ sont déclarées dans <code>&lt;iostream&gt;<\/code>."},{"n":"du-c-au-cpp","q":"<code>float x = 12.3456789; cout &lt;&lt; x;<\/code> affiche :","o":["12.3456789","12.3457","12.34"],"a":1,"e":"Par défaut, 6 chiffres significatifs."},{"n":"du-c-au-cpp","q":"Avec <code>void test(int); void test(double); float y;<\/code>, l&#39;appel <code>test(y)<\/code> appelle :","o":["test(int)","test(double)","Erreur d&#39;ambiguïté"],"a":1,"e":"float → double est une promotion, meilleure qu&#39;une conversion vers int."},{"n":"du-c-au-cpp","q":"Avec <code>essai(int,double)<\/code> et <code>essai(double,int)<\/code>, l&#39;appel <code>essai(n,p)<\/code> avec deux int :","o":["Appelle essai(int,double)","Appelle essai(double,int)","Provoque une erreur d&#39;ambiguïté"],"a":2,"e":"Chaque candidate demande une conversion : aucune n&#39;est meilleure."},{"n":"du-c-au-cpp","q":"Quelle déclaration est correcte ?","o":["<code>void f(int a, int b = 12);<\/code>","<code>void f(int a = 0, int b);<\/code>","<code>void f(int = 0, int);<\/code>"],"a":0,"e":"Les valeurs par défaut partent de la droite."},{"n":"du-c-au-cpp","q":"Quelles déclarations peuvent coexister ?","o":["<code>void truc(int);<\/code> et <code>void truc(const int);<\/code>","<code>void chose(int&amp;);<\/code> et <code>void chose(const int&amp;);<\/code>","<code>int g(int);<\/code> et <code>double g(int);<\/code>"],"a":1,"e":"Le const sur une valeur copiée ne change pas la signature, le type de retour non plus ; const sur une référence, si."}]},{"id":"references-new-delete","t":"Références, passage d'arguments et new/delete","seance":"Partie I · Références, constantes, gestion dynamique","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir ce qu&#39;est un pointeur : <code>int *p = &amp;n;<\/code> puis <code>*p<\/code> désigne n.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Avec <code>int n = 10; int *p = &amp;n; *p = 30;<\/code>, que vaut n ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 30<\/b><\/p><p>p contient l&#39;adresse de n, donc <code>*p = 30<\/code> écrit dans n. n vaut 30.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Une référence est <strong>un deuxième nom<\/strong> pour une variable existante. Pas une copie, pas un pointeur qu&#39;on déréférence : le même emplacement mémoire, avec un autre nom.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Oublier qu&#39;en C, et par défaut en C++, les arguments sont passés <strong>par valeur<\/strong> : la fonction travaille sur une copie. Un <code>echange(int a, int b)<\/code> n&#39;échange rien chez l&#39;appelant.<\/p>\n<\/aside><p>À la fin, tu sais choisir entre passage par valeur, par adresse et par référence, expliquer pourquoi <code>fct(3)<\/code> est refusé avec <code>int&amp;<\/code> mais accepté avec <code>const int&amp;<\/code>, et allouer/libérer avec new/delete.<\/p>\n<h2>Idée 1 · Trois façons de transmettre un argument<\/h2>\n<svg viewBox=\"0 0 640 170\" style=\"width:100%;max-width:640px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Par valeur la fonction reçoit une copie ; par adresse elle reçoit un pointeur ; par référence elle reçoit un autre nom de la même case\">\n<g font-family=\"sans-serif\" font-size=\"13\" text-anchor=\"middle\" fill=\"currentColor\">\n<text x=\"105\" y=\"20\" font-weight=\"700\">Par valeur<\/text>\n<rect x=\"30\" y=\"40\" width=\"60\" height=\"36\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"60\" y=\"63\">n=10<\/text>\n<rect x=\"120\" y=\"110\" width=\"60\" height=\"36\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"150\" y=\"133\">a=10<\/text>\n<text x=\"105\" y=\"165\">copie : n inchangé<\/text>\n<line x1=\"75\" y1=\"78\" x2=\"135\" y2=\"108\" stroke=\"#D9824F\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/>\n<text x=\"320\" y=\"20\" font-weight=\"700\">Par adresse<\/text>\n<rect x=\"250\" y=\"40\" width=\"60\" height=\"36\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"280\" y=\"63\">n=10<\/text>\n<rect x=\"330\" y=\"110\" width=\"70\" height=\"36\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"365\" y=\"133\">a=&amp;n<\/text>\n<line x1=\"350\" y1=\"108\" x2=\"300\" y2=\"78\" stroke=\"#D9824F\" stroke-width=\"2\"/>\n<text x=\"320\" y=\"165\">*a modifie n<\/text>\n<text x=\"535\" y=\"20\" font-weight=\"700\">Par référence<\/text>\n<rect x=\"490\" y=\"60\" width=\"90\" height=\"40\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/><text x=\"535\" y=\"85\">n = a = 10<\/text>\n<text x=\"535\" y=\"165\">même case, deux noms<\/text>\n<\/g><\/svg><pre class=\"\"><code>#include &lt;iostream&gt;\nusing namespace std;\nvoid echangeV(int a, int b)   { int c = a; a = b; b = c; }\nvoid echangeP(int *a, int *b) { int c = *a; *a = *b; *b = c; }\nvoid echangeR(int &amp;a, int &amp;b) { int c = a; a = b; b = c; }\nint main() {\n    int n = 10, p = 20;\n    echangeV(n, p);   cout &lt;&lt; &quot;valeur    : &quot; &lt;&lt; n &lt;&lt; &quot; &quot; &lt;&lt; p &lt;&lt; &quot;\\n&quot;;\n    echangeP(&amp;n, &amp;p); cout &lt;&lt; &quot;adresse   : &quot; &lt;&lt; n &lt;&lt; &quot; &quot; &lt;&lt; p &lt;&lt; &quot;\\n&quot;;\n    echangeR(n, p);   cout &lt;&lt; &quot;reference : &quot; &lt;&lt; n &lt;&lt; &quot; &quot; &lt;&lt; p &lt;&lt; &quot;\\n&quot;;\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>valeur    : 10 20\nadresse   : 20 10\nreference : 10 20<\/code><\/pre><p>Lis les lignes une par une. Par valeur, rien ne change (10 20). Par adresse, l&#39;échange marche (20 10), mais l&#39;appelant doit écrire <code>&amp;n<\/code>. Par référence, l&#39;échange marche <strong>et<\/strong> l&#39;appel s&#39;écrit simplement <code>echangeR(n, p)<\/code> : on repasse de 20 10 à 10 20.<\/p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p><code>int &amp;a<\/code> dans un en-tête = « a est transmis par référence ». Dans la fonction, on écrit <code>a<\/code>, sans <code>*<\/code>. À l&#39;appel, on écrit <code>n<\/code>, sans <code>&amp;<\/code>.<\/p>\n<\/aside><h2>Idée 2 · Référence et constance<\/h2>\n<p>Une référence doit être <strong>initialisée<\/strong> à sa déclaration et ne change plus de cible : <code>int &amp;p = n;<\/code> est correct, <code>int &amp;p;<\/code> ne l&#39;est pas. Ensuite <code>p = q;<\/code> copie la <strong>valeur<\/strong> de q dans n.<\/p>\n<figure class=\"grille\"><figcaption>Ce que le compilateur accepte<\/figcaption><table><tr><th>Appel<\/th><th>void f(int&amp;)<\/th><th>void f(const int&amp;)<\/th><\/tr><tr><td>f(n) avec int n<\/td><td>oui<\/td><td>oui<\/td><\/tr><tr><td>f(3)<\/td><td class=\"h1\">non<\/td><td>oui (temporaire)<\/td><\/tr><tr><td>f(c) avec const int c<\/td><td class=\"h1\">non<\/td><td>oui<\/td><\/tr><tr><td>f(x) avec float x<\/td><td class=\"h1\">non<\/td><td>oui (temporaire int)<\/td><\/tr><\/table><\/figure><p>Avec <code>int&amp;<\/code>, la fonction pourrait modifier son argument : le compilateur refuse donc les constantes et les conversions. Avec <code>const int&amp;<\/code>, aucun risque : il crée au besoin une <strong>variable temporaire<\/strong> (par exemple la conversion de x en int) et transmet sa référence.<\/p>\n<aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p><code>int &amp;n = 3;<\/code> est faux. <code>const int &amp;n = 3;<\/code> est juste : une variable temporaire contenant 3 est créée.<\/p>\n<\/aside><h2>Idée 3 · Retourner une référence<\/h2>\n<p>Une fonction <code>int&amp; f()<\/code> renvoie l&#39;emplacement lui-même, pas une copie. Son appel devient une <strong>lvalue<\/strong> : on peut écrire <code>f() = 2*n + 5;<\/code>.<\/p>\n<pre class=\"\"><code>#include &lt;iostream&gt;\nusing namespace std;\nint&amp; valeurRef() {\n    static int x = 10;   // static : x survit à la fin de la fonction\n    return x;\n}\nint main() {\n    int&amp; ref = valeurRef();\n    cout &lt;&lt; &quot;Avant : &quot; &lt;&lt; ref &lt;&lt; &quot;\\n&quot;;\n    ref = 20;\n    cout &lt;&lt; &quot;Apres : &quot; &lt;&lt; valeurRef() &lt;&lt; &quot;\\n&quot;;\n    valeurRef() = 99;            // l'appel est une lvalue\n    cout &lt;&lt; &quot;Enfin : &quot; &lt;&lt; valeurRef() &lt;&lt; &quot;\\n&quot;;\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Avant : 10\nApres : 20\nEnfin : 99<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Ne renvoie <strong>jamais<\/strong> la référence d&#39;une variable locale non statique : elle n&#39;existe plus après le return. Et avec <code>int&amp; f()<\/code>, <code>return 5;<\/code> ou <code>return x;<\/code> (x float) sont interdits ; avec <code>const int&amp; f()<\/code>, ils sont acceptés (référence à un temporaire).<\/p>\n<\/aside><p><strong>lvalue<\/strong> : expression qui désigne un emplacement identifiable, modifiable (<code>x<\/code>). <strong>rvalue<\/strong> : valeur temporaire (<code>10 + 5<\/code>, <code>x + y<\/code>), seulement à droite d&#39;une affectation.<\/p>\n<h2>Idée 4 · new et delete<\/h2>\n<figure class=\"grille\"><figcaption>C → C++<\/figcaption><table><tr><th>C (malloc/free)<\/th><th>C++ (new/delete)<\/th><\/tr><tr><td>ad = (int*) malloc(sizeof(int));<\/td><td>ad = new int;<\/td><\/tr><tr><td>adc = (char*) malloc(100);<\/td><td>adc = new char[100];<\/td><\/tr><tr><td>free(ad);<\/td><td>delete ad;<\/td><\/tr><tr><td>free(adc);<\/td><td>delete[] adc;<\/td><\/tr><\/table><\/figure><figure class=\"etapes\" data-i=\"0\"><figcaption>Cycle de vie d'une zone dynamique<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Allouer<\/div><p><code>int *p = new int(10);<\/code> réserve un int et l&#39;initialise à 10.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Utiliser<\/div><p><code>*p = 100;<\/code><\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Libérer<\/div><p><code>delete p;<\/code> (ou <code>delete[] t;<\/code> pour un tableau alloué avec new[]).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Neutraliser<\/div><p><code>p = nullptr;<\/code> évite d&#39;utiliser une zone déjà libérée (comportement indéfini).<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><pre class=\"\"><code>#include &lt;iostream&gt;\n#include &lt;new&gt;\nusing namespace std;\nint main() {\n    double *d = new double(3.14);\n    cout &lt;&lt; *d &lt;&lt; &quot;\\n&quot;;\n    delete d; d = nullptr;\n    int *t = new int[5];\n    for (int i = 0; i &lt; 5; i++) t[i] = i * i;\n    for (int i = 0; i &lt; 5; i++) cout &lt;&lt; t[i] &lt;&lt; &quot; &quot;;\n    cout &lt;&lt; &quot;\\n&quot;;\n    delete[] t;\n    int *q = new (nothrow) int;      // renvoie nullptr au lieu de lever bad_alloc\n    if (q) { *q = 100; cout &lt;&lt; &quot;Valeur: &quot; &lt;&lt; *q &lt;&lt; &quot;\\n&quot;; delete q; }\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>3.14\n0 1 4 9 16 \nValeur: 100<\/code><\/pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Chaque <code>new<\/code> a son <code>delete<\/code>, chaque <code>new[]<\/code> a son <code>delete[]<\/code>. Un oubli = <strong>fuite de mémoire<\/strong>. Par défaut, un new qui échoue lève <code>std::bad_alloc<\/code> ; <code>new(nothrow)<\/code> renvoie <code>nullptr<\/code>.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices du TD1<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>(TD1, ex. 1.6) Réécris avec new et delete : <code>adi = malloc(sizeof(int)); add = malloc(sizeof(double)*100); ... free(adi); free(add);<\/code><\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>adi = new int;<\/code> puis <code>add = new double[100];<\/code> puis <code>delete adi;<\/code> et <code>delete[] add;<\/code> (crochets car add est un tableau).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>(TD1, ex. 1.4) Écris une fonction d&#39;échange de deux int par adresse, puis par référence, avec leurs appels.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Par adresse : <code>void echange(int *a, int *b){ int c=*a; *a=*b; *b=c; }<\/code>, appel <code>echange(&amp;n, &amp;p);<\/code>. Par référence : <code>void echange(int &amp;a, int &amp;b){ int c=a; a=b; b=c; }<\/code>, appel <code>echange(n, p);<\/code>. Les deux noms peuvent coexister : les signatures diffèrent.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Avec <code>void f(int &amp;n); float x;<\/code>, l&#39;appel <code>f(x)<\/code> compile-t-il ? Et avec <code>void g(const int &amp;n);<\/code>, <code>g(x)<\/code> ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : non<\/b><\/p><p><code>f(x)<\/code> est refusé : un <code>int&amp;<\/code> ne peut pas désigner un float (pas de conversion avec une référence non constante). <code>g(x)<\/code> est accepté : un int temporaire reçoit la conversion de x.<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Après <code>void f(int a){ a = 0; }<\/code> et <code>int n = 5; f(n);<\/code>, que vaut n ?<\/div><button class=\"opt\" data-o=\"0\">5<\/button><button class=\"opt\" data-o=\"1\">0<\/button><button class=\"opt\" data-o=\"2\">Indéterminé<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Comment appelle-t-on <code>void echange(int &amp;a, int &amp;b)<\/code> ?<\/div><button class=\"opt\" data-o=\"0\"><code>echange(&amp;n, &amp;p);<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>echange(n, p);<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>echange(*n, *p);<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Laquelle de ces déclarations est correcte ?<\/div><button class=\"opt\" data-o=\"0\"><code>int &amp;r;<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>int &amp;r = 3;<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>const int &amp;r = 3;<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Avec <code>void fct(const int &amp;);<\/code> et <code>float x;<\/code>, l&#39;appel <code>fct(x)<\/code> :<\/div><button class=\"opt\" data-o=\"0\">Est refusé<\/button><button class=\"opt\" data-o=\"1\">Crée un int temporaire contenant la conversion de x<\/button><button class=\"opt\" data-o=\"2\">Modifie x<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Après <code>int n = 1, q = 7; int &amp;p = n; p = q;<\/code>, que se passe-t-il ?<\/div><button class=\"opt\" data-o=\"0\">p devient une référence à q<\/button><button class=\"opt\" data-o=\"1\">n prend la valeur 7<\/button><button class=\"opt\" data-o=\"2\">Erreur de compilation<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Quelle fonction peut s&#39;utiliser à gauche d&#39;une affectation : <code>f() = 3;<\/code> ?<\/div><button class=\"opt\" data-o=\"0\"><code>int f();<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>int&amp; f();<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>void f();<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Avec <code>int&amp; f(){ ... }<\/code>, quelle instruction est interdite ?<\/div><button class=\"opt\" data-o=\"0\"><code>return 5;<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>return n;<\/code> (n int global)<\/button><button class=\"opt\" data-o=\"2\"><code>return t[0];<\/code> (t tableau global d&#39;int)<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Comment libérer <code>char *adc = new char[100];<\/code> ?<\/div><button class=\"opt\" data-o=\"0\"><code>delete adc;<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>delete[] adc;<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>free(adc);<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Par défaut, que fait new si l&#39;allocation échoue ?<\/div><button class=\"opt\" data-o=\"0\">Renvoie NULL<\/button><button class=\"opt\" data-o=\"1\">Lève l&#39;exception std::bad_alloc<\/button><button class=\"opt\" data-o=\"2\">Arrête le programme sans message<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Laquelle est une rvalue ?<\/div><button class=\"opt\" data-o=\"0\"><code>x<\/code> (int x)<\/button><button class=\"opt\" data-o=\"1\"><code>x + y<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>*p<\/code> (p int*)<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"references-new-delete","rep":["30"],"tol":null},{"n":"references-new-delete","rep":null,"tol":null},{"n":"references-new-delete","rep":null,"tol":null},{"n":"references-new-delete","rep":["non"],"tol":null}],"qcm":[{"n":"references-new-delete","q":"Après <code>void f(int a){ a = 0; }<\/code> et <code>int n = 5; f(n);<\/code>, que vaut n ?","o":["5","0","Indéterminé"],"a":0,"e":"Passage par valeur : f modifie une copie."},{"n":"references-new-delete","q":"Comment appelle-t-on <code>void echange(int &amp;a, int &amp;b)<\/code> ?","o":["<code>echange(&amp;n, &amp;p);<\/code>","<code>echange(n, p);<\/code>","<code>echange(*n, *p);<\/code>"],"a":1,"e":"Le compilateur gère lui-même la transmission par adresse."},{"n":"references-new-delete","q":"Laquelle de ces déclarations est correcte ?","o":["<code>int &amp;r;<\/code>","<code>int &amp;r = 3;<\/code>","<code>const int &amp;r = 3;<\/code>"],"a":2,"e":"Seule une référence à une constante peut être liée à une constante (via un temporaire)."},{"n":"references-new-delete","q":"Avec <code>void fct(const int &amp;);<\/code> et <code>float x;<\/code>, l&#39;appel <code>fct(x)<\/code> :","o":["Est refusé","Crée un int temporaire contenant la conversion de x","Modifie x"],"a":1,"e":"const int&amp; accepte une conversion grâce à un temporaire."},{"n":"references-new-delete","q":"Après <code>int n = 1, q = 7; int &amp;p = n; p = q;<\/code>, que se passe-t-il ?","o":["p devient une référence à q","n prend la valeur 7","Erreur de compilation"],"a":1,"e":"Une référence ne change jamais de cible : p = q copie la valeur."},{"n":"references-new-delete","q":"Quelle fonction peut s&#39;utiliser à gauche d&#39;une affectation : <code>f() = 3;<\/code> ?","o":["<code>int f();<\/code>","<code>int&amp; f();<\/code>","<code>void f();<\/code>"],"a":1,"e":"Un retour par référence fait de l&#39;appel une lvalue."},{"n":"references-new-delete","q":"Avec <code>int&amp; f(){ ... }<\/code>, quelle instruction est interdite ?","o":["<code>return 5;<\/code>","<code>return n;<\/code> (n int global)","<code>return t[0];<\/code> (t tableau global d&#39;int)"],"a":0,"e":"On ne peut pas renvoyer une référence non constante à une constante."},{"n":"references-new-delete","q":"Comment libérer <code>char *adc = new char[100];<\/code> ?","o":["<code>delete adc;<\/code>","<code>delete[] adc;<\/code>","<code>free(adc);<\/code>"],"a":1,"e":"Un tableau alloué par new[] se libère par delete[]."},{"n":"references-new-delete","q":"Par défaut, que fait new si l&#39;allocation échoue ?","o":["Renvoie NULL","Lève l&#39;exception std::bad_alloc","Arrête le programme sans message"],"a":1,"e":"Pour obtenir nullptr, il faut <code>new(nothrow)<\/code>."},{"n":"references-new-delete","q":"Laquelle est une rvalue ?","o":["<code>x<\/code> (int x)","<code>x + y<\/code>","<code>*p<\/code> (p int*)"],"a":1,"e":"x + y est un résultat temporaire sans adresse identifiable."}]},{"id":"classes-objets","t":"Classes et objets · constructeur, destructeur, static, const, this","seance":"Partie II · Notions de classe","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu connais les <code>struct<\/code> du C : un type qui regroupe plusieurs champs. Une classe, c&#39;est une struct qui contient aussi des fonctions, et qui cache ses champs.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>En C, avec <code>struct point { int x, y; }; struct point a;<\/code>, comment donner la valeur 5 au champ x de a ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>a.x = 5;<\/code> : l&#39;opérateur point accède à un champ. En C++ on garde ce point pour les membres publics d&#39;un objet.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Pense « mode d&#39;emploi » : la partie <code>public<\/code> est ce que l&#39;utilisateur de la classe a le droit de toucher, la partie <code>private<\/code> est la cuisine interne. Toutes les méthodes de la classe, elles, voient tout.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Oublier le <strong>point-virgule<\/strong> après l&#39;accolade fermante de la classe : <code>class point { ... };<\/code>. Et confondre la déclaration (dans la classe) avec la définition <code>void point::deplacer(...)<\/code>, qui demande l&#39;opérateur <code>::<\/code>.<\/p>\n<\/aside><p>À la fin, tu sais écrire une classe complète, prévoir l&#39;ordre d&#39;appel des constructeurs et destructeurs, et utiliser un compteur d&#39;objets statique.<\/p>\n<h2>Idée 1 · Déclarer, définir, utiliser une classe<\/h2>\n<svg viewBox=\"0 0 640 170\" style=\"width:100%;max-width:640px;display:block;margin:10px auto\" role=\"img\" aria-label=\"La classe point a une partie privée x y et une partie publique avec point, deplacer et afficher ; l'utilisateur ne voit que la partie publique\">\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\">\n<rect x=\"20\" y=\"15\" width=\"300\" height=\"140\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<text x=\"35\" y=\"38\" font-weight=\"700\">class point<\/text>\n<rect x=\"35\" y=\"50\" width=\"120\" height=\"90\" fill=\"none\" stroke=\"currentColor\" stroke-dasharray=\"5 4\"/>\n<text x=\"45\" y=\"72\">private :<\/text><text x=\"45\" y=\"95\">int x ;<\/text><text x=\"45\" y=\"115\">int y ;<\/text>\n<rect x=\"170\" y=\"50\" width=\"135\" height=\"90\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/>\n<text x=\"180\" y=\"72\" fill=\"#D9824F\" font-weight=\"700\">public :<\/text><text x=\"180\" y=\"95\">point(int,int)<\/text><text x=\"180\" y=\"113\">deplacer(int,int)<\/text><text x=\"180\" y=\"131\">afficher()<\/text>\n<line x1=\"470\" y1=\"95\" x2=\"310\" y2=\"95\" stroke=\"#D9824F\" stroke-width=\"2\"/>\n<polygon points=\"310,95 322,89 322,101\" fill=\"#D9824F\"/>\n<text x=\"400\" y=\"85\" text-anchor=\"middle\">main()<\/text>\n<text x=\"400\" y=\"115\" text-anchor=\"middle\">a.afficher() : oui<\/text>\n<text x=\"400\" y=\"135\" text-anchor=\"middle\">a.x = 3 : non<\/text>\n<\/g><\/svg><pre class=\"\"><code>#include &lt;iostream&gt;\nusing namespace std;\nclass point {               // déclaration\n    int x, y;               // privés par défaut dans une class\npublic:\n    point(int, int);        // constructeur\n    void deplacer(int, int);\n    void afficher();\n};                          // point-virgule indispensable\npoint::point(int abs, int ord) { x = abs; y = ord; }      // définitions\nvoid point::deplacer(int dx, int dy) { x = x + dx; y = y + dy; }\nvoid point::afficher() { cout &lt;&lt; &quot;Je suis en &quot; &lt;&lt; x &lt;&lt; &quot; &quot; &lt;&lt; y &lt;&lt; &quot;\\n&quot;; }\nint main() {\n    point a(5, 2), b(1, -1);\n    a.afficher();\n    a.deplacer(-2, 4);\n    a.afficher();\n    b.afficher();\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Je suis en 5 2\nJe suis en 3 6\nJe suis en 1 -1<\/code><\/pre><figure class=\"grille\"><figcaption>Niveaux d'accès<\/figcaption><table><tr><th>Mot-clé<\/th><th>Qui y accède ?<\/th><\/tr><tr><td>public<\/td><td>tout le monde<\/td><\/tr><tr><td>private<\/td><td>seulement les membres de la classe (et ses amies)<\/td><\/tr><tr><td>protected<\/td><td>la classe et ses classes dérivées<\/td><\/tr><tr><td>friend<\/td><td>les fonctions déclarées amies<\/td><\/tr><\/table><\/figure><p>En pratique, on sépare : la <strong>déclaration<\/strong> dans <code>point.h<\/code>, les <strong>définitions<\/strong> dans <code>point.cpp<\/code>, l&#39;<strong>utilisation<\/strong> dans le programme qui fait <code>#include &quot;point.h&quot;<\/code>.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Les diapos incluent <code>&quot;point.cpp&quot;<\/code> dans le programme de test. Ça marche pour un petit exemple, mais la bonne pratique est d&#39;inclure le <code>.h<\/code> et de compiler les deux <code>.cpp<\/code> ensemble (<code>g++ point.cpp test.cpp<\/code>).<\/p>\n<\/aside><p><code>b = a;<\/code> recopie membre à membre tous les champs, même privés.<\/p>\n<h2>Idée 2 · Constructeur et destructeur<\/h2>\n<p>Le <strong>constructeur<\/strong> porte le nom de la classe, n&#39;a pas de type de retour, et s&#39;exécute à chaque création d&#39;objet. Le <strong>destructeur<\/strong> <code>~classe()<\/code> s&#39;exécute à sa destruction. On peut <strong>surdéfinir<\/strong> le constructeur, pas le destructeur (il n&#39;a pas d&#39;argument).<\/p>\n<pre class=\"\"><code>#include &lt;iostream&gt;\nusing namespace std;\nclass test {\npublic:\n    int num;\n    test(int n) { num = n; cout &lt;&lt; &quot;++ Appel constructeur - num = &quot; &lt;&lt; num &lt;&lt; &quot;\\n&quot;; }\n    ~test()     { cout &lt;&lt; &quot;-- Appel destructeur - num = &quot; &lt;&lt; num &lt;&lt; &quot;\\n&quot;; }\n};\nvoid fct(int p) { test x(p); }      // x détruit à la sortie de fct\nint main() {\n    test a(1);\n    fct(2);\n    return 0;                       // a détruit ici\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>++ Appel constructeur - num = 1\n++ Appel constructeur - num = 2\n-- Appel destructeur - num = 2\n-- Appel destructeur - num = 1<\/code><\/pre><figure class=\"etapes\" data-i=\"0\"><figcaption>Durée de vie des objets<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Automatique<\/div><p>déclaré dans une fonction ou un bloc ; détruit à la sortie du bloc.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Statique<\/div><p>déclaré hors de toute fonction ou avec <code>static<\/code> ; créé avant main, détruit après.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Temporaire<\/div><p><code>a = point(1, 2);<\/code> crée un objet sans nom, détruit dès qu&#39;il ne sert plus.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Dynamique<\/div><p><code>adr = new point(1, 4);<\/code> ; vit jusqu&#39;au <code>delete adr;<\/code>.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Si le constructeur fait un <code>new<\/code>, le destructeur doit faire le <code>delete<\/code> correspondant (exemple du cours : la classe <code>tableau<\/code> alloue <code>new int[taille]<\/code> et libère par <code>delete[] tab<\/code>).<\/p>\n<\/aside><h2>Idée 3 · Membres statiques : un exemplaire pour toute la classe<\/h2>\n<p>Un membre donnée <code>static<\/code> existe <strong>en un seul exemplaire<\/strong>, partagé par tous les objets. Il s&#39;initialise hors de la classe : <code>int point::ctr = 0;<\/code>. Une fonction membre <code>static<\/code> ne travaille que sur les membres statiques et s&#39;appelle sans objet : <code>point::compte();<\/code>.<\/p>\n<pre class=\"\"><code>#include &lt;iostream&gt;\nusing namespace std;\nclass point {\n    static int ctr;          // compteur partagé\n    int x, y;\npublic:\n    point()  { x = y = 0; cout &lt;&lt; &quot;++ construction : il y a maintenant &quot; &lt;&lt; ++ctr &lt;&lt; &quot; objets\\n&quot;; }\n    ~point() { cout &lt;&lt; &quot;-- destruction : il reste maintenant &quot; &lt;&lt; --ctr &lt;&lt; &quot; objets\\n&quot;; }\n    static void compte() { cout &lt;&lt; &quot;appel compte : il y a &quot; &lt;&lt; ctr &lt;&lt; &quot; objets\\n&quot;; }\n};\nint point::ctr = 0;          // initialisation obligatoire, hors de la classe\nvoid fct() { point u, v; }\nint main() {\n    point::compte();\n    point a;\n    point::compte();\n    fct();\n    point::compte();\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>appel compte : il y a 0 objets\n++ construction : il y a maintenant 1 objets\nappel compte : il y a 1 objets\n++ construction : il y a maintenant 2 objets\n++ construction : il y a maintenant 3 objets\n-- destruction : il reste maintenant 2 objets\n-- destruction : il reste maintenant 1 objets\nappel compte : il y a 1 objets\n-- destruction : il reste maintenant 0 objets<\/code><\/pre><h2>Idée 4 · Méthodes constantes et pointeur this<\/h2>\n<ul>\n<li><code>void affiche() const;<\/code> promet de ne pas modifier l&#39;objet. Sur un <strong>objet constant<\/strong>, seules les méthodes <code>const<\/code> sont appelables.<\/li>\n<li><code>this<\/code> est un pointeur sur l&#39;objet qui a appelé la méthode. <code>*this<\/code> est l&#39;objet lui-même.<\/li>\n<\/ul>\n<pre class=\"\"><code>#include &lt;iostream&gt;\nusing namespace std;\nclass point {\n    int x, y;\npublic:\n    point(int abs = 0, int ord = 0) { x = abs; y = ord; }\n    void affiche() const { cout &lt;&lt; this-&gt;x &lt;&lt; &quot; &quot; &lt;&lt; y &lt;&lt; &quot;\\n&quot;; }   // this-&gt;x = x\n    int coincide(const point &amp;pt) const { return pt.x == x &amp;&amp; pt.y == y; }\n};\nint main() {\n    const point c(3, 4);\n    c.affiche();                     // OK : affiche est const\n    point a, b(1), d(1, 0);\n    cout &lt;&lt; &quot;a et b : &quot; &lt;&lt; a.coincide(b) &lt;&lt; &quot;\\n&quot;;\n    cout &lt;&lt; &quot;b et d : &quot; &lt;&lt; b.coincide(d) &lt;&lt; &quot;\\n&quot;;\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>3 4\na et b : 0\nb et d : 1<\/code><\/pre><p>Remarque la « dissymétrie » de <code>coincide<\/code> : <code>pt.x<\/code> est le x de l&#39;argument, <code>x<\/code> tout seul est celui de l&#39;objet appelant (<code>this-&gt;x<\/code>). Une méthode accède aux membres privés de <strong>tous<\/strong> les objets de sa classe.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Les diapos écrivent <code>void affiche(char *message)<\/code> puis appellent <code>affiche(&quot;Point b - &quot;)<\/code>. En C++ moderne, une chaîne littérale est constante : écris <code>const char *message<\/code>, sinon g++ signale l&#39;erreur (ou un avertissement).<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices du TD1 (classe point)<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>(TD1, ex. 1.7) Écris la déclaration de la classe point : coordonnées float privées, constructeur, <code>deplace<\/code>, <code>affiche<\/code>, <code>distance<\/code> (à l&#39;origine), <code>abscisse<\/code> et <code>ordonnee<\/code>.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>class point { float x, y; public: point(float, float); void deplace(float, float); void affiche(); float distance(); float abscisse(); float ordonnee(); };<\/code> Définitions : <code>point::point(float a, float b){ x=a; y=b; }<\/code>, <code>float point::distance(){ return sqrt(x*x + y*y); }<\/code> (avec <code>&lt;cmath&gt;<\/code>), <code>float point::abscisse(){ return x; }<\/code>…<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>(TD1, ex. 1.8) Modifie point pour que <code>affiche<\/code> donne aussi le nombre d&#39;objets point existants.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Un compteur commun à tous les objets.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Ajoute <code>static int nb;<\/code> dans la classe et <code>int point::nb = 0;<\/code> dehors. Le constructeur fait <code>nb++<\/code>, le destructeur <code>nb--<\/code>, et affiche écrit <code>&quot;nombre de points : &quot; &lt;&lt; nb<\/code>. Sans destructeur, le compteur donnerait le nombre d&#39;objets <strong>créés<\/strong>, pas existants.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Combien de lignes « ++ » et « -- » affiche le programme de l&#39;idée 2 si on ajoute <code>fct(3);<\/code> après <code>fct(2);<\/code> ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 6<\/b><\/p><p>Trois constructions (1, 2, 3) et trois destructions : 6 lignes. Ordre : ++1, ++2, --2, ++3, --3, --1.<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Dans <code>class point { int x; public: ... };<\/code>, x est :<\/div><button class=\"opt\" data-o=\"0\">privé<\/button><button class=\"opt\" data-o=\"1\">public<\/button><button class=\"opt\" data-o=\"2\">protégé<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Quelle écriture définit la méthode afficher hors de la classe ?<\/div><button class=\"opt\" data-o=\"0\"><code>void afficher::point() {...}<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>void point::afficher() {...}<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>point.afficher() {...}<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Le constructeur d&#39;une classe :<\/div><button class=\"opt\" data-o=\"0\">Renvoie void<\/button><button class=\"opt\" data-o=\"1\">N&#39;a pas de type de retour<\/button><button class=\"opt\" data-o=\"2\">Renvoie un objet de la classe<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Ordre d&#39;affichage pour <code>test a(1); fct(2);<\/code> où fct crée <code>test x(2)<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">++1, ++2, --1, --2<\/button><button class=\"opt\" data-o=\"1\">++1, ++2, --2, --1<\/button><button class=\"opt\" data-o=\"2\">++2, ++1, --1, --2<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Combien d&#39;exemplaires d&#39;un membre <code>static int ctr<\/code> existe-t-il pour 10 objets ?<\/div><button class=\"opt\" data-o=\"0\">1<\/button><button class=\"opt\" data-o=\"1\">10<\/button><button class=\"opt\" data-o=\"2\">0 tant qu&#39;il n&#39;est pas initialisé dans le constructeur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Où initialise-t-on <code>static int ctr;<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">Dans le constructeur<\/button><button class=\"opt\" data-o=\"1\">Hors de la classe : <code>int point::ctr = 0;<\/code><\/button><button class=\"opt\" data-o=\"2\">Dans main<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Une fonction membre statique :<\/div><button class=\"opt\" data-o=\"0\">Peut utiliser this<\/button><button class=\"opt\" data-o=\"1\">Peut être appelée sans aucun objet<\/button><button class=\"opt\" data-o=\"2\">Doit être virtuelle<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Sur un objet <code>const point c;<\/code>, on peut appeler :<\/div><button class=\"opt\" data-o=\"0\">Toutes les méthodes publiques<\/button><button class=\"opt\" data-o=\"1\">Seulement les méthodes déclarées const<\/button><button class=\"opt\" data-o=\"2\">Aucune méthode<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Que vaut <code>this<\/code> dans une méthode ?<\/div><button class=\"opt\" data-o=\"0\">L&#39;objet lui-même<\/button><button class=\"opt\" data-o=\"1\">L&#39;adresse de l&#39;objet appelant<\/button><button class=\"opt\" data-o=\"2\">L&#39;adresse de la classe<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\"><code>point a(5,2), b(1,1); b = a;<\/code> :<\/div><button class=\"opt\" data-o=\"0\">Est interdit car x et y sont privés<\/button><button class=\"opt\" data-o=\"1\">Recopie x et y de a dans b<\/button><button class=\"opt\" data-o=\"2\">Fait de b une référence à a<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"classes-objets","rep":null,"tol":null},{"n":"classes-objets","rep":null,"tol":null},{"n":"classes-objets","rep":null,"tol":null},{"n":"classes-objets","rep":["6"],"tol":null}],"qcm":[{"n":"classes-objets","q":"Dans <code>class point { int x; public: ... };<\/code>, x est :","o":["privé","public","protégé"],"a":0,"e":"Dans une class, l&#39;accès par défaut est private."},{"n":"classes-objets","q":"Quelle écriture définit la méthode afficher hors de la classe ?","o":["<code>void afficher::point() {...}<\/code>","<code>void point::afficher() {...}<\/code>","<code>point.afficher() {...}<\/code>"],"a":1,"e":"Classe, deux-points doubles, puis nom de la méthode."},{"n":"classes-objets","q":"Le constructeur d&#39;une classe :","o":["Renvoie void","N&#39;a pas de type de retour","Renvoie un objet de la classe"],"a":1,"e":"On n&#39;écrit aucun type de retour, même pas void."},{"n":"classes-objets","q":"Ordre d&#39;affichage pour <code>test a(1); fct(2);<\/code> où fct crée <code>test x(2)<\/code> ?","o":["++1, ++2, --1, --2","++1, ++2, --2, --1","++2, ++1, --1, --2"],"a":1,"e":"x est détruit à la sortie de fct, a à la fin de main."},{"n":"classes-objets","q":"Combien d&#39;exemplaires d&#39;un membre <code>static int ctr<\/code> existe-t-il pour 10 objets ?","o":["1","10","0 tant qu&#39;il n&#39;est pas initialisé dans le constructeur"],"a":0,"e":"Un membre statique est partagé par toute la classe."},{"n":"classes-objets","q":"Où initialise-t-on <code>static int ctr;<\/code> ?","o":["Dans le constructeur","Hors de la classe : <code>int point::ctr = 0;<\/code>","Dans main"],"a":1,"e":"C&#39;est une définition à part, hors de la déclaration de classe."},{"n":"classes-objets","q":"Une fonction membre statique :","o":["Peut utiliser this","Peut être appelée sans aucun objet","Doit être virtuelle"],"a":1,"e":"Elle ne dépend d&#39;aucun objet, donc pas de this."},{"n":"classes-objets","q":"Sur un objet <code>const point c;<\/code>, on peut appeler :","o":["Toutes les méthodes publiques","Seulement les méthodes déclarées const","Aucune méthode"],"a":1,"e":"Une méthode const promet de ne pas modifier l&#39;objet."},{"n":"classes-objets","q":"Que vaut <code>this<\/code> dans une méthode ?","o":["L&#39;objet lui-même","L&#39;adresse de l&#39;objet appelant","L&#39;adresse de la classe"],"a":1,"e":"this est un pointeur ; *this est l&#39;objet."},{"n":"classes-objets","q":"<code>point a(5,2), b(1,1); b = a;<\/code> :","o":["Est interdit car x et y sont privés","Recopie x et y de a dans b","Fait de b une référence à a"],"a":1,"e":"L&#39;affectation par défaut recopie tous les membres, même privés."}]},{"id":"recopie-objets-membres","t":"Constructeur de recopie, objets membres et liste d'initialisation","seance":"Partie II · Initialisation des objets","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut maîtriser le constructeur, le destructeur et new/delete (chapitres 2 et 3).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Une classe <code>vect<\/code> fait <code>adr = new double[n];<\/code> dans son constructeur. Que doit contenir son destructeur ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>delete[] adr;<\/code> : chaque new[] du constructeur doit être libéré par un delete[] dans le destructeur, sinon fuite de mémoire.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Dès qu&#39;une classe contient un <strong>pointeur vers une zone dynamique<\/strong>, pose-toi trois questions : que se passe-t-il quand on <strong>copie<\/strong> l&#39;objet ? quand on <strong>l&#39;affecte<\/strong> ? quand on <strong>le détruit<\/strong> ? Ce chapitre traite la copie ; l&#39;affectation vient au chapitre 5.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>La copie par défaut recopie <strong>le pointeur<\/strong>, pas le tableau pointé. Deux objets partagent alors le même tableau, et les deux destructeurs le libèrent : double delete, plantage.<\/p>\n<\/aside><p>À la fin, tu sais quand le constructeur de recopie est appelé, pourquoi l&#39;écrire, et comment initialiser des objets membres avec la syntaxe <code>: centre(abs, ord)<\/code>.<\/p>\n<h2>Idée 1 · Les trois appels du constructeur de recopie<\/h2>\n<p>Le constructeur de recopie a pour prototype <code>classe(const classe &amp;)<\/code>. Il crée un objet <strong>neuf<\/strong> à partir d&#39;un objet existant de même type.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Quand est-il appelé ?<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · 1. Initialisation<\/div><p><code>point b = a;<\/code> ou <code>point b(a);<\/code><\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · 2. Passage par valeur<\/div><p><code>void fct(vect b)<\/code> appelée par <code>fct(a)<\/code> : b est une copie de a.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · 3. Retour par valeur<\/div><p><code>return res;<\/code> dans une fonction qui renvoie un objet (le compilateur peut supprimer cette copie).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Pas lui !<\/div><p><code>b = a;<\/code> entre deux objets <strong>déjà existants<\/strong> appelle l&#39;opérateur =, pas le constructeur de recopie.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Pourquoi <code>const classe &amp;<\/code> et pas <code>classe<\/code> ? Si l&#39;argument était passé par valeur, il faudrait… le copier, donc appeler le constructeur de recopie, à l&#39;infini.<\/p>\n<\/aside><h2>Idée 2 · Le danger de la recopie par défaut<\/h2>\n<svg viewBox=\"0 0 640 170\" style=\"width:100%;max-width:640px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Copie par défaut : a et b pointent vers le même tableau. Copie écrite : b a son propre tableau\">\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\">\n<text x=\"160\" y=\"18\" font-weight=\"700\">Recopie par défaut<\/text>\n<rect x=\"30\" y=\"35\" width=\"80\" height=\"34\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"70\" y=\"57\">a.adr<\/text>\n<rect x=\"30\" y=\"105\" width=\"80\" height=\"34\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"70\" y=\"127\">b.adr<\/text>\n<rect x=\"190\" y=\"70\" width=\"110\" height=\"34\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/><text x=\"245\" y=\"92\">tableau<\/text>\n<line x1=\"110\" y1=\"52\" x2=\"190\" y2=\"82\" stroke=\"#D9824F\" stroke-width=\"2\"/><line x1=\"110\" y1=\"122\" x2=\"190\" y2=\"94\" stroke=\"#D9824F\" stroke-width=\"2\"/>\n<text x=\"160\" y=\"162\" fill=\"#D9824F\">un seul tableau, deux delete<\/text>\n<text x=\"490\" y=\"18\" font-weight=\"700\">Recopie écrite<\/text>\n<rect x=\"360\" y=\"35\" width=\"80\" height=\"34\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"400\" y=\"57\">a.adr<\/text>\n<rect x=\"360\" y=\"105\" width=\"80\" height=\"34\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"400\" y=\"127\">b.adr<\/text>\n<rect x=\"510\" y=\"35\" width=\"110\" height=\"34\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"565\" y=\"57\">tableau 1<\/text>\n<rect x=\"510\" y=\"105\" width=\"110\" height=\"34\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"565\" y=\"127\">tableau 2 (copie)<\/text>\n<line x1=\"440\" y1=\"52\" x2=\"510\" y2=\"52\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"440\" y1=\"122\" x2=\"510\" y2=\"122\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<text x=\"490\" y=\"162\">chacun libère le sien<\/text>\n<\/g><\/svg><p>L&#39;exemple du cours : <code>vect a(5); fct(a);<\/code> avec <code>void fct(vect b)<\/code>. Sans recopie écrite, b copie le pointeur de a ; à la sortie de fct, le destructeur de b libère le tableau de a. Voici la version corrigée, avec une recopie profonde.<\/p>\n<pre class=\"\"><code>#include &lt;iostream&gt;\nusing namespace std;\nclass vect {\n    int nelem;\n    double *adr;\npublic:\n    vect(int n) { adr = new double[nelem = n]; cout &lt;&lt; &quot;+ const. usuel\\n&quot;; }\n    vect(const vect &amp;v) {                      // constructeur de recopie\n        nelem = v.nelem;\n        adr = new double[nelem];               // nouveau tableau\n        for (int i = 0; i &lt; nelem; i++) adr[i] = v.adr[i];\n        cout &lt;&lt; &quot;+ const. recopie\\n&quot;;\n    }\n    ~vect() { cout &lt;&lt; &quot;- destr.\\n&quot;; delete[] adr; }\n};\nvoid fct(vect b) { cout &lt;&lt; &quot;*** appel de fct ***\\n&quot;; }\nint main() {\n    vect a(5);\n    fct(a);\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>+ const. usuel\n+ const. recopie\n*** appel de fct ***\n- destr.\n- destr.<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Les diapos libèrent le tableau avec <code>delete adr;<\/code>. Pour une zone allouée par <code>new double[...]<\/code>, il faut <code>delete[] adr;<\/code>. Les adresses affichées dans les diapos (006AFDE4…) dépendent de la machine : on ne les reproduit pas.<\/p>\n<\/aside><h2>Idée 3 · Objet renvoyé par valeur<\/h2>\n<pre class=\"\"><code>#include &lt;iostream&gt;\nusing namespace std;\nclass point {\n    int x, y;\npublic:\n    point(int abs = 0, int ord = 0) { x = abs; y = ord; cout &lt;&lt; &quot;++ usuel &quot; &lt;&lt; x &lt;&lt; &quot; &quot; &lt;&lt; y &lt;&lt; &quot;\\n&quot;; }\n    point(const point &amp;p) { x = p.x; y = p.y; cout &lt;&lt; &quot;++ recopie &quot; &lt;&lt; x &lt;&lt; &quot; &quot; &lt;&lt; y &lt;&lt; &quot;\\n&quot;; }\n    ~point() { cout &lt;&lt; &quot;-- destr &quot; &lt;&lt; x &lt;&lt; &quot; &quot; &lt;&lt; y &lt;&lt; &quot;\\n&quot;; }\n    point symetrique() { point res; res.x = -x; res.y = -y; return res; }\n};\nint main() {\n    point a(1, 3), b;\n    cout &lt;&lt; &quot;** avant appel\\n&quot;;\n    b = a.symetrique();\n    cout &lt;&lt; &quot;** apres appel\\n&quot;;\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>++ usuel 1 3\n++ usuel 0 0\n** avant appel\n++ usuel 0 0\n-- destr -1 -3\n** apres appel\n-- destr -1 -3\n-- destr 1 3<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Dans les diapos, on voit en plus « ++ Appel Const. recopie -1 -3 » suivi d&#39;une destruction : c&#39;est la copie de <code>res<\/code> vers un objet temporaire. Les compilateurs actuels (g++ en C++17) <strong>suppriment<\/strong> souvent cette copie (« élision de copie »). À l&#39;examen, raisonne comme le prof : un retour par valeur <strong>peut<\/strong> appeler le constructeur de recopie.<\/p>\n<\/aside><p>Remarque : <code>point a = 3;<\/code> équivaut à <code>point a(3);<\/code> (constructeur à un argument), et <code>point b = a;<\/code> équivaut à <code>point b(a);<\/code> (recopie).<\/p>\n<h2>Idée 4 · Objets membres et liste d&#39;initialisation<\/h2>\n<p>Une classe peut contenir un objet d&#39;une autre classe. Son constructeur se choisit <strong>dans l&#39;en-tête<\/strong> du constructeur englobant, après les deux-points.<\/p>\n<pre class=\"\"><code>#include &lt;iostream&gt;\nusing namespace std;\nclass point {\n    int x, y;\npublic:\n    point(int abs, int ord) : x(abs), y(ord) { cout &lt;&lt; &quot;Constr. point &quot; &lt;&lt; x &lt;&lt; &quot; &quot; &lt;&lt; y &lt;&lt; &quot;\\n&quot;; }\n    ~point() { cout &lt;&lt; &quot;Destr. point\\n&quot;; }\n};\nclass cercle {\n    point centre;          // objet membre\n    int rayon;\npublic:\n    cercle(int abs, int ord, int ray) : centre(abs, ord) {\n        rayon = ray;\n        cout &lt;&lt; &quot;Constr. cercle &quot; &lt;&lt; rayon &lt;&lt; &quot;\\n&quot;;\n    }\n    ~cercle() { cout &lt;&lt; &quot;Destr. cercle\\n&quot;; }\n};\nint main() {\n    cercle c(1, 2, 5);\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Constr. point 1 2\nConstr. cercle 5\nDestr. cercle\nDestr. point<\/code><\/pre><figure class=\"flux\"><figcaption>Ordre de construction puis de destruction<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">membre centre<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">corps de cercle<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">...<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">~cercle<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">~point<\/div><\/div><\/figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Les objets membres sont <strong>construits avant<\/strong> le corps du constructeur englobant et <strong>détruits après<\/strong> son destructeur. La liste d&#39;initialisation sert aussi pour les membres simples : <code>point(int abs=0, int ord=0) : x(abs), y(ord) {}<\/code>.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>S&#39;entraîner<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Dans <code>vect a(5); vect b = a; vect c(3); c = a;<\/code>, combien de fois le constructeur de recopie est-il appelé ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1<\/b><\/p><p>Seulement pour <code>vect b = a;<\/code> (création). <code>c = a;<\/code> affecte un objet déjà existant : c&#39;est l&#39;opérateur =.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Pourquoi le prototype <code>vect(vect v)<\/code> est-il refusé pour un constructeur de recopie ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Passer v par valeur demanderait de copier l&#39;argument, donc d&#39;appeler… le constructeur de recopie lui-même : récursion infinie. Il faut une référence, de préférence <code>const vect &amp;<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Écris le constructeur d&#39;une classe <code>segment<\/code> contenant deux objets membres <code>point debut, fin;<\/code> (point n&#39;a qu&#39;un constructeur <code>point(int,int)<\/code>).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>segment(int x1, int y1, int x2, int y2) : debut(x1, y1), fin(x2, y2) {}<\/code>. Sans cette liste, le compilateur chercherait un constructeur <code>point()<\/code> sans argument, qui n&#39;existe pas : erreur.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quel est le prototype usuel du constructeur de recopie de point ?<\/div><button class=\"opt\" data-o=\"0\"><code>point(point p);<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>point(const point &amp;p);<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>point operator=(const point &amp;p);<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Lequel n&#39;appelle PAS le constructeur de recopie ?<\/div><button class=\"opt\" data-o=\"0\"><code>point b = a;<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>fct(a);<\/code> avec <code>void fct(point p)<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>b = a;<\/code> avec b déjà déclaré<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Quand la recopie par défaut pose-t-elle problème ?<\/div><button class=\"opt\" data-o=\"0\">Quand la classe a des membres int<\/button><button class=\"opt\" data-o=\"1\">Quand la classe contient un pointeur vers une zone allouée dynamiquement<\/button><button class=\"opt\" data-o=\"2\">Jamais<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\"><code>void fct(point p)<\/code> appelée avec <code>fct(a)<\/code> : combien de destructeurs s&#39;exécutent à la fin de main ?<\/div><button class=\"opt\" data-o=\"0\">1<\/button><button class=\"opt\" data-o=\"1\">2<\/button><button class=\"opt\" data-o=\"2\">3<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Dans un constructeur de recopie profonde de vect, on doit :<\/div><button class=\"opt\" data-o=\"0\">Allouer un nouveau tableau et recopier les éléments<\/button><button class=\"opt\" data-o=\"1\">Copier le pointeur adr<\/button><button class=\"opt\" data-o=\"2\">Appeler delete[] v.adr<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Comment initialiser l&#39;objet membre centre dans cercle ?<\/div><button class=\"opt\" data-o=\"0\"><code>cercle(int a, int o, int r) { centre(a, o); }<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>cercle(int a, int o, int r) : centre(a, o) { ... }<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>cercle(int a, int o, int r) : point(a, o) { ... }<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Ordre d&#39;affichage pour <code>cercle c(1,2,5);<\/code> puis fin de main ?<\/div><button class=\"opt\" data-o=\"0\">Constr. point, Constr. cercle, Destr. cercle, Destr. point<\/button><button class=\"opt\" data-o=\"1\">Constr. cercle, Constr. point, Destr. point, Destr. cercle<\/button><button class=\"opt\" data-o=\"2\">Constr. point, Constr. cercle, Destr. point, Destr. cercle<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Un objet créé par <code>new point(1,4)<\/code> est détruit :<\/div><button class=\"opt\" data-o=\"0\">À la fin du bloc<\/button><button class=\"opt\" data-o=\"1\">À la fin de main<\/button><button class=\"opt\" data-o=\"2\">Par <code>delete<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Que crée <code>a = point(1, 2);<\/code> ?<\/div><butto
