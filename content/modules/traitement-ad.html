 à une position précise ?</div><button class=\"opt\" data-o=\"0\"><code>assign</code></button><button class=\"opt\" data-o=\"1\"><code>insert</code></button><button class=\"opt\" data-o=\"2\"><code>concat</code></button><button class=\"opt\" data-o=\"3\"><code>rename</code></button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\"><code>df.sum(axis=1)</code> renvoie :</div><button class=\"opt\" data-o=\"0\">une somme par colonne</button><button class=\"opt\" data-o=\"1\">une somme par ligne</button><button class=\"opt\" data-o=\"2\">la somme totale</button><button class=\"opt\" data-o=\"3\">une erreur</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Comment ajouter les lignes de df2 sous df1 en Pandas 2 et plus ?</div><button class=\"opt\" data-o=\"0\"><code>df1.append(df2)</code></button><button class=\"opt\" data-o=\"1\"><code>pd.concat([df1, df2])</code></button><button class=\"opt\" data-o=\"2\"><code>df1 + df2</code></button><button class=\"opt\" data-o=\"3\"><code>df1.merge(df2)</code></button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Quel filtre est correct ?</div><button class=\"opt\" data-o=\"0\"><code>df[df.Age &gt; 20 and df.Salaire &gt; 9000]</code></button><button class=\"opt\" data-o=\"1\"><code>df[(df.Age &gt; 20) &amp; (df.Salaire &gt; 9000)]</code></button><button class=\"opt\" data-o=\"2\"><code>df[df.Age &gt; 20 &amp; df.Salaire &gt; 9000]</code></button><button class=\"opt\" data-o=\"3\"><code>df.loc[df.Age &gt; 20, df.Salaire &gt; 9000]</code></button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\"><code>pd.Series([1, 2], index=[0, 2]).reindex([0, 1, 2], method=&quot;ffill&quot;)</code> vaut :</div><button class=\"opt\" data-o=\"0\"><code>[1, 1, 2]</code></button><button class=\"opt\" data-o=\"1\"><code>[1, 2, 2]</code></button><button class=\"opt\" data-o=\"2\"><code>[1, NaN, 2]</code></button><button class=\"opt\" data-o=\"3\"><code>[1, 0, 2]</code></button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Quelle boucle est la plus rapide et garde les types ?</div><button class=\"opt\" data-o=\"0\"><code>iterrows()</code></button><button class=\"opt\" data-o=\"1\"><code>itertuples()</code></button><button class=\"opt\" data-o=\"2\"><code>for col in df</code></button><button class=\"opt\" data-o=\"3\"><code>items()</code></button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\"><code>df.apply(f, axis=1)</code> envoie à f :</div><button class=\"opt\" data-o=\"0\">chaque colonne</button><button class=\"opt\" data-o=\"1\">chaque ligne</button><button class=\"opt\" data-o=\"2\">chaque case</button><button class=\"opt\" data-o=\"3\">le DataFrame entier</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Après <code>groupby(&quot;Ville&quot;)[&quot;Ventes&quot;].transform(&quot;sum&quot;)</code> sur 5 lignes et 2 villes, on obtient :</div><button class=\"opt\" data-o=\"0\">2 valeurs</button><button class=\"opt\" data-o=\"1\">5 valeurs (le total de la ville recopié sur chaque ligne)</button><button class=\"opt\" data-o=\"2\">1 valeur</button><button class=\"opt\" data-o=\"3\">une erreur</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"10\"><div class=\"qq-q\"><code>groupby(&quot;Ville&quot;).filter(lambda g: g[&quot;Ventes&quot;].sum() &gt; 40000)</code> :</div><button class=\"opt\" data-o=\"0\">garde les vendeurs dont les ventes dépassent 40 000</button><button class=\"opt\" data-o=\"1\">garde toutes les lignes des villes dont le total dépasse 40 000</button><button class=\"opt\" data-o=\"2\">renvoie un booléen par ville</button><button class=\"opt\" data-o=\"3\">calcule la somme par ville</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"11\"><div class=\"qq-q\"><code>df[&quot;Ville&quot;].nunique()</code> renvoie :</div><button class=\"opt\" data-o=\"0\">la liste des villes distinctes</button><button class=\"opt\" data-o=\"1\">le nombre de villes distinctes</button><button class=\"opt\" data-o=\"2\">la ville la plus fréquente</button><button class=\"opt\" data-o=\"3\">le nombre de lignes</button><div class=\"qq-e\" hidden></div></div></section>","ex":[],"qcm":[{"n":"pandas-manipulation","q":"<code>df[[&quot;Age&quot;]]</code> renvoie :","o":["une Series","un DataFrame d&#39;une colonne","une liste","une erreur"],"a":1,"e":"Les doubles crochets gardent le format DataFrame, même pour une seule colonne."},{"n":"pandas-manipulation","q":"Après <code>df.drop(columns=[&quot;Age&quot;])</code> (sans réaffectation ni inplace), la colonne Age :","o":["est toujours dans df","est supprimée de df","est mise à NaN","est déplacée à la fin"],"a":0,"e":"drop renvoie une copie ; il faut <code>df = df.drop(...)</code> ou <code>inplace=True</code>."},{"n":"pandas-manipulation","q":"Quelle méthode ajoute une colonne à une position précise ?","o":["<code>assign</code>","<code>insert</code>","<code>concat</code>","<code>rename</code>"],"a":1,"e":"<code>df.insert(loc, nom, valeurs)</code> place la colonne à l&#39;indice loc."},{"n":"pandas-manipulation","q":"<code>df.sum(axis=1)</code> renvoie :","o":["une somme par colonne","une somme par ligne","la somme totale","une erreur"],"a":1,"e":"axis=1 parcourt de gauche à droite : les colonnes sont écrasées, il reste une valeur par ligne."},{"n":"pandas-manipulation","q":"Comment ajouter les lignes de df2 sous df1 en Pandas 2 et plus ?","o":["<code>df1.append(df2)</code>","<code>pd.concat([df1, df2])</code>","<code>df1 + df2</code>","<code>df1.merge(df2)</code>"],"a":1,"e":"<code>append</code> a été supprimé ; on passe une <strong>liste</strong> à <code>pd.concat</code>."},{"n":"pandas-manipulation","q":"Quel filtre est correct ?","o":["<code>df[df.Age &gt; 20 and df.Salaire &gt; 9000]</code>","<code>df[(df.Age &gt; 20) &amp; (df.Salaire &gt; 9000)]</code>","<code>df[df.Age &gt; 20 &amp; df.Salaire &gt; 9000]</code>","<code>df.loc[df.Age &gt; 20, df.Salaire &gt; 9000]</code>"],"a":1,"e":"<code>&amp;</code> avec des parenthèses autour de chaque condition."},{"n":"pandas-manipulation","q":"<code>pd.Series([1, 2], index=[0, 2]).reindex([0, 1, 2], method=&quot;ffill&quot;)</code> vaut :","o":["<code>[1, 1, 2]</code>","<code>[1, 2, 2]</code>","<code>[1, NaN, 2]</code>","<code>[1, 0, 2]</code>"],"a":0,"e":"ffill recopie la dernière valeur connue (1) dans le trou."},{"n":"pandas-manipulation","q":"Quelle boucle est la plus rapide et garde les types ?","o":["<code>iterrows()</code>","<code>itertuples()</code>","<code>for col in df</code>","<code>items()</code>"],"a":1,"e":"itertuples renvoie des namedtuples ; iterrows renvoie des Series (lent, peut convertir les types)."},{"n":"pandas-manipulation","q":"<code>df.apply(f, axis=1)</code> envoie à f :","o":["chaque colonne","chaque ligne","chaque case","le DataFrame entier"],"a":1,"e":"axis=1 : de gauche à droite, une ligne à la fois (pour combiner plusieurs colonnes d&#39;un individu)."},{"n":"pandas-manipulation","q":"Après <code>groupby(&quot;Ville&quot;)[&quot;Ventes&quot;].transform(&quot;sum&quot;)</code> sur 5 lignes et 2 villes, on obtient :","o":["2 valeurs","5 valeurs (le total de la ville recopié sur chaque ligne)","1 valeur","une erreur"],"a":1,"e":"transform garde la taille d&#39;origine ; c&#39;est agg qui réduit à une ligne par groupe."},{"n":"pandas-manipulation","q":"<code>groupby(&quot;Ville&quot;).filter(lambda g: g[&quot;Ventes&quot;].sum() &gt; 40000)</code> :","o":["garde les vendeurs dont les ventes dépassent 40 000","garde toutes les lignes des villes dont le total dépasse 40 000","renvoie un booléen par ville","calcule la somme par ville"],"a":1,"e":"filter garde ou supprime des groupes entiers."},{"n":"pandas-manipulation","q":"<code>df[&quot;Ville&quot;].nunique()</code> renvoie :","o":["la liste des villes distinctes","le nombre de villes distinctes","la ville la plus fréquente","le nombre de lignes"],"a":1,"e":"unique() donne les valeurs, nunique() leur nombre."}]},{"id":"tp-corriges","t":"TP/TD 1 et 2 corrigés pas à pas","seance":"Fiches de TP · A.U. 2026-2027","imp":4,"html":"<p>Les énoncés sont ceux du Pr Madani. Les noms de fonctions gardent <strong>son orthographe</strong> (<code>amstrong</code>) : garde-les tels quels pour coller à l&#39;énoncé.</p>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p>Essaie <strong>d&#39;abord seul</strong> chaque exercice (15 min max), puis compare. Recopier un corrigé ne fait pas progresser.</p>\n</aside><h2>TP/TD 1 · Exercice 1 : nombres d&#39;Armstrong</h2>\n<p>Un nombre est d&#39;Armstrong s&#39;il est égal à la somme de ses chiffres <strong>élevés à la puissance du nombre de chiffres</strong> : 153 = 1³ + 5³ + 3³. Contrainte : <strong>ne jamais convertir en chaîne</strong>.</p>\n<p>Les deux outils : <code>n % 10</code> donne le <strong>dernier chiffre</strong>, <code>n // 10</code> <strong>enlève</strong> le dernier chiffre.</p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Éplucher 153 chiffre par chiffre</figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Tour 1</div><p>153 % 10 = <strong>3</strong>, puis 153 // 10 = 15</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Tour 2</div><p>15 % 10 = <strong>5</strong>, puis 15 // 10 = 1</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Tour 3</div><p>1 % 10 = <strong>1</strong>, puis 1 // 10 = 0 → on s&#39;arrête</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Bilan</div><p>3 chiffres ; 3³ + 5³ + 1³ = 27 + 125 + 1 = 153 → Armstrong</p>\n</div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><pre class=\"\"><code>def nombre_chiffres(nombre):\n    nombre = abs(nombre)\n    if nombre == 0:            # 0 a un chiffre, mais la boucle ne tournerait pas\n        return 1\n    n = 0\n    while nombre &gt; 0:\n        nombre //= 10\n        n += 1\n    return n\n\ndef calcul_nombre_amstrong(x):\n    p = nombre_chiffres(x)     # calculé UNE fois, avant la boucle\n    s = 0\n    while x &gt; 0:\n        s += (x % 10) ** p\n        x //= 10\n    return s\n\ndef est_un_nombre_amstrong(nombre):\n    return nombre &gt;= 0 and calcul_nombre_amstrong(nombre) == nombre\n\ndef afficher_nombres_amstrong(liste):\n    return [n for n in liste if est_un_nombre_amstrong(n)]\n\nprint(afficher_nombres_amstrong([153, 154, 1634, 9474, 10, 370, 0, 5]))</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>[153, 1634, 9474, 370, 0, 5]</code></pre><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>Si tu appelles <code>nombre_chiffres(x)</code> <strong>dans</strong> la boucle, <code>x</code> rétrécit à chaque tour et la puissance change en cours de route : résultat faux. Et sans le cas <code>0</code>, <code>nombre_chiffres(0)</code> renvoie 0.</p>\n</aside><h2>Exercice 2 : <code>changer_car</code> sans <code>replace</code></h2>\n<p>Une chaîne est <strong>immuable</strong> : on construit une nouvelle chaîne. <code>debut</code> et <code>fin</code> sont optionnels → valeurs par défaut (<code>fin=None</code>, car <code>len(chaine)</code> n&#39;existe pas encore au moment de la définition).</p>\n<pre class=\"\"><code>def changer_car(chaine, car1, car2, debut=0, fin=None):\n    if fin is None or fin &gt;= len(chaine):\n        fin = len(chaine) - 1\n    resultat = &quot;&quot;\n    for i in range(len(chaine)):\n        if debut &lt;= i &lt;= fin and chaine[i] == car1:\n            resultat += car2\n        else:\n            resultat += chaine[i]\n    return resultat\n\nprint(changer_car(&quot;banane&quot;, &quot;a&quot;, &quot;o&quot;), changer_car(&quot;banane&quot;, &quot;a&quot;, &quot;o&quot;, 2), changer_car(&quot;banane&quot;, &quot;a&quot;, &quot;o&quot;, 0, 1))</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>bonone banone bonane</code></pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>« Se terminant à l&#39;indice fin » : ici <code>fin</code> est <strong>inclus</strong>. Si le prof utilise la convention Python (fin exclue, comme <code>range</code>), remplace <code>&lt;= fin</code> par <code>&lt; fin</code> et la valeur par défaut par <code>len(chaine)</code>. Demande-lui.</p>\n</aside><h2>Exercice 3 : <code>verifie_ordre</code> (1, 2, 3 dans l&#39;ordre)</h2>\n<p>Les exemples du prof montrent que 1, 2, 3 n&#39;ont pas besoin d&#39;être <strong>collés</strong> : c&#39;est une <strong>sous-séquence</strong>. On garde un pointeur <code>k</code> sur le prochain nombre attendu.</p>\n<pre class=\"\"><code>def verifie_ordre(liste):\n    cible = [1, 2, 3]\n    k = 0\n    for x in liste:\n        if x == cible[k]:\n            k += 1\n            if k == 3:\n                return True\n    return False\n\nprint(verifie_ordre([-1, 6, 7, 1, 2, 3, 5]), verifie_ordre([9, 1, 7, 4, 2, 5, 3]),\n      verifie_ordre([6, 3, 12, 2, -4, 5, 1]), verifie_ordre([1, 3, 2]))</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>True True False False</code></pre><figure class=\"grille\"><figcaption>Trace sur [9, 1, 7, 4, 2, 5, 3] : en couleur, les éléments qui font avancer k</figcaption><table><tr><th></th><th>9</th><th>1</th><th>7</th><th>4</th><th>2</th><th>5</th><th>3</th></tr><tr><th>k</th><td>0</td><td class=\"h1\">1</td><td>1</td><td>1</td><td class=\"h1\">2</td><td>2</td><td class=\"h1\">3</td></tr></table></figure><p>Un seul parcours : complexité <strong>O(n)</strong>.</p>\n<h2>Exercice 4 : produit matriciel en Python pur</h2>\n<p>C(i, j) = Σₖ A(i, k) × B(k, j). Condition : colonnes de A = lignes de B. Trois boucles : <code>i</code> (lignes de A), <code>j</code> (colonnes de B), <code>k</code> (la somme).</p>\n<pre class=\"\"><code>def verifie_dimensions():\n    while True:\n        m = int(input(&quot;Lignes de A : &quot;))\n        n1 = int(input(&quot;Colonnes de A : &quot;))\n        n2 = int(input(&quot;Lignes de B : &quot;))\n        p = int(input(&quot;Colonnes de B : &quot;))\n        if n1 == n2:\n            return m, n1, p\n        print(&quot;Colonnes de A doivent etre = lignes de B. Recommence.&quot;)\n\ndef remplir_matrice(R, C):\n    M = initialiser_matrice(R, C)       # l'énoncé impose de la réutiliser\n    for i in range(R):\n        for j in range(C):\n            M[i][j] = float(input(f&quot;M[{i}][{j}] = &quot;))\n    return M</code></pre><pre class=\"\"><code>def initialiser_matrice(R, C):\n    return [[0 for _ in range(C)] for _ in range(R)]\n\ndef calcul_produit_matriciel(A, B, C, m, n, p):\n    for i in range(m):\n        for j in range(p):\n            s = 0                       # remis à zéro pour CHAQUE case\n            for k in range(n):\n                s += A[i][k] * B[k][j]\n            C[i][j] = s\n    return C\n\nA = [[1, 2, 3], [4, 5, 6]]\nB = [[7, 8], [9, 10], [11, 12]]\nprint(calcul_produit_matriciel(A, B, initialiser_matrice(2, 2), 2, 3, 2))</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>[[58, 64], [139, 154]]</code></pre><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p><code>[[0] * C] * R</code> crée R fois <strong>la même</strong> ligne : modifier <code>M[0][0]</code> modifie toutes les lignes. Il faut la compréhension de liste ci-dessus.</p>\n</aside><p>Programme principal : <code>m, n, p = verifie_dimensions()</code>, puis <code>A = remplir_matrice(m, n)</code>, <code>B = remplir_matrice(n, p)</code>, <code>C = initialiser_matrice(m, p)</code> et <code>calcul_produit_matriciel(A, B, C, m, n, p)</code>.</p>\n<h2>TP/TD 2 · Exercice 1 : manipulation de tableaux NumPy</h2>\n<pre class=\"\"><code>import numpy as np\n\ntab1 = np.arange(6)                              # 0 à 5\ntab2 = np.random.randint(1, 11, size=(3, 3))     # 1 à 10 : high = 11 car exclu\ntab1 = tab1 + 2\ntab2 = tab2 * 2\nprint(tab1.shape, tab1.ndim, tab2.shape, tab2.ndim)\nnb_lignes, nb_colonnes = tab2.shape\nprint(tab2[1].shape, tab2[1:, 1:].shape)        # 2e ligne ; sous-tableau sans 1re ligne/colonne\nidx = (tab2.argmax(axis=0), tab2.argmax(axis=1), tab2.argmin(axis=0), tab2.argmin(axis=1))\nsup_a_3 = tab1 &gt; 3                               # AVANT le reshape : même taille que tab1\nprint(tab1[sup_a_3])\ntab1 = tab1.reshape(2, 3)\ntab3 = np.array([4, -5, 2])\ntab4 = np.vstack((tab1, tab3))\nprint(tab4.sum(), tab2.mean(axis=0).shape)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>(6,) 1 (3, 3) 2\n(3,) (2, 2)\n[4 5 6 7]\n28 (3,)</code></pre><figure class=\"grille\"><figcaption>tab4 = np.vstack((tab1, tab3)) : la ligne ajoutée est en couleur ; somme = 27 + 1 = 28</figcaption><table><tr><td>2</td><td>3</td><td>4</td></tr><tr><td>5</td><td>6</td><td>7</td></tr><tr><td class=\"h1\">4</td><td class=\"h1\">-5</td><td class=\"h1\">2</td></tr></table></figure><h2>Exercice 2 : matrices NumPy (et le piège de la question 9)</h2>\n<pre class=\"\"><code>rng_mat = np.random.normal(3, 2, 12)             # moyenne 3, ÉCART-TYPE 2\nmat1 = np.floor(rng_mat.reshape(3, 4)).astype(int)   # entier inférieur, puis conversion\nmat2 = np.arange(2, 14).reshape(4, 3)            # 12 valeurs de 2 à 13\nproduit = mat1 @ mat2                            # (3x4) @ (4x3) → (3x3)\ntransposee = mat1.T\ncarre = mat1[:, :3]                              # on exclut la dernière colonne → 3x3\nprint(produit.shape, transposee.shape, carre.shape)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>(3, 3) (4, 3) (3, 3)</code></pre><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>La question 9 demande « l&#39;inverse de la matrice <strong>mat1</strong> ». Or <code>mat1</code> est <strong>3 × 4</strong> : une matrice non carrée n&#39;a <strong>pas d&#39;inverse</strong> (<code>np.linalg.inv(mat1)</code> → <code>LinAlgError</code>). L&#39;intention du prof est d&#39;inverser la matrice <strong>carrée de la question 8</strong>. Écris-le explicitement sur ta copie.</p>\n</aside><pre class=\"\"><code>carre = np.array([[2, 1, 0], [1, 3, 1], [0, 1, 4]])   # exemple fixe (mat1 est aléatoire)\nd = np.linalg.det(carre)\nif abs(d) &gt; 1e-10:\n    inv = np.linalg.inv(carre)\n    print(round(d), np.allclose(inv @ carre, np.eye(3)))\nelse:\n    print(&quot;Non inversible&quot;)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>18 True</code></pre><p>Pourquoi <code>abs(d) &gt; 1e-10</code> et pas <code>d != 0</code> : un déterminant théoriquement nul peut valoir 1e-16 à cause des arrondis. Comme <code>mat1</code> est tirée au hasard puis arrondie, sa partie carrée <strong>peut</strong> être singulière : d&#39;où le test demandé par l&#39;énoncé.</p>\n<h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\"><code>987 % 10</code> et <code>987 // 10</code> valent :</div><button class=\"opt\" data-o=\"0\">7 et 98</button><button class=\"opt\" data-o=\"1\">98 et 7</button><button class=\"opt\" data-o=\"2\">9 et 87</button><button class=\"opt\" data-o=\"3\">7 et 98.7</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">9474 est-il un nombre d&#39;Armstrong ?</div><button class=\"opt\" data-o=\"0\">Oui : 9⁴ + 4⁴ + 7⁴ + 4⁴ = 9474</button><button class=\"opt\" data-o=\"1\">Non : il faudrait des cubes</button><button class=\"opt\" data-o=\"2\">Non : seul 153 l&#39;est</button><button class=\"opt\" data-o=\"3\">Impossible à savoir sans convertir en chaîne</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\"><code>verifie_ordre([3, 1, 2, 3])</code> renvoie :</div><button class=\"opt\" data-o=\"0\">True</button><button class=\"opt\" data-o=\"1\">False</button><button class=\"opt\" data-o=\"2\">Erreur</button><button class=\"opt\" data-o=\"3\">3</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Pour multiplier A (3 × 2) par B (2 × 5), le résultat a la forme :</div><button class=\"opt\" data-o=\"0\">(2, 2)</button><button class=\"opt\" data-o=\"1\">(3, 5)</button><button class=\"opt\" data-o=\"2\">(5, 3)</button><button class=\"opt\" data-o=\"3\">impossible</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Dans le TD2, pourquoi <code>sup_a_3</code> doit-il être calculé avant <code>tab1.reshape(2, 3)</code> ?</div><button class=\"opt\" data-o=\"0\">L&#39;énoncé le veut de la même taille que tab1 en 1D (6,)</button><button class=\"opt\" data-o=\"1\">Sinon reshape lève une erreur</button><button class=\"opt\" data-o=\"2\">Les masques ne marchent pas en 2D</button><button class=\"opt\" data-o=\"3\">Pour gagner de la mémoire</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\"><code>np.linalg.inv(mat1)</code> avec mat1 de forme (3, 4) :</div><button class=\"opt\" data-o=\"0\">renvoie une matrice 4 × 3</button><button class=\"opt\" data-o=\"1\">lève une erreur : la matrice n&#39;est pas carrée</button><button class=\"opt\" data-o=\"2\">renvoie la transposée</button><button class=\"opt\" data-o=\"3\">renvoie une matrice remplie de NaN</button><div class=\"qq-e\" hidden></div></div></section>","ex":[],"qcm":[{"n":"tp-corriges","q":"<code>987 % 10</code> et <code>987 // 10</code> valent :","o":["7 et 98","98 et 7","9 et 87","7 et 98.7"],"a":0,"e":"% donne le dernier chiffre, // l&#39;enlève."},{"n":"tp-corriges","q":"9474 est-il un nombre d&#39;Armstrong ?","o":["Oui : 9⁴ + 4⁴ + 7⁴ + 4⁴ = 9474","Non : il faudrait des cubes","Non : seul 153 l&#39;est","Impossible à savoir sans convertir en chaîne"],"a":0,"e":"6561 + 256 + 2401 + 256 = 9474."},{"n":"tp-corriges","q":"<code>verifie_ordre([3, 1, 2, 3])</code> renvoie :","o":["True","False","Erreur","3"],"a":0,"e":"1 (indice 1), 2 (indice 2), 3 (indice 3) apparaissent dans l&#39;ordre."},{"n":"tp-corriges","q":"Pour multiplier A (3 × 2) par B (2 × 5), le résultat a la forme :","o":["(2, 2)","(3, 5)","(5, 3)","impossible"],"a":1,"e":"(m, n) @ (n, p) → (m, p)."},{"n":"tp-corriges","q":"Dans le TD2, pourquoi <code>sup_a_3</code> doit-il être calculé avant <code>tab1.reshape(2, 3)</code> ?","o":["L&#39;énoncé le veut de la même taille que tab1 en 1D (6,)","Sinon reshape lève une erreur","Les masques ne marchent pas en 2D","Pour gagner de la mémoire"],"a":0,"e":"Après le reshape, le masque aurait la forme (2, 3)."},{"n":"tp-corriges","q":"<code>np.linalg.inv(mat1)</code> avec mat1 de forme (3, 4) :","o":["renvoie une matrice 4 × 3","lève une erreur : la matrice n&#39;est pas carrée","renvoie la transposée","renvoie une matrice remplie de NaN"],"a":1,"e":"Seules les matrices carrées de déterminant non nul ont un inverse."}]},{"id":"revision","t":"Fiche de révision et examen blanc","seance":"Avant l'examen","imp":3,"html":"<h2>1. Les tableaux de survie</h2>\n<h3>Bornes : incluse ou exclue ?</h3>\n<table>\n<thead>\n<tr>\n<th>Écriture</th>\n<th>Fin</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>range(a, b)</code>, <code>np.arange(a, b)</code>, <code>np.random.randint(a, b)</code>, <code>a[i:j]</code>, <code>.iloc[i:j]</code></td>\n<td><strong>exclue</strong></td>\n</tr>\n<tr>\n<td><code>np.linspace(a, b, n)</code>, <code>.loc[&quot;x&quot;:&quot;y&quot;]</code>, <code>rng.integers(a, b, endpoint=True)</code></td>\n<td><strong>incluse</strong></td>\n</tr>\n</tbody></table>\n<h3>Copie ou vue / sur place ou non ?</h3>\n<table>\n<thead>\n<tr>\n<th>Renvoie une <strong>vue</strong> (partage les données)</th>\n<th>Renvoie une <strong>copie</strong></th>\n<th>Modifie <strong>sur place</strong> (renvoie <code>None</code>)</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>a[1:3]</code>, <code>a.view()</code>, <code>a.reshape()</code>, <code>a.ravel()</code></td>\n<td><code>a.copy()</code>, <code>a.flatten()</code>, <code>a.astype()</code>, <code>np.sort(a)</code>, <code>np.append(...)</code>, <code>np.random.permutation(a)</code></td>\n<td><code>a.sort()</code>, <code>np.random.shuffle(a)</code></td>\n</tr>\n</tbody></table>\n<p>En Pandas, <strong>par défaut tout renvoie une copie</strong> (<code>drop</code>, <code>rename</code>, <code>sort_values</code>, <code>assign</code>, <code>reset_index</code>…) sauf <code>df[&quot;col&quot;] = ...</code>, <code>insert</code>, <code>del</code>, <code>loc[...] = ...</code> et <code>inplace=True</code>.</p>\n<h3><code>axis</code>, une règle pour tout</h3>\n<figure class=\"grille\"><figcaption>axis=0 → résultat par COLONNE · axis=1 → résultat par LIGNE</figcaption><table><tr><th>c0</th><th>c1</th><th>c2</th><th>axis=1</th></tr><tr><td>1</td><td>2</td><td>3</td><td class=\"h2\">6</td></tr><tr><td>4</td><td>5</td><td>6</td><td class=\"h2\">15</td></tr><tr><td class=\"h1\">5</td><td class=\"h1\">7</td><td class=\"h1\">9</td><td>·</td></tr></table></figure><p><code>axis=k</code> est l&#39;axe <strong>qui disparaît</strong> (sum, mean, var, argmax, sort…). Pour <code>concatenate</code>, c&#39;est l&#39;axe <strong>qui grandit</strong> (axis=0 ajoute des lignes). Pour <code>drop</code>, axis=0 vise des <strong>lignes</strong>, axis=1 des <strong>colonnes</strong>.</p>\n<h3>Les paires qu&#39;on confond</h3>\n<table>\n<thead>\n<tr>\n<th></th>\n<th></th>\n<th></th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>return</code> → renvoie une valeur</td>\n<td><code>print</code> → affiche, renvoie <code>None</code></td>\n<td></td>\n</tr>\n<tr>\n<td><code>*args</code> → tuple</td>\n<td><code>**kwargs</code> → dictionnaire</td>\n<td></td>\n</tr>\n<tr>\n<td><code>A * B</code> → terme à terme</td>\n<td><code>A @ B</code> → produit matriciel</td>\n<td></td>\n</tr>\n<tr>\n<td><code>argmax</code> → <strong>position</strong></td>\n<td><code>max</code> → valeur</td>\n<td></td>\n</tr>\n<tr>\n<td><code>np.dot(a, b)</code> → nombre</td>\n<td><code>np.cross(a, b)</code> → vecteur</td>\n<td></td>\n</tr>\n<tr>\n<td><code>floor(-2.5) = -3</code></td>\n<td><code>trunc(-2.5) = -2</code></td>\n<td><code>round(2.5) = 2</code> (pair)</td>\n</tr>\n<tr>\n<td><code>normal(μ, σ)</code> : σ = écart-type</td>\n<td>variance = σ²</td>\n<td></td>\n</tr>\n<tr>\n<td><code>shuffle</code> → sur place, <code>None</code></td>\n<td><code>permutation</code> → copie</td>\n<td></td>\n</tr>\n<tr>\n<td><code>.loc</code> → étiquettes, fin incluse</td>\n<td><code>.iloc</code> → positions, fin exclue</td>\n<td></td>\n</tr>\n<tr>\n<td><code>serie.map(dict)</code> → remplace</td>\n<td><code>serie.apply(f)</code> → calcule</td>\n<td><code>df.map(f)</code> → chaque case</td>\n</tr>\n<tr>\n<td><code>agg</code> → 1 ligne par groupe</td>\n<td><code>transform</code> → même taille</td>\n<td><code>filter</code> → groupes entiers</td>\n</tr>\n</tbody></table>\n<h2>2. Les 12 pièges qui coûtent des points</h2>\n<ol>\n<li><code>print</code> au lieu de <code>return</code>.</li>\n<li>Un paramètre par défaut <strong>avant</strong> un paramètre obligatoire (<code>SyntaxError</code>).</li>\n<li>Modifier une liste dans une fonction <strong>modifie l&#39;original</strong> ; réaffecter ne le modifie pas.</li>\n<li><code>randint(1, 6)</code> ne donne jamais 6.</li>\n<li><code>np.ones(2, 3)</code> au lieu de <code>np.ones((2, 3))</code>.</li>\n<li>Croire que le slicing NumPy copie (c&#39;est une <strong>vue</strong>).</li>\n<li><code>and</code> / <code>or</code> entre masques au lieu de <code>&amp;</code> / <code>|</code> avec parenthèses.</li>\n<li><code>np.split</code> sur une taille non divisible (→ <code>array_split</code>).</li>\n<li>Comparer des flottants avec <code>==</code> (→ <code>np.allclose</code>).</li>\n<li>Inverser une matrice non carrée ou de déterminant nul.</li>\n<li>Oublier de réaffecter après <code>drop</code>, <code>rename</code>, <code>sort_values</code>.</li>\n<li><code>df.append</code> (supprimé) au lieu de <code>pd.concat([df1, df2])</code>.</li>\n</ol>\n<h2>3. Examen blanc (1 h 30)</h2>\n<aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend</div><p>Format <strong>supposé</strong> : le barème réel n&#39;est pas public. Fais-le en temps limité, sans regarder le cours, puis corrige-toi avec le corrigé ci-dessous.</p>\n</aside><p><strong>Exercice 1 · Fonctions (5 pts).</strong> Écris <code>est_palindrome_nombre(n)</code> qui renvoie <code>True</code> si l&#39;entier <code>n</code> se lit pareil dans les deux sens (121, 1331), <strong>sans conversion en chaîne</strong>. Puis <code>stats(*notes, arrondi=2)</code> qui renvoie un dictionnaire <code>{&quot;min&quot;: ..., &quot;max&quot;: ..., &quot;moyenne&quot;: ...}</code>.</p>\n<p><strong>Exercice 2 · NumPy (6 pts).</strong> Soit <code>a = np.arange(1, 13).reshape(3, 4)</code>.</p>\n<ol>\n<li>Somme de chaque ligne ; moyenne de chaque colonne.</li>\n<li>Les éléments pairs ; les éléments entre 4 et 9 inclus.</li>\n<li>La sous-matrice des 2 dernières lignes et 2 dernières colonnes.</li>\n<li>Le produit <code>a @ a.T</code> et sa forme. Est-elle inversible ?</li>\n</ol>\n<p><strong>Exercice 3 · Pandas (9 pts).</strong> Avec le DataFrame <code>notes</code> ci-dessous :</p>\n<ol>\n<li>Ajouter une colonne <code>Moyenne</code> = 0,4 × CC + 0,6 × Examen.</li>\n<li>Afficher les étudiants admis (Moyenne ≥ 10) triés par moyenne décroissante.</li>\n<li>Moyenne et effectif par filière.</li>\n<li>Ajouter <code>Ecart_Filiere</code> = Moyenne − moyenne de sa filière.</li>\n<li>Garder uniquement les filières qui ont au moins 3 étudiants.</li>\n</ol>\n<pre class=\"\"><code>import numpy as np\nimport pandas as pd\n\nnotes = pd.DataFrame({\n    &quot;Nom&quot;: [&quot;Amine&quot;, &quot;Sara&quot;, &quot;Youssef&quot;, &quot;Hanane&quot;, &quot;Karim&quot;, &quot;Lina&quot;, &quot;Omar&quot;],\n    &quot;Filiere&quot;: [&quot;MIACSD&quot;, &quot;MIACSD&quot;, &quot;MIP&quot;, &quot;MIACSD&quot;, &quot;MIP&quot;, &quot;SVI&quot;, &quot;MIACSD&quot;],\n    &quot;CC&quot;: [12, 15, 8, 9, 14, 11, 6],\n    &quot;Examen&quot;: [10, 16, 7, 12, 9, 13, 8],\n})</code></pre><h3>Corrigé</h3>\n<pre class=\"\"><code>def est_palindrome_nombre(n):\n    original, inverse = n, 0\n    while n &gt; 0:\n        inverse = inverse * 10 + n % 10\n        n //= 10\n    return inverse == original\n\ndef stats(*notes, arrondi=2):\n    return {&quot;min&quot;: min(notes), &quot;max&quot;: max(notes), &quot;moyenne&quot;: round(sum(notes) / len(notes), arrondi)}\n\nprint(est_palindrome_nombre(1331), est_palindrome_nombre(123), stats(12, 15, 8))</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>True False {'min': 8, 'max': 15, 'moyenne': 11.67}</code></pre><pre class=\"\"><code>a = np.arange(1, 13).reshape(3, 4)\nprint(a.sum(axis=1), a.mean(axis=0))\nprint(a[a % 2 == 0], a[(a &gt;= 4) &amp; (a &lt;= 9)])\nprint(a[-2:, -2:])\ng = a @ a.T\nprint(g.shape, round(np.linalg.det(g)))</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>[10 26 42] [5. 6. 7. 8.]\n[ 2  4  6  8 10 12] [4 5 6 7 8 9]\n[[ 7  8]\n [11 12]]\n(3, 3) 0</code></pre><p>La matrice 3 × 3 <code>a @ a.T</code> a un déterminant <strong>nul</strong> (les lignes de <code>a</code> sont en progression régulière, donc liées) : elle <strong>n&#39;est pas inversible</strong>. Une réponse « np.linalg.inv(g) » sans vérifier le déterminant perd les points.</p>\n<pre class=\"\"><code>notes[&quot;Moyenne&quot;] = (0.4 * notes[&quot;CC&quot;] + 0.6 * notes[&quot;Examen&quot;]).round(2)\nadmis = notes[notes[&quot;Moyenne&quot;] &gt;= 10].sort_values(&quot;Moyenne&quot;, ascending=False)\nprint(admis[[&quot;Nom&quot;, &quot;Moyenne&quot;]].values.tolist())\nprint(notes.groupby(&quot;Filiere&quot;)[&quot;Moyenne&quot;].agg([&quot;mean&quot;, &quot;count&quot;]).round(2))\nnotes[&quot;Ecart_Filiere&quot;] = (notes[&quot;Moyenne&quot;] - notes.groupby(&quot;Filiere&quot;)[&quot;Moyenne&quot;].transform(&quot;mean&quot;)).round(2)\nprint(notes.groupby(&quot;Filiere&quot;).filter(lambda g: len(g) &gt;= 3)[&quot;Nom&quot;].tolist())</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>[['Sara', 15.6], ['Lina', 12.2], ['Karim', 11.0], ['Amine', 10.8], ['Hanane', 10.8]]\n         mean  count\nFiliere             \nMIACSD   11.1      4\nMIP       9.2      2\nSVI      12.2      1\n['Amine', 'Sara', 'Hanane', 'Omar']</code></pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p>Q3 = <code>agg</code> (1 ligne par filière), Q4 = <code>transform</code> (une valeur par étudiant), Q5 = <code>filter</code> (des filières entières gardées ou supprimées). Savoir lequel choisir, c&#39;est la moitié des points de l&#39;exercice.</p>\n</aside><h2>QCM de synthèse</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quelle écriture <strong>inclut</strong> la borne de fin ?</div><button class=\"opt\" data-o=\"0\"><code>np.arange(0, 5)</code></button><button class=\"opt\" data-o=\"1\"><code>s.iloc[0:5]</code></button><button class=\"opt\" data-o=\"2\"><code>s.loc[&quot;a&quot;:&quot;e&quot;]</code></button><button class=\"opt\" data-o=\"3\"><code>arr[0:5]</code></button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Laquelle modifie le tableau <strong>sur place</strong> ?</div><button class=\"opt\" data-o=\"0\"><code>np.sort(a)</code></button><button class=\"opt\" data-o=\"1\"><code>a.sort()</code></button><button class=\"opt\" data-o=\"2\"><code>np.random.permutation(a)</code></button><button class=\"opt\" data-o=\"3\"><code>np.append(a, 1)</code></button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\"><code>np.mean(M, axis=1)</code> pour M de forme (4, 6) a la forme :</div><button class=\"opt\" data-o=\"0\">(4,)</button><button class=\"opt\" data-o=\"1\">(6,)</button><button class=\"opt\" data-o=\"2\">(4, 6)</button><button class=\"opt\" data-o=\"3\">un nombre</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Quelle opération Pandas garde le même nombre de lignes après un groupby ?</div><button class=\"opt\" data-o=\"0\"><code>agg</code></button><button class=\"opt\" data-o=\"1\"><code>transform</code></button><button class=\"opt\" data-o=\"2\"><code>filter</code></button><button class=\"opt\" data-o=\"3\"><code>count</code></button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\"><code>def f(x, liste=[])</code> est risqué parce que :</div><button class=\"opt\" data-o=\"0\">la même liste est réutilisée d&#39;un appel à l&#39;autre</button><button class=\"opt\" data-o=\"1\"><code>liste</code> est en lecture seule</button><button class=\"opt\" data-o=\"2\">les listes sont interdites en paramètre</button><button class=\"opt\" data-o=\"3\">Python lève une SyntaxError</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Quelle commande crée un tableau de 5 valeurs régulièrement espacées de 0 à 1 inclus ?</div><button class=\"opt\" data-o=\"0\"><code>np.arange(0, 1, 5)</code></button><button class=\"opt\" data-o=\"1\"><code>np.linspace(0, 1, 5)</code></button><button class=\"opt\" data-o=\"2\"><code>np.random.rand(5)</code></button><button class=\"opt\" data-o=\"3\"><code>np.arange(0, 1.25, 5)</code></button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Le type <code>&quot;Int64&quot;</code> (I majuscule) sert à :</div><button class=\"opt\" data-o=\"0\">garder des entiers malgré des valeurs manquantes</button><button class=\"opt\" data-o=\"1\">stocker des entiers sur 64 bits sans NaN</button><button class=\"opt\" data-o=\"2\">convertir du texte en nombres</button><button class=\"opt\" data-o=\"3\">accélérer les calculs</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\"><code>np.random.default_rng(0)</code> appelé deux fois puis <code>.integers(1, 7, 3)</code> :</div><button class=\"opt\" data-o=\"0\">donne deux fois la même suite</button><button class=\"opt\" data-o=\"1\">donne deux suites différentes</button><button class=\"opt\" data-o=\"2\">lève une erreur</button><button class=\"opt\" data-o=\"3\">donne toujours [1, 2, 3]</button><div class=\"qq-e\" hidden></div></div></section>","ex":[],"qcm":[{"n":"revision","q":"Quelle écriture <strong>inclut</strong> la borne de fin ?","o":["<code>np.arange(0, 5)</code>","<code>s.iloc[0:5]</code>","<code>s.loc[&quot;a&quot;:&quot;e&quot;]</code>","<code>arr[0:5]</code>"],"a":2,"e":"<code>.loc</code> (étiquettes) inclut la fin ; tout ce qui est positionnel l&#39;exclut."},{"n":"revision","q":"Laquelle modifie le tableau <strong>sur place</strong> ?","o":["<code>np.sort(a)</code>","<code>a.sort()</code>","<code>np.random.permutation(a)</code>","<code>np.append(a, 1)</code>"],"a":1,"e":"La méthode <code>a.sort()</code> trie a et renvoie None."},{"n":"revision","q":"<code>np.mean(M, axis=1)</code> pour M de forme (4, 6) a la forme :","o":["(4,)","(6,)","(4, 6)","un nombre"],"a":0,"e":"L&#39;axe 1 (colonnes) disparaît : une moyenne par ligne."},{"n":"revision","q":"Quelle opération Pandas garde le même nombre de lignes après un groupby ?","o":["<code>agg</code>","<code>transform</code>","<code>filter</code>","<code>count</code>"],"a":1,"e":"transform recopie le résultat du groupe sur chaque ligne d&#39;origine."},{"n":"revision","q":"<code>def f(x, liste=[])</code> est risqué parce que :","o":["la même liste est réutilisée d&#39;un appel à l&#39;autre","<code>liste</code> est en lecture seule","les listes sont interdites en paramètre","Python lève une SyntaxError"],"a":0,"e":"La valeur par défaut est créée une seule fois ; on écrit <code>liste=None</code> puis on la crée dans la fonction."},{"n":"revision","q":"Quelle commande crée un tableau de 5 valeurs régulièrement espacées de 0 à 1 inclus ?","o":["<code>np.arange(0, 1, 5)</code>","<code>np.linspace(0, 1, 5)</code>",     Promise.all([W.use('db'), W.use('user')]).then(async ([d, u]) => {
      if (!d || !u) return; const id = await u.id(); if (!id) return; db = d; base = 'data/users/' + id + '/mzt_' + C.id;
      try {
        const m = await db.doc(base).get(); if (m.exists) { const v = m.data() || {}; if (Array.isArray(v.memos)) ST.memos = JSON.parse(JSON.stringify(v.memos)); }
        const q = await db.collection(base + '/threads').get(); const remote = q.docs.map((x) => Object.assign({ id: x.id }, JSON.parse(JSON.stringify(x.data() || {}))));
        const map = {}; [...ST.threads, ...remote].forEach((t) => { if (!map[t.id] || (t.msgs || []).length > (map[t.id].msgs || []).length) map[t.id] = t; });
        ST.threads = Object.values(map).sort((a, b) => parseInt(a.id.slice(1), 36) - parseInt(b.id.slice(1), 36)); saveLocal();
      } catch (e) {}
    }).catch(() => {});
  } else { ready = true; note(); }

  window.MZT = { open: openPanel, close: closePanel };
})();

</script>
