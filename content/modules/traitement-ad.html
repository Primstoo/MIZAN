ndom.rand</code>, <code>np.random.normal</code>… L&#39;<strong>actuelle, recommandée</strong> : on crée un générateur <code>rng = np.random.default_rng(graine)</code> puis <code>rng.integers</code>, <code>rng.random</code>, <code>rng.normal</code>… Le prof montre les deux : sache lire les deux.</p>\n</aside><aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p>« Aléatoire » ne veut pas dire « toutes différentes » : 6 lancers de dé peuvent très bien donner deux fois 5 (c&#39;est le cas ci-dessus).</p>\n</aside><h2>2. Entiers et réels uniformes</h2>\n<table>\n<thead>\n<tr>\n<th>Fonction</th>\n<th>Tire…</th>\n<th>Intervalle</th>\n<th>Forme</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>np.random.randint(low, high, size)</code></td>\n<td>des <strong>entiers</strong></td>\n<td>[low, high) : high <strong>exclu</strong></td>\n<td><code>size=(2, 3)</code></td>\n</tr>\n<tr>\n<td><code>rng.integers(low, high, size, endpoint=False)</code></td>\n<td>des entiers</td>\n<td>high exclu, <strong>inclus si <code>endpoint=True</code></strong></td>\n<td><code>size=...</code></td>\n</tr>\n<tr>\n<td><code>np.random.rand(d0, d1, ...)</code></td>\n<td>des <strong>réels</strong></td>\n<td>[0, 1)</td>\n<td>dimensions <strong>séparées</strong>, pas de tuple</td>\n</tr>\n<tr>\n<td><code>rng.random((d0, d1))</code>, <code>np.random.random_sample(size)</code></td>\n<td>des réels</td>\n<td>[0, 1)</td>\n<td>tuple</td>\n</tr>\n<tr>\n<td><code>np.random.uniform(low, high, size)</code></td>\n<td>des réels</td>\n<td>[low, high)</td>\n<td><code>size=...</code></td>\n</tr>\n</tbody></table>\n<pre class=\"\"><code>print(np.random.rand(2, 3).shape)\nprint(np.random.randint(10) &lt; 10)               # un seul argument : [0, 10)\nd = np.random.randint(1, 7, size=1000)          # dé à 6 faces\nprint(d.min() &gt;= 1, d.max() &lt;= 6)\nr = np.random.default_rng(0).integers(1, 6, size=1000, endpoint=True)\nprint(r.max())</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>(2, 3)\nTrue\nTrue True\n6</code></pre><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>Pour un dé, <code>randint(1, 6)</code> ne donnera <strong>jamais 6</strong>. Il faut <code>randint(1, 7)</code> ou <code>rng.integers(1, 6, endpoint=True)</code>. Et <code>np.random.rand((2, 3))</code> (tuple) plante : <code>rand</code> veut <code>rand(2, 3)</code>.</p>\n</aside><p><strong>Loi uniforme</strong> : chaque valeur (ou chaque sous-intervalle de même longueur) a la même chance.</p>\n<ul>\n<li>Continue U[a, b] : densité 1/(b − a), espérance <strong>(a + b)/2</strong>, variance <strong>(b − a)²/12</strong>.</li>\n<li>Discrète sur N valeurs : P(X = k) = <strong>1/N</strong> (dé : 1/6).</li>\n</ul>\n<h2>3. Tirer dans un tableau : <code>choice</code>, <code>shuffle</code>, <code>permutation</code></h2>\n<p><code>np.random.choice(a, size=None, replace=True, p=None)</code></p>\n<ul>\n<li><code>replace=True</code> (défaut) : <strong>avec remise</strong>, un élément peut sortir plusieurs fois.</li>\n<li><code>replace=False</code> : <strong>sans remise</strong>, éléments distincts ; exige <code>size ≤ len(a)</code> sinon <code>ValueError</code>.</li>\n<li><code>p</code> : probabilités de chaque élément, chacune entre 0 et 1, <strong>somme = 1</strong> (un <code>p</code> à 0 = jamais tiré).</li>\n</ul>\n<pre class=\"\"><code>rng = np.random.default_rng(1)\nelements = [6, -2, 3, 4]\nt = rng.choice(elements, size=10_000, p=[0.1, 0.3, 0.6, 0.0])\nvaleurs, compte = np.unique(t, return_counts=True)\nprint(valeurs, 4 in t)\nprint(np.round(compte / len(t), 1))\nprint(len(set(rng.choice(elements, size=4, replace=False))))</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>[-2  3  6] False\n[0.3 0.6 0.1]\n4</code></pre><figure class=\"grille\"><figcaption>Tirage pondéré : la valeur 3 sort ~60 % du temps, la valeur 4 jamais</figcaption><table><tr><th></th><th>6</th><th>-2</th><th>3</th><th>4</th></tr><tr><th>p</th><td>0.1</td><td>0.3</td><td class=\"h1\">0.6</td><td class=\"h0\">0.0</td></tr><tr><th>fréquence</th><td>0.1</td><td>0.3</td><td class=\"h1\">0.6</td><td class=\"h0\">0</td></tr></table></figure><table>\n<thead>\n<tr>\n<th></th>\n<th><code>np.random.shuffle(x)</code></th>\n<th><code>np.random.permutation(x)</code></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Modifie <code>x</code> ?</td>\n<td><strong>oui, sur place</strong></td>\n<td>non</td>\n</tr>\n<tr>\n<td>Renvoie</td>\n<td><strong><code>None</code></strong></td>\n<td>une <strong>copie</strong> mélangée</td>\n</tr>\n<tr>\n<td>Avec un entier N</td>\n<td>—</td>\n<td>mélange de <code>np.arange(N)</code></td>\n</tr>\n<tr>\n<td>En 2D</td>\n<td>mélange <strong>les lignes</strong> seulement</td>\n<td>idem</td>\n</tr>\n</tbody></table>\n<pre class=\"\"><code>a = np.array([-5, 2, 6, -3, 5])\nres = np.random.shuffle(a)\nprint(res, sorted(a) == [-5, -3, 2, 5, 6])\nb = np.array([10, 20, 30])\np = np.random.permutation(b)\nprint(b, sorted(p))</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>None True\n[10 20 30] [np.int64(10), np.int64(20), np.int64(30)]</code></pre><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p><code>a = np.random.shuffle(a)</code> est une erreur classique : <code>shuffle</code> renvoie <code>None</code>, et <code>a</code> est perdu.</p>\n</aside><h2>4. Distributions : le vocabulaire</h2>\n<ul>\n<li><strong>Distribution</strong> : comment les valeurs d&#39;une variable aléatoire X se répartissent. <em>Théorique</em> (le modèle) ou <em>empirique</em> (ce qu&#39;on observe sur un échantillon).</li>\n<li>Variable <strong>discrète</strong> (comptage, dé) → <strong>PMF</strong> : P(X = k), la somme des P vaut 1.</li>\n<li>Variable <strong>continue</strong> (taille, temps) → <strong>PDF</strong> f(x) : P(X = x) = 0, une probabilité est une <strong>aire</strong> sous la courbe. La <strong>CDF</strong> F(x) = P(X ≤ x).</li>\n<li><strong>Espérance</strong> E[X] (centre), <strong>variance</strong> Var(X) = E[X²] − E[X]² (dispersion), <strong>écart-type</strong> σ = √Var.</li>\n<li><strong>Loi des grands nombres</strong> : plus l&#39;échantillon est grand, plus la moyenne observée se rapproche de l&#39;espérance. C&#39;est pour ça que le prof vérifie ses tirages avec 100 000 valeurs.</li>\n</ul>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p>Les lois <strong>discrètes</strong> (<code>binomial</code>, <code>poisson</code>, <code>geometric</code>, <code>multinomial</code>) renvoient des <strong>entiers</strong> ; les lois <strong>continues</strong> (<code>normal</code>, <code>uniform</code>, <code>logistic</code>) renvoient des <strong>flottants</strong>.</p>\n</aside><h2>5. Les lois à connaître</h2>\n<table>\n<thead>\n<tr>\n<th>Loi</th>\n<th>Fonction</th>\n<th>Paramètres</th>\n<th>Modélise</th>\n<th>Espérance</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Normale</strong> (Gauss)</td>\n<td><code>normal(loc, scale, size)</code></td>\n<td>loc = moyenne μ, scale = <strong>écart-type</strong> σ</td>\n<td>tailles, notes, erreurs de mesure</td>\n<td>μ</td>\n</tr>\n<tr>\n<td><strong>Binomiale</strong></td>\n<td><code>binomial(n, p, size)</code></td>\n<td>n essais, p succès</td>\n<td>nb de succès sur n essais oui/non</td>\n<td>n·p</td>\n</tr>\n<tr>\n<td><strong>Poisson</strong></td>\n<td><code>poisson(lam, size)</code></td>\n<td>λ = taux moyen</td>\n<td>nb d&#39;événements par intervalle (clients/heure)</td>\n<td>λ (et Var = λ)</td>\n</tr>\n<tr>\n<td><strong>Uniforme</strong></td>\n<td><code>uniform(low, high, size)</code></td>\n<td>bornes</td>\n<td>tout se vaut sur [low, high)</td>\n<td>(low + high)/2</td>\n</tr>\n<tr>\n<td><strong>Logistique</strong></td>\n<td><code>logistic(loc, scale, size)</code></td>\n<td>centre μ, échelle s</td>\n<td>croissance, régression logistique (sigmoïde)</td>\n<td>μ (Var = π²s²/3)</td>\n</tr>\n<tr>\n<td><strong>Multinomiale</strong></td>\n<td><code>multinomial(n, pvals, size)</code></td>\n<td>n essais, k probas</td>\n<td>comptages dans k catégories</td>\n<td>n·pᵢ par catégorie</td>\n</tr>\n<tr>\n<td><strong>Géométrique</strong></td>\n<td><code>geometric(p, size)</code></td>\n<td>p succès</td>\n<td>nb d&#39;essais <strong>jusqu&#39;au 1er succès</strong></td>\n<td>1/p</td>\n</tr>\n</tbody></table>\n<pre class=\"\"><code>rng = np.random.default_rng(42)\nN = 200_000\nprint(round(rng.normal(loc=5, scale=2, size=N).mean(), 1), round(rng.normal(5, 2, N).std(), 1))\nprint(round(rng.binomial(n=10, p=0.5, size=N).mean(), 1))\nx = rng.poisson(lam=3.0, size=N)\nprint(round(x.mean(), 1), round(x.var(), 1), x.dtype)\nprint(round(rng.uniform(10, 20, N).mean(), 1))\nprint(rng.multinomial(10, [0.2, 0.3, 0.5]).sum())\nprint(round(rng.geometric(p=0.25, size=N).mean(), 1))</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>5.0 2.0\n5.0\n3.0 3.0 int64\n15.0\n10\n4.0</code></pre><figure class=\"etapes\" data-i=\"0\"><figcaption>Lire la sortie de multinomial(10, [0.2, 0.3, 0.5])</figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Les essais</div><p>on fait 10 essais ; chacun tombe dans <strong>une seule</strong> des 3 catégories.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Les probabilités</div><p>catégorie 1 : 20 %, catégorie 2 : 30 %, catégorie 3 : 50 % (somme = 1).</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Le résultat</div><p>un <strong>vecteur de 3 comptages</strong>, par exemple <code>[1 3 6]</code>, jamais un seul nombre.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · La contrainte</div><p>la somme des comptages vaut toujours n : 1 + 3 + 6 = 10.</p>\n</div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>Dans <code>normal(loc, scale)</code>, <strong>scale est l&#39;écart-type</strong>, pas la variance. <code>normal(3, 2)</code> a une variance de 4. La binomiale renvoie un <strong>nombre de succès</strong> (entre 0 et n), pas une suite de 0/1.</p>\n</aside><p>Formules (vues en séance) :</p>\n<ul>\n<li>Binomiale : P(X = k) = C(n, k) · pᵏ · (1 − p)ⁿ⁻ᵏ</li>\n<li>Poisson : P(X = k) = λᵏ e^(−λ) / k!</li>\n<li>Logistique : sa CDF est la <strong>sigmoïde</strong> F(x) = 1 / (1 + e^(−(x − μ)/s)). Elle ressemble à la normale avec des <strong>queues plus épaisses</strong> (plus de valeurs extrêmes).</li>\n</ul>\n<h2>6. Les fonctions universelles (ufuncs)</h2>\n<p>Une <strong>ufunc</strong> est une fonction NumPy qui agit <strong>élément par élément</strong>, en C, sans boucle Python (<em>vectorisation</em>). Elles gèrent le <em>broadcasting</em> et ont des méthodes comme <code>reduce</code> et <code>accumulate</code>. Leur type est <code>numpy.ufunc</code>.</p>\n<pre class=\"\"><code>a, b = [1, -2, 1, -7], [6, 3, 0, 7]\nprint([i + j for i, j in zip(a, b)], np.add(a, b))</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>[7, 1, 1, 0] [7 1 1 0]</code></pre><h3>Créer sa propre ufunc : <code>np.frompyfunc(fonction, nb_entrées, nb_sorties)</code></h3>\n<pre class=\"\"><code>def myadd(x, y):\n    return x + y\n\nadd_ufunc = np.frompyfunc(myadd, 2, 1)\nprint(add_ufunc([1, 2, 3, 4], [5, 6, 7, 8]), type(add_ufunc) == np.ufunc)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>[6 8 10 12] True</code></pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>Une ufunc maison renvoie un tableau de type <code>object</code> et reste <strong>lente</strong> (elle appelle ta fonction Python à chaque case). Les ufuncs natives (<code>np.add</code>, <code>np.sqrt</code>…) sont bien plus rapides.</p>\n</aside><h3>Arithmétique</h3>\n<p><code>np.add</code>, <code>np.subtract</code>, <code>np.multiply</code>, <code>np.divide</code>, <code>np.power</code>, <code>np.mod</code> / <code>np.remainder</code>, <code>np.divmod</code> (quotient <strong>et</strong> reste), <code>np.absolute</code> / <code>np.abs</code>, <code>np.sqrt</code>, <code>np.negative</code>, <code>np.exp</code>.</p>\n<pre class=\"\"><code>a = np.array([2, 4, 6, 8]); b = np.array([3, 2, 5, 2])\nprint(np.power(a, b), np.mod(a, b))\nq, r = np.divmod(np.array([10, -5, 25, -8]), np.array([3, 2, -5, 2]))\nprint(q, r)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>[   8   16 7776   64] [2 0 1 0]\n[ 3 -3 -5 -4] [1 1 0 0]</code></pre><h3>Le paramètre <code>where</code> (et son piège)</h3>\n<p><code>where=condition</code> : l&#39;opération n&#39;est faite <strong>que</strong> là où la condition est vraie.</p>\n<pre class=\"\"><code>a = np.array([7, 2, 8]); b = np.array([4, 5, 6])\nsortie = np.zeros_like(a)\nnp.subtract(a, b, out=sortie, where=a &gt; b)\nprint(sortie)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>[3 0 2]</code></pre><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>La diapo écrit <code>np.add(arr1, arr2, where=arr1 &gt; arr2)</code> <strong>sans <code>out</code></strong> et annonce des 0 ailleurs. Faux en général : sans <code>out</code>, les cases non calculées contiennent <strong>ce qui traînait en mémoire</strong> (parfois des 0, parfois n&#39;importe quoi). Donne toujours un <code>out=</code> initialisé, comme ci-dessus.</p>\n</aside><h3>Division par zéro</h3>\n<p><code>np.divide([2, 4], [3, 0])</code> donne <code>inf</code> (avec un avertissement), et <code>0/0</code> donne <code>nan</code>. Pour gérer proprement :</p>\n<pre class=\"\"><code>a = np.array([2., 4., 6., 8.]); b = np.array([3., 0., 5., 2.])\nwith np.errstate(divide=&quot;ignore&quot;):\n    print(np.where(b != 0, a / b, np.nan).round(2))</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>[0.67  nan 1.2  4.  ]</code></pre><h3>Arrondis : cinq fonctions, cinq comportements</h3>\n<table>\n<thead>\n<tr>\n<th>Fonction</th>\n<th>Règle</th>\n<th>2.7</th>\n<th>−2.7</th>\n<th>2.5</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>np.round</code> / <code>np.around(x, decimals)</code></td>\n<td>au plus proche, <strong>égalité → pair</strong></td>\n<td>3</td>\n<td>−3</td>\n<td><strong>2</strong></td>\n</tr>\n<tr>\n<td><code>np.floor</code></td>\n<td>vers le <strong>bas</strong></td>\n<td>2</td>\n<td><strong>−3</strong></td>\n<td>2</td>\n</tr>\n<tr>\n<td><code>np.ceil</code></td>\n<td>vers le <strong>haut</strong></td>\n<td>3</td>\n<td>−2</td>\n<td>3</td>\n</tr>\n<tr>\n<td><code>np.trunc</code> / <code>np.fix</code></td>\n<td>vers <strong>zéro</strong> (on coupe)</td>\n<td>2</td>\n<td><strong>−2</strong></td>\n<td>2</td>\n</tr>\n</tbody></table>\n<pre class=\"\"><code>print(np.around([0.5, 1.5, 2.5]), np.around(5.25, 1), np.around(5.2777, 2))\nt = np.array([2.78, -3.45, 4.56])\nprint(np.floor(t), np.ceil(t), np.trunc(t))</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>[0. 2. 2.] 5.2 5.28\n[ 2. -4.  4.] [ 3. -3.  5.] [ 2. -3.  4.]</code></pre><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p><strong>Arrondi bancaire</strong> : <code>np.around(2.5)</code> = 2 et <code>np.around(0.5)</code> = 0 (on va vers le <strong>pair</strong>). Et <code>5.25</code> arrondi à 1 décimale donne <code>5.2</code> (pair) : ce n&#39;est pas l&#39;arrondi « du collège ».</p>\n</aside><h3>Logarithmes</h3>\n<p><code>np.log</code> (base e), <code>np.log10</code>, <code>np.log2</code>, et n&#39;importe quelle base b : <code>np.log(x) / np.log(b)</code>.</p>\n<pre class=\"\"><code>x = np.array([1, 10, 100])\nprint(np.log10(x), np.round(np.log(x) / np.log(3), 4))</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>[0. 1. 2.] [0.     2.0959 4.1918]</code></pre><h2>7. Fonctions statistiques</h2>\n<table>\n<thead>\n<tr>\n<th>Fonction</th>\n<th>Calcule</th>\n<th>Remarque</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>np.sum</code>, <code>np.prod</code></td>\n<td>somme, produit</td>\n<td><code>axis</code>, <code>keepdims=True</code> garde la dimension</td>\n</tr>\n<tr>\n<td><code>np.cumsum</code>, <code>np.cumprod</code></td>\n<td>cumul (même taille que l&#39;entrée)</td>\n<td></td>\n</tr>\n<tr>\n<td><code>np.diff(x, n=1)</code></td>\n<td>différences successives</td>\n<td>taille − n</td>\n</tr>\n<tr>\n<td><code>np.mean</code>, <code>np.median</code></td>\n<td>moyenne, médiane</td>\n<td>médiane = valeur du milieu après tri</td>\n</tr>\n<tr>\n<td><code>np.std</code>, <code>np.var</code></td>\n<td>écart-type, variance</td>\n<td><code>ddof=0</code> par défaut</td>\n</tr>\n<tr>\n<td><code>np.cov(M)</code></td>\n<td>matrice de covariance</td>\n<td><strong>chaque ligne = une variable</strong>, ddof = 1</td>\n</tr>\n<tr>\n<td><code>np.corrcoef(X, Y)</code></td>\n<td>matrice de corrélation r ∈ [−1, 1]</td>\n<td>diagonale = 1</td>\n</tr>\n</tbody></table>\n<pre class=\"\"><code>arr = np.array([[-1, 12, 3], [7, 4, 2]])\nprint(np.sum(arr), np.sum(arr, axis=0), np.sum(arr, axis=1, keepdims=True).tolist())\nprint(np.cumsum([3, -2, 4, 2, 10]), np.cumprod([2, -1, 2, 4, 7]))\nprint(np.diff([1, 3, 7, 11, 18]), np.diff([1, 3, 7, 11, 18], n=2))\nprint(np.median([3, 1, 7, 6, 2, 8, 4, 5]), np.mean([[5, -2, 4], [4, 15, 7]], axis=1).round(2))</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>27 [ 6 16  5] [[14], [13]]\n[ 3  1  5  7 17] [   2   -2   -4  -16 -112]\n[2 4 4 7] [2 0 3]\n4.5 [2.33 8.67]</code></pre><figure class=\"grille\"><figcaption>np.cumsum([3, -2, 4, 2, 10]) : chaque case = somme de tout ce qui précède</figcaption><table><tr><th></th><th>3</th><th>-2</th><th>4</th><th>2</th><th>10</th></tr><tr><th>entrée</th><td>3</td><td>-2</td><td>4</td><td>2</td><td>10</td></tr><tr><th>cumul</th><td class=\"h1\">3</td><td class=\"h1\">1</td><td class=\"h1\">5</td><td class=\"h1\">7</td><td class=\"h1\">17</td></tr></table></figure><p><strong>Médiane</strong> : on trie (1 2 3 4 5 6 7 8) ; 8 valeurs (nombre pair) → moyenne des deux du milieu : (4 + 5)/2 = 4.5. Avec un nombre impair, c&#39;est la valeur centrale.</p>\n<p><strong>Covariance et corrélation</strong> :</p>\n<ul>\n<li>cov(X, Y) &gt; 0 : X et Y montent ensemble ; &lt; 0 : l&#39;une monte quand l&#39;autre baisse ; ≈ 0 : pas de lien <strong>linéaire</strong>.</li>\n<li>La corrélation r est la covariance « normalisée » : r = 1 lien linéaire parfait croissant, r = −1 décroissant, r = 0 aucun lien linéaire.</li>\n</ul>\n<pre class=\"\"><code>X = np.array([-1, 12, 3, -4, 5]); Y = np.array([15, 44, 13, 2, -1])\nprint(np.round(np.corrcoef(X, Y)[0, 1], 4))\nprint(np.cov(np.array([[1, 6, 13, 41, 5], [5, 0, -3, 2, 11]]))[0, 1])</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>0.7334\n-23.75</code></pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p><strong>Corrélation n&#39;est pas causalité</strong> : deux variables peuvent évoluer ensemble sans que l&#39;une cause l&#39;autre.</p>\n</aside><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Pourquoi fixer une graine (<code>default_rng(42)</code>) ?</div><button class=\"opt\" data-o=\"0\">Pour obtenir des nombres vraiment aléatoires</button><button class=\"opt\" data-o=\"1\">Pour reproduire exactement la même suite de tirages</button><button class=\"opt\" data-o=\"2\">Pour accélérer les calculs</button><button class=\"opt\" data-o=\"3\">Pour tirer sans remise</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Quelle instruction simule un dé à 6 faces ?</div><button class=\"opt\" data-o=\"0\"><code>np.random.randint(1, 6)</code></button><button class=\"opt\" data-o=\"1\"><code>np.random.randint(1, 7)</code></button><button class=\"opt\" data-o=\"2\"><code>np.random.randint(0, 6)</code></button><button class=\"opt\" data-o=\"3\"><code>np.random.rand(6)</code></button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\"><code>np.random.shuffle(a)</code> renvoie :</div><button class=\"opt\" data-o=\"0\"><code>None</code>, et <code>a</code> est mélangé sur place</button><button class=\"opt\" data-o=\"1\">une copie mélangée de <code>a</code></button><button class=\"opt\" data-o=\"2\">les indices du mélange</button><button class=\"opt\" data-o=\"3\"><code>a</code> trié</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\"><code>np.random.choice([1, 2, 3], size=5, replace=False)</code> :</div><button class=\"opt\" data-o=\"0\">renvoie 5 valeurs distinctes</button><button class=\"opt\" data-o=\"1\">lève une erreur, car on ne peut pas tirer 5 éléments distincts parmi 3</button><button class=\"opt\" data-o=\"2\">renvoie 3 valeurs puis s&#39;arrête</button><button class=\"opt\" data-o=\"3\">renvoie des doublons</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Dans <code>np.random.normal(10, 3, 100)</code>, que vaut 3 ?</div><button class=\"opt\" data-o=\"0\">la variance</button><button class=\"opt\" data-o=\"1\">l&#39;écart-type</button><button class=\"opt\" data-o=\"2\">la médiane</button><button class=\"opt\" data-o=\"3\">le nombre d&#39;échantillons</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Quelle loi modélise le nombre de clients arrivant en une heure ?</div><button class=\"opt\" data-o=\"0\">Normale</button><button class=\"opt\" data-o=\"1\">Poisson</button><button class=\"opt\" data-o=\"2\">Uniforme continue</button><button class=\"opt\" data-o=\"3\">Logistique</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\"><code>np.random.binomial(n=10, p=0.5)</code> renvoie :</div><button class=\"opt\" data-o=\"0\">un entier entre 0 et 10 (nombre de succès)</button><button class=\"opt\" data-o=\"1\">une suite de 10 valeurs 0/1</button><button class=\"opt\" data-o=\"2\">un flottant entre 0 et 1</button><button class=\"opt\" data-o=\"3\">toujours 5</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\"><code>np.around(2.5)</code> vaut :</div><button class=\"opt\" data-o=\"0\">2.0</button><button class=\"opt\" data-o=\"1\">3.0</button><button class=\"opt\" data-o=\"2\">2.5</button><button class=\"opt\" data-o=\"3\">3</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\"><code>np.floor(-2.3)</code> et <code>np.trunc(-2.3)</code> valent :</div><button class=\"opt\" data-o=\"0\">−2 et −2</button><button class=\"opt\" data-o=\"1\">−3 et −2</button><button class=\"opt\" data-o=\"2\">−2 et −3</button><button class=\"opt\" data-o=\"3\">−3 et −3</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\"><code>np.diff([2, 5, 9])</code> vaut :</div><button class=\"opt\" data-o=\"0\"><code>[3 4]</code></button><button class=\"opt\" data-o=\"1\"><code>[2 3 4]</code></button><button class=\"opt\" data-o=\"2\"><code>[7 14]</code></button><button class=\"opt\" data-o=\"3\"><code>[1]</code></button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"10\"><div class=\"qq-q\">Une corrélation r = −0.95 entre X et Y signifie :</div><button class=\"opt\" data-o=\"0\">aucun lien</button><button class=\"opt\" data-o=\"1\">un fort lien linéaire : quand X augmente, Y diminue</button><button class=\"opt\" data-o=\"2\">X cause la baisse de Y</button><button class=\"opt\" data-o=\"3\">une erreur de calcul</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"11\"><div class=\"qq-q\"><code>np.cumsum([1, 2, 3])</code> vaut :</div><button class=\"opt\" data-o=\"0\">6</button><button class=\"opt\" data-o=\"1\"><code>[1 3 6]</code></button><button class=\"opt\" data-o=\"2\"><code>[1 2 3]</code></button><button class=\"opt\" data-o=\"3\"><code>[6 5 3]</code></button><div class=\"qq-e\" hidden></div></div></section>","ex":[],"qcm":[{"n":"numpy-random","q":"Pourquoi fixer une graine (<code>default_rng(42)</code>) ?","o":["Pour obtenir des nombres vraiment aléatoires","Pour reproduire exactement la même suite de tirages","Pour accélérer les calculs","Pour tirer sans remise"],"a":1,"e":"La graine initialise l&#39;algorithme : même graine, même suite. C&#39;est la reproductibilité."},{"n":"numpy-random","q":"Quelle instruction simule un dé à 6 faces ?","o":["<code>np.random.randint(1, 6)</code>","<code>np.random.randint(1, 7)</code>","<code>np.random.randint(0, 6)</code>","<code>np.random.rand(6)</code>"],"a":1,"e":"La borne haute est exclue : il faut 7 pour pouvoir obtenir 6."},{"n":"numpy-random","q":"<code>np.random.shuffle(a)</code> renvoie :","o":["<code>None</code>, et <code>a</code> est mélangé sur place","une copie mélangée de <code>a</code>","les indices du mélange","<code>a</code> trié"],"a":0,"e":"C&#39;est <code>permutation</code> qui renvoie une copie."},{"n":"numpy-random","q":"<code>np.random.choice([1, 2, 3], size=5, replace=False)</code> :","o":["renvoie 5 valeurs distinctes","lève une erreur, car on ne peut pas tirer 5 éléments distincts parmi 3","renvoie 3 valeurs puis s&#39;arrête","renvoie des doublons"],"a":1,"e":"Sans remise, <code>size</code> doit être inférieur ou égal à la taille du tableau."},{"n":"numpy-random","q":"Dans <code>np.random.normal(10, 3, 100)</code>, que vaut 3 ?","o":["la variance","l&#39;écart-type","la médiane","le nombre d&#39;échantillons"],"a":1,"e":"<code>scale</code> est l&#39;écart-type σ ; la variance vaut 9."},{"n":"numpy-random","q":"Quelle loi modélise le nombre de clients arrivant en une heure ?","o":["Normale","Poisson","Uniforme continue","Logistique"],"a":1,"e":"Poisson compte des événements sur un intervalle, avec E[X] = Var(X) = λ."},{"n":"numpy-random","q":"<code>np.random.binomial(n=10, p=0.5)</code> renvoie :","o":["un entier entre 0 et 10 (nombre de succès)","une suite de 10 valeurs 0/1","un flottant entre 0 et 1","toujours 5"],"a":0,"e":"C&#39;est le <strong>nombre</strong> de succès sur 10 essais ; sa moyenne vaut n·p = 5."},{"n":"numpy-random","q":"<code>np.around(2.5)</code> vaut :","o":["2.0","3.0","2.5","3"],"a":0,"e":"Arrondi bancaire : en cas d&#39;égalité, on va vers le nombre pair."},{"n":"numpy-random","q":"<code>np.floor(-2.3)</code> et <code>np.trunc(-2.3)</code> valent :","o":["−2 et −2","−3 et −2","−2 et −3","−3 et −3"],"a":1,"e":"floor descend vers −∞ ; trunc coupe vers 0."},{"n":"numpy-random","q":"<code>np.diff([2, 5, 9])</code> vaut :","o":["<code>[3 4]</code>","<code>[2 3 4]</code>","<code>[7 14]</code>","<code>[1]</code>"],"a":0,"e":"Différences successives : 5 − 2 et 9 − 5. Le résultat a une case de moins."},{"n":"numpy-random","q":"Une corrélation r = −0.95 entre X et Y signifie :","o":["aucun lien","un fort lien linéaire : quand X augmente, Y diminue","X cause la baisse de Y","une erreur de calcul"],"a":1,"e":"r proche de −1 = forte relation linéaire décroissante. Pas de causalité pour autant."},{"n":"numpy-random","q":"<code>np.cumsum([1, 2, 3])</code> vaut :","o":["6","<code>[1 3 6]</code>","<code>[1 2 3]</code>","<code>[6 5 3]</code>"],"a":1,"e":"Somme cumulée : chaque case additionne tout ce qui précède."}]},{"id":"pandas-bases","t":"Pandas (1) · Series, DataFrames, fichiers et inspection","seance":"Séance 5 · 27 octobre 2026","imp":5,"html":"<p><strong>Pandas</strong> est la bibliothèque de manipulation de <strong>données tabulaires</strong> (lignes × colonnes, comme une feuille Excel ou une table SQL). Elle repose sur NumPy (et, depuis la version 2.0, peut utiliser PyArrow pour la mémoire).</p>\n<figure class=\"flux\"><figcaption>Où se place Pandas</figcaption><div class=\"flux-l\"><div class=\"flux-b\">Fichiers bruts (CSV, Excel, JSON, SQL)</div><div class=\"flux-f\">→</div><div class=\"flux-b\">pd.read_...()</div><div class=\"flux-f\">→</div><div class=\"flux-b\">DataFrame : nettoyer, filtrer, regrouper</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Graphiques (Matplotlib) ou Machine Learning (scikit-learn)</div></div></figure><pre class=\"\"><code>import numpy as np\nimport pandas as pd</code></pre><aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend</div><p>Toujours <code>import pandas as pd</code>, <strong>jamais</strong> <code>from pandas import *</code> : le préfixe <code>pd.</code> montre d&#39;où vient chaque fonction. L&#39;ancien objet 3D <code>Panel</code> n&#39;existe plus ; pour plus de 2 dimensions on utilise un <code>MultiIndex</code>.</p>\n</aside><h2>1. Les deux structures</h2>\n<table>\n<thead>\n<tr>\n<th></th>\n<th><strong>Series</strong></th>\n<th><strong>DataFrame</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Dimensions</td>\n<td>1D : une colonne</td>\n<td>2D : lignes × colonnes</td>\n</tr>\n<tr>\n<td>Repères</td>\n<td>un <strong>index</strong> (étiquettes des lignes)</td>\n<td>un index <strong>+</strong> des noms de colonnes</td>\n</tr>\n<tr>\n<td>Types</td>\n<td>un type par Series</td>\n<td>un type <strong>par colonne</strong> (hétérogène)</td>\n</tr>\n<tr>\n<td>Lien</td>\n<td>—</td>\n<td><strong>une collection de Series qui partagent le même index</strong></td>\n</tr>\n</tbody></table>\n<pre class=\"\"><code>df = pd.DataFrame({\n    &quot;Etudiant&quot;: [&quot;Sofia&quot;, &quot;Youssef&quot;, &quot;Amine&quot;, &quot;Youness&quot;],\n    &quot;Note_Examen&quot;: [14.5, 9.0, 16.5, 12.0],\n    &quot;Presence&quot;: [True, True, True, False],\n})\nnotes = df[&quot;Note_Examen&quot;]\nprint(type(notes).__name__)\ndf[&quot;Note_Bonus&quot;] = df[&quot;Note_Examen&quot;] + 2.0      # vectorisé : pas de boucle\nprint(df)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>Series\n  Etudiant  Note_Examen  Presence  Note_Bonus\n0    Sofia         14.5      True        16.5\n1  Youssef          9.0      True        11.0\n2    Amine         16.5      True        18.5\n3  Youness         12.0     False        14.0</code></pre><h2>2. Créer une Series</h2>\n<pre class=\"\"><code>s1 = pd.Series([5, -2, 14])                                  # liste → index 0, 1, 2\ns2 = pd.Series(np.array([-1, 12, 11]), index=[&quot;x&quot;, &quot;y&quot;, &quot;z&quot;]) # index personnalisé\ns3 = pd.Series({&quot;Rabat&quot;: 577, &quot;Fes&quot;: 1112, &quot;Agadir&quot;: 421})   # clés → index\ns4 = pd.Series({&quot;Rabat&quot;: 577, &quot;Fes&quot;: 1112, &quot;Agadir&quot;: 421}, index=[&quot;Fes&quot;, &quot;Rabat&quot;])  # filtre\ns5 = pd.Series(5, index=[&quot;a&quot;, &quot;b&quot;, &quot;c&quot;])                     # scalaire répété\nprint(s2[&quot;y&quot;], s3[&quot;Fes&quot;], s4.tolist(), s5.tolist())</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>12 1112 [1112, 577] [5, 5, 5]</code></pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p>Quelle que soit la source (liste, tableau NumPy, dictionnaire, scalaire), une Series = <strong>des valeurs 1D + un index</strong>. Avec un scalaire, l&#39;index est obligatoire. Mélanger nombres et texte force le type <code>object</code> : on évite pour les calculs.</p>\n</aside><h2>3. Accéder aux valeurs d&#39;une Series</h2>\n<table>\n<thead>\n<tr>\n<th>Écriture</th>\n<th>Se base sur</th>\n<th>Fin d&#39;un découpage</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>s.loc[...]</code></td>\n<td>les <strong>étiquettes</strong> (l&#39;index)</td>\n<td><strong>incluse</strong></td>\n</tr>\n<tr>\n<td><code>s.iloc[...]</code></td>\n<td>les <strong>positions</strong> 0 … n−1</td>\n<td><strong>exclue</strong></td>\n</tr>\n<tr>\n<td><code>s[condition]</code></td>\n<td>un masque booléen</td>\n<td>—</td>\n</tr>\n</tbody></table>\n<pre class=\"\"><code>s = pd.Series([5, -2, 14, 22, 50], index=[&quot;a&quot;, &quot;b&quot;, &quot;c&quot;, &quot;d&quot;, &quot;e&quot;])\nprint(s.loc[&quot;d&quot;], s.iloc[1])\nprint(s.loc[&quot;b&quot;:&quot;d&quot;].tolist(), s.iloc[1:3].tolist())\nprint(s[s &gt; 14].to_dict())</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>22 -2\n[-2, 14, 22] [-2, 14]\n{'d': 22, 'e': 50}</code></pre><figure class=\"grille\"><figcaption>s.loc[&quot;b&quot;:&quot;d&quot;] → fin INCLUSE (b, c, d)</figcaption><table><tr><th></th><th>a</th><th>b</th><th>c</th><th>d</th><th>e</th></tr><tr><th>pos</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td></tr><tr><th>étiquette</th><td>a</td><td class=\"h1\">b</td><td class=\"h1\">c</td><td class=\"h1\">d</td><td>e</td></tr><tr><th>valeur</th><td>5</td><td class=\"h1\">-2</td><td class=\"h1\">14</td><td class=\"h1\">22</td><td>50</td></tr></table></figure><figure class=\"grille\"><figcaption>s.iloc[1:3] → fin EXCLUE (positions 1 et 2)</figcaption><table><tr><th></th><th>a</th><th>b</th><th>c</th><th>d</th><th>e</th></tr><tr><th>pos</th><td>0</td><td class=\"h2\">1</td><td class=\"h2\">2</td><td>3</td><td>4</td></tr><tr><th>étiquette</th><td>a</td><td class=\"h2\">b</td><td class=\"h2\">c</td><td>d</td><td>e</td></tr><tr><th>valeur</th><td>5</td><td class=\"h2\">-2</td><td class=\"h2\">14</td><td>22</td><td>50</td></tr></table></figure><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p><strong><code>.loc</code> inclut la fin, <code>.iloc</code> l&#39;exclut.</strong> Question d&#39;examen quasi certaine. <code>iloc</code> ignore les étiquettes, <code>loc</code> ignore l&#39;ordre.</p>\n</aside><h2>4. Transformer une Series</h2>\n<ul>\n<li><code>.astype(type)</code> : change le type (<code>float</code> → <code>int</code> <strong>tronque</strong>).</li>\n<li><code>.tolist()</code> : convertit en liste Python.</li>\n<li><code>.apply(fonction)</code> : applique une fonction (souvent une <code>lambda</code>) à <strong>chaque</strong> élément. Pour un calcul.</li>\n<li><code>.map(dictionnaire)</code> : <strong>remplace</strong> chaque valeur par celle du dictionnaire. Pour encoder des catégories. Une valeur absente du dictionnaire devient <code>NaN</code>.</li>\n</ul>\n<pre class=\"\"><code>s = pd.Series([1.5, 2.3, 5.3]).astype(int)\nprint(s.tolist(), s.apply(lambda x: x + 5).tolist())\nfilieres = pd.Series([&quot;MIP&quot;, &quot;SVI&quot;, &quot;BCG&quot;, &quot;SVI&quot;, &quot;GEO&quot;])\nprint(filieres.map({&quot;MIP&quot;: 15, &quot;SVI&quot;: 12, &quot;BCG&quot;: 19}).tolist())</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>[1, 2, 5] [6, 7, 10]\n[15.0, 12.0, 19.0, 12.0, nan]</code></pre><h2>5. Créer un DataFrame</h2>\n<p><code>pd.DataFrame(data=None, index=None, columns=None, dtype=None)</code></p>\n<table>\n<thead>\n<tr>\n<th>Source</th>\n<th>Chaque élément devient…</th>\n<th>Exemple</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>liste simple</td>\n<td>une <strong>ligne</strong> d&#39;une colonne</td>\n<td><code>pd.DataFrame([&quot;MIP&quot;, &quot;SVI&quot;], columns=[&quot;Filiere&quot;])</code></td>\n</tr>\n<tr>\n<td>liste de listes</td>\n<td>une <strong>ligne</strong></td>\n<td><code>[[&quot;Youssef&quot;, 22], [&quot;Ali&quot;, 25]]</code></td>\n</tr>\n<tr>\n<td><strong>dict de listes</strong> (le plus courant)</td>\n<td>clé = <strong>colonne</strong></td>\n<td><code>{&quot;Nom&quot;: [...], &quot;Age&quot;: [...]}</code></td>\n</tr>\n<tr>\n<td>liste de dicts</td>\n<td>une <strong>ligne</strong> ; clé manquante → <code>NaN</code></td>\n<td><code>[{&quot;Nom&quot;: &quot;Souad&quot;}, ...]</code></td>\n</tr>\n<tr>\n<td>dict de Series</td>\n<td>colonne, <strong>alignée sur l&#39;index</strong></td>\n<td>index final = union des index</td>\n</tr>\n<tr>\n<td>tableau NumPy 2D</td>\n<td>une ligne</td>\n<td><code>pd.DataFrame(arr, columns=[...])</code></td>\n</tr>\n</tbody></table>\n<pre class=\"\"><code>df = pd.DataFrame({&quot;Nom&quot;: [&quot;Youssef&quot;, &quot;Ali&quot;, &quot;Souad&quot;], &quot;Age&quot;: [25, 30, 35],\n                   &quot;Ville&quot;: [&quot;Rabat&quot;, &quot;Agadir&quot;, &quot;Beni Mellal&quot;]}, index=[&quot;E1&quot;, &quot;E2&quot;, &quot;E3&quot;])\nprint(df)\nprint(pd.DataFrame([{&quot;Nom&quot;: &quot;Youssef&quot;, &quot;Age&quot;: 25}, {&quot;Nom&quot;: &quot;Souad&quot;}]))</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>        Nom  Age        Ville\nE1  Youssef   25        Rabat\nE2      Ali   30       Agadir\nE3    Souad   35  Beni Mellal\n       Nom   Age\n0  Youssef  25.0\n1    Souad   NaN</code></pre><h3>Alignement sur l&#39;index et le mystère des <code>float</code></h3>\n<pre class=\"\"><code>df = pd.DataFrame({&quot;Col1&quot;: pd.Series([5, -2, 3], index=[&quot;a&quot;, &quot;b&quot;, &quot;c&quot;]),\n                   &quot;Col2&quot;: pd.Series([2, 6, 3, 14], index=[&quot;a&quot;, &quot;b&quot;, &quot;c&quot;, &quot;d&quot;])})\nprint(df)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>   Col1  Col2\na   5.0     2\nb  -2.0     6\nc   3.0     3\nd   NaN    14</code></pre><figure class=\"etapes\" data-i=\"0\"><figcaption>Pourquoi Col1 est passée en décimales</figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Union des index</div><p>le DataFrame prend l&#39;index a, b, c, d (union des deux Series).</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · Case vide</div><p>Col1 n&#39;a pas de valeur pour <code>d</code> → Pandas y met <code>NaN</code>.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · NaN est un float</div><p>un entier <code>int64</code> ne peut pas contenir <code>NaN</code>.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · Conséquence</div><p>toute la colonne Col1 est convertie en <code>float64</code> : 5 devient 5.0.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · Solution</div><p>le type <strong><code>&quot;Int64&quot;</code></strong> (I majuscule, entier « nullable ») garde les entiers et note le manque <code>&lt;NA&gt;</code>.</p>\n</div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><pre class=\"\"><code>print(pd.Series([1, 2, np.nan]).dtype, pd.Series([1, 2, np.nan], dtype=&quot;Int64&quot;).tolist())</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>float64 [1, 2, &lt;NA&gt;]</code></pre><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>Un tableau NumPy qui mélange texte et nombres (<code>[[&quot;Youssef&quot;, 25, 8000], ...]</code>) est entièrement en <strong>texte</strong> : le DataFrame obtenu aura des âges <code>&quot;25&quot;</code> (chaînes), pas des nombres. Il faudra <code>astype(int)</code> avant de calculer.</p>\n</aside><h2>6. Lire et écrire des fichiers</h2>\n<h3>CSV : <code>pd.read_csv</code> / <code>df.to_csv</code></h3>\n<p>Créons un petit fichier pour tester :</p>\n<pre class=\"\"><code>with open(&quot;clients.csv&quot;, &quot;w&quot;, encoding=&quot;utf-8&quot;) as f:\n    f.write(&quot;# Export du 12/05/2026\\nID,Nom,Age,Ville,Salaire\\n1,Youssef,25,Safi,8000\\n&quot;\n            &quot;2,Souad,30,Agadir,N/A\\n3,Ali,22,Rabat,6000\\n4,Sara,28,Tanger,9500\\n&quot;)\ndf = pd.read_csv(&quot;clients.csv&quot;, comment=&quot;#&quot;, na_values=[&quot;N/A&quot;], index_col=&quot;ID&quot;,\n                 usecols=[&quot;ID&quot;, &quot;Nom&quot;, &quot;Salaire&quot;], nrows=3)\nprint(df)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>        Nom  Salaire\nID                  \n1   Youssef   8000.0\n2     Souad      NaN\n3       Ali   6000.0</code></pre><table>\n<thead>\n<tr>\n<th>Paramètre de <code>read_csv</code></th>\n<th>Rôle</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>sep</code></td>\n<td>séparateur (<code>,</code> par défaut, <code>;</code>, <code>\\t</code>)</td>\n</tr>\n<tr>\n<td><code>header</code> / <code>names</code></td>\n<td>ligne d&#39;en-tête / noms imposés si le fichier n&#39;en a pas</td>\n</tr>\n<tr>\n<td><code>usecols</code></td>\n<td>ne charger <strong>que</strong> ces colonnes (gain de mémoire)</td>\n</tr>\n<tr>\n<td><code>index_col</code></td>\n<td>colonne qui devient l&#39;<strong>index</strong></td>\n</tr>\n<tr>\n<td><code>nrows</code></td>\n<td>ne lire que les N premières lignes de données (tester un gros fichier)</td>\n</tr>\n<tr>\n<td><code>skiprows</code></td>\n<td>un <strong>entier N</strong> : sauter les N premières lignes ; une <strong>liste</strong> <code>[0, 2]</code> : sauter ces lignes précises ; une <strong>lambda</strong> possible</td>\n</tr>\n<tr>\n<td><code>na_values</code></td>\n<td>textes à lire comme <code>NaN</code> (<code>&quot;N/A&quot;</code>, <code>&quot;?&quot;</code>, <code>&quot;-&quot;</code>)</td>\n</tr>\n<tr>\n<td><code>comment</code></td>\n<td>lignes commençant par ce caractère ignorées</td>\n</tr>\n<tr>\n<td><code>parse_dates</code>, <code>dtype</code>, <code>encoding</code></td>\n<td>dates, types forcés (<code>{&quot;Code_Postal&quot;: str}</code>), encodage</td>\n</tr>\n</tbody></table>\n<figure class=\"grille\"><figcaption>skiprows=2 vs skiprows=[0, 2] sur le même fichier</figcaption><table><tr><th></th><th>fichier</th><th>skiprows=2</th><th>skiprows=[0,2]</th></tr><tr><th>ligne0</th><td>#</td><td>Metadonnees</td><td class=\"h0\">sautée</td><td class=\"h0\">sautée</td></tr><tr><th>ligne1</th><td>#</td><td>Titre</td><td class=\"h0\">sautée</td><td class=\"h1\">en-tête</td></tr><tr><th>ligne2</th><td>Nom,Prix</td><td class=\"h1\">en-tête</td><td class=\"h0\">sautée</td></tr><tr><th>ligne3</th><td>A,100</td><td>donnée</td><td>donnée</td></tr></table></figure><aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p>Pour un <strong>code postal</strong> ou un identifiant, force <code>dtype={&quot;Code_Postal&quot;: str}</code> : sinon <code>&quot;01200&quot;</code> devient le nombre <code>1200</code>.</p>\n</aside><p><strong>Écrire</strong> : <code>df.to_csv(chemin, sep=&quot;,&quot;, index=True, header=True, columns=None, na_rep=&quot;&quot;, float_format=None, mode=&quot;w&quot;, encoding=...)</code>.</p>\n<pre class=\"\"><code>df = pd.DataFrame({&quot;Nom&quot;: [&quot;Youssef&quot;, &quot;Sara&quot;], &quot;Salaire&quot;: [8500.507, np.nan]})\nprint(df.to_csv())                                     # sans chemin : renvoie le texte\nprint(df.to_csv(sep=&quot;;&quot;, index=False, na_rep=&quot;NON_RENSEIGNE&quot;, float_format=&quot;%.2f&quot;))</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>,Nom,Salaire\n0,Youssef,8500.507\n1,Sara,\n\nNom;Salaire\nYoussef;8500.51\nSara;NON_RENSEIGNE</code></pre><aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend</div><p>En production : <code>index=False</code> (sauf si l&#39;index est une vraie clé comme un ID ou une date), <code>sep=&quot;;&quot;</code> et <code>encoding=&quot;utf-8-sig&quot;</code> pour qu&#39;Excel ouvre le fichier correctement avec les accents et l&#39;arabe. <code>mode=&quot;a&quot;</code> ajoute à la fin au lieu d&#39;écraser.</p>\n</aside><h3>Excel : <code>pd.read_excel</code> / <code>df.to_excel</code></h3>\n<p>Nécessite le moteur <strong>openpyxl</strong> pour les <code>.xlsx</code>.</p>\n<pre class=\"\"><code>with pd.ExcelWriter(&quot;ventes.xlsx&quot;) as w:\n    pd.DataFrame({&quot;Produit&quot;: [&quot;PC&quot;, &quot;Souris&quot;], &quot;Prix&quot;: [1500, 25]}).to_excel(w, sheet_name=&quot;Janvier&quot;, index=False)\n    pd.DataFrame({&quot;Produit&quot;: [&quot;Ecran&quot;], &quot;Prix&quot;: [900]}).to_excel(w, sheet_name=&quot;Fevrier&quot;, index=False)\nune = pd.read_excel(&quot;ventes.xlsx&quot;, sheet_name=&quot;Fevrier&quot;)\ntoutes = pd.read_excel(&quot;ventes.xlsx&quot;, sheet_name=None)\nprint(type(une).__name__, type(toutes).__name__, list(toutes))\nprint(toutes[&quot;Janvier&quot;][&quot;Prix&quot;].sum())</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>DataFrame dict ['Janvier', 'Fevrier']\n1525</code></pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p><code>sheet_name</code> = un entier ou un nom → <strong>un DataFrame</strong>. Une liste ou <code>None</code> (toutes les feuilles) → <strong>un dictionnaire</strong> <code>{nom_feuille: DataFrame}</code>. Autres paramètres utiles : <code>header=2</code> (l&#39;en-tête est à la 3e ligne), <code>usecols=&quot;A,C&quot;</code> ou <code>&quot;A:D&quot;</code>, <code>na_values</code>, <code>dtype</code>, <code>skiprows</code>.</p>\n</aside><h3>JSON : <code>pd.read_json</code> / <code>df.to_json</code></h3>\n<p>Le paramètre <strong><code>orient</code></strong> décrit la forme du JSON :</p>\n<table>\n<thead>\n<tr>\n<th><code>orient</code></th>\n<th>Forme</th>\n<th>Usage</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>&quot;records&quot;</code></td>\n<td><code>[{&quot;A&quot;: 10, &quot;B&quot;: 20}, {&quot;A&quot;: 30, &quot;B&quot;: 40}]</code></td>\n<td>APIs web (le plus courant)</td>\n</tr>\n<tr>\n<td><code>&quot;columns&quot;</code> (défaut d&#39;un DataFrame)</td>\n<td><code>{&quot;A&quot;: {&quot;0&quot;: 10, &quot;1&quot;: 30}, ...}</code></td>\n<td></td>\n</tr>\n<tr>\n<td><code>&quot;split&quot;</code></td>\n<td><code>{&quot;columns&quot;: [...], &quot;data&quot;: [[...]]}</code></td>\n<td></td>\n</tr>\n</tbody></table>\n<pre class=\"\"><code>df = pd.DataFrame({&quot;Nom&quot;: [&quot;Youssef&quot;, &quot;Sara&quot;], &quot;Ville&quot;: [&quot;Fès&quot;, &quot;Salé&quot;]})\nprint(df.to_json(orient=&quot;records&quot;, force_ascii=False))\nfrom io import StringIO\nprint(pd.read_json(StringIO('[{&quot;A&quot;: 10, &quot;B&quot;: 20}, {&quot;A&quot;: 30, &quot;B&quot;: 40}]'), orient=&quot;records&quot;))</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>[{&quot;Nom&quot;:&quot;Youssef&quot;,&quot;Ville&quot;:&quot;Fès&quot;},{&quot;Nom&quot;:&quot;Sara&quot;,&quot;Ville&quot;:&quot;Salé&quot;}]\n    A   B\n0  10  20\n1  30  40</code></pre><aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p><code>force_ascii=False</code> garde les accents et l&#39;arabe lisibles (sinon <code>Fès</code> devient <code>Fès</code>). <code>indent=4</code> rend le fichier lisible par un humain.</p>\n</aside><h2>7. Inspecter un DataFrame</h2>\n<pre class=\"\"><code>df = pd.DataFrame({&quot;Nom&quot;: [&quot;Saad&quot;, &quot;Amina&quot;, &quot;Ali&quot;, &quot;Hanane&quot;, &quot;Yassine&quot;, &quot;Sara&quot;],\n                   &quot;Age&quot;: [33, 42, 24, 21, 19, 28],\n                   &quot;Salaire&quot;: [9000, 5000, 10000, 10500, 15000, 7000]})\nprint(df.head(2))\nprint(df.tail(1))\nprint(df.shape, df.size, df.ndim, df.empty)\nprint(df[&quot;Age&quot;].describe().round(2).to_dict())</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>     Nom  Age  Salaire\n0   Saad   33     9000\n1  Amina   42     5000\n    Nom  Age  Salaire\n5  Sara   28     7000\n(6, 3) 18 2 False\n{'count': 6.0, 'mean': 27.83, 'std': 8.57, 'min': 19.0, '25%': 21.75, '50%': 26.0, '75%': 31.75, 'max': 42.0}</code></pre><table>\n<thead>\n<tr>\n<th>Méthode / attribut</th>\n<th>Renvoie</th>\n<th>Sert à</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>head(n)</code> / <code>tail(n)</code></td>\n<td>les n premières / dernières lignes (5 par défaut)</td>\n<td>jeter un œil</td>\n</tr>\n<tr>\n<td><code>describe()</code></td>\n<td>count, mean, std, min, quartiles 25/50/75 %, max</td>\n<td>statistiques des colonnes <strong>numériques</strong></td>\n</tr>\n<tr>\n<td><code>describe(include=&quot;all&quot;)</code></td>\n<td>+ pour le texte : <code>count</code>, <code>unique</code>, <code>top</code> (valeur la plus fréquente), <code>freq</code></td>\n<td></td>\n</tr>\n<tr>\n<td><code>info()</code></td>\n<td><strong>affiche</strong> (renvoie <code>None</code>) : types, valeurs non nulles, mémoire</td>\n<td><strong>premier réflexe</strong> après un chargement</td>\n</tr>\n<tr>\n<td><code>.T</code></td>\n<td>lignes ↔ colonnes</td>\n<td></td>\n</tr>\n<tr>\n<td><code>.shape</code>, <code>.size</code>, <code>.ndim</code>, <code>.empty</code></td>\n<td>(lignes, colonnes), nb de cases, toujours 2, vide ?</td>\n<td></td>\n</tr>\n<tr>\n<td><code>.axes</code>, <code>.dtypes</code>, <code>.values</code></td>\n<td>[index, colonnes], type par colonne, tableau NumPy</td>\n<td></td>\n</tr>\n</tbody></table>\n<aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>Le <strong>50 %</strong> de <code>describe()</code> est la <strong>médiane</strong>, pas la moyenne. Et <code>count</code> compte les valeurs <strong>non manquantes</strong> : s&#39;il est plus petit que le nombre de lignes, il y a des <code>NaN</code>.</p>\n</aside><aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>Avec <strong>Pandas 3</strong>, les colonnes de texte s&#39;affichent avec le type <code>str</code> au lieu de <code>object</code> (Pandas 2). Le cours a été écrit avec Pandas 2 : ne sois pas surpris par cette différence.</p>\n</aside><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quelle structure Pandas est une collection de Series partageant le même index ?</div><button class=\"opt\" data-o=\"0\">Series</button><button class=\"opt\" data-o=\"1\">DataFrame</button><button class=\"opt\" data-o=\"2\">ndarray</button><button class=\"opt\" data-o=\"3\">Panel</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\"><code>s = pd.Series([10, 20, 30, 40], index=[&quot;a&quot;, &quot;b&quot;, &quot;c&quot;, &quot;d&quot;])</code>. Que vaut <code>s.loc[&quot;b&quot;:&quot;c&quot;].tolist()</code> ?</div><button class=\"opt\" data-o=\"0\"><code>[20]</code></button><button class=\"opt\" data-o=\"1\"><code>[20, 30]</code></button><button class=\"opt\" data-o=\"2\"><code>[20, 30, 40]</code></button><button class=\"opt\" data-o=\"3\"><code>[10, 20]</code></button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Même Series : que vaut <code>s.iloc[1:3].tolist()</code> ?</div><button class=\"opt\" data-o=\"0\"><code>[20, 30]</code></button><button class=\"opt\" data-o=\"1\"><code>[20, 30, 40]</code></button><button class=\"opt\" data-o=\"2\"><code>[10, 20, 30]</code></button><button class=\"opt\" data-o=\"3\"><code>[30]</code></button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\"><code>pd.Series([&quot;A&quot;, &quot;B&quot;]).map({&quot;A&quot;: 1})</code> donne :</div><button class=\"opt\" data-o=\"0\"><code>[1, &quot;B&quot;]</code></button><button class=\"opt\" data-o=\"1\"><code>[1.0, NaN]</code></button><button class=\"opt\" data-o=\"2\">une erreur</button><button class=\"opt\" data-o=\"3\"><code>[1, 0]</code></button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Pourquoi une colonne d&#39;entiers devient-elle <code>float64</code> quand une valeur manque ?</div><button class=\"opt\" data-o=\"0\">Pandas arrondit toujours les entiers</button><button class=\"opt\" data-o=\"1\"><code>NaN</code> est un float, et un <code>int64</code> ne peut pas le contenir</button><button class=\"opt\" data-o=\"2\">À cause de <code>read_csv</code></button><button class=\"opt\" data-o=\"3\">Parce que l&#39;index est mélangé</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Dans <code>pd.read_csv(&quot;f.csv&quot;, skiprows=[0, 2])</code> :</div><button class=\"opt\" data-o=\"0\">on saute les 2 premières lignes</button><button class=\"opt\" data-o=\"1\">on saute uniquement les lignes 0 et 2 du fichier</button><button class=\"opt\" data-o=\"2\">on ne lit que les lignes 0 et 2</button><button class=\"opt\" data-o=\"3\">on saute une ligne sur deux</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\"><code>pd.read_excel(&quot;f.xlsx&quot;, sheet_name=None)</code> renvoie :</div><button class=\"opt\" data-o=\"0\">le DataFrame de la première feuille</button><button class=\"opt\" data-o=\"1\">un dictionnaire {nom de feuille : DataFrame}</button><button class=\"opt\" data-o=\"2\">une liste de DataFrames</button><button class=\"opt\" data-o=\"3\">None</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Quel paramètre de <code>to_csv</code> évite d&#39;écrire la colonne 0, 1, 2… ?</div><button class=\"opt\" data-o=\"0\"><code>header=False</code></button><button class=\"opt\" data-o=\"1\"><code>index=False</code></button><button class=\"opt\" data-o=\"2\"><code>sep=&quot;;&quot;</code></button><button class=\"opt\" data-o=\"3\"><code>columns=None</code></button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Dans <code>df.describe()</code>, la ligne <code>50%</code> correspond à :</div><button class=\"opt\" data-o=\"0\">la moyenne</button><button class=\"opt\" data-o=\"1\">la médiane</button><button class=\"opt\" data-o=\"2\">la moitié du maximum</button><button class=\"opt\" data-o=\"3\">l&#39;écart-type</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\"><code>df.info()</code> renvoie :</div><button class=\"opt\" data-o=\"0\">un DataFrame de statistiques</button><button class=\"opt\" data-o=\"1\">None : il affiche un résumé technique (types, non-nuls, mémoire)</button><button class=\"opt\" data-o=\"2\">la forme du DataFrame</button><button class=\"opt\" data-o=\"3\">les 5 premières lignes</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"10\"><div class=\"qq-q\">Pour un DataFrame de 120 lignes et 5 colonnes, <code>df.size</code> vaut :</div><button class=\"opt\" data-o=\"0\">120</button><button class=\"opt\" data-o=\"1\">5</button><button class=\"opt\" data-o=\"2\">600</button><button class=\"opt\" data-o=\"3\">(120, 5)</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"11\"><div class=\"qq-q\">Quel <code>orient</code> produit <code>[{&quot;Nom&quot;: &quot;Ali&quot;}, {&quot;Nom&quot;: &quot;Sara&quot;}]</code> ?</div><button class=\"opt\" data-o=\"0\"><code>&quot;records&quot;</code></button><button class=\"opt\" data-o=\"1\"><code>&quot;columns&quot;</code></button><button class=\"opt\" data-o=\"2\"><code>&quot;split&quot;</code></button><button class=\"opt\" data-o=\"3\"><code>&quot;index&quot;</code></button><div class=\"qq-e\" hidden></div></div></section>","ex":[],"qcm":[{"n":"pandas-bases","q":"Quelle structure Pandas est une collection de Series partageant le même index ?","o":["Series","DataFrame","ndarray","Panel"],"a":1,"e":"Chaque colonne d&#39;un DataFrame est une Series ; elles partagent l&#39;index des lignes."},{"n":"pandas-bases","q":"<code>s = pd.Series([10, 20, 30, 40], index=[&quot;a&quot;, &quot;b&quot;, &quot;c&quot;, &quot;d&quot;])</code>. Que vaut <code>s.loc[&quot;b&quot;:&quot;c&quot;].tolist()</code> ?","o":["<code>[20]</code>","<code>[20, 30]</code>","<code>[20, 30, 40]</code>","<code>[10, 20]</code>"],"a":1,"e":"Avec <code>.loc</code>, la borne de fin est incluse."},{"n":"pandas-bases","q":"Même Series : que vaut <code>s.iloc[1:3].tolist()</code> ?","o":["<code>[20, 30]</code>","<code>[20, 30, 40]</code>","<code>[10, 20, 30]</code>","<code>[30]</code>"],"a":0,"e":"Positions 1 et 2 : <code>.iloc</code> exclut la fin."},{"n":"pandas-bases","q":"<code>pd.Series([&quot;A&quot;, &quot;B&quot;]).map({&quot;A&quot;: 1})</code> donne :","o":["<code>[1, &quot;B&quot;]</code>","<code>[1.0, NaN]</code>","une erreur","<code>[1, 0]</code>"],"a":1,"e":"Une valeur absente du dictionnaire devient NaN, ce qui force le type float."},{"n":"pandas-bases","q":"Pourquoi une colonne d&#39;entiers devient-elle <code>float64</code> quand une valeur manque ?","o":["Pandas arrondit toujours les entiers","<code>NaN</code> est un float, et un <code>int64</code> ne peut pas le contenir","À cause de <code>read_csv</code>","Parce que l&#39;index est mélangé"],"a":1,"e":"Pour garder des entiers, on utilise le type nullable <code>&quot;Int64&quot;</code>."},{"n":"pandas-bases","q":"Dans <code>pd.read_csv(&quot;f.csv&quot;, skiprows=[0, 2])</code> :","o":["on saute les 2 premières lignes","on saute uniquement les lignes 0 et 2 du fichier","on ne lit que les lignes 0 et 2","on saute une ligne sur deux"],"a":1,"e":"Une liste désigne des lignes précises ; un entier N saute les N premières."},{"n":"pandas-bases","q":"<code>pd.read_excel(&quot;f.xlsx&quot;, sheet_name=None)</code> renvoie :","o":["le DataFrame de la première feuille","un dictionnaire {nom de feuille : DataFrame}","une liste de DataFrames","None"],"a":1,"e":"None (ou une liste) charge plusieurs feuilles, rangées dans un dictionnaire."},{"n":"pandas-bases","q":"Quel paramètre de <code>to_csv</code> évite d&#39;écrire la colonne 0, 1, 2… ?","o":["<code>header=False</code>","<code>index=False</code>","<code>sep=&quot;;&quot;</code>","<code>columns=None</code>"],"a":1,"e":"<code>index=False</code> n&#39;écrit pas l&#39;index des lignes."},{"n":"pandas-bases","q":"Dans <code>df.describe()</code>, la ligne <code>50%</code> correspond à :","o":["la moyenne","la médiane","la moitié du maximum","l&#39;écart-type"],"a":1,"e":"Le 50e percentile est la médiane (Q2)."},{"n":"pandas-bases","q":"<code>df.info()</code> renvoie :","o":["un DataFrame de statistiques","None : il affiche un résumé technique (types, non-nuls, mémoire)","la forme du DataFrame","les 5 premières lignes"],"a":1,"e":"info() affiche puis renvoie None ; c&#39;est le premier réflexe après un chargement."},{"n":"pandas-bases","q":"Pour un DataFrame de 120 lignes et 5 colonnes, <code>df.size</code> vaut :","o":["120","5","600","(120, 5)"],"a":2,"e":"size = nombre de cases = lignes × colonnes ; shape = (120, 5)."},{"n":"pandas-bases","q":"Quel <code>orient</code> produit <code>[{&quot;Nom&quot;: &quot;Ali&quot;}, {&quot;Nom&quot;: &quot;Sara&quot;}]</code> ?","o":["<code>&quot;records&quot;</code>","<code>&quot;columns&quot;</code>","<code>&quot;split&quot;</code>","<code>&quot;index&quot;</code>"],"a":0,"e":"records = une liste d&#39;objets, un par ligne : le format des APIs web."}]},{"id":"pandas-manipulation","t":"Pandas (2) · sélectionner, modifier, trier, agréger, regrouper","seance":"Séance 6 · 1er novembre 2026","imp":5,"html":"<p>Tous les exemples de ce chapitre utilisent ce petit jeu de données :</p>\n<pre class=\"\"><code>import pandas as pd\n\ndf = pd.DataFrame({\n    &quot;Nom&quot;: [&quot;Ali&quot;, &quot;Amina&quot;, &quot;Saad&quot;, &quot;Hanane&quot;, &quot;Yassine&quot;],\n    &quot;Age&quot;: [24, 42, 33, 21, 19],\n    &quot;Departement&quot;: [&quot;IT&quot;, &quot;RH&quot;, &quot;IT&quot;, &quot;Ventes&quot;, &quot;IT&quot;],\n    &quot;Salaire&quot;: [10000, 5000, 9000, 10500, 15000],\n})\nprint(df)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>       Nom  Age Departement  Salaire\n0      Ali   24          IT    10000\n1    Amina   42          RH     5000\n2     Saad   33          IT     9000\n3   Hanane   21      Ventes    10500\n4  Yassine   19          IT    15000</code></pre><h2>1. Sélectionner des colonnes</h2>\n<table>\n<thead>\n<tr>\n<th>Écriture</th>\n<th>Résultat</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>df[&quot;Nom&quot;]</code></td>\n<td>une <strong>Series</strong> (1D)</td>\n</tr>\n<tr>\n<td><code>df[[&quot;Nom&quot;, &quot;Age&quot;]]</code> (doubles crochets)</td>\n<td>un <strong>DataFrame</strong> (2D), même pour une seule colonne</td>\n</tr>\n<tr>\n<td><code>df.Nom</code></td>\n<td>Series ; ne marche pas si le nom contient un espace ou s&#39;appelle comme une méthode (<code>count</code>, <code>shape</code>)</td>\n</tr>\n<tr>\n<td><code>df.loc[:, &quot;Nom&quot;]</code> / <code>df.iloc[:, 0]</code></td>\n<td>par nom / par position, avec <code>:</code> = toutes les lignes</td>\n</tr>\n</tbody></table>\n<pre class=\"\"><code>print(type(df[&quot;Nom&quot;]).__name__, type(df[[&quot;Nom&quot;]]).__name__)\nprint(df.iloc[:, [0, 3]].columns.tolist())</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>Series DataFrame\n['Nom', 'Salaire']</code></pre><aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend</div><p>En production, préfère <code>df[&quot;Nom&quot;]</code> à <code>df.Nom</code> : l&#39;attribut casse dès qu&#39;un nom contient un espace ou entre en conflit avec une méthode Pandas.</p>\n</aside><h2>2. Ajouter, supprimer, renommer des colonnes</h2>\n<table>\n<thead>\n<tr>\n<th>Méthode</th>\n<th>Position</th>\n<th>Modifie <code>df</code> ?</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>df[&quot;Prime&quot;] = ...</code></td>\n<td>à la fin (droite)</td>\n<td><strong>oui, sur place</strong></td>\n</tr>\n<tr>\n<td><code>df.insert(loc, &quot;Col&quot;, valeurs)</code></td>\n<td>à la <strong>position</strong> loc</td>\n<td><strong>oui, sur place</strong></td>\n</tr>\n<tr>\n<td><code>df.assign(Col=...)</code></td>\n<td>à la fin</td>\n<td><strong>non</strong> : renvoie une copie (à réaffecter)</td>\n</tr>\n<tr>\n<td><code>df.drop(columns=[...])</code> ou <code>drop([...], axis=1)</code></td>\n<td>—</td>\n<td>non (sauf <code>inplace=True</code>)</td>\n</tr>\n<tr>\n<td><code>del df[&quot;Col&quot;]</code></td>\n<td>—</td>\n<td><strong>oui</strong>, une seule colonne</td>\n</tr>\n<tr>\n<td><code>df.rename(columns={&quot;ancien&quot;: &quot;nouveau&quot;})</code></td>\n<td>—</td>\n<td>non (sauf <code>inplace=True</code>)</td>\n</tr>\n</tbody></table>\n<pre class=\"\"><code>d = df.copy()\nd[&quot;Prime&quot;] = d[&quot;Salaire&quot;] * 0.10                     # opération vectorisée\nd.insert(1, &quot;Ville&quot;, [&quot;Rabat&quot;, &quot;Fes&quot;, &quot;Safi&quot;, &quot;Agadir&quot;, &quot;Tanger&quot;])\nd2 = d.assign(Total=d[&quot;Salaire&quot;] + d[&quot;Prime&quot;])        # d n'est pas modifié\nd2 = d2.drop(columns=[&quot;Ville&quot;]).rename(columns={&quot;Nom&quot;: &quot;Employe&quot;})\ndel d2[&quot;Prime&quot;]\nprint(d.columns.tolist())\nprint(d2.columns.tolist())</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>['Nom', 'Ville', 'Age', 'Departement', 'Salaire', 'Prime']\n['Employe', 'Age', 'Departement', 'Salaire', 'Total']</code></pre><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p><code>df.assign(...)</code>, <code>df.drop(...)</code>, <code>df.rename(...)</code>, <code>df.sort_values(...)</code> <strong>renvoient une copie</strong>. Écrire <code>df.drop(columns=[&quot;X&quot;])</code> seul ne change rien : il faut <code>df = df.drop(...)</code> ou <code>inplace=True</code>.</p>\n</aside><h3>Le paramètre <code>axis</code>, enfin clair</h3>\n<figure class=\"grille\"><figcaption>drop(..., axis=0) supprime une LIGNE · drop(..., axis=1) supprime une COLONNE</figcaption><table><tr><th></th><th>Nom</th><th>Age</th><th>Salaire</th></tr><tr><th>0</th><td>Ali</td><td>24</td><td class=\"h1\">10000</td></tr><tr><th>1</th><td class=\"h0\">Amina</td><td class=\"h0\">42</td><td class=\"h0\">5000</td></tr><tr><th>2</th><td>Saad</td><td>33</td><td class=\"h1\">9000</td></tr></table></figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p>L&#39;axe indique <strong>le sens dans lequel Pandas se déplace</strong>. <code>axis=0</code> : de haut en bas. <code>drop(axis=0)</code> cherche une étiquette <strong>de ligne</strong> ; <code>sum(axis=0)</code> écrase les lignes → <strong>une somme par colonne</strong>. <code>axis=1</code> : de gauche à droite. <code>drop(axis=1)</code> cherche <strong>une colonne</strong> ; <code>sum(axis=1)</code> → <strong>une somme par ligne</strong>. Pour éviter la confusion avec <code>drop</code>, écris <code>drop(columns=...)</code> ou <code>drop(index=...)</code>.</p>\n</aside><h2>3. Sélectionner des lignes</h2>\n<pre class=\"\"><code>print(df.loc[2, &quot;Nom&quot;], df.iloc[2, 0])\nprint(df.loc[[0, 2], [&quot;Nom&quot;, &quot;Age&quot;, &quot;Salaire&quot;]])\nprint(df[df[&quot;Age&quot;] &gt; 30][&quot;Nom&quot;].tolist())\nprint(df[(df[&quot;Departement&quot;] == &quot;IT&quot;) &amp; (df[&quot;Salaire&quot;] &gt;= 10000)][&quot;Nom&quot;].tolist())\nprint(df[(df[&quot;Age&quot;] &lt; 20) | (df[&quot;Departement&quot;] == &quot;RH&quot;)][&quot;Nom&quot;].tolist())</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>Saad Saad\n    Nom  Age  Salaire\n0   Ali   24    10000\n2  Saad   33     9000\n['Amina', 'Saad']\n['Ali', 'Yassine']\n['Amina', 'Yassine']</code></pre><figure class=\"grille\"><figcaption>df.loc[[0, 2], [&quot;Nom&quot;, &quot;Age&quot;, &quot;Salaire&quot;]] : on croise des lignes et des colonnes</figcaption><table><tr><th></th><th>Nom</th><th>Age</th><th>Departement</th><th>Salaire</th></tr><tr><th>0</th><td class=\"h1\">Ali</td><td class=\"h1\">24</td><td class=\"h0\">IT</td><td class=\"h1\">10000</td></tr><tr><th>1</th><td class=\"h0\">Amina</td><td class=\"h0\">42</td><td class=\"h0\">RH</td><td class=\"h0\">5000</td></tr><tr><th>2</th><td class=\"h1\">Saad</td><td class=\"h1\">33</td><td class=\"h0\">IT</td><td class=\"h1\">9000</td></tr><tr><th>3</th><td class=\"h0\">Hanane</td><td class=\"h0\">21</td><td class=\"h0\">Ventes</td><td class=\"h0\">10500</td></tr><tr><th>4</th><td class=\"h0\">Yassine</td><td class=\"h0\">19</td><td class=\"h0\">IT</td><td class=\"h0\">15000</td></tr></table></figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p>Syntaxe universelle : <strong><code>df.loc[lignes, colonnes]</code></strong> avec des <strong>étiquettes</strong> ; <strong><code>df.iloc[lignes, colonnes]</code></strong> avec des <strong>positions</strong>. <code>:</code> = tout. Conditions multiples : <code>&amp;</code>, <code>|</code>, et <strong>parenthèses obligatoires</strong> autour de chaque condition.</p>\n</aside><h2>4. Ajouter, supprimer, renommer des lignes</h2>\n<pre class=\"\"><code>nouveau = pd.DataFrame([{&quot;Nom&quot;: &quot;Sara&quot;, &quot;Age&quot;: 28, &quot;Departement&quot;: &quot;RH&quot;, &quot;Salaire&quot;: 7000}])\nd = pd.concat([df, nouveau], ignore_index=True)        # df.append n'existe plus\nd.loc[len(d)] = [&quot;Omar&quot;, 30, &quot;IT&quot;, 8000]              # ajout à une étiquette précise\nd = d.drop(index=[1, 3])                               # par étiquettes\nprint(d.index.tolist())\nd = d.reset_index(drop=True)                           # renumérote 0, 1, 2...\nprint(d.index.tolist(), d.drop(d.index[0])[&quot;Nom&quot;].tolist()[:2])\nprint(d.rename(index={0: &quot;premier&quot;}).index.tolist()[:2])</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>[0, 2, 4, 5, 6]\n[0, 1, 2, 3, 4] ['Saad', 'Yassine']\n['premier', 1]</code></pre><ul>\n<li><code>pd.concat([df1, df2])</code> (liste de DataFrames) remplace <code>append</code>, <strong>supprimée en Pandas 2.0</strong>.</li>\n<li>Après un <code>concat</code> ou un filtre, l&#39;index garde ses anciens numéros (doublons, trous) : <code>ignore_index=True</code> ou <code>reset_index(drop=True)</code>. Sans <code>drop=True</code>, l&#39;ancien index devient une colonne.</li>\n<li><code>drop</code> attend des <strong>étiquettes</strong>. Pour supprimer la 2e ligne <strong>par position</strong> : <code>df.drop(df.index[1])</code>.</li>\n</ul>\n<h2>5. Réindexer : <code>reindex</code></h2>\n<p><code>reindex</code> <strong>conforme</strong> le DataFrame à une nouvelle liste d&#39;étiquettes : il réordonne, et crée des lignes <code>NaN</code> pour les étiquettes inconnues. (À ne pas confondre avec <code>rename</code>, qui change les noms.)</p>\n<pre class=\"\"><code>s = pd.Series([10, 20, 30], index=[0, 2, 4])\nprint(s.reindex([0, 1, 2, 3, 4, 5]).tolist())\nprint(s.reindex([0, 1, 2, 3, 4, 5], method=&quot;ffill&quot;).tolist())\nprint(s.reindex([0, 1, 2, 3, 4, 5], method=&quot;bfill&quot;).tolist())\nprint(s.reindex([0, 1, 2, 3, 4, 5], fill_value=100).tolist())\nprint(pd.Series([10, 40], index=[0, 3]).reindex(range(5), method=&quot;ffill&quot;, limit=1).tolist())</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>[10.0, nan, 20.0, nan, 30.0, nan]\n[10, 10, 20, 20, 30, 30]\n[10.0, 20.0, 20.0, 30.0, 30.0, nan]\n[10, 100, 20, 100, 30, 100]\n[10.0, 10.0, nan, 40.0, 40.0]</code></pre><figure class=\"grille\"><figcaption>method=&quot;ffill&quot; : on recopie la dernière valeur connue vers l'avant</figcaption><table><tr><th></th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><th>avant</th><td>10</td><td class=\"h0\">NaN</td><td>20</td><td class=\"h0\">NaN</td><td>30</td><td class=\"h0\">NaN</td></tr><tr><th>ffill</th><td>10</td><td class=\"h1\">10</td><td>20</td><td class=\"h1\">20</td><td>30</td><td class=\"h1\">30</td></tr><tr><th>bfill</th><td>10</td><td class=\"h2\">20</td><td>20</td><td class=\"h2\">30</td><td>30</td><td class=\"h0\">NaN</td></tr></table></figure><table>\n<thead>\n<tr>\n<th>Option</th>\n<th>Effet</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>method=&quot;ffill&quot;</code> (<code>&quot;pad&quot;</code>)</td>\n<td>propage la dernière valeur valide vers l&#39;avant</td>\n</tr>\n<tr>\n<td><code>method=&quot;bfill&quot;</code> (<code>&quot;backfill&quot;</code>)</td>\n<td>prend la valeur valide suivante</td>\n</tr>\n<tr>\n<td><code>method=&quot;nearest&quot;</code></td>\n<td>la plus proche (index trié, numérique)</td>\n</tr>\n<tr>\n<td><code>fill_value=v</code></td>\n<td>remplit les nouvelles lignes par une constante</td>\n</tr>\n<tr>\n<td><code>limit=n</code></td>\n<td>au plus n trous consécutifs remplis</td>\n</tr>\n</tbody></table>\n<p><code>a.reindex_like(b)</code> donne à <code>a</code> exactement l&#39;index et les colonnes de <code>b</code> (utile en Machine Learning pour que le jeu de test ait les mêmes colonnes que le jeu d&#39;entraînement).</p>\n<h2>6. Parcourir un DataFrame</h2>\n<table>\n<thead>\n<tr>\n<th>Boucle</th>\n<th>Donne</th>\n<th>Remarque</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>for col in df:</code></td>\n<td>les <strong>noms de colonnes</strong></td>\n<td>souvent une surprise</td>\n</tr>\n<tr>\n<td><code>for nom, serie in df.items():</code></td>\n<td>(nom, Series) par colonne</td>\n<td></td>\n</tr>\n<tr>\n<td><code>for idx, ligne in df.iterrows():</code></td>\n<td>(index, Series) par ligne</td>\n<td>lent ; peut changer les types</td>\n</tr>\n<tr>\n<td><code>for ligne in df.itertuples():</code></td>\n<td>un <em>namedtuple</em> par ligne : <code>ligne.Index</code>, <code>ligne.Age</code></td>\n<td><strong>plus rapide</strong>, garde les types</td>\n</tr>\n</tbody></table>\n<pre class=\"\"><code>print(list(df)[:2])\nfor ligne in df.head(2).itertuples():\n    print(ligne.Index, ligne.Nom, ligne.Salaire)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>['Nom', 'Age']\n0 Ali 10000\n1 Amina 5000</code></pre><aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend</div><p>Boucler sur les lignes est <strong>très lent</strong>. Cherche toujours d&#39;abord l&#39;opération vectorisée (<code>df[&quot;A&quot;] * df[&quot;B&quot;]</code>). Si une boucle est inévitable : <code>itertuples()</code> plutôt que <code>iterrows()</code>.</p>\n</aside><h2>7. Trier</h2>\n<pre class=\"\"><code>print(df.sort_values(by=&quot;Salaire&quot;, ascending=False)[&quot;Nom&quot;].tolist())\nprint(df.sort_values(by=[&quot;Departement&quot;, &quot;Age&quot;], ascending=[True, False])[[&quot;Departement&quot;, &quot;Nom&quot;]].values.tolist())\nprint(df.sort_index(ascending=False).index.tolist(), df.sort_index(axis=1).columns.tolist())</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>['Yassine', 'Hanane', 'Ali', 'Saad', 'Amina']\n[['IT', 'Saad'], ['IT', 'Ali'], ['IT', 'Yassine'], ['RH', 'Amina'], ['Ventes', 'Hanane']]\n[4, 3, 2, 1, 0] ['Age', 'Departement', 'Nom', 'Salaire']</code></pre><ul>\n<li><code>sort_values(by=...)</code> : par <strong>contenu</strong>. Avec une liste, tri hiérarchique : d&#39;abord la 1re colonne, la 2e départage les égalités. <code>ascending</code> accepte aussi une liste.</li>\n<li><code>sort_index()</code> : par <strong>étiquettes</strong> des lignes ; <code>axis=1</code> trie l&#39;<strong>ordre des colonnes</strong>.</li>\n</ul>\n<h2>8. Transformer : <code>apply</code> et <code>map</code></h2>\n<table>\n<thead>\n<tr>\n<th>Méthode</th>\n<th>Reçoit</th>\n<th>Usage</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>serie.apply(f)</code></td>\n<td>chaque <strong>valeur</strong></td>\n<td>formule personnalisée</td>\n</tr>\n<tr>\n<td><code>df.apply(f)</code> (axis=0)</td>\n<td>chaque <strong>colonne</strong> (une Series)</td>\n<td>statistique par colonne</td>\n</tr>\n<tr>\n<td><code>df.apply(f, axis=1)</code></td>\n<td>chaque <strong>ligne</strong> (une Series)</td>\n<td>calcul qui combine plusieurs colonnes d&#39;un individu</td>\n</tr>\n<tr>\n<td><code>df.map(f)</code> (ex-<code>applymap</code>)</td>\n<td>chaque <strong>case</strong></td>\n<td>transformation cellule par cellule</td>\n</tr>\n</tbody></table>\n<pre class=\"\"><code>print(df[&quot;Salaire&quot;].apply(lambda s: s * 1.05).tolist()[:2])\nprint(df.apply(lambda ligne: f&quot;{ligne['Nom']} ({ligne['Departement']})&quot;, axis=1).tolist()[:2])\nprint(df[[&quot;Age&quot;, &quot;Salaire&quot;]].apply(lambda col: col.max() - col.min()).to_dict())\nprint(df[[&quot;Nom&quot;, &quot;Departement&quot;]].head(2).map(str.upper).values.tolist())</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>[10500.0, 5250.0]\n['Ali (IT)', 'Amina (RH)']\n{'Age': 23, 'Salaire': 10000}\n[['ALI', 'IT'], ['AMINA', 'RH']]</code></pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p><code>applymap()</code> du cours a été <strong>renommée <code>map()</code></strong> en Pandas 2.1, puis <strong>supprimée en Pandas 3</strong>. Si <code>df.applymap</code> plante chez toi, écris <code>df.map</code>. Le principe est identique : une fonction appliquée à chaque case.</p>\n</aside><h2>9. Agréger : <code>agg</code></h2>\n<p><strong>Agréger</strong> = résumer beaucoup de valeurs en une seule (somme, moyenne, max…). <code>agg()</code> (alias <code>aggregate()</code>) permet <strong>plusieurs</strong> fonctions à la fois, ou des fonctions <strong>différentes par colonne</strong>.</p>\n<pre class=\"\"><code>num = df[[&quot;Age&quot;, &quot;Salaire&quot;]]                      # pas de texte : mean planterait\nprint(num.agg([&quot;sum&quot;, &quot;min&quot;]))\nprint(df.agg({&quot;Age&quot;: [&quot;mean&quot;], &quot;Salaire&quot;: [&quot;max&quot;]}).fillna(&quot;-&quot;))\ndef etendue(x):\n    return x.max() - x.min()\nprint(num.agg(etendue).tolist(), df[&quot;Departement&quot;].unique().tolist(), df[&quot;Departement&quot;].nunique())</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>     Age  Salaire\nsum  139    49500\nmin   19     5000\n       Age  Salaire\nmean  27.8        -\nmax      -  15000.0\n[23, 10000] ['IT', 'RH', 'Ventes'] 3</code></pre><ul>\n<li><code>count()</code> : nombre de valeurs <strong>non manquantes</strong> par colonne. <code>unique()</code> : les valeurs distinctes. <code>nunique()</code> : <strong>combien</strong> il y en a.</li>\n<li><code>df.select_dtypes(include=&quot;number&quot;)</code> garde toutes les colonnes numériques, même celles ajoutées plus tard (plus robuste qu&#39;une liste écrite à la main). <code>include=&quot;object&quot;</code> (ou <code>&quot;str&quot;</code> en Pandas 3) pour le texte.</li>\n</ul>\n<h2>10. Regrouper : <code>groupby</code> (Split · Apply · Combine)</h2>\n<figure class=\"flux\"><figcaption>Le paradigme Split-Apply-Combine</figcaption><div class=\"flux-l\"><div class=\"flux-b\">Split : découper en groupes (une valeur de la clé = un groupe)</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Apply : calculer sur chaque groupe</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Combine : rassembler les résultats</div></div></figure><pre class=\"\"><code>ventes = pd.DataFrame({\n    &quot;Ville&quot;: [&quot;Casablanca&quot;, &quot;Casablanca&quot;, &quot;Marrakech&quot;, &quot;Marrakech&quot;, &quot;Marrakech&quot;],\n    &quot;Vendeur&quot;: [&quot;Amine&quot;, &quot;Khadija&quot;, &quot;Youssef&quot;, &quot;Salma&quot;, &quot;Mehdi&quot;],\n    &quot;Ventes_DH&quot;: [20000, 30000, 15000, 10000, 5000],\n})\ng = ventes.groupby(&quot;Ville&quot;)\nprint(g[&quot;Ventes_DH&quot;].agg([&quot;sum&quot;, &quot;mean&quot;]))\nprint(g.get_group(&quot;Casablanca&quot;)[&quot;Vendeur&quot;].tolist())</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>              sum     mean\nVille                     \nCasablanca  50000  25000.0\nMarrakech   30000  10000.0\n['Amine', 'Khadija']</code></pre><figure class=\"etapes\" data-i=\"0\"><figcaption>Split · Apply · Combine sur les ventes</figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Split</div><p>Casablanca → [20000, 30000] ; Marrakech → [15000, 10000, 5000]</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Apply (sum)</div><p>Casablanca : 50000 ; Marrakech : 30000</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Apply (mean)</div><p>Casablanca : 25000 ; Marrakech : 10000</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Combine</div><p>un tableau d&#39;<strong>une ligne par ville</strong> (5 lignes → 2 lignes)</p>\n</div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><p>Les trois façons d&#39;appliquer, à bien distinguer :</p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th><code>agg</code></th>\n<th><code>transform</code></th>\n<th><code>filter</code></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Fait</td>\n<td>un résumé par groupe</td>\n<td>un résumé <strong>recopié sur chaque ligne</strong></td>\n<td>garde ou supprime des <strong>groupes entiers</strong></td>\n</tr>\n<tr>\n<td>Taille du résultat</td>\n<td><strong>1 ligne par groupe</strong></td>\n<td><strong>même nombre de lignes</strong> qu&#39;au départ</td>\n<td>≤ au départ</td>\n</tr>\n<tr>\n<td>Exemple</td>\n<td>total par ville</td>\n<td>total de la ville à côté de chaque vendeur</td>\n<td>villes dont le total &gt; 40 000 DH</td>\n</tr>\n</tbody></table>\n<pre class=\"\"><code>ventes[&quot;Total_Ville&quot;] = g[&quot;Ventes_DH&quot;].transform(&quot;sum&quot;)\nventes[&quot;Part_%&quot;] = (100 * ventes[&quot;Ventes_DH&quot;] / ventes[&quot;Total_Ville&quot;]).round(1)\nprint(ventes)\nprint(ventes.groupby(&quot;Ville&quot;).filter(lambda x: x[&quot;Ventes_DH&quot;].sum() &gt; 40000)[&quot;Vendeur&quot;].tolist())</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>        Ville  Vendeur  Ventes_DH  Total_Ville  Part_%\n0  Casablanca    Amine      20000        50000    40.0\n1  Casablanca  Khadija      30000        50000    60.0\n2   Marrakech  Youssef      15000        30000    50.0\n3   Marrakech    Salma      10000        30000    33.3\n4   Marrakech    Mehdi       5000        30000    16.7\n['Amine', 'Khadija']</code></pre><aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p><code>groupby([&quot;Departement&quot;, &quot;Ville&quot;])</code> regroupe sur <strong>plusieurs clés</strong> (index hiérarchique). On peut parcourir les groupes : <code>for cle, groupe in df.groupby(&quot;Ville&quot;):</code>.</p>\n</aside><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\"><code>df[[&quot;Age&quot;]]</code> renvoie :</div><button class=\"opt\" data-o=\"0\">une Series</button><button class=\"opt\" data-o=\"1\">un DataFrame d&#39;une colonne</button><button class=\"opt\" data-o=\"2\">une liste</button><button class=\"opt\" data-o=\"3\">une erreur</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Après <code>df.drop(columns=[&quot;Age&quot;])</code> (sans réaffectation ni inplace), la colonne Age :</div><button class=\"opt\" data-o=\"0\">est toujours dans df</button><button class=\"opt\" data-o=\"1\">est supprimée de df</button><button class=\"opt\" data-o=\"2\">est mise à NaN</button><button class=\"opt\" data-o=\"3\">est déplacée à la fin</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Quelle méthode ajoute une colonne
