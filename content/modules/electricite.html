<script>
const MODULE={"slug":"electricite","titre":"Électricité","cle":"electricite_scores","cleEtat":"electricite_scores_etat","format":"score10","intro":"<p>Ce module suit <strong>les 4 séries de TD du Pr Bentachfine<\/strong> (analyse vectorielle, électrostatique, électrocinétique, magnétostatique) et se termine par <strong>l&#39;examen de février 2021 corrigé<\/strong>.<\/p>\n<p><strong>Comment l&#39;utiliser<\/strong><\/p>\n<ol>\n<li>Lis un chapitre, puis refais l&#39;exemple sur papier.<\/li>\n<li>Pour chaque champ : symétries d&#39;abord, calcul ensuite.<\/li>\n<li>Fais le QCM du chapitre. <strong>8/10 = chapitre maîtrisé.<\/strong><\/li>\n<\/ol>\n<p><strong>À vérifier<\/strong> : les figures des circuits des TD ne sont pas dans les fichiers fournis ; les exercices de circuits sont traités par la méthode générale.<\/p>\n","annexes":[],"cartes":null,"maths":true};
const CHAPS=[{"id":"analyse-vectorielle","t":"Analyse vectorielle","seance":"Série 1 · Coordonnées, gradient, divergence, rotationnel","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir dériver une fonction de plusieurs variables en gardant les autres fixes : c&#39;est la dérivée partielle.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Si $f(x,y) = x^2y$, que vaut $\\frac{\\partial f}{\\partial x}$ ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>On traite y comme une constante : $\\frac{\\partial f}{\\partial x} = 2xy$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « trois opérateurs, trois questions ».<\/strong> Le gradient dit où la fonction monte le plus. La divergence dit si un champ « sort » d&#39;un point. Le rotationnel dit s&#39;il « tourne ».<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>En coordonnées cylindriques ou sphériques, on ne dérive pas comme en cartésien : il y a des facteurs $\\frac1r$, $\\frac{1}{r\\sin\\theta}$. Recopie toujours la formule donnée dans le sujet.<\/p>\n<\/aside><p>À la fin, tu sais changer de coordonnées et calculer les trois opérateurs, outils de tout le module.<\/p>\n<h2>Idée 1 · Les trois systèmes de coordonnées<\/h2>\n<svg viewBox=\"0 0 320 130\" role=\"img\" aria-label=\"Coordonnées sphériques : r distance à O, theta angle avec Oz, phi angle dans le plan xOy\" style=\"max-width:380px;width:100%\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M160 110V10M160 110l-70 15M160 110h130\"/><path d=\"M160 110L235 40\" stroke=\"#D9824F\"/><path d=\"M235 40v80\" stroke-dasharray=\"4 4\"/><path d=\"M160 70a40 40 0 0 1 28 12\" /><\/g>\n<g fill=\"currentColor\" font-size=\"11\"><text x=\"164\" y=\"12\">z<\/text><text x=\"240\" y=\"38\">M<\/text><text x=\"195\" y=\"72\">r<\/text><text x=\"168\" y=\"62\">θ<\/text><text x=\"196\" y=\"125\">φ dans xOy<\/text><\/g>\n<\/svg><figure class=\"grille\"><figcaption>Passages vers les cartésiennes<\/figcaption><table><tr><th>Système,<\/th><th>x,<\/th><th>y,<\/th><th>z<\/th><\/tr><tr><td class=\"h1\">Cylindriques<\/td><td>(r<\/td><td>θ<\/td><td>z),<\/td><td>r<\/td><td>cos<\/td><td>θ,<\/td><td>r<\/td><td>sin<\/td><td>θ,<\/td><td>z<\/td><\/tr><tr><td class=\"h1\">Sphériques<\/td><td>(r<\/td><td>θ<\/td><td>φ),<\/td><td>r<\/td><td>sin<\/td><td>θ<\/td><td>cos<\/td><td>φ,<\/td><td>r<\/td><td>sin<\/td><td>θ<\/td><td>sin<\/td><td>φ,<\/td><td>r<\/td><td>cos<\/td><td>θ<\/td><\/tr><\/table><\/figure><h2>Idée 2 · Gradient, divergence, rotationnel en cartésien<\/h2>\n<figure class=\"grille\"><figcaption>Formulaire cartésien<\/figcaption><table><tr><th>Opérateur,<\/th><th>S'applique<\/th><th>à,<\/th><th>Donne,<\/th><th>Formule<\/th><\/tr><tr><td class=\"h1\">grad<\/td><td>f,<\/td><td>un<\/td><td>scalaire,<\/td><td>un<\/td><td>vecteur,<\/td><td>(∂f/∂x,<\/td><td>∂f/∂y,<\/td><td>∂f/∂z)<\/td><\/tr><tr><td class=\"h1\">div<\/td><td>A,<\/td><td>un<\/td><td>vecteur,<\/td><td>un<\/td><td>scalaire,<\/td><td>∂Ax/∂x<\/td><td>+<\/td><td>∂Ay/∂y<\/td><td>+<\/td><td>∂Az/∂z<\/td><\/tr><tr><td class=\"h1\">rot<\/td><td>A,<\/td><td>un<\/td><td>vecteur,<\/td><td>un<\/td><td>vecteur,<\/td><td>(∂Az/∂y<\/td><td>−<\/td><td>∂Ay/∂z,<\/td><td>∂Ax/∂z<\/td><td>−<\/td><td>∂Az/∂x,<\/td><td>∂Ay/∂x<\/td><td>−<\/td><td>∂Ax/∂y)<\/td><\/tr><\/table><\/figure><p><strong>Exemple (série 1, ex. III).<\/strong> $\\vec E_1 = (2x + y,\\ 2y + x,\\ 4z)$ : $\\operatorname{div}\\vec E_1 = 2 + 2 + 4 = 8$ ; $\\overrightarrow{\\operatorname{rot}}\\,\\vec E_1 = (0,\\ 0,\\ 1 - 1) = \\vec 0$.<\/p>\n<h2>Idée 3 · Le théorème de Green-Ostrogradski<\/h2>\n<p>Le flux d&#39;un champ à travers une surface fermée égale l&#39;intégrale de sa divergence dans le volume : $\\oint \\vec A\\cdot d\\vec S = \\iiint \\operatorname{div}\\vec A\\, dV$.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Vérifier le théorème avec A = OM sur une sphère (série 1, ex. VI)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · 1. En sphériques, $\\vec A = r\\,\\vec e_r$ ; sur la sphère, $\\vec A\\cdot d\\vec S = R\\cdot dS$.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · 2. Flux : $R \\times 4\\pi R^2 = 4\\pi R^3$.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · 3. $\\operatorname{div}\\vec A = \\frac{1}{r^2}\\frac{\\partial (r^3)}{\\partial r} = 3$.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · 4. Intégrale : $3 \\times \\frac43\\pi R^3 = 4\\pi R^3$. Les deux côtés sont égaux.<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Série 1<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Ex. III : divergence de $\\vec E_2 = (2y + 3z,\\ 2x,\\ 3x)$ ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0<\/b><\/p><p>$\\frac{\\partial(2y+3z)}{\\partial x} + \\frac{\\partial(2x)}{\\partial y} + \\frac{\\partial(3x)}{\\partial z} = 0$.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Ex. III : rotationnel de $\\vec E_2$ ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$(0 - 0,\\ 3 - 3,\\ 2 - 2) = \\vec 0$ : le champ ne tourne pas, il dérive d&#39;un potentiel.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Ex. VI : flux de $\\vec A = \\overrightarrow{OM}$ à travers un cylindre de rayon R et de hauteur h ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>En cylindriques, $\\vec A = r\\vec e_r + z\\vec e_z$ et $\\operatorname{div}\\vec A = 3$. Flux $= 3\\pi R^2h$ (surface latérale : $R\\cdot 2\\pi Rh$ ; fonds : $h\\cdot\\pi R^2$ ; total $3\\pi R^2h$).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Le gradient d&#39;une fonction scalaire est :<\/div><button class=\"opt\" data-o=\"0\">un scalaire<\/button><button class=\"opt\" data-o=\"1\">un vecteur<\/button><button class=\"opt\" data-o=\"2\">une matrice<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">La divergence d&#39;un champ de vecteurs est :<\/div><button class=\"opt\" data-o=\"0\">un scalaire<\/button><button class=\"opt\" data-o=\"1\">un vecteur<\/button><button class=\"opt\" data-o=\"2\">toujours nulle<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">En sphériques, $z$ vaut :<\/div><button class=\"opt\" data-o=\"0\">$r\\sin\\theta$<\/button><button class=\"opt\" data-o=\"1\">$r\\cos\\theta$<\/button><button class=\"opt\" data-o=\"2\">$r\\cos\\varphi$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">$\\operatorname{div}(x, y, z)$ vaut :<\/div><button class=\"opt\" data-o=\"0\">1<\/button><button class=\"opt\" data-o=\"1\">3<\/button><button class=\"opt\" data-o=\"2\">0<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">$\\overrightarrow{\\operatorname{rot}}\\,(\\overrightarrow{\\operatorname{grad}} f)$ vaut :<\/div><button class=\"opt\" data-o=\"0\">$\\vec 0$<\/button><button class=\"opt\" data-o=\"1\">$\\operatorname{div} f$<\/button><button class=\"opt\" data-o=\"2\">$\\vec 1$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Le volume d&#39;une sphère :<\/div><button class=\"opt\" data-o=\"0\">$4\\pi R^2$<\/button><button class=\"opt\" data-o=\"1\">$\\frac43\\pi R^3$<\/button><button class=\"opt\" data-o=\"2\">$\\pi R^2$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">En cylindriques, $x$ vaut :<\/div><button class=\"opt\" data-o=\"0\">$r\\cos\\theta$<\/button><button class=\"opt\" data-o=\"1\">$r\\sin\\theta$<\/button><button class=\"opt\" data-o=\"2\">$z$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Un champ de rotationnel nul :<\/div><button class=\"opt\" data-o=\"0\">dérive d&#39;un potentiel<\/button><button class=\"opt\" data-o=\"1\">a une divergence nulle<\/button><button class=\"opt\" data-o=\"2\">est nul<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">$\\operatorname{div}\\vec E_1 = 8$ pour $\\vec E_1 = (2x+y, 2y+x, 4z)$ :<\/div><button class=\"opt\" data-o=\"0\">vrai<\/button><button class=\"opt\" data-o=\"1\">faux<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Green-Ostrogradski relie :<\/div><button class=\"opt\" data-o=\"0\">circulation et rotationnel<\/button><button class=\"opt\" data-o=\"1\">flux et divergence<\/button><button class=\"opt\" data-o=\"2\">gradient et potentiel<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"analyse-vectorielle","rep":null,"tol":null},{"n":"analyse-vectorielle","rep":["0"],"tol":null},{"n":"analyse-vectorielle","rep":null,"tol":null},{"n":"analyse-vectorielle","rep":null,"tol":null}],"qcm":[{"n":"analyse-vectorielle","q":"Le gradient d&#39;une fonction scalaire est :","o":["un scalaire","un vecteur","une matrice"],"a":1,"e":"Trois composantes."},{"n":"analyse-vectorielle","q":"La divergence d&#39;un champ de vecteurs est :","o":["un scalaire","un vecteur","toujours nulle"],"a":0,"e":"Somme de trois dérivées."},{"n":"analyse-vectorielle","q":"En sphériques, $z$ vaut :","o":["$r\\sin\\theta$","$r\\cos\\theta$","$r\\cos\\varphi$"],"a":1,"e":"θ est l&#39;angle avec Oz."},{"n":"analyse-vectorielle","q":"$\\operatorname{div}(x, y, z)$ vaut :","o":["1","3","0"],"a":1,"e":"1 + 1 + 1."},{"n":"analyse-vectorielle","q":"$\\overrightarrow{\\operatorname{rot}}\\,(\\overrightarrow{\\operatorname{grad}} f)$ vaut :","o":["$\\vec 0$","$\\operatorname{div} f$","$\\vec 1$"],"a":0,"e":"Identité à retenir."},{"n":"analyse-vectorielle","q":"Le volume d&#39;une sphère :","o":["$4\\pi R^2$","$\\frac43\\pi R^3$","$\\pi R^2$"],"a":1,"e":"$4\\pi R^2$ est sa surface."},{"n":"analyse-vectorielle","q":"En cylindriques, $x$ vaut :","o":["$r\\cos\\theta$","$r\\sin\\theta$","$z$"],"a":0,"e":"Comme en polaires."},{"n":"analyse-vectorielle","q":"Un champ de rotationnel nul :","o":["dérive d&#39;un potentiel","a une divergence nulle","est nul"],"a":0,"e":"C&#39;est le cas du champ électrostatique."},{"n":"analyse-vectorielle","q":"$\\operatorname{div}\\vec E_1 = 8$ pour $\\vec E_1 = (2x+y, 2y+x, 4z)$ :","o":["vrai","faux"],"a":0,"e":"2 + 2 + 4."},{"n":"analyse-vectorielle","q":"Green-Ostrogradski relie :","o":["circulation et rotationnel","flux et divergence","gradient et potentiel"],"a":1,"e":"La circulation et le rotationnel, c&#39;est Stokes."}]},{"id":"coulomb-champ-potentiel","t":"Coulomb, champ et potentiel électrostatiques","seance":"Série 2 · Exercices I, II, III, VI, VII","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir additionner des vecteurs par composantes.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>$\\vec u = (3, 4)$ et $\\vec v = (-3, 4)$. Que vaut $\\vec u + \\vec v$ ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$(0, 8)$ : les composantes en x s&#39;annulent. C&#39;est exactement ce qui arrive sur un axe de symétrie.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense symétrie avant calcul.<\/strong> Sur un axe de symétrie, les composantes perpendiculaires s&#39;annulent deux à deux : il ne reste qu&#39;une composante à calculer.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Ajouter les normes des champs au lieu des vecteurs. Deux champs de 10 N/C ne donnent pas 20 N/C s&#39;ils ne sont pas dans le même sens.<\/p>\n<\/aside><p>À la fin, tu sais calculer le champ et le potentiel de charges ponctuelles, d&#39;un fil et d&#39;un anneau.<\/p>\n<h2>Idée 1 · Loi de Coulomb et champ d&#39;une charge<\/h2>\n<p>$\\vec F = k\\dfrac{q_1q_2}{r^2}\\vec u$, avec $k = \\dfrac{1}{4\\pi\\varepsilon_0} \\approx 9\\cdot10^9$ SI. Le champ créé par q est $\\vec E = k\\dfrac{q}{r^2}\\vec u_r$ et le potentiel $V = k\\dfrac{q}{r}$.<\/p>\n<svg viewBox=\"0 0 320 120\" role=\"img\" aria-label=\"Deux charges sur Oy, point M sur l'axe Ox : les composantes selon y s'annulent\" style=\"max-width:380px;width:100%\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M60 110V10M60 60h240\"/><path d=\"M60 25L220 60M60 95L220 60\" stroke-dasharray=\"4 4\"/><path d=\"M220 60l50 11M220 60l50-11\" stroke=\"#D9824F\"/><path d=\"M220 60h80\" stroke=\"#D9824F\" stroke-width=\"3\"/><\/g>\n<g fill=\"currentColor\" font-size=\"11\"><circle cx=\"60\" cy=\"25\" r=\"5\"/><circle cx=\"60\" cy=\"95\" r=\"5\"/><text x=\"70\" y=\"22\">A (+q)<\/text><text x=\"70\" y=\"108\">B (+q)<\/text><text x=\"214\" y=\"52\">M<\/text><\/g>\n<\/svg><h2>Idée 2 · Le potentiel et la circulation<\/h2>\n<p>$\\vec E = -\\overrightarrow{\\operatorname{grad}}\\,V$. La circulation de $\\vec E$ de A à B vaut $V_A - V_B$, quel que soit le chemin ; sur un contour fermé, elle est nulle.<\/p>\n<h2>Idée 3 · Distributions continues<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Calculer un champ créé par une distribution continue<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · 1. Découpe en charges élémentaires : dq = λ dl, σ dS ou ρ dV.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · 2. Écris le champ dE d&#39;un élément.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · 3. Utilise la symétrie pour ne garder qu&#39;une composante.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · 4. Intègre.<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Fil infini : $E = \\dfrac{\\lambda}{2\\pi\\varepsilon_0 a}$ à la distance a. Anneau de rayon R sur son axe : $E_z = \\dfrac{\\lambda R z}{2\\varepsilon_0 (R^2+z^2)^{3/2}}$.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Série 2<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Ex. II-1 : deux charges +q en $(0, \\pm a, 0)$. Champ en $M(x, 0, 0)$ ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Les composantes en y s&#39;annulent. Chaque charge donne $k\\frac{q}{a^2+x^2}$, projeté sur Ox par $\\frac{x}{\\sqrt{a^2+x^2}}$. Total : $\\vec E = \\dfrac{2kqx}{(a^2+x^2)^{3/2}}\\vec e_x$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Ex. II-2 : même chose avec −q en A.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Cette fois les composantes en x s&#39;annulent et celles en y s&#39;ajoutent : $\\vec E = \\dfrac{2kqa}{(a^2+x^2)^{3/2}}(-\\vec e_y)$, dirigé de B (+q) vers A (−q).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Ex. VII : potentiel d&#39;un dipôle de moment $p = qa$ loin des charges.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$V(M) \\approx \\dfrac{p\\cos\\theta}{4\\pi\\varepsilon_0 r^2}$, puis $E_r = \\dfrac{2p\\cos\\theta}{4\\pi\\varepsilon_0 r^3}$ et $E_\\theta = \\dfrac{p\\sin\\theta}{4\\pi\\varepsilon_0 r^3}$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Ex. I de la série 2 : la figure n&#39;est pas dans le fichier, et la valeur $q_1 = 1{,}5\\cdot10^{-1}$ C est sans doute une coquille pour $1{,}5\\cdot10^{-3}$ C (même ordre que $q_2$ et $q_3$). On ne donne pas de valeur numérique.<\/p>\n<\/aside><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Si la distance double, la force de Coulomb est :<\/div><button class=\"opt\" data-o=\"0\">divisée par 2<\/button><button class=\"opt\" data-o=\"1\">divisée par 4<\/button><button class=\"opt\" data-o=\"2\">multipliée par 2<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Le potentiel d&#39;une charge ponctuelle varie en :<\/div><button class=\"opt\" data-o=\"0\">$1/r$<\/button><button class=\"opt\" data-o=\"1\">$1/r^2$<\/button><button class=\"opt\" data-o=\"2\">$r$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">$\\vec E$ est dirigé vers les potentiels :<\/div><button class=\"opt\" data-o=\"0\">croissants<\/button><button class=\"opt\" data-o=\"1\">décroissants<\/button><button class=\"opt\" data-o=\"2\">constants<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Deux charges +q symétriques : sur la médiatrice, E est :<\/div><button class=\"opt\" data-o=\"0\">porté par la médiatrice<\/button><button class=\"opt\" data-o=\"1\">perpendiculaire à la médiatrice<\/button><button class=\"opt\" data-o=\"2\">nul partout<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">La circulation de E de A à B dépend :<\/div><button class=\"opt\" data-o=\"0\">du chemin<\/button><button class=\"opt\" data-o=\"1\">seulement de A et B<\/button><button class=\"opt\" data-o=\"2\">de la vitesse<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Une charge linéique s&#39;écrit :<\/div><button class=\"opt\" data-o=\"0\">dq = λ dl<\/button><button class=\"opt\" data-o=\"1\">dq = σ dS<\/button><button class=\"opt\" data-o=\"2\">dq = ρ dV<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Au centre d&#39;un anneau chargé (z = 0), le champ est :<\/div><button class=\"opt\" data-o=\"0\">nul<\/button><button class=\"opt\" data-o=\"1\">maximal<\/button><button class=\"opt\" data-o=\"2\">infini<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Le champ d&#39;un dipôle loin des charges varie en :<\/div><button class=\"opt\" data-o=\"0\">$1/r^2$<\/button><button class=\"opt\" data-o=\"1\">$1/r^3$<\/button><button class=\"opt\" data-o=\"2\">$1/r$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">L&#39;unité du champ électrique :<\/div><button class=\"opt\" data-o=\"0\">V/m<\/button><button class=\"opt\" data-o=\"1\">V·m<\/button><button class=\"opt\" data-o=\"2\">C/m²<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">$\\varepsilon_0$ est :<\/div><button class=\"opt\" data-o=\"0\">une charge<\/button><button class=\"opt\" data-o=\"1\">la permittivité du vide<\/button><button class=\"opt\" data-o=\"2\">un potentiel<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"coulomb-champ-potentiel","rep":null,"tol":null},{"n":"coulomb-champ-potentiel","rep":null,"tol":null},{"n":"coulomb-champ-potentiel","rep":null,"tol":null},{"n":"coulomb-champ-potentiel","rep":null,"tol":null}],"qcm":[{"n":"coulomb-champ-potentiel","q":"Si la distance double, la force de Coulomb est :","o":["divisée par 2","divisée par 4","multipliée par 2"],"a":1,"e":"Loi en $1/r^2$."},{"n":"coulomb-champ-potentiel","q":"Le potentiel d&#39;une charge ponctuelle varie en :","o":["$1/r$","$1/r^2$","$r$"],"a":0,"e":"Le champ varie en $1/r^2$."},{"n":"coulomb-champ-potentiel","q":"$\\vec E$ est dirigé vers les potentiels :","o":["croissants","décroissants","constants"],"a":1,"e":"Signe moins du gradient."},{"n":"coulomb-champ-potentiel","q":"Deux charges +q symétriques : sur la médiatrice, E est :","o":["porté par la médiatrice","perpendiculaire à la médiatrice","nul partout"],"a":0,"e":"Les composantes perpendiculaires s&#39;annulent."},{"n":"coulomb-champ-potentiel","q":"La circulation de E de A à B dépend :","o":["du chemin","seulement de A et B","de la vitesse"],"a":1,"e":"Elle vaut $V_A - V_B$."},{"n":"coulomb-champ-potentiel","q":"Une charge linéique s&#39;écrit :","o":["dq = λ dl","dq = σ dS","dq = ρ dV"],"a":0,"e":"λ en C/m."},{"n":"coulomb-champ-potentiel","q":"Au centre d&#39;un anneau chargé (z = 0), le champ est :","o":["nul","maximal","infini"],"a":0,"e":"La formule contient z au numérateur."},{"n":"coulomb-champ-potentiel","q":"Le champ d&#39;un dipôle loin des charges varie en :","o":["$1/r^2$","$1/r^3$","$1/r$"],"a":1,"e":"Le potentiel varie en $1/r^2$."},{"n":"coulomb-champ-potentiel","q":"L&#39;unité du champ électrique :","o":["V/m","V·m","C/m²"],"a":0,"e":"Ou N/C."},{"n":"coulomb-champ-potentiel","q":"$\\varepsilon_0$ est :","o":["une charge","la permittivité du vide","un potentiel"],"a":1,"e":"$8{,}85\\cdot10^{-12}$ F/m."}]},{"id":"theoreme-de-gauss","t":"Le théorème de Gauss","seance":"Série 2 · Exercices IV et V (sphères chargées)","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut connaître la surface et le volume d&#39;une sphère : $S = 4\\pi r^2$, $V = \\frac43\\pi r^3$.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Une sphère de rayon 2 a une surface de combien de fois π ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 16<\/b><\/p><p>$4\\pi \\times 4 = 16\\pi$.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « enveloppe imaginaire ».<\/strong> On entoure les charges d&#39;une surface fermée bien choisie (une sphère, un cylindre) sur laquelle E est constant : le calcul tient en une ligne.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Prendre la charge totale alors que la surface de Gauss n&#39;en enferme qu&#39;une partie. Seule compte la charge <strong>intérieure<\/strong> à la surface.<\/p>\n<\/aside><p>À la fin, tu sais trouver E et V partout pour une sphère chargée en surface ou en volume.<\/p>\n<h2>Idée 1 · L&#39;énoncé<\/h2>\n<p>$$\\oint \\vec E\\cdot d\\vec S = \\frac{Q_{\\text{int}}}{\\varepsilon_0}$$<\/p>\n<svg viewBox=\"0 0 320 120\" role=\"img\" aria-label=\"Sphère chargée de rayon R et surface de Gauss sphérique de rayon r autour\" style=\"max-width:360px;width:100%\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"160\" cy=\"60\" r=\"30\" fill=\"#D9824F\" fill-opacity=\".25\" stroke=\"#D9824F\"/><circle cx=\"160\" cy=\"60\" r=\"52\" stroke-dasharray=\"5 5\"/><path d=\"M160 60h52\"/><\/g>\n<g fill=\"currentColor\" font-size=\"11\"><text x=\"150\" y=\"64\">R<\/text><text x=\"190\" y=\"56\">r<\/text><text x=\"225\" y=\"20\">surface de Gauss<\/text><\/g>\n<\/svg><figure class=\"etapes\" data-i=\"0\"><figcaption>Appliquer Gauss<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · 1. Symétries : par symétrie sphérique, $\\vec E = E(r)\\vec e_r$.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · 2. Surface de Gauss : sphère de rayon r. Flux $= E(r)\\cdot 4\\pi r^2$.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · 3. Charge intérieure : dépend de r &lt; R ou r &gt; R.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · 4. Égalise et isole E(r). Puis $V$ par $E = -\\frac{dV}{dr}$ et la continuité.<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Idée 2 · Sphère chargée en surface (σ)<\/h2>\n<p>$Q = 4\\pi R^2\\sigma$. À l&#39;intérieur, $Q_{\\text{int}} = 0$ donc <strong>$E = 0$<\/strong> et V est constant : $V = \\frac{\\sigma R}{\\varepsilon_0}$. À l&#39;extérieur, $E = \\frac{\\sigma R^2}{\\varepsilon_0 r^2}$ et $V = \\frac{\\sigma R^2}{\\varepsilon_0 r}$.<\/p>\n<h2>Idée 3 · Sphère chargée en volume (ρ)<\/h2>\n<figure class=\"grille\"><figcaption>Champ d'une sphère chargée en volume<\/figcaption><table><tr><th>Région,<\/th><th>Q<\/th><th>intérieure,<\/th><th>E(r)<\/th><\/tr><tr><td class=\"h1\">r<\/td><td>&lt;<\/td><td>R,<\/td><td>ρ·(4/3)πr³,<\/td><td>ρr<\/td><td>/<\/td><td>(3ε₀)<\/td><\/tr><tr><td class=\"h1\">r<\/td><td>&gt;<\/td><td>R,<\/td><td>ρ·(4/3)πR³,<\/td><td>ρR³<\/td><td>/<\/td><td>(3ε₀r²)<\/td><\/tr><\/table><\/figure><p>Le champ croît linéairement à l&#39;intérieur, est maximal en r = R, puis décroît en $1/r^2$.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Série 2, ex. IV et V<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Ex. IV-3 : énergie potentielle de la sphère chargée en surface.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$E_p = \\frac12 QV = \\frac12 \\cdot 4\\pi R^2\\sigma\\cdot\\frac{\\sigma R}{\\varepsilon_0} = \\dfrac{2\\pi\\sigma^2R^3}{\\varepsilon_0}$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Ex. V : potentiel à l&#39;intérieur de la sphère chargée en volume.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>On intègre $E = \\frac{\\rho r}{3\\varepsilon_0}$ et on raccorde en r = R avec $V = \\frac{\\rho R^3}{3\\varepsilon_0 r}$ : $V(r) = \\dfrac{\\rho}{6\\varepsilon_0}(3R^2 - r^2)$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Le théorème de Gauss utilise :<\/div><button class=\"opt\" data-o=\"0\">la charge totale<\/button><button class=\"opt\" data-o=\"1\">la charge intérieure à la surface<\/button><button class=\"opt\" data-o=\"2\">la charge extérieure<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Dans une sphère chargée en surface, E vaut :<\/div><button class=\"opt\" data-o=\"0\">0<\/button><button class=\"opt\" data-o=\"1\">$\\sigma/\\varepsilon_0$<\/button><button class=\"opt\" data-o=\"2\">infini<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Hors d&#39;une sphère chargée, E varie en :<\/div><button class=\"opt\" data-o=\"0\">r<\/button><button class=\"opt\" data-o=\"1\">$1/r^2$<\/button><button class=\"opt\" data-o=\"2\">$1/r$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Dans une sphère chargée en volume, E est :<\/div><button class=\"opt\" data-o=\"0\">proportionnel à r<\/button><button class=\"opt\" data-o=\"1\">constant<\/button><button class=\"opt\" data-o=\"2\">nul<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">La surface de Gauss doit être :<\/div><button class=\"opt\" data-o=\"0\">fermée<\/button><button class=\"opt\" data-o=\"1\">plane<\/button><button class=\"opt\" data-o=\"2\">conductrice<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Pour un fil infini, la surface de Gauss adaptée est :<\/div><button class=\"opt\" data-o=\"0\">une sphère<\/button><button class=\"opt\" data-o=\"1\">un cylindre coaxial<\/button><button class=\"opt\" data-o=\"2\">un cube<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Charge d&#39;une sphère chargée en surface :<\/div><button class=\"opt\" data-o=\"0\">$4\\pi R^2\\sigma$<\/button><button class=\"opt\" data-o=\"1\">$\\frac43\\pi R^3\\sigma$<\/button><button class=\"opt\" data-o=\"2\">$\\pi R^2\\sigma$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">V est continu à la traversée d&#39;une surface chargée :<\/div><button class=\"opt\" data-o=\"0\">oui<\/button><button class=\"opt\" data-o=\"1\">non<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Le maximum de E pour la sphère en volume est en :<\/div><button class=\"opt\" data-o=\"0\">r = 0<\/button><button class=\"opt\" data-o=\"1\">r = R<\/button><button class=\"opt\" data-o=\"2\">r infini<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Le flux de E à travers une surface sans charge intérieure :<\/div><button class=\"opt\" data-o=\"0\">est nul<\/button><button class=\"opt\" data-o=\"1\">vaut $1/\\varepsilon_0$<\/button><button class=\"opt\" data-o=\"2\">est infini<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"theoreme-de-gauss","rep":["16"],"tol":null},{"n":"theoreme-de-gauss","rep":null,"tol":null},{"n":"theoreme-de-gauss","rep":null,"tol":null}],"qcm":[{"n":"theoreme-de-gauss","q":"Le théorème de Gauss utilise :","o":["la charge totale","la charge intérieure à la surface","la charge extérieure"],"a":1,"e":"$Q_{int}$."},{"n":"theoreme-de-gauss","q":"Dans une sphère chargée en surface, E vaut :","o":["0","$\\sigma/\\varepsilon_0$","infini"],"a":0,"e":"Aucune charge intérieure."},{"n":"theoreme-de-gauss","q":"Hors d&#39;une sphère chargée, E varie en :","o":["r","$1/r^2$","$1/r$"],"a":1,"e":"Comme une charge ponctuelle."},{"n":"theoreme-de-gauss","q":"Dans une sphère chargée en volume, E est :","o":["proportionnel à r","constant","nul"],"a":0,"e":"$\\rho r/(3\\varepsilon_0)$."},{"n":"theoreme-de-gauss","q":"La surface de Gauss doit être :","o":["fermée","plane","conductrice"],"a":0,"e":"Sinon pas de théorème."},{"n":"theoreme-de-gauss","q":"Pour un fil infini, la surface de Gauss adaptée est :","o":["une sphère","un cylindre coaxial","un cube"],"a":1,"e":"Symétrie cylindrique."},{"n":"theoreme-de-gauss","q":"Charge d&#39;une sphère chargée en surface :","o":["$4\\pi R^2\\sigma$","$\\frac43\\pi R^3\\sigma$","$\\pi R^2\\sigma$"],"a":0,"e":"σ × surface."},{"n":"theoreme-de-gauss","q":"V est continu à la traversée d&#39;une surface chargée :","o":["oui","non"],"a":0,"e":"C&#39;est E qui peut sauter."},{"n":"theoreme-de-gauss","q":"Le maximum de E pour la sphère en volume est en :","o":["r = 0","r = R","r infini"],"a":1,"e":"E croît puis décroît."},{"n":"theoreme-de-gauss","q":"Le flux de E à travers une surface sans charge intérieure :","o":["est nul","vaut $1/\\varepsilon_0$","est infini"],"a":0,"e":"Les lignes qui entrent ressortent."}]},{"id":"electrocinetique","t":"Électrocinétique · Kirchhoff, diviseurs, Thévenin et Norton","seance":"Série 3 · Circuits en régime continu","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut connaître la loi d&#39;Ohm : $U = RI$.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Une résistance de 10 Ω parcourue par 2 A. Tension à ses bornes ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 20<\/b><\/p><p>$U = 10 \\times 2 = 20$ V.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « nœuds et mailles ».<\/strong> Ce qui entre dans un nœud en sort ; le tour d&#39;une maille fait zéro volt. Avec ces deux lois, tout circuit se résout.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Les signes. Choisis un sens pour chaque courant et un sens de parcours pour chaque maille, et n&#39;en change plus. Un courant négatif à la fin veut juste dire que le vrai sens est l&#39;inverse.<\/p>\n<\/aside><p>À la fin, tu sais résoudre un circuit à trois branches et le remplacer par son modèle de Thévenin ou de Norton.<\/p>\n<h2>Idée 1 · Les associations<\/h2>\n<figure class=\"grille\"><figcaption>Résistances équivalentes<\/figcaption><table><tr><th>Montage,<\/th><th>Formule<\/th><\/tr><tr><td class=\"h1\">Série,<\/td><td>Req<\/td><td>=<\/td><td>R1<\/td><td>+<\/td><td>R2<\/td><\/tr><tr><td class=\"h1\">Parallèle,<\/td><td>1/Req<\/td><td>=<\/td><td>1/R1<\/td><td>+<\/td><td>1/R2<\/td><td>(soit<\/td><td>R1R2/(R1+R2)<\/td><td>pour<\/td><td>deux)<\/td><\/tr><\/table><\/figure><h2>Idée 2 · Les lois de Kirchhoff<\/h2>\n<svg viewBox=\"0 0 320 120\" role=\"img\" aria-label=\"Circuit à deux mailles avec trois branches entre les nœuds A et B\" style=\"max-width:380px;width:100%\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"30\" y=\"20\" width=\"260\" height=\"80\"/><path d=\"M160 20v80\"/>\n<rect x=\"80\" y=\"12\" width=\"30\" height=\"16\" fill=\"#D9824F\" fill-opacity=\".3\" stroke=\"#D9824F\"/><rect x=\"152\" y=\"45\" width=\"16\" height=\"30\" fill=\"#D9824F\" fill-opacity=\".3\" stroke=\"#D9824F\"/><rect x=\"210\" y=\"12\" width=\"30\" height=\"16\" fill=\"#D9824F\" fill-opacity=\".3\" stroke=\"#D9824F\"/><\/g>\n<g fill=\"currentColor\" font-size=\"11\"><text x=\"85\" y=\"45\">R1<\/text><text x=\"172\" y=\"64\">R2<\/text><text x=\"215\" y=\"45\">R3<\/text><text x=\"155\" y=\"14\">A<\/text><text x=\"155\" y=\"115\">B<\/text><text x=\"20\" y=\"64\">E1<\/text><text x=\"294\" y=\"64\">E2<\/text><\/g>\n<\/svg><figure class=\"etapes\" data-i=\"0\"><figcaption>Résoudre un circuit à 3 branches<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · 1. Loi des nœuds en A : $I_1 + I_3 = I_2$ (selon tes sens choisis).<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · 2. Loi des mailles à gauche : $E_1 - R_1I_1 - R_2I_2 = 0$.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · 3. Loi des mailles à droite : $E_2 - R_3I_3 - R_2I_2 = 0$.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · 4. Résous le système de 3 équations, puis $U_{AB} = R_2I_2$.<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p><strong>Exemple<\/strong> (montage du schéma, $E_1 = 20$ V, $E_2 = 70$ V, $R_1 = 2$ Ω, $R_2 = 5$ Ω, $R_3 = 10$ Ω) : on trouve $I_2 = 4{,}25$ A, $I_3 = 4{,}875$ A, $I_1 = -0{,}625$ A (le vrai courant dans $R_1$ circule dans l&#39;autre sens) et $U_{AB} = 21{,}25$ V.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Les valeurs viennent de l&#39;exercice III de la série 3, mais la figure du TD n&#39;est pas dans le fichier : le montage ci-dessus est une hypothèse. Si ton circuit est différent, garde la méthode.<\/p>\n<\/aside><h2>Idée 3 · Diviseurs, Thévenin et Norton<\/h2>\n<figure class=\"grille\"><figcaption>Formules à connaître<\/figcaption><table><tr><th>Outil,<\/th><th>Formule<\/th><\/tr><tr><td class=\"h1\">Diviseur<\/td><td>de<\/td><td>tension,<\/td><td>U1<\/td><td>=<\/td><td>E·R1/(R1<\/td><td>+<\/td><td>R2)<\/td><\/tr><tr><td class=\"h1\">Diviseur<\/td><td>de<\/td><td>courant,<\/td><td>I1<\/td><td>=<\/td><td>I·R2/(R1<\/td><td>+<\/td><td>R2)<\/td><\/tr><tr><td class=\"h1\">Thévenin<\/td><td>(MET),<\/td><td>E_th<\/td><td>=<\/td><td>tension<\/td><td>à<\/td><td>vide<\/td><td>;<\/td><td>R_th<\/td><td>=<\/td><td>résistance<\/td><td>vue<\/td><td>des<\/td><td>bornes,<\/td><td>sources<\/td><td>éteintes<\/td><\/tr><tr><td class=\"h1\">Norton<\/td><td>(MEN),<\/td><td>I_N<\/td><td>=<\/td><td>courant<\/td><td>de<\/td><td>court-circuit<\/td><td>=<\/td><td>E_th/R_th<\/td><td>;<\/td><td>R_N<\/td><td>=<\/td><td>R_th<\/td><\/tr><\/table><\/figure><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Série 3<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Résous proprement : $I_2 = I_1 + I_3$, $20 = 2I_1 + 5I_2$, $70 = 10I_3 + 5I_2$. Que vaut $U_{AB} = 5I_2$ ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 21.25<\/b><\/p><p>De la 2e : $I_1 = (20 - 5I_2)/2$ ; de la 3e : $I_3 = (70 - 5I_2)/10$. Nœud : $I_2 = 10 - 2{,}5I_2 + 7 - 0{,}5I_2$, donc $4I_2 = 17$, $I_2 = 4{,}25$ A, $U_{AB} = 21{,}25$ V. Puis $I_1 = -0{,}625$ A et $I_3 = 4{,}875$ A. Contrôle de la maille de gauche : $2\\times(-0{,}625) + 5\\times4{,}25 = 20$ V.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>MET d&#39;un générateur (E, r) en parallèle avec une résistance R ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$E_{th} = E\\frac{R}{R + r}$ (diviseur de tension) et $R_{th} = \\frac{rR}{r + R}$ (E éteinte, r et R en parallèle).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Deux résistances de 6 Ω en parallèle :<\/div><button class=\"opt\" data-o=\"0\">12 Ω<\/button><button class=\"opt\" data-o=\"1\">3 Ω<\/button><button class=\"opt\" data-o=\"2\">6 Ω<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Un courant trouvé négatif signifie :<\/div><button class=\"opt\" data-o=\"0\">une erreur<\/button><button class=\"opt\" data-o=\"1\">que le vrai sens est l&#39;inverse<\/button><button class=\"opt\" data-o=\"2\">un court-circuit<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Pour trouver $R_{th}$, on éteint les sources de tension en les remplaçant par :<\/div><button class=\"opt\" data-o=\"0\">un fil<\/button><button class=\"opt\" data-o=\"1\">un interrupteur ouvert<\/button><button class=\"opt\" data-o=\"2\">une résistance infinie<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Diviseur de tension : $U_1 =$<\/div><button class=\"opt\" data-o=\"0\">$E\\frac{R_1}{R_1+R_2}$<\/button><button class=\"opt\" data-o=\"1\">$E\\frac{R_2}{R_1+R_2}$<\/button><button class=\"opt\" data-o=\"2\">$E\\frac{R_1}{R_2}$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Diviseur de courant : $I_1 =$<\/div><button class=\"opt\" data-o=\"0\">$I\\frac{R_1}{R_1+R_2}$<\/button><button class=\"opt\" data-o=\"1\">$I\\frac{R_2}{R_1+R_2}$<\/button><button class=\"opt\" data-o=\"2\">$I$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">$E_{th}$ est :<\/div><button class=\"opt\" data-o=\"0\">la tension à vide entre les bornes<\/button><button class=\"opt\" data-o=\"1\">le courant de court-circuit<\/button><button class=\"opt\" data-o=\"2\">toujours égale à E<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">$I_N$ est :<\/div><button class=\"opt\" data-o=\"0\">la tension à vide<\/button><button class=\"opt\" data-o=\"1\">le courant de court-circuit<\/button><button class=\"opt\" data-o=\"2\">nul<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Le nombre d&#39;équations nécessaires pour 3 courants inconnus :<\/div><button class=\"opt\" data-o=\"0\">2<\/button><button class=\"opt\" data-o=\"1\">3<\/button><button class=\"opt\" data-o=\"2\">4<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Deux résistances de 4 Ω en série :<\/div><button class=\"opt\" data-o=\"0\">8 Ω<\/button><button class=\"opt\" data-o=\"1\">2 Ω<\/button><button class=\"opt\" data-o=\"2\">16 Ω<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">La loi des mailles traduit :<\/div><button class=\"opt\" data-o=\"0\">la conservation de l&#39;énergie (le potentiel revient à sa valeur)<\/button><button class=\"opt\" data-o=\"1\">la conservation de la charge<\/button><button class=\"opt\" data-o=\"2\">la loi d&#39;Ohm<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"electrocinetique","rep":["20"],"tol":null},{"n":"electrocinetique","rep":["21.25"],"tol":null},{"n":"electrocinetique","rep":null,"tol":null}],"qcm":[{"n":"electrocinetique","q":"Deux résistances de 6 Ω en parallèle :","o":["12 Ω","3 Ω","6 Ω"],"a":1,"e":"$36/12$."},{"n":"electrocinetique","q":"Un courant trouvé négatif signifie :","o":["une erreur","que le vrai sens est l&#39;inverse","un court-circuit"],"a":1,"e":"Le sens choisi était arbitraire."},{"n":"electrocinetique","q":"Pour trouver $R_{th}$, on éteint les sources de tension en les remplaçant par :","o":["un fil","un interrupteur ouvert","une résistance infinie"],"a":0,"e":"Les sources de courant, elles, deviennent des circuits ouverts."},{"n":"electrocinetique","q":"Diviseur de tension : $U_1 =$","o":["$E\\frac{R_1}{R_1+R_2}$","$E\\frac{R_2}{R_1+R_2}$","$E\\frac{R_1}{R_2}$"],"a":0,"e":"Proportionnelle à sa résistance."},{"n":"electrocinetique","q":"Diviseur de courant : $I_1 =$","o":["$I\\frac{R_1}{R_1+R_2}$","$I\\frac{R_2}{R_1+R_2}$","$I$"],"a":1,"e":"Le courant préfère la petite résistance."},{"n":"electrocinetique","q":"$E_{th}$ est :","o":["la tension à vide entre les bornes","le courant de court-circuit","toujours égale à E"],"a":0,"e":"Bornes ouvertes."},{"n":"electrocinetique","q":"$I_N$ est :","o":["la tension à vide","le courant de court-circuit","nul"],"a":1,"e":"Bornes reliées par un fil."},{"n":"electrocinetique","q":"Le nombre d&#39;équations nécessaires pour 3 courants inconnus :","o":["2","3","4"],"a":1,"e":"Une équation par inconnue."},{"n":"electrocinetique","q":"Deux résistances de 4 Ω en série :","o":["8 Ω","2 Ω","16 Ω"],"a":0,"e":"On additionne."},{"n":"electrocinetique","q":"La loi des mailles traduit :","o":["la conservation de l&#39;énergie (le potentiel revient à sa valeur)","la conservation de la charge","la loi d&#39;Ohm"],"a":0,"e":"La loi des nœuds traduit la conservation de la charge."}]},{"id":"magnetostatique","t":"Magnétostatique · Biot-Savart, Ampère, Laplace","seance":"Série 4 · Champ magnétique des courants","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir faire un produit vectoriel : $\\vec u \\wedge \\vec v$ est perpendiculaire aux deux, de norme $uv\\sin\\alpha$.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Que vaut $\\vec e_x \\wedge \\vec e_y$ ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$\\vec e_z$ (règle de la main droite).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « le courant tourne, le champ l&#39;entoure ».<\/strong> Autour d&#39;un fil, les lignes de champ sont des cercles. La main droite donne le sens : pouce dans le sens du courant, les doigts suivent B.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Utiliser Gauss en magnétostatique. Pour B, l&#39;outil symétrique est le <strong>théorème d&#39;Ampère<\/strong> (circulation sur un contour fermé), pas le flux.<\/p>\n<\/aside><p>À la fin, tu sais calculer B pour un fil, une spire et un cylindre, et la force entre deux fils.<\/p>\n<h2>Idée 1 · Loi de Biot-Savart<\/h2>\n<p>$$d\\vec B = \\frac{\\mu_0}{4\\pi}\\,\\frac{I\\,d\\vec l \\wedge \\vec u}{r^2}$$<\/p>\n<p>Pour une charge en mouvement : $\\vec B = \\dfrac{\\mu_0}{4\\pi}\\dfrac{q\\,\\vec v\\wedge\\vec u}{r^2}$.<\/p>\n<h2>Idée 2 · Théorème d&#39;Ampère<\/h2>\n<p>$$\\oint \\vec B\\cdot d\\vec l = \\mu_0 I_{\\text{enlacé}}$$<\/p>\n<svg viewBox=\"0 0 320 120\" role=\"img\" aria-label=\"Fil traversé par un courant I, cercle d'Ampère de rayon a, B tangent au cercle\" style=\"max-width:360px;width:100%\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M160 110V10\"/><path d=\"M155 20l5-10 5 10\"/><ellipse cx=\"160\" cy=\"60\" rx=\"70\" ry=\"22\" stroke=\"#D9824F\"/><path d=\"M225 70l8-6-2 10\" stroke=\"#D9824F\"/><\/g>\n<g fill=\"currentColor\" font-size=\"11\"><text x=\"166\" y=\"20\">I<\/text><text x=\"240\" y=\"62\">B<\/text><text x=\"180\" y=\"58\">a<\/text><\/g>\n<\/svg><figure class=\"grille\"><figcaption>Résultats classiques<\/figcaption><table><tr><th>Source,<\/th><th>Champ<\/th><th>B<\/th><\/tr><tr><td class=\"h1\">Fil<\/td><td>infini<\/td><td>(distance<\/td><td>a),<\/td><td>μ₀I<\/td><td>/<\/td><td>(2πa)<\/td><\/tr><tr><td class=\"h1\">Spire<\/td><td>de<\/td><td>rayon<\/td><td>R<\/td><td>(sur<\/td><td>l'axe),<\/td><td>μ₀IR²<\/td><td>/<\/td><td>(2(R²<\/td><td>+<\/td><td>z²)^{3/2})<\/td><\/tr><tr><td class=\"h1\">Cylindre<\/td><td>plein<\/td><td>de<\/td><td>rayon<\/td><td>R<\/td><td>(r<\/td><td>&lt;<\/td><td>R),<\/td><td>μ₀Ir<\/td><td>/<\/td><td>(2πR²)<\/td><\/tr><tr><td class=\"h1\">Cylindre<\/td><td>plein<\/td><td>(r<\/td><td>&gt;<\/td><td>R),<\/td><td>μ₀I<\/td><td>/<\/td><td>(2πr)<\/td><\/tr><\/table><\/figure><p>Sur l&#39;axe d&#39;une spire, B est maximal au centre ($\\frac{\\mu_0 I}{2R}$) et décroît des deux côtés : courbe en cloche.<\/p>\n<h2>Idée 3 · Force de Laplace entre deux fils<\/h2>\n<p>$d\\vec F = I\\,d\\vec l \\wedge \\vec B$. Deux fils parallèles à la distance d : force par unité de longueur $\\dfrac{F}{L} = \\dfrac{\\mu_0 I_1I_2}{2\\pi d}$, <strong>attractive<\/strong> si les courants sont de même sens, répulsive sinon.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Série 4<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Ex. II : fil infini, I = 10 A, a = 2 cm. Valeur de B ($\\mu_0 = 4\\pi\\cdot10^{-7}$) ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.0001<\/b><\/p><p>$B = \\frac{4\\pi\\cdot10^{-7}\\times10}{2\\pi\\times0{,}02} = 10^{-4}$ T.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Ex. VI : $\\vec A = \\frac12\\vec B\\wedge\\vec r$ avec $\\vec B = B\\vec e_z$. Vérifier $\\overrightarrow{\\operatorname{rot}}\\vec A = \\vec B$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$\\vec A = \\frac B2(-y, x, 0)$. $\\overrightarrow{\\operatorname{rot}}\\vec A = (0, 0, \\frac B2 + \\frac B2) = B\\vec e_z$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Ex. IV : champ dans un cylindre plein à r = R/2 ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Courant enlacé : $I\\frac{r^2}{R^2} = \\frac I4$. $B\\cdot2\\pi r = \\mu_0\\frac I4$ donne $B = \\frac{\\mu_0 I}{4\\pi R}$, la moitié du champ en surface.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">L&#39;outil de symétrie pour B est :<\/div><button class=\"opt\" data-o=\"0\">Gauss<\/button><button class=\"opt\" data-o=\"1\">Ampère<\/button><button class=\"opt\" data-o=\"2\">Kirchhoff<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Les lignes de champ d&#39;un fil rectiligne sont :<\/div><button class=\"opt\" data-o=\"0\">des cercles autour du fil<\/button><button class=\"opt\" data-o=\"1\">des droites parallèles au fil<\/button><button class=\"opt\" data-o=\"2\">radiales<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">B d&#39;un fil varie en :<\/div><button class=\"opt\" data-o=\"0\">$1/a$<\/button><button class=\"opt\" data-o=\"1\">$1/a^2$<\/button><button class=\"opt\" data-o=\"2\">$a$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Deux fils, courants opposés :<\/div><button class=\"opt\" data-o=\"0\">s&#39;attirent<\/button><button class=\"opt\" data-o=\"1\">se repoussent<\/button><button class=\"opt\" data-o=\"2\">n&#39;interagissent pas<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">$\\mu_0$ vaut :<\/div><button class=\"opt\" data-o=\"0\">$4\\pi\\cdot10^{-7}$ SI<\/button><button class=\"opt\" data-o=\"1\">$9\\cdot10^9$ SI<\/button><button class=\"opt\" data-o=\"2\">$8{,}85\\cdot10^{-12}$ SI<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Dans un cylindre plein, B au centre vaut :<\/div><button class=\"opt\" data-o=\"0\">0<\/button><button class=\"opt\" data-o=\"1\">maximal<\/button><button class=\"opt\" data-o=\"2\">infini<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Sur l&#39;axe d&#39;une spire, B est maximal :<\/div><button class=\"opt\" data-o=\"0\">au centre<\/button><button class=\"opt\" data-o=\"1\">à l&#39;infini<\/button><button class=\"opt\" data-o=\"2\">à z = R<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">La force de Laplace s&#39;écrit :<\/div><button class=\"opt\" data-o=\"0\">$I\\,d\\vec l\\wedge\\vec B$<\/button><button class=\"opt\" data-o=\"1\">$q\\vec E$<\/button><button class=\"opt\" data-o=\"2\">$\\vec B\\wedge I\\,d\\vec l$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Biot-Savart contient :<\/div><button class=\"opt\" data-o=\"0\">un produit scalaire<\/button><button class=\"opt\" data-o=\"1\">un produit vectoriel<\/button><button class=\"opt\" data-o=\"2\">une divergence<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">L&#39;unité de B :<\/div><button class=\"opt\" data-o=\"0\">le tesla<\/button><button class=\"opt\" data-o=\"1\">le volt<\/button><button class=\"opt\" data-o=\"2\">le weber par mètre<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"magnetostatique","rep":null,"tol":null},{"n":"magnetostatique","rep":["0.0001"],"tol":null},{"n":"magnetostatique","rep":null,"tol":null},{"n":"magnetostatique","rep":null,"tol":null}],"qcm":[{"n":"magnetostatique","q":"L&#39;outil de symétrie pour B est :","o":["Gauss","Ampère","Kirchhoff"],"a":1,"e":"Circulation sur un contour fermé."},{"n":"magnetostatique","q":"Les lignes de champ d&#39;un fil rectiligne sont :","o":["des cercles autour du fil","des droites parallèles au fil","radiales"],"a":0,"e":"Main droite."},{"n":"magnetostatique","q":"B d&#39;un fil varie en :","o":["$1/a$","$1/a^2$","$a$"],"a":0,"e":"$\\mu_0I/(2\\pi a)$."},{"n":"magnetostatique","q":"Deux fils, courants opposés :","o":["s&#39;attirent","se repoussent","n&#39;interagissent pas"],"a":1,"e":"Même sens : attraction."},{"n":"magnetostatique","q":"$\\mu_0$ vaut :","o":["$4\\pi\\cdot10^{-7}$ SI","$9\\cdot10^9$ SI","$8{,}85\\cdot10^{-12}$ SI"],"a":0,"e":"Perméabilité du vide."},{"n":"magnetostatique","q":"Dans un cylindre plein, B au centre vaut :","o":["0","maximal","infini"],"a":0,"e":"Aucun courant enlacé."},{"n":"magnetostatique","q":"Sur l&#39;axe d&#39;une spire, B est maximal :","o":["au centre","à l&#39;infini","à z = R"],"a":0,"e":"Courbe en cloche."},{"n":"magnetostatique","q":"La force de Laplace s&#39;écrit :","o":["$I\\,d\\vec l\\wedge\\vec B$","$q\\vec E$","$\\vec B\\wedge I\\,d\\vec l$"],"a":0,"e":"L&#39;ordre du produit vectoriel compte."},{"n":"magnetostatique","q":"Biot-Savart contient :","o":["un produit scalaire","un produit vectoriel","une divergence"],"a":1,"e":"$d\\vec l\\wedge\\vec u$."},{"n":"magnetostatique","q":"L&#39;unité de B :","o":["le tesla","le volt","le weber par mètre"],"a":0,"e":"T."}]},{"id":"annale-2021","t":"Annale corrigée · examen du 17 février 2021","seance":"Session normale d'automne, BCG section B (1 h 30)","imp":5,"payant":true,"html":"<p>Le vrai sujet du Pr Bentachfine : un exercice par partie du module. Les méthodes sont aux chapitres 1 à 5.<\/p>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Fais le sujet en 1 h 30 sur papier, puis compare question par question.<\/p>\n<\/aside><h2>Exercice 1 · Analyse vectorielle<\/h2>\n<p><strong>Énoncé.<\/strong> En sphériques, $\\vec V = r\\sin\\varphi\\,\\vec e_\\varphi$ et une fonction f (voir la remarque). 1) $\\overrightarrow{\\operatorname{grad}} f$. 2) $\\overrightarrow{\\operatorname{rot}}\\,\\vec V$ au point $(1, \\frac\\pi2, 0)$. Les formules sont données.<\/p>\n<section class=\"exo\"><h3>Exercice 1<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><ol start=\"2\">\n<li>Composantes de $\\overrightarrow{\\operatorname{rot}}\\,\\vec V$ en général.<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$V_r = V_\\theta = 0$, $V_\\varphi = r\\sin\\varphi$. Selon $\\vec e_r$ : $\\frac{1}{r\\sin\\theta}\\frac{\\partial(r\\sin\\varphi\\sin\\theta)}{\\partial\\theta} = \\frac{\\sin\\varphi\\cos\\theta}{\\sin\\theta}$. Selon $\\vec e_\\theta$ : $-\\frac1r\\frac{\\partial(r^2\\sin\\varphi)}{\\partial r} = -2\\sin\\varphi$. Selon $\\vec e_\\varphi$ : 0.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Au point $(1, \\frac\\pi2, 0)$ ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0<\/b><\/p><p>$\\sin\\varphi = \\sin 0 = 0$ : <strong>$\\overrightarrow{\\operatorname{rot}}\\,\\vec V = \\vec 0$<\/strong> en ce point.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><ol>\n<li>Gradient de $f = r\\cos\\theta + \\sin\\theta\\cos\\varphi$ (lecture la plus probable).<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$\\frac{\\partial f}{\\partial r} = \\cos\\theta$ ; $\\frac1r\\frac{\\partial f}{\\partial\\theta} = \\frac{-r\\sin\\theta + \\cos\\theta\\cos\\varphi}{r}$ ; $\\frac{1}{r\\sin\\theta}\\frac{\\partial f}{\\partial\\varphi} = -\\frac{\\sin\\varphi}{r}$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Dans le fichier fourni, les signes de f sont illisibles (« r cosθ sinθ cosφ »). On a corrigé la lecture la plus probable ; la méthode reste la même pour toute autre lecture.<\/p>\n<\/aside><h2>Exercice 2 · Anneau chargé<\/h2>\n<p><strong>Énoncé.<\/strong> Cercle de centre O, rayon R, d&#39;axe Oz, densité linéique λ. 1) Champ en M de l&#39;axe. 2) Potentiel.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Correction<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · 1. Symétrie : en M sur l&#39;axe, seule la composante selon Oz reste.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · 2. Élément : $dq = \\lambda R\\,d\\theta$, à la distance $\\sqrt{R^2+z^2}$ ; sa projection sur Oz porte le facteur $\\frac{z}{\\sqrt{R^2+z^2}}$.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · 3. Intègre sur $2\\pi$ : $\\vec E = \\dfrac{\\lambda R z}{2\\varepsilon_0(R^2+z^2)^{3/2}}\\vec e_z$.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · 4. Potentiel : $V = \\dfrac{\\lambda R}{2\\varepsilon_0\\sqrt{R^2+z^2}}$. Contrôle : $-\\frac{dV}{dz}$ redonne E.<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Exercice 3 · Électrocinétique<\/h2>\n<p>Circuit à trois branches (sources $E_1, E_2, E_3$, résistances $R_1, R_2, R_3$). La figure n&#39;est pas dans le fichier : applique la méthode du chapitre 4.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Méthode attendue<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · 1. Loi des nœuds au nœud A, lois des mailles sur deux mailles indépendantes.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · 2. Résous en $I_1, I_2, I_3$ (méthode de Cramer ou substitution).<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · 3. $U_{AB}$ : loi d&#39;Ohm généralisée sur une branche.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · 4. MET : $E_{th} = U_{AB}$ à vide, $R_{th}$ = résistance vue de A et B sources éteintes. MEN : $I_N = E_{th}/R_{th}$.<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Exercice 4 · Magnétostatique<\/h2>\n<p><strong>Énoncé.<\/strong> Potentiel vecteur dipolaire $\\vec A = \\dfrac{\\mu_0 m\\sin\\theta}{4\\pi r^2}\\vec e_\\varphi$. Trouver $\\vec B = \\overrightarrow{\\operatorname{rot}}\\vec A$.<\/p>\n<section class=\"exo\"><h3>Exercice 4<\/h3><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Composantes de $\\vec B$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Selon $\\vec e_r$ : $\\frac{1}{r\\sin\\theta}\\frac{\\partial(A_\\varphi\\sin\\theta)}{\\partial\\theta} = \\dfrac{2\\mu_0 m\\cos\\theta}{4\\pi r^3}$. Selon $\\vec e_\\theta$ : $-\\frac1r\\frac{\\partial(rA_\\varphi)}{\\partial r} = \\dfrac{\\mu_0 m\\sin\\theta}{4\\pi r^3}$. Selon $\\vec e_\\varphi$ : 0.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Même forme que le champ du dipôle électrique ($E_r$ en $2\\cos\\theta$, $E_\\theta$ en $\\sin\\theta$, tout en $1/r^3$). Si tu connais l&#39;un, tu retrouves l&#39;autre.<\/p>\n<\/aside><h2>QCM du sujet<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Au point $(1, \\pi/2, 0)$, $\\overrightarrow{\\operatorname{rot}}\\,\\vec V$ vaut :<\/div><button class=\"opt\" data-o=\"0\">$\\vec 0$<\/button><button class=\"opt\" data-o=\"1\">$-2\\vec e_\\theta$<\/button><button class=\"opt\" data-o=\"2\">$\\vec e_r$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Au centre de l&#39;anneau chargé, E vaut :<\/div><button class=\"opt\" data-o=\"0\">0<\/button><button class=\"opt\" data-o=\"1\">$\\lambda/(2\\varepsilon_0R)$<\/button><button class=\"opt\" data-o=\"2\">infini<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Le potentiel au centre de l&#39;anneau :<\/div><button class=\"opt\" data-o=\"0\">0<\/button><button class=\"opt\" data-o=\"1\">$\\lambda/(2\\varepsilon_0)$<\/button><button class=\"opt\" data-o=\"2\">infini<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Loin de l&#39;anneau, E varie en :<\/div><button class=\"opt\" data-o=\"0\">$1/z^2$<\/button><button class=\"opt\" data-o=\"1\">$1/z^3$<\/button><button class=\"opt\" data-o=\"2\">$1/z$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">$B_r$ du dipôle magnétique est proportionnel à :<\/div><button class=\"opt\" data-o=\"0\">$2\\cos\\theta/r^3$<\/button><button class=\"opt\" data-o=\"1\">$\\sin\\theta/r^2$<\/button><button class=\"opt\" data-o=\"2\">$\\cos\\theta/r$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Le MET d&#39;un circuit se résume à :<\/div><button class=\"opt\" data-o=\"0\">une source $E_{th}$ en série avec $R_{th}$<\/button><button class=\"opt\" data-o=\"1\">une source de courant en série<\/button><button class=\"opt\" data-o=\"2\">une seule résistance<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">$\\vec B = \\overrightarrow{\\operatorname{rot}}\\vec A$ implique :<\/div><button class=\"opt\" data-o=\"0\">$\\operatorname{div}\\vec B = 0$<\/button><button class=\"opt\" data-o=\"1\">$\\overri
