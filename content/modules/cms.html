<header><button class="b" id="menu" aria-label="Chapitres">☰</button><h1>CMS : systèmes de gestion de contenu<small>Pr N. Falih · S5 · FSABM</small></h1><span class="pct" id="pct"></span></header>

<script>
const MODULE={"slug":"cms","titre":"CMS : systèmes de gestion de contenu","cle":"cms_scores","cleEtat":"cms_scores_etat","format":"score10","intro":"<p>Ce module suit le cours du <strong>Pr Falih</strong> : d&#39;abord ce qu&#39;est un CMS et comment le choisir, puis <strong>WordPress</strong> de l&#39;installation à la boutique en ligne.</p>\n<p><strong>Chaque chapitre a trois temps</strong></p>\n<ol>\n<li><strong>Avant de commencer</strong> : ce qu&#39;il faut déjà savoir, avec une question pour vérifier.</li>\n<li><strong>Comment l&#39;aborder</strong> : l&#39;état d&#39;esprit qui rend le chapitre simple, et le piège classique.</li>\n<li><strong>Les idées, illustrées</strong> : un schéma, une phrase, un exemple.</li>\n</ol>\n<p>Termine par le QCM : <strong>8/10 = chapitre maîtrisé</strong>.</p>\n<p>L&#39;élément 1 du module (HTML5 et CSS3) est considéré comme acquis depuis Programmation Web 1 (S3) : il n&#39;est pas repris ici. La partie PrestaShop sera ajoutée quand le prof l&#39;aura traitée.</p>\n<p>C&#39;est un cours de <strong>définitions, comparaisons et listes</strong> : les flashcards sont ton meilleur outil. Ouvre aussi un vrai WordPress en local, tu retiendras le tableau de bord deux fois plus vite.</p>\n","annexes":[],"cartes":null,"maths":false};
const CHAPS=[{"id":"definition-avantages","t":"C'est quoi un CMS, et pourquoi on s'en sert","seance":"Introduction · Définition et avantages","imp":5,"html":"<h2>Avant de commencer</h2>\n<p>Tu dois savoir de quoi est fait un site web : du <strong>contenu</strong> (textes, images) et une <strong>forme</strong> (mise en page, couleurs). En Programmation Web 1, tu as écrit le contenu en HTML et la forme en CSS.</p>\n<section class=\"exo\"><h3>Vérifie ton prérequis</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Dans un site codé à la main, quel langage porte le contenu, et lequel porte l&#39;apparence ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Pense à ce que tu as fait en S3.</p>\n</div><div class=\"ex-c\" hidden><p><strong>HTML</strong> porte le contenu et sa structure (titres, paragraphes, images). <strong>CSS</strong> porte l&#39;apparence (couleurs, polices, mise en page).\nSi c&#39;est clair, tu es prêt : tout le chapitre repose sur cette séparation contenu / forme.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Comment aborder ce chapitre</h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p><strong>Pense « qui fait quoi ».</strong> Sans CMS, une seule personne doit tout savoir : coder, mettre en page, rédiger. Avec un CMS, celui qui rédige n&#39;a pas besoin de savoir coder. Chaque avantage du cours découle de cette idée.</p>\n</aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>Beaucoup écrivent « un CMS, c&#39;est un site web ». Non : un CMS est le <strong>logiciel</strong> qui sert à fabriquer et gérer le site. WordPress est un CMS ; le blog que tu crées avec est un site.</p>\n</aside><p>À la fin, tu sais définir un CMS en une phrase et citer ses cinq avantages, dans les mots du prof.</p>\n<h2>Idée 1 · Un CMS gère le contenu à ta place</h2>\n<p>CMS veut dire <strong>Content Management System</strong>, en français <strong>système de gestion de contenu</strong>.</p>\n<svg viewBox=\"0 0 360 120\" style=\"width:100%;max-width:460px;display:block;margin:10px auto\" role=\"img\" aria-label=\"L'utilisateur écrit dans une interface, le CMS produit le site web\">\n<g font-family=\"sans-serif\" font-size=\"12\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"8\" y=\"36\" width=\"92\" height=\"48\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"54\" y=\"57\">Utilisateur</text><text x=\"54\" y=\"73\" font-size=\"10\">sans coder</text>\n<rect x=\"134\" y=\"28\" width=\"92\" height=\"64\" rx=\"8\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/><text x=\"180\" y=\"52\" fill=\"#D9824F\" font-weight=\"700\">CMS</text><text x=\"180\" y=\"68\" font-size=\"10\">contenu, thèmes,</text><text x=\"180\" y=\"81\" font-size=\"10\">fonctions</text>\n<rect x=\"260\" y=\"36\" width=\"92\" height=\"48\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"306\" y=\"57\">Site web</text><text x=\"306\" y=\"73\" font-size=\"10\">pour le visiteur</text>\n</g>\n<path d=\"M102 60h28M228 60h28\" stroke=\"currentColor\" stroke-width=\"2\"/><path d=\"M126 55l6 5-6 5M252 55l6 5-6 5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n</svg><p>Le cours donne trois formulations. Retiens-les, elles tombent telles quelles :</p>\n<ol>\n<li>Un <strong>logiciel</strong> qui aide les utilisateurs à <strong>créer, gérer et modifier</strong> le contenu d&#39;un site web <strong>sans connaissances techniques spécialisées</strong> en développement web.</li>\n<li>Un <strong>outil</strong> qui permet de créer un site web <strong>sans écrire tout le code à partir de zéro</strong>.</li>\n<li>Un <strong>système simple mais robuste et extensible</strong> qui assure la gestion du contenu d&#39;un site (images, fonctions, thèmes, infrastructure). L&#39;utilisateur peut ainsi se concentrer sur le <strong>frontal</strong> du site (ce que voit le client final), via une interface riche et conviviale.</li>\n</ol>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p>Les trois verbes de la définition : <strong>créer, gérer, modifier</strong>. Et la condition : <strong>sans connaissances techniques spécialisées</strong>.</p>\n</aside><h2>Idée 2 · Le contenu et la forme sont séparés</h2>\n<svg viewBox=\"0 0 360 110\" style=\"width:100%;max-width:460px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Le contenu et la forme sont deux blocs indépendants qui se combinent pour donner la page\">\n<g font-family=\"sans-serif\" font-size=\"12\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"10\" y=\"10\" width=\"120\" height=\"38\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"70\" y=\"34\">Contenu (textes)</text>\n<rect x=\"10\" y=\"62\" width=\"120\" height=\"38\" rx=\"6\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/><text x=\"70\" y=\"86\" fill=\"#D9824F\" font-weight=\"700\">Forme (thème)</text>\n<rect x=\"230\" y=\"30\" width=\"120\" height=\"50\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"290\" y=\"60\">Page affichée</text>\n</g>\n<path d=\"M132 29L226 50M132 81L226 60\" stroke=\"currentColor\" stroke-width=\"2\"/>\n</svg><p>C&#39;est le premier avantage, et le plus important. Tu peux :</p>\n<ul>\n<li><strong>modifier tes textes</strong> à tout moment sans toucher à l&#39;apparence du site ;</li>\n<li><strong>changer tout le webdesign</strong> sans toucher au contenu existant.</li>\n</ul>\n<p>Exemple : un restaurant de Béni Mellal change de thème pour le Ramadan. Sa carte et ses horaires restent intacts, seul l&#39;habillage change.</p>\n<h2>Idée 3 · Les cinq avantages du cours</h2>\n<table>\n<thead>\n<tr>\n<th>N°</th>\n<th>Avantage</th>\n<th>Ce que ça veut dire</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1</td>\n<td><strong>Séparation contenu / conception</strong></td>\n<td>On modifie l&#39;un sans casser l&#39;autre (idée 2).</td>\n</tr>\n<tr>\n<td>2</td>\n<td><strong>Autorisations d&#39;accès</strong></td>\n<td>Depuis le tableau de bord, on donne un profil à chaque utilisateur : administrateur, éditeur, auteur, contributeur, abonné.</td>\n</tr>\n<tr>\n<td>3</td>\n<td><strong>Gratuit ou peu coûteux</strong></td>\n<td>On peut réaliser un site sans aucun frais. Beaucoup de thèmes gratuits existent.</td>\n</tr>\n<tr>\n<td>4</td>\n<td><strong>Facile pour le référencement</strong></td>\n<td>Des champs intégrés à la plateforme aident à optimiser le site pour les moteurs de recherche.</td>\n</tr>\n<tr>\n<td>5</td>\n<td><strong>Simple et intuitif</strong></td>\n<td>Utilisable par les débutants comme par les experts, avec une interface facile à comprendre.</td>\n</tr>\n</tbody></table>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Retenir les 5 avantages avec une phrase</figcaption><div class=\"etape\"><div class=\"et-t\">1/6 · Le moyen mnémotechnique</div><p>« <strong>S</strong>ara <strong>A</strong>ime <strong>G</strong>érer <strong>R</strong>apidement <strong>S</strong>implement » : <strong>S</strong>éparation, <strong>A</strong>utorisations, <strong>G</strong>ratuit, <strong>R</strong>éférencement, <strong>S</strong>imple.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/6 · S comme Séparation</div><p>Le contenu et la forme vivent séparément.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/6 · A comme Autorisations</div><p>Chaque utilisateur a un profil et des droits.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">4/6 · G comme Gratuit</div><p>Ou peu coûteux, avec des thèmes gratuits.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">5/6 · R comme Référencement</div><p>Des champs prévus pour les moteurs de recherche.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">6/6 · S comme Simple</div><p>Intuitif, pour débutants et experts.</p>\n</div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>Le moyen mnémotechnique est un ajout de ToumaiLearn, il n&#39;est pas dans les diapos. La liste des cinq avantages, elle, est celle du prof.</p>\n</aside><aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend</div><p>En examen, « citez les avantages d&#39;un CMS » attend la <strong>liste des cinq</strong>, chacun avec une courte explication. Ne te contente pas des titres.</p>\n</aside><h2>S&#39;exercer</h2>\n<section class=\"exo\"><h3>Trois questions types</h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Donne une définition d&#39;un CMS en une phrase.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Trois verbes, une condition.</p>\n</div><div class=\"ex-c\" hidden><p>Un CMS est un logiciel qui aide les utilisateurs à créer, gérer et modifier le contenu d&#39;un site web sans avoir besoin de connaissances techniques spécialisées en développement web.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Une association veut que ses bénévoles publient des articles, mais sans pouvoir supprimer le site. Quel avantage du CMS répond à ce besoin ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Regarde l&#39;avantage n° 2.</p>\n</div><div class=\"ex-c\" hidden><p>La <strong>possibilité de définir des autorisations d&#39;accès</strong> : on donne aux bénévoles un profil limité (auteur ou contributeur) et on garde le profil administrateur pour le responsable.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Explique en deux phrases pourquoi la séparation contenu / forme est utile.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>On peut modifier les textes à tout moment sans impacter l&#39;apparence du site. On peut aussi mettre en place un nouveau webdesign sans toucher au contenu existant.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 6 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Que signifie le sigle CMS ?</div><button class=\"opt\" data-o=\"0\">Central Management Server</button><button class=\"opt\" data-o=\"1\">Content Management System</button><button class=\"opt\" data-o=\"2\">Content Markup Software</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Selon le cours, un CMS permet de gérer le contenu d&#39;un site :</div><button class=\"opt\" data-o=\"0\">uniquement si l&#39;on maîtrise PHP</button><button class=\"opt\" data-o=\"1\">sans connaissances techniques spécialisées en développement web</button><button class=\"opt\" data-o=\"2\">uniquement pour les sites de e-commerce</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Quel est l&#39;intérêt de la séparation entre contenu et conception ?</div><button class=\"opt\" data-o=\"0\">Le site se charge plus vite</button><button class=\"opt\" data-o=\"1\">On peut changer le design sans toucher au contenu, et l&#39;inverse</button><button class=\"opt\" data-o=\"2\">Le contenu est automatiquement traduit</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Lequel de ces profils n&#39;est PAS cité dans le cours comme profil d&#39;utilisateur d&#39;un CMS ?</div><button class=\"opt\" data-o=\"0\">Éditeur</button><button class=\"opt\" data-o=\"1\">Contributeur</button><button class=\"opt\" data-o=\"2\">Hébergeur</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">D&#39;où gère-t-on les droits d&#39;accès des utilisateurs ?</div><button class=\"opt\" data-o=\"0\">Depuis le tableau de bord du CMS</button><button class=\"opt\" data-o=\"1\">Depuis le fichier CSS du thème</button><button class=\"opt\" data-o=\"2\">Depuis le navigateur du visiteur</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Comment un CMS facilite-t-il le référencement ?</div><button class=\"opt\" data-o=\"0\">Il achète de la publicité à ta place</button><button class=\"opt\" data-o=\"1\">Il propose des champs intégrés à la plateforme pour optimiser le site</button><button class=\"opt\" data-o=\"2\">Il interdit l&#39;accès aux moteurs de recherche concurrents</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">« Gratuit ou peu coûteux » : que dit précisément le cours ?</div><button class=\"opt\" data-o=\"0\">Tous les CMS sont gratuits, sans exception</button><button class=\"opt\" data-o=\"1\">On peut réaliser un site sans aucun frais, avec une large variété de thèmes gratuits</button><button class=\"opt\" data-o=\"2\">Seul l&#39;hébergement est payant, jamais le CMS</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Selon la troisième définition du cours, le CMS permet à l&#39;utilisateur de se concentrer sur :</div><button class=\"opt\" data-o=\"0\">l&#39;infrastructure du serveur</button><button class=\"opt\" data-o=\"1\">le frontal du site, tourné vers le client final</button><button class=\"opt\" data-o=\"2\">l&#39;écriture du code source du CMS</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Laquelle de ces phrases est correcte ?</div><button class=\"opt\" data-o=\"0\">WordPress est un site web</button><button class=\"opt\" data-o=\"1\">WordPress est un CMS, qui sert à créer des sites web</button><button class=\"opt\" data-o=\"2\">Un CMS est un langage de programmation</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">« Simple et intuitif à utiliser » signifie, d&#39;après le cours, que le CMS est utilisable :</div><button class=\"opt\" data-o=\"0\">seulement par les débutants</button><button class=\"opt\" data-o=\"1\">seulement par les experts du web</button><button class=\"opt\" data-o=\"2\">par les débutants et par les experts du web</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"definition-avantages","rep":null,"tol":null},{"n":"definition-avantages","rep":null,"tol":null},{"n":"definition-avantages","rep":null,"tol":null},{"n":"definition-avantages","rep":null,"tol":null}],"qcm":[{"n":"definition-avantages","q":"Que signifie le sigle CMS ?","o":["Central Management Server","Content Management System","Content Markup Software"],"a":1,"e":"En français : système de gestion de contenu."},{"n":"definition-avantages","q":"Selon le cours, un CMS permet de gérer le contenu d&#39;un site :","o":["uniquement si l&#39;on maîtrise PHP","sans connaissances techniques spécialisées en développement web","uniquement pour les sites de e-commerce"],"a":1,"e":"C&#39;est le cœur de la définition : créer, gérer, modifier, sans être développeur."},{"n":"definition-avantages","q":"Quel est l&#39;intérêt de la séparation entre contenu et conception ?","o":["Le site se charge plus vite","On peut changer le design sans toucher au contenu, et l&#39;inverse","Le contenu est automatiquement traduit"],"a":1,"e":"C&#39;est le premier avantage cité par le prof."},{"n":"definition-avantages","q":"Lequel de ces profils n&#39;est PAS cité dans le cours comme profil d&#39;utilisateur d&#39;un CMS ?","o":["Éditeur","Contributeur","Hébergeur"],"a":2,"e":"Les profils cités : administrateur, éditeur, auteur, contributeur, abonné. L&#39;hébergeur est une entreprise, pas un profil."},{"n":"definition-avantages","q":"D&#39;où gère-t-on les droits d&#39;accès des utilisateurs ?","o":["Depuis le tableau de bord du CMS","Depuis le fichier CSS du thème","Depuis le navigateur du visiteur"],"a":0,"e":"Le tableau de bord permet de préciser le profil de chaque utilisateur."},{"n":"definition-avantages","q":"Comment un CMS facilite-t-il le référencement ?","o":["Il achète de la publicité à ta place","Il propose des champs intégrés à la plateforme pour optimiser le site","Il interdit l&#39;accès aux moteurs de recherche concurrents"],"a":1,"e":"Le cours parle de « champs intégrés directement dans la plateforme »."},{"n":"definition-avantages","q":"« Gratuit ou peu coûteux » : que dit précisément le cours ?","o":["Tous les CMS sont gratuits, sans exception","On peut réaliser un site sans aucun frais, avec une large variété de thèmes gratuits","Seul l&#39;hébergement est payant, jamais le CMS"],"a":1,"e":"Attention à « tous » : le chapitre suivant montre qu&#39;il existe des CMS propriétaires payants."},{"n":"definition-avantages","q":"Selon la troisième définition du cours, le CMS permet à l&#39;utilisateur de se concentrer sur :","o":["l&#39;infrastructure du serveur","le frontal du site, tourné vers le client final","l&#39;écriture du code source du CMS"],"a":1,"e":"Le CMS gère images, fonctions, thèmes, infrastructure ; l&#39;utilisateur s&#39;occupe de ce que voit le visiteur."},{"n":"definition-avantages","q":"Laquelle de ces phrases est correcte ?","o":["WordPress est un site web","WordPress est un CMS, qui sert à créer des sites web","Un CMS est un langage de programmation"],"a":1,"e":"Le CMS est l&#39;outil ; le site est le résultat."},{"n":"definition-avantages","q":"« Simple et intuitif à utiliser » signifie, d&#39;après le cours, que le CMS est utilisable :","o":["seulement par les débutants","seulement par les experts du web","par les débutants et par les experts du web"],"a":2,"e":"L&#39;interface est simple à comprendre, sans exclure les utilisateurs avancés."}]},{"id":"proprietaire-libre","t":"CMS propriétaire ou CMS libre","seance":"Introduction · Quel CMS choisir ?","imp":5,"html":"<h2>Avant de commencer</h2>\n<p>Tu dois savoir ce qu&#39;est le <strong>code source</strong> d&#39;un logiciel : le texte écrit par les développeurs, que l&#39;on peut lire et modifier si on y a accès.</p>\n<section class=\"exo\"><h3>Vérifie ton prérequis</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Tu utilises un logiciel dont tu ne peux ni lire ni modifier le code. Peux-tu corriger toi-même un défaut de ce logiciel ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Non. Sans accès au code source, tu dépends de l&#39;entreprise qui le développe. C&#39;est exactement la différence entre un CMS propriétaire et un CMS libre.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Comment aborder ce chapitre</h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p><strong>Pose toujours la même question : qui a la main sur le code ?</strong> Si c&#39;est une entreprise, c&#39;est propriétaire. Si c&#39;est tout le monde, c&#39;est libre. Licence, coût, support, personnalisation : toutes les lignes du tableau se déduisent de cette réponse.</p>\n</aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>« Libre » ne veut pas dire « zéro dépense ». Le logiciel est gratuit, mais l&#39;hébergement, le développement sur mesure et le support technique peuvent coûter.</p>\n</aside><p>À la fin, tu sais remplir le tableau comparatif du prof de mémoire et classer un CMS dans la bonne famille.</p>\n<h2>Idée 1 · Deux familles, une seule différence de départ</h2>\n<svg viewBox=\"0 0 360 130\" style=\"width:100%;max-width:460px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Deux familles de CMS : propriétaire avec code fermé, libre avec code ouvert\">\n<g font-family=\"sans-serif\" font-size=\"12\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"10\" y=\"10\" width=\"160\" height=\"110\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<text x=\"90\" y=\"32\" font-weight=\"700\">Propriétaire</text><text x=\"90\" y=\"54\">code fermé</text><text x=\"90\" y=\"72\">licence à acheter</text><text x=\"90\" y=\"90\">support du vendeur</text><text x=\"90\" y=\"108\" font-size=\"10\">Shopify, Wix, Sitecore</text>\n<rect x=\"190\" y=\"10\" width=\"160\" height=\"110\" rx=\"8\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/>\n<text x=\"270\" y=\"32\" font-weight=\"700\" fill=\"#D9824F\">Libre (open source)</text><text x=\"270\" y=\"54\">code ouvert</text><text x=\"270\" y=\"72\">utilisation libre</text><text x=\"270\" y=\"90\">communauté active</text><text x=\"270\" y=\"108\" font-size=\"10\">WordPress, PrestaShop</text>\n</g>\n</svg><p><strong>CMS propriétaire.</strong> Son code source est la propriété d&#39;une entreprise ou d&#39;un individu et <strong>n&#39;est pas disponible publiquement</strong>. L&#39;utilisation, la modification et la distribution sont restreintes par des licences. Il faut souvent acheter une licence ou un abonnement.</p>\n<p><strong>CMS libre (open source).</strong> Son code source est <strong>disponible publiquement</strong>. Les utilisateurs ont le droit de l&#39;étudier, de le modifier et de le distribuer, selon la licence open source. Ses trois caractéristiques :</p>\n<ul>\n<li><strong>accès au code source</strong> : on modifie et on adapte à ses besoins ;</li>\n<li><strong>licences open source</strong> : liberté d&#39;utilisation, de modification, de distribution ;</li>\n<li><strong>communauté active</strong> : elle développe et assure le support.</li>\n</ul>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>Une diapo écrit « C&#39;est un <strong>SMS</strong> dont le code source… ». C&#39;est une faute de frappe : il faut lire <strong>CMS</strong>.</p>\n</aside><h2>Idée 2 · Le tableau comparatif, ligne par ligne</h2>\n<table>\n<thead>\n<tr>\n<th>Critère</th>\n<th>Propriétaire (payant)</th>\n<th>Libre (open source)</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Licence et coûts</strong></td>\n<td>Généralement payant. Licence obligatoire. Frais en plus pour mises à jour, support, personnalisations.</td>\n<td>Généralement gratuit. Licence qui autorise utilisation, modification, distribution. Coûts possibles : hébergement, développement sur mesure, support par des tiers.</td>\n</tr>\n<tr>\n<td><strong>Propriété du code</strong></td>\n<td>Code non accessible. Il appartient à l&#39;entreprise. Pas de permission de le modifier.</td>\n<td>Code ouvert à tous. On peut le modifier. Une communauté de développeurs le fait évoluer.</td>\n</tr>\n<tr>\n<td><strong>Support et maintenance</strong></td>\n<td>Support technique dédié. Mises à jour et correctifs fournis par le vendeur : fiabilité et sécurité.</td>\n<td>Support souvent par la communauté, ou par des entreprises spécialisées payantes. Mises à jour par la communauté ou les développeurs principaux.</td>\n</tr>\n<tr>\n<td><strong>Personnalisation</strong></td>\n<td>Généralement limitée, avec parfois des frais.</td>\n<td>Flexibilité et agilité, sans restriction. Vaste gamme de plugins et d&#39;extensions.</td>\n</tr>\n</tbody></table>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Reconstruire le tableau à partir d'une seule question</figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Qui possède le code ?</div><p>Propriétaire : une entreprise. Libre : tout le monde y a accès.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Donc, qui paie quoi ?</div><p>Propriétaire : on paie la licence, puis les extras. Libre : logiciel gratuit, on paie seulement ce qui tourne autour (hébergement, sur-mesure).</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Donc, qui répare ?</div><p>Propriétaire : le vendeur, avec un support dédié. Libre : la communauté, ou un prestataire payant.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Donc, peut-on adapter ?</div><p>Propriétaire : peu, et parfois avec des frais. Libre : oui, librement, avec beaucoup de plugins.</p>\n</div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><h2>Idée 3 · Savoir classer les exemples</h2>\n<table>\n<thead>\n<tr>\n<th>Propriétaires</th>\n<th>Libres</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Adobe Experience Manager</td>\n<td><strong>WordPress</strong></td>\n</tr>\n<tr>\n<td>Sitecore</td>\n<td><strong>PrestaShop</strong></td>\n</tr>\n<tr>\n<td>Shopify</td>\n<td>Joomla</td>\n</tr>\n<tr>\n<td>HubSpot CMS</td>\n<td>Drupal</td>\n</tr>\n<tr>\n<td>Squarespace</td>\n<td>Magento</td>\n</tr>\n<tr>\n<td>Wix</td>\n<td>TYPO3</td>\n</tr>\n<tr>\n<td>Kentico</td>\n<td>Concrete5</td>\n</tr>\n</tbody></table>\n<p>Qui choisit quoi, d&#39;après le cours :</p>\n<ul>\n<li>les <strong>propriétaires</strong> sont souvent choisis par des entreprises qui veulent des solutions robustes et intégrées, avec support technique et fonctionnalités avancées ;</li>\n<li>les <strong>libres</strong> sont largement utilisés dans le monde entier pour tous types de projets, grâce à leur flexibilité, leur communauté et leurs extensions.</li>\n</ul>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>La diapo écrit « Kentic » : le vrai nom du CMS est <strong>Kentico</strong>.</p>\n</aside><aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p>Pour retenir les propriétaires : ce sont ceux que tu vois en <strong>publicité</strong> (Wix, Shopify, Squarespace). Une entreprise paie la pub parce qu&#39;elle vend le produit.</p>\n</aside><h2>Idée 4 · Avantages et inconvénients de chaque camp</h2>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>Propriétaire</th>\n<th>Libre</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Avantage</strong></td>\n<td><strong>Contrôle total du code</strong> par le créateur. Si tu ne veux pas que le code soit altéré ou piraté, c&#39;est l&#39;alternative à choisir.</td>\n<td>La modification du code et sa qualité sont <strong>transparentes</strong> : prévisibilité et sécurité pour les utilisateurs. La communauté peut toujours évaluer et améliorer le code.</td>\n</tr>\n<tr>\n<td><strong>Inconvénient</strong></td>\n<td>On <strong>ne peut pas connaître la qualité</strong> d&#39;un code fermé. Plus fermé au développement, il dépend uniquement de son propriétaire.</td>\n<td><strong>Manque de contrôle</strong> du code d&#39;origine. Des copies peuvent être faites, séparées du référentiel d&#39;origine.</td>\n</tr>\n</tbody></table>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p>Le même fait a deux faces. Code fermé : contrôle total, mais qualité invisible. Code ouvert : transparence, mais moins de contrôle sur ce que les autres en font.</p>\n</aside><p>Pour la formation, le prof tranche : on <strong>opte pour un CMS libre</strong>, et le plus intéressant est <strong>WordPress</strong>.</p>\n<h2>S&#39;exercer</h2>\n<section class=\"exo\"><h3>Classer et justifier</h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Classe ces CMS en deux familles : Drupal, Wix, Shopify, Joomla, Magento, Squarespace.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p><strong>Libres</strong> : Drupal, Joomla, Magento. <strong>Propriétaires</strong> : Wix, Shopify, Squarespace.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Une PME dit : « Nous prenons un CMS libre, donc notre site ne coûtera rien. » Corrige cette phrase.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Que reste-t-il à payer quand le logiciel est gratuit ?</p>\n</div><div class=\"ex-c\" hidden><p>Le logiciel est gratuit, mais il peut y avoir des coûts d&#39;hébergement, de développement personnalisé et de support technique (fourni par des tiers).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Donne un avantage et un inconvénient du CMS propriétaire.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Avantage : contrôle total du code source par le créateur (code protégé contre l&#39;altération). Inconvénient : on ne peut pas connaître la qualité d&#39;un code fermé, et le CMS dépend uniquement de son propriétaire.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 9 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Qu&#39;est-ce qui définit un CMS propriétaire ?</div><button class=\"opt\" data-o=\"0\">Il est toujours plus rapide qu&#39;un CMS libre</button><button class=\"opt\" data-o=\"1\">Son code source appartient à une entreprise et n&#39;est pas disponible publiquement</button><button class=\"opt\" data-o=\"2\">Il ne fonctionne que sur Windows</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Lequel de ces CMS est libre (open source) ?</div><button class=\"opt\" data-o=\"0\">Shopify</button><button class=\"opt\" data-o=\"1\">Wix</button><button class=\"opt\" data-o=\"2\">Drupal</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Lequel de ces CMS est propriétaire ?</div><button class=\"opt\" data-o=\"0\">PrestaShop</button><button class=\"opt\" data-o=\"1\">Squarespace</button><button class=\"opt\" data-o=\"2\">Magento</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Un CMS libre peut quand même entraîner des coûts. Lesquels, selon le cours ?</div><button class=\"opt\" data-o=\"0\">L&#39;achat obligatoire d&#39;une licence</button><button class=\"opt\" data-o=\"1\">L&#39;hébergement, le développement personnalisé et le support technique</button><button class=\"opt\" data-o=\"2\">Une taxe sur chaque visiteur</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Qui fournit les mises à jour d&#39;un CMS propriétaire ?</div><button class=\"opt\" data-o=\"0\">Le vendeur</button><button class=\"opt\" data-o=\"1\">La communauté des utilisateurs</button><button class=\"opt\" data-o=\"2\">L&#39;hébergeur du site</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Sur la personnalisation, le cours dit que le CMS propriétaire est :</div><button class=\"opt\" data-o=\"0\">sans aucune limite</button><button class=\"opt\" data-o=\"1\">généralement limité, avec parfois des frais supplémentaires</button><button class=\"opt\" data-o=\"2\">impossible à personnaliser</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Laquelle de ces caractéristiques n&#39;appartient PAS au CMS libre ?</div><button class=\"opt\" data-o=\"0\">Accès au code source</button><button class=\"opt\" data-o=\"1\">Communauté active</button><button class=\"opt\" data-o=\"2\">Licence d&#39;utilisation à acheter obligatoirement</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Quel est l&#39;inconvénient d&#39;un code source fermé, d&#39;après le cours ?</div><button class=\"opt\" data-o=\"0\">Il est forcément piraté</button><button class=\"opt\" data-o=\"1\">On ne peut pas connaître la qualité du code</button><button class=\"opt\" data-o=\"2\">Il empêche le référencement</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Quel avantage le cours attribue-t-il au CMS libre ?</div><button class=\"opt\" data-o=\"0\">Un support technique dédié fourni par le vendeur</button><button class=\"opt\" data-o=\"1\">La transparence des modifications et de la qualité du code</button><button class=\"opt\" data-o=\"2\">Un contrôle total du code par un seul créateur</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Pour la formation, quel choix fait le prof ?</div><button class=\"opt\" data-o=\"0\">Un CMS propriétaire, pour le support</button><button class=\"opt\" data-o=\"1\">Un CMS libre, et plus précisément WordPress</button><button class=\"opt\" data-o=\"2\">Aucun CMS : tout est codé à la main</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"proprietaire-libre","rep":null,"tol":null},{"n":"proprietaire-libre","rep":null,"tol":null},{"n":"proprietaire-libre","rep":null,"tol":null},{"n":"proprietaire-libre","rep":null,"tol":null}],"qcm":[{"n":"proprietaire-libre","q":"Qu&#39;est-ce qui définit un CMS propriétaire ?","o":["Il est toujours plus rapide qu&#39;un CMS libre","Son code source appartient à une entreprise et n&#39;est pas disponible publiquement","Il ne fonctionne que sur Windows"],"a":1,"e":"La propriété du code est le point de départ de toutes les autres différences."},{"n":"proprietaire-libre","q":"Lequel de ces CMS est libre (open source) ?","o":["Shopify","Wix","Drupal"],"a":2,"e":"Shopify et Wix sont propriétaires. Drupal, comme WordPress et Joomla, est libre."},{"n":"proprietaire-libre","q":"Lequel de ces CMS est propriétaire ?","o":["PrestaShop","Squarespace","Magento"],"a":1,"e":"PrestaShop et Magento sont classés libres dans le cours."},{"n":"proprietaire-libre","q":"Un CMS libre peut quand même entraîner des coûts. Lesquels, selon le cours ?","o":["L&#39;achat obligatoire d&#39;une licence","L&#39;hébergement, le développement personnalisé et le support technique","Une taxe sur chaque visiteur"],"a":1,"e":"Le logiciel est gratuit ; ce qui gravite autour ne l&#39;est pas forcément."},{"n":"proprietaire-libre","q":"Qui fournit les mises à jour d&#39;un CMS propriétaire ?","o":["Le vendeur","La communauté des utilisateurs","L&#39;hébergeur du site"],"a":0,"e":"Le vendeur fournit mises à jour et correctifs, ce qui garantit une certaine fiabilité."},{"n":"proprietaire-libre","q":"Sur la personnalisation, le cours dit que le CMS propriétaire est :","o":["sans aucune limite","généralement limité, avec parfois des frais supplémentaires","impossible à personnaliser"],"a":1,"e":"« Généralement limitée » : pas impossible, mais encadrée et parfois payante."},{"n":"proprietaire-libre","q":"Laquelle de ces caractéristiques n&#39;appartient PAS au CMS libre ?","o":["Accès au code source","Communauté active","Licence d&#39;utilisation à acheter obligatoirement"],"a":2,"e":"L&#39;achat d&#39;une licence est la marque du CMS propriétaire."},{"n":"proprietaire-libre","q":"Quel est l&#39;inconvénient d&#39;un code source fermé, d&#39;après le cours ?","o":["Il est forcément piraté","On ne peut pas connaître la qualité du code","Il empêche le référencement"],"a":1,"e":"Personne d&#39;extérieur ne peut l&#39;évaluer : il faut faire confiance au propriétaire."},{"n":"proprietaire-libre","q":"Quel avantage le cours attribue-t-il au CMS libre ?","o":["Un support technique dédié fourni par le vendeur","La transparence des modifications et de la qualité du code","Un contrôle total du code par un seul créateur"],"a":1,"e":"La communauté peut toujours évaluer et améliorer le code source."},{"n":"proprietaire-libre","q":"Pour la formation, quel choix fait le prof ?","o":["Un CMS propriétaire, pour le support","Un CMS libre, et plus précisément WordPress","Aucun CMS : tout est codé à la main"],"a":1,"e":"« Opter pour un CMS libre », et « le CMS libre le plus intéressant : WordPress »."}]},{"id":"choisir-cms","t":"Les 5 critères pour bien choisir un CMS","seance":"Introduction · Quel CMS choisir ?","imp":4,"html":"<h2>Avant de commencer</h2>\n<p>Tu dois connaître la différence entre CMS propriétaire et CMS libre (chapitre précédent).</p>\n<section class=\"exo\"><h3>Vérifie ton prérequis</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Un CMS « premium » sur abonnement mensuel : plutôt propriétaire ou plutôt libre ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Plutôt <strong>propriétaire</strong> : l&#39;abonnement ou la licence payante est sa marque. Si tu as hésité, relis le tableau comparatif du chapitre 2.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Comment aborder ce chapitre</h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p><strong>Mets-toi à la place d&#39;un client qui achète.</strong> Avant d&#39;acheter un téléphone, tu regardes le prix, la prise en main, ce qu&#39;il sait faire, le service après-vente, et s&#39;il pourra évoluer. Les cinq critères du cours sont exactement ceux-là.</p>\n</aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>Ne choisis pas un CMS seulement pour le site d&#39;aujourd&#39;hui. Le cours insiste sur les <strong>évolutions futures</strong> : un site vitrine peut devenir une boutique.</p>\n</aside><p>À la fin, tu sais citer les cinq critères dans l&#39;ordre et donner un exemple pour chacun.</p>\n<h2>Idée 1 · Le choix du CMS engage tout le projet</h2>\n<p>D&#39;après le cours, choisir le bon CMS est important pour <strong>réussir un projet de plateforme web</strong>. On veut suivre la transformation numérique, augmenter la rentabilité, être plus efficace et améliorer l&#39;expérience utilisateur. Il faut donc comparer une large gamme de CMS et retenir celui qui colle à sa vision et à son organisation.</p>\n<figure class=\"flux\"><figcaption>Les 5 critères, dans l'ordre du cours</figcaption><div class=\"flux-l\"><div class=\"flux-b\">Prix</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Facilité d&#39;utilisation</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Fond du CMS</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Assistance</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Développer des fonctionnalités</div></div></figure><h2>Idée 2 · Critères 1 et 2 : le prix et la facilité</h2>\n<p><strong>1) Le prix</strong></p>\n<table>\n<thead>\n<tr>\n<th>Type de CMS</th>\n<th>Formule</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>« Grand public »</td>\n<td>Formule <strong>gratuite</strong>, enrichie d&#39;<strong>options payantes</strong></td>\n</tr>\n<tr>\n<td>« Professionnel »</td>\n<td>Formule <strong>payante</strong>, souvent un <strong>abonnement</strong> mensuel ou annuel. Pour les solutions poussées, la facture peut vite grimper.</td>\n</tr>\n<tr>\n<td>« Premium »</td>\n<td>Propose souvent une <strong>version d&#39;essai gratuite</strong>, limitée en fonctions ou dans le temps</td>\n</tr>\n</tbody></table>\n<p>L&#39;essai gratuit est un bon moyen de tester une plateforme avant de s&#39;abonner.</p>\n<p><strong>2) La facilité d&#39;utilisation</strong></p>\n<ul>\n<li>Un bon CMS doit rendre la vie de son propriétaire <strong>facile</strong> et mettre ses idées (ou sa maquette) en forme simplement. Exemple du cours : le <strong>drag-and-drop</strong> (glisser-déposer) pour déplacer des éléments.</li>\n<li>Il faut penser aux <strong>évolutions futures</strong> : pouvoir créer un site vitrine, puis le transformer en lui ajoutant une boutique.</li>\n</ul>\n<h2>Idée 3 · Critère 3 : vérifier le fond du CMS</h2>\n<svg viewBox=\"0 0 360 120\" style=\"width:100%;max-width:460px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Le fond du CMS repose sur quatre points : multilingue, référencement, fonctions spécifiques, intégration\">\n<g font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"130\" y=\"42\" width=\"100\" height=\"36\" rx=\"18\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/><text x=\"180\" y=\"64\" fill=\"#D9824F\" font-weight=\"700\">Fond du CMS</text>\n<rect x=\"6\" y=\"6\" width=\"112\" height=\"30\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"62\" y=\"25\">Multilingue</text>\n<rect x=\"242\" y=\"6\" width=\"112\" height=\"30\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"298\" y=\"25\">Référencement</text>\n<rect x=\"6\" y=\"84\" width=\"112\" height=\"30\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"62\" y=\"103\">Fonctions spécifiques</text>\n<rect x=\"242\" y=\"84\" width=\"112\" height=\"30\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"298\" y=\"103\">Intégration</text>\n</g>\n<path d=\"M118 28l22 16M242 28l-22 16M118 92l22-16M242 92l-22-16\" stroke=\"currentColor\" stroke-width=\"2\"/>\n</svg><p>Quatre points à contrôler :</p>\n<table>\n<thead>\n<tr>\n<th>Point</th>\n<th>Ce qu&#39;on vérifie</th>\n<th>Exemple du cours</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Capacités multilingues</strong></td>\n<td>Le CMS peut être traduit en plusieurs langues</td>\n<td></td>\n</tr>\n<tr>\n<td><strong>Outils de référencement</strong></td>\n<td>Des outils avancés pour être visible des moteurs de recherche</td>\n<td></td>\n</tr>\n<tr>\n<td><strong>Fonctions spécifiques</strong></td>\n<td>On peut toujours installer des fonctions en plus</td>\n<td>Google Analytics, e-commerce, live chat</td>\n</tr>\n<tr>\n<td><strong>Capacité d&#39;intégration</strong></td>\n<td>Le CMS se connecte à d&#39;autres outils</td>\n<td>CRM, outils marketing (Mailchimp)</td>\n</tr>\n</tbody></table>\n<h2>Idée 4 · Critères 4 et 5 : l&#39;assistance et le développement</h2>\n<p><strong>4) L&#39;assistance.</strong> Tous les CMS n&#39;offrent pas le même support client :</p>\n<ul>\n<li>par <strong>e-mail ou formulaire</strong> ;</li>\n<li>par <strong>téléphone et chat</strong> (24 h/24) ;</li>\n<li>par une <strong>communauté</strong>, plus ou moins grande.</li>\n</ul>\n<p>Deux conseils du cours : choisir un CMS avec une <strong>base de connaissances en ligne</strong> ou des <strong>forums communautaires</strong>, et une <strong>équipe d&#39;assistance disponible</strong> qui répond vite.</p>\n<p><strong>5) Développer des fonctionnalités.</strong></p>\n<ul>\n<li>Le CMS doit être assez <strong>flexible</strong> pour enrichir le code et l&#39;adapter à ses besoins.</li>\n<li>Les CMS <strong>headless</strong> (back et front séparés) offrent une grande liberté, mais demandent du développement.</li>\n<li>Le CMS doit laisser tout le champ au <strong>développement spécialisé</strong>, pour se démarquer sur le marché.</li>\n</ul>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p><strong>Headless</strong> = le back (gestion du contenu) et le front (affichage) sont séparés. Plus de liberté, plus de développement.</p>\n</aside><figure class=\"etapes\" data-i=\"0\"><figcaption>Appliquer les 5 critères à un cas : une boutique de tapis à Béni Mellal</figcaption><div class=\"etape\"><div class=\"et-t\">1/6 · 1. Prix</div><p>Petit budget. On vise une formule gratuite avec options payantes, ou un CMS libre.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/6 · 2. Facilité</div><p>Le gérant n&#39;est pas développeur : il lui faut du glisser-déposer. Et la vitrine doit pouvoir devenir une boutique.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/6 · 3. Fond</div><p>Site en français, arabe et anglais (multilingue), bon référencement, module e-commerce.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">4/6 · 4. Assistance</div><p>Une grande communauté et des forums, pour trouver de l&#39;aide sans payer.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">5/6 · 5. Développement</div><p>Possibilité d&#39;ajouter plus tard des fonctions sur mesure.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">6/6 · Conclusion</div><p>Un CMS libre comme WordPress coche les cinq cases : c&#39;est le choix du cours.</p>\n</div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>Le cas de la boutique de tapis est un exemple ajouté par ToumaiLearn pour s&#39;entraîner. Les cinq critères et leur contenu viennent du cours.</p>\n</aside><h2>S&#39;exercer</h2>\n<section class=\"exo\"><h3>Questions types</h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Cite les cinq critères pour bien choisir un CMS.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><ol>\n<li>Le prix. 2) La facilité d&#39;utilisation. 3) La vérification du fond du CMS. 4) L&#39;assistance. 5) La possibilité de développer des fonctionnalités.</li>\n</ol>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Que vérifie-t-on dans le « fond » d&#39;un CMS ? Donne les quatre points.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Langues, visibilité, fonctions, connexions.</p>\n</div><div class=\"ex-c\" hidden><p>Les capacités multilingues, les outils de référencement, les fonctions spécifiques (Google Analytics, e-commerce, live chat) et la capacité d&#39;intégration (CRM, Mailchimp).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Qu&#39;est-ce qu&#39;un CMS headless, et quel est son prix à payer ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Un CMS dont le back et le front sont séparés. Il offre une grande liberté, mais nécessite du développement approprié.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Combien de critères le cours donne-t-il pour bien choisir un CMS ?</div><button class=\"opt\" data-o=\"0\">3</button><button class=\"opt\" data-o=\"1\">5</button><button class=\"opt\" data-o=\"2\">7</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Un CMS « grand public » propose en général :</div><button class=\"opt\" data-o=\"0\">une formule gratuite enrichie d&#39;options payantes</button><button class=\"opt\" data-o=\"1\">uniquement un abonnement annuel</button><button class=\"opt\" data-o=\"2\">une licence à vie sans option</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">À quoi sert la version d&#39;essai gratuite d&#39;un CMS premium ?</div><button class=\"opt\" data-o=\"0\">À héberger son site gratuitement pour toujours</button><button class=\"opt\" data-o=\"1\">À essayer la plateforme avant de souscrire un abonnement</button><button class=\"opt\" data-o=\"2\">À obtenir le code source</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Quel exemple le cours donne-t-il pour la facilité d&#39;utilisation ?</div><button class=\"opt\" data-o=\"0\">La ligne de commande</button><button class=\"opt\" data-o=\"1\">Le drag-and-drop (glisser-déposer)</button><button class=\"opt\" data-o=\"2\">L&#39;édition directe de la base de données</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Pourquoi penser aux évolutions futures du site ?</div><button class=\"opt\" data-o=\"0\">Parce qu&#39;un site vitrine peut devenir une boutique</button><button class=\"opt\" data-o=\"1\">Parce que le CMS expire au bout d&#39;un an</button><button class=\"opt\" data-o=\"2\">Parce que le contenu est supprimé à chaque mise à jour</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Lequel de ces points ne fait PAS partie de la « vérification du fond » ?</div><button class=\"opt\" data-o=\"0\">Capacités multilingues</button><button class=\"opt\" data-o=\"1\">Outils de référencement</button><button class=\"opt\" data-o=\"2\">Couleur du logo</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Mailchimp est cité dans le cours comme exemple de :</div><button class=\"opt\" data-o=\"0\">CMS propriétaire</button><button class=\"opt\" data-o=\"1\">outil de marketing à intégrer au CMS</button><button class=\"opt\" data-o=\"2\">hébergeur web</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Quelle forme d&#39;assistance n&#39;est PAS citée dans le cours ?</div><button class=\"opt\" data-o=\"0\">E-mail ou formulaire</button><button class=\"opt\" data-o=\"1\">Communauté</button><button class=\"opt\" data-o=\"2\">Visite d&#39;un technicien à domicile</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Qu&#39;est-ce qu&#39;un CMS headless ?</div><button class=\"opt\" data-o=\"0\">Un CMS sans base de données</button><button class=\"opt\" data-o=\"1\">Un CMS dont le back et le front sont séparés</button><button class=\"opt\" data-o=\"2\">Un CMS sans administrateur</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Selon le cinquième critère, un bon CMS doit être :</div><button class=\"opt\" data-o=\"0\">fermé, pour éviter les modifications</button><button class=\"opt\" data-o=\"1\">assez flexible pour enrichir le code et l&#39;adapter à ses besoins</button><button class=\"opt\" data-o=\"2\">limité aux fonctions de base</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"choisir-cms","rep":null,"tol":null},{"n":"choisir-cms","rep":null,"tol":null},{"n":"choisir-cms","rep":null,"tol":null},{"n":"choisir-cms","rep":null,"tol":null}],"qcm":[{"n":"choisir-cms","q":"Combien de critères le cours donne-t-il pour bien choisir un CMS ?","o":["3","5","7"],"a":1,"e":"Prix, facilité, fond, assistance, développement de fonctionnalités."},{"n":"choisir-cms","q":"Un CMS « grand public » propose en général :","o":["une formule gratuite enrichie d&#39;options payantes","uniquement un abonnement annuel","une licence à vie sans option"],"a":0,"e":"Les CMS « professionnels », eux, sont payants, souvent par abonnement."},{"n":"choisir-cms","q":"À quoi sert la version d&#39;essai gratuite d&#39;un CMS premium ?","o":["À héberger son site gratuitement pour toujours","À essayer la plateforme avant de souscrire un abonnement","À obtenir le code source"],"a":1,"e":"Elle est limitée en fonctionnalités ou dans le temps."},{"n":"choisir-cms","q":"Quel exemple le cours donne-t-il pour la facilité d&#39;utilisation ?","o":["La ligne de commande","Le drag-and-drop (glisser-déposer)","L&#39;édition directe de la base de données"],"a":1,"e":"Déplacer des éléments à la souris, sans coder."},{"n":"choisir-cms","q":"Pourquoi penser aux évolutions futures du site ?","o":["Parce qu&#39;un site vitrine peut devenir une boutique","Parce que le CMS expire au bout d&#39;un an","Parce que le contenu est supprimé à chaque mise à jour"],"a":0,"e":"Le CMS choisi doit permettre d&#39;ajouter une boutique plus tard."},{"n":"choisir-cms","q":"Lequel de ces points ne fait PAS partie de la « vérification du fond » ?","o":["Capacités multilingues","Outils de référencement","Couleur du logo"],"a":2,"e":"Les quatre points : multilingue, référencement, fonctions spécifiques, intégration."},{"n":"choisir-cms","q":"Mailchimp est cité dans le cours comme exemple de :","o":["CMS propriétaire","outil de marketing à intégrer au CMS","hébergeur web"],"a":1,"e":"Il illustre la capacité d&#39;intégration, avec les CRM."},{"n":"choisir-cms","q":"Quelle forme d&#39;assistance n&#39;est PAS citée dans le cours ?","o":["E-mail ou formulaire","Communauté","Visite d&#39;un technicien à domicile"],"a":2,"e":"Le cours cite e-mail ou formulaire, téléphone et chat, communauté."},{"n":"choisir-cms","q":"Qu&#39;est-ce qu&#39;un CMS headless ?","o":["Un CMS sans base de données","Un CMS dont le back et le front sont séparés","Un CMS sans administrateur"],"a":1,"e":"Il offre une grande liberté mais demande du développement."},{"n":"choisir-cms","q":"Selon le cinquième critère, un bon CMS doit être :","o":["fermé, pour éviter les modifications","assez flexible pour enrichir le code et l&#39;adapter à ses besoins","limité aux fonctions de base"],"a":1,"e":"C&#39;est ce qui permet de se démarquer sur le marché."}]},{"id":"wordpress-presentation","t":"WordPress · pourquoi lui, ce qu'il est, son histoire","seance":"Partie 1 · WordPress","imp":5,"html":"<h2>Avant de commencer</h2>\n<p>Tu dois savoir ce qu&#39;est un CMS libre et pourquoi le prof en choisit un pour la formation (chapitres 2 et 3).</p>\n<section class=\"exo\"><h3>Vérifie ton prérequis</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>WordPress est-il un CMS propriétaire ou libre ? Cite un autre CMS de la même famille.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p><strong>Libre</strong> (open source). De la même famille : PrestaShop, Joomla, Drupal, Magento.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Comment aborder ce chapitre</h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p><strong>Retiens trois mots : PHP, MySQL, extensions.</strong> WordPress est écrit en PHP, range ses données dans MySQL, et se complète avec des extensions et des thèmes. Le reste du chapitre habille ces trois mots.</p>\n</aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>Ne dis pas « WordPress sert à faire des blogs ». C&#39;était vrai <strong>à ses débuts</strong>. Aujourd&#39;hui, c&#39;est un CMS capable de gérer n&#39;importe quel type de site, y compris une boutique en ligne.</p>\n</aside><p>À la fin, tu sais justifier le choix de WordPress en six arguments, le présenter techniquement et dérouler son historique.</p>\n<h2>Idée 1 · Six raisons de choisir WordPress</h2>\n<svg viewBox=\"0 0 360 150\" style=\"width:100%;max-width:460px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Six raisons de choisir WordPress autour du logo : communauté, facilité, extensions, thèmes, part de marché, emploi\">\n<g font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\">\n<circle cx=\"180\" cy=\"75\" r=\"30\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/><text x=\"180\" y=\"79\" fill=\"#D9824F\" font-weight=\"700\">WordPress</text>\n<rect x=\"6\" y=\"8\" width=\"100\" height=\"26\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"56\" y=\"25\">Communauté</text>\n<rect x=\"130\" y=\"4\" width=\"100\" height=\"26\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"180\" y=\"21\">Facilité</text>\n<rect x=\"254\" y=\"8\" width=\"100\" height=\"26\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"304\" y=\"25\">Extensions</text>\n<rect x=\"6\" y=\"116\" width=\"100\" height=\"26\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"56\" y=\"133\">Thèmes</text>\n<rect x=\"130\" y=\"120\" width=\"100\" height=\"26\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"180\" y=\"137\">Part de marché</text>\n<rect x=\"254\" y=\"116\" width=\"100\" height=\"26\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"304\" y=\"133\">Emploi</text>\n</g>\n</svg><table>\n<thead>\n<tr>\n<th>Raison</th>\n<th>Ce que dit le cours</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Communauté</strong></td>\n<td>Le nombre d&#39;utilisateurs croît sans cesse. En cas de problème, une aide est toujours accessible, et le <strong>coût de maintenance</strong> du site est moins élevé.</td>\n</tr>\n<tr>\n<td><strong>Facilité</strong></td>\n<td>Pas besoin de maîtriser HTML/CSS ou PHP, contrairement à d&#39;autres CMS plus complexes. Simple pour les utilisateurs et pour les développeurs de thèmes et d&#39;extensions.</td>\n</tr>\n<tr>\n<td><strong>Système d&#39;extensions</strong></td>\n<td>On ajoute des fonctions au site en installant des extensions (plugins).</td>\n</tr>\n<tr>\n<td><strong>Système de thèmes</strong></td>\n<td>On change l&#39;apparence du site en changeant de thème.</td>\n</tr>\n<tr>\n<td><strong>Part de marché</strong></td>\n<td>Plus de <strong>43 %</strong> des parts de marché, loin devant <strong>Joomla (3 %)</strong> et <strong>Drupal (4 %)</strong>. Le reste : des solutions sur mesure.</td>\n</tr>\n<tr>\n<td><strong>Emploi</strong></td>\n<td>Les profils WordPress sont très recherchés par les entreprises et les startups, pour des sites vitrines comme pour des boutiques en ligne.</td>\n</tr>\n</tbody></table>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>Les diapos donnent deux chiffres : WordPress « utilisé sur environ <strong>30 %</strong> des sites Internet » (diapo Communauté) et « plus de <strong>43 %</strong> des parts de marché » (diapo Part de marché). Ce n&#39;est pas forcément une contradiction : les deux chiffres ne datent pas de la même année, et le second est le plus récent. En examen, cite le chiffre de la question posée ; par défaut, <strong>43 %</strong>.</p>\n</aside><h2>Idée 2 · La carte d&#39;identité de WordPress</h2>\n<figure class=\"flux\"><figcaption>Comment WordPress fabrique une page</figcaption><div class=\"flux-l\"><div class=\"flux-b\">Visiteur demande une page</div><div class=\"flux-f\">→</div><div class=\"flux-b\">PHP (le code de WordPress)</div><div class=\"flux-f\">→</div><div class=\"flux-b\">MySQL (les contenus)</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Page HTML envoyée au visiteur</div></div></figure><p>Les cinq phrases de présentation du cours :</p>\n<ul>\n<li>WordPress est une plateforme de création de sites web <strong>gratuite et open source</strong>.</li>\n<li>C&#39;est un CMS <strong>écrit en PHP</strong> qui utilise une base de données <strong>MySQL</strong>.</li>\n<li>C&#39;est le créateur de blogs et de sites web <strong>le plus simple et le plus puissant</strong> qui existe aujourd&#39;hui.</li>\n<li>C&#39;est une excellente plateforme pour une <strong>variété de sites web</strong>.</li>\n<li>C&#39;est un CMS <strong>polyvalent</strong>, conçu pour l&#39;<strong>accessibilité</strong> et la <strong>flexibilité</strong>, bon pour les sites simples comme pour les sites complexes.</li>\n</ul>\n<p>Deux précisions à connaître :</p>\n<ul>\n<li>WordPress était <strong>orienté blog à ses débuts</strong>, puis il est devenu un CMS puissant, capable de gérer n&#39;importe quel type de site.</li>\n<li>WordPress est un <strong>« début de site Internet »</strong> : il faut le compléter avec des <strong>extensions</strong>, des <strong>thèmes</strong> et des <strong>développements personnalisés</strong>.</li>\n</ul>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p>WordPress = <strong>PHP + MySQL</strong>, gratuit, open source. Livré comme un « début de site », à compléter par extensions, thèmes et développements.</p>\n</aside><h2>Idée 3 · L&#39;historique en six dates</h2>\n<svg viewBox=\"0 0 360 96\" style=\"width:100%;max-width:460px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Frise : 2003 lancement, 2008, 2010, 2012, 2014 numéro un mondial, 2018 Gutenberg\">\n<line x1=\"14\" y1=\"48\" x2=\"346\" y2=\"48\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<g font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\">\n<circle cx=\"30\" cy=\"48\" r=\"5\" fill=\"#D9824F\"/><text x=\"30\" y=\"34\" font-weight=\"700\">2003</text><text x=\"30\" y=\"70\" font-size=\"9\">v0.7</text>\n<circle cx=\"90\" cy=\"48\" r=\"5\" fill=\"currentColor\"/><text x=\"90\" y=\"34\">2008</text><text x=\"90\" y=\"70\" font-size=\"9\">v2.5</text>\n<circle cx=\"150\" cy=\"48\" r=\"5\" fill=\"currentColor\"/><text x=\"150\" y=\"34\">2010</text><text x=\"150\" y=\"70\" font-size=\"9\">v3.0</text>\n<circle cx=\"210\" cy=\"48\" r=\"5\" fill=\"currentColor\"/><text x=\"210\" y=\"34\">2012</text><text x=\"210\" y=\"70\" font-size=\"9\">v3.x</text>\n<circle cx=\"270\" cy=\"48\" r=\"5\" fill=\"#D9824F\"/><text x=\"270\" y=\"34\" font-weight=\"700\">2014</text><text x=\"270\" y=\"70\" font-size=\"9\">v4.0</text>\n<circle cx=\"330\" cy=\"48\" r=\"5\" fill=\"#D9824F\"/><text x=\"330\" y=\"34\" font-weight=\"700\">2018</text><text x=\"330\" y=\"70\" font-size=\"9\">v5.0</text>\n</g>\n</svg><table>\n<thead>\n<tr>\n<th>Année</th>\n<th>Version</th>\n<th>Événement</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>2003</strong></td>\n<td>v0.7</td>\n<td><strong>Lancement</strong> de WordPress</td>\n</tr>\n<tr>\n<td>2008</td>\n<td>v2.5</td>\n<td>Presque <strong>5 millions</strong> de téléchargements depuis sa sortie</td>\n</tr>\n<tr>\n<td>2010</td>\n<td>v3.0</td>\n<td><strong>10 millions</strong> de téléchargements depuis 2003</td>\n</tr>\n<tr>\n<td>2012</td>\n<td>v3.x</td>\n<td><strong>50 millions</strong> de téléchargements depuis 2003</td>\n</tr>\n<tr>\n<td><strong>2014</strong></td>\n<td>v4.0</td>\n<td>« Explosion » : WordPress devient <strong>numéro 1 mondial</strong> des plateformes de gestion de contenu</td>\n</tr>\n<tr>\n<td><strong>2018</strong></td>\n<td>v5.0</td>\n<td>Nouvel éditeur par blocs, le <strong>Block Editor (Gutenberg)</strong>, pour une construction de site plus intuitive</td>\n</tr>\n</tbody></table>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Mémoriser la frise</figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Les trois dates clés</div><p><strong>2003</strong> naissance, <strong>2014</strong> numéro 1 mondial, <strong>2018</strong> Gutenberg. Ce sont celles qui tombent.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Les téléchargements</div><p>5 millions (2008), 10 millions (2010), 50 millions (2012). Ça double, puis ça fait fois cinq.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Les versions</div><p>Le premier chiffre suit presque les événements : 0.7, 2.5, 3.0, 3.x, 4.0, 5.0.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Le mot à ne pas oublier</div><p><strong>Gutenberg</strong> = l&#39;éditeur par blocs arrivé avec la version 5.0.</p>\n</div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><h2>S&#39;exercer</h2>\n<section class=\"exo\"><h3>Questions types</h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Donne quatre raisons de choisir WordPress.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Au choix parmi : sa communauté (aide accessible, maintenance moins chère), sa facilité (pas besoin de maîtriser HTML/CSS/PHP), son système d&#39;extensions, son système de thèmes, sa part de marché (plus de 43 %), l&#39;emploi (profils très recherchés).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Avec quel langage WordPress est-il écrit, et quelle base de données utilise-t-il ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Il est écrit en <strong>PHP</strong> et utilise une base de données <strong>MySQL</strong>.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Que signifie « WordPress est un début de site Internet » ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>WordPress seul ne suffit pas : il faut le compléter via des extensions, des thèmes et des développements personnalisés.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Qu&#39;apporte la version 5.0 de 2018 ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Le nouvel éditeur par blocs, <strong>Block Editor (Gutenberg)</strong>, pour une expérience de construction de site plus intuitive.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 9 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">WordPress est écrit en :</div><button class=\"opt\" data-o=\"0\">Java</button><button class=\"opt\" data-o=\"1\">PHP</button><button class=\"opt\" data-o=\"2\">Python</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Quelle base de données WordPress utilise-t-il ?</div><button class=\"opt\" data-o=\"0\">MySQL</button><button class=\"opt\" data-o=\"1\">MongoDB</button><button class=\"opt\" data-o=\"2\">Oracle</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">En quelle année WordPress a-t-il été lancé ?</div><button class=\"opt\" data-o=\"0\">1999</button><button class=\"opt\" data-o=\"1\">2003</button><button class=\"opt\" data-o=\"2\">2008</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Que s&#39;est-il passé en 2014 avec la version 4.0 ?</div><button class=\"opt\" data-o=\"0\">WordPress est devenu payant</button><button class=\"opt\" data-o=\"1\">WordPress est devenu numéro 1 mondial des plateformes de gestion de contenu</button><button class=\"opt\" data-o=\"2\">WordPress a abandonné PHP</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Quel est le nom de l&#39;éditeur par blocs arrivé avec la version 5.0 ?</div><button class=\"opt\" data-o=\"0\">Elementor</button><button class=\"opt\" data-o=\"1\">Classic Editor</button><button class=\"opt\" data-o=\"2\">Gutenberg</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">À ses débuts, WordPress était orienté principalement :</div><button class=\"opt\" data-o=\"0\">blog</button><button class=\"opt\" data-o=\"1\">e-commerce</button><button class=\"opt\" data-o=\"2\">réseaux sociaux</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Selon la diapo « Part de marché », WordPress occupe :</div><button class=\"opt\" data-o=\"0\">environ 4 % des parts de marché</button><button class=\"opt\" data-o=\"1\">environ 20 % des parts de marché</button><button class=\"opt\" data-o=\"2\">plus de 43 % des parts de marché</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Pourquoi la communauté est-elle un argument pour WordPress ?</div><button class=\"opt\" data-o=\"0\">Elle rend WordPress payant</button><button class=\"opt\" data-o=\"1\">Une aide est toujours accessible et la maintenance coûte moins cher</button><button class=\"opt\" data-o=\"2\">Elle interdit les extensions non officielles</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Que veut dire « WordPress est un début de site Internet » ?</div><button class=\"opt\" data-o=\"0\">Il ne permet de créer que la page d&#39;accueil</button><button class=\"opt\" data-o=\"1\">Il faut le compléter avec des extensions, des thèmes et des développements personnalisés</button><button class=\"opt\" data-o=\"2\">Il est encore en version d&#39;essai</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Combien de fois WordPress avait-il été téléchargé en 2012, depuis 2003 ?</div><button class=\"opt\" data-o=\"0\">5 millions</button><button class=\"opt\" data-o=\"1\">10 millions</button><button class=\"opt\" data-o=\"2\">50 millions</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"wordpress-presentation","rep":null,"tol":null},{"n":"wordpress-presentation","rep":null,"tol":null},{"n":"wordpress-presentation","rep":null,"tol":null},{"n":"wordpress-presentation","rep":null,"tol":null},{"n":"wordpress-presentation","rep":null,"tol":null}],"qcm":[{"n":"wordpress-presentation","q":"WordPress est écrit en :","o":["Java","PHP","Python"],"a":1,"e":"Et il utilise une base de données MySQL."},{"n":"wordpress-presentation","q":"Quelle base de données WordPress utilise-t-il ?","o":["MySQL","MongoDB","Oracle"],"a":0,"e":"WordPress = PHP + MySQL."},{"n":"wordpress-presentation","q":"En quelle année WordPress a-t-il été lancé ?","o":["1999","2003","2008"],"a":1,"e":"Version 0.7, en 2003."},{"n":"wordpress-presentation","q":"Que s&#39;est-il passé en 2014 avec la version 4.0 ?","o":["WordPress est devenu payant","WordPress est devenu numéro 1 mondial des plateformes de gestion de contenu","WordPress a abandonné PHP"],"a":1,"e":"Le cours parle d&#39;« explosion » de WordPress."},{"n":"wordpress-presentation","q":"Quel est le nom de l&#39;éditeur par blocs arrivé avec la version 5.0 ?","o":["Elementor","Classic Editor","Gutenberg"],"a":2,"e":"Block Editor (Gutenberg), en 2018."},{"n":"wordpress-presentation","q":"À ses débuts, WordPress était orienté principalement :","o":["blog","e-commerce","réseaux sociaux"],"a":0,"e":"Il a ensuite évolué en CMS capable de gérer n&#39;importe quel type de site."},{"n":"wordpress-presentation","q":"Selon la diapo « Part de marché », WordPress occupe :","o":["environ 4 % des parts de marché","environ 20 % des parts de marché","plus de 43 % des parts de marché"],"a":2,"e":"Joomla et Drupal occupent respectivement 3 % et 4 %."},{"n":"wordpress-presentation","q":"Pourquoi la communauté est-elle un argument pour WordPress ?","o":["Elle rend WordPress payant","Une aide est toujours accessible et la maintenance coûte moins cher","Elle interdit les extensions non officielles"],"a":1,"e":"Plus il y a d&#39;utilisateurs, plus il est facile de trouver une solution."},{"n":"wordpress-presentation","q":"Que veut dire « WordPress est un début de site Internet » ?","o":["Il ne permet de créer que la page d&#39;accueil","Il faut le compléter avec des extensions, des thèmes et des développements personnalisés","Il est encore en version d&#39;essai"],"a":1,"e":"WordPress fournit la base ; le reste s&#39;ajoute."},{"n":"wordpress-presentation","q":"Combien de fois WordPress avait-il été téléchargé en 2012, depuis 2003 ?","o":["5 millions","10 millions","50 millions"],"a":2,"e":"5 millions en 2008, 10 millions en 2010, 50 millions en 2012."}]},{"id":"org-com-prerequis","t":"WordPress.org, WordPress.com et les prérequis","seance":"Partie 1 · WordPress","imp":5,"html":"<h2>Avant de commencer</h2>\n<p>Tu dois savoir que WordPress est un logiciel <strong>gratuit et open source</strong>, écrit en PHP avec une base MySQL (chapitre 4).</p>\n<section class=\"exo\"><h3>Vérifie ton prérequis</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Un logiciel écrit en PHP avec une base MySQL peut-il fonctionner tout seul, sans serveur ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Non. PHP s&#39;exécute <strong>sur un serveur web</strong>, et MySQL est un <strong>serveur de base de données</strong>. Il faut donc une machine qui fait tourner les deux : c&#39;est tout l&#39;objet de ce chapitre.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Comment aborder ce chapitre</h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p><strong>Pense « propriétaire ou locataire ».</strong> WordPress.org, c&#39;est être propriétaire de sa maison : tu fais ce que tu veux, mais tu répares toi-même. WordPress.com, c&#39;est louer un appartement meublé : tout est géré, mais tu ne casses pas les murs.</p>\n</aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>Les deux noms se ressemblent, et beaucoup les confondent. <strong>.org = le logiciel à télécharger. .com = un service commercial hébergé.</strong> C&#39;est le même logiciel WordPress derrière, mais pas la même formule.</p>\n</aside><p>À la fin, tu sais comparer .org et .com sur dix critères et lister les trois prérequis pour utiliser WordPress.</p>\n<h2>Idée 1 · Même logiciel, deux formules</h2>\n<svg viewBox=\"0 0 360 130\" style=\"width:100%;max-width:460px;display:block;margin:10px auto\" role=\"img\" aria-label=\"WordPress.org : tu héberges toi-même. WordPress.com : hébergé par Automattic\">\n<g font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"10\" y=\"10\" width=\"160\" height=\"110\" rx=\"8\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/>\n<text x=\"90\" y=\"32\" font-weight=\"700\" fill=\"#D9824F\">WordPress.org</text><text x=\"90\" y=\"54\">tu télécharges</text><text x=\"90\" y=\"71\">tu héberges toi-même</text><text x=\"90\" y=\"88\">contrôle total</text><text x=\"90\" y=\"108\" font-size=\"10\">« propriétaire »</text>\n<rect x=\"190\" y=\"10\" width=\"160\" height=\"110\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<text x=\"270\" y=\"32\" font-weight=\"700\">WordPress.com</text><text x=\"270\" y=\"54\">tu crées un compte</text><text x=\"270\" y=\"71\">hébergé par Automattic</text><text x=\"270\" y=\"88\">clé en main</text><text x=\"270\" y=\"108\" font-size=\"10\">« locataire »</text>\n</g>\n</svg><p><strong>WordPress.org</strong></p>\n<ul>\n<li><strong>Description</strong> : le site officiel du logiciel WordPress. On y télécharge gratuitement le logiciel open source pour l&#39;installer sur son propre serveur.</li>\n<li><strong>Fonctionnement</strong> : on télécharge WordPress et on l&#39;installe sur l&#39;hébergement de son choix. Contrôle total : personnaliser les thèmes, installer des plugins, modifier le code source.</li>\n<li><strong>Utilisation</strong> : pour ceux qui veulent une liberté totale, sans limites.</li>\n</ul>\n<p><strong>WordPress.com</strong></p>\n<ul>\n<li><strong>Description</strong> : un service commercial géré par <strong>Automattic</strong>, la société fondée par l&#39;un des co-créateurs de WordPress. Il offre une version <strong>hébergée</strong> de WordPress.</li>\n<li><strong>Fonctionnement</strong> : on crée un compte et on construit son site directement sur leur plateforme. Ils s&#39;occupent de l&#39;hébergement, des mises à jour, de la sécurité et des sauvegardes. Il existe des plans gratuits et payants.</li>\n<li><strong>Utilisation</strong> : solution <strong>clé en main</strong>, sans se soucier de l&#39;hébergement ni de la technique.</li>\n</ul>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>La diapo WordPress.com écrit que « toute l&#39;infrastructure est gérée <strong>par soi même</strong> ». C&#39;est une coquille : la phrase suivante de la même diapo dit bien qu&#39;« <strong>ils</strong> s&#39;occupent de l&#39;hébergement, des mises à jour, de la sécurité et des sauvegardes ». L&#39;infrastructure est gérée <strong>par WordPress.com (Automattic)</strong>, pas par toi.</p>\n</aside><h2>Idée 2 · Le tableau comparatif en dix lignes</h2>\n<table>\n<thead>\n<tr>\n<th>Caractéristique</th>\n<th>WordPress.org</th>\n<th>WordPress.com</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Type de plateforme</td>\n<td><strong>Auto-hébergée</strong></td>\n<td><strong>Hébergée</strong> par WordPress</td>\n</tr>\n<tr>\n<td>Hébergement</td>\n<td>À trouver et à payer soi-même</td>\n<td>Inclus dans le service</td>\n</tr>\n<tr>\n<td>Coût</td>\n<td>Gratuit à télécharger, mais hébergement et nom de domaine à p
