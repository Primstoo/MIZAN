ayer</td>\n<td>Plans gratuits et payants</td>\n</tr>\n<tr>\n<td>Personnalisation</td>\n<td>Accès complet aux fichiers, thèmes et plugins</td>\n<td>Limitée selon le plan</td>\n</tr>\n<tr>\n<td>Extensions</td>\n<td>Accès à tous les plugins</td>\n<td>Limitées en gratuit, plus d&#39;options en payant</td>\n</tr>\n<tr>\n<td>Thèmes</td>\n<td>Tous les thèmes disponibles</td>\n<td>Limités en gratuit, plus d&#39;options en payant</td>\n</tr>\n<tr>\n<td>Contrôle et flexibilité</td>\n<td><strong>Contrôle total</strong></td>\n<td>Contrôle limité : WordPress.com gère la technique</td>\n</tr>\n<tr>\n<td>Monétisation</td>\n<td>Libre</td>\n<td>Restreinte, surtout en gratuit</td>\n</tr>\n<tr>\n<td>Maintenance et sécurité</td>\n<td><strong>Tu</strong> es responsable des mises à jour et de la sécurité</td>\n<td><strong>WordPress.com</strong> les gère</td>\n</tr>\n<tr>\n<td>Support</td>\n<td>Communauté, forums, documentation</td>\n<td>De base en gratuit, premium en payant</td>\n</tr>\n</tbody></table>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Retrouver les dix lignes sans les apprendre par cœur</figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Pars de l&#39;image</div><p>.org = propriétaire de sa maison. .com = locataire d&#39;un meublé.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · Qui paie les murs ?</div><p>Propriétaire : il trouve et paie son terrain (hébergement, nom de domaine). Locataire : c&#39;est inclus dans le loyer (plan gratuit ou payant).</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · Qui décide de la déco ?</div><p>Propriétaire : tout est permis (tous les thèmes, tous les plugins, le code). Locataire : selon le bail (limité selon le plan).</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · Qui répare ?</div><p>Propriétaire : lui-même (mises à jour, sécurité). Locataire : le bailleur (WordPress.com).</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · Qui peut louer une chambre ?</div><p>Propriétaire : libre de monétiser. Locataire : restreint, surtout en gratuit.</p>\n</div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><h2>Idée 3 · Avantages, inconvénients, et pour qui</h2>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>WordPress.org</th>\n<th>WordPress.com</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Avantages</strong></td>\n<td>Contrôle complet. Tous les thèmes et plugins. Personnalisation entière. Monétisation possible (vente, publicité).</td>\n<td>Facile, hébergement inclus. Mises à jour et sécurité gérées. Support technique selon le plan.</td>\n</tr>\n<tr>\n<td><strong>Inconvénients</strong></td>\n<td>Demande des connaissances techniques (hébergement, mises à jour, sécurité). Coûts : hébergement, nom de domaine, thèmes et plugins premium.</td>\n<td>Personnalisation et extensions limitées, surtout en gratuit. Monétisation restreinte. Moins de contrôle sur le site et son contenu.</td>\n</tr>\n<tr>\n<td><strong>Pour qui</strong></td>\n<td>Ceux qui ont des compétences techniques, ou les moyens de gérer la technique</td>\n<td>Ceux qui préfèrent une solution clé en main et acceptent de payer pour le confort</td>\n</tr>\n</tbody></table>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p><strong>.org = liberté et contrôle, mais technique à ta charge. .com = confort clé en main, mais limites.</strong></p>\n</aside><h2>Idée 4 · Les trois prérequis de WordPress</h2>\n<figure class=\"flux\"><figcaption>Ce qu'il faut pour mettre un site WordPress en ligne</figcaption><div class=\"flux-l\"><div class=\"flux-b\">Nom de domaine (l&#39;adresse)</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Serveur (la machine)</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Hébergeur (qui loue la machine)</div></div></figure><table>\n<thead>\n<tr>\n<th>Prérequis</th>\n<th>Définition</th>\n<th>Exemple</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Nom de domaine</strong></td>\n<td>L&#39;adresse web que l&#39;on saisit dans le navigateur. S&#39;achète auprès d&#39;un <strong>registraire de domaine</strong>.</td>\n<td>monsite.com</td>\n</tr>\n<tr>\n<td><strong>Serveur</strong></td>\n<td>Ordinateur puissant, connecté en permanence à Internet, qui stocke et diffuse le site.</td>\n<td>voir ci-dessous</td>\n</tr>\n<tr>\n<td><strong>Hébergeur</strong></td>\n<td>Entreprise qui loue de l&#39;espace pour héberger des sites.</td>\n<td>Bluehost, SiteGround, HostGator</td>\n</tr>\n</tbody></table>\n<p>Les quatre types de serveur :</p>\n<table>\n<thead>\n<tr>\n<th>Type</th>\n<th>En un mot</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Partagé</strong></td>\n<td>Pas cher, mais partagé avec d&#39;autres sites</td>\n</tr>\n<tr>\n<td><strong>Dédié</strong></td>\n<td>Puissance et contrôle, mais plus cher</td>\n</tr>\n<tr>\n<td><strong>Cloud</strong></td>\n<td>Évolutivité et flexibilité</td>\n</tr>\n<tr>\n<td><strong>Local</strong></td>\n<td>Excellent pour les tests, la formation et le travail avant mise en ligne (MAMP, XAMPP)</td>\n</tr>\n</tbody></table>\n<p>En TP, on travaille avec un <strong>serveur local</strong> : XAMPP. C&#39;est le sujet du chapitre suivant.</p>\n<h2>S&#39;exercer</h2>\n<section class=\"exo\"><h3>Questions types</h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Quelle est la différence principale entre WordPress.org et WordPress.com ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>WordPress.org fournit le logiciel à télécharger et à installer sur son propre hébergement (contrôle total). WordPress.com est un service commercial d&#39;Automattic qui héberge le site et gère la technique (clé en main, mais limité).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Sur WordPress.org, qui est responsable des mises à jour et de la sécurité ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p><strong>Toi.</strong> Sur WordPress.com, c&#39;est le service qui les gère.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Cite les trois prérequis pour utiliser WordPress et donne une phrase pour chacun.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Un <strong>nom de domaine</strong> (l&#39;adresse web, achetée chez un registraire), un <strong>serveur</strong> (ordinateur connecté en permanence qui stocke et diffuse le site), un <strong>hébergeur</strong> (entreprise qui loue de l&#39;espace pour héberger des sites).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Quel type de serveur choisir pour un site à très fort trafic variable, et lequel pour apprendre ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Relis le tableau des quatre types.</p>\n</div><div class=\"ex-c\" hidden><p>Trafic variable : <strong>hébergement cloud</strong> (évolutivité et flexibilité). Pour apprendre : <strong>serveur local</strong> (XAMPP, MAMP).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 11 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Que trouve-t-on sur WordPress.org ?</div><button class=\"opt\" data-o=\"0\">Un service d&#39;hébergement payant</button><button class=\"opt\" data-o=\"1\">Le logiciel WordPress à télécharger gratuitement</button><button class=\"opt\" data-o=\"2\">Une boutique de noms de domaine</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Qui gère le service WordPress.com ?</div><button class=\"opt\" data-o=\"0\">La fondation Apache</button><button class=\"opt\" data-o=\"1\">Automattic</button><button class=\"opt\" data-o=\"2\">Google</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Sur WordPress.com, qui s&#39;occupe de l&#39;hébergement, des mises à jour et des sauvegardes ?</div><button class=\"opt\" data-o=\"0\">L&#39;utilisateur</button><button class=\"opt\" data-o=\"1\">WordPress.com</button><button class=\"opt\" data-o=\"2\">Le registraire de domaine</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Quel est le type de plateforme de WordPress.org ?</div><button class=\"opt\" data-o=\"0\">Auto-hébergée</button><button class=\"opt\" data-o=\"1\">Hébergée par WordPress</button><button class=\"opt\" data-o=\"2\">Hébergée par le navigateur</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Sur quel point WordPress.com est-il plus limité que WordPress.org ?</div><button class=\"opt\" data-o=\"0\">La facilité d&#39;utilisation</button><button class=\"opt\" data-o=\"1\">La personnalisation, les extensions et la monétisation</button><button class=\"opt\" data-o=\"2\">La gestion des mises à jour</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">À qui le cours conseille-t-il WordPress.org ?</div><button class=\"opt\" data-o=\"0\">À ceux qui ne veulent rien gérer</button><button class=\"opt\" data-o=\"1\">À ceux qui ont des compétences techniques ou les ressources pour gérer la technique</button><button class=\"opt\" data-o=\"2\">Uniquement aux grandes entreprises</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Qu&#39;est-ce qu&#39;un nom de domaine ?</div><button class=\"opt\" data-o=\"0\">Un ordinateur connecté en permanence à Internet</button><button class=\"opt\" data-o=\"1\">L&#39;adresse web que l&#39;on saisit dans le navigateur pour accéder au site</button><button class=\"opt\" data-o=\"2\">Une entreprise qui loue de l&#39;espace disque</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Quel type de serveur le cours décrit-il comme « pas cher mais partagé » ?</div><button class=\"opt\" data-o=\"0\">Le serveur partagé</button><button class=\"opt\" data-o=\"1\">Le serveur dédié</button><button class=\"opt\" data-o=\"2\">L&#39;hébergement cloud</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Quel type de serveur convient pour les tests et la formation ?</div><button class=\"opt\" data-o=\"0\">Le serveur dédié</button><button class=\"opt\" data-o=\"1\">L&#39;hébergement cloud</button><button class=\"opt\" data-o=\"2\">Le serveur local</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Bluehost, SiteGround et HostGator sont des :</div><button class=\"opt\" data-o=\"0\">CMS propriétaires</button><button class=\"opt\" data-o=\"1\">hébergeurs</button><button class=\"opt\" data-o=\"2\">registraires de thèmes</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"org-com-prerequis","rep":null,"tol":null},{"n":"org-com-prerequis","rep":null,"tol":null},{"n":"org-com-prerequis","rep":null,"tol":null},{"n":"org-com-prerequis","rep":null,"tol":null},{"n":"org-com-prerequis","rep":null,"tol":null}],"qcm":[{"n":"org-com-prerequis","q":"Que trouve-t-on sur WordPress.org ?","o":["Un service d&#39;hébergement payant","Le logiciel WordPress à télécharger gratuitement","Une boutique de noms de domaine"],"a":1,"e":"On l&#39;installe ensuite sur l&#39;hébergement de son choix."},{"n":"org-com-prerequis","q":"Qui gère le service WordPress.com ?","o":["La fondation Apache","Automattic","Google"],"a":1,"e":"La société fondée par l&#39;un des co-créateurs de WordPress."},{"n":"org-com-prerequis","q":"Sur WordPress.com, qui s&#39;occupe de l&#39;hébergement, des mises à jour et des sauvegardes ?","o":["L&#39;utilisateur","WordPress.com","Le registraire de domaine"],"a":1,"e":"C&#39;est le principe de la solution clé en main. La diapo contient une coquille sur ce point."},{"n":"org-com-prerequis","q":"Quel est le type de plateforme de WordPress.org ?","o":["Auto-hébergée","Hébergée par WordPress","Hébergée par le navigateur"],"a":0,"e":"Tu trouves et tu paies ton propre hébergement."},{"n":"org-com-prerequis","q":"Sur quel point WordPress.com est-il plus limité que WordPress.org ?","o":["La facilité d&#39;utilisation","La personnalisation, les extensions et la monétisation","La gestion des mises à jour"],"a":1,"e":"Surtout dans les plans gratuits."},{"n":"org-com-prerequis","q":"À qui le cours conseille-t-il WordPress.org ?","o":["À ceux qui ne veulent rien gérer","À ceux qui ont des compétences techniques ou les ressources pour gérer la technique","Uniquement aux grandes entreprises"],"a":1,"e":"Plus de liberté et de contrôle, en échange de la gestion technique."},{"n":"org-com-prerequis","q":"Qu&#39;est-ce qu&#39;un nom de domaine ?","o":["Un ordinateur connecté en permanence à Internet","L&#39;adresse web que l&#39;on saisit dans le navigateur pour accéder au site","Une entreprise qui loue de l&#39;espace disque"],"a":1,"e":"Exemple : monsite.com. Il s&#39;achète auprès d&#39;un registraire."},{"n":"org-com-prerequis","q":"Quel type de serveur le cours décrit-il comme « pas cher mais partagé » ?","o":["Le serveur partagé","Le serveur dédié","L&#39;hébergement cloud"],"a":0,"e":"Le dédié apporte puissance et contrôle, mais coûte plus cher."},{"n":"org-com-prerequis","q":"Quel type de serveur convient pour les tests et la formation ?","o":["Le serveur dédié","L&#39;hébergement cloud","Le serveur local"],"a":2,"e":"Exemples : MAMP, XAMPP."},{"n":"org-com-prerequis","q":"Bluehost, SiteGround et HostGator sont des :","o":["CMS propriétaires","hébergeurs","registraires de thèmes"],"a":1,"e":"Des entreprises qui louent de l&#39;espace pour héberger des sites web."}]},{"id":"installation-xampp","t":"Installer WordPress en local avec XAMPP","seance":"Partie 1 · WordPress · Installation","imp":5,"html":"<h2>Avant de commencer</h2>\n<p>Tu dois connaître les trois prérequis de WordPress (nom de domaine, serveur, hébergeur) et savoir qu&#39;un <strong>serveur local</strong> sert aux tests et à la formation (chapitre 5).</p>\n<section class=\"exo\"><h3>Vérifie ton prérequis</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>WordPress a besoin de deux « moteurs » sur le serveur pour fonctionner. Lesquels ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Un langage et une base de données.</p>\n</div><div class=\"ex-c\" hidden><p><strong>PHP</strong> (le langage dans lequel WordPress est écrit) et <strong>MySQL</strong> (la base de données). XAMPP installe les deux d&#39;un coup, avec le serveur web Apache.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Comment aborder ce chapitre</h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p><strong>Pense « trois briques à relier ».</strong> Un serveur (XAMPP), une base de données vide, les fichiers de WordPress. L&#39;installation consiste à poser les trois, puis à dire à WordPress où se trouve la base. Tout le reste est du clic.</p>\n</aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>L&#39;erreur numéro un en TP : ouvrir <code>http://localhost/wordpress</code> <strong>sans avoir démarré Apache et MySQL</strong> dans le panneau XAMPP. Rien ne s&#39;affiche, et on croit que l&#39;installation est cassée.</p>\n</aside><p>À la fin, tu sais dérouler les 9 étapes dans l&#39;ordre et expliquer les quatre lignes de <code>wp-config.php</code>.</p>\n<h2>Idée 1 · XAMPP, cinq lettres à connaître</h2>\n<p>XAMPP est un <strong>ensemble de logiciels libres</strong> qui permet de mettre en place facilement un <strong>serveur web local</strong>. C&#39;est une solution multiplateforme, flexible et riche en fonctionnalités.</p>\n<figure class=\"grille\"><figcaption>XAMPP, lettre par lettre</figcaption><table><tr><th>X</th><th>A</th><th>M</th><th>P</th><th>P</th></tr><tr><td class=\"h1\">Cross-platform</td><td>Apache</td><td class=\"h2\">MariaDB</td><td>PHP</td><td>Perl</td></tr></table></figure><table>\n<thead>\n<tr>\n<th>Lettre</th>\n<th>Signifie</th>\n<th>Rôle</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>X</strong></td>\n<td>Cross-platform</td>\n<td>Fonctionne sur Windows, Linux et macOS</td>\n</tr>\n<tr>\n<td><strong>A</strong></td>\n<td>Apache</td>\n<td>Le serveur web</td>\n</tr>\n<tr>\n<td><strong>M</strong></td>\n<td>MariaDB</td>\n<td>Le SGBD (auparavant, c&#39;était MySQL)</td>\n</tr>\n<tr>\n<td><strong>P</strong></td>\n<td>PHP</td>\n<td>Le langage de script côté serveur</td>\n</tr>\n<tr>\n<td><strong>P</strong></td>\n<td>Perl</td>\n<td>Un autre langage de script</td>\n</tr>\n</tbody></table>\n<aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>Le <strong>X</strong> ne désigne pas un logiciel : il veut dire « cross-platform ». Et le <strong>M</strong> est aujourd&#39;hui <strong>MariaDB</strong>, même si le bouton du panneau XAMPP s&#39;appelle encore « MySQL ».</p>\n</aside><h2>Idée 2 · Les 9 étapes, regroupées en trois blocs</h2>\n<figure class=\"flux\"><figcaption>Les trois blocs de l'installation</figcaption><div class=\"flux-l\"><div class=\"flux-b\">Préparer le serveur (étapes 1 à 3)</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Poser WordPress (étapes 4 à 6)</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Lancer l&#39;installateur (étapes 7 à 9)</div></div></figure><figure class=\"etapes\" data-i=\"0\"><figcaption>Les 9 étapes du cours</figcaption><div class=\"etape\"><div class=\"et-t\">1/9 · 1. Télécharger et installer XAMPP</div><p>Sur le site <strong>Apache Friends</strong>, télécharge la version qui correspond à ton système d&#39;exploitation, puis installe-la.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/9 · 2. Démarrer Apache et MySQL</div><p>Ouvre le <strong>panneau de contrôle XAMPP</strong> et clique sur <strong>Start</strong> à côté des modules Apache et MySQL.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/9 · 3. Créer une base de données</div><p>Dans le navigateur, va sur <code>http://localhost/phpmyadmin</code>. Clique sur <strong>Bases de données</strong>, puis crée une base (par exemple <code>wordpress_votrenom</code>).</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">4/9 · 4. Télécharger WordPress</div><p>Sur <strong>WordPress.org</strong>, télécharge la dernière version et décompresse le fichier.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">5/9 · 5. Déplacer les fichiers vers XAMPP</div><p>Copie le dossier décompressé dans le répertoire <strong>htdocs</strong> (<code>C:\\xampp\\htdocs</code> sur Windows, <code>/Applications/XAMPP/htdocs</code> sur Mac). Renomme-le comme tu veux (par exemple <code>wordpress</code>).</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">6/9 · 6. Configurer wp-config.php</div><p>Renomme <code>wp-config-sample.php</code> en <code>wp-config.php</code>, ouvre-le et renseigne les informations de ta base de données.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">7/9 · 7. Lancer l&#39;installation</div><p>Va sur <code>http://localhost/nom_du_dossier</code> (par exemple <code>http://localhost/wordpress</code>). Choisis la langue et clique sur <strong>Continuer</strong>.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">8/9 · 8. Configurer les informations du site</div><p>Remplis le titre du site, le nom d&#39;utilisateur, le mot de passe et l&#39;adresse e-mail. Clique sur <strong>Installer WordPress</strong>.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">9/9 · 9. Finaliser</div><p>Un message de succès s&#39;affiche. Clique sur <strong>Se connecter</strong> et entre le nom d&#39;utilisateur et le mot de passe que tu viens de créer.</p>\n</div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p>Trois adresses à connaître : <code>http://localhost/phpmyadmin</code> (gérer les bases), <code>C:\\xampp\\htdocs</code> (le dossier des sites), <code>http://localhost/wordpress</code> (ton site).</p>\n</aside><h2>Idée 3 · wp-config.php relie WordPress à sa base</h2>\n<svg viewBox=\"0 0 360 100\" style=\"width:100%;max-width:460px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Le fichier wp-config.php fait le lien entre les fichiers WordPress et la base de données\">\n<g font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"8\" y=\"26\" width=\"104\" height=\"48\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"60\" y=\"47\">Fichiers WordPress</text><text x=\"60\" y=\"63\" font-size=\"10\">dans htdocs</text>\n<rect x=\"128\" y=\"20\" width=\"104\" height=\"60\" rx=\"8\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/><text x=\"180\" y=\"44\" fill=\"#D9824F\" font-weight=\"700\">wp-config.php</text><text x=\"180\" y=\"60\" font-size=\"10\">nom, utilisateur,</text><text x=\"180\" y=\"72\" font-size=\"10\">mot de passe, hôte</text>\n<rect x=\"248\" y=\"26\" width=\"104\" height=\"48\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"300\" y=\"47\">Base de données</text><text x=\"300\" y=\"63\" font-size=\"10\">dans phpMyAdmin</text>\n</g>\n<path d=\"M112 50h16M232 50h16\" stroke=\"currentColor\" stroke-width=\"2\"/>\n</svg><p>Les quatre lignes à modifier, telles que le cours les montre :</p>\n<pre class=\"\"><code>define('DB_NAME', 'nom_de_votre_base_de_données'); // Nom de la base de données créée\ndefine('DB_USER', 'root');       // Utilisateur de la base, par défaut 'root'\ndefine('DB_PASSWORD', '');       // Mot de passe, par défaut vide\ndefine('DB_HOST', 'localhost');  // Hôte de la base, généralement 'localhost'</code></pre><table>\n<thead>\n<tr>\n<th>Constante</th>\n<th>Valeur en local avec XAMPP</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>DB_NAME</code></td>\n<td>Le nom de la base créée à l&#39;étape 3 (ex. <code>wordpress_votrenom</code>)</td>\n</tr>\n<tr>\n<td><code>DB_USER</code></td>\n<td><code>root</code></td>\n</tr>\n<tr>\n<td><code>DB_PASSWORD</code></td>\n<td>vide</td>\n</tr>\n<tr>\n<td><code>DB_HOST</code></td>\n<td><code>localhost</code></td>\n</tr>\n</tbody></table>\n<aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p><code>DB_NAME</code> doit être <strong>exactement</strong> le nom de la base créée dans phpMyAdmin. Une lettre de différence, et WordPress affiche « Erreur lors de la connexion à la base de données ».</p>\n</aside><aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p><code>root</code> sans mot de passe est acceptable <strong>seulement en local</strong>. Sur un vrai hébergement, l&#39;hébergeur te fournit un utilisateur et un mot de passe : c&#39;est une précision de ToumaiLearn, le cours ne traite que du cas local.</p>\n</aside><p>Une fois l&#39;installation finie, le site est prêt : tu peux le personnaliser, ajouter des thèmes et des plugins, et créer du contenu.</p>\n<h2>S&#39;exercer</h2>\n<section class=\"exo\"><h3>Questions types</h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Que signifient les cinq lettres de XAMPP ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>X : cross-platform (Windows, Linux, macOS). A : Apache (serveur web). M : MariaDB (SGBD, auparavant MySQL). P : PHP (langage de script côté serveur). P : Perl (autre langage de script).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Remets ces actions dans l&#39;ordre : configurer wp-config.php, créer la base de données, démarrer Apache et MySQL, copier WordPress dans htdocs.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><ol>\n<li>Démarrer Apache et MySQL. 2) Créer la base de données (phpMyAdmin). 3) Copier WordPress dans htdocs. 4) Configurer wp-config.php.</li>\n</ol>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Tu as créé une base <code>wordpress_patrick</code>. Écris les valeurs de DB_NAME, DB_USER, DB_PASSWORD et DB_HOST pour une installation XAMPP.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>DB_NAME : <code>wordpress_patrick</code>. DB_USER : <code>root</code>. DB_PASSWORD : vide. DB_HOST : <code>localhost</code>.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Ton dossier dans htdocs s&#39;appelle <code>monblog</code>. Quelle adresse ouvres-tu pour lancer l&#39;installation ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p><code>http://localhost/monblog</code></p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 11 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Dans XAMPP, que signifie la lettre X ?</div><button class=\"opt\" data-o=\"0\">XML</button><button class=\"opt\" data-o=\"1\">Cross-platform</button><button class=\"opt\" data-o=\"2\">Xdebug</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Dans XAMPP, la lettre A désigne :</div><button class=\"opt\" data-o=\"0\">Apache, le serveur web</button><button class=\"opt\" data-o=\"1\">Automattic</button><button class=\"opt\" data-o=\"2\">Administration</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Aujourd&#39;hui, la lettre M de XAMPP désigne :</div><button class=\"opt\" data-o=\"0\">MongoDB</button><button class=\"opt\" data-o=\"1\">Mamp</button><button class=\"opt\" data-o=\"2\">MariaDB</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Quels modules faut-il démarrer dans le panneau de contrôle XAMPP ?</div><button class=\"opt\" data-o=\"0\">PHP et Perl</button><button class=\"opt\" data-o=\"1\">Apache et MySQL</button><button class=\"opt\" data-o=\"2\">FileZilla et Tomcat</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">À quelle adresse crée-t-on la base de données ?</div><button class=\"opt\" data-o=\"0\"><a href=\"http://localhost/wordpress\">http://localhost/wordpress</a></button><button class=\"opt\" data-o=\"1\"><a href=\"http://localhost/phpmyadmin\">http://localhost/phpmyadmin</a></button><button class=\"opt\" data-o=\"2\"><a href=\"http://wordpress.org/database\">http://wordpress.org/database</a></button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Dans quel répertoire de XAMPP colle-t-on le dossier WordPress ?</div><button class=\"opt\" data-o=\"0\">php</button><button class=\"opt\" data-o=\"1\">mysql</button><button class=\"opt\" data-o=\"2\">htdocs</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Quel fichier faut-il renommer en <code>wp-config.php</code> ?</div><button class=\"opt\" data-o=\"0\">wp-config-sample.php</button><button class=\"opt\" data-o=\"1\">wp-settings.php</button><button class=\"opt\" data-o=\"2\">index.php</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">En local avec XAMPP, quelle est la valeur par défaut de DB_USER ?</div><button class=\"opt\" data-o=\"0\">admin</button><button class=\"opt\" data-o=\"1\">root</button><button class=\"opt\" data-o=\"2\">wordpress</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">En local, quelle est la valeur habituelle de DB_HOST ?</div><button class=\"opt\" data-o=\"0\">127.0.0.2</button><button class=\"opt\" data-o=\"1\">xampp</button><button class=\"opt\" data-o=\"2\">localhost</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Laquelle de ces informations n&#39;est PAS demandée lors de la configuration du site (étape 8) ?</div><button class=\"opt\" data-o=\"0\">Le titre du site</button><button class=\"opt\" data-o=\"1\">L&#39;adresse e-mail</button><button class=\"opt\" data-o=\"2\">Le nom de la base de données</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"installation-xampp","rep":null,"tol":null},{"n":"installation-xampp","rep":null,"tol":null},{"n":"installation-xampp","rep":null,"tol":null},{"n":"installation-xampp","rep":null,"tol":null},{"n":"installation-xampp","rep":null,"tol":null}],"qcm":[{"n":"installation-xampp","q":"Dans XAMPP, que signifie la lettre X ?","o":["XML","Cross-platform","Xdebug"],"a":1,"e":"XAMPP fonctionne sur Windows, Linux et macOS."},{"n":"installation-xampp","q":"Dans XAMPP, la lettre A désigne :","o":["Apache, le serveur web","Automattic","Administration"],"a":0,"e":"Apache sert les pages au navigateur."},{"n":"installation-xampp","q":"Aujourd&#39;hui, la lettre M de XAMPP désigne :","o":["MongoDB","Mamp","MariaDB"],"a":2,"e":"Auparavant, c&#39;était MySQL."},{"n":"installation-xampp","q":"Quels modules faut-il démarrer dans le panneau de contrôle XAMPP ?","o":["PHP et Perl","Apache et MySQL","FileZilla et Tomcat"],"a":1,"e":"Sans eux, <code>http://localhost</code> ne répond pas."},{"n":"installation-xampp","q":"À quelle adresse crée-t-on la base de données ?","o":["<a href=\"http://localhost/wordpress\">http://localhost/wordpress</a>","<a href=\"http://localhost/phpmyadmin\">http://localhost/phpmyadmin</a>","<a href=\"http://wordpress.org/database\">http://wordpress.org/database</a>"],"a":1,"e":"Puis on clique sur « Bases de données »."},{"n":"installation-xampp","q":"Dans quel répertoire de XAMPP colle-t-on le dossier WordPress ?","o":["php","mysql","htdocs"],"a":2,"e":"<code>C:\\xampp\\htdocs</code> sur Windows."},{"n":"installation-xampp","q":"Quel fichier faut-il renommer en <code>wp-config.php</code> ?","o":["wp-config-sample.php","wp-settings.php","index.php"],"a":0,"e":"On l&#39;ouvre ensuite pour y mettre les informations de la base."},{"n":"installation-xampp","q":"En local avec XAMPP, quelle est la valeur par défaut de DB_USER ?","o":["admin","root","wordpress"],"a":1,"e":"Et le mot de passe par défaut est vide."},{"n":"installation-xampp","q":"En local, quelle est la valeur habituelle de DB_HOST ?","o":["127.0.0.2","xampp","localhost"],"a":2,"e":"La base de données tourne sur la même machine que le site."},{"n":"installation-xampp","q":"Laquelle de ces informations n&#39;est PAS demandée lors de la configuration du site (étape 8) ?","o":["Le titre du site","L&#39;adresse e-mail","Le nom de la base de données"],"a":2,"e":"Le nom de la base est donné avant, dans wp-config.php. L&#39;étape 8 demande titre, nom d&#39;utilisateur, mot de passe et e-mail."}]},{"id":"tableau-de-bord","t":"Le tableau de bord de WordPress, menu par menu","seance":"Partie 1 · WordPress · Dashboard","imp":5,"html":"<h2>Avant de commencer</h2>\n<p>Tu dois avoir un WordPress installé (chapitre 6) et savoir que le contenu et la forme sont séparés (chapitre 1).</p>\n<section class=\"exo\"><h3>Vérifie ton prérequis</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Dans WordPress, qu&#39;est-ce qui change l&#39;apparence du site, et qu&#39;est-ce qui lui ajoute des fonctions ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Les <strong>thèmes</strong> changent l&#39;apparence. Les <strong>extensions</strong> (plugins) ajoutent des fonctions. Ces deux mots correspondent à deux menus du tableau de bord.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Comment aborder ce chapitre</h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p><strong>Classe les menus en trois familles.</strong> Ce que j&#39;écris (Articles, Médias, Pages, Commentaires). Ce que je règle sur le site (Apparence, Extensions). Ce que j&#39;administre (Comptes, Outils, Réglages). Dix menus, trois tiroirs.</p>\n</aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p><strong>Article et page ne sont pas la même chose</strong>, et <strong>catégorie et étiquette non plus</strong>. Ce sont les deux confusions classiques de l&#39;examen.</p>\n</aside><p>À la fin, tu sais dire dans quel menu se fait n&#39;importe quelle action, et citer les sous-menus importants.</p>\n<h2>Idée 1 · Dix menus, trois familles</h2>\n<figure class=\"grille\"><figcaption>Les menus du tableau de bord</figcaption><table><tr><th>Contenu</th><th>Site</th><th>Administration</th></tr><tr><td class=\"h1\">Articles</td><td class=\"h2\">Apparence</td><td>Comptes</td></tr><tr><td class=\"h1\">Médias</td><td class=\"h2\">Extensions</td><td>Outils</td></tr><tr><td class=\"h1\">Pages</td><td class=\"h0\"></td><td>Réglages</td></tr><tr><td class=\"h1\">Commentaires</td><td class=\"h0\"></td><td class=\"h0\"></td></tr></table></figure><p>Tout en haut, le menu <strong>Tableau de bord</strong> lui-même contient deux entrées : <strong>Accueil</strong> et <strong>Mises à jour</strong>.</p>\n<table>\n<thead>\n<tr>\n<th>Dans Accueil</th>\n<th>Rôle</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Vue d&#39;ensemble</strong></td>\n<td>Statistiques globales du site : nombre d&#39;articles, de pages, de commentaires</td>\n</tr>\n<tr>\n<td><strong>Activité</strong></td>\n<td>Derniers articles, commentaires et autres activités récentes</td>\n</tr>\n<tr>\n<td><strong>Brouillon rapide</strong></td>\n<td>Créer rapidement un brouillon d&#39;article</td>\n</tr>\n<tr>\n<td><strong>État de santé du site</strong></td>\n<td>Informe sur les performances et les aspects techniques à améliorer</td>\n</tr>\n</tbody></table>\n<p><strong>Mises à jour</strong> : vérifie les mises à jour disponibles pour WordPress, les thèmes et les plugins.</p>\n<h2>Idée 2 · La famille « contenu »</h2>\n<p><strong>Articles (Posts)</strong></p>\n<table>\n<thead>\n<tr>\n<th>Sous-menu</th>\n<th>Rôle</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Tous les articles</td>\n<td>Liste les articles : les éditer, les supprimer, changer leur statut</td>\n</tr>\n<tr>\n<td>Ajouter</td>\n<td>Créer un article avec l&#39;éditeur <strong>Gutenberg</strong></td>\n</tr>\n<tr>\n<td><strong>Catégories</strong></td>\n<td>Classer les articles en <strong>groupes</strong></td>\n</tr>\n<tr>\n<td><strong>Étiquettes</strong></td>\n<td><strong>Mots-clés</strong> qui décrivent les articles en détail</td>\n</tr>\n</tbody></table>\n<svg viewBox=\"0 0 360 110\" style=\"width:100%;max-width:460px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Une catégorie range l'article dans un groupe, les étiquettes sont des mots-clés accrochés à l'article\">\n<g font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"8\" y=\"14\" width=\"150\" height=\"86\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"83\" y=\"30\" font-weight=\"700\">Catégorie : Sport</text>\n<rect x=\"28\" y=\"42\" width=\"110\" height=\"44\" rx=\"6\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/><text x=\"83\" y=\"62\" fill=\"#D9824F\" font-weight=\"700\">Article</text><text x=\"83\" y=\"77\" font-size=\"10\">Finale de la CAN</text>\n<rect x=\"200\" y=\"18\" width=\"70\" height=\"22\" rx=\"11\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"235\" y=\"33\">football</text>\n<rect x=\"278\" y=\"48\" width=\"70\" height=\"22\" rx=\"11\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"313\" y=\"63\">Maroc</text>\n<rect x=\"200\" y=\"78\" width=\"70\" height=\"22\" rx=\"11\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"235\" y=\"93\">CAN</text>\n</g>\n<path d=\"M138 56L200 30M138 64L278 60M138 72L200 88\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/>\n</svg><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p><strong>Catégorie = le groupe</strong> où l&#39;on range l&#39;article (un rayon de bibliothèque). <strong>Étiquette = un mot-clé</strong> qui le décrit en détail (un post-it collé dessus).</p>\n</aside><p><strong>Médias (Media)</strong></p>\n<ul>\n<li><strong>Médiathèque</strong> : affiche tous les fichiers multimédias téléchargés ; on peut les trier, les modifier, les supprimer.</li>\n<li><strong>Ajouter</strong> : téléverser de nouveaux fichiers.</li>\n</ul>\n<p><strong>Pages</strong></p>\n<ul>\n<li><strong>Toutes les pages</strong> : liste, édition, suppression, changement de statut.</li>\n<li><strong>Ajouter</strong> : créer une nouvelle page.</li>\n</ul>\n<p><strong>Commentaires</strong></p>\n<ul>\n<li>Liste tous les commentaires du site : on peut les <strong>approuver</strong>, y <strong>répondre</strong>, les <strong>modifier</strong>, les <strong>supprimer</strong>.</li>\n</ul>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>Le cours liste les menus Articles et Pages sans expliquer leur différence. En pratique (précision de ToumaiLearn) : un <strong>article</strong> est un contenu daté, classé par catégories et étiquettes (actualités, blog). Une <strong>page</strong> est un contenu fixe, sans catégorie (« À propos », « Contact »).</p>\n</aside><h2>Idée 3 · La famille « site » : Apparence et Extensions</h2>\n<table>\n<thead>\n<tr>\n<th>Menu</th>\n<th>Sous-menu</th>\n<th>Rôle</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Apparence</strong></td>\n<td>Thèmes</td>\n<td>Gérer les thèmes installés : en ajouter, en activer, en supprimer</td>\n</tr>\n<tr>\n<td></td>\n<td>Éditeur de fichier de thème</td>\n<td>Modifier directement les fichiers du thème (<strong>à utiliser avec précaution</strong>)</td>\n</tr>\n<tr>\n<td><strong>Extensions</strong></td>\n<td>Extensions installées</td>\n<td>Lister les plugins : les activer, les désactiver, les supprimer</td>\n</tr>\n<tr>\n<td></td>\n<td>Ajouter</td>\n<td>Ajouter de nouveaux plugins</td>\n</tr>\n</tbody></table>\n<aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>Les éditeurs de fichiers (thème et extension) modifient le code <strong>directement sur le site</strong>. Une erreur de PHP peut rendre le site inaccessible. D&#39;où le « à utiliser avec précaution » du cours.</p>\n</aside><h2>Idée 4 · La famille « administration » : Comptes, Outils, Réglages</h2>\n<p><strong>Comptes</strong></p>\n<ul>\n<li><strong>Tous les comptes</strong> : liste des utilisateurs enregistrés, à éditer ou supprimer.</li>\n<li><strong>Ajouter</strong> : créer un nouvel utilisateur.</li>\n<li><strong>Votre profil</strong> : modifier son propre profil (nom, mot de passe, biographie).</li>\n</ul>\n<p><strong>Outils</strong></p>\n<ul>\n<li><strong>Outils disponibles</strong> : des outils pour importer et exporter du contenu.</li>\n<li><strong>Importer</strong> : importer du contenu depuis d&#39;autres plateformes (Blogger, Tumblr).</li>\n<li><strong>Exporter</strong> : exporter le contenu du site (articles, pages).</li>\n<li><strong>Éditeur de fichier d&#39;extension</strong> : modifier directement les fichiers des plugins (avec précaution).</li>\n</ul>\n<p><strong>Réglages</strong>, les six sous-menus :</p>\n<table>\n<thead>\n<tr>\n<th>Sous-menu</th>\n<th>Ce qu&#39;on y règle</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Général</strong></td>\n<td>Titre, description, adresse e-mail, fuseau horaire</td>\n</tr>\n<tr>\n<td><strong>Écriture</strong></td>\n<td>Rédaction des articles : catégorie par défaut, format par défaut</td>\n</tr>\n<tr>\n<td><strong>Lecture</strong></td>\n<td>Affichage du site : page d&#39;accueil, nombre d&#39;articles par page</td>\n</tr>\n<tr>\n<td><strong>Commentaires</strong></td>\n<td>Modération, notifications, avatars</td>\n</tr>\n<tr>\n<td><strong>Médias</strong></td>\n<td>Tailles des images téléversées</td>\n</tr>\n<tr>\n<td><strong>Permaliens</strong></td>\n<td>Structure des <strong>URL</strong> du site</td>\n</tr>\n</tbody></table>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>« Où est-ce que je clique ? » : la méthode</figcaption><div class=\"etape\"><div class=\"et-t\">1/7 · Je veux changer le titre du site</div><p>C&#39;est une information de base : <strong>Réglages, Général</strong>.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/7 · Je veux que la page d&#39;accueil soit une page fixe</div><p>C&#39;est de l&#39;affichage : <strong>Réglages, Lecture</strong>.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/7 · Je veux des adresses du type monsite.com/mon-article</div><p>C&#39;est la structure des URL : <strong>Réglages, Permaliens</strong>.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">4/7 · Je veux récupérer les articles d&#39;un ancien blog Blogger</div><p><strong>Outils, Importer</strong>.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">5/7 · Je veux donner un accès à un collègue</div><p><strong>Comptes, Ajouter</strong>.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">6/7 · Je veux un nouveau look</div><p><strong>Apparence, Thèmes</strong>.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">7/7 · Je veux un formulaire de contact</div><p>C&#39;est une nouvelle fonction : <strong>Extensions, Ajouter</strong>.</p>\n</div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><h2>S&#39;exercer</h2>\n<section class=\"exo\"><h3>Où se trouve...</h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Dans quel menu approuve-t-on ou supprime-t-on les réactions des visiteurs ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Dans <strong>Commentaires</strong>.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Quelle est la différence entre une catégorie et une étiquette ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Les <strong>catégories</strong> classent les articles en groupes. Les <strong>étiquettes</strong> sont des mots-clés qui décrivent les articles en détail.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Cite les six sous-menus de Réglages.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>G, É, L, C, M, P.</p>\n</div><div class=\"ex-c\" hidden><p>Général, Écriture, Lecture, Commentaires, Médias, Permaliens.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Tu veux changer le nombre d&#39;articles affichés par page. Où vas-tu ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p><strong>Réglages, Lecture</strong>.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>Que contient la zone « État de santé du site » de l&#39;accueil ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Des informations sur les performances du site et les aspects techniques à améliorer.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 14 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quel menu permet de classer les articles en groupes ?</div><button class=\"opt\" data-o=\"0\">Étiquettes</button><button class=\"opt\" data-o=\"1\">Catégories</button><button class=\"opt\" data-o=\"2\">Permaliens</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Les étiquettes (tags) sont :</div><button class=\"opt\" data-o=\"0\">des mots-clés qui décrivent les articles en détail</button><button class=\"opt\" data-o=\"1\">des groupes d&#39;utilisateurs</button><button class=\"opt\" data-o=\"2\">des tailles d&#39;images</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Où règle-t-on la structure des URL du site ?</div><button class=\"opt\" data-o=\"0\">Réglages, Général</button><button class=\"opt\" data-o=\"1\">Réglages, Lecture</button><button class=\"opt\" data-o=\"2\">Réglages, Permaliens</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Où change-t-on le titre et le fuseau horaire du site ?</div><button class=\"opt\" data-o=\"0\">Réglages, Général</button><button class=\"opt\" data-o=\"1\">Réglages, Écriture</button><button class=\"opt\" data-o=\"2\">Apparence, Thèmes</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Où définit-on la page d&#39;accueil et le nombre d&#39;articles par page ?</div><button class=\"opt\" data-o=\"0\">Réglages, Médias</button><button class=\"opt\" data-o=\"1\">Réglages, Lecture</button><button class=\"opt\" data-o=\"2\">Pages, Toutes les pages</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Dans quel menu active-t-on ou désactive-t-on un plugin ?</div><button class=\"opt\" data-o=\"0\">Apparence</button><button class=\"opt\" data-o=\"1\">Outils</button><button class=\"opt\" data-o=\"2\">Extensions</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Quel menu sert à importer du contenu depuis Blogger ou Tumblr ?</div><button class=\"opt\" data-o=\"0\">Outils</button><button class=\"opt\" data-o=\"1\">Médias</button><button class=\"opt\" data-o=\"2\">Comptes</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Laquelle de ces zones ne fait PAS partie de l&#39;accueil du tableau de bord ?</div><button class=\"opt\" data-o=\"0\">Brouillon rapide</button><button class=\"opt\" data-o=\"1\">État de santé du site</button><button class=\"opt\" data-o=\"2\">Éditeur de fichier de thème</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Pourquoi les éditeurs de fichiers de thème et d&#39;extension sont-ils « à utiliser avec précaution » ?</div><button class=\"opt\" data-o=\"0\">Ils sont payants</button><button class=\"opt\" data-o=\"1\">Ils modifient directement les fichiers du site</button><button class=\"opt\" data-o=\"2\">Ils suppriment les commentaires</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Où modifie-t-on son propre mot de passe ?</div><button class=\"opt\" data-o=\"0\">Réglages, Général</button><button class=\"opt\" data-o=\"1\">Comptes, Votre profil</button><button class=\"opt\" data-o=\"2\">Outils, Outils disponibles</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"10\"><div class=\"qq-q\">Que règle-t-on dans Réglages, Médias ?</div><button class=\"opt\" data-o=\"0\">Les droits des utilisateurs</button><button class=\"opt\" data-o=\"1\">Les tailles des images téléversées</button><button class=\"opt\" data-o=\"2\">La modération des commentaires</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"tableau-de-bord","rep":null,"tol":null},{"n":"tableau-de-bord","rep":null,"tol":null},{"n":"tableau-de-bord","rep":null,"tol":null},{"n":"tableau-de-bord","rep":null,"tol":null},{"n":"tableau-de-bord","rep":null,"tol":null},{"n":"tableau-de-bord","rep":null,"tol":null}],"qcm":[{"n":"tableau-de-bord","q":"Quel menu permet de classer les articles en groupes ?","o":["Étiquettes","Catégories","Permaliens"],"a":1,"e":"Les étiquettes, elles, sont des mots-clés qui décrivent les articles en détail."},{"n":"tableau-de-bord","q":"Les étiquettes (tags) sont :","o":["des mots-clés qui décrivent les articles en détail","des groupes d&#39;utilisateurs","des tailles d&#39;images"],"a":0,"e":"Catégorie = groupe ; étiquette = mot-clé."},{"n":"tableau-de-bord","q":"Où règle-t-on la structure des URL du site ?","o":["Réglages, Général","Réglages, Lecture","Réglages, Permaliens"],"a":2,"e":"Permalien = lien permanent, donc l&#39;adresse de chaque contenu."},{"n":"tableau-de-bord","q":"Où change-t-on le titre et le fuseau horaire du site ?","o":["Réglages, Général","Réglages, Écriture","Apparence, Thèmes"],"a":0,"e":"Général regroupe les paramètres de base : titre, description, e-mail, fuseau horaire."},{"n":"tableau-de-bord","q":"Où définit-on la page d&#39;accueil et le nombre d&#39;articles par page ?","o":["Réglages, Médias","Réglages, Lecture","Pages, Toutes les pages"],"a":1,"e":"« Lecture » concerne l&#39;affichage du site."},{"n":"tableau-de-bord","q":"Dans quel menu active-t-on ou désactive-t-on un plugin ?","o":["Apparence","Outils","Extensions"],"a":2,"e":"Extensions installées : activer, désactiver, supprimer."},{"n":"tableau-de-bord","q":"Quel menu sert à importer du contenu depuis Blogger ou Tumblr ?","o":["Outils","Médias","Comptes"],"a":0,"e":"Outils, Importer. L&#39;export se fait au même endroit."},{"n":"tableau-de-bord","q":"Laquelle de ces zones ne fait PAS partie de l&#39;accueil du tableau de bord ?","o":["Brouillon rapide","État de santé du site","Éditeur de fichier de thème"],"a":2,"e":"L&#39;éditeur de fichier de thème est dans le menu Apparence."},{"n":"tableau-de-bord","q":"Pourquoi les éditeurs de fichiers de thème et d&#39;extension sont-ils « à utiliser avec précaution » ?","o":["Ils sont payants","Ils modifient directement les fichiers du site","Ils suppriment les commentaires"],"a":1,"e":"Une erreur dans le code peut casser le site."},{"n":"tableau-de-bord","q":"Où modifie-t-on son propre mot de passe ?","o":["Réglages, Général","Comptes, Votre profil","Outils, Outils disponibles"],"a":1,"e":"Votre profil : nom, mot de passe, biographie."},{"n":"tableau-de-bord","q":"Que règle-t-on dans Réglages, Médias ?","o":["Les droits des utilisateurs","Les tailles des images téléversées","La modération des commentaires"],"a":1,"e":"La modération des commentaires se règle dans Réglages, Commentaires."}]},{"id":"securite-ssl","t":"Sécuriser WordPress avec SSL (HTTPS)","seance":"Partie 1 · WordPress · Sécurité","imp":4,"html":"<h2>Avant de commencer</h2>\n<p>Tu dois savoir la différence entre <strong>HTTP</strong> et <strong>HTTPS</strong> : en HTTPS, les échanges entre le navigateur et le serveur sont chiffrés.</p>\n<section class=\"exo\"><h3>Vérifie ton prérequis</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Tu tapes ton mot de passe sur un site en <code>http://</code>. Quelqu&#39;un sur le même Wi-Fi peut-il le lire ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Oui : en HTTP, les données circulent <strong>en clair</strong>. En HTTPS, elles sont chiffrées grâce à un certificat. C&#39;est ce que tu as vu en Réseaux et en Cryptographie, et c&#39;est l&#39;objet de ce chapitre.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Comment aborder ce chapitre</h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p><strong>Pense « un cadenas à poser en quatre gestes ».</strong> Obtenir le certificat, dire à WordPress d&#39;utiliser https, chasser ce qui reste en http, tester. Quatre étapes, toujours dans cet ordre.</p>\n</aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>Installer le certificat ne suffit pas. Si une seule image de la page est encore appelée en <code>http://</code>, le navigateur affiche un avertissement de <strong>contenu mixte</strong>. C&#39;est pour ça que l&#39;étape 3 existe.</p>\n</aside><p>À la fin, tu sais dérouler les quatre étapes, citer les outils et expliquer ce qu&#39;est un certificat auto-signé.</p>\n<h2>Idée 1 · Le certificat, la pièce d&#39;identité du site</h2>\n<svg viewBox=\"0 0 360 100\" style=\"width:100%;max-width:460px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Le navigateur et le serveur échangent en HTTPS, chiffré grâce au certificat SSL\">\n<g font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"8\" y=\"28\" width=\"96\" height=\"44\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"56\" y=\"54\">Navigateur</text>\n<rect x=\"256\" y=\"28\" width=\"96\" height=\"44\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"304\" y=\"48\">Serveur</text><text x=\"304\" y=\"63\" font-size=\"10\">+ certificat SSL</text>\n<text x=\"180\" y=\"38\" fill=\"#D9824F\" font-weight=\"700\">HTTPS : chiffré</text>\n</g>\n<path d=\"M106 50h148\" stroke=\"#D9824F\" stroke-width=\"3\"/>\n<rect x=\"170\" y=\"52\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#D9824F\"/><path d=\"M174 52v-5a6 6 0 0112 0v5\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2.5\"/>\n</svg><p>SSL veut dire <strong>Secure Sockets Layer</strong>. Un <strong>certificat SSL</strong> permet au site d&#39;être servi en <strong>HTTPS</strong>.</p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>Précision de ToumaiLearn : le protocole réellement utilisé aujourd&#39;hui s&#39;appelle <strong>TLS</strong>, le successeur de SSL. Tout le monde continue de dire « certificat SSL », le prof aussi. En examen, emploie le vocabulaire du cours : <strong>SSL</strong>.</p>\n</aside><h2>Idée 2 · Les quatre étapes pour passer en HTTPS</h2>\n<figure class=\"flux\"><figcaption>Sécuriser un site WordPress avec SSL</figcaption><div class=\"flux-l\"><div class=\"flux-b\">1. Acheter et installer le certificat</div><div class=\"flux-f\">→</div><div class=\"flux-b\">2. Configurer WordPress</div><div class=\"flux-f\">→</div><div class=\"flux-b\">3. Vérifier les éléments mixtes</div><div class=\"flux-f\">→</div><div class=\"flux-b\">4. Tester la configuration</div></div></figure><figure class=\"etapes\" data-i=\"0\"><figcaption>Les 4 étapes du cours</figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · 1. Acheter et installer un certificat SSL</div><p>On l&#39;obtient auprès de son <strong>hébergeur</strong> ou d&#39;un fournisseur : <strong>Let&#39;s Encrypt</strong> (gratuit), <strong>Comodo</strong>, <strong>DigiCert</strong>. On l&#39;installe en suivant les instructions de l&#39;hébergeur. En local avec XAMPP, on utilise <strong>OpenSSL</strong> pour générer un certificat <strong>auto-signé</strong>.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · 2. Configurer WordPress pour utiliser SSL</div><p>Dans <strong>Réglages, Général</strong>, on met à jour les deux URL (celle de WordPress et celle du site) en remplaçant <code>http</code> par <code>https</code>. Puis on <strong>force HTTPS</strong> avec une règle dans le fichier <code>.htaccess</code>.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · 3. Vérifier les éléments mixtes</div><p>On vérifie que <strong>tous</strong> les éléments (images, scripts) sont chargés en HTTPS. Le plugin <strong>Really Simple SSL</strong> facilite la transition et évite les avertissements de contenu mixte.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · 4. Vérifier la configuration SSL</div><p>On teste le site avec un outil en ligne comme <strong>SSL Labs</strong>.</p>\n</div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><table>\n<thead>\n<tr>\n<th>Étape</th>\n<th>Outil ou lieu à citer</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1</td>\n<td>Hébergeur, Let&#39;s Encrypt (gratuit), Comodo, DigiCert, OpenSSL en local</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Réglages, Général et fichier <code>.htaccess</code></td>\n</tr>\n<tr>\n<td>3</td>\n<td>Plugin Really Simple SSL</td>\n</tr>\n<tr>\n<td>4</td>\n<td>SSL Labs</td>\n</tr>\n</tbody></table>\n<h2>Idée 3 · Forcer HTTPS avec .htaccess</h2>\n<p>Le code du cours, à ajouter dans le fichier <code>.htaccess</code> :</p>\n<pre class=\"\"><code>&lt;IfModule mod_rewrite.c&gt;\nRewriteEngine On\nRewriteCond %{HTTPS} off\nRewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]\n&lt;/IfModule&gt;</code></pre><figure class=\"etapes\" data-i=\"0\"><figcaption>Lire la règle ligne par ligne</figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · IfModule mod_rewrite.c</div><p>« Si le module de réécriture d&#39;Apache est disponible, applique ce qui suit. »</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · RewriteEngine On</div><p>On allume le moteur de réécriture d&#39;URL.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · RewriteCond %{HTTPS} off</div><p>La condition : la requête est arrivée <strong>sans</strong> HTTPS.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · RewriteRule ... [L,R=301]</div><p>La règle : on renvoie vers la même adresse, mais en <code>https://</code>. <strong>R=301</strong> = redirection permanente. <strong>L</strong> = dernière règle à appliquer.</p>\n</div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>La lecture ligne par ligne est une explication ajoutée par ToumaiLearn : la diapo donne le code sans le commenter. Retiens surtout l&#39;idée : <strong>tout le trafic HTTP est redirigé automatiquement vers HTTPS</strong>.</p>\n</aside><h2>Idée 4 · En local : le certificat auto-signé</h2>\n<p>Un certificat <strong>auto-signé</strong> est un certificat que tu fabriques toi-même, sans autorité extérieure. Le cours le réserve <strong>aux fins de développement</strong>.</p>\n<p>Les trois étapes avec XAMPP :</p>\n<p><strong>1) Générer une clé privée et un certificat auto-signé</strong> (avec OpenSSL)</p>\n<pre class=\"\"><code>openssl genpkey -algorithm RSA -out /path/to/xampp/apache/conf/ssl.key/server.key\nopenssl req -new -key /path/to/xampp/apache/conf/ssl.key/server.key -out /path/to/xampp/apache/conf/ssl.csr/server.csr\nopenssl x509 -req -days 365 -in /path/to/xampp/apache/conf/ssl.csr/server.csr -signkey /path/to/xampp/apache/conf/ssl.key/server.key -out /path/to/xampp/apache/conf/ssl.crt/server.crt</code></pre><table>\n<thead>\n<tr>\n<th>Commande</th>\n<th>Ce qu&#39;elle produit</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>openssl genpkey</code></td>\n<td>La <strong>clé privée</strong> (<code>server.key</code>), ici en RSA</td>\n</tr>\n<tr>\n<td><code>openssl req -new</code></td>\n<td>La <strong>demande de certificat</strong> (<code>server.csr</code>)</td>\n</tr>\n<tr>\n<td><code>openssl x509 -req -days 365 -signkey</code></td>\n<td>Le <strong>certificat</strong> (<code>server.crt</code>), signé avec ta propre clé, valable 365 jours</td>\n</tr>\n</tbody></table>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>Sur la diapo, les commandes 2 et 3 sont <strong>coupées</strong> au bord de l&#39;image. La fin de chaque ligne (les chemins après <code>-out</code> et <code>-signkey</code>) a été complétée par ToumaiLearn d&#39;après la configuration Apache de la diapo suivante. Vérifie avec le support du prof s&#39;il le redonne en entier.</p>\n</aside><p><strong>2) Configurer Apache pour utiliser SSL</strong>, dans le fichier <code>httpd-ssl.conf</code> :</p>\n<pre class=\"\"><code>&lt;VirtualHost _default_:443&gt;\n    DocumentRoot &quot;C:/path/to/your/xampp/htdocs&quot;\n    ServerName localhost:443\n    SSLEngine on\n    SSLCertificateFile &quot;C:/path/to/xampp/apache/conf/ssl.crt/server.crt&quot;\n    SSLCertificateKeyFile &quot;C:/path/to/xampp/apache/conf/ssl.key/server.key&quot;\n&lt;/VirtualHost&gt;</code></pre><p><strong>3) Redémarrer Apache</strong> pour appliquer les modifications.</p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p>HTTPS passe par le port <strong>443</strong>. <code>SSLCertificateFile</code> pointe vers le <strong>certificat</strong> (.crt), <code>SSLCertificateKeyFile</code> vers la <strong>clé privée</strong> (.key).</p>\n</aside><h2>S&#39;exercer</h2>\n<section class=\"exo\"><h3>Questions types</h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Cite les quatre étapes pour sécuriser un site WordPress avec SSL.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><ol>\n<li>Acheter et installer un certificat SSL. 2) Configurer WordPress pour utiliser SSL (URL en https, redirection .htaccess). 3) Vérifier les éléments mixtes. 4) Vérifier la configuration SSL.</li>\n</ol>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Cite un fournisseur de certificat gratuit et deux fournisseurs payants.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Gratuit : <strong>Let&#39;s Encrypt</strong>. Payants : <strong>Comodo</strong>, <strong>DigiCert</strong>.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Qu&#39;est-ce qu&#39;un avertissement de contenu mixte, et quel plugin aide à l&#39;éviter ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Il apparaît quand une page en HTTPS charge encore des éléments (images, scripts) en HTTP. Le plugin <strong>Really Simple SSL</strong> aide à vérifier que tout est chargé en HTTPS.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Après avoir modifié httpd-ssl.conf, que faut-il faire pour que le changement soit pris en compte ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p><strong>Redémarrer Apache.</strong></p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>Dans la configuration Apache, quel port est utilisé pour SSL ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 443</b></p><p>Le VirtualHost est déclaré sur <code>_default_:443</code>, le port de HTTPS.</p>\n</div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 11 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Que signifie SSL ?</div><button class=\"opt\" data-o=\"0\">Secure Site Login</button><button class=\"opt\" data-o=\"1\">Secure Sockets Layer</button><button class=\"opt\" data-o=\"2\">Server Side Language</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Lequel de ces fournisseurs de certificats est gratuit, selon le cours ?</div><button class=\"opt\" data-o=\"0\">Comodo</button><button class=\"opt\" data-o=\"1\">DigiCert</button><button class=\"opt\" data-o=\"2\">Let&#39;s Encrypt</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Quel outil utilise-t-on en local avec XAMPP pour générer un certificat ?</div><button class=\"opt\" data-o=\"0\">OpenSSL</button><button class=\"opt\" data-o=\"1\">phpMyAdmin</button><button class=\"opt\" data-o=\"2\">Gutenberg</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Où remplace-t-on <code>http</code> par <code>https</code> dans les URL du site ?</div><button class=\"opt\" data-o=\"0\">Réglages, Permaliens</button><button class=\"opt\" data-o=\"1\">Réglages, Général</button><button class=\"opt\" data-o=\"2\">Outils, Exporter</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Quel fichier permet de rediriger automatiquement le trafic HTTP vers HTTPS ?</div><button class=\"opt\" data-o=\"0\">wp-config.php</button><button class=\"opt\" data-o=\"1\">httpd-ssl.conf</button><button class=\"opt\" data-o=\"2\">.htaccess</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">À quoi sert le plugin Really Simple SSL ?</div><button class=\"opt\" data-o=\"0\">À acheter un nom de domaine</button><button class=\"opt\" data-o=\"1\">À faciliter la transition vers HTTPS et éviter le contenu mixte</button><button class=\"opt\" data-o=\"2\">À sauvegarder la base de données</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Qu&#39;est-ce qu&#39;un avertissement de contenu mixte ?</div><button class=\"opt\" data-o=\"0\">Un mélange d&#39;articles et de pages</button><button class=\"opt\" data-o=\"1\">Une page HTTPS qui charge encore des éléments en HTTP</button><button class=\"opt\" data-o=\"2\">Un thème incompatible avec une extension</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Quel outil en ligne sert à tester la configuration SSL ?</div><button class=\"opt\" data-o=\"0\">BuiltWith</button><button class=\"opt\" data-o=\"1\">Wappalyzer</button><button class=\"opt\" data-o=\"2\">SSL Labs</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Un certificat auto-signé est destiné :</div><button class=\"opt\" data-o=\"0\">aux sites de e-commerce en production</button><button class=\"opt\" data-o=\"1\">au développement en local</button><button class=\"opt\" data-o=\"2\">aux sites gouvernementaux</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Dans quel fichier configure-t-on Apache pour SSL sous XAMPP ?</div><button class=\"opt\" data-o=\"0\">httpd-ssl.conf</button><button class=\"opt\" data-o=\"1\">.htaccess</button><button class=\"opt\" data-o=\"2\">wp-config-sample.php</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"10\"><div class=\"qq-q\">Dans la règle <code>.htaccess</code>, que signifie <code>RewriteCond %{HTTPS} off</code> ?</div><button class=\"opt\" data-o=\"0\">HTTPS est désactivé sur tout le serveur</button><button class=\"opt\" data-o=\"1\">La règle s&#39;applique seulement si la requête n&#39;est pas en HTTPS</button><button class=\"opt\" data-o=\"2\">Le certificat a expiré</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"securite-ssl","rep":null,"tol":null},{"n":"securite-ssl","rep":null,"tol":null},{"n":"securite-ssl","rep":null,"tol":null},{"n":"securite-ssl","rep":null,"tol":null},{"n":"securite-ssl","rep":null,"tol":null},{"n":"securite-ssl","rep":["443"],"tol":null}],"qcm":[{"n":"securite-ssl","q":"Que signifie SSL ?","o":["Secure Site Login","Secure Sockets Layer","Server Side Language"],"a":1,"e":"Le certificat SSL permet de servir le site en HTTPS."},{"n":"securite-ssl","q":"Lequel de ces fournisseurs de certificats est gratuit, selon le cours ?","o":["Comodo","DigiCert","Let&#39;s Encrypt"],"a":2,"e":"Comodo et DigiCert sont des fournisseurs commerciaux."},{"n":"securite-ssl","q":"Quel outil utilise-t-on en local avec XAMPP pour générer un certificat ?","o":["OpenSSL","phpMyAdmin","Gutenberg"],"a":0,"e":"Il sert à générer un certificat auto-signé, pour le développement."},{"n":"securite-ssl","q":"Où remplace-t-on <code>http</code> par <code>https</code> dans les URL du site ?","o":["Réglages, Permaliens","Réglages, Général","Outils, Exporter"],"a":1,"e":"On y met à jour l&#39;URL de WordPress et l&#39;URL du site."},{"n":"securite-ssl","q":"Quel fichier permet de rediriger automatiquement le trafic HTTP vers HTTPS ?","o":["wp-config.php","httpd-ssl.conf",".htaccess"],"a":2,"e":"On y ajoute une règle RewriteRule avec R=301."},{"n":"securite-ssl","q":"À quoi sert le plugin Really Simple SSL ?","o":["À acheter un nom de domaine","À faciliter la transition vers HTTPS et éviter le contenu mixte","À sauvegarder la base de données"],"a":1,"e":"Il vérifie que tous les éléments du site sont chargés en HTTPS."},{"n":"securite-ssl","q":"Qu&#39;est-ce qu&#39;un avertissement de contenu mixte ?","o":["Un mélange d&#39;articles et de pages","Une page HTTPS qui charge encore des éléments en HTTP","Un thème incompatible avec une extension"],"a":1,"e":"D&#39;où l&#39;étape 3 : vérifier images, scripts, etc."},{"n":"securite-ssl","q":"Quel outil en ligne sert à tester la configuration SSL ?","o":["BuiltWith","Wappalyzer","SSL Labs"],"a":2,"e":"BuiltWith et Wappalyzer servent à détecter la technologie d&#39;un site (chapitre suivant)."},{"n":"securite-ssl","q":"Un certificat auto-signé est destiné :","o":["aux sites de e-commerce en production","au développement en local","aux sites gouvernementaux"],"a":1,"e":"Le cours précise « pour des fins de développement »."},{"n":"securite-ssl","q":"Dans quel fichier configure-t-on Apache pour SSL sous XAMPP ?","o":["httpd-ssl.conf",".htaccess","wp-config-sample.php"],"a":0,"e":"Puis on redémarre Apache."},{"n":"securite-ssl","q":"Dans la règle <code>.htaccess</code>, que signifie <code>RewriteCond %{HTTPS} off</code> ?","o":["HTTPS est désactivé sur tout le serveur","La règle s&#39;applique seulement si la requête n&#39;est pas en HTTPS","Le certificat a expiré"],"a":1,"e":"C&#39;est la condition : on ne redirige que les requêtes arrivées en HTTP."}]},{"id":"woocommerce","t":"WooCommerce, et reconnaître un site WordPress","seance":"Partie 1 · WordPress · E-commerce","imp":4,"html":"<h2>Avant de commencer</h2>\n<p>Tu dois savoir ce qu&#39;est une <strong>extension</strong> (plugin) : un module qu&#39;on ajoute à WordPress pour lui donner une nouvelle fonction (chapitres 4 et 7).</p>\n<section class=\"exo\"><h3>Vérifie ton prérequis</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Dans quel menu du tableau de bord installe-t-on une nouvelle extension ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Dans <strong>Extensions, Ajouter</strong>. WooCommerce s&#39;installe exactement là.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Comment aborder ce chapitre</h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p><strong>Suis le trajet d&#39;une commande.</strong> Un produit est mis en ligne, le client paie, le colis est expédié, la commande est suivie, le vendeur lit ses chiffres. Les caractéristiques de WooCommerce suivent ce trajet, dans cet ordre.</p>\n</aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>WooCommerce <strong>n&#39;est pas un CMS</strong>. C&#39;est une <strong>extension de WordPress</strong>. Sans WordPress, pas de WooCommerce. (Le CMS e-commerce à part entière du module, c&#39;est PrestaShop, en partie 2.)</p>\n</aside><p>À la fin, tu sais présenter WooCommerce, dérouler ses six caractéristiques, et dire si un site est fait avec WordPress.</p>\n<h2>Idée 1 · Une extension qui transforme le site en boutique</h2>\n<figure class=\"flux\"><figcaption>Ce que fait WooCommerce</figcaption><div class=\"flux-l\"><div class=\"flux-b\">Site WordPress</div><div class=\"flux-f\">→</div><div class=\"flux-b\">+ extension WooCommerce</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Boutique en ligne complète</div></div></figure><p><strong>Présentation.</strong> WooCommerce est une extension <strong>gratuite</strong> pour WordPress, conçue pour transformer un site WordPress en <strong>boutique en ligne entièrement fonctionnelle</strong>. C&#39;est l&#39;un des outils e-commerce les plus populaires, grâce à sa <strong>flexibilité</strong>, son <strong>extensibilité</strong> et sa <strong>facilité d&#39;utilisation</strong>.</p>\n<svg viewBox=\"0 0 360 90\" style=\"width:100%;max-width:460px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Frise : septembre 2011 lancement de WooCommerce, mai 2015 rachat par Automattic\">\n<line x1=\"20\" y1=\"46\" x2=\"340\" y2=\"46\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<g font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\">\n<circle cx=\"90\" cy=\"46\" r=\"6\" fill=\"#D9824F\"/><text x=\"90\" y=\"30\" font-weight=\"700\">Septembre 2011</text><text x=\"90\" y=\"70\" font-size=\"10\">Lancement (WooThemes)</text>\n<circle cx=\"270\" cy=\"46\" r=\"6\" fill=\"#D9824F\"/><text x=\"270\" y=\"30\" font-weight=\"700\">Mai 2015</text><text x=\"270\" y=\"70\" font-size=\"10\">Rachat par Automattic</text>\n</g>\n</svg><table>\n<thead>\n<tr>\n<th>Fait</th>\n<th>À retenir</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Créateurs</strong></td>\n<td><strong>Mike Jolley</strong> et <strong>James Koster</strong>, deux développeurs de <strong>WooThemes</strong></td>\n</tr>\n<tr>\n<td><strong>Lancement</strong></td>\n<td><strong>Septembre 2011</strong></td>\n</tr>\n<tr>\n<td><strong>Popularité</strong></td>\n<td>Très vite l&#39;un des plugins e-commerce les plus populaires de WordPress</td>\n</tr>\n<tr>\n<td><strong>Acquisition</strong></td>\n<td>En <strong>mai 2015</strong>, <strong>Automattic</strong> (la société derrière WordPress.com) rachète WooThemes, et donc WooCommerce</td>\n</tr>\n<tr>\n<td><strong>Effet du rachat</strong></td>\n<td>WooCommerce est intégré plus étroitement à l&#39;écosystème WordPress, et son développement continu est assuré</td>\n</tr>\n</tbody></table>\n<h2>Idée 2 · Les six caractéristiques, dans l&#39;ordre d&#39;une vente</h2>\n<figure class=\"flux\"><figcaption>Le trajet d'une commande</figcaption><div class=\"flux-l\"><div class=\"flux-b\">Produits</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Paiements</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Expédition</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Commandes</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Personnalisation</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Rapports</div></div></figure><table>\n<thead>\n<tr>\n<th>N°</th>\n<th>Caractéristique</th>\n<th>Détail du cours</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1</td>\n<td><strong>Gestion des produits</strong></td>\n<td><strong>Ajout</strong> de produits (descriptions, images, catégories, étiquettes). <strong>Variations</strong> (taille, couleur). <strong>Inventaire</strong> suivi depuis le tableau de bord.</td>\n</tr>\n<tr>\n<td>2</td>\n<td><strong>Paiements</strong></td>\n<td>Méthodes intégrées : <strong>PayPal, Stripe</strong>, virement bancaire, chèque, <strong>paiement à la livraison</strong>. D&#39;autres via des extensions de paiement.</td>\n</tr>\n<tr>\n<td>3</td>\n<td><strong>Expédition</strong></td>\n<td>Options et tarifs de livraison <strong>selon les zones géographiques</strong>. <strong>Calcul automatique</strong> des frais de port (poids, taille, destination).</td>\n</tr>\n<tr>\n<td>4</td>\n<td><strong>Gestion des commandes</strong></td>\n<td><strong>Suivi</strong> de l&#39;état de la commande, de la commande initiale à la livraison. <strong>Notifications par e-mail</strong> (nouvelle commande, changement de statut).</td>\n</tr>\n<tr>\n<td>5</td>\n<td><strong>Personnalisation et thèmes</strong></td>\n<td>De nombreux <strong>thèmes compatibles</strong>. Apparence et fonctions réglables via le <strong>customizer</strong> de WordPress.</td>\n</tr>\n<tr>\n<td>6</td>\n<td><strong>Rapports et analyses</strong></td>\n<td><strong>Rapports de vente</strong> (ventes, produits, clients). <strong>Statistiques en temps réel</strong>.</td>\n</tr>\n</tbody></table>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Dérouler les 6 caractéristiques sur un exemple : vendre de l'huile d'argan</figcaption><div class=\"etape\"><div class=\"et-t\">1/6 · 1. Produits</div><p>J&#39;ajoute « Huile d&#39;argan » avec photo et description. Variations : 50 ml, 100 ml. Je suis mon stock.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/6 · 2. Paiements</div><p>J&#39;active le paiement à la livraison et la carte bancaire.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/6 · 3. Expédition</div><p>20 DH pour Béni Mellal, 35 DH pour le reste du Maroc. Les frais se calculent tout seuls.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">4/6 · 4. Commandes</div><p>Je vois chaque commande passer de « en cours » à « livrée ». Le client reçoit un e-mail à chaque étape.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">5/6 · 5. Personnalisation</div><p>Je choisis un thème compatible et je règle les couleurs dans le customizer.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">6/6 · 6. Rapports</div><p>En fin de mois, je lis mes ventes par produit et par client.</p>\n</div><
