div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>L&#39;exemple de l&#39;huile d&#39;argan et ses tarifs sont inventés par ToumaiLearn pour illustrer. Les six caractéristiques et leur contenu viennent du cours.</p>\n</aside><h2>Idée 3 · Extensions et avantages de WooCommerce</h2>\n<p>WooCommerce a sa propre bibliothèque d&#39;extensions. Les quatre familles citées :</p>\n<table>\n<thead>\n<tr>\n<th>Extension</th>\n<th>Sert à</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Abonnements</strong></td>\n<td>Gérer les abonnements et les paiements récurrents</td>\n</tr>\n<tr>\n<td><strong>Réservations</strong></td>\n<td>Permettre aux clients de réserver des produits ou des services</td>\n</tr>\n<tr>\n<td><strong>Membres</strong></td>\n<td>Créer des zones réservées aux membres</td>\n</tr>\n<tr>\n<td><strong>SEO</strong></td>\n<td>Améliorer le référencement de la boutique</td>\n</tr>\n</tbody></table>\n<p>Les quatre avantages :</p>\n<ol>\n<li><strong>Gratuit et open source</strong> : grande flexibilité pour personnaliser la boutique.</li>\n<li><strong>Facilité d&#39;utilisation</strong> : interface conviviale, intégration transparente avec WordPress.</li>\n<li><strong>Communauté active</strong> : beaucoup de développeurs et de support.</li>\n<li><strong>Extensibilité</strong> : on ajoute des fonctions via des extensions et des plugins.</li>\n</ol>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p>Les avantages de WooCommerce sont ceux de WordPress : <strong>gratuit, facile, communauté, extensible</strong>. Si tu connais les uns, tu connais les autres.</p>\n</aside><h2>Idée 4 · Trois méthodes pour reconnaître un site WordPress</h2>\n<svg viewBox=\"0 0 360 96\" style=\"width:100%;max-width:460px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Trois méthodes : chercher wp-content dans le code, BuiltWith, Wappalyzer\">\n<g font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"6\" y=\"14\" width=\"108\" height=\"68\" rx=\"8\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/><text x=\"60\" y=\"36\" font-weight=\"700\" fill=\"#D9824F\">1. Le code</text><text x=\"60\" y=\"54\" font-size=\"10\">Ctrl+Maj+I, Ctrl+F</text><text x=\"60\" y=\"68\" font-size=\"10\">« wp-content »</text>\n<rect x=\"126\" y=\"14\" width=\"108\" height=\"68\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"180\" y=\"36\" font-weight=\"700\">2. BuiltWith</text><text x=\"180\" y=\"54\" font-size=\"10\">site web</text><text x=\"180\" y=\"68\" font-size=\"10\">builtwith.com</text>\n<rect x=\"246\" y=\"14\" width=\"108\" height=\"68\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"300\" y=\"36\" font-weight=\"700\">3. Wappalyzer</text><text x=\"300\" y=\"54\" font-size=\"10\">extension</text><text x=\"300\" y=\"68\" font-size=\"10\">du navigateur</text>\n</g>\n</svg><table>\n<thead>\n<tr>\n<th>Méthode</th>\n<th>Comment</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>1. Le code</strong></td>\n<td>Ouvrir le code de la page (<strong>Ctrl+Maj+I</strong>), puis <strong>Ctrl+F</strong>, et chercher <strong>« wp-content »</strong></td>\n</tr>\n<tr>\n<td><strong>2. BuiltWith</strong></td>\n<td>Aller sur <code>https://builtwith.com/fr/</code> : la plateforme indique si le site est fait avec WordPress</td>\n</tr>\n<tr>\n<td><strong>3. Wappalyzer</strong></td>\n<td>Une extension à installer dans le navigateur</td>\n</tr>\n</tbody></table>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p>Pourquoi « wp-content » ? C&#39;est le dossier où WordPress range les thèmes, les extensions et les images. Presque toutes les pages d&#39;un site WordPress y font référence. (Explication ajoutée par ToumaiLearn.)</p>\n</aside><h2>S&#39;exercer</h2>\n<section class=\"exo\"><h3>Questions types</h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Présente WooCommerce en deux phrases.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>WooCommerce est une extension (plugin) gratuite pour WordPress, conçue pour transformer un site WordPress en boutique en ligne entièrement fonctionnelle. C&#39;est l&#39;un des outils e-commerce les plus populaires grâce à sa flexibilité, son extensibilité et sa facilité d&#39;utilisation.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Qui a créé WooCommerce, quand, et qui l&#39;a racheté ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Créé par Mike Jolley et James Koster (WooThemes), lancé en septembre 2011. Racheté en mai 2015 par Automattic, la société derrière WordPress.com.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Cite les six caractéristiques de WooCommerce.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Suis le trajet d&#39;une commande.</p>\n</div><div class=\"ex-c\" hidden><p>Gestion des produits, paiements, expédition, gestion des commandes, personnalisation et thèmes, rapports et analyses.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Donne trois méthodes pour vérifier si un site est fait avec WordPress.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><ol>\n<li>Ouvrir le code (Ctrl+Maj+I), Ctrl+F, chercher « wp-content ». 2) Utiliser BuiltWith. 3) Utiliser l&#39;extension de navigateur Wappalyzer.</li>\n</ol>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 11 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">WooCommerce est :</div><button class=\"opt\" data-o=\"0\">un CMS concurrent de WordPress</button><button class=\"opt\" data-o=\"1\">une extension gratuite de WordPress</button><button class=\"opt\" data-o=\"2\">un hébergeur spécialisé e-commerce</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Quand WooCommerce a-t-il été lancé ?</div><button class=\"opt\" data-o=\"0\">En 2003</button><button class=\"opt\" data-o=\"1\">En septembre 2011</button><button class=\"opt\" data-o=\"2\">En mai 2015</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Qui a racheté WooThemes, et donc WooCommerce, en mai 2015 ?</div><button class=\"opt\" data-o=\"0\">Automattic</button><button class=\"opt\" data-o=\"1\">Shopify</button><button class=\"opt\" data-o=\"2\">PrestaShop</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Pour quelle société travaillaient les créateurs de WooCommerce ?</div><button class=\"opt\" data-o=\"0\">Automattic</button><button class=\"opt\" data-o=\"1\">WooThemes</button><button class=\"opt\" data-o=\"2\">Apache Friends</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">« Taille, couleur » : de quelle fonction de WooCommerce s&#39;agit-il ?</div><button class=\"opt\" data-o=\"0\">L&#39;inventaire</button><button class=\"opt\" data-o=\"1\">Les variations de produits</button><button class=\"opt\" data-o=\"2\">Les zones de livraison</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Laquelle de ces méthodes de paiement n&#39;est PAS citée dans le cours ?</div><button class=\"opt\" data-o=\"0\">PayPal</button><button class=\"opt\" data-o=\"1\">Paiement en espèces à la livraison</button><button class=\"opt\" data-o=\"2\">Cryptomonnaie</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Le calcul automatique des frais de port se fait en fonction :</div><button class=\"opt\" data-o=\"0\">du poids, de la taille et de la destination</button><button class=\"opt\" data-o=\"1\">de l&#39;âge du client</button><button class=\"opt\" data-o=\"2\">du nombre de visiteurs du site</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Quelle extension WooCommerce sert aux paiements récurrents ?</div><button class=\"opt\" data-o=\"0\">Réservations</button><button class=\"opt\" data-o=\"1\">Membres</button><button class=\"opt\" data-o=\"2\">Abonnements</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Que cherche-t-on dans le code d&#39;une page pour savoir si le site est fait avec WordPress ?</div><button class=\"opt\" data-o=\"0\">« woo-shop »</button><button class=\"opt\" data-o=\"1\">« wp-content »</button><button class=\"opt\" data-o=\"2\">« php-admin »</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Wappalyzer est :</div><button class=\"opt\" data-o=\"0\">un thème WordPress</button><button class=\"opt\" data-o=\"1\">un hébergeur</button><button class=\"opt\" data-o=\"2\">une extension de navigateur qui détecte les technologies d&#39;un site</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"woocommerce","rep":null,"tol":null},{"n":"woocommerce","rep":null,"tol":null},{"n":"woocommerce","rep":null,"tol":null},{"n":"woocommerce","rep":null,"tol":null},{"n":"woocommerce","rep":null,"tol":null}],"qcm":[{"n":"woocommerce","q":"WooCommerce est :","o":["un CMS concurrent de WordPress","une extension gratuite de WordPress","un hébergeur spécialisé e-commerce"],"a":1,"e":"Il transforme un site WordPress en boutique en ligne."},{"n":"woocommerce","q":"Quand WooCommerce a-t-il été lancé ?","o":["En 2003","En septembre 2011","En mai 2015"],"a":1,"e":"2003 est le lancement de WordPress ; mai 2015 est le rachat par Automattic."},{"n":"woocommerce","q":"Qui a racheté WooThemes, et donc WooCommerce, en mai 2015 ?","o":["Automattic","Shopify","PrestaShop"],"a":0,"e":"Automattic est la société derrière WordPress.com."},{"n":"woocommerce","q":"Pour quelle société travaillaient les créateurs de WooCommerce ?","o":["Automattic","WooThemes","Apache Friends"],"a":1,"e":"Mike Jolley et James Koster, développeurs chez WooThemes."},{"n":"woocommerce","q":"« Taille, couleur » : de quelle fonction de WooCommerce s&#39;agit-il ?","o":["L&#39;inventaire","Les variations de produits","Les zones de livraison"],"a":1,"e":"Les variations permettent de décliner un même produit."},{"n":"woocommerce","q":"Laquelle de ces méthodes de paiement n&#39;est PAS citée dans le cours ?","o":["PayPal","Paiement en espèces à la livraison","Cryptomonnaie"],"a":2,"e":"Sont cités : PayPal, Stripe, virements bancaires, chèques, espèces à la livraison."},{"n":"woocommerce","q":"Le calcul automatique des frais de port se fait en fonction :","o":["du poids, de la taille et de la destination","de l&#39;âge du client","du nombre de visiteurs du site"],"a":0,"e":"C&#39;est la partie « Expédition »."},{"n":"woocommerce","q":"Quelle extension WooCommerce sert aux paiements récurrents ?","o":["Réservations","Membres","Abonnements"],"a":2,"e":"Abonnements : gérer les abonnements et les paiements récurrents."},{"n":"woocommerce","q":"Que cherche-t-on dans le code d&#39;une page pour savoir si le site est fait avec WordPress ?","o":["« woo-shop »","« wp-content »","« php-admin »"],"a":1,"e":"Ctrl+Maj+I pour ouvrir le code, puis Ctrl+F."},{"n":"woocommerce","q":"Wappalyzer est :","o":["un thème WordPress","un hébergeur","une extension de navigateur qui détecte les technologies d&#39;un site"],"a":2,"e":"BuiltWith fait la même chose depuis un site web."}]},{"id":"revision-cms","t":"Révision express et examen blanc","seance":"Avant l'examen","imp":3,"html":"<h2>Avant de commencer</h2>\n<p>Ce chapitre ne t&#39;apprend rien de nouveau : il rassemble tout. Fais-le quand tu as terminé les neuf chapitres précédents.</p>\n<section class=\"exo\"><h3>Vérifie ton prérequis</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Sans regarder : cite les cinq avantages d&#39;un CMS.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Séparation contenu/conception, autorisations d&#39;accès, gratuit ou peu coûteux, facile pour le référencement, simple et intuitif. Si tu en as oublié plus d&#39;un, repasse par le chapitre 1 avant l&#39;examen blanc.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Comment aborder ce chapitre</h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p><strong>Récite avant de relire.</strong> Pour chaque tableau ci-dessous, cache la colonne de droite et dis la réponse à voix haute. Ce que tu ne retrouves pas, tu le sais maintenant : c&#39;est ça qu&#39;il faut revoir.</p>\n</aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>Relire dix fois le cours donne l&#39;impression de savoir. Ce module est fait de listes et de comparaisons : seule la <strong>récitation</strong> te dit si tu les tiens.</p>\n</aside><p>À la fin, tu sais où tu en es, question par question.</p>\n<h2>Idée 1 · Le cours sur une seule page</h2>\n<table>\n<thead>\n<tr>\n<th>Thème</th>\n<th>L&#39;essentiel</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>CMS</strong></td>\n<td>Logiciel pour créer, gérer et modifier le contenu d&#39;un site sans connaissances techniques spécialisées</td>\n</tr>\n<tr>\n<td><strong>5 avantages</strong></td>\n<td>Séparation contenu/conception, autorisations, gratuit ou peu coûteux, référencement, simplicité</td>\n</tr>\n<tr>\n<td><strong>Propriétaire</strong></td>\n<td>Code fermé, licence payante, support du vendeur, personnalisation limitée (Shopify, Wix, Squarespace)</td>\n</tr>\n<tr>\n<td><strong>Libre</strong></td>\n<td>Code ouvert, gratuit, communauté, plugins (WordPress, PrestaShop, Joomla, Drupal)</td>\n</tr>\n<tr>\n<td><strong>5 critères de choix</strong></td>\n<td>Prix, facilité, fond du CMS, assistance, développement de fonctionnalités</td>\n</tr>\n<tr>\n<td><strong>WordPress</strong></td>\n<td>Gratuit, open source, PHP + MySQL, plus de 43 % de parts de marché</td>\n</tr>\n<tr>\n<td><strong>Dates WordPress</strong></td>\n<td>2003 lancement, 2014 numéro 1 mondial, 2018 Gutenberg</td>\n</tr>\n<tr>\n<td><strong>.org / .com</strong></td>\n<td>.org : logiciel à auto-héberger, contrôle total. .com : service hébergé d&#39;Automattic, clé en main</td>\n</tr>\n<tr>\n<td><strong>Prérequis</strong></td>\n<td>Nom de domaine, serveur (partagé, dédié, cloud, local), hébergeur</td>\n</tr>\n<tr>\n<td><strong>XAMPP</strong></td>\n<td>Cross-platform, Apache, MariaDB, PHP, Perl</td>\n</tr>\n<tr>\n<td><strong>Installation</strong></td>\n<td>9 étapes ; base dans phpMyAdmin, fichiers dans htdocs, lien dans wp-config.php</td>\n</tr>\n<tr>\n<td><strong>Tableau de bord</strong></td>\n<td>Articles, Médias, Pages, Commentaires, Apparence, Extensions, Comptes, Outils, Réglages</td>\n</tr>\n<tr>\n<td><strong>SSL</strong></td>\n<td>Certificat, URL en https + .htaccess, éléments mixtes, test</td>\n</tr>\n<tr>\n<td><strong>WooCommerce</strong></td>\n<td>Extension e-commerce gratuite, septembre 2011, Automattic en mai 2015</td>\n</tr>\n</tbody></table>\n<h2>Idée 2 · Les paires à ne jamais confondre</h2>\n<table>\n<thead>\n<tr>\n<th>Ne confonds pas…</th>\n<th>…avec</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>CMS</strong> (le logiciel)</td>\n<td>le <strong>site</strong> (le résultat)</td>\n</tr>\n<tr>\n<td><strong>WordPress.org</strong> (logiciel à installer)</td>\n<td><strong>WordPress.com</strong> (service hébergé)</td>\n</tr>\n<tr>\n<td><strong>Catégorie</strong> (groupe d&#39;articles)</td>\n<td><strong>Étiquette</strong> (mot-clé)</td>\n</tr>\n<tr>\n<td><strong>Thème</strong> (apparence)</td>\n<td><strong>Extension</strong> (fonction)</td>\n</tr>\n<tr>\n<td><strong>WooCommerce</strong> (extension)</td>\n<td><strong>PrestaShop</strong> (CMS)</td>\n</tr>\n<tr>\n<td><strong>BuiltWith, Wappalyzer</strong> (détecter WordPress)</td>\n<td><strong>SSL Labs</strong> (tester le SSL)</td>\n</tr>\n</tbody></table>\n<figure class=\"flux\"><figcaption>Le réflexe face à deux mots qui se ressemblent</figcaption><div class=\"flux-l\"><div class=\"flux-b\">Je lis le mot</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Je me demande : logiciel, service ou contenu ?</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Je réponds</div></div></figure><h2>Idée 3 · Les chiffres et les noms qui tombent</h2>\n<table>\n<thead>\n<tr>\n<th>Question</th>\n<th>Réponse</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Lancement de WordPress</td>\n<td>2003 (v0.7)</td>\n</tr>\n<tr>\n<td>WordPress numéro 1 mondial</td>\n<td>2014 (v4.0)</td>\n</tr>\n<tr>\n<td>Éditeur Gutenberg</td>\n<td>2018 (v5.0)</td>\n</tr>\n<tr>\n<td>Part de marché de WordPress</td>\n<td>plus de 43 %</td>\n</tr>\n<tr>\n<td>Joomla / Drupal</td>\n<td>3 % / 4 %</td>\n</tr>\n<tr>\n<td>Lancement de WooCommerce</td>\n<td>septembre 2011</td>\n</tr>\n<tr>\n<td>Rachat par Automattic</td>\n<td>mai 2015</td>\n</tr>\n<tr>\n<td>Créateurs de WooCommerce</td>\n<td>Mike Jolley et James Koster</td>\n</tr>\n<tr>\n<td>Certificat gratuit</td>\n<td>Let&#39;s Encrypt</td>\n</tr>\n<tr>\n<td>Port de HTTPS</td>\n<td>443</td>\n</tr>\n</tbody></table>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>Aucune annale ni barème d&#39;examen de CMS n&#39;a été fourni : le format réel de l&#39;épreuve du Pr Falih n&#39;est pas connu. L&#39;examen blanc ci-dessous est construit par ToumaiLearn à partir du cours. Le module comporte aussi une partie pratique (réaliser un site) que cette page ne peut pas remplacer.</p>\n</aside><figure class=\"etapes\" data-i=\"0\"><figcaption>Ton plan des trois derniers jours</figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · J-3</div><p>Refais les QCM des chapitres 1 à 5. Note chaque question ratée.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · J-2</div><p>Refais les QCM des chapitres 6 à 9. Installe (ou réinstalle) WordPress avec XAMPP une fois, chrono en main.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · J-1</div><p>Passe les flashcards, puis fais l&#39;examen blanc ci-dessous sans rien regarder.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Le jour J</div><p>Relis seulement les trois tableaux de cette page.</p>\n</div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><h2>S&#39;exercer</h2>\n<section class=\"exo\"><h3>Questions de cours, comme à l&#39;écrit</h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Définis un CMS et donne deux exemples de chaque famille.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Un CMS est un logiciel qui aide à créer, gérer et modifier le contenu d&#39;un site web sans connaissances techniques spécialisées. Libres : WordPress, PrestaShop (ou Joomla, Drupal). Propriétaires : Shopify, Wix (ou Squarespace, Sitecore).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Compare WordPress.org et WordPress.com sur trois critères.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p><strong>Hébergement</strong> : à trouver et payer soi-même (.org) contre inclus (.com). <strong>Contrôle</strong> : total (.org) contre limité (.com). <strong>Maintenance et sécurité</strong> : à la charge de l&#39;utilisateur (.org) contre gérées par WordPress.com (.com).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Décris les étapes pour installer WordPress en local.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Installer XAMPP, démarrer Apache et MySQL, créer une base dans phpMyAdmin, télécharger WordPress, copier le dossier dans htdocs, configurer wp-config.php (DB_NAME, DB_USER, DB_PASSWORD, DB_HOST), ouvrir <a href=\"http://localhost/dossier\">http://localhost/dossier</a>, remplir les informations du site, se connecter.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Comment sécurise-t-on un site WordPress avec SSL ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>On achète et on installe un certificat SSL, on configure WordPress (URL en https dans Réglages, Général, et redirection dans .htaccess), on vérifie les éléments mixtes (plugin Really Simple SSL), puis on teste la configuration (SSL Labs).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Lequel de ces avantages n&#39;est PAS dans la liste des cinq avantages d&#39;un CMS ?</div><button class=\"opt\" data-o=\"0\">Possibilité de définir des autorisations d&#39;accès</button><button class=\"opt\" data-o=\"1\">Facile à utiliser pour le référencement</button><button class=\"opt\" data-o=\"2\">Garantie de ne jamais être piraté</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Lequel de ces couples associe deux CMS libres ?</div><button class=\"opt\" data-o=\"0\">Wix et Joomla</button><button class=\"opt\" data-o=\"1\">Drupal et PrestaShop</button><button class=\"opt\" data-o=\"2\">Shopify et WordPress</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Le support d&#39;un CMS libre est assuré le plus souvent par :</div><button class=\"opt\" data-o=\"0\">le vendeur, avec un contrat obligatoire</button><button class=\"opt\" data-o=\"1\">la communauté, ou des entreprises spécialisées payantes</button><button class=\"opt\" data-o=\"2\">personne</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Quel critère de choix d&#39;un CMS mentionne Google Analytics et le live chat ?</div><button class=\"opt\" data-o=\"0\">Le prix</button><button class=\"opt\" data-o=\"1\">La vérification du fond du CMS (fonctions spécifiques)</button><button class=\"opt\" data-o=\"2\">L&#39;assistance</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" const CARTES=[{"n":"definition-avantages","k":0,"ch":"definition-avantages","q":"<p>Que signifie CMS ?</p>\n","r":"<p>Content Management System : système de gestion de contenu.</p>\n"},{"n":"definition-avantages","k":1,"ch":"definition-avantages","q":"<p>Définition d&#39;un CMS (version courte)</p>\n","r":"<p>Logiciel qui aide à créer, gérer et modifier le contenu d&#39;un site web sans connaissances techniques spécialisées.</p>\n"},{"n":"definition-avantages","k":2,"ch":"definition-avantages","q":"<p>Les 5 avantages d&#39;un CMS</p>\n","r":"<p>Séparation contenu/conception, autorisations d&#39;accès, gratuit ou peu coûteux, facile pour le référencement, simple et intuitif.</p>\n"},{"n":"definition-avantages","k":3,"ch":"definition-avantages","q":"<p>Que permet la séparation contenu / forme ?</p>\n","r":"<p>Modifier les textes sans toucher à l&#39;apparence, et changer le webdesign sans toucher au contenu.</p>\n"},{"n":"definition-avantages","k":4,"ch":"definition-avantages","q":"<p>Cite des profils d&#39;utilisateurs d&#39;un CMS</p>\n","r":"<p>Administrateur, éditeur, auteur, contributeur, abonné.</p>\n"},{"n":"definition-avantages","k":5,"ch":"definition-avantages","q":"<p>Un CMS, c&#39;est un site web ?</p>\n","r":"<p>Non. C&#39;est le logiciel qui sert à créer et gérer le site.</p>\n"},{"n":"proprietaire-libre","k":6,"ch":"proprietaire-libre","q":"<p>CMS propriétaire : définition</p>\n","r":"<p>CMS dont le code source appartient à une entreprise ou un individu et n&#39;est pas disponible publiquement. Licence ou abonnement souvent nécessaire.</p>\n"},{"n":"proprietaire-libre","k":7,"ch":"proprietaire-libre","q":"<p>CMS libre : définition</p>\n","r":"<p>CMS dont le code source est disponible publiquement : on peut l&#39;étudier, le modifier et le distribuer selon sa licence open source.</p>\n"},{"n":"proprietaire-libre","k":8,"ch":"proprietaire-libre","q":"<p>3 caractéristiques d&#39;un CMS libre</p>\n","r":"<p>Accès au code source, licences open source, communa     const L = String(t).split('\n');
    for (let i = L.length - 1; i >= Math.max(0, L.length - 3); i--) if (/^\s*M[ÉE]MO\s*:/i.test(L[i])) return L.slice(0, i).join('\n').trim();
    return String(t).trim();
  };
  // rendu léger : on échappe le HTML d'abord, puis gras, italique, code, titres, puces et blocs de code
  const inl = (s) => {
    const p = s.split('`'); if (p.length % 2 === 0) { const last = p.pop(); p[p.length - 1] += '`' + last; }
    return p.map((x, i) => i % 2 ? '<code>' + esc(x) + '</code>' : esc(x).replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*\w])\*([^*\n]+)\*(?![*\w])/g, '$1<em>$2</em>')).join('');
  };
  const md = (t) => {
    const out = []; let list = null, code = null;
    const flush = () => { if (list) { out.push('</' + list + '>'); list = null; } };
    String(t).split('\n').forEach((raw) => {
      if (/^\s*```/.test(raw)) { if (code === null) { flush(); code = []; } else { out.push('<pre>' + esc(code.join('\n')) + '</pre>'); code = null; } return; }
      if (code !== null) { code.push(raw); return; }
      let m;
      if ((m = raw.match(/^\s*#{1,6}\s+(.*)$/))) { flush(); out.push('<p><strong>' + inl(m[1]) + '</strong></p>'); }
      else if ((m = raw.match(/^\s*[-*•]\s+(.*)$/))) { if (list !== 'ul') { flush(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + inl(m[1]) + '</li>'); }
      else if ((m = raw.match(/^\s*\d+[.)]\s+(.*)$/))) { if (list !== 'ol') { flush(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + inl(m[1]) + '</li>'); }
      else if (!raw.trim()) flush();
      else { flush(); out.push('<p>' + inl(raw) + '</p>'); }
    });
    if (code !== null) out.push('<pre>' + esc(code.join('\n')) + '</pre>');
    flush(); return out.join('');
  };
  async function ask(q, deep) {
    q = (q || '').trim(); deep = deep || $('#mztDeep').checked;
    if (busy || !q) return; if (!sample) { note(); return; }
    const c = refreshCtx();
    if (!cur || (cur.sec !== c.label && !forced)) { cur = { id: 't' + Date.now().toString(36), sec: c.label, date: today(), title: q.slice(0, 80), msgs: [] }; ST.threads.push(cur); }
    else if (!ST.threads.includes(cur)) ST.threads.push(cur);
    cur.msgs.push({ r: 'u', t: q }); busy = true; renderLog();
    const out = document.createElement('div'); out.className = 'mzt-m a'; out.textContent = deep ? 'Réflexion approfondie…' : 'Réflexion…'; $('#mztLog').appendChild(out);
    $('#mztSend').disabled = true; $('#mztStop').hidden = false;
    const style = deep
      ? 'Réponse APPROFONDIE (400 à 700 mots) : 1) l\'intuition avec une analogie, 2) l\'explication détaillée pas à pas, 3) pourquoi ça marche, 4) un exemple complet chiffré, 5) les pièges fréquents et ce qui tombe à l\'examen, 6) une question pour vérifier la compréhension.'
      : 'Réponse EXPLICATIVE (150 à 250 mots) : 1) l\'idée en une phrase, 2) l\'explication pas à pas, 3) un petit exemple chiffré ou concret, 4) une courte question pour vérifier la compréhension.';
    const mem = [];
    if (ST.memos.length) mem.push('DIFFICULTÉS DÉJÀ REPÉRÉES :\n' + ST.memos.slice(-12).map((m) => `- ${m.date} : ${m.text}`).join('\n'));
    const lastQ = ST.threads.flatMap((t) => t.msgs.filter((m) => m.r === 'u').map((m) => `[${t.sec}] ${m.t.slice(0, 100)}`)).slice(-6);
    if (lastQ.length) mem.push('SES DERNIÈRES QUESTIONS :\n' + lastQ.map((x) => '- ' + x).join('\n'));
    const rules = `Tu es le tuteur de ${C.student}, pour le module ${C.module}${C.prof ? ' du ' + C.prof : ''}. Il apprend souvent la notion pour la première fois.
Règles : réponds en français simple, en Markdown léger (**gras** pour les termes clés, tirets, étapes numérotées, formules et calculs entre accents graves ; pas de tableaux). ${style} Appuie-toi d'abord sur l'EXTRAIT ci-dessous et sur les conventions du prof ; si une source générale diffère du cours, signale l'écart et dis quelle version utiliser à l'examen (celle du prof). Pour un calcul, pose chaque étape et vérifie-la. S'il envoie une réponse ou une photo de brouillon, corrige étape par étape et nomme précisément l'erreur. Si tu n'es pas sûr, dis-le. S'il demande un mini-exercice, donne l'exercice sans la solution.
Utilise sa mémoire pour faire des liens avec ses confusions passées, sans la réciter.
Termine TOUJOURS par une dernière ligne séparée au format exact « MÉMO: … » qui résume en 15 mots maximum la difficulté révélée par sa question (ou « MÉMO: rien »). Cette ligne lui est cachée.
${C.conventions ? 'CONVENTIONS DU PROF : ' + C.conventions + '\n' : ''}MÉMOIRE DE L'ÉLÈVE :
${mem.join('\n\n') || '(rien pour l\'instant)'}
EXTRAIT (${c.label}) :
${c.text.slice(0, deep ? 9000 : 3500)}`;
    const recent = cur.msgs.slice(deep ? -9 : -5, -1).map((m) => ({ role: m.r === 'u' ? 'user' : 'assistant', content: m.t }));
    while (recent.length && recent[0].role !== 'user') recent.shift();
    const msgs = [...recent.filter((m) => m.content && m.content.trim()), { role: 'user', content: q }]; while (msgs.length > 1 && msgs[0].role !== 'user') msgs.shift(); msgs[0] = { role: 'user', content: rules + '\n\n---\nQuestion : ' + msgs[0].content };
    ctl = new AbortController();
    const opts = { modelTier: deep ? 'complex' : 'quick', cache: false, signal: ctl.signal, onText: ({ text }) => { out.innerHTML = md(visible(text)); $('#mztLog').scrollTop = 1e9; } };
    if (img) opts.images = [img];
    try {
      const r = await sample(msgs, opts);
      const mm = r.text.match(/(?:^|\n)\s*M[ÉE]MO\s*:\s*(.+)\s*$/i);
      cur.msgs.push({ r: 'a', t: visible(r.text) + (r.truncated ? '\n\n(Réponse coupée : pose une question plus ciblée.)' : ''), d: !!deep });
      if (mm && !/^\s*rien/i.test(mm[1])) { ST.memos.push({ date: today(), text: mm[1].trim().slice(0, 160) }); if (ST.memos.length > 30) ST.memos.shift(); saveMemos(); }
      await saveThread(cur);
    } catch (e) {
      const kept = e && e.text ? visible(e.text) : '';
      if (e && e.code === 'cancelled') { if (kept) cur.msgs.push({ r: 'a', t: kept + '\n(Arrêté.)' }); else cur.msgs.pop(); }
      else { cur.msgs.pop(); out.textContent = (kept ? kept + '\n\n' : '') + (ERR[e && e.code] || 'Le tuteur n\'a pas pu répondre. Réessaie dans un instant.'); }
      if (!cur.msgs.length) ST.threads = ST.threads.filter((t) => t !== cur);
      saveLocal();
      if (!(e && e.code === 'cancelled')) { busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImgN').textContent = ''; return; }
    }
    busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImg').value = ''; $('#mztImgN').textContent = ''; renderLog();
  }

  // ---------- événements ----------
  $('#mztBtn').onclick = () => openPanel(null);
  $('#mztX').onclick = closePanel;
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#mztPan').hidden) closePanel(); });
  $('#mztTabH').onclick = () => view($('#mztHist').hidden ? 'hist' : 'chat');
  $('#mztTabM').onclick = () => view($('#mztMem').hidden ? 'mem' : 'chat');
  $('#mztQ').oninput = renderList;
  $('#mztList').onclick = (e) => { const id = e.target.dataset && e.target.dataset.cont; if (!id) return; cur = ST.threads.find((t) => t.id === id); view('chat'); $('#mztCtx').textContent = '· ' + cur.sec; renderLog(); };
  $('#mztMemL').onclick = (e) => { const i = e.target.dataset && e.target.dataset.memdel; if (i == null) return; ST.memos.splice(+i, 1); saveMemos(); renderMem(); };
  $('#mztChips').onclick = (e) => { const b = e.target.closest('[data-chip]'); if (!b) return; const t = $('#mztIn'); t.value = b.dataset.chip + (t.value ? ' : ' + t.value : ''); t.focus(); };
  $('#mztNew').onclick = () => { cur = null; renderLog(); };
  $('#mztStop').onclick = () => { if (ctl) ctl.abort(); };
  $('#mztImg').onchange = (e) => { img = e.target.files[0] || null; $('#mztImgN').textContent = img ? 'Photo : ' + img.name : ''; };
  $('#mztF').onsubmit = (e) => { e.preventDefault(); const v = $('#mztIn').value; $('#mztIn').value = ''; ask(v); };
  $('#mztIn').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#mztF').requestSubmit(); } });

  // ---------- capacités (facultatives) ----------
  const W = window.claude;
  if (W && W.use) {
    W.use('sample').then((s) => { sample = s; ready = true; note();
      if (s && s.limits) s.limits().then((l) => { if (l && l.images) { imgOK = true; $('#mztImgL').hidden = false; if (l.images.mediaTypes) $('#mztImg').accept = l.images.mediaTypes.join(','); } }).catch(() => {});
    }).catch(() => { ready = true; note(); });
    Promise.all([W.use('db'), W.use('user')]).then(async ([d, u]) => {
      if (!d || !u) return; const id = await u.id(); if (!id) return; db = d; base = 'data/users/' + id + '/mzt_' + C.id;
      try {
        const m = await db.doc(base).get(); if (m.exists) { const v = m.data() || {}; if (Array.isArray(v.memos)) ST.memos = JSON.parse(JSON.stringify(v.memos)); }
        const q = await db.collection(base + '/threads').get(); const remote = q.docs.map((x) => Object.assign({ id: x.id }, JSON.parse(JSON.stringify(x.data() || {}))));
        const map = {}; [...ST.threads, ...remote].forEach((t) => { if (!map[t.id] || (t.msgs || []).length > (map[t.id].msgs || []).length) map[t.id] = t; });
        ST.threads = Object.values(map).sort((a, b) => parseInt(a.id.slice(1), 36) - parseInt(b.id.slice(1), 36)); saveLocal();
      } catch (e) {}
    }).catch(() => {});
  } else { ready = true; note(); }

  window.MZT = { open: openPanel, close: closePanel };
})();

</script>
