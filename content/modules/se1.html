 une variable nommée var60.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Écris un script qui affiche son nom, le nombre d&#39;arguments, puis tous les arguments.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Quatre lignes : <code>#!/bin/bash<\/code>, puis <code>echo &quot;Nom du script : $0&quot;<\/code>, puis <code>echo &quot;Nombre d&#39;arguments : $#&quot;<\/code>, puis <code>echo &quot;Arguments : $@&quot;<\/code>. On termine par <code>exit 0<\/code>, on rend exécutable avec <code>chmod +x<\/code>, et on lance avec <code>./script a b c<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>On tape <code>x=5 ; bash<\/code>, puis dans le nouveau shell <code>echo $x<\/code>. Qu&#39;est-ce qui s&#39;affiche, et comment l&#39;éviter ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Rien : x est locale au shell père. Il fallait <code>export x<\/code> avant de lancer <code>bash<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 10 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quelle commande rend une variable accessible aux sous-shells ?<\/div><button class=\"opt\" data-o=\"0\"><code>export var<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>global var<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>publish var<\/code><\/button><button class=\"opt\" data-o=\"3\"><code>share var<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Dans les doubles quotes, quels caractères sont toujours interprétés ?<\/div><button class=\"opt\" data-o=\"0\"><code>&gt;<\/code>, <code>|<\/code>, <code>;<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>$<\/code>, <code>\\<\/code>, <code>&quot;<\/code>, <code>`<\/code><\/button><button class=\"opt\" data-o=\"2\">Tous<\/button><button class=\"opt\" data-o=\"3\">Aucun<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Quelle option de echo interprète <code>\\t<\/code> ?<\/div><button class=\"opt\" data-o=\"0\"><code>-n<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>-e<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>-x<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Quelle variable contient le PID du script en cours ?<\/div><button class=\"opt\" data-o=\"0\"><code>$$<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>$!<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>$?<\/code><\/button><button class=\"opt\" data-o=\"3\"><code>$PID<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Que vaut var après <code>var=10 ; var=$var+2<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">12<\/button><button class=\"opt\" data-o=\"1\">la chaîne 10+2<\/button><button class=\"opt\" data-o=\"2\">une erreur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Quelle écriture est correcte ?<\/div><button class=\"opt\" data-o=\"0\"><code>mois = janvier<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>mois=janvier<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>$mois=janvier<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\"><code>echo &#39;Total : $x&#39;<\/code> affiche :<\/div><button class=\"opt\" data-o=\"0\">Total : $x<\/button><button class=\"opt\" data-o=\"1\">Total : suivi de la valeur de x<\/button><button class=\"opt\" data-o=\"2\">rien<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Dans un script lancé par <code>./s a b c<\/code>, que vaut <code>$#<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">4<\/button><button class=\"opt\" data-o=\"1\">3<\/button><button class=\"opt\" data-o=\"2\">abc<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Pour multiplier avec expr, on écrit :<\/div><button class=\"opt\" data-o=\"0\"><code>expr 2 * 3<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>expr 2 \\* 3<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>expr 2*3<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Quel code retour signifie « succès » ?<\/div><button class=\"opt\" data-o=\"0\">0<\/button><button class=\"opt\" data-o=\"1\">1<\/button><button class=\"opt\" data-o=\"2\">255<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"shell-variables","rep":null,"tol":null},{"n":"shell-variables","rep":["8"],"tol":null},{"n":"shell-variables","rep":null,"tol":null},{"n":"shell-variables","rep":null,"tol":null},{"n":"shell-variables","rep":null,"tol":null}],"qcm":[{"n":"shell-variables","q":"Quelle commande rend une variable accessible aux sous-shells ?","o":["<code>export var<\/code>","<code>global var<\/code>","<code>publish var<\/code>","<code>share var<\/code>"],"a":0,"e":"Question 16 de l&#39;examen blanc."},{"n":"shell-variables","q":"Dans les doubles quotes, quels caractères sont toujours interprétés ?","o":["<code>&gt;<\/code>, <code>|<\/code>, <code>;<\/code>","<code>$<\/code>, <code>\\<\/code>, <code>&quot;<\/code>, <code>`<\/code>","Tous","Aucun"],"a":1,"e":"Question 17. Les simples quotes, elles, bloquent tout."},{"n":"shell-variables","q":"Quelle option de echo interprète <code>\\t<\/code> ?","o":["<code>-n<\/code>","<code>-e<\/code>","<code>-x<\/code>"],"a":1,"e":"Question 18. <code>-n<\/code> supprime le retour à la ligne."},{"n":"shell-variables","q":"Quelle variable contient le PID du script en cours ?","o":["<code>$$<\/code>","<code>$!<\/code>","<code>$?<\/code>","<code>$PID<\/code>"],"a":0,"e":"Question 19. <code>$!<\/code> = PID du dernier processus lancé en arrière-plan."},{"n":"shell-variables","q":"Que vaut var après <code>var=10 ; var=$var+2<\/code> ?","o":["12","la chaîne 10+2","une erreur"],"a":1,"e":"Le shell ne calcule pas sans <code>$(( ))<\/code>, <code>let<\/code> ou <code>expr<\/code>."},{"n":"shell-variables","q":"Quelle écriture est correcte ?","o":["<code>mois = janvier<\/code>","<code>mois=janvier<\/code>","<code>$mois=janvier<\/code>"],"a":1,"e":"Pas d&#39;espace, pas de <code>$<\/code> à l&#39;affectation."},{"n":"shell-variables","q":"<code>echo &#39;Total : $x&#39;<\/code> affiche :","o":["Total : $x","Total : suivi de la valeur de x","rien"],"a":0,"e":"Entre simples quotes, <code>$<\/code> n&#39;est pas interprété."},{"n":"shell-variables","q":"Dans un script lancé par <code>./s a b c<\/code>, que vaut <code>$#<\/code> ?","o":["4","3","abc"],"a":1,"e":"Trois arguments ; <code>$0<\/code> (le nom) n&#39;est pas compté."},{"n":"shell-variables","q":"Pour multiplier avec expr, on écrit :","o":["<code>expr 2 * 3<\/code>","<code>expr 2 \\* 3<\/code>","<code>expr 2*3<\/code>"],"a":1,"e":"Le <code>*<\/code> non échappé serait remplacé par les noms de fichiers ; et expr veut des espaces."},{"n":"shell-variables","q":"Quel code retour signifie « succès » ?","o":["0","1","255"],"a":0,"e":"Toute valeur différente de 0 indique une erreur."}]},{"id":"shell-controle","t":"Shell (2) · tests, if, case, boucles, fonctions, tableaux","seance":"Chapitre IV · Programmation shell (parties 6 à 10)","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu dois savoir qu&#39;une commande renvoie un <strong>code retour<\/strong> dans <code>$?<\/code>, 0 voulant dire succès (chapitre 8).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Après <code>ls /dossier_qui_nexiste_pas<\/code>, que vaut <code>$?<\/code> : 0 ou autre chose ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Autre chose (2 sous Linux) : la commande a échoué. Seul 0 signifie succès.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>En shell, une condition n&#39;est pas un booléen : c&#39;est <strong>une commande qui réussit (0) ou échoue<\/strong>. <code>if<\/code>, <code>while<\/code> et <code>until<\/code> exécutent une commande et regardent son code retour. <code>[ … ]<\/code> n&#39;est qu&#39;une commande parmi d&#39;autres (<code>test<\/code>).<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Oublier les espaces dans les crochets. <code>[$a -eq 5]<\/code> est une erreur ; on écrit <code>[ $a -eq 5 ]<\/code>, avec un espace après <code>[<\/code>, avant <code>]<\/code> et autour de l&#39;opérateur.<\/p>\n<\/aside><p>À la fin, tu sais écrire des tests sur fichiers, chaînes et nombres, des <code>if<\/code> / <code>case<\/code>, des boucles <code>for<\/code>, <code>while<\/code>, <code>until<\/code>, <code>select<\/code>, des fonctions avec <code>return<\/code> et <code>local<\/code>, et manipuler un tableau.<\/p>\n<h2>Idée 1 · La commande test<\/h2>\n<p><code>test expr<\/code> ou <code>[ expr ]<\/code> renvoie 0 si c&#39;est vrai, autre chose sinon.<\/p>\n<table>\n<tr><th>Fichiers<\/th><th>Chaînes<\/th><th>Nombres<\/th><\/tr>\n<tr><td><code>-a f<\/code> existe (<code>-e<\/code> aussi)<br><code>-f f<\/code> fichier ordinaire<br><code>-d f<\/code> répertoire<br><code>-L f<\/code> lien symbolique<br><code>-s f<\/code> taille non nulle<br><code>-r -w -x f<\/code> droits<\/td>\n<td><code>s1 = s2<\/code> égales<br><code>s1 != s2<\/code> différentes<br><code>-z s<\/code> vide<br><code>-n s<\/code> non vide<br><code>s1 \\&lt; s2<\/code> ordre<\/td>\n<td><code>-eq<\/code> égal<br><code>-ne<\/code> différent<br><code>-lt<\/code> &lt;<br><code>-le<\/code> ≤<br><code>-gt<\/code> &gt;<br><code>-ge<\/code> ≥<\/td><\/tr>\n<\/table><p>Logique : <code>-a<\/code> (et), <code>-o<\/code> (ou), <code>!<\/code> (non) à l&#39;intérieur des crochets. Exemple : <code>val=53 ; [ $val -gt 10 -a $val -lt 100 ] ; echo $?<\/code> affiche <strong>0<\/strong> (vrai).<\/p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Mets les variables <strong>entre guillemets<\/strong> : <code>[ &quot;$x&quot; = oui ]<\/code>. Si x est vide, <code>[ $x = oui ]<\/code> devient <code>[ = oui ]<\/code> et bash répond « unary operator expected » (vérifié, code 2). Avec les guillemets, on compare proprement <code>&quot;&quot;<\/code> à <code>oui<\/code> (code 1, faux).<\/p>\n<\/aside><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le cours dit que <code>test<\/code> est une commande externe. Dans bash, <code>type test<\/code> répond « test is a shell builtin » : c&#39;est une commande <strong>interne<\/strong> (il existe aussi un exécutable <code>/usr/bin/test<\/code>, mais bash utilise sa version intégrée).<\/p>\n<\/aside><h2>Idée 2 · if et case<\/h2>\n<figure class=\"flux\"><figcaption>if … elif … else<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">if [ cond1 ]<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">then instructions1<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">elif [ cond2 ]<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">then instructions2<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">else instructions3<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">fi<\/div><\/div><\/figure><p>Si <code>if<\/code> et <code>then<\/code> sont sur la même ligne, il faut un <code>;<\/code> : <code>if [ -d &quot;$1&quot; ]; then<\/code>. Forme courte : <code>cmd1 &amp;&amp; cmd2<\/code> (si cmd1 réussit), <code>cmd1 || cmd2<\/code> (si elle échoue), par exemple <code>cat main.c || touch main.c<\/code>.<\/p>\n<p>Exemple du cours (exercice 5), type d&#39;un fichier passé en argument :<\/p>\n<pre class=\"\"><code>#!/bin/bash\nif test -d &quot;$1&quot;\nthen echo &quot;c'est un répertoire&quot;\nelif test -L &quot;$1&quot;\nthen echo &quot;c'est un lien symbolique&quot;\nelse echo &quot;c'est un fichier ordinaire&quot;\nfi<\/code><\/pre><p><strong>case<\/strong> compare une valeur (comme chaîne) à des motifs shell (<code>*<\/code>, <code>?<\/code>, <code>[ ]<\/code>, alternatives avec <code>|<\/code>). Chaque cas finit par <code>;;<\/code>, le cas par défaut est <code>*)<\/code> en dernier, la fin est <code>esac<\/code>.<\/p>\n<pre class=\"\"><code>case &quot;$op&quot; in\n  &quot;+&quot;) r=$((a + b)) ;;\n  &quot;-&quot;) r=$((a - b)) ;;\n  &quot;*&quot;) r=$((a * b)) ;;\n  &quot;/&quot;|&quot;%&quot;) [ &quot;$b&quot; -eq 0 ] &amp;&amp; { echo &quot;division par zéro&quot; ; exit 1 ; } ; r=$((a $op b)) ;;\n  *) echo &quot;opérateur inconnu&quot; ; exit 1 ;;\nesac<\/code><\/pre><p><em>(extrait de la calculatrice du TD 4, condensé ; les guillemets autour de <code>&quot;*&quot;<\/code> empêchent qu&#39;il serve de cas par défaut)<\/em><\/p>\n<h2>Idée 3 · Les boucles<\/h2>\n<table>\n<tr><th>Boucle<\/th><th>Tourne…<\/th><th>Exemple<\/th><\/tr>\n<tr><td><code>for v in liste ; do … done<\/code><\/td><td>une fois par mot de la liste<\/td><td><code>for mois in janvier février mars<\/code><\/td><\/tr>\n<tr><td><code>for v ; do … done<\/code> ou <code>for v in \"$@\"<\/code><\/td><td>sur les arguments<\/td><td><code>for arg in \"$@\"<\/code><\/td><\/tr>\n<tr><td><code>for ((i=1; i&lt;=n; i++))<\/code><\/td><td>forme arithmétique (bash)<\/td><td>TD 5<\/td><\/tr>\n<tr><td><code>while cond ; do … done<\/code><\/td><td><b>tant que<\/b> cond réussit<\/td><td><code>while test $i -le 10<\/code><\/td><\/tr>\n<tr><td><code>until cond ; do … done<\/code><\/td><td><b>jusqu'à ce que<\/b> cond réussisse<\/td><td><code>until [ $count -lt 0 ]<\/code><\/td><\/tr>\n<tr><td><code>select v in liste ; do … done<\/code><\/td><td>affiche un menu numéroté<\/td><td>plat préféré : tajine, couscous, harira<\/td><\/tr>\n<\/table><p>Un mot entre guillemets compte pour <strong>une seule<\/strong> itération : <code>for m in janvier &quot;février mars&quot; avril<\/code> fait 3 tours (vérifié).<\/p>\n<p><code>break<\/code> sort de la boucle, <code>continue<\/code> passe au tour suivant, <code>exit n<\/code> arrête le script.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Dérouler l'exemple 2 du cours (continue)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Départ<\/div><p>i = 0. La condition <code>test $i -lt 6<\/code> est vraie.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · Tour 1<\/div><p>i devient 1. 1 % 2 = 1, pas de continue : affiche 1.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · Tour 2<\/div><p>i devient 2. 2 % 2 = 0 : continue, rien n&#39;est affiché.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · Tours suivants<\/div><p>3 affiché, 4 sauté, 5 affiché, 6 sauté.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · Fin<\/div><p>i = 6, la condition est fausse. Sortie : 1, 3, 5 (vérifié dans bash).<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p>Lire un fichier ligne par ligne : <code>while read ligne ; do echo &quot;$ligne&quot; ; done &lt; fiche<\/code>.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>L&#39;exemple <code>select<\/code> des diapos écrit <code>then ; break<\/code>. C&#39;est une erreur de syntaxe : rien ne doit séparer <code>then<\/code> de la commande par un <code>;<\/code>. Écris <code>then break<\/code> ou <code>then<\/code> puis <code>break<\/code> à la ligne.<\/p>\n<\/aside><h2>Idée 4 · Les fonctions<\/h2>\n<pre class=\"\"><code>pair_impair () {\n  if test `expr $1 % 2` -eq 0 ; then echo &quot;$1 est pair&quot;\n  else echo &quot;$1 est impair&quot;\n  fi\n}\nfor nb in &quot;$@&quot; ; do pair_impair $nb ; done<\/code><\/pre><p>Avec <code>./script 4 7<\/code> : « 4 est pair », « 7 est impair » (vérifié).<\/p>\n<ul>\n<li>Déclarer <strong>avant<\/strong> d&#39;appeler ; appeler comme une commande : <code>nom arg1 arg2<\/code>.<\/li>\n<li>Dans la fonction, <code>$1<\/code>, <code>$#<\/code>, <code>$@<\/code> désignent <strong>ses<\/strong> arguments ; <code>$0<\/code> reste le nom du script.<\/li>\n<li><code>return n<\/code> (0 à 255) fixe le code retour, lu dans <code>$?<\/code>. Pour « renvoyer » une valeur, on fait <code>echo<\/code> et on capture avec <code>r=$(fonction 5)<\/code>.<\/li>\n<li>Pas de sous-shell : les variables sont <strong>globales<\/strong> par défaut ; <code>local j=8<\/code> rend j locale. Un <code>exit<\/code> dans une fonction arrête tout le script.<\/li>\n<\/ul>\n<p>Exemple du cours avec <code>i=0 ; j=0<\/code> : dans <code>modif<\/code>, <code>i=5<\/code> et <code>local j=8<\/code>. Après l&#39;appel : <strong>i = 5, j = 0<\/strong> (vérifié).<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le TD 5 (exercice 3) compte les appels de <code>fibonacci<\/code> dans une variable globale et annonce « 25 appels » pour n = 6. Dans bash, le script affiche en fait <strong>0<\/strong> : chaque appel passe par <code>$(fibonacci …)<\/code>, donc dans un <strong>sous-shell<\/strong>, et l&#39;incrément du compteur meurt avec lui (vérifié). Le vrai nombre d&#39;appels pour F(6) est bien 25, mais il faudrait appeler la fonction sans <code>$( )<\/code> (résultat dans une variable globale) pour le compter.<\/p>\n<\/aside><h2>Idée 5 · Les tableaux<\/h2>\n<svg viewBox=\"0 0 640 120\" style=\"width:100%;max-width:640px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Tableau notes avec indices 0 à 5 et valeurs 12 15 8 17 14 9\">\n<g font-family=\"monospace\" font-size=\"16\" text-anchor=\"middle\" fill=\"currentColor\">\n<text x=\"45\" y=\"62\" font-family=\"sans-serif\" font-size=\"13\">notes<\/text>\n<rect x=\"90\" y=\"40\" width=\"80\" height=\"36\" fill=\"none\" stroke=\"currentColor\"/><text x=\"130\" y=\"64\">12<\/text>\n<rect x=\"170\" y=\"40\" width=\"80\" height=\"36\" fill=\"none\" stroke=\"currentColor\"/><text x=\"210\" y=\"64\">15<\/text>\n<rect x=\"250\" y=\"40\" width=\"80\" height=\"36\" fill=\"#D9824F\" fill-opacity=\"0.25\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"290\" y=\"64\">8<\/text>\n<rect x=\"330\" y=\"40\" width=\"80\" height=\"36\" fill=\"none\" stroke=\"currentColor\"/><text x=\"370\" y=\"64\">17<\/text>\n<rect x=\"410\" y=\"40\" width=\"80\" height=\"36\" fill=\"none\" stroke=\"currentColor\"/><text x=\"450\" y=\"64\">14<\/text>\n<rect x=\"490\" y=\"40\" width=\"80\" height=\"36\" fill=\"none\" stroke=\"currentColor\"/><text x=\"530\" y=\"64\">9<\/text>\n<g font-size=\"12\"><text x=\"130\" y=\"30\">0<\/text><text x=\"210\" y=\"30\">1<\/text><text x=\"290\" y=\"30\">2<\/text><text x=\"370\" y=\"30\">3<\/text><text x=\"450\" y=\"30\">4<\/text><text x=\"530\" y=\"30\">5<\/text><\/g>\n<text x=\"290\" y=\"100\" font-size=\"13\" fill=\"#D9824F\">${notes[2]} = 8<\/text>\n<\/g>\n<\/svg><table>\n<tr><th>Écriture<\/th><th>Sens<\/th><\/tr>\n<tr><td><code>notes=(12 15 8 17 14 9)<\/code><\/td><td>déclarer et remplir<\/td><\/tr>\n<tr><td><code>${notes[2]}<\/code><\/td><td>un élément (indices à partir de 0) ; <code>${notes}<\/code> = <code>${notes[0]}<\/code><\/td><\/tr>\n<tr><td><code>${notes[@]}<\/code> ou <code>${notes[*]}<\/code><\/td><td>tous les éléments<\/td><\/tr>\n<tr><td><code>${#notes[@]}<\/code><\/td><td>nombre d'éléments<\/td><\/tr>\n<tr><td><code>${!notes[@]}<\/code><\/td><td>la liste des indices<\/td><\/tr>\n<tr><td><code>${#notes[2]}<\/code><\/td><td>longueur du 3e élément<\/td><\/tr>\n<tr><td><code>notes+=(16)<\/code><\/td><td>ajouter à la fin<\/td><\/tr>\n<tr><td><code>unset notes[2]<\/code> / <code>unset notes<\/code><\/td><td>supprimer un élément / tout le tableau<\/td><\/tr>\n<\/table><p>Exemple chiffré : somme = 12 + 15 + 8 + 17 + 14 + 9 = 75, moyenne entière <code>$((75 / 6))<\/code> = <strong>12<\/strong>. Après <code>unset notes[2]<\/code>, les indices sont 0 1 3 4 5 : il y a un trou. <code>notes=(&quot;${notes[@]}&quot;)<\/code> renumérote de 0 à 4.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices du cours, des TD 4-5 et du TP 4<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Écris un script qui crée le répertoire passé en argument s&#39;il n&#39;existe pas.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>if test ! -d &quot;$1&quot;<\/code> puis <code>then mkdir &quot;$1&quot;<\/code> puis <code>fi<\/code>. Forme courte : <code>[ -d &quot;$1&quot; ] || mkdir &quot;$1&quot;<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Combien de nombres affiche <code>count=10 ; until [ $count -lt 0 ] ; do echo $count ; count=$((count - 1)) ; done<\/code> ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 11<\/b><\/p><p>De 10 jusqu&#39;à 0 inclus : <strong>11<\/strong> nombres. La boucle s&#39;arrête quand count vaut −1.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Écris le test « mention » du TP 4 pour 12 ≤ note &lt; 14.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>elif [ $note -ge 12 -a $note -lt 14 ]<\/code> puis <code>then echo &quot;Assez bien&quot;<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Avec <code>tab=(a bb ccc)<\/code>, que valent <code>${#tab[@]}<\/code> et <code>${#tab[2]}<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>${#tab[@]}<\/code> = 3 (trois éléments) et <code>${#tab[2]}<\/code> = 3 (« ccc » a trois caractères). Vérifié.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 10 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quelle boucle itère sur une liste explicite comme jan fev mar ?<\/div><button class=\"opt\" data-o=\"0\">while<\/button><button class=\"opt\" data-o=\"1\">for<\/button><button class=\"opt\" data-o=\"2\">until<\/button><button class=\"opt\" data-o=\"3\">select<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\"><code>[ $a -lt 10 ]<\/code> est vrai si :<\/div><button class=\"opt\" data-o=\"0\">a est strictement inférieur à 10<\/button><button class=\"opt\" data-o=\"1\">a est inférieur ou égal à 10<\/button><button class=\"opt\" data-o=\"2\">a est différent de 10<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Quelle écriture est correcte ?<\/div><button class=\"opt\" data-o=\"0\"><code>[$x -eq 3]<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>[ $x -eq 3 ]<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>[ $x-eq3 ]<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\"><code>[ -f fiche ]<\/code> est vrai si :<\/div><button class=\"opt\" data-o=\"0\">fiche est un répertoire<\/button><button class=\"opt\" data-o=\"1\">fiche est un fichier ordinaire<\/button><button class=\"opt\" data-o=\"2\">fiche est vide<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Dans <code>case<\/code>, chaque bloc d&#39;instructions se termine par :<\/div><button class=\"opt\" data-o=\"0\"><code>;<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>;;<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>esac<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Combien de tours fait <code>for m in janvier &quot;février mars&quot; avril<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">4<\/button><button class=\"opt\" data-o=\"1\">3<\/button><button class=\"opt\" data-o=\"2\">1<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Avec <code>i=0 ; j=0<\/code>, la fonction fait <code>i=5 ; local j=8<\/code>. Après l&#39;appel :<\/div><button class=\"opt\" data-o=\"0\">i = 5 et j = 0<\/button><button class=\"opt\" data-o=\"1\">i = 0 et j = 0<\/button><button class=\"opt\" data-o=\"2\">i = 5 et j = 8<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Comment une fonction peut-elle rendre un résultat numérique de 120 ?<\/div><button class=\"opt\" data-o=\"0\"><code>return 120<\/code> puis le lire dans <code>$1<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>echo 120<\/code>, puis <code>r=$(fonction)<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>export 120<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\"><code>${#tab[@]}<\/code> donne :<\/div><button class=\"opt\" data-o=\"0\">le premier élément<\/button><button class=\"opt\" data-o=\"1\">le nombre d&#39;éléments<\/button><button class=\"opt\" data-o=\"2\">la liste des indices<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Que fait <code>continue<\/code> dans une boucle ?<\/div><button class=\"opt\" data-o=\"0\">Arrête le script<\/button><button class=\"opt\" data-o=\"1\">Sort de la boucle<\/button><button class=\"opt\" data-o=\"2\">Passe directement à l&#39;itération suivante<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"shell-controle","rep":null,"tol":null},{"n":"shell-controle","rep":null,"tol":null},{"n":"shell-controle","rep":["11"],"tol":null},{"n":"shell-controle","rep":null,"tol":null},{"n":"shell-controle","rep":null,"tol":null}],"qcm":[{"n":"shell-controle","q":"Quelle boucle itère sur une liste explicite comme jan fev mar ?","o":["while","for","until","select"],"a":1,"e":"Question 20 de l&#39;examen blanc."},{"n":"shell-controle","q":"<code>[ $a -lt 10 ]<\/code> est vrai si :","o":["a est strictement inférieur à 10","a est inférieur ou égal à 10","a est différent de 10"],"a":0,"e":"lt = lower than, strictement. <code>-le<\/code> = inférieur ou égal."},{"n":"shell-controle","q":"Quelle écriture est correcte ?","o":["<code>[$x -eq 3]<\/code>","<code>[ $x -eq 3 ]<\/code>","<code>[ $x-eq3 ]<\/code>"],"a":1,"e":"Espaces après <code>[<\/code>, avant <code>]<\/code> et autour de l&#39;opérateur."},{"n":"shell-controle","q":"<code>[ -f fiche ]<\/code> est vrai si :","o":["fiche est un répertoire","fiche est un fichier ordinaire","fiche est vide"],"a":1,"e":"<code>-d<\/code> répertoire, <code>-s<\/code> taille non nulle."},{"n":"shell-controle","q":"Dans <code>case<\/code>, chaque bloc d&#39;instructions se termine par :","o":["<code>;<\/code>","<code>;;<\/code>","<code>esac<\/code>"],"a":1,"e":"<code>esac<\/code> ferme toute la structure."},{"n":"shell-controle","q":"Combien de tours fait <code>for m in janvier &quot;février mars&quot; avril<\/code> ?","o":["4","3","1"],"a":1,"e":"Ce qui est entre guillemets compte pour un seul élément."},{"n":"shell-controle","q":"Avec <code>i=0 ; j=0<\/code>, la fonction fait <code>i=5 ; local j=8<\/code>. Après l&#39;appel :","o":["i = 5 et j = 0","i = 0 et j = 0","i = 5 et j = 8"],"a":0,"e":"Variables globales par défaut ; <code>local<\/code> protège j."},{"n":"shell-controle","q":"Comment une fonction peut-elle rendre un résultat numérique de 120 ?","o":["<code>return 120<\/code> puis le lire dans <code>$1<\/code>","<code>echo 120<\/code>, puis <code>r=$(fonction)<\/code>","<code>export 120<\/code>"],"a":1,"e":"<code>return<\/code> ne transmet qu&#39;un code (0 à 255) lu dans <code>$?<\/code>. Pour une vraie valeur, on affiche et on capture."},{"n":"shell-controle","q":"<code>${#tab[@]}<\/code> donne :","o":["le premier élément","le nombre d&#39;éléments","la liste des indices"],"a":1,"e":"Les indices, c&#39;est <code>${!tab[@]}<\/code>."},{"n":"shell-controle","q":"Que fait <code>continue<\/code> dans une boucle ?","o":["Arrête le script","Sort de la boucle","Passe directement à l&#39;itération suivante"],"a":2,"e":"<code>break<\/code> sort, <code>exit<\/code> arrête le script."}]},{"id":"td-tp-corriges","t":"TD 1 à 5 et TP 1 à 4 corrigés","seance":"Séries de TD et de TP du Pr El Amrani","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Ce chapitre suppose les chapitres 3 à 9 lus. Il reprend les exercices types des séries, avec une correction vérifiée.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Sans regarder : quelle commande crée <code>a/b/c<\/code> d&#39;un coup, même si <code>a<\/code> n&#39;existe pas ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : mkdir -p a/b/c<\/b><\/p><p><code>mkdir -p a/b/c<\/code>.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Fais chaque exercice <strong>dans un vrai terminal<\/strong> avant d&#39;ouvrir le corrigé. En TP, le prof relève le compte rendu sur Google Classroom : il veut les commandes <strong>et<\/strong> la sortie obtenue.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Recopier une correction sans la tester. Plusieurs corrections des séries contiennent des erreurs (signalées plus bas) : ta machine est le seul juge.<\/p>\n<\/aside><p>À la fin, tu as refait les exercices types de chaque série et tu connais les pièges des corrections.<\/p>\n<h2>Idée 1 · Carte des séries<\/h2>\n<table>\n<tr><th>Série<\/th><th>Contenu<\/th><th>Chapitre<\/th><\/tr>\n<tr><td>TD 1 / TP 1<\/td><td>chemins, liens, regex, utilisateurs et groupes, droits d'un projet, vi<\/td><td>3, 4, 5, 6<\/td><\/tr>\n<tr><td>TD 2 / TP 2<\/td><td>arborescence, fichiers, tar/gzip/zip, chmod, umask<\/td><td>5, 6<\/td><\/tr>\n<tr><td>TD 3 / TP 3<\/td><td>redirections, filtres (cut, grep, awk, sed, sort), processus et jobs<\/td><td>7<\/td><\/tr>\n<tr><td>TD 4 / TP 4<\/td><td>calculatrice, paramètres spéciaux, if, case, boucles<\/td><td>8, 9<\/td><\/tr>\n<tr><td>TD 5 / TP 4<\/td><td>tableaux, fonctions itératives et récursives<\/td><td>9<\/td><\/tr>\n<\/table><h2>Idée 2 · Les erreurs relevées dans les corrections<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Ce qu'il faut corriger dans les corrigés distribués<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/7 · TD 1, ex. 3, q. 1<\/div><p><code>ls rapport_*.txt<\/code> ne liste pas rapport_2022 (c&#39;est un .bak). Résultat : 4 fichiers.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/7 · TD 1, ex. 5, q. 4<\/div><p><code>chmod u+rw,go+r<\/code> ajoute sans retirer : il n&#39;est équivalent à 644 que si le fichier n&#39;avait pas d&#39;autres droits. Préférer <code>u=rw,go=r<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/7 · TD 1, ex. 5, q. 6<\/div><p>l&#39;énoncé demande l&#39;exécution pour le propriétaire : <code>chmod 744<\/code>, pas 644.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/7 · TD 2, ex. 2, q. 9<\/div><p><code>rm -f projet1/temp<\/code> échoue sur un répertoire : <code>rmdir<\/code> ou <code>rm -r<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/7 · TD 3, ex. 2, q. 7<\/div><p>la correction parle de <code>gsub<\/code> (awk) alors que la commande montrée est <code>sed &#39;s/ /_/g&#39;<\/code>. La commande sed est la bonne réponse.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">6/7 · TD 5, ex. 3<\/div><p>le compteur d&#39;appels de fibonacci affiche 0, pas 25 (incrément perdu dans les sous-shells <code>$( )<\/code>).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">7/7 · Examen blanc, q. 35<\/div><p><code>for ligne in $(head -n 3 f)<\/code> parcourt des <strong>mots<\/strong>, pas des lignes (voir chapitre suivant).<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>TD 1 · liens (exercice 2)<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Après <code>echo &quot;Contenu&quot; &gt; fichier.txt ; ln fichier.txt lien_dur ; ln -s fichier.txt lien_symbolique<\/code>, on fait <code>echo &quot;nouveau&quot; &gt; lien_dur<\/code>. Que contient fichier.txt ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>« nouveau » : lien_dur et fichier.txt sont deux noms du même inode, donc du même contenu.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Puis <code>rm fichier.txt<\/code>. Que donnent <code>cat lien_dur<\/code> et <code>cat lien_symbolique<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>cat lien_dur<\/code> affiche « nouveau » (les données ont encore un lien). <code>cat lien_symbolique<\/code> : « No such file or directory », le lien est cassé.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>TD 2 · fichiers et archives<\/h3><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Déplace <code>projet1/docs/rapport.txt<\/code> dans <code>archives/<\/code> en le renommant <code>rapport_projet1.txt<\/code>.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>mv projet1/docs/rapport.txt archives/rapport_projet1.txt<\/code> (un seul mv déplace et renomme).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Écris dans <code>projet1/notes.txt<\/code> deux lignes en une seule commande.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Avec un here document : <code>cat &gt; projet1/notes.txt &lt;&lt; EOF<\/code>, puis les deux lignes, puis <code>EOF<\/code>. Ou <code>printf &quot;Projet en cours\\nDernière mise à jour : 2025-12-05\\n&quot; &gt; projet1/notes.txt<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>Affiche les lignes de log.txt contenant [ERROR] ou [WARNING].<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>grep &quot;\\[ERROR\\]\\|\\[WARNING\\]&quot; projet1/log.txt<\/code> (les crochets sont échappés car ce sont des métacaractères ; <code>\\|<\/code> est le « ou » de grep GNU). Ou <code>grep -E &quot;\\[(ERROR|WARNING)\\]&quot;<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><p>Crée logs.zip avec log.txt et notes.txt, liste-le, puis extrais-le dans archives/.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>zip logs.zip projet1/log.txt projet1/notes.txt<\/code>, puis <code>unzip -l logs.zip<\/code>, puis <code>unzip logs.zip -d archives/<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>TD 3 · redirections et filtres<\/h3><div class=\"ex\" data-x=\"7\"><div class=\"ex-q\"><p>Compte les lignes de donnees.txt (7 noms) et ne garde que le nombre dans comptage.txt.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 7<\/b><\/p><p><code>wc -l &lt; donnees.txt &gt; comptage.txt<\/code>. Le fichier contient <strong>7<\/strong> (sans le nom du fichier, grâce à <code>&lt;<\/code>).<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"8\"><div class=\"ex-q\"><p>Combien de noms uniques après <code>sort -u donnees.txt<\/code> (Alice, Bob, Charlie, Alice, David, Bob, Eve) ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 5<\/b><\/p><p>Alice, Bob, Charlie, David, Eve : <strong>5<\/strong>.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"9\"><div class=\"ex-q\"><p>Âge moyen (entier) des informaticiens du CSV : Dupont 34, Lefevre 45, Durand 37 ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 38<\/b><\/p><p><code>grep &quot;,Informatique,&quot; utilisateurs.csv | awk -F&#39;,&#39; &#39;{s += $3 ; n++} END {print int(s/n)}&#39;<\/code> : 116 / 3 = 38,67, donc <strong>38<\/strong>.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"10\"><div class=\"ex-q\"><p>Lance <code>sleep 120 &amp;<\/code>. Que signifie <code>[1] 12345<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>[1]<\/code> : numéro de job dans ce shell. <code>12345<\/code> : PID du processus (il change à chaque fois).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>TD 4, TD 5 et TP 4 · scripts<\/h3><div class=\"ex\" data-x=\"11\"><div class=\"ex-q\"><p>Dans la calculatrice du TD 4, comment vérifier qu&#39;une saisie est un entier (éventuellement négatif) ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>if ! [[ &quot;$a&quot; =~ ^-?[0-9]+$ ]] ; then echo &quot;pas un entier&quot; ; exit 1 ; fi<\/code>. <code>[[ … =~ … ]]<\/code> compare à une regex ERE (bash).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"12\"><div class=\"ex-q\"><p>Que donne la calculatrice pour 15 / 4 ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 3<\/b><\/p><p><strong>3<\/strong> : la division du shell est entière.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"13\"><div class=\"ex-q\"><p>Écris la factorielle itérative du TD 5.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>factorielle () { local n=$1 ; local r=1 ; for ((i=1; i&lt;=n; i++)) ; do r=$((r * i)) ; done ; echo $r ; }<\/code> puis <code>f=$(factorielle 5)<\/code> donne 120.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"14\"><div class=\"ex-q\"><p>Version récursive ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>fact () { if (( $1 == 0 )) ; then echo 1 ; return ; fi ; local p=$(fact $(( $1 - 1 ))) ; echo $(( $1 * p )) ; }<\/code>. <code>fact 6<\/code> donne 720.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>TP 1 · éditeur vi<\/h3><div class=\"ex\" data-x=\"15\"><div class=\"ex-q\"><p>Dans config.txt ouvert avec vim, remplace tous les « true » par « false », puis enregistre et quitte.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>:%s/true/false/g<\/code> puis <code>:wq<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"16\"><div class=\"ex-q\"><p>Sans éditeur, change PORT=8080 en PORT=3000.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>sed -i &#39;s/PORT=8080/PORT=3000/&#39; config.txt<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\"><code>ls rapport_*.txt<\/code> parmi rapport_2020.txt, rapport_2022.bak, rapport_final.txt, backup.rapport liste :<\/div><button class=\"opt\" data-o=\"0\">rapport_2020.txt et rapport_final.txt<\/button><button class=\"opt\" data-o=\"1\">les quatre fichiers<\/button><button class=\"opt\" data-o=\"2\">rapport_2020.txt, rapport_2022.bak et rapport_final.txt<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Les fichiers de src/ doivent être lisibles par tous et exécutables par le propriétaire seul :<\/div><button class=\"opt\" data-o=\"0\"><code>chmod 644<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>chmod 744<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>chmod 755<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Quelle commande supprime le répertoire vide temp ?<\/div><button class=\"opt\" data-o=\"0\"><code>rm -f temp<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>rmdir temp<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>rm temp<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\"><code>wc -l &lt; donnees.txt<\/code> affiche :<\/div><button class=\"opt\" data-o=\"0\">seulement le nombre de lignes<\/button><button class=\"opt\" data-o=\"1\">le nombre suivi du nom du fichier<\/button><button class=\"opt\" data-o=\"2\">le contenu du fichier<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Combien vaut <code>$((15 / 4))<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">3,75<\/button><button class=\"opt\" data-o=\"1\">3<\/button><button class=\"opt\" data-o=\"2\">4<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Dans le TD 5, pourquoi le compteur de fibonacci reste à 0 ?<\/div><button class=\"opt\" data-o=\"0\">Chaque appel <code>$(fibonacci …)<\/code> tourne dans un sous-shell<\/button><button class=\"opt\" data-o=\"1\"><code>local<\/code> remet le compteur à 0<\/button><button class=\"opt\" data-o=\"2\">La récursion n&#39;est pas permise en bash<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\"><code>kill %1<\/code> envoie :<\/div><button class=\"opt\" data-o=\"0\">SIGTERM au job numéro 1<\/button><button class=\"opt\" data-o=\"1\">SIGKILL au PID 1<\/button><button class=\"opt\" data-o=\"2\">un signal au processus systemd<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Pour ramener le job 2 au premier plan :<\/div><button class=\"opt\" data-o=\"0\"><code>bg %2<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>fg %2<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>jobs 2<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\"><code>unzip logs.zip -d archives/<\/code> :<\/div><button class=\"opt\" data-o=\"0\">extrait le contenu de logs.zip dans archives/<\/button><button class=\"opt\" data-o=\"1\">supprime logs.zip<\/button><button class=\"opt\" data-o=\"2\">liste le contenu<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Dans le TP 1, <code>:%s/true/false/g<\/code> dans vim :<\/div><button class=\"opt\" data-o=\"0\">remplace toutes les occurrences dans tout le fichier<\/button><button class=\"opt\" data-o=\"1\">remplace seulement la première ligne<\/button><button class=\"opt\" data-o=\"2\">supprime les lignes contenant true<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"td-tp-corriges","rep":["mkdir -p a/b/c"],"tol":null},{"n":"td-tp-corriges","rep":null,"tol":null},{"n":"td-tp-corriges","rep":null,"tol":null},{"n":"td-tp-corriges","rep":null,"tol":null},{"n":"td-tp-corriges","rep":null,"tol":null},{"n":"td-tp-corriges","rep":null,"tol":null},{"n":"td-tp-corriges","rep":null,"tol":null},{"n":"td-tp-corriges","rep":["7"],"tol":null},{"n":"td-tp-corriges","rep":["5"],"tol":null},{"n":"td-tp-corriges","rep":["38"],"tol":null},{"n":"td-tp-corriges","rep":null,"tol":null},{"n":"td-tp-corriges","rep":null,"tol":null},{"n":"td-tp-corriges","rep":["3"],"tol":null},{"n":"td-tp-corriges","rep":null,"tol":null},{"n":"td-tp-corriges","rep":null,"tol":null},{"n":"td-tp-corriges","rep":null,"tol":null},{"n":"td-tp-corriges","rep":null,"tol":null}],"qcm":[{"n":"td-tp-corriges","q":"<code>ls rapport_*.txt<\/code> parmi rapport_2020.txt, rapport_2022.bak, rapport_final.txt, backup.rapport liste :","o":["rapport_2020.txt et rapport_final.txt","les quatre fichiers","rapport_2020.txt, rapport_2022.bak et rapport_final.txt"],"a":0,"e":"Le nom doit commencer par « rapport_ » et finir par « .txt »."},{"n":"td-tp-corriges","q":"Les fichiers de src/ doivent être lisibles par tous et exécutables par le propriétaire seul :","o":["<code>chmod 644<\/code>","<code>chmod 744<\/code>","<code>chmod 755<\/code>"],"a":1,"e":"rwxr--r--. 755 donnerait aussi l&#39;exécution au groupe et aux autres."},{"n":"td-tp-corriges","q":"Quelle commande supprime le répertoire vide temp ?","o":["<code>rm -f temp<\/code>","<code>rmdir temp<\/code>","<code>rm temp<\/code>"],"a":1,"e":"<code>rm<\/code> sans <code>-r<\/code> refuse les répertoires."},{"n":"td-tp-corriges","q":"<code>wc -l &lt; donnees.txt<\/code> affiche :","o":["seulement le nombre de lignes","le nombre suivi du nom du fichier","le contenu du fichier"],"a":0,"e":"Avec <code>&lt;<\/code>, wc ne connaît pas le nom du fichier."},{"n":"td-tp-corriges","q":"Combien vaut <code>$((15 / 4))<\/code> ?","o":["3,75","3","4"],"a":1,"e":"Division entière."},{"n":"td-tp-corriges","q":"Dans le TD 5, pourquoi le compteur de fibonacci reste à 0 ?","o":["Chaque appel <code>$(fibonacci …)<\/code> tourne dans un sous-shell","<code>local<\/code> remet le compteur à 0","La récursion n&#39;est pas permise en bash"],"a":0,"e":"Les modifications d&#39;un sous-shell ne remontent jamais au shell père."},{"n":"td-tp-corriges","q":"<code>kill %1<\/code> envoie :","o":["SIGTERM au job numéro 1","SIGKILL au PID 1","un signal au processus systemd"],"a":0,"e":"<code>%1<\/code> désigne un job du shell ; le signal par défaut est SIGTERM (15)."},{"n":"td-tp-corriges","q":"Pour ramener le job 2 au premier plan :","o":["<code>bg %2<\/code>","<code>fg %2<\/code>","<code>jobs 2<\/code>"],"a":1,"e":"fg = foreground."},{"n":"td-tp-corriges","q":"<code>unzip logs.zip -d archives/<\/code> :","o":["extrait le contenu de logs.zip dans archives/","supprime logs.zip","liste le contenu"],"a":0,"e":"<code>-d<\/code> précise le dossier de destination ; <code>-l<\/code> liste."},{"n":"td-tp-corriges","q":"Dans le TP 1, <code>:%s/true/false/g<\/code> dans vim :","o":["remplace toutes les occurrences dans tout le fichier","remplace seulement la première ligne","supprime les lignes contenant true"],"a":0,"e":"<code>%<\/code> = toutes les lignes, <code>g<\/code> = toutes les occurrences de chaque ligne."}]},{"id":"revision-examen-blanc","t":"Révision et examen blanc","seance":"Examen blanc du Pr El Amrani (TD 6) · 1 h 30","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Ce chapitre reprend l&#39;<strong>examen blanc distribué par le prof<\/strong> (TD 6, corrigé le 29 décembre 2025). Il faut avoir fait les QCM des chapitres 1 à 9.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Combien vaut une question de cours à l&#39;examen blanc, et combien y en a-t-il ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>20 questions à réponse unique (QCU), 0,4 point chacune : <strong>8 points<\/strong> sur 20.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Le barème de l&#39;examen blanc : QCU 8 pts, exercices 1 à 4 (2 pts chacun) sur chemins/liens/regex, utilisateurs/fichiers, archives/droits/redirections, processus, puis <strong>un script de 4 pts<\/strong>. Passe 20 minutes maximum sur les QCU pour garder du temps pour le script.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Écrire des commandes approximatives. À l&#39;écrit, une option fausse (<code>-G<\/code> au lieu de <code>-aG<\/code>, <code>tar -cf<\/code> au lieu de <code>-czf<\/code>) coûte toute la question. Apprends les formes exactes.<\/p>\n<\/aside><p>À la fin, tu as fait l&#39;examen blanc dans les conditions et tu sais écrire le script final sans le piège de la boucle <code>for<\/code>.<\/p>\n<h2>Idée 1 · Les formes exactes à connaître par cœur<\/h2>\n<table>\n<tr><th>Question<\/th><th>Réponse<\/th><\/tr>\n<tr><td>Lien symbolique « rapport » vers /home/etu/docs/rapport.pdf<\/td><td><code>ln -s /home/etu/docs/rapport.pdf rapport<\/code><\/td><\/tr>\n<tr><td>Regex : commence par Erreur, finit par un chiffre<\/td><td><code>^Erreur.*[0-9]$<\/code><\/td><\/tr>\n<tr><td>Utilisateur dev1 : home, bash, groupe principal dev<\/td><td><code>useradd -m -s /bin/bash -g dev dev1<\/code><\/td><\/tr>\n<tr><td>Ajouter dev1 à sudo sans perdre ses groupes<\/td><td><code>usermod -aG sudo dev1<\/code><\/td><\/tr>\n<tr><td>Chemin absolu du répertoire courant<\/td><td><code>pwd<\/code><\/td><\/tr>\n<tr><td>Archiver et compresser /var/log<\/td><td><code>tar -czf logs.tar.gz /var/log<\/code><\/td><\/tr>\n<tr><td>chmod 640<\/td><td><code>rw-r-----<\/code><\/td><\/tr>\n<tr><td>grep sans les erreurs<\/td><td><code>grep \"404\" access.log 2&gt;/dev/null<\/code><\/td><\/tr>\n<tr><td>5 dernières lignes en temps réel<\/td><td><code>tail -n 5 -f data.csv<\/code><\/td><\/tr>\n<tr><td>Tuer tous les python<\/td><td><code>killall python<\/code> ou <code>pkill python<\/code><\/td><\/tr>\n<\/table><h2>Idée 2 · Le script de l&#39;examen (question 35)<\/h2>\n<p>Consigne : <code>analyse.sh<\/code> prend un nom de fichier, vérifie qu&#39;il existe et est lisible, affiche le nombre de lignes et le nombre de lignes contenant « erreur » (sans casse), puis les 3 premières lignes numérotées avec une boucle <code>for<\/code>.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Construire le script<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Contrôler les arguments<\/div><p><code>if [ $# -ne 1 ]; then echo &quot;Usage: $0 &lt;fichier&gt;&quot;; exit 1; fi<\/code><\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · Contrôler le fichier<\/div><p><code>if [ ! -f &quot;$fichier&quot; ] || [ ! -r &quot;$fichier&quot; ]; then … exit 2; fi<\/code><\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · Compter<\/div><p><code>total=$(wc -l &lt; &quot;$fichier&quot;)<\/code> et <code>erreurs=$(grep -ic &quot;erreur&quot; &quot;$fichier&quot;)<\/code><\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · Boucler sur les lignes<\/div><p>découper sur les retours à la ligne (<code>IFS=$&#39; &#39;<\/code>) avant <code>for ligne in $(head -n 3 &quot;$fichier&quot;)<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · Numéroter<\/div><p><code>n=$((n + 1))<\/code> puis <code>echo &quot;$n: $ligne&quot;<\/code>.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><pre class=\"\"><code>#!/bin/bash\nif [ $# -ne 1 ]; then\n  echo &quot;Usage: $0 &lt;fichier&gt;&quot;\n  exit 1\nfi\nfichier=&quot;$1&quot;\nif [ ! -f &quot;$fichier&quot; ] || [ ! -r &quot;$fichier&quot; ]; then\n  echo &quot;Erreur: '$fichier' n'existe pas ou n'est pas lisible.&quot;\n  exit 2\nfi\ntotal=$(wc -l &lt; &quot;$fichier&quot;)\nerreurs=$(grep -ic &quot;erreur&quot; &quot;$fichier&quot;)\necho &quot;Nombre total de lignes : $total&quot;\necho &quot;Lignes contenant 'erreur' : $erreurs&quot;\necho &quot;3 premières lignes :&quot;\nn=0\nIFS=$'\\n'\nfor ligne in $(head -n 3 &quot;$fichier&quot;); do\n  n=$((n + 1))\n  echo &quot;$n: $ligne&quot;\ndone<\/code><\/pre><p>Sur un fichier de 4 lignes « Demarrage ok / ERREUR disque / fin du test / erreur 2 », il affiche (vérifié) :<\/p>\n<pre class=\"\"><code>Nombre total de lignes : 4\nLignes contenant 'erreur' : 2\n3 premières lignes :\n1: Demarrage ok\n2: ERREUR disque\n3: fin du test<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>La correction distribuée écrit <code>for ligne in $(head -n 3 &quot;$fichier&quot;)<\/code> <strong>sans<\/strong> changer <code>IFS<\/code>. Le shell découpe alors aux espaces : la boucle parcourt des <strong>mots<\/strong> (« 1: Demarrage », « 2: ok »…), pas des lignes (vérifié). Ajoute <code>IFS=$&#39;\\n&#39;<\/code> avant la boucle, ou utilise <code>head -n 3 &quot;$fichier&quot; | while read ligne<\/code>. Si la consigne impose <code>for<\/code>, garde la version avec IFS.<\/p>\n<\/aside><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>L&#39;en-tête de l&#39;examen blanc porte « 2024-2025, semestre II, M9 », alors que le module est le M17 du S3 2025-2026. Ce n&#39;est qu&#39;une erreur d&#39;en-tête : le contenu correspond bien au cours de cette année.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices 1 à 4 de l&#39;examen blanc (8 points)<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Q21. Différence entre chemin absolu et chemin relatif, avec un exemple.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Absolu : commence par <code>/<\/code>, indépendant du répertoire courant (<code>/home/user/doc.txt<\/code>). Relatif : dépend du répertoire courant (<code>doc.txt<\/code>, <code>../backup/file<\/code>).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Q23. Suppression de la cible d&#39;un lien physique ? d&#39;un lien symbolique ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Physique : données toujours accessibles par l&#39;autre nom. Symbolique : lien cassé.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Q27. Différence entre rmdir et rm -r.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>rmdir<\/code> : répertoires vides uniquement. <code>rm -r<\/code> : supprime récursivement le répertoire et tout son contenu.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Q30. Droits lisibles de chmod 640.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Propriétaire <code>rw-<\/code>, groupe <code>r--<\/code>, autres <code>---<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>Q33. À quoi sert <code>ps aux | grep firefox<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>À afficher les processus dont la ligne contient « firefox », pour vérifier s&#39;il tourne (et récupérer son PID).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 6 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">(Q2) Quel système historique a introduit la philosophie « tout est fichier » ?<\/div><button class=\"opt\" data-o=\"0\">Unix<\/button><button class=\"opt\" data-o=\"1\">GM-NAA I/O<\/button><button class=\"opt\" data-o=\"2\">MS-DOS<\/button><button class=\"opt\" data-o=\"3\">Windows 3.1<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">(Q3) Illusion d&#39;une mémoire plus grande que la RAM :<\/div><button class=\"opt\" data-o=\"0\">la défragmentation<\/button><button class=\"opt\" data-o=\"1\">la pagination externe<\/button><button class=\"opt\" data-o=\"2\">la mémoire virtuelle<\/button><button class=\"opt\" data-o=\"3\">le swapping des processus terminés<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">(Q5) La philosophie Unix :<\/div><button class=\"opt\" data-o=\"0\">Chaque programme fait une seule chose, mais la fait bien<\/button><button class=\"opt\" data-o=\"1\">Un seul outil doit tout faire<\/button><button class=\"opt\" data-o=\"2\">L&#39;interface graphique est essentielle<\/button><button class=\"opt\" data-o=\"3\">Les données doivent être en binaire<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">(Q7) Créer un lien symbolique :<\/div><button class=\"opt\" data-o=\"0\"><code>cp -s cible lien<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>ln -s cible lien<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>ln cible lien<\/code><\/button><button class=\"opt\" data-o=\"3\"><code>link cible lien<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">(Q10) Informations de base des utilisateurs (UID, home, shell) :<\/div><button class=\"opt\" data-o=\"0\">/etc/passwd<\/button><button class=\"opt\" data-o=\"1\">/etc/shadow<\/button><button class=\"opt\" data-o=\"2\">/etc/group<\/button><button class=\"opt\" data-o=\"3\">/etc/users<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">(Q12) Archiver et compresser en une commande :<\/div><button class=\"opt\" data-o=\"0\"><code>gzip repertoire/<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>tar -czf archive.tar.gz repertoire/<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>tar -cf archive.tar.gz repertoire/<\/code><\/button><button class=\"opt\" data-o=\"3\"><code>zip -r archive.tar.gz repertoire/<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">(Q15) Pourquoi <code>${var}60<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">Pour distinguer le nom de la variable du texte adjacent<\/button><button class=\"opt\" data-o=\"1\">Pour forcer l&#39;évaluation arithmétique<\/button><button class=\"opt\" data-o=\"2\">Pour protéger la variable contre la suppression<\/button><button class=\"opt\" data-o=\"3\">Pour exporter la variable<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">(Q17) Dans &quot;...&quot;, quels caractères restent interprétés ?<\/div><button class=\"opt\" data-o=\"0\"><code>&gt;<\/code>, <code>|<\/code>, <code>;<\/code><\/button><button class=\"opt\" data-o=\"1\">Tous<\/button><button class=\"opt\" data-o=\"2\"><code>$<\/code>, <code>\\<\/code>, <code>&quot;<\/code>, <code>`<\/code><\/button><button class=\"opt\" data-o=\"3\">Aucun<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">(Q19) PID du script en cours :<\/div><button class=\"opt\" data-o=\"0\"><code>$!<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>$?<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>$$<\/code><\/button><button class=\"opt\" data-o=\"3\"><code>$PID<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Dans le script de la Q35, que parcourt <code>for ligne in $(head -n 3 f)<\/code> sans changer IFS ?<\/div><button class=\"opt\" data-o=\"0\">Les 3 premières lignes<\/button><button class=\"opt\" data-o=\"1\">Les mots des 3 premières lignes<\/button><button class=\"opt\" data-o=\"2\">Le nom du fichier<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"10\"><div class=\"qq-q\"><code>[ ! -f &quot;$f&quot; ] || [ ! -r &quot;$f&quot; ]<\/code> est vrai si :<\/div><button class=\"opt\" data-o=\"0\">f n&#39;est pas un fichier ordinaire, ou n&#39;est pas lisible<\/button><button class=\"opt\" data-o=\"1\">f est un fichier lisible<\/button><button class=\"opt\" data-o=\"2\">f est un répertoire lisible seulement<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"revision-examen-blanc","rep":null,"tol":null},{"n":"revision-examen-blanc","rep":null,"tol":null},{"n":"revision-examen-blanc","rep":null,"tol":null},{"n":"revision-examen-blanc","rep":null,"tol":null},{"n":"revision-examen-blanc","rep":null,"tol":null},{"n":"revision-examen-blanc","rep":null,"tol":null}],"qcm":[{"n":"revision-examen-blanc","q":"(Q2) Quel système historique a introduit la philosophie « tout est fichier » ?","o":["Unix","GM-NAA I/O","MS-DOS","Windows 3.1"],"a":0,"e":"Unix (1969). GM-NAA I/O est le premier SE batch."},{"n":"revision-examen-blanc","q":"(Q3) Illusion d&#39;une mémoire plus grande que la RAM :","o":["la défragmentation","la pagination externe","la mémoire virtuelle","le swapping des processus terminés"],"a":2,"e":"Pages en swap, rechargées lors d&#39;une faute de page."},{"n":"revision-examen-blanc","q":"(Q5) La philosophie Unix :","o":["Chaque programme fait une seule chose, mais la fait bien","Un seul outil doit tout faire","L&#39;interface graphique est essentielle","Les données doivent être en binaire"],"a":0,"e":"KISS et petits outils combinés par des pipes."},{"n":"revision-examen-blanc","q":"(Q7) Créer un lien symbolique :","o":["<code>cp -s cible lien<\/code>","<code>ln -s cible lien<\/code>","<code>ln cible lien<\/code>","<code>link cible lien<\/code>"],"a":1,"e":"<code>ln<\/code> seul = lien physique."},{"n":"revision-examen-blanc","q":"(Q10) Informations de base des utilisateurs (UID, home, shell) :","o":["/etc/passwd","/etc/shadow","/etc/group","/etc/users"],"a":0,"e":"shadow = mots de passe chiffrés."},{"n":"revision-examen-blanc","q":"(Q12) Archiver et compresser en une commande :","o":["<code>gzip repertoire/<\/code>","<code>tar -czf archive.tar.gz repertoire/<\/code>","<code>tar -cf archive.tar.gz repertoire/<\/code>","<code>zip -r archive.tar.gz repertoire/<\/code>"],"a":1,"e":"Il faut <code>z<\/code> pour la compression gzip."},{"n":"revision-examen-blanc","q":"(Q15) Pourquoi <code>${var}60<\/code> ?","o":["Pour distinguer le nom de la variable du texte adjacent","Pour forcer l&#39;évaluation arithmétique","Pour protéger la variable contre la suppression","Pour exporter la variable"],"a":0,"e":"Sans accolades, le shell chercherait <code>var60<\/code>."},{"n":"revision-examen-blanc","q":"(Q17) Dans &quot;...&quot;, quels caractères restent interprétés ?","o":["<code>&gt;<\/code>, <code>|<\/code>, <code>;<\/code>","Tous","<code>$<\/code>, <code>\\<\/code>, <code>&quot;<\/code>, <code>`<\/code>","Aucun"],"a":2,"e":"Les autres caractères spéciaux sont neutralisés."},{"n":"revision-examen-blanc","q":"(Q19) PID du script en cours :","o":["<code>$!<\/code>","<code>$?<\/code>","<code>$$<\/code>","<code>$PID<\/code>"],"a":2,"e":"<code>$!<\/code> : dernier processus en arrière-plan ; <code>$?<\/code> : code retour."},{"n":"revision-examen-blanc","q":"Dans le script de la Q35, que parcourt <code>for ligne in $(head -n 3 f)<\/code> sans changer IFS ?","o":["Les 3 premières lignes","Les mots des 3 premières lignes","Le nom du fichier"],"a":1,"e":"Le découpage par défaut se fait aux espaces, tabulations et retours à la ligne."},{"n":"revision-examen-blanc","q":"<code>[ ! -f &quot;$f&quot; ] || [ ! -r &quot;$f&quot; ]<\/code> est vrai si :","o":["f n&#39;est pas un fichier ordinaire, ou n&#39;est pas lisible","f est un fichier lisible","f est un répertoire lisible seulement"],"a":0,"e":"C&#39;est la condition d&#39;erreur du script : on quitte avec exit 2."}]}];

const CARTES=[{"n":"role-se","k":0,"ch":"role-se","q":"<p>Définition d&#39;un SE<\/p>\n","r":"<p>Ensemble de programmes qui gère les ressources matérielles, fournit une interface et permet l&#39;exécution et la coordination des programmes.<\/p>\n"},{"n":"role-se","k":1,"ch":"role-se","q":"<p>Programme ou processus ?<\/p>\n","r":"<p>Programme = fichier statique sur le disque. Processus = programme en cours d&#39;exécution, en mémoire, avec un état.<\/p>\n"},{"n":"role-se","k":2,"ch":"role-se","q":"<p>Les 4 états d&#39;un processus<\/p>\n","r":"<p>Prêt, en cours d&#39;exécution, bloqué (attend un événement), terminé.<\/p>\n"},{"n":"role-se","k":3,"ch":"role-se","q":"<p>PCB<\/p>\n","r":"<p>Process Control Block : l&#39;entrée de la table des processus qui décrit chaque processus.<\/p>\n"},{"n":"role-se","k":4,"ch":"role-se","q":"<p>Mémoire virtuelle<\/p>\n","r":"<p>Illusion d&#39;une mémoire plus grande que la RAM : pages sur le disque (swap), rechargées lors d&#39;une faute de page.<\/p>\n"},{"n":"role-se","k":5,"ch":"role-se","q":"<p>Thrashing<\/p>\n","r":"<p>Ralentissement sévère quand le système passe son temps à échanger des pages avec le swap.<\/p>\n"},{"n":"role-se","k":6,"ch":"role-se","q":"<p>Polling, interruption, DMA<\/p>\n","r":"<p>Polling : le CPU interroge en boucle. Interruption : le périphérique prévient. DMA : transfert sans le CPU.<\/p>\n"},{"n":"role-se","k":7,"ch":"role-se","q":"<p>Multitâche préemptif<\/p>\n","r":"<p>Le SE interrompt lui-même les processus pour partager le CPU (Linux, Windows NT, macOS).<\/p>\n"},{"n":"role-se","k":8,"ch":"role-se","q":"<p>SE temps réel<\/p>\n","r":"<p>SE qui garantit une réponse dans un délai fixé (aéronautique, médical).<\/p>\n"},{"n":"composantes-se","k":9,"ch":"composantes-se","q":"<p>Noyau (kernel)<\/p>\n","r":"<p>Cœur du SE, premier chargé au démarrage, seule partie qui communique directement avec le matériel.<\/p>\n"},{"n":"composantes-se","k":10,"ch":"composantes-se","q":"<p>Noyau monolithique<\/p>\n","r":" // Format « essais » : un objet partagé avec l'ancien module (attempts par notion, cards par indice) ; on ne touche qu'à ces deux champs.
// Format « score10 » : scores des chapitres dans MODULE.cle, essais et cartes dans MODULE.cleEtat.
const lireJ = (k) => { try { return JSON.parse(localStorage.getItem(k) || "{}") || {}; } catch (e) { return {}; } };
const ecrireJ = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const etat = () => { const S = lireJ(MODULE.cleEtat); S.attempts = S.attempts || {}; S.cards = S.cards || {}; return S; };
function noter(n, ok) { const S = etat(); (S.attempts[n] = S.attempts[n] || []).push(ok ? 1 : 0); if (S.attempts[n].length > 30) S.attempts[n].shift(); ecrireJ(MODULE.cleEtat, S); }
// Maîtrisé = au moins 3 essais et 80 % de réussite sur les 5 derniers (règle commune à la plateforme).
function statut(n) {

.mzt-deepbtn{align-self:flex-start;border-color:var(--w)!important;color:var(--w)!important;background:transparent!important}
.mzt-chips{display:flex;gap:5px;flex-wrap:wrap;padding:4px 10px}
.mzt-f{display:flex;flex-direction:column;gap:6px;padding:8px 10px;border-top:1px solid var(--l)}
.mzt-f textarea{width:100%;min-height:54px;max-height:140px;resize:vertical;font:16px system-ui,sans-serif;padding:7px;border:1px solid var(--l);border-radius:8px;background:var(--s);color:var(--i)}
.mzt-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mzt-row label{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--m);cursor:pointer}
.mzt-note{font-size:11.5px;color:var(--m);margin:0}
.mzt-pan details{padding:0 10px}.mzt-pan summary{cursor:pointer;font-size:12px;color:var(--a);font-weight:600;padding:4px 0}
.mzt-prev{max-height:140px;overflow:auto;font-size:12px;white-space:pre-wrap;background:var(--s);border-radius:6px;padding:6px;color:var(--m)}
.mzt-list{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.mzt-item{border:1px solid var(--l);border-radius:8px;padding:8px}
.mzt-item .mzt-meta{font-size:11px;color:var(--m)}
.mzt-pan input[type=search]{width:100%;font:16px system-ui,sans-serif;padding:7px;border:1px solid var(--l);border-radius:8px;background:var(--s);color:var(--i)}
.mzt-pan input[type=checkbox]{width:auto}
.mzt-pan[hidden],.mzt-btn[hidden],.mzt-pan [hidden]{display:none!important}
.mzt-h button{flex:0 0 auto;white-space:nowrap}
.mzt-pan #mztX{background:var(--bad);border-color:var(--bad);color:#fff}
.mzt-m.a{white-space:normal}.mzt-m.a p{margin:0 0 6px}.mzt-m.a p:last-child{margin-bottom:0}
.mzt-m.a ul,.mzt-m.a ol{margin:4px 0 6px;padding-left:20px}.mzt-m.a li{margin:2px 0}
.mzt-m code{font:12.5px ui-monospace,Menlo,Consolas,monospace;background:color-mix(in srgb,var(--i) 10%,transparent);padding:1px 4px;border-radius:4px;overflow-wrap:anywhere}
.mzt-m pre{margin:6px 0;padding:8px;overflow-x:auto;background:color-mix(in srgb,var(--i) 10%,transparent);border-radius:6px;font:12.5px ui-monospace,Menlo,Consolas,monospace;white-space:pre}
.mzt-m pre code{background:none;padding:0}
.mzt-tex{font:12.5px ui-monospace,Menlo,Consolas,monospace;color:var(--m)}.mzt-tex[data-ok]{font:inherit;color:inherit}
.mzt-tex.d{display:block;margin:6px 0;text-align:center}
.mzt-m mjx-container{max-width:100%;overflow-x:auto;overflow-y:hidden;vertical-align:middle}.mzt-m mjx-container[display]{margin:0!important}
.mzt-m mjx-container svg{max-width:none}

  $('#mztX').onclick = closePanel;
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#mztPan').hidden) closePanel(); });
  $('#mztTabH').onclick = () => view($('#mztHist').hidden ? 'hist' : 'chat');
  $('#mztTabM').onclick = () => view($('#mztMem').hidden ? 'mem' : 'chat');
  $('#mztQ').oninput = renderList;
  $('#mztList').onclick = (e) => { const id = e.target.dataset && e.target.dataset.cont; if (!id) return; cur = ST.threads.find((t) => t.id === id); view('chat'); $('#mztCtx').textContent = '· ' + cur.sec; renderLog(); };
  $('#mztMemL').onclick = (e) => { const i = e.target.dataset && e.target.dataset.memdel; if (i == null) return; ST.memos.splice(+i, 1); saveMemos(); renderMem(); };
  $('#mztChips').onclick = (e) => { const b = e.target.closest('[data-chip]'); if (!b) return; const t = $('#mztIn'); t.value = b.dataset.chip + (t.value ? ' : ' + t.value : ''); t.focus(); };
  $('#mztNew').onclick = () => { cur = null; renderLog(); };
  $('#mztStop').onclick = () => { if (ctl) ctl.abort(); };
  $('#mztImg').onchange = (e) => { img = e.target.files[0] || null; $('#mztImgN').textContent = img ? 'Photo : ' + img.name : ''; };
  $('#mztF').onsubmit = (e) => { e.preventDefault(); const v = $('#mztIn').value; $('#mztIn').value = ''; ask(v); };
  $('#mztIn').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#mztF').requestSubmit(); } });

  // ---------- capacités (facultatives) ----------
  const W = window.claude;
  if (W && W.use) {
    W.use('sample').then((s) => { sample = s; ready = true; note();
      if (s && s.limits) s.limits().then((l) => { if (l && l.images) { imgOK = true; $('#mztImgL').hidden = false; if (l.images.mediaTypes) $('#mztImg').accept = l.images.mediaTypes.join(','); } }).catch(() => {});
    }).catch(() => { ready = true; note(); });
    Promise.all([W.use('db'), W.use('user')]).then(async ([d, u]) => {
      if (!d || !u) return; const id = await u.id(); if (!id) return; db = d; base = 'data/users/' + id + '/mzt_' + C.id;
      try {
        const m = await db.doc(base).get(); if (m.exists) { const v = m.data() || {}; if (Array.isArray(v.memos)) ST.memos = JSON.parse(JSON.stringify(v.memos)); }
        const q = await db.collection(base + '/threads').get(); const remote = q.docs.map((x) => Object.assign({ id: x.id }, JSON.parse(JSON.stringify(x.data() || {}))));
        const map = {}; [...ST.threads, ...remote].forEach((t) => { if (!map[t.id] || (t.msgs || []).length > (map[t.id].msgs || []).length) map[t.id] = t; });
        ST.threads = Object.values(map).sort((a, b) => parseInt(a.id.slice(1), 36) - parseInt(b.id.slice(1), 36)); saveLocal();
      } catch (e) {}
    }).catch(() => {});
  } else { ready = true; note(); }

  window.MZT = { open: openPanel, close: closePanel };
})();

</script>

if(window.top===window&&location.protocol==="file:"){a.hidden=true;return}
a.href=p.indexOf("/decouvrir")===0||location.pathname.indexOf("/decouvrir")===0?"/decouvrir":"/app/modules";})();</script>
