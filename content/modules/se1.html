txt<\/code> en ERE.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Que signifie <code>.<\/code> dans une expression régulière ?<\/div><button class=\"opt\" data-o=\"0\">Le répertoire courant<\/button><button class=\"opt\" data-o=\"1\">N&#39;importe quel caractère<\/button><button class=\"opt\" data-o=\"2\">La fin de la ligne<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Quelle regex trouve les lignes commençant par « Erreur » et finissant par un chiffre ?<\/div><button class=\"opt\" data-o=\"0\"><code>Erreur*[0-9]<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>^Erreur.*[0-9]$<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>$Erreur.*[0-9]^<\/code><\/button><button class=\"opt\" data-o=\"3\"><code>^Erreur[0-9]<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\"><code>ab*c<\/code> correspond à :<\/div><button class=\"opt\" data-o=\"0\">ac, abc, abbc<\/button><button class=\"opt\" data-o=\"1\">uniquement abc<\/button><button class=\"opt\" data-o=\"2\">ab suivi de n&#39;importe quoi puis c<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Avec <code>grep<\/code> sans option, comment écrire « une ou plusieurs lettres minuscules » ?<\/div><button class=\"opt\" data-o=\"0\"><code>[a-z]+<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>[a-z]\\+<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>[a-z]*<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Que trouve <code>[^0-9]<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">Une ligne qui commence par un chiffre<\/button><button class=\"opt\" data-o=\"1\">Un caractère qui n&#39;est pas un chiffre<\/button><button class=\"opt\" data-o=\"2\">Un chiffre en début de ligne<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Quelle regex désigne une ligne vide ?<\/div><button class=\"opt\" data-o=\"0\"><code>^$<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>^$$<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>.*<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Que liste <code>ls *[0-9][0-9][0-9][0-9]*<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">Les fichiers dont le nom fait 4 caractères<\/button><button class=\"opt\" data-o=\"1\">Les fichiers dont le nom contient 4 chiffres consécutifs<\/button><button class=\"opt\" data-o=\"2\">Les fichiers qui commencent par 4 chiffres<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Quelle option de grep active les expressions régulières étendues ?<\/div><button class=\"opt\" data-o=\"0\"><code>-i<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>-v<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>-E<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\"><code>[0-9]{3}-[0-9]{2}<\/code> (ERE) reconnaît :<\/div><button class=\"opt\" data-o=\"0\">12-345<\/button><button class=\"opt\" data-o=\"1\">123-45<\/button><button class=\"opt\" data-o=\"2\">1234-5<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Pourquoi écrire <code>\\.log$<\/code> plutôt que <code>.log$<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">Parce que <code>.<\/code> non échappé accepte n&#39;importe quel caractère<\/button><button class=\"opt\" data-o=\"1\">Parce que <code>$<\/code> doit toujours être précédé de <code>\\<\/code><\/button><button class=\"opt\" data-o=\"2\">Il n&#39;y a aucune différence<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"expressions-regulieres","rep":null,"tol":null},{"n":"expressions-regulieres","rep":null,"tol":null},{"n":"expressions-regulieres","rep":null,"tol":null},{"n":"expressions-regulieres","rep":["2"],"tol":null},{"n":"expressions-regulieres","rep":null,"tol":null}],"qcm":[{"n":"expressions-regulieres","q":"Que signifie <code>.<\/code> dans une expression régulière ?","o":["Le répertoire courant","N&#39;importe quel caractère","La fin de la ligne"],"a":1,"e":"Le <code>.<\/code> désigne un caractère quelconque. Le répertoire courant, c&#39;est dans un chemin."},{"n":"expressions-regulieres","q":"Quelle regex trouve les lignes commençant par « Erreur » et finissant par un chiffre ?","o":["<code>Erreur*[0-9]<\/code>","<code>^Erreur.*[0-9]$<\/code>","<code>$Erreur.*[0-9]^<\/code>","<code>^Erreur[0-9]<\/code>"],"a":1,"e":"<code>^<\/code> au début, <code>.*<\/code> pour le milieu, <code>[0-9]<\/code> puis <code>$<\/code> à la fin."},{"n":"expressions-regulieres","q":"<code>ab*c<\/code> correspond à :","o":["ac, abc, abbc","uniquement abc","ab suivi de n&#39;importe quoi puis c"],"a":0,"e":"<code>*<\/code> porte sur le <code>b<\/code> qui précède : 0 ou plusieurs b."},{"n":"expressions-regulieres","q":"Avec <code>grep<\/code> sans option, comment écrire « une ou plusieurs lettres minuscules » ?","o":["<code>[a-z]+<\/code>","<code>[a-z]\\+<\/code>","<code>[a-z]*<\/code>"],"a":1,"e":"En BRE, <code>+<\/code> doit être échappé. <code>[a-z]*<\/code> accepte aussi zéro lettre."},{"n":"expressions-regulieres","q":"Que trouve <code>[^0-9]<\/code> ?","o":["Une ligne qui commence par un chiffre","Un caractère qui n&#39;est pas un chiffre","Un chiffre en début de ligne"],"a":1,"e":"<code>^<\/code> juste après <code>[<\/code> signifie la négation. Hors crochets, <code>^<\/code> est l&#39;ancre de début."},{"n":"expressions-regulieres","q":"Quelle regex désigne une ligne vide ?","o":["<code>^$<\/code>","<code>^$$<\/code>","<code>.*<\/code>"],"a":0,"e":"Début immédiatement suivi de fin. <code>^$$<\/code> (diapo) est une coquille."},{"n":"expressions-regulieres","q":"Que liste <code>ls *[0-9][0-9][0-9][0-9]*<\/code> ?","o":["Les fichiers dont le nom fait 4 caractères","Les fichiers dont le nom contient 4 chiffres consécutifs","Les fichiers qui commencent par 4 chiffres"],"a":1,"e":"<code>*<\/code> avant et après autorise n&#39;importe quel préfixe et suffixe."},{"n":"expressions-regulieres","q":"Quelle option de grep active les expressions régulières étendues ?","o":["<code>-i<\/code>","<code>-v<\/code>","<code>-E<\/code>"],"a":2,"e":"<code>-E<\/code> (ou <code>egrep<\/code>). <code>-i<\/code> ignore la casse, <code>-v<\/code> inverse la sélection."},{"n":"expressions-regulieres","q":"<code>[0-9]{3}-[0-9]{2}<\/code> (ERE) reconnaît :","o":["12-345","123-45","1234-5"],"a":1,"e":"3 chiffres, un tiret, 2 chiffres."},{"n":"expressions-regulieres","q":"Pourquoi écrire <code>\\.log$<\/code> plutôt que <code>.log$<\/code> ?","o":["Parce que <code>.<\/code> non échappé accepte n&#39;importe quel caractère","Parce que <code>$<\/code> doit toujours être précédé de <code>\\<\/code>","Il n&#39;y a aucune différence"],"a":0,"e":"<code>.log$<\/code> trouverait aussi « catalog »."}]},{"id":"commandes-fichiers","t":"Commandes de base · utilisateurs, fichiers, éditeurs, archives","seance":"Chapitre III · Commandes de base (parties 1 à 7)","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu dois savoir écrire un chemin absolu et un chemin relatif (chapitre 3).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Tu es dans <code>/home/alice<\/code>. Que désigne <code>projets/rapport.pdf<\/code> en chemin absolu ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>/home/alice/projets/rapport.pdf<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Ne mémorise pas des listes : apprends la <strong>forme<\/strong> <code>commande [options] [arguments]<\/code>, puis pour chaque commande <strong>une option clé<\/strong> (<code>mkdir -p<\/code>, <code>rm -r<\/code>, <code>cp -r<\/code>, <code>useradd -m<\/code>, <code>usermod -aG<\/code>, <code>tar -czf<\/code>). L&#39;examen demande presque toujours celles-là.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p><code>usermod -G sudo alice<\/code> <strong>remplace<\/strong> tous les groupes secondaires d&#39;alice par sudo. Pour <strong>ajouter<\/strong> sans écraser : <code>usermod -aG sudo alice<\/code>. C&#39;est la question 26 de l&#39;examen blanc.<\/p>\n<\/aside><p>À la fin, tu sais créer utilisateurs et groupes, créer, copier, déplacer et supprimer des fichiers, te servir de vi et nano, naviguer et chercher, afficher et comparer des fichiers, archiver et compresser.<\/p>\n<h2>Idée 1 · Une commande, internes et externes<\/h2>\n<figure class=\"flux\"><figcaption>Forme d'une commande<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">nom_commande<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">options (un tiret + une lettre, accolables : -la = -l -a)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">arguments (fichiers, répertoires…)<\/div><\/div><\/figure><ul>\n<li>Le <strong>prompt<\/strong> : <code>$<\/code> (ou <code>%<\/code>) pour un utilisateur normal, <code>#<\/code> pour root.<\/li>\n<li><strong>Commande interne<\/strong> (builtin) : exécutée par le shell lui-même, <strong>sans processus fils<\/strong>. Ex : <code>cd<\/code>, <code>echo<\/code>, <code>pwd<\/code>, <code>export<\/code>, <code>read<\/code>, <code>type<\/code>, <code>umask<\/code>.<\/li>\n<li><strong>Commande externe<\/strong> : un fichier exécutable (dans <code>/bin<\/code>, <code>/usr/bin<\/code>…). Le shell crée un <strong>processus fils<\/strong> et attend sa fin.<\/li>\n<\/ul>\n<pre class=\"\"><code>type cd       # cd is a shell builtin\ntype ls       # ls is /bin/ls  (ou /usr/bin/ls selon la distribution)\nwhich ls      # /usr/bin/ls\nman ls        # manuel : Espace page suivante, b page précédente, /mot chercher, q quitter<\/code><\/pre><p>Pourquoi <code>cd<\/code> est forcément interne : s&#39;il tournait dans un processus fils, seul le fils changerait de répertoire, et ton shell resterait au même endroit.<\/p>\n<h2>Idée 2 · Utilisateurs et groupes<\/h2>\n<table>\n<tr><th>But<\/th><th>Commande<\/th><\/tr>\n<tr><td>Créer alice avec home, bash, groupe principal dev<\/td><td><code>useradd -m -s /bin/bash -g dev alice<\/code><\/td><\/tr>\n<tr><td>Ajouter un groupe secondaire sans écraser<\/td><td><code>usermod -aG sudo alice<\/code><\/td><\/tr>\n<tr><td>Changer le groupe principal<\/td><td><code>usermod -g developpeurs charlie<\/code><\/td><\/tr>\n<tr><td>Supprimer bob et son home<\/td><td><code>userdel -r bob<\/code><\/td><\/tr>\n<tr><td>Créer / renommer / supprimer un groupe<\/td><td><code>groupadd<\/code>, <code>groupmod -n dev developpeurs<\/code>, <code>groupdel<\/code><\/td><\/tr>\n<tr><td>Ajouter / retirer un membre<\/td><td><code>gpasswd -a alice dev<\/code>, <code>gpasswd -d bob dev<\/code><\/td><\/tr>\n<tr><td>Qui suis-je, mes groupes<\/td><td><code>whoami<\/code>, <code>id alice<\/code>, <code>groups bob<\/code><\/td><\/tr>\n<tr><td>Qui est connecté<\/td><td><code>who<\/code>, <code>w<\/code><\/td><\/tr>\n<tr><td>Devenir root / bob ; une commande en root<\/td><td><code>su<\/code>, <code>su - bob<\/code> ; <code>sudo commande<\/code><\/td><\/tr>\n<\/table><p>Ces commandes demandent les droits root (<code>sudo<\/code>). Sans <code>-m<\/code>, <code>useradd<\/code> ne crée <strong>pas<\/strong> de répertoire personnel ; sans <code>-r<\/code>, <code>userdel<\/code> laisse les fichiers sur le disque. Un changement de groupe ne compte qu&#39;à la prochaine connexion (ou avec <code>newgrp<\/code>).<\/p>\n<p>Les trois fichiers :<\/p>\n<table>\n<tr><th>Fichier<\/th><th>Format<\/th><\/tr>\n<tr><td>/etc/passwd<\/td><td><code>nom:x:UID:GID:commentaire:home:shell<\/code> (x = mot de passe dans shadow)<\/td><\/tr>\n<tr><td>/etc/shadow<\/td><td><code>nom:hash_mdp:dernier_chgt:…<\/code>, lisible par root seulement<\/td><\/tr>\n<tr><td>/etc/group<\/td><td><code>nom:x:GID:liste_membres<\/code><\/td><\/tr>\n<\/table><p>Ne les édite jamais à la main : utilise <code>vipw<\/code>, <code>vigr<\/code>, <code>vipw -s<\/code> (verrouillage et vérification), et <code>visudo<\/code> pour <code>/etc/sudoers<\/code>.<\/p>\n<p>Exemple chiffré : la ligne <code>alice:x:1001:1001::/home/alice:/bin/bash<\/code> donne UID 1001, home <code>/home/alice<\/code>, shell bash. <code>cut -d: -f1 /etc/passwd<\/code> liste les noms (champ 1).<\/p>\n<h2>Idée 3 · Créer, copier, déplacer, supprimer<\/h2>\n<table>\n<tr><th>Action<\/th><th>Commande<\/th><th>À savoir<\/th><\/tr>\n<tr><td>Fichier vide<\/td><td><code>touch f.txt<\/code><\/td><td>met aussi à jour la date s'il existe<\/td><\/tr>\n<tr><td>Répertoire(s)<\/td><td><code>mkdir -p a/b/c<\/code><\/td><td>-p crée les parents manquants<\/td><\/tr>\n<tr><td>Supprimer un répertoire vide<\/td><td><code>rmdir rep<\/code><\/td><td>échoue s'il n'est pas vide<\/td><\/tr>\n<tr><td>Supprimer un répertoire plein<\/td><td><code>rm -r rep<\/code><\/td><td>irréversible, pas de corbeille<\/td><\/tr>\n<tr><td>Renommer / déplacer<\/td><td><code>mv ancien nouveau<\/code><\/td><td>écrase sans prévenir (sauf -i)<\/td><\/tr>\n<tr><td>Copier un répertoire<\/td><td><code>cp -r src/ dest/<\/code><\/td><td>sans -r, cp refuse<\/td><\/tr>\n<tr><td>Copie fidèle (sauvegarde)<\/td><td><code>cp -a /etc /backup/<\/code><\/td><td>garde droits, dates, propriétaire<\/td><\/tr>\n<\/table><p>Options communes : <code>-i<\/code> (demande confirmation), <code>-r<\/code> (récursif), <code>-f<\/code> (force, sans question), <code>-v<\/code> (affiche chaque action). <code>rm -rf<\/code> cumule récursif et forcé : dangereux.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Construire l'arborescence du TD 2<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/6 · Créer td2 et entrer dedans<\/div><p><code>mkdir ~/td2<\/code> puis <code>cd ~/td2<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/6 · Trois répertoires d&#39;un coup<\/div><p><code>mkdir projet1 projet2 archives<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/6 · Sous-répertoires<\/div><p><code>mkdir projet1/src projet1/docs projet1/temp projet2/data<\/code> (ou <code>mkdir -p<\/code> si les parents manquent).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/6 · Fichiers<\/div><p><code>touch projet1/src/main.c<\/code> et <code>echo &quot;Ce projet concerne la gestion de l&#39;arborescence sous UNIX.&quot; &gt; projet1/docs/rapport.txt<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/6 · Vérifier sans se déplacer<\/div><p><code>ls projet1/docs<\/code>, ou <code>tree .<\/code> / <code>find .<\/code> pour tout voir.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">6/6 · Supprimer le vide<\/div><p><code>rmdir projet1/temp<\/code>.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Idée 4 · vi/vim et nano<\/h2>\n<svg viewBox=\"0 0 640 150\" style=\"width:100%;max-width:640px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Les trois modes de vi : commande au centre, insertion avec i a o, ligne de commande avec deux-points, retour par Échap\">\n<g font-family=\"sans-serif\" font-size=\"14\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"245\" y=\"45\" width=\"150\" height=\"50\" rx=\"10\" fill=\"#D9824F\" fill-opacity=\"0.2\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"320\" y=\"68\" font-weight=\"700\">Mode commande<\/text><text x=\"320\" y=\"86\" font-size=\"11\">(au démarrage)<\/text>\n<rect x=\"20\" y=\"45\" width=\"150\" height=\"50\" rx=\"10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"95\" y=\"75\">Mode insertion<\/text>\n<rect x=\"470\" y=\"45\" width=\"150\" height=\"50\" rx=\"10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"545\" y=\"75\">Ligne de commande<\/text>\n<text x=\"207\" y=\"38\" font-size=\"12\">i, a, o<\/text><text x=\"207\" y=\"120\" font-size=\"12\">Échap<\/text>\n<text x=\"432\" y=\"38\" font-size=\"12\">:<\/text><text x=\"432\" y=\"120\" font-size=\"12\">Entrée / Échap<\/text>\n<text x=\"545\" y=\"140\" font-size=\"12\">:w  :q  :wq  :x  :q!<\/text>\n<\/g>\n<g stroke=\"currentColor\" stroke-width=\"1.8\"><line x1=\"245\" y1=\"60\" x2=\"170\" y2=\"60\"/><line x1=\"170\" y1=\"82\" x2=\"245\" y2=\"82\"/><line x1=\"395\" y1=\"60\" x2=\"470\" y2=\"60\"/><line x1=\"470\" y1=\"82\" x2=\"395\" y2=\"82\"/><\/g>\n<\/svg><ul>\n<li><strong>vi<\/strong> : navigation <code>h j k l<\/code>, <code>w<\/code>/<code>b<\/code> (mot suivant/précédent), <code>0<\/code>/<code>$<\/code> (début/fin de ligne) ; <code>x<\/code> efface un caractère, <code>dd<\/code> une ligne. <code>:w<\/code> sauvegarde, <code>:q<\/code> quitte (refuse s&#39;il reste des modifications), <code>:wq<\/code> ou <code>:x<\/code> les deux, <code>:q!<\/code> quitte sans sauvegarder.<\/li>\n<li><strong>nano<\/strong> : pas de modes. <code>Ctrl+O<\/code> sauvegarder, <code>Ctrl+X<\/code> quitter, <code>Ctrl+K<\/code> couper la ligne, <code>Ctrl+U<\/code> coller, <code>Ctrl+W<\/code> chercher.<\/li>\n<li>gedit, Kate, VS Code : confortables, mais absents sur un serveur en SSH.<\/li>\n<\/ul>\n<p>Exemple du TP 1 : remplacer tous les <code>true<\/code> par <code>false<\/code> dans vim : <code>:%s/true/false/g<\/code>. Changer le port sans ouvrir d&#39;éditeur : <code>sed -i &#39;s/PORT=8080/PORT=3000/&#39; config.txt<\/code>.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>La commande de substitution <code>:%s/…/…/g<\/code> n&#39;est pas écrite dans les diapos, mais le TP 1 la demande. C&#39;est la syntaxe standard de vim.<\/p>\n<\/aside><h2>Idée 5 · Naviguer, chercher, lire<\/h2>\n<ul>\n<li><code>pwd<\/code> : chemin absolu du répertoire courant. <code>cd<\/code> seul ou <code>cd ~<\/code> : home ; <code>cd ..<\/code> : parent ; <code>cd -<\/code> : répertoire précédent.<\/li>\n<li><code>ls -l<\/code> (détails), <code>-a<\/code> (cachés), <code>-h<\/code> (tailles lisibles), <code>-R<\/code> (récursif), <code>-t<\/code> (par date), <code>-S<\/code> (par taille), <code>-r<\/code> (inverse). <code>ls -ltr<\/code> : du plus ancien au plus récent.<\/li>\n<li><code>find [chemin] [critères]<\/code> : <code>-name &quot;*.log&quot;<\/code>, <code>-iname<\/code>, <code>-type f|d|l<\/code>, <code>-mtime -7<\/code> (modifié il y a moins de 7 jours), <code>-size +100M<\/code>.<\/li>\n<li><code>cat<\/code> (tout), <code>head<\/code> / <code>tail<\/code> (10 lignes par défaut, <code>-n N<\/code>), <code>tail -f<\/code> (suivre en temps réel), <code>less<\/code> (pages, retour arrière, <code>/motif<\/code>, <code>q<\/code>), <code>more<\/code> (sans retour arrière).<\/li>\n<li><code>diff -u<\/code> (fichiers texte, ligne à ligne), <code>cmp<\/code> (octet par octet, binaires).<\/li>\n<li><code>wc<\/code> : lignes <code>-l<\/code>, mots <code>-w<\/code>, octets <code>-c<\/code>. <code>sort<\/code> : <code>-n<\/code> numérique, <code>-r<\/code> inverse, <code>-u<\/code> sans doublons, <code>-k 2<\/code> par colonne. <code>split -l 1000<\/code> (morceaux xaa, xab…), <code>paste<\/code> (colle côte à côte), <code>join<\/code> (jointure sur une clé, fichiers <strong>triés<\/strong>).<\/li>\n<\/ul>\n<pre class=\"\"><code>find /home -name &quot;*.log&quot;\nfind . -type d -name &quot;cache&quot;\ntail -n 5 -f data.csv        # les 5 dernières lignes, puis la suite en temps réel<\/code><\/pre><h2>Idée 6 · Archiver et compresser<\/h2>\n<table>\n<tr><th>Extension<\/th><th>Ce que c'est<\/th><th>Créer<\/th><th>Ouvrir<\/th><\/tr>\n<tr><td>.gz<\/td><td>un fichier compressé<\/td><td><code>gzip f<\/code> (supprime f)<\/td><td><code>gunzip f.gz<\/code>, lire : <code>zcat<\/code><\/td><\/tr>\n<tr><td>.tar<\/td><td>une archive, sans compression<\/td><td><code>tar -cf a.tar rep/<\/code><\/td><td><code>tar -xf a.tar<\/code><\/td><\/tr>\n<tr><td>.tar.gz<\/td><td>archive + gzip<\/td><td><code>tar -czf a.tar.gz rep/<\/code><\/td><td><code>tar -xzf a.tar.gz<\/code><\/td><\/tr>\n<tr><td>.tar.bz2 / .tar.xz<\/td><td>archive + bzip2 / xz<\/td><td><code>tar -cjf<\/code> / <code>tar -cJf<\/code><\/td><td><code>-xjf<\/code> / <code>-xJf<\/code><\/td><\/tr>\n<tr><td>.zip<\/td><td>archive + compression, portable Windows<\/td><td><code>zip -r a.zip rep/<\/code><\/td><td><code>unzip a.zip -d dest/<\/code>, lister : <code>unzip -l<\/code><\/td><\/tr>\n<\/table><p>Mnémonique tar : <strong>c<\/strong> create, <strong>x<\/strong> extract, <strong>t<\/strong> list, <strong>v<\/strong> verbose, <strong>f<\/strong> fichier (suivi du nom de l&#39;archive), <strong>z<\/strong> gzip, <strong>j<\/strong> bzip2, <strong>J<\/strong> xz. <code>-C dossier<\/code> extrait ailleurs.<\/p>\n<p>Exemple (question 29 de l&#39;examen) : <code>tar -czf logs.tar.gz /var/log<\/code>.<\/p>\n<aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p><code>gzip repertoire/<\/code> ne marche pas : gzip compresse <strong>un seul fichier<\/strong>. Pour un répertoire, on passe par tar (<code>-z<\/code>).<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices du TD 1, du TD 2 et de l&#39;examen<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Crée l&#39;utilisateur dev1 avec un répertoire personnel, le shell /bin/bash et le groupe principal dev (question 25).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>sudo useradd -m -s /bin/bash -g dev dev1<\/code><\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Crée bob avec developpeurs comme groupe principal et testeurs comme groupe secondaire (TD 1).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>sudo useradd -m -g developpeurs -G testeurs bob<\/code>. <code>-g<\/code> = principal, <code>-G<\/code> = secondaires. Vérification : <code>id bob<\/code> ou <code>groups bob<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Différence entre <code>rmdir<\/code> et <code>rm -r<\/code> (question 27) ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>rmdir<\/code> ne supprime qu&#39;un répertoire <strong>vide<\/strong>. <code>rm -r<\/code> supprime un répertoire et tout son contenu, récursivement.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Crée une archive compressée td2_backup.tar.gz de tout td2/, puis liste son contenu sans l&#39;extraire.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>tar -czvf td2_backup.tar.gz td2/<\/code> puis <code>tar -tzvf td2_backup.tar.gz<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>Liste les noms des utilisateurs dont le home est dans /home (TD 1).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>grep &#39;/home&#39; /etc/passwd | cut -d: -f1<\/code>. grep garde les lignes, cut prend le champ 1 (séparateur <code>:<\/code>).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Dans la correction du TD 2 (exercice 2, question 9), <code>rm -f projet1/temp<\/code> est proposé pour supprimer un répertoire. Ça échoue : <code>rm<\/code> sans <code>-r<\/code> refuse les répertoires (« est un dossier »). Il faut <code>rmdir projet1/temp<\/code> (s&#39;il est vide) ou <code>rm -r<\/code>.<\/p>\n<\/aside><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 10 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Pour archiver et compresser un répertoire en une seule commande, on utilise :<\/div><button class=\"opt\" data-o=\"0\"><code>gzip repertoire/<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>tar -czf archive.tar.gz repertoire/<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>zip -r archive.tar.gz repertoire/<\/code><\/button><button class=\"opt\" data-o=\"3\"><code>tar -cf archive.tar.gz repertoire/<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Quel fichier contient UID, répertoire personnel et shell des utilisateurs ?<\/div><button class=\"opt\" data-o=\"0\">/etc/passwd<\/button><button class=\"opt\" data-o=\"1\">/etc/shadow<\/button><button class=\"opt\" data-o=\"2\">/etc/group<\/button><button class=\"opt\" data-o=\"3\">/etc/users<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Quelle commande affiche les 5 dernières lignes de log.txt ?<\/div><button class=\"opt\" data-o=\"0\"><code>head -5 log.txt<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>tail -n 5 log.txt<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>less -5 log.txt<\/code><\/button><button class=\"opt\" data-o=\"3\"><code>cat log.txt | wc -l 5<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Que fait <code>useradd alice<\/code> sans option ?<\/div><button class=\"opt\" data-o=\"0\">Crée le compte sans répertoire personnel<\/button><button class=\"opt\" data-o=\"1\">Crée le compte avec /home/alice<\/button><button class=\"opt\" data-o=\"2\">Échoue toujours<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\"><code>cd<\/code> est une commande interne parce que :<\/div><button class=\"opt\" data-o=\"0\">elle est trop courte pour être un fichier<\/button><button class=\"opt\" data-o=\"1\">un processus fils ne pourrait pas changer le répertoire du shell parent<\/button><button class=\"opt\" data-o=\"2\">elle est dans /bin<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Dans vi, quelle commande quitte sans sauvegarder ?<\/div><button class=\"opt\" data-o=\"0\"><code>:wq<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>:w<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>:q!<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Quelle commande ramène au répertoire précédent ?<\/div><button class=\"opt\" data-o=\"0\"><code>cd ..<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>cd -<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>cd ~<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Que fait <code>mv rapport_v1.pdf rapport.pdf<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">Renomme le fichier<\/button><button class=\"opt\" data-o=\"1\">Copie le fichier<\/button><button class=\"opt\" data-o=\"2\">Crée un lien<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Avec tar, l&#39;option <code>t<\/code> sert à :<\/div><button class=\"opt\" data-o=\"0\">compresser avec gzip<\/button><button class=\"opt\" data-o=\"1\">lister le contenu<\/button><button class=\"opt\" data-o=\"2\">extraire<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Quelle commande trouve les fichiers modifiés il y a moins de 7 jours ?<\/div><button class=\"opt\" data-o=\"0\"><code>find . -size -7<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>find . -mtime -7<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>ls -t 7<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"commandes-fichiers","rep":null,"tol":null},{"n":"commandes-fichiers","rep":null,"tol":null},{"n":"commandes-fichiers","rep":null,"tol":null},{"n":"commandes-fichiers","rep":null,"tol":null},{"n":"commandes-fichiers","rep":null,"tol":null},{"n":"commandes-fichiers","rep":null,"tol":null}],"qcm":[{"n":"commandes-fichiers","q":"Pour archiver et compresser un répertoire en une seule commande, on utilise :","o":["<code>gzip repertoire/<\/code>","<code>tar -czf archive.tar.gz repertoire/<\/code>","<code>zip -r archive.tar.gz repertoire/<\/code>","<code>tar -cf archive.tar.gz repertoire/<\/code>"],"a":1,"e":"Question 12 de l&#39;examen blanc. Sans <code>z<\/code>, tar ne compresse pas, même si le nom finit par .gz."},{"n":"commandes-fichiers","q":"Quel fichier contient UID, répertoire personnel et shell des utilisateurs ?","o":["/etc/passwd","/etc/shadow","/etc/group","/etc/users"],"a":0,"e":"/etc/shadow contient les mots de passe chiffrés ; /etc/users n&#39;existe pas."},{"n":"commandes-fichiers","q":"Quelle commande affiche les 5 dernières lignes de log.txt ?","o":["<code>head -5 log.txt<\/code>","<code>tail -n 5 log.txt<\/code>","<code>less -5 log.txt<\/code>","<code>cat log.txt | wc -l 5<\/code>"],"a":1,"e":"<code>tail<\/code> = la fin ; <code>head<\/code> = le début."},{"n":"commandes-fichiers","q":"Que fait <code>useradd alice<\/code> sans option ?","o":["Crée le compte sans répertoire personnel","Crée le compte avec /home/alice","Échoue toujours"],"a":0,"e":"Il faut <code>-m<\/code> pour créer le home."},{"n":"commandes-fichiers","q":"<code>cd<\/code> est une commande interne parce que :","o":["elle est trop courte pour être un fichier","un processus fils ne pourrait pas changer le répertoire du shell parent","elle est dans /bin"],"a":1,"e":"Le répertoire courant appartient au processus shell : seul lui peut le changer."},{"n":"commandes-fichiers","q":"Dans vi, quelle commande quitte sans sauvegarder ?","o":["<code>:wq<\/code>","<code>:w<\/code>","<code>:q!<\/code>"],"a":2,"e":"<code>:q<\/code> refuse s&#39;il y a des modifications ; <code>!<\/code> force."},{"n":"commandes-fichiers","q":"Quelle commande ramène au répertoire précédent ?","o":["<code>cd ..<\/code>","<code>cd -<\/code>","<code>cd ~<\/code>"],"a":1,"e":"<code>cd ..<\/code> va au parent, <code>cd ~<\/code> au home."},{"n":"commandes-fichiers","q":"Que fait <code>mv rapport_v1.pdf rapport.pdf<\/code> ?","o":["Renomme le fichier","Copie le fichier","Crée un lien"],"a":0,"e":"mv renomme ou déplace ; il écrase rapport.pdf s&#39;il existe déjà."},{"n":"commandes-fichiers","q":"Avec tar, l&#39;option <code>t<\/code> sert à :","o":["compresser avec gzip","lister le contenu","extraire"],"a":1,"e":"c = créer, x = extraire, t = lister, z = gzip."},{"n":"commandes-fichiers","q":"Quelle commande trouve les fichiers modifiés il y a moins de 7 jours ?","o":["<code>find . -size -7<\/code>","<code>find . -mtime -7<\/code>","<code>ls -t 7<\/code>"],"a":1,"e":"<code>-mtime -7<\/code> : modifié il y a moins de 7 jours."}]},{"id":"droits-acces","t":"Droits d'accès · chmod, chown, umask","seance":"Chapitre III · Commandes de base (partie 8)","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu dois savoir lire la première colonne de <code>ls -l<\/code> (type de fichier, chapitre 3).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Dans <code>-rwxr-xr-- 1 alice dev 1024 script.sh<\/code>, quel est le type du fichier, son propriétaire et son groupe ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Type <code>-<\/code> : fichier régulier. Propriétaire : alice. Groupe : dev.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Découpe toujours les 9 caractères en <strong>trois paquets de trois<\/strong> : propriétaire, groupe, autres. Chaque paquet vaut un chiffre : r = 4, w = 2, x = 1.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Penser qu&#39;un répertoire se lit avec <code>r<\/code> seul. Sur un <strong>répertoire<\/strong>, <code>x<\/code> veut dire « traverser / entrer » (<code>cd<\/code>). Sans <code>x<\/code>, même avec <code>r<\/code>, tu ne peux pas accéder aux fichiers qu&#39;il contient.<\/p>\n<\/aside><p>À la fin, tu sais lire et écrire des droits en notation symbolique et octale, changer propriétaire et groupe, et calculer les droits par défaut avec umask.<\/p>\n<h2>Idée 1 · Trois catégories, trois droits<\/h2>\n<svg viewBox=\"0 0 640 140\" style=\"width:100%;max-width:640px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Découpage de -rwxr-xr-- : type, propriétaire rwx 7, groupe r-x 5, autres r-- 4\">\n<g font-family=\"monospace\" font-size=\"22\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"20\" y=\"20\" width=\"50\" height=\"45\" rx=\"6\" fill=\"none\" stroke=\"currentColor\"/><text x=\"45\" y=\"50\">-<\/text>\n<rect x=\"90\" y=\"20\" width=\"150\" height=\"45\" rx=\"6\" fill=\"#D9824F\" fill-opacity=\"0.2\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"165\" y=\"50\">rwx<\/text>\n<rect x=\"260\" y=\"20\" width=\"150\" height=\"45\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"335\" y=\"50\">r-x<\/text>\n<rect x=\"430\" y=\"20\" width=\"150\" height=\"45\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"505\" y=\"50\">r--<\/text>\n<\/g>\n<g font-family=\"sans-serif\" font-size=\"13\" text-anchor=\"middle\" fill=\"currentColor\">\n<text x=\"45\" y=\"90\">type<\/text><text x=\"165\" y=\"90\">u (propriétaire)<\/text><text x=\"335\" y=\"90\">g (groupe)<\/text><text x=\"505\" y=\"90\">o (autres)<\/text>\n<text x=\"165\" y=\"120\" fill=\"#D9824F\" font-size=\"16\">4+2+1 = 7<\/text><text x=\"335\" y=\"120\" font-size=\"16\">4+0+1 = 5<\/text><text x=\"505\" y=\"120\" font-size=\"16\">4+0+0 = 4<\/text>\n<\/g>\n<\/svg><table>\n<tr><th>Droit<\/th><th>Sur un fichier<\/th><th>Sur un répertoire<\/th><th>Valeur<\/th><\/tr>\n<tr><td>r<\/td><td>lire<\/td><td>lister le contenu<\/td><td>4<\/td><\/tr>\n<tr><td>w<\/td><td>modifier<\/td><td>créer / supprimer des fichiers dedans<\/td><td>2<\/td><\/tr>\n<tr><td>x<\/td><td>exécuter<\/td><td>traverser (entrer avec cd)<\/td><td>1<\/td><\/tr>\n<\/table><p>Exemple : <code>-rwxr-xr--<\/code> = 754.<\/p>\n<h2>Idée 2 · chmod symbolique et octal<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Passer d'une consigne aux droits (TD 2, exercice 4)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Lis la consigne par catégorie<\/div><p>propriétaire lecture-écriture-exécution, groupe lecture-exécution, autres lecture.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · Écris en symbolique<\/div><p><code>chmod u=rwx,g=rx,o=r main.c<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · Convertis chaque paquet<\/div><p>rwx = 7, r-x = 5, r-- = 4.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · Écris en octal<\/div><p><code>chmod 754 main.c<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · Vérifie<\/div><p><code>ls -l main.c<\/code> doit afficher <code>-rwxr-xr--<\/code>.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><ul>\n<li>Symbolique : qui (<code>u<\/code>, <code>g<\/code>, <code>o<\/code>, <code>a<\/code> = tous), opération (<code>+<\/code> ajoute, <code>-<\/code> retire, <code>=<\/code> fixe exactement), droits. <code>chmod u+x script.sh<\/code>, <code>chmod go-w f<\/code>, <code>chmod a=r f<\/code>.<\/li>\n<li>Octal : <code>755<\/code> = rwxr-xr-x (scripts, répertoires), <code>644<\/code> = rw-r--r--, <code>600<\/code> = rw------- (privé, clés SSH), <code>640<\/code> = rw-r-----, <code>770<\/code> = rwxrwx---.<\/li>\n<\/ul>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>La diapo décrit 644 comme « fichier lisible/éditable par le propriétaire seulement ». En réalité 644 = rw-r--r-- : <strong>seul le propriétaire écrit, mais tout le monde lit<\/strong>. Le fichier « privé », c&#39;est 600.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p><code>chmod u+rw,go+r f<\/code> n&#39;est pas toujours égal à <code>chmod 644 f<\/code> : <code>+<\/code> <strong>ajoute<\/strong> sans retirer. Si le fichier avait déjà <code>x<\/code> ou un <code>w<\/code> pour le groupe, il le garde. Pour imposer exactement rw-r--r--, utilise <code>=<\/code> (<code>u=rw,go=r<\/code>) ou l&#39;octal.<\/p>\n<\/aside><h2>Idée 3 · chown et chgrp<\/h2>\n<pre class=\"\"><code>sudo chown alice rapport.pdf          # propriétaire\nsudo chgrp dev script.sh              # groupe\nsudo chown alice:dev script.sh        # les deux\nsudo chown :dev fichier               # seulement le groupe\nsudo chown -R alice:dev /home/alice/projet   # récursif<\/code><\/pre><p>Changer le propriétaire demande root. Un utilisateur peut changer le groupe d&#39;un de ses fichiers vers un groupe dont il est membre.<\/p>\n<h2>Idée 4 · umask, les droits par défaut<\/h2>\n<p><code>umask<\/code> dit quels droits <strong>retirer<\/strong> à la création. Base : <strong>666<\/strong> pour un fichier (jamais de <code>x<\/code> par défaut), <strong>777<\/strong> pour un répertoire.<\/p>\n<p>Exemple chiffré avec umask 022 : fichier 666 − 022 = <strong>644<\/strong> (rw-r--r--), répertoire 777 − 022 = <strong>755<\/strong>. Avec umask 007 : fichiers 660, répertoires 770.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le cours présente le calcul comme une soustraction. Ça marche pour 022 et 007, mais le vrai calcul retire des <strong>bits<\/strong> : droits = base ET (NON umask). Avec umask 033, la soustraction donnerait 666 − 033 = 633, alors que bash crée réellement des fichiers en <strong>644<\/strong> (vérifié). Méthode sûre : pour chaque chiffre, enlève les droits présents dans le umask, sans jamais descendre « sous » zéro bit.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>TD 1, TD 2 et examen blanc<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Que signifie <code>chmod 640 fichier.txt<\/code> ? (question 30)<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Propriétaire rw- (6), groupe r-- (4), autres --- (0) : <code>-rw-r-----<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Rends <code>docs/<\/code> accessible uniquement à son propriétaire et au groupe developpeurs, avec tous les droits pour eux.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : chmod 770 docs<\/b><\/p><p><code>chmod 770 docs<\/code> : rwx pour u et g, rien pour o.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Avec umask 027, quels droits aura un nouveau fichier ? (en octal)<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 640<\/b><\/p><p>Base 666. On retire 0 au propriétaire (rw-), 2 au groupe (r--), 7 aux autres (---) : <strong>640<\/strong>.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Tous les fichiers de src/ doivent être lisibles par tous et exécutables uniquement par le propriétaire. Quelle commande ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>chmod 744 projet-web/src/*<\/code> (rwxr--r--).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>La correction du TD 1 (exercice 5, question 6) donne <code>chmod 644<\/code>, puis écrit « si on voulait autoriser l&#39;exécution par le propriétaire, on mettrait 744, mais ici ce n&#39;est pas demandé ». Or l&#39;énoncé le demande bien (« exécutables uniquement par le propriétaire »). La bonne réponse est <strong>744<\/strong>.<\/p>\n<\/aside><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 9 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Que signifie <code>chmod 640 fichier.txt<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">Propriétaire rw-, groupe r--, autres ---<\/button><button class=\"opt\" data-o=\"1\">Propriétaire rwx, groupe r--, autres ---<\/button><button class=\"opt\" data-o=\"2\">Propriétaire r--, groupe rw-, autres ---<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Les droits <code>rwxr-xr-x<\/code> valent en octal :<\/div><button class=\"opt\" data-o=\"0\">644<\/button><button class=\"opt\" data-o=\"1\">755<\/button><button class=\"opt\" data-o=\"2\">775<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Avec umask 022, un fichier créé a les droits :<\/div><button class=\"opt\" data-o=\"0\">644<\/button><button class=\"opt\" data-o=\"1\">755<\/button><button class=\"opt\" data-o=\"2\">666<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Sur un répertoire, le droit <code>x<\/code> permet :<\/div><button class=\"opt\" data-o=\"0\">d&#39;exécuter tous les fichiers dedans<\/button><button class=\"opt\" data-o=\"1\">d&#39;y entrer et d&#39;accéder à son contenu<\/button><button class=\"opt\" data-o=\"2\">de le supprimer<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Quelle commande retire l&#39;écriture au groupe et aux autres ?<\/div><button class=\"opt\" data-o=\"0\"><code>chmod go+w f<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>chmod go-w f<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>chmod a=w f<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Quelle commande rend <code>script.sh<\/code> exécutable pour tout le monde ?<\/div><button class=\"opt\" data-o=\"0\"><code>chmod a+x script.sh<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>chmod u+x script.sh<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>chmod 644 script.sh<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\"><code>chown :dev fichier<\/code> :<\/div><button class=\"opt\" data-o=\"0\">change le propriétaire en dev<\/button><button class=\"opt\" data-o=\"1\">change seulement le groupe en dev<\/button><button class=\"opt\" data-o=\"2\">supprime le groupe<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Pourquoi éviter <code>chmod 777<\/code> en production ?<\/div><button class=\"opt\" data-o=\"0\">Tout le monde peut lire, modifier et exécuter le fichier<\/button><button class=\"opt\" data-o=\"1\">Le fichier devient invisible<\/button><button class=\"opt\" data-o=\"2\">Le fichier n&#39;est plus exécutable<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Un fichier privé (clé SSH) doit avoir :<\/div><button class=\"opt\" data-o=\"0\">644<\/button><button class=\"opt\" data-o=\"1\">755<\/button><button class=\"opt\" data-o=\"2\">600<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Avec umask 077, un nouveau répertoire a :<\/div><button class=\"opt\" data-o=\"0\">777<\/button><button class=\"opt\" data-o=\"1\">700<\/button><button class=\"opt\" data-o=\"2\">755<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"droits-acces","rep":null,"tol":null},{"n":"droits-acces","rep":null,"tol":null},{"n":"droits-acces","rep":["chmod 770 docs"],"tol":null},{"n":"droits-acces","rep":["640"],"tol":null},{"n":"droits-acces","rep":null,"tol":null}],"qcm":[{"n":"droits-acces","q":"Que signifie <code>chmod 640 fichier.txt<\/code> ?","o":["Propriétaire rw-, groupe r--, autres ---","Propriétaire rwx, groupe r--, autres ---","Propriétaire r--, groupe rw-, autres ---"],"a":0,"e":"6 = 4+2 (rw), 4 = r, 0 = rien."},{"n":"droits-acces","q":"Les droits <code>rwxr-xr-x<\/code> valent en octal :","o":["644","755","775"],"a":1,"e":"7, 5, 5."},{"n":"droits-acces","q":"Avec umask 022, un fichier créé a les droits :","o":["644","755","666"],"a":0,"e":"666 − 022 = 644. Le 755 concerne les répertoires."},{"n":"droits-acces","q":"Sur un répertoire, le droit <code>x<\/code> permet :","o":["d&#39;exécuter tous les fichiers dedans","d&#39;y entrer et d&#39;accéder à son contenu","de le supprimer"],"a":1,"e":"C&#39;est le droit de traversée."},{"n":"droits-acces","q":"Quelle commande retire l&#39;écriture au groupe et aux autres ?","o":["<code>chmod go+w f<\/code>","<code>chmod go-w f<\/code>","<code>chmod a=w f<\/code>"],"a":1,"e":"<code>-<\/code> retire."},{"n":"droits-acces","q":"Quelle commande rend <code>script.sh<\/code> exécutable pour tout le monde ?","o":["<code>chmod a+x script.sh<\/code>","<code>chmod u+x script.sh<\/code>","<code>chmod 644 script.sh<\/code>"],"a":0,"e":"<code>a<\/code> = all (u, g et o)."},{"n":"droits-acces","q":"<code>chown :dev fichier<\/code> :","o":["change le propriétaire en dev","change seulement le groupe en dev","supprime le groupe"],"a":1,"e":"Rien avant les deux-points : le propriétaire ne change pas."},{"n":"droits-acces","q":"Pourquoi éviter <code>chmod 777<\/code> en production ?","o":["Tout le monde peut lire, modifier et exécuter le fichier","Le fichier devient invisible","Le fichier n&#39;est plus exécutable"],"a":0,"e":"C&#39;est un risque de sécurité majeur sur une machine partagée."},{"n":"droits-acces","q":"Un fichier privé (clé SSH) doit avoir :","o":["644","755","600"],"a":2,"e":"Lecture-écriture pour le propriétaire, rien pour les autres."},{"n":"droits-acces","q":"Avec umask 077, un nouveau répertoire a :","o":["777","700","755"],"a":1,"e":"777 sans les bits de 077 : rwx------."}]},{"id":"redirections-filtres-processus","t":"Redirections, filtres, composition et processus","seance":"Chapitre III · Commandes de base (parties 9 à 12)","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu dois connaître <code>cat<\/code>, <code>sort<\/code>, <code>wc<\/code>, <code>head<\/code> et <code>tail<\/code> (chapitre 5).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Que fait <code>wc -l fichier.txt<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Elle affiche le nombre de lignes de fichier.txt.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Imagine chaque commande comme une machine avec <strong>une entrée (0)<\/strong> et <strong>deux sorties : normale (1) et erreurs (2)<\/strong>. Les redirections branchent ces tuyaux sur des fichiers ; le pipe <code>|<\/code> branche la sortie 1 d&#39;une commande sur l&#39;entrée 0 de la suivante.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p><code>&gt;<\/code> <strong>écrase<\/strong> le fichier, <code>&gt;&gt;<\/code> <strong>ajoute<\/strong> à la fin. Un <code>&gt;<\/code> de trop, et ton journal est vidé.<\/p>\n<\/aside><p>À la fin, tu sais rediriger entrées, sorties et erreurs, enchaîner des filtres (grep, cut, sort, uniq, tr, sed, awk), composer des commandes (<code>;<\/code>, <code>&amp;<\/code>, <code>&amp;&amp;<\/code>, <code>||<\/code>, <code>( )<\/code>, <code>{ }<\/code>) et piloter des processus (ps, kill, jobs, bg, fg, nice).<\/p>\n<h2>Idée 1 · Les trois flux et leurs redirections<\/h2>\n<svg viewBox=\"0 0 640 150\" style=\"width:100%;max-width:640px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Une commande reçoit stdin 0 et produit stdout 1 et stderr 2, chacun redirigeable\">\n<g font-family=\"sans-serif\" font-size=\"14\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"250\" y=\"45\" width=\"140\" height=\"60\" rx=\"10\" fill=\"#D9824F\" fill-opacity=\"0.2\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"320\" y=\"80\" font-weight=\"700\">commande<\/text>\n<text x=\"100\" y=\"70\">0 stdin (clavier)<\/text><text x=\"100\" y=\"92\" font-family=\"monospace\">&lt; fichier<\/text>\n<text x=\"530\" y=\"45\">1 stdout (écran)<\/text><text x=\"530\" y=\"65\" font-family=\"monospace\">&gt;  &gt;&gt;  |<\/text>\n<text x=\"530\" y=\"110\">2 stderr (écran)<\/text><text x=\"530\" y=\"130\" font-family=\"monospace\">2&gt;  2&gt;&amp;1<\/text>\n<\/g>\n<g stroke=\"currentColor\" stroke-width=\"2\"><line x1=\"170\" y1=\"75\" x2=\"250\" y2=\"75\"/><line x1=\"390\" y1=\"60\" x2=\"460\" y2=\"50\"/><line x1=\"390\" y1=\"90\" x2=\"460\" y2=\"108\"/><\/g>\n<\/svg><table>\n<tr><th>Écriture<\/th><th>Effet<\/th><\/tr>\n<tr><td><code>cmd &gt; f<\/code><\/td><td>sortie dans f (écrase)<\/td><\/tr>\n<tr><td><code>cmd &gt;&gt; f<\/code><\/td><td>sortie ajoutée à la fin de f<\/td><\/tr>\n<tr><td><code>cmd &lt; f<\/code><\/td><td>f devient l'entrée<\/td><\/tr>\n<tr><td><code>cmd 2&gt; err.log<\/code><\/td><td>erreurs dans err.log<\/td><\/tr>\n<tr><td><code>cmd 2&gt;/dev/null<\/code><\/td><td>erreurs jetées, sortie normale affichée<\/td><\/tr>\n<tr><td><code>cmd &gt; tout.log 2&gt;&amp;1<\/code><\/td><td>sortie et erreurs dans le même fichier (portable) ; <code>&amp;&gt;<\/code> en bash<\/td><\/tr>\n<tr><td><code>cmd &lt;&lt; EOF … EOF<\/code><\/td><td>here document : bloc de lignes en entrée<\/td><\/tr>\n<tr><td><code>cmd &lt;&lt;&lt; \"texte\"<\/code><\/td><td>here string : une chaîne en entrée (<code>bc &lt;&lt;&lt; \"2 + 3 * 4\"<\/code> donne 14)<\/td><\/tr>\n<\/table><p>Exemple : <code>wc -l &lt; texte.txt<\/code> affiche juste le nombre (« 7 »), alors que <code>wc -l texte.txt<\/code> affiche « 7 texte.txt ». C&#39;est pour ça que le TD 3 utilise <code>&lt;<\/code> quand on veut stocker uniquement le nombre.<\/p>\n<h2>Idée 2 · Les filtres et le pipe<\/h2>\n<figure class=\"flux\"><figcaption>Exemple du TD 3<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">sort donnees.txt<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">uniq (enlève les doublons voisins)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">tr &#39;a-z&#39; &#39;A-Z&#39; (majuscules)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">&gt; resultat_final.txt<\/div><\/div><\/figure><p>Résultat sur Alice, Bob, Charlie, Alice, David, Bob, Eve : ALICE, BOB, CHARLIE, DAVID, EVE. <code>uniq<\/code> ne supprime que les doublons <strong>adjacents<\/strong> : c&#39;est pour ça qu&#39;on trie d&#39;abord.<\/p>\n<table>\n<tr><th>Filtre<\/th><th>Rôle<\/th><th>Exemple<\/th><\/tr>\n<tr><td>grep<\/td><td>garde les lignes qui contiennent un motif ; <code>-i<\/code> casse, <code>-v<\/code> inverse, <code>-c<\/code> compte, <code>-n<\/code> numéros, <code>-r<\/code> récursif, <code>-l<\/code> noms de fichiers<\/td><td><code>grep -i \"erreur\" app.log<\/code><\/td><\/tr>\n<tr><td>cut<\/td><td>extrait des champs (<code>-d<\/code> séparateur, <code>-f<\/code> champs) ou des caractères (<code>-c<\/code>)<\/td><td><code>cut -d: -f1 /etc/passwd<\/code> ; <code>echo abcde | cut -c2-4<\/code> donne bcd<\/td><\/tr>\n<tr><td>sed<\/td><td>édite le flux : <code>s/ancien/nouveau/g<\/code>, <code>2,5d<\/code>, <code>/^#/d<\/code> ; <code>-i<\/code> modifie le fichier<\/td><td><code>sed 's/foo/bar/g' f<\/code><\/td><\/tr>\n<tr><td>awk<\/td><td>découpe en champs <code>$1<\/code>, <code>$2<\/code>… (<code>$0<\/code> ligne, <code>NF<\/code> nb de champs, <code>NR<\/code> n° de ligne), conditions, calculs<\/td><td><code>awk -F, '$3 &gt; 35' users.csv<\/code><\/td><\/tr>\n<tr><td>sort, uniq, tr, wc<\/td><td>trier, dédoublonner (<code>uniq -c<\/code> compte), traduire des caractères, compter<\/td><td><code>cut -d: -f7 /etc/passwd | sort | uniq -c<\/code><\/td><\/tr>\n<\/table><figure class=\"etapes\" data-i=\"0\"><figcaption>Les 3 utilisateurs les plus jeunes (TD 3, exercice 2)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Le séparateur<\/div><p>le fichier est un CSV, donc <code>-t &#39;,&#39;<\/code> pour sort.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · La colonne<\/div><p>l&#39;âge est le champ 3 : <code>-k3<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · Le type de tri<\/div><p>numérique, sinon « 100 » passerait avant « 26 » : <code>-n<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · Garder le début<\/div><p><code>head -n 3<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · La commande<\/div><p><code>sort -t &#39;,&#39; -k3 -n utilisateurs.csv | head -n 3<\/code> donne Petit (26), Dubois (31), Dupont (34).<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Idée 3 · Composer des commandes<\/h2>\n<table>\n<tr><th>Écriture<\/th><th>Sens<\/th><\/tr>\n<tr><td><code>cmd1 ; cmd2<\/code><\/td><td>l'une après l'autre, quoi qu'il arrive<\/td><\/tr>\n<tr><td><code>cmd &amp;<\/code><\/td><td>en arrière-plan, le prompt revient tout de suite<\/td><\/tr>\n<tr><td><code>cmd1 &amp;&amp; cmd2<\/code><\/td><td>cmd2 seulement si cmd1 réussit (code retour 0)<\/td><\/tr>\n<tr><td><code>cmd1 || cmd2<\/code><\/td><td>cmd2 seulement si cmd1 échoue (code ≠ 0)<\/td><\/tr>\n<tr><td><code>( cmds )<\/code><\/td><td>dans un <b>sous-shell<\/b> (processus fils)<\/td><\/tr>\n<tr><td><code>{ cmds ; }<\/code><\/td><td>dans le shell courant (espace après <code>{<\/code>, <code>;<\/code> avant <code>}<\/code>)<\/td><\/tr>\n<\/table><p>Exemple du cours, depuis <code>/home/etudiant<\/code> : <code>(cd cours ; pwd)<\/code> affiche <code>/home/etudiant/cours<\/code>, puis <code>pwd<\/code> affiche encore <code>/home/etudiant<\/code> (le <code>cd<\/code> a eu lieu dans le fils). Avec <code>{ cd cours ; pwd ; }<\/code>, on reste dans <code>cours<\/code>.<\/p>\n<p>Exemple pratique : <code>gcc main.c -o main &amp;&amp; ./main<\/code> lance le programme seulement si la compilation a réussi.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>La diapo du « ; » écrit <code>ls -f file.c ; wc -l file.c<\/code> pour « lister file.c ». L&#39;option voulue est <code>-l<\/code> (format long) ; <code>-f<\/code> désactive le tri et n&#39;a rien à voir.<\/p>\n<\/aside><h2>Idée 4 · Les processus<\/h2>\n<ul>\n<li><code>ps aux<\/code> (style BSD : tous, format utilisateur, y compris sans terminal) ou <code>ps -ef<\/code> (style POSIX, avec PPID). Colonnes : PID, PPID, STAT (R en cours, S endormi, Z zombie), %CPU, %MEM. <code>pstree -p<\/code> montre l&#39;arbre (racine : systemd, PID 1). <code>top<\/code> en temps réel (<code>k<\/code> pour tuer, <code>q<\/code> pour quitter).<\/li>\n<li>Signaux : <strong>SIGTERM (15)<\/strong> demande polie, par défaut de <code>kill<\/code> ; <strong>SIGKILL (9)<\/strong> arrêt immédiat, non interceptable ; <strong>SIGHUP (1)<\/strong> souvent « recharge la config ». <code>kill PID<\/code>, <code>kill -9 PID<\/code>, <code>killall nom<\/code>, <code>pkill nom<\/code>.<\/li>\n<li>Priorité : <code>nice -n 10 cmd<\/code>, <code>renice -n 5 -p PID<\/code>. Valeurs de −20 (plus prioritaire) à +19 ; défaut 0 ; seul root met une valeur négative.<\/li>\n<li>Jobs du shell : <code>Ctrl+Z<\/code> suspend, <code>jobs<\/code> liste (<code>%1<\/code>, <code>%2<\/code>), <code>bg %1<\/code> reprend en arrière-plan, <code>fg %1<\/code> ramène au premier plan, <code>cmd &amp;<\/code> lance en arrière-plan. <code>nohup cmd &amp;<\/code> survit à la fermeture du terminal.<\/li>\n<\/ul>\n<pre class=\"\"><code>sleep 120 &amp;          # le shell affiche [1] 12345 : numéro de job et PID\njobs                 # [1]+  Running   sleep 120 &amp;\nfg %1                # premier plan, puis Ctrl+Z pour suspendre\nbg %1                # reprend en arrière-plan\nkill %1              # SIGTERM au job 1<\/code><\/pre><p><em>(sortie indicative : le PID change à chaque fois)<\/em><\/p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Essaie toujours <code>kill<\/code> (SIGTERM) avant <code>kill -9<\/code> : SIGKILL ne laisse pas le processus fermer proprement ses fichiers et connexions.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>TD 3, TP 3 et examen blanc<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Lance <code>grep &quot;404&quot; access.log<\/code> en jetant les erreurs mais en gardant la sortie normale (question 31).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>grep &quot;404&quot; access.log 2&gt;/dev/null<\/code><\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Que fait <code>nohup ./long_process.sh &gt; sortie.log 2&gt;&amp;1 &amp;<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>nohup<\/code> : le script continue même si on ferme le terminal. <code>&gt; sortie.log<\/code> : stdout dans le fichier. <code>2&gt;&amp;1<\/code> : stderr va au même endroit que stdout. <code>&amp;<\/code> : en arrière-plan.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Avec awk, affiche les utilisateurs de plus de 35 ans du fichier CSV (âge en champ 3).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>awk -F&#39;,&#39; &#39;$3 &gt; 35&#39; utilisateurs.csv<\/code> donne Lefevre (45), Durand (37), Garnier (50).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Combien d&#39;utilisateurs du service Informatique dans le CSV du TD 3 ? (commande puis nombre)<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 3<\/b><\/p><p><code>grep &quot;,Informatique,&quot; utilisateurs.csv | wc -l<\/code> donne <strong>3<\/strong> (Dupont, Lefevre, Durand). Les virgules autour du mot évitent de capturer un autre champ.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>Comment tuer tous les processus nommés python ? (question 34)<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>killall python<\/code> ou <code>pkill python<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 10 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quelle séquence exécute cmd2 uniquement si cmd1 réussit ?<\/div><button class=\"opt\" data-o=\"0\"><code>cmd1 ; cmd2<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>cmd1 || cmd2<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>cmd1 &amp;&amp; cmd2<\/code><\/button><button class=\"opt\" data-o=\"3\"><code>cmd1 | cmd2<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Quelle commande recherche « erreur » sans tenir compte de la casse ?<\/div><button class=\"opt\" data-o=\"0\"><code>grep -i &quot;erreur&quot; fichier<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>grep &quot;erreur&quot; -c fichier<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>find . -name &quot;*erreur*&quot;<\/code><\/button><button class=\"opt\" data-o=\"3\"><code>cat fichier | sed &quot;erreur&quot;<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Quelle commande affiche les 5 dernières lignes de data.csv en temps réel ?<\/div><button class=\"opt\" data-o=\"0\"><code>head -n 5 data.csv<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>tail -n 5 -f data.csv<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>less -f data.csv<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Que fait <code>ps aux | grep firefox<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">Affiche les processus dont la ligne contient « firefox »<\/button><button class=\"opt\" data-o=\"1\">Lance Firefox en arrière-plan<\/button><button class=\"opt\" data-o=\"2\">Tue Firefox<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Que signifie <code>2&gt;&amp;1<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">Envoie la sortie vers le fichier 2<\/button><button class=\"opt\" data-o=\"1\">Redirige stderr vers la même destination que stdout<\/button><button class=\"opt\" data-o=\"2\">Lance deux commandes<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Quel signal ne peut pas être intercepté ?<\/div><button class=\"opt\" data-o=\"0\">SIGTERM<\/button><button class=\"opt\" data-o=\"1\">SIGHUP<\/button><button class=\"opt\" data-o=\"2\">SIGKILL<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Depuis <code>/home/etudiant<\/code>, après <code>(cd cours ; pwd)<\/code>, que donne <code>pwd<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">/home/etudiant<\/button><button class=\"opt\" data-o=\"1\">/home/etudiant/cours<\/button><button class=\"opt\" data-o=\"2\">une erreur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Pourquoi trier avant <code>uniq<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">uniq ne supprime que les doublons adjacents<\/button><button class=\"opt\" data-o=\"1\">uniq ne lit que des fichiers triés, sinon il plante<\/button><button class=\"opt\" data-o=\"2\">sort supprime déjà les doublons<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Quelle valeur nice donne la priorité la plus haute ?<\/div><button class=\"opt\" data-o=\"0\">−20<\/button><button class=\"opt\" data-o=\"1\">0<\/button><button class=\"opt\" data-o=\"2\">+19<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\"><code>cut -d: -f1 /etc/passwd<\/code> affiche :<\/div><button class=\"opt\" data-o=\"0\">les mots de passe<\/button><button class=\"opt\" data-o=\"1\">les noms d&#39;utilisateurs<\/button><button class=\"opt\" data-o=\"2\">les shells<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"redirections-filtres-processus","rep":null,"tol":null},{"n":"redirections-filtres-processus","rep":null,"tol":null},{"n":"redirections-filtres-processus","rep":null,"tol":null},{"n":"redirections-filtres-processus","rep":null,"tol":null},{"n":"redirections-filtres-processus","rep":["3"],"tol":null},{"n":"redirections-filtres-processus","rep":null,"tol":null}],"qcm":[{"n":"redirections-filtres-processus","q":"Quelle séquence exécute cmd2 uniquement si cmd1 réussit ?","o":["<code>cmd1 ; cmd2<\/code>","<code>cmd1 || cmd2<\/code>","<code>cmd1 &amp;&amp; cmd2<\/code>","<code>cmd1 | cmd2<\/code>"],"a":2,"e":"Question 14 de l&#39;examen blanc."},{"n":"redirections-filtres-processus","q":"Quelle commande recherche « erreur » sans tenir compte de la casse ?","o":["<code>grep -i &quot;erreur&quot; fichier<\/code>","<code>grep &quot;erreur&quot; -c fichier<\/code>","<code>find . -name &quot;*erreur*&quot;<\/code>","<code>cat fichier | sed &quot;erreur&quot;<\/code>"],"a":0,"e":"<code>-i<\/code> = insensible à la casse ; <code>-c<\/code> compte."},{"n":"redirections-filtres-processus","q":"Quelle commande affiche les 5 dernières lignes de data.csv en temps réel ?","o":["<code>head -n 5 data.csv<\/code>","<code>tail -n 5 -f data.csv<\/code>","<code>less -f data.csv<\/code>"],"a":1,"e":"<code>-f<\/code> suit le fichier au fur et à mesure (question 32)."},{"n":"redirections-filtres-processus","q":"Que fait <code>ps aux | grep firefox<\/code> ?","o":["Affiche les processus dont la ligne contient « firefox »","Lance Firefox en arrière-plan","Tue Firefox"],"a":0,"e":"ps liste tous les processus, grep filtre (question 33)."},{"n":"redirections-filtres-processus","q":"Que signifie <code>2&gt;&amp;1<\/code> ?","o":["Envoie la sortie vers le fichier 2","Redirige stderr vers la même destination que stdout","Lance deux commandes"],"a":1,"e":"2 = stderr, &amp;1 = « là où va le flux 1 »."},{"n":"redirections-filtres-processus","q":"Quel signal ne peut pas être intercepté ?","o":["SIGTERM","SIGHUP","SIGKILL"],"a":2,"e":"SIGKILL (9) tue immédiatement."},{"n":"redirections-filtres-processus","q":"Depuis <code>/home/etudiant<\/code>, après <code>(cd cours ; pwd)<\/code>, que donne <code>pwd<\/code> ?","o":["/home/etudiant","/home/etudiant/cours","une erreur"],"a":0,"e":"Les parenthèses créent un sous-shell : son <code>cd<\/code> ne touche pas le shell parent."},{"n":"redirections-filtres-processus","q":"Pourquoi trier avant <code>uniq<\/code> ?","o":["uniq ne supprime que les doublons adjacents","uniq ne lit que des fichiers triés, sinon il plante","sort supprime déjà les doublons"],"a":0,"e":"Sans tri, « Alice … Alice » séparées resteraient toutes les deux. (<code>sort -u<\/code> fait les deux d&#39;un coup.)"},{"n":"redirections-filtres-processus","q":"Quelle valeur nice donne la priorité la plus haute ?","o":["−20","0","+19"],"a":0,"e":"Plus la valeur est basse, plus le processus est prioritaire ; seul root peut descendre sous 0."},{"n":"redirections-filtres-processus","q":"<code>cut -d: -f1 /etc/passwd<\/code> affiche :","o":["les mots de passe","les noms d&#39;utilisateurs","les shells"],"a":1,"e":"Champ 1 avec le séparateur <code>:<\/code>. Le shell est le champ 7."}]},{"id":"shell-variables","t":"Shell (1) · variables, quotes, calcul et scripts","seance":"Chapitre IV · Programmation shell (parties 1 à 5)","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu dois savoir ce qu&#39;est un sous-shell : une commande entre <code>( )<\/code> ou un <code>bash<\/code> lancé depuis le shell s&#39;exécute dans un <strong>processus fils<\/strong> (chapitre 7).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Depuis <code>/home/etudiant<\/code>, tu tapes <code>(cd /tmp)<\/code> puis <code>pwd<\/code>. Qu&#39;affiche pwd ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>/home/etudiant<\/code> : le <code>cd<\/code> a eu lieu dans le sous-shell, qui est mort aussitôt.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Avant d&#39;exécuter une ligne, le shell la <strong>réécrit<\/strong> : il remplace les variables, les substitutions de commande, puis gère redirections et motifs. Pour prévoir un résultat, fais cette réécriture à la main.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Mettre des espaces autour du <code>=<\/code>. <code>mois = janvier<\/code> ne crée pas de variable : le shell cherche une commande appelée <code>mois<\/code>. On écrit <code>mois=janvier<\/code>, collé.<\/p>\n<\/aside><p>À la fin, tu sais créer, lire, protéger et exporter une variable, choisir entre <code>&#39;…&#39;<\/code> et <code>&quot;…&quot;<\/code>, faire un calcul entier, utiliser <code>read<\/code> et <code>echo<\/code>, et écrire un script qui exploite <code>$0<\/code>, <code>$1<\/code>, <code>$#<\/code>, <code>$@<\/code>, <code>$?<\/code>, <code>$$<\/code>.<\/p>\n<h2>Idée 1 · Les variables<\/h2>\n<ul>\n<li>Pas de type : toute valeur est une <strong>chaîne<\/strong>. Pas de déclaration. Majuscules et minuscules sont distinctes.<\/li>\n<li>Affecter : <code>mois=janvier<\/code>. Lire : <code>$mois<\/code>. Accolades pour coller du texte : <code>${vol}60<\/code>.<\/li>\n<li><code>unset mois<\/code> détruit ; <code>readonly mois<\/code> interdit toute modification (et toute destruction) jusqu&#39;à la fin du shell.<\/li>\n<li><code>alias ll=&quot;ls -l&quot;<\/code> crée un raccourci ; <code>alias<\/code> les liste ; <code>unalias ll<\/code> le supprime.<\/li>\n<\/ul>\n<pre class=\"\"><code>vol=volume\necho $vol60       # rien : la variable vol60 n'existe pas\necho ${vol}60     # volume60<\/code><\/pre><svg viewBox=\"0 0 640 150\" style=\"width:100%;max-width:640px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Une variable exportée descend du shell père vers le fils ; jamais du fils vers le père\">\n<g font-family=\"sans-serif\" font-size=\"14\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"40\" y=\"30\" width=\"220\" height=\"80\" rx=\"10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"150\" y=\"55\" font-weight=\"700\">shell père<\/text><text x=\"150\" y=\"80\" font-family=\"monospace\">a=35 ; export a<\/text>\n<rect x=\"380\" y=\"30\" width=\"220\" height=\"80\" rx=\"10\" fill=\"#D9824F\" fill-opacity=\"0.2\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"490\" y=\"55\" font-weight=\"700\">sous-shell (bash)<\/text><text x=\"490\" y=\"80\" font-family=\"monospace\">echo $a → 35<\/text>\n<text x=\"320\" y=\"52\" fill=\"#D9824F\">export ✓<\/text><text x=\"320\" y=\"135\">du fils vers le père : jamais<\/text>\n<\/g>\n<g stroke=\"currentColor\" stroke-width=\"2\"><line x1=\"260\" y1=\"62\" x2=\"380\" y2=\"62\"/><line x1=\"380\" y1=\"95\" x2=\"260\" y2=\"95\" stroke-dasharray=\"5\"/><\/g>\n<\/svg><ul>\n<li><strong>Locale<\/strong> : connue du seul shell qui l&#39;a créée. <code>a=35 ; bash<\/code> puis <code>echo $a<\/code> dans le fils : rien.<\/li>\n<li><strong>D&#39;environnement<\/strong> : après <code>export a<\/code> (ou <code>export a=35<\/code>), elle est <strong>transmise aux fils<\/strong>. Jamais l&#39;inverse : <code>(B=20 ; export B)<\/code> puis <code>echo $B<\/code> n&#39;affiche rien.<\/li>\n<li>Variables usuelles : <code>HOME<\/code>, <code>PATH<\/code> (où chercher les commandes), <code>PS1<\/code> (prompt), <code>USER<\/code>, <code>PWD<\/code>, <code>SHELL<\/code>, <code>LANG<\/code>, <code>HISTSIZE<\/code>, <code>RANDOM<\/code> (0 à 32767), <code>SECONDS<\/code>. <code>env<\/code> les affiche.<\/li>\n<\/ul>\n<h2>Idée 2 · Quotes et substitution de commande<\/h2>\n<table>\n<tr><th>Écriture<\/th><th>Ce qui reste interprété<\/th><th>Exemple avec a=20<\/th><th>Affiche<\/th><\/tr>\n<tr><td><code>\\x<\/code><\/td><td>tout sauf le caractère suivant<\/td><td><code>echo \\$a<\/code><\/td><td>$a<\/td><\/tr>\n<tr><td><code>'…'<\/code><\/td><td><b>rien<\/b><\/td><td><code>echo 'a=$a &gt; res'<\/code><\/td><td>a=$a &gt; res<\/td><\/tr>\n<tr><td><code>\"…\"<\/code><\/td><td>seulement <code>$<\/code>, <code>\\<\/code>, <code>\"<\/code>, <code>`<\/code><\/td><td><code>echo \"a=$a &gt; res\"<\/code><\/td><td>a=20 &gt; res<\/td><\/tr>\n<tr><td>sans quotes<\/td><td>tout<\/td><td><code>echo a=$a &gt; res<\/code><\/td><td>(rien : écrit « a=20 » dans res)<\/td><\/tr>\n<\/table><p>Ces trois résultats ont été vérifiés dans bash.<\/p>\n<p><strong>Substitution de commande<\/strong> : <code>$(commande)<\/code> ou <code>`commande`<\/code> est remplacé par ce que la commande affiche.<\/p>\n<pre class=\"\"><code>rep=$(pwd) ; echo $rep          # /home/etudiant/cours\necho &quot;la date est $(date)&quot;      # la date est mardi 25 novembre 2025, 11:59:10<\/code><\/pre><p><em>(sortie indicative)<\/em><\/p>\n<h2>Idée 3 · Calcul sur les entiers<\/h2>\n<p><code>var=10 ; var=$var+2 ; echo $var<\/code> affiche <strong>10+2<\/strong> : c&#39;est une chaîne. Pour calculer, trois outils :<\/p>\n<table>\n<tr><th>Outil<\/th><th>Exemple<\/th><th>À savoir<\/th><\/tr>\n<tr><td><code>expr<\/code><\/td><td><code>b=`expr $a + 1`<\/code> ; <code>expr 2 \\* 3<\/code><\/td><td>espaces obligatoires ; <code>*<\/code>, <code>(<\/code>, <code>)<\/code> à échapper<\/td><\/tr>\n<tr><td><code>$(( ))<\/code><\/td><td><code>d=$(( (a + c) * b ))<\/code><\/td><td>parenthèses sans <code>\\<\/code>, <code>$<\/code> facultatif devant les noms<\/td><\/tr>\n<tr><td><code>let<\/code><\/td><td><code>let i=i+1<\/code> ; <code>let var=\"(2+a)*5\"<\/code><\/td><td>évalue puis affecte<\/td><\/tr>\n<\/table><p>Exemple chiffré : <code>a=12 ; b=$((a / 5))<\/code> donne <strong>2<\/strong> (division entière) ; <code>expr 6 % 4<\/code> donne <strong>2<\/strong> (reste).<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>La diapo propose <code>let a=1 + 2<\/code>. Ça échoue dans bash (« let: +: syntax error ») car <code>let<\/code> reçoit trois arguments séparés. Écris <code>let a=1+2<\/code> ou <code>let a=&quot;1 + 2&quot;<\/code>.<\/p>\n<\/aside><h2>Idée 4 · read et echo<\/h2>\n<p><code>read v1 v2 v3<\/code> lit une ligne au clavier et coupe aux espaces :<\/p>\n<ul>\n<li>autant de valeurs que de variables : une chacune ;<\/li>\n<li>moins de valeurs : les dernières variables sont vides ;<\/li>\n<li>plus de valeurs : <strong>la dernière variable prend tout le reste<\/strong>. Avec « val1 val2 val3 val4 val5 », <code>v3<\/code> vaut « val3 val4 val5 » (vérifié).<\/li>\n<li>sans nom de variable, la ligne va dans <code>REPLY<\/code>. <code>read -p &quot;Question : &quot; x<\/code> affiche une invite (utilisé dans le TD 4).<\/li>\n<\/ul>\n<p><code>echo -n<\/code> : pas de retour à la ligne (<code>echo -n 1 ; echo 2<\/code> affiche 12). <code>echo -e<\/code> : interprète <code>\\n<\/code>, <code>\\t<\/code>, <code>\\c<\/code>, <code>\\\\<\/code>.<\/p>\n<h2>Idée 5 · Script et paramètres<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Écrire et lancer un script<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Première ligne<\/div><p><code>#!/bin/bash<\/code> (le shell qui interprétera le script).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · Le code<\/div><p>une commande par ligne ; <code>#<\/code> commence un commentaire.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · Fin<\/div><p><code>exit n<\/code> avec n entre 0 et 255 (0 = succès). Sans exit, le code est celui de la dernière commande.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · Droit d&#39;exécution<\/div><p><code>chmod +x prog_debut<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · Lancement<\/div><p><code>./prog_debut<\/code> si le répertoire courant n&#39;est pas dans PATH (cas le plus courant).<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><table>\n<tr><th>Paramètre<\/th><th>Contenu<\/th><\/tr>\n<tr><td><code>$0<\/code><\/td><td>nom du script<\/td><\/tr>\n<tr><td><code>$1<\/code> … <code>$9<\/code>, <code>${10}<\/code><\/td><td>arguments ; au-delà de 9, accolades obligatoires<\/td><\/tr>\n<tr><td><code>$#<\/code><\/td><td>nombre d'arguments<\/td><\/tr>\n<tr><td><code>$*<\/code><\/td><td>tous les arguments, en <b>un seul<\/b> mot (entre guillemets)<\/td><\/tr>\n<tr><td><code>$@<\/code><\/td><td>tous les arguments, <b>chacun séparé<\/b> (entre guillemets)<\/td><\/tr>\n<tr><td><code>$?<\/code><\/td><td>code retour de la dernière commande<\/td><\/tr>\n<tr><td><code>$$<\/code><\/td><td>PID du shell qui exécute le script<\/td><\/tr>\n<tr><td><code>$!<\/code><\/td><td>PID de la dernière commande lancée en arrière-plan<\/td><\/tr>\n<\/table><p>Exemple : <code>./test un deux … onze douze<\/code> avec <code>echo $10<\/code> affiche « un0 » à la place de « dix » : le shell lit <code>$1<\/code> suivi de « 0 ». Il faut <code>${10}<\/code>.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices du cours, du TP 4 et de l&#39;examen<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Qu&#39;affiche <code>a=3 ; b=$((a + 1)) ; echo $((b * 2))<\/code> ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 8<\/b><\/p><p>b = 4, puis 4 × 2 = <strong>8<\/strong>.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Pourquoi écrit-on <code>${var}60<\/code> et pas <code>$var60<\/code> ? (question 15)<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Pour séparer le nom de la variable du texte collé derrière. <code>$var60<\/code> chercherait
