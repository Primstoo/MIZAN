 + t^2}$, bornes 0 et 1. On obtient $\\int_0^1 \\frac{2\\,dt}{3 + t^2} = \\frac{2}{\\sqrt3}\\arctan\\frac{1}{\\sqrt3} = \\frac{\\pi\\sqrt3}{9}$.<\/p>\n<h2>Idée 3 · Fractions rationnelles<\/h2>\n<figure class=\"grille\"><figcaption>Éléments simples et leurs primitives<\/figcaption><table><tr><th><\/th><th>élément<\/th><th>primitive<\/th><\/tr><tr><th>1<\/th><td>1/(x−a) *ln<\/td><td>x−a<\/td><td><\/td><\/tr><tr><th>2<\/th><td>1/(x−a)ⁿ<\/td><td class=\"h1\">−1/((n−1)(x−a)ⁿ⁻¹)<\/td><\/tr><tr><th>3<\/th><td>1/(x²+px+q),_Δ&lt;0<\/td><td class=\"h1\">forme_canonique_puis_arctan<\/td><\/tr><\/table><\/figure><p><strong>Exemple.<\/strong> $\\frac{x + 2}{x^2 - 3x - 4} = \\frac{x+2}{(x-4)(x+1)} = \\frac{6/5}{x-4} - \\frac{1/5}{x+1}$. Primitive : $\\frac65\\ln|x-4| - \\frac15\\ln|x+1|$.<\/p>\n<p><strong>Cas $\\Delta &lt; 0$.<\/strong> $x^2 + x + 1 = \\left(x + \\frac12\\right)^2 + \\frac34$, donc $\\int_0^1 \\frac{dx}{1 + x + x^2} = \\frac{2}{\\sqrt3}\\left[\\arctan\\frac{2x + 1}{\\sqrt3}\\right]_0^1 = \\frac{\\pi\\sqrt3}{9}$.<\/p>\n<h2>Idée 4 · Suites d&#39;intégrales<\/h2>\n<p>Pour $I_n = \\int_0^1 f_n$ : on compare $f_{n+1}$ et $f_n$ (monotonie), on encadre $f_n$ (limite), et une IPP donne souvent une relation de récurrence.<\/p>\n<p><strong>Exemple.<\/strong> $I_n = \\int_0^1 \\frac{x^n}{1 + x + x^2}dx$. Sur $[0, 1]$ : $1 \\le 1 + x + x^2 \\le 3$, donc $\\frac{1}{3(n+1)} \\le I_n \\le \\frac{1}{n+1}$ et $I_n \\to 0$.<\/p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>IPP : dérive le terme qui se simplifie. Changement de variable : change $dx$ et les bornes. Fraction : décompose d&#39;abord.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Techniques<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Calcule $J_3 = \\int_1^e x^2\\ln x\\,dx$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>IPP avec $v = \\ln x$, $u' = x^2$ : $\\left[\\frac{x^3}{3}\\ln x\\right]_1^e - \\int_1^e \\frac{x^2}{3}dx = \\frac{e^3}{3} - \\frac{e^3 - 1}{9} = \\frac{2e^3 + 1}{9}$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Montre que $\\int_{\\pi/6}^{\\pi/3}\\frac{dx}{\\cos x\\sin x} = \\ln 3$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>$\\frac{1}{\\cos x\\sin x} = \\frac{1}{\\cos^2 x\\tan x}$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>C&#39;est $\\frac{u'}{u}$ avec $u = \\tan x$ : primitive $\\ln|\\tan x|$. $\\ln\\sqrt3 - \\ln\\frac{1}{\\sqrt3} = \\ln 3$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Calcule $\\int_0^1 \\frac{dx}{(1+x^2)^2}$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Pose $x = \\tan t$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>$dx = (1 + \\tan^2 t)dt$ : $\\int_0^{\\pi/4}\\cos^2 t\\,dt = \\left[\\frac t2 + \\frac{\\sin 2t}{4}\\right]_0^{\\pi/4} = \\frac\\pi8 + \\frac14$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Pour $\\int x\\sin x\\,dx$, on dérive :<\/div><button class=\"opt\" data-o=\"0\">$x$<\/button><button class=\"opt\" data-o=\"1\">$\\sin x$<\/button><button class=\"opt\" data-o=\"2\">les deux<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">$\\int x\\sin x\\,dx = $ :<\/div><button class=\"opt\" data-o=\"0\">$\\sin x - x\\cos x + C$<\/button><button class=\"opt\" data-o=\"1\">$x\\cos x + C$<\/button><button class=\"opt\" data-o=\"2\">$-x\\cos x + C$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Avec $u = \\sin x$, $dx$ devient :<\/div><button class=\"opt\" data-o=\"0\">$\\frac{du}{\\cos x}$<\/button><button class=\"opt\" data-o=\"1\">$du$<\/button><button class=\"opt\" data-o=\"2\">$\\cos x\\,du$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Avec $t = \\tan\\frac x2$, $\\cos x$ vaut :<\/div><button class=\"opt\" data-o=\"0\">$\\frac{1 - t^2}{1 + t^2}$<\/button><button class=\"opt\" data-o=\"1\">$\\frac{2t}{1 + t^2}$<\/button><button class=\"opt\" data-o=\"2\">$\\frac{1}{1 + t^2}$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">$\\frac{1}{x(x+1)} = $ :<\/div><button class=\"opt\" data-o=\"0\">$\\frac1x - \\frac{1}{x+1}$<\/button><button class=\"opt\" data-o=\"1\">$\\frac1x + \\frac{1}{x+1}$<\/button><button class=\"opt\" data-o=\"2\">$\\frac{1}{x+1} - \\frac1x$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">$\\int_0^1 \\frac{dx}{1 + x + x^2}$ :<\/div><button class=\"opt\" data-o=\"0\">$\\frac{\\pi\\sqrt3}{9}$<\/button><button class=\"opt\" data-o=\"1\">$\\ln 3$<\/button><button class=\"opt\" data-o=\"2\">$\\frac\\pi4$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">$\\int_1^e \\ln x\\,dx$ :<\/div><button class=\"opt\" data-o=\"0\">1<\/button><button class=\"opt\" data-o=\"1\">$e$<\/button><button class=\"opt\" data-o=\"2\">0<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Si $0 \\le I_n \\le \\frac{1}{n+1}$ :<\/div><button class=\"opt\" data-o=\"0\">$I_n \\to 0$<\/button><button class=\"opt\" data-o=\"1\">$I_n \\to 1$<\/button><button class=\"opt\" data-o=\"2\">on ne peut rien dire<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Une IPP sur $\\int x^n\\ln x$ fait apparaître :<\/div><button class=\"opt\" data-o=\"0\">$\\int \\frac{x^n}{n+1}dx$<\/button><button class=\"opt\" data-o=\"1\">$\\int x^{n-1}\\ln x$<\/button><button class=\"opt\" data-o=\"2\">$\\int \\ln^2 x$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">$\\frac{x+2}{(x-4)(x+1)}$ : coefficient de $\\frac{1}{x-4}$ :<\/div><button class=\"opt\" data-o=\"0\">$\\frac65$<\/button><button class=\"opt\" data-o=\"1\">$\\frac15$<\/button><button class=\"opt\" data-o=\"2\">2<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"techniques-integration","rep":null,"tol":null},{"n":"techniques-integration","rep":null,"tol":null},{"n":"techniques-integration","rep":null,"tol":null},{"n":"techniques-integration","rep":null,"tol":null}],"qcm":[{"n":"techniques-integration","q":"Pour $\\int x\\sin x\\,dx$, on dérive :","o":["$x$","$\\sin x$","les deux"],"a":0,"e":"$x' = 1$ simplifie."},{"n":"techniques-integration","q":"$\\int x\\sin x\\,dx = $ :","o":["$\\sin x - x\\cos x + C$","$x\\cos x + C$","$-x\\cos x + C$"],"a":0,"e":"IPP : $-x\\cos x + \\int\\cos x$."},{"n":"techniques-integration","q":"Avec $u = \\sin x$, $dx$ devient :","o":["$\\frac{du}{\\cos x}$","$du$","$\\cos x\\,du$"],"a":0,"e":"$du = \\cos x\\,dx$."},{"n":"techniques-integration","q":"Avec $t = \\tan\\frac x2$, $\\cos x$ vaut :","o":["$\\frac{1 - t^2}{1 + t^2}$","$\\frac{2t}{1 + t^2}$","$\\frac{1}{1 + t^2}$"],"a":0,"e":"Formule de l&#39;angle moitié."},{"n":"techniques-integration","q":"$\\frac{1}{x(x+1)} = $ :","o":["$\\frac1x - \\frac{1}{x+1}$","$\\frac1x + \\frac{1}{x+1}$","$\\frac{1}{x+1} - \\frac1x$"],"a":0,"e":"Réduire au même dénominateur pour vérifier."},{"n":"techniques-integration","q":"$\\int_0^1 \\frac{dx}{1 + x + x^2}$ :","o":["$\\frac{\\pi\\sqrt3}{9}$","$\\ln 3$","$\\frac\\pi4$"],"a":0,"e":"Forme canonique."},{"n":"techniques-integration","q":"$\\int_1^e \\ln x\\,dx$ :","o":["1","$e$","0"],"a":0,"e":"$[x\\ln x - x]_1^e = 0 - (-1)$."},{"n":"techniques-integration","q":"Si $0 \\le I_n \\le \\frac{1}{n+1}$ :","o":["$I_n \\to 0$","$I_n \\to 1$","on ne peut rien dire"],"a":0,"e":"Gendarmes."},{"n":"techniques-integration","q":"Une IPP sur $\\int x^n\\ln x$ fait apparaître :","o":["$\\int \\frac{x^n}{n+1}dx$","$\\int x^{n-1}\\ln x$","$\\int \\ln^2 x$"],"a":0,"e":"On dérive $\\ln x$."},{"n":"techniques-integration","q":"$\\frac{x+2}{(x-4)(x+1)}$ : coefficient de $\\frac{1}{x-4}$ :","o":["$\\frac65$","$\\frac15$","2"],"a":0,"e":"Multiplier par $x - 4$ et faire $x = 4$."}]},{"id":"integrales-impropres","t":"Intégrales impropres","seance":"Chapitre 8 · Intégrale impropre","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir calculer une primitive (chapitres 6 et 7) et une limite en $+\\infty$ ou en un point.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Que vaut $\\lim_{X \\to +\\infty} \\left(1 - e^{-X}\\right)$ ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1<\/b><\/p><p>1, car $e^{-X} \\to 0$.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Une intégrale impropre, c&#39;est une limite d&#39;intégrales ordinaires.<\/strong> On intègre jusqu&#39;à $X$, puis on fait tendre $X$ vers le bord gênant. Pour la seule nature, on compare à une intégrale de référence.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Couper une intégrale en deux morceaux divergents et « compenser ». $\\int_2^{+\\infty}\\left(\\frac{1}{x+1} + \\frac{1}{1-x}\\right)dx$ converge alors que les deux morceaux divergent : on étudie la <strong>somme<\/strong>, pas chaque terme.<\/p>\n<\/aside><p>À la fin, tu sais calculer une intégrale impropre convergente et décider de la nature avec Riemann, la comparaison et les équivalents.<\/p>\n<h2>Idée 1 · La définition<\/h2>\n<p>$\\int_a^{+\\infty} f$ converge si $\\lim_{X \\to +\\infty}\\int_a^X f$ existe et est finie. Même idée en un point où $f$ n&#39;est pas définie. Deux bords gênants : on coupe en un point au milieu, et <strong>chaque<\/strong> morceau doit converger.<\/p>\n<p><strong>Exemple.<\/strong> $\\int_0^X te^{-t}dt = 1 - (X + 1)e^{-X} \\to 1$ : l&#39;intégrale converge et vaut 1.<\/p>\n<h2>Idée 2 · Les intégrales de Riemann<\/h2>\n<svg viewBox=\"0 0 340 150\" style=\"width:100%;max-width:440px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Axe des exposants alpha avec la valeur 1 comme frontière entre convergence et divergence\">\n<line x1=\"20\" y1=\"70\" x2=\"320\" y2=\"70\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<circle cx=\"170\" cy=\"70\" r=\"5\" fill=\"#D9824F\"/>\n<g font-family=\"sans-serif\" font-size=\"13\" font-weight=\"700\"><text x=\"163\" y=\"95\" fill=\"#D9824F\">α = 1<\/text>\n<text x=\"30\" y=\"40\" fill=\"currentColor\">en +∞ : diverge<\/text><text x=\"200\" y=\"40\" fill=\"#D9824F\">en +∞ : converge<\/text>\n<text x=\"30\" y=\"125\" fill=\"#D9824F\">en 0 : converge<\/text><text x=\"200\" y=\"125\" fill=\"currentColor\">en 0 : diverge<\/text><\/g>\n<\/svg><p>$\\int_1^{+\\infty}\\frac{dt}{t^\\alpha}$ converge <strong>ssi $\\alpha &gt; 1$<\/strong>. $\\int_0^1\\frac{dt}{t^\\alpha}$ converge <strong>ssi $\\alpha &lt; 1$<\/strong>. Pour $\\alpha = 1$, les deux divergent (le $\\ln$).<\/p>\n<p>Aussi : $\\int_0^{+\\infty}e^{-\\lambda t}dt$ converge pour $\\lambda &gt; 0$ et vaut $\\frac1\\lambda$.<\/p>\n<h2>Idée 3 · Comparer pour décider<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Étudier la nature (fonction positive)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Repérer les bords gênants<\/div><p>$\\int_0^{+\\infty}\\frac{\\ln t}{t^2 + 1}dt$ : bords 0 et $+\\infty$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Trouver un équivalent ou une majoration à chaque bord<\/div><p>En 0 : $|f| \\sim |\\ln t|$, intégrable. En $+\\infty$ : $\\frac{\\ln t}{t^2} \\le \\frac{1}{t^{3/2}}$ pour $t$ grand.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Comparer à une référence<\/div><p>$\\int_1^{+\\infty}t^{-3/2}$ converge ($\\alpha &gt; 1$).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Conclure<\/div><p>Les deux morceaux convergent : l&#39;intégrale converge.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><ul>\n<li><strong>Comparaison<\/strong> : $0 \\le f \\le g$ et $\\int g$ converge, alors $\\int f$ converge.<\/li>\n<li><strong>Équivalents<\/strong> : $f \\sim g$ au bord, de signe constant : même nature.<\/li>\n<li><strong>Absolue convergence<\/strong> : si $\\int |f|$ converge, $\\int f$ converge. Exemple : $\\left|\\frac{\\sin t}{t^2}\\right| \\le \\frac{1}{t^2}$ sur $[1, +\\infty[$.<\/li>\n<\/ul>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Pour une fonction positive : un équivalent simple à chaque bord, puis Riemann ou exponentielle.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Impropres<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>$\\int_0^1\\frac{dt}{\\sqrt{1 - t}}$ : nature et valeur.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 2<\/b><\/p><p>$\\int_0^X (1-t)^{-1/2}dt = 2 - 2\\sqrt{1 - X} \\to 2$. Converge, vaut 2.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Nature de $\\int_0^{+\\infty}\\sqrt{\\frac{2t + 3}{5t^3 + 3t^2 + 7}}\\,dt$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Pas de problème en 0 (fonction continue). En $+\\infty$ : équivalent $\\sqrt{\\frac{2}{5}}\\,t^{-1}$, intégrale de Riemann avec $\\alpha = 1$ : diverge.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Montre que $\\int_0^{+\\infty}\\frac{\\ln t}{1 + t^2}dt = 0$.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>Coupe en 1 et pose $u = \\frac1t$ sur $[1, +\\infty[$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0<\/b><\/p><p>Les deux morceaux convergent (voir étapes). Avec $u = \\frac1t$ : $\\int_1^{+\\infty}\\frac{\\ln t}{1+t^2}dt = \\int_0^1\\frac{-\\ln u}{1 + u^2}du$. Les deux morceaux sont opposés : somme nulle.<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">$\\int_1^{+\\infty}\\frac{dt}{t^2}$ :<\/div><button class=\"opt\" data-o=\"0\">converge et vaut 1<\/button><button class=\"opt\" data-o=\"1\">diverge<\/button><button class=\"opt\" data-o=\"2\">vaut 2<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">$\\int_1^{+\\infty}\\frac{dt}{\\sqrt t}$ :<\/div><button class=\"opt\" data-o=\"0\">converge<\/button><button class=\"opt\" data-o=\"1\">diverge<\/button><button class=\"opt\" data-o=\"2\">vaut 2<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">$\\int_0^1\\frac{dt}{\\sqrt t}$ :<\/div><button class=\"opt\" data-o=\"0\">converge et vaut 2<\/button><button class=\"opt\" data-o=\"1\">diverge<\/button><button class=\"opt\" data-o=\"2\">vaut $\\frac12$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">$\\int_2^{+\\infty}\\frac{dt}{3^t}$ :<\/div><button class=\"opt\" data-o=\"0\">converge<\/button><button class=\"opt\" data-o=\"1\">diverge<\/button><button class=\"opt\" data-o=\"2\">n&#39;est pas définie<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">$\\int_0^{+\\infty}dt$ :<\/div><button class=\"opt\" data-o=\"0\">converge et vaut 0<\/button><button class=\"opt\" data-o=\"1\">diverge<\/button><button class=\"opt\" data-o=\"2\">vaut 1<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">$\\int_0^{+\\infty}\\frac{dt}{1 + t^2}$ :<\/div><button class=\"opt\" data-o=\"0\">$\\frac\\pi2$<\/button><button class=\"opt\" data-o=\"1\">$\\frac\\pi4$<\/button><button class=\"opt\" data-o=\"2\">diverge<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">$\\int_1^2\\frac{dt}{t^2 - t}$ est impropre en :<\/div><button class=\"opt\" data-o=\"0\">1<\/button><button class=\"opt\" data-o=\"1\">2<\/button><button class=\"opt\" data-o=\"2\">aucun point<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Si $0 \\le f \\le g$ et $\\int g$ diverge :<\/div><button class=\"opt\" data-o=\"0\">$\\int f$ diverge<\/button><button class=\"opt\" data-o=\"1\">$\\int f$ converge<\/button><button class=\"opt\" data-o=\"2\">on ne peut rien conclure<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">$\\int_{-\\infty}^0 te^{-t^2}dt$ :<\/div><button class=\"opt\" data-o=\"0\">$-\\frac12$<\/button><button class=\"opt\" data-o=\"1\">$\\frac12$<\/button><button class=\"opt\" data-o=\"2\">diverge<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">$\\int_1^{+\\infty}\\frac{\\sin t}{t^2}dt$ :<\/div><button class=\"opt\" data-o=\"0\">converge absolument<\/button><button class=\"opt\" data-o=\"1\">diverge<\/button><button class=\"opt\" data-o=\"2\">converge mais pas absolument<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"integrales-impropres","rep":["1"],"tol":null},{"n":"integrales-impropres","rep":["2"],"tol":null},{"n":"integrales-impropres","rep":null,"tol":null},{"n":"integrales-impropres","rep":["0"],"tol":null}],"qcm":[{"n":"integrales-impropres","q":"$\\int_1^{+\\infty}\\frac{dt}{t^2}$ :","o":["converge et vaut 1","diverge","vaut 2"],"a":0,"e":"$\\left[-\\frac1t\\right]_1^{+\\infty}$."},{"n":"integrales-impropres","q":"$\\int_1^{+\\infty}\\frac{dt}{\\sqrt t}$ :","o":["converge","diverge","vaut 2"],"a":1,"e":"$\\alpha = \\frac12 \\le 1$."},{"n":"integrales-impropres","q":"$\\int_0^1\\frac{dt}{\\sqrt t}$ :","o":["converge et vaut 2","diverge","vaut $\\frac12$"],"a":0,"e":"$\\alpha = \\frac12 &lt; 1$ en 0."},{"n":"integrales-impropres","q":"$\\int_2^{+\\infty}\\frac{dt}{3^t}$ :","o":["converge","diverge","n&#39;est pas définie"],"a":0,"e":"Exponentielle décroissante."},{"n":"integrales-impropres","q":"$\\int_0^{+\\infty}dt$ :","o":["converge et vaut 0","diverge","vaut 1"],"a":1,"e":"$\\int_0^X dt = X \\to +\\infty$."},{"n":"integrales-impropres","q":"$\\int_0^{+\\infty}\\frac{dt}{1 + t^2}$ :","o":["$\\frac\\pi2$","$\\frac\\pi4$","diverge"],"a":0,"e":"$\\arctan$ tend vers $\\frac\\pi2$."},{"n":"integrales-impropres","q":"$\\int_1^2\\frac{dt}{t^2 - t}$ est impropre en :","o":["1","2","aucun point"],"a":0,"e":"$t^2 - t = 0$ en $t = 1$ ; équivalent $\\frac{1}{t-1}$ : diverge."},{"n":"integrales-impropres","q":"Si $0 \\le f \\le g$ et $\\int g$ diverge :","o":["$\\int f$ diverge","$\\int f$ converge","on ne peut rien conclure"],"a":2,"e":"La comparaison ne marche que dans un sens."},{"n":"integrales-impropres","q":"$\\int_{-\\infty}^0 te^{-t^2}dt$ :","o":["$-\\frac12$","$\\frac12$","diverge"],"a":0,"e":"$\\left[-\\frac12 e^{-t^2}\\right]_{-\\infty}^0$."},{"n":"integrales-impropres","q":"$\\int_1^{+\\infty}\\frac{\\sin t}{t^2}dt$ :","o":["converge absolument","diverge","converge mais pas absolument"],"a":0,"e":"$|\\sin t| / t^2 \\le 1/t^2$."}]},{"id":"series-td-corrigees","t":"Séries de TD corrigées","seance":"Séries 1 à 4 · Travaux dirigés","imp":5,"html":"<p>Exercices types des quatre séries de TD d&#39;Analyse 2 de la FSABM (dérivabilité, développements limités, intégrale simple, intégrale impropre). Les énoncés sont reformulés ; les corrigés sont rédigés par ToumaiLearn et les calculs ont été vérifiés par ordinateur.<\/p>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Cherche chaque exercice 10 minutes avant d&#39;ouvrir l&#39;indice, puis le corrigé. Rédige comme en examen : hypothèses, outil, conclusion.<\/p>\n<\/aside><h2>Série 1 · Dérivabilité et applications<\/h2>\n<section class=\"exo\"><h3>Série 1<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Montre que $f(x) = \\frac{\\sin x + \\cos x}{1 + \\cos^2 x}$ a une dérivée qui s&#39;annule sur $]a, a + 2\\pi[$, pour tout réel $a$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$f$ est dérivable sur $\\mathbb R$ (dénominateur $\\ge 1$) et $2\\pi$-périodique : $f(a) = f(a + 2\\pi)$. Rolle sur $[a, a + 2\\pi]$ donne $c$ avec $f'(c) = 0$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Soient $f, g$ continues sur $[a, b]$, dérivables sur $]a, b[$, avec $f(a) \\ne f(b)$ et $g(a) \\ne g(b)$. Montre qu&#39;il existe $c$ avec $\\frac{f'(c)}{f(a) - f(b)} = \\frac{g'(c)}{g(a) - g(b)}$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>$F(x) = [f(a) - f(b)]g(x) - [g(a) - g(b)]f(x)$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>$F(a) = f(a)g(a) - f(b)g(a) - g(a)f(a) + g(b)f(a) = g(b)f(a) - f(b)g(a)$, et le même calcul donne $F(b) = g(b)f(a) - f(b)g(a)$. Rolle : $F'(c) = 0$, soit $[f(a) - f(b)]g'(c) = [g(a) - g(b)]f'(c)$. On divise par $[f(a) - f(b)][g(a) - g(b)] \\ne 0$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Soit $f$ continue sur $[a, b]$, dérivable sur $]a, b[$, à valeurs strictement positives. Montre qu&#39;il existe $c$ avec $\\frac{f(b)}{f(a)} = \\exp\\left(\\frac{f'(c)}{f(c)}(b - a)\\right)$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>TAF à $g = \\ln f$ : $\\ln f(b) - \\ln f(a) = \\frac{f'(c)}{f(c)}(b - a)$. On passe à l&#39;exponentielle.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Montre que $x^n + px + q$ ($n \\ge 2$) a au plus trois racines réelles si $n$ est impair, deux si $n$ est pair.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Voir le chapitre 1, idée 3 : $P''$ a une seule racine (0), donc $P'$ au plus deux et $P$ au plus trois. Si $n$ est pair, $P' = nx^{n-1} + p$ est strictement croissante ($n - 1$ impair) : une racine au plus, donc deux pour $P$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Série 2 · Développements limités<\/h2>\n<section class=\"exo\"><h3>Série 2<\/h3><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>DL à l&#39;ordre 2 en 0 de $\\frac{\\sin x - 1}{\\cos x + 1}$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$\\sin x - 1 = -1 + x + o(x^2)$ et $\\frac{1}{\\cos x + 1} = \\frac{1}{2 - \\frac{x^2}{2}} = \\frac12\\left(1 + \\frac{x^2}{4}\\right) + o(x^2)$. Produit : $-\\frac12 + \\frac x2 - \\frac{x^2}{8} + o(x^2)$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>DL à l&#39;ordre 4 en 0 de $x(\\operatorname{ch} x)^{1/x}$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>$(\\operatorname{ch} x)^{1/x} = \\exp\\left(\\frac{\\ln \\operatorname{ch} x}{x}\\right)$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>$\\ln\\operatorname{ch} x = \\frac{x^2}{2} - \\frac{x^4}{12} + o(x^4)$, donc $\\frac{\\ln\\operatorname{ch}x}{x} = \\frac x2 - \\frac{x^3}{12} + o(x^3)$. L&#39;exponentielle vaut $1 + \\frac x2 + \\frac{x^2}{8} - \\frac{x^3}{16} + o(x^3)$. Fois $x$ : $x + \\frac{x^2}{2} + \\frac{x^3}{8} - \\frac{x^4}{16} + o(x^4)$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><p>DL à l&#39;ordre 5 de $(\\cos x)^{\\sin x}$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$\\ln\\cos x = -\\frac{x^2}{2} - \\frac{x^4}{12}$, fois $\\sin x = x - \\frac{x^3}{6}$ : $-\\frac{x^3}{2} + o(x^5)$ (le terme en $x^5$ vaut $-\\frac1{12} + \\frac1{12} = 0$). Exponentielle : $1 - \\frac{x^3}{2} + o(x^5)$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"7\"><div class=\"ex-q\"><p>$f(x) = xe^{x^2}$. (a) DL à l&#39;ordre 5. (b) Montre que $f$ est une bijection de $\\mathbb R$ sur $\\mathbb R$. (c) Sachant que $f^{-1}(x) = ax + bx^3 + cx^5 + o(x^5)$, trouve $a, b, c$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Écris $f(f^{-1}(x)) = x$ et identifie.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>(a) $x + x^3 + \\frac{x^5}{2} + o(x^5)$. (b) $f'(x) = (1 + 2x^2)e^{x^2} &gt; 0$, $f$ continue, limites $\\mp\\infty$ : bijection. (c) Avec $y = f^{-1}(x)$ : $y + y^3 + \\frac{y^5}{2} = x$. Ordre 1 : $a = 1$. Ordre 3 : $b + 1 = 0$, $b = -1$. Ordre 5 : $c + 3a^2b + \\frac12 = 0$, soit $c = \\frac52$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Série 3 · Intégrale simple<\/h2>\n<section class=\"exo\"><h3>Série 3<\/h3><div class=\"ex\" data-x=\"8\"><div class=\"ex-q\"><p>Calcule $J_2 = \\int e^x\\cos x\\,dx$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Deux IPP : $J_2 = e^x\\sin x - \\int e^x\\sin x = e^x\\sin x + e^x\\cos x - J_2$. Donc $J_2 = \\frac{e^x(\\sin x + \\cos x)}{2} + C$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"9\"><div class=\"ex-q\"><p>Calcule $I_2 = \\int_0^{\\pi/2}\\frac{\\sin^3 x\\cos x}{1 + \\cos^2 x}dx$ avec $u = \\sin x$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$du = \\cos x\\,dx$ et $\\cos^2 x = 1 - u^2$ : $I_2 = \\int_0^1\\frac{u^3}{2 - u^2}du$. Or $\\frac{u^3}{2 - u^2} = -u + \\frac{2u}{2 - u^2}$. Donc $I_2 = -\\frac12 + [-\\ln(2 - u^2)]_0^1 = \\ln 2 - \\frac12$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"10\"><div class=\"ex-q\"><p>Calcule $K_2 = \\int_0^\\pi\\frac{x\\sin x}{1 + \\cos^2 x}dx$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Pose $x = \\pi - t$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Le changement donne $K_2 = \\int_0^\\pi\\frac{(\\pi - t)\\sin t}{1 + \\cos^2 t}dt = \\pi\\int_0^\\pi\\frac{\\sin t}{1 + \\cos^2 t}dt - K_2$. Avec $u = \\cos t$ : $\\int_0^\\pi\\frac{\\sin t}{1 + \\cos^2 t}dt = \\int_{-1}^1\\frac{du}{1 + u^2} = \\frac\\pi2$. Donc $2K_2 = \\frac{\\pi^2}{2}$ et $K_2 = \\frac{\\pi^2}{4}$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"11\"><div class=\"ex-q\"><p>$I_n = \\int_n^{n+1}\\frac{dx}{e^x + e^{-x}}$. Montre que $f(n+1) \\le I_n \\le f(n)$ et que $(I_n)$ converge.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$f(x) = \\frac{1}{e^x + e^{-x}}$ est décroissante sur $[0, +\\infty[$ (dénominateur croissant). L&#39;encadrement suit en intégrant $f(n+1) \\le f \\le f(n)$ sur un intervalle de longueur 1. Comme $f(n) \\to 0$, $I_n \\to 0$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"12\"><div class=\"ex-q\"><p>$u_n = \\int_0^{1/2}\\frac{x^n}{1 - x^2}dx$. Calcule $u_0$, $u_1$ et montre que $u_n - u_{n+2} = \\frac{1}{(n+1)2^{n+1}}$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$u_0 = \\frac12\\left[\\ln\\frac{1+x}{1-x}\\right]_0^{1/2} = \\frac{\\ln 3}{2}$. $u_1 = \\left[-\\frac12\\ln(1 - x^2)\\right]_0^{1/2} = \\frac12\\ln\\frac43$. $u_n - u_{n+2} = \\int_0^{1/2}\\frac{x^n(1 - x^2)}{1 - x^2}dx = \\int_0^{1/2}x^n dx = \\frac{1}{(n+1)2^{n+1}}$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Série 4 · Intégrale impropre<\/h2>\n<section class=\"exo\"><h3>Série 4<\/h3><div class=\"ex\" data-x=\"13\"><div class=\"ex-q\"><p>$\\int_1^{+\\infty}\\frac{t}{(1 + t^2)^2}dt$ : nature et valeur.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1/4<\/b><\/p><p>Primitive $-\\frac{1}{2(1 + t^2)}$, qui tend vers 0 en $+\\infty$. Valeur : $0 + \\frac14 = \\frac14$.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"14\"><div class=\"ex-q\"><p>Nature de $\\int_0^{+\\infty}\\frac{t - 5}{t^2 + 4t + 4}dt$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Continue sur $[0, +\\infty[$. En $+\\infty$ : $\\frac{t - 5}{(t+2)^2} \\sim \\frac1t$, positive pour $t &gt; 5$ : diverge (Riemann $\\alpha = 1$).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"15\"><div class=\"ex-q\"><p>Montre que $\\int_2^{+\\infty}\\frac{dx}{x+1}$ et $\\int_2^{+\\infty}\\frac{dx}{x-1}$ divergent, mais que $\\int_2^{+\\infty}\\left(\\frac{1}{1+x} + \\frac{1}{1-x}\\right)dx$ converge.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Chacune se comporte comme $\\int\\frac{dx}{x}$ : diverge. La somme vaut $\\frac{-2}{x^2 - 1} \\sim -\\frac{2}{x^2}$ : converge. Valeur : $[\\ln\\frac{x+1}{x-1}]_2^{+\\infty} = -\\ln 3$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"16\"><div class=\"ex-q\"><p>Nature de $\\int_0^1\\frac{e^{-1/x}}{x^2}dx$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>En $0^+$, $e^{-1/x}/x^2 \\to 0$ (l&#39;exponentielle l&#39;emporte) : la fonction se prolonge par continuité, l&#39;intégrale converge. Primitive $e^{-1/x}$ : valeur $e^{-1}$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Les séries de TD ne contiennent pas d&#39;exercice sur les équations différentielles : ce module n&#39;en traite donc pas. Vérifie avec ton prof si ce chapitre est au programme de ton année.<\/p>\n<\/aside>","ex":[{"n":"series-td-corrigees","rep":null,"tol":null},{"n":"series-td-corrigees","rep":null,"tol":null},{"n":"series-td-corrigees","rep":null,"tol":null},{"n":"series-td-corrigees","rep":null,"tol":null},{"n":"series-td-corrigees","rep":null,"tol":null},{"n":"series-td-corrigees","rep":null,"tol":null},{"n":"series-td-corrigees","rep":null,"tol":null},{"n":"series-td-corrigees","rep":null,"tol":null},{"n":"series-td-corrigees","rep":null,"tol":null},{"n":"series-td-corrigees","rep":null,"tol":null},{"n":"series-td-corrigees","rep":null,"tol":null},{"n":"series-td-corrigees","rep":null,"tol":null},{"n":"series-td-corrigees","rep":null,"tol":null},{"n":"series-td-corrigees","rep":["1/4","0.25"],"tol":null},{"n":"series-td-corrigees","rep":null,"tol":null},{"n":"series-td-corrigees","rep":null,"tol":null},{"n":"series-td-corrigees","rep":null,"tol":null}],"qcm":[]},{"id":"examen-blanc","t":"Examen blanc corrigé","seance":"Révision · Examen de fin de semestre","imp":5,"payant":true,"html":"<p>Sujet d&#39;entraînement de 1 h 30 couvrant tout le programme d&#39;Analyse 2. Sans calculatrice. Barème indicatif sur 20.<\/p>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Lis tout le sujet d&#39;abord. Commence par l&#39;exercice où tu es le plus sûr, et écris l&#39;ordre de chaque DL avant de le calculer.<\/p>\n<\/aside><h2>Exercice 1 · Accroissements finis (4 points)<\/h2>\n<section class=\"exo\"><h3>Exercice 1<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>(a) Montre que pour $0 &lt; a &lt; b$ : $\\frac{b - a}{1 + b^2} &lt; \\arctan b - \\arctan a &lt; \\frac{b - a}{1 + a^2}$. (b) Déduis-en un encadrement de $\\arctan 2 - \\frac\\pi4$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>(a) TAF à $\\arctan$ sur $[a, b]$ : $\\arctan b - \\arctan a = \\frac{b - a}{1 + c^2}$ avec $a &lt; c &lt; b$, et $\\frac{1}{1+b^2} &lt; \\frac{1}{1+c^2} &lt; \\frac{1}{1+a^2}$. (b) $a = 1$, $b = 2$ : $\\frac15 &lt; \\arctan 2 - \\frac\\pi4 &lt; \\frac12$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Exercice 2 · Développements limités (6 points)<\/h2>\n<section class=\"exo\"><h3>Exercice 2<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>(a) DL à l&#39;ordre 3 en 0 de $e^x\\sin x$. (b) Calcule $\\lim_{x \\to 0}\\frac{e^x\\sin x - x - x^2}{x^3}$. (c) $g(x) = \\frac{x}{e^x - 1}$ prolongée par $g(0) = 1$ : donne sa tangente en 0 et la position de la courbe.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>(c) $\\frac{e^x - 1}{x} = 1 + \\frac x2 + \\frac{x^2}{6} + o(x^2)$, puis $\\frac{1}{1+u}$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1/3<\/b><\/p><p>(a) $\\left(1 + x + \\frac{x^2}{2}\\right)\\left(x - \\frac{x^3}{6}\\right) = x + x^2 + \\frac{x^3}{3} + o(x^3)$. (b) Le numérateur vaut $\\frac{x^3}{3} + o(x^3)$ : limite $\\frac13$. (c) $g(x) = \\frac{1}{1 + u}$ avec $u = \\frac x2 + \\frac{x^2}{6}$ : $1 - \\frac x2 - \\frac{x^2}{6} + \\frac{x^2}{4} = 1 - \\frac x2 + \\frac{x^2}{12} + o(x^2)$. Tangente $y = 1 - \\frac x2$ ; $\\frac{x^2}{12} &gt; 0$ : courbe au-dessus.<\/p>\n<\/div><\/div><\/section><h2>Exercice 3 · Intégrales (5 points)<\/h2>\n<section class=\"exo\"><h3>Exercice 3<\/h3><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>(a) Calcule $\\int_0^1 xe^x\\,dx$. (b) Calcule $\\int_1^{+\\infty}\\frac{dx}{x(x+1)}$. (c) Limite de $\\sum_{k=1}^{n}\\frac{1}{n + k}$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>(a) IPP : $[xe^x]_0^1 - \\int_0^1 e^x = e - (e - 1) = 1$. (b) $\\frac1x - \\frac{1}{x+1}$ : primitive $\\ln\\frac{x}{x+1} \\to 0$ en $+\\infty$. Valeur : $0 - \\ln\\frac12 = \\ln 2$. (c) $\\frac1n\\sum\\frac{1}{1 + k/n} \\to \\int_0^1\\frac{dx}{1+x} = \\ln 2$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Exercice 4 · Nature d&#39;intégrales impropres (5 points)<\/h2>\n<section class=\"exo\"><h3>Exercice 4<\/h3><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Donne la nature de : (a) $\\int_0^{+\\infty}t^2e^{-t}dt$ ; (b) $\\int_0^1\\frac{dt}{t^2 - t}$ ; (c) $\\int_1^{+\\infty}\\frac{\\ln t}{t^2}dt$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>(a) $t^2e^{-t} \\le \\frac{1}{t^2}$ pour $t$ grand (car $t^4e^{-t} \\to 0$) : converge (valeur 2 par deux IPP). (b) En 0 : $\\frac{1}{t(t-1)} \\sim -\\frac1t$, Riemann $\\alpha = 1$ : diverge. (c) $\\frac{\\ln t}{t^2} \\le \\frac{1}{t^{3/2}}$ pour $t$ grand ($\\frac{\\ln t}{\\sqrt t} \\to 0$) : converge. IPP : valeur 1.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Barème : rédaction des hypothèses (Rolle, TAF, continuité sur l&#39;intervalle) et ordre des DL comptent autant que le résultat.<\/p>\n<\/aside>","ex":[{"n":"examen-blanc","rep":null,"tol":null},{"n":"examen-blanc","rep":["1/3"],"tol":null},{"n":"examen-blanc","rep":null,"tol":null},{"n":"examen-blanc","rep":null,"tol":null}],"qcm":[]}];

const CARTES=[{"n":"rolle-taf-applications","k":0,"ch":"rolle-taf-applications","q":"<p>Hypothèses de Rolle<\/p>\n","r":"<p>Continue sur $[a,b]$, dérivable sur $]a,b[$, $f(a) = f(b)$.<\/p>\n"},{"n":"rolle-taf-applications","k":1,"ch":"rolle-taf-applications","q":"<p>Conclusion de Rolle<\/p>\n","r":"<p>Il existe $c \\in ]a,b[$ avec $f'(c) = 0$.<\/p>\n"},{"n":"rolle-taf-applications","k":2,"ch":"rolle-taf-applications","q":"<p>TAF<\/p>\n","r":"<p>$f(b) - f(a) = f'(c)(b-a)$ pour un $c \\in ]a,b[$.<\/p>\n"},{"n":"rolle-taf-applications","k":3,"ch":"rolle-taf-applications","q":"<p>Fonction auxiliaire du TAF<\/p>\n","r":"<p>$F(x) = f(x) - \\frac{f(b)-f(a)}{b-a}(x-a)$.<\/p>\n"},{"n":"rolle-taf-applications","k":4,"ch":"rolle-taf-applications","q":"<p>Inégalité des accroissements finis<\/p>\n","r":"<p>Si $|f'| \\le k$, alors $|f(b) - f(a)| \\le k|b-a|$.<\/p>\n"},{"n":"rolle-taf-applications","k":5,"ch":"rolle-taf-applications","q":"<p>Compter les racines<\/p>\n","r":"<p>$k$ racines pour $P$ donnent au moins $k-1$ racines pour $P'$.<\/p>\n"},{"n":"rolle-taf-applications","k":6,"ch":"rolle-taf-applications","q":"<p>Montrer que $P$ s&#39;annule<\/p>\n","r":"<p>Trouver une primitive $Q$ avec $Q(a) = Q(b)$, puis Rolle.<\/p>\n"},{"n":"rolle-taf-applications","k":7,"ch":"rolle-taf-applications","q":"<p>Contre-exemple à Rolle<\/p>\n","r":"<p>$|x|$ sur $[-1,1]$ : non dérivable en 0.<\/p>\n"},{"n":"formules-taylor","k":8,"ch":"formules-taylor","q":"<p>Polynôme de Taylor en $a$<\/p>\n","r":"<p>$\\sum_{k=0}^n \\frac{f^{(k)}(a)}{k!}(x-a)^k$.<\/p>\n"},{"n":"formules-taylor","k":9,"ch":"formules-taylor","q":"<p>Taylor-Young<\/p>\n","r":"<p>$f(x) = T_n(x) + o((x-a)^n)$, pour $f$ de classe $C^n$.<\/p>\n"},{"n":"formules-taylor","k":10,"ch":"formules-taylor","q":"<p>Taylor-Lagrange<\/p>\n","r":"<p>$f(x) = T_n(x) + \\frac{f^{(n+1)}(c)}{(n+1)!}(x-a)^{n+1}$, $c$ entre $a$ et $x$.<\/p>\n"},{"n":"formules-taylor","k":11,"ch":"formules-taylor","q":"<p>Taylor-Lagrange pour $n = 0$<\/p>\n","r":"<p>C&#39;est le TAF.<\/p>\n"},{"n":"formules-taylor","k":12,"ch":"formules-taylor","q":"<p>Inégalité de Taylor-Lagrange<\/p>\n","r":"<p>$|f - T_n| \\le \\frac{M|x-a|^{n+1}}{(n+1)!}$ si $|f^{(n+1)}| \\le M$.<\/p>\n"},{"n":"formules-taylor","k":13,"ch":"formules-taylor","q":"<p>Young ou Lagrange pour une limite ?<\/p>\n","r":"<p>Young.<\/p>\n"},{"n":"formules-taylor","k":14,"ch":"formules-taylor","q":"<p>Young ou Lagrange pour majorer une erreur ?<\/p>\n","r":"<p>Lagrange.<\/p>\n"},{"n":"formules-taylor","k":15,"ch":"formules-taylor","q":"<p>$T_3$ de $e^x$ en 0<\/p>\n","r":"<p>$1 + x + \\frac{x^2}{2} + \\frac{x^3}{6}$.<\/p>\n"},{"n":"dl-definition-usuels","k":16,"ch":"dl-definition-usuels","q":"<p>DL de $e^x$<\/p>\n","r":"<p>$1 + x + \\frac{x^2}{2!} + \\dots + \\frac{x^n}{n!} + o(x^n)$.<\/p>\n"},{"n":"dl-definition-usuels","k":17,"ch":"dl-definition-usuels","q":"<p>DL de $\\frac{1}{1-x}$<\/p>\n","r":"<p>$1 + x + x^2 + \\dots + x^n + o(x^n)$.<\/p>\n"},{"n":"dl-definition-usuels","k":18,"ch":"dl-definition-usuels","q":"<p>DL de $\\ln(1+x)$<\/p>\n","r":"<p>$x - \\frac{x^2}{2} + \\frac{x^3}{3} - \\dots$<\/p>\n"},{"n":"dl-definition-usuels","k":19,"ch":"dl-definition-usuels","q":"<p>DL de $\\sin x$<\/p>\n","r":"<p>$x - \\frac{x^3}{6} + \\frac{x^5}{120} + o(x^6)$.<\/p>\n"},{"n":"dl-definition-usuels","k":20,"ch":"dl-definition-usuels","q":"<p>DL de $\\cos x$<\/p>\n","r":"<p>$1 - \\frac{x^2}{2} + \\frac{x^4}{24} + o(x^5)$.<\/p>\n"},{"n":"dl-definition-usuels","k":21,"ch":"dl-definition-usuels","q":"<p>DL de $(1+x)^\\alpha$<\/p>\n","r":"<p>$1 + \\alpha x + \\frac{\\alpha(\\alpha-1)}{2}x^2 + \\dots$<\/p>\n"},{"n":"dl-definition-usuels","k":22,"ch":"dl-definition-usuels","q":"<p>DL de $\\arctan x$<\/p>\n","r":"<p>$x - \\frac{x^3}{3} + \\frac{x^5}{5} + o(x^6)$.<\/p>\n"},{"n":"dl-definition-usuels","k":23,"ch":"dl-definition-usuels","q":"<p>Fonction paire<\/p>\n","r":"<p>DL avec uniquement des puissances paires.<\/p>\n"},{"n":"dl-definition-usuels","k":24,"ch":"dl-definition-usuels", <p>Position par rapport à la tangente<\/p>\n","r":"<p>Signe du premier terme non nul après $a_1 x$.<\/p>\n"},{"n":"applications-dl","k":38,"ch":"applications-dl","q":"<p>Point d&#39;inflexion<\/p>\n","r":"<p>Premier terme suivant de degré impair.<\/p>\n"},{"n":"applications-dl","k":39,"ch":"applications-dl","q":"<p>Asymptote en $+\\infty$<\/p>\n","r":"<p>Écrire $f(x) = ax + b + \\frac cx + o(\\frac1x)$.<\/p>\n"},{"n":"applications-dl","k":40,"ch":"applications-dl","q":"<p>Changement de variable en $+\\infty$<\/p>\n","r":"<p>$u = \\frac1x \\to 0$.<\/p>\n"},{"n":"applications-dl","k":41,"ch":"applications-dl","q":"<p>$\\lim \\frac{e^{x^2} - \\cos x}{x^2}$<\/p>\n","r":"<p>$\\frac32$.<\/p>\n"},{"n":"primitives-integrale","k":42,"ch":"primitives-integrale","q":"<p>Primitive de $u'u^n$<\/p>\n","r":"<p>$\\frac{u^{n+1}}{n+1}$ ($n \\ne -1$).<\/p>\n"},{"n":"primitives-integrale","k":43,"ch":"primitives-integrale","q":"<p>Primitive de $\\frac{u'}{u}$<\/p>\n","r":"<p>$\\ln|u|$.<\/p>\n"},{"n":"primitives-integrale","k":44,"ch":"primitives-integrale","q":"<p>Primitive de $\\frac{u'}{1+u^2}$<\/p>\n","r":"<p>$\\arctan u$.<\/p>\n"},{"n":"primitives-integrale","k":45,"ch":"primitives-integrale","q":"<p>Primitive de $\\frac{1}{x^2 + a^2}$<\/p>\n","r":"<p>$\\frac1a\\arctan\\frac xa$.<\/p>\n"},{"n":"primitives-integrale","k":46,"ch":"primitives-integrale","q":"<p>Primitive de $\\tan^2 x$<\/p>\n","r":"<p>$\\tan x - x$ (car $\\tan^2 = (1 + \\tan^2) - 1$).<\/p>\n"},{"n":"primitives-integrale","k":47,"ch":"primitives-integrale","q":"<p>Théorème fondamental<\/p>\n","r":"<p>$\\int_a^b f = F(b) - F(a)$.<\/p>\n"},{"n":"primitives-integrale","k":48,"ch":"primitives-integrale","q":"<p>Somme de Riemann<\/p>\n","r":"<p>$\\frac1n\\sum_{k=1}^n f(\\frac kn) \\to \\int_0^1 f$.<\/p>\n"},{"n":"primitives-integrale","k":49,"ch":"primitives-integrale","q":"<p>Encadrement par monotonie<\/p>\n","r":"<p>$f$ décroissante : $f(n+1) \\le \\int_n^{n+1} f \\le f(n)$.<\/p>\n"},{"n":"techniques-integration","k":50,"ch":"techniques-integration","q":"<p>Formule d&#39;IPP<\/p>\n","r":"<p>$\\int_a^b u'v = [uv]_a^b - \\int_a^b uv'$.<\/p>\n"},{"n":"techniques-integration","k":51,"ch":"techniques-integration","q":"<p>Que dériver dans une IPP ?<\/p>\n","r":"<p>Ce qui se simplifie : $x^n$, $\\ln x$, $\\arctan x$.<\/p>\n"},{"n":"techniques-integration","k":52,"ch":"techniques-integration","q":"<p>$\\int e^x\\cos x\\,dx$<\/p>\n","r":"<p>$\\frac{e^x(\\cos x + \\sin x)}{2}$, par deux IPP.<\/p>\n"},{"n":"techniques-integration","k":53,"ch":"techniques-integration","q":"<p>Changement de variable<\/p>\n","r":"<p>Changer $dx$ ET les bornes.<\/p>\n"},{"n":"techniques-integration","k":54,"ch":"techniques-integration","q":"<p>$t = \\tan\\frac x2$<\/p>\n","r":"<p>$\\cos x = \\frac{1-t^2}{1+t^2}$, $\\sin x = \\frac{2t}{1+t^2}$, $dx = \\frac{2dt}{1+t^2}$.<\/p>\n"},{"n":"techniques-integration","k":55,"ch":"techniques-integration","q":"<p>Trinôme avec $\\Delta &lt; 0$<\/p>\n","r":"<p>Forme canonique, puis $\\arctan$.<\/p>\n"},{"n":"techniques-integration","k":56,"ch":"techniques-integration","q":"<p>$\\int_0^1 \\arctan x\\,dx$<\/p>\n","r":"<p>$\\frac\\pi4 - \\frac{\\ln 2}{2}$.<\/p>\n"},{"n":"techniques-integration","k":57,"ch":"techniques-integration","q":"<p>Limite d&#39;une suite d&#39;intégrales<\/p>\n","r":"<p>Encadrer l&#39;intégrande, puis intégrer l&#39;encadrement.<\/p>\n"},{"n":"integrales-impropres","k":58,"ch":"integrales-impropres","q":"<p>Définition<\/p>\n","r":"<p>$\\int_a^{+\\infty} f = \\lim_{X \\to +\\infty}\\int_a^X f$, si elle existe et est finie.<\/p>\n"},{"n":"integrales-impropres","k":59,"ch":"integrales-impropres","q":"<p>Riemann en $+\\infty$<\/p>\n","r":"<p>$\\int_1^{+\\infty}t^{-\\alpha}$ converge ssi $\\alpha &gt; 1$.<\/p>\n"},{"n":"integrales-impropres","k":60,"ch":"integrales-impropres","q":"<p>Riemann en 0<\/p>\n","r":"<p>$\\int_0^1 t^{-\\alpha}$ converge ssi $\\alpha &lt; 1$.<\/p>\n"},{"n":"integrales-impropres","k":61,"ch":"integrales-impropres","q":"<p>$\\int_0^{+\\infty}e^{-\\lambda t}dt$<\/p>\n","r":"<p>$\\frac1\\lambda$ pour $\\lambda &gt; 0$.<\/p>\n"},{"n":"integrales-impropres","k":62,"ch":"integrales-impropres","q":"<p>Critère des équivalents<\/p>\n","r":"<p>$f \\sim g$, de signe constant : même nature.<\/p>\n"},{"n":"integrales-impropres","k":63,"ch":"integrales-impropres","q":"<p>Absolue convergence<\/p>\n","r":"<p>$\\int|f|$ converge implique $\\int f$ converge.<\/p>\n"},{"n":"integrales-impropres","k":64,"ch":"integrales-impropres","q":"<p>Deux bords gênants<\/p>\n","r":"<p>Couper ; chaque morceau doit converger.<\/p>\n"},{"n":"integrales-impropres","k":65,"ch":"integrales-impropres","q":"<p>$\\int_0^{+\\infty}te^{-t}dt$<\/p>\n","r":"<ol>\n<li><\/li>\n<\/ol>\n"}];

// Format « essais » : un objet partagé avec l'ancien module (attempts par notion, cards par indice) ; on ne touche qu'à ces deux champs.
// Format « score10 » : scores des chapitres dans MODULE.cle, essais et cartes dans MODULE.cleEtat.
const lireJ = (k) => { try { return JSON.parse(localStorage.getItem(k) || "{}") || {}; } catch (e) { return {}; } };
const ecrireJ = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const etat = () => { const S = lireJ(MODULE.cleEtat); S.attempts = S.attempts || {}; S.cards = S.cards || {}; return S; };
function noter(n, ok) { const S = etat(); (S.attempts[n] = S.attempts[n] || []).push(ok ? 1 : 0); if (S.attempts[n].length > 30) S.attempts[n].shift(); ecrireJ(MODULE.cleEtat, S); }
// Maîtrisé = au moins 3 essais et 80 % de réussite sur les 5 derniers (règle commune à la plateforme).

.mzt-chips{display:flex;gap:5px;flex-wrap:wrap;padding:4px 10px}
.mzt-f{display:flex;flex-direction:column;gap:6px;padding:8px 10px;border-top:1px solid var(--l)}
.mzt-f textarea{width:100%;min-height:54px;max-height:140px;resize:vertical;font:16px system-ui,sans-serif;padding:7px;border:1px solid var(--l);border-radius:8px;background:var(--s);color:var(--i)}
.mzt-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mzt-row label{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--m);cursor:pointer}
.mzt-note{font-size:11.5px;color:var(--m);margin:0}
.mzt-pan details{padding:0 10px}.mzt-pan summary{cursor:pointer;font-size:12px;color:var(--a);font-weight:600;padding:4px 0}
.mzt-prev{max-height:140px;overflow:auto;font-size:12px;white-space:pre-wrap;background:var(--s);border-radius:6px;padding:6px;color:var(--m)}
.mzt-list{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.mzt-item{border:1px solid var(--l);border-radius:8px;padding:8px}
.mzt-item .mzt-meta{font-size:11px;color:var(--m)}
.mzt-pan input[type=search]{width:100%;font:16px system-ui,sans-serif;padding:7px;border:1px solid var(--l);border-radius:8px;background:var(--s);color:var(--i)}
.mzt-pan input[type=checkbox]{width:auto}
.mzt-pan[hidden],.mzt-btn[hidden],.mzt-pan [hidden]{display:none!important}
.mzt-h button{flex:0 0 auto;white-space:nowrap}
.mzt-pan #mztX{background:var(--bad);border-color:var(--bad);color:#fff}
.mzt-m.a{white-space:normal}.mzt-m.a p{margin:0 0 6px}.mzt-m.a p:last-child{margin-bottom:0}
.mzt-m.a ul,.mzt-m.a ol{margin:4px 0 6px;padding-left:20px}.mzt-m.a li{margin:2px 0}
.mzt-m code{font:12.5px ui-monospace,Menlo,Consolas,monospace;background:color-mix(in srgb,var(--i) 10%,transparent);padding:1px 4px;border-radius:4px;overflow-wrap:anywhere}
.mzt-m pre{margin:6px 0;padding:8px;overflow-x:auto;background:color-mix(in srgb,var(--i) 10%,transparent);border-radius:6px;font:12.5px ui-monospace,Menlo,Consolas,monospace;white-space:pre}
.mzt-m pre code{background:none;padding:0}
.mzt-tex{font:12.5px ui-monospace,Menlo,Consolas,monospace;color:var(--m)}.mzt-tex[data-ok]{font:inherit;color:inherit}
.mzt-tex.d{display:block;margin:6px 0;text-align:center;overflow-x:auto;overflow-y:hidden}

      if (!(e && e.code === 'cancelled')) { busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImgN').textContent = ''; return; }
    }
    busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImg').value = ''; $('#mztImgN').textContent = ''; renderLog();
  }

  // ---------- événements ----------
  $('#mztBtn').onclick = () => openPanel(null);
  $('#mztX').onclick = closePanel;
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#mztPan').hidden) closePanel(); });
  $('#mztTabH').onclick = () => view($('#mztHist').hidden ? 'hist' : 'chat');
  $('#mztTabM').onclick = () => view($('#mztMem').hidden ? 'mem' : 'chat');
  $('#mztQ').oninput = renderList;
  $('#mztList').onclick = (e) => { const id = e.target.dataset && e.target.dataset.cont; if (!id) return; cur = ST.threads.find((t) => t.id === id); view('chat'); $('#mztCtx').textContent = '· ' + cur.sec; renderLog(); };
  $('#mztMemL').onclick = (e) => { const i = e.target.dataset && e.target.dataset.memdel; if (i == null) return; ST.memos.splice(+i, 1); saveMemos(); renderMem(); };
  $('#mztChips').onclick = (e) => { const b = e.target.closest('[data-chip]'); if (!b) return; const t = $('#mztIn'); t.value = b.dataset.chip + (t.value ? ' : ' + t.value : ''); t.focus(); };
  $('#mztNew').onclick = () => { cur = null; renderLog(); };
  $('#mztStop').onclick = () => { if (ctl) ctl.abort(); };
  $('#mztImg').onchange = (e) => { img = e.target.files[0] || null; $('#mztImgN').textContent = img ? 'Photo : ' + img.name : ''; };
  $('#mztF').onsubmit = (e) => { e.preventDefault(); const v = $('#mztIn').value; $('#mztIn').value = ''; ask(v); };
  $('#mztIn').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#mztF').requestSubmit(); } });

  // ---------- capacités (facultatives) ----------
  const W = window.claude;
  if (W && W.use) {
    W.use('sample').then((s) => { sample = s; ready = true; note();
      if (s && s.limits) s.limits().then((l) => { if (l && l.images) { imgOK = true; $('#mztImgL').hidden = false; if (l.images.mediaTypes) $('#mztImg').accept = l.images.mediaTypes.join(','); } }).catch(() => {});
    }).catch(() => { ready = true; note(); });
    Promise.all([W.use('db'), W.use('user')]).then(async ([d, u]) => {
      if (!d || !u) return; const id = await u.id(); if (!id) return; db = d; base = 'data/users/' + id + '/mzt_' + C.id;
      try {
        const m = await db.doc(base).get(); if (m.exists) { const v = m.data() || {}; if (Array.isArray(v.memos)) ST.memos = JSON.parse(JSON.stringify(v.memos)); }
        const q = await db.collection(base + '/threads').get(); const remote = q.docs.map((x) => Object.assign({ id: x.id }, JSON.parse(JSON.stringify(x.data() || {}))));
        const map = {}; [...ST.threads, ...remote].forEach((t) => { if (!map[t.id] || (t.msgs || []).length > (map[t.id].msgs || []).length) map[t.id] = t; });
        ST.threads = Object.values(map).sort((a, b) => parseInt(a.id.slice(1), 36) - parseInt(b.id.slice(1), 36)); saveLocal();
      } catch (e) {}
    }).catch(() => {});
  } else { ready = true; note(); }

  window.MZT = { open: openPanel, close: closePanel };
})();

</script>

if(window.top===window&&location.protocol==="file:"){a.hidden=true;return}
a.href=p.indexOf("/decouvrir")===0||location.pathname.indexOf("/decouvrir")===0?"/decouvrir":"/app/modules";})();</script>
