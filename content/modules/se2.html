e commencer</h2>\n<p>Ce chapitre suppose que tu sais dessiner un Gantt FCFS ou SJF et appliquer <strong>rotation = fin − arrivée</strong>, <strong>attente = rotation − exécution</strong> (chapitre précédent).</p>\n<section class=\"exo\"><h3>Vérifie ton prérequis</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Un processus arrive à 2, dure 6, et termine à 15. Rotation et attente ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Rotation = 15 − 2 = <strong>13</strong>. Attente = 13 − 6 = <strong>7</strong>. Ces deux formules restent valables même si le processus a été coupé en plusieurs morceaux : on ne regarde que sa date de <strong>fin</strong>.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Comment aborder ce chapitre</h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p>En préemptif, <strong>réexamine la file à chaque événement</strong> : une arrivée, une fin, une fin de quantum. Tiens à jour, au crayon, un petit tableau « temps restant » pour chaque processus.</p>\n</aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>En Round-Robin, oublier <strong>où</strong> remettre le processus coupé. Il va <strong>en queue</strong> de la file, <strong>après</strong> les processus arrivés pendant son quantum. Une erreur d&#39;ordre ici fausse tout le reste du Gantt.</p>\n</aside><p>À la fin, tu sais dessiner les Gantt SRTF, RR et priorités (avec ou sans préemption) et en tirer les temps moyens.</p>\n<h2>Idée 1 · SRTF : le plus petit temps restant</h2>\n<p><strong>SRTF</strong> (<em>Shortest Remaining Time First</em>, PCTER) est <strong>préemptif</strong> : à chaque arrivée, on compare le <strong>temps restant</strong> du processus en cours avec la durée du nouveau. Le plus petit prend le CPU.</p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>SRTF, exemple du cours : P1 (0, 7), P2 (2, 4), P3 (4, 1), P4 (5, 4)</figcaption><div class=\"etape\"><div class=\"et-t\">1/6 · t = 0</div><p>Seul P1 est là. Il démarre.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/6 · t = 2</div><p>P2 arrive (4). P1 a encore 5 : P2 (4 &lt; 5) prend le CPU.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/6 · t = 4</div><p>P3 arrive (1). P2 a encore 2 : P3 (1 &lt; 2) prend le CPU.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">4/6 · t = 5</div><p>P3 fini. P4 arrive (4). Restes : P2 = 2, P4 = 4, P1 = 5. P2 reprend.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">5/6 · t = 7</div><p>P2 fini. P4 (4) avant P1 (5).</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">6/6 · t = 11</div><p>P4 fini. P1 termine ses 5 unités : fin à 16.</p>\n</div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><figure class=\"grille\"><figcaption>SRTF, exemple du cours</figcaption><table><tr><th></th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th><th>11</th><th>12</th><th>13</th><th>14</th><th>15</th></tr><tr><th>P1</th><td class=\"h1\">■</td><td class=\"h1\">■</td><td class=\"h0\">·</td><td class=\"h0\">·</td><td class=\"h0\">·</td><td class=\"h0\">·</td><td class=\"h0\">·</td><td class=\"h0\">·</td><td class=\"h0\">·</td><td class=\"h0\">·</td><td class=\"h0\">·</td><td class=\"h1\">■</td><td class=\"h1\">■</td><td class=\"h1\">■</td><td class=\"h1\">■</td><td class=\"h1\">■</td></tr><tr><th>P2</th><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h1\">■</td><td class=\"h1\">■</td><td class=\"h0\">·</td><td class=\"h1\">■</td><td class=\"h1\">■</td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td></tr><tr><th>P3</th><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h1\">■</td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td></tr><tr><th>P4</th><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\">·</td><td class=\"h0\">·</td><td class=\"h1\">■</td><td class=\"h1\">■</td><td class=\"h1\">■</td><td class=\"h1\">■</td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td></tr></table></figure><pre class=\"\"><code>def temps(fin, arrivee, duree):\n    rot = {p: fin[p] - arrivee[p] for p in fin}\n    att = {p: rot[p] - duree[p] for p in fin}\n    for p in fin:\n        print(f&quot;{p} : rotation {fin[p]}-{arrivee[p]}={rot[p]}  attente {rot[p]}-{duree[p]}={att[p]}&quot;)\n    n = len(fin)\n    print(f&quot;TMR = {sum(rot.values())}/{n} = {sum(rot.values())/n:g} ; TMA = {sum(att.values())}/{n} = {sum(att.values())/n:g}&quot;)\n\ntemps(fin={&quot;P1&quot;: 16, &quot;P2&quot;: 7, &quot;P3&quot;: 5, &quot;P4&quot;: 11},\n      arrivee={&quot;P1&quot;: 0, &quot;P2&quot;: 2, &quot;P3&quot;: 4, &quot;P4&quot;: 5},\n      duree={&quot;P1&quot;: 7, &quot;P2&quot;: 4, &quot;P3&quot;: 1, &quot;P4&quot;: 4})</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>P1 : rotation 16-0=16  attente 16-7=9\nP2 : rotation 7-2=5  attente 5-4=1\nP3 : rotation 5-4=1  attente 1-1=0\nP4 : rotation 11-5=6  attente 6-4=2\nTMR = 28/4 = 7 ; TMA = 12/4 = 3</code></pre><p>On retrouve le TMA = 3 des diapos.</p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p>SRTF minimise l&#39;attente des processus courts, mais <strong>pénalise les longs</strong> (risque de <strong>famine</strong>) et ne tient pas compte de leur importance.</p>\n</aside><h2>Idée 2 · « SJF préemptif » dans le cours : on compare les durées totales</h2>\n<p>Le cours traite à part un <strong>SJF préemptif</strong>. Dans son exemple (P2 (0, 12), P3 (3, 8), P4 (5, 4), P1 (10, 10), P5 (12, 6)), le choix se fait sur la <strong>durée totale</strong> de chaque processus, pas sur son temps restant.</p>\n<figure class=\"grille\"><figcaption>SJF préemptif du cours (frise compacte)</figcaption><table><tr><th>0–3</th><th>3–5</th><th>5–9</th><th>9–12</th><th>12–18</th><th>18–21</th><th>21–31</th><th>31–40</th></tr><tr><td class=\"h1\">P2</td><td class=\"h1\">P3</td><td class=\"h1\">P4</td><td class=\"h1\">P3</td><td class=\"h1\">P5</td><td class=\"h1\">P3</td><td class=\"h1\">P1</td><td class=\"h1\">P2</td></tr></table></figure><p>À t = 12, P5 (durée 6) coupe P3 (durée 8), alors que P3 n&#39;avait plus que 3 unités à faire. Et à t = 21, P1 (10) passe avant P2 (12), alors qu&#39;il ne restait que 9 à P2.</p>\n<pre class=\"\"><code>temps(fin={&quot;P2&quot;: 40, &quot;P3&quot;: 21, &quot;P4&quot;: 9, &quot;P1&quot;: 31, &quot;P5&quot;: 18},\n      arrivee={&quot;P2&quot;: 0, &quot;P3&quot;: 3, &quot;P4&quot;: 5, &quot;P1&quot;: 10, &quot;P5&quot;: 12},\n      duree={&quot;P2&quot;: 12, &quot;P3&quot;: 8, &quot;P4&quot;: 4, &quot;P1&quot;: 10, &quot;P5&quot;: 6})</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>P2 : rotation 40-0=40  attente 40-12=28\nP3 : rotation 21-3=18  attente 18-8=10\nP4 : rotation 9-5=4  attente 4-4=0\nP1 : rotation 31-10=21  attente 21-10=11\nP5 : rotation 18-12=6  attente 6-6=0\nTMR = 89/5 = 17.8 ; TMA = 49/5 = 9.8</code></pre><p>C&#39;est bien le TMA = 9,8 des diapos.</p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>Dans la plupart des livres, « SJF préemptif » est <strong>synonyme</strong> de SRTF (on compare les temps restants). Avec SRTF, cet exemple donne TMA = <strong>9</strong> au lieu de 9,8 (P5 n&#39;interrompt plus P3). À l&#39;examen, si l&#39;énoncé dit « SRTF », compare les <strong>temps restants</strong> ; s&#39;il dit « SJF avec préemption », précise la règle que tu appliques en une phrase.</p>\n</aside><h2>Idée 3 · Round-Robin : chacun son quantum</h2>\n<p><strong>RR</strong> (tourniquet) : FCFS <strong>avec préemption</strong> par une horloge. Chaque processus reçoit au plus un <strong>quantum</strong> q de CPU (10 à 100 ms en vrai), puis retourne <strong>en queue</strong> de file.</p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Les règles qui font tout le Round-Robin</figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Tête de file</div><p>Le processus en tête reçoit le CPU pour au plus q unités.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · Il finit avant q</div><p>Il sort ; le suivant démarre aussitôt (pas besoin d&#39;attendre la fin du quantum).</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · Il n&#39;a pas fini après q</div><p>Il est préempté et remis EN QUEUE.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · Ordre à l&#39;instant t</div><p>Les processus qui arrivent à t entrent dans la file AVANT celui qui vient d&#39;être préempté à t (convention suivie par le cours).</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · Garantie</div><p>Avec n processus, chacun attend au plus (n − 1) × q avant de reprendre la main.</p>\n</div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><p><strong>TD2, exercice 3</strong> : A (0, 3), B (1, 6), C (4, 4), D (6, 2), q = 2.</p>\n<figure class=\"grille\"><figcaption>RR quantum 2, TD2 exercice 3</figcaption><table><tr><th></th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th><th>11</th><th>12</th><th>13</th><th>14</th></tr><tr><th>A</th><td class=\"h1\">■</td><td class=\"h1\">■</td><td class=\"h0\">·</td><td class=\"h0\">·</td><td class=\"h1\">■</td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td></tr><tr><th>B</th><td class=\"h0\"></td><td class=\"h0\">·</td><td class=\"h1\">■</td><td class=\"h1\">■</td><td class=\"h0\">·</td><td class=\"h0\">·</td><td class=\"h0\">·</td><td class=\"h1\">■</td><td class=\"h1\">■</td><td class=\"h0\">·</td><td class=\"h0\">·</td><td class=\"h0\">·</td><td class=\"h0\">·</td><td class=\"h1\">■</td><td class=\"h1\">■</td></tr><tr><th>C</th><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\">·</td><td class=\"h1\">■</td><td class=\"h1\">■</td><td class=\"h0\">·</td><td class=\"h0\">·</td><td class=\"h0\">·</td><td class=\"h0\">·</td><td class=\"h1\">■</td><td class=\"h1\">■</td><td class=\"h0\"></td><td class=\"h0\"></td></tr><tr><th>D</th><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\">·</td><td class=\"h0\">·</td><td class=\"h0\">·</td><td class=\"h1\">■</td><td class=\"h1\">■</td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td></tr></table></figure><p>File : à t = 2 → [B, A] ; à t = 4, C arrive puis B est remis : [A, C, B] ; A finit à 5 ; à t = 6, D arrive puis C remis : [B, D, C]…</p>\n<pre class=\"\"><code>temps(fin={&quot;A&quot;: 5, &quot;B&quot;: 15, &quot;C&quot;: 13, &quot;D&quot;: 11},\n      arrivee={&quot;A&quot;: 0, &quot;B&quot;: 1, &quot;C&quot;: 4, &quot;D&quot;: 6},\n      duree={&quot;A&quot;: 3, &quot;B&quot;: 6, &quot;C&quot;: 4, &quot;D&quot;: 2})</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>A : rotation 5-0=5  attente 5-3=2\nB : rotation 15-1=14  attente 14-6=8\nC : rotation 13-4=9  attente 9-4=5\nD : rotation 11-6=5  attente 5-2=3\nTMR = 33/4 = 8.25 ; TMA = 18/4 = 4.5</code></pre><p><strong>Exemple du cours</strong> (q = 5) : P1 (0, 12), P2 (1, 8), P3 (2, 4), P4 (3, 10), P5 (4, 5).</p>\n<figure class=\"grille\"><figcaption>RR quantum 5, exemple du cours (frise compacte)</figcaption><table><tr><th>0–5</th><th>5–10</th><th>10–14</th><th>14–19</th><th>19–24</th><th>24–29</th><th>29–32</th><th>32–37</th><th>37–39</th></tr><tr><td class=\"h1\">P1</td><td class=\"h1\">P2</td><td class=\"h1\">P3</td><td class=\"h1\">P4</td><td class=\"h1\">P5</td><td class=\"h1\">P1</td><td class=\"h1\">P2</td><td class=\"h1\">P4</td><td class=\"h1\">P1</td></tr></table></figure><pre class=\"\"><code>temps(fin={&quot;P1&quot;: 39, &quot;P2&quot;: 32, &quot;P3&quot;: 14, &quot;P4&quot;: 37, &quot;P5&quot;: 24},\n      arrivee={&quot;P1&quot;: 0, &quot;P2&quot;: 1, &quot;P3&quot;: 2, &quot;P4&quot;: 3, &quot;P5&quot;: 4},\n      duree={&quot;P1&quot;: 12, &quot;P2&quot;: 8, &quot;P3&quot;: 4, &quot;P4&quot;: 10, &quot;P5&quot;: 5})</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>P1 : rotation 39-0=39  attente 39-12=27\nP2 : rotation 32-1=31  attente 31-8=23\nP3 : rotation 14-2=12  attente 12-4=8\nP4 : rotation 37-3=34  attente 34-10=24\nP5 : rotation 24-4=20  attente 20-5=15\nTMR = 136/5 = 27.2 ; TMA = 97/5 = 19.4</code></pre><p>TMA = 19,4 : identique aux diapos.</p>\n<aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend</div><p><strong>Effet du quantum (TD2, ex. 1).</strong> Quantum <strong>très grand</strong> : RR devient <strong>FCFS</strong> (personne n&#39;est jamais coupé). Quantum <strong>très petit</strong> : beaucoup de commutations de contexte, donc beaucoup de temps perdu.</p>\n</aside><h2>Idée 4 · Priorités, avec ou sans préemption</h2>\n<p>Chaque processus a une <strong>priorité</strong> ; le CPU va au plus prioritaire (FCFS en cas d&#39;égalité).</p>\n<ul>\n<li><strong>Non préemptif</strong> : le processus en cours termine son cycle.</li>\n<li><strong>Préemptif</strong> : un nouveau venu plus prioritaire prend la main tout de suite.</li>\n</ul>\n<aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p><strong>Lis l&#39;énoncé</strong> : dans le cours, la priorité 1 est la plus forte (petit nombre = prioritaire). Dans le TD2 ex. 4, c&#39;est l&#39;inverse : « un nombre de priorité élevé correspond à une priorité plus importante ».</p>\n</aside><p><strong>Exemple du cours, non préemptif</strong> (tous à t = 0 ; priorités P1 = 3, P2 = 1, P3 = 4, P4 = 5, P5 = 2 ; durées 10, 1, 2, 1, 5) : ordre P2, P5, P1, P3, P4.</p>\n<figure class=\"grille\"><figcaption>Priorités non préemptif, exemple du cours (1 = plus prioritaire)</figcaption><table><tr><th>0–1</th><th>1–6</th><th>6–16</th><th>16–18</th><th>18–19</th></tr><tr><td class=\"h1\">P2</td><td class=\"h1\">P5</td><td class=\"h1\">P1</td><td class=\"h1\">P3</td><td class=\"h1\">P4</td></tr></table></figure><p>Attentes : P1 = 6, P2 = 0, P3 = 16, P4 = 18, P5 = 1, donc TMA = 41/5 = <strong>8,2</strong>.</p>\n<p><strong>Version préemptive</strong> (arrivées 0, 1, 2, 3, 4) : P1 démarre, P2 (priorité 1) le coupe à t = 1, P1 reprend à 2, P5 (priorité 2) le coupe à 4, P1 reprend à 9.</p>\n<figure class=\"grille\"><figcaption>Priorités préemptif, exemple du cours</figcaption><table><tr><th>0–1</th><th>1–2</th><th>2–4</th><th>4–9</th><th>9–16</th><th>16–18</th><th>18–19</th></tr><tr><td class=\"h1\">P1</td><td class=\"h1\">P2</td><td class=\"h1\">P1</td><td class=\"h1\">P5</td><td class=\"h1\">P1</td><td class=\"h1\">P3</td><td class=\"h1\">P4</td></tr></table></figure><pre class=\"\"><code>temps(fin={&quot;P1&quot;: 16, &quot;P2&quot;: 2, &quot;P3&quot;: 18, &quot;P4&quot;: 19, &quot;P5&quot;: 9},\n      arrivee={&quot;P1&quot;: 0, &quot;P2&quot;: 1, &quot;P3&quot;: 2, &quot;P4&quot;: 3, &quot;P5&quot;: 4},\n      duree={&quot;P1&quot;: 10, &quot;P2&quot;: 1, &quot;P3&quot;: 2, &quot;P4&quot;: 1, &quot;P5&quot;: 5})</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>P1 : rotation 16-0=16  attente 16-10=6\nP2 : rotation 2-1=1  attente 1-1=0\nP3 : rotation 18-2=16  attente 16-2=14\nP4 : rotation 19-3=16  attente 16-1=15\nP5 : rotation 9-4=5  attente 5-5=0\nTMR = 54/5 = 10.8 ; TMA = 35/5 = 7</code></pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p>Le risque des priorités est la <strong>famine</strong> : un processus peu prioritaire peut ne jamais passer. Remède : le <strong>vieillissement</strong> (<em>aging</em>), qui augmente la priorité d&#39;un processus avec son temps d&#39;attente.</p>\n</aside><figure class=\"grille\"><figcaption>Récapitulatif des algorithmes</figcaption><table><tr><th>Algorithme</th><th>Critère de choix</th><th>Préemptif ?</th></tr><tr><td>FCFS</td><td>ordre d'arrivée</td><td>non</td></tr><tr><td>SJF</td><td>durée totale la plus courte</td><td>les deux versions</td></tr><tr><td>SRTF</td><td>temps restant le plus court</td><td class=\"h1\">oui</td></tr><tr><td>RR</td><td>ordre d'arrivée + quantum</td><td class=\"h1\">oui</td></tr><tr><td>Priorités</td><td>priorité la plus forte</td><td>les deux versions</td></tr></table></figure><h2>S&#39;exercer</h2>\n<section class=\"exo\"><h3>TD2 et annales</h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>TD2 ex. 2 en <strong>SRTF</strong> : P1 (0, 3), P2 (2, 6), P3 (4, 4), P4 (6, 5), P5 (8, 2). Gantt et TMA ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button></div><div class=\"ex-h\" hidden><p>À t = 4, P3 (4) arrive et P2 n&#39;a plus que 5.</p>\n</div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 3.2</b></p><p>Gantt : P1 [0–3], P2 [3–4], P3 [4–8], P5 [8–10], P2 [10–15], P4 [15–20].\n  Rotations : 3, 13, 4, 14, 2 → TMR = 36/5 = <strong>7,2</strong>.\n  Attentes : 0, 7, 0, 9, 0 → TMA = 16/5 = <strong>3,2</strong>.</p>\n</div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>TD2 ex. 3 en <strong>SJF avec préemption</strong> : A (0, 3), B (1, 6), C (4, 4), D (6, 2). Gantt ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Avec SRTF : A [0–3], B [3–4], C [4–8], D [8–10], B [10–15]. TMR = 25/4 = 6,25 ; TMA = 10/4 = <strong>2,5</strong>.\n  Avec la règle du cours (durées totales), à t = 6 D (2) coupe C (4) : A [0–3], B [3–4], C [4–6], D [6–8], C [8–10], B [10–15] ; même TMA = 2,5 (C attend 2 et D 0 au lieu de 0 et 2).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>TD2 ex. 4, priorités (<strong>grand nombre = prioritaire</strong>) : A (0, 5, p4), B (2, 4, p2), C (2, 2, p6), D (4, 4, p3). Non préemptif puis préemptif : TMA ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Non préemptif : A [0–5], C [5–7], D [7–11], B [11–15] → attentes 0, 9, 3, 3 → TMA = 15/4 = <strong>3,75</strong> ; TMR = 30/4 = 7,5.\n  Préemptif : A [0–2], C [2–4], A [4–7], D [7–11], B [11–15] → attentes 2, 9, 0, 3 → TMA = 14/4 = <strong>3,5</strong> ; TMR = 29/4 = 7,25.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Examen 2025 (normale) : SRTF avec P1 (0, 4), P2 (2, 5), P3 (4, 6), P4 (6, 2). TMA ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 2.75</b></p><p>Gantt : P1 [0–4] (à t = 2, P1 n&#39;a plus que 2 &lt; 5), P2 [4–6], P4 [6–8] (2 &lt; 3 restants de P2), P2 [8–11], P3 [11–17].\n  Rotations 4, 9, 13, 2 → TMR = 7. Attentes 0, 4, 7, 0 → TMA = 11/4 = <strong>2,75</strong>.</p>\n</div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 10 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">En SRTF, un processus de durée 3 arrive alors que le processus en cours a encore 5 unités à faire. Que se passe-t-il ?</div><button class=\"opt\" data-o=\"0\">Le nouveau prend le CPU</button><button class=\"opt\" data-o=\"1\">Le processus en cours continue</button><button class=\"opt\" data-o=\"2\">Les deux se partagent le CPU</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">En Round-Robin, un processus préempté va :</div><button class=\"opt\" data-o=\"0\">en tête de la file</button><button class=\"opt\" data-o=\"1\">en queue de la file</button><button class=\"opt\" data-o=\"2\">dans la file du périphérique</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Que devient RR si le quantum est plus grand que toutes les durées ?</div><button class=\"opt\" data-o=\"0\">FCFS</button><button class=\"opt\" data-o=\"1\">SJF</button><button class=\"opt\" data-o=\"2\">SRTF</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Avec 5 processus et q = 20 ms, le temps de réponse est au plus :</div><button class=\"opt\" data-o=\"0\">100 ms</button><button class=\"opt\" data-o=\"1\">80 ms</button><button class=\"opt\" data-o=\"2\">20 ms</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Quel algorithme n&#39;a jamais de version préemptive ?</div><button class=\"opt\" data-o=\"0\">FCFS</button><button class=\"opt\" data-o=\"1\">SJF</button><button class=\"opt\" data-o=\"2\">Priorités</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Le vieillissement sert à :</div><button class=\"opt\" data-o=\"0\">accélérer les commutations de contexte</button><button class=\"opt\" data-o=\"1\">éviter la famine des processus peu prioritaires</button><button class=\"opt\" data-o=\"2\">réduire le quantum</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Exemple SRTF du cours : P1 (0, 7), P2 (2, 4), P3 (4, 1), P4 (5, 4). Quand P1 termine-t-il ?</div><button class=\"opt\" data-o=\"0\">7</button><button class=\"opt\" data-o=\"1\">11</button><button class=\"opt\" data-o=\"2\">16</button><button class=\"opt\" data-o=\"3\">12</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Un processus a été coupé trois fois et termine à 20. Il est arrivé à 4 et dure 7. Son attente :</div><button class=\"opt\" data-o=\"0\">13</button><button class=\"opt\" data-o=\"1\">9</button><button class=\"opt\" data-o=\"2\">16</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Dans le TD2 ex. 4, la priorité 6 est :</div><button class=\"opt\" data-o=\"0\">la plus forte</button><button class=\"opt\" data-o=\"1\">la plus faible</button><button class=\"opt\" data-o=\"2\">invalide</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Quel inconvénient de SRTF le cours souligne-t-il ?</div><button class=\"opt\" data-o=\"0\">Il est non préemptif</button><button class=\"opt\" data-o=\"1\">Il pénalise les processus longs (famine possible)</button><button class=\"opt\" data-o=\"2\">Il ignore les durées</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"ordo-preemptif","rep":null,"tol":null},{"n":"ordo-preemptif","rep":["3.2"],"tol":0.01},{"n":"ordo-preemptif","rep":null,"tol":null},{"n":"ordo-preemptif","rep":null,"tol":null},{"n":"ordo-preemptif","rep":["2.75"],"tol":0.01}],"qcm":[{"n":"ordo-preemptif","q":"En SRTF, un processus de durée 3 arrive alors que le processus en cours a encore 5 unités à faire. Que se passe-t-il ?","o":["Le nouveau prend le CPU","Le processus en cours continue","Les deux se partagent le CPU"],"a":0,"e":"3 &lt; 5 : le plus petit temps restant gagne."},{"n":"ordo-preemptif","q":"En Round-Robin, un processus préempté va :","o":["en tête de la file","en queue de la file","dans la file du périphérique"],"a":1,"e":"C&#39;est un tourniquet : retour en queue."},{"n":"ordo-preemptif","q":"Que devient RR si le quantum est plus grand que toutes les durées ?","o":["FCFS","SJF","SRTF"],"a":0,"e":"Plus personne n&#39;est coupé : on sert dans l&#39;ordre d&#39;arrivée."},{"n":"ordo-preemptif","q":"Avec 5 processus et q = 20 ms, le temps de réponse est au plus :","o":["100 ms","80 ms","20 ms"],"a":1,"e":"(n − 1) × q = 4 × 20."},{"n":"ordo-preemptif","q":"Quel algorithme n&#39;a jamais de version préemptive ?","o":["FCFS","SJF","Priorités"],"a":0,"e":"FCFS sert jusqu&#39;au bout dans l&#39;ordre d&#39;arrivée."},{"n":"ordo-preemptif","q":"Le vieillissement sert à :","o":["accélérer les commutations de contexte","éviter la famine des processus peu prioritaires","réduire le quantum"],"a":1,"e":"On augmente la priorité de ceux qui attendent longtemps."},{"n":"ordo-preemptif","q":"Exemple SRTF du cours : P1 (0, 7), P2 (2, 4), P3 (4, 1), P4 (5, 4). Quand P1 termine-t-il ?","o":["7","11","16","12"],"a":2,"e":"P1 ne reprend qu&#39;après P2, P3 et P4 : de 11 à 16."},{"n":"ordo-preemptif","q":"Un processus a été coupé trois fois et termine à 20. Il est arrivé à 4 et dure 7. Son attente :","o":["13","9","16"],"a":1,"e":"Rotation 16, moins 7 d&#39;exécution. Le nombre de coupures ne change rien à la formule."},{"n":"ordo-preemptif","q":"Dans le TD2 ex. 4, la priorité 6 est :","o":["la plus forte","la plus faible","invalide"],"a":0,"e":"L&#39;énoncé précise : nombre élevé = priorité plus importante."},{"n":"ordo-preemptif","q":"Quel inconvénient de SRTF le cours souligne-t-il ?","o":["Il est non préemptif","Il pénalise les processus longs (famine possible)","Il ignore les durées"],"a":1,"e":"Les courts passent toujours devant."}]},{"id":"memoire-allocation-pagination","t":"Mémoire (1) · allocation, pagination et segmentation","seance":"Chapitre 3 · Gestion de la mémoire · TD3","imp":5,"html":"<h2>Avant de commencer</h2>\n<p>Deux outils de calcul servent partout : la <strong>division entière</strong> et le <strong>reste</strong> (modulo), et les <strong>puissances de 2</strong> (1 Ko = 1024 = 2¹⁰ octets, 4 Ko = 2¹², 8 Ko = 2¹³).</p>\n<section class=\"exo\"><h3>Vérifie ton prérequis</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Combien valent 20000 ÷ 4096 (division entière) et 20000 mod 4096 ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>4 × 4096 = 16384.</p>\n</div><div class=\"ex-c\" hidden><p>20000 = 4 × 4096 + 3616. Quotient <strong>4</strong>, reste <strong>3616</strong>. C&#39;est exactement « page 4, déplacement 3616 » pour des pages de 4 Ko.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Comment aborder ce chapitre</h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p>Une adresse virtuelle, c&#39;est un <strong>numéro de page + une position dans la page</strong>, comme « immeuble 4, appartement 3616 ». La traduction ne change <strong>que</strong> le numéro de l&#39;immeuble ; l&#39;appartement (le déplacement) reste le même.</p>\n</aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>En segmentation, une adresse est valide si <strong>déplacement &lt; limite</strong>, strictement. (4:200) avec une limite de 200 est une <strong>erreur</strong> : les positions valides vont de 0 à 199.</p>\n</aside><p>À la fin, tu sais choisir une zone libre (first, next, best, worst fit), traduire une adresse paginée ou segmentée et distinguer les deux fragmentations.</p>\n<h2>Idée 1 · Adresse logique, adresse physique et MMU</h2>\n<ul>\n<li><strong>Adresse logique</strong> (virtuelle) : générée par le CPU, relative au programme, indépendante de sa place en RAM.</li>\n<li><strong>Adresse physique</strong> : l&#39;adresse réelle dans la RAM.</li>\n<li>La <strong>MMU</strong> (<em>Memory Management Unit</em>), un circuit matériel, traduit l&#39;une en l&#39;autre à chaque accès.</li>\n</ul>\n<p>La <strong>mémoire virtuelle</strong> permet d&#39;exécuter des programmes plus grands que la RAM : seule une partie est en mémoire, le reste sur le disque.</p>\n<p>Le gestionnaire de mémoire du SE doit : <strong>partager</strong> la mémoire entre processus, <strong>allouer</strong> des blocs, <strong>protéger</strong> chaque espace, <strong>récupérer</strong> la mémoire libérée et <strong>optimiser</strong> la place disponible.</p>\n<p><strong>Registres base et limite.</strong> Le registre <strong>base</strong> contient le début de la zone du processus, le registre <strong>limite</strong> sa taille. Toute adresse logique doit être <strong>&lt; limite</strong> (protection), puis on lui ajoute la base (réallocation).</p>\n<figure class=\"flux\"><figcaption>Exemple du cours : base = 12000</figcaption><div class=\"flux-l\"><div class=\"flux-b\">Adresse logique 1352</div><div class=\"flux-f\">→</div><div class=\"flux-b\">1352 &lt; limite ? oui</div><div class=\"flux-f\">→</div><div class=\"flux-b\">1352 + 12000</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Adresse physique 13352</div></div></figure><p>Si le processus est déplacé en mémoire, il suffit de changer son registre base.</p>\n<h2>Idée 2 · Choisir une zone libre : first, next, best, worst</h2>\n<p>Allocation <strong>contiguë</strong> : tout le processus dans des adresses consécutives. <strong>Non contiguë</strong> : ses morceaux sont dispersés (pagination, segmentation).</p>\n<table>\n<thead>\n<tr>\n<th>Stratégie</th>\n<th>Règle</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>First-fit</strong></td>\n<td>la <strong>première</strong> zone assez grande, en partant du début</td>\n</tr>\n<tr>\n<td><strong>Next-fit</strong></td>\n<td>comme first-fit, mais on repart de <strong>la dernière zone utilisée</strong></td>\n</tr>\n<tr>\n<td><strong>Best-fit</strong></td>\n<td>la <strong>plus petite</strong> zone assez grande</td>\n</tr>\n<tr>\n<td><strong>Worst-fit</strong></td>\n<td>la <strong>plus grande</strong> zone</td>\n</tr>\n</tbody></table>\n<p><strong>Exemple du cours</strong> : zones de 100, 500, 200, 300 et 600 Ko ; processus P1 = 212, P2 = 417, P3 = 112, P4 = 426 Ko. Quand une zone est plus grande que la demande, le reste reste libre.</p>\n<pre class=\"\"><code>def allouer(zones, requetes, strategie):\n    zones = [list(z) for z in zones]\n    pos = 0                                    # next-fit : où reprendre la recherche\n    for r in requetes:\n        ok = [i for i, z in enumerate(zones) if z[1] &gt;= r]\n        if not ok:\n            print(f&quot;{r:&gt;4} : aucune zone assez grande (attente)&quot;); continue\n        if strategie == &quot;first&quot;:\n            i = ok[0]\n        elif strategie == &quot;next&quot;:\n            i = next((j for j in ok if j &gt;= pos), ok[0])\n        elif strategie == &quot;best&quot;:\n            i = min(ok, key=lambda j: zones[j][1])\n        else:\n            i = max(ok, key=lambda j: zones[j][1])\n        avant = zones[i][1]\n        zones[i][1] -= r\n        pos = i\n        print(f&quot;{r:&gt;4} -&gt; {zones[i][0]} (libre {avant}, reste {zones[i][1]})&quot;)\n\nzones = [[&quot;100Ko&quot;, 100], [&quot;500Ko&quot;, 500], [&quot;200Ko&quot;, 200], [&quot;300Ko&quot;, 300], [&quot;600Ko&quot;, 600]]\nfor s in (&quot;first&quot;, &quot;best&quot;, &quot;worst&quot;):\n    print(s)\n    allouer(zones, [212, 417, 112, 426], s)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>first\n 212 -&gt; 500Ko (libre 500, reste 288)\n 417 -&gt; 600Ko (libre 600, reste 183)\n 112 -&gt; 500Ko (libre 288, reste 176)\n 426 : aucune zone assez grande (attente)\nbest\n 212 -&gt; 300Ko (libre 300, reste 88)\n 417 -&gt; 500Ko (libre 500, reste 83)\n 112 -&gt; 200Ko (libre 200, reste 88)\n 426 -&gt; 600Ko (libre 600, reste 174)\nworst\n 212 -&gt; 600Ko (libre 600, reste 388)\n 417 -&gt; 500Ko (libre 500, reste 83)\n 112 -&gt; 600Ko (libre 388, reste 276)\n 426 : aucune zone assez grande (attente)</code></pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p>Ici, <strong>seul best-fit</strong> place les quatre processus. First-fit et worst-fit laissent P4 (426 Ko) en attente, alors qu&#39;il reste plus de 426 Ko libres au total, mais en morceaux : c&#39;est la <strong>fragmentation externe</strong>.</p>\n</aside><p><strong>Va-et-vient (swapping).</strong> Une partie de l&#39;espace d&#39;un processus peut être retirée temporairement de la RAM vers le disque (<em>swap out</em>) puis ramenée (<em>swap in</em>), au profit d&#39;un autre processus.</p>\n<h2>Idée 3 · La pagination</h2>\n<ul>\n<li>L&#39;espace <strong>virtuel</strong> est découpé en <strong>pages</strong>, l&#39;espace <strong>physique</strong> en <strong>cadres</strong> (<em>frames</em>), de <strong>même taille fixe</strong>.</li>\n<li>Une adresse virtuelle = (<strong>numéro de page</strong>, <strong>déplacement</strong>). Une adresse physique = (<strong>numéro de cadre</strong>, <strong>déplacement</strong>). Le déplacement ne change pas.</li>\n<li>La <strong>table des pages</strong> (une par processus) donne, pour chaque page : le <strong>numéro de cadre</strong>, un bit de <strong>présence</strong>, un bit de <strong>modification</strong> (M), un bit de <strong>référence</strong> (R), des bits de <strong>protection</strong>.</li>\n</ul>\n<svg viewBox=\"0 0 640 230\" style=\"width:100%;max-width:640px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Traduction paginée : l'adresse virtuelle 1578 se découpe en page 6 et déplacement 42 ; la table des pages donne le cadre 5 ; l'adresse physique est 5 fois 256 plus 42, soit 1322\">\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\">\n<text x=\"110\" y=\"22\" font-weight=\"700\">Adresse virtuelle 1578</text>\n<rect x=\"30\" y=\"34\" width=\"90\" height=\"36\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/><text x=\"75\" y=\"57\">page 6</text>\n<rect x=\"120\" y=\"34\" width=\"90\" height=\"36\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"165\" y=\"57\">dép 42</text>\n<text x=\"320\" y=\"22\" font-weight=\"700\">Table des pages</text>\n<rect x=\"270\" y=\"34\" width=\"100\" height=\"150\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n<text x=\"320\" y=\"56\">0 → 3</text><text x=\"320\" y=\"80\">2 → 0</text>\n<rect x=\"272\" y=\"92\" width=\"96\" height=\"26\" fill=\"#D9824F\" fill-opacity=\"0.2\"/><text x=\"320\" y=\"110\" font-weight=\"700\">6 → 5</text>\n<text x=\"320\" y=\"140\">…</text>\n<text x=\"530\" y=\"22\" font-weight=\"700\">Adresse physique</text>\n<rect x=\"440\" y=\"34\" width=\"90\" height=\"36\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/><text x=\"485\" y=\"57\">cadre 5</text>\n<rect x=\"530\" y=\"34\" width=\"90\" height=\"36\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"575\" y=\"57\">dép 42</text>\n<text x=\"530\" y=\"110\">5 × 256 + 42</text><text x=\"530\" y=\"134\" font-weight=\"700\" fill=\"#D9824F\">= 1322</text>\n</g>\n<g stroke=\"currentColor\" stroke-width=\"1.6\" fill=\"none\"><path d=\"M75,72 L75,105 L268,105\"/><path d=\"M372,105 L485,105 L485,72\"/><path d=\"M165,72 L165,200 L575,200 L575,72\" stroke-dasharray=\"5 4\"/></g>\n<text x=\"370\" y=\"218\" font-family=\"sans-serif\" font-size=\"12\" fill=\"currentColor\" text-anchor=\"middle\">le déplacement est recopié tel quel</text>\n</svg><figure class=\"etapes\" data-i=\"0\"><figcaption>Traduire une adresse paginée</figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Découper</div><p>page = adresse ÷ taille de page (division entière) ; déplacement = adresse mod taille de page.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Vérifier</div><p>La page existe-t-elle ? Sinon : erreur d&#39;adressage.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Présence</div><p>Bit de présence à 0 : défaut de page (chapitre suivant).</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Calculer</div><p>adresse physique = cadre × taille de page + déplacement.</p>\n</div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><p><strong>TD3, exercice 5</strong> : pages de 256 mots, table des pages de P1 ci-dessous.</p>\n<figure class=\"grille\"><figcaption>Table des pages de P1 (TD3, exercice 5)</figcaption><table><tr><th></th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th></tr><tr><th>Cadre</th><td class=\"h1\">011</td><td>001</td><td class=\"h1\">000</td><td>010</td><td>100</td><td>111</td><td class=\"h1\">101</td><td>110</td></tr><tr><th>Présente</th><td class=\"h1\">oui</td><td class=\"h0\">non</td><td class=\"h1\">oui</td><td class=\"h0\">non</td><td class=\"h0\">non</td><td class=\"h0\">non</td><td class=\"h1\">oui</td><td class=\"h0\">non</td></tr></table></figure><pre class=\"\"><code>TAILLE = 256                       # mots par page\ncadre    = [0b011, 0b001, 0b000, 0b010, 0b100, 0b111, 0b101, 0b110]\npresente = [True, False, True, False, False, False, True, False]\n\ndef physique(v):\n    page, dep = v // TAILLE, v % TAILLE\n    if page &gt;= len(cadre):\n        return f&quot;{v} : page {page} hors de l'espace d'adressage -&gt; erreur&quot;\n    if not presente[page]:\n        return f&quot;{v} : page {page} absente -&gt; défaut de page&quot;\n    return f&quot;{v} : page {page}, dép {dep} -&gt; cadre {cadre[page]} -&gt; {cadre[page]}*{TAILLE}+{dep} = {cadre[page] * TAILLE + dep}&quot;\n\nfor v in (240, 546, 1578, 2072, 770):\n    print(physique(v))</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>240 : page 0, dép 240 -&gt; cadre 3 -&gt; 3*256+240 = 1008\n546 : page 2, dép 34 -&gt; cadre 0 -&gt; 0*256+34 = 34\n1578 : page 6, dép 42 -&gt; cadre 5 -&gt; 5*256+42 = 1322\n2072 : page 8 hors de l'espace d'adressage -&gt; erreur\n770 : page 3 absente -&gt; défaut de page</code></pre><p>Taille de l&#39;espace d&#39;adressage de P1 : 8 pages × 256 = <strong>2048 mots</strong>. Mémoire vive : les cadres sont codés sur 3 bits, donc 2³ = 8 cadres × 256 = <strong>2048 mots</strong>.</p>\n<p><strong>En binaire</strong>, c&#39;est encore plus simple : avec des pages de 2^d, les <strong>d bits de droite</strong> sont le déplacement, les autres le numéro de page. On remplace le numéro de page par le numéro de cadre, on recopie le déplacement.</p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p>La pagination <strong>élimine la fragmentation externe</strong> (tous les cadres se valent), mais crée un peu de <strong>fragmentation interne</strong> dans la dernière page.</p>\n</aside><h2>Idée 4 · La segmentation</h2>\n<p>Le programme est découpé en <strong>segments de tailles variables</strong> (code, données, pile…). Chaque segment a une <strong>base</strong> et une <strong>limite</strong> dans la <strong>table des segments</strong> (qui contient aussi des informations de protection). Le PCB garde un pointeur vers cette table et le nombre de segments.</p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Traduire une adresse segmentée (s:d)</figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · Lire la table</div><p>Ligne du segment s : base et limite.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · Tester</div><p>Si d ≥ limite : erreur d&#39;adressage (erreur de segmentation).</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · Ajouter</div><p>Sinon, adresse physique = base + d.</p>\n</div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><figure class=\"grille\"><figcaption>TD3, exercice 4 : table des segments et traductions</figcaption><table><tr><th>Adresse</th><th>Base</th><th>Limite</th><th>Résultat</th></tr><tr><td>(0:128)</td><td>540</td><td>234</td><td class=\"h1\">668</td></tr><tr><td>(1:100)</td><td>1254</td><td>128</td><td class=\"h1\">1354</td></tr><tr><td>(2:465)</td><td>54</td><td>328</td><td class=\"h2\">erreur (465 ≥ 328)</td></tr><tr><td>(3:888)</td><td>2048</td><td>1024</td><td class=\"h1\">2936</td></tr><tr><td>(4:100)</td><td>976</td><td>200</td><td class=\"h1\">1076</td></tr><tr><td>(4:344)</td><td>976</td><td>200</td><td class=\"h2\">erreur (344 ≥ 200)</td></tr><tr><td>(4:200)</td><td>976</td><td>200</td><td class=\"h2\">erreur (200 ≥ 200)</td></tr></table></figure><p>Avantages cités par le cours : taille variable, structures dynamiques, protection (niveaux de privilège par segment).</p>\n<p><strong>Segmentation paginée.</strong> Chaque segment est lui-même découpé en pages : l&#39;adresse (s, d) devient (s, p, d&#39;). Exemple du cours, pages de 4 Ko : (2, 9392) → 9392 = 2 × 4096 + 1200 → <strong>(2, 2, 1200)</strong>.</p>\n<h2>Idée 5 · Les deux fragmentations</h2>\n<figure class=\"grille\"><figcaption>Fragmentation interne contre externe</figcaption><table><tr><th></th><th>Interne</th><th>Externe</th></tr><tr><td>Où ?</td><td class=\"h1\">à l'intérieur d'une zone allouée</td><td class=\"h2\">entre les zones allouées</td></tr><tr><td>Typique de</td><td>la pagination (taille fixe)</td><td>la segmentation / l'allocation contiguë</td></tr><tr><td>Exemple du cours</td><td>A demande 5 Ko, reçoit 2 pages de 4 Ko : 3 Ko perdus</td><td>assez de place au total, mais pas d'un seul tenant</td></tr><tr><td>Remède</td><td>pages plus petites</td><td>compactage (coûteux)</td></tr></table></figure><h2>S&#39;exercer</h2>\n<section class=\"exo\"><h3>TD3 et annales</h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Pages de 8 Ko : page et déplacement de l&#39;adresse 64096 (TD3, ex. 2) ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>7 × 8192 = 57344.</p>\n</div><div class=\"ex-c\" hidden><p>64096 = 7 × 8192 + 6752 → page <strong>7</strong>, déplacement <strong>6752</strong>. (Avec 4 Ko : page 15, déplacement 2656.)</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Examen 2025 : adresse virtuelle 15360. Page et déplacement avec des pages de 2 Ko, puis de 8 Ko ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>2 Ko = 2048 : 15360 = 7 × 2048 + 1024 → page <strong>7</strong>, dép <strong>1024</strong>. 8 Ko = 8192 : 15360 = 1 × 8192 + 7168 → page <strong>1</strong>, dép <strong>7168</strong>.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Examen 2025 : segments 0 (1200, 512), 1 (3400, 256), 2 (800, 180), 3 (5000, 2048), 4 (2560, 300). Traduis (0:256), (1:200), (2:250), (3:1500).</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>(0:256) → 1200 + 256 = <strong>1456</strong> ; (1:200) → <strong>3600</strong> ; (2:250) → <strong>erreur</strong> (250 ≥ 180) ; (3:1500) → <strong>6500</strong>.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>TD3 ex. 1 : adresses sur 32 bits, 22 bits de page, 10 bits de déplacement ; la table des pages commence par 3, 6, 7, 1. Traduis l&#39;adresse binaire 101010101010.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Les 10 bits de droite <code>1010101010</code> sont le déplacement (682). Ce qui reste, <code>10</code>, est la page 2, qui est dans le cadre 7 = <code>111</code>. Adresse physique : <code>111</code> suivi de <code>1010101010</code> = <code>1111010101010</code> (7 × 1024 + 682 = <strong>7850</strong>).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>Rattrapage 2025 : base 560, limite 215. Traduis (0:137) et (0:210).</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>137 &lt; 215 → <strong>697</strong> ; 210 &lt; 215 → <strong>770</strong>.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 11 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Qui traduit les adresses virtuelles en adresses physiques ?</div><button class=\"opt\" data-o=\"0\">Le compilateur</button><button class=\"opt\" data-o=\"1\">La MMU</button><button class=\"opt\" data-o=\"2\">L&#39;ordonnanceur</button><button class=\"opt\" data-o=\"3\">Le dispatcheur</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Pages de 4 Ko : à quelle page appartient l&#39;adresse 32768 ?</div><button class=\"opt\" data-o=\"0\">4</button><button class=\"opt\" data-o=\"1\">8</button><button class=\"opt\" data-o=\"2\">7</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Zones libres 100, 500, 200, 300, 600 Ko ; demande de 212 Ko en best-fit :</div><button class=\"opt\" data-o=\"0\">500</button><button class=\"opt\" data-o=\"1\">300</button><button class=\"opt\" data-o=\"2\">600</button><button class=\"opt\" data-o=\"3\">200</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Même demande de 212 Ko en worst-fit :</div><button class=\"opt\" data-o=\"0\">300</button><button class=\"opt\" data-o=\"1\">500</button><button class=\"opt\" data-o=\"2\">600</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Segment de base 976 et limite 200 : l&#39;adresse (4:200) est :</div><button class=\"opt\" data-o=\"0\">1176</button><button class=\"opt\" data-o=\"1\">invalide</button><button class=\"opt\" data-o=\"2\">1076</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">La pagination élimine :</div><button class=\"opt\" data-o=\"0\">la fragmentation externe</button><button class=\"opt\" data-o=\"1\">la fragmentation interne</button><button class=\"opt\" data-o=\"2\">les défauts de page</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Un processus demande 5 Ko avec des pages de 4 Ko. Combien sont perdus ?</div><button class=\"opt\" data-o=\"0\">1 Ko</button><button class=\"opt\" data-o=\"1\">3 Ko</button><button class=\"opt\" data-o=\"2\">4 Ko</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Registre base = 12000, adresse logique 1352. Adresse physique ?</div><button class=\"opt\" data-o=\"0\">10648</button><button class=\"opt\" data-o=\"1\">13352</button><button class=\"opt\" data-o=\"2\">1352</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Pages de 256 mots, page 6 dans le cadre 5. Adresse physique de l&#39;adresse virtuelle 1578 ?</div><button class=\"opt\" data-o=\"0\">1578</button><button class=\"opt\" data-o=\"1\">1322</button><button class=\"opt\" data-o=\"2\">1536</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Avec des pages de 4 Ko, l&#39;adresse segmentée (2, 9392) devient en segmentation paginée :</div><button class=\"opt\" data-o=\"0\">(2, 1, 5296)</button><button class=\"opt\" data-o=\"1\">(2, 2, 1200)</button><button class=\"opt\" data-o=\"2\">(2, 9, 392)</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"memoire-allocation-pagination","rep":null,"tol":null},{"n":"memoire-allocation-pagination","rep":null,"tol":null},{"n":"memoire-allocation-pagination","rep":null,"tol":null},{"n":"memoire-allocation-pagination","rep":null,"tol":null},{"n":"memoire-allocation-pagination","rep":null,"tol":null},{"n":"memoire-allocation-pagination","rep":null,"tol":null}],"qcm":[{"n":"memoire-allocation-pagination","q":"Qui traduit les adresses virtuelles en adresses physiques ?","o":["Le compilateur","La MMU","L&#39;ordonnanceur","Le dispatcheur"],"a":1,"e":"C&#39;est un circuit matériel dédié."},{"n":"memoire-allocation-pagination","q":"Pages de 4 Ko : à quelle page appartient l&#39;adresse 32768 ?","o":["4","8","7"],"a":1,"e":"32768 = 8 × 4096, déplacement 0."},{"n":"memoire-allocation-pagination","q":"Zones libres 100, 500, 200, 300, 600 Ko ; demande de 212 Ko en best-fit :","o":["500","300","600","200"],"a":1,"e":"La plus petite zone ≥ 212 est 300."},{"n":"memoire-allocation-pagination","q":"Même demande de 212 Ko en worst-fit :","o":["300","500","600"],"a":2,"e":"La plus grande zone."},{"n":"memoire-allocation-pagination","q":"Segment de base 976 et limite 200 : l&#39;adresse (4:200) est :","o":["1176","invalide","1076"],"a":1,"e":"Il faut déplacement &lt; limite : 200 n&#39;est pas &lt; 200."},{"n":"memoire-allocation-pagination","q":"La pagination élimine :","o":["la fragmentation externe","la fragmentation interne","les défauts de page"],"a":0,"e":"Tous les cadres ont la même taille : n&#39;importe quel cadre libre convient."},{"n":"memoire-allocation-pagination","q":"Un processus demande 5 Ko avec des pages de 4 Ko. Combien sont perdus ?","o":["1 Ko","3 Ko","4 Ko"],"a":1,"e":"Il reçoit 2 pages (8 Ko) : 8 − 5 = 3 Ko de fragmentation interne."},{"n":"memoire-allocation-pagination","q":"Registre base = 12000, adresse logique 1352. Adresse physique ?","o":["10648","13352","1352"],"a":1,"e":"On ajoute la base."},{"n":"memoire-allocation-pagination","q":"Pages de 256 mots, page 6 dans le cadre 5. Adresse physique de l&#39;adresse virtuelle 1578 ?","o":["1578","1322","1536"],"a":1,"e":"1578 = 6 × 256 + 42 ; 5 × 256 + 42 = 1322."},{"n":"memoire-allocation-pagination","q":"Avec des pages de 4 Ko, l&#39;adresse segmentée (2, 9392) devient en segmentation paginée :","o":["(2, 1, 5296)","(2, 2, 1200)","(2, 9, 392)"],"a":1,"e":"9392 = 2 × 4096 + 1200."}]},{"id":"remplacement-pages","t":"Mémoire (2) · défauts de page et algorithmes de remplacement","seance":"Chapitre 3 · Gestion de la mémoire (suite)","imp":4,"html":"<h2>Avant de commencer</h2>\n<p>Il te faut la pagination (chapitre précédent) : une page virtuelle est soit dans un <strong>cadre</strong> de la RAM (bit de présence à 1), soit sur le disque (bit à 0).</p>\n<section class=\"exo\"><h3>Vérifie ton prérequis</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Le processus accède à une page dont le bit de présence vaut 0. Que se passe-t-il ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Un <strong>défaut de page</strong> : le SE interrompt le processus, va chercher la page sur le disque et la charge dans un cadre. Si aucun cadre n&#39;est libre, il doit d&#39;abord <strong>choisir une victime</strong> : c&#39;est l&#39;objet de ce chapitre.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Comment aborder ce chapitre</h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p>Fais un <strong>tableau</strong> : une colonne par page demandée, une ligne par cadre, une dernière ligne « défaut ». Pour chaque demande : la page est-elle déjà là ? Oui → rien ne bouge. Non → F, et tu remplaces selon la règle.</p>\n</aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>En FIFO, la victime est la page <strong>entrée</strong> en mémoire le plus tôt, même si on vient de s&#39;en servir. Une page « réutilisée » ne rajeunit pas en FIFO ; elle rajeunit en LRU.</p>\n</aside><p>À la fin, tu sais remplir le tableau OPT, FIFO, LRU et MRU d&#39;une suite de références et compter les défauts.</p>\n<h2>Idée 1 · Que fait le SE lors d&#39;un défaut de page ?</h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Traitement d'un défaut de page</figcaption><div class=\"etape\"><div class=\"et-t\">1/6 · Défaut</div><p>La page demandée n&#39;est pas en RAM (bit de présence à 0) : déroutement vers le SE.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/6 · Place libre ?</div><p>S&#39;il y a un cadre libre, on y charge la page. Sinon, on passe au remplacement.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/6 · Victime</div><p>On choisit une page à retirer selon l&#39;algorithme de remplacement.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">4/6 · Bit M</div><p>Si la victime a été modifiée (bit M à 1), on la réécrit sur le disque d&#39;abord.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">5/6 · Chargement</div><p>On charge la page demandée dans le cadre libéré (placement).</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">6/6 · Mise à jour</div><p>On met à jour les bits de présence dans la table des pages, puis le processus reprend.</p>\n</div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p>Objectif d&#39;un algorithme de remplacement : <strong>minimiser le nombre de défauts de page</strong>. Le cours cite deux problèmes à traiter : le <strong>remplacement</strong> des pages et l&#39;<strong>allocation</strong> des cadres entre processus.</p>\n</aside><h2>Idée 2 · Les quatre algorithmes du cours</h2>\n<table>\n<thead>\n<tr>\n<th>Algorithme</th>\n<th>Victime</th>\n<th>Remarque</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>OPT</strong> (Belady, optimal)</td>\n<td>la page qui sera utilisée <strong>le plus tard dans le futur</strong> (ou jamais)</td>\n<td>impossible en vrai (on ne connaît pas le futur) ; sert de <strong>référence</strong></td>\n</tr>\n<tr>\n<td><strong>FIFO</strong></td>\n<td>la page la plus <strong>ancienne en mémoire</strong></td>\n<td>simple, ignore l&#39;usage ; beaucoup de défauts</td>\n</tr>\n<tr>\n<td><strong>LRU</strong> (<em>Least Recently Used</em>)</td>\n<td>la page <strong>utilisée il y a le plus longtemps</strong></td>\n<td>efficace mais coûteux à réaliser</td>\n</tr>\n<tr>\n<td><strong>MRU</strong> (<em>Most Recently Used</em>)</td>\n<td>la page <strong>utilisée le plus récemment</strong></td>\n<td>facile : il suffit de retenir la dernière page référencée</td>\n</tr>\n</tbody></table>\n<p>L&#39;exemple du cours : suite 7 0 1 2 0 3 0 4 2 3 0 3 2 1 2 0 1 7 0 1, avec <strong>3 cadres</strong>. Case orange = page qui vient d&#39;entrer ; F = défaut.</p>\n<figure class=\"grille\"><figcaption>OPT (Belady) : 9 défauts</figcaption><table><tr><th></th><th>7</th><th>0</th><th>1</th><th>2</th><th>0</th><th>3</th><th>0</th><th>4</th><th>2</th><th>3</th><th>0</th><th>3</th><th>2</th><th>1</th><th>2</th><th>0</th><th>1</th><th>7</th><th>0</th><th>1</th></tr><tr><th>cadre1</th><td class=\"h1\">7</td><td>7</td><td>7</td><td class=\"h1\">2</td><td>2</td><td>2</td><td>2</td><td>2</td><td>2</td><td>2</td><td>2</td><td>2</td><td>2</td><td>2</td><td>2</td><td>2</td><td>2</td><td class=\"h1\">7</td><td>7</td><td>7</td></tr><tr><th>cadre2</th><td class=\"h0\"></td><td class=\"h1\">0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td class=\"h1\">4</td><td>4</td><td>4</td><td class=\"h1\">0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr><tr><th>cadre3</th><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h1\">1</td><td>1</td><td>1</td><td class=\"h1\">3</td><td>3</td><td>3</td><td>3</td><td>3</td><td>3</td><td>3</td><td>3</td><td class=\"h1\">1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td></tr><tr><th>défaut</th><td class=\"h2\">F</td><td class=\"h2\">F</td><td class=\"h2\">F</td><td class=\"h2\">F</td><td class=\"h0\"></td><td class=\"h2\">F</td><td class=\"h0\"></td><td class=\"h2\">F</td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h2\">F</td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h2\">F</td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h2\">F</td><td class=\"h0\"></td><td class=\"h0\"></td></tr></table></figure><p>À la 4e demande (page 2), les cadres contiennent 7, 0, 1. Dans le futur, 0 revient tout de suite, 1 un peu plus tard, 7 en tout dernier : on retire <strong>7</strong>.</p>\n<figure class=\"grille\"><figcaption>FIFO : 15 défauts</figcaption><table><tr><th></th><th>7</th><th>0</th><th>1</th><th>2</th><th>0</th><th>3</th><th>0</th><th>4</th><th>2</th><th>3</th><th>0</th><th>3</th><th>2</th><th>1</th><th>2</th><th>0</th><th>1</th><th>7</th><th>0</th><th>1</th></tr><tr><th>cadre1</th><td class=\"h1\">7</td><td>7</td><td>7</td><td class=\"h1\">2</td><td>2</td><td>2</td><td>2</td><td class=\"h1\">4</td><td>4</td><td>4</td><td class=\"h1\">0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td class=\"h1\">7</td><td>7</td><td>7</td></tr><tr><th>cadre2</th><td class=\"h0\"></td><td class=\"h1\">0</td><td>0</td><td>0</td><td>0</td><td class=\"h1\">3</td><td>3</td><td>3</td><td class=\"h1\">2</td><td>2</td><td>2</td><td>2</td><td>2</td><td class=\"h1\">1</td><td>1</td><td>1</td><td>1</td><td>1</td><td class=\"h1\">0</td><td>0</td></tr><tr><th>cadre3</th><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h1\">1</td><td>1</td><td>1</td><td>1</td><td class=\"h1\">0</td><td>0</td><td>0</td><td class=\"h1\">3</td><td>3</td><td>3</td><td>3</td><td>3</td><td class=\"h1\">2</td><td>2</td><td>2</td><td>2</td><td>2</td><td class=\"h1\">1</td></tr><tr><th>défaut</th><td class=\"h2\">F</td><td class=\"h2\">F</td><td class=\"h2\">F</td><td class=\"h2\">F</td><td class=\"h0\"></td><td class=\"h2\">F</td><td class=\"h2\">F</td><td class=\"h2\">F</td><td class=\"h2\">F</td><td class=\"h2\">F</td><td class=\"h2\">F</td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h2\">F</td><td class=\"h2\">F</td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h2\">F</td><td class=\"h2\">F</td><td class=\"h2\">F</td></tr></table></figure><p>En FIFO, les cadres sont remplacés <strong>à tour de rôle</strong> (1, 2, 3, 1, 2, 3…) : c&#39;est un bon moyen de vérifier ton tableau.</p>\n<figure class=\"grille\"><figcaption>LRU : 12 défauts</figcaption><table><tr><th></th><th>7</th><th>0</th><th>1</th><th>2</th><th>0</th><th>3</th><th>0</th><th>4</th><th>2</th><th>3</th><th>0</th><th>3</th><th>2</th><th>1</th><th>2</th><th>0</th><th>1</th><th>7</th><th>0</th><th>1</th></tr><tr><th>cadre1</th><td class=\"h1\">7</td><td>7</td><td>7</td><td class=\"h1\">2</td><td>2</td><td>2</td><td>2</td><td class=\"h1\">4</td><td>4</td><td>4</td><td class=\"h1\">0</td><td>0</td><td>0</td><td class=\"h1\">1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td></tr><tr><th>cadre2</th><td class=\"h0\"></td><td class=\"h1\">0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td class=\"h1\">3</td><td>3</td><td>3</td><td>3</td><td>3</td><td>3</td><td class=\"h1\">0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr><tr><th>cadre3</th><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h1\">1</td><td>1</td><td>1</td><td class=\"h1\">3</td><td>3</td><td>3</td><td class=\"h1\">2</td><td>2</td><td>2</td><td>2</td><td>2</td><td>2</td><td>2</td><td>2</td><td>2</td><td class=\"h1\">7</td><td>7</td><td>7</td></tr><tr><th>défaut</th><td class=\"h2\">F</td><td class=\"h2\">F</td><td class=\"h2\">F</td><td class=\"h2\">F</td><td class=\"h0\"></td><td class=\"h2\">F</td><td class=\"h0\"></td><td class=\"h2\">F</td><td class=\"h2\">F</td><td class=\"h2\">F</td><td class=\"h2\">F</td><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h2\">F</td><td class=\"h0\"></td><td class=\"h2\">F</td><td class=\"h0\"></td><td class=\"h2\">F</td><td class=\"h0\"></td><td class=\"h0\"></td></tr></table></figure><p>Pour LRU, <strong>regarde en arrière</strong> : parmi les pages présentes, laquelle a été demandée il y a le plus longtemps ? Pour OPT, <strong>regarde en avant</strong>.</p>\n<figure class=\"grille\"><figcaption>MRU : 16 défauts</figcaption><table><tr><th></th><th>7</th><th>0</th><th>1</th><th>2</th><th>0</th><th>3</th><th>0</th><th>4</th><th>2</th><th>3</th><th>0</th><th>3</th><th>2</th><th>1</th><th>2</th><th>0</th><th>1</th><th>7</th><th>0</th><th>1</th></tr><tr><th>cadre1</th><td class=\"h1\">7</td><td>7</td><td>7</td><td>7</td><td>7</td><td>7</td><td>7</td><td>7</td><td>7</td><td>7</td><td>7</td><td>7</td><td>7</td><td>7</td><td>7</td><td>7</td><td>7</td><td>7</td><td class=\"h1\">0</td><td>0</td></tr><tr><th>cadre2</th><td class=\"h0\"></td><td class=\"h1\">0</td><td>0</td><td>0</td><td>0</td><td class=\"h1\">3</td><td class=\"h1\">0</td><td class=\"h1\">4</td><td>4</td><td>4</td><td>4</td><td>4</td><td>4</td><td>4</td><td>4</td><td>4</td><td>4</td><td>4</td><td>4</td><td>4</td></tr><tr><th>cadre3</th><td class=\"h0\"></td><td class=\"h0\"></td><td class=\"h1\">1</td><td class=\"h1\">2</td><td>2</td><td>2</td><td>2</td><td>2</td><td>2</td><td class=\"h1\">3</td><td class=\"h1\">0</td><td class=\"h1\">3</td><td class=\"h1\">2</td><td class=\"h1\">1</td><td class=\"h1\">2</td><td class=\"h1\">0</td><td class=\"h1\">1</td><td>1</td><td>1</td><td>1</td></tr><tr><th>défaut</th><td class=\"h2\">F</td><td class=\"h2\">F</td><td class=\"h2\">F</td><td class=\"h2\">F</td><td class=\"h0\"></td><td class=\"h2\">F</td><td class=\"h2\">F</td><td class=\"h2\">F</td><td class=\"h0\"></td><td class=\"h2\">F</td><td class=\"h2\">F</td><td class=\"h2\">F</td><td class=\"h2\">F</td><td class=\"h2\">F</td><td class=\"h2\">F</td><td class=\"h2\">F</td><td class=\"h2\">F</td><td class=\"h0\"></td><td class=\"h2\">F</td><td class=\"h0\"></td></tr></table></figure><h2>Idée 3 · Vérifier ses comptes par programme</h2>\n<pre class=\"\"><code>def remplacer(refs, n, algo):\n    cadres, defauts, dernier = [], 0, {}\n    for i, p in enumerate(refs):\n        if p not in cadres:\n            defauts += 1\n            if len(cadres) == n:                      # plus de place : une victime\n                if algo == &quot;FIFO&quot;:\n                    victime = cadres[0]               # cadres garde l'ordre d'entrée\n                elif algo == &quot;LRU&quot;:\n                    victime = min(cadres, key=lambda c: dernier[c])\n                elif algo == &quot;MRU&quot;:\n                    victime = max(cadres, key=lambda c: dernier[c])\n                else:                                 # OPT\n                    futur = refs[i + 1:]\n                    victime = max(cadres, key=lambda c: futur.index(c) if c in futur else len(refs))\n                cadres.remove(victime)\n            cadres.append(p)\n        dernier[p] = i\n    return defauts\n\nrefs = [7, 0, 1, 2, 0, 3, 0, 4, 2, 3, 0, 3, 2, 1, 2, 0, 1, 7, 0, 1]\nfor algo in (&quot;OPT&quot;, &quot;FIFO&quot;, &quot;LRU&quot;, &quot;MRU&quot;):\n    print(algo, remplacer(refs, 3, algo))</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>OPT 9\nFIFO 15\nLRU 12\nMRU 16</code></pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>La ligne « Def » du tableau LRU, telle qu&#39;on la lit dans le support PDF, semble compter 11 F. Le décompte correct pour cette suite est <strong>12</strong> défauts (le tableau des cadres du cours, lui, est juste). Recompte toujours la ligne F à partir des colonnes.</p>\n</aside><aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>Ajout ToumaiLearn, hors support : avec FIFO, <strong>ajouter des cadres peut augmenter</strong> le nombre de défauts (anomalie de Belady). Exemple classique : 1 2 3 4 1 2 5 1 2 3 4 5 donne 9 défauts avec 3 cadres et 10 avec 4. LRU et OPT n&#39;ont jamais ce défaut.</p>\n</aside><pre class=\"\"><code>r = [1, 2, 3, 4, 1, 2, 5, 1, 2, 3, 4, 5]\nprint(&quot;FIFO 3 cadres :&quot;, remplacer(r, 3, &quot;FIFO&quot;), &quot;/ 4 cadres :&quot;, remplacer(r, 4, &quot;FIFO&quot;))\nprint(&quot;LRU  3 cadres :&quot;, remplacer(r, 3, &quot;LRU&quot;), &quot;/ 4 cadres :&quot;, remplacer(r, 4, &quot;LRU&quot;))</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>FIFO 3 cadres : 9 / 4 cadres : 10\nLRU  3 cadres : 10 / 4 cadres : 8</code></pre><h2>S&#39;exercer</h2>\n<section class=\"exo\"><h3>Exercices types</h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Suite 1 2 3 1 4 1 2 5, 3 cadres, <strong>FIFO</strong>. Nombre de défauts ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button></div><div class=\"ex-h\" hidden><p>Le « 1 » redemandé en 4e position ne rajeunit pas.</p>\n</div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 7</b></p><p>1 F, 2 F, 3 F, 1 (présent), 4 F → retire 1 (le plus ancien), 1 F → retire 2, 2 F → retire 3, 5 F → retire 4. Total <strong>7</strong> défauts.</p>\n</div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Même suite en <strong>LRU</strong>.</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 6</b></p><p>1 F, 2 F, 3 F, 1, 4 F → retire 2 (le moins récemment utilisé : 1 a servi juste avant), 1 présent, 2 F → retire 3, 5 F → retire 4 (1 et 2 ont servi après). Total <strong>6</strong> défauts.</p>\n</div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Même suite en <strong>OPT</strong>.</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 5</b></p><p>1 F, 2 F, 3 F, 1, 4 F → retire 3 (jamais redemandé), 1, 2 présents, 5 F → retire n&#39;importe laquelle des pages non redemandées. Total <strong>5</strong> défauts.</p>\n</div></div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Pourquoi OPT n&#39;est-il pas utilisé dans un vrai système ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Il faut connaître les <strong>références futures</strong>, ce qui est impossible. Il sert de <strong>borne inférieure</strong> pour juger les autres algorithmes.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Un défaut de page se produit quand :</div><button class=\"opt\" data-o=\"0\">une page est modifiée</button><button class=\"opt\" data-o=\"1\">la page demandée n&#39;est pas en mémoire physique</button><button class=\"opt\" data-o=\"2\">la table des pages est pleine</button><button class=\"opt\" data-o=\"3\">le quantum est épuisé</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Quel algorithme est optimal ?</div><button class=\"opt\" data-o=\"0\">LRU</button><button class=\"opt\" data-o=\"1\">OPT (Belady)</button><button class=\"opt\" data-o=\"2\">FIFO</button><button class=\"opt\" data-o=\"3\">MRU</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Pourquoi OPT est-il irréalisable ?</div><button class=\"opt\" data-o=\"0\">Il faut connaître les références futures</button><button class=\"opt\" data-o=\"1\">Il demande trop de cadres</button><button class=\"opt\" data-o=\"2\">Il ne gère pas le bit M</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">LRU retire la page :</div><button class=\"opt\" data-o=\"0\">entrée en premier en mémoire</button><button class=\"opt\" data-o=\"1\">utilisée il y a le plus longtemps</button><button class=\"opt\" data-o=\"2\">utilisée le plus récemment</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Cadres : 4, 0, 3 (entrés dans cet ordre) ; on vient d&#39;utiliser 4. En FIFO, quelle page est retirée au prochain défaut ?</div><button class=\"opt\" data-o=\"0\">4</button><button class=\"opt\" data-o=\"1\">0</button><button class=\"opt\" data-o=\"2\">3</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Pour la suite du cours avec 3 cadres, combien de défauts en FIFO ?</div><button class=\"opt\" data-o=\"0\">9</button><button class=\"opt\" data-o=\"1\">12</button><button class=\"opt\" data-o=\"2\">15</button><button class=\"opt\" data-o=\"3\">16</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Avant de remplacer une victime dont le bit M vaut 1, le SE :</div><button class=\"opt\" data-o=\"0\">la réécrit sur le disque</button><button class=\"opt\" data-o=\"1\">la supprime sans rien faire</button><button class=\"opt\" data-o=\"2\">l&#39;envoie dans la file des prêts</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Quel algorithme ne demande que de retenir la dernière page référencée ?</div><button class=\"opt\" data-o=\"0\">LRU</button><button class=\"opt\" data-o=\"1\">MRU</button><button class=\"opt\" data-o=\"2\">OPT</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">En FIFO, les cadres sont remplacés :</div><button class=\"opt\" data-o=\"0\">à tour de rôle, dans l&#39;ordre où ils ont été remplis</button><button class=\"opt\" data-o=\"1\">selon la dernière utilisation</button><button class=\"opt\" data-o=\"2\">au hasard</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Avec 3 cadres vides au départ, les 3 premières pages différentes provoquent :</div><button class=\"opt\" data-o=\"0\">0 défaut</button><button class=\"opt\" data-o=\"1\">1 défaut</button><button class=\"opt\" data-o=\"2\">3 défauts</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"remplacement-pages","rep":null,"tol":null},{"n":"remplacement-pages","rep":["7"],"tol":null},{"n":"remplacement-pages","rep":["6"],"tol":null},{"n":"remplacement-pages","rep":["5"],"tol":null},{"n":"remplacement-pages","rep":null,"tol":null}],"qcm":[{"n":"remplacement-pages","q":"Un défaut de page se produit quand :","o":["une page est modifiée","la page demandée n&#39;est pas en mémoire physique","la table des pages est pleine","le quantum est épuisé"],"a":1,"e":"Bit de présence à 0."},{"n":"remplacement-pages","q":"Quel algorithme est optimal ?","o":["LRU","OPT (Belady)","FIFO","MRU"],"a":1,"e":"Il retire la page utilisée le plus tard dans le futur."},{"n":"remplacement-pages","q":"Pourquoi OPT est-il irréalisable ?","o":["Il faut connaître les références futures","Il demande trop de cadres","Il ne gère pas le bit M"],"a":0,"e":"On ne connaît pas l&#39;avenir ; OPT sert de référence."},{"n":"remplacement-pages","q":"LRU retire la page :","o":["entrée en premier en mémoire","utilisée il y a le plus longtemps","utilisée le plus récemment"],"a":1,"e":"Least Recently Used."},{"n":"remplacement-pages","q":"Cadres : 4, 0, 3 (entrés dans cet ordre) ; on vient d&#39;utiliser 4. En FIFO, quelle page est retirée au prochain défaut ?","o":["4","0","3"],"a":0,"e":"FIFO regarde l&#39;ordre d&#39;entrée, pas l&#39;usage."},{"n":"remplacement-pages","q":"Pour la suite du cours avec 3 cadres, combien de défauts en FIFO ?","o":["9","12","15","16"],"a":2,"e":"OPT 9, LRU 12, FIFO 15, MRU 16."},{"n":"remplacement-pages","q":"Avant de remplacer une victime dont le bit M vaut 1, le SE :","o":["la réécrit sur le disque","la supprime sans rien faire","l&#39;envoie dans la file des prêts"],"a":0,"e":"Sinon les modifications seraient perdues."},{"n":"remplacement-pages","q":"Quel algorithme ne demande que de retenir la dernière page référencée ?","o":["LRU","MRU","OPT"],"a":1,"e":"C&#39;est l&#39;argument du cours en faveur de MRU."},{"n":"remplacement-pages","q":"En FIFO, les cadres sont remplacés :","o":["à tour de rôle, dans l&#39;ordre où ils ont été remplis","selon la dernière utilisation","au hasard"],"a":0,"e":"Pratique pour vérifier un tableau FIFO."},{"n":"remplacement-pages","q":"Avec 3 cadres vides au départ, les 3 premières pages différentes provoquent :","o":["0 défaut","1 défaut","3 défauts"],"a":2,"e":"Chaque page absente provoque un défaut, même sans remplacement."}]},{"id":"fichiers-disques","t":"Fichiers et disques · SGF, i-node, FAT et ordonnancement du bras","seance":"Chapitre 4 · Systèmes de gestion de fichiers · TD4 et TD5","imp":5,"html":"<h2>Avant de commencer</h2>\n<p>Il te faut les puissances de 2 (1 Go = 2³⁰ octets, 1 Mo = 2²⁰, 1 Ko = 2¹⁰) et l&#39;arrondi <strong>au-dessus</strong> : un fichier de 1025 octets occupe 2 blocs de 1 Ko, pas 1,0009.</p>\n<section class=\"exo\"><h3>Vérifie ton prérequis</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Combien de blocs de 4 Ko dans un disque de 64 Go ? Donne une puissance de 2.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>64 Go = 2⁶ × 2³⁰ ; 4 Ko = 2² × 2¹⁰.</p>\n</div><div class=\"ex-c\" hidden><p>2³⁶ ÷ 2¹² = <strong>2²⁴ = 16 777 216</strong> blocs. Diviser des puissances de 2, c&#39;est soustraire les exposants : c&#39;est tout le calcul de la FAT.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Comment aborder ce chapitre</h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p>Les exercices de ce chapitre sont du <strong>calcul pur</strong> : écris les tailles en puissances de 2 avant de diviser. Pour le bras du disque, dessine une <strong>ligne graduée</strong> des pistes et trace le trajet de la tête : le total est la somme des segments.</p>\n</aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>Oublier les <strong>blocs d&#39;index</strong> dans le compte d&#39;un fichier i-node. Dès qu&#39;un fichier dépasse les 12 blocs directs, il faut <strong>au moins un bloc d&#39;index en plus</strong> des blocs de données.</p>\n</aside><p>À la fin, tu sais calculer une taille maximale de fichier, un nombre de blocs, la taille d&#39;une FAT, une capacité de disque CHS, et le trajet de la tête pour FIFO, SSTF, SCAN, C-SCAN, LOOK et C-LOOK.</p>\n<h2>Idée 1 · Le SGF : fichiers, attributs, opérations</h2>\n<p>Sous Unix, <strong>presque tout est fichier</strong> : les données, les périphériques (terminal, souris…) et les moyens de communication (sockets, tubes nommés). Le <strong>SGF</strong> (système de gestion de fichiers) organise les données sur le support et offre les primitives pour les manipuler.</p>\n<ul>\n<li><strong>Attributs d&#39;un fichier</strong> : nom, identifiant, type, emplacement, taille, protections (lecture, écriture, exécution), dates et utilisateur.</li>\n<li><strong>Opérations</strong> : création, écriture et lecture (à la position courante), repositionnement, suppression, vidage (taille à 0 sans toucher aux autres attributs).</li>\n<li><strong>Méthodes d&#39;accès</strong> : séquentielle, indexée séquentielle, indexée.</li>\n</ul>\n<p><strong>Sur le disque</strong> on trouve : le <strong>bloc de démarrage</strong> (<em>boot control block</em>), le <strong>bloc de contrôle de partition</strong> (nombre et taille des blocs, blocs libres) et un <strong>bloc de contrôle par fichier</strong> (FCB ; sous Unix, l&#39;<strong>i-node</strong>).</p>\n<p><strong>Les E/S.</strong> Chaque périphérique a un <strong>contrôleur</strong> (électronique) et un <strong>pilote</strong> (logiciel du SE qui traduit les requêtes en commandes pour le contrôleur et gère les erreurs).</p>\n<figure class=\"flux\"><figcaption>Architecture de contrôle des E/S</figcaption><div class=\"flux-l\"><div class=\"flux-b\">Programme utilisateur</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Partie du SE indépendante du matériel</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Pilote</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Contrôleur</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Périphérique</div></div></figure><h2>Idée 2 · Trois façons de ranger un fichier sur le disque</h2>\n<figure class=\"grille\"><figcaption>Allocation contiguë, chaînée, indexée</figcaption><table><tr><th>Méthode</th><th>Principe</th><th>Avantage</th><th>Inconvénient</th></tr><tr><td>Contiguë</td><td>blocs consécutifs ; il suffit du premier bloc et de la longueur</td><td>simple, accès direct</td><td>fragmentation externe, le fichier ne peut pas grandir</td></tr><tr><td>Chaînée</td><td>chaque bloc pointe vers le suivant ; le répertoire garde le premier et le dernier</td><td>plus de fragmentation externe</td><td>accès séquentiel seulement ; un pointeur perdu = fin du fichier perdue</td></tr><tr><td class=\"h1\">Indexée</td><td>tous les pointeurs rangés dans un bloc d'index</td><td>accès direct, pas de fragmentation externe</td><td>un bloc d'index par fichier</td></tr></table></figure><p>La <strong>FAT</strong> (<em>File Allocation Table</em>) est une allocation <strong>chaînée indexée</strong> : les pointeurs de chaînage sont retirés des blocs et rangés dans <strong>une table</strong> qui a <strong>une entrée par bloc du disque</strong>.</p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p><strong>Taille de la FAT = nombre de blocs × taille d&#39;une entrée.</strong> La taille minimale d&#39;une entrée est le nombre de bits n tel que 2ⁿ ≥ nombre de blocs.</p>\n</aside><h2>Idée 3 · L&#39;i-node d&#39;Unix</h2>\n<p>L&#39;i-node (ext3 sous Linux) contient les <strong>attributs</strong> du fichier (taille, propriétaire et groupe, droits, dates, nombre de liens) et des <strong>adresses de blocs</strong> :</p>\n<svg viewBox=\"0 0 640 250\" style=\"width:100%;max-width:640px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Structure d'un i-node : 12 pointeurs directs vers des blocs de données, un pointeur d'indirection simple vers un bloc d'index, un double vers deux niveaux d'index, un triple vers trois niveaux\">\n<g font-fa
