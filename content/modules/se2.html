><button class=\"opt\" data-o=\"1\">Z42 (1 Ko)</button><button class=\"opt\" data-o=\"2\">Z6 (5 Ko)</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">TD3 ex. 5 : adresse virtuelle 2072 avec 8 pages de 256 mots :</div><button class=\"opt\" data-o=\"0\">24</button><button class=\"opt\" data-o=\"1\">erreur : page 8 inexistante</button><button class=\"opt\" data-o=\"2\">défaut de page</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">TD1 : <code>if (fork() &gt; 0) fork();</code> crée au total :</div><button class=\"opt\" data-o=\"0\">2 processus</button><button class=\"opt\" data-o=\"1\">3 processus</button><button class=\"opt\" data-o=\"2\">4 processus</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">TD5 ex. 2 : la proposition à deux mutex :</div><button class=\"opt\" data-o=\"0\">est valide</button><button class=\"opt\" data-o=\"1\">provoque un interblocage</button><button class=\"opt\" data-o=\"2\">ne protège pas out</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">TD4 : un fichier de 532 Ko (blocs de 1 Ko, 12 directs, N = 256) utilise l&#39;indirection double ?</div><button class=\"opt\" data-o=\"0\">Oui</button><button class=\"opt\" data-o=\"1\">Non</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">TP2 : pour simuler <code>who ; ps ; ls -l</code>, le père fait :</div><button class=\"opt\" data-o=\"0\">3 fork puis 3 wait</button><button class=\"opt\" data-o=\"1\">fork, wait, fork, wait, fork, wait</button><button class=\"opt\" data-o=\"2\">un seul fork</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">TP3 : quel appel évite les zombies sans wait() ?</div><button class=\"opt\" data-o=\"0\">signal(SIGCHLD, SIG_IGN)</button><button class=\"opt\" data-o=\"1\">signal(SIGUSR1, SIG_IGN)</button><button class=\"opt\" data-o=\"2\">pause()</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"td-tp-corriges","rep":null,"tol":null},{"n":"td-tp-corriges","rep":null,"tol":null},{"n":"td-tp-corriges","rep":["14"],"tol":null}],"qcm":[{"n":"td-tp-corriges","q":"TD2 ex. 2 en SRTF, quel processus s&#39;exécute de 4 à 8 ?","o":["P2","P3","P4"],"a":1,"e":"P3 (4) a un temps restant plus petit que P2 (5)."},{"n":"td-tp-corriges","q":"TD2 ex. 2 en SJF non préemptif, qui passe à t = 9 ?","o":["P3","P4","P5"],"a":2,"e":"P5 (2) est le plus court des arrivés."},{"n":"td-tp-corriges","q":"TD2 ex. 3 en RR q = 2, quand A termine-t-il ?","o":["3","5","7"],"a":1,"e":"A 0–2 puis A 4–5."},{"n":"td-tp-corriges","q":"TD3 ex. 3.2 en best-fit, où vont les 2 Ko demandés en 2e ?","o":["Z1 (3 Ko)","Z42 (1 Ko)","Z6 (5 Ko)"],"a":0,"e":"Z42 est trop petit ; la plus petite zone ≥ 2 est Z1."},{"n":"td-tp-corriges","q":"TD3 ex. 5 : adresse virtuelle 2072 avec 8 pages de 256 mots :","o":["24","erreur : page 8 inexistante","défaut de page"],"a":1,"e":"2072 ÷ 256 = 8, or les pages vont de 0 à 7."},{"n":"td-tp-corriges","q":"TD1 : <code>if (fork() &gt; 0) fork();</code> crée au total :","o":["2 processus","3 processus","4 processus"],"a":1,"e":"Le fils ne re-forke pas."},{"n":"td-tp-corriges","q":"TD5 ex. 2 : la proposition à deux mutex :","o":["est valide","provoque un interblocage","ne protège pas out"],"a":0,"e":"Aucune attente circulaire possible."},{"n":"td-tp-corriges","q":"TD4 : un fichier de 532 Ko (blocs de 1 Ko, 12 directs, N = 256) utilise l&#39;indirection double ?","o":["Oui","Non"],"a":0,"e":"532 &gt; 12 + 256 = 268."},{"n":"td-tp-corriges","q":"TP2 : pour simuler <code>who ; ps ; ls -l</code>, le père fait :","o":["3 fork puis 3 wait","fork, wait, fork, wait, fork, wait","un seul fork"],"a":1,"e":"Le <code>;</code> impose l&#39;ordre : une commande à la fois."},{"n":"td-tp-corriges","q":"TP3 : quel appel évite les zombies sans wait() ?","o":["signal(SIGCHLD, SIG_IGN)","signal(SIGUSR1, SIG_IGN)","pause()"],"a":0,"e":"Le système nettoie alors les fils automatiquement."}]},{"id":"revision-examen-blanc","t":"Révision et examen blanc","seance":"Annales 2025 (normale et rattrapage)","imp":5,"html":"<h2>Ce que tombe à l&#39;examen</h2>\n<p>Les deux sujets de 2025 (1 h 30, documents interdits) ont la même structure : <strong>4 exercices de calcul</strong>, presque pas de cours.</p>\n<figure class=\"grille\"><figcaption>Annales 2025 : ce qui a été demandé</figcaption><table><tr><th>Thème</th><th>Normale (juillet 2025)</th><th>Rattrapage</th><th>Points</th></tr><tr><td>Processus</td><td>compter les processus d'une boucle avec fork</td><td>—</td><td>2</td></tr><tr><td>Ordonnancement</td><td class=\"h1\">Gantt SRTF + tableau rotation/attente/rendement</td><td class=\"h1\">Gantt RR q=2 + tableau</td><td>6 à 8</td></tr><tr><td>Mémoire</td><td>page/déplacement (2 Ko, 8 Ko), adresses segmentées</td><td>first-fit / next-fit, adresses segmentées</td><td>3 à 5</td></tr><tr><td>Fichiers et disque</td><td>FIFO du bras, nombre de blocs, bits d'adresse, FAT</td><td>i-node : taille max, blocs d'un fichier</td><td>4 à 5</td></tr><tr><td>Synchronisation</td><td>—</td><td>lecteurs/rédacteurs (problème + correction)</td><td>3</td></tr></table></figure><aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend</div><p>Les calculs de Gantt pèsent le plus lourd. Entraîne-toi à faire un Gantt complet + tableau en <strong>15 minutes</strong>.</p>\n</aside><aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>Dans le sujet de la session normale, le programme de l&#39;exercice 1 est <code>int cpt=6; while (cpt &lt; 10) { if (fork() &gt; 0) cpt--; else cpt=3; }</code>. Tel qu&#39;il est écrit, le père fait <code>cpt--</code> (il reste toujours sous 10) et chaque fils met <code>cpt = 3</code> (aussi sous 10) : <strong>tous bouclent et forkent sans fin</strong>, le nombre de processus est illimité (bombe fork). Le sujet attendait sans doute <code>cpt++</code> dans le père et une sortie de boucle dans le fils (par ex. <code>cpt = 10</code>) : le père forkerait alors 4 fois (cpt = 6, 7, 8, 9), soit <strong>5 processus</strong>. À l&#39;examen, écris les deux lectures. De même, la file du disque contient <strong>920</strong> alors que le disque n&#39;a que 800 cylindres (0 à 799) : requête invalide à signaler.</p>\n</aside><h2>Méthodes express</h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Les 5 réflexes de l'examen</figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Gantt</div><p>Frise graduée, file des prêts réécrite à chaque événement, date de fin sous chaque processus.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · Temps</div><p>Rotation = fin − arrivée ; attente = rotation − exécution ; rendement = exécution ÷ rotation ; moyennes sur n.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · Adresses</div><p>page = adresse ÷ taille, déplacement = reste ; segment valide si déplacement &lt; limite.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · Disque</div><p>blocs = taille disque ÷ taille bloc en puissances de 2 ; bits = exposant ; FAT = blocs × taille d&#39;entrée.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · Sémaphores</div><p>un mutex à 1 par donnée partagée, un sémaphore à 0 par « attendre que ».</p>\n</div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><h2>Examen blanc (1 h 30, sur 20)</h2>\n<p>Fais-le sans regarder le corrigé, puis note-toi.</p>\n<p><strong>Exercice 1 (3 pts).</strong> a) Combien de processus au total crée <code>int main(){ int i; for (i = 0; i &lt; 3; i++) if (fork() == 0) break; }</code> ? b) Qu&#39;est-ce qu&#39;un processus zombie et comment l&#39;éviter ?</p>\n<p><strong>Exercice 2 (7 pts).</strong> Cinq processus arrivés à t = 0 dans l&#39;ordre P1 (2), P2 (1), P3 (8), P4 (4), P5 (5) (rattrapage 2025). a) Gantt <strong>Round-Robin, q = 2</strong>. b) Temps de rotation et d&#39;attente de chaque processus, TMR, TMA. c) Rendement moyen.</p>\n<p><strong>Exercice 3 (5 pts).</strong> a) Mémoire en zones Z1 = 4, Z2 = 12, Z3 = 9, Z4 = 6, Z5 = 5, Z6 = 8 Ko ; requêtes 11, 2, 5, 7 Ko. Zones choisies en first-fit et next-fit (une zone trop grande est découpée, le reste restant libre). b) Adresse 15360 : page et déplacement pour des pages de 2 Ko et 8 Ko.</p>\n<p><strong>Exercice 4 (5 pts).</strong> a) Disque de 128 Go, blocs de 8 Ko : nombre de blocs, bits pour adresser un bloc, nombre de blocs occupés par la FAT. b) i-node à 12 directs + simple + double + triple, blocs de 1 Ko, pointeurs de 4 octets : nombre total de blocs pour un fichier de 77 824 octets. c) Tête en 250, 800 cylindres, file 180, 45, 670, 300, 150, 580 : total parcouru en FIFO.</p>\n<h2>Corrigé</h2>\n<pre class=\"\"><code>def rr(procs, q):\n    file = [p for p, _ in procs]\n    reste = dict(procs)\n    t, fin, gantt = 0, {}, []\n    while file:\n        p = file.pop(0)\n        d = min(q, reste[p])\n        gantt.append(f&quot;{p}[{t}-{t + d}]&quot;)\n        t += d\n        reste[p] -= d\n        if reste[p]:\n            file.append(p)\n        else:\n            fin[p] = t\n    print(&quot; &quot;.join(gantt))\n    rot = {p: fin[p] for p, _ in procs}                  # arrivée = 0\n    att = {p: rot[p] - d for p, d in procs}\n    for p, d in procs:\n        print(f&quot;{p} : rotation {rot[p]}, attente {att[p]}, rendement {d}/{rot[p]}&quot;)\n    n = len(procs)\n    print(f&quot;TMR = {sum(rot.values()) / n:g} ; TMA = {sum(att.values()) / n:g}&quot;)\n    print(f&quot;rendement moyen = {sum(d / rot[p] for p, d in procs) / n:.3f}&quot;)\n\nrr([(&quot;P1&quot;, 2), (&quot;P2&quot;, 1), (&quot;P3&quot;, 8), (&quot;P4&quot;, 4), (&quot;P5&quot;, 5)], 2)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>P1[0-2] P2[2-3] P3[3-5] P4[5-7] P5[7-9] P3[9-11] P4[11-13] P5[13-15] P3[15-17] P5[17-18] P3[18-20]\nP1 : rotation 2, attente 0, rendement 2/2\nP2 : rotation 3, attente 2, rendement 1/3\nP3 : rotation 20, attente 12, rendement 8/20\nP4 : rotation 13, attente 9, rendement 4/13\nP5 : rotation 18, attente 13, rendement 5/18\nTMR = 11.2 ; TMA = 7.2\nrendement moyen = 0.464</code></pre><section class=\"exo\"><h3>Corrigé détaillé</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Ex. 1 a) <code>for (i = 0; i &lt; 3; i++) if (fork() == 0) break;</code> : combien de processus au total ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 4</b></p><p>Chaque fils sort de la boucle (<code>break</code>) ; seul le père forke, 3 fois : <strong>4 processus</strong> (un arbre). b) Zombie : fils terminé dont le père n&#39;a pas fait <code>wait()</code> ; on l&#39;évite avec <code>wait()</code>/<code>waitpid()</code> ou <code>signal(SIGCHLD, SIG_IGN)</code>.</p>\n</div></div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Ex. 2 : TMA du Round-Robin ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 7.2</b></p><p>Voir le programme ci-dessus : TMR = 56/5 = <strong>11,2</strong>, TMA = 36/5 = <strong>7,2</strong>, rendement moyen ≈ 0,464. Le débit vaut 5/20 = 0,25.</p>\n</div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Ex. 3 a) first-fit et next-fit pour 11, 2, 5, 7 Ko.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p><strong>First-fit</strong> : 11 → Z2 (reste 1), 2 → Z1 (reste 2), 5 → Z3 (reste 4), 7 → Z6 (reste 1).\n  <strong>Next-fit</strong> : 11 → Z2 (reste 1), 2 → Z3 (on repart de Z2, son reste de 1 Ko est trop petit ; Z3 garde 7), 5 → Z3 (reste 2), 7 → Z6.\n  b) 2 Ko : page <strong>7</strong>, dép 1024 ; 8 Ko : page <strong>1</strong>, dép 7168.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Ex. 4 a) 128 Go, blocs de 8 Ko : nombre de blocs FAT ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 6144</b></p><p>2³⁷ ÷ 2¹³ = <strong>2²⁴ blocs</strong>, donc <strong>24 bits</strong> (3 octets). FAT = 2²⁴ × 3 = 48 Mo = 48 Mo ÷ 8 Ko = <strong>6144 blocs</strong>.</p>\n</div></div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Ex. 4 b) blocs pour 77 824 octets ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 77</b></p><p>77 824 ÷ 1024 = <strong>76 blocs de données</strong> (12 directs + 64 par l&#39;indirection simple) + <strong>1 bloc d&#39;index</strong> = <strong>77</strong>. (Taille max du système : (12 + 256 + 256² + 256³) Ko ≈ 16,06 Go.)</p>\n</div></div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>Ex. 4 c) FIFO depuis 250 : 180, 45, 670, 300, 150, 580.</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1780</b></p><p>70 + 135 + 625 + 370 + 150 + 430 = <strong>1780</strong> cylindres. (Avec la requête 920 du sujet, invalide sur 800 cylindres, on obtiendrait 3260.)</p>\n</div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 7 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">En RR q = 2 (P1 2, P2 1, P3 8, P4 4, P5 5, tous à 0), qui termine en dernier ?</div><button class=\"opt\" data-o=\"0\">P5</button><button class=\"opt\" data-o=\"1\">P3</button><button class=\"opt\" data-o=\"2\">P4</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Rotation de P4 dans ce même RR :</div><button class=\"opt\" data-o=\"0\">11</button><button class=\"opt\" data-o=\"1\">13</button><button class=\"opt\" data-o=\"2\">9</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">128 Go avec des blocs de 8 Ko donnent :</div><button class=\"opt\" data-o=\"0\">2²⁰ blocs</button><button class=\"opt\" data-o=\"1\">2²⁴ blocs</button><button class=\"opt\" data-o=\"2\">2²⁷ blocs</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Partition de 32 Go, blocs de 16 Ko, adresses sur 24 bits. Taille minimale de la FAT ?</div><button class=\"opt\" data-o=\"0\">6 Mo</button><button class=\"opt\" data-o=\"1\">5,25 Mo</button><button class=\"opt\" data-o=\"2\">8 Mo</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Segment base 560, limite 215 : (0:210) donne :</div><button class=\"opt\" data-o=\"0\">770</button><button class=\"opt\" data-o=\"1\">erreur</button><button class=\"opt\" data-o=\"2\">350</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Pages de 2 Ko, adresse 15360 :</div><button class=\"opt\" data-o=\"0\">page 1, dép 7168</button><button class=\"opt\" data-o=\"1\">page 7, dép 1024</button><button class=\"opt\" data-o=\"2\">page 7, dép 1536</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Dans la solution lecteurs/rédacteurs du rattrapage, le défaut est :</div><button class=\"opt\" data-o=\"0\">un interblocage entre lecteurs</button><button class=\"opt\" data-o=\"1\">rien n&#39;empêche un rédacteur d&#39;écrire pendant une lecture</button><button class=\"opt\" data-o=\"2\">nb_lecteurs n&#39;est pas protégé</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">First-fit, zones 4, 12, 9, 6, 5, 8 Ko : où vont les 11 Ko ?</div><button class=\"opt\" data-o=\"0\">Z2</button><button class=\"opt\" data-o=\"1\">Z3</button><button class=\"opt\" data-o=\"2\">Z6</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Une boucle <code>while</code> où le père fait <code>cpt--</code> sous la condition <code>cpt &lt; 10</code> sans jamais l&#39;atteindre :</div><button class=\"opt\" data-o=\"0\">crée 4 processus</button><button class=\"opt\" data-o=\"1\">ne s&#39;arrête pas (création infinie)</button><button class=\"opt\" data-o=\"2\">ne crée aucun processus</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">FIFO du bras de 250 vers 180 puis 45 : distance parcourue sur ces deux requêtes :</div><button class=\"opt\" data-o=\"0\">135</button><button class=\"opt\" data-o=\"1\">205</button><button class=\"opt\" data-o=\"2\">115</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"revision-examen-blanc","rep":["4"],"tol":null},{"n":"revision-examen-blanc","rep":["7.2"],"tol":0.01},{"n":"revision-examen-blanc","rep":null,"tol":null},{"n":"revision-examen-blanc","rep":["6144"],"tol":null},{"n":"revision-examen-blanc","rep":["77"],"tol":null},{"n":"revision-examen-blanc","rep":["1780"],"tol":null}],"qcm":[{"n":"revision-examen-blanc","q":"En RR q = 2 (P1 2, P2 1, P3 8, P4 4, P5 5, tous à 0), qui termine en dernier ?","o":["P5","P3","P4"],"a":1,"e":"P3 finit à 20, P5 à 18."},{"n":"revision-examen-blanc","q":"Rotation de P4 dans ce même RR :","o":["11","13","9"],"a":1,"e":"P4 [5–7] puis [11–13]."},{"n":"revision-examen-blanc","q":"128 Go avec des blocs de 8 Ko donnent :","o":["2²⁰ blocs","2²⁴ blocs","2²⁷ blocs"],"a":1,"e":"37 − 13 = 24."},{"n":"revision-examen-blanc","q":"Partition de 32 Go, blocs de 16 Ko, adresses sur 24 bits. Taille minimale de la FAT ?","o":["6 Mo","5,25 Mo","8 Mo"],"a":1,"e":"2²¹ blocs × 21 bits = 2²¹ × 21 ÷ 8 octets = 5,25 Mo (6 Mo avec des entrées de 3 octets)."},{"n":"revision-examen-blanc","q":"Segment base 560, limite 215 : (0:210) donne :","o":["770","erreur","350"],"a":0,"e":"210 &lt; 215, donc 560 + 210."},{"n":"revision-examen-blanc","q":"Pages de 2 Ko, adresse 15360 :","o":["page 1, dép 7168","page 7, dép 1024","page 7, dép 1536"],"a":1,"e":"7 × 2048 = 14336 ; reste 1024."},{"n":"revision-examen-blanc","q":"Dans la solution lecteurs/rédacteurs du rattrapage, le défaut est :","o":["un interblocage entre lecteurs","rien n&#39;empêche un rédacteur d&#39;écrire pendant une lecture","nb_lecteurs n&#39;est pas protégé"],"a":1,"e":"Mutex protège le compteur, pas la ressource."},{"n":"revision-examen-blanc","q":"First-fit, zones 4, 12, 9, 6, 5, 8 Ko : où vont les 11 Ko ?","o":["Z2","Z3","Z6"],"a":0,"e":"Seule Z2 (12) est assez grande."},{"n":"revision-examen-blanc","q":"Une boucle <code>while</code> où le père fait <code>cpt--</code> sous la condition <code>cpt &lt; 10</code> sans jamais l&#39;atteindre :","o":["crée 4 processus","ne s&#39;arrête pas (création infinie)","ne crée aucun processus"],"a":1,"e":"C&#39;est le cas du sujet 2025 tel qu&#39;il est imprimé."},{"n":"revision-examen-blanc","q":"FIFO du bras de 250 vers 180 puis 45 : distance parcourue sur ces deux requêtes :","o":["135","205","115"],"a":1,"e":"70 + 135."}]}];
const NOTIONS=[{"id":"processus-notions","t":"Processus (1) · du programme au processus, états et PCB","imp":4,"ch":"processus-notions"},{"id":"fork-wait-exit","t":"Processus (2) · fork, exit, wait, zombies et orphelins","imp":5,"ch":"fork-wait-exit"},{"id":"ordo-fcfs-sjf","t":"Ordonnancement (1) · critères, diagramme de Gantt, FCFS et SJF","imp":5,"ch":"ordo-fcfs-sjf"},{"id":"ordo-preemptif","t":"Ordonnancement (2) · SRTF, SJF préemptif, Round-Robin et priorités","imp":5,"ch":"ordo-preemptif"},{"id":"memoire-allocation-pagination","t":"Mémoire (1) · allocation, pagination et segmentation","imp":5,"ch":"memoire-allocation-pagination"},{"id":"remplacement-pages","t":"Mémoire (2) · défauts de page et algorithmes de remplacement","imp":4,"ch":"remplacement-pages"},{"id":"fichiers-disques","t":"Fichiers et disques · SGF, i-node, FAT et ordonnancement du bras","imp":5,"ch":"fichiers-disques"},{"id":"synchronisation-semaphores","t":"Synchronisation · section critique, sémaphores et problèmes classiques","imp":5,"ch":"synchronisation-semaphores"},{"id":"ipc-tubes-signaux","t":"Communication · tubes anonymes, tubes nommés (FIFO), signaux","imp":4,"ch":"ipc-tubes-signaux"},{"id":"td-tp-corriges","t":"TD 1 à 5 et TP 1 à 3 corrigés","imp":4,"ch":"td-tp-corriges"},{"id":"revision-examen-blanc","t":"Révision et examen blanc","imp":5,"ch":"revision-examen-blanc"}];
const CARTES=[{"n":"processus-notions","k":0,"ch":"processus-notions","q":"<p>Différence programme / processus</p>\n","r":"<p>Programme = fichier exécutable statique sur disque. Processus = programme en cours d&#39;exécution, avec ses ressources (entité dynamique).</p>\n"},{"n":"processus-notions","k":1,"ch":"processus-notions","q":"<p>Les 4 étapes du programme au processus</p>\n","r":"<p>Éditeur (source .c) → compilateur (objet .o) → éditeur de liens (exécutable) → chargeur (processus en mémoire).</p>\n"},{"n":"processus-notions","k":2,"ch":"processus-notions","q":"<p>Les 5 états d&#39;un processus</p>\n","r":"<p>Nouveau, Prêt, Élu, Bloqué, Terminé.</p>\n"},{"n":"processus-notions","k":3,"ch":"processus-notions","q":"<p>Prêt vs Bloqué</p>\n","r":"<p>Prêt : attend seulement le processeur. Bloqué : attend un événement (E/S…), le processeur ne lui servirait à rien.</p>\n"},{"n":"processus-notions","k":4,"ch":"processus-notions","q":"<p>Élu → Prêt arrive quand…</p>\n","r":"<p>Une interruption indépendante du processus, typiquement la fin de son quantum.</p>\n"},{"n":"processus-notions","k":5,"ch":"processus-notions","q":"<p>Que contient un PCB ?</p>\n","r":"<p>État, PID, compteur d&#39;instructions, registres CPU, infos d&#39;ordonnancement (priorité), infos mémoire (base/limite, table des pages), état des E/S (fichiers ouverts).</p>\n"},{"n":"processus-notions","k":6,"ch":"processus-notions","q":"<p>Commutation de contexte</p>\n","r":"<p>Sauvegarder le PCB du processus qui quitte le CPU, recharger celui du processus suivant.</p>\n"},{"n":"processus-notions","k":7,"ch":"processus-notions","q":"<p>Paramètres reçus à la création</p>\n","r":"<p>PID, PPID (père), UID (utilisateur), GID (groupe).</p>\n"},{"n":"processus-notions","k":8,"ch":"processus-notions","q":"<p>Vrai et faux parallélisme</p>\n","r":"<p>Vrai : plusieurs CPU. Faux (pseudo-parallélisme) : un seul CPU partagé dans le temps.</p>\n"},{"n":"fork-wait-exit","k":9,"ch":"fork-wait-exit","q":"<p>Valeurs de retour de fork()</p>\n","r":"<p>Dans le père : PID du fils (&gt; 0). Dans le fils : 0. Échec : −1.</p>\n"},{"n":"fork-wait-exit","k":10,"ch":"fork-wait-exit","q":"<p>Où démarre le fils après fork() ?</p>\n","r":"<p>Juste après l&#39;appel fork(), avec une copie des variables du père.</p>\n"},{"n":"fork-wait-exit","k":11,"ch":"fork-wait-exit","q":"<p>Que partagent père et fils ?</p>\n","r":"<p>Le code (non dupliqué), les fichiers ouverts, l&#39;environnement. Les données sont dupliquées.</p>\n"},{"n":"fork-wait-exit","k":12,"ch":"fork-wait-exit","q":"<p>k fork() à la suite donnent…</p>\n","r":"<p>2^k processus au total (programme initial compris).</p>\n"},{"n":"fork-wait-exit","k":13,"ch":"fork-wait-exit","q":"<p>Que rend wait(&amp;status) ?</p>\n","r":"<p>Le PID du fils terminé (−1 s&#39;il n&#39;y a plus de fils) ; le code est lu avec WEXITSTATUS(status).</p>\n"},{"n":"fork-wait-exit","k":14,"ch":"fork-wait-exit","q":"<p>Processus zombie</p>\n","r":"<p>Fils terminé dont le père n&#39;a pas encore fait wait() : il reste dans la table des processus (état Z, <defunct>).</p>\n"},{"n":"fork-wait-exit","k":15,"ch":"fork-wait-exit","q":"<p>Processus orphelin</p>\n","r":"<p>Fils dont le père est mort : il est adopté par init (PID 1).</p>\n"},{"n":"fork-wait-exit","k":16,"ch":"fork-wait-exit","q":"<p>Signal envoyé au père quand un fils meurt</p>\n","r":"<p>SIGCHLD.</p>\n"},{"n":"fork-wait-exit","k":17,"ch":"fork-wait-exit","q":"<p>Chaîne vs arbre de processus</p>\n","r":"<p>Chaîne : le père fait exit() dans la boucle. Arbre : le fils fait exit() dans la boucle.</p>\n"},{"n":"fork-wait-exit","k":18,"ch":"fork-wait-exit","q":"<p>execlp vs execvp</p>\n","r":"<p>execlp : arguments en liste terminée par NULL. execvp : arguments dans un tableau. Les deux remplacent le programme du processus.</p>\n"},{"n":"ordo-fcfs-sjf","k":19,"ch":"ordo-fcfs-sjf","q":"<p>Ordonnanceur vs dispatcheur</p>\n","r":"<p>L&#39;ordonnanceur choisit le processus ; le dispatcheur lui donne le CPU (commutation de contexte, passage en mode utilisateur, branchement).</p>\n"},{"n":"ordo-fcfs-sjf","k":20,"ch":"ordo-fcfs-sjf","q":"<p>Temps de rotation</p>\n","r":"<p>Fin − Arrivée.</p>\n"},{"n":"ordo-fcfs-sjf","k":21,"ch":"ordo-fcfs-sjf","q":"<p>Temps d&#39;attente</p>\n","r":"<p>Rotation − Exécution (= temps total passé dans la file des prêts).</p>\n"},{"n":"ordo-fcfs-sjf","k":22,"ch":"ordo-fcfs-sjf","q":"<p>Temps de réponse</p>\n","r":"<p>De la création au premier passage sur le CPU.</p>\n"},{"n":"ordo-fcfs-sjf","k":23,"ch":"ordo-fcfs-sjf","q":"<p>Rendement d&#39;un processus (tableaux d&#39;examen)</p>\n","r":"<p>Exécution ÷ Rotation.</p>\n"},{"n":"ordo-fcfs-sjf","k":24,"ch":"ordo-fcfs-sjf","q":"<p>Débit (throughput)</p>\n","r":"<p>Nombre de processus terminés par unité de temps.</p>\n"},{"n":"ordo-fcfs-sjf","k":25,"ch":"ordo-fcfs-sjf","q":"<p>FCFS</p>\n","r":"<p>Premier arrivé, premier servi ; non préemptif.</p>\n"},{"n":"ordo-fcfs-sjf","k":26,"ch":"ordo-fcfs-sjf","q":"<p>SJF</p>\n","r":"<p>Le plus court temps d&#39;exécution d&#39;abord (FCFS en cas d&#39;égalité) ; optimal pour l&#39;attente moyenne.</p>\n"},{"n":"ordo-fcfs-sjf","k":27,"ch":"ordo-fcfs-sjf","q":"<p>Préemptif vs non préemptif</p>\n","r":"<p>Préemptif : le SE peut retirer le CPU. Non préemptif : le processus le garde jusqu&#39;à blocage ou fin.</p>\n"},{"n":"ordo-fcfs-sjf","k":28,"ch":"ordo-fcfs-sjf","q":"<p>Ordonnanceur à long terme</p>\n","r":"<p>Contrôle nouveau → prêt : quels processus du disque charger en mémoire.</p>\n"},{"n":"ordo-preemptif","k":29,"ch":"ordo-preemptif","q":"<p>SRTF</p>\n","r":"<p>Préemptif : à chaque arrivée, le processus au plus petit temps RESTANT prend le CPU.</p>\n"},{"n":"ordo-preemptif","k":30,"ch":"ordo-preemptif","q":"<p>SJF préemptif dans le cours du Pr Ouchitachen</p>\n","r":"<p>Compare les durées TOTALES (exemple du cours : TMA 9,8 ; avec SRTF on obtiendrait 9).</p>\n"},{"n":"ordo-preemptif","k":31,"ch":"ordo-preemptif","q":"<p>Round-Robin</p>\n","r":"<p>FCFS + quantum : après q unités, le processus retourne en queue de file.</p>\n"},{"n":"ordo-preemptif","k":32,"ch":"ordo-preemptif","q":"<p>Arrivée et préemption au même instant en RR</p>\n","r":"<p>Le nouveau venu entre dans la file avant le processus préempté.</p>\n"},{"n":"ordo-preemptif","k":33,"ch":"ordo-preemptif","q":"<p>Quantum très grand en RR</p>\n","r":"<p>RR devient FCFS.</p>\n"},{"n":"ordo-preemptif","k":34,"ch":"ordo-preemptif","q":"<p>Quantum très petit en RR</p>\n","r":"<p>Trop de commutations de contexte : temps perdu.</p>\n"},{"n":"ordo-preemptif","k":35,"ch":"ordo-preemptif","q":"<p>Temps de réponse maximal en RR</p>\n","r":"<p>(n − 1) × q pour n processus.</p>\n"},{"n":"ordo-preemptif","k":36,"ch":"ordo-preemptif","q":"<p>Famine</p>\n","r":"<p>Un processus attend indéfiniment (longs processus en SRTF, faible priorité).</p>\n"},{"n":"ordo-preemptif","k":37,"ch":"ordo-preemptif","q":"<p>Vieillissement (aging)</p>\n","r":"<p>Augmenter la priorité d&#39;un processus avec son temps d&#39;attente, contre la famine.</p>\n"},{"n":"ordo-preemptif","k":38,"ch":"ordo-preemptif","q":"<p>Algorithmes préemptifs du cours</p>\n","r":"<p>SRTF, RR ; SJF et priorités existent dans les deux versions ; FCFS jamais.</p>\n"},{"n":"memoire-allocation-pagination","k":39,"ch":"memoire-allocation-pagination","q":"<p>Rôle de la MMU</p>\n","r":"<p>Circuit matériel qui traduit les adresses logiques (virtuelles) en adresses physiques.</p>\n"},{"n":"memoire-allocation-pagination","k":40,"ch":"memoire-allocation-pagination","q":"<p>Registres base et limite</p>\n","r":"<p>Adresse valide si &lt; limite ; adresse physique = base + adresse logique.</p>\n"},{"n":"memoire-allocation-pagination","k":41,"ch":"memoire-allocation-pagination","q":"<p>First-fit</p>\n","r":"<p>Première zone libre assez grande, depuis le début.</p>\n"},{"n":"memoire-allocation-pagination","k":42,"ch":"memoire-allocation-pagination","q":"<p>Next-fit</p>\n","r":"<p>Comme first-fit, mais on repart de la dernière zone utilisée.</p>\n"},{"n":"memoire-allocation-pagination","k":43,"ch":"memoire-allocation-pagination","q":"<p>Best-fit</p>\n","r":"<p>Plus petite zone assez grande.</p>\n"},{"n":"memoire-allocation-pagination","k":44,"ch":"memoire-allocation-pagination","q":"<p>Worst-fit</p>\n","r":"<p>Plus grande zone libre.</p>\n"},{"n":"memoire-allocation-pagination","k":45,"ch":"memoire-allocation-pagination","q":"<p>Page et déplacement</p>\n","r":"<p>page = adresse ÷ taille (entier) ; déplacement = adresse mod taille.</p>\n"},{"n":"memoire-allocation-pagination","k":46,"ch":"memoire-allocation-pagination","q":"<p>Adresse physique en pagination</p>\n","r":"<p>cadre × taille de page + déplacement.</p>\n"},{"n":"memoire-allocation-pagination","k":47,"ch":"memoire-allocation-pagination","q":"<p>Champs d&#39;une table des pages</p>\n","r":"<p>Numéro de cadre, bit de présence, bit de modification (M), bit de référence (R), protection.</p>\n"},{"n":"memoire-allocation-pagination","k":48,"ch":"memoire-allocation-pagination","q":"<p>Adresse segmentée valide</p>\n","r":"<p>(s:d) valide si d &lt; limite ; physique = base + d.</p>\n"},{"n":"memoire-allocation-pagination","k":49,"ch":"memoire-allocation-pagination","q":"<p>Fragmentation interne vs externe</p>\n","r":"<p>Interne : place perdue DANS une zone allouée (pagination). Externe : trous ENTRE les zones (segmentation).</p>\n"},{"n":"remplacement-pages","k":50,"ch":"remplacement-pages","q":"<p>Défaut de page</p>\n","r":"<p>Accès à une page dont le bit de présence vaut 0 : le SE doit la charger depuis le disque.</p>\n"},{"n":"remplacement-pages","k":51,"ch":"remplacement-pages","q":"<p>Rôle du bit M lors d&#39;un remplacement</p>\n","r":"<p>Si la victime a été modifiée, il faut la réécrire sur le disque avant de la remplacer.</p>\n"},{"n":"remplacement-pages","k":52,"ch":"remplacement-pages","q":"<p>OPT (Belady)</p>\n","r":"<p>Remplace la page utilisée le plus tard dans le futur. Optimal mais irréalisable : sert de référence.</p>\n"},{"n":"remplacement-pages","k":53,"ch":"remplacement-pages","q":"<p>FIFO (remplacement)</p>\n","r":"<p>Remplace la page entrée en mémoire le plus tôt, sans tenir compte de son usage.</p>\n"},{"n":"remplacement-pages","k":54,"ch":"remplacement-pages","q":"<p>LRU</p>\n","r":"<p>Remplace la page utilisée il y a le plus longtemps. Efficace mais coûteux.</p>\n"},{"n":"remplacement-pages","k":55,"ch":"remplacement-pages","q":"<p>MRU</p>\n","r":"<p>Remplace la page utilisée le plus récemment. Facile : on retient la dernière page référencée.</p>\n"},{"n":"remplacement-pages","k":56,"ch":"remplacement-pages","q":"<p>Défauts pour 7 0 1 2 0 3 0 4 2 3 0 3 2 1 2 0 1 7 0 1 avec 3 cadres</p>\n","r":"<p>OPT 9, LRU 12, FIFO 15, MRU 16.</p>\n"},{"n":"remplacement-pages","k":57,"ch":"remplacement-pages","q":"<p>Objectif d&#39;un algorithme de remplacement</p>\n","r":"<p>Minimiser le nombre de défauts de page.</p>\n"},{"n":"fichiers-disques","k":58,"ch":"fichiers-disques","q":"<p>Les 3 blocs de contrôle sur le disque</p>\n","r":"<p>Bloc de démarrage, bloc de contrôle de partition, bloc de contrôle de fichier (FCB = i-node sous Unix).</p>\n"},{"n":"fichiers-disques","k":59,"ch":"fichiers-disques","q":"<p>Allocation contiguë</p>\n","r":"<p>Blocs consécutifs : simple et accès direct, mais fragmentation externe et fichier qui ne peut pas grandir.</p>\n"},{"n":"fichiers-disques","k":60,"ch":"fichiers-disques","q":"<p>Allocation chaînée</p>\n","r":"<p>Chaque bloc pointe vers le suivant : pas de fragmentation externe, mais accès séquentiel et fragile.</p>\n"},{"n":"fichiers-disques","k":61,"ch":"fichiers-disques","q":"<p>Allocation indexée</p>\n","r":"<p>Tous les pointeurs dans un bloc d&#39;index : accès direct.</p>\n"},{"n":"fichiers-disques","k":62,"ch":"fichiers-disques","q":"<p>Taille de la FAT</p>\n","r":"<p>Nombre de blocs du disque × taille d&#39;une entrée.</p>\n"},{"n":"fichiers-disques","k":63,"ch":"fichiers-disques","q":"<p>Pointeurs d&#39;un i-node classique</p>\n","r":"<p>12 directs, 1 indirect simple, 1 double, 1 triple.</p>\n"},{"n":"fichiers-disques","k":64,"ch":"fichiers-disques","q":"<p>Taille max d&#39;un fichier i-node</p>\n","r":"<p>(12 + N + N² + N³) × taille de bloc, avec N = taille de bloc ÷ taille d&#39;un pointeur.</p>\n"},{"n":"fichiers-disques","k":65,"ch":"fichiers-disques","q":"<p>Capacité CHS</p>\n","r":"<p>Cylindres × têtes × secteurs par piste × octets par secteur.</p>\n"},{"n":"fichiers-disques","k":66,"ch":"fichiers-disques","q":"<p>Temps d&#39;accès disque</p>\n","r":"<p>Positionnement (seek) + latence rotationnelle + transfert.</p>\n"},{"n":"fichiers-disques","k":67,"ch":"fichiers-disques","q":"<p>SSTF</p>\n","r":"<p>Sert la requête la plus proche de la tête ; favorise le centre, risque de famine.</p>\n"},{"n":"fichiers-disques","k":68,"ch":"fichiers-disques","q":"<p>SCAN vs LOOK</p>\n","r":"<p>SCAN va jusqu&#39;au bout du disque avant de repartir ; LOOK fait demi-tour à la dernière requête.</p>\n"},{"n":"fichiers-disques","k":69,"ch":"fichiers-disques","q":"<p>C-SCAN</p>\n","r":"<p>Sert dans un seul sens ; au bout, retour au début sans servir.</p>\n"},{"n":"synchronisation-semaphores","k":70,"ch":"synchronisation-semaphores","q":"<p>Section critique</p>\n","r":"<p>Portion de code qui manipule une ressource critique (utilisable par un seul processus à la fois).</p>\n"},{"n":"synchronisation-semaphores","k":71,"ch":"synchronisation-semaphores","q":"<p>Exclusion mutuelle</p>\n","r":"<p>Un seul processus à la fois dans sa section critique.</p>\n"},{"n":"synchronisation-semaphores","k":72,"ch":"synchronisation-semaphores","q":"<p>Interblocage vs famine</p>\n","r":"<p>Interblocage : attente circulaire, infinie. Famine : un processus est toujours doublé, attente indéfinie.</p>\n"},{"n":"synchronisation-semaphores","k":73,"ch":"synchronisation-semaphores","q":"<p>Opération P(S)</p>\n","r":"<p>Si compteur &gt; 0 : compteur − 1. Sinon le processus se bloque dans la file de S.</p>\n"},{"n":"synchronisation-semaphores","k":74,"ch":"synchronisation-semaphores","q":"<p>Opération V(S)</p>\n","r":"<p>Si un processus attend : le réveiller. Sinon compteur + 1. Ne bloque jamais.</p>\n"},{"n":"synchronisation-semaphores","k":75,"ch":"synchronisation-semaphores","q":"<p>Mutex</p>\n","r":"<p>Sémaphore binaire initialisé à 1 : P(mutex) avant la section critique, V(mutex) après.</p>\n"},{"n":"synchronisation-semaphores","k":76,"ch":"synchronisation-semaphores","q":"<p>Sémaphore de synchronisation</p>\n","r":"<p>Initialisé à 0 : celui qui attend fait P, celui qui autorise fait V.</p>\n"},{"n":"synchronisation-semaphores","k":77,"ch":"synchronisation-semaphores","q":"<p>Producteur/consommateur, sémaphores</p>\n","r":"<p>Mutex = 1, Plein = 0 (messages), Vide = N (cases libres).</p>\n"},{"n":"synchronisation-semaphores","k":78,"ch":"synchronisation-semaphores","q":"<p>Ordre P dans le producteur</p>\n","r":"<p>Vide.P() puis Mutex.P(), sinon interblocage quand le tampon est plein.</p>\n"},{"n":"synchronisation-semaphores","k":79,"ch":"synchronisation-semaphores","q":"<p>Lecteurs/rédacteurs</p>\n","r":"<p>Le premier lecteur fait Acces.P(), le dernier Acces.V() ; le rédacteur encadre son écriture par Acces.P()/V().</p>\n"},{"n":"synchronisation-semaphores","k":80,"ch":"synchronisation-semaphores","q":"<p>Les 3 problèmes classiques du cours</p>\n","r":"<p>Section critique (exclusion mutuelle), lecteurs/rédacteurs, producteurs/consommateurs.</p>\n"},{"n":"ipc-tubes-signaux","k":81,"ch":"ipc-tubes-signaux","q":"<p>pipe(fd)</p>\n","r":"<p>fd[0] = lecture, fd[1] = écriture. Tube anonyme, unidirectionnel, entre processus apparentés.</p>\n"},{"n":"ipc-tubes-signaux","k":82,"ch":"ipc-tubes-signaux","q":"<p>Quand créer le tube ?</p>\n","r":"<p>Avant le fork(), pour que les fils héritent des descripteurs.</p>\n"},{"n":"ipc-tubes-signaux","k":83,"ch":"ipc-tubes-signaux","q":"<p>Pourquoi read() bloque à vie ?</p>\n","r":"<p>Une extrémité d&#39;écriture est restée ouverte quelque part (souvent chez le père).</p>\n"},{"n":"ipc-tubes-signaux","k":84,"ch":"ipc-tubes-signaux","q":"<p>dup2(fd[1], STDOUT_FILENO)</p>\n","r":"<p>Redirige la sortie standard vers le tube : sert à brancher une commande exec sur un tube.</p>\n"},{"n":"ipc-tubes-signaux","k":85,"ch":"ipc-tubes-signaux","q":"<p>Tube nommé (FIFO)</p>\n","r":"<p>Tube avec un nom dans le système de fichiers (mkfifo) ; relie des processus sans parenté ; open() bloquant.</p>\n"},{"n":"ipc-tubes-signaux","k":86,"ch":"ipc-tubes-signaux","q":"<p>Lecture dans un tube</p>\n","r":"<p>Destructrice et dans l&#39;ordre FIFO.</p>\n"},{"n":"ipc-tubes-signaux","k":87,"ch":"ipc-tubes-signaux","q":"<p>SIGKILL</p>\n","r":"<p>Signal 9 : destruction inconditionnelle, ni captable ni ignorable.</p>\n"},{"n":"ipc-tubes-signaux","k":88,"ch":"ipc-tubes-signaux","q":"<p>Ctrl-C, Ctrl-Z, Ctrl-\\</p>\n","r":"<p>SIGINT, SIGTSTP (pas SIGSTOP), SIGQUIT.</p>\n"},{"n":"ipc-tubes-signaux","k":89,"ch":"ipc-tubes-signaux","q":"<p>signal(SIGCHLD, SIG_IGN)</p>\n","r":"<p>Les fils morts sont nettoyés automatiquement : pas de zombie.</p>\n"},{"n":"ipc-tubes-signaux","k":90,"ch":"ipc-tubes-signaux","q":"<p>pause()</p>\n","r":"<p>Suspend le processus jusqu&#39;à l&#39;arrivée d&#39;un signal.</p>\n"},{"n":"td-tp-corriges","k":91,"ch":"td-tp-corriges","q":"<p>TD2 ex. 2, TMA FCFS / SJF / SRTF</p>\n","r":"<p>4,6 / 3,6 / 3,2.</p>\n"},{"n":"td-tp-corriges","k":92,"ch":"td-tp-corriges","q":"<p>TD2 ex. 3, TMA SRTF / RR q=2</p>\n","r":"<p>2,5 / 4,5.</p>\n"},{"n":"td-tp-corriges","k":93,"ch":"td-tp-corriges","q":"<p>TD2 ex. 4, TMA priorités non préemptif / préemptif</p>\n","r":"<p>3,75 / 3,5.</p>\n"},{"n":"td-tp-corriges","k":94,"ch":"td-tp-corriges","q":"<p>TD3 ex. 3.1, best-fit 12 Ko</p>\n","r":"<p>z7 (14 Ko).</p>\n"},{"n":"td-tp-corriges","k":95,"ch":"td-tp-corriges","q":"<p>TD4 disque 345 vers 0, FIFO / SSTF / SCAN</p>\n","r":"<p>2013 / 1298 / 1219 pistes.</p>\n"},{"n":"td-tp-corriges","k":96,"ch":"td-tp-corriges","q":"<p>TD5 ex. 2 (mutex1, mutex2)</p>\n","r":"<p>Valide : pas d&#39;attente circulaire, n et out bien protégés.</p>\n"},{"n":"td-tp-corriges","k":97,"ch":"td-tp-corriges","q":"<p>TD1 ex. 3, nombre de « fork1 », « fork2 », « fork3 »</p>\n","r":"<p>2, 4, 8.</p>\n"},{"n":"revision-examen-blanc","k":98,"ch":"revision-examen-blanc","q":"<p>Structure des examens 2025</p>\n","r":"<p>4 exercices : processus/fork, ordonnancement (Gantt + tableau), mémoire (adresses, allocation), fichiers/disque (FAT, i-node, bras) ; rattrapage avec lecteurs/rédacteurs.</p>\n"},{"n":"revision-examen-blanc","k":99,"ch":"revision-examen-blanc","q":"<p>Rendement dans les tableaux d&#39;examen</p>\n","r":"<p>Temps d&#39;exécution ÷ temps de rotation.</p>\n"},{"n":"revision-examen-blanc","k":100,"ch":"revision-examen-blanc","q":"<p>RR q=2, P1(2) P2(1) P3(8) P4(4) P5(5) tous à 0</p>\n","r":"<p>TMR 11,2 ; TMA 7,2.</p>\n"},{"n":"revision-examen-blanc","k":101,"ch":"revision-examen-blanc","q":"<p>128 Go, blocs de 8 Ko</p>\n","r":"<p>2²⁴ blocs, 24 bits, FAT de 48 Mo = 6144 blocs.</p>\n"},{"n":"revision-examen-blanc","k":102,"ch":"revision-examen-blanc","q":"<p>32 Go, blocs de 16 Ko, FAT minimale</p>\n","r":"<p>2²¹ blocs × 21 bits = 5,25 Mo.</p>\n"},{"n":"revision-examen-blanc","k":103,"ch":"revision-examen-blanc","q":"<p>77 824 octets, i-node, blocs 1 Ko</p>\n","r":"<p>76 blocs de données + 1 index = 77.</p>\n"},{"n":"revision-examen-blanc","k":104,"ch":"revision-examen-blanc","q":"<p>Correction lecteurs/rédacteurs</p>\n","r":"<p>Sémaphore Acces : premier lecteur P(Acces), dernier V(Acces), rédacteur P/V(Acces).</p>\n"}];

// Format « essais » : un objet partagé avec l'ancien module (attempts par notion, cards par indice) ; on ne touche qu'à ces deux champs.
// Format « score10 » : scores des chapitres dans MODULE.cle, essais et cartes dans MODULE.cleEtat.
const lireJ = (k) => { try { return JSON.parse(localStorage.getItem(k) || "{}") || {}; } catch (e) { return {}; } };
const ecrireJ = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const etat = () => { const S = lireJ(MODULE.cleEtat); S.attempts = S.attempts || {}; S.cards = S.cards || {}; return S; };

.mzt-row label{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--m);cursor:pointer}
.mzt-note{font-size:11.5px;color:var(--m);margin:0}
.mzt-pan details{padding:0 10px}.mzt-pan summary{cursor:pointer;font-size:12px;color:var(--a);font-weight:600;padding:4px 0}
.mzt-prev{max-height:140px;overflow:auto;font-size:12px;white-space:pre-wrap;background:var(--s);border-radius:6px;padding:6px;color:var(--m)}
.mzt-list{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.mzt-item{border:1px solid var(--l);border-radius:8px;padding:8px}
.mzt-item .mzt-meta{font-size:11px;color:var(--m)}
.mzt-pan input[type=search]{width:100%;font:16px system-ui,sans-serif;padding:7px;border:1px solid var(--l);border-radius:8px;background:var(--s);color:var(--i)}
.mzt-pan input[type=checkbox]{width:auto}
.mzt-pan[hidden],.mzt-btn[hidden],.mzt-pan [hidden]{display:none!important}
.mzt-h button{flex:0 0 auto;white-space:nowrap}
.mzt-pan #mztX{background:var(--bad);border-color:var(--bad);color:#fff}
.mzt-m.a{white-space:normal}.mzt-m.a p{margin:0 0 6px}.mzt-m.a p:last-child{margin-bottom:0}
.mzt-m.a ul,.mzt-m.a ol{margin:4px 0 6px;padding-left:20px}.mzt-m.a li{margin:2px 0}
.mzt-m code{font:12.5px ui-monospace,Menlo,Consolas,monospace;background:color-mix(in srgb,var(--i) 10%,transparent);padding:1px 4px;border-radius:4px;overflow-wrap:anywhere}
.mzt-m pre{margin:6px 0;padding:8px;overflow-x:auto;background:color-mix(in srgb,var(--i) 10%,transparent);border-radius:6px;font:12.5px ui-monospace,Menlo,Consolas,monospace;white-space:pre}
.mzt-m pre code{background:none;padding:0}`;
  const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
  document.body.insertAdjacentHTML('beforeend', `
<button class="mzt-btn" id="mztBtn" type="button">Tuteur</button>
<div class="mzt-pan" id="mztPan" hidden role="dialog" aria-label="Tuteur">
 <div class="mzt-h"><b>Tuteur</b><span class="mzt-ctx" id="mztCtx"></span><button type="button" id="mztTabH">Historique</button><button type="button" id="mztTabM">Mémoire</button><button type="button" id="mztX">Fermer</button></div>
 <div class="mzt-body" id="mztChat">
  <details><summary>Voir l'extrait envoyé au tuteur</summary><div class="mzt-prev" id="mztPrev"></div></details>
  <div class="mzt-log" id="mztLog"></div>
  <div class="mzt-chips" id="mztChips"></div>
  <form class="mzt-f" id="mztF">
   <textarea id="mztIn" placeholder="Ta question, ou ta réponse à vérifier… (Entrée pour envoyer, Maj+Entrée pour aller à la ligne)"></textarea>
   <div class="mzt-row">
    <button class="mzt-pri" id="mztSend" type="submit">Envoyer</button>
    <button type="button" id="mztStop" hidden>Arrêter</button>
    <label id="mztImgL" hidden>📎 Photo<input type="file" id="mztImg" accept="image/*" hidden></label>
    <span class="mzt-note" id="mztImgN"></span>
    <label title="Modèle plus puissant : réponse plus longue et plus détaillée, consomme davantage"><input type="checkbox" id="mztDeep"> Approfondi</label>
    <button type="button" id="mztNew">Nouvelle discussion</button>
   </div>
   <p class="mzt-note" id="mztNote"></p>
  </form>
 </div>
 <div class="mzt-body" id="mztHist" hidden><div style="padding:10px"><input type="search" id="mztQ" placeholder="Chercher dans toutes mes anciennes questions…"></div><div class="mzt-list" id="mztList"></div></div>
 <div class="mzt-body" id="mztMem" hidden><div class="mzt-list"><p class="mzt-note">Ce que le tuteur retient de tes difficultés d'une conversation à l'autre. Il s'en sert pour faire des liens avec tes confusions passées. Tu peux effacer une note.</p><div id="mztMemL"></div></div></div>
</div>`);

  const CHIPS = ['Explique plus simplement', 'Donne un exemple concret', "Pourquoi c'est un piège ?", 'Fais-moi un mini-exercice'];
  $('#mztChips').innerHTML = CHIPS.map((c) => `<button type="button" data-chip="${esc(c)}">${esc(c)}</button>`).join('');

  function view(v) {
    $('#mztChat').hidden = v !== 'chat'; $('#mztHist').hidden = v !== 'hist'; $('#mztMem').hidden = v !== 'mem';
    $('#mztTabH').textContent = v === 'hist' ? 'Retour' : 'Historique'; $('#mztTabM').textContent = v === 'mem' ? 'Retour' : 'Mémoire';
    if (v === 'hist') renderList(); if (v === 'mem') renderMem();
  }
  function note() {
    $('#mztNote').textContent = !ready ? 'Connexion au tuteur…' : sample
      ? 'Mode rapide (économe) par défaut. « Approfondi » ou « Approfondir cette réponse » utilise un modèle supérieur. Pense à chercher dans l\'Historique avant de reposer une question.'
      : 'Le tuteur n\'est pas disponible ici (il faut ouvrir la page dans Claude et accepter la demande d\'autorisation). L\'historique reste consultable.';
  }
  function refreshCtx() {
    const c = context(); $('#mztCtx').textContent = '· ' + c.label; $('#mztPrev').textContent = c.text.slice(0, 2500) + (c.text.length > 2500 ? '\n…' : '');
    return c;
  }
  function openPanel(ctx) {
    forced = ctx && ctx.text ? ctx : null;
    $('#mztPan').hidden = false; $('#mztBtn').hidden = true; view('chat');
    const c = refreshCtx();
    if (!cur || cur.sec !== c.label) { const ts = ST.threads.filter((t) => t.sec === c.label); cur = forced ? null : ts[ts.length - 1] || null; }
    renderLog(); note(); setTimeout(() => $('#mztIn').focus(), 30);
  }
  function closePanel() { $('#mztPan').hidden = true; $('#mztBtn').hidden = false; forced = null; }

  function renderLog() {
    const log = $('#mztLog'); log.innerHTML = '';
    if (!cur || !cur.msgs.length) {
      log.innerHTML = `<div class="mzt-m a">Pose ta question sur « ${esc(context().label)} » : une phrase que tu ne comprends pas, un calcul à vérifier, un exemple en plus… Tu peux joindre une photo de ton brouillon.</div>`; return;
    }
    cur.msgs.forEach((m, i) => {
      const d = document.createElement('div'); d.className = 'mzt-m ' + (m.r === 'u' ? 'u' : 'a');
      if (m.d) d.innerHTML = '<span class="mzt-tag">Réponse approfondie</span>';
      if (m.r === 'u') d.appendChild(document.createTextNode(m.t)); else d.insertAdjacentHTML('beforeend', md(m.t)); log.appendChild(d);
      if (m.r === 'a' && i === cur.msgs.length - 1 && !m.d && !busy) {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'mzt-deepbtn'; b.textContent = 'Approfondir cette réponse';
        b.onclick = () => ask('Approfondis ta réponse précédente : explique plus en détail, avec un exemple complet et les pièges.', true); log.appendChild(b);
      }
    });
    log.scrollTop = 1e9;
  }
  function renderList() {
    const q = norm($('#mztQ').value || ''); const ts = [...ST.threads].reverse().filter((t) => !q || norm(t.msgs.map((m) => m.t).join(' ')).includes(q));
    $('#mztList').innerHTML = ts.length ? ts.map((t) => `<details class="mzt-item"><summary>${esc(t.title)}</summary><div class="mzt-meta">${esc(t.sec)} · ${esc(t.date)}</div>${t.msgs.map((m) => `<div class="mzt-m ${m.r === 'u' ? 'u' : 'a'}" style="margin:6px 0">${m.r === 'u' ? esc(m.t) : md(m.t)}</div>`).join('')}<button type="button" data-cont="${esc(t.id)}">Continuer cette discussion</button></details>`).join('')
      : `<p class="mzt-note">${ST.threads.length ? 'Aucune discussion ne contient ce mot.' : 'Aucune discussion pour l\'instant.'}</p>`;
  }
  function renderMem() {
    $('#mztMemL').innerHTML = ST.memos.length ? ST.memos.map((m, i) => `<div class="mzt-item"><div class="mzt-meta">${esc(m.date)}</div>${esc(m.text)}<div><button type="button" data-memdel="${i}" style="margin-top:4px">Effacer</button></div></div>`).join('')
      : '<p class="mzt-note">Aucune note pour l\'instant. Elles apparaîtront au fil de tes questions.</p>';
  }

  // ---------- stockage compte ----------
  async function saveThread(t) {
    saveLocal(); if (!db) return;
    try { await db.collection(base + '/threads').doc(t.id).set({ sec: t.sec, date: t.date, title: t.title, msgs: t.msgs.slice(-40) }); } catch (e) {}
  }
  async function saveMemos() { saveLocal(); if (!db) return; try { await db.doc(base).set({ memos: ST.memos.slice(-30), updated: Date.now() }); } catch (e) {} }

  // ---------- appel au tuteur ----------
  const ERR = { not_granted: 'Tu n\'as pas autorisé la page à utiliser Claude. Recharge-la et accepte la demande, ou change-le dans le menu Autorisations de l\'artifact.', rate_limited: 'Trop de questions d\'un coup, ou limite d\'usage atteinte. Réessaie dans un moment.', prompt_too_large: 'L\'extrait est trop long : ouvre une partie plus précise du cours.', image_rejected: 'Cette photo n\'est pas acceptée. Essaie un JPEG ou un PNG plus léger.', refused: 'Claude n\'a pas pu répondre à cette demande. Reformule ta question.' };
  const visible = (t) => {
    const L = String(t).split('\n');
    for (let i = L.length - 1; i >= Math.max(0, L.length - 3); i--) if (/^\s*M[ÉE]MO\s*:/i.test(L[i])) return L.slice(0, i).join('\n').trim();
    return String(t).trim();
  };
  // rendu léger : on échappe le HTML d'abord, puis gras, italique, code, titres, puces et blocs de code
  const inl = (s) => {
    const p = s.split('`'); if (p.length % 2 === 0) { const last = p.pop(); p[p.length - 1] += '`' + last; }
    return p.map((x, i) => i % 2 ? '<code>' + esc(x) + '</code>' : esc(x).replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*\w])\*([^*\n]+)\*(?![*\w])/g, '$1<em>$2</em>')).join('');
  };
  const md = (t) => {
    const out = []; let list = null, code = null;
    const flush = () => { if (list) { out.push('</' + list + '>'); list = null; } };
    String(t).split('\n').forEach((raw) => {
      if (/^\s*```/.test(raw)) { if (code === null) { flush(); code = []; } else { out.push('<pre>' + esc(code.join('\n')) + '</pre>'); code = null; } return; }
      if (code !== null) { code.push(raw); return; }
      let m;
      if ((m = raw.match(/^\s*#{1,6}\s+(.*)$/))) { flush(); out.push('<p><strong>' + inl(m[1]) + '</strong></p>'); }
      else if ((m = raw.match(/^\s*[-*•]\s+(.*)$/))) { if (list !== 'ul') { flush(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + inl(m[1]) + '</li>'); }
      else if ((m = raw.match(/^\s*\d+[.)]\s+(.*)$/))) { if (list !== 'ol') { flush(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + inl(m[1]) + '</li>'); }
      else if (!raw.trim()) flush();
      else { flush(); out.push('<p>' + inl(raw) + '</p>'); }
    });
    if (code !== null) out.push('<pre>' + esc(code.join('\n')) + '</pre>');
    flush(); return out.join('');
  };
  async function ask(q, deep) {
    q = (q || '').trim(); deep = deep || $('#mztDeep').checked;
    if (busy || !q) return; if (!sample) { note(); return; }
    const c = refreshCtx();
    if (!cur || (cur.sec !== c.label && !forced)) { cur = { id: 't' + Date.now().toString(36), sec: c.label, date: today(), title: q.slice(0, 80), msgs: [] }; ST.threads.push(cur); }
    else if (!ST.threads.includes(cur)) ST.threads.push(cur);
    cur.msgs.push({ r: 'u', t: q }); busy = true; renderLog();
    const out = document.createElement('div'); out.className = 'mzt-m a'; out.textContent = deep ? 'Réflexion approfondie…' : 'Réflexion…'; $('#mztLog').appendChild(out);
    $('#mztSend').disabled = true; $('#mztStop').hidden = false;
    const style = deep
      ? 'Réponse APPROFONDIE (400 à 700 mots) : 1) l\'intuition avec une analogie, 2) l\'explication détaillée pas à pas, 3) pourquoi ça marche, 4) un exemple complet chiffré, 5) les pièges fréquents et ce qui tombe à l\'examen, 6) une question pour vérifier la compréhension.'
      : 'Réponse EXPLICATIVE (150 à 250 mots) : 1) l\'idée en une phrase, 2) l\'explication pas à pas, 3) un petit exemple chiffré ou concret, 4) une courte question pour vérifier la compréhension.';
    const mem = [];
    if (ST.memos.length) mem.push('DIFFICULTÉS DÉJÀ REPÉRÉES :\n' + ST.memos.slice(-12).map((m) => `- ${m.date} : ${m.text}`).join('\n'));
    const lastQ = ST.threads.flatMap((t) => t.msgs.filter((m) => m.r === 'u').map((m) => `[${t.sec}] ${m.t.slice(0, 100)}`)).slice(-6);
    if (lastQ.length) mem.push('SES DERNIÈRES QUESTIONS :\n' + lastQ.map((x) => '- ' + x).join('\n'));
    const rules = `Tu es le tuteur de ${C.student}, pour le module ${C.module}${C.prof ? ' du ' + C.prof : ''}. Il apprend souvent la notion pour la première fois.
Règles : réponds en français simple, en Markdown léger (**gras** pour les termes clés, tirets, étapes numérotées, formules et calculs entre accents graves ; pas de tableaux). ${style} Appuie-toi d'abord sur l'EXTRAIT ci-dessous et sur les conventions du prof ; si une source générale diffère du cours, signale l'écart et dis quelle version utiliser à l'examen (celle du prof). Pour un calcul, pose chaque étape et vérifie-la. S'il envoie une réponse ou une photo de brouillon, corrige étape par étape et nomme précisément l'erreur. Si tu n'es pas sûr, dis-le. S'il demande un mini-exercice, donne l'exercice sans la solution.
Utilise sa mémoire pour faire des liens avec ses confusions passées, sans la réciter.
Termine TOUJOURS par une dernière ligne séparée au format exact « MÉMO: … » qui résume en 15 mots maximum la difficulté révélée par sa question (ou « MÉMO: rien »). Cette ligne lui est cachée.
${C.conventions ? 'CONVENTIONS DU PROF : ' + C.conventions + '\n' : ''}MÉMOIRE DE L'ÉLÈVE :
${mem.join('\n\n') || '(rien pour l\'instant)'}
EXTRAIT (${c.label}) :
${c.text.slice(0, deep ? 9000 : 3500)}`;
    const recent = cur.msgs.slice(deep ? -9 : -5, -1).map((m) => ({ role: m.r === 'u' ? 'user' : 'assistant', content: m.t }));
    while (recent.length && recent[0].role !== 'user') recent.shift();
    const msgs = [...recent.filter((m) => m.content && m.content.trim()), { role: 'user', content: q }]; while (msgs.length > 1 && msgs[0].role !== 'user') msgs.shift(); msgs[0] = { role: 'user', content: rules + '\n\n---\nQuestion : ' + msgs[0].content };
    ctl = new AbortController();
    const opts = { modelTier: deep ? 'complex' : 'quick', cache: false, signal: ctl.signal, onText: ({ text }) => { out.innerHTML = md(visible(text)); $('#mztLog').scrollTop = 1e9; } };
    if (img) opts.images = [img];
    try {
      const r = await sample(msgs, opts);
      const mm = r.text.match(/(?:^|\n)\s*M[ÉE]MO\s*:\s*(.+)\s*$/i);
      cur.msgs.push({ r: 'a', t: visible(r.text) + (r.truncated ? '\n\n(Réponse coupée : pose une question plus ciblée.)' : ''), d: !!deep });
      if (mm && !/^\s*rien/i.test(mm[1])) { ST.memos.push({ date: today(), text: mm[1].trim().slice(0, 160) }); if (ST.memos.length > 30) ST.memos.shift(); saveMemos(); }
      await saveThread(cur);
    } catch (e) {
      const kept = e && e.text ? visible(e.text) : '';
      if (e && e.code === 'cancelled') { if (kept) cur.msgs.push({ r: 'a', t: kept + '\n(Arrêté.)' }); else cur.msgs.pop(); }
      else { cur.msgs.pop(); out.textContent = (kept ? kept + '\n\n' : '') + (ERR[e && e.code] || 'Le tuteur n\'a pas pu répondre. Réessaie dans un instant.'); }
      if (!cur.msgs.length) ST.threads = ST.threads.filter((t) => t !== cur);
      saveLocal();
      if (!(e && e.code === 'cancelled')) { busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImgN').textContent = ''; return; }
    }
    busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImg').value = ''; $('#mztImgN').textContent = ''; renderLog();
  }

  // ---------- événements ----------
  $('#mztBtn').onclick = () => openPanel(null);
  $('#mztX').onclick = closePanel;
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#mztPan').hidden) closePanel(); });
  $('#mztTabH').onclick = () => view($('#mztHist').hidden ? 'hist' : 'chat');
  $('#mztTabM').onclick = () => view($('#mztMem').hidden ? 'mem' : 'chat');
  $('#mztQ').oninput = renderList;
  $('#mztList').onclick = (e) => { const id = e.target.dataset && e.target.dataset.cont; if (!id) return; cur = ST.threads.find((t) => t.id === id); view('chat'); $('#mztCtx').textContent = '· ' + cur.sec; renderLog(); };
  $('#mztMemL').onclick = (e) => { const i = e.target.dataset && e.target.dataset.memdel; if (i == null) return; ST.memos.splice(+i, 1); saveMemos(); renderMem(); };
  $('#mztChips').onclick = (e) => { const b = e.target.closest('[data-chip]'); if (!b) return; const t = $('#mztIn'); t.value = b.dataset.chip + (t.value ? ' : ' + t.value : ''); t.focus(); };
  $('#mztNew').onclick = () => { cur = null; renderLog(); };
  $('#mztStop').onclick = () => { if (ctl) ctl.abort(); };
  $('#mztImg').onchange = (e) => { img = e.target.files[0] || null; $('#mztImgN').textContent = img ? 'Photo : ' + img.name : ''; };
  $('#mztF').onsubmit = (e) => { e.preventDefault(); const v = $('#mztIn').value; $('#mztIn').value = ''; ask(v); };
  $('#mztIn').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#mztF').requestSubmit(); } });

  // ---------- capacités (facultatives) ----------
  const W = window.claude;
  if (W && W.use) {
    W.use('sample').then((s) => { sample = s; ready = true; note();
      if (s && s.limits) s.limits().then((l) => { if (l && l.images) { imgOK = true; $('#mztImgL').hidden = false; if (l.images.mediaTypes) $('#mztImg').accept = l.images.mediaTypes.join(','); } }).catch(() => {});
    }).catch(() => { ready = true; note(); });
    Promise.all([W.use('db'), W.use('user')]).then(async ([d, u]) => {
      if (!d || !u) return; const id = await u.id(); if (!id) return; db = d; base = 'data/users/' + id + '/mzt_' + C.id;
      try {
        const m = await db.doc(base).get(); if (m.exists) { const v = m.data() || {}; if (Array.isArray(v.memos)) ST.memos = JSON.parse(JSON.stringify(v.memos)); }
        const q = await db.collection(base + '/threads').get(); const remote = q.docs.map((x) => Object.assign({ id: x.id }, JSON.parse(JSON.stringify(x.data() || {}))));
        const map = {}; [...ST.threads, ...remote].forEach((t) => { if (!map[t.id] || (t.msgs || []).length > (map[t.id].msgs || []).length) map[t.id] = t; });
        ST.threads = Object.values(map).sort((a, b) => parseInt(a.id.slice(1), 36) - parseInt(b.id.slice(1), 36)); saveLocal();
      } catch (e) {}
    }).catch(() => {});
  } else { ready = true; note(); }

  window.MZT = { open: openPanel, close: closePanel };
})();

</script>
