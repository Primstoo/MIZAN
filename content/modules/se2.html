mily=\"sans-serif\" font-size=\"12\" fill=\"currentColor\">\n<rect x=\"20\" y=\"20\" width=\"150\" height=\"210\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<text x=\"95\" y=\"40\" text-anchor=\"middle\" font-weight=\"700\">i-node</text>\n<text x=\"30\" y=\"62\">attributs</text>\n<rect x=\"28\" y=\"72\" width=\"134\" height=\"60\" fill=\"#D9824F\" fill-opacity=\"0.15\" stroke=\"#D9824F\"/><text x=\"95\" y=\"106\" text-anchor=\"middle\">12 pointeurs directs</text>\n<rect x=\"28\" y=\"140\" width=\"134\" height=\"24\" fill=\"none\" stroke=\"currentColor\"/><text x=\"95\" y=\"157\" text-anchor=\"middle\">indirect simple</text>\n<rect x=\"28\" y=\"168\" width=\"134\" height=\"24\" fill=\"none\" stroke=\"currentColor\"/><text x=\"95\" y=\"185\" text-anchor=\"middle\">indirect double</text>\n<rect x=\"28\" y=\"196\" width=\"134\" height=\"24\" fill=\"none\" stroke=\"currentColor\"/><text x=\"95\" y=\"213\" text-anchor=\"middle\">indirect triple</text>\n<rect x=\"250\" y=\"80\" width=\"60\" height=\"40\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"280\" y=\"104\" text-anchor=\"middle\">données</text>\n<rect x=\"250\" y=\"140\" width=\"60\" height=\"24\" fill=\"none\" stroke=\"currentColor\"/><text x=\"280\" y=\"157\" text-anchor=\"middle\">index</text>\n<rect x=\"250\" y=\"174\" width=\"60\" height=\"24\" fill=\"none\" stroke=\"currentColor\"/><text x=\"280\" y=\"191\" text-anchor=\"middle\">index</text>\n<rect x=\"340\" y=\"174\" width=\"60\" height=\"24\" fill=\"none\" stroke=\"currentColor\"/><text x=\"370\" y=\"191\" text-anchor=\"middle\">index</text>\n<rect x=\"250\" y=\"208\" width=\"60\" height=\"24\" fill=\"none\" stroke=\"currentColor\"/><text x=\"280\" y=\"225\" text-anchor=\"middle\">index</text>\n<rect x=\"340\" y=\"208\" width=\"60\" height=\"24\" fill=\"none\" stroke=\"currentColor\"/><text x=\"370\" y=\"225\" text-anchor=\"middle\">index</text>\n<rect x=\"430\" y=\"208\" width=\"60\" height=\"24\" fill=\"none\" stroke=\"currentColor\"/><text x=\"460\" y=\"225\" text-anchor=\"middle\">index</text>\n<text x=\"420\" y=\"157\">N blocs de données</text>\n<text x=\"420\" y=\"191\">N² blocs</text>\n<text x=\"510\" y=\"225\">N³ blocs</text>\n<text x=\"330\" y=\"104\">12 blocs</text>\n</g>\n<g stroke=\"currentColor\" stroke-width=\"1.5\" fill=\"none\"><line x1=\"162\" y1=\"100\" x2=\"248\" y2=\"100\"/><line x1=\"162\" y1=\"152\" x2=\"248\" y2=\"152\"/><line x1=\"162\" y1=\"180\" x2=\"248\" y2=\"186\"/><line x1=\"310\" y1=\"186\" x2=\"338\" y2=\"186\"/><line x1=\"162\" y1=\"208\" x2=\"248\" y2=\"220\"/><line x1=\"310\" y1=\"220\" x2=\"338\" y2=\"220\"/><line x1=\"400\" y1=\"220\" x2=\"428\" y2=\"220\"/></g>\n</svg><p>Avec des blocs de B octets et des pointeurs de p octets, un bloc d&#39;index contient <strong>N = B ÷ p</strong> pointeurs. Taille max d&#39;un fichier = (12 + N + N² + N³) × B.</p>\n<p><strong>TD4 ex. 2</strong> (blocs de 1 Ko, pointeurs de 4 octets, donc N = 256) :</p>\n<pre class=\"\"><code>import math\nBLOC, PTR = 1024, 4\nN = BLOC // PTR                     # pointeurs par bloc d'index\nprint(&quot;pointeurs par bloc :&quot;, N)\nmax_blocs = 12 + N + N**2 + N**3\nprint(&quot;taille max :&quot;, max_blocs, &quot;blocs =&quot;, max_blocs * BLOC, &quot;octets&quot;)\n\ndef blocs(taille):\n    data = math.ceil(taille / BLOC)\n    index, reste = 0, data - 12\n    if reste &gt; 0:                    # indirection simple : 1 bloc d'index\n        index += 1; reste -= N\n    if reste &gt; 0:                    # indirection double : 1 + autant que nécessaire\n        index += 1 + math.ceil(reste / N); reste -= N * N\n    return data, index\n\nfor t in (532 * 1024, 100000, 77824):\n    d, i = blocs(t)\n    print(f&quot;{t} octets : {d} blocs de données + {i} blocs d'index = {d + i}&quot;)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>pointeurs par bloc : 256\ntaille max : 16843020 blocs = 17247252480 octets\n544768 octets : 532 blocs de données + 4 blocs d'index = 536\n100000 octets : 98 blocs de données + 1 blocs d'index = 99\n77824 octets : 76 blocs de données + 1 blocs d'index = 77</code></pre><p>Lecture : la taille max vaut 12 Ko + 256 Ko + 64 Mo + 16 Go, soit environ <strong>16,06 Go</strong>. Pour le fichier de 532 Ko : <strong>12</strong> blocs directs, <strong>256</strong> par l&#39;indirection simple, <strong>264</strong> par la double ; il faut 1 bloc d&#39;index simple + 1 bloc d&#39;index double de 1er niveau + 2 de 2e niveau = <strong>4 blocs d&#39;index</strong>.</p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>Le corrigé « Rapports TD » donne 533 blocs pour 532 Ko (il fait passer 520 blocs par l&#39;indirection simple, qui n&#39;en contient que 256) et dit que 100 000 octets n&#39;utilisent « que les blocs directs » (98 blocs &gt; 12 : il faut l&#39;indirection simple). Les bons comptes sont ci-dessus.</p>\n</aside><h2>Idée 4 · Le disque : CHS et temps d&#39;accès</h2>\n<p>Un disque est fait de <strong>plateaux</strong>, de <strong>pistes</strong> (cercles), de <strong>secteurs</strong> ; les pistes de même rayon forment un <strong>cylindre</strong>. L&#39;adresse <strong>CHS</strong> (cylindre / tête / secteur) : cylindre de 0 à NC − 1, tête de 0 à NH − 1, secteur de <strong>1</strong> à NS. Le premier secteur est 0/0/1.</p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p><strong>Capacité = NC × NH × NS × taille d&#39;un secteur.</strong> Temps d&#39;une requête = temps de <strong>positionnement</strong> (déplacer la tête sur le cylindre) + temps de <strong>latence</strong> (attendre que le secteur passe sous la tête) + temps de <strong>transfert</strong>.</p>\n</aside><p><strong>TD5, ex. 1</strong> (anciennes limites : 1020 cylindres, 250 têtes, 63 secteurs de 512 octets) :</p>\n<pre class=\"\"><code>cyl, tetes, secteurs, octets = 1020, 250, 63, 512\nprint(&quot;taille d'un cylindre :&quot;, tetes * secteurs * octets, &quot;octets&quot;)\nprint(&quot;capacité d'un plateau (une face) :&quot;, cyl * secteurs * octets, &quot;octets&quot;)\nprint(&quot;capacité du disque :&quot;, cyl * tetes * secteurs * octets, &quot;octets&quot;)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>taille d'un cylindre : 8064000 octets\ncapacité d'un plateau (une face) : 32901120 octets\ncapacité du disque : 8225280000 octets</code></pre><p>Soit environ 7,7 Mo par cylindre et 7,66 Gio pour le disque.</p>\n<h2>Idée 5 · Ordonnancer le bras du disque</h2>\n<p>Le pilote reçoit plusieurs requêtes et choisit dans quel ordre les servir, pour <strong>réduire le temps de positionnement</strong>, donc le nombre de cylindres parcourus.</p>\n<table>\n<thead>\n<tr>\n<th>Algorithme</th>\n<th>Règle</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>FIFO</strong></td>\n<td>dans l&#39;ordre d&#39;arrivée</td>\n</tr>\n<tr>\n<td><strong>SSTF</strong></td>\n<td>la requête la <strong>plus proche</strong> de la position actuelle</td>\n</tr>\n<tr>\n<td><strong>SCAN</strong> (ascenseur)</td>\n<td>va jusqu&#39;au <strong>bout du disque</strong> en servant au passage, puis repart dans l&#39;autre sens</td>\n</tr>\n<tr>\n<td><strong>C-SCAN</strong></td>\n<td>comme SCAN, mais au bout il <strong>revient au début</strong> sans rien servir, puis repart dans le même sens</td>\n</tr>\n<tr>\n<td><strong>LOOK</strong></td>\n<td>comme SCAN, mais fait demi-tour à la <strong>dernière requête</strong>, pas au bout du disque</td>\n</tr>\n<tr>\n<td><strong>C-LOOK</strong></td>\n<td>comme C-SCAN, mais s&#39;arrête à la dernière requête et saute à la plus basse</td>\n</tr>\n</tbody></table>\n<p><strong>Exemple du cours</strong> : tête en 11, montant, cylindres 0 à 49, requêtes 1, 36, 16, 34, 9, 12.</p>\n<pre class=\"\"><code>def trajet(chemin):\n    total = sum(abs(chemin[i + 1] - chemin[i]) for i in range(len(chemin) - 1))\n    print(&quot; -&gt; &quot;.join(map(str, chemin)), &quot;=&quot;, total)\n\ntrajet([11, 1, 36, 16, 34, 9, 12])            # FIFO\ntrajet([11, 12, 9, 16, 1, 34, 36])            # SSTF\ntrajet([11, 12, 16, 34, 36, 49, 9, 1])        # SCAN (va jusqu'à 49)\ntrajet([11, 12, 16, 34, 36, 49, 0, 1, 9])     # C-SCAN (retour compté)\ntrajet([11, 12, 16, 34, 36, 9, 1])            # LOOK\ntrajet([11, 12, 16, 34, 36, 1, 9])            # C-LOOK</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>11 -&gt; 1 -&gt; 36 -&gt; 16 -&gt; 34 -&gt; 9 -&gt; 12 = 111\n11 -&gt; 12 -&gt; 9 -&gt; 16 -&gt; 1 -&gt; 34 -&gt; 36 = 61\n11 -&gt; 12 -&gt; 16 -&gt; 34 -&gt; 36 -&gt; 49 -&gt; 9 -&gt; 1 = 86\n11 -&gt; 12 -&gt; 16 -&gt; 34 -&gt; 36 -&gt; 49 -&gt; 0 -&gt; 1 -&gt; 9 = 96\n11 -&gt; 12 -&gt; 16 -&gt; 34 -&gt; 36 -&gt; 9 -&gt; 1 = 60\n11 -&gt; 12 -&gt; 16 -&gt; 34 -&gt; 36 -&gt; 1 -&gt; 9 = 68</code></pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>La diapo SCAN annonce <strong>96</strong> cylindres parcourus. Avec l&#39;ordre de service qu&#39;elle donne (12, 16, 34, 36, puis 9, 1) et un demi-tour au bout (49), on trouve <strong>86</strong> : 38 pour monter de 11 à 49, puis 48 pour redescendre à 1. 96 est le total de C-SCAN (retour à 0 compté). Les cinq autres totaux de la diapo sont justes.</p>\n</aside><aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p>La définition de LOOK dans la diapo dit « variante de C-SCAN », mais son exemple fait bien un aller-retour comme SCAN : LOOK est la variante de <strong>SCAN</strong>, C-LOOK celle de <strong>C-SCAN</strong>.</p>\n</aside><p><strong>Choisir</strong> : SSTF est courant (simple) mais peut affamer les requêtes éloignées et <strong>favorise le centre</strong> du disque ; SCAN et C-SCAN sont meilleurs quand la charge est forte ; SSTF et LOOK sont de bons choix par défaut. Les disques modernes ordonnancent souvent eux-mêmes.</p>\n<h2>S&#39;exercer</h2>\n<section class=\"exo\"><h3>TD4, TD5 et annales</h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>TD5 ex. 5 : 1000 cylindres, dernière requête en 345, la tête <strong>descend</strong> vers 0. File : 123, 874, 692, 475, 105, 376. Total en FIFO ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 2013</b></p><p>222 + 751 + 182 + 217 + 370 + 271 = <strong>2013</strong> pistes.</p>\n</div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Même énoncé en SSTF.</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1298</b></p><p>345 → 376 (31) → 475 (99) → 692 (217) → 874 (182) → 123 (751) → 105 (18) = <strong>1298</strong>.</p>\n</div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Même énoncé en SCAN (la tête descend).</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1219</b></p><p>345 → 123 → 105 → <strong>0</strong> (345) puis 0 → 376 → 475 → 692 → 874 (874). Total <strong>1219</strong>.</p>\n</div></div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Disque de 64 Go, blocs de 4 Ko (TD4 ex. 1). Nombre de blocs, bits d&#39;adresse minimum, et nombre de blocs occupés par la FAT ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>2³⁶ ÷ 2¹² = <strong>2²⁴</strong> blocs ; il faut <strong>24 bits</strong> (3 octets) par adresse. FAT = 2²⁴ × 3 octets = 48 Mo, soit 48 Mo ÷ 4 Ko = <strong>12 288 blocs</strong>. (Avec des entrées alignées sur 4 octets : 64 Mo, 16 384 blocs.)</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>Partition de 16 Go, blocs de 8 Ko, adresses sur 32 bits (TD4 ex. 1.3). Taille maximale et minimale de la FAT ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>2³⁴ ÷ 2¹³ = 2²¹ blocs. <strong>Max</strong> (entrées de 32 bits) : 2²¹ × 4 octets = <strong>8 Mo</strong>. <strong>Min</strong> (21 bits suffisent) : 2²¹ × 21 bits = 5 505 024 octets = <strong>5,25 Mo</strong> (6 Mo si on arrondit l&#39;entrée à 3 octets).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><p>TD5 ex. 4 : blocs de 4 Ko, fichier de 20 000 000 caractères. Fragmentation interne ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 768</b></p><p>⌈20 000 000 ÷ 4096⌉ = 4883 blocs de données = 20 000 768 octets. Perte dans le dernier bloc : <strong>768 octets</strong> (sans compter la place inutilisée des blocs d&#39;index).</p>\n</div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 12 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Sous Unix, le bloc de contrôle d&#39;un fichier s&#39;appelle :</div><button class=\"opt\" data-o=\"0\">la FAT</button><button class=\"opt\" data-o=\"1\">l&#39;i-node</button><button class=\"opt\" data-o=\"2\">le PCB</button><button class=\"opt\" data-o=\"3\">le superbloc de démarrage</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Quel inconvénient a l&#39;allocation chaînée ?</div><button class=\"opt\" data-o=\"0\">La fragmentation externe</button><button class=\"opt\" data-o=\"1\">L&#39;accès au fichier est séquentiel</button><button class=\"opt\" data-o=\"2\">Le fichier ne peut pas grandir</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Blocs de 1 Ko et pointeurs de 4 octets : combien de pointeurs par bloc d&#39;index ?</div><button class=\"opt\" data-o=\"0\">128</button><button class=\"opt\" data-o=\"1\">256</button><button class=\"opt\" data-o=\"2\">1024</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Un disque a 2²¹ blocs. Combien de bits faut-il au minimum pour adresser un bloc ?</div><button class=\"opt\" data-o=\"0\">16</button><button class=\"opt\" data-o=\"1\">21</button><button class=\"opt\" data-o=\"2\">32</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Capacité d&#39;un disque CHS :</div><button class=\"opt\" data-o=\"0\">cylindres × têtes × secteurs × octets par secteur</button><button class=\"opt\" data-o=\"1\">cylindres × secteurs × octets par secteur</button><button class=\"opt\" data-o=\"2\">têtes × secteurs × octets par secteur</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Le premier secteur d&#39;un disque en CHS a l&#39;adresse :</div><button class=\"opt\" data-o=\"0\">0/0/0</button><button class=\"opt\" data-o=\"1\">0/0/1</button><button class=\"opt\" data-o=\"2\">1/1/1</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Tête en 11, requêtes 1, 36, 16, 34, 9, 12. Quelle est la première requête servie en SSTF ?</div><button class=\"opt\" data-o=\"0\">9</button><button class=\"opt\" data-o=\"1\">12</button><button class=\"opt\" data-o=\"2\">1</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Quel algorithme fait demi-tour à la dernière requête et non au bout du disque ?</div><button class=\"opt\" data-o=\"0\">SCAN</button><button class=\"opt\" data-o=\"1\">LOOK</button><button class=\"opt\" data-o=\"2\">C-SCAN</button><button class=\"opt\" data-o=\"3\">FIFO</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Le temps de latence d&#39;un disque est :</div><button class=\"opt\" data-o=\"0\">le temps pour déplacer la tête sur le cylindre</button><button class=\"opt\" data-o=\"1\">le temps pour que le secteur voulu passe sous la tête</button><button class=\"opt\" data-o=\"2\">le temps de transfert</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Un fichier de 100 000 octets, blocs de 1 Ko, i-node à 12 pointeurs directs : combien de blocs en tout ?</div><button class=\"opt\" data-o=\"0\">98</button><button class=\"opt\" data-o=\"1\">99</button><button class=\"opt\" data-o=\"2\">12</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"fichiers-disques","rep":null,"tol":null},{"n":"fichiers-disques","rep":["2013"],"tol":null},{"n":"fichiers-disques","rep":["1298"],"tol":null},{"n":"fichiers-disques","rep":["1219"],"tol":null},{"n":"fichiers-disques","rep":null,"tol":null},{"n":"fichiers-disques","rep":null,"tol":null},{"n":"fichiers-disques","rep":["768"],"tol":null}],"qcm":[{"n":"fichiers-disques","q":"Sous Unix, le bloc de contrôle d&#39;un fichier s&#39;appelle :","o":["la FAT","l&#39;i-node","le PCB","le superbloc de démarrage"],"a":1,"e":"FCB = i-node sous Unix."},{"n":"fichiers-disques","q":"Quel inconvénient a l&#39;allocation chaînée ?","o":["La fragmentation externe","L&#39;accès au fichier est séquentiel","Le fichier ne peut pas grandir"],"a":1,"e":"Pour lire le bloc 50, il faut parcourir les 49 précédents."},{"n":"fichiers-disques","q":"Blocs de 1 Ko et pointeurs de 4 octets : combien de pointeurs par bloc d&#39;index ?","o":["128","256","1024"],"a":1,"e":"1024 ÷ 4."},{"n":"fichiers-disques","q":"Un disque a 2²¹ blocs. Combien de bits faut-il au minimum pour adresser un bloc ?","o":["16","21","32"],"a":1,"e":"2²¹ adresses demandent 21 bits."},{"n":"fichiers-disques","q":"Capacité d&#39;un disque CHS :","o":["cylindres × têtes × secteurs × octets par secteur","cylindres × secteurs × octets par secteur","têtes × secteurs × octets par secteur"],"a":0,"e":"La 2e formule donne une face (plateau), la 3e un cylindre."},{"n":"fichiers-disques","q":"Le premier secteur d&#39;un disque en CHS a l&#39;adresse :","o":["0/0/0","0/0/1","1/1/1"],"a":1,"e":"Les secteurs sont numérotés à partir de 1."},{"n":"fichiers-disques","q":"Tête en 11, requêtes 1, 36, 16, 34, 9, 12. Quelle est la première requête servie en SSTF ?","o":["9","12","1"],"a":1,"e":"12 est à 1 cylindre de 11."},{"n":"fichiers-disques","q":"Quel algorithme fait demi-tour à la dernière requête et non au bout du disque ?","o":["SCAN","LOOK","C-SCAN","FIFO"],"a":1,"e":"LOOK ne va pas plus loin que nécessaire."},{"n":"fichiers-disques","q":"Le temps de latence d&#39;un disque est :","o":["le temps pour déplacer la tête sur le cylindre","le temps pour que le secteur voulu passe sous la tête","le temps de transfert"],"a":1,"e":"Le positionnement est le seek time ; la latence dépend de la rotation."},{"n":"fichiers-disques","q":"Un fichier de 100 000 octets, blocs de 1 Ko, i-node à 12 pointeurs directs : combien de blocs en tout ?","o":["98","99","12"],"a":1,"e":"98 blocs de données (&gt; 12), donc 1 bloc d&#39;index simple en plus."}]},{"id":"synchronisation-semaphores","t":"Synchronisation · section critique, sémaphores et problèmes classiques","seance":"Chapitre 5 · Communication et synchronisation (1) · TD5","imp":5,"html":"<h2>Avant de commencer</h2>\n<p>Il te faut deux choses : un processus peut être <strong>interrompu entre deux instructions</strong> (chapitres 1 et 4), et l&#39;état <strong>bloqué</strong> (un processus qui attend un événement).</p>\n<section class=\"exo\"><h3>Vérifie ton prérequis</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>L&#39;instruction <code>V = V - 1</code> est-elle exécutée « d&#39;un seul coup » par le processeur ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Non. Elle se décompose en au moins trois étapes : <strong>lire</strong> V dans un registre, <strong>calculer</strong> V − 1, <strong>écrire</strong> le résultat dans V. L&#39;ordonnanceur peut couper le processus entre deux de ces étapes : c&#39;est la source de tous les problèmes du chapitre.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Comment aborder ce chapitre</h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p>Lis chaque solution à sémaphores en jouant <strong>l&#39;ordonnanceur méchant</strong> : coupe le processus au pire moment et regarde si quelque chose casse. Une solution est bonne seulement si aucun entrelacement ne la casse.</p>\n</aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>Écrire <code>V()</code> sans le <code>P()</code> correspondant (ou l&#39;inverse). Un sémaphore de synchronisation se lit par paires : celui qui doit <strong>attendre</strong> fait <code>P(s)</code>, celui qui <strong>autorise</strong> fait <code>V(s)</code>. Un <code>V()</code> que personne n&#39;attend ne bloque rien.</p>\n</aside><p>À la fin, tu sais repérer une section critique, la protéger par un mutex, imposer un ordre d&#39;exécution avec des sémaphores, et écrire producteur/consommateur et lecteurs/rédacteurs.</p>\n<h2>Idée 1 · Pourquoi synchroniser : l&#39;exemple du cours</h2>\n<p>Deux processus P1 et P2 décrémentent la même variable partagée V (valeur initiale v0). Chacun exécute : <code>1. x = V - 1;  2. V = x;</code></p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Un entrelacement qui perd une décrémentation</figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · P1.1</div><p>P1 lit v0 et calcule x = v0 − 1. Il est interrompu avant d&#39;écrire.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · P2.1</div><p>P2 lit V, qui vaut encore v0, et calcule x = v0 − 1.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · P2.2</div><p>P2 écrit V = v0 − 1.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · P1.2</div><p>P1 reprend et écrit SON x : V = v0 − 1.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · Bilan</div><p>V vaut v0 − 1 au lieu de v0 − 2. Le résultat dépend de l&#39;ordre d&#39;exécution : c&#39;est le non-déterminisme.</p>\n</div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><p>Les relations entre processus sont soit <strong>conflictuelles</strong> (ils partagent des ressources), soit de <strong>coopération</strong> (ils participent à un même traitement).</p>\n<table>\n<thead>\n<tr>\n<th>Mot</th>\n<th>Définition du cours</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Ressource critique</strong></td>\n<td>ressource utilisable par un seul processus à la fois (des accès concurrents mènent à un état incohérent)</td>\n</tr>\n<tr>\n<td><strong>Section critique</strong></td>\n<td>portion de code qui manipule une ressource critique</td>\n</tr>\n<tr>\n<td><strong>Exclusion mutuelle</strong></td>\n<td>garantir qu&#39;un seul processus à la fois est dans sa section critique</td>\n</tr>\n<tr>\n<td><strong>Interblocage</strong></td>\n<td>chaque processus d&#39;un groupe attend une ressource tenue par un autre du groupe : attente <strong>infinie</strong></td>\n</tr>\n<tr>\n<td><strong>Famine</strong></td>\n<td>des processus monopolisent les ressources au détriment d&#39;autres : attente <strong>indéfinie</strong></td>\n</tr>\n</tbody></table>\n<figure class=\"flux\"><figcaption>Structure d'un processus qui utilise une section critique</figcaption><div class=\"flux-l\"><div class=\"flux-b\">Partie non conflictuelle</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Protocole d&#39;acquisition</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Section critique</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Protocole de libération</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Partie non conflictuelle</div></div></figure><h2>Idée 2 · Le sémaphore : un compteur et une file</h2>\n<p>Un <strong>sémaphore</strong> est un compteur entier (≥ 0) associé à une <strong>file de processus bloqués</strong>. On n&#39;y touche que par trois opérations : l&#39;initialisation, <strong>P</strong> (<em>Puis-je ?</em>, wait, prise) et <strong>V</strong> (<em>Vas-y !</em>, signal, libération).</p>\n<svg viewBox=\"0 0 640 170\" style=\"width:100%;max-width:620px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Sémaphore : P décrémente le compteur s'il est positif, sinon bloque le processus dans la file ; V réveille un processus de la file s'il y en a, sinon incrémente le compteur\">\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\">\n<rect x=\"250\" y=\"40\" width=\"140\" height=\"90\" rx=\"10\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/>\n<text x=\"320\" y=\"68\" text-anchor=\"middle\" font-weight=\"700\">sémaphore S</text>\n<text x=\"320\" y=\"92\" text-anchor=\"middle\">compteur</text>\n<text x=\"320\" y=\"116\" text-anchor=\"middle\">file des bloqués</text>\n<text x=\"20\" y=\"60\" font-weight=\"700\">P(S)</text>\n<text x=\"20\" y=\"80\">si compteur &gt; 0 : compteur − 1</text>\n<text x=\"20\" y=\"100\">sinon : je me bloque</text>\n<text x=\"410\" y=\"60\" font-weight=\"700\">V(S)</text>\n<text x=\"410\" y=\"80\">si quelqu'un attend : le réveiller</text>\n<text x=\"410\" y=\"100\">sinon : compteur + 1</text>\n</g>\n<g stroke=\"currentColor\" stroke-width=\"2\" fill=\"none\"><line x1=\"200\" y1=\"110\" x2=\"246\" y2=\"90\"/><line x1=\"394\" y1=\"90\" x2=\"408\" y2=\"110\"/></g>\n</svg><aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>La diapo écrit <code>V()</code> ainsi : « compteur = compteur + 1 ; si (compteur &gt; 0) alors extraire un processus de la file ». Avec un compteur qui ne descend jamais sous 0 (comme dans le <code>P()</code> de la diapo), cela réveillerait un processus <strong>et</strong> laisserait un jeton en trop. Version cohérente : <strong>si la file n&#39;est pas vide, réveiller un processus ; sinon compteur + 1.</strong> (Dans la variante où le compteur peut devenir négatif, on teste « si compteur ≤ 0 après l&#39;incrément ».)</p>\n</aside><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p><strong>Analogie du cours</strong> : un parking de N places avec un feu. P = entrer (s&#39;il reste une place, sinon attendre au feu). V = sortir (on libère une place ou on laisse entrer le premier qui attend).</p>\n</aside><p><strong>Deux usages :</strong></p>\n<ul>\n<li><strong>Exclusion mutuelle</strong> : sémaphore <strong>binaire</strong> <code>mutex</code> initialisé à <strong>1</strong>. <code>P(mutex)</code> avant la section critique, <code>V(mutex)</code> après.</li>\n<li><strong>Synchronisation (ordre)</strong> : sémaphore initialisé à <strong>0</strong>. Celui qui doit attendre fait <code>P(s)</code>, celui qui donne le signal fait <code>V(s)</code>.</li>\n</ul>\n<p>Le même principe en C, avec deux threads POSIX qui incrémentent 100 000 fois chacun un compteur commun :</p>\n<pre class=\"\"><code>#include &lt;stdio.h&gt;\n#include &lt;pthread.h&gt;\n#include &lt;semaphore.h&gt;\n\nint compteur = 0;\nsem_t mutex;\n\nvoid *travail(void *arg) {\n    for (int i = 0; i &lt; 100000; i++) {\n        sem_wait(&amp;mutex);      /* P(mutex) */\n        compteur++;            /* section critique */\n        sem_post(&amp;mutex);      /* V(mutex) */\n    }\n    return NULL;\n}\n\nint main(void) {\n    sem_init(&amp;mutex, 0, 1);    /* semaphore binaire initialise a 1 */\n    pthread_t t1, t2;\n    pthread_create(&amp;t1, NULL, travail, NULL);\n    pthread_create(&amp;t2, NULL, travail, NULL);\n    pthread_join(t1, NULL);\n    pthread_join(t2, NULL);\n    printf(&quot;compteur = %d\\n&quot;, compteur);\n    return 0;\n}</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>compteur = 200000</code></pre><p>Sans <code>sem_wait</code> / <code>sem_post</code>, le résultat est <strong>variable et souvent inférieur</strong> à 200 000 (des incrémentations se perdent comme dans l&#39;exemple de V). Compile avec <code>gcc prog.c -o prog -pthread</code>.</p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p><code>sem_wait</code>, <code>sem_post</code> et les threads POSIX ne sont pas dans les diapos : c&#39;est l&#39;implémentation Linux des opérations P et V du cours. Le cours cite aussi la mémoire partagée (<code>shmget</code>, <code>shmat</code>, <code>shmdt</code>, <code>shmctl</code>).</p>\n</aside><h2>Idée 3 · Imposer un ordre : le graphe de préséance (TD5, ex. 1)</h2>\n<svg viewBox=\"0 0 640 230\" style=\"width:100%;max-width:520px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Graphe de préséance : S1 vers S2, S3 et S4 ; S2 et S3 vers S5 ; S5 et S4 vers S6\">\n<defs><marker id=\"se2fl8\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"currentColor\"/></marker></defs>\n<g font-family=\"sans-serif\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"currentColor\">\n<circle cx=\"320\" cy=\"30\" r=\"20\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/><text x=\"320\" y=\"35\">S1</text>\n<circle cx=\"200\" cy=\"100\" r=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"200\" y=\"105\">S2</text>\n<circle cx=\"300\" cy=\"100\" r=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"300\" y=\"105\">S3</text>\n<circle cx=\"440\" cy=\"100\" r=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"440\" y=\"105\">S4</text>\n<circle cx=\"250\" cy=\"160\" r=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"250\" y=\"165\">S5</text>\n<circle cx=\"340\" cy=\"205\" r=\"20\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/><text x=\"340\" y=\"210\">S6</text>\n</g>\n<g stroke=\"currentColor\" stroke-width=\"1.8\" marker-end=\"url(#se2fl8)\">\n<line x1=\"305\" y1=\"44\" x2=\"216\" y2=\"88\"/><line x1=\"317\" y1=\"50\" x2=\"304\" y2=\"79\"/><line x1=\"337\" y1=\"42\" x2=\"422\" y2=\"88\"/>\n<line x1=\"210\" y1=\"118\" x2=\"238\" y2=\"143\"/><line x1=\"292\" y1=\"119\" x2=\"262\" y2=\"143\"/>\n<line x1=\"268\" y1=\"170\" x2=\"321\" y2=\"196\"/><line x1=\"433\" y1=\"119\" x2=\"356\" y2=\"191\"/>\n</g>\n</svg><figure class=\"etapes\" data-i=\"0\"><figcaption>Méthode : un sémaphore à 0 par flèche</figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Compter les flèches</div><p>S1→S2, S1→S3, S1→S4, S2→S5, S3→S5, S5→S6, S4→S6 : 7 sémaphores, tous initialisés à 0.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Au départ d&#39;une flèche</div><p>Le processus d&#39;origine fait V(sémaphore) APRÈS son bloc d&#39;instructions.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · À l&#39;arrivée d&#39;une flèche</div><p>Le processus de destination fait P(sémaphore) AVANT son bloc.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Plusieurs flèches entrantes</div><p>Autant de P() que de flèches : S5 attend S2 ET S3.</p>\n</div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><pre class=\"\"><code>Semaphore a = 0, b = 0, c = 0, d = 0, e = 0, f = 0, g = 0;\n/* a: S1-&gt;S2  b: S1-&gt;S3  c: S1-&gt;S4  d: S2-&gt;S5  e: S3-&gt;S5  f: S5-&gt;S6  g: S4-&gt;S6 */\nProcess P1 { S1; a.V(); b.V(); c.V(); }\nProcess P2 { a.P(); S2; d.V(); }\nProcess P3 { b.P(); S3; e.V(); }\nProcess P4 { c.P(); S4; g.V(); }\nProcess P5 { d.P(); e.P(); S5; f.V(); }\nProcess P6 { f.P(); g.P(); S6; }</code></pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>Le corrigé « Rapports TD » de cet exercice ne met <strong>que des V()</strong> : sans les P(), aucun processus n&#39;attend personne et les contraintes ne sont pas respectées.</p>\n</aside><h2>Idée 4 · Producteurs / consommateurs</h2>\n<p>Des <strong>producteurs</strong> déposent des messages dans un <strong>tampon</strong> de N cases ; des <strong>consommateurs</strong> les retirent (exemple : la file d&#39;impression). Contraintes : pas de message perdu (on ne dépose pas dans un tampon plein), chaque message retiré une seule fois, et une opération impossible <strong>bloque</strong> le processus.</p>\n<pre class=\"\"><code>Semaphore Mutex  = 1;      /* exclusion mutuelle sur le tampon     */\nSemaphore Plein  = 0;      /* nombre de messages disponibles       */\nSemaphore Vide   = N;      /* nombre de cases libres               */\n\nProducteur() {                       Consommateur() {\n  Tantque Vrai faire                   Tantque Vrai faire\n    m = creermessage();                  Plein.P();     /* attend un message */\n    Vide.P();      /* attend une case */  Mutex.P();\n    Mutex.P();                            m = LectureTampon();\n    EcritureTampon(m);                    Mutex.V();\n    Mutex.V();                            Vide.V();      /* une case de plus */\n    Plein.V();     /* un message de plus */ consommer(m);\n  FinTantque                           FinTantque\n}                                    }</code></pre><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>L&#39;ordre compte : il faut faire <code>Vide.P()</code> <strong>avant</strong> <code>Mutex.P()</code>. Dans l&#39;autre sens, un producteur qui trouve le tampon plein s&#39;endort <strong>en tenant le mutex</strong> ; plus aucun consommateur ne peut entrer pour vider : <strong>interblocage</strong>.</p>\n</aside><p>Avec un tampon <strong>illimité</strong> (TD5 ex. 3, question 1), on garde seulement <code>Mutex</code> et <code>Plein</code> : les producteurs ne bloquent jamais.</p>\n<h2>Idée 5 · Lecteurs / rédacteurs</h2>\n<p>Un fichier partagé : <strong>plusieurs lecteurs</strong> peuvent lire ensemble ; un <strong>rédacteur</strong> doit être <strong>seul</strong> (ni autre rédacteur, ni lecteur).</p>\n<figure class=\"grille\"><figcaption>Accès simultanés autorisés</figcaption><table><tr><th></th><th>Lecture</th><th>Écriture</th></tr><tr><td>Lecture</td><td class=\"h1\">possible</td><td class=\"h2\">interdit</td></tr><tr><td>Écriture</td><td class=\"h2\">interdit</td><td class=\"h2\">interdit</td></tr></table></figure><pre class=\"\"><code>Semaphore Mutex = 1;    /* protège nb_lecteurs     */\nSemaphore Acces = 1;    /* accès exclusif au fichier */\nint nb_lecteurs = 0;\n\nLecteur() {                          Redacteur() {\n  Mutex.P();                           Acces.P();\n  nb_lecteurs++;                       EcrireRessource();\n  if (nb_lecteurs == 1) Acces.P();     Acces.V();\n  Mutex.V();                         }\n  LireRessource();\n  Mutex.P();\n  nb_lecteurs--;\n  if (nb_lecteurs == 0) Acces.V();\n  Mutex.V();\n}</code></pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p>Le <strong>premier</strong> lecteur ferme la porte aux rédacteurs, le <strong>dernier</strong> la rouvre. Les lecteurs suivants entrent sans attendre : conforme au cours (« si le fichier est déjà en lecture, toute nouvelle lecture est honorée, même si des rédacteurs attendent »). Revers : les rédacteurs peuvent subir une <strong>famine</strong>.</p>\n</aside><h2>S&#39;exercer</h2>\n<section class=\"exo\"><h3>TD5 et rattrapage 2025</h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>TD5 ex. 2 : <code>mutex1 = mutex2 = 1</code>. P1 : <code>mutex1.P(); mutex2.P(); out = out + 1; n = n - 1; mutex2.V(); mutex1.V();</code> ; P2 : <code>mutex2.P(); out = out - 1; mutex2.V();</code> ; P3 : <code>mutex1.P(); n = n + 1; mutex1.V();</code>. La proposition est-elle valide ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Un interblocage demande une attente circulaire : P1 attend un sémaphore tenu par X, qui attend un sémaphore tenu par P1.</p>\n</div><div class=\"ex-c\" hidden><p><strong>Oui, elle est valide.</strong> <code>out</code> est toujours modifiée sous <code>mutex2</code> (P1, P2) et <code>n</code> sous <code>mutex1</code> (P1, P3) : exclusion mutuelle respectée. Pas d&#39;interblocage possible : seul P1 prend deux sémaphores, et P2, P3 n&#39;en prennent qu&#39;un, donc aucune attente circulaire. Défaut mineur : P1 garde <code>mutex1</code> pendant qu&#39;il touche <code>out</code>, ce qui retarde P3 sans nécessité. Amélioration : <code>mutex2.P(); out = out + 1; mutex2.V(); mutex1.P(); n = n - 1; mutex1.V();</code>.\n  Attention : le corrigé « Rapports TD » conclut à un interblocage, ce qui est faux pour ce code.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Rattrapage 2025 : dans la solution <code>Mutex.P(); nb_lecteurs++; Mutex.V(); LireRessource(donnees); Mutex.P(); nb_lecteurs--; Mutex.V();</code>, quel est le problème ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p><code>Mutex</code> protège seulement le <strong>compteur</strong> : rien n&#39;empêche un rédacteur d&#39;écrire <strong>pendant</strong> qu&#39;un lecteur lit. Il faut un second sémaphore <code>Acces</code> : le premier lecteur fait <code>Acces.P()</code>, le dernier <code>Acces.V()</code>, et le rédacteur encadre son écriture par <code>Acces.P()</code> / <code>Acces.V()</code> (code de l&#39;idée 5).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>TD5 ex. 3 : tampon illimité. Adapte la solution pour bloquer les consommateurs quand le tampon est vide.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Ajouter <code>Semaphore Plein = 0</code>. Producteur : après <code>Mutex.V()</code>, faire <code>Plein.V()</code>. Consommateur : faire <code>Plein.P()</code> <strong>avant</strong> <code>Mutex.P()</code>. Pour un tampon de taille Max, ajouter <code>Vide = Max</code> (producteur : <code>Vide.P()</code> avant <code>Mutex.P()</code> ; consommateur : <code>Vide.V()</code> après <code>Mutex.V()</code>).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Laquelle est exacte ? A. Un processus peut se bloquer en libérant un sémaphore. B. Un processus peut se bloquer en demandant un sémaphore « vide » (compteur à 0). C. Un processus peut se bloquer en créant un sémaphore.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p><strong>B.</strong> Seul <code>P()</code> peut bloquer, quand le compteur est à 0. <code>V()</code> ne bloque jamais.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 11 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Deux processus font chacun <code>x = V - 1; V = x;</code> sur V = 10. Quelles valeurs finales sont possibles sans synchronisation ?</div><button class=\"opt\" data-o=\"0\">8 seulement</button><button class=\"opt\" data-o=\"1\">8 ou 9</button><button class=\"opt\" data-o=\"2\">9 seulement</button><button class=\"opt\" data-o=\"3\">10</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Un mutex est un sémaphore initialisé à :</div><button class=\"opt\" data-o=\"0\">0</button><button class=\"opt\" data-o=\"1\">1</button><button class=\"opt\" data-o=\"2\">N</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Pour obliger S2 à s&#39;exécuter après S1, on utilise un sémaphore s initialisé à 0 et :</div><button class=\"opt\" data-o=\"0\">P1 : S1; s.V();  P2 : s.P(); S2;</button><button class=\"opt\" data-o=\"1\">P1 : s.P(); S1;  P2 : S2; s.V();</button><button class=\"opt\" data-o=\"2\">P1 : S1; s.P();  P2 : s.V(); S2;</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Quelle opération peut bloquer un processus ?</div><button class=\"opt\" data-o=\"0\">P()</button><button class=\"opt\" data-o=\"1\">V()</button><button class=\"opt\" data-o=\"2\">l&#39;initialisation</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Dans producteur/consommateur avec un tampon de N cases, Vide est initialisé à :</div><button class=\"opt\" data-o=\"0\">0</button><button class=\"opt\" data-o=\"1\">1</button><button class=\"opt\" data-o=\"2\">N</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Un producteur fait <code>Mutex.P(); Vide.P();</code> et le tampon est plein. Que se passe-t-il ?</div><button class=\"opt\" data-o=\"0\">Rien de grave</button><button class=\"opt\" data-o=\"1\">Interblocage : il dort en tenant le mutex</button><button class=\"opt\" data-o=\"2\">Le message est perdu</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Lecteurs/rédacteurs : qui peut accéder en même temps ?</div><button class=\"opt\" data-o=\"0\">Plusieurs lecteurs</button><button class=\"opt\" data-o=\"1\">Un lecteur et un rédacteur</button><button class=\"opt\" data-o=\"2\">Plusieurs rédacteurs</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Une attente infinie due à une attente circulaire de ressources s&#39;appelle :</div><button class=\"opt\" data-o=\"0\">famine</button><button class=\"opt\" data-o=\"1\">interblocage</button><button class=\"opt\" data-o=\"2\">section critique</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Dans un graphe de préséance, S5 dépend de S2 et de S3. Le processus P5 commence par :</div><button class=\"opt\" data-o=\"0\">un seul P()</button><button class=\"opt\" data-o=\"1\">deux P(), un par flèche entrante</button><button class=\"opt\" data-o=\"2\">un V()</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Laquelle n&#39;est pas un mécanisme de synchronisation ou de communication du cours ?</div><button class=\"opt\" data-o=\"0\">Les sémaphores</button><button class=\"opt\" data-o=\"1\">Les tubes</button><button class=\"opt\" data-o=\"2\">Les files de messages</button><button class=\"opt\" data-o=\"3\">La pagination</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"synchronisation-semaphores","rep":null,"tol":null},{"n":"synchronisation-semaphores","rep":null,"tol":null},{"n":"synchronisation-semaphores","rep":null,"tol":null},{"n":"synchronisation-semaphores","rep":null,"tol":null},{"n":"synchronisation-semaphores","rep":null,"tol":null}],"qcm":[{"n":"synchronisation-semaphores","q":"Deux processus font chacun <code>x = V - 1; V = x;</code> sur V = 10. Quelles valeurs finales sont possibles sans synchronisation ?","o":["8 seulement","8 ou 9","9 seulement","10"],"a":1,"e":"8 si les exécutions ne se chevauchent pas, 9 si l&#39;un est coupé entre lecture et écriture."},{"n":"synchronisation-semaphores","q":"Un mutex est un sémaphore initialisé à :","o":["0","1","N"],"a":1,"e":"Un seul processus peut franchir P(mutex)."},{"n":"synchronisation-semaphores","q":"Pour obliger S2 à s&#39;exécuter après S1, on utilise un sémaphore s initialisé à 0 et :","o":["P1 : S1; s.V();  P2 : s.P(); S2;","P1 : s.P(); S1;  P2 : S2; s.V();","P1 : S1; s.P();  P2 : s.V(); S2;"],"a":0,"e":"S2 attend le signal donné après S1."},{"n":"synchronisation-semaphores","q":"Quelle opération peut bloquer un processus ?","o":["P()","V()","l&#39;initialisation"],"a":0,"e":"V ne bloque jamais."},{"n":"synchronisation-semaphores","q":"Dans producteur/consommateur avec un tampon de N cases, Vide est initialisé à :","o":["0","1","N"],"a":2,"e":"Au départ, toutes les cases sont libres."},{"n":"synchronisation-semaphores","q":"Un producteur fait <code>Mutex.P(); Vide.P();</code> et le tampon est plein. Que se passe-t-il ?","o":["Rien de grave","Interblocage : il dort en tenant le mutex","Le message est perdu"],"a":1,"e":"Les consommateurs ne peuvent plus prendre le mutex pour libérer une case."},{"n":"synchronisation-semaphores","q":"Lecteurs/rédacteurs : qui peut accéder en même temps ?","o":["Plusieurs lecteurs","Un lecteur et un rédacteur","Plusieurs rédacteurs"],"a":0,"e":"Seule la lecture est partageable."},{"n":"synchronisation-semaphores","q":"Une attente infinie due à une attente circulaire de ressources s&#39;appelle :","o":["famine","interblocage","section critique"],"a":1,"e":"L&#39;attente indéfinie (on est toujours doublé) est la famine."},{"n":"synchronisation-semaphores","q":"Dans un graphe de préséance, S5 dépend de S2 et de S3. Le processus P5 commence par :","o":["un seul P()","deux P(), un par flèche entrante","un V()"],"a":1,"e":"Il doit attendre les deux signaux."},{"n":"synchronisation-semaphores","q":"Laquelle n&#39;est pas un mécanisme de synchronisation ou de communication du cours ?","o":["Les sémaphores","Les tubes","Les files de messages","La pagination"],"a":3,"e":"La pagination relève de la gestion mémoire."}]},{"id":"ipc-tubes-signaux","t":"Communication · tubes anonymes, tubes nommés (FIFO), signaux","seance":"Chapitre 5 · Communication et synchronisation (2) · TP2 et TP3","imp":4,"html":"<h2>Avant de commencer</h2>\n<p>Il te faut <code>fork()</code> et <code>wait()</code> (chapitre 2) et savoir qu&#39;après un fork, père et fils ont des mémoires <strong>séparées</strong>.</p>\n<section class=\"exo\"><h3>Vérifie ton prérequis</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Le fils fait <code>x = 42;</code> après le fork. Le père peut-il lire 42 dans sa variable x ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Non : chacun a sa copie. Pour faire passer une donnée de l&#39;un à l&#39;autre, il faut un mécanisme de <strong>communication</strong> du système : fichier, mémoire partagée, tube, file de messages. C&#39;est l&#39;objet de ce chapitre.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Comment aborder ce chapitre</h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p>Un tube est un <strong>tuyau à sens unique</strong> : on écrit par <code>fd[1]</code>, on lit par <code>fd[0]</code> (comme stdout = 1 et stdin = 0). Avant d&#39;écrire du code, dessine qui écrit, qui lit, et barre les extrémités que chacun doit fermer.</p>\n</aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>Oublier de fermer l&#39;extrémité d&#39;<strong>écriture</strong> chez le lecteur (et chez le père). Tant qu&#39;un descripteur d&#39;écriture reste ouvert quelque part, <code>read()</code> ne voit jamais la fin du tube et <strong>bloque pour toujours</strong>. C&#39;est le bug n°1 des TP.</p>\n</aside><p>À la fin, tu sais faire communiquer père et fils par un tube, brancher deux commandes avec <code>dup2()</code>, utiliser un FIFO entre programmes indépendants et envoyer ou capter un signal.</p>\n<h2>Idée 1 · Les familles d&#39;IPC du cours</h2>\n<figure class=\"grille\"><figcaption>Les trois catégories d'outils IPC</figcaption><table><tr><th>Rôle</th><th>Outils</th></tr><tr><td>Échanger des données</td><td>fichiers, mémoire partagée (shmget, shmat, shmdt, shmctl)</td></tr><tr><td>Synchroniser</td><td class=\"h1\">sémaphores, *signaux</td></tr><tr><td>Échanger ET synchroniser</td><td class=\"h2\">tubes, !files de messages (msgget, msgsnd, msgrcv, msgctl)</td></tr></table></figure><p>Le <strong>fichier</strong> est le moyen le plus primitif (coûteux, accès disque, il faut des verrous). Les <strong>files de messages</strong> fonctionnent comme une boîte aux lettres : un message n&#39;est lu qu&#39;une fois, l&#39;envoi et la réception peuvent être bloquants ou non, avec des priorités.</p>\n<h2>Idée 2 · Le tube anonyme : pipe()</h2>\n<figure class=\"flux\"><figcaption>Père écrivain, fils lecteur</figcaption><div class=\"flux-l\"><div class=\"flux-b\">Père : write(fd[1])</div><div class=\"flux-f\">→</div><div class=\"flux-b\">[ tube FIFO ]</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Fils : read(fd[0])</div></div></figure><ul>\n<li><code>int pipe(int p[2]);</code> crée le tube : <code>p[0]</code> pour <strong>lire</strong>, <code>p[1]</code> pour <strong>écrire</strong>. Rend 0, ou −1 en cas d&#39;erreur.</li>\n<li>Le tube doit être créé <strong>avant</strong> le <code>fork()</code> : les fils héritent des descripteurs. Seuls le créateur et ses descendants peuvent l&#39;utiliser.</li>\n<li>Pas d&#39;<code>open()</code> : le tube est utilisable tout de suite ; on le ferme avec <code>close()</code>.</li>\n<li>La lecture est <strong>destructrice</strong> (une donnée lue sort du tube) et les données sortent dans l&#39;ordre d&#39;entrée (FIFO). Lecture et écriture sont <strong>bloquantes</strong> par défaut.</li>\n<li>Taille limitée (<code>PIPE_BUF</code>) : un gros message peut être découpé.</li>\n</ul>\n<pre class=\"\"><code>#include &lt;stdio.h&gt;\n#include &lt;stdlib.h&gt;\n#include &lt;string.h&gt;\n#include &lt;unistd.h&gt;\n#include &lt;sys/wait.h&gt;\n\nint main(void) {\n    int fd[2];\n    if (pipe(fd) == -1) { perror(&quot;pipe&quot;); return 1; }\n    if (fork() == 0) {                 /* fils : lecteur */\n        close(fd[1]);\n        char buf[100];\n        int n = read(fd[0], buf, 99);\n        buf[n] = '\\0';                 /* read() ne met pas le '\\0' */\n        printf(&quot;Fils a recu : %s\\n&quot;, buf);\n        close(fd[0]);\n        exit(0);\n    }\n    close(fd[0]);                      /* pere : ecrivain */\n    char *msg = &quot;Salut le fils !&quot;;\n    write(fd[1], msg, strlen(msg));\n    close(fd[1]);\n    wait(NULL);\n    return 0;\n}</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>Fils a recu : Salut le fils !</code></pre><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p><code>read()</code> n&#39;ajoute pas le <code>&#39;\\0&#39;</code> final : sans <code>buf[n] = &#39;\\0&#39;;</code>, <code>printf</code> affiche n&#39;importe quoi après le message.</p>\n</aside><p><code>read()</code> et <code>write()</code> manipulent des <strong>octets bruts</strong> : on peut faire passer des entiers ou des tableaux tant qu&#39;on connaît leur taille. TP2, exercice 5 : un fils producteur, un fils consommateur.</p>\n<pre class=\"\"><code>#include &lt;stdio.h&gt;\n#include &lt;stdlib.h&gt;\n#include &lt;unistd.h&gt;\n#include &lt;sys/wait.h&gt;\n\nint main(void) {\n    int fd[2];\n    pipe(fd);\n    if (fork() == 0) {                       /* fils 1 : producteur */\n        close(fd[0]);\n        for (int i = 1; i &lt;= 5; i++) write(fd[1], &amp;i, sizeof(int));\n        close(fd[1]);\n        exit(0);\n    }\n    if (fork() == 0) {                       /* fils 2 : consommateur */\n        close(fd[1]);\n        int x;\n        while (read(fd[0], &amp;x, sizeof(int)) &gt; 0)\n            printf(&quot;Consommateur recoit : %d\\n&quot;, x);\n        close(fd[0]);\n        exit(0);\n    }\n    close(fd[0]); close(fd[1]);              /* le pere ferme LES DEUX bouts */\n    wait(NULL); wait(NULL);\n    return 0;\n}</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>Consommateur recoit : 1\nConsommateur recoit : 2\nConsommateur recoit : 3\nConsommateur recoit : 4\nConsommateur recoit : 5</code></pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p><strong>Règle d&#39;or des TP</strong> : chaque processus ferme l&#39;extrémité qu&#39;il n&#39;utilise pas, et le <strong>père ferme les deux</strong> après ses <code>fork()</code>. Si le père gardait <code>fd[1]</code> ouvert, la boucle <code>while (read(...) &gt; 0)</code> du consommateur ne s&#39;arrêterait jamais.</p>\n</aside><h2>Idée 3 · dup2() : brancher une commande sur un tube</h2>\n<p><code>dup2(fd[1], STDOUT_FILENO)</code> signifie « désormais, écrire sur la sortie standard (1), c&#39;est écrire dans le tube ». Combiné à <code>exec</code>, cela reproduit le <code>|</code> du shell (TP « Pipes et FIFO », exercice 3, ici avec <code>echo … | wc -w</code> pour une sortie fixe).</p>\n<pre class=\"\"><code>#include &lt;stdio.h&gt;\n#include &lt;stdlib.h&gt;\n#include &lt;unistd.h&gt;\n#include &lt;sys/wait.h&gt;\n\n/* equivalent C de : echo un deux trois | wc -w */\nint main(void) {\n    int fd[2];\n    pipe(fd);\n    if (fork() == 0) {                     /* fils 1 : echo */\n        dup2(fd[1], STDOUT_FILENO);        /* stdout -&gt; entree du tube */\n        close(fd[0]); close(fd[1]);\n        execlp(&quot;echo&quot;, &quot;echo&quot;, &quot;un&quot;, &quot;deux&quot;, &quot;trois&quot;, NULL);\n        exit(1);                           /* seulement si exec echoue */\n    }\n    if (fork() == 0) {                     /* fils 2 : wc -w */\n        dup2(fd[0], STDIN_FILENO);         /* stdin &lt;- sortie du tube */\n        close(fd[0]); close(fd[1]);\n        execlp(&quot;wc&quot;, &quot;wc&quot;, &quot;-w&quot;, NULL);\n        exit(1);\n    }\n    close(fd[0]); close(fd[1]);\n    wait(NULL); wait(NULL);\n    return 0;\n}</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>3</code></pre><h2>Idée 4 · Le tube nommé (FIFO)</h2>\n<p>Un <strong>FIFO</strong> a un <strong>nom</strong> dans le système de fichiers (<code>mkfifo monfifo</code>, ou <code>mkfifo(&quot;monfifo&quot;, 0666)</code> en C ; <code>ls -l</code> affiche <code>p</code> en tête). Il relie des processus <strong>sans lien de parenté</strong>. On l&#39;ouvre avec <code>open()</code>, <strong>soit</strong> en <code>O_RDONLY</code> <strong>soit</strong> en <code>O_WRONLY</code>.</p>\n<pre class=\"\"><code>/* ecrivain.c */\nint fd = open(&quot;monfifo&quot;, O_WRONLY);       /* bloque tant qu'il n'y a pas de lecteur */\nwrite(fd, &quot;Bonjour depuis P1 !&quot;, 20);\nclose(fd);\n\n/* lecteur.c */\nchar buf[100];\nint fd = open(&quot;monfifo&quot;, O_RDONLY);       /* bloque tant qu'il n'y a pas d'écrivain */\nint n = read(fd, buf, 99); buf[n] = '\\0';\nprintf(&quot;%s\\n&quot;, buf);\nclose(fd);\nunlink(&quot;monfifo&quot;);                        /* supprimer le FIFO après usage */</code></pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p><code>open()</code> sur un FIFO <strong>bloque</strong> jusqu&#39;à ce que l&#39;autre côté soit ouvert : synchronisation gratuite. C&#39;est pourquoi le cours lance l&#39;écrivain en arrière-plan (<code>./fifo1 &amp;</code>) : seul, il resterait suspendu.</p>\n</aside><h2>Idée 5 · Les signaux</h2>\n<p>Un <strong>signal</strong> notifie un processus d&#39;un événement ; il ne transporte pas de données. Chaque signal a un comportement par défaut : terminer (avec ou sans fichier core), ignorer, stopper, reprendre.</p>\n<figure class=\"grille\"><figcaption>Signaux à connaître</figcaption><table><tr><th>N°</th><th>Nom</th><th>Rôle</th></tr><tr><td>1</td><td>SIGHUP</td><td>déconnexion du terminal</td></tr><tr><td>2</td><td class=\"h1\">SIGINT</td><td>interruption clavier (Ctrl-C)</td></tr><tr><td>3</td><td>SIGQUIT</td><td>quitter (Ctrl-\\)</td></tr><tr><td>9</td><td class=\"h1\">SIGKILL</td><td>destruction inconditionnelle (ne peut être ni capté ni ignoré)</td></tr><tr><td>10 / 12</td><td class=\"h1\">SIGUSR1 / SIGUSR2</td><td>libres pour l'utilisateur</td></tr><tr><td>11</td><td>SIGSEGV</td><td>référence mémoire invalide</td></tr><tr><td>13</td><td>SIGPIPE</td><td>écriture dans un tube sans lecteur</td></tr><tr><td>14</td><td>SIGALRM</td><td>alarme (horloge)</td></tr><tr><td>15</td><td>SIGTERM</td><td>demande de terminaison normale</td></tr><tr><td>17</td><td>SIGCHLD</td><td>un fils est mort</td></tr><tr><td>18 / 19</td><td>SIGCONT / SIGSTOP</td><td>reprendre / stopper</td></tr></table></figure><aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>Corrections du tableau des diapos : « SIGUP » s&#39;écrit <strong>SIGHUP</strong>, « SIGALARM » s&#39;écrit <strong>SIGALRM</strong>. Et <strong>Ctrl-Z</strong> envoie <strong>SIGTSTP</strong> (n° 20), pas SIGSTOP : SIGTSTP peut être capté, SIGSTOP jamais. Les numéros 10 et 12 de SIGUSR1/2 valent pour Linux sur PC.</p>\n</aside><p>Envoyer : en shell <code>kill -9 4014</code> ou <code>kill -SIGUSR1 2584</code> ; en C <code>kill(pid, SIGUSR1)</code>. <code>kill(-getpid(), sig)</code> vise tout le groupe du processus. Capter : <code>signal(SIGUSR1, handler)</code> (ou <code>sigaction()</code>). <code>pause()</code> endort jusqu&#39;au prochain signal. <code>signal(SIGCHLD, SIG_IGN)</code> évite les zombies.</p>\n<p>TP3, exercice 3 : le père envoie SIGUSR1 à son fils.</p>\n<pre class=\"\"><code>#include &lt;stdio.h&gt;\n#include &lt;stdlib.h&gt;\n#include &lt;signal.h&gt;\n#include &lt;unistd.h&gt;\n#include &lt;sys/wait.h&gt;\n\nvolatile sig_atomic_t recu = 0;\nvoid handler(int sig) { recu = sig; }\n\nint main(void) {\n    setvbuf(stdout, NULL, _IONBF, 0);   /* pas de tampon : affichage immediat */\n    signal(SIGUSR1, handler);           /* installe AVANT fork : le fils en herite */\n    pid_t pid = fork();\n    if (pid == 0) {\n        while (!recu) pause();          /* attend un signal */\n        printf(&quot;Fils : SIGUSR1 recu (numero %d)\\n&quot;, recu);\n        exit(0);\n    }\n    sleep(1);\n    printf(&quot;Pere : j'envoie SIGUSR1 au fils...\\n&quot;);\n    kill(pid, SIGUSR1);\n    wait(NULL);\n    printf(&quot;Pere : fils termine.\\n&quot;);\n    return 0;\n}</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>Pere : j'envoie SIGUSR1 au fils...\nFils : SIGUSR1 recu (numero 10)\nPere : fils termine.</code></pre><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>Installe le gestionnaire <strong>avant</strong> le <code>fork()</code> (le fils en hérite) ou au tout début du fils. Si le signal arrive avant l&#39;installation, le comportement par défaut de SIGUSR1 s&#39;applique : le fils <strong>meurt</strong>.</p>\n</aside><h2>S&#39;exercer</h2>\n<section class=\"exo\"><h3>TP2 et TP3</h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Le père crée un tube, forke, écrit dans <code>fd[1]</code> mais ne ferme jamais <code>fd[1]</code>. Le fils lit en boucle jusqu&#39;à <code>read() == 0</code>. Que se passe-t-il ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Le fils lit le message puis <strong>reste bloqué</strong> : tant qu&#39;une extrémité d&#39;écriture est ouverte (celle du père), le système ne signale pas la fin du tube. Il faut <code>close(fd[1])</code> chez le père après l&#39;écriture.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Différence entre <code>who &amp; ps &amp; ls -l</code> et <code>who ; ps ; ls -l</code>, traduits en C (TP2, ex. 2 et 3) ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p><code>&amp;</code> : le père fait 3 <code>fork()</code> d&#39;affilée, puis 3 <code>wait()</code> : les commandes tournent en parallèle, ordre d&#39;affichage non garanti. <code>;</code> : <code>fork()</code>, <code>wait()</code>, <code>fork()</code>, <code>wait()</code>… : une commande à la fois, ordre garanti.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Pourquoi un tube anonyme ne peut-il pas relier deux programmes lancés dans deux terminaux ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Il n&#39;a pas de nom : il n&#39;existe que dans les tables de descripteurs, qui ne se transmettent que par <code>fork()</code>. Il faut un <strong>FIFO</strong> (tube nommé).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Le père fait <code>kill(-getpid(), SIGUSR1)</code> pour prévenir ses 3 fils, sans précaution. Que lui arrive-t-il ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Il fait partie du groupe : il reçoit aussi SIGUSR1 et, avec le comportement par défaut, <strong>se termine</strong>. D&#39;où le <code>signal(SIGUSR1, SIG_IGN)</code> dans le père (TP3, ex. 4).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 10 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Dans <code>int fd[2]; pipe(fd);</code>, on écrit dans :</div><button class=\"opt\" data-o=\"0\">fd[0]</button><button class=\"opt\" data-o=\"1\">fd[1]</button><button class=\"opt\" data-o=\"2\">les deux</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Un tube anonyme permet la communication entre :</div><button class=\"opt\" data-o=\"0\">deux programmes quelconques</button><button class=\"opt\" data-o=\"1\">le processus créateur et ses descendants</button><button class=\"opt\" data-o=\"2\">deux machines</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Après <code>read()</code> d&#39;une chaîne dans un tube, il faut souvent :</div><button class=\"opt\" data-o=\"0\">ajouter le caractère &#39;\\0&#39; à la fin</button><button class=\"opt\" data-o=\"1\">appeler open()</button><button class=\"opt\" data-o=\"2\">appeler wait()</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Quelle primitive crée un tube nommé ?</div><button class=\"opt\" data-o=\"0\">pipe()</button><button class=\"opt\" data-o=\"1\">mkfifo()</button><button class=\"opt\" data-o=\"2\">dup2()</button><button class=\"opt\" data-o=\"3\">shmget()</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\"><code>open(&quot;monfifo&quot;, O_WRONLY)</code> sans aucun lecteur :</div><button class=\"opt\" data-o=\"0\">échoue tout de suite</button><button class=\"opt\" data-o=\"1\">bloque jusqu&#39;à l&#39;ouverture en lecture</button><button class=\"opt\" data-o=\"2\">écrit dans le vide</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Quel signal ne peut être ni capté ni ignoré ?</div><button class=\"opt\" data-o=\"0\">SIGTERM</button><button class=\"opt\" data-o=\"1\">SIGINT</button><button class=\"opt\" data-o=\"2\">SIGKILL</button><button class=\"opt\" data-o=\"3\">SIGUSR1</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Quel signal reçoit un processus qui écrit dans un tube sans lecteur ?</div><button class=\"opt\" data-o=\"0\">SIGPIPE</button><button class=\"opt\" data-o=\"1\">SIGSEGV</button><button class=\"opt\" data-o=\"2\">SIGCHLD</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Les signaux servent principalement à :</div><button class=\"opt\" data-o=\"0\">transférer de gros volumes de données</button><button class=\"opt\" data-o=\"1\">notifier un événement</button><button class=\"opt\" data-o=\"2\">partager la mémoire</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Quel est l&#39;effet de <code>dup2(fd[0], STDIN_FILENO)</code> ?</div><button class=\"opt\" data-o=\"0\">Ce que le processus lit sur l&#39;entrée standard vient du tube</button><button class=\"opt\" data-o=\"1\">Ce que le processus écrit va dans le tube</button><button class=\"opt\" data-o=\"2\">Le tube est fermé</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Les files de messages se manipulent avec :</div><button class=\"opt\" data-o=\"0\">shmget, shmat</button><button class=\"opt\" data-o=\"1\">msgget, msgsnd, msgrcv, msgctl</button><button class=\"opt\" data-o=\"2\">pipe, read, write</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"ipc-tubes-signaux","rep":null,"tol":null},{"n":"ipc-tubes-signaux","rep":null,"tol":null},{"n":"ipc-tubes-signaux","rep":null,"tol":null},{"n":"ipc-tubes-signaux","rep":null,"tol":null},{"n":"ipc-tubes-signaux","rep":null,"tol":null}],"qcm":[{"n":"ipc-tubes-signaux","q":"Dans <code>int fd[2]; pipe(fd);</code>, on écrit dans :","o":["fd[0]","fd[1]","les deux"],"a":1,"e":"fd[0] lecture, fd[1] écriture."},{"n":"ipc-tubes-signaux","q":"Un tube anonyme permet la communication entre :","o":["deux programmes quelconques","le processus créateur et ses descendants","deux machines"],"a":1,"e":"Il faut hériter des descripteurs par fork()."},{"n":"ipc-tubes-signaux","q":"Après <code>read()</code> d&#39;une chaîne dans un tube, il faut souvent :","o":["ajouter le caractère &#39;\\0&#39; à la fin","appeler open()","appeler wait()"],"a":0,"e":"read ne termine pas la chaîne."},{"n":"ipc-tubes-signaux","q":"Quelle primitive crée un tube nommé ?","o":["pipe()","mkfifo()","dup2()","shmget()"],"a":1,"e":"mkfifo (ou mknod)."},{"n":"ipc-tubes-signaux","q":"<code>open(&quot;monfifo&quot;, O_WRONLY)</code> sans aucun lecteur :","o":["échoue tout de suite","bloque jusqu&#39;à l&#39;ouverture en lecture","écrit dans le vide"],"a":1,"e":"Synchronisation automatique du FIFO."},{"n":"ipc-tubes-signaux","q":"Quel signal ne peut être ni capté ni ignoré ?","o":["SIGTERM","SIGINT","SIGKILL","SIGUSR1"],"a":2,"e":"SIGKILL (9), comme SIGSTOP."},{"n":"ipc-tubes-signaux","q":"Quel signal reçoit un processus qui écrit dans un tube sans lecteur ?","o":["SIGPIPE","SIGSEGV","SIGCHLD"],"a":0,"e":"Signal 13."},{"n":"ipc-tubes-signaux","q":"Les signaux servent principalement à :","o":["transférer de gros volumes de données","notifier un événement","partager la mémoire"],"a":1,"e":"Le cours : « limités au rôle de notification d&#39;événement »."},{"n":"ipc-tubes-signaux","q":"Quel est l&#39;effet de <code>dup2(fd[0], STDIN_FILENO)</code> ?","o":["Ce que le processus lit sur l&#39;entrée standard vient du tube","Ce que le processus écrit va dans le tube","Le tube est fermé"],"a":0,"e":"Côté lecteur d&#39;un pipeline (wc -l par exemple)."},{"n":"ipc-tubes-signaux","q":"Les files de messages se manipulent avec :","o":["shmget, shmat","msgget, msgsnd, msgrcv, msgctl","pipe, read, write"],"a":1,"e":"Primitives citées par le cours."}]},{"id":"td-tp-corriges","t":"TD 1 à 5 et TP 1 à 3 corrigés","seance":"Travaux dirigés et pratiques","imp":4,"html":"<p>Ce chapitre regroupe <strong>toutes les réponses</strong> des TD et TP, recalculées. Les méthodes sont expliquées dans les chapitres 1 à 9 ; ici, on va droit au résultat. Fais chaque exercice sur papier avant de lire.</p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>Le document « Rapports TD SE2 » qui circule (corrigé d&#39;étudiant, 2024) contient des erreurs : données recopiées de travers (TD2 ex. 2, TD3 ex. 3), tableaux de temps faux, i-node, FAT, préséance et TD5 ex. 2. Chaque erreur est signalée ci-dessous.</p>\n</aside><h2>TD1 · Processus</h2>\n<figure class=\"grille\"><figcaption>TD1, exercices 2, 3 et 5</figcaption><table><tr><th>Code</th><th>Processus au total</th><th>Remarque</th></tr><tr><td>fork(); fork();</td><td class=\"h1\">4</td><td>2²</td></tr><tr><td>if (fork() &gt; 0) fork();</td><td class=\"h1\">3</td><td>seul le père re-forke</td></tr><tr><td>while (cpt &lt; 3) { if (fork() &gt; 0) cpt++; else cpt = 3; }</td><td class=\"h1\">4</td><td>le père crée 3 fils</td></tr><tr><td>fork1 / fork2 / fork3 (ex. 3)</td><td class=\"h1\">8</td><td>« fork1 » ×2, « fork2 » ×4, « fork3 » ×8</td></tr><tr><td>fork(); fork(); fork(); printf(&quot;hello&quot;) (ex. 5)</td><td class=\"h1\">8</td><td>8 « hello »</td></tr></table></figure><aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>Le corrigé étudiant donne « fork1 : 1, fork2 : 2, fork3 : 4 ». C&#39;est faux : « fork1 » est affiché <strong>après</strong> le premier fork, donc par 2 processus ; « fork2 » par 4 ; « fork3 » par 8. Total 14 lignes.</p>\n</aside><p>Ex. 1 : a <strong>faux</strong>, b <strong>vrai</strong>, c <strong>faux</strong> (chapitre 1). Ex. 4 : programme corrigé testé au chapitre 2. Ex. 6 (chaîne et arbre) : chapitre 2, idée 5 ; le corrigé étudiant inverse les deux structures, et sa boucle d&#39;affichage commence à 0 au lieu de 1.</p>\n<h2>TD2 · Ordonnancement</h2>\n<figure class=\"grille\"><figcaption>TD2 ex. 2 : P1 (0,3), P2 (2,6), P3 (4,4), P4 (6,5), P5 (8,2)</figcaption><table><tr><th>Algorithme</th><th>Gantt</th><th>TMR</th><th>TMA</th></tr><tr><td>FCFS</td><td>P1 0–3, P2 3–9, P3 9–13, P4 13–18, P5 18–20</td><td>8,6</td><td class=\"h1\">4,6</td></tr><tr><td>SJF</td><td>P1 0–3, P2 3–9, P5 9–11, P3 11–15, P4 15–20</td><td>7,6</td><td class=\"h1\">3,6</td></tr><tr><td>SRTF</td><td>P1 0–3, P2 3–4, P3 4–8, P5 8–10, P2 10–15, P4 15–20</td><td>7,2</td><td class=\"h1\">3,2</td></tr></table></figure><p>Débit identique pour les trois : 5 processus en 20 unités = <strong>0,25</strong> processus par unité de temps.</p>\n<figure class=\"grille\"><figcaption>TD2 ex. 3 : A (0,3), B (1,6), C (4,4), D (6,2)</figcaption><table><tr><th>Algorithme</th><th>Gantt</th><th>TMR</th><th>TMA</th></tr><tr><td>SRTF</td><td>A 0–3, B 3–4, C 4–8, D 8–10, B 10–15</td><td>6,25</td><td class=\"h1\">2,5</td></tr><tr><td>RR q = 2</td><td>A 0–2, B 2–4, A 4–5, C 5–7, B 7–9, D 9–11, C 11–13, B 13–15</td><td>8,25</td><td class=\"h1\">4,5</td></tr></table></figure><figure class=\"grille\"><figcaption>TD2 ex. 4 (grand nombre = prioritaire)</figcaption><table><tr><th>Mode</th><th>Gantt</th><th>TMR</th><th>TMA</th></tr><tr><td>Non préemptif</td><td>A 0–5, C 5–7, D 7–11, B 11–15</td><td>7,5</td><td class=\"h1\">3,75</td></tr><tr><td>Préemptif</td><td>A 0–2, C 2–4, A 4–7, D 7–11, B 11–15</td><td>7,25</td><td class=\"h1\">3,5</td></tr></table></figure><aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>Le corrigé étudiant inverse TMR et TMA dans plusieurs tableaux (ex. « TMR = 3,6 » pour SJF), recopie P4 avec une arrivée à 5 et donne pour RR un TMA de 4 au lieu de 4,5. Il a aussi échangé les colonnes de l&#39;ex. 4 (TMA 7,5 annoncé au lieu de 3,75).</p>\n</aside><p>Ex. 1 : FCFS (non préemptif), SJF (deux versions), SRTF (préemptif), RR (préemptif), priorités (deux versions) ; quantum grand → FCFS ; <strong>n!</strong> ordres possibles ; SJF = priorités avec priorité = 1/durée.</p>\n<h2>TD3 · Mémoire</h2>\n<p>Ex. 1 : a → <strong>1111010101010</strong> (7850), b → <strong>110000000001</strong> (3073). Ex. 2 : 4 Ko → (4, 3616), (8, 0), (15, 2656) ; 8 Ko → (2, 3616), (4, 0), (7, 6752). Ex. 4 et ex. 5 : chapitre 5 (668, 1354, erreur, 2936, 1076, erreur ; (4,200) invalide ; 1008, 34, 1322, erreur, défaut de page). Ex. 5 q. 5 : page 0 → cadre 0011 → <strong>0011 0000 0000 0111</strong>.</p>\n<p><strong>Ex. 3, question 1</strong> (on suppose qu&#39;une zone prise est entièrement occupée, puisque le découpage n&#39;est introduit qu&#39;à la question 2) :</p>\n<figure class=\"grille\"><figcaption>TD3 ex. 3.1 : z1=11, z2=4, z3=24, z4=18, z5=7, z6=9, z7=14, z8=15 Ko</figcaption><table><tr><th>Requête</th><th>First-fit</th><th>Next-fit</th><th>Best-fit</th><th>Worst-fit</th></tr><tr><td>12 Ko</td><td>z3</td><td>z3</td><td class=\"h1\">z7</td><td>z3</td></tr><tr><td>10 Ko</td><td>z1</td><td>z4</td><td>z1</td><td>z4</td></tr><tr><td>9 Ko</td><td>z4</td><td>z6</td><td>z6</td><td>z8</td></tr></table></figure><p><strong>Ex. 3, question 2</strong> (avec découpage ; Zi1 = partie prise, Zi2 = reste libre, Zi3 = reste après un second découpage) :</p>\n<figure class=\"grille\"><figcaption>TD3 ex. 3.2 : Z1=3, Z2=14, Z3=12, Z4=8, Z5=4, Z6=5 Ko</figcaption><table><tr><th>Requête</th><th>First-fit</th><th>Next-fit</th><th>Best-fit</th><th>Worst-fit</th></tr><tr><td>7 Ko</td><td>Z21</td><td>Z21</td><td>Z41</td><td>Z21</td></tr><tr><td>2 Ko</td><td>Z11</td><td>Z22</td><td class=\"h1\">Z11</td><td class=\"h1\">Z31</td></tr><tr><td>5 Ko</td><td>Z22</td><td>Z23</td><td>Z6</td><td class=\"h1\">Z32</td></tr><tr><td>8 Ko</td><td>Z31</td><td>Z31</td><td>Z31</td><td class=\"h1\">Z4</td></tr></table></figure><aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>Le corrigé étudiant remplace z1 = 11 par 10, place 12 Ko dans z4 en best-fit (la plus petite zone ≥ 12 est z7 = 14), place 2 Ko dans Z42 en best-fit (Z42 ne fait que 1 Ko) et suit mal le worst-fit de la question 2 (après 7 Ko, la plus grande zone est Z3 = 12, pas le reste de Z2 = 7).</p>\n</aside><h2>TD4 · Fichiers et disque</h2>\n<p>64 Go / 4 Ko → 2²⁴ blocs, <strong>24 bits</strong>, FAT de 48 Mo = <strong>12 288 blocs</strong>. 16 Go / 8 Ko → 2²¹ blocs : FAT max <strong>8 Mo</strong>, min <strong>5,25 Mo</strong> (21 bits). i-node (1 Ko, pointeurs 4 octets) : max ≈ <strong>16,06 Go</strong> ; 532 Ko → 532 blocs de données + 4 d&#39;index ; 100 000 octets → 98 + 1 = <strong>99 blocs</strong>. Disque (345, vers 0) : FIFO <strong>2013</strong>, SSTF <strong>1298</strong>, SCAN <strong>1219</strong>. Détails : chapitre 7.</p>\n<p><strong>SSTF favorise le centre</strong> : on a intérêt à placer au centre du disque les données les plus utilisées (répertoires, i-nodes, FAT), et à surveiller la famine des pistes extrêmes.</p>\n<h2>TD5 · Synchronisation (et ex. 1 de l&#39;ancien TD5 « disque »)</h2>\n<p>Préséance : 7 sémaphores à 0, un par flèche (chapitre 8). Ex. 2 : <strong>valide</strong>, pas d&#39;interblocage (chapitre 8). Ex. 3 : producteur/consommateur avec Mutex, Plein, Vide. Capacité CHS : cylindre 8 064 000 octets, plateau 32 901 120 octets, disque 8 225 280 000 octets.</p>\n<h2>TP1 à TP3 · Programmation système</h2>\n<table>\n<thead>\n<tr>\n<th>TP</th>\n<th>Ce qu&#39;il faut savoir écrire</th>\n<th>Où</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>TP1</td>\n<td>fork + getpid/getppid, wait + WEXITSTATUS, execlp/execvp, chaîne, arbre</td>\n<td>chapitre 2</td>\n</tr>\n<tr>\n<td>TP2</td>\n<td>mémoire séparée après fork, <code>&amp;</code> contre <code>;</code>, pipe père → fils, producteur/consommateur</td>\n<td>chapitres 2 et 9</td>\n</tr>\n<tr>\n<td>TP3</td>\n<td>zombie (et <code>signal(SIGCHLD, SIG_IGN)</code>), FIFO, SIGUSR1, <code>kill(-getpid())</code>, client/serveur FIFO + signal</td>\n<td>chapitres 2 et 9</td>\n</tr>\n<tr>\n<td>TP « Pipes et FIFO »</td>\n<td>majuscules avec <code>toupper</code>, deux tubes aller-retour, <code>ls</code> branché sur <code>wc -l</code> avec dup2</td>\n<td>chapitre 9</td>\n</tr>\n</tbody></table>\n<p>TP2, ex. 1 : le fils affiche <strong>200</strong>, le père <strong>300</strong> ; les adresses de <code>n</code> sont <strong>identiques</strong> (adresses virtuelles), mais les pages physiques diffèrent.</p>\n<pre class=\"\"><code>/* TP « Pipes et FIFO », ex. 2 : deux tubes. Le pere envoie 10 entiers, le fils renvoie somme, min, max. */\nint aller[2], retour[2];\npipe(aller); pipe(retour);\nif (fork() == 0) {\n    close(aller[1]); close(retour[0]);\n    int t[10], r[3];\n    read(aller[0], t, sizeof t);\n    r[0] = 0; r[1] = r[2] = t[0];\n    for (int i = 0; i &lt; 10; i++) { r[0] += t[i]; if (t[i] &lt; r[1]) r[1] = t[i]; if (t[i] &gt; r[2]) r[2] = t[i]; }\n    write(retour[1], r, sizeof r);\n    exit(0);\n}\nclose(aller[0]); close(retour[1]);\nwrite(aller[1], tab, 10 * sizeof(int)); close(aller[1]);\nread(retour[0], res, 3 * sizeof(int)); wait(NULL);</code></pre><h2>S&#39;exercer</h2>\n<section class=\"exo\"><h3>Refaire les points délicats</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>TD2 ex. 3 en RR (q = 2) : à t = 4, quelle est la file des prêts juste après la préemption de B ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>C arrive à 4 et entre en premier, puis B est remis en queue. A était déjà en attente : file <strong>[A, C, B]</strong>.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>TD3 ex. 3.1, best-fit pour 12 Ko : quelle zone ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Zones ≥ 12 : 24, 18, 14, 15. La plus petite est <strong>z7 = 14 Ko</strong>.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>TD1 ex. 3 : combien de lignes affichées au total ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 14</b></p><p>2 + 4 + 8 = <strong>14</strong>.</p>\n</div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 7 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">TD2 ex. 2 en SRTF, quel processus s&#39;exécute de 4 à 8 ?</div><button class=\"opt\" data-o=\"0\">P2</button><button class=\"opt\" data-o=\"1\">P3</button><button class=\"opt\" data-o=\"2\">P4</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">TD2 ex. 2 en SJF non préemptif, qui passe à t = 9 ?</div><button class=\"opt\" data-o=\"0\">P3</button><button class=\"opt\" data-o=\"1\">P4</button><button class=\"opt\" data-o=\"2\">P5</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">TD2 ex. 3 en RR q = 2, quand A termine-t-il ?</div><button class=\"opt\" data-o=\"0\">3</button><button class=\"opt\" data-o=\"1\">5</button><button class=\"opt\" data-o=\"2\">7</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">TD3 ex. 3.2 en best-fit, où vont les 2 Ko demandés en 2e ?</div><button class=\"opt\" data-o=\"0\">Z1 (3 Ko)</button
