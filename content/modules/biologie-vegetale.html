const MODULE={"slug":"biologie-vegetale","titre":"Biologie végétale","cle":"biologie-vegetale_scores","cleEtat":"biologie-vegetale_scores_etat","format":"score10","intro":"<p>Ce module suit <strong>le cours de Biologie végétale de la FST Béni Mellal<\/strong> (BCG S3) : des algues aux plantes à fleurs, puis <strong>les contrôles corrigés<\/strong>.<\/p>\n<p><strong>Comment l&#39;utiliser<\/strong><\/p>\n<ol>\n<li>Retiens d&#39;abord la classification du chapitre 1 : tout le reste s&#39;y range.<\/li>\n<li>Pour chaque groupe, apprends : appareil végétatif, conduction, reproduction, cycle.<\/li>\n<li>Fais le QCM du chapitre. <strong>8/10 = chapitre maîtrisé.<\/strong> Attention : au contrôle, une réponse fausse retire des points.<\/li>\n<\/ol>\n<p><strong>À vérifier<\/strong> : le cours est rédigé par nous à partir des chapitres fournis ; les réponses des contrôles ne figurent pas dans les fichiers.<\/p>\n","annexes":[],"cartes":null,"maths":false};
const CHAPS=[{"id":"classification","t":"Classification des végétaux","seance":"Introduction · Généralités","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut distinguer haploïde (n chromosomes) et diploïde (2n).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>La fécondation fait passer de… à… ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>De n à 2n (deux gamètes haploïdes donnent un zygote diploïde). La méiose fait l&#39;inverse.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « deux grandes coupures ».<\/strong> Thalle ou cormus (tige, feuilles, racines) ; puis spores ou graines.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Ranger les champignons parmi les plantes chlorophylliennes. Ils n&#39;ont <strong>pas de chlorophylle<\/strong> : ils sont hétérotrophes.<\/p>\n<\/aside><p>À la fin, tu sais placer n&#39;importe quel groupe dans l&#39;arbre de classification.<\/p>\n<h2>Idée 1 · L&#39;arbre<\/h2>\n<figure class=\"grille\"><figcaption>Les grands groupes<\/figcaption><table><tr><th>Groupe,<\/th><th>Appareil<\/th><th>végétatif,<\/th><th>Vaisseaux,<\/th><th>Dissémination<\/th><\/tr><tr><td class=\"h1\">Thallophytes<\/td><td>(algues,<\/td><td>champignons),<\/td><td>thalle,<\/td><td>non,<\/td><td>spores<\/td><\/tr><tr><td class=\"h1\">Bryophytes<\/td><td>(mousses,<\/td><td>hépatiques),<\/td><td>petit<\/td><td>cormus<\/td><td>sans<\/td><td>vraies<\/td><td>racines,<\/td><td>non<\/td><td>(hadrome<\/td><td>et<\/td><td>leptome),<\/td><td>spores<\/td><\/tr><tr><td class=\"h1\">Cryptogames<\/td><td>vasculaires<\/td><td>(fougères,<\/td><td>prêles,<\/td><td>lycopodes),<\/td><td>cormus,<\/td><td>oui,<\/td><td>spores<\/td><\/tr><tr><td class=\"h1\">Gymnospermes<\/td><td>(conifères,<\/td><td>Ginkgo,<\/td><td>Gnétophytes),<\/td><td>cormus,<\/td><td>oui,<\/td><td>graines<\/td><td>nues<\/td><\/tr><tr><td class=\"h1\">Angiospermes<\/td><td>(plantes<\/td><td>à<\/td><td>fleurs),<\/td><td>cormus,<\/td><td>oui,<\/td><td>graines<\/td><td>dans<\/td><td>un<\/td><td>fruit<\/td><\/tr><\/table><\/figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Embryophytes = toutes les plantes dont le zygote donne un embryo protégé : Bryophytes + Trachéophytes (Cryptogames vasculaires et Spermaphytes). Anthophytes = plantes à fleurs.<\/p>\n<\/aside><h2>Idée 2 · Les cycles de développement<\/h2>\n<svg viewBox=\"0 0 320 120\" role=\"img\" aria-label=\"Cycle haplodiplophasique : gamétophyte n, fécondation, sporophyte 2n, méiose, spores n\" style=\"max-width:360px;width:100%\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><ellipse cx=\"160\" cy=\"60\" rx=\"120\" ry=\"45\"/><path d=\"M40 60h-6M280 60h6\"/><\/g>\n<g fill=\"currentColor\" font-size=\"10\"><text x=\"120\" y=\"12\">fécondation<\/text><text x=\"120\" y=\"118\">méiose<\/text><text x=\"12\" y=\"52\">gamétophyte n<\/text><text x=\"232\" y=\"52\">sporophyte 2n<\/text><\/g>\n<\/svg><figure class=\"grille\"><figcaption>Trois types de cycles<\/figcaption><table><tr><th>Cycle,<\/th><th>Phase<\/th><th>dominante,<\/th><th>Exemple<\/th><\/tr><tr><td class=\"h1\">Haplophasique,<\/td><td>n<\/td><td>(seul<\/td><td>le<\/td><td>zygote<\/td><td>est<\/td><td>2n),<\/td><td>beaucoup<\/td><td>de<\/td><td>champignons<\/td><td>et<\/td><td>d'algues<\/td><\/tr><tr><td class=\"h1\">Diplophasique,<\/td><td>2n<\/td><td>(seuls<\/td><td>les<\/td><td>gamètes<\/td><td>sont<\/td><td>n),<\/td><td>Fucus<\/td><\/tr><tr><td class=\"h1\">Haplodiplophasique,<\/td><td>alternance<\/td><td>de<\/td><td>deux<\/td><td>générations,<\/td><td>mousses<\/td><td>(n<\/td><td>dominante),<\/td><td>fougères<\/td><td>(2n<\/td><td>dominante)<\/td><\/tr><\/table><\/figure><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Application<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Une plante a des vaisseaux, pas de fleurs et se dissémine par spores. Groupe ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Cryptogame vasculaire (une fougère par exemple).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Chez une mousse, la plante verte feuillée est-elle n ou 2n ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>n : c&#39;est le gamétophyte. Le sporophyte (soie + capsule) est 2n et vit sur lui.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Les champignons sont :<\/div><button class=\"opt\" data-o=\"0\">hétérotrophes<\/button><button class=\"opt\" data-o=\"1\">chlorophylliens<\/button><button class=\"opt\" data-o=\"2\">des plantes vasculaires<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Les Anthophytes sont :<\/div><button class=\"opt\" data-o=\"0\">les plantes à fleurs<\/button><button class=\"opt\" data-o=\"1\">les mousses<\/button><button class=\"opt\" data-o=\"2\">les algues<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Les Bryophytes possèdent :<\/div><button class=\"opt\" data-o=\"0\">un petit cormus sans vraies racines<\/button><button class=\"opt\" data-o=\"1\">des vaisseaux lignifiés<\/button><button class=\"opt\" data-o=\"2\">des graines<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Les Gymnospermes ont des graines :<\/div><button class=\"opt\" data-o=\"0\">nues<\/button><button class=\"opt\" data-o=\"1\">enfermées dans un fruit<\/button><button class=\"opt\" data-o=\"2\">absentes<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Chez la fougère, la phase dominante est :<\/div><button class=\"opt\" data-o=\"0\">le sporophyte 2n<\/button><button class=\"opt\" data-o=\"1\">le gamétophyte n<\/button><button class=\"opt\" data-o=\"2\">le zygote<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Les plantes dites « à spores » :<\/div><button class=\"opt\" data-o=\"0\">Thallophytes, Bryophytes, Cryptogames vasculaires<\/button><button class=\"opt\" data-o=\"1\">Gymnospermes<\/button><button class=\"opt\" data-o=\"2\">Angiospermes<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Un cycle diplophasique :<\/div><button class=\"opt\" data-o=\"0\">n&#39;a que les gamètes haploïdes<\/button><button class=\"opt\" data-o=\"1\">n&#39;a que le zygote diploïde<\/button><button class=\"opt\" data-o=\"2\">alterne deux générations<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">La méiose fait passer :<\/div><button class=\"opt\" data-o=\"0\">de 2n à n<\/button><button class=\"opt\" data-o=\"1\">de n à 2n<\/button><button class=\"opt\" data-o=\"2\">de n à n<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Les Trachéophytes possèdent :<\/div><button class=\"opt\" data-o=\"0\">des vaisseaux conducteurs<\/button><button class=\"opt\" data-o=\"1\">un thalle<\/button><button class=\"opt\" data-o=\"2\">uniquement des rhizoïdes<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Une algue est :<\/div><button class=\"opt\" data-o=\"0\">un thallophyte chlorophyllien<\/button><button class=\"opt\" data-o=\"1\">un embryophyte<\/button><button class=\"opt\" data-o=\"2\">un champignon<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"classification","rep":null,"tol":null},{"n":"classification","rep":null,"tol":null},{"n":"classification","rep":null,"tol":null}],"qcm":[{"n":"classification","q":"Les champignons sont :","o":["hétérotrophes","chlorophylliens","des plantes vasculaires"],"a":0,"e":"Pas de chlorophylle."},{"n":"classification","q":"Les Anthophytes sont :","o":["les plantes à fleurs","les mousses","les algues"],"a":0,"e":"Angiospermes."},{"n":"classification","q":"Les Bryophytes possèdent :","o":["un petit cormus sans vraies racines","des vaisseaux lignifiés","des graines"],"a":0,"e":"Rhizoïdes."},{"n":"classification","q":"Les Gymnospermes ont des graines :","o":["nues","enfermées dans un fruit","absentes"],"a":0,"e":"Pas d&#39;ovaire."},{"n":"classification","q":"Chez la fougère, la phase dominante est :","o":["le sporophyte 2n","le gamétophyte n","le zygote"],"a":0,"e":"Le prothalle est petit."},{"n":"classification","q":"Les plantes dites « à spores » :","o":["Thallophytes, Bryophytes, Cryptogames vasculaires","Gymnospermes","Angiospermes"],"a":0,"e":"Cryptogames."},{"n":"classification","q":"Un cycle diplophasique :","o":["n&#39;a que les gamètes haploïdes","n&#39;a que le zygote diploïde","alterne deux générations"],"a":0,"e":"Fucus, et les animaux."},{"n":"classification","q":"La méiose fait passer :","o":["de 2n à n","de n à 2n","de n à n"],"a":0,"e":"Réduction chromatique."},{"n":"classification","q":"Les Trachéophytes possèdent :","o":["des vaisseaux conducteurs","un thalle","uniquement des rhizoïdes"],"a":0,"e":"Trachéides, vaisseaux."},{"n":"classification","q":"Une algue est :","o":["un thallophyte chlorophyllien","un embryophyte","un champignon"],"a":0,"e":"Autotrophe."}]},{"id":"algues","t":"Les algues (Phycophytes)","seance":"Thallophytes · Chapitre 1","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir que la chlorophylle a est présente chez tous les organismes photosynthétiques oxygéniques.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Une algue rouge contient-elle de la chlorophylle a ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Oui : toutes les algues ont la chlorophylle a. Ce sont les pigments accessoires qui changent.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « couleur = pigments = groupe ».<\/strong> Verte (chlorophylles a et b), brune (fucoxanthine), rouge (phycoérythrine).<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Dire que les grandes algues ont des racines ou des vaisseaux. Même les laminaires géantes n&#39;ont <strong>ni racines ni vaisseaux<\/strong> : elles se fixent par des <strong>crampons<\/strong> (haptères).<\/p>\n<\/aside><p>À la fin, tu sais classer une algue par ses pigments, ses réserves et son type de thalle.<\/p>\n<h2>Idée 1 · Les trois grands groupes<\/h2>\n<figure class=\"grille\"><figcaption>Comparaison<\/figcaption><table><tr><th>Groupe,<\/th><th>Pigments<\/th><th>accessoires,<\/th><th>Réserve,<\/th><th>Exemple<\/th><\/tr><tr><td class=\"h1\">Chlorophycophytes<\/td><td>(vertes),<\/td><td>chlorophylle<\/td><td>b,<\/td><td>amidon<\/td><td>(dans<\/td><td>le<\/td><td>plaste),<\/td><td>Ulva,<\/td><td>Chlamydomonas<\/td><\/tr><tr><td class=\"h1\">Chromophycophytes<\/td><td>(brunes…),<\/td><td>chlorophylle<\/td><td>c,<\/td><td>fucoxanthine,<\/td><td>laminarine,<\/td><td>mannitol,<\/td><td>Fucus,<\/td><td>Laminaria<\/td><\/tr><tr><td class=\"h1\">Rhodophycophytes<\/td><td>(rouges),<\/td><td>phycoérythrine<\/td><td>(phycobilisomes),<\/td><td>amidon<\/td><td>floridéen<\/td><td>(hors<\/td><td>du<\/td><td>plaste),<\/td><td>Porphyra<\/td><\/tr><\/table><\/figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Chez les algues rouges, les thylakoïdes sont isolés (non groupés), couverts de phycobilisomes.<\/p>\n<\/aside><h2>Idée 2 · Les types de thalles<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Du plus simple au plus complexe<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · 1. Unicellulaire (Chlamydomonas) ; colonies et cénobes (Volvox, nombre fixe de cellules).<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · 2. Filamenteux (némathothalle) : simple ou ramifié.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · 3. Siphoné : une grande cellule multinucléée.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · 4. Tissus différenciés (cladomes, thalles foliacés) : laminaires.<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Idée 3 · La reproduction<\/h2>\n<ul>\n<li><strong>Asexuée<\/strong> : spores (zoospores flagellées ou aplanospores), fragmentation.<\/li>\n<li><strong>Sexuée<\/strong> : isogamie (gamètes semblables), hétérogamie, oogamie (gros gamète femelle immobile). La <strong>cystogamie<\/strong> (fusion du contenu de deux cellules) existe chez des algues filamenteuses comme Spirogyra.<\/li>\n<\/ul>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Application<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Vrai ou faux : « les algues marines géantes sont parfois vasculaires ».<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Faux : aucune algue n&#39;a de vrais vaisseaux.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Vrai ou faux : « les algues benthiques se fixent par des racines adventives ».<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Faux : elles se fixent par des crampons (haptères) ou un disque.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">La chlorophylle a est présente :<\/div><button class=\"opt\" data-o=\"0\">chez toutes les algues<\/button><button class=\"opt\" data-o=\"1\">uniquement chez les algues vertes<\/button><button class=\"opt\" data-o=\"2\">chez les champignons<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">La chlorophylle b caractérise :<\/div><button class=\"opt\" data-o=\"0\">les algues vertes<\/button><button class=\"opt\" data-o=\"1\">les algues rouges<\/button><button class=\"opt\" data-o=\"2\">les algues brunes<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Les algues se fixent par :<\/div><button class=\"opt\" data-o=\"0\">des crampons<\/button><button class=\"opt\" data-o=\"1\">des racines<\/button><button class=\"opt\" data-o=\"2\">des rhizomes<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">La phycoérythrine colore :<\/div><button class=\"opt\" data-o=\"0\">les algues rouges<\/button><button class=\"opt\" data-o=\"1\">les algues vertes<\/button><button class=\"opt\" data-o=\"2\">les champignons<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">La réserve des algues brunes :<\/div><button class=\"opt\" data-o=\"0\">laminarine<\/button><button class=\"opt\" data-o=\"1\">amidon<\/button><button class=\"opt\" data-o=\"2\">glycogène<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Un némathothalle est :<\/div><button class=\"opt\" data-o=\"0\">filamenteux<\/button><button class=\"opt\" data-o=\"1\">unicellulaire<\/button><button class=\"opt\" data-o=\"2\">siphoné<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Une algue a des vaisseaux :<\/div><button class=\"opt\" data-o=\"0\">souvent<\/button><button class=\"opt\" data-o=\"1\">jamais<\/button><button class=\"opt\" data-o=\"2\">si elle est géante<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">L&#39;oogamie implique :<\/div><button class=\"opt\" data-o=\"0\">un gamète femelle gros et immobile<\/button><button class=\"opt\" data-o=\"1\">deux gamètes identiques<\/button><button class=\"opt\" data-o=\"2\">l&#39;absence de gamètes<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Volvox est :<\/div><button class=\"opt\" data-o=\"0\">un cénobe<\/button><button class=\"opt\" data-o=\"1\">un thalle siphoné<\/button><button class=\"opt\" data-o=\"2\">un champignon<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Spirogyra pratique :<\/div><button class=\"opt\" data-o=\"0\">la conjugaison (cystogamie)<\/button><button class=\"opt\" data-o=\"1\">la pollinisation<\/button><button class=\"opt\" data-o=\"2\">la germination de graines<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"algues","rep":null,"tol":null},{"n":"algues","rep":null,"tol":null},{"n":"algues","rep":null,"tol":null}],"qcm":[{"n":"algues","q":"La chlorophylle a est présente :","o":["chez toutes les algues","uniquement chez les algues vertes","chez les champignons"],"a":0,"e":"Pigment de base."},{"n":"algues","q":"La chlorophylle b caractérise :","o":["les algues vertes","les algues rouges","les algues brunes"],"a":0,"e":"Comme les plantes terrestres."},{"n":"algues","q":"Les algues se fixent par :","o":["des crampons","des racines","des rhizomes"],"a":0,"e":"Haptères."},{"n":"algues","q":"La phycoérythrine colore :","o":["les algues rouges","les algues vertes","les champignons"],"a":0,"e":"Phycobilisomes."},{"n":"algues","q":"La réserve des algues brunes :","o":["laminarine","amidon","glycogène"],"a":0,"e":"Polysaccharide."},{"n":"algues","q":"Un némathothalle est :","o":["filamenteux","unicellulaire","siphoné"],"a":0,"e":"Filament."},{"n":"algues","q":"Une algue a des vaisseaux :","o":["souvent","jamais","si elle est géante"],"a":1,"e":"Thallophyte."},{"n":"algues","q":"L&#39;oogamie implique :","o":["un gamète femelle gros et immobile","deux gamètes identiques","l&#39;absence de gamètes"],"a":0,"e":"Œuf."},{"n":"algues","q":"Volvox est :","o":["un cénobe","un thalle siphoné","un champignon"],"a":0,"e":"Colonie."},{"n":"algues","q":"Spirogyra pratique :","o":["la conjugaison (cystogamie)","la pollinisation","la germination de graines"],"a":0,"e":"Fusion de deux cellules."}]},{"id":"champignons","t":"Les champignons (Mycota)","seance":"Thallophytes · Chapitre 2","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir ce qu&#39;est un hétérotrophe : un organisme qui tire son carbone de matière organique déjà fabriquée.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Un champignon peut-il faire la photosynthèse ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Non : il n&#39;a pas de chlorophylle, il est hétérotrophe.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « où se forment les spores sexuées ? ».<\/strong> Dans un asque (Ascomycota) ou sur une baside (Basidiomycota) : c&#39;est la clé de la classification.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Dire que les champignons stockent de l&#39;amidon. Leur réserve est le <strong>glycogène<\/strong> ; leur paroi est en <strong>chitine<\/strong>.<\/p>\n<\/aside><p>À la fin, tu sais reconnaître les grands embranchements et leurs modes de nutrition.<\/p>\n<h2>Idée 1 · Organisation<\/h2>\n<p>Thalle : mycélium fait d&#39;hyphes (cloisonnées ou non) ; les levures sont unicellulaires et se multiplient par <strong>bourgeonnement<\/strong> (ou bipartition). Paroi en chitine, réserve en glycogène, croissance apicale des hyphes.<\/p>\n<h2>Idée 2 · Classification<\/h2>\n<figure class=\"grille\"><figcaption>Les embranchements<\/figcaption><table><tr><th>Embranchement,<\/th><th>Hyphes,<\/th><th>Spores<\/th><th>sexuées,<\/th><th>Exemple<\/th><\/tr><tr><td class=\"h1\">Chytridiomycota,<\/td><td>non<\/td><td>cloisonnées,<\/td><td>zoospores<\/td><td>flagellées,<\/td><td>chytrides<\/td><\/tr><tr><td class=\"h1\">Zygomycota,<\/td><td>non<\/td><td>cloisonnées,<\/td><td>zygospore<\/td><td>(diploïde),<\/td><td>Mucor,<\/td><td>Rhizopus<\/td><\/tr><tr><td class=\"h1\">Ascomycota,<\/td><td>cloisonnées,<\/td><td>ascospores<\/td><td>dans<\/td><td>un<\/td><td>asque,<\/td><td>levure<\/td><td>de<\/td><td>boulanger,<\/td><td>Penicillium<\/td><\/tr><tr><td class=\"h1\">Basidiomycota,<\/td><td>cloisonnées,<\/td><td>basidiospores<\/td><td>sur<\/td><td>une<\/td><td>baside,<\/td><td>champignons<\/td><td>à<\/td><td>chapeau<\/td><\/tr><tr><td class=\"h1\">Deutéromycota<\/td><td>(imparfaits),<\/td><td>cloisonnées,<\/td><td>inconnues<\/td><td>;<\/td><td>conidiospores<\/td><td>asexuées,<\/td><td>Aspergillus<\/td><td>(forme<\/td><td>asexuée)<\/td><\/tr><\/table><\/figure><h2>Idée 3 · Modes de vie<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Nutrition<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · 1. Saprophytes : décomposent la matière organique morte.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · 2. Parasites : biotrophes (sur tissus vivants) ou nécrotrophes (tuent puis se nourrissent, peuvent continuer sur la matière morte).<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · 3. Symbiotes : mycorhizes (avec les racines), lichens (avec une algue).<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Application<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Vrai ou faux : « les zygospores sont haploïdes ».<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Faux : la zygospore contient le zygote, elle est diploïde (la méiose a lieu à sa germination).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Les levures appartiennent-elles aux Basidiomycota ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Le plus souvent non : la levure de boulanger est un Ascomycota. Les levures se multiplient par bourgeonnement ou bipartition.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">La réserve des champignons est :<\/div><button class=\"opt\" data-o=\"0\">le glycogène<\/button><button class=\"opt\" data-o=\"1\">l&#39;amidon<\/button><button class=\"opt\" data-o=\"2\">la laminarine<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Les levures se multiplient par :<\/div><button class=\"opt\" data-o=\"0\">bourgeonnement et bipartition<\/button><button class=\"opt\" data-o=\"1\">graines<\/button><button class=\"opt\" data-o=\"2\">fragmentation de feuilles<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">La baside caractérise :<\/div><button class=\"opt\" data-o=\"0\">les Basidiomycota<\/button><button class=\"opt\" data-o=\"1\">les Ascomycota<\/button><button class=\"opt\" data-o=\"2\">les Zygomycota<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Une zygospore est :<\/div><button class=\"opt\" data-o=\"0\">diploïde<\/button><button class=\"opt\" data-o=\"1\">haploïde<\/button><button class=\"opt\" data-o=\"2\">un gamète<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Les Deutéromycota produisent :<\/div><button class=\"opt\" data-o=\"0\">des conidiospores<\/button><button class=\"opt\" data-o=\"1\">des basidiospores<\/button><button class=\"opt\" data-o=\"2\">des graines<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Les champignons sont :<\/div><button class=\"opt\" data-o=\"0\">des thallophytes hétérotrophes<\/button><button class=\"opt\" data-o=\"1\">autotrophes<\/button><button class=\"opt\" data-o=\"2\">vasculaires<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Un champignon nécrotrophe :<\/div><button class=\"opt\" data-o=\"0\">peut vivre sur matière vivante puis morte<\/button><button class=\"opt\" data-o=\"1\">ne vit que sur des roches<\/button><button class=\"opt\" data-o=\"2\">fait la photosynthèse<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Le lichen associe :<\/div><button class=\"opt\" data-o=\"0\">un champignon et une algue<\/button><button class=\"opt\" data-o=\"1\">deux champignons<\/button><button class=\"opt\" data-o=\"2\">une mousse et une fougère<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">La croissance des hyphes est :<\/div><button class=\"opt\" data-o=\"0\">apicale<\/button><button class=\"opt\" data-o=\"1\">en épaisseur<\/button><button class=\"opt\" data-o=\"2\">arrêtée<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">La paroi chitineuse rapproche les champignons :<\/div><button class=\"opt\" data-o=\"0\">des animaux (arthropodes)<\/button><button class=\"opt\" data-o=\"1\">des plantes<\/button><button class=\"opt\" data-o=\"2\">des algues rouges<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"champignons","rep":null,"tol":null},{"n":"champignons","rep":null,"tol":null},{"n":"champignons","rep":null,"tol":null}],"qcm":[{"n":"champignons","q":"La réserve des champignons est :","o":["le glycogène","l&#39;amidon","la laminarine"],"a":0,"e":"Comme les animaux."},{"n":"champignons","q":"Les levures se multiplient par :","o":["bourgeonnement et bipartition","graines","fragmentation de feuilles"],"a":0,"e":"Thalle unicellulaire."},{"n":"champignons","q":"La baside caractérise :","o":["les Basidiomycota","les Ascomycota","les Zygomycota"],"a":0,"e":"Basidiospores externes."},{"n":"champignons","q":"Une zygospore est :","o":["diploïde","haploïde","un gamète"],"a":0,"e":"Zygote enkysté."},{"n":"champignons","q":"Les Deutéromycota produisent :","o":["des conidiospores","des basidiospores","des graines"],"a":0,"e":"Reproduction asexuée."},{"n":"champignons","q":"Les champignons sont :","o":["des thallophytes hétérotrophes","autotrophes","vasculaires"],"a":0,"e":"Pas de chlorophylle."},{"n":"champignons","q":"Un champignon nécrotrophe :","o":["peut vivre sur matière vivante puis morte","ne vit que sur des roches","fait la photosynthèse"],"a":0,"e":"Il tue les tissus."},{"n":"champignons","q":"Le lichen associe :","o":["un champignon et une algue","deux champignons","une mousse et une fougère"],"a":0,"e":"Symbiose."},{"n":"champignons","q":"La croissance des hyphes est :","o":["apicale","en épaisseur","arrêtée"],"a":0,"e":"À l&#39;extrémité."},{"n":"champignons","q":"La paroi chitineuse rapproche les champignons :","o":["des animaux (arthropodes)","des plantes","des algues rouges"],"a":0,"e":"Chitine."}]},{"id":"bryophytes","t":"Les Bryophytes","seance":"Embryophytes · Chapitre 3 · Cryptogames non vasculaires","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut se souvenir que chez les mousses, la plante verte est le gamétophyte (n).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>La capsule d&#39;une mousse est-elle n ou 2n ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>2n : elle fait partie du sporophyte. C&#39;est dans la capsule que la méiose produit les spores n.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « petite plante qui a besoin d&#39;eau ».<\/strong> Pas de vraies racines, pas de vaisseaux lignifiés, et les gamètes mâles nagent jusqu&#39;à l&#39;oosphère.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Croire que les rhizoïdes sont des racines qui absorbent l&#39;eau. Ils servent <strong>surtout à la fixation<\/strong> ; l&#39;absorption se fait par toute la surface.<\/p>\n<\/aside><p>À la fin, tu sais décrire le cycle d&#39;une mousse et ses modes de multiplication.<\/p>\n<h2>Idée 1 · Organisation<\/h2>\n<p>Trois groupes : Mousses (Bryopsida), Hépatiques (Marchantiophyta, souvent thalloïdes), Anthocérotes. Ébauches de conduction : <strong>hadrome<\/strong> (eau) et <strong>leptome<\/strong> (sève élaborée), non lignifiés. Les feuilles de mousses peuvent porter une nervure.<\/p>\n<h2>Idée 2 · Le cycle<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Cycle d'une mousse (haplodiplophasique, gamétophyte dominant)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · 1. La spore n germe en protonéma, puis en plante feuillée (gamétophyte n).<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · 2. Anthéridies (gamètes mâles flagellés, anthérozoïdes) et archégones (oosphère).<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · 3. Fécondation dans l&#39;eau (zoïdogamie, oogamie) : zygote 2n.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · 4. Le sporophyte 2n (soie + capsule) pousse sur le gamétophyte ; méiose dans la capsule ; spores n.<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Idée 3 · Multiplication végétative<\/h2>\n<p>Propagules (chez Marchantia, groupées dans des <strong>corbeilles à propagules<\/strong>), fragmentation, bulbilles. C&#39;est une reproduction <strong>asexuée<\/strong>.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Contrôle 2020-21<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>« Les mousses peuvent être des organismes thalloïdes » ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>La question vise les Bryophytes : les hépatiques comme Marchantia sont thalloïdes ; les mousses au sens strict sont feuillées. Lis bien le terme du sujet.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>« La reproduction chez les Bryophytes est une zoïdogamie » ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Vrai : les anthérozoïdes flagellés nagent dans l&#39;eau jusqu&#39;à l&#39;oosphère (et c&#39;est une oogamie).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Les rhizoïdes des Bryophytes assurent surtout :<\/div><button class=\"opt\" data-o=\"0\">la fixation<\/button><button class=\"opt\" data-o=\"1\">l&#39;absorption exclusive<\/button><button class=\"opt\" data-o=\"2\">la photosynthèse<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">La fécondation des Bryophytes nécessite :<\/div><button class=\"opt\" data-o=\"0\">de l&#39;eau<\/button><button class=\"opt\" data-o=\"1\">du vent<\/button><button class=\"opt\" data-o=\"2\">des insectes<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">La phase dominante des mousses :<\/div><button class=\"opt\" data-o=\"0\">gamétophyte n<\/button><button class=\"opt\" data-o=\"1\">sporophyte 2n<\/button><button class=\"opt\" data-o=\"2\">zygote<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">La méiose a lieu dans :<\/div><button class=\"opt\" data-o=\"0\">la capsule<\/button><button class=\"opt\" data-o=\"1\">l&#39;archégone<\/button><button class=\"opt\" data-o=\"2\">la feuille<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Les propagules assurent :<\/div><button class=\"opt\" data-o=\"0\">une multiplication asexuée<\/button><button class=\"opt\" data-o=\"1\">la reproduction sexuée<\/button><button class=\"opt\" data-o=\"2\">la germination des graines<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Le protonéma est :<\/div><button class=\"opt\" data-o=\"0\">le filament issu de la spore<\/button><button class=\"opt\" data-o=\"1\">le sporophyte<\/button><button class=\"opt\" data-o=\"2\">un gamète<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Les Bryophytes ont des vaisseaux lignifiés :<\/div><button class=\"opt\" data-o=\"0\">oui<\/button><button class=\"opt\" data-o=\"1\">non<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Marchantia est :<\/div><button class=\"opt\" data-o=\"0\">une hépatique à thalle<\/button><button class=\"opt\" data-o=\"1\">une fougère<\/button><button class=\"opt\" data-o=\"2\">un champignon<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Le gamète femelle est formé dans :<\/div><button class=\"opt\" data-o=\"0\">l&#39;archégone<\/button><button class=\"opt\" data-o=\"1\">l&#39;anthéridie<\/button><button class=\"opt\" data-o=\"2\">la capsule<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Le sporophyte des mousses :<\/div><button class=\"opt\" data-o=\"0\">vit sur le gamétophyte<\/button><button class=\"opt\" data-o=\"1\">est indépendant<\/button><button class=\"opt\" data-o=\"2\">est haploïde<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"bryophytes","rep":null,"tol":null},{"n":"bryophytes","rep":null,"tol":null},{"n":"bryophytes","rep":null,"tol":null}],"qcm":[{"n":"bryophytes","q":"Les rhizoïdes des Bryophytes assurent surtout :","o":["la fixation","l&#39;absorption exclusive","la photosynthèse"],"a":0,"e":"Absorption par toute la surface."},{"n":"bryophytes","q":"La fécondation des Bryophytes nécessite :","o":["de l&#39;eau","du vent","des insectes"],"a":0,"e":"Zoïdogamie."},{"n":"bryophytes","q":"La phase dominante des mousses :","o":["gamétophyte n","sporophyte 2n","zygote"],"a":0,"e":"Plante feuillée."},{"n":"bryophytes","q":"La méiose a lieu dans :","o":["la capsule","l&#39;archégone","la feuille"],"a":0,"e":"Production des spores."},{"n":"bryophytes","q":"Les propagules assurent :","o":["une multiplication asexuée","la reproduction sexuée","la germination des graines"],"a":0,"e":"Végétative."},{"n":"bryophytes","q":"Le protonéma est :","o":["le filament issu de la spore","le sporophyte","un gamète"],"a":0,"e":"Stade juvénile."},{"n":"bryophytes","q":"Les Bryophytes ont des vaisseaux lignifiés :","o":["oui","non"],"a":1,"e":"Cryptogames non vasculaires."},{"n":"bryophytes","q":"Marchantia est :","o":["une hépatique à thalle","une fougère","un champignon"],"a":0,"e":"Corbeilles à propagules."},{"n":"bryophytes","q":"Le gamète femelle est formé dans :","o":["l&#39;archégone","l&#39;anthéridie","la capsule"],"a":0,"e":"Oosphère."},{"n":"bryophytes","q":"Le sporophyte des mousses :","o":["vit sur le gamétophyte","est indépendant","est haploïde"],"a":0,"e":"Il en dépend pour sa nutrition."}]},{"id":"cryptogames-vasculaires","t":"Les Cryptogames vasculaires","seance":"Embryophytes · Fougères, prêles, lycopodes","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir que le xylème conduit la sève brute et le phloème la sève élaborée.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Quel tissu conduit l&#39;eau des racines vers les feuilles ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Le xylème (sève brute).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « première vraie plante, encore dépendante de l&#39;eau ».<\/strong> Vaisseaux, racines, tiges et feuilles : oui. Graines : non, la fécondation se fait toujours dans l&#39;eau.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Croire que la fougère feuillée est le gamétophyte. Chez la fougère, la grande plante est le <strong>sporophyte 2n<\/strong> ; le gamétophyte est un petit <strong>prothalle<\/strong>.<\/p>\n<\/aside><p>À la fin, tu sais comparer le cycle d&#39;une fougère à celui d&#39;une mousse.<\/p>\n<h2>Idée 1 · Organisation<\/h2>\n<p>Sporophyte autonome avec racines, tige (souvent rhizome) et feuilles (frondes). Xylème formé surtout de <strong>trachéides<\/strong>. Spores formées dans des <strong>sporanges<\/strong>, groupés en sores sous les frondes.<\/p>\n<h2>Idée 2 · Le cycle de la fougère<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Cycle haplodiplophasique à sporophyte dominant<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · 1. Sporophyte 2n : méiose dans les sporanges, spores n.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · 2. La spore germe en prothalle n (quelques mm), qui porte anthéridies et archégones.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · 3. Fécondation dans l&#39;eau : zygote 2n.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · 4. Le jeune sporophyte pousse sur le prothalle, puis devient indépendant.<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><figure class=\"grille\"><figcaption>Mousse et fougère<\/figcaption><table><tr><th>,<\/th><th>Mousse,<\/th><th>Fougère<\/th><\/tr><tr><td class=\"h1\">Phase<\/td><td>dominante,<\/td><td>gamétophyte<\/td><td>n,<\/td><td>sporophyte<\/td><td>2n<\/td><\/tr><tr><td class=\"h1\">Vaisseaux,<\/td><td>non,<\/td><td>oui<\/td><\/tr><tr><td class=\"h1\">Fécondation,<\/td><td>dans<\/td><td>l'eau,<\/td><td>dans<\/td><td>l'eau<\/td><\/tr><tr><td class=\"h1\">Sporophyte,<\/td><td>dépendant,<\/td><td>autonome<\/td><\/tr><\/table><\/figure><h2>Idée 3 · Isosporie et hétérosporie<\/h2>\n<p>Isosporée : un seul type de spores (la plupart des fougères). Hétérosporée : microspores (mâles) et macrospores (femelles), comme Selaginella : c&#39;est un pas vers la graine.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Application<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Toutes les Cryptogames vasculaires sont-elles des plantes à spores ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Oui : elles se disséminent par spores, pas par graines.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Pourquoi les fougères vivent-elles surtout en milieu humide ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>La fécondation exige de l&#39;eau pour que les anthérozoïdes nagent jusqu&#39;à l&#39;oosphère du prothalle.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">La phase dominante de la fougère :<\/div><button class=\"opt\" data-o=\"0\">sporophyte 2n<\/button><button class=\"opt\" data-o=\"1\">gamétophyte n<\/button><button class=\"opt\" data-o=\"2\">prothalle<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Le prothalle est :<\/div><button class=\"opt\" data-o=\"0\">haploïde<\/button><button class=\"opt\" data-o=\"1\">diploïde<\/button><button class=\"opt\" data-o=\"2\">une graine<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Les sporanges des fougères sont groupés en :<\/div><button class=\"opt\" data-o=\"0\">sores<\/button><button class=\"opt\" data-o=\"1\">cônes<\/button><button class=\"opt\" data-o=\"2\">fleurs<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Les fougères produisent :<\/div><button class=\"opt\" data-o=\"0\">des spores<\/button><button class=\"opt\" data-o=\"1\">des graines<\/button><button class=\"opt\" data-o=\"2\">des fruits<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Les Cryptogames vasculaires ont :<\/div><button class=\"opt\" data-o=\"0\">des racines vraies<\/button><button class=\"opt\" data-o=\"1\">seulement des rhizoïdes<\/button><button class=\"opt\" data-o=\"2\">un thalle<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Une prêle est :<\/div><button class=\"opt\" data-o=\"0\">une cryptogame vasculaire<\/button><button class=\"opt\" data-o=\"1\">une mousse<\/button><button class=\"opt\" data-o=\"2\">une gymnosperme<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">L&#39;hétérosporie annonce :<\/div><button class=\"opt\" data-o=\"0\">la graine<\/button><button class=\"opt\" data-o=\"1\">la fleur seule<\/button><button class=\"opt\" data-o=\"2\">la photosynthèse<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">La fécondation des fougères se fait :<\/div><button class=\"opt\" data-o=\"0\">dans l&#39;eau<\/button><button class=\"opt\" data-o=\"1\">par le vent<\/button><button class=\"opt\" data-o=\"2\">par le pollen<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Le sporophyte de la fougère est :<\/div><button class=\"opt\" data-o=\"0\">autonome<\/button><button class=\"opt\" data-o=\"1\">parasite du prothalle toute sa vie<\/button><button class=\"opt\" data-o=\"2\">haploïde<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Le xylème des fougères comprend surtout :<\/div><button class=\"opt\" data-o=\"0\">des trachéides<\/button><button class=\"opt\" data-o=\"1\">des vaisseaux parfaits<\/button><button class=\"opt\" data-o=\"2\">des tubes criblés<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"cryptogames-vasculaires","rep":null,"tol":null},{"n":"cryptogames-vasculaires","rep":null,"tol":null},{"n":"cryptogames-vasculaires","rep":null,"tol":null}],"qcm":[{"n":"cryptogames-vasculaires","q":"La phase dominante de la fougère :","o":["sporophyte 2n","gamétophyte n","prothalle"],"a":0,"e":"La fronde."},{"n":"cryptogames-vasculaires","q":"Le prothalle est :","o":["haploïde","diploïde","une graine"],"a":0,"e":"Gamétophyte."},{"n":"cryptogames-vasculaires","q":"Les sporanges des fougères sont groupés en :","o":["sores","cônes","fleurs"],"a":0,"e":"Sous les frondes."},{"n":"cryptogames-vasculaires","q":"Les fougères produisent :","o":["des spores","des graines","des fruits"],"a":0,"e":"Cryptogames."},{"n":"cryptogames-vasculaires","q":"Les Cryptogames vasculaires ont :","o":["des racines vraies","seulement des rhizoïdes","un thalle"],"a":0,"e":"Cormus."},{"n":"cryptogames-vasculaires","q":"Une prêle est :","o":["une cryptogame vasculaire","une mousse","une gymnosperme"],"a":0,"e":"Equisetum."},{"n":"cryptogames-vasculaires","q":"L&#39;hétérosporie annonce :","o":["la graine","la fleur seule","la photosynthèse"],"a":0,"e":"Spores mâles et femelles."},{"n":"cryptogames-vasculaires","q":"La fécondation des fougères se fait :","o":["dans l&#39;eau","par le vent","par le pollen"],"a":0,"e":"Anthérozoïdes nageurs."},{"n":"cryptogames-vasculaires","q":"Le sporophyte de la fougère est :","o":["autonome","parasite du prothalle toute sa vie","haploïde"],"a":0,"e":"Il le quitte vite."},{"n":"cryptogames-vasculaires","q":"Le xylème des fougères comprend surtout :","o":["des trachéides","des vaisseaux parfaits","des tubes criblés"],"a":0,"e":"Les tubes criblés sont dans le phloème."}]},{"id":"spermaphytes-multiplication","t":"Gymnospermes, Angiospermes et multiplication végétative","seance":"Embryophytes · Spermaphytes · Multiplication végétative","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir qu&#39;une graine contient un embryon, des réserves et un tégument protecteur.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Une graine est-elle issue d&#39;un ovule ou d&#39;un ovaire ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>D&#39;un ovule fécondé. Le fruit, lui, vient de l&#39;ovaire (chez les Angiospermes).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « libérés de l&#39;eau ».<\/strong> Le pollen transporte le gamète mâle par le vent ou les insectes : plus besoin d&#39;eau pour la fécondation.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Parler de fruit chez les Gymnospermes. Leurs ovules sont <strong>nus<\/strong>, portés par des écailles (cônes) : pas d&#39;ovaire, donc pas de fruit.<\/p>\n<\/aside><p>À la fin, tu sais comparer Gymnospermes et Angiospermes et classer les fruits.<\/p>\n<h2>Idée 1 · Gymnospermes et Angiospermes<\/h2>\n<figure class=\"grille\"><figcaption>Comparaison<\/figcaption><table><tr><th>,<\/th><th>Gymnospermes,<\/th><th>Angiospermes<\/th><\/tr><tr><td class=\"h1\">Ovules,<\/td><td>nus<\/td><td>sur<\/td><td>des<\/td><td>écailles,<\/td><td>enfermés<\/td><td>dans<\/td><td>un<\/td><td>ovaire<\/td><\/tr><tr><td class=\"h1\">Fleur,<\/td><td>cônes<\/td><td>(strobiles),<\/td><td>vraie<\/td><td>fleur<\/td><\/tr><tr><td class=\"h1\">Fruit,<\/td><td>non,<\/td><td>oui<\/td><\/tr><tr><td class=\"h1\">Fécondation,<\/td><td>simple,<\/td><td>double<\/td><td>(embryon<\/td><td>+<\/td><td>albumen<\/td><td>3n)<\/td><\/tr><tr><td class=\"h1\">Xylème,<\/td><td>souvent<\/td><td>homogène<\/td><td>(trachéides<\/td><td>seules),<\/td><td>vaisseaux<\/td><td>parfaits<\/td><\/tr><tr><td class=\"h1\">Exemples,<\/td><td>pin,<\/td><td>cèdre,<\/td><td>Ginkgo,<\/td><td>Gnétophytes,<\/td><td>blé,<\/td><td>rose,<\/td><td>olivier<\/td><\/tr><\/table><\/figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Le xylème homogène (trachéides seulement) caractérise beaucoup de Conifères ; les Gnétophytes, elles, ont déjà des vaisseaux.<\/p>\n<\/aside><h2>Idée 2 · Les fruits (TD)<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Classer un fruit<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · 1. Charnu ou sec ?<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · 2. Charnu : baie (tout est charnu, plusieurs graines, ex. tomate) ou drupe (noyau dur, ex. olive, pêche).<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · 3. Sec déhiscent (s&#39;ouvre : gousse du haricot, capsule) ou indéhiscent (akène du tournesol, caryopse du blé).<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Idée 3 · La multiplication végétative<\/h2>\n<p>Reproduction asexuée à partir d&#39;un organe végétatif : stolons (fraisier), rhizomes (iris), tubercules (pomme de terre), bulbes (oignon), drageons, et en horticulture bouturage, marcottage, greffage. Les descendants forment un <strong>clone<\/strong>.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Application<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>L&#39;olive est-elle une baie ou une drupe ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Une drupe : sa graine est enfermée dans un noyau dur.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Pourquoi la pomme de terre plantée donne-t-elle des plants identiques ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Le tubercule est un organe végétatif : c&#39;est une multiplication asexuée, qui produit un clone.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Les Gymnospermes ont des ovules :<\/div><button class=\"opt\" data-o=\"0\">nus<\/button><button class=\"opt\" data-o=\"1\">dans un ovaire<\/button><button class=\"opt\" data-o=\"2\">absents<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">La double fécondation caractérise :<\/div><button class=\"opt\" data-o=\"0\">les Angiospermes<\/button><button class=\"opt\" data-o=\"1\">les Gymnospermes<\/button><button class=\"opt\" data-o=\"2\">les fougères<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">La tomate est :<\/div><button class=\"opt\" data-o=\"0\">une baie<\/button><button class=\"opt\" data-o=\"1\">une drupe<\/button><button class=\"opt\" data-o=\"2\">un akène<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Le grain de blé est :<\/div><button class=\"opt\" data-o=\"0\">un caryopse<\/button><button class=\"opt\" data-o=\"1\">une gousse<\/button><button class=\"opt\" data-o=\"2\">une baie<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Les Gnétophytes sont :<\/div><button class=\"opt\" data-o=\"0\">des Gymnospermes<\/button><button class=\"opt\" data-o=\"1\">des Angiospermes<\/button><button class=\"opt\" data-o=\"2\">des mousses<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Le stolon du fraisier sert à :<\/div><button class=\"opt\" data-o=\"0\">la multiplication végétative<\/button><button class=\"opt\" data-o=\"1\">la pollinisation<\/button><button class=\"opt\" data-o=\"2\">la photosynthèse uniquement<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Le fruit provient :<\/div><button class=\"opt\" data-o=\"0\">de l&#39;ovaire<\/button><button class=\"opt\" data-o=\"1\">de l&#39;ovule<\/button><button class=\"opt\" data-o=\"2\">du pollen<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Le pollen permet :<\/div><button class=\"opt\" data-o=\"0\">une fécondation sans eau libre<\/button><button class=\"opt\" data-o=\"1\">la photosynthèse<\/button><button class=\"opt\" data-o=\"2\">la germination<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Le Ginkgo est :<\/div><button class=\"opt\" data-o=\"0\">une Gymnosperme<\/button><button class=\"opt\" data-o=\"1\">une fougère<\/button><button class=\"opt\" data-o=\"2\">une Angiosperme<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">La gousse du haricot est un fruit :<\/div><button class=\"opt\" data-o=\"0\">sec déhiscent<\/button><button class=\"opt\" data-o=\"1\">charnu<\/button><button class=\"opt\" data-o=\"2\">sec indéhiscent<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"spermaphytes-multiplication","rep":null,"tol":null},{"n":"spermaphytes-multiplication","rep":null,"tol":null},{"n":"spermaphytes-multiplication","rep":null,"tol":null}],"qcm":[{"n":"spermaphytes-multiplication","q":"Les Gymnospermes ont des ovules :","o":["nus","dans un ovaire","absents"],"a":0,"e":"Gymno = nu."},{"n":"spermaphytes-multiplication","q":"La double fécondation caractérise :","o":["les Angiospermes","les Gymnospermes","les fougères"],"a":0,"e":"Albumen 3n."},{"n":"spermaphytes-multiplication","q":"La tomate est :","o":["une baie","une drupe","un akène"],"a":0,"e":"Plusieurs graines, tout est charnu."},{"n":"spermaphytes-multiplication","q":"Le grain de blé est :","o":["un caryopse","une gousse","une baie"],"a":0,"e":"Fruit-graine."},{"n":"spermaphytes-multiplication","q":"Les Gnétophytes sont :","o":["des Gymnospermes","des Angiospermes","des mousses"],"a":0,"e":"Avec des vaisseaux."},{"n":"spermaphytes-multiplication","q":"Le stolon du fraisier sert à :","o":["la multiplication végétative","la pollinisation","la photosynthèse uniquement"],"a":0,"e":"Tige rampante."},{"n":"spermaphytes-multiplication","q":"Le fruit provient :","o":["de l&#39;ovaire","de l&#39;ovule","du pollen"],"a":0,"e":"La graine provient de l&#39;ovule."},{"n":"spermaphytes-multiplication","q":"Le pollen permet :","o":["une fécondation sans eau libre","la photosynthèse","la germination"],"a":0,"e":"Transport du gamète mâle."},{"n":"spermaphytes-multiplication","q":"Le Ginkgo est :","o":["une Gymnosperme","une fougère","une Angiosperme"],"a":0,"e":"Ginkgophyte."},{"n":"spermaphytes-multiplication","q":"La gousse du haricot est un fruit :","o":["sec déhiscent","charnu","sec indéhiscent"],"a":0,"e":"Elle s&#39;ouvre."}]},{"id":"annales-corrigees","t":"Annales corrigées · contrôles Thallophytes et Embryophytes","seance":"Contrôles BCG S3 (2019-2020 et 2020-2021)","imp":5,"payant":true,"html":"<p>Deux vrais contrôles de la FST Béni Mellal. Le premier (Thallophytes) note −0,5 point par réponse fausse : réponds seulement si tu es sûr.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Les réponses ne figurent pas dans les fichiers fournis : elles sont rédigées par nous à partir du cours.<\/p>\n<\/aside><h2>Contrôle Thallophytes (2019-2020) · vrai ou faux<\/h2>\n<section class=\"exo\"><h3>Vrai ou faux<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>1-5 : chytrides et oospore ; cénobes némathothalles ; pleuridies ; nécrotrophes ; algues géantes vasculaires.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>1 <strong>Faux<\/strong> (l&#39;oospore à paroi épaisse caractérise les Oomycètes ; chez les chytrides, le zygote est un kyste). 2 <strong>Faux<\/strong> (un cénobe est une colonie, pas un filament). 3 <strong>Faux<\/strong> (les pleuridies sont des ramifications du thalle). 4 <strong>Vrai<\/strong>. 5 <strong>Faux<\/strong>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>6-10 : amidon chez les champignons ; spores sexuées de grande taille ; zygospores haploïdes ; racines adventives des algues ; Deutéromycota.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>6 <strong>Faux<\/strong> (glycogène). 7 <strong>Vrai<\/strong> (ex. zygospores, oospores). 8 <strong>Faux<\/strong> (diploïdes). 9 <strong>Faux<\/strong> (crampons). 10 <strong>Vrai<\/strong> (conidiospores).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>15, 18, 20 : organes de dissémination ; spores endogènes ; Basidiomycota.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>15 <strong>Faux<\/strong> (fragments de mycélium, sclérotes aussi). 18 <strong>Vrai<\/strong> (sporocystes des champignons inférieurs). 20 <strong>Vrai<\/strong> (thallophytes hétérotrophes).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>QCM<\/h3><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Les levures…<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><strong>A<\/strong> (champignons microscopiques à thalle unicellulaire) et <strong>D<\/strong> (bourgeonnement et bipartition).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>La chlorophylle a…<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><strong>C<\/strong> : présente chez toutes les algues.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>La caryogamie est…<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>La <strong>fusion des noyaux<\/strong> des deux gamètes (la fusion des cytoplasmes est la plasmogamie).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Contrôle Embryophytes (2020-2021)<\/h2>\n<section class=\"exo\"><h3>QCM à réponses multiples<\/h3><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><ol>\n<li>Les Mousses (Bryophytes)…<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Juste : <strong>d<\/strong> (peuvent être thalloïdes, chez les hépatiques). Faux : toutes saxicoles, parasites, toutes aquatiques.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"7\"><div class=\"ex-q\"><ol start=\"2\">\n<li>Les Anthophytes…<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><strong>a<\/strong> (plantes à fleurs) et <strong>d<\/strong> (plantes vasculaires). La proposition « comprennent les Gnétophytes » dépend du cours : certains rattachent les Gnétophytes aux Anthophytes au sens large ; suis la définition de ton prof.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"8\"><div class=\"ex-q\"><ol start=\"3\">\n<li>Chez les Bryophytes…<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><strong>c<\/strong> (hadrome et leptome : ébauches de conduction). Faux : racines (ce sont des rhizoïdes), « jamais de nervure ».<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"9\"><div class=\"ex-q\"><ol start=\"4\">\n<li>Le xylème est homogène chez…<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><strong>a<\/strong> et <strong>b<\/strong> (certaines Coniférophytes, donc certaines Gymnospermes).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"10\"><div class=\"ex-q\"><ol start=\"5\">\n<li>Les plantes à spores…<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><strong>b<\/strong> et <strong>c<\/strong> (les Cryptogames vasculaires).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><but   }
  async function saveMemos() { saveLocal(); if (!db) return; try { await db.doc(base).set({ memos: ST.memos.slice(-30), updated: Date.now() }); } catch (e) {} }

  // ---------- appel au tuteur ----------
  const ERR = { not_granted: 'Tu n\'as pas autorisé la page à utiliser Claude. Recharge-la et accepte la demande, ou change-le dans le menu Autorisations de l\'artifact.', rate_limited: 'Trop de questions d\'un coup, ou limite d\'usage atteinte. Réessaie dans un moment.', prompt_too_large: 'L\'extrait est trop long : ouvre une partie plus précise du cours.', image_rejected: 'Cette photo n\'est pas acceptée. Essaie un JPEG ou un PNG plus léger.', refused: 'Claude n\'a pas pu répondre à cette demande. Reformule ta question.' };
  const visible = (t) => {
    const L = String(t).split('\n');
    for (let i = L.length - 1; i >= Math.max(0, L.length - 3); i--) if (/^\s*M[ÉE]MO\s*:/i.test(L[i])) return L.slice(0, i).join('\n').trim();
    return String(t).trim();
  };
  // rendu léger : on échappe le HTML d'abord, puis gras, italique, code, titres, puces, tableaux et blocs de code.
  // Les formules ($…$, $$…$$, \(…\), \[…\]) sont mises de côté avant le Markdown, puis dessinées par MathJax.
  const MATHS = [];
  const protegerMaths = (t) => {
    MATHS.length = 0;
    const garde = (tex, d) => { MATHS.push({ tex: tex.trim(), d }); return '\u0000' + (MATHS.length - 1) + '\u0000'; };
    const RX = /\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$(?=[^\s$\d])([^$\n]*?[^\s$\\])\$(?!\d)/g;
    // le code (blocs ``` et `…`) n'est jamais lu comme une formule
    return String(t).split(/(```[\s\S]*?(?:```|$))/).map((bloc, i) => i % 2 ? bloc
      : bloc.split(/(`[^`\n]*`)/).map((x, j) => j % 2 ? x : x.replace(RX, (_, a, b, c, d) => a != null ? garde(a, 1) : b != null ? garde(b, 1) : c != null ? garde(c, 0) : garde(d, 0))).join('')).join('');
  };
  const rendreMaths = (h) => h.replace(/\u0000(\d+)\u0000/g, (_, n) => { const m = MATHS[+n]; return m ? `<span class="mzt-tex${m.d ? ' d' : ''}" data-d="${m.d}">${esc(m.tex)}</span>` : ''; });
  const inl = (s) => {
    const p = s.split('`'); if (p.length % 2 === 0) { const last = p.pop(); p[p.length - 1] += '`' + last; }
    return p.map((x, i) => i % 2 ? '<code>' + esc(x) + '</code>' : esc(x).replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*\w])\*([^*\n]+)\*(?![*\w])/g, '$1<em>$2</em>')).join('');
  };
  const cellules = (l) => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim());
  const md = (t) => {
    const out = []; let list = null, code = null, tab = null, olN = 0;
    const flushTab = () => {
      if (!tab) return;
      if (tab.length >= 2 && /^[\s|:-]+$/.test(tab[1]) && tab[1].includes('-')) {
        const [tete, , ...corps] = tab;
        out.push('<div class="mzt-tab"><table><thead><tr>' + cellules(tete).map((c) => '<th>' + inl(c) + '</th>').join('') + '</tr></thead><tbody>'
          + corps.map((r) => '<tr>' + cellules(r).map((c) => '<td>' + inl(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>');
      } else tab.forEach((r) => out.push('<p>' + inl(r) + '</p>'));
      tab = null;
    };
    const flush = () => { flushTab(); if (list) { out.push('</' + list + '>'); list = null; } };
    protegerMaths(t).split('\n').forEach((raw) => {
      if (/^\s*```/.test(raw)) { if (code === null) { flush(); code = []; } else { out.push('<pre>' + esc(code.join('\n')) + '</pre>'); code = null; } return; }
      if (code !== null) { code.push(raw); return; }
      let m;
      if (/^\s*\|.*\|\s*$/.test(raw)) { if (list) { out.push('</' + list + '>'); list = null; } (tab = tab || []).push(raw); return; }
      flushTab();
      if ((m = raw.match(/^\s*#{1,6}\s+(.*)$/))) { flush(); olN = 0; out.push('<p><strong>' + inl(m[1]) + '</strong></p>'); }
      else if ((m = raw.match(/^\s*[-*•]\s+(.*)$/))) { if (list !== 'ul') { flush(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + inl(m[1]) + '</li>'); }
      else if ((m = raw.match(/^\s*(\d+)[.)]\s+(.*)$/))) { if (list !== 'ol') { flush(); const n = +m[1]; olN = (n === 1 && olN > 1) ? olN : n; out.push('<ol start="' + olN + '">'); list = 'ol'; } out.push('<li>' + inl(m[2]) + '</li>'); olN++; }
      else if (!raw.trim()) flush();
      else { flush(); out.push('<p>' + inl(raw) + '</p>'); }
    });
    if (code !== null) out.push('<pre>' + esc(code.join('\n')) + '</pre>');
    flush(); return rendreMaths(out.join(''));
  };

  // ---------- MathJax : celui de la page s'il existe, sinon chargé à la première formule ----------
  let mjPret = null;
  const mathjax = () => mjPret || (mjPret = new Promise((ok, ko) => {
    if (!window.MathJax) {
      window.MathJax = { svg: { fontCache: 'global' }, startup: { typeset: false } };
      const s = document.createElement('script'); s.async = true; s.src = 'https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js';
      s.onerror = () => ko(new Error('MathJax')); document.head.appendChild(s);
    }
    let n = 0; const t = setInterval(() => {
      if (window.MathJax && MathJax.tex2svgPromise && MathJax.startup && MathJax.startup.promise) { clearInterval(t); MathJax.startup.promise.then(ok, ko); }
      else if (++n > 150) { clearInterval(t); ko(new Error('MathJax')); }
    }, 100);
  })).catch((e) => { mjPret = null; throw e; });
  const svgCache = new Map(); let file = Promise.resolve();
  function dessinerMaths(racine) {
    const spans = [...racine.querySelectorAll('.mzt-tex:not([data-ok])')]; if (!spans.length) return;
    mathjax().then(() => spans.forEach((sp) => {
      const cle = sp.dataset.d + '|' + sp.textContent;
      const poser = (n) => { if (!sp.isConnected || sp.dataset.ok) return; sp.textContent = ''; sp.appendChild(n.cloneNode(true)); sp.dataset.ok = '1'; };
      if (svgCache.has(cle)) return poser(svgCache.get(cle));
      file = file.then(() => MathJax.tex2svgPromise(sp.textContent, { display: sp.dataset.d === '1' }).then((n) => { svgCache.set(cle, n); poser(n); })).catch(() => {});
    })).catch(() => {});
  }
  async function ask(q, deep) {
    q = (q || '').trim(); deep = deep || $('#mztDeep').checked;
    if (busy || !q) return; if (!sample) { note(); return; }
    const c = refreshCtx();
    if (!cur || (cur.sec !== c.label && !forced)) { cur = { id: 't' + Date.now().toString(36), sec: c.label, date: today(), title: q.slice(0, 80), msgs: [] }; ST.threads.push(cur); }
    else if (!ST.threads.includes(cur)) ST.threads.push(cur);
    cur.msgs.push({ r: 'u', t: q }); busy = true; renderLog();
    const out = document.createElement('div'); out.className = 'mzt-m a'; out.textContent = deep ? 'Réflexion approfondie…' : 'Réflexion…'; $('#mztLog').appendChild(out);
    $('#mztSend').disabled = true; $('#mztStop').hidden = false;
    const style = deep
      ? 'Réponse APPROFONDIE (400 à 700 mots) : 1) l\'intuition avec une analogie, 2) l\'explication détaillée pas à pas, 3) pourquoi ça marche, 4) un exemple complet chiffré, 5) les pièges fréquents et ce qui tombe à l\'examen, 6) une question pour vérifier la compréhension.'
      : 'Réponse EXPLICATIVE (150 à 250 mots) : 1) l\'idée en une phrase, 2) l\'explication pas à pas, 3) un petit exemple chiffré ou concret, 4) une courte question pour vérifier la compréhension.';
    const mem = [];
    if (ST.memos.length) mem.push('DIFFICULTÉS DÉJÀ REPÉRÉES :\n' + ST.memos.slice(-12).map((m) => `- ${m.date} : ${m.text}`).join('\n'));
    const lastQ = ST.threads.flatMap((t) => t.msgs.filter((m) => m.r === 'u').map((m) => `[${t.sec}] ${m.t.slice(0, 100)}`)).slice(-6);
    if (lastQ.length) mem.push('SES DERNIÈRES QUESTIONS :\n' + lastQ.map((x) => '- ' + x).join('\n'));
    const rules = `Tu es le tuteur de ${C.student}, pour le module ${C.module}${C.prof ? ' du ' + C.prof : ''}. Il apprend souvent la notion pour la première fois.
Règles : réponds en français simple, en Markdown léger (**gras** pour les termes clés, tirets, étapes numérotées). Toute formule ou tout calcul s'écrit en LaTeX : $…$ dans la phrase, $$…$$ seul sur sa ligne pour une formule importante (ex. $\\hat y_i$, $$\\text{MSE}=\\frac{1}{n}\\sum_{i=1}^{n}(y_i-\\hat y_i)^2$$) ; jamais d'accents graves pour une formule, ils sont réservés au code et aux noms de fonctions. Un petit tableau Markdown est permis s'il clarifie (3 colonnes maximum, l'écran est étroit). ${style} Appuie-toi d'abord sur l'EXTRAIT ci-dessous et sur les conventions du prof ; si une source générale diffère du cours, signale l'écart et dis quelle version utiliser à l'examen (celle du prof). Pour un calcul, pose chaque étape et vérifie-la. S'il envoie une réponse ou une photo de brouillon, corrige étape par étape et nomme précisément l'erreur. Si tu n'es pas sûr, dis-le. S'il demande un mini-exercice, donne l'exercice sans la solution.
Utilise sa mémoire pour faire des liens avec ses confusions passées, sans la réciter.
Termine TOUJOURS par une dernière ligne séparée au format exact « MÉMO: … » qui résume en 15 mots maximum la difficulté révélée par sa question (ou « MÉMO: rien »). Cette ligne lui est cachée.
${C.conventions ? 'CONVENTIONS DU PROF : ' + C.conventions + '\n' : ''}MÉMOIRE DE L'ÉLÈVE :
${mem.join('\n\n') || '(rien pour l\'instant)'}
EXTRAIT (${c.label}) :
${c.text.slice(0, deep ? 9000 : 3500)}`;
    const recent = cur.msgs.slice(deep ? -9 : -5, -1).map((m) => ({ role: m.r === 'u' ? 'user' : 'assistant', content: m.t }));
    while (recent.length && recent[0].role !== 'user') recent.shift();
    const msgs = [...recent.filter((m) => m.content && m.content.trim()), { role: 'user', content: q }]; while (msgs.length > 1 && msgs[0].role !== 'user') msgs.shift(); msgs[0] = { role: 'user', content: rules + '\n\n---\nQuestion : ' + msgs[0].content };
    ctl = new AbortController();
    const opts = { modelTier: deep ? 'complex' : 'quick', cache: false, signal: ctl.signal, onText: ({ text }) => { out.innerHTML = md(visible(text)); dessinerMaths(out); $('#mztLog').scrollTop = 1e9; } };
    if (img) opts.images = [img];
    try {
      const r = await sample(msgs, opts);
      const mm = r.text.match(/(?:^|\n)\s*M[ÉE]MO\s*:\s*(.+)\s*$/i);
      cur.msgs.push({ r: 'a', t: visible(r.text) + (r.truncated ? '\n\n(Réponse coupée : pose une question plus ciblée.)' : ''), d: !!deep });
      if (mm && !/^\s*rien/i.test(mm[1])) { ST.memos.push({ date: today(), text: mm[1].trim().slice(0, 160) }); if (ST.memos.length > 30) ST.memos.shift(); saveMemos(); }
      await saveThread(cur);
    } catch (e) {
      const kept = e && e.text ? visible(e.text) : '';
      if (e && e.code === 'cancelled') { if (kept) cur.msgs.push({ r: 'a', t: kept + '\n(Arrêté.)' }); else cur.msgs.pop(); }
      else { cur.msgs.pop(); compacter(!!cur.msgs.length); out.textContent = (kept ? kept + '\n\n' : '') + (ERR[e && e.code] || 'Le tuteur n\'a pas pu répondre. Réessaie dans un instant.'); }
      if (!cur.msgs.length) ST.threads = ST.threads.filter((t) => t !== cur);
      saveLocal();
      if (!(e && e.code === 'cancelled')) { busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImgN').textContent = ''; return; }
    }
    busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImg').value = ''; $('#mztImgN').textContent = ''; renderLog();
  }

  // ---------- événements ----------
  $('#mztBtn').onclick = () => openPanel(null);
  $('#mztX').onclick = closePanel;
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#mztPan').hidden) closePanel(); });
  $('#mztTabH').onclick = () => view($('#mztHist').hidden ? 'hist' : 'chat');
  $('#mztTabM').onclick = () => view($('#mztMem').hidden ? 'mem' : 'chat');
  $('#mztQ').oninput = renderList;
  $('#mztList').onclick = (e) => { const id = e.target.dataset && e.target.dataset.cont; if (!id) return; cur = ST.threads.find((t) => t.id === id); view('chat'); $('#mztCtx').textContent = '· ' + cur.sec; renderLog(); };
  $('#mztMemL').onclick = (e) => { const i = e.target.dataset && e.target.dataset.memdel; if (i == null) return; ST.memos.splice(+i, 1); saveMemos(); renderMem(); };
  $('#mztChips').onclick = (e) => { const b = e.target.closest('[data-chip]'); if (!b) return; const t = $('#mztIn'); t.value = b.dataset.chip + (t.value ? ' : ' + t.value : ''); t.focus(); };
  $('#mztNew').onclick = () => { cur = null; renderLog(); };
  $('#mztStop').onclick = () => { if (ctl) ctl.abort(); };
  $('#mztImg').onchange = (e) => { img = e.target.files[0] || null; $('#mztImgN').textContent = img ? 'Photo : ' + img.name : ''; };
  $('#mztF').onsubmit = (e) => { e.preventDefault(); const v = $('#mztIn').value; $('#mztIn').value = ''; ask(v); };
  $('#mztIn').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#mztF').requestSubmit(); } });

  // ---------- capacités (facultatives) ----------
  const W = window.claude;
  if (W && W.use) {
    W.use('sample').then((s) => { sample = s; ready = true; note();
      if (s && s.limits) s.limits().then((l) => { if (l && l.images) { imgOK = true; $('#mztImgL').hidden = false; if (l.images.mediaTypes) $('#mztImg').accept = l.images.mediaTypes.join(','); } }).catch(() => {});
    }).catch(() => { ready = true; note(); });
    Promise.all([W.use('db'), W.use('user')]).then(async ([d, u]) => {
      if (!d || !u) return; const id = await u.id(); if (!id) return; db = d; base = 'data/users/' + id + '/mzt_' + C.id;
      try {
        const m = await db.doc(base).get(); if (m.exists) { const v = m.data() || {}; if (Array.isArray(v.memos)) ST.memos = JSON.parse(JSON.stringify(v.memos)); }
        const q = await db.collection(base + '/threads').get(); const remote = q.docs.map((x) => Object.assign({ id: x.id }, JSON.parse(JSON.stringify(x.data() || {}))));
        const map = {}; [...ST.threads, ...remote].forEach((t) => { if (!map[t.id] || (t.msgs || []).length > (map[t.id].msgs || []).length) map[t.id] = t; });
        ST.threads = Object.values(map).sort((a, b) => parseInt(a.id.slice(1), 36) - parseInt(b.id.slice(1), 36)); saveLocal();
      } catch (e) {}
    }).catch(() => {});
  } else { ready = true; note(); }

  window.MZT = { open: openPanel, close: closePanel };
})();

</script>

if(window.top===window&&location.protocol==="file:"){a.hidden=true;return}
a.href=p.indexOf("/decouvrir")===0||location.pathname.indexOf("/decouvrir")===0?"/decouvrir":"/app/modules";})();</script>
