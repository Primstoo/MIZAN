const MODULE={"slug":"biochimie","titre":"Biochimie structurale et métabolique","cle":"biochimie_scores","cleEtat":"biochimie_scores_etat","format":"score10","intro":"<p>Ce module couvre <strong>la biochimie structurale<\/strong> (glucides, lipides) et <strong>la biochimie métabolique<\/strong> du Pr Elabbadi (enzymes, glucides, lipides, acides aminés), puis <strong>l&#39;examen de septembre 2020 corrigé<\/strong>.<\/p>\n<p><strong>Comment l&#39;utiliser<\/strong><\/p>\n<ol>\n<li>Lis un chapitre et retiens le bilan de chaque voie : où, quoi au départ, quoi à l&#39;arrivée, combien d&#39;ATP.<\/li>\n<li>Pour les oui/non, une seule erreur dans la phrase la rend fausse.<\/li>\n<li>Fais le QCM du chapitre. <strong>8/10 = chapitre maîtrisé.<\/strong><\/li>\n<\/ol>\n<p><strong>À vérifier<\/strong> : le cours est rédigé par nous ; les supports structuraux fournis sont surtout des scans et des diaporamas.<\/p>\n","annexes":[],"cartes":null,"maths":false};
const CHAPS=[{"id":"glucides-lipides","t":"Glucides et lipides","seance":"Biochimie structurale · Glucides, lipides, nucléotides","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut reconnaître une fonction aldéhyde (−CHO), cétone (C=O dans la chaîne) et alcool (−OH).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Le glucose porte un aldéhyde ; le fructose une cétone. Comment les appelle-t-on ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Aldose (glucose) et cétose (fructose).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « petites briques, grandes chaînes ».<\/strong> Oses → diholosides → polyosides ; acides gras + glycérol → triglycérides.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Croire que l&#39;amidon et la cellulose sont pareils parce qu&#39;ils sont faits de glucose. La liaison change tout : α(1→4) dans l&#39;amidon (digestible), β(1→4) dans la cellulose (non digestible par l&#39;humain).<\/p>\n<\/aside><p>À la fin, tu sais classer glucides et lipides et dire à quoi ils servent.<\/p>\n<h2>Idée 1 · Les glucides<\/h2>\n<figure class=\"grille\"><figcaption>Glucides<\/figcaption><table><tr><th>Catégorie,<\/th><th>Exemples,<\/th><th>Rôle<\/th><\/tr><tr><td class=\"h1\">Oses,<\/td><td>glucose,<\/td><td>fructose,<\/td><td>ribose,<\/td><td>énergie,<\/td><td>briques<\/td><\/tr><tr><td class=\"h1\">Diholosides,<\/td><td>saccharose<\/td><td>(Glc-Fru),<\/td><td>lactose<\/td><td>(Gal-Glc),<\/td><td>maltose<\/td><td>(Glc-Glc),<\/td><td>transport,<\/td><td>alimentation<\/td><\/tr><tr><td class=\"h1\">Polyosides<\/td><td>de<\/td><td>réserve,<\/td><td>amidon<\/td><td>(plantes),<\/td><td>glycogène<\/td><td>(animaux),<\/td><td>stockage<\/td><\/tr><tr><td class=\"h1\">Polyosides<\/td><td>de<\/td><td>structure,<\/td><td>cellulose,<\/td><td>chitine,<\/td><td>soutien<\/td><\/tr><\/table><\/figure><h2>Idée 2 · Les lipides<\/h2>\n<figure class=\"grille\"><figcaption>Lipides<\/figcaption><table><tr><th>Famille,<\/th><th>Structure,<\/th><th>Rôle<\/th><\/tr><tr><td class=\"h1\">Acides<\/td><td>gras,<\/td><td>longue<\/td><td>chaîne<\/td><td>carbonée<\/td><td>+<\/td><td>COOH<\/td><td>(saturés<\/td><td>ou<\/td><td>insaturés),<\/td><td>énergie<\/td><\/tr><tr><td class=\"h1\">Triglycérides,<\/td><td>glycérol<\/td><td>+<\/td><td>3<\/td><td>acides<\/td><td>gras,<\/td><td>réserve<\/td><\/tr><tr><td class=\"h1\">Phospholipides,<\/td><td>glycérol<\/td><td>+<\/td><td>2<\/td><td>acides<\/td><td>gras<\/td><td>+<\/td><td>phosphate,<\/td><td>membranes<\/td><\/tr><tr><td class=\"h1\">Stérides<\/td><td>et<\/td><td>stérols,<\/td><td>noyau<\/td><td>stérane<\/td><td>(cholestérol),<\/td><td>membranes,<\/td><td>hormones<\/td><\/tr><\/table><\/figure><h2>Idée 3 · ATP et nucléotides<\/h2>\n<p>L&#39;ATP = adénine + ribose + 3 phosphates. Ses liaisons phosphoanhydride libèrent ≈ 30,5 kJ/mol à l&#39;hydrolyse (ATP → ADP + Pi).<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Application<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Pourquoi l&#39;humain ne digère-t-il pas la cellulose ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Il n&#39;a pas d&#39;enzyme capable de couper les liaisons β(1→4).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Un acide gras avec deux doubles liaisons est-il saturé ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Non : il est polyinsaturé.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Le saccharose est formé de :<\/div><button class=\"opt\" data-o=\"0\">glucose + fructose<\/button><button class=\"opt\" data-o=\"1\">glucose + galactose<\/button><button class=\"opt\" data-o=\"2\">glucose + glucose<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">La réserve glucidique animale :<\/div><button class=\"opt\" data-o=\"0\">glycogène<\/button><button class=\"opt\" data-o=\"1\">amidon<\/button><button class=\"opt\" data-o=\"2\">cellulose<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Les phospholipides forment :<\/div><button class=\"opt\" data-o=\"0\">les membranes<\/button><button class=\"opt\" data-o=\"1\">les réserves principales<\/button><button class=\"opt\" data-o=\"2\">les hormones stéroïdes<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Le cholestérol est :<\/div><button class=\"opt\" data-o=\"0\">un stérol<\/button><button class=\"opt\" data-o=\"1\">un acide gras<\/button><button class=\"opt\" data-o=\"2\">un ose<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">La cellulose est une liaison :<\/div><button class=\"opt\" data-o=\"0\">β(1→4)<\/button><button class=\"opt\" data-o=\"1\">α(1→4)<\/button><button class=\"opt\" data-o=\"2\">α(1→6)<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Le fructose est :<\/div><button class=\"opt\" data-o=\"0\">un cétose<\/button><button class=\"opt\" data-o=\"1\">un aldose<\/button><button class=\"opt\" data-o=\"2\">un diholoside<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Un triglycéride contient :<\/div><button class=\"opt\" data-o=\"0\">3 acides gras<\/button><button class=\"opt\" data-o=\"1\">2 acides gras et un phosphate<\/button><button class=\"opt\" data-o=\"2\">1 acide gras<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Le lactose est formé de :<\/div><button class=\"opt\" data-o=\"0\">galactose + glucose<\/button><button class=\"opt\" data-o=\"1\">glucose + fructose<\/button><button class=\"opt\" data-o=\"2\">glucose + glucose<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">L&#39;ATP contient :<\/div><button class=\"opt\" data-o=\"0\">un ribose<\/button><button class=\"opt\" data-o=\"1\">un désoxyribose<\/button><button class=\"opt\" data-o=\"2\">un glucose<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">La chitine est :<\/div><button class=\"opt\" data-o=\"0\">un polyoside de structure<\/button><button class=\"opt\" data-o=\"1\">un lipide<\/button><button class=\"opt\" data-o=\"2\">une protéine<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"glucides-lipides","rep":null,"tol":null},{"n":"glucides-lipides","rep":null,"tol":null},{"n":"glucides-lipides","rep":null,"tol":null}],"qcm":[{"n":"glucides-lipides","q":"Le saccharose est formé de :","o":["glucose + fructose","glucose + galactose","glucose + glucose"],"a":0,"e":"Sucre de table."},{"n":"glucides-lipides","q":"La réserve glucidique animale :","o":["glycogène","amidon","cellulose"],"a":0,"e":"Foie, muscles."},{"n":"glucides-lipides","q":"Les phospholipides forment :","o":["les membranes","les réserves principales","les hormones stéroïdes"],"a":0,"e":"Amphiphiles."},{"n":"glucides-lipides","q":"Le cholestérol est :","o":["un stérol","un acide gras","un ose"],"a":0,"e":"Noyau stérane."},{"n":"glucides-lipides","q":"La cellulose est une liaison :","o":["β(1→4)","α(1→4)","α(1→6)"],"a":0,"e":"Non digestible."},{"n":"glucides-lipides","q":"Le fructose est :","o":["un cétose","un aldose","un diholoside"],"a":0,"e":"Fonction cétone."},{"n":"glucides-lipides","q":"Un triglycéride contient :","o":["3 acides gras","2 acides gras et un phosphate","1 acide gras"],"a":0,"e":"Réserve."},{"n":"glucides-lipides","q":"Le lactose est formé de :","o":["galactose + glucose","glucose + fructose","glucose + glucose"],"a":0,"e":"Sucre du lait."},{"n":"glucides-lipides","q":"L&#39;ATP contient :","o":["un ribose","un désoxyribose","un glucose"],"a":0,"e":"Ribonucléotide."},{"n":"glucides-lipides","q":"La chitine est :","o":["un polyoside de structure","un lipide","une protéine"],"a":0,"e":"Carapaces, champignons."}]},{"id":"enzymologie","t":"Enzymologie","seance":"Biochimie métabolique · Enzymes, cinétique, inhibitions","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir qu&#39;une réaction est spontanée si ΔG &lt; 0, mais peut être très lente.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Une réaction avec ΔG &lt; 0 est-elle forcément rapide ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Non : ΔG dit si elle est possible, pas à quelle vitesse. C&#39;est l&#39;énergie d&#39;activation qui fixe la vitesse.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « l&#39;enzyme change le chemin, pas l&#39;arrivée ».<\/strong> Elle abaisse l&#39;énergie d&#39;activation ; elle ne change ni ΔG ni la constante d&#39;équilibre.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Écrire qu&#39;une enzyme baisse ΔG. <strong>Faux<\/strong> : c&#39;est la question 1 de l&#39;examen 2020.<\/p>\n<\/aside><p>À la fin, tu sais interpréter Km et Vmax et reconnaître le type d&#39;inhibition.<\/p>\n<h2>Idée 1 · Propriétés<\/h2>\n<figure class=\"grille\"><figcaption>Ce que fait et ne fait pas une enzyme<\/figcaption><table><tr><th>Une<\/th><th>enzyme…,<\/th><th>Oui<\/th><th>ou<\/th><th>non<\/th><\/tr><tr><td class=\"h1\">abaisse<\/td><td>l'énergie<\/td><td>d'activation,<\/td><td>oui<\/td><\/tr><tr><td class=\"h1\">change<\/td><td>ΔG<\/td><td>de<\/td><td>la<\/td><td>réaction,<\/td><td>non<\/td><\/tr><tr><td class=\"h1\">change<\/td><td>la<\/td><td>constante<\/td><td>d'équilibre,<\/td><td>non<\/td><\/tr><tr><td class=\"h1\">est<\/td><td>retrouvée<\/td><td>intacte<\/td><td>à<\/td><td>la<\/td><td>fin,<\/td><td>oui<\/td><\/tr><tr><td class=\"h1\">catalyse<\/td><td>dans<\/td><td>les<\/td><td>deux<\/td><td>sens<\/td><td>(si<\/td><td>la<\/td><td>réaction<\/td><td>est<\/td><td>réversible),<\/td><td>oui<\/td><\/tr><tr><td class=\"h1\">a<\/td><td>une<\/td><td>structure<\/td><td>tertiaire<\/td><td>à<\/td><td>l'état<\/td><td>natif,<\/td><td>oui<\/td><td>(quaternaire<\/td><td>seulement<\/td><td>si<\/td><td>plusieurs<\/td><td>sous-unités)<\/td><\/tr><\/table><\/figure><h2>Idée 2 · Michaelis-Menten<\/h2>\n<p>v = Vmax·[S] / (Km + [S]). Km est la concentration de substrat qui donne la moitié de Vmax : plus Km est petit, plus l&#39;affinité est grande.<\/p>\n<svg viewBox=\"0 0 320 130\" role=\"img\" aria-label=\"Courbe hyperbolique de Michaelis : v tend vers Vmax, Km à Vmax/2\" style=\"max-width:360px;width:100%\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M30 10v110h280\"/><path d=\"M30 120C70 50 120 35 300 25\" stroke=\"#D9824F\"/><path d=\"M30 22h270M30 70h45v50\" stroke-dasharray=\"4 4\"/><\/g>\n<g fill=\"currentColor\" font-size=\"10\"><text x=\"2\" y=\"20\">Vmax<\/text><text x=\"0\" y=\"74\">Vmax/2<\/text><text x=\"68\" y=\"128\">Km<\/text><text x=\"285\" y=\"128\">[S]<\/text><\/g>\n<\/svg><h2>Idée 3 · Les inhibitions<\/h2>\n<figure class=\"grille\"><figcaption>Types d'inhibition<\/figcaption><table><tr><th>Type,<\/th><th>Se<\/th><th>fixe<\/th><th>sur,<\/th><th>Km,<\/th><th>Vmax<\/th><\/tr><tr><td class=\"h1\">Compétitive,<\/td><td>le<\/td><td>site<\/td><td>actif,<\/td><td>augmente,<\/td><td>inchangée<\/td><\/tr><tr><td class=\"h1\">Non<\/td><td>compétitive,<\/td><td>un<\/td><td>autre<\/td><td>site,<\/td><td>inchangé,<\/td><td>diminue<\/td><\/tr><tr><td class=\"h1\">Incompétitive,<\/td><td>le<\/td><td>complexe<\/td><td>ES,<\/td><td>diminue,<\/td><td>diminue<\/td><\/tr><\/table><\/figure><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Examen 2020<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>« Le froid conserve les aliments en réduisant l&#39;énergie d&#39;activation » ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Non : le froid ne change pas Ea ; il ralentit les réactions parce que moins de molécules ont l&#39;énergie de franchir la barrière.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>« Un inhibiteur compétitif ne change pas la Vmax » ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Oui : un excès de substrat déplace l&#39;inhibiteur.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Une enzyme abaisse :<\/div><button class=\"opt\" data-o=\"0\">l&#39;énergie d&#39;activation<\/button><button class=\"opt\" data-o=\"1\">ΔG<\/button><button class=\"opt\" data-o=\"2\">la constante d&#39;équilibre<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">En fin de réaction l&#39;enzyme est :<\/div><button class=\"opt\" data-o=\"0\">inchangée<\/button><button class=\"opt\" data-o=\"1\">consommée<\/button><button class=\"opt\" data-o=\"2\">dénaturée<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Km faible signifie :<\/div><button class=\"opt\" data-o=\"0\">forte affinité<\/button><button class=\"opt\" data-o=\"1\">faible affinité<\/button><button class=\"opt\" data-o=\"2\">vitesse nulle<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Inhibiteur compétitif : Vmax<\/div><button class=\"opt\" data-o=\"0\">inchangée<\/button><button class=\"opt\" data-o=\"1\">diminue<\/button><button class=\"opt\" data-o=\"2\">augmente<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Inhibiteur non compétitif : Km<\/div><button class=\"opt\" data-o=\"0\">inchangé<\/button><button class=\"opt\" data-o=\"1\">augmente<\/button><button class=\"opt\" data-o=\"2\">diminue<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Le froid conserve les aliments car :<\/div><button class=\"opt\" data-o=\"0\">il ralentit les réactions<\/button><button class=\"opt\" data-o=\"1\">il réduit l&#39;énergie d&#39;activation<\/button><button class=\"opt\" data-o=\"2\">il change ΔG<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Une enzyme native a toujours une structure quaternaire :<\/div><button class=\"opt\" data-o=\"0\">oui<\/button><button class=\"opt\" data-o=\"1\">non<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">À [S] très grand, v tend vers :<\/div><button class=\"opt\" data-o=\"0\">Vmax<\/button><button class=\"opt\" data-o=\"1\">0<\/button><button class=\"opt\" data-o=\"2\">Km<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Une enzyme peut catalyser une réaction réversible :<\/div><button class=\"opt\" data-o=\"0\">dans les deux sens<\/button><button class=\"opt\" data-o=\"1\">dans un seul sens<\/button><button class=\"opt\" data-o=\"2\">jamais<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Le site actif est :<\/div><button class=\"opt\" data-o=\"0\">la zone de fixation du substrat<\/button><button class=\"opt\" data-o=\"1\">le gène de l&#39;enzyme<\/button><button class=\"opt\" data-o=\"2\">le produit<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"enzymologie","rep":null,"tol":null},{"n":"enzymologie","rep":null,"tol":null},{"n":"enzymologie","rep":null,"tol":null}],"qcm":[{"n":"enzymologie","q":"Une enzyme abaisse :","o":["l&#39;énergie d&#39;activation","ΔG","la constante d&#39;équilibre"],"a":0,"e":"Catalyse."},{"n":"enzymologie","q":"En fin de réaction l&#39;enzyme est :","o":["inchangée","consommée","dénaturée"],"a":0,"e":"Catalyseur."},{"n":"enzymologie","q":"Km faible signifie :","o":["forte affinité","faible affinité","vitesse nulle"],"a":0,"e":"Peu de substrat suffit."},{"n":"enzymologie","q":"Inhibiteur compétitif : Vmax","o":["inchangée","diminue","augmente"],"a":0,"e":"Surmontable."},{"n":"enzymologie","q":"Inhibiteur non compétitif : Km","o":["inchangé","augmente","diminue"],"a":0,"e":"Autre site."},{"n":"enzymologie","q":"Le froid conserve les aliments car :","o":["il ralentit les réactions","il réduit l&#39;énergie d&#39;activation","il change ΔG"],"a":0,"e":"Moins de chocs efficaces."},{"n":"enzymologie","q":"Une enzyme native a toujours une structure quaternaire :","o":["oui","non"],"a":1,"e":"Seulement si plusieurs sous-unités."},{"n":"enzymologie","q":"À [S] très grand, v tend vers :","o":["Vmax","0","Km"],"a":0,"e":"Saturation."},{"n":"enzymologie","q":"Une enzyme peut catalyser une réaction réversible :","o":["dans les deux sens","dans un seul sens","jamais"],"a":0,"e":"Elle ne change pas l&#39;équilibre."},{"n":"enzymologie","q":"Le site actif est :","o":["la zone de fixation du substrat","le gène de l&#39;enzyme","le produit"],"a":0,"e":"Spécificité."}]},{"id":"metabolisme-glucidique","t":"Bioénergétique et métabolisme glucidique","seance":"Glycolyse, cycle de Krebs, phosphorylation oxydative, couplage","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir que NAD⁺ capte des électrons et devient NADH.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>NADH est-il la forme oxydée ou réduite ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Réduite : il porte des électrons qu&#39;il donnera à la chaîne respiratoire.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « où, quoi, combien ».<\/strong> Pour chaque voie : compartiment, entrée et sortie, ATP et coenzymes.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Placer la glycolyse dans la mitochondrie. Elle se déroule dans le <strong>cytosol<\/strong> ; Krebs et la chaîne respiratoire sont mitochondriaux.<\/p>\n<\/aside><p>À la fin, tu sais faire le bilan de l&#39;oxydation complète du glucose et expliquer le couplage énergétique.<\/p>\n<h2>Idée 1 · Les voies et leurs lieux<\/h2>\n<figure class=\"grille\"><figcaption>Bilan<\/figcaption><table><tr><th>Voie,<\/th><th>Lieu,<\/th><th>Bilan<\/th><\/tr><tr><td class=\"h1\">Glycolyse,<\/td><td>cytosol,<\/td><td>glucose<\/td><td>→<\/td><td>2<\/td><td>pyruvates<\/td><td>+<\/td><td>2<\/td><td>ATP<\/td><td>+<\/td><td>2<\/td><td>NADH<\/td><\/tr><tr><td class=\"h1\">Pyruvate<\/td><td>déshydrogénase,<\/td><td>matrice,<\/td><td>2<\/td><td>pyruvates<\/td><td>→<\/td><td>2<\/td><td>acétyl-CoA<\/td><td>+<\/td><td>2<\/td><td>CO₂<\/td><td>+<\/td><td>2<\/td><td>NADH<\/td><\/tr><tr><td class=\"h1\">Cycle<\/td><td>de<\/td><td>Krebs,<\/td><td>matrice,<\/td><td>2<\/td><td>acétyl-CoA<\/td><td>→<\/td><td>4<\/td><td>CO₂<\/td><td>+<\/td><td>6<\/td><td>NADH<\/td><td>+<\/td><td>2<\/td><td>FADH₂<\/td><td>+<\/td><td>2<\/td><td>GTP<\/td><\/tr><tr><td class=\"h1\">Phosphorylation<\/td><td>oxydative,<\/td><td>membrane<\/td><td>interne,<\/td><td>NADH<\/td><td>et<\/td><td>FADH₂<\/td><td>→<\/td><td>ATP<\/td><td>(≈<\/td><td>30-32<\/td><td>ATP<\/td><td>au<\/td><td>total)<\/td><\/tr><\/table><\/figure><h2>Idée 2 · Le couplage énergétique<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Faire passer une réaction défavorable<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · 1. Réaction A : ΔG &gt; 0, impossible seule.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · 2. On la couple à une réaction B très favorable (souvent l&#39;hydrolyse de l&#39;ATP).<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · 3. Il faut que ΔG(A) + ΔG(B) &lt; 0.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · 4. Une enzyme spécifique réalise le couplage.<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Idée 3 · La photosynthèse<\/h2>\n<p>Phase claire (thylakoïdes) : la lumière produit ATP et NADPH, l&#39;eau est oxydée et libère O₂. Cycle de Calvin (stroma) : le CO₂ est fixé en glucides. Elle produit la biomasse, régénère l&#39;O₂ et consomme du CO₂. L&#39;activité humaine augmente le CO₂ ; plus de végétation le diminue. Le trou de la couche d&#39;ozone est dû surtout aux CFC, pas au CO₂.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Application<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Couplage : faut-il ΔG global &gt; 0 ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Non : il faut ΔG global &lt; 0.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Combien de CO₂ libère l&#39;oxydation complète d&#39;un glucose ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 6<\/b><\/p><p>6 (2 par la pyruvate déshydrogénase, 4 par le cycle de Krebs).<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">La glycolyse a lieu dans :<\/div><button class=\"opt\" data-o=\"0\">le cytosol<\/button><button class=\"opt\" data-o=\"1\">la mitochondrie<\/button><button class=\"opt\" data-o=\"2\">le noyau<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Le cycle de Krebs a lieu dans :<\/div><button class=\"opt\" data-o=\"0\">la matrice mitochondriale<\/button><button class=\"opt\" data-o=\"1\">le cytosol<\/button><button class=\"opt\" data-o=\"2\">le réticulum<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">La majorité de l&#39;ATP vient de :<\/div><button class=\"opt\" data-o=\"0\">la phosphorylation oxydative<\/button><button class=\"opt\" data-o=\"1\">la glycolyse<\/button><button class=\"opt\" data-o=\"2\">le cycle de Calvin<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Pour qu&#39;un couplage marche :<\/div><button class=\"opt\" data-o=\"0\">ΔG global &lt; 0<\/button><button class=\"opt\" data-o=\"1\">ΔG global &gt; 0<\/button><button class=\"opt\" data-o=\"2\">ΔG global = 0<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">La photosynthèse libère l&#39;O₂ à partir :<\/div><button class=\"opt\" data-o=\"0\">de l&#39;eau<\/button><button class=\"opt\" data-o=\"1\">du CO₂<\/button><button class=\"opt\" data-o=\"2\">du glucose<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Le cycle de Calvin se déroule dans :<\/div><button class=\"opt\" data-o=\"0\">le stroma<\/button><button class=\"opt\" data-o=\"1\">les thylakoïdes<\/button><button class=\"opt\" data-o=\"2\">la mitochondrie<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">L&#39;acétyl-CoA vient du pyruvate par :<\/div><button class=\"opt\" data-o=\"0\">la pyruvate déshydrogénase<\/button><button class=\"opt\" data-o=\"1\">la glycolyse<\/button><button class=\"opt\" data-o=\"2\">la β-oxydation seulement<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Le trou de la couche d&#39;ozone est surtout dû :<\/div><button class=\"opt\" data-o=\"0\">aux CFC<\/button><button class=\"opt\" data-o=\"1\">au CO₂<\/button><button class=\"opt\" data-o=\"2\">à la photosynthèse<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">NADH donne ses électrons :<\/div><button class=\"opt\" data-o=\"0\">à la chaîne respiratoire<\/button><button class=\"opt\" data-o=\"1\">au glucose<\/button><button class=\"opt\" data-o=\"2\">à la glycolyse<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Plus de forêts :<\/div><button class=\"opt\" data-o=\"0\">diminue le CO₂ atmosphérique<\/button><button class=\"opt\" data-o=\"1\">augmente le CO₂<\/button><button class=\"opt\" data-o=\"2\">n&#39;a aucun effet<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"metabolisme-glucidique","rep":null,"tol":null},{"n":"metabolisme-glucidique","rep":null,"tol":null},{"n":"metabolisme-glucidique","rep":["6"],"tol":null}],"qcm":[{"n":"metabolisme-glucidique","q":"La glycolyse a lieu dans :","o":["le cytosol","la mitochondrie","le noyau"],"a":0,"e":"Pas d&#39;O₂ nécessaire."},{"n":"metabolisme-glucidique","q":"Le cycle de Krebs a lieu dans :","o":["la matrice mitochondriale","le cytosol","le réticulum"],"a":0,"e":"Mitochondrie."},{"n":"metabolisme-glucidique","q":"La majorité de l&#39;ATP vient de :","o":["la phosphorylation oxydative","la glycolyse","le cycle de Calvin"],"a":0,"e":"Chaîne respiratoire."},{"n":"metabolisme-glucidique","q":"Pour qu&#39;un couplage marche :","o":["ΔG global &lt; 0","ΔG global &gt; 0","ΔG global = 0"],"a":0,"e":"Spontanéité."},{"n":"metabolisme-glucidique","q":"La photosynthèse libère l&#39;O₂ à partir :","o":["de l&#39;eau","du CO₂","du glucose"],"a":0,"e":"Photolyse."},{"n":"metabolisme-glucidique","q":"Le cycle de Calvin se déroule dans :","o":["le stroma","les thylakoïdes","la mitochondrie"],"a":0,"e":"Fixation du CO₂."},{"n":"metabolisme-glucidique","q":"L&#39;acétyl-CoA vient du pyruvate par :","o":["la pyruvate déshydrogénase","la glycolyse","la β-oxydation seulement"],"a":0,"e":"Décarboxylation oxydative."},{"n":"metabolisme-glucidique","q":"Le trou de la couche d&#39;ozone est surtout dû :","o":["aux CFC","au CO₂","à la photosynthèse"],"a":0,"e":"Chlorofluorocarbures."},{"n":"metabolisme-glucidique","q":"NADH donne ses électrons :","o":["à la chaîne respiratoire","au glucose","à la glycolyse"],"a":0,"e":"Complexe I."},{"n":"metabolisme-glucidique","q":"Plus de forêts :","o":["diminue le CO₂ atmosphérique","augmente le CO₂","n&#39;a aucun effet"],"a":0,"e":"Puits de carbone."}]},{"id":"metabolisme-lipidique","t":"Métabolisme des lipides","seance":"β-oxydation, corps cétoniques, cholestérol","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut se souvenir que l&#39;oxaloacétate est le point de départ du cycle de Krebs (il se combine à l&#39;acétyl-CoA).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Que donne acétyl-CoA + oxaloacétate ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Du citrate : c&#39;est la première réaction du cycle de Krebs.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « à jeun, le foie gère ».<\/strong> Sans glucose, le foie brûle les acides gras, fabrique du glucose (néoglucogenèse) et des corps cétoniques pour les autres organes.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Dire que le cholestérol cellulaire stimule sa propre synthèse. C&#39;est l&#39;inverse : il <strong>inhibe<\/strong> l&#39;HMG-CoA réductase et la production de récepteurs LDL.<\/p>\n<\/aside><p>À la fin, tu sais expliquer la formation des corps cétoniques à jeun et la régulation du cholestérol.<\/p>\n<h2>Idée 1 · La β-oxydation<\/h2>\n<p>Dans la matrice mitochondriale, l&#39;acide gras activé (acyl-CoA) est coupé de 2 carbones à chaque tour : acétyl-CoA + NADH + FADH₂.<\/p>\n<h2>Idée 2 · À jeun : les corps cétoniques<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>La logique de l'examen 2020 (question 13)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · 1. Sans glucose, les acides gras sont oxydés : beaucoup d&#39;acétyl-CoA et de NADH dans la mitochondrie.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · 2. Le NADH abondant pousse l&#39;oxaloacétate vers le malate : l&#39;oxaloacétate chute.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · 3. Le malate sort de la mitochondrie pour fabriquer du glucose (néoglucogenèse).<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · 4. Sans assez d&#39;oxaloacétate, Krebs ralentit ; l&#39;acétyl-CoA est dirigé vers les corps cétoniques.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · 5. Le foie fournit glucose et corps cétoniques aux autres organes.<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><svg viewBox=\"0 0 320 100\" role=\"img\" aria-label=\"Acétyl-CoA : vers le cycle de Krebs si oxaloacétate, sinon vers les corps cétoniques\" style=\"max-width:380px;width:100%\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M110 50h40l40-25h40M150 50l40 25h40\" /><path d=\"M190 75h40\" stroke=\"#D9824F\"/><\/g>\n<g fill=\"currentColor\" font-size=\"10\"><text x=\"20\" y=\"54\">acétyl-CoA<\/text><text x=\"235\" y=\"28\">Krebs<\/text><text x=\"235\" y=\"80\">corps cétoniques<\/text><\/g>\n<\/svg><h2>Idée 3 · Le cholestérol<\/h2>\n<p>Synthèse à partir d&#39;acétyl-CoA ; étape limitante : <strong>HMG-CoA réductase<\/strong> (cible des statines). Le cholestérol libre intracellulaire : inhibe l&#39;HMG-CoA réductase, réduit la synthèse des récepteurs LDL, stimule son estérification (stockage en stérides).<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Application<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Pourquoi un diabétique non traité peut-il produire beaucoup de corps cétoniques ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Sans insuline, ses cellules utilisent mal le glucose : elles brûlent les acides gras, l&#39;oxaloacétate manque et l&#39;acétyl-CoA part vers les corps cétoniques.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Combien de tours de β-oxydation pour un acide gras à 16 carbones ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 7<\/b><\/p><p>7 tours, qui donnent 8 acétyl-CoA.<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">La β-oxydation a lieu dans :<\/div><button class=\"opt\" data-o=\"0\">la matrice mitochondriale<\/button><button class=\"opt\" data-o=\"1\">le cytosol<\/button><button class=\"opt\" data-o=\"2\">le noyau<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">À jeun, l&#39;oxaloacétate mitochondrial chute car :<\/div><button class=\"opt\" data-o=\"0\">il est transformé en malate<\/button><button class=\"opt\" data-o=\"1\">il est stocké<\/button><button class=\"opt\" data-o=\"2\">il devient du cholestérol<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">À jeun, l&#39;acétyl-CoA en excès forme :<\/div><button class=\"opt\" data-o=\"0\">des corps cétoniques<\/button><button class=\"opt\" data-o=\"1\">du glycogène<\/button><button class=\"opt\" data-o=\"2\">de l&#39;amidon<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">L&#39;organe qui fournit glucose et corps cétoniques à jeun :<\/div><button class=\"opt\" data-o=\"0\">le foie<\/button><button class=\"opt\" data-o=\"1\">le muscle<\/button><button class=\"opt\" data-o=\"2\">le cerveau<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Le cholestérol libre :<\/div><button class=\"opt\" data-o=\"0\">inhibe l&#39;HMG-CoA réductase<\/button><button class=\"opt\" data-o=\"1\">stimule l&#39;HMG-CoA réductase<\/button><button class=\"opt\" data-o=\"2\">n&#39;a aucun effet<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Le cholestérol libre stimule :<\/div><button class=\"opt\" data-o=\"0\">son estérification<\/button><button class=\"opt\" data-o=\"1\">la production de récepteurs LDL<\/button><button class=\"opt\" data-o=\"2\">sa synthèse<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Chaque tour de β-oxydation retire :<\/div><button class=\"opt\" data-o=\"0\">2 carbones<\/button><button class=\"opt\" data-o=\"1\">1 carbone<\/button><button class=\"opt\" data-o=\"2\">4 carbones<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Les statines ciblent :<\/div><button class=\"opt\" data-o=\"0\">l&#39;HMG-CoA réductase<\/button><button class=\"opt\" data-o=\"1\">la lipase<\/button><button class=\"opt\" data-o=\"2\">le récepteur LDL<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Le cycle de Krebs ralentit à jeun par manque :<\/div><button class=\"opt\" data-o=\"0\">d&#39;oxaloacétate<\/button><button class=\"opt\" data-o=\"1\">d&#39;acétyl-CoA<\/button><button class=\"opt\" data-o=\"2\">d&#39;O₂<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Le malate sorti de la mitochondrie sert à :<\/div><button class=\"opt\" data-o=\"0\">la néoglucogenèse<\/button><button class=\"opt\" data-o=\"1\">la β-oxydation<\/button><button class=\"opt\" data-o=\"2\">la synthèse d&#39;ADN<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"metabolisme-lipidique","rep":null,"tol":null},{"n":"metabolisme-lipidique","rep":null,"tol":null},{"n":"metabolisme-lipidique","rep":["7"],"tol":null}],"qcm":[{"n":"metabolisme-lipidique","q":"La β-oxydation a lieu dans :","o":["la matrice mitochondriale","le cytosol","le noyau"],"a":0,"e":"Comme Krebs."},{"n":"metabolisme-lipidique","q":"À jeun, l&#39;oxaloacétate mitochondrial chute car :","o":["il est transformé en malate","il est stocké","il devient du cholestérol"],"a":0,"e":"NADH abondant."},{"n":"metabolisme-lipidique","q":"À jeun, l&#39;acétyl-CoA en excès forme :","o":["des corps cétoniques","du glycogène","de l&#39;amidon"],"a":0,"e":"Cétogenèse."},{"n":"metabolisme-lipidique","q":"L&#39;organe qui fournit glucose et corps cétoniques à jeun :","o":["le foie","le muscle","le cerveau"],"a":0,"e":"Rôle central."},{"n":"metabolisme-lipidique","q":"Le cholestérol libre :","o":["inhibe l&#39;HMG-CoA réductase","stimule l&#39;HMG-CoA réductase","n&#39;a aucun effet"],"a":0,"e":"Rétrocontrôle."},{"n":"metabolisme-lipidique","q":"Le cholestérol libre stimule :","o":["son estérification","la production de récepteurs LDL","sa synthèse"],"a":0,"e":"Stockage."},{"n":"metabolisme-lipidique","q":"Chaque tour de β-oxydation retire :","o":["2 carbones","1 carbone","4 carbones"],"a":0,"e":"Acétyl-CoA."},{"n":"metabolisme-lipidique","q":"Les statines ciblent :","o":["l&#39;HMG-CoA réductase","la lipase","le récepteur LDL"],"a":0,"e":"Anti-cholestérol."},{"n":"metabolisme-lipidique","q":"Le cycle de Krebs ralentit à jeun par manque :","o":["d&#39;oxaloacétate","d&#39;acétyl-CoA","d&#39;O₂"],"a":0,"e":"Limitation."},{"n":"metabolisme-lipidique","q":"Le malate sorti de la mitochondrie sert à :","o":["la néoglucogenèse","la β-oxydation","la synthèse d&#39;ADN"],"a":0,"e":"Fabrication de glucose."}]},{"id":"acides-amines","t":"Métabolisme des acides aminés","seance":"TD · Biosynthèse et dégradation des acides aminés","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut reconnaître un α-cétoacide (C=O à la place du NH₂) et un acide aminé.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Quel acide aminé correspond au pyruvate ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>L&#39;alanine.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « on échange le NH₂ ».<\/strong> La transamination transfère le groupement aminé d&#39;un acide aminé (souvent le glutamate) à un α-cétoacide.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Croire que l&#39;ammoniac est éliminé tel quel chez l&#39;humain. Il est toxique : le foie le convertit en <strong>urée<\/strong>.<\/p>\n<\/aside><p>À la fin, tu sais écrire une transamination et la réaction de la glutamate déshydrogénase.<\/p>\n<h2>Idée 1 · Fixer l&#39;ammoniac<\/h2>\n<p>Glutamate déshydrogénase : α-cétoglutarate + NH₄⁺ + NAD(P)H ⇄ glutamate + NAD(P)⁺ + H₂O. Réversible ; de fortes concentrations de NADPH et d&#39;α-cétoglutarate poussent vers l&#39;assimilation de l&#39;ammoniac.<\/p>\n<h2>Idée 2 · La transamination<\/h2>\n<figure class=\"grille\"><figcaption>Familles d'acides aminés non indispensables (TD)<\/figcaption><table><tr><th>α-cétoacide,<\/th><th>Acides<\/th><th>aminés<\/th><th>formés<\/th><\/tr><tr><td class=\"h1\">Pyruvate,<\/td><td>alanine<\/td><\/tr><tr><td class=\"h1\">Oxaloacétate,<\/td><td>aspartate,<\/td><td>asparagine<\/td><\/tr><tr><td class=\"h1\">α-cétoglutarate,<\/td><td>glutamate,<\/td><td>glutamine,<\/td><td>proline,<\/td><td>arginine<\/td><\/tr><tr><td class=\"h1\">3-hydroxypyruvate,<\/td><td>sérine<\/td><\/tr><\/table><\/figure><p><strong>Exemple.<\/strong> Glutamate + pyruvate ⇄ α-cétoglutarate + alanine (alanine aminotransférase, coenzyme : phosphate de pyridoxal).<\/p>\n<h2>Idée 3 · Dégradation et cycle de l&#39;urée<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Devenir d'un acide aminé dégradé<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · 1. Transamination : le NH₂ passe sur l&#39;α-cétoglutarate (glutamate).<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · 2. Désamination oxydative du glutamate : NH₄⁺ libéré.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · 3. Cycle de l&#39;urée (foie) : NH₄⁺ + CO₂ → urée, éliminée par les reins.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · 4. Le squelette carboné rejoint Krebs ou la néoglucogenèse.<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>TD<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Écris la transamination qui forme l&#39;aspartate.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Glutamate + oxaloacétate ⇄ α-cétoglutarate + aspartate.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>L&#39;arginine est-elle indispensable ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Seulement pour les nouveau-nés et les enfants, selon le TD.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Le pyruvate donne par transamination :<\/div><button class=\"opt\" data-o=\"0\">l&#39;alanine<\/button><button class=\"opt\" data-o=\"1\">l&#39;aspartate<\/button><button class=\"opt\" data-o=\"2\">la sérine<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">L&#39;oxaloacétate donne :<\/div><button class=\"opt\" data-o=\"0\">l&#39;aspartate<\/button><button class=\"opt\" data-o=\"1\">l&#39;alanine<\/button><button class=\"opt\" data-o=\"2\">la proline<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Principal donneur de NH₂ :<\/div><button class=\"opt\" data-o=\"0\">le glutamate<\/button><button class=\"opt\" data-o=\"1\">la glycine<\/button><button class=\"opt\" data-o=\"2\">l&#39;urée<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">L&#39;urée est fabriquée dans :<\/div><button class=\"opt\" data-o=\"0\">le foie<\/button><button class=\"opt\" data-o=\"1\">le rein<\/button><button class=\"opt\" data-o=\"2\">le muscle<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">La glutamate déshydrogénase est :<\/div><button class=\"opt\" data-o=\"0\">réversible<\/button><button class=\"opt\" data-o=\"1\">irréversible<\/button><button class=\"opt\" data-o=\"2\">absente du foie<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Coenzyme des aminotransférases :<\/div><button class=\"opt\" data-o=\"0\">phosphate de pyridoxal<\/button><button class=\"opt\" data-o=\"1\">NAD⁺<\/button><button class=\"opt\" data-o=\"2\">ATP<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">L&#39;ammoniac libre est :<\/div><button class=\"opt\" data-o=\"0\">toxique<\/button><button class=\"opt\" data-o=\"1\">inoffensif<\/button><button class=\"opt\" data-o=\"2\">une réserve<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Le squelette carboné d&#39;un acide aminé peut :<\/div><button class=\"opt\" data-o=\"0\">rejoindre Krebs ou la néoglucogenèse<\/button><button class=\"opt\" data-o=\"1\">être éliminé sous forme d&#39;urée<\/button><button class=\"opt\" data-o=\"2\">devenir de l&#39;ADN directement<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">La sérine dérive :<\/div><button class=\"opt\" data-o=\"0\">du 3-hydroxypyruvate<\/button><button class=\"opt\" data-o=\"1\">du pyruvate<\/button><button class=\"opt\" data-o=\"2\">de l&#39;α-cétoglutarate<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">La transamination change :<\/div><button class=\"opt\" data-o=\"0\">le groupement aminé de place<\/button><button class=\"opt\" data-o=\"1\">le nombre de carbones<\/button><button class=\"opt\" data-o=\"2\">l&#39;ADN<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"acides-amines","rep":null,"tol":null},{"n":"acides-amines","rep":null,"tol":null},{"n":"acides-amines","rep":null,"tol":null}],"qcm":[{"n": data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>1 <strong>Non<\/strong> (ΔG inchangé). 2 <strong>Oui<\/strong>. 3 <strong>Non<\/strong> (Kéq inchangée). 4 <strong>Oui<\/strong>. 5 <strong>Oui<\/strong>. 6 <strong>Non<\/strong> (seulement si plusieurs sous-unités).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>7 à 11<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>7 <strong>Non<\/strong> (le froid ne change pas Ea ; il ralentit les réactions). 8 <strong>Oui<\/strong>. 9 <strong>Oui<\/strong> (non compétitif classique). 10 <strong>Non<\/strong> (cytosol). 11 <strong>Oui<\/strong> (si la réaction est réversible).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Couplage et régulation (questions 12 à 14)<\/h3><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><ol start=\"12\">\n<li>Couplage : a) ΔG global &gt; 0 ; b) enzyme spécifique ; c) produit indispensable.<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>a <strong>Non<\/strong> (il faut ΔG &lt; 0). b <strong>Oui<\/strong>. c <strong>Non<\/strong> (ce n&#39;est pas une condition thermodynamique).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><ol start=\"13\">\n<li>À jeun : a) à e).<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>a <stro function statut(n) {
  if (MODULE.format === "score10") { const v = lireJ(MODULE.cle)[n]; if (v !== undefined) return [v >= 8 ? "ok" : "fragile", v / 10]; }
  if (MODULE.format === "best") { const v = (lireJ(MODULE.cle).notions || {})[n]; return v && v.best != null ? [v.best >= 0.8 ? "ok" : "fragile", v.best] : ["jamais", null]; }
  if (MODULE.format === "pc") { const v = lireJ(MODULE.cle)[n]; return v && v.pc !== undefined ? [v.pc >= 80 ? "ok" : "fragile", v.pc / 100] : ["jamais", null]; } const a = (etat().attempts[n] || []).slice(-5); if (!a.length) return ["jamais", null]; const r = a.reduce((x, y) => x + y, 0) / a.length; return [(etat().attempts[n].length >= 3 && r >= 0.8) ? "ok" : "fragile", r]; }

  if (MODULE.format === "score10") return lireJ(MODULE.cle)[c.id];
  if (MODULE.format === "pc") { const v = lireJ(MODULE.cle)[c.id]; return v && v.pc !== undefined ? Math.round(v.pc / 10) : undefined; }
  if (MODULE.format === "best") { const v = (lireJ(MODULE.cle).notions || {})[c.id]; return v && v.best != null ? Math.round(v.best * 10) : undefined; }

  }
  function openPanel(ctx) {
    forced = ctx && ctx.text ? ctx : null;
    $('#mztPan').hidden = false; $('#mztBtn').hidden = true; view('chat');
    const c = refreshCtx();
    if (!cur || cur.sec !== c.label) { const ts = ST.threads.filter((t) => t.sec === c.label); cur = forced ? null : ts[ts.length - 1] || null; }
    renderLog(); note(); setTimeout(() => $('#mztIn').focus(), 30);
  }
  function closePanel() { $('#mztPan').hidden = true; $('#mztBtn').hidden = false; forced = null; }

  // Sur téléphone, la réponse doit avoir la place : relances et note seulement sur une discussion vide.
  function compacter(on) { $('#mztChips').hidden = on; $('#mztNote').hidden = on; }
  function renderLog() {
    const log = $('#mztLog'); log.innerHTML = ''; compacter(!!(cur && cur.msgs.length));
    if (!cur || !cur.msgs.length) {
      log.innerHTML = `<div class="mzt-m a">Pose ta question sur « ${esc(context().label)} » : une phrase que tu ne comprends pas, un calcul à vérifier, un exemple en plus… Tu peux joindre une photo de ton brouillon.</div>`; return;
    }
    cur.msgs.forEach((m, i) => {
      const d = document.createElement('div'); d.className = 'mzt-m ' + (m.r === 'u' ? 'u' : 'a');
      if (m.d) d.innerHTML = '<span class="mzt-tag">Réponse approfondie</span>';
      if (m.r === 'u') d.appendChild(document.createTextNode(m.t)); else d.insertAdjacentHTML('beforeend', md(m.t)); log.appendChild(d);
      if (m.r === 'a' && i === cur.msgs.length - 1 && !m.d && !busy) {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'mzt-deepbtn'; b.textContent = 'Approfondir cette réponse';
        b.onclick = () => ask('Approfondis ta réponse précédente : explique plus en détail, avec un exemple complet et les pièges.', true); log.appendChild(b);
      }
    });
    dessinerMaths(log); log.scrollTop = 1e9;
  }
  function renderList() {
    const q = norm($('#mztQ').value || ''); const ts = [...ST.threads].reverse().filter((t) => !q || norm(t.msgs.map((m) => m.t).join(' ')).includes(q));
    $('#mztList').innerHTML = ts.length ? ts.map((t) => `<details class="mzt-item"><summary>${esc(t.title)}</summary><div class="mzt-meta">${esc(t.sec)} · ${esc(t.date)}</div>${t.msgs.map((m) => `<div class="mzt-m ${m.r === 'u' ? 'u' : 'a'}" style="margin:6px 0">${m.r === 'u' ? esc(m.t) : md(m.t)}</div>`).join('')}<button type="button" data-cont="${esc(t.id)}">Continuer cette discussion</button></details>`).join('')
      : `<p class="mzt-note">${ST.threads.length ? 'Aucune discussion ne contient ce mot.' : 'Aucune discussion pour l\'instant.'}</p>`;
    dessinerMaths($('#mztList'));
  }
  function renderMem() {
    $('#mztMemL').innerHTML = ST.memos.length ? ST.memos.map((m, i) => `<div class="mzt-item"><div class="mzt-meta">${esc(m.date)}</div>${esc(m.text)}<div><button type="button" data-memdel="${i}" style="margin-top:4px">Effacer</button></div></div>`).join('')
      : '<p class="mzt-note">Aucune note pour l\'instant. Elles apparaîtront au fil de tes questions.</p>';
  }

  // ---------- stockage compte ----------
  async function saveThread(t) {
    saveLocal(); if (!db) return;
    try { await db.collection(base + '/threads').doc(t.id).set({ sec: t.sec, date: t.date, title: t.title, msgs: t.msgs.slice(-40) }); } catch (e) {}
  }
  async function saveMemos() { saveLocal(); if (!db) return; try { await db.doc(base).set({ memos: ST.memos.slice(-30), updated: Date.now() }); } catch (e) {} }

  // ---------- appel au tuteur ----------
  const ERR = { not_granted: 'Tu n\'as pas autorisé la page à utiliser Claude. Recharge-la et accepte la demande, ou change-le dans le menu Autorisations de l\'artifact.', rate_limited: 'Trop de questions d\'un coup, ou limite d\'usage atteinte. Réessaie dans un moment.', prompt_too_large: 'L\'extrait est trop long : ouvre une partie plus précise du cours.', image_rejected: 'Cette photo n\'est pas acceptée. Essaie un JPEG ou un PNG plus léger.', refused: 'Claude n\'a pas pu répondre à cette demande. Reformule ta question.' };
  const visible = (t) => {
    const L = String(t).split('\n');
    for (let i = L.length - 1; i >= Math.max(0, L.length - 3); i--) if (/^\s*M[ÉE]MO\s*:/i.test(L[i])) return L.slice(0, i).join('\n').trim();
    return String(t).trim();
  };
  // rendu léger : on échappe le HTML d'abord, puis gras, italique, code, titres, puces, tableaux et blocs de code.
  // Les formules ($…$, $$…$$, \(…\), \[…\]) sont mises de côté avant le Markdown, puis dessinées par MathJax.
  const MATHS = [];
  const protegerMaths = (t) => {
    MATHS.length = 0;
    const garde = (tex, d) => { MATHS.push({ tex: tex.trim(), d }); return '\u0000' + (MATHS.length - 1) + '\u0000'; };
    const RX = /\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$(?=[^\s$])([^$\n]*?[^\s$\\])\$(?!\d)/g;
    // le code (blocs ``` et `…`) n'est jamais lu comme une formule
    return String(t).split(/(```[\s\S]*?(?:```|$))/).map((bloc, i) => i % 2 ? bloc
      : bloc.split(/(`[^`\n]*`)/).map((x, j) => j % 2 ? x : x.replace(RX, (_, a, b, c, d) => a != null ? garde(a, 1) : b != null ? garde(b, 1) : c != null ? garde(c, 0) : garde(d, 0))).join('')).join('');
  };
  const rendreMaths = (h) => h.replace(/\u0000(\d+)\u0000/g, (_, n) => { const m = MATHS[+n]; return m ? `<span class="mzt-tex${m.d ? ' d' : ''}" data-d="${m.d}">${esc(m.tex)}</span>` : ''; });
  const inl = (s) => {
    const p = s.split('`'); if (p.length % 2 === 0) { const last = p.pop(); p[p.length - 1] += '`' + last; }
    return p.map((x, i) => i % 2 ? '<code>' + esc(x) + '</code>' : esc(x).replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*\w])\*([^*\n]+)\*(?![*\w])/g, '$1<em>$2</em>')).join('');
  };
  const cellules = (l) => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim());
  const md = (t) => {
    const out = []; let list = null, code = null, tab = null, olN = 0;
    const flushTab = () => {
      if (!tab) return;
      if (tab.length >= 2 && /^[\s|:-]+$/.test(tab[1]) && tab[1].includes('-')) {
        const [tete, , ...corps] = tab;
        out.push('<div class="mzt-tab"><table><thead><tr>' + cellules(tete).map((c) => '<th>' + inl(c) + '</th>').join('') + '</tr></thead><tbody>'
          + corps.map((r) => '<tr>' + cellules(r).map((c) => '<td>' + inl(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>');
      } else tab.forEach((r) => out.push('<p>' + inl(r) + '</p>'));
      tab = null;
    };
    const flush = () => { flushTab(); if (list) { out.push('</' + list + '>'); list = null; } };
    protegerMaths(t).split('\n').forEach((raw) => {
      if (/^\s*```/.test(raw)) { if (code === null) { flush(); code = []; } else { out.push('<pre>' + esc(code.join('\n')) + '</pre>'); code = null; } return; }
      if (code !== null) { code.push(raw); return; }
      let m;
      if (/^\s*\|.*\|\s*$/.test(raw)) { if (list) { out.push('</' + list + '>'); list = null; } (tab = tab || []).push(raw); return; }
      flushTab();
      if ((m = raw.match(/^\s*#{1,6}\s+(.*)$/))) { flush(); olN = 0; out.push('<p><strong>' + inl(m[1]) + '</strong></p>'); }
      else if ((m = raw.match(/^\s*[-*•]\s+(.*)$/))) { if (list !== 'ul') { flush(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + inl(m[1]) + '</li>'); }
      else if ((m = raw.match(/^\s*(\d+)[.)]\s+(.*)$/))) { if (list !== 'ol') { flush(); const n = +m[1]; olN = (n === 1 && olN > 1) ? olN : n; out.push('<ol start="' + olN + '">'); list = 'ol'; } out.push('<li>' + inl(m[2]) + '</li>'); olN++; }
      else if (!raw.trim()) flush();
      else { flush(); out.push('<p>' + inl(raw) + '</p>'); }
    });
    if (code !== null) out.push('<pre>' + esc(code.join('\n')) + '</pre>');
    flush(); return rendreMaths(out.join(''));
  };

  // ---------- MathJax : celui de la page s'il existe, sinon chargé à la première formule ----------
  let mjPret = null;
  const mathjax = () => mjPret || (mjPret = new Promise((ok, ko) => {
    if (!window.MathJax) {
      window.MathJax = { svg: { fontCache: 'global' }, startup: { typeset: false } };
      const s = document.createElement('script'); s.async = true; s.src = 'https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js';
      s.onerror = () => ko(new Error('MathJax')); document.head.appendChild(s);
    }
    let n = 0; const t = setInterval(() => {
      if (window.MathJax && MathJax.tex2svgPromise && MathJax.startup && MathJax.startup.promise) { clearInterval(t); MathJax.startup.promise.then(ok, ko); }
      else if (++n > 150) { clearInterval(t); ko(new Error('MathJax')); }
    }, 100);
  })).catch((e) => { mjPret = null; throw e; });
  const svgCache = new Map(); let file = Promise.resolve();
  // tex2svg ne pose ni la feuille de style MathJax ni le cache des glyphes (police « global ») : sans eux, les glyphes sont invisibles,
  // seuls les caractères hors police (é, ô…) s'affichent en flottant, et le MathML d'accessibilité apparaît en clair. updateDocument les ajoute une fois.
  const pagePrete = () => { try { MathJax.startup.document.updateDocument(); } catch (e) {} };
  function dessinerMaths(racine) {
    const spans = [...racine.querySelectorAll('.mzt-tex:not([data-ok])')]; if (!spans.length) return;
    mathjax().then(() => spans.forEach((sp) => {
      const cle = sp.dataset.d + '|' + sp.textContent;
      const poser = (n) => { if (!sp.isConnected || sp.dataset.ok) return; sp.textContent = ''; sp.appendChild(n.cloneNode(true)); sp.dataset.ok = '1'; };
      if (svgCache.has(cle)) return poser(svgCache.get(cle));
      file = file.then(() => MathJax.tex2svgPromise(sp.textContent, { display: sp.dataset.d === '1' }).then((n) => { svgCache.set(cle, n); poser(n); pagePrete(); })).catch(() => {});
    })).catch(() => {});
  }
  async function ask(q, deep) {
    q = (q || '').trim(); deep = deep || $('#mztDeep').checked;
    if (busy || !q) return; if (!sample) { note(); return; }
    const c = refreshCtx();
    if (!cur || (cur.sec !== c.label && !forced)) { cur = { id: 't' + Date.now().toString(36), sec: c.label, date: today(), title: q.slice(0, 80), msgs: [] }; ST.threads.push(cur); }
    else if (!ST.threads.includes(cur)) ST.threads.push(cur);
    cur.msgs.push({ r: 'u', t: q }); busy = true; renderLog();
    const out = document.createElement('div'); out.className = 'mzt-m a'; out.textContent = deep ? 'Réflexion approfondie…' : 'Réflexion…'; $('#mztLog').appendChild(out);
    $('#mztSend').disabled = true; $('#mztStop').hidden = false;
    const style = deep
      ? 'Réponse APPROFONDIE (400 à 700 mots) : 1) l\'intuition avec une analogie, 2) l\'explication détaillée pas à pas, 3) pourquoi ça marche, 4) un exemple complet chiffré, 5) les pièges fréquents et ce qui tombe à l\'examen, 6) une question pour vérifier la compréhension.'
      : 'Réponse EXPLICATIVE (150 à 250 mots) : 1) l\'idée en une phrase, 2) l\'explication pas à pas, 3) un petit exemple chiffré ou concret, 4) une courte question pour vérifier la compréhension.';
    const mem = [];
    if (ST.memos.length) mem.push('DIFFICULTÉS DÉJÀ REPÉRÉES :\n' + ST.memos.slice(-12).map((m) => `- ${m.date} : ${m.text}`).join('\n'));
    const lastQ = ST.threads.flatMap((t) => t.msgs.filter((m) => m.r === 'u').map((m) => `[${t.sec}] ${m.t.slice(0, 100)}`)).slice(-6);
    if (lastQ.length) mem.push('SES DERNIÈRES QUESTIONS :\n' + lastQ.map((x) => '- ' + x).join('\n'));
    const rules = `Tu es le tuteur de ${C.student}, pour le module ${C.module}${C.prof ? ' du ' + C.prof : ''}. Il apprend souvent la notion pour la première fois.
Règles : réponds en français simple, en Markdown léger (**gras** pour les termes clés, tirets, étapes numérotées). Toute formule ou tout calcul s'écrit en LaTeX : $…$ dans la phrase, $$…$$ seul sur sa ligne pour une formule importante (ex. $\\hat y_i$, $$\\text{MSE}=\\frac{1}{n}\\sum_{i=1}^{n}(y_i-\\hat y_i)^2$$) ; jamais d'accents graves pour une formule, ils sont réservés au code et aux noms de fonctions. Un petit tableau Markdown est permis s'il clarifie (3 colonnes maximum, l'écran est étroit). ${style} Appuie-toi d'abord sur l'EXTRAIT ci-dessous et sur les conventions du prof ; si une source générale diffère du cours, signale l'écart et dis quelle version utiliser à l'examen (celle du prof). Pour un calcul, pose chaque étape et vérifie-la. S'il envoie une réponse ou une photo de brouillon, corrige étape par étape et nomme précisément l'erreur. Si tu n'es pas sûr, dis-le. S'il demande un mini-exercice, donne l'exercice sans la solution.
Utilise sa mémoire pour faire des liens avec ses confusions passées, sans la réciter.
Termine TOUJOURS par une dernière ligne séparée au format exact « MÉMO: … » qui résume en 15 mots maximum la difficulté révélée par sa question (ou « MÉMO: rien »). Cette ligne lui est cachée.
${C.conventions ? 'CONVENTIONS DU PROF : ' + C.conventions + '\n' : ''}MÉMOIRE DE L'ÉLÈVE :
${mem.join('\n\n') || '(rien pour l\'instant)'}
EXTRAIT (${c.label}) :
${c.text.slice(0, deep ? 9000 : 3500)}`;
    const recent = cur.msgs.slice(deep ? -9 : -5, -1).map((m) => ({ role: m.r === 'u' ? 'user' : 'assistant', content: m.t }));
    while (recent.length && recent[0].role !== 'user') recent.shift();
    const msgs = [...recent.filter((m) => m.content && m.content.trim()), { role: 'user', content: q }]; while (msgs.length > 1 && msgs[0].role !== 'user') msgs.shift(); msgs[0] = { role: 'user', content: rules + '\n\n---\nQuestion : ' + msgs[0].content };
    ctl = new AbortController();
    const opts = { modelTier: deep ? 'complex' : 'quick', cache: false, signal: ctl.signal, onText: ({ text }) => { out.innerHTML = md(visible(text)); dessinerMaths(out); $('#mztLog').scrollTop = 1e9; } };
    if (img) opts.images = [img];
    try {
      const r = await sample(msgs, opts);
      const mm = r.text.match(/(?:^|\n)\s*M[ÉE]MO\s*:\s*(.+)\s*$/i);
      cur.msgs.push({ r: 'a', t: visible(r.text) + (r.truncated ? '\n\n(Réponse coupée : pose une question plus ciblée.)' : ''), d: !!deep });
      if (mm && !/^\s*rien/i.test(mm[1])) { ST.memos.push({ date: today(), text: mm[1].trim().slice(0, 160) }); if (ST.memos.length > 30) ST.memos.shift(); saveMemos(); }
      await saveThread(cur);
    } catch (e) {
      const kept = e && e.text ? visible(e.text) : '';
      if (e && e.code === 'cancelled') { if (kept) cur.msgs.push({ r: 'a', t: kept + '\n(Arrêté.)' }); else cur.msgs.pop(); }
      else { cur.msgs.pop(); compacter(!!cur.msgs.length); out.textContent = (kept ? kept + '\n\n' : '') + (ERR[e && e.code] || 'Le tuteur n\'a pas pu répondre. Réessaie dans un instant.'); }
      if (!cur.msgs.length) ST.threads = ST.threads.filter((t) => t !== cur);
      saveLocal();
      if (!(e && e.code === 'cancelled')) { busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImgN').textContent = ''; return; }
    }
    busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImg').value = ''; $('#mztImgN').textContent = ''; renderLog();
  }

  // ---------- événements ----------
  $('#mztBtn').onclick = () => openPanel(null);
  $('#mztX').onclick = closePanel;
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#mztPan').hidden) closePanel(); });
  $('#mztTabH').onclick = () => view($('#mztHist').hidden ? 'hist' : 'chat');
  $('#mztTabM').onclick = () => view($('#mztMem').hidden ? 'mem' : 'chat');
  $('#mztQ').oninput = renderList;
  $('#mztList').onclick = (e) => { const id = e.target.dataset && e.target.dataset.cont; if (!id) return; cur = ST.threads.find((t) => t.id === id); view('chat'); $('#mztCtx').textContent = '· ' + cur.sec; renderLog(); };
  $('#mztMemL').onclick = (e) => { const i = e.target.dataset && e.target.dataset.memdel; if (i == null) return; ST.memos.splice(+i, 1); saveMemos(); renderMem(); };
  $('#mztChips').onclick = (e) => { const b = e.target.closest('[data-chip]'); if (!b) return; const t = $('#mztIn'); t.value = b.dataset.chip + (t.value ? ' : ' + t.value : ''); t.focus(); };
  $('#mztNew').onclick = () => { cur = null; renderLog(); };
  $('#mztStop').onclick = () => { if (ctl) ctl.abort(); };
  $('#mztImg').onchange = (e) => { img = e.target.files[0] || null; $('#mztImgN').textContent = img ? 'Photo : ' + img.name : ''; };
  $('#mztF').onsubmit = (e) => { e.preventDefault(); const v = $('#mztIn').value; $('#mztIn').value = ''; ask(v); };
  $('#mztIn').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#mztF').requestSubmit(); } });

  // ---------- capacités (facultatives) ----------
  const W = window.claude;
  if (W && W.use) {
    W.use('sample').then((s) => { sample = s; ready = true; note();
      if (s && s.limits) s.limits().then((l) => { if (l && l.images) { imgOK = true; $('#mztImgL').hidden = false; if (l.images.mediaTypes) $('#mztImg').accept = l.images.mediaTypes.join(','); } }).catch(() => {});
    }).catch(() => { ready = true; note(); });
    Promise.all([W.use('db'), W.use('user')]).then(async ([d, u]) => {
      if (!d || !u) return; const id = await u.id(); if (!id) return; db = d; base = 'data/users/' + id + '/mzt_' + C.id;
      try {
        const m = await db.doc(base).get(); if (m.exists) { const v = m.data() || {}; if (Array.isArray(v.memos)) ST.memos = JSON.parse(JSON.stringify(v.memos)); }
        const q = await db.collection(base + '/threads').get(); const remote = q.docs.map((x) => Object.assign({ id: x.id }, JSON.parse(JSON.stringify(x.data() || {}))));
        const map = {}; [...ST.threads, ...remote].forEach((t) => { if (!map[t.id] || (t.msgs || []).length > (map[t.id].msgs || []).length) map[t.id] = t; });
        ST.threads = Object.values(map).sort((a, b) => parseInt(a.id.slice(1), 36) - parseInt(b.id.slice(1), 36)); saveLocal();
      } catch (e) {}
    }).catch(() => {});
  } else { ready = true; note(); }

  window.MZT = { open: openPanel, close: closePanel };
})();

</script>
<script>(function(){var a=document.getElementById("retour");if(!a)return;var p="";try{p=window.top.location.pathname}catch(e){}
if(window.top===window&&location.protocol==="file:"){a.hidden=true;return}
a.href=p.indexOf("/decouvrir")===0||location.pathname.indexOf("/decouvrir")===0?"/decouvrir":"/app/modules";})();</script>
