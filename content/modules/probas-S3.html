<script>
const MODULE={"slug":"probas","titre":"Probabilités et statistiques","cle":"ps3_revision_v1","cleEtat":"ps3_revision_v1","format":"best","intro":"<p>Le cours chapitre par chapitre, avec <strong>QCM</strong>, <strong>flashcards</strong> (révision espacée) et <strong>TD corrigés</strong>.</p>\n<ul>\n<li><strong>Tableau de bord</strong> : tes notions à consolider, les plus importantes d&#39;abord.</li>\n<li><strong>Flashcards</strong> : quelques minutes par jour ; une carte réussie revient après 1, 3, 7, 14 puis 30 jours.</li>\n<li><strong>TD</strong> : cherche, ouvre l&#39;indice si besoin, compare avec le corrigé et note-toi.</li>\n<li><strong>Outils interactifs</strong> (en bas du menu) : calculs générés, examen blanc chronométré, annales interactives.</li>\n</ul>\n<p>Ta progression d&#39;avant la nouvelle version est conservée.</p>\n","annexes":[{"fichier":"probas-S3-outils.html","titre":"Outils interactifs (calculs générés, examen blanc chronométré, annales interactives)"}],"cartes":null,"maths":true};
const CHAPS=[{"id":"denombrement","t":"Dénombrement : compter les cas","seance":"A · Bases de probabilité","imp":2,"html":"<p class=\"small muted\">Source : TD 3, 4, 5 · base de tous les calculs</p>\n<p>Avant de calculer une probabilité, il faut souvent <b>compter</b> les cas possibles. Trois questions décident de la formule :</p>\n<ol class=\"steps\">\n<li><b>L'ordre compte-t-il ?</b> Tirer « une boule puis une autre » (ordre) ou « deux boules d'un coup » (pas d'ordre, on dit <i>simultanément</i>).</li>\n<li><b>Y a-t-il remise ?</b> Avec remise, le même objet peut ressortir.</li>\n<li><b>Combien d'objets</b> $n$ au total, et <b>combien</b> $p$ on en prend.</li>\n</ol>\n<div class=\"tablewrap\"><table class=\"t\"><tr><th>Situation</th><th>Nombre de cas</th><th>Exemple</th></tr>\n<tr><td>Ordre + sans remise (arrangement)</td><td>$A_n^p=\\dfrac{n!}{(n-p)!}$</td><td>podium de 3 parmi 10 : $A_{10}^3=720$</td></tr>\n<tr><td>Ordre + avec remise</td><td>$n^p$</td><td>code à 4 chiffres : $10^4$</td></tr>\n<tr><td>Sans ordre + sans remise (combinaison)</td><td>$C_n^p=\\dfrac{n!}{p!\\,(n-p)!}$</td><td>2 boules parmi 7 : $C_7^2=21$</td></tr>\n<tr><td>Tout ranger ($p=n$)</td><td>$n!$</td><td>5 livres sur une étagère : $120$</td></tr></table></div>\n<div class=\"box\"><b>Équiprobabilité.</b> Quand tous les résultats élémentaires ont la même chance (pièce équilibrée, tirage « au hasard »), on a\n$$P(A)=\\frac{\\text{Card}(A)}{\\text{Card}(\\Omega)}=\\frac{\\text{nombre de cas favorables}}{\\text{nombre de cas possibles}}.$$</div>\n<h4>Exemple du TD (exercice 5)</h4>\n<p>Une urne contient une boule « 0 », deux boules « 1 » et quatre boules « 3 ». On tire <b>simultanément</b> deux boules : $C_7^2=21$ paires équiprobables. La somme vaut 4 quand on tire un « 1 » et un « 3 » : $2\\times4=8$ paires, donc $P(X=4)=8/21$.</p>\n<div class=\"box trap\"><b>Piège.</b> « Simultanément » = combinaisons. Ne multiplie pas par 2 pour l'ordre, sinon il faut aussi compter $\\Omega$ avec ordre ($7\\times6=42$) : le résultat est le même, mais mélanger les deux conventions donne une erreur.</div><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 2 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>Réponses courtes</h2>\n<section class=\"exo\"><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Calcule $C_7^2$.</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 21</b></p><p>$C_7^2=\\frac{7\\times6}{2}=21$.</p>\n</div></div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Urne du TD (0 ; 1,1 ; 3,3,3,3), deux boules tirées simultanément. Donne $P(X=6)$ en décimal (somme = 6). Arrondis à 3 décimales.</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.2857142857142857</b></p><p>Il faut deux « 3 » : $C_4^2=6$ paires sur 21, soit $6/21=2/7\\approx0{,}286$.</p>\n</div></div></section><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">On tire simultanément 3 cartes parmi 32. Nombre de mains possibles ?</div><button class=\"opt\" data-o=\"0\">$32^3$</button><button class=\"opt\" data-o=\"1\">$A_{32}^3$</button><button class=\"opt\" data-o=\"2\">$C_{32}^3$</button><button class=\"opt\" data-o=\"3\">$3!$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">On lance une pièce 3 fois. Nombre de résultats possibles ?</div><button class=\"opt\" data-o=\"0\">6</button><button class=\"opt\" data-o=\"1\">8</button><button class=\"opt\" data-o=\"2\">9</button><button class=\"opt\" data-o=\"3\">3</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"denombrement","rep":["21"],"tol":0},{"n":"denombrement","rep":["0.2857142857142857"],"tol":0.002}],"qcm":[{"n":"denombrement","q":"On tire simultanément 3 cartes parmi 32. Nombre de mains possibles ?","o":["$32^3$","$A_{32}^3$","$C_{32}^3$","$3!$"],"a":2,"e":"Simultanément, sans ordre, sans remise : combinaison $C_{32}^3=4960$."},{"n":"denombrement","q":"On lance une pièce 3 fois. Nombre de résultats possibles ?","o":["6","8","9","3"],"a":1,"e":"Ordre + « remise » (chaque lancer a 2 issues) : $2^3=8$."}]},{"id":"probas","t":"Probabilité, conditionnelle, Bayes","seance":"A · Bases de probabilité","imp":2,"html":"<p class=\"small muted\">Source : TD 2, 4 · cours chapitre 1</p>\n<p>Une <b>expérience aléatoire</b> a des résultats imprévisibles. L'ensemble de tous les résultats est l'<b>univers</b> $\\Omega$. Un <b>événement</b> est une partie de $\\Omega$.</p>\n<div class=\"box\"><b>Règles de base</b> (à savoir réciter) :\n<ul><li>$0\\le P(A)\\le 1$, $P(\\Omega)=1$, $P(\\emptyset)=0$</li>\n<li>$P(\\bar A)=1-P(A)$</li>\n<li>$P(A\\cup B)=P(A)+P(B)-P(A\\cap B)$ ; si $A\\cap B=\\emptyset$ (incompatibles), $P(A\\cup B)=P(A)+P(B)$</li>\n<li>Si $A\\subset B$ : $P(A)\\le P(B)$ et $P(B\\setminus A)=P(B)-P(A)$</li></ul>\n« ET » se traduit par un produit (si indépendance ou en conditionnant), « OU » exclusif par une somme.</div>\n<h4>Probabilité conditionnelle</h4>\n<p>Si $P(B)\\neq0$, la probabilité de $A$ <b>sachant</b> que $B$ est réalisé :</p>\n$$P(A\\mid B)=\\frac{P(A\\cap B)}{P(B)}\\qquad\\text{donc}\\qquad P(A\\cap B)=P(B)\\,P(A\\mid B).$$\n<h4>Probabilités totales et Bayes</h4>\n<p>Si $A_1,\\dots,A_n$ forment un <b>système complet</b> (ils sont disjoints et leur réunion vaut $\\Omega$) :</p>\n$$P(B)=\\sum_{j=1}^n P(A_j)\\,P(B\\mid A_j)\\qquad\\qquad P(A_i\\mid B)=\\frac{P(A_i)\\,P(B\\mid A_i)}{\\sum_{j=1}^n P(A_j)\\,P(B\\mid A_j)}.$$\n<h4>Exemple (cours, 3 urnes)</h4>\n<p>On choisit une urne au hasard parmi 3, puis une boule. Si $P(\\text{rouge}\\mid U_1)=\\tfrac12$, $P(\\text{rouge}\\mid U_2)=\\tfrac14$, $P(\\text{rouge}\\mid U_3)=0$, alors $P(\\text{rouge})=\\tfrac13(\\tfrac12+\\tfrac14+0)=\\tfrac14$ et $P(U_1\\mid\\text{rouge})=\\dfrac{\\frac13\\cdot\\frac12}{\\frac14}=\\tfrac23$.</p>\n<div class=\"box trap\"><b>Piège.</b> $P(A\\mid B)\\neq P(B\\mid A)$ en général. Bayes sert justement à « retourner » le conditionnement.</div><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>Réponses courtes</h2>\n<section class=\"exo\"><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Même données. Calcule $P(A\\cup B)$.</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.7</b></p><p>$0{,}5+0{,}4-0{,}2=0{,}7$.</p>\n</div></div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Tournoi du TD 3 : chaque partie est gagnée par A avec probabilité 1/2. Probabilité que la finale s&#39;arrête en 2 parties (AA ou BB) ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.5</b></p><p>$P(AA)+P(BB)=\\frac14+\\frac14=\\frac12$.</p>\n</div></div></section><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">$P(A)=0{,}5$, $P(B)=0{,}4$, $P(A\\cap B)=0{,}2$. Que vaut $P(A\\mid B)$ ?</div><button class=\"opt\" data-o=\"0\">0,4</button><button class=\"opt\" data-o=\"1\">0,5</button><button class=\"opt\" data-o=\"2\">0,8</button><button class=\"opt\" data-o=\"3\">0,2</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">La formule de Bayes sert à calculer…</div><button class=\"opt\" data-o=\"0\">$P(B)$ à partir des $P(A_j)$</button><button class=\"opt\" data-o=\"1\">$P(A_i\\mid B)$ quand on connaît les $P(B\\mid A_j)$</button><button class=\"opt\" data-o=\"2\">$P(A\\cap B)$ pour des événements indépendants</button><button class=\"opt\" data-o=\"3\">le nombre de cas favorables</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"probas","rep":["0.7"],"tol":0.001},{"n":"probas","rep":["0.5"],"tol":0.001}],"qcm":[{"n":"probas","q":"$P(A)=0{,}5$, $P(B)=0{,}4$, $P(A\\cap B)=0{,}2$. Que vaut $P(A\\mid B)$ ?","o":["0,4","0,5","0,8","0,2"],"a":1,"e":"$0{,}2/0{,}4=0{,}5$."},{"n":"probas","q":"La formule de Bayes sert à calculer…","o":["$P(B)$ à partir des $P(A_j)$","$P(A_i\\mid B)$ quand on connaît les $P(B\\mid A_j)$","$P(A\\cap B)$ pour des événements indépendants","le nombre de cas favorables"],"a":1,"e":"Bayes retourne le conditionnement : on connaît $P(B\\mid A_j)$, on veut $P(A_i\\mid B)$."}]},{"id":"independance","t":"Indépendance d'événements","seance":"A · Bases de probabilité","imp":2,"html":"<p class=\"small muted\">Source : TD 2</p>\n<div class=\"box\">$A$ et $B$ sont <b>indépendants</b> $\\iff P(A\\cap B)=P(A)\\,P(B)$.</div>\n<p>Pour trois événements, on distingue :</p>\n<ul><li><b>Deux à deux</b> : $P(A\\cap B)=P(A)P(B)$, $P(A\\cap C)=P(A)P(C)$, $P(B\\cap C)=P(B)P(C)$.</li>\n<li><b>Mutuellement</b> (dans leur ensemble) : les trois égalités <b>et</b> $P(A\\cap B\\cap C)=P(A)P(B)P(C)$.</li></ul>\n<p>Deux à deux n'implique pas mutuellement. Contre-exemple du cours : deux pièces, $A$ = « 1<sup>re</sup> pile », $B$ = « 2<sup>e</sup> pile », $C$ = « une seule pile ». Chaque paire est indépendante ($1/4=1/2\\times1/2$) mais $A\\cap B\\cap C=\\emptyset$.</p>\n<h4>Démonstration classique (TD 2-II) : si $A$, $B$ indépendants, alors $A$ et $\\bar B$ aussi</h4>\n<ol class=\"steps\">\n<li>$A=(A\\cap B)\\cup(A\\cap\\bar B)$, union disjointe, donc $P(A)=P(A\\cap B)+P(A\\cap\\bar B)$.</li>\n<li>$P(A\\cap\\bar B)=P(A)-P(A)P(B)=P(A)\\,(1-P(B))=P(A)\\,P(\\bar B)$.</li>\n<li>Même raisonnement pour $\\bar A$ et $\\bar B$ : $P(\\bar A\\cap\\bar B)=1-P(A\\cup B)=\\dots=P(\\bar A)P(\\bar B)$.</li></ol>\n<div class=\"box trap\"><b>Piège.</b> Incompatibles ($A\\cap B=\\emptyset$) n'est pas indépendants. Si $P(A)>0$ et $P(B)>0$, deux événements incompatibles sont même forcément <b>dépendants</b> ($0\\neq P(A)P(B)$).</div><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 1 flashcard de ce chapitre ajoutée à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">$P(A)=0{,}3$, $P(B)=0{,}5$, $A$ et $B$ indépendants. $P(A\\cap B)$ ?</div><button class=\"opt\" data-o=\"0\">0,8</button><button class=\"opt\" data-o=\"1\">0,15</button><button class=\"opt\" data-o=\"2\">0,2</button><button class=\"opt\" data-o=\"3\">0</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">$A$ et $B$ incompatibles, de probabilités non nulles. Sont-ils indépendants ?</div><button class=\"opt\" data-o=\"0\">Oui toujours</button><button class=\"opt\" data-o=\"1\">Non, jamais</button><button class=\"opt\" data-o=\"2\">Ça dépend</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Trois événements indépendants deux à deux sont-ils mutuellement indépendants ?</div><button class=\"opt\" data-o=\"0\">Toujours</button><button class=\"opt\" data-o=\"1\">Pas forcément</button><div class=\"qq-e\" hidden></div></div></section>","ex":[],"qcm":[{"n":"independance","q":"$P(A)=0{,}3$, $P(B)=0{,}5$, $A$ et $B$ indépendants. $P(A\\cap B)$ ?","o":["0,8","0,15","0,2","0"],"a":1,"e":"Produit : $0{,}15$."},{"n":"independance","q":"$A$ et $B$ incompatibles, de probabilités non nulles. Sont-ils indépendants ?","o":["Oui toujours","Non, jamais","Ça dépend"],"a":1,"e":"$P(A\\cap B)=0\\neq P(A)P(B)&gt;0$."},{"n":"independance","q":"Trois événements indépendants deux à deux sont-ils mutuellement indépendants ?","o":["Toujours","Pas forcément"],"a":1,"e":"Il faut en plus $P(A\\cap B\\cap C)=P(A)P(B)P(C)$."}]},{"id":"vad","t":"V.a discrète : loi, espérance, variance","seance":"B · Variables aléatoires discrètes","imp":4,"html":"<p class=\"small muted\">Source : Examens 2020-21 ord., 2022-23 ratt. (4 pts)</p>\n<p>Une <b>variable aléatoire discrète</b> $X$ associe un nombre à chaque résultat ; elle prend des valeurs $x_1,x_2,\\dots$ en nombre fini ou dénombrable. Sa <b>loi</b> est la liste des couples $(x_i,\\,p_i)$ avec $p_i=P(X=x_i)$.</p>\n<div class=\"box\"><b>Vérifier qu'une suite est une loi de probabilité</b> : deux conditions, toutes deux à écrire.\n$$\\text{(1) } 0\\le p_i\\le 1\\ \\text{ pour tout } i\\qquad\\text{(2) }\\sum_i p_i=1$$</div>\n<h4>Les formules à connaître par cœur</h4>\n$$E(X)=\\sum_i x_i\\,p_i\\qquad E(g(X))=\\sum_i g(x_i)\\,p_i\\qquad V(X)=E(X^2)-\\big(E(X)\\big)^2$$\n$$E(aX+b)=aE(X)+b\\qquad V(aX+b)=a^2\\,V(X)\\qquad \\sigma(X)=\\sqrt{V(X)}$$\n<p>Fonction de répartition : $F(x)=P(X\\le x)=\\sum_{x_i\\le x}p_i$. C'est une fonction en escalier, croissante, de 0 à 1.</p>\n<h3>L'exercice qui tombe (4 pts)</h3>\n<p>$P(X=0)=(1-p)^2$, $P(X=1)=2p(1-p)$, $P(X=2)=p^2$ avec $0\\le p\\le1$.</p>\n<ol class=\"steps\">\n<li><b>C'est une loi.</b> Chaque terme est un produit de nombres de $[0,1]$ donc dans $[0,1]$ (pour $2p(1-p)$ : son maximum vaut $1/2$ en $p=1/2$). Somme : $(1-p)^2+2p(1-p)+p^2=\\big((1-p)+p\\big)^2=1$.</li>\n<li>$E(X)=0\\cdot(1-p)^2+1\\cdot2p(1-p)+2p^2=2p$.</li>\n<li>$E(X^2)=2p(1-p)+4p^2=2p+2p^2$, donc $V(X)=2p+2p^2-4p^2=2p(1-p)$.</li>\n<li>$Y=-3X+1$ : $E(Y)=-3E(X)+1=1-6p$ et $V(Y)=(-3)^2V(X)=18p(1-p)$.</li></ol>\n<div class=\"box prof\"><b>Remarque qui rapporte.</b> Cette loi est la binomiale $\\mathcal B(2,p)$ : on retrouve $E=np=2p$ et $V=np(1-p)$. Le dire en une ligne montre que tu as compris.</div>\n<div class=\"box trap\"><b>Pièges.</b> $V(-3X+1)=9V(X)$, jamais $-3V(X)$ ; la constante $+1$ disparaît dans la variance. Et $V(X)=E(X^2)-E(X)^2$, pas $E(X)^2-E(X^2)$.</div><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 3 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>Réponses courtes</h2>\n<section class=\"exo\"><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Avec la loi $(1-p)^2,\\ 2p(1-p),\\ p^2$ et $p=0{,}3$ : calcule $E(-3X+1)$.</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : -0.8</b></p><p>$1-6p=1-1{,}8=-0{,}8$.</p>\n</div></div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Même loi, $p=0{,}3$ : calcule $V(-3X+1)$.</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 3.78</b></p><p>$18p(1-p)=18\\times0{,}3\\times0{,}7=3{,}78$.</p>\n</div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>TD 1 : $X(a)=X(b)=X(c)=X(d)=-1$, $X(e)=0$ avec $P(\\{a,b\\})=2/5$, $P(\\{c,d\\})=1/5$, $P(\\{e\\})=2/5$. Donne $P(X=-1)$ en décimal.</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.6</b></p><p>$2/5+1/5=3/5=0{,}6$.</p>\n</div></div></section><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">$V(-3X+1)$ vaut :</div><button class=\"opt\" data-o=\"0\">$-3V(X)+1$</button><button class=\"opt\" data-o=\"1\">$9V(X)+1$</button><button class=\"opt\" data-o=\"2\">$9V(X)$</button><button class=\"opt\" data-o=\"3\">$-3V(X)$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Pour montrer qu&#39;une suite $(p_i)$ est une loi de probabilité, on vérifie…</div><button class=\"opt\" data-o=\"0\">seulement $\\sum p_i=1$</button><button class=\"opt\" data-o=\"1\">$p_i\\ge0$ et $\\sum p_i=1$</button><button class=\"opt\" data-o=\"2\">$E(X)$ existe</button><button class=\"opt\" data-o=\"3\">que $F$ est continue</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"vad","rep":["-0.8"],"tol":0.001},{"n":"vad","rep":["3.78"],"tol":0.001},{"n":"vad","rep":["0.6"],"tol":0.001}],"qcm":[{"n":"vad","q":"$V(-3X+1)$ vaut :","o":["$-3V(X)+1$","$9V(X)+1$","$9V(X)$","$-3V(X)$"],"a":2,"e":"$V(aX+b)=a^2V(X)$."},{"n":"vad","q":"Pour montrer qu&#39;une suite $(p_i)$ est une loi de probabilité, on vérifie…","o":["seulement $\\sum p_i=1$","$p_i\\ge0$ et $\\sum p_i=1$","$E(X)$ existe","que $F$ est continue"],"a":1,"e":"Positivité (donc $\\le1$) et somme égale à 1."}]},{"id":"linearite","t":"Preuves : E(X+Y) et E(XY)","seance":"B · Variables aléatoires discrètes","imp":3,"html":"<p class=\"small muted\">Source : Examen 2023-24 ord. (4 pts)</p>\n<p>Ces deux démonstrations sont courtes et tombent telles quelles. On travaille avec la <b>loi du couple</b> $p_{ij}=P(X=x_i,\\,Y=y_j)$ et ses marginales $p_{i\\bullet}=\\sum_j p_{ij}=P(X=x_i)$, $p_{\\bullet j}=\\sum_i p_{ij}=P(Y=y_j)$.</p>\n<h4>1) $E(X+Y)=E(X)+E(Y)$</h4>\n$$\\begin{aligned}E(X+Y)&=\\sum_i\\sum_j (x_i+y_j)\\,p_{ij}=\\sum_i x_i\\sum_j p_{ij}+\\sum_j y_j\\sum_i p_{ij}\\\\&=\\sum_i x_i\\,p_{i\\bullet}+\\sum_j y_j\\,p_{\\bullet j}=E(X)+E(Y).\\end{aligned}$$\n<h4>2) Si $X$ et $Y$ sont indépendantes, $E(XY)=E(X)E(Y)$</h4>\n<p>Indépendance : $p_{ij}=p_{i\\bullet}\\,p_{\\bullet j}$ pour tous $i,j$.</p>\n$$E(XY)=\\sum_i\\sum_j x_iy_j\\,p_{ij}=\\sum_i\\sum_j x_iy_j\\,p_{i\\bullet}p_{\\bullet j}=\\Big(\\sum_i x_ip_{i\\bullet}\\Big)\\Big(\\sum_j y_jp_{\\bullet j}\\Big)=E(X)E(Y).$$\n<div class=\"box prof\"><b>Barème probable.</b> Écrire la définition avec la loi du couple, séparer les sommes, reconnaître les marginales, citer l'hypothèse d'indépendance au bon endroit. Chaque étape compte : n'en saute aucune.</div>\n<div class=\"box trap\"><b>Piège.</b> La première égalité n'a besoin d'aucune hypothèse. La seconde exige l'indépendance : la réciproque est fausse ($E(XY)=E(X)E(Y)$ n'entraîne pas l'indépendance, voir la notion « Covariance nulle »).</div><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">$E(X+Y)=E(X)+E(Y)$ nécessite…</div><button class=\"opt\" data-o=\"0\">l&#39;indépendance</button><button class=\"opt\" data-o=\"1\">rien de plus que l&#39;existence des espérances</button><button class=\"opt\" data-o=\"2\">que $X$ et $Y$ aient la même loi</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Dans la preuve de $E(XY)=E(X)E(Y)$, l&#39;étape clé est :</div><button class=\"opt\" data-o=\"0\">$p_{ij}=p_{i\\bullet}+p_{\\bullet j}$</button><button class=\"opt\" data-o=\"1\">$p_{ij}=p_{i\\bullet}\\,p_{\\bullet j}$</button><button class=\"opt\" data-o=\"2\">$\\sum_j p_{ij}=1$</button><div class=\"qq-e\" hidden></div></div></section>","ex":[],"qcm":[{"n":"linearite","q":"$E(X+Y)=E(X)+E(Y)$ nécessite…","o":["l&#39;indépendance","rien de plus que l&#39;existence des espérances","que $X$ et $Y$ aient la même loi"],"a":1,"e":"La linéarité de l&#39;espérance est toujours vraie."},{"n":"linearite","q":"Dans la preuve de $E(XY)=E(X)E(Y)$, l&#39;étape clé est :","o":["$p_{ij}=p_{i\\bullet}+p_{\\bullet j}$","$p_{ij}=p_{i\\bullet}\\,p_{\\bullet j}$","$\\sum_j p_{ij}=1$"],"a":1,"e":"C&#39;est la définition de l&#39;indépendance pour un couple discret."}]},{"id":"couple","t":"Couple discret : tableau, marginales, covariance","seance":"B · Variables aléatoires discrètes","imp":5,"html":"<p class=\"small muted\">Source : 5 examens sur 11 (les « trois pièces »), 4 à 8 pts</p>\n<p>C'est l'exercice le plus répété du module. Méthode en 6 étapes, toujours la même.</p>\n<h3>L'énoncé</h3>\n<p>On lance trois pièces. $X$ = nombre de faces sur les <b>deux premières</b>, $Y$ = nombre de piles sur les <b>deux dernières</b>. La pièce du milieu compte pour les deux.</p>\n<h4>Étape 1 : lister les 8 résultats équiprobables (probabilité 1/8 chacun)</h4>\n<div class=\"tablewrap\"><table class=\"t\"><tr><th>Résultat</th><th>FFF</th><th>FFP</th><th>FPF</th><th>FPP</th><th>PFF</th><th>PFP</th><th>PPF</th><th>PPP</th></tr>\n<tr><td>$X$ (faces sur 1-2)</td><td>2</td><td>2</td><td>1</td><td>1</td><td>1</td><td>1</td><td>0</td><td>0</td></tr>\n<tr><td>$Y$ (piles sur 2-3)</td><td>0</td><td>1</td><td>1</td><td>2</td><td>0</td><td>1</td><td>1</td><td>2</td></tr></table></div>\n<h4>Étape 2 : le tableau de la loi du couple, avec les marges</h4>\n<div class=\"tablewrap\"><table class=\"t\"><tr><th>$X\\backslash Y$</th><th>0</th><th>1</th><th>2</th><th>$P(X=i)$</th></tr>\n<tr><th>0</th><td>0</td><td>1/8</td><td>1/8</td><td>2/8</td></tr>\n<tr><th>1</th><td>1/8</td><td>2/8</td><td>1/8</td><td>4/8</td></tr>\n<tr><th>2</th><td>1/8</td><td>1/8</td><td>0</td><td>2/8</td></tr>\n<tr><th>$P(Y=j)$</th><td>2/8</td><td>4/8</td><td>2/8</td><td>1</td></tr></table></div>\n<h4>Étape 3 : lois marginales</h4>\n<p>On somme les lignes (loi de $X$) et les colonnes (loi de $Y$) : $X$ et $Y$ prennent 0, 1, 2 avec probabilités $\\tfrac14,\\tfrac12,\\tfrac14$.</p>\n<h4>Étape 4 : indépendance ?</h4>\n<p>Il suffit d'<b>un seul</b> contre-exemple : $P(X=0,Y=0)=0\\neq P(X=0)P(Y=0)=\\tfrac14\\cdot\\tfrac14$. Donc <b>non indépendantes</b>. (Pour prouver l'indépendance, il faudrait vérifier <i>toutes</i> les cases.)</p>\n<h4>Étape 5 : covariance</h4>\n$$E(X)=E(Y)=0\\cdot\\tfrac14+1\\cdot\\tfrac12+2\\cdot\\tfrac14=1,\\qquad E(XY)=\\sum_{i,j}ij\\,p_{ij}=1\\cdot1\\cdot\\tfrac28+1\\cdot2\\cdot\\tfrac18+2\\cdot1\\cdot\\tfrac18=\\tfrac34$$\n$$\\text{Cov}(X,Y)=E(XY)-E(X)E(Y)=\\tfrac34-1=-\\tfrac14.$$\n<h4>Étape 6 : loi du couple $(\\min\\{X,Y\\},\\max\\{X,Y\\})$</h4>\n<p>Pour chaque case non nulle, on écrit le couple (min, max) puis on regroupe :</p>\n<div class=\"tablewrap\"><table class=\"t\"><tr><th>$(X,Y)$</th><td>(0,1)</td><td>(0,2)</td><td>(1,0)</td><td>(1,1)</td><td>(1,2)</td><td>(2,0)</td><td>(2,1)</td></tr>\n<tr><th>(min, max)</th><td>(0,1)</td><td>(0,2)</td><td>(0,1)</td><td>(1,1)</td><td>(1,2)</td><td>(0,2)</td><td>(1,2)</td></tr>\n<tr><th>proba</th><td>1/8</td><td>1/8</td><td>1/8</td><td>2/8</td><td>1/8</td><td>1/8</td><td>1/8</td></tr></table></div>\n<div class=\"tablewrap\"><table class=\"t\"><tr><th>$\\min\\backslash\\max$</th><th>0</th><th>1</th><th>2</th></tr>\n<tr><th>0</th><td>0</td><td>1/4</td><td>1/4</td></tr><tr><th>1</th><td>—</td><td>1/4</td><td>1/4</td></tr><tr><th>2</th><td>—</td><td>—</td><td>0</td></tr></table></div>\n<div class=\"box prof\"><b>Variante vue en TD (examen 7 pts)</b> : tableau $X\\in\\{1,2,3\\}$, $Y\\in\\{1,2,3,4\\}$ dont chaque case vaut le produit des marges. Là il faut écrire « $P(X=i,Y=j)=P(X=i)P(Y=j)$ pour <b>toutes</b> les cases », donc indépendance et $\\text{Cov}=0$.</div>\n<div class=\"box trap\"><b>Pièges vus dans les copies.</b> Oublier que la pièce du milieu est commune ; confondre « faces » et « piles » ; ne pas vérifier que le tableau somme à 1 ; conclure à l'indépendance sans tout vérifier.</div>\n<h4>Loi de la somme (cours 7.4)</h4>\n<p>$P(X+Y=k)=\\sum_{i}P(X=i,\\,Y=k-i)$ : on additionne les cases d'une même « anti-diagonale ».</p><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 5 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>Réponses courtes</h2>\n<section class=\"exo\"><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Trois pièces : donne $P(X=1,Y=1)$ en décimal.</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.25</b></p><p>FPF et PFP : $2/8=0{,}25$.</p>\n</div></div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Calcule $E(XY)$ (trois pièces), en décimal.</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.75</b></p><p>$\\frac28+\\frac28+\\frac28=\\frac34$.</p>\n</div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Donne $\\text{Cov}(X,Y)$ en décimal.</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : -0.25</b></p><p>$\\frac34-1\\times1=-\\frac14$.</p>\n</div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Toujours les trois pièces : $P(X+Y=2)$ en décimal.</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.5</b></p><p>Cases (0,2), (1,1), (2,0) : $\\frac18+\\frac28+\\frac18=\\frac12$.</p>\n</div></div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>$P(\\min\\{X,Y\\}=0)$ en décimal.</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.5</b></p><p>(0,1) et (0,2) : $\\frac14+\\frac14$.</p>\n</div></div></section><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Pour montrer que $X$ et $Y$ ne sont pas indépendantes, il faut…</div><button class=\"opt\" data-o=\"0\">vérifier toutes les cases</button><button class=\"opt\" data-o=\"1\">trouver une seule case où $p_{ij}\\neq p_{i\\bullet}p_{\\bullet j}$</button><button class=\"opt\" data-o=\"2\">montrer que $\\text{Cov}\\neq0$ uniquement</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"couple","rep":["0.25"],"tol":0.001},{"n":"couple","rep":["0.75"],"tol":0.001},{"n":"couple","rep":["-0.25"],"tol":0.001},{"n":"couple","rep":["0.5"],"tol":0.001},{"n":"couple","rep":["0.5"],"tol":0.001}],"qcm":[{"n":"couple","q":"Pour montrer que $X$ et $Y$ ne sont pas indépendantes, il faut…","o":["vérifier toutes les cases","trouver une seule case où $p_{ij}\\neq p_{i\\bullet}p_{\\bullet j}$","montrer que $\\text{Cov}\\neq0$ uniquement"],"a":1,"e":"Un seul contre-exemple suffit (et $\\text{Cov}\\neq0$ marche aussi, mais un contre-exemple est plus rapide)."}]},{"id":"covnulle","t":"Covariance nulle et indépendance","seance":"B · Variables aléatoires discrètes","imp":4,"html":"<p class=\"small muted\">Source : Examens 2020-21 ratt., 2021-22 ratt. (5 à 8 pts)</p>\n$$\\text{Cov}(X,Y)=E\\big[(X-E X)(Y-E Y)\\big]=E(XY)-E(X)E(Y)$$\n<div class=\"box\"><b>Le résultat central.</b> Indépendantes $\\Rightarrow$ $\\text{Cov}=0$. <b>La réciproque est fausse en général</b>, sauf pour deux variables de Bernoulli.</div>\n<h3>1) Indépendantes ⇒ Cov = 0</h3>\n<p>Cas continu (examen 2021-22) : <b>CNS d'indépendance</b> : $f(x,y)=f_X(x)\\,f_Y(y)$ pour tout $(x,y)$ (ou $F(x,y)=F_X(x)F_Y(y)$). Alors\n$$E(XY)=\\iint xy\\,f_X(x)f_Y(y)\\,dx\\,dy=\\int x f_X(x)dx\\int yf_Y(y)dy=E(X)E(Y),$$ donc $\\text{Cov}(X,Y)=0$.</p>\n<h3>2) Contre-exemple : $Z\\sim\\mathcal N(0,1)$ et $T=Z^2$</h3>\n<ol class=\"steps\"><li>$E(Z^3)=\\int_{-\\infty}^{+\\infty}\\frac{x^3}{\\sqrt{2\\pi}}e^{-x^2/2}dx=0$ : la fonction est <b>impaire</b> et l'intégrale converge, sur un intervalle symétrique.</li>\n<li>$\\text{Cov}(Z,T)=E(Z\\cdot Z^2)-E(Z)E(Z^2)=E(Z^3)-0\\times1=0$.</li>\n<li><b>Conclusion</b> : $\\text{Cov}(Z,T)=0$ alors que $T=Z^2$ dépend totalement de $Z$. Une covariance nulle n'implique pas l'indépendance.</li></ol>\n<h3>3) Le cas Bernoulli où la réciproque est vraie</h3>\n<p>Tableau donné (avec $0\\le p<1$) :</p>\n<div class=\"tablewrap\"><table class=\"t\"><tr><th>$X\\backslash Y$</th><th>0</th><th>1</th><th>$P(X=i)$</th></tr>\n<tr><th>0</th><td>$p$</td><td>$1-p-p_1$</td><td>$1-p_1$</td></tr>\n<tr><th>1</th><td>$1-p-p_2$</td><td>$p_1+p_2+p-1$</td><td>$p_1$</td></tr>\n<tr><th>$P(Y=j)$</th><td>$1-p_2$</td><td>$p_2$</td><td>1</td></tr></table></div>\n<ol class=\"steps\">\n<li>$XY$ vaut 1 seulement si $X=Y=1$ : $E(XY)=P(X=1,Y=1)=p_1+p_2+p-1$.</li>\n<li>$E(X)=p_1$, $E(Y)=p_2$, donc $\\text{Cov}(X,Y)=p_1+p_2+p-1-p_1p_2$.</li>\n<li><b>CNS d'indépendance</b> : $P(X=i,Y=j)=P(X=i)P(Y=j)$ pour les 4 cases.</li>\n<li><b>Si Cov = 0</b> : $P(1,1)=p_1p_2$. Puis on déduit les trois autres cases :\n$P(1,0)=p_1-p_1p_2=p_1(1-p_2)$ ; $P(0,1)=p_2-p_1p_2=(1-p_1)p_2$ ; $P(0,0)=1-p_1-p_2+p_1p_2=(1-p_1)(1-p_2)$. Les 4 cases sont des produits : $X$ et $Y$ sont indépendantes.</li></ol>\n<div class=\"box prof\">Le prof a aussi donné en TD un tableau ($X\\in\\{0,1\\}$, $Y\\in\\{0,1,2\\}$, cases 1/20, 1/4, 0 / 17/60, 1/4, 1/6) où $\\text{Cov}=0$ mais $P(X=0,Y=2)=0\\neq\\frac3{10}\\cdot\\frac16$ : non indépendantes. Même message.</div><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>Réponses courtes</h2>\n<section class=\"exo\"><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>$Z\\sim\\mathcal N(0,1)$. Combien vaut $E(Z^3)$ ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0</b></p><p>Intégrande impaire sur $\\mathbb R$ : 0.</p>\n</div></div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Tableau Bernoulli avec $p=0{,}2$, $p_1=0{,}5$, $p_2=0{,}6$. Calcule $\\text{Cov}(X,Y)$.</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0</b></p><p>$0{,}5+0{,}6+0{,}2-1-0{,}3=0$ : ici elles sont indépendantes.</p>\n</div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Même tableau avec $p=0{,}3$, $p_1=0{,}5$, $p_2=0{,}6$. $\\text{Cov}(X,Y)$ ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.1</b></p><p>$0{,}4-0{,}3=0{,}1$.</p>\n</div></div></section><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">$\\text{Cov}(X,Y)=0$. Peut-on conclure que $X$ et $Y$ sont indépendantes ?</div><button class=\"opt\" data-o=\"0\">Oui</button><button class=\"opt\" data-o=\"1\">Non en général ; oui si ce sont deux Bernoulli</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"covnulle","rep":["0"],"tol":0},{"n":"covnulle","rep":["0"],"tol":0.001},{"n":"covnulle","rep":["0.1"],"tol":0.001}],"qcm":[{"n":"covnulle","q":"$\\text{Cov}(X,Y)=0$. Peut-on conclure que $X$ et $Y$ sont indépendantes ?","o":["Oui","Non en général ; oui si ce sont deux Bernoulli"],"a":1,"e":"Contre-exemple $Z$ et $Z^2$. Exception : variables de Bernoulli."}]},{"id":"densite","t":"Densité, fonction de répartition, probabilités","seance":"C · Variables aléatoires continues","imp":5,"html":"<p class=\"small muted\">Source : Toutes les questions continues · examens 2019-20, 2022-23 (U[0,1])</p>\n<p>Une v.a <b>continue</b> $X$ a une <b>densité</b> $f$ : une fonction $f\\ge0$ avec $\\int_{-\\infty}^{+\\infty}f(x)\\,dx=1$. Alors $P(a\\le X\\le b)=\\int_a^b f(x)\\,dx$ et $P(X=a)=0$ (donc $<$ ou $\\le$, c'est pareil).</p>\n<div class=\"box\"><b>Fonction de répartition</b> : $F(x)=P(X\\le x)=\\int_{-\\infty}^x f(t)\\,dt$, et $F'=f$ là où $f$ est continue.\n$$P(a<X\\le b)=F(b)-F(a)$$\nPropriétés : $0\\le F\\le1$, $F$ croissante, $\\lim_{-\\infty}F=0$, $\\lim_{+\\infty}F=1$, continue à droite.</div>\n<h4>Méthode pour calculer $F$ : découper en zones</h4>\n<p>Écris toujours les trois cas : à gauche du support ($F=0$), dans le support (on intègre), à droite ($F=1$).</p>\n<h3>Exercice qui tombe : $X\\sim\\mathcal U[0,1]$, $P(x_1\\le X\\le x_2)$ (4 à 5 pts)</h3>\n<p>$f(x)=1$ sur $[0,1]$, 0 ailleurs. $P(x_1\\le X\\le x_2)=\\int_{x_1}^{x_2}f$. Il faut <b>discuter selon la position de $x_1<x_2$</b> :</p>\n<div class=\"tablewrap\"><table class=\"t\"><tr><th>Cas</th><th>$P(x_1\\le X\\le x_2)$</th></tr>\n<tr><td>$x_2<0$</td><td>0</td></tr>\n<tr><td>$x_1<0\\le x_2\\le1$</td><td>$x_2$</td></tr>\n<tr><td>$0\\le x_1<x_2\\le1$</td><td>$x_2-x_1$</td></tr>\n<tr><td>$0\\le x_1\\le1<x_2$</td><td>$1-x_1$</td></tr>\n<tr><td>$x_1<0$ et $x_2>1$</td><td>1</td></tr>\n<tr><td>$x_1>1$</td><td>0</td></tr></table></div>\n<div class=\"box prof\">Les points viennent de la <b>discussion complète</b> : beaucoup d'étudiants ne donnent que $x_2-x_1$ et perdent la moitié.</div>\n<h4>TD 8 : $F(x)=ax^2$ sur $]0,1]$</h4>\n<p>$F$ continue en 1 : $a\\cdot1^2=1$, donc $a=1$. $f(x)=F'(x)=2x$ sur $[0,1]$. $P(0{,}25<X<0{,}5)=F(0{,}5)-F(0{,}25)=0{,}25-0{,}0625=0{,}1875$, et on retrouve la même valeur avec $\\int_{0{,}25}^{0{,}5}2x\\,dx$.</p>\n<h4>TD 9 : $f(x)=\\tfrac34\\sqrt{1-|x|}$ sur $[-1,1]$</h4>\n<p>Pour $-1\\le x\\le0$ : $F(x)=\\int_{-1}^x\\tfrac34\\sqrt{1+t}\\,dt=\\tfrac12(1+x)^{3/2}$. Pour $0\\le x\\le1$ : $F(x)=1-\\tfrac12(1-x)^{3/2}$ (par symétrie). $F=0$ avant $-1$, $F=1$ après 1.</p><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 3 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>Réponses courtes</h2>\n<section class=\"exo\"><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>$X\\sim\\mathcal U[0,1]$. $P(-0{,}5\\le X\\le 0{,}3)$ ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.3</b></p><p>Cas $x_1&lt;0\\le x_2\\le1$ : $x_2=0{,}3$.</p>\n</div></div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>$X\\sim\\mathcal U[0,1]$. $P(0{,}4\\le X\\le 2)$ ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.6</b></p><p>$1-x_1=0{,}6$.</p>\n</div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>$F(x)=ax^2$ sur $]0,1]$. Que vaut $a$ ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1</b></p><p>Continuité en 1.</p>\n</div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>$f(x)=2x$ sur $[0,1]$. $P(X\\le0{,}5)$ ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.25</b></p><p>$F(0{,}5)=0{,}5^2$.</p>\n</div></div></section><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Pour une v.a continue, $P(X=2)$ vaut…</div><button class=\"opt\" data-o=\"0\">$f(2)$</button><button class=\"opt\" data-o=\"1\">$F(2)$</button><button class=\"opt\" data-o=\"2\">0</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"densite","rep":["0.3"],"tol":0.001},{"n":"densite","rep":["0.6"],"tol":0.001},{"n":"densite","rep":["1"],"tol":0},{"n":"densite","rep":["0.25"],"tol":0.001}],"qcm":[{"n":"densite","q":"Pour une v.a continue, $P(X=2)$ vaut…","o":["$f(2)$","$F(2)$","0"],"a":2,"e":"Un point a une probabilité nulle."}]},{"id":"momentsc","t":"Espérance et variance (cas continu)","seance":"C · Variables aléatoires continues","imp":5,"html":"<p class=\"small muted\">Source : 4 examens sur 11 (densité $\\frac2a(1-\\frac xa)$), 5 à 8 pts</p>\n$$E(X)=\\int_{-\\infty}^{+\\infty}x f(x)\\,dx\\qquad E(g(X))=\\int g(x)f(x)\\,dx\\qquad V(X)=E(X^2)-E(X)^2$$\n<h3>L'exercice phare : $f(x)=\\frac2a\\left(1-\\frac xa\\right)$ sur $[0,a]$</h3>\n<h4>1) Fonction de répartition</h4>\n<ul><li>Si $x<0$ : $F(x)=0$.</li>\n<li>Si $0\\le x\\le a$ : $F(x)=\\int_0^x\\frac2a\\left(1-\\frac ta\\right)dt=\\frac2a\\left[t-\\frac{t^2}{2a}\\right]_0^x=\\frac{2x}a-\\frac{x^2}{a^2}=\\frac{2x}{a}\\left(1-\\frac{x}{2a}\\right)$.</li>\n<li>Si $x>a$ : $F(x)=1$ (vérification : $F(a)=2-1=1$).</li></ul>\n<h4>2) Espérance et variance</h4>\n$$E(X)=\\int_0^a \\frac2a\\left(x-\\frac{x^2}a\\right)dx=\\frac2a\\left(\\frac{a^2}2-\\frac{a^2}3\\right)=\\frac a3$$\n$$E(X^2)=\\int_0^a\\frac2a\\left(x^2-\\frac{x^3}a\\right)dx=\\frac2a\\left(\\frac{a^3}3-\\frac{a^3}4\\right)=\\frac{a^2}6,\\qquad V(X)=\\frac{a^2}6-\\frac{a^2}9=\\frac{a^2}{18}.$$\n<p>La question 3 (le maximum $M_n$) est traitée dans la notion « Min et max ».</p>\n<div class=\"box trap\"><b>Piège de calcul.</b> Développe d'abord $x\\cdot\\frac2a(1-\\frac xa)=\\frac2a(x-\\frac{x^2}a)$, puis intègre terme à terme. Vérifie toujours que $F(a)=1$ : si ce n'est pas le cas, l'erreur est dans l'intégrale.</div><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 2 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>Réponses courtes</h2>\n<section class=\"exo\"><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>$f(x)=\\frac2a(1-\\frac xa)$ avec $a=3$. Calcule $E(X)$.</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1</b></p><p>$a/3=1$.</p>\n</div></div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Même densité, $a=3$. Calcule $V(X)$.</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.5</b></p><p>$a^2/18=9/18$.</p>\n</div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Même densité, $a=2$. Calcule $F(1)$.</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.75</b></p><p>$\\frac{2}{2}-\\frac{1}{4}=0{,}75$.</p>\n</div></div></section><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">$V(X)$ se calcule par :</div><button class=\"opt\" data-o=\"0\">$E(X^2)-E(X)^2$</button><button class=\"opt\" data-o=\"1\">$E(X)^2-E(X^2)$</button><button class=\"opt\" data-o=\"2\">$\\int x^2f-\\int xf$</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"momentsc","rep":["1"],"tol":0.001},{"n":"momentsc","rep":["0.5"],"tol":0.001},{"n":"momentsc","rep":["0.75"],"tol":0.001}],"qcm":[{"n":"momentsc","q":"$V(X)$ se calcule par :","o":["$E(X^2)-E(X)^2$","$E(X)^2-E(X^2)$","$\\int x^2f-\\int xf$"],"a":0,"e":"Formule de König."}]},{"id":"transfo","t":"Loi de Y = g(X) : la méthode de la fonction de répartition","seance":"C · Variables aléatoires continues","imp":5,"html":"<p class=\"small muted\">Source : Cœur des exercices Gamma et Normale (10 à 12 pts) · TD 12</p>\n<p>Presque toutes les questions « donner la loi de $Y$ » ou « montrer que $Y\\sim\\dots$ » se font avec <b>une seule méthode</b> :</p>\n<ol class=\"steps\">\n<li>Écrire $G(y)=P(Y\\le y)$.</li>\n<li>Remplacer $Y$ par $g(X)$ et <b>isoler $X$</b> : on obtient $G(y)$ en fonction de $F$.</li>\n<li>Dériver : $g_Y(y)=G'(y)$ (dérivée d'une composée : $[F(u(y))]'=u'(y)\\,f(u(y))$).</li>\n<li>Remplacer $f$ par sa formule et <b>reconnaître</b> une densité connue.</li></ol>\n<h4>Cas 1 : $Y=aX+b$</h4>\n<p>Si $a>0$ : $G(y)=P(aX+b\\le y)=P\\left(X\\le\\frac{y-b}a\\right)=F\\left(\\frac{y-b}a\\right)$, donc $g(y)=\\frac1a f\\left(\\frac{y-b}a\\right)$.<br>\nSi $a<0$ : l'inégalité change de sens, $G(y)=1-F\\left(\\frac{y-b}a\\right)$, $g(y)=-\\frac1af\\left(\\frac{y-b}a\\right)$.<br>\nLes deux cas ensemble : $g(y)=\\dfrac1{|a|}f\\left(\\dfrac{y-b}a\\right)$.</p>\n<h4>Cas 2 : $Z=|X|$</h4>\n<p>Pour $z\\le0$ : $H(z)=0$. Pour $z>0$ : $H(z)=P(-z\\le X\\le z)=F(z)-F(-z)$, donc $h(z)=f(z)+f(-z)$.</p>\n<h4>Cas 3 : $T=\\ln|X|$</h4>\n<p>$K(t)=P(|X|\\le e^t)=F(e^t)-F(-e^t)$, donc $k(t)=e^t\\big(f(e^t)+f(-e^t)\\big)$ pour tout $t\\in\\mathbb R$.</p>\n<h4>Cas 4 : $T=\\ln|aX+b|$ (TD 16-II)</h4>\n<p>$K(t)=P(|aX+b|\\le e^t)$. Pour $a>0$ : $K(t)=F\\left(\\frac{e^t-b}a\\right)-F\\left(\\frac{-e^t-b}a\\right)$, et dans tous les cas $k(t)=\\dfrac{e^t}{|a|}\\left[f\\left(\\frac{e^t-b}a\\right)+f\\left(\\frac{-e^t-b}a\\right)\\right]$.</p>\n<h4>Cas 5 : $Y=U^2$ (sert pour le Khi-deux)</h4>\n<p>Pour $y>0$ : $G(y)=P(-\\sqrt y\\le U\\le\\sqrt y)=F(\\sqrt y)-F(-\\sqrt y)$, donc $g(y)=\\frac1{2\\sqrt y}\\big(f(\\sqrt y)+f(-\\sqrt y)\\big)$.</p>\n<div class=\"box prof\"><b>Ce que le correcteur attend.</b> La ligne $G(y)=P(Y\\le y)$ écrite explicitement, la discussion sur le signe de $a$ quand il n'est pas imposé, et la conclusion « on reconnaît la densité de … ».</div><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>Réponses courtes</h2>\n<section class=\"exo\"><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>$X$ de densité $f$, $Y=2X+1$. On a $g(5)=\\frac1{2}f(c)$. Que vaut $c$ ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 2</b></p><p>$\\frac{y-b}a=\\frac{5-1}2=2$.</p>\n</div></div></section><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">$Y=aX+b$ avec $a&lt;0$. $G(y)$ vaut :</div><button class=\"opt\" data-o=\"0\">$F(\\frac{y-b}a)$</button><button class=\"opt\" data-o=\"1\">$1-F(\\frac{y-b}a)$</button><button class=\"opt\" data-o=\"2\">$F(ay+b)$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Densité de $|X|$ pour $z&gt;0$ :</div><button class=\"opt\" data-o=\"0\">$f(z)-f(-z)$</button><button class=\"opt\" data-o=\"1\">$f(z)+f(-z)$</button><button class=\"opt\" data-o=\"2\">$2f(z)$ toujours</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Première ligne à écrire pour trouver la loi de $Y=g(X)$ :</div><button class=\"opt\" data-o=\"0\">$g_Y(y)=f(g(y))$</button><button class=\"opt\" data-o=\"1\">$G(y)=P(Y\\le y)$</button><button class=\"opt\" data-o=\"2\">$E(Y)=g(E(X))$</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"transfo","rep":["2"],"tol":0}],"qcm":[{"n":"transfo","q":"$Y=aX+b$ avec $a&lt;0$. $G(y)$ vaut :","o":["$F(\\frac{y-b}a)$","$1-F(\\frac{y-b}a)$","$F(ay+b)$"],"a":1,"e":"Diviser par $a&lt;0$ change le sens : $P(X\\ge\\frac{y-b}a)$."},{"n":"transfo","q":"Densité de $|X|$ pour $z&gt;0$ :","o":["$f(z)-f(-z)$","$f(z)+f(-z)$","$2f(z)$ toujours"],"a":1,"e":"Dérivée de $F(z)-F(-z)$ : $f(z)+f(-z)$ ($2f(z)$ seulement si $f$ est paire)."},{"n":"transfo","q":"Première ligne à écrire pour trouver la loi de $Y=g(X)$ :","o":["$g_Y(y)=f(g(y))$","$G(y)=P(Y\\le y)$","$E(Y)=g(E(X))$"],"a":1,"e":"On part toujours de la fonction de répartition."}]},{"id":"minmax","t":"Min et max de n variables indépendantes","seance":"C · Variables aléatoires continues","imp":5,"html":"<p class=\"small muted\">Source : 5 examens sur 11, 3 à 8 pts</p>\n<p>$X_1,\\dots,X_n$ indépendantes, de même fonction de répartition $F$ et même densité $f$. On note $M_n=\\max X_i$ et $m_n=\\min X_i$.</p>\n<h4>Le maximum</h4>\n<p>$M_n\\le x$ signifie que <b>tous</b> les $X_i$ sont $\\le x$ :</p>\n$$G(x)=P(M_n\\le x)=P\\Big(\\bigcap_{i=1}^n\\{X_i\\le x\\}\\Big)\\overset{\\text{indép.}}{=}\\prod_{i=1}^nP(X_i\\le x)=F(x)^n,\\qquad g(x)=n\\,f(x)\\,F(x)^{n-1}.$$\n<h4>Le minimum</h4>\n<p>$m_n>x$ signifie que tous les $X_i$ sont $>x$ :</p>\n$$H(x)=P(m_n\\le x)=1-P(m_n>x)=1-\\big(1-F(x)\\big)^n,\\qquad h(x)=n\\,f(x)\\,\\big(1-F(x)\\big)^{n-1}.$$\n<h3>Application 1 : densité $\\frac2a(1-\\frac xa)$ (l'exercice phare)</h3>\n<p>Avec $F(x)=\\frac{2x}a-\\frac{x^2}{a^2}$ sur $[0,a]$ : $G(x)=0$ si $x<0$ ; $G(x)=\\left(\\frac{2x}a-\\frac{x^2}{a^2}\\right)^n$ si $0\\le x\\le a$ ; $G(x)=1$ si $x>a$. Densité :\n$$g(x)=n\\cdot\\frac2a\\left(1-\\frac xa\\right)\\left(\\frac{2x}a-\\frac{x^2}{a^2}\\right)^{n-1}\\ \\text{ sur }[0,a],\\quad 0\\ \\text{sinon.}$$</p>\n<h3>Application 2 : loi uniforme sur [0,1] (examen 2016-17 ratt.)</h3>\n<p>$F(x)=x$ sur $[0,1]$. Donc $g(x)=nx^{n-1}$ et $h(x)=n(1-x)^{n-1}$ sur $[0,1]$.</p>\n$$E(M_n)=\\int_0^1 x\\cdot nx^{n-1}dx=\\frac n{n+1},\\qquad E(m_n)=\\int_0^1 xn(1-x)^{n-1}dx=\\frac1{n+1}.$$\n<p><b>$m_n$ et $1-M_n$ ont la même loi</b> : $P(1-M_n\\le x)=P(M_n\\ge1-x)=1-(1-x)^n=H(x)$. On en déduit $E(m_n)=E(1-M_n)=1-E(M_n)$.</p>\n<div class=\"box trap\"><b>Pièges.</b> Écrire le mot « indépendantes » au moment de transformer l'intersection en produit (c'est là que sont les points). Ne pas oublier les zones $x<0$ et $x>a$.</div><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 3 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>Réponses courtes</h2>\n<section class=\"exo\"><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>$X_i\\sim\\mathcal U[0,1]$, $n=4$. $E(M_4)$ ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.8</b></p><p>$n/(n+1)=4/5$.</p>\n</div></div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>$X_i\\sim\\mathcal U[0,1]$, $n=4$. $E(m_4)$ ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.2</b></p><p>$1/(n+1)$.</p>\n</div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>$X_i\\sim\\mathcal U[0,1]$, $n=3$. $P(M_3\\le0{,}5)$ ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.125</b></p><p>$0{,}5^3$.</p>\n</div></div></section><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">$P(M_n\\le x)$ vaut :</div><button class=\"opt\" data-o=\"0\">$1-(1-F(x))^n$</button><button class=\"opt\" data-o=\"1\">$F(x)^n$</button><button class=\"opt\" data-o=\"2\">$nF(x)$</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"minmax","rep":["0.8"],"tol":0.001},{"n":"minmax","rep":["0.2"],"tol":0.001},{"n":"minmax","rep":["0.125"],"tol":0.001}],"qcm":[{"n":"minmax","q":"$P(M_n\\le x)$ vaut :","o":["$1-(1-F(x))^n$","$F(x)^n$","$nF(x)$"],"a":1,"e":"Tous les $X_i\\le x$, indépendance, produit."}]},{"id":"couplec","t":"Couple de v.a continues","seance":"C · Variables aléatoires continues","imp":2,"html":"<p class=\"small muted\">Source : Examen 2016-17 ratt. (6 pts) · TD 10</p>\n<p>La loi d'un couple continu est donnée par une densité $f(x,y)\\ge0$ avec $\\iint f=1$.</p>\n<ul><li>$F(x,y)=P(X\\le x,Y\\le y)=\\int_{-\\infty}^x\\int_{-\\infty}^y f(u,v)\\,dv\\,du$</li>\n<li>Marginales : $f_X(x)=\\int f(x,y)\\,dy$ et $f_Y(y)=\\int f(x,y)\\,dx$</li>\n<li>Indépendance $\\iff f(x,y)=f_X(x)f_Y(y)$ partout</li>\n<li>Loi conditionnelle : $f_{Y\\mid X=x}(y)=\\dfrac{f(x,y)}{f_X(x)}$</li></ul>\n<h3>Examen : $f(x,y)=\\frac{xy}2$ sur $0\\le y\\le x\\le2$</h3>\n<p>Dessine le triangle : $x$ de 0 à 2, et pour chaque $x$, $y$ de 0 à $x$.</p>\n<ol class=\"steps\">\n<li>Pour $0\\le y\\le x\\le2$ : $F(x,y)=\\int_0^y\\int_v^x\\frac{uv}2\\,du\\,dv=\\int_0^y\\frac v4(x^2-v^2)\\,dv=\\frac{x^2y^2}8-\\frac{y^4}{16}$. Contrôle : $F(2,2)=2-1=1$.</li>\n<li>$f_X(x)=\\int_0^x\\frac{xy}2dy=\\frac{x^3}4$ sur $[0,2]$ ; $f_Y(y)=\\int_y^2\\frac{xy}2dx=\\frac{y(4-y^2)}4$ sur $[0,2]$.</li>\n<li>$f_X(x)f_Y(y)\\neq f(x,y)$ (par exemple en $x=1$, $y=1{,}5$ : $f=0$ mais le produit est non nul) : <b>pas indépendantes</b>. Un support triangulaire donne toujours des variables dépendantes.</li>\n<li>$f_{Y\\mid X=x}(y)=\\dfrac{xy/2}{x^3/4}=\\dfrac{2y}{x^2}$ pour $0\\le y\\le x$.</li></ol>\n<h3>TD 10 : $f(x,y)=k(x+y)$ sur $[0,1]^2$</h3>\n<p>$\\iint (x+y)=1$ donc $k=1$. $F(x,y)=\\frac{xy(x+y)}2$ sur $[0,1]^2$. $f_X(x)=x+\\frac12$, $f_Y(y)=y+\\frac12$. Non indépendantes. $f_{Y\\mid X=x}(y)=\\dfrac{x+y}{x+\\frac12}$.</p><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 2 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>Réponses courtes</h2>\n<section class=\"exo\"><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>$f(x,y)=k(x+y)$ sur $[0,1]^2$. Valeur de $k$ ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1</b></p><p>$\\iint(x+y)=\\frac12+\\frac12=1$.</p>\n</div></div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>$f(x,y)=\\frac{xy}2$ sur $0\\le y\\le x\\le2$. $f_X(2)$ ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 2</b></p><p>$x^3/4=8/4$.</p>\n</div></div></section><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Un couple de densité non nulle seulement sur un triangle peut-il être indépendant ?</div><button class=\"opt\" data-o=\"0\">Oui</button><button class=\"opt\" data-o=\"1\">Non</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"couplec","rep":["1"],"tol":0},{"n":"couplec","rep":["2"],"tol":0.001}],"qcm":[{"n":"couplec","q":"Un couple de densité non nulle seulement sur un triangle peut-il être indépendant ?","o":["Oui","Non"],"a":1,"e":"Le produit des marginales serait non nul sur tout un rectangle."}]},{"id":"mgf","t":"Fonction génératrice des moments","seance":"C · Variables aléatoires continues","imp":3,"html":"<p class=\"small muted\">Source : Examens 2017-18 et 2020-21 (8 pts)</p>\n$$M_X(t)=E\\big(e^{tX}\\big)=\\int_{-\\infty}^{+\\infty}e^{tx}f(x)\\,dx\\quad(\\text{continu}),\\qquad =\\sum_k e^{tk}P(X=k)\\quad(\\text{discret}).$$\n<p>Elle « génère » les moments : $M_X'(0)=E(X)$, $M_X''(0)=E(X^2)$.</p>\n<h3>Les trois calculs demandés à l'examen</h3>\n<h4>a) Uniforme sur $[a,b]$</h4>\n<p>$M_X(t)=\\int_a^b\\frac{e^{tx}}{b-a}dx$. Si $t=0$ : $M_X(0)=1$. Si $t\\neq0$ :\n$$M_X(t)=\\frac{e^{tb}-e^{ta}}{t(b-a)}.$$</p>\n<h4>b) Exponentielle de paramètre $\\theta$</h4>\n<p>$M_X(t)=\\int_0^{+\\infty}e^{tx}\\theta e^{-\\theta x}dx=\\theta\\int_0^{+\\infty}e^{(t-\\theta)x}dx$. L'intégrale converge seulement si $t-\\theta<0$ :\n$$M_X(t)=\\frac{\\theta}{\\theta-t}\\quad\\text{si } t<\\theta,\\qquad M_X(t)=+\\infty\\quad\\text{si } t\\ge\\theta.$$</p>\n<h4>c) Normale centrée réduite</h4>\n<p>On complète le carré : $tx-\\frac{x^2}2=-\\frac12(x-t)^2+\\frac{t^2}2$.\n$$M_X(t)=\\frac1{\\sqrt{2\\pi}}\\int e^{-\\frac{(x-t)^2}2}e^{\\frac{t^2}2}dx=e^{t^2/2}\\underbrace{\\int\\frac1{\\sqrt{2\\pi}}e^{-s^2/2}ds}_{=1}=e^{t^2/2}\\quad(s=x-t).$$</p>\n<div class=\"box trap\"><b>Pièges.</b> Tes notes manuscrites écrivent $\\frac{-\\theta}{t-\\theta}$ : c'est juste, c'est la même chose que $\\frac\\theta{\\theta-t}$. Le piège est d'oublier la condition $t<\\theta$ (l'intégrale diverge si $t\\ge\\theta$) et le cas $t=0$ pour l'uniforme (on ne peut pas diviser par $t$).</div><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>Réponses courtes</h2>\n<section class=\"exo\"><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>$X\\sim\\mathcal E(2)$. $M_X(1)$ ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 2</b></p><p>$\\frac{2}{2-1}=2$.</p>\n</div></div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>$X\\sim\\mathcal N(0,1)$. $M_X(2)$ arrondi à 2 décimales ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 7.38905609893065</b></p><p>$e^{2}\\approx7{,}39$.</p>\n</div></div></section><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Pour $X\\sim\\mathcal E(\\theta)$, $M_X(t)$ est finie pour…</div><button class=\"opt\" data-o=\"0\">$t&gt;\\theta$</button><button class=\"opt\" data-o=\"1\">$t&lt;\\theta$</button><button class=\"opt\" data-o=\"2\">tout $t$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">$M_X(0)$ vaut toujours :</div><button class=\"opt\" data-o=\"0\">0</button><button class=\"opt\" data-o=\"1\">1</button><button class=\"opt\" data-o=\"2\">$E(X)$</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"mgf","rep":["2"],"tol":0.001},{"n":"mgf","rep":["7.38905609893065"],"tol":0.01}],"qcm":[{"n":"mgf","q":"Pour $X\\sim\\mathcal E(\\theta)$, $M_X(t)$ est finie pour…","o":["$t&gt;\\theta$","$t&lt;\\theta$","tout $t$"],"a":1,"e":"Il faut $t-\\theta&lt;0$."},{"n":"mgf","q":"$M_X(0)$ vaut toujours :","o":["0","1","$E(X)$"],"a":1,"e":"$E(e^0)=1$."}]},{"id":"binomiale","t":"Bernoulli, binomiale (et uniforme, Dirac)","seance":"D · Lois usuelles discrètes","imp":3,"html":"<p class=\"small muted\">Source : Base des exercices discrets</p>\n<div class=\"tablewrap\"><table class=\"t\"><tr><th>Loi</th><th>Valeurs</th><th>$P(X=k)$</th><th>$E$</th><th>$V$</th></tr>\n<tr><td>Dirac $\\delta_a$</td><td>$a$</td><td>1</td><td>$a$</td><td>0</td></tr>\n<tr><td>Uniforme sur $\\{x_1..x_n\\}$</td><td>$x_i$</td><td>$1/n$</td><td>$\\bar x$</td><td>$\\frac1n\\sum x_i^2-\\bar x^2$</td></tr>\n<tr><td>Bernoulli $\\mathcal B(p)$</td><td>0, 1</td><td>$P(X=1)=p$</td><td>$p$</td><td>$p(1-p)$</td></tr>\n<tr><td>Binomiale $\\mathcal B(n,p)$</td><td>$0..n$</td><td>$C_n^kp^k(1-p)^{n-k}$</td><td>$np$</td><td>$np(1-p)$</td></tr></table></div>\n<p><b>Binomiale</b> = nombre de succès en $n$ épreuves <b>indépendantes</b> et identiques. On écrit $X=X_1+\\dots+X_n$ (Bernoulli indépendantes), d'où $E=np$ et $V=np(1-p)$.</p>\n<p><b>Somme</b> : si $X_1\\sim\\mathcal B(n_1,p)$ et $X_2\\sim\\mathcal B(n_2,p)$ indépendantes, $X_1+X_2\\sim\\mathcal B(n_1+n_2,p)$ (même $p$ obligatoire).</p>\n<h4>Exemple du cours</h4>\n<p>On lance un dé 100 fois, succès = « 3 ou 6 » ($p=1/3$). $X\\sim\\mathcal B(100,\\frac13)$, $E(X)=\\frac{100}3\\approx33{,}3$, $V(X)=100\\cdot\\frac13\\cdot\\frac23\\approx22{,}2$, $\\sigma\\approx4{,}71$.</p>\n<div class=\"box trap\"><b>Piège</b> (exercice du poly) : $P(X=1{,}5)=0$ pour une binomiale, car 1,5 n'est pas une valeur possible.</div><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 1 flashcard de ce chapitre ajoutée à la révision espacée (menu « Flashcards »).</p><h2>Réponses courtes</h2>\n<section class=\"exo\"><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>$X\\sim\\mathcal B(20;0{,}1)$. $E(X)$ ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 2</b></p><p>$np$.</p>\n</div></div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>$X\\sim\\mathcal B(20;0{,}1)$. $P(X=0)$ à 4 décimales ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.12157665459056935</b></p><p>$0{,}9^{20}\\approx0{,}1216$.</p>\n</div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>$X\\sim\\mathcal B(20;0{,}1)$. $P(X=1{,}5)$ ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0</b></p><p>Valeur impossible.</p>\n</div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>$V(X)$ pour $\\mathcal B(100,\\frac13)$, à 2 décimales ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 22.22222222222222</b></p><p>$100\\cdot\\frac13\\cdot\\frac23=22{,}22$.</p>\n</div></div></section>","ex":[{"n":"binomiale","rep":["2"],"tol":0},{"n":"binomiale","rep":["0.12157665459056935"],"tol":0.0005},{"n":"binomiale","rep":["0"],"tol":0},{"n":"binomiale","rep":["22.22222222222222"],"tol":0.01}],"qcm":[]},{"id":"poisson","t":"Loi de Poisson et loi conditionnelle","seance":"D · Lois usuelles discrètes","imp":3,"html":"<p class=\"small muted\">Source : Examen 2017-18 (8 pts) · TD 11</p>\n<p>$X\\sim\\mathcal P(\\lambda)$ compte des apparitions d'un événement pendant une durée ; $\\lambda$ est la moyenne.</p>\n$$P(X=k)=e^{-\\lambda}\\frac{\\lambda^k}{k!},\\ k\\in\\mathbb N,\\qquad E(X)=V(X)=\\lambda.$$\n<p><b>Somme</b> : $X\\sim\\mathcal P(\\lambda)$, $Y\\sim\\mathcal P(\\mu)$ indépendantes $\\Rightarrow S=X+Y\\sim\\mathcal P(\\lambda+\\mu)$.</p>\n<h3>Exercice d'examen : loi de $X$ sachant $S=s$</h3>\n<ol class=\"steps\">\n<li>Pour $0\\le x\\le s$ : $P(X=x\\mid S=s)=\\dfrac{P(X=x,\\,S=s)}{P(S=s)}=\\dfrac{P(X=x,\\,Y=s-x)}{P(S=s)}$.</li>\n<li>Indépendance : $=\\dfrac{e^{-\\lambda}\\frac{\\lambda^x}{x!}\\cdot e^{-\\mu}\\frac{\\mu^{s-x}}{(s-x)!}}{e^{-(\\lambda+\\mu)}\\frac{(\\lambda+\\mu)^s}{s!}}$.</li>\n<li>Simplifier : les exponentielles s'annulent, $\\frac{s!}{x!(s-x)!}=C_s^x$, donc $P(X=x\\mid S=s)=C_s^x\\left(\\frac\\lambda{\\lambda+\\mu}\\right)^x\\left(1-\\frac\\lambda{\\lambda+\\mu}\\right)^{s-x}$.</li>\n<li>On reconnaît : $X\\mid(S=s)\\sim\\mathcal B\\!\\left(s,\\frac\\lambda{\\lambda+\\mu}\\right)$.</li>\n<li>Fonction de régression : $E(X\\mid S=s)=s\\,\\frac\\lambda{\\lambda+\\mu}$, donc $E(X\\mid S)=S\\frac\\lambda{\\lambda+\\mu}$.</li>\n<li>$E\\big[E(X\\mid S)\\big]=\\frac\\lambda{\\lambda+\\mu}E(S)=\\frac\\lambda{\\lambda+\\mu}(\\lambda+\\mu)=\\lambda=E(X)$.</li></ol>\n<h4>Exemple du cours</h4>\n<p>Une machine tombe en panne 2 fois par mois en moyenne : $X\\sim\\mathcal P(2)$. $P(X=0)=e^{-2}\\approx0{,}135$ ; $P(X\\ge2)=1-e^{-2}(1+2)\\approx0{,}594$.</p><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 2 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>Réponses courtes</h2>\n<section class=\"exo\"><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>$X\\sim\\mathcal P(2)$. $P(X\\ge2)$ à 3 décimales ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.5939941502901619</b></p><p>$1-e^{-2}(1+2)\\approx0{,}594$.</p>\n</div></div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>$\\lambda=1$, $\\mu=3$, $s=8$. $E(X\\mid S=8)$ ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 2</b></p><p>$8\\times\\frac14$.</p>\n</div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>$X\\sim\\mathcal P(4)$. $V(X)$ ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 4</b></p><p>$V=\\lambda$.</p>\n</div></div></section><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">$X\\sim\\mathcal P(\\lambda)$, $Y\\sim\\mathcal P(\\mu)$ indépendantes. Loi de $X$ sachant $X+Y=s$ :</div><button class=\"opt\" data-o=\"0\">$\\mathcal P(\\lambda)$</button><button class=\"opt\" data-o=\"1\">$\\mathcal B(s,\\frac\\lambda{\\lambda+\\mu})$</button><button class=\"opt\" data-o=\"2\">$\\mathcal P(\\lambda+\\mu)$</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"poisson","rep":["0.5939941502901619"],"tol":0.002},{"n":"poisson","rep":["2"],"tol":0.001},{"n":"poisson","rep":["4"],"tol":0}],"qcm":[{"n":"poisson","q":"$X\\sim\\mathcal P(\\lambda)$, $Y\\sim\\mathcal P(\\mu)$ indépendantes. Loi de $X$ sachant $X+Y=s$ :","o":["$\\mathcal P(\\lambda)$","$\\mathcal B(s,\\frac\\lambda{\\lambda+\\mu})$","$\\mathcal P(\\lambda+\\mu)$"],"a":1,"e":"Calcul direct avec la définition de la probabilité conditionnelle."}]},{"id":"geometrique","t":"Loi géométrique (de Pascal)","seance":"D · Lois usuelles discrètes","imp":3,"html":"<p class=\"small muted\">Source : Examens 2021-22 ratt. et 2022-23 ord. (5 pts)</p>\n<p>On répète des épreuves <b>indépendantes</b> de probabilité de succès $p$ <b>jusqu'au premier succès</b>. $X$ = nombre d'épreuves nécessaires (succès compris).</p>\n$$P(X=k)=p\\,(1-p)^{k-1},\\ k\\in\\mathbb N^*,\\qquad E(X)=\\frac1p,\\qquad V(X)=\\frac{1-p}{p^2}.$$\n<p>$\\{X=k\\}$ = $k-1$ échecs puis un succès : $\\underbrace{\\bar A\\cdots\\bar A}_{k-1}A$.</p>\n<p>Formule utile : $P(X>k)=(1-p)^k$ (les $k$ premiers essais sont des échecs), donc $P(X\\le k)=1-(1-p)^k$.</p>\n<h3>L'exercice des cartes (examen)</h3>\n<p>$n$ cartes numérotées de 1 à $n$, tirages <b>avec remise</b> jusqu'à obtenir la carte $n$.</p>\n<ol class=\"steps\">\n<li>Chaque tirage est une épreuve de Bernoulli indépendante, succès = « tirer la carte $n$ », $p=\\frac1n$. Donc $X\\sim\\mathcal G(\\frac1n)$.</li>\n<li>$P(X=k)=\\frac1n\\left(1-\\frac1n\\right)^{k-1}=\\dfrac{(n-1)^{k-1}}{n^k}$, $k\\ge1$.</li>\n<li>$P(X\\le50)=1-P(X>50)=1-\\left(1-\\frac1n\\right)^{50}$. Pour $n=100$ : $1-0{,}99^{50}\\approx0{,}395$.</li></ol>\n<p>Version du cours : $P(X=21)=\\frac{99^{20}}{100^{21}}\\approx0{,}0082$ ; $P(X\\le60)=1-0{,}99^{60}\\approx0{,}453$.</p>\n<div class=\"box prof\">Si tu préfères la somme : $P(X>50)=\\sum_{k\\ge51}p(1-p)^{k-1}=p(1-p)^{50}\\cdot\\frac1{1-(1-p)}=(1-p)^{50}$. C'est la démarche du poly ; montre-la pour avoir tous les points.</div><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 2 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>Réponses courtes</h2>\n<section class=\"exo\"><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Cartes, $n=100$. $P(X\\le50)$ à 3 décimales ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.39499393286246365</b></p><p>$1-0{,}99^{50}\\approx0{,}395$.</p>\n</div></div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>$X\\sim\\mathcal G(0{,}2)$. $E(X)$ ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 5</b></p><p>$1/p$.</p>\n</div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>$X\\sim\\mathcal G(0{,}5)$. $P(X=3)$ ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.125</b></p><p>$0{,}5\\times0{,}5^2$.</p>\n</div></div></section><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Les tirages des cartes se font avec remise. Pourquoi est-ce indispensable pour la loi géométrique ?</div><button class=\"opt\" data-o=\"0\">Pour que $p$ reste constant et les épreuves indépendantes</button><button class=\"opt\" data-o=\"1\">Pour que $X$ soit fini</button><button class=\"opt\" data-o=\"2\">Ce n&#39;est pas indispensable</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"geometrique","rep":["0.39499393286246365"],"tol":0.002},{"n":"geometrique","rep":["5"],"tol":0},{"n":"geometrique","rep":["0.125"],"tol":0.001}],"qcm":[{"n":"geometrique","q":"Les tirages des cartes se font avec remise. Pourquoi est-ce indispensable pour la loi géométrique ?","o":["Pour que $p$ reste constant et les épreuves indépendantes","Pour que $X$ soit fini","Ce n&#39;est pas indispensable"],"a":0,"e":"Sans remise, la probabilité changerait à chaque tirage."}]},{"id":"autresdiscretes","t":"Binomiale négative, hypergéométrique, différences","seance":"D · Lois usuelles discrètes","imp":2,"html":"<p class=\"small muted\">Source : Examen 2020-21 ord. (8 pts)</p>\n<h4>Binomiale négative $\\mathcal{BN}(n,p)$</h4>\n<p>Épreuves indépendantes jusqu'à obtenir <b>$n$ succès</b>. $Y$ = nombre d'épreuves. $\\{Y=y\\}$ : $n-1$ succès parmi les $y-1$ premières, puis un succès.</p>\n$$P(Y=y)=C_{y-1}^{n-1}p^n(1-p)^{y-n},\\ y\\ge n,\\qquad E(Y)=\\frac np,\\ V(Y)=\\frac{n(1-p)}{p^2}.$$\n<p>C'est une somme de $n$ géométriques indépendantes.</p>\n<h4>Hypergéométrique $\\mathcal H(N,n,N_A)$</h4>\n<p>$n$ tirages <b>sans remise</b> dans $N$ objets dont $N_A$ de type A. $X$ = nombre d'objets A tirés.</p>\n$$P(X=k)=\\frac{C_{N_A}^k\\,C_{N-N_A}^{n-k}}{C_N^n},\\qquad \\max\\{0,\\,n-(N-N_A)\\}\\le k\\le\\min\\{n,\\,N_A\\},\\qquad E(X)=n\\frac{N_A}N.$$\n<h3>Exercice d'examen : les représentants</h3>\n<p>On choisit $n$ étudiants parmi $N$, dont $N_1$ garçons. $X$ = nombre de garçons choisis.</p>\n<ol class=\"steps\"><li>Choix simultané, sans remise : $X\\sim\\mathcal H(N,n,N_1)$.</li>\n<li>$k\\le n$ et $k\\le N_1$ ; il y a $n-k$ filles, donc $n-k\\le N-N_1$. D'où $m=\\max\\{0,\\,n-(N-N_1)\\}$ et $M=\\min\\{n,\\,N_1\\}$.</li>\n<li>$P(X=k)=\\dfrac{C_{N_1}^kC_{N-N_1}^{n-k}}{C_N^n}$ pour $m\\le k\\le M$.</li></ol>\n<h4>Les différences demandées</h4>\n<div class=\"tablewrap\"><table class=\"t\"><tr><th>Paire</th><th>Ce qui est fixé</th><th>Ce qui est aléatoire</th></tr>\n<tr><td>Binomiale / binomiale négative</td><td>Binomiale : le nombre d'épreuves $n$. BN : le nombre de succès $n$.</td><td>Binomiale : le nombre de succès. BN : le nombre d'épreuves.</td></tr>\n<tr><td>Géométrique / binomiale négative</td><td colspan=\"2\">La géométrique est le cas $n=1$ de la BN (attente du <b>premier</b> succès, au lieu du $n$-ième).</td></tr>\n<tr><td>Binomiale / hypergéométrique</td><td colspan=\"2\">Binomiale : tirages <b>avec remise</b>, indépendants, $p$ constant. Hypergéométrique : <b>sans remise</b>, tirages dépendants. Avec remise, $\\mathcal H$ devient $\\mathcal B(n,\\frac{N_A}N)$.</td></tr></table></div>\n<div class=\"box trap\">Le poly dit que les indicatrices $X_i$ de l'hypergéométrique sont « indépendantes » : c'est inexact (sans remise, elles sont dépendantes). Le calcul de $E(X)$ reste juste, car la linéarité de l'espérance n'a pas besoin d'indépendance. Ne recopie pas cette phrase.</div><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 3 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>Réponses courtes</h2>\n<section class=\"exo\"><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>$N=10$, $N_1=4$ garçons, $n=8$ choisis. Valeur minimale $m$ du nombre de garçons ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 2</b></p><p>$\\max(0,8-6)=2$.</p>\n</div></div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Même situation. Valeur maximale $M$ ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 4</b></p><p>$\\min(8,4)=4$.</p>\n</div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>$\\mathcal{BN}(10,\\frac13)$ : $E(Y)$ ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 30</b></p><p>$n/p$.</p>\n</div></div></section><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Laquelle fixe le nombre de succès et rend aléatoire le nombre d&#39;épreuves ?</div><button class=\"opt\" data-o=\"0\">Binomiale</button><button class=\"opt\" data-o=\"1\">Binomiale négative</button><button class=\"opt\" data-o=\"2\">Hypergéométrique</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"autresdiscretes","rep":["2"],"tol":0},{"n":"autresdiscretes","rep":["4"],"tol":0},{"n":"autresdiscretes","rep":["30"],"tol":0}],"qcm":[{"n":"autresdiscretes","q":"Laquelle fixe le nombre de succès et rend aléatoire le nombre d&#39;épreuves ?","o":["Binomiale","Binomiale négative","Hypergéométrique"],"a":1,"e":"BN : on attend le $n$-ième succès."}]},{"id":"uniexpo","t":"Uniforme et exponentielle (et taux de hasard)","seance":"E · Lois usuelles continues","imp":3,"html":"<p class=\"small muted\">Source : Examens 2016-17 ord. (7 pts), U[0,1] dans 2 sujets</p>\n<div class=\"tablewrap\"><table class=\"t\"><tr><th>Loi</th><th>Densité</th><th>$F(x)$</th><th>$E$</th><th>$V$</th></tr>\n<tr><td>$\\mathcal U[a,b]$</td><td>$\\frac1{b-a}$ sur $[a,b]$</td><td>$\\frac{x-a}{b-a}$ sur $[a,b]$</td><td>$\\frac{a+b}2$</td><td>$\\frac{(b-a)^2}{12}$</td></tr>\n<tr><td>$\\mathcal E(\\theta)$</td><td>$\\theta e^{-\\theta x}$, $x>0$</td><td>$1-e^{-\\theta x}$, $x>0$</td><td>$\\frac1\\theta$</td><td>$\\frac1{\\theta^2}$</td></tr></table></div>\n<p>L'exponentielle modélise une durée de vie. C'est aussi $\\gamma(1,\\theta)$ : voir la notion Gamma.</p>\n<h3>Exercice d'examen : le taux de hasard</h3>\n<p>$X\\ge0$ de densité $f$ et répartition $F$ ; $g(x)=\\dfrac{f(x)}{1-F(x)}$.</p>\n<ol class=\"steps\">\n<li>$\\dfrac{f}{1-F}=-\\big(\\ln(1-F)\\big)'$. On intègre de 0 à $x$ avec $F(0)=0$ : $G(x)=\\int_0^xg(u)du=-\\ln(1-F(x))$.</li>\n<li>Donc $1-F(x)=e^{-G(x)}$, soit $F(x)=1-e^{-G(x)}$.</li>\n<li>Exponentielle : $g(x)=\\dfrac{\\lambda e^{-\\lambda x}}{e^{-\\lambda x}}=\\lambda$ (taux constant : pas de vieillissement).</li>\n<li>$f(x)=\\alpha\\lambda x^{\\alpha-1}e^{-\\lambda x^\\alpha}$ (loi de Weibull) : $F(x)=1-e^{-\\lambda x^\\alpha}$, donc $g(x)=\\alpha\\lambda x^{\\alpha-1}$.</li></ol><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 3 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>Réponses courtes</h2>\n<section class=\"exo\"><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>$X\\sim\\mathcal U[2,8]$. $V(X)$ ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 3</b></p><p>$36/12$.</p>\n</div></div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>$X\\sim\\mathcal E(0{,}5)$. $E(X)$ ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 2</b></p><p>$1/\\theta$.</p>\n</div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>$X\\sim\\mathcal E(0{,}5)$. $P(X&gt;2)$ à 3 décimales ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.36787944117144233</b></p><p>$e^{-1}\\approx0{,}368$.</p>\n</div></div></section><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Taux de hasard de $\\mathcal E(\\lambda)$ :</div><button class=\"opt\" data-o=\"0\">$\\lambda x$</button><button class=\"opt\" data-o=\"1\">$\\lambda$</button><button class=\"opt\" data-o=\"2\">$1/\\lambda$</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"uniexpo","rep":["3"],"tol":0.001},{"n":"uniexpo","rep":["2"],"tol":0},{"n":"uniexpo","rep":["0.36787944117144233"],"tol":0.002}],"qcm":[{"n":"uniexpo","q":"Taux de hasard de $\\mathcal E(\\lambda)$ :","o":["$\\lambda x$","$\\lambda$","$1/\\lambda$"],"a":1,"e":"Constant."}]},{"id":"normale","t":"Loi normale : transformations et table","seance":"E · Lois usuelles continues","imp":5,"html":"<p class=\"small muted\">Source : 5 examens sur 11, souvent 10 à 12 pts</p>\n<p>$X\\sim\\mathcal N(m,\\sigma)$ (attention : dans ce cours, le 2<sup>e</sup> paramètre est l'<b>écart-type</b> $\\sigma$, pas la variance) :</p>\n$$f(x)=\\frac1{\\sigma\\sqrt{2\\pi}}\\exp\\left[-\\frac{(x-m)^2}{2\\sigma^2}\\right],\\qquad E(X)=m,\\ V(X)=\\sigma^2.$$\n<h3>1-a) Montrer que $Y=aX+b\\sim\\mathcal N(am+b,\\,a\\sigma)$ ($a>0$)</h3>\n<ol class=\"steps\">\n<li>$G(y)=P(Y\\le y)=P\\left(X\\le\\frac{y-b}a\\right)=F\\left(\\frac{y-b}a\\right)$ car $a>0$.</li>\n<li>$g(y)=\\frac1af\\left(\\frac{y-b}a\\right)=\\frac1{a\\sigma\\sqrt{2\\pi}}\\exp\\left[-\\frac{\\left(\\frac{y-b}a-m\\right)^2}{2\\sigma^2}\\right]$.</li>\n<li>$\\left(\\frac{y-b}a-m\\right)^2=\\frac{(y-(am+b))^2}{a^2}$, donc $g(y)=\\frac1{(a\\sigma)\\sqrt{2\\pi}}\\exp\\left[-\\frac{(y-(am+b))^2}{2(a\\sigma)^2}\\right]$.</li>\n<li>On reconnaît la densité de $\\mathcal N(am+b,\\,a\\sigma)$.</li></ol>\n<h3>1-b) En déduire $Z=\\frac{X-m}\\sigma\\sim\\mathcal N(0,1)$</h3>\n<p>$Z=\\frac1\\sigma X-\\frac m\\sigma$ : c'est $aX+b$ avec $a=\\frac1\\sigma>0$ et $b=-\\frac m\\sigma$. Donc $Z\\sim\\mathcal N\\left(\\frac m\\sigma-\\frac m\\sigma,\\ \\frac\\sigma\\sigma\\right)=\\mathcal N(0,1)$.</p>\n<h3>1-c) Si $Z\\sim\\mathcal N(0,1)$, alors $\\sigma Z+m\\sim\\mathcal N(m,\\sigma)$</h3>\n<p>Appliquer 1-a à $Z$ (paramètres $0$ et $1$) avec $a=\\sigma>0$, $b=m$ : $\\mathcal N(\\sigma\\cdot0+m,\\ \\sigma\\cdot1)=\\mathcal N(m,\\sigma)$.</p>\n<h3>Utiliser la table</h3>\n<p>$\\Phi(x)=P(U\\le x)$ pour $U\\sim\\mathcal N(0,1)$, donnée pour $x\\ge0$. Pour $x<0$ : $\\Phi(-x)=1-\\Phi(x)$. Pour une normale quelconque :\n$$P(X\\le x)=\\Phi\\left(\\frac{x-m}\\sigma\\right).$$</p>\n<h3>Problème inverse (examen 2016-17 et TD 15)</h3>\n<p>$P(X<2)=0{,}0668$ et $P(X\\ge12)=0{,}1587$. On lit dans la table $\\Phi(1{,}5)=0{,}9332$ et $\\Phi(1)=0{,}8413$, donc :</p>\n<ul><li>$\\Phi\\left(\\frac{2-m}\\sigma\\right)=0{,}0668=1-0{,}9332$ ⇒ $\\frac{2-m}\\sigma=-1{,}5$</li>\n<li>$1-\\Phi\\left(\\frac{12-m}\\sigma\\right)=0{,}1587$ ⇒ $\\frac{12-m}\\sigma=1$</li></ul>\n<p>Soustraction : $\\frac{10}\\sigma=2{,}5$, donc $\\sigma=4$, $m=8$. Puis $P\\big((X-8)^2<a\\big)=P\\left(|U|<\\frac{\\sqrt a}4\\right)=2\\Phi\\left(\\frac{\\sqrt a}4\\right)-1=0{,}95$ ⇒ $\\Phi\\left(\\frac{\\sqrt a}4\\right)=0{,}975$ ⇒ $\\frac{\\sqrt a}4=1{,}96$ ⇒ $a=7{,}84^2\\approx61{,}47$.</p>\n<div class=\"box trap\"><b>Erreur dans le corrigé du TD 15</b> (« exercices_proba », page 19). Avec $P(X<3)=0{,}1587$ et $P(X>12)=0{,}0228$, il faut $\\frac{3-m}\\sigma=-1$ et $\\frac{12-m}\\sigma=2$, donc $\\sigma=3$ et $m=6$, puis $P(1<X<10)=\\Phi(1{,}33)-\\Phi(-1{,}67)\\approx0{,}9082+0{,}9525-1=0{,}861$. Le corrigé trouve $m=1{,}9$, $\\sigma=5{,}05$ et $0{,}51$ : c'est faux (il a lu la table à l'envers). Vérifié par calcul.</div><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 5 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>Réponses courtes</h2>\n<section class=\"exo\"><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>$X\\sim\\mathcal N(10,2)$. $P(X\\le12)$ à 4 décimales (table) ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-
