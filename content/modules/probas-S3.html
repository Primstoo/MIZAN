<script>
/* MIZAN : explications illustrées « Comprendre, en clair » des 21 notions, affichées en tête de chaque notion du cours. */
const XQ=(a)=>`<details class="xchk"><summary>À toi : 3 questions éclair</summary><ol>${a.map(([q,r])=>`<li>${q} <i>Réponse : ${r}</i></li>`).join("")}</ol></details>`;
const XSVG=(inner,h=150,aria="schéma")=>`<div class="xfig"><svg viewBox="0 0 520 ${h}" role="img" aria-label="${aria}" style="width:100%;max-width:560px">${inner}</svg></div>`;
const XPL={
denombrement:String.raw`
<div class="box xana"><b>L'analogie</b> Compter, c'est choisir une tenue. Si tu choisis « un t-shirt PUIS un pantalon », l'ordre des étapes ne change rien au nombre de tenues : tu multiplies. Si tu choisis « 2 t-shirts parmi 7 pour la valise », l'ordre n'a pas de sens ({rouge, bleu} = {bleu, rouge}) : c'est une combinaison.</div>
<div class="xfig"><table class="xtab"><tr><th></th><th>avec ordre</th><th>sans ordre</th></tr><tr><th>sans remise</th><td>$A_n^p$ (podium)</td><td>$C_n^p$ (main de cartes)</td></tr><tr><th>avec remise</th><td>$n^p$ (code PIN)</td><td><span class="muted">hors programme</span></td></tr></table></div>
<div class="box">Le lien à retenir : $A_n^p = p!\times C_n^p$. Un arrangement, c'est une combinaison qu'on range ensuite dans les $p!$ ordres possibles.</div>
${XQ([["Code de cadenas à 3 chiffres : combien de codes ?","$10^3=1000$ (ordre + remise)."],["Élire un président et un secrétaire parmi 8 : combien de possibilités ?","$A_8^2=8\\times7=56$ (ordre, sans remise)."],["Choisir 3 délégués parmi 8 ?","$C_8^3=56$."]])}`,

probas:String.raw`
<div class="box xana"><b>L'analogie</b> Une probabilité conditionnelle, c'est <b>changer de salle</b>. $P(A)$ se calcule dans tout l'amphi ; $P(A\mid B)$ se calcule uniquement dans la salle B : on oublie tout ce qui n'est pas B, et B devient le nouvel « univers ».</div>
${XSVG(`<rect x="10" y="10" width="500" height="130" rx="10" fill="none" stroke="currentColor" opacity=".4"/><text x="20" y="30" font-size="13" fill="currentColor">Ω</text><circle cx="210" cy="78" r="58" fill="#1f5fbf" fill-opacity=".15" stroke="#1f5fbf"/><circle cx="300" cy="78" r="58" fill="#b5791c" fill-opacity=".15" stroke="#b5791c"/><text x="170" y="82" font-size="14" fill="currentColor">A</text><text x="330" y="82" font-size="14" fill="currentColor">B</text><text x="255" y="82" font-size="12" text-anchor="middle" fill="currentColor">A∩B</text><text x="390" y="125" font-size="12" fill="currentColor">P(A|B) = aire(A∩B) / aire(B)</text>`,150,"A sachant B")}
<div class="box">Bayes, c'est remonter le temps : on connaît $P(\text{symptôme}\mid\text{cause})$ et on veut $P(\text{cause}\mid\text{symptôme})$. On passe toujours par la formule des probabilités totales au dénominateur. Un arbre pondéré évite 90 % des erreurs.</div>
<div class="box trap"><b>Piège.</b> $P(A\mid B)\neq P(B\mid A)$. « 90 % des malades ont un test positif » ne veut pas dire « 90 % des tests positifs sont des malades ».</div>
${XQ([["$P(A\\cap B)=0{,}2$ et $P(B)=0{,}5$. Calcule $P(A\\mid B)$.","$0{,}2/0{,}5=0{,}4$."],["Dans un arbre, que vaut la somme des branches qui partent d'un même nœud ?","1."],["Quelle formule donne le dénominateur de Bayes ?","Les probabilités totales : $P(B)=\\sum_i P(B\\mid A_i)P(A_i)$."]])}`,

independance:String.raw`
<div class="box xana"><b>L'analogie</b> Deux événements sont indépendants quand savoir l'un <b>ne t'apprend rien</b> sur l'autre. Qu'il pleuve à Béni Mellal ne change rien au résultat d'un dé lancé à Casa.</div>
<div class="box">Traduction : $P(A\mid B)=P(A)$, ce qui revient à $P(A\cap B)=P(A)\,P(B)$. C'est cette deuxième forme qu'on vérifie à l'examen : on calcule les deux côtés et on compare.</div>
<div class="box trap"><b>Piège.</b> Indépendants ≠ incompatibles. Deux événements incompatibles ($A\cap B=\varnothing$) de probabilités non nulles sont au contraire <b>très dépendants</b> : si A arrive, B ne peut pas arriver.</div>
${XQ([["$P(A)=0{,}3$, $P(B)=0{,}5$, $P(A\\cap B)=0{,}15$. Indépendants ?","Oui : $0{,}3\\times0{,}5=0{,}15$."],["A et B incompatibles, $P(A)=0{,}2$, $P(B)=0{,}4$. Indépendants ?","Non : $P(A\\cap B)=0\\neq0{,}08$."],["Si A et B sont indépendants, $\\bar A$ et $B$ le sont-ils ?","Oui (les complémentaires conservent l'indépendance)."]])}`,

vad:String.raw`
<div class="box xana"><b>L'analogie</b> Une variable aléatoire, c'est la <b>règle du jeu</b> qui transforme un résultat en gains : « pile, je gagne 2 DH ; face, je perds 1 DH ». La loi, c'est le tableau des gains avec leurs probabilités. L'espérance, c'est le gain moyen si tu joues des milliers de fois. La variance mesure à quel point les gains s'écartent de cette moyenne.</div>
${XSVG(`<line x1="40" y1="120" x2="480" y2="120" stroke="currentColor" opacity=".5"/>${[[0,.1],[1,.3],[2,.4],[3,.2]].map(([x,p],i)=>`<rect x="${80+i*100}" y="${120-p*220}" width="40" height="${p*220}" fill="#1f5fbf" fill-opacity=".6"/><text x="${100+i*100}" y="138" text-anchor="middle" font-size="12" fill="currentColor">${x}</text><text x="${100+i*100}" y="${112-p*220}" text-anchor="middle" font-size="11" fill="currentColor">${p}</text>`).join("")}<line x1="267" y1="20" x2="267" y2="120" stroke="#b3261e" stroke-dasharray="4 3"/><text x="272" y="30" font-size="12" fill="#b3261e">E(X) = 1,7</text>`,150,"diagramme en bâtons")}
<div class="box">L'espérance est le <b>point d'équilibre</b> du diagramme en bâtons : $E(X)=\sum x_i\,p_i$. Pour la variance, utilise toujours $V(X)=E(X^2)-E(X)^2$ (Koenig), plus rapide.</div>
<div class="box trap"><b>Piège.</b> $V(aX+b)=a^2V(X)$ : le $b$ disparaît et le $a$ passe au carré. Donc $V(-3X+1)=9V(X)$, jamais $-3V(X)$.</div>
${XQ([["Loi : 0 (0,1) ; 1 (0,3) ; 2 (0,4) ; 3 (0,2). Calcule $E(X)$.","$0+0{,}3+0{,}8+0{,}6=1{,}7$."],["Que doit vérifier la somme des $p_i$ ?","Elle vaut 1."],["$V(X)=2$. Calcule $V(-3X+1)$.","$9\\times2=18$."]])}`,

linearite:String.raw`
<div class="box xana"><b>L'analogie</b> La moyenne d'une somme, c'est la somme des moyennes : si tu gagnes en moyenne 50 DH au restaurant et 30 DH en cours particuliers, tu gagnes en moyenne 80 DH. Toujours vrai, que les deux soient liés ou non. Pour un <b>produit</b>, c'est différent : $E(XY)=E(X)E(Y)$ seulement si $X$ et $Y$ sont indépendantes.</div>
<div class="box">Plan type de la preuve (discret) : 1) écrire $E(X+Y)=\sum_{i,j}(x_i+y_j)\,p_{ij}$ ; 2) couper en deux sommes ; 3) reconnaître les lois marginales $\sum_j p_{ij}=p_{i\cdot}$. Pour $E(XY)$ : remplacer $p_{ij}$ par $p_{i\cdot}\,p_{\cdot j}$ grâce à l'indépendance, puis factoriser.</div>
<div class="box trap"><b>Piège.</b> Le correcteur attend l'endroit précis où l'indépendance sert. Écris-le : « par indépendance, $p_{ij}=p_{i\cdot}p_{\cdot j}$ ».</div>
${XQ([["$E(X)=2$, $E(Y)=5$. Calcule $E(3X-Y)$.","$6-5=1$."],["$E(XY)=E(X)E(Y)$ sans hypothèse ?","Non, il faut l'indépendance (ou au moins une covariance nulle)."],["Quelle propriété des marginales utilise-t-on dans la preuve de $E(X+Y)$ ?","$\\sum_j p_{ij}=P(X=x_i)$."]])}`,

couple:String.raw`
<div class="box xana"><b>L'analogie</b> Le tableau d'un couple, c'est un <b>tableau à double entrée</b> comme les résultats d'un sondage croisé (filière × note). Les lois marginales, ce sont les <b>totaux</b> des lignes et des colonnes, qu'on écrit dans la marge (d'où leur nom).</div>
<div class="xfig"><table class="xtab"><tr><th>X \ Y</th><th>0</th><th>1</th><th class="m">P(X=x)</th></tr><tr><th>0</th><td>0,1</td><td>0,3</td><td class="m">0,4</td></tr><tr><th>1</th><td>0,2</td><td>0,4</td><td class="m">0,6</td></tr><tr><th class="m">P(Y=y)</th><td class="m">0,3</td><td class="m">0,7</td><td class="m">1</td></tr></table></div>
<div class="box">Méthode covariance en 3 lignes : $E(X)$, $E(Y)$ avec les marges ; $E(XY)=\sum x_iy_j\,p_{ij}$ (seules les cases où $x_iy_j\neq0$ comptent) ; $\text{Cov}=E(XY)-E(X)E(Y)$. Ici : $E(X)=0{,}6$, $E(Y)=0{,}7$, $E(XY)=0{,}4$, donc $\text{Cov}=0{,}4-0{,}42=-0{,}02$.</div>
<div class="box trap"><b>Piège.</b> Indépendance = <b>chaque</b> case égale au produit de ses marges. Une seule case qui ne colle pas suffit à dire « non indépendantes » (ici $0{,}1\neq0{,}4\times0{,}3$).</div>
${XQ([["Dans le tableau ci-dessus, $P(X=1)$ ?","$0{,}2+0{,}4=0{,}6$."],["Une case vaut 0 alors que ses deux marges sont non nulles. Conclusion ?","X et Y ne sont pas indépendantes."],["Formule de $V(X+Y)$ ?","$V(X)+V(Y)+2\\,\\text{Cov}(X,Y)$."]])}`,

covnulle:String.raw`
<div class="box xana"><b>L'analogie</b> La covariance ne voit que les liens <b>en ligne droite</b>. Imagine une balle qu'on lance : sa hauteur dépend totalement du temps, mais elle monte puis redescend. En moyenne, aucune tendance « linéaire » : covariance nulle, et pourtant dépendance totale.</div>
${XSVG(`<line x1="260" y1="10" x2="260" y2="140" stroke="currentColor" opacity=".3"/><line x1="40" y1="130" x2="480" y2="130" stroke="currentColor" opacity=".3"/><path d="M60 20 Q260 240 460 20" fill="none" stroke="#1f5fbf" stroke-width="2.5"/><text x="300" y="40" font-size="12" fill="currentColor">T = Z² : dépend totalement de Z</text><text x="300" y="58" font-size="12" fill="currentColor">mais Cov(Z, Z²) = E(Z³) = 0</text>`,150,"parabole")}
<div class="box">Le sens qui marche toujours : indépendantes ⇒ $\text{Cov}=0$. La réciproque est <b>fausse</b> en général (contre-exemple $Z$ et $Z^2$), mais vraie pour deux variables de Bernoulli, l'exercice classique.</div>
${XQ([["$X,Y$ indépendantes. Que vaut $\\text{Cov}(X,Y)$ ?","0."],["Pourquoi $E(Z^3)=0$ si $Z\\sim\\mathcal N(0,1)$ ?","La loi est symétrique autour de 0 et $z^3$ est impaire."],["Pour deux Bernoulli, $\\text{Cov}=0$ entraîne-t-il l'indépendance ?","Oui : c'est le cas particulier où la réciproque est vraie."]])}`,

densite:String.raw`
<div class="box xana"><b>L'analogie</b> Une densité, c'est une <b>carte de densité de population</b>. Un seul point n'a « personne » ($P(X=a)=0$), mais une zone a une population égale à l'<b>aire</b> sous la courbe. La fonction de répartition $F(x)$, c'est le nombre cumulé d'habitants à gauche de $x$.</div>
${XSVG(`<line x1="30" y1="130" x2="490" y2="130" stroke="currentColor" opacity=".5"/><path d="M60 130 L60 20 L380 130" fill="none" stroke="#1f5fbf" stroke-width="2.5"/><path d="M140 130 L140 47.5 L260 88.75 L260 130 Z" fill="#1f5fbf" fill-opacity=".25"/><text x="200" y="120" text-anchor="middle" font-size="12" fill="currentColor">P(x₁ ≤ X ≤ x₂)</text><text x="60" y="145" text-anchor="middle" font-size="11" fill="currentColor">0</text><text x="380" y="145" text-anchor="middle" font-size="11" fill="currentColor">a</text><text x="140" y="145" text-anchor="middle" font-size="11" fill="currentColor">x₁</text><text x="260" y="145" text-anchor="middle" font-size="11" fill="currentColor">x₂</text><text x="390" y="40" font-size="12" fill="currentColor">f(x) = 2/a (1 − x/a)</text>`,150,"densité triangulaire")}
<div class="box">Les 3 vérifications d'une densité : $f\ge0$, $\int f=1$, et le support (où $f$ est non nulle). Puis $F(x)=\int_{-\infty}^x f$, en <b>découpant les cas</b> : avant le support ($F=0$), dedans, après ($F=1$).</div>
<div class="box trap"><b>Piège.</b> Oublier les morceaux « $F(x)=0$ si $x&lt;0$ » et « $F(x)=1$ si $x&gt;a$ » coûte des points à chaque examen. Et $P(X\le a)=P(X&lt;a)$ en continu.</div>
${XQ([["$f(x)=2x$ sur $[0,1]$. Calcule $F(x)$ pour $x\\in[0,1]$.","$F(x)=x^2$."],["Même $f$ : $P(0{,}5\\le X\\le1)$ ?","$1-0{,}25=0{,}75$."],["Que vaut $P(X=0{,}5)$ ?","0 (variable continue)."]])}`,

momentsc:String.raw`
<div class="box xana"><b>L'analogie</b> L'espérance d'une densité, c'est le <b>point d'équilibre</b> de la plaque découpée selon la courbe : posée sur une pointe en $E(X)$, elle tient en équilibre. La variance mesure si la masse est concentrée près de ce point ou étalée.</div>
<div class="box">Même recette qu'en discret, on remplace $\sum$ par $\int$ : $E(X)=\int x f(x)\,dx$, $E(X^2)=\int x^2 f(x)\,dx$, puis $V=E(X^2)-E(X)^2$. Intègre seulement <b>sur le support</b>.</div>
<div class="box trap"><b>Piège.</b> Avec $f(x)=\frac2a(1-\frac xa)$, développe d'abord : $x f(x)=\frac2a x-\frac{2}{a^2}x^2$, puis intègre terme à terme. Résultat à connaître : $E(X)=a/3$.</div>
${XQ([["$X\\sim\\mathcal U[0,1]$ : $E(X)$ ?","$1/2$."],["Toujours $\\mathcal U[0,1]$ : $V(X)$ ?","$E(X^2)=1/3$, donc $V=1/3-1/4=1/12$."],["Sur quel intervalle intègre-t-on ?","Sur le support, là où $f\\neq0$."]])}`,

transfo:String.raw`
<div class="box xana"><b>L'analogie</b> Pour connaître la loi de $Y=g(X)$, on ne devine pas : on <b>traduit la question</b>. « $Y\le y$ » se réécrit en une condition sur $X$, dont on connaît déjà la loi. C'est un changement de langue, pas un nouveau calcul.</div>
<div class="xfig"><div class="xmono">1. G(y) = P(Y ≤ y)
2. = P(g(X) ≤ y)          ← on traduit
3. = P(X ≤ g⁻¹(y))        (si g croissante)
4. = F(g⁻¹(y))
5. densité : g(y) = G'(y)  ← dériver (règle de la chaîne)</div></div>
<div class="box trap"><b>Piège.</b> Si $g$ est décroissante, l'inégalité <b>se retourne</b> : $P(-X\le y)=P(X\ge-y)=1-F(-y)$. Et pour $Y=X^2$ : $P(X^2\le y)=P(-\sqrt y\le X\le\sqrt y)$, deux bornes.</div>
${XQ([["$Y=2X+1$, $X$ de répartition $F$. $G(y)$ ?","$F\\big((y-1)/2\\big)$."],["$Y=-X$. $G(y)$ ?","$1-F(-y)$."],["Comment passer de $G$ à la densité de $Y$ ?","En dérivant : $g=G'$."]])}`,

minmax:String.raw`
<div class="box xana"><b>L'analogie</b> Le <b>max</b> de n notes est ≤ 12 seulement si <b>toutes</b> les notes sont ≤ 12. Le <b>min</b> est &gt; 12 seulement si <b>toutes</b> sont &gt; 12. Ce « toutes » se transforme en produit grâce à l'indépendance.</div>
<div class="xfig"><div class="xmono">Max : P(M ≤ x) = P(X₁ ≤ x)…P(Xₙ ≤ x) = F(x)ⁿ
Min : P(m > x) = P(X₁ > x)…P(Xₙ > x) = (1 − F(x))ⁿ
      donc  P(m ≤ x) = 1 − (1 − F(x))ⁿ
Cas U[0,1] : F_M(x) = xⁿ ,  F_m(x) = 1 − (1 − x)ⁿ</div></div>
<div class="box trap"><b>Piège.</b> Pour le min, on passe <b>toujours</b> par $P(m&gt;x)$ : $P(m\le x)$ ne se factorise pas directement. Et n'oublie pas de dériver pour la densité : $f_M=nF^{n-1}f$.</div>
${XQ([["3 variables $\\mathcal U[0,1]$ indépendantes : $P(M\\le0{,}5)$ ?","$0{,}5^3=0{,}125$."],["Même cas : $P(m>0{,}5)$ ?","$0{,}5^3=0{,}125$."],["Densité du max de $n$ variables $\\mathcal U[0,1]$ ?","$nx^{n-1}$ sur $[0,1]$."]])}`,

couplec:String.raw`
<div class="box xana"><b>L'analogie</b> Une densité de couple, c'est un <b>relief</b> au-dessus d'un terrain : la probabilité d'une zone, c'est le <b>volume</b> sous le relief. Le terrain, c'est le support, souvent un triangle ou un carré. Tout se joue sur les bornes d'intégration.</div>
${XSVG(`<line x1="60" y1="130" x2="300" y2="130" stroke="currentColor" opacity=".5"/><line x1="60" y1="130" x2="60" y2="10" stroke="currentColor" opacity=".5"/><path d="M60 130 L260 130 L260 30 Z" fill="#1f5fbf" fill-opacity=".2" stroke="#1f5fbf"/><line x1="180" y1="130" x2="180" y2="70" stroke="#b3261e" stroke-width="2"/><text x="185" y="100" font-size="11" fill="#b3261e">x fixé : y de 0 à x</text><text x="265" y="145" font-size="11" fill="currentColor">x = 2</text><text x="330" y="60" font-size="12" fill="currentColor">Support 0 ≤ y ≤ x ≤ 2</text><text x="330" y="80" font-size="12" fill="currentColor">f_X(x) = ∫₀ˣ f(x,y) dy</text>`,150,"support triangulaire")}
<div class="box">Méthode : <b>dessine toujours le support</b>. Pour la marginale de $X$, fixe $x$ et regarde où va $y$ (trait rouge). Pour celle de $Y$, fixe $y$ : ici $x$ va de $y$ à 2.</div>
${XQ([["$f(x,y)=k(x+y)$ sur $[0,1]^2$ : comment trouver $k$ ?","$\\iint f=1$ donne $k=1$."],["Support $0\\le y\\le x\\le2$ : bornes de $x$ pour la marginale de $Y$ ?","$x$ de $y$ à 2."],["Condition d'indépendance avec les densités ?","$f(x,y)=f_X(x)f_Y(y)$ partout (et support rectangulaire)."]])}`,

mgf:String.raw`
<div class="box xana"><b>L'analogie</b> La fonction génératrice $M_X(t)=E(e^{tX})$ est une <b>carte d'identité</b> de la loi : deux variables qui ont la même fonction génératrice ont la même loi. Et elle « range » tous les moments dans ses dérivées en 0.</div>
<div class="xfig"><div class="xmono">M(0) = 1          (toujours : vérification gratuite)
M'(0) = E(X)
M''(0) = E(X²)  →  V(X) = M''(0) − M'(0)²
Somme de v.a indépendantes : M_(X+Y)(t) = M_X(t) · M_Y(t)</div></div>
<div class="box trap"><b>Piège.</b> On dérive par rapport à $t$, <b>puis</b> on remplace $t$ par 0. Faire l'inverse donne une constante dont la dérivée est nulle.</div>
${XQ([["Que vaut toujours $M_X(0)$ ?","1."],["$M(t)=e^{2t+t^2}$ : $E(X)$ ?","$M'(t)=(2+2t)M(t)$, donc $M'(0)=2$."],["$X$ et $Y$ indépendantes : $M_{X+Y}$ ?","$M_X\\cdot M_Y$."]])}`,

binomiale:String.raw`
<div class="box xana"><b>L'analogie</b> Bernoulli, c'est <b>un seul</b> lancer de pièce truquée (succès avec probabilité $p$). La binomiale, c'est le <b>nombre de succès</b> en $n$ lancers identiques et indépendants : combien de fois tu as eu « pile » sur 10 lancers.</div>
<div class="box">Pour reconnaître une binomiale, vérifie à voix haute les 3 mots : <b>répétition</b> ($n$ fois la même épreuve), <b>indépendance</b>, <b>deux issues</b>. Puis $P(X=k)=C_n^k p^k(1-p)^{n-k}$, $E=np$, $V=np(1-p)$.</div>
<div class="box trap"><b>Piège.</b> Tirages <b>sans</b> remise dans une urne : ce n'est plus une binomiale (les épreuves ne sont plus indépendantes), c'est une hypergéométrique.</div>
${XQ([["10 lancers d'une pièce équilibrée : $E(X)$ et $V(X)$ ?","$5$ et $2{,}5$."],["$\\mathcal B(4;0{,}5)$ : $P(X=2)$ ?","$C_4^2/16=6/16=0{,}375$."],["Tirage de 3 boules sans remise : binomiale ?","Non, hypergéométrique."]])}`,

poisson:String.raw`
<div class="box xana"><b>L'analogie</b> Poisson compte des <b>événements rares sur une période</b> : le nombre de clients qui entrent au restaurant en 10 minutes, le nombre d'appels reçus en une heure. Un seul paramètre $\lambda$, qui est à la fois la moyenne et la variance.</div>
<div class="box">À savoir par cœur : $P(X=k)=e^{-\lambda}\frac{\lambda^k}{k!}$, $E=V=\lambda$, et la <b>somme de deux Poisson indépendantes</b> est une Poisson de paramètre $\lambda_1+\lambda_2$. La loi de $X$ sachant $X+Y=s$ est alors une binomiale $\mathcal B\!\left(s,\frac{\lambda_1}{\lambda_1+\lambda_2}\right)$, l'exercice classique.</div>
${XQ([["$X\\sim\\mathcal P(2)$ : $P(X=0)$ ?","$e^{-2}\\approx0{,}135$."],["$X\\sim\\mathcal P(3)$, $Y\\sim\\mathcal P(1)$ indépendantes : loi de $X+Y$ ?","$\\mathcal P(4)$."],["Même cas : loi de $X$ sachant $X+Y=4$ ?","$\\mathcal B(4;3/4)$."]])}`,

geometrique:String.raw`
<div class="box xana"><b>L'analogie</b> La loi géométrique, c'est <b>le rang du premier succès</b> : combien de fois tu dois tirer une carte (avec remise) avant d'obtenir le premier as. « Il faut $k$ essais » = $k-1$ échecs puis un succès.</div>
<div class="xfig"><div class="xmono">P(X = k) = (1 − p)^(k−1) · p        k = 1, 2, 3…
E(X) = 1/p      V(X) = (1 − p)/p²
P(X > k) = (1 − p)^k   (k échecs de suite)</div></div>
<div class="box trap"><b>Piège.</b> Vérifie la convention de l'énoncé : rang du premier succès (commence à 1, celle du cours) ou nombre d'échecs avant le succès (commence à 0). Les formules changent.</div>
${XQ([["Pièce équilibrée : nombre moyen de lancers pour le premier pile ?","$1/0{,}5=2$."],["Dé : $P(\\text{premier 6 au 3e lancer})$ ?","$(5/6)^2\\times1/6=25/216$."],["$P(X>3)$ avec $p=0{,}2$ ?","$0{,}8^3=0{,}512$."]])}`,

autresdiscretes:String.raw`
<div class="box xana"><b>L'analogie</b> Trois questions pour choisir la bonne loi discrète : <b>combien d'essais</b> (fixé ou jusqu'à un succès) ? <b>avec ou sans remise</b> ? <b>on compte quoi</b> (succès, rang) ?</div>
<div class="xfig"><table class="xtab"><tr><th>Situation</th><th>Loi</th></tr><tr><td>n essais fixés, avec remise, on compte les succès</td><td>Binomiale</td></tr><tr><td>n tirages sans remise dans N objets dont r « bons »</td><td>Hypergéométrique</td></tr><tr><td>on répète jusqu'au 1er succès</td><td>Géométrique</td></tr><tr><td>on répète jusqu'au r-ième succès</td><td>Binomiale négative (Pascal)</td></tr><tr><td>événements rares sur une période</td><td>Poisson</td></tr></table></div>
${XQ([["Choisir 3 représentants parmi 10 garçons et 8 filles, nombre de filles ?","Hypergéométrique."],["Nombre de lancers pour obtenir 3 fois « 6 » ?","Binomiale négative."],["Hypergéométrique avec N très grand devant n ?","Elle se rapproche d'une binomiale."]])}`,

uniexpo:String.raw`
<div class="box xana"><b>L'analogie</b> L'<b>uniforme</b>, c'est l'arrivée d'un bus dont tu sais seulement qu'il passe entre 8 h et 8 h 20 : toutes les minutes se valent. L'<b>exponentielle</b>, c'est la durée de vie d'une ampoule qui ne vieillit pas : qu'elle ait déjà tenu 100 heures ne change pas ses chances de tenir une heure de plus (absence de mémoire).</div>
${XSVG(`<line x1="20" y1="130" x2="250" y2="130" stroke="currentColor" opacity=".5"/><rect x="60" y="60" width="140" height="70" fill="#1f5fbf" fill-opacity=".2" stroke="#1f5fbf"/><text x="130" y="50" text-anchor="middle" font-size="12" fill="currentColor">U[a, b] : 1/(b − a)</text><line x1="270" y1="130" x2="500" y2="130" stroke="currentColor" opacity=".5"/><path d="M280 25 Q320 110 490 125" fill="none" stroke="#b5791c" stroke-width="2.5"/><text x="390" y="50" font-size="12" fill="currentColor">Exp(λ) : λe^(−λx)</text>`,150,"uniforme et exponentielle")}
<div class="box">Uniforme : $P(x_1\le X\le x_2)=\frac{x_2-x_1}{b-a}$ (longueur / longueur totale). Exponentielle : $P(X&gt;x)=e^{-\lambda x}$, $E=1/\lambda$. Le <b>taux de hasard</b> $g=\frac{f}{1-F}$ est constant égal à $\lambda$ pour l'exponentielle : c'est l'absence de mémoire.</div>
${XQ([["$X\\sim\\mathcal U[0,1]$ : $P(0{,}2\\le X\\le0{,}5)$ ?","$0{,}3$."],["$X\\sim\\mathcal E(2)$ : $P(X>1)$ ?","$e^{-2}\\approx0{,}135$."],["Taux de hasard d'une exponentielle de paramètre $\\lambda$ ?","Constant, égal à $\\lambda$."]])}`,

normale:String.raw`
<div class="box xana"><b>L'analogie</b> La loi normale, c'est la <b>répartition des tailles</b> dans un amphi : beaucoup de monde autour de la moyenne, de moins en moins vers les extrêmes, symétrique. Centrer-réduire, c'est convertir n'importe quelle taille en « nombre d'écarts-types au-dessus de la moyenne » pour pouvoir lire une <b>seule</b> table.</div>
${XSVG(`<line x1="30" y1="130" x2="490" y2="130" stroke="currentColor" opacity=".5"/><path d="M40 129 C150 128 190 20 260 20 C330 20 370 128 480 129" fill="none" stroke="#1f5fbf" stroke-width="2.5"/><path d="M40 129 C150 128 190 20 260 20 L260 130 L40 130 Z" fill="#1f5fbf" fill-opacity=".15"/><line x1="260" y1="20" x2="260" y2="130" stroke="currentColor" stroke-dasharray="4 3"/><text x="260" y="145" text-anchor="middle" font-size="11" fill="currentColor">m</text><text x="200" y="120" text-anchor="middle" font-size="12" fill="currentColor">P(X ≤ m) = 0,5</text><text x="380" y="40" font-size="12" fill="currentColor">Z = (X − m) / σ ~ N(0, 1)</text>`,150,"courbe en cloche")}
<div class="box">Recette : $P(X\le x)=\Phi\!\left(\frac{x-m}{\sigma}\right)$. Pour une valeur négative, la symétrie : $\Phi(-z)=1-\Phi(z)$. Pour retrouver $m$ et $\sigma$ à partir de deux probabilités, lis deux $z$ dans la table et résous un système de 2 équations.</div>
<div class="box trap"><b>Piège.</b> Le cours note $\mathcal N(m,\sigma)$ avec l'<b>écart-type</b>, pas la variance. Vérifie la notation de l'énoncé avant de diviser.</div>
${XQ([["$X\\sim\\mathcal N(10,2)$ : quel $z$ pour $x=14$ ?","$(14-10)/2=2$."],["$\\Phi(1{,}96)\\approx0{,}975$ : $P(Z\\le-1{,}96)$ ?","$0{,}025$."],["$Y=3X+1$ avec $X\\sim\\mathcal N(m,\\sigma)$ : loi de $Y$ ?","$\\mathcal N(3m+1,\\,3\\sigma)$."]])}`,

gamma:String.raw`
<div class="box xana"><b>L'analogie</b> Si l'exponentielle est le temps d'attente du <b>premier</b> bus, la loi Gamma $\Gamma(n,\lambda)$ est le temps d'attente du <b>n-ième</b> bus : la somme de $n$ attentes exponentielles indépendantes.</div>
<div class="box">À reconnaître dans un intégrale : $\int_0^{+\infty}x^{a-1}e^{-x}dx=\Gamma(a)$, avec $\Gamma(n)=(n-1)!$ et $\Gamma(1/2)=\sqrt\pi$. Ce réflexe transforme une intégrale qui fait peur en une factorielle. $E=a/\lambda$, $V=a/\lambda^2$.</div>
<div class="box trap"><b>Piège.</b> Vérifie la paramétrisation de l'énoncé ($\lambda$ taux ou $\theta=1/\lambda$ échelle) : l'espérance devient $a\theta$ au lieu de $a/\lambda$.</div>
${XQ([["$\\Gamma(5)$ ?","$4!=24$."],["Somme de 3 exponentielles $\\mathcal E(\\lambda)$ indépendantes ?","$\\Gamma(3,\\lambda)$."],["$\\int_0^{\\infty}x^3e^{-x}dx$ ?","$\\Gamma(4)=6$."]])}`,

khideux:String.raw`
<div class="box xana"><b>L'analogie</b> Le Khi-deux, c'est l'<b>énergie totale</b> de plusieurs erreurs normales : on prend $n$ erreurs $Z_i\sim\mathcal N(0,1)$ indépendantes, on les met au carré (plus de signe) et on additionne. C'est la base des tests statistiques.</div>
<div class="xfig"><div class="xmono">Z ~ N(0, 1)            ⇒  Z² ~ χ²(1) = Γ(1/2, 1/2)
Z₁² + … + Zₙ² (indép.)  ⇒  χ²(n) = Γ(n/2, 1/2)
E(χ²(n)) = n       V(χ²(n)) = 2n</div></div>
<div class="box trap"><b>Piège.</b> Pour montrer que $Z^2$ suit un $\chi^2(1)$, utilise la méthode de la fonction de répartition avec <b>deux bornes</b> : $P(Z^2\le y)=P(-\sqrt y\le Z\le\sqrt y)=2\Phi(\sqrt y)-1$, puis dérive.</div>
${XQ([["Espérance d'un $\\chi^2(5)$ ?","5."],["$Z_1,Z_2$ normales centrées réduites indépendantes : loi de $Z_1^2+Z_2^2$ ?","$\\chi^2(2)$, c'est-à-dire une exponentielle de paramètre $1/2$."],["Quelle loi Gamma correspond à $\\chi^2(n)$ ?","$\\Gamma(n/2,\\,1/2)$."]])}`
};

</script>
<script>
const CHAPS={A:"Bases de probabilité",B:"Variables aléatoires discrètes",C:"Variables aléatoires continues",D:"Lois usuelles discrètes",E:"Lois usuelles continues"};
const NOTIONS=[
/* ======================= CHAPITRE A ======================= */
{id:"denombrement",ch:"A",t:"Dénombrement : compter les cas",imp:2,src:"TD 3, 4, 5 · base de tous les calculs",
body:String.raw`
<p>Avant de calculer une probabilité, il faut souvent <b>compter</b> les cas possibles. Trois questions décident de la formule :</p>
<ol class="steps">
<li><b>L'ordre compte-t-il ?</b> Tirer « une boule puis une autre » (ordre) ou « deux boules d'un coup » (pas d'ordre, on dit <i>simultanément</i>).</li>
<li><b>Y a-t-il remise ?</b> Avec remise, le même objet peut ressortir.</li>
<li><b>Combien d'objets</b> $n$ au total, et <b>combien</b> $p$ on en prend.</li>
</ol>
<div class="tablewrap"><table class="t"><tr><th>Situation</th><th>Nombre de cas</th><th>Exemple</th></tr>
<tr><td>Ordre + sans remise (arrangement)</td><td>$A_n^p=\dfrac{n!}{(n-p)!}$</td><td>podium de 3 parmi 10 : $A_{10}^3=720$</td></tr>
<tr><td>Ordre + avec remise</td><td>$n^p$</td><td>code à 4 chiffres : $10^4$</td></tr>
<tr><td>Sans ordre + sans remise (combinaison)</td><td>$C_n^p=\dfrac{n!}{p!\,(n-p)!}$</td><td>2 boules parmi 7 : $C_7^2=21$</td></tr>
<tr><td>Tout ranger ($p=n$)</td><td>$n!$</td><td>5 livres sur une étagère : $120$</td></tr></table></div>
<div class="box"><b>Équiprobabilité.</b> Quand tous les résultats élémentaires ont la même chance (pièce équilibrée, tirage « au hasard »), on a
$$P(A)=\frac{\text{Card}(A)}{\text{Card}(\Omega)}=\frac{\text{nombre de cas favorables}}{\text{nombre de cas possibles}}.$$</div>
<h4>Exemple du TD (exercice 5)</h4>
<p>Une urne contient une boule « 0 », deux boules « 1 » et quatre boules « 3 ». On tire <b>simultanément</b> deux boules : $C_7^2=21$ paires équiprobables. La somme vaut 4 quand on tire un « 1 » et un « 3 » : $2\times4=8$ paires, donc $P(X=4)=8/21$.</p>
<div class="box trap"><b>Piège.</b> « Simultanément » = combinaisons. Ne multiplie pas par 2 pour l'ordre, sinon il faut aussi compter $\Omega$ avec ordre ($7\times6=42$) : le résultat est le même, mais mélanger les deux conventions donne une erreur.</div>
`,
quiz:[
{t:"q",q:"On tire simultanément 3 cartes parmi 32. Nombre de mains possibles ?",o:["$32^3$","$A_{32}^3$","$C_{32}^3$","$3!$"],a:2,e:"Simultanément, sans ordre, sans remise : combinaison $C_{32}^3=4960$."},
{t:"n",q:"Calcule $C_7^2$.",a:21,tol:0,e:"$C_7^2=\\frac{7\\times6}{2}=21$."},
{t:"q",q:"On lance une pièce 3 fois. Nombre de résultats possibles ?",o:["6","8","9","3"],a:1,e:"Ordre + « remise » (chaque lancer a 2 issues) : $2^3=8$."},
{t:"n",q:"Urne du TD (0 ; 1,1 ; 3,3,3,3), deux boules tirées simultanément. Donne $P(X=6)$ en décimal (somme = 6). Arrondis à 3 décimales.",a:6/21,tol:0.002,e:"Il faut deux « 3 » : $C_4^2=6$ paires sur 21, soit $6/21=2/7\\approx0{,}286$."}
]},

{id:"probas",ch:"A",t:"Probabilité, conditionnelle, Bayes",imp:2,src:"TD 2, 4 · cours chapitre 1",
body:String.raw`
<p>Une <b>expérience aléatoire</b> a des résultats imprévisibles. L'ensemble de tous les résultats est l'<b>univers</b> $\Omega$. Un <b>événement</b> est une partie de $\Omega$.</p>
<div class="box"><b>Règles de base</b> (à savoir réciter) :
<ul><li>$0\le P(A)\le 1$, $P(\Omega)=1$, $P(\emptyset)=0$</li>
<li>$P(\bar A)=1-P(A)$</li>
<li>$P(A\cup B)=P(A)+P(B)-P(A\cap B)$ ; si $A\cap B=\emptyset$ (incompatibles), $P(A\cup B)=P(A)+P(B)$</li>
<li>Si $A\subset B$ : $P(A)\le P(B)$ et $P(B\setminus A)=P(B)-P(A)$</li></ul>
« ET » se traduit par un produit (si indépendance ou en conditionnant), « OU » exclusif par une somme.</div>
<h4>Probabilité conditionnelle</h4>
<p>Si $P(B)\neq0$, la probabilité de $A$ <b>sachant</b> que $B$ est réalisé :</p>
$$P(A\mid B)=\frac{P(A\cap B)}{P(B)}\qquad\text{donc}\qquad P(A\cap B)=P(B)\,P(A\mid B).$$
<h4>Probabilités totales et Bayes</h4>
<p>Si $A_1,\dots,A_n$ forment un <b>système complet</b> (ils sont disjoints et leur réunion vaut $\Omega$) :</p>
$$P(B)=\sum_{j=1}^n P(A_j)\,P(B\mid A_j)\qquad\qquad P(A_i\mid B)=\frac{P(A_i)\,P(B\mid A_i)}{\sum_{j=1}^n P(A_j)\,P(B\mid A_j)}.$$
<h4>Exemple (cours, 3 urnes)</h4>
<p>On choisit une urne au hasard parmi 3, puis une boule. Si $P(\text{rouge}\mid U_1)=\tfrac12$, $P(\text{rouge}\mid U_2)=\tfrac14$, $P(\text{rouge}\mid U_3)=0$, alors $P(\text{rouge})=\tfrac13(\tfrac12+\tfrac14+0)=\tfrac14$ et $P(U_1\mid\text{rouge})=\dfrac{\frac13\cdot\frac12}{\frac14}=\tfrac23$.</p>
<div class="box trap"><b>Piège.</b> $P(A\mid B)\neq P(B\mid A)$ en général. Bayes sert justement à « retourner » le conditionnement.</div>
`,
quiz:[
{t:"q",q:"$P(A)=0{,}5$, $P(B)=0{,}4$, $P(A\\cap B)=0{,}2$. Que vaut $P(A\\mid B)$ ?",o:["0,4","0,5","0,8","0,2"],a:1,e:"$0{,}2/0{,}4=0{,}5$."},
{t:"n",q:"Même données. Calcule $P(A\\cup B)$.",a:0.7,tol:0.001,e:"$0{,}5+0{,}4-0{,}2=0{,}7$."},
{t:"q",q:"La formule de Bayes sert à calculer…",o:["$P(B)$ à partir des $P(A_j)$","$P(A_i\\mid B)$ quand on connaît les $P(B\\mid A_j)$","$P(A\\cap B)$ pour des événements indépendants","le nombre de cas favorables"],a:1,e:"Bayes retourne le conditionnement : on connaît $P(B\\mid A_j)$, on veut $P(A_i\\mid B)$."},
{t:"n",q:"Tournoi du TD 3 : chaque partie est gagnée par A avec probabilité 1/2. Probabilité que la finale s'arrête en 2 parties (AA ou BB) ?",a:0.5,tol:0.001,e:"$P(AA)+P(BB)=\\frac14+\\frac14=\\frac12$."}
]},

{id:"independance",ch:"A",t:"Indépendance d'événements",imp:2,src:"TD 2",
body:String.raw`
<div class="box">$A$ et $B$ sont <b>indépendants</b> $\iff P(A\cap B)=P(A)\,P(B)$.</div>
<p>Pour trois événements, on distingue :</p>
<ul><li><b>Deux à deux</b> : $P(A\cap B)=P(A)P(B)$, $P(A\cap C)=P(A)P(C)$, $P(B\cap C)=P(B)P(C)$.</li>
<li><b>Mutuellement</b> (dans leur ensemble) : les trois égalités <b>et</b> $P(A\cap B\cap C)=P(A)P(B)P(C)$.</li></ul>
<p>Deux à deux n'implique pas mutuellement. Contre-exemple du cours : deux pièces, $A$ = « 1<sup>re</sup> pile », $B$ = « 2<sup>e</sup> pile », $C$ = « une seule pile ». Chaque paire est indépendante ($1/4=1/2\times1/2$) mais $A\cap B\cap C=\emptyset$.</p>
<h4>Démonstration classique (TD 2-II) : si $A$, $B$ indépendants, alors $A$ et $\bar B$ aussi</h4>
<ol class="steps">
<li>$A=(A\cap B)\cup(A\cap\bar B)$, union disjointe, donc $P(A)=P(A\cap B)+P(A\cap\bar B)$.</li>
<li>$P(A\cap\bar B)=P(A)-P(A)P(B)=P(A)\,(1-P(B))=P(A)\,P(\bar B)$.</li>
<li>Même raisonnement pour $\bar A$ et $\bar B$ : $P(\bar A\cap\bar B)=1-P(A\cup B)=\dots=P(\bar A)P(\bar B)$.</li></ol>
<div class="box trap"><b>Piège.</b> Incompatibles ($A\cap B=\emptyset$) n'est pas indépendants. Si $P(A)>0$ et $P(B)>0$, deux événements incompatibles sont même forcément <b>dépendants</b> ($0\neq P(A)P(B)$).</div>
`,
quiz:[
{t:"q",q:"$P(A)=0{,}3$, $P(B)=0{,}5$, $A$ et $B$ indépendants. $P(A\\cap B)$ ?",o:["0,8","0,15","0,2","0"],a:1,e:"Produit : $0{,}15$."},
{t:"q",q:"$A$ et $B$ incompatibles, de probabilités non nulles. Sont-ils indépendants ?",o:["Oui toujours","Non, jamais","Ça dépend"],a:1,e:"$P(A\\cap B)=0\\neq P(A)P(B)>0$."},
{t:"q",q:"Trois événements indépendants deux à deux sont-ils mutuellement indépendants ?",o:["Toujours","Pas forcément"],a:1,e:"Il faut en plus $P(A\\cap B\\cap C)=P(A)P(B)P(C)$."}
]},

/* ======================= CHAPITRE B ======================= */
{id:"vad",ch:"B",t:"V.a discrète : loi, espérance, variance",imp:4,src:"Examens 2020-21 ord., 2022-23 ratt. (4 pts)",
body:String.raw`
<p>Une <b>variable aléatoire discrète</b> $X$ associe un nombre à chaque résultat ; elle prend des valeurs $x_1,x_2,\dots$ en nombre fini ou dénombrable. Sa <b>loi</b> est la liste des couples $(x_i,\,p_i)$ avec $p_i=P(X=x_i)$.</p>
<div class="box"><b>Vérifier qu'une suite est une loi de probabilité</b> : deux conditions, toutes deux à écrire.
$$\text{(1) } 0\le p_i\le 1\ \text{ pour tout } i\qquad\text{(2) }\sum_i p_i=1$$</div>
<h4>Les formules à connaître par cœur</h4>
$$E(X)=\sum_i x_i\,p_i\qquad E(g(X))=\sum_i g(x_i)\,p_i\qquad V(X)=E(X^2)-\big(E(X)\big)^2$$
$$E(aX+b)=aE(X)+b\qquad V(aX+b)=a^2\,V(X)\qquad \sigma(X)=\sqrt{V(X)}$$
<p>Fonction de répartition : $F(x)=P(X\le x)=\sum_{x_i\le x}p_i$. C'est une fonction en escalier, croissante, de 0 à 1.</p>
<h3>L'exercice qui tombe (4 pts)</h3>
<p>$P(X=0)=(1-p)^2$, $P(X=1)=2p(1-p)$, $P(X=2)=p^2$ avec $0\le p\le1$.</p>
<ol class="steps">
<li><b>C'est une loi.</b> Chaque terme est un produit de nombres de $[0,1]$ donc dans $[0,1]$ (pour $2p(1-p)$ : son maximum vaut $1/2$ en $p=1/2$). Somme : $(1-p)^2+2p(1-p)+p^2=\big((1-p)+p\big)^2=1$.</li>
<li>$E(X)=0\cdot(1-p)^2+1\cdot2p(1-p)+2p^2=2p$.</li>
<li>$E(X^2)=2p(1-p)+4p^2=2p+2p^2$, donc $V(X)=2p+2p^2-4p^2=2p(1-p)$.</li>
<li>$Y=-3X+1$ : $E(Y)=-3E(X)+1=1-6p$ et $V(Y)=(-3)^2V(X)=18p(1-p)$.</li></ol>
<div class="box prof"><b>Remarque qui rapporte.</b> Cette loi est la binomiale $\mathcal B(2,p)$ : on retrouve $E=np=2p$ et $V=np(1-p)$. Le dire en une ligne montre que tu as compris.</div>
<div class="box trap"><b>Pièges.</b> $V(-3X+1)=9V(X)$, jamais $-3V(X)$ ; la constante $+1$ disparaît dans la variance. Et $V(X)=E(X^2)-E(X)^2$, pas $E(X)^2-E(X^2)$.</div>
`,
quiz:[
{t:"q",q:"$V(-3X+1)$ vaut :",o:["$-3V(X)+1$","$9V(X)+1$","$9V(X)$","$-3V(X)$"],a:2,e:"$V(aX+b)=a^2V(X)$."},
{t:"n",q:"Avec la loi $(1-p)^2,\\ 2p(1-p),\\ p^2$ et $p=0{,}3$ : calcule $E(-3X+1)$.",a:-0.8,tol:0.001,e:"$1-6p=1-1{,}8=-0{,}8$."},
{t:"n",q:"Même loi, $p=0{,}3$ : calcule $V(-3X+1)$.",a:3.78,tol:0.001,e:"$18p(1-p)=18\\times0{,}3\\times0{,}7=3{,}78$."},
{t:"q",q:"Pour montrer qu'une suite $(p_i)$ est une loi de probabilité, on vérifie…",o:["seulement $\\sum p_i=1$","$p_i\\ge0$ et $\\sum p_i=1$","$E(X)$ existe","que $F$ est continue"],a:1,e:"Positivité (donc $\\le1$) et somme égale à 1."},
{t:"n",q:"TD 1 : $X(a)=X(b)=X(c)=X(d)=-1$, $X(e)=0$ avec $P(\\{a,b\\})=2/5$, $P(\\{c,d\\})=1/5$, $P(\\{e\\})=2/5$. Donne $P(X=-1)$ en décimal.",a:0.6,tol:0.001,e:"$2/5+1/5=3/5=0{,}6$."}
]},

{id:"linearite",ch:"B",t:"Preuves : E(X+Y) et E(XY)",imp:3,src:"Examen 2023-24 ord. (4 pts)",
body:String.raw`
<p>Ces deux démonstrations sont courtes et tombent telles quelles. On travaille avec la <b>loi du couple</b> $p_{ij}=P(X=x_i,\,Y=y_j)$ et ses marginales $p_{i\bullet}=\sum_j p_{ij}=P(X=x_i)$, $p_{\bullet j}=\sum_i p_{ij}=P(Y=y_j)$.</p>
<h4>1) $E(X+Y)=E(X)+E(Y)$</h4>
$$\begin{aligned}E(X+Y)&=\sum_i\sum_j (x_i+y_j)\,p_{ij}=\sum_i x_i\sum_j p_{ij}+\sum_j y_j\sum_i p_{ij}\\&=\sum_i x_i\,p_{i\bullet}+\sum_j y_j\,p_{\bullet j}=E(X)+E(Y).\end{aligned}$$
<h4>2) Si $X$ et $Y$ sont indépendantes, $E(XY)=E(X)E(Y)$</h4>
<p>Indépendance : $p_{ij}=p_{i\bullet}\,p_{\bullet j}$ pour tous $i,j$.</p>
$$E(XY)=\sum_i\sum_j x_iy_j\,p_{ij}=\sum_i\sum_j x_iy_j\,p_{i\bullet}p_{\bullet j}=\Big(\sum_i x_ip_{i\bullet}\Big)\Big(\sum_j y_jp_{\bullet j}\Big)=E(X)E(Y).$$
<div class="box prof"><b>Barème probable.</b> Écrire la définition avec la loi du couple, séparer les sommes, reconnaître les marginales, citer l'hypothèse d'indépendance au bon endroit. Chaque étape compte : n'en saute aucune.</div>
<div class="box trap"><b>Piège.</b> La première égalité n'a besoin d'aucune hypothèse. La seconde exige l'indépendance : la réciproque est fausse ($E(XY)=E(X)E(Y)$ n'entraîne pas l'indépendance, voir la notion « Covariance nulle »).</div>
`,
quiz:[
{t:"q",q:"$E(X+Y)=E(X)+E(Y)$ nécessite…",o:["l'indépendance","rien de plus que l'existence des espérances","que $X$ et $Y$ aient la même loi"],a:1,e:"La linéarité de l'espérance est toujours vraie."},
{t:"q",q:"Dans la preuve de $E(XY)=E(X)E(Y)$, l'étape clé est :",o:["$p_{ij}=p_{i\\bullet}+p_{\\bullet j}$","$p_{ij}=p_{i\\bullet}\\,p_{\\bullet j}$","$\\sum_j p_{ij}=1$"],a:1,e:"C'est la définition de l'indépendance pour un couple discret."}
]},

{id:"couple",ch:"B",t:"Couple discret : tableau, marginales, covariance",imp:5,src:"5 examens sur 11 (les « trois pièces »), 4 à 8 pts",
body:String.raw`
<p>C'est l'exercice le plus répété du module. Méthode en 6 étapes, toujours la même.</p>
<h3>L'énoncé</h3>
<p>On lance trois pièces. $X$ = nombre de faces sur les <b>deux premières</b>, $Y$ = nombre de piles sur les <b>deux dernières</b>. La pièce du milieu compte pour les deux.</p>
<h4>Étape 1 : lister les 8 résultats équiprobables (probabilité 1/8 chacun)</h4>
<div class="tablewrap"><table class="t"><tr><th>Résultat</th><th>FFF</th><th>FFP</th><th>FPF</th><th>FPP</th><th>PFF</th><th>PFP</th><th>PPF</th><th>PPP</th></tr>
<tr><td>$X$ (faces sur 1-2)</td><td>2</td><td>2</td><td>1</td><td>1</td><td>1</td><td>1</td><td>0</td><td>0</td></tr>
<tr><td>$Y$ (piles sur 2-3)</td><td>0</td><td>1</td><td>1</td><td>2</td><td>0</td><td>1</td><td>1</td><td>2</td></tr></table></div>
<h4>Étape 2 : le tableau de la loi du couple, avec les marges</h4>
<div class="tablewrap"><table class="t"><tr><th>$X\backslash Y$</th><th>0</th><th>1</th><th>2</th><th>$P(X=i)$</th></tr>
<tr><th>0</th><td>0</td><td>1/8</td><td>1/8</td><td>2/8</td></tr>
<tr><th>1</th><td>1/8</td><td>2/8</td><td>1/8</td><td>4/8</td></tr>
<tr><th>2</th><td>1/8</td><td>1/8</td><td>0</td><td>2/8</td></tr>
<tr><th>$P(Y=j)$</th><td>2/8</td><td>4/8</td><td>2/8</td><td>1</td></tr></table></div>
<h4>Étape 3 : lois marginales</h4>
<p>On somme les lignes (loi de $X$) et les colonnes (loi de $Y$) : $X$ et $Y$ prennent 0, 1, 2 avec probabilités $\tfrac14,\tfrac12,\tfrac14$.</p>
<h4>Étape 4 : indépendance ?</h4>
<p>Il suffit d'<b>un seul</b> contre-exemple : $P(X=0,Y=0)=0\neq P(X=0)P(Y=0)=\tfrac14\cdot\tfrac14$. Donc <b>non indépendantes</b>. (Pour prouver l'indépendance, il faudrait vérifier <i>toutes</i> les cases.)</p>
<h4>Étape 5 : covariance</h4>
$$E(X)=E(Y)=0\cdot\tfrac14+1\cdot\tfrac12+2\cdot\tfrac14=1,\qquad E(XY)=\sum_{i,j}ij\,p_{ij}=1\cdot1\cdot\tfrac28+1\cdot2\cdot\tfrac18+2\cdot1\cdot\tfrac18=\tfrac34$$
$$\text{Cov}(X,Y)=E(XY)-E(X)E(Y)=\tfrac34-1=-\tfrac14.$$
<h4>Étape 6 : loi du couple $(\min\{X,Y\},\max\{X,Y\})$</h4>
<p>Pour chaque case non nulle, on écrit le couple (min, max) puis on regroupe :</p>
<div class="tablewrap"><table class="t"><tr><th>$(X,Y)$</th><td>(0,1)</td><td>(0,2)</td><td>(1,0)</td><td>(1,1)</td><td>(1,2)</td><td>(2,0)</td><td>(2,1)</td></tr>
<tr><th>(min, max)</th><td>(0,1)</td><td>(0,2)</td><td>(0,1)</td><td>(1,1)</td><td>(1,2)</td><td>(0,2)</td><td>(1,2)</td></tr>
<tr><th>proba</th><td>1/8</td><td>1/8</td><td>1/8</td><td>2/8</td><td>1/8</td><td>1/8</td><td>1/8</td></tr></table></div>
<div class="tablewrap"><table class="t"><tr><th>$\min\backslash\max$</th><th>0</th><th>1</th><th>2</th></tr>
<tr><th>0</th><td>0</td><td>1/4</td><td>1/4</td></tr><tr><th>1</th><td>—</td><td>1/4</td><td>1/4</td></tr><tr><th>2</th><td>—</td><td>—</td><td>0</td></tr></table></div>
<div class="box prof"><b>Variante vue en TD (examen 7 pts)</b> : tableau $X\in\{1,2,3\}$, $Y\in\{1,2,3,4\}$ dont chaque case vaut le produit des marges. Là il faut écrire « $P(X=i,Y=j)=P(X=i)P(Y=j)$ pour <b>toutes</b> les cases », donc indépendance et $\text{Cov}=0$.</div>
<div class="box trap"><b>Pièges vus dans les copies.</b> Oublier que la pièce du milieu est commune ; confondre « faces » et « piles » ; ne pas vérifier que le tableau somme à 1 ; conclure à l'indépendance sans tout vérifier.</div>
<h4>Loi de la somme (cours 7.4)</h4>
<p>$P(X+Y=k)=\sum_{i}P(X=i,\,Y=k-i)$ : on additionne les cases d'une même « anti-diagonale ».</p>
`,
quiz:[
{t:"n",q:"Trois pièces : donne $P(X=1,Y=1)$ en décimal.",a:0.25,tol:0.001,e:"FPF et PFP : $2/8=0{,}25$."},
{t:"n",q:"Calcule $E(XY)$ (trois pièces), en décimal.",a:0.75,tol:0.001,e:"$\\frac28+\\frac28+\\frac28=\\frac34$."},
{t:"n",q:"Donne $\\text{Cov}(X,Y)$ en décimal.",a:-0.25,tol:0.001,e:"$\\frac34-1\\times1=-\\frac14$."},
{t:"q",q:"Pour montrer que $X$ et $Y$ ne sont pas indépendantes, il faut…",o:["vérifier toutes les cases","trouver une seule case où $p_{ij}\\neq p_{i\\bullet}p_{\\bullet j}$","montrer que $\\text{Cov}\\neq0$ uniquement"],a:1,e:"Un seul contre-exemple suffit (et $\\text{Cov}\\neq0$ marche aussi, mais un contre-exemple est plus rapide)."},
{t:"n",q:"Toujours les trois pièces : $P(X+Y=2)$ en décimal.",a:0.5,tol:0.001,e:"Cases (0,2), (1,1), (2,0) : $\\frac18+\\frac28+\\frac18=\\frac12$."},
{t:"n",q:"$P(\\min\\{X,Y\\}=0)$ en décimal.",a:0.5,tol:0.001,e:"(0,1) et (0,2) : $\\frac14+\\frac14$."}
]},

{id:"covnulle",ch:"B",t:"Covariance nulle et indépendance",imp:4,src:"Examens 2020-21 ratt., 2021-22 ratt. (5 à 8 pts)",
body:String.raw`
$$\text{Cov}(X,Y)=E\big[(X-E X)(Y-E Y)\big]=E(XY)-E(X)E(Y)$$
<div class="box"><b>Le résultat central.</b> Indépendantes $\Rightarrow$ $\text{Cov}=0$. <b>La réciproque est fausse en général</b>, sauf pour deux variables de Bernoulli.</div>
<h3>1) Indépendantes ⇒ Cov = 0</h3>
<p>Cas continu (examen 2021-22) : <b>CNS d'indépendance</b> : $f(x,y)=f_X(x)\,f_Y(y)$ pour tout $(x,y)$ (ou $F(x,y)=F_X(x)F_Y(y)$). Alors
$$E(XY)=\iint xy\,f_X(x)f_Y(y)\,dx\,dy=\int x f_X(x)dx\int yf_Y(y)dy=E(X)E(Y),$$ donc $\text{Cov}(X,Y)=0$.</p>
<h3>2) Contre-exemple : $Z\sim\mathcal N(0,1)$ et $T=Z^2$</h3>
<ol class="steps"><li>$E(Z^3)=\int_{-\infty}^{+\infty}\frac{x^3}{\sqrt{2\pi}}e^{-x^2/2}dx=0$ : la fonction est <b>impaire</b> et l'intégrale converge, sur un intervalle symétrique.</li>
<li>$\text{Cov}(Z,T)=E(Z\cdot Z^2)-E(Z)E(Z^2)=E(Z^3)-0\times1=0$.</li>
<li><b>Conclusion</b> : $\text{Cov}(Z,T)=0$ alors que $T=Z^2$ dépend totalement de $Z$. Une covariance nulle n'implique pas l'indépendance.</li></ol>
<h3>3) Le cas Bernoulli où la réciproque est vraie</h3>
<p>Tableau donné (avec $0\le p<1$) :</p>
<div class="tablewrap"><table class="t"><tr><th>$X\backslash Y$</th><th>0</th><th>1</th><th>$P(X=i)$</th></tr>
<tr><th>0</th><td>$p$</td><td>$1-p-p_1$</td><td>$1-p_1$</td></tr>
<tr><th>1</th><td>$1-p-p_2$</td><td>$p_1+p_2+p-1$</td><td>$p_1$</td></tr>
<tr><th>$P(Y=j)$</th><td>$1-p_2$</td><td>$p_2$</td><td>1</td></tr></table></div>
<ol class="steps">
<li>$XY$ vaut 1 seulement si $X=Y=1$ : $E(XY)=P(X=1,Y=1)=p_1+p_2+p-1$.</li>
<li>$E(X)=p_1$, $E(Y)=p_2$, donc $\text{Cov}(X,Y)=p_1+p_2+p-1-p_1p_2$.</li>
<li><b>CNS d'indépendance</b> : $P(X=i,Y=j)=P(X=i)P(Y=j)$ pour les 4 cases.</li>
<li><b>Si Cov = 0</b> : $P(1,1)=p_1p_2$. Puis on déduit les trois autres cases :
$P(1,0)=p_1-p_1p_2=p_1(1-p_2)$ ; $P(0,1)=p_2-p_1p_2=(1-p_1)p_2$ ; $P(0,0)=1-p_1-p_2+p_1p_2=(1-p_1)(1-p_2)$. Les 4 cases sont des produits : $X$ et $Y$ sont indépendantes.</li></ol>
<div class="box prof">Le prof a aussi donné en TD un tableau ($X\in\{0,1\}$, $Y\in\{0,1,2\}$, cases 1/20, 1/4, 0 / 17/60, 1/4, 1/6) où $\text{Cov}=0$ mais $P(X=0,Y=2)=0\neq\frac3{10}\cdot\frac16$ : non indépendantes. Même message.</div>
`,
quiz:[
{t:"q",q:"$\\text{Cov}(X,Y)=0$. Peut-on conclure que $X$ et $Y$ sont indépendantes ?",o:["Oui","Non en général ; oui si ce sont deux Bernoulli"],a:1,e:"Contre-exemple $Z$ et $Z^2$. Exception : variables de Bernoulli."},
{t:"n",q:"$Z\\sim\\mathcal N(0,1)$. Combien vaut $E(Z^3)$ ?",a:0,tol:0,e:"Intégrande impaire sur $\\mathbb R$ : 0."},
{t:"n",q:"Tableau Bernoulli avec $p=0{,}2$, $p_1=0{,}5$, $p_2=0{,}6$. Calcule $\\text{Cov}(X,Y)$.",a:0.0,tol:0.001,e:"$0{,}5+0{,}6+0{,}2-1-0{,}3=0$ : ici elles sont indépendantes."},
{t:"n",q:"Même tableau avec $p=0{,}3$, $p_1=0{,}5$, $p_2=0{,}6$. $\\text{Cov}(X,Y)$ ?",a:0.1,tol:0.001,e:"$0{,}4-0{,}3=0{,}1$."}
]},

{id:"densite",ch:"C",t:"Densité, fonction de répartition, probabilités",imp:5,src:"Toutes les questions continues · examens 2019-20, 2022-23 (U[0,1])",
body:String.raw`
<p>Une v.a <b>continue</b> $X$ a une <b>densité</b> $f$ : une fonction $f\ge0$ avec $\int_{-\infty}^{+\infty}f(x)\,dx=1$. Alors $P(a\le X\le b)=\int_a^b f(x)\,dx$ et $P(X=a)=0$ (donc $<$ ou $\le$, c'est pareil).</p>
<div class="box"><b>Fonction de répartition</b> : $F(x)=P(X\le x)=\int_{-\infty}^x f(t)\,dt$, et $F'=f$ là où $f$ est continue.
$$P(a<X\le b)=F(b)-F(a)$$
Propriétés : $0\le F\le1$, $F$ croissante, $\lim_{-\infty}F=0$, $\lim_{+\infty}F=1$, continue à droite.</div>
<h4>Méthode pour calculer $F$ : découper en zones</h4>
<p>Écris toujours les trois cas : à gauche du support ($F=0$), dans le support (on intègre), à droite ($F=1$).</p>
<h3>Exercice qui tombe : $X\sim\mathcal U[0,1]$, $P(x_1\le X\le x_2)$ (4 à 5 pts)</h3>
<p>$f(x)=1$ sur $[0,1]$, 0 ailleurs. $P(x_1\le X\le x_2)=\int_{x_1}^{x_2}f$. Il faut <b>discuter selon la position de $x_1<x_2$</b> :</p>
<div class="tablewrap"><table class="t"><tr><th>Cas</th><th>$P(x_1\le X\le x_2)$</th></tr>
<tr><td>$x_2<0$</td><td>0</td></tr>
<tr><td>$x_1<0\le x_2\le1$</td><td>$x_2$</td></tr>
<tr><td>$0\le x_1<x_2\le1$</td><td>$x_2-x_1$</td></tr>
<tr><td>$0\le x_1\le1<x_2$</td><td>$1-x_1$</td></tr>
<tr><td>$x_1<0$ et $x_2>1$</td><td>1</td></tr>
<tr><td>$x_1>1$</td><td>0</td></tr></table></div>
<div class="box prof">Les points viennent de la <b>discussion complète</b> : beaucoup d'étudiants ne donnent que $x_2-x_1$ et perdent la moitié.</div>
<h4>TD 8 : $F(x)=ax^2$ sur $]0,1]$</h4>
<p>$F$ continue en 1 : $a\cdot1^2=1$, donc $a=1$. $f(x)=F'(x)=2x$ sur $[0,1]$. $P(0{,}25<X<0{,}5)=F(0{,}5)-F(0{,}25)=0{,}25-0{,}0625=0{,}1875$, et on retrouve la même valeur avec $\int_{0{,}25}^{0{,}5}2x\,dx$.</p>
<h4>TD 9 : $f(x)=\tfrac34\sqrt{1-|x|}$ sur $[-1,1]$</h4>
<p>Pour $-1\le x\le0$ : $F(x)=\int_{-1}^x\tfrac34\sqrt{1+t}\,dt=\tfrac12(1+x)^{3/2}$. Pour $0\le x\le1$ : $F(x)=1-\tfrac12(1-x)^{3/2}$ (par symétrie). $F=0$ avant $-1$, $F=1$ après 1.</p>
`,
quiz:[
{t:"n",q:"$X\\sim\\mathcal U[0,1]$. $P(-0{,}5\\le X\\le 0{,}3)$ ?",a:0.3,tol:0.001,e:"Cas $x_1<0\\le x_2\\le1$ : $x_2=0{,}3$."},
{t:"n",q:"$X\\sim\\mathcal U[0,1]$. $P(0{,}4\\le X\\le 2)$ ?",a:0.6,tol:0.001,e:"$1-x_1=0{,}6$."},
{t:"n",q:"$F(x)=ax^2$ sur $]0,1]$. Que vaut $a$ ?",a:1,tol:0,e:"Continuité en 1."},
{t:"q",q:"Pour une v.a continue, $P(X=2)$ vaut…",o:["$f(2)$","$F(2)$","0"],a:2,e:"Un point a une probabilité nulle."},
{t:"n",q:"$f(x)=2x$ sur $[0,1]$. $P(X\\le0{,}5)$ ?",a:0.25,tol:0.001,e:"$F(0{,}5)=0{,}5^2$."}
]},

{id:"momentsc",ch:"C",t:"Espérance et variance (cas continu)",imp:5,src:"4 examens sur 11 (densité $\\frac2a(1-\\frac xa)$), 5 à 8 pts",
body:String.raw`
$$E(X)=\int_{-\infty}^{+\infty}x f(x)\,dx\qquad E(g(X))=\int g(x)f(x)\,dx\qquad V(X)=E(X^2)-E(X)^2$$
<h3>L'exercice phare : $f(x)=\frac2a\left(1-\frac xa\right)$ sur $[0,a]$</h3>
<h4>1) Fonction de répartition</h4>
<ul><li>Si $x<0$ : $F(x)=0$.</li>
<li>Si $0\le x\le a$ : $F(x)=\int_0^x\frac2a\left(1-\frac ta\right)dt=\frac2a\left[t-\frac{t^2}{2a}\right]_0^x=\frac{2x}a-\frac{x^2}{a^2}=\frac{2x}{a}\left(1-\frac{x}{2a}\right)$.</li>
<li>Si $x>a$ : $F(x)=1$ (vérification : $F(a)=2-1=1$).</li></ul>
<h4>2) Espérance et variance</h4>
$$E(X)=\int_0^a \frac2a\left(x-\frac{x^2}a\right)dx=\frac2a\left(\frac{a^2}2-\frac{a^2}3\right)=\frac a3$$
$$E(X^2)=\int_0^a\frac2a\left(x^2-\frac{x^3}a\right)dx=\frac2a\left(\frac{a^3}3-\frac{a^3}4\right)=\frac{a^2}6,\qquad V(X)=\frac{a^2}6-\frac{a^2}9=\frac{a^2}{18}.$$
<p>La question 3 (le maximum $M_n$) est traitée dans la notion « Min et max ».</p>
<div class="box trap"><b>Piège de calcul.</b> Développe d'abord $x\cdot\frac2a(1-\frac xa)=\frac2a(x-\frac{x^2}a)$, puis intègre terme à terme. Vérifie toujours que $F(a)=1$ : si ce n'est pas le cas, l'erreur est dans l'intégrale.</div>
`,
quiz:[
{t:"n",q:"$f(x)=\\frac2a(1-\\frac xa)$ avec $a=3$. Calcule $E(X)$.",a:1,tol:0.001,e:"$a/3=1$."},
{t:"n",q:"Même densité, $a=3$. Calcule $V(X)$.",a:0.5,tol:0.001,e:"$a^2/18=9/18$."},
{t:"n",q:"Même densité, $a=2$. Calcule $F(1)$.",a:0.75,tol:0.001,e:"$\\frac{2}{2}-\\frac{1}{4}=0{,}75$."},
{t:"q",q:"$V(X)$ se calcule par :",o:["$E(X^2)-E(X)^2$","$E(X)^2-E(X^2)$","$\\int x^2f-\\int xf$"],a:0,e:"Formule de König."}
]},

{id:"transfo",ch:"C",t:"Loi de Y = g(X) : la méthode de la fonction de répartition",imp:5,src:"Cœur des exercices Gamma et Normale (10 à 12 pts) · TD 12",
body:String.raw`
<p>Presque toutes les questions « donner la loi de $Y$ » ou « montrer que $Y\sim\dots$ » se font avec <b>une seule méthode</b> :</p>
<ol class="steps">
<li>Écrire $G(y)=P(Y\le y)$.</li>
<li>Remplacer $Y$ par $g(X)$ et <b>isoler $X$</b> : on obtient $G(y)$ en fonction de $F$.</li>
<li>Dériver : $g_Y(y)=G'(y)$ (dérivée d'une composée : $[F(u(y))]'=u'(y)\,f(u(y))$).</li>
<li>Remplacer $f$ par sa formule et <b>reconnaître</b> une densité connue.</li></ol>
<h4>Cas 1 : $Y=aX+b$</h4>
<p>Si $a>0$ : $G(y)=P(aX+b\le y)=P\left(X\le\frac{y-b}a\right)=F\left(\frac{y-b}a\right)$, donc $g(y)=\frac1a f\left(\frac{y-b}a\right)$.<br>
Si $a<0$ : l'inégalité change de sens, $G(y)=1-F\left(\frac{y-b}a\right)$, $g(y)=-\frac1af\left(\frac{y-b}a\right)$.<br>
Les deux cas ensemble : $g(y)=\dfrac1{|a|}f\left(\dfrac{y-b}a\right)$.</p>
<h4>Cas 2 : $Z=|X|$</h4>
<p>Pour $z\le0$ : $H(z)=0$. Pour $z>0$ : $H(z)=P(-z\le X\le z)=F(z)-F(-z)$, donc $h(z)=f(z)+f(-z)$.</p>
<h4>Cas 3 : $T=\ln|X|$</h4>
<p>$K(t)=P(|X|\le e^t)=F(e^t)-F(-e^t)$, donc $k(t)=e^t\big(f(e^t)+f(-e^t)\big)$ pour tout $t\in\mathbb R$.</p>
<h4>Cas 4 : $T=\ln|aX+b|$ (TD 16-II)</h4>
<p>$K(t)=P(|aX+b|\le e^t)$. Pour $a>0$ : $K(t)=F\left(\frac{e^t-b}a\right)-F\left(\frac{-e^t-b}a\right)$, et dans tous les cas $k(t)=\dfrac{e^t}{|a|}\left[f\left(\frac{e^t-b}a\right)+f\left(\frac{-e^t-b}a\right)\right]$.</p>
<h4>Cas 5 : $Y=U^2$ (sert pour le Khi-deux)</h4>
<p>Pour $y>0$ : $G(y)=P(-\sqrt y\le U\le\sqrt y)=F(\sqrt y)-F(-\sqrt y)$, donc $g(y)=\frac1{2\sqrt y}\big(f(\sqrt y)+f(-\sqrt y)\big)$.</p>
<div class="box prof"><b>Ce que le correcteur attend.</b> La ligne $G(y)=P(Y\le y)$ écrite explicitement, la discussion sur le signe de $a$ quand il n'est pas imposé, et la conclusion « on reconnaît la densité de … ».</div>
`,
quiz:[
{t:"q",q:"$Y=aX+b$ avec $a<0$. $G(y)$ vaut :",o:["$F(\\frac{y-b}a)$","$1-F(\\frac{y-b}a)$","$F(ay+b)$"],a:1,e:"Diviser par $a<0$ change le sens : $P(X\\ge\\frac{y-b}a)$."},
{t:"q",q:"Densité de $|X|$ pour $z>0$ :",o:["$f(z)-f(-z)$","$f(z)+f(-z)$","$2f(z)$ toujours"],a:1,e:"Dérivée de $F(z)-F(-z)$ : $f(z)+f(-z)$ ($2f(z)$ seulement si $f$ est paire)."},
{t:"q",q:"Première ligne à écrire pour trouver la loi de $Y=g(X)$ :",o:["$g_Y(y)=f(g(y))$","$G(y)=P(Y\\le y)$","$E(Y)=g(E(X))$"],a:1,e:"On part toujours de la fonction de répartition."},
{t:"n",q:"$X$ de densité $f$, $Y=2X+1$. On a $g(5)=\\frac1{2}f(c)$. Que vaut $c$ ?",a:2,tol:0,e:"$\\frac{y-b}a=\\frac{5-1}2=2$."}
]},

{id:"minmax",ch:"C",t:"Min et max de n variables indépendantes",imp:5,src:"5 examens sur 11, 3 à 8 pts",
body:String.raw`
<p>$X_1,\dots,X_n$ indépendantes, de même fonction de répartition $F$ et même densité $f$. On note $M_n=\max X_i$ et $m_n=\min X_i$.</p>
<h4>Le maximum</h4>
<p>$M_n\le x$ signifie que <b>tous</b> les $X_i$ sont $\le x$ :</p>
$$G(x)=P(M_n\le x)=P\Big(\bigcap_{i=1}^n\{X_i\le x\}\Big)\overset{\text{indép.}}{=}\prod_{i=1}^nP(X_i\le x)=F(x)^n,\qquad g(x)=n\,f(x)\,F(x)^{n-1}.$$
<h4>Le minimum</h4>
<p>$m_n>x$ signifie que tous les $X_i$ sont $>x$ :</p>
$$H(x)=P(m_n\le x)=1-P(m_n>x)=1-\big(1-F(x)\big)^n,\qquad h(x)=n\,f(x)\,\big(1-F(x)\big)^{n-1}.$$
<h3>Application 1 : densité $\frac2a(1-\frac xa)$ (l'exercice phare)</h3>
<p>Avec $F(x)=\frac{2x}a-\frac{x^2}{a^2}$ sur $[0,a]$ : $G(x)=0$ si $x<0$ ; $G(x)=\left(\frac{2x}a-\frac{x^2}{a^2}\right)^n$ si $0\le x\le a$ ; $G(x)=1$ si $x>a$. Densité :
$$g(x)=n\cdot\frac2a\left(1-\frac xa\right)\left(\frac{2x}a-\frac{x^2}{a^2}\right)^{n-1}\ \text{ sur }[0,a],\quad 0\ \text{sinon.}$$</p>
<h3>Application 2 : loi uniforme sur [0,1] (examen 2016-17 ratt.)</h3>
<p>$F(x)=x$ sur $[0,1]$. Donc $g(x)=nx^{n-1}$ et $h(x)=n(1-x)^{n-1}$ sur $[0,1]$.</p>
$$E(M_n)=\int_0^1 x\cdot nx^{n-1}dx=\frac n{n+1},\qquad E(m_n)=\int_0^1 xn(1-x)^{n-1}dx=\frac1{n+1}.$$
<p><b>$m_n$ et $1-M_n$ ont la même loi</b> : $P(1-M_n\le x)=P(M_n\ge1-x)=1-(1-x)^n=H(x)$. On en déduit $E(m_n)=E(1-M_n)=1-E(M_n)$.</p>
<div class="box trap"><b>Pièges.</b> Écrire le mot « indépendantes » au moment de transformer l'intersection en produit (c'est là que sont les points). Ne pas oublier les zones $x<0$ et $x>a$.</div>
`,
quiz:[
{t:"q",q:"$P(M_n\\le x)$ vaut :",o:["$1-(1-F(x))^n$","$F(x)^n$","$nF(x)$"],a:1,e:"Tous les $X_i\\le x$, indépendance, produit."},
{t:"n",q:"$X_i\\sim\\mathcal U[0,1]$, $n=4$. $E(M_4)$ ?",a:0.8,tol:0.001,e:"$n/(n+1)=4/5$."},
{t:"n",q:"$X_i\\sim\\mathcal U[0,1]$, $n=4$. $E(m_4)$ ?",a:0.2,tol:0.001,e:"$1/(n+1)$."},
{t:"n",q:"$X_i\\sim\\mathcal U[0,1]$, $n=3$. $P(M_3\\le0{,}5)$ ?",a:0.125,tol:0.001,e:"$0{,}5^3$."}
]},

{id:"couplec",ch:"C",t:"Couple de v.a continues",imp:2,src:"Examen 2016-17 ratt. (6 pts) · TD 10",
body:String.raw`
<p>La loi d'un couple continu est donnée par une densité $f(x,y)\ge0$ avec $\iint f=1$.</p>
<ul><li>$F(x,y)=P(X\le x,Y\le y)=\int_{-\infty}^x\int_{-\infty}^y f(u,v)\,dv\,du$</li>
<li>Marginales : $f_X(x)=\int f(x,y)\,dy$ et $f_Y(y)=\int f(x,y)\,dx$</li>
<li>Indépendance $\iff f(x,y)=f_X(x)f_Y(y)$ partout</li>
<li>Loi conditionnelle : $f_{Y\mid X=x}(y)=\dfrac{f(x,y)}{f_X(x)}$</li></ul>
<h3>Examen : $f(x,y)=\frac{xy}2$ sur $0\le y\le x\le2$</h3>
<p>Dessine le triangle : $x$ de 0 à 2, et pour chaque $x$, $y$ de 0 à $x$.</p>
<ol class="steps">
<li>Pour $0\le y\le x\le2$ : $F(x,y)=\int_0^y\int_v^x\frac{uv}2\,du\,dv=\int_0^y\frac v4(x^2-v^2)\,dv=\frac{x^2y^2}8-\frac{y^4}{16}$. Contrôle : $F(2,2)=2-1=1$.</li>
<li>$f_X(x)=\int_0^x\frac{xy}2dy=\frac{x^3}4$ sur $[0,2]$ ; $f_Y(y)=\int_y^2\frac{xy}2dx=\frac{y(4-y^2)}4$ sur $[0,2]$.</li>
<li>$f_X(x)f_Y(y)\neq f(x,y)$ (par exemple en $x=1$, $y=1{,}5$ : $f=0$ mais le produit est non nul) : <b>pas indépendantes</b>. Un support triangulaire donne toujours des variables dépendantes.</li>
<li>$f_{Y\mid X=x}(y)=\dfrac{xy/2}{x^3/4}=\dfrac{2y}{x^2}$ pour $0\le y\le x$.</li></ol>
<h3>TD 10 : $f(x,y)=k(x+y)$ sur $[0,1]^2$</h3>
<p>$\iint (x+y)=1$ donc $k=1$. $F(x,y)=\frac{xy(x+y)}2$ sur $[0,1]^2$. $f_X(x)=x+\frac12$, $f_Y(y)=y+\frac12$. Non indépendantes. $f_{Y\mid X=x}(y)=\dfrac{x+y}{x+\frac12}$.</p>
`,
quiz:[
{t:"n",q:"$f(x,y)=k(x+y)$ sur $[0,1]^2$. Valeur de $k$ ?",a:1,tol:0,e:"$\\iint(x+y)=\\frac12+\\frac12=1$."},
{t:"n",q:"$f(x,y)=\\frac{xy}2$ sur $0\\le y\\le x\\le2$. $f_X(2)$ ?",a:2,tol:0.001,e:"$x^3/4=8/4$."},
{t:"q",q:"Un couple de densité non nulle seulement sur un triangle peut-il être indépendant ?",o:["Oui","Non"],a:1,e:"Le produit des marginales serait non nul sur tout un rectangle."}
]},

{id:"mgf",ch:"C",t:"Fonction génératrice des moments",imp:3,src:"Examens 2017-18 et 2020-21 (8 pts)",
body:String.raw`
$$M_X(t)=E\big(e^{tX}\big)=\int_{-\infty}^{+\infty}e^{tx}f(x)\,dx\quad(\text{continu}),\qquad =\sum_k e^{tk}P(X=k)\quad(\text{discret}).$$
<p>Elle « génère » les moments : $M_X'(0)=E(X)$, $M_X''(0)=E(X^2)$.</p>
<h3>Les trois calculs demandés à l'examen</h3>
<h4>a) Uniforme sur $[a,b]$</h4>
<p>$M_X(t)=\int_a^b\frac{e^{tx}}{b-a}dx$. Si $t=0$ : $M_X(0)=1$. Si $t\neq0$ :
$$M_X(t)=\frac{e^{tb}-e^{ta}}{t(b-a)}.$$</p>
<h4>b) Exponentielle de paramètre $\theta$</h4>
<p>$M_X(t)=\int_0^{+\infty}e^{tx}\theta e^{-\theta x}dx=\theta\int_0^{+\infty}e^{(t-\theta)x}dx$. L'intégrale converge seulement si $t-\theta<0$ :
$$M_X(t)=\frac{\theta}{\theta-t}\quad\text{si } t<\theta,\qquad M_X(t)=+\infty\quad\text{si } t\ge\theta.$$</p>
<h4>c) Normale centrée réduite</h4>
<p>On complète le carré : $tx-\frac{x^2}2=-\frac12(x-t)^2+\frac{t^2}2$.
$$M_X(t)=\frac1{\sqrt{2\pi}}\int e^{-\frac{(x-t)^2}2}e^{\frac{t^2}2}dx=e^{t^2/2}\underbrace{\int\frac1{\sqrt{2\pi}}e^{-s^2/2}ds}_{=1}=e^{t^2/2}\quad(s=x-t).$$</p>
<div class="box trap"><b>Pièges.</b> Tes notes manuscrites écrivent $\frac{-\theta}{t-\theta}$ : c'est juste, c'est la même chose que $\frac\theta{\theta-t}$. Le piège est d'oublier la condition $t<\theta$ (l'intégrale diverge si $t\ge\theta$) et le cas $t=0$ pour l'uniforme (on ne peut pas diviser par $t$).</div>
`,
quiz:[
{t:"n",q:"$X\\sim\\mathcal E(2)$. $M_X(1)$ ?",a:2,tol:0.001,e:"$\\frac{2}{2-1}=2$."},
{t:"n",q:"$X\\sim\\mathcal N(0,1)$. $M_X(2)$ arrondi à 2 décimales ?",a:Math.exp(2),tol:0.01,e:"$e^{2}\\approx7{,}39$."},
{t:"q",q:"Pour $X\\sim\\mathcal E(\\theta)$, $M_X(t)$ est finie pour…",o:["$t>\\theta$","$t<\\theta$","tout $t$"],a:1,e:"Il faut $t-\\theta<0$."},
{t:"q",q:"$M_X(0)$ vaut toujours :",o:["0","1","$E(X)$"],a:1,e:"$E(e^0)=1$."}
]},

{id:"binomiale",ch:"D",t:"Bernoulli, binomiale (et uniforme, Dirac)",imp:3,src:"Base des exercices discrets",
body:String.raw`
<div class="tablewrap"><table class="t"><tr><th>Loi</th><th>Valeurs</th><th>$P(X=k)$</th><th>$E$</th><th>$V$</th></tr>
<tr><td>Dirac $\delta_a$</td><td>$a$</td><td>1</td><td>$a$</td><td>0</td></tr>
<tr><td>Uniforme sur $\{x_1..x_n\}$</td><td>$x_i$</td><td>$1/n$</td><td>$\bar x$</td><td>$\frac1n\sum x_i^2-\bar x^2$</td></tr>
<tr><td>Bernoulli $\mathcal B(p)$</td><td>0, 1</td><td>$P(X=1)=p$</td><td>$p$</td><td>$p(1-p)$</td></tr>
<tr><td>Binomiale $\mathcal B(n,p)$</td><td>$0..n$</td><td>$C_n^kp^k(1-p)^{n-k}$</td><td>$np$</td><td>$np(1-p)$</td></tr></table></div>
<p><b>Binomiale</b> = nombre de succès en $n$ épreuves <b>indépendantes</b> et identiques. On écrit $X=X_1+\dots+X_n$ (Bernoulli indépendantes), d'où $E=np$ et $V=np(1-p)$.</p>
<p><b>Somme</b> : si $X_1\sim\mathcal B(n_1,p)$ et $X_2\sim\mathcal B(n_2,p)$ indépendantes, $X_1+X_2\sim\mathcal B(n_1+n_2,p)$ (même $p$ obligatoire).</p>
<h4>Exemple du cours</h4>
<p>On lance un dé 100 fois, succès = « 3 ou 6 » ($p=1/3$). $X\sim\mathcal B(100,\frac13)$, $E(X)=\frac{100}3\approx33{,}3$, $V(X)=100\cdot\frac13\cdot\frac23\approx22{,}2$, $\sigma\approx4{,}71$.</p>
<div class="box trap"><b>Piège</b> (exercice du poly) : $P(X=1{,}5)=0$ pour une binomiale, car 1,5 n'est pas une valeur possible.</div>
`,
quiz:[
{t:"n",q:"$X\\sim\\mathcal B(20;0{,}1)$. $E(X)$ ?",a:2,tol:0,e:"$np$."},
{t:"n",q:"$X\\sim\\mathcal B(20;0{,}1)$. $P(X=0)$ à 4 décimales ?",a:Math.pow(0.9,20),tol:0.0005,e:"$0{,}9^{20}\\approx0{,}1216$."},
{t:"n",q:"$X\\sim\\mathcal B(20;0{,}1)$. $P(X=1{,}5)$ ?",a:0,tol:0,e:"Valeur impossible."},
{t:"n",q:"$V(X)$ pour $\\mathcal B(100,\\frac13)$, à 2 décimales ?",a:200/9,tol:0.01,e:"$100\\cdot\\frac13\\cdot\\frac23=22{,}22$."}
]},

{id:"poisson",ch:"D",t:"Loi de Poisson et loi conditionnelle",imp:3,src:"Examen 2017-18 (8 pts) · TD 11",
body:String.raw`
<p>$X\sim\mathcal P(\lambda)$ compte des apparitions d'un événement pendant une durée ; $\lambda$ est la moyenne.</p>
$$P(X=k)=e^{-\lambda}\frac{\lambda^k}{k!},\ k\in\mathbb N,\qquad E(X)=V(X)=\lambda.$$
<p><b>Somme</b> : $X\sim\mathcal P(\lambda)$, $Y\sim\mathcal P(\mu)$ indépendantes $\Rightarrow S=X+Y\sim\mathcal P(\lambda+\mu)$.</p>
<h3>Exercice d'examen : loi de $X$ sachant $S=s$</h3>
<ol class="steps">
<li>Pour $0\le x\le s$ : $P(X=x\mid S=s)=\dfrac{P(X=x,\,S=s)}{P(S=s)}=\dfrac{P(X=x,\,Y=s-x)}{P(S=s)}$.</li>
<li>Indépendance : $=\dfrac{e^{-\lambda}\frac{\lambda^x}{x!}\cdot e^{-\mu}\frac{\mu^{s-x}}{(s-x)!}}{e^{-(\lambda+\mu)}\frac{(\lambda+\mu)^s}{s!}}$.</li>
<li>Simplifier : les exponentielles s'annulent, $\frac{s!}{x!(s-x)!}=C_s^x$, donc $P(X=x\mid S=s)=C_s^x\left(\frac\lambda{\lambda+\mu}\right)^x\left(1-\frac\lambda{\lambda+\mu}\right)^{s-x}$.</li>
<li>On reconnaît : $X\mid(S=s)\sim\mathcal B\!\left(s,\frac\lambda{\lambda+\mu}\right)$.</li>
<li>Fonction de régression : $E(X\mid S=s)=s\,\frac\lambda{\lambda+\mu}$, donc $E(X\mid S)=S\frac\lambda{\lambda+\mu}$.</li>
<li>$E\big[E(X\mid S)\big]=\frac\lambda{\lambda+\mu}E(S)=\frac\lambda{\lambda+\mu}(\lambda+\mu)=\lambda=E(X)$.</li></ol>
<h4>Exemple du cours</h4>
<p>Une machine tombe en panne 2 fois par mois en moyenne : $X\sim\mathcal P(2)$. $P(X=0)=e^{-2}\approx0{,}135$ ; $P(X\ge2)=1-e^{-2}(1+2)\approx0{,}594$.</p>
`,
quiz:[
{t:"n",q:"$X\\sim\\mathcal P(2)$. $P(X\\ge2)$ à 3 décimales ?",a:1-3*Math.exp(-2),tol:0.002,e:"$1-e^{-2}(1+2)\\approx0{,}594$."},
{t:"q",q:"$X\\sim\\mathcal P(\\lambda)$, $Y\\sim\\mathcal P(\\mu)$ indépendantes. Loi de $X$ sachant $X+Y=s$ :",o:["$\\mathcal P(\\lambda)$","$\\mathcal B(s,\\frac\\lambda{\\lambda+\\mu})$","$\\mathcal P(\\lambda+\\mu)$"],a:1,e:"Calcul direct avec la définition de la probabilité conditionnelle."},
{t:"n",q:"$\\lambda=1$, $\\mu=3$, $s=8$. $E(X\\mid S=8)$ ?",a:2,tol:0.001,e:"$8\\times\\frac14$."},
{t:"n",q:"$X\\sim\\mathcal P(4)$. $V(X)$ ?",a:4,tol:0,e:"$V=\\lambda$."}
]},

{id:"geometrique",ch:"D",t:"Loi géométrique (de Pascal)",imp:3,src:"Examens 2021-22 ratt. et 2022-23 ord. (5 pts)",
body:String.raw`
<p>On répète des épreuves <b>indépendantes</b> de probabilité de succès $p$ <b>jusqu'au premier succès</b>. $X$ = nombre d'épreuves nécessaires (succès compris).</p>
$$P(X=k)=p\,(1-p)^{k-1},\ k\in\mathbb N^*,\qquad E(X)=\frac1p,\qquad V(X)=\frac{1-p}{p^2}.$$
<p>$\{X=k\}$ = $k-1$ échecs puis un succès : $\underbrace{\bar A\cdots\bar A}_{k-1}A$.</p>
<p>Formule utile : $P(X>k)=(1-p)^k$ (les $k$ premiers essais sont des échecs), donc $P(X\le k)=1-(1-p)^k$.</p>
<h3>L'exercice des cartes (examen)</h3>
<p>$n$ cartes numérotées de 1 à $n$, tirages <b>avec remise</b> jusqu'à obtenir la carte $n$.</p>
<ol class="steps">
<li>Chaque tirage est une épreuve de Bernoulli indépendante, succès = « tirer la carte $n$ », $p=\frac1n$. Donc $X\sim\mathcal G(\frac1n)$.</li>
<li>$P(X=k)=\frac1n\left(1-\frac1n\right)^{k-1}=\dfrac{(n-1)^{k-1}}{n^k}$, $k\ge1$.</li>
<li>$P(X\le50)=1-P(X>50)=1-\left(1-\frac1n\right)^{50}$. Pour $n=100$ : $1-0{,}99^{50}\approx0{,}395$.</li></ol>
<p>Version du cours : $P(X=21)=\frac{99^{20}}{100^{21}}\approx0{,}0082$ ; $P(X\le60)=1-0{,}99^{60}\approx0{,}453$.</p>
<div class="box prof">Si tu préfères la somme : $P(X>50)=\sum_{k\ge51}p(1-p)^{k-1}=p(1-p)^{50}\cdot\frac1{1-(1-p)}=(1-p)^{50}$. C'est la démarche du poly ; montre-la pour avoir tous les points.</div>
`,
quiz:[
{t:"n",q:"Cartes, $n=100$. $P(X\\le50)$ à 3 décimales ?",a:1-Math.pow(0.99,50),tol:0.002,e:"$1-0{,}99^{50}\\approx0{,}395$."},
{t:"n",q:"$X\\sim\\mathcal G(0{,}2)$. $E(X)$ ?",a:5,tol:0,e:"$1/p$."},
{t:"n",q:"$X\\sim\\mathcal G(0{,}5)$. $P(X=3)$ ?",a:0.125,tol:0.001,e:"$0{,}5\\times0{,}5^2$."},
{t:"q",q:"Les tirages des cartes se font avec remise. Pourquoi est-ce indispensable pour la loi géométrique ?",o:["Pour que $p$ reste constant et les épreuves indépendantes","Pour que $X$ soit fini","Ce n'est pas indispensable"],a:0,e:"Sans remise, la probabilité changerait à chaque tirage."}
]},

{id:"autresdiscretes",ch:"D",t:"Binomiale négative, hypergéométrique, différences",imp:2,src:"Examen 2020-21 ord. (8 pts)",
body:String.raw`
<h4>Binomiale négative $\mathcal{BN}(n,p)$</h4>
<p>Épreuves indépendantes jusqu'à obtenir <b>$n$ succès</b>. $Y$ = nombre d'épreuves. $\{Y=y\}$ : $n-1$ succès parmi les $y-1$ premières, puis un succès.</p>
$$P(Y=y)=C_{y-1}^{n-1}p^n(1-p)^{y-n},\ y\ge n,\qquad E(Y)=\frac np,\ V(Y)=\frac{n(1-p)}{p^2}.$$
<p>C'est une somme de $n$ géométriques indépendantes.</p>
<h4>Hypergéométrique $\mathcal H(N,n,N_A)$</h4>
<p>$n$ tirages <b>sans remise</b> dans $N$ objets dont $N_A$ de type A. $X$ = nombre d'objets A tirés.</p>
$$P(X=k)=\frac{C_{N_A}^k\,C_{N-N_A}^{n-k}}{C_N^n},\qquad \max\{0,\,n-(N-N_A)\}\le k\le\min\{n,\,N_A\},\qquad E(X)=n\frac{N_A}N.$$
<h3>Exercice d'examen : les représentants</h3>
<p>On choisit $n$ étudiants parmi $N$, dont $N_1$ garçons. $X$ = nombre de garçons choisis.</p>
<ol class="steps"><li>Choix simultané, sans remise : $X\sim\mathcal H(N,n,N_1)$.</li>
<li>$k\le n$ et $k\le N_1$ ; il y a $n-k$ filles, donc $n-k\le N-N_1$. D'où $m=\max\{0,\,n-(N-N_1)\}$ et $M=\min\{n,\,N_1\}$.</li>
<li>$P(X=k)=\dfrac{C_{N_1}^kC_{N-N_1}^{n-k}}{C_N^n}$ pour $m\le k\le M$.</li></ol>
<h4>Les différences demandées</h4>
<div class="tablewrap"><table class="t"><tr><th>Paire</th><th>Ce qui est fixé</th><th>Ce qui est aléatoire</th></tr>
<tr><td>Binomiale / binomiale négative</td><td>Binomiale : le nombre d'épreuves $n$. BN : le nombre de succès $n$.</td><td>Binomiale : le nombre de succès. BN : le nombre d'épreuves.</td></tr>
<tr><td>Géométrique / binomiale négative</td><td colspan="2">La géométrique est le cas $n=1$ de la BN (attente du <b>premier</b> succès, au lieu du $n$-ième).</td></tr>
<tr><td>Binomiale / hypergéométrique</td><td colspan="2">Binomiale : tirages <b>avec remise</b>, indépendants, $p$ constant. Hypergéométrique : <b>sans remise</b>, tirages dépendants. Avec remise, $\mathcal H$ devient $\mathcal B(n,\frac{N_A}N)$.</td></tr></table></div>
<div class="box trap">Le poly dit que les indicatrices $X_i$ de l'hypergéométrique sont « indépendantes » : c'est inexact (sans remise, elles sont dépendantes). Le calcul de $E(X)$ reste juste, car la linéarité de l'espérance n'a pas besoin d'indépendance. Ne recopie pas cette phrase.</div>
`,
quiz:[
{t:"n",q:"$N=10$, $N_1=4$ garçons, $n=8$ choisis. Valeur minimale $m$ du nombre de garçons ?",a:2,tol:0,e:"$\\max(0,8-6)=2$."},
{t:"n",q:"Même situation. Valeur maximale $M$ ?",a:4,tol:0,e:"$\\min(8,4)=4$."},
{t:"q",q:"Laquelle fixe le nombre de succès et rend aléatoire le nombre d'épreuves ?",o:["Binomiale","Binomiale négative","Hypergéométrique"],a:1,e:"BN : on attend le $n$-ième succès."},
{t:"n",q:"$\\mathcal{BN}(10,\\frac13)$ : $E(Y)$ ?",a:30,tol:0,e:"$n/p$."}
]},
