<script>
const MODULE={"slug":"archi","titre":"Architecture des ordinateurs","cle":"ao-revision-v1","cleEtat":"ao-revision-v1","format":"essais","intro":"<p>Le cours chapitre par chapitre, avec <strong>QCM</strong>, <strong>flashcards</strong> (révision espacée) et <strong>TD corrigés</strong>.</p>\n<ul>\n<li><strong>Tableau de bord</strong> : tes notions à consolider, les plus importantes d&#39;abord.</li>\n<li><strong>Flashcards</strong> : quelques minutes par jour ; une carte réussie revient après 1, 3, 7, 14 puis 30 jours.</li>\n<li><strong>TD</strong> : cherche, ouvre l&#39;indice si besoin, compare avec le corrigé et note-toi.</li>\n<li><strong>Outils interactifs</strong> (en bas du menu) : atelier de circuits et d&#39;assembleur, examen blanc chronométré, journal d&#39;erreurs.</li>\n</ul>\n<p>Ta progression d&#39;avant la nouvelle version est conservée.</p>\n","annexes":[{"fichier":"archi-ordinateurs-outils.html","titre":"Outils interactifs (atelier de circuits et d'assembleur, examen blanc chronométré, journal d'erreurs)"}],"cartes":null};
const CHAPS=[{"id":"L1","t":"Introduction et architecture de Von Neumann","seance":"","imp":3,"html":"<p>Ce module répond à une question : <b>comment une machine faite de fils et de transistors exécute-t-elle un programme ?</b> Le prof suit l'ordre logique du matériel : coder l'information en binaire (CH2), la manipuler avec l'algèbre de Boole (CH3), construire des circuits (CH5, CH6), puis assembler mémoire, bus et processeur, et enfin programmer ce processeur en assembleur 8086.</p>\n<div class=\"def\"><b>Définitions du cours</b>\n<b style=\"display:inline;text-transform:none;letter-spacing:0;font-size:inherit;font-family:inherit\">Architecture</b> : organisation des éléments d'un système et relations entre ces éléments.<br>\n• <b>Architecture matérielle</b> : organisation des dispositifs physiques, fonctionnement logique de chaque composant et leurs interactions.<br>\n• <b>Architecture logicielle</b> : organisation des programmes, codage de l'information et <b>jeu d'instructions</b> de la machine.<br>\n• <b>Ordinateur</b> : machine qui permet de <b>saisir</b> (périphériques d'entrée), <b>stocker</b> (mémoire), <b>traiter</b> (programmes) et <b>restituer</b> (périphériques de sortie) des informations.<br>\n• <b>Information</b> : élément de connaissance représenté par des conventions pour être conservé, traité, communiqué. Toute information est manipulée sous forme <b>binaire</b>.<br>\n• <b>Informatique</b> = « information » + « automatique » : science du traitement rationnel et automatique de l'information.<br>\n• <b>Bus</b> : ensemble de fils électriques qui fait circuler l'information entre les composants.</div>\n<h4>Les niveaux d'une machine (machine multi-niveaux)</h4>\n<p>Du plus bas au plus haut : <b>circuits logiques</b> (portes) → <b>microarchitecture</b> (UAL, registres, microprogramme) → <b>jeu d'instructions</b> → <b>système d'exploitation</b> (appels système) → <b>langage d'assemblage</b> (traduit par l'assembleur) → <b>langage de haut niveau</b> (traduit par la compilation).</p>\n<h4>Microprocesseur</h4>\n<p>Circuit intégré de plusieurs millions de transistors, cœur de l'ordinateur. Il combine des fonctions <b>combinatoires</b> (calcul) et <b>séquentielles</b> (mémorisation) et exécute les instructions au rythme de son <b>horloge</b> (exemple du cours : 300 MHz ≈ 300 millions d'instructions par seconde, en supposant une instruction par top).</p>\n<h4>Von Neumann ou Harvard</h4>\n<div class=\"svgbox\"><svg viewBox=\"0 0 560 230\" style=\"max-width:560px;width:100%\" role=\"img\" aria-label=\"Architecture de Von Neumann\">\n<rect class=\"g\" x=\"10\" y=\"20\" width=\"230\" height=\"150\" rx=\"4\"/><text x=\"20\" y=\"40\">PROCESSEUR (CPU)</text>\n<rect class=\"g\" x=\"22\" y=\"52\" width=\"95\" height=\"50\"/><text x=\"30\" y=\"72\">Unité de</text><text x=\"30\" y=\"88\">commande</text>\n<rect class=\"g\" x=\"130\" y=\"52\" width=\"98\" height=\"50\"/><text x=\"140\" y=\"72\">UAL</text><text x=\"140\" y=\"88\">(calcul)</text>\n<rect class=\"g\" x=\"22\" y=\"112\" width=\"206\" height=\"44\"/><text x=\"30\" y=\"132\">Registres : CO (IP), RI,</text><text x=\"30\" y=\"148\">accumulateur, état…</text>\n<rect class=\"g\" x=\"330\" y=\"20\" width=\"220\" height=\"70\" rx=\"4\"/><text x=\"342\" y=\"44\">MÉMOIRE PRINCIPALE</text><text x=\"342\" y=\"62\">programme + données</text><text x=\"342\" y=\"78\">(une seule mémoire)</text>\n<rect class=\"g\" x=\"330\" y=\"120\" width=\"220\" height=\"50\" rx=\"4\"/><text x=\"342\" y=\"142\">ENTRÉES / SORTIES</text><text x=\"342\" y=\"158\">clavier, écran, disque</text>\n<line class=\"hl\" x1=\"240\" y1=\"195\" x2=\"550\" y2=\"195\"/><text x=\"250\" y=\"190\">bus d'adresses (CPU → mémoire)</text>\n<line class=\"bl\" x1=\"240\" y1=\"215\" x2=\"550\" y2=\"215\"/><text x=\"250\" y=\"228\">bus de données (dans les 2 sens)</text>\n<line class=\"w\" x1=\"240\" y1=\"60\" x2=\"330\" y2=\"60\"/><line class=\"w\" x1=\"240\" y1=\"140\" x2=\"330\" y2=\"140\"/><line class=\"w\" x1=\"125\" y1=\"170\" x2=\"125\" y2=\"215\"/><line class=\"w\" x1=\"125\" y1=\"215\" x2=\"240\" y2=\"215\"/><line class=\"w\" x1=\"440\" y1=\"90\" x2=\"440\" y2=\"120\"/>\n</svg></div>\n<div class=\"table-wrap\"><table><tr><th></th><th>Von Neumann</th><th>Harvard</th></tr>\n<tr><td>Mémoire</td><td><b>Une seule</b> mémoire pour les instructions ET les données</td><td>Deux mémoires <b>séparées</b> (instructions / données)</td></tr>\n<tr><td>Usage</td><td>Ordinateurs personnels, usage général</td><td>Microcontrôleurs, systèmes embarqués, hautes performances</td></tr></table></div>\n<p>Le cours étudie <b>Von Neumann</b>. Ses 4 organes : unité de commande, UAL, mémoire principale, entrées/sorties, reliés par les bus. Programmes et données sont dans la <b>mémoire principale</b> (question du TD 3, ex. 4).</p>\n<div class=\"exam\"><b>Ce qui tombe</b>TD 3 ex. 4 : « Rappeler l'architecture de Von Neumann avec un schéma », « Définir : unité centrale, microprocesseur, mémoire principale, bus, registre », « Où sont stockés programmes et données ? ». Reproduis le schéma ci-dessus et les définitions mot pour mot.</div>\n<div class=\"def\"><b>Les 5 définitions du TD 3 ex. 4</b>\n<b style=\"display:inline;font:inherit;text-transform:none;letter-spacing:0\">Unité centrale</b> : partie principale de l'ordinateur qui exécute les programmes ; elle regroupe le processeur et la mémoire principale.<br>\n<b style=\"display:inline;font:inherit;text-transform:none;letter-spacing:0\">Microprocesseur</b> : circuit intégré qui lit, décode et exécute les instructions (unité de commande + UAL + registres).<br>\n<b style=\"display:inline;font:inherit;text-transform:none;letter-spacing:0\">Mémoire principale</b> : organe principal de stockage ; contient les programmes (instructions et données) ; directement accessible par le processeur.<br>\n<b style=\"display:inline;font:inherit;text-transform:none;letter-spacing:0\">Bus</b> : ensemble de fils qui transporte les informations entre les composants : bus d'adresses (unidirectionnel), bus de données (bidirectionnel), bus de commande.<br>\n<b style=\"display:inline;font:inherit;text-transform:none;letter-spacing:0\">Registre</b> : petite mémoire interne au processeur, faite de bascules, qui mémorise un mot (adresse, donnée, instruction, résultat intermédiaire).</div>\n<div class=\"trap\"><b>Piège</b>Le corrigé 2024 cite seulement « bus de données et bus d'adresses ». Ajoute le <b>bus de commande</b> (signaux lecture/écriture), c'est la réponse complète.</div><h2>Questions de rédaction</h2>\n<section class=\"exo\"><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Présenter l&#39;architecture de Von Neumann et dire où sont stockés programmes et données.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Quatre organes : unité de commande, unité arithmétique et logique (UAL), mémoire principale, entrées/sorties, reliés par des bus (adresses, données, commande). Une seule mémoire contient à la fois les instructions du programme et les données.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 6 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Dans l&#39;architecture de Von Neumann, les instructions et les données sont…</div><button class=\"opt\" data-o=\"0\">dans deux mémoires séparées</button><button class=\"opt\" data-o=\"1\">dans la même mémoire principale</button><button class=\"opt\" data-o=\"2\">dans les registres uniquement</button><button class=\"opt\" data-o=\"3\">sur le disque dur</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">L&#39;architecture de Harvard est surtout utilisée dans…</div><button class=\"opt\" data-o=\"0\">les ordinateurs de bureau</button><button class=\"opt\" data-o=\"1\">les microcontrôleurs et systèmes embarqués</button><button class=\"opt\" data-o=\"2\">les serveurs web</button><button class=\"opt\" data-o=\"3\">les imprimantes réseau</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Le jeu d&#39;instructions fait partie de…</div><button class=\"opt\" data-o=\"0\">l&#39;architecture logicielle</button><button class=\"opt\" data-o=\"1\">l&#39;architecture matérielle uniquement</button><button class=\"opt\" data-o=\"2\">la mémoire de masse</button><button class=\"opt\" data-o=\"3\">du bus</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"n1","rep":null,"tol":null}],"qcm":[{"n":"n1","q":"Dans l&#39;architecture de Von Neumann, les instructions et les données sont…","o":["dans deux mémoires séparées","dans la même mémoire principale","dans les registres uniquement","sur le disque dur"],"a":1,"e":"Von Neumann = une seule mémoire. Deux mémoires, c&#39;est Harvard."},{"n":"n1","q":"L&#39;architecture de Harvard est surtout utilisée dans…","o":["les ordinateurs de bureau","les microcontrôleurs et systèmes embarqués","les serveurs web","les imprimantes réseau"],"a":1,"e":"Diapo 23 du CH1."},{"n":"n1","q":"Le jeu d&#39;instructions fait partie de…","o":["l&#39;architecture logicielle","l&#39;architecture matérielle uniquement","la mémoire de masse","du bus"],"a":0,"e":"Architecture logicielle = organisation des programmes, codage, jeu d&#39;instructions."}]},{"id":"L2","t":"Unités, bases et conversions","seance":"","imp":5,"html":"<h4>Unités</h4>\n<div class=\"formula\">bit      : 0 ou 1 (BInary digIT), plus petite unité\nquartet  : 4 bits\noctet    : 8 bits → 2⁸ = 256 valeurs\n1 Ko = 1024 octets   1 Mo = 1024 Ko   1 Go = 1024 Mo   1 To = 1024 Go   (cours : puissances de 2)</div>\n<div class=\"def\"><b>La règle qui sert partout</b>Sur <b>n bits</b> on code <b>2ⁿ valeurs</b> : les entiers non signés de 0 à 2ⁿ − 1.<br>Pour coder <b>N valeurs différentes</b>, il faut le plus petit n tel que 2ⁿ ≥ N, c'est-à-dire n = ⌈log₂ N⌉.</div>\n<details class=\"ex\"><summary>Exemple guidé : TD 1 ex. 1</summary><div>\n<p>1. Sur un octet : 2⁸ = <b>256 entiers positifs</b>, de 0 à 255.</p>\n<p>2. 65 563 valeurs : 2¹⁶ = 65 536 &lt; 65 563 ≤ 2¹⁷ = 131 072 → <b>17 bits</b>.</p>\n<p>3. 4 Mo = 4 × 2²⁰ octets ; un mot = 32 bits = 4 octets → 4 × 2²⁰ / 4 = 2²⁰ = <b>1 048 576 mots</b>.</p>\n<div class=\"trap\"><b>Piège</b>Le corrigé 2024 écrit « de 0 à 256 » : c'est faux, le plus grand est 255 (256 valeurs en comptant 0).</div></div></details>\n<h4>Écrire un nombre dans une base</h4>\n<p>Dans la base b, on utilise b symboles (0 … b−1) et chaque position vaut une puissance de b. C'est la <b>forme polynomiale</b> :</p>\n<div class=\"formula\">(1101,101)₂ = 1·2³ + 1·2² + 0·2¹ + 1·2⁰ + 1·2⁻¹ + 0·2⁻² + 1·2⁻³ = 13,625\n(1A7)₁₆    = 1·16² + 10·16¹ + 7·16⁰ = 256 + 160 + 7 = 423\n(43,2)₅    = 4·5 + 3 + 2·5⁻¹ = 23,4</div>\n<p>Hexadécimal : A=10, B=11, C=12, D=13, E=14, F=15. Un chiffre qui n'existe pas dans la base rend le nombre invalide : (1289)₈ n'existe pas.</p>\n<h4>Les 4 méthodes de conversion</h4>\n<ol>\n<li><b>Base b → décimal</b> : développer en polynôme et additionner.</li>\n<li><b>Décimal → base b (partie entière)</b> : divisions successives par b, on lit les <b>restes de bas en haut</b>.</li>\n<li><b>Décimal → base b (partie fractionnaire)</b> : multiplications successives par b, on lit les <b>parties entières de haut en bas</b>. On s'arrête quand la partie fractionnaire vaut 0 ou quand on a assez de chiffres (le résultat peut être infini).</li>\n<li><b>b1 → b2</b> : passer par la base 10. <b>Exception</b> : entre 2, 8 et 16, on regroupe les bits (3 bits = 1 chiffre octal, 4 bits = 1 chiffre hexa), à partir de la virgule : vers la gauche pour la partie entière, vers la droite pour la partie fractionnaire, en complétant avec des 0.</li></ol>\n<details class=\"ex\"><summary>Exemple guidé : (35,625)₁₀ en binaire</summary><div><div class=\"steps\">Partie entière, divisions par 2 :\n35 = 2×17 + 1\n17 = 2×8  + 1\n 8 = 2×4  + 0\n 4 = 2×2  + 0\n 2 = 2×1  + 0\n 1 = 2×0  + 1      restes lus de bas en haut → 100011\n\nPartie fractionnaire, multiplications par 2 :\n0,625 × 2 = 1,25  → 1\n0,25  × 2 = 0,5   → 0\n0,5   × 2 = 1,0   → 1   (fin : partie fractionnaire nulle)\nlu de haut en bas → ,101\n\n(35,625)₁₀ = (100011,101)₂</div></div></details>\n<details class=\"ex\"><summary>Exemple guidé : regroupements</summary><div><div class=\"steps\">(110010100,10101)₂ en octal : 110 010 100 , 101 010 → (624,52)₈\n(110010100,10101)₂ en hexa  : 0001 1001 0100 , 1010 1000 → (194,A8)₁₆\n(AB3,4F6)₁₆ en binaire : 1010 1011 0011 , 0100 1111 0110\n(34)₅ en base 7 : 3×5+4 = 19 ; 19 = 7×2+5 ; 2 = 7×0+2 → (25)₇</div>\n<div class=\"trap\"><b>Erreur dans les diapos</b>Diapo 27 : « (43)₁₀ = (101011)₂ = (AB)₁₆ ». Faux : 0010 1011 = <b>(2B)₁₆</b>. Et la diapo 23 donne (624,51)₈ : avec le regroupement à droite on obtient 101 010 = <b>(624,52)₈</b>.</div></div></details>\n<details class=\"ex\"><summary>Exemple guidé : TD 1 ex. 2.3, trouver une base</summary><div>\n<p>(2545)<sub>b</sub> = (4)₁₀ ? Le nombre contient le chiffre 5, donc b ≥ 6. Alors (2545)<sub>b</sub> ≥ 2·6³ = 432 &gt; 4. <b>Aucune base ne convient.</b></p>\n<p>La méthode longue (résoudre 2b³ + 5b² + 4b + 5 = 4, racines −1 et −½, aucune base entière ≥ 2) donne la même conclusion. L'argument « chiffre 5 donc b ≥ 6 » se rédige en deux lignes : utilise-le.</p></div></details>\n<div class=\"trap\"><b>Piège du TD 1</b>(26,3)₁₀ = (<b>11010</b>,0100110011…)₂ : 26 = 16 + 8 + 2. Le corrigé 2024 écrit 10010 (qui vaut 18) : erreur de recopie. Et 0,3 donne un développement infini (0,0 1001 1001…) : on s'arrête à la précision demandée et on l'écrit.</div><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 6 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Combien de bits faut-il pour 1000 valeurs différentes ?</div><button class=\"opt\" data-o=\"0\">9</button><button class=\"opt\" data-o=\"1\">10</button><button class=\"opt\" data-o=\"2\">11</button><button class=\"opt\" data-o=\"3\">1000</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Sur 12 bits, le plus grand entier non signé est…</div><button class=\"opt\" data-o=\"0\">4096</button><button class=\"opt\" data-o=\"1\">4095</button><button class=\"opt\" data-o=\"2\">2047</button><button class=\"opt\" data-o=\"3\">1023</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">(1A)₁₆ vaut en décimal…</div><button class=\"opt\" data-o=\"0\">26</button><button class=\"opt\" data-o=\"1\">16</button><button class=\"opt\" data-o=\"2\">110</button><button class=\"opt\" data-o=\"3\">31</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">(57)₈ en binaire ?</div><button class=\"opt\" data-o=\"0\">101111</button><button class=\"opt\" data-o=\"1\">111101</button><button class=\"opt\" data-o=\"2\">101011</button><button class=\"opt\" data-o=\"3\">110111</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">(0,375)₁₀ en binaire ?</div><button class=\"opt\" data-o=\"0\">0,011</button><button class=\"opt\" data-o=\"1\">0,101</button><button class=\"opt\" data-o=\"2\">0,0111</button><button class=\"opt\" data-o=\"3\">0,11</button><div class=\"qq-e\" hidden></div></div></section>","ex":[],"qcm":[{"n":"n2","q":"Combien de bits faut-il pour 1000 valeurs différentes ?","o":["9","10","11","1000"],"a":1,"e":"2⁹ = 512 &lt; 1000 ≤ 1024 = 2¹⁰."},{"n":"n2","q":"Sur 12 bits, le plus grand entier non signé est…","o":["4096","4095","2047","1023"],"a":1,"e":"2¹² − 1 = 4095."},{"n":"n3","q":"(1A)₁₆ vaut en décimal…","o":["26","16","110","31"],"a":0,"e":"1×16 + 10 = 26."},{"n":"n3","q":"(57)₈ en binaire ?","o":["101111","111101","101011","110111"],"a":0,"e":"5 = 101, 7 = 111."},{"n":"n4","q":"(0,375)₁₀ en binaire ?","o":["0,011","0,101","0,0111","0,11"],"a":0,"e":"0,375×2 = 0,75 → 0 ; ×2 = 1,5 → 1 ; 0,5×2 = 1 → 1."}]},{"id":"L3","t":"Opérations dans les bases 2, 8 et 16","seance":"","imp":4,"html":"<p>On calcule exactement comme en décimal, mais la retenue part dès qu'on atteint la base.</p>\n<div class=\"formula\">Addition binaire   : 0+0=0  0+1=1  1+1=0 retenue 1   1+1+1 = 1 retenue 1\nSoustraction       : 0−0=0  1−0=1  1−1=0  0−1=1 retenue (emprunt) 1\nMultiplication     : 0×0=0  0×1=0  1×1=1   (décalages + additions)\nDivision           : comme en décimal ; à chaque étape le diviseur « va » 1 ou 0 fois</div>\n<details class=\"ex\"><summary>Exemple guidé : TD 1 ex. 3</summary><div><div class=\"steps\">  11111111            11010011            11010011 × 1001\n+ 11111111          − 10010111            = 11010011        (×1)\n= 111111110         = 00111100            + 11010011000     (×1000)\n(255+255=510)       (211−151=60)          = 11101101011     (211×9=1899)\n\n10010000111 ÷ 1011 (1159 ÷ 11) : quotient 1101001 (105), reste 100 (4)\nVérification : 105 × 11 + 4 = 1159 ✓</div>\n<p><b>Réflexe d'examen</b> : vérifie toujours en repassant en décimal, ça prend 20 secondes et ça sauve des points.</p></div></details>\n<h4>En octal et en hexadécimal</h4>\n<p>Retenue quand la somme atteint 8 (octal) ou 16 (hexa). Emprunt : on « emprunte » 8 ou 16.</p>\n<details class=\"ex\"><summary>Exemple guidé : exercices de la diapo 26</summary><div><div class=\"steps\">(63)₈ + (35)₈ : 3+5 = 8 = 1×8 + 0 → 0 retenue 1 ; 6+3+1 = 10 = 1×8 + 2 → 2 retenue 1 → (120)₈\n(AB3)₁₆ + (23E)₁₆ : 3+E = 17 = 16+1 → 1 retenue 1 ; B+3+1 = 15 = F ; A+2 = C → (CF1)₁₆\n(AB3)₁₆ − (23E)₁₆ : 3−E impossible → 3+16−14 = 5, emprunt ; B−3−1 = 7 ; A−2 = 8 → (875)₁₆\n(1101,111)₂ + (11,1)₂ = (10001,011)₂   (13,875 + 3,5 = 17,375)\n(43)₆ = 27 = (102)₅ = (33)₈</div></div></details>\n<div class=\"exam\"><b>DM du prof</b>Le devoir demandait une addition, une soustraction, une multiplication et une division dans chaque base 2, 8, 10, 16 avec le détail. L'atelier « Opérations dans une base » génère exactement ce type d'exercice.</div><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 1 flashcard de ce chapitre ajoutée à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">(7)₈ + (1)₈ = ?</div><button class=\"opt\" data-o=\"0\">(8)₈</button><button class=\"opt\" data-o=\"1\">(10)₈</button><button class=\"opt\" data-o=\"2\">(11)₈</button><button class=\"opt\" data-o=\"3\">(17)₈</button><div class=\"qq-e\" hidden></div></div></section>","ex":[],"qcm":[{"n":"n5","q":"(7)₈ + (1)₈ = ?","o":["(8)₈","(10)₈","(11)₈","(17)₈"],"a":1,"e":"8 = 1×8 + 0."}]},{"id":"L4","t":"Nombres négatifs : S/VA, Ca1, Ca2","seance":"","imp":5,"html":"<p>Le processeur ne connaît pas le signe « − ». Le cours présente 3 conventions, toujours sur un nombre de bits <b>n fixé</b>.</p>\n<div class=\"table-wrap\"><table><tr><th>Méthode</th><th>Codage de −x</th><th>Plage sur n bits</th><th>Zéro</th></tr>\n<tr><td><b>Signe / valeur absolue</b> (S/VA)</td><td>bit de poids fort = 1, puis |x| sur n−1 bits</td><td class=\"num\">−(2ⁿ⁻¹−1) … +(2ⁿ⁻¹−1)</td><td>deux zéros (+0, −0)</td></tr>\n<tr><td><b>Complément à 1</b> (restreint, Ca1)</td><td>inverser tous les bits de |x| codé sur n bits</td><td class=\"num\">−(2ⁿ⁻¹−1) … +(2ⁿ⁻¹−1)</td><td>deux zéros</td></tr>\n<tr><td><b>Complément à 2</b> (vrai, Ca2)</td><td>Ca1 + 1</td><td class=\"num\">−2ⁿ⁻¹ … +(2ⁿ⁻¹−1)</td><td>un seul zéro</td></tr></table></div>\n<p>Les positifs s'écrivent pareil dans les 3 méthodes (bit de poids fort à 0). Sur 8 bits en Ca2 : de −128 à +127.</p>\n<div class=\"def\"><b>Deux méthodes pour le Ca2 (cours)</b>1. Ca2 = Ca1 + 1.<br>2. Parcourir depuis la droite : garder tous les bits jusqu'au premier 1 inclus, inverser tous les bits suivants. Exemple : 01000101 → 10111011 ; 01010100 → 10101100.</div>\n<details class=\"ex\"><summary>Exemple guidé : TD 1 ex. 4.1, coder −13 et −127 sur 8 bits</summary><div><div class=\"steps\">|−13| = 13 = 00001101\nS/VA : 10001101    Ca1 : 11110010    Ca2 : 11110011\n\n|−127| = 127 = 01111111\nS/VA : 11111111    Ca1 : 10000000    Ca2 : 10000001</div>\n<div class=\"trap\"><b>Piège du corrigé 2024</b>Il écrit « Complément à 1 de 10001101 = 11110010 » : il complémente le code S/VA en laissant le bit de signe. Le résultat est juste par coïncidence, mais la méthode du cours est d'inverser <b>|x| = 00001101</b>, bit de signe compris.</div></div></details>\n<details class=\"ex\"><summary>Exemple guidé : décoder 10010010 (TD 1 ex. 4.2)</summary><div><div class=\"steps\">Non signé : 128 + 16 + 2 = 146\nSigné, selon la convention :\n  S/VA : signe 1, valeur 0010010 = 18      → −18\n  Ca1  : on inverse → 01101101 = 109        → −109\n  Ca2  : on prend le Ca2 → 01101110 = 110   → −110\nAstuce Ca2 : valeur = −128×b7 + reste = −128 + 18 = −110</div>\n<p>Le TD dit seulement « codage signé ». Le corrigé 2024 répond −110 (Ca2, la convention des machines). À l'examen, <b>écris la convention que tu utilises</b> ; si tu as le temps, donne les trois.</p></div></details>\n<h4>Soustraire avec le Ca2</h4>\n<p>a − b = a + Ca2(b). On fait l'addition binaire sur n bits et on <b>ignore la retenue qui sort</b> du bit de poids fort. Si le résultat commence par 1, il est négatif : on reprend son Ca2 pour lire sa valeur absolue.</p>\n<div class=\"def\"><b>Dépassement (overflow)</b>Il y a dépassement quand on additionne deux nombres de <b>même signe</b> et que le résultat a le <b>signe opposé</b>. Choisis donc n assez grand pour que a, b et le résultat tiennent dans −2ⁿ⁻¹ … 2ⁿ⁻¹−1.</div>\n<details class=\"ex\"><summary>Exemple guidé : 312 − 123 et 145 − 220 (TD 1 ex. 4.3)</summary><div><div class=\"steps\">312 − 123 : 312 demande 9 bits en non signé, donc 10 bits en signé (max 511).\n  312       = 0100111000\n  123       = 0001111011 → Ca2 = 1110000101\n  somme     = 1 0010111101 → on ignore la retenue → 0010111101 = 189 ✓\n\n145 − 220 : 220 &gt; 127, on travaille sur 9 bits (−256 … 255).\n  145       = 010010001\n  220       = 011011100 → Ca2 = 100100100\n  somme     = 110110101   (pas de retenue sortante, bit de signe 1 → négatif)\n  Ca2(110110101) = 001001011 = 75 → résultat −75 ✓</div>\n<div class=\"trap\"><b>Pièges du corrigé 2024</b>Il fait 312 − 123 sur 9 bits : 312 ne tient pas en signé sur 9 bits (max 255), le résultat sort juste par chance. Pour 145 − 220, il code −220 sur 8 bits (impossible, min −128) et écrit une somme 100110101 fausse. Choisis toujours n d'abord et dis-le.</div></div></details><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 5 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">−1 en Ca2 sur 8 bits ?</div><button class=\"opt\" data-o=\"0\">10000001</button><button class=\"opt\" data-o=\"1\">11111110</button><button class=\"opt\" data-o=\"2\">11111111</button><button class=\"opt\" data-o=\"3\">00000001</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Sur 8 bits en Ca2, 10000000 vaut…</div><button class=\"opt\" data-o=\"0\">−0</button><button class=\"opt\" data-o=\"1\">−127</button><button class=\"opt\" data-o=\"2\">−128</button><button class=\"opt\" data-o=\"3\">+128</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Quelle méthode a deux représentations du zéro ?</div><button class=\"opt\" data-o=\"0\">Ca2 seulement</button><button class=\"opt\" data-o=\"1\">S/VA et Ca1</button><button class=\"opt\" data-o=\"2\">Ca2 et Ca1</button><button class=\"opt\" data-o=\"3\">aucune</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Sur 8 bits en Ca2, 100 + 50 donne…</div><button class=\"opt\" data-o=\"0\">150, pas de dépassement</button><button class=\"opt\" data-o=\"1\">un dépassement (résultat lu −106)</button><button class=\"opt\" data-o=\"2\">−150</button><button class=\"opt\" data-o=\"3\">une retenue ignorée sans erreur</button><div class=\"qq-e\" hidden></div></div></section>","ex":[],"qcm":[{"n":"n6","q":"−1 en Ca2 sur 8 bits ?","o":["10000001","11111110","11111111","00000001"],"a":2,"e":"Ca1(00000001) = 11111110, +1 = 11111111."},{"n":"n6","q":"Sur 8 bits en Ca2, 10000000 vaut…","o":["−0","−127","−128","+128"],"a":2,"e":"Le Ca2 a un seul zéro et va jusqu&#39;à −128."},{"n":"n6","q":"Quelle méthode a deux représentations du zéro ?","o":["Ca2 seulement","S/VA et Ca1","Ca2 et Ca1","aucune"],"a":1,"e":"S/VA et Ca1 ont +0 et −0."},{"n":"n7","q":"Sur 8 bits en Ca2, 100 + 50 donne…","o":["150, pas de dépassement","un dépassement (résultat lu −106)","−150","une retenue ignorée sans erreur"],"a":1,"e":"150 &gt; 127 : deux positifs donnent un résultat de bit de signe 1 → dépassement."}]},{"id":"L5","t":"Nombres réels : virgule fixe et IEEE 754","seance":"","imp":5,"html":"<h4>Virgule fixe</h4>\n<p>On réserve 1 bit de signe, n bits pour la partie entière, p bits pour la partie fractionnaire. Avec n = 3 et p = 2, les valeurs vont de 0,00 à 7,75 par pas de 0,25. Simple, mais peu de valeurs et peu de précision.</p>\n<h4>Virgule flottante : norme IEEE 754 simple précision (32 bits)</h4>\n<div class=\"formula\">| S (1 bit) | Exposant biaisé Eb (8 bits) | Mantisse M (23 bits) |\nN = (−1)^S × 1,M × 2^E      avec  Eb = E + 127   (biais = 2⁸⁻¹ − 1 = 127)\nDouble précision (64 bits) : 1 + 11 + 52 bits, biais = 2¹¹⁻¹ − 1 = 1023</div>\n<div class=\"def\"><b>Coder un réel en 5 étapes</b>1. Signe S (0 si positif, 1 si négatif).<br>2. Convertir |x| en binaire (partie entière + partie fractionnaire).<br>3. Normaliser : déplacer la virgule juste après le premier 1 → 1,M × 2^E.<br>4. Eb = E + 127, sur 8 bits.<br>5. M = les bits après la virgule, complétés à droite par des 0 jusqu'à 23 bits. Regrouper les 32 bits par 4 pour écrire en hexa.</div>\n<details class=\"ex\"><summary>Exemple guidé : −123,75 (TD 1 ex. 5.2)</summary><div><div class=\"steps\">1. S = 1\n2. 123 = 1111011 ; 0,75 = 0,11 → 1111011,11\n3. 1111011,11 = 1,11101111 × 2⁶ → E = 6\n4. Eb = 6 + 127 = 133 = 10000101\n5. M = 11101111 000000000000000 (23 bits)\n1 10000101 11101111000000000000000\n1100 0010 1111 0111 1000 0000 0000 0000 = C2F78000</div>\n<div class=\"trap\"><b>Piège du corrigé 2024</b>Il écrit (C2F7800)ₕ : il manque un 0, il faut <b>8 chiffres hexa</b> pour 32 bits. Compte toujours tes chiffres.</div></div></details>\n<details class=\"ex\"><summary>Exemple guidé : décoder C17B0000 (TD 1 ex. 5.1)</summary><div><div class=\"steps\">C17B0000 = 1100 0001 0111 1011 0000 …\nS = 1 (négatif)\nEb = 1000 0010 = 130 → E = 130 − 127 = 3\nM = 1111011 000… → 1,1111011\n1,1111011 × 2³ = 1111,1011 = 15 + 0,5 + 0,125 + 0,0625 = 15,6875\nRésultat : −15,6875        (de même 40F00000 = +7,5)</div></div></details>\n<details class=\"ex\"><summary>Exemple guidé : 18,54 (développement infini)</summary><div><div class=\"steps\">18 = 10010 ; 0,54 = 0,10001010001111010111…  (infini)\n10010,1000101000111101… = 1,00101000101000111101… × 2⁴\nEb = 4 + 127 = 131 = 10000011\nM = 23 premiers bits après la virgule : 00101000101000111101011 | 1000…\nTronqué : 0 10000011 00101000101000111101011 = 419451EB\nArrondi au plus proche (le bit suivant vaut 1) : 419451EC (valeur exacte d'une machine)</div>\n<div class=\"trap\"><b>Piège du corrigé 2024</b>Il s'arrête à 11 bits pour 0,54 puis écrit (419442000)ₕ (9 chiffres, et faux). Il faut calculer 23 bits de mantisse. Indique « tronqué » ou « arrondi » sur ta copie.</div></div></details>\n<h4>Autres codes (plan du chapitre)</h4>\n<p>Le plan du CH2 annonce aussi le BCD, l'Excess-3 et l'ASCII, sans diapo détaillée dans ce que tu m'as envoyé. L'essentiel :</p>\n<ul><li><b>BCD</b> : chaque chiffre décimal sur 4 bits. 59 → 0101 1001. Les codes 1010 à 1111 sont interdits.</li>\n<li><b>Excess-3</b> : BCD + 3 sur chaque chiffre. 59 → 1000 1100.</li>\n<li><b>ASCII</b> : un caractère sur 7 bits (stocké sur un octet). 'A' = 41h = 65, 'a' = 61h = 97, '0' = 30h = 48. Une chaîne en assembleur se termine par '$'.</li></ul><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 2 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Le biais de l&#39;exposant en IEEE 754 32 bits est…</div><button class=\"opt\" data-o=\"0\">128</button><button class=\"opt\" data-o=\"1\">127</button><button class=\"opt\" data-o=\"2\">255</button><button class=\"opt\" data-o=\"3\">1023</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">En IEEE 754, le « 1 » avant la virgule de la mantisse est…</div><button class=\"opt\" data-o=\"0\">codé dans le premier bit de M</button><button class=\"opt\" data-o=\"1\">implicite, non stocké</button><button class=\"opt\" data-o=\"2\">codé dans le bit de signe</button><button class=\"opt\" data-o=\"3\">toujours 0</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Combien de chiffres hexa pour un nombre IEEE 754 32 bits ?</div><button class=\"opt\" data-o=\"0\">4</button><button class=\"opt\" data-o=\"1\">6</button><button class=\"opt\" data-o=\"2\">8</button><button class=\"opt\" data-o=\"3\">9</button><div class=\"qq-e\" hidden></div></div></section>","ex":[],"qcm":[{"n":"n8","q":"Le biais de l&#39;exposant en IEEE 754 32 bits est…","o":["128","127","255","1023"],"a":1,"e":"2⁸⁻¹ − 1 = 127."},{"n":"n8","q":"En IEEE 754, le « 1 » avant la virgule de la mantisse est…","o":["codé dans le premier bit de M","implicite, non stocké","codé dans le bit de signe","toujours 0"],"a":1,"e":"On stocke seulement les bits après 1, (mantisse normalisée)."},{"n":"n8","q":"Combien de chiffres hexa pour un nombre IEEE 754 32 bits ?","o":["4","6","8","9"],"a":2,"e":"32 bits / 4 = 8 chiffres."}]},{"id":"L6","t":"Algèbre de Boole, portes et logigrammes","seance":"","imp":4,"html":"<p>Une <b>variable logique</b> vaut 0 ou 1. Une <b>fonction logique</b> de n variables a 2ⁿ combinaisons d'entrée, rangées dans une <b>table de vérité</b>. Trois opérateurs de base : NON (A barre), ET (A·B, produit), OU (A+B, somme logique, pas une addition !).</p>\n<p>Ordre d'évaluation : parenthèses → NON → ET → OU.</p>\n<h4>Les portes</h4><div class=\"row\" style=\"gap:14px;justify-content:flex-start\"><figure style=\"margin:0;text-align:center\"><svg viewBox=\"0 0 90 56\" width=\"110\" role=\"img\" aria-label=\"Porte NON\"><line class=\"w\" x1=\"2\" y1=\"28\" x2=\"20\" y2=\"28\"/><path class=\"g\" d=\"M20 10 L48 28 L20 46 Z\"/><circle class=\"g\" cx=\"52\" cy=\"28\" r=\"4\"/><line class=\"w\" x1=\"56\" y1=\"28\" x2=\"88\" y2=\"28\"/></svg><figcaption class=\"small\"><b>NON</b></figcaption></figure><figure style=\"margin:0;text-align:center\"><svg viewBox=\"0 0 90 56\" width=\"110\" role=\"img\" aria-label=\"Porte ET\"><line class=\"w\" x1=\"2\" y1=\"18\" x2=\"20\" y2=\"18\"/><line class=\"w\" x1=\"2\" y1=\"38\" x2=\"20\" y2=\"38\"/><path class=\"g\" d=\"M20 8 H42 A20 20 0 0 1 42 48 H20 Z\"/><line class=\"w\" x1=\"62\" y1=\"28\" x2=\"88\" y2=\"28\"/></svg><figcaption class=\"small\"><b>ET</b></figcaption></figure><figure style=\"margin:0;text-align:center\"><svg viewBox=\"0 0 90 56\" width=\"110\" role=\"img\" aria-label=\"Porte OU\"><line class=\"w\" x1=\"2\" y1=\"18\" x2=\"24\" y2=\"18\"/><line class=\"w\" x1=\"2\" y1=\"38\" x2=\"24\" y2=\"38\"/><path class=\"g\" d=\"M18 8 Q34 8 50 28 Q34 48 18 48 Q28 28 18 8 Z\"/><line class=\"w\" x1=\"50\" y1=\"28\" x2=\"88\" y2=\"28\"/></svg><figcaption class=\"small\"><b>OU</b></figcaption></figure><figure style=\"margin:0;text-align:center\"><svg viewBox=\"0 0 90 56\" width=\"110\" role=\"img\" aria-label=\"Porte NAND\"><line class=\"w\" x1=\"2\" y1=\"18\" x2=\"20\" y2=\"18\"/><line class=\"w\" x1=\"2\" y1=\"38\" x2=\"20\" y2=\"38\"/><path class=\"g\" d=\"M20 8 H42 A20 20 0 0 1 42 48 H20 Z\"/><circle class=\"g\" cx=\"66\" cy=\"28\" r=\"4\"/><line class=\"w\" x1=\"70\" y1=\"28\" x2=\"88\" y2=\"28\"/></svg><figcaption class=\"small\"><b>NAND</b></figcaption></figure><figure style=\"margin:0;text-align:center\"><svg viewBox=\"0 0 90 56\" width=\"110\" role=\"img\" aria-label=\"Porte NOR\"><line class=\"w\" x1=\"2\" y1=\"18\" x2=\"24\" y2=\"18\"/><line class=\"w\" x1=\"2\" y1=\"38\" x2=\"24\" y2=\"38\"/><path class=\"g\" d=\"M18 8 Q34 8 50 28 Q34 48 18 48 Q28 28 18 8 Z\"/><circle class=\"g\" cx=\"54\" cy=\"28\" r=\"4\"/><line class=\"w\" x1=\"58\" y1=\"28\" x2=\"88\" y2=\"28\"/></svg><figcaption class=\"small\"><b>NOR</b></figcaption></figure><figure style=\"margin:0;text-align:center\"><svg viewBox=\"0 0 90 56\" width=\"110\" role=\"img\" aria-label=\"Porte XOR\"><line class=\"w\" x1=\"2\" y1=\"18\" x2=\"27\" y2=\"18\"/><line class=\"w\" x1=\"2\" y1=\"38\" x2=\"27\" y2=\"38\"/><path class=\"w\" d=\"M16 8 Q26 28 16 48\"/><path class=\"g\" d=\"M22 8 Q38 8 54 28 Q38 48 22 48 Q32 28 22 8 Z\"/><line class=\"w\" x1=\"54\" y1=\"28\" x2=\"88\" y2=\"28\"/></svg><figcaption class=\"small\"><b>XOR</b></figcaption></figure></div>\n<div class=\"table-wrap\"><table><tr><th>A B</th><th>A·B</th><th>A+B</th><th>A⊕B</th><th><span class=\"ov\">A·B</span> (NAND)</th><th><span class=\"ov\">A+B</span> (NOR)</th></tr>\n<tr><td class=\"num\">0 0</td><td class=\"num\">0</td><td class=\"num\">0</td><td class=\"num\">0</td><td class=\"num\">1</td><td class=\"num\">1</td></tr>\n<tr><td class=\"num\">0 1</td><td class=\"num\">0</td><td class=\"num\">1</td><td class=\"num\">1</td><td class=\"num\">1</td><td class=\"num\">0</td></tr>\n<tr><td class=\"num\">1 0</td><td class=\"num\">0</td><td class=\"num\">1</td><td class=\"num\">1</td><td class=\"num\">1</td><td class=\"num\">0</td></tr>\n<tr><td class=\"num\">1 1</td><td class=\"num\">1</td><td class=\"num\">1</td><td class=\"num\">0</td><td class=\"num\">0</td><td class=\"num\">0</td></tr></table></div>\n<h4>Les lois à connaître par cœur</h4>\n<div class=\"formula\">NON : double négation  Ā̄ = A      A + Ā = 1      A · Ā = 0\nOU  : A+0 = A (neutre)  A+1 = 1 (absorbant)  A+A = A (idempotence)\nET  : A·1 = A (neutre)  A·0 = 0 (absorbant)  A·A = A (idempotence)\nCommutativité, associativité : A+(B+C) = (A+B)+C   A·(B·C) = (A·B)·C\nDistributivité : A·(B+C) = A·B + A·C     A + B·C = (A+B)·(A+C)   ← la 2e n'existe pas en algèbre classique\nXOR : A⊕B = Ā·B + A·B̄\nDe Morgan : (A+B)‾ = Ā·B̄      (A·B)‾ = Ā + B̄     (valable pour n variables)\nDualité : une égalité reste vraie si on échange ET↔OU et 0↔1 (A+1 = 1 ⇔ A·0 = 0)</div>\n<div class=\"def\"><b>Règles de simplification du cours (diapo 32)</b>A·B + A·B̄ = A &nbsp;·&nbsp; A + A·B = A &nbsp;·&nbsp; A + Ā·B = A + B &nbsp;·&nbsp; (A+B)(A+B̄) = A &nbsp;·&nbsp; A·(A+B) = A &nbsp;·&nbsp; A·(Ā+B) = A·B</div>\n<details class=\"ex\"><summary>Exemple guidé : TD 2 ex. 1</summary><div><div class=\"steps\">1. A·B = (Ā + B̄)‾      A + B = (Ā · B̄)‾          (De Morgan)\n2. A + Ā·B = (A + Ā)(A + B) = 1·(A + B) = A + B   (distributivité du OU sur le ET)\n   A·(Ā + B) = A·Ā + A·B = 0 + A·B = A·B\n3. (Ā + B·C)‾ = A · (B·C)‾ = A · (B̄ + C̄)\n4. Dualité de l'associativité : on part de Ā+(B̄+C̄) = (Ā+B̄)+C̄, on complémente les deux côtés,\n   De Morgan donne A·(B·C) = (A·B)·C. Et inversement.\n5. (A⊕B)‾ = (Ā·B + A·B̄)‾ = (A + B̄)·(Ā + B) = A·B + Ā·B̄   (XNOR)\n6. Si A = 1 : 1·F(1,B,C) + 0·F(0,B,C) = F(1,B,C) ✓ ; si A = 0 : F(0,B,C) ✓\n   (décomposition de Shannon, base du multiplexeur)</div>\n<div class=\"trap\"><b>Pièges du corrigé 2024</b>Q3 : il écrit A·B̄ + C̄, ce qui vaut (A·B̄) + C̄ : il manque les parenthèses, le résultat est faux. Écris A·(B̄ + C̄). Q2 : il écrit « A + Ā·A + B », notation fausse de (A + Ā)(A + B).</div></div></details>\n<h4>NAND et NOR sont « complets »</h4>\n<p>Avec seulement des NAND (ou seulement des NOR), on peut construire NON, ET, OU, donc n'importe quelle fonction.</p>\n<div class=\"formula\">NON : Ā = (A·A)‾                         = NAND(A, A)\nET  : A·B = ((A·B)‾)‾                    = NAND(NAND(A,B), NAND(A,B))\nOU  : A+B = (Ā·B̄)‾                       = NAND(NAND(A,A), NAND(B,B))\nXOR : A⊕B, avec N = NAND(A,B) :  A⊕B = NAND( NAND(A,N), NAND(B,N) )   (4 portes NAND)\nMéthode générale : écrire F en somme de produits, puis F = ((F)‾)‾ et appliquer De Morgan une fois :\n  A·C + B·C̄ = ( (A·C)‾ · (B·C̄)‾ )‾ = NAND( NAND(A,C), NAND(B, C̄) )</div>\n<h4>Logigramme</h4>\n<p>Traduire la fonction en schéma : chaque opérateur devient une porte. Pour lire un logigramme, écris la sortie de chaque porte de gauche à droite. Exemple du cours : F(A,B,C) = A·B + B̄·C (une porte ET, une porte NON, une porte ET, une porte OU).</p>\n<details class=\"ex\"><summary>Exemple guidé : TD 2 ex. 4 (logigramme à deux sorties)</summary><div>\n<p>Les deux inverseurs donnent Ā et B̄. Les deux portes ET du haut donnent A·B̄ et Ā·B, la porte OU donne <b>S = A·B̄ + Ā·B = A ⊕ B</b>. La porte ET du bas donne <b>C = A·B</b>. C'est un <b>demi-additionneur</b> : S est la somme et C la retenue (Carry).</p></div></details><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 7 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">(A·B)‾ = ?</div><button class=\"opt\" data-o=\"0\">Ā·B̄</button><button class=\"opt\" data-o=\"1\">Ā + B̄</button><button class=\"opt\" data-o=\"2\">A + B</button><button class=\"opt\" data-o=\"3\">A·B̄</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">A + A·B = ?</div><button class=\"opt\" data-o=\"0\">A·B</button><button class=\"opt\" data-o=\"1\">A</button><button class=\"opt\" data-o=\"2\">B</button><button class=\"opt\" data-o=\"3\">A + B</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">A·(Ā + B) = ?</div><button class=\"opt\" data-o=\"0\">A</button><button class=\"opt\" data-o=\"1\">A·B</button><button class=\"opt\" data-o=\"2\">B</button><button class=\"opt\" data-o=\"3\">0</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Combien de portes NAND à 2 entrées pour faire un OU ?</div><button class=\"opt\" data-o=\"0\">1</button><button class=\"opt\" data-o=\"1\">2</button><button class=\"opt\" data-o=\"2\">3</button><button class=\"opt\" data-o=\"3\">4</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">La porte qui donne 1 seulement quand les deux entrées diffèrent :</div><button class=\"opt\" data-o=\"0\">NOR</button><button class=\"opt\" data-o=\"1\">XOR</button><button class=\"opt\" data-o=\"2\">NAND</button><button class=\"opt\" data-o=\"3\">ET</button><div class=\"qq-e\" hidden></div></div></section>","ex":[],"qcm":[{"n":"n9","q":"(A·B)‾ = ?","o":["Ā·B̄","Ā + B̄","A + B","A·B̄"],"a":1,"e":"De Morgan."},{"n":"n9","q":"A + A·B = ?","o":["A·B","A","B","A + B"],"a":1,"e":"Absorption : A(1 + B) = A."},{"n":"n9","q":"A·(Ā + B) = ?","o":["A","A·B","B","0"],"a":1,"e":"A·Ā + A·B = A·B."},{"n":"n10","q":"Combien de portes NAND à 2 entrées pour faire un OU ?","o":["1","2","3","4"],"a":2,"e":"NAND(A,A), NAND(B,B), puis NAND des deux."},{"n":"n10","q":"La porte qui donne 1 seulement quand les deux entrées diffèrent :","o":["NOR","XOR","NAND","ET"],"a":1,"e":"Ou exclusif."}]},{"id":"L7","t":"Formes canoniques et simplification algébrique","seance":"","imp":5,"html":"<div class=\"def\"><b>Minterme et maxterme</b><b style=\"display:inline;font:inherit;text-transform:none;letter-spacing:0\">Minterme</b> : produit (ET) qui contient toutes les variables et vaut 1 pour une seule ligne. Ligne A=0 B=1 C=1 → Ā·B·C.<br>\n<b style=\"display:inline;font:inherit;text-transform:none;letter-spacing:0\">Maxterme</b> : somme (OU) qui contient toutes les variables et vaut 0 pour une seule ligne. Ligne A=0 B=0 C=1 → A + B + C̄ (on <b>complémente les variables qui valent 1</b>).</div>\n<p><b>1re forme canonique</b> (disjonctive) = somme des mintermes des lignes où F = 1.<br><b>2e forme canonique</b> (conjonctive) = produit des maxtermes des lignes où F = 0.</p>\n<div class=\"formula\">Ligne   minterme (si F=1)   maxterme (si F=0)\nA B C\n0 0 0   Ā·B̄·C̄               A + B + C\n0 0 1   Ā·B̄·C               A + B + C̄\n0 1 0   Ā·B·C̄               A + B̄ + C\n…       variable à 0 → barrée   variable à 1 → barrée</div>\n<details class=\"ex\"><summary>Exemple guidé : TD 2 ex. 2, G = A + B·C̄</summary><div><div class=\"steps\">A B C | B·C̄ | G\n0 0 0 |  0  | 0   → maxterme A+B+C\n0 0 1 |  0  | 0   → maxterme A+B+C̄\n0 1 0 |  1  | 1   → minterme Ā·B·C̄\n0 1 1 |  0  | 0   → maxterme A+B̄+C̄\n1 0 0 |  0  | 1   → A·B̄·C̄\n1 0 1 |  0  | 1   → A·B̄·C\n1 1 0 |  1  | 1   → A·B·C̄\n1 1 1 |  0  | 1   → A·B·C\n1re forme : G = Ā·B·C̄ + A·B̄·C̄ + A·B̄·C + A·B·C̄ + A·B·C        = Σm(2,4,5,6,7)\n2e forme  : G = (A+B+C)·(A+B+C̄)·(A+B̄+C̄)                      = ΠM(0,1,3)</div>\n<p>Autre méthode (diapo 29) : compléter chaque terme avec (X + X̄) pour faire apparaître les variables manquantes : A + B = A(B+B̄) + B(A+Ā) = AB + AB̄ + ĀB.</p></div></details>\n<h4>Simplification algébrique : 3 techniques du cours</h4>\n<ol><li><b>Regrouper</b> des termes adjacents : A·B·C + A·B·C̄ = A·B.</li>\n<li><b>Rajouter un terme déjà présent</b> (A = A + A) pour faire plusieurs regroupements.</li>\n<li><b>Supprimer un terme inclus</b> dans les autres (consensus) : A·B + B̄·C + A·C = A·B + B̄·C.</li></ol>\n<details class=\"ex\"><summary>Exemple guidé : TD 2 ex. 5, K = A·B̄·C + A·B·C̄ + Ā·B·C̄ + A·B·C</summary><div><div class=\"steps\">A·B̄·C + A·B·C = A·C·(B̄ + B) = A·C\nA·B·C̄ + Ā·B·C̄ = B·C̄·(A + Ā) = B·C̄\nK = A·C + B·C̄\nEn NAND : K = ( (A·C)‾ · (B·C̄)‾ )‾ → 3 NAND à 2 entrées + 1 NAND pour faire C̄ = NAND(C,C)</div>\n<div class=\"trap\"><b>Piège du corrigé 2024</b>Il écrit K = A·C + B·C (barre perdue). Vérifie par la table : K(0,1,1) = 0, or B·C vaudrait 1.</div></div></details>\n<details class=\"ex\"><summary>Exemple guidé : TD 2 ex. 3, simplifier la 2e forme de H</summary><div><div class=\"steps\">H vaut 0 aux lignes 000, 011, 111 :\nH = (A+B+C)·(A+B̄+C̄)·(Ā+B̄+C̄)\n(A+B̄+C̄)·(Ā+B̄+C̄) = B̄+C̄           (règle (X+Y)(X̄+Y) = Y)\nH = (A+B+C)·(B̄+C̄) = A·B̄ + A·C̄ + B·C̄ + B̄·C   … (développement, B·B̄ = C·C̄ = 0)\n  = B⊕C + A·C̄   (A·B̄ est inclus : consensus de B̄·C et A·C̄)\nForme équivalente minimale : B⊕C + A·B̄</div></div></details><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 3 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">La 2e forme canonique est…</div><button class=\"opt\" data-o=\"0\">une somme de mintermes</button><button class=\"opt\" data-o=\"1\">un produit de maxtermes</button><button class=\"opt\" data-o=\"2\">une forme simplifiée</button><button class=\"opt\" data-o=\"3\">une table de Karnaugh</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Minterme de la ligne A=1, B=0, C=0 ?</div><button class=\"opt\" data-o=\"0\">A·B̄·C̄</button><button class=\"opt\" data-o=\"1\">Ā + B + C</button><button class=\"opt\" data-o=\"2\">Ā·B·C</button><button class=\"opt\" data-o=\"3\">A + B̄ + C̄</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">A·B + A·B̄ = ?</div><button class=\"opt\" data-o=\"0\">A</button><button class=\"opt\" data-o=\"1\">B</button><button class=\"opt\" data-o=\"2\">A·B</button><button class=\"opt\" data-o=\"3\">1</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">A·B + B̄·C + A·C = ?</div><button class=\"opt\" data-o=\"0\">A·B + B̄·C</button><button class=\"opt\" data-o=\"1\">A + C</button><button class=\"opt\" data-o=\"2\">A·C</button><button class=\"opt\" data-o=\"3\">B + C</button><div class=\"qq-e\" hidden></div></div></section>","ex":[],"qcm":[{"n":"n11","q":"La 2e forme canonique est…","o":["une somme de mintermes","un produit de maxtermes","une forme simplifiée","une table de Karnaugh"],"a":1,"e":"Forme conjonctive = produit de sommes."},{"n":"n11","q":"Minterme de la ligne A=1, B=0, C=0 ?","o":["A·B̄·C̄","Ā + B + C","Ā·B·C","A + B̄ + C̄"],"a":0,"e":"On barre les variables à 0."},{"n":"n12","q":"A·B + A·B̄ = ?","o":["A","B","A·B","1"],"a":0,"e":"A(B + B̄) = A."},{"n":"n12","q":"A·B + B̄·C + A·C = ?","o":["A·B + B̄·C","A + C","A·C","B + C"],"a":0,"e":"A·C est le consensus de A·B et B̄·C : il est inclus."}]},{"id":"L8","t":"Tableaux de Karnaugh","seance":"","imp":5,"html":"<p>Méthode graphique fondée sur les <b>termes adjacents</b> : deux mintermes qui ne diffèrent que par une variable se simplifient (A·B + A·B̄ = A). Le tableau est rangé en <b>code de Gray</b> (00, 01, <b>11</b>, 10) pour que deux cases voisines soient toujours adjacentes, y compris d'un bord à l'autre.</p>\n<p>Convention du prof : <b>AB en colonnes</b>, <b>C (ou CD) en lignes</b>.</p>\n<div class=\"row\" style=\"gap:24px;align-items:flex-start\"><div><div class=\"label\">3 variables · F = Σm(3,5,6,7)</div><table class=\"kmap\"><tr><th>C \\ AB</th><th>00</th><th>01</th><th>11</th><th>10</th></tr><tr><th>0</th><td class=\"\" title=\"m0\">0</td><td class=\"\" title=\"m2\">0</td><td class=\"one\" title=\"m6\">1</td><td class=\"\" title=\"m4\">0</td></tr><tr><th>1</th><td class=\"\" title=\"m1\">0</td><td class=\"one\" title=\"m3\">1</td><td class=\"one\" title=\"m7\">1</td><td class=\"one\" title=\"m5\">1</td></tr></table></div><div><div class=\"label\">4 variables : 16 cases</div><table class=\"kmap\"><tr><th>CD \\ AB</th><th>00</th><th>01</th><th>11</th><th>10</th></tr><tr><th>00</th><td class=\"one\" title=\"m0\">1</td><td class=\"\" title=\"m4\">0</td><td class=\"\" title=\"m12\">0</td><td class=\"one\" title=\"m8\">1</td></tr><tr><th>01</th><td class=\"\" title=\"m1\">0</td><td class=\"\" title=\"m5\">0</td><td class=\"\" title=\"m13\">0</td><td class=\"\" title=\"m9\">0</td></tr><tr><th>11</th><td class=\"\" title=\"m3\">0</td><td class=\"\" title=\"m7\">0</td><td class=\"\" title=\"m15\">0</td><td class=\"\" title=\"m11\">0</td></tr><tr><th>10</th><td class=\"one\" title=\"m2\">1</td><td class=\"\" title=\"m6\">0</td><td class=\"\" title=\"m14\">0</td><td class=\"one\" title=\"m10\">1</td></tr></table></div></div>\n<div class=\"def\"><b>Méthode (résumé du cours)</b>1. Remplir le tableau depuis la table de vérité ou la forme canonique.<br>\n2. Former des groupements <b>rectangulaires</b> de 16, 8, 4, 2 ou 1 cases contenant des 1, <b>le plus gros possible</b>. Une case peut appartenir à plusieurs groupes. Les bords se rejoignent (le tableau « s'enroule »), les 4 coins forment un groupe.<br>\n3. Groupe de 2 → on élimine 1 variable ; de 4 → 2 ; de 8 → 3 ; de 16 → 4.<br>\n4. Dans chaque groupe, on garde seulement les variables qui ne changent pas d'état.<br>\n5. F = somme des termes. On s'arrête quand tous les 1 sont couverts, avec le moins de groupes possible.</div>\n<details class=\"ex\"><summary>Exemple guidé : le tableau de gauche</summary><div><div class=\"steps\">Groupe {m3, m7} (C=1, colonnes 01 et 11) : B=1, C=1, A change → B·C\nGroupe {m5, m7} (C=1, colonnes 11 et 10) : A=1, C=1        → A·C\nGroupe {m6, m7} (colonne 11, C change)  : A=1, B=1         → A·B\nF = A·B + A·C + B·C   (fonction majorité : retenue de l'additionneur complet)\nLe tableau de droite (4 coins) donne B̄·D̄.</div></div></details>\n<h4>Cas d'une fonction non totalement définie</h4>\n<p>Si certaines combinaisons sont <b>impossibles ou interdites</b>, on met un <b>X</b> (indifférent). On peut compter un X comme 1 s'il agrandit un groupe, ou comme 0 sinon. Interdit : un groupe fait uniquement de X.</p>\n<p>Exemple du cours : serrure à 4 clés, S = 1 si au moins deux clés, A et D jamais ensemble (X sur les lignes où A = D = 1).</p>\n<details class=\"ex\"><summary>Exemple guidé : TD 2 ex. 7</summary><div><div class=\"steps\">F1 = A·B̄·C + A·B·C̄ + A·B·C        = Σm(5,6,7)      → A·B + A·C\nF2 = Ā·B̄·C̄ + A·B̄ + A·B·C          = Σm(0,4,5,7)    → B̄·C̄ + A·C\nF3 = Ā·B̄ + Ā·B·C̄ + B̄·C̄ + A·B̄·C    = Σm(0,1,2,4,5)  → B̄ + Ā·C̄\nF4 = B·C̄·D̄ + Ā·B·D̄ + A·B·C·D̄      = Σm(4,6,12,14)  → B·D̄</div>\n<div class=\"trap\"><b>Pièges du corrigé 2024</b>Le corrigé 2024 se trompe sur F2 (3 termes au lieu de 2), F3 (4 termes au lieu de 2) et F4 (B·D̄·(C+A) au lieu de B·D̄). La cause : des groupes trop petits. Cherche toujours le plus grand rectangle, et pense aux bords.</div></div></details>\n<div class=\"exam\"><b>Ce qui tombe</b>Un Karnaugh à 3 ou 4 variables est présent dans presque toutes les feuilles (TD 2 ex. 7, TP 1 2.4). Dans l'atelier, ta réponse est vérifiée sur toute la table, puis comparée au nombre minimal de littéraux.</div><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 3 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Dans un tableau de Karnaugh à 4 variables, un groupe de 8 cases donne un terme de…</div><button class=\"opt\" data-o=\"0\">1 variable</button><button class=\"opt\" data-o=\"1\">2 variables</button><button class=\"opt\" data-o=\"2\">3 variables</button><button class=\"opt\" data-o=\"3\">4 variables</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Les 4 coins d&#39;un tableau de 4 variables (m0, m2, m8, m10) forment…</div><button class=\"opt\" data-o=\"0\">4 termes séparés</button><button class=\"opt\" data-o=\"1\">B̄·D̄</button><button class=\"opt\" data-o=\"2\">A·C</button><button class=\"opt\" data-o=\"3\">un groupe interdit</button><div class=\"qq-e\" hidden></div></div></section>","ex":[],"qcm":[{"n":"n13","q":"Dans un tableau de Karnaugh à 4 variables, un groupe de 8 cases donne un terme de…","o":["1 variable","2 variables","3 variables","4 variables"],"a":0,"e":"8 = 2³ : on élimine 3 variables sur 4."},{"n":"n13","q":"Les 4 coins d&#39;un tableau de 4 variables (m0, m2, m8, m10) forment…","o":["4 termes séparés","B̄·D̄","A·C","un groupe interdit"],"a":1,"e":"Les bords se rejoignent ; A et C changent, B = 0 et D = 0 restent."}]},{"id":"L9","t":"Circuits combinatoires : additionneur, décodeur, codeur, MUX, DEMUX","seance":"","imp":5,"html":"<div class=\"def\"><b>Combinatoire</b>Les sorties ne dépendent <b>que des entrées présentes</b>. Pas de mémoire, pas de rebouclage d'une sortie vers une entrée.</div>\n<h4>Additionneur complet (1 bit)</h4>\n<div class=\"formula\">Entrées a, b, R (retenue entrante) ; sorties S (somme), R' (retenue sortante)\nS  = a ⊕ b ⊕ R\nR' = a·b + (a ⊕ b)·R\nAdditionneur n bits : chaîner n additionneurs, R' du rang i → R du rang i+1, R₀ = 0.\nDemi-additionneur (sans retenue entrante) : S = a ⊕ b, C = a·b</div>\n<h4>Décodeur n → 2ⁿ</h4>\n<p>n entrées, 2ⁿ sorties, <b>une seule sortie active</b> à la fois : celle dont le numéro est écrit sur les entrées. Avec une entrée de validation V : décodeur 2→4, S₀ = Ā·B̄·V, S₁ = Ā·B·V, S₂ = A·B̄·V, S₃ = A·B·V.</p>\n<h4>Codeur 2ⁿ → n (TP 1)</h4>\n<p>Inverse du décodeur : une seule entrée active, la sortie donne son numéro en binaire. Codeur 4→2 : S₁ = E₂ + E₃, S₀ = E₁ + E₃ (2 portes OU, aucune porte ET ni NON après simplification de Karnaugh avec les combinaisons interdites en X).</p>\n<h4>Multiplexeur 2ⁿ → 1</h4>\n<p>2ⁿ entrées d'information, n entrées de sélection (commandes), <b>une sortie</b> qui recopie l'entrée choisie. MUX 4→1 : S = C̄₁·C̄₀·E₀ + C̄₁·C₀·E₁ + C₁·C̄₀·E₂ + C₁·C₀·E₃.</p>\n<div class=\"def\"><b>Réaliser une fonction de n variables avec un MUX 2ⁿ → 1</b>On branche les variables sur les commandes, et sur chaque entrée Eᵢ on met la valeur de F à la ligne i de la table : 0 (masse) ou 1 (Vcc). Attention à l'ordre des variables sur les commandes (poids fort / poids faible).</div>\n<h4>Démultiplexeur 1 → 2ⁿ</h4>\n<p>Une entrée I, n commandes, 2ⁿ sorties : I est envoyée sur la sortie choisie, les autres restent à 0. DEMUX 1→4 : S₀ = C̄₁·C̄₀·I … S₃ = C₁·C₀·I.</p>\n<div class=\"def\"><b>Réaliser une fonction avec un DEMUX</b>On met I = 1 et les variables sur les commandes. La sortie Sᵢ vaut 1 seulement pour la combinaison i : c'est le minterme i. Donc F = <b>OU des sorties Sᵢ pour lesquelles F = 1</b> (diapo 14 : S = S₀ + S₁ + S₂).</div>\n<details class=\"ex\"><summary>Exemple guidé : TD 3 ex. 3, parité de 3 bits</summary><div><div class=\"steps\">Sortie 1 si le nombre de 1 est IMPAIR (énoncé : 011 → 0, 100 → 1) : F = a ⊕ b ⊕ c\nabc : 000 001 010 011 100 101 110 111\nF   :  0   1   1   0   1   0   0   1\nMUX 8→1 (commandes a b c) : E1 = E2 = E4 = E7 = 1 (Vcc), E0 = E3 = E5 = E6 = 0 (masse)\nDEMUX 1→8 (I = 1) : F = S1 + S2 + S4 + S7 (une porte OU à 4 entrées)</div>\n<div class=\"trap\"><b>Piège du corrigé 2024</b>Sa table de vérité est inversée (il met F = 1 pour 000). Relis l'énoncé : 0 si pair, 1 si impair.</div></div></details>\n<details class=\"ex\"><summary>Exemple guidé : TD 3 ex. 2, complément à 2 sur 3 bits avec 3 MUX 8→1</summary><div><div class=\"steps\">Ca2(n) = (8 − n) mod 8\nabc  : 000 001 010 011 100 101 110 111\nCa2  : 000 111 110 101 100 011 010 001\nS2 (poids fort) : 0 1 1 1 1 0 0 0   → MUX n°1 : E1..E4 = 1, autres 0\nS1              : 0 1 1 0 0 1 1 0   → MUX n°2 : E1 E2 E5 E6 = 1\nS0              : 0 1 0 1 0 1 0 1   → MUX n°3 : E1 E3 E5 E7 = 1 (S0 = c)\nLes 3 MUX ont les mêmes commandes a, b, c.</div></div></details><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 6 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Un décodeur à 3 entrées a…</div><button class=\"opt\" data-o=\"0\">3 sorties</button><button class=\"opt\" data-o=\"1\">6 sorties</button><button class=\"opt\" data-o=\"2\">8 sorties</button><button class=\"opt\" data-o=\"3\">1 sortie</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">La retenue d&#39;un demi-additionneur est…</div><button class=\"opt\" data-o=\"0\">A ⊕ B</button><button class=\"opt\" data-o=\"1\">A·B</button><button class=\"opt\" data-o=\"2\">A + B</button><button class=\"opt\" data-o=\"3\">Ā·B</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Un MUX 16 → 1 a combien d&#39;entrées de commande ?</div><button class=\"opt\" data-o=\"0\">2</button><button class=\"opt\" data-o=\"1\">4</button><button class=\"opt\" data-o=\"2\">8</button><button class=\"opt\" data-o=\"3\">16</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Avec un DEMUX 1→4 et I = 1, F = S0 + S3 réalise…</div><button class=\"opt\" data-o=\"0\">F = 1 pour les combinaisons 0 et 3</button><button class=\"opt\" data-o=\"1\">F = 0 pour 0 et 3</button><button class=\"opt\" data-o=\"2\">un MUX</button><button class=\"opt\" data-o=\"3\">une bascule</button><div class=\"qq-e\" hidden></div></div></section>","ex":[],"qcm":[{"n":"n14","q":"Un décodeur à 3 entrées a…","o":["3 sorties","6 sorties","8 sorties","1 sortie"],"a":2,"e":"2³ = 8."},{"n":"n14","q":"La retenue d&#39;un demi-additionneur est…","o":["A ⊕ B","A·B","A + B","Ā·B"],"a":1,"e":"C = A·B ; S = A ⊕ B."},{"n":"n15","q":"Un MUX 16 → 1 a combien d&#39;entrées de commande ?","o":["2","4","8","16"],"a":1,"e":"2⁴ = 16."},{"n":"n15","q":"Avec un DEMUX 1→4 et I = 1, F = S0 + S3 réalise…","o":["F = 1 pour les combinaisons 0 et 3","F = 0 pour 0 et 3","un MUX","une bascule"],"a":0,"e":"Chaque sortie est un minterme : F = m0 + m3."}]},{"id":"L10","t":"Circuits séquentiels, bascules et registres","seance":"","imp":4,"html":"<div class=\"def\"><b>Séquentiel</b>Les sorties dépendent des entrées <b>et de l'état précédent</b> des sorties (entrées secondaires) : le circuit a une <b>mémoire</b>. On le reconnaît à un <b>rebouclage</b> d'une sortie vers une entrée. Notations : Qn état présent, Qn+1 état suivant.</div>\n<p><b>Asynchrone</b> : les sorties changent dès que les entrées changent. <b>Synchrone</b> : elles changent seulement au signal d'<b>horloge</b> H (CLK), sur un front montant ↑ ou descendant ↓.</p>\n<details class=\"ex\"><summary>Exemple guidé : TD 3 ex. 1</summary><div>\n<p>Le circuit est <b>séquentiel</b> : la sortie S revient en entrée (rebouclage), donc la sortie dépend de son état précédent.</p>\n<div class=\"steps\">Portes : P = E1·E2 ; Q = E1 + E2 ; l'inverseur reçoit Sn\nF    = E1·E2 + (E1 + E2)·S̄n\nSn+1 = E1·E2 + (E1 + E2)·Sn       (= fonction majorité de E1, E2, Sn)</div>\n<p>Vérifie le sens de chaque fil : l'inverseur va vers la porte ET du <b>haut</b>, donc F utilise S̄n. Le corrigé 2024 a perdu la barre.</p></div></details>\n<h4>Bascule RS (asynchrone)</h4>\n<div class=\"formula\">S R | Qn+1\n0 0 | Qn     mémorisation\n0 1 | 0      Reset (mise à 0)\n1 0 | 1      Set (mise à 1)\n1 1 | interdit   (les diapos écrivent 0 dans la case, mais marquent « Interdit »)</div>\n<h4>Bascule RSH (RS synchronisée)</h4>\n<p>Même table, mais prise en compte seulement sur le front d'horloge. Hors front : Qn+1 = Qn.</p>\n<h4>Bascule JK</h4>\n<div class=\"formula\">CLK J K | Q\n X  X X | Qn−1     mémoire (pas de front)\n ↑  0 0 | Qn−1     mémoire\n ↑  0 1 | 0        mise à 0\n ↑  1 0 | 1        mise à 1\n ↑  1 1 | Q̄n−1     basculement (état complémenté)\nÉquation : Qn+1 = J·Q̄n + K̄·Qn</div>\n<div class=\"exam\"><b>Chronogramme</b>Pour tracer Q : repère chaque front actif, lis J et K juste avant ce front, applique la table, et garde Q constant jusqu'au front suivant. Q̄ est toujours l'inverse de Q. L'atelier « Bascules » entraîne exactement ça.</div>\n<h4>Registres</h4>\n<p>Association de n bascules qui mémorise un mot de n bits ; toutes les horloges sont reliées ; entrée « Load » : sur un front, les entrées sont recopiées sur les sorties.</p>\n<ul><li><b>PIPO</b> entrées parallèles / sorties parallèles · <b>PISO</b> parallèle → série · <b>SIPO</b> série → parallèle · <b>SISO</b> série → série.</li>\n<li><b>Registre à décalage</b> (SISO) : à droite, la bascule de rang i recopie la sortie du rang i−1 ; à gauche, celle du rang i+1.</li></ul><h2>Questions de rédaction</h2>\n<section class=\"exo\"><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Différence entre circuit combinatoire et circuit séquentiel ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Combinatoire : les sorties ne dépendent que des entrées présentes. Séquentiel : les sorties dépendent aussi de l&#39;état précédent des sorties ; le circuit a une mémoire, souvent visible par un rebouclage d&#39;une sortie vers une entrée.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 5 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Un circuit dont une sortie revient en entrée est…</div><button class=\"opt\" data-o=\"0\">combinatoire</button><button class=\"opt\" data-o=\"1\">séquentiel</button><button class=\"opt\" data-o=\"2\">un multiplexeur</button><button class=\"opt\" data-o=\"3\">un décodeur</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Bascule JK, J = 1, K = 1 au front, Q valait 0 :</div><button class=\"opt\" data-o=\"0\">Q = 0</button><button class=\"opt\" data-o=\"1\">Q = 1</button><button class=\"opt\" data-o=\"2\">interdit</button><button class=\"opt\" data-o=\"3\">Q reste en mémoire</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Bascule RS : S = 1, R = 1 ?</div><button class=\"opt\" data-o=\"0\">mise à 1</button><button class=\"opt\" data-o=\"1\">mise à 0</button><button class=\"opt\" data-o=\"2\">mémoire</button><button class=\"opt\" data-o=\"3\">état interdit</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Un registre à décalage est de type…</div><button class=\"opt\" data-o=\"0\">PIPO</button><button class=\"opt\" data-o=\"1\">SISO</button><button class=\"opt\" data-o=\"2\">PISO uniquement</button><button class=\"opt\" data-o=\"3\">combinatoire</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"n16","rep":null,"tol":null}],"qcm":[{"n":"n16","q":"Un circuit dont une sortie revient en entrée est…","o":["combinatoire","séquentiel","un multiplexeur","un décodeur"],"a":1,"e":"Rebouclage = mémoire de l&#39;état précédent."},{"n":"n16","q":"Bascule JK, J = 1, K = 1 au front, Q valait 0 :","o":["Q = 0","Q = 1","interdit","Q reste en mémoire"],"a":1,"e":"J = K = 1 : basculement, Q devient Q̄ = 1."},{"n":"n16","q":"Bascule RS : S = 1, R = 1 ?","o":["mise à 1","mise à 0","mémoire","état interdit"],"a":3,"e":"Les deux sorties ne seraient plus complémentaires."},{"n":"n17","q":"Un registre à décalage est de type…","o":["PIPO","SISO","PISO uniquement","combinatoire"],"a":1,"e":"Diapo 18 du CH6."}]},{"id":"L11","t":"Mémoire, bus et segmentation","seance":"","imp":4,"html":"<p>Une bascule mémorise 1 bit, un registre n bits. Pour beaucoup d'informations, on utilise la <b>mémoire</b> : un dispositif qui <b>enregistre, conserve et restitue</b> une information.</p>\n<h4>Caractéristiques</h4>\n<ul><li><b>Volatilité</b> : volatile (RAM, perdue à l'extinction) / non volatile (ROM).</li>\n<li><b>Vitesse et temps d'accès</b>.</li>\n<li><b>Mode de stockage</b> : primaire (RAM, accessible directement par le processeur) / secondaire (disque dur, pas directement).</li></ul>\n<h4>Hiérarchie (du plus rapide et petit au plus lent et grand)</h4>\n<p><b>Registres</b> (dans le processeur) → <b>cache</b> (copie des données les plus utilisées) → <b>mémoire principale</b> (programmes et données) → <b>mémoire tampon</b> (entre mémoire centrale et mémoires de masse) → <b>mémoire de masse</b> (stockage permanent).</p>\n<h4>Stockage</h4>\n<p>La mémoire est un tableau de cases de <b>1 octet</b>, chacune avec une <b>adresse</b>. Une donnée de plus d'un octet occupe des cases consécutives : b = 315 = 00000001 00111011 prend 2 cases. Types : char 1 octet, short/mot 2, int/double mot 4, long/double/quad-mot 8.</p>\n<div class=\"def\"><b>Boutisme (endianness)</b><b style=\"display:inline;font:inherit;text-transform:none;letter-spacing:0\">Little-endian</b> (Intel, donc 8086) : l'octet de <b>poids faible</b> à la plus petite adresse.<br><b style=\"display:inline;font:inherit;text-transform:none;letter-spacing:0\">Big-endian</b> : l'octet de poids fort à la plus petite adresse.<br>Exemple du cours : 248163 = 00 03 C9 63h. En little-endian à partir de x : [x]=63, [x+1]=C9, [x+2]=03, [x+3]=00.</div>\n<h4>Bus</h4>\n<ul><li>Un fil transporte 1 bit. <b>Largeur</b> = nombre de fils.</li>\n<li><b>Bus d'adresses : unidirectionnel</b> (processeur → mémoire). Une adresse passe en une seule fois, donc <b>n fils d'adresse → 2ⁿ cases adressables</b> : la largeur du bus d'adresses fixe la <b>capacité</b> de mémoire utilisable.</li>\n<li><b>Bus de données : bidirectionnel</b> (lecture : mémoire → CPU ; écriture : CPU → mémoire). Sa largeur fixe la <b>vitesse</b> : une donnée de 16 bits passe en 1 transfert sur 16 fils, en 2 transferts sur 8 fils.</li></ul>\n<div class=\"formula\">Débit maximal (taux de transfert) = largeur (bits) × fréquence (Hz)\nExemple du cours : 16 bits × 133 MHz = 2128 × 10⁶ bit/s = 266 × 10⁶ octets/s = 266 Mo/s\n(ici le cours divise seulement par 8 : « Mo » au sens 10⁶ pour un débit)</div>\n<details class=\"ex\"><summary>Exemple guidé : échanges processeur-bus-mémoire (TD 3 ex. 7)</summary><div>\n<p>Pour <code>D = A*B; E = C+D;</code> avec A=2, B=4, C=3 :</p>\n<ol><li><b>Initialisation</b> : pour chaque variable, le CPU envoie son adresse sur le bus d'adresses et sa valeur (2, 4, 3) sur le bus de données : écriture en mémoire.</li>\n<li><b>D = A*B</b> : le CPU place l'adresse de A sur le bus d'adresses, la mémoire renvoie 2 sur le bus de données ; idem pour B (4). L'UAL calcule 8. Le CPU envoie l'adresse de D (bus d'adresses) et 8 (bus de données).</li>\n<li><b>E = C+D</b> : lecture de C (3) puis de D (8) de la même façon, l'UAL calcule 11, écriture de 11 à l'adresse de E.</li></ol>\n<p>Avant chaque instruction, il y a aussi sa <b>recherche</b> : l'adresse contenue dans le CO part sur le bus d'adresses, l'instruction revient sur le bus de données dans le RI, puis elle est décodée. Le mentionner rapporte des points.</p>\n<div class=\"trap\"><b>Piège du corrigé 2024</b>Il écrit « donne l'adresse de D auprès du bus de données ». Une adresse voyage <b>toujours</b> sur le bus d'adresses.</div></div></details>\n<h4>Segmentation du 8086</h4>\n<p>Le 8086 gère 1 Mo = 2²⁰ octets, il faut donc 20 bits d'adresse. Mais ses registres font 16 bits (2¹⁶ = 64 Ko). Solution : la mémoire est découpée en <b>segments de 64 Ko</b> qui commencent à une adresse multiple de 16.</p>\n<div class=\"formula\">Adresse logique  = segment : offset        (deux nombres de 16 bits)\nAdresse physique = 16 × segment + offset   (20 bits = 5 chiffres hexa)\nEn hexa, ×16 = ajouter un 0 à droite :  3500h:AB00h → 35000h + AB00h = 3FB00h\n                                        0022h:FFFFh → 00220h + FFFFh = 1021Fh\n                                        2000h:0350h → 20000h + 0350h = 20350h</div>\n<p>Associations par défaut : CS:IP (code), DS:SI et DS:BX (données), ES:DI (extra), SS:SP et SS:BP (pile). Une même case peut avoir plusieurs adresses logiques.</p><h2>Questions de rédaction</h2>\n<section class=\"exo\"><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Rôles du bus d&#39;adresses et du bus de données ; influence de leur largeur.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Bus d&#39;adresses : unidirectionnel, le processeur y place l&#39;adresse ; sa largeur fixe la capacité adressable (n fils → 2ⁿ cases). Bus de données : bidirectionnel (lecture et écriture) ; sa largeur fixe la vitesse, car un bus plus large demande moins de transferts.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Pourquoi le 8086 utilise-t-il la segmentation ? Comment calcule-t-on l&#39;adresse physique ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Le 8086 adresse 1 Mo, il faut 20 bits ; ses registres font 16 bits (64 Ko). On découpe la mémoire en segments de 64 Ko commençant à un multiple de 16. Adresse logique segment:offset ; adresse physique = 16 × segment + offset (20 bits).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Citer les niveaux de la hiérarchie des mémoires et les caractériser.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Registres (dans le CPU, les plus rapides), cache (rapide, petite, copie des données fréquentes), mémoire principale (programmes et données), mémoire tampon (entre mémoire centrale et mémoire de masse), mémoire de masse (grande capacité, stockage permanent). Plus on descend, plus c&#39;est grand et lent.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 7 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">La RAM est…</div><button class=\"opt\" data-o=\"0\">non volatile</button><button class=\"opt\" data-o=\"1\">volatile</button><button class=\"opt\" data-o=\"2\">une mémoire de masse</button><button class=\"opt\" data-o=\"3\">un registre</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">La mémoire la plus rapide est…</div><button class=\"opt\" data-o=\"0\">le cache</button><button class=\"opt\" data-o=\"1\">la RAM</button><button class=\"opt\" data-o=\"2\">les registres</button><button class=\"opt\" data-o=\"3\">le disque</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">La valeur 1234h stockée en little-endian à l&#39;adresse 100h : [100h] = ?</div><button class=\"opt\" data-o=\"0\">12h</button><button class=\"opt\" data-o=\"1\">34h</button><button class=\"opt\" data-o=\"2\">00h</button><button class=\"opt\" data-o=\"3\">1234h</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Le bus d&#39;adresses est…</div><button class=\"opt\" data-o=\"0\">bidirectionnel</button><button class=\"opt\" data-o=\"1\">unidirectionnel (CPU → mémoire)</button><button class=\"opt\" data-o=\"2\">unidirectionnel (mémoire → CPU)</button><button class=\"opt\" data-o=\"3\">inutile en lecture</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Un bus d&#39;adresses de 20 fils permet d&#39;adresser…</div><button class=\"opt\" data-o=\"0\">20 octets</button><button class=\"opt\" data-o=\"1\">1 Mo</button><button class=\"opt\" data-o=\"2\">64 Ko</button><button class=\"opt\" data-o=\"3\">20 Mo</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">La largeur du bus de données influence surtout…</div><button class=\"opt\" data-o=\"0\">la capacité mémoire</button><button class=\"opt\" data-o=\"1\">la vitesse</button><button class=\"opt\" data-o=\"2\">la volatilité</button><button class=\"opt\" data-o=\"3\">le nombre de registres</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">1000h:0010h donne l&#39;adresse physique…</div><button class=\"opt\" data-o=\"0\">01010h</button><button class=\"opt\" data-o=\"1\">10010h</button><button class=\"opt\" data-o=\"2\">10100h</button><button class=\"opt\" data-o=\"3\">1010h</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Un segment du 8086 fait…</div><button class=\"opt\" data-o=\"0\">16 octets</button><button class=\"opt\" data-o=\"1\">64 Ko</button><button class=\"opt\" data-o=\"2\">1 Mo</button><button class=\"opt\" data-o=\"3\">256 octets</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"n19","rep":null,"tol":null},{"n":"n20","rep":null,"tol":null},{"n":"n18","rep":null,"tol":null}],"qcm":[{"n":"n18","q":"La RAM est…","o":["non volatile","volatile","une mémoire de masse","un registre"],"a":1,"e":"Elle perd son contenu à l&#39;extinction."},{"n":"n18","q":"La mémoire la plus rapide est…","o":["le cache","la RAM","les registres","le disque"],"a":2,"e":"Registres, puis cache, puis mémoire principale."},{"n":"n18","q":"La valeur 1234h stockée en little-endian à l&#39;adresse 100h : [100h] = ?","o":["12h","34h","00h","1234h"],"a":1,"e":"Poids faible à la plus petite adresse."},{"n":"n19","q":"Le bus d&#39;adresses est…","o":["bidirectionnel","unidirectionnel (CPU → mémoire)","unidirectionnel (mémoire → CPU)","inutile en lecture"],"a":1,"e":"Seul le processeur émet des adresses."},{"n":"n19","q":"Un bus d&#39;adresses de 20 fils permet d&#39;adresser…","o":["20 octets","1 Mo","64 Ko","20 Mo"],"a":1,"e":"2²⁰ cases d&#39;un octet = 1 Mo."},{"n":"n19","q":"La largeur du bus de données influence surtout…","o":["la capacité mémoire","la vitesse","la volatilité","le nombre de registres"],"a":1,"e":"Moins de transferts quand le bus est large."},{"n":"n20","q":"1000h:0010h donne l&#39;adresse physique…","o":["01010h","10010h","10100h","1010h"],"a":1,"e":"10000h + 0010h."},{"n":"n20","q":"Un segment du 8086 fait…","o":["16 octets","64 Ko","1 Mo","256 octets"],"a":1,"e":"Offset sur 16 bits."}]},{"id":"L12","t":"Le processeur et le 8086","seance":"","imp":4,"html":"<p>Le processeur (CPU) lit une instruction en mémoire, l'interprète (décode), lit les données, les traite, et écrit le résultat. Il contient 4 éléments :</p>\n<ul><li><b>Unité de contrôle (séquenceur)</b> : décode les instructions, choisit les registres, gère les interruptions, initialise au démarrage.</li>\n<li><b>UAL</b> (unité arithmétique et logique) : fait les calculs et les opérations logiques.</li>\n<li><b>Registres</b> : mémoires internes temporaires.</li>\n<li><b>Bus interne</b> : relie ces éléments.</li></ul>\n<h4>Cycle d'exécution d'une instruction</h4>\n<ol><li><b>Recherche</b> : le CO (compteur ordinal, PC, ou IP sur le 8086) contient l'adresse de l'instruction suivante ; l'unité de commande la place sur le bus d'adresses et émet un ordre de lecture ; l'instruction arrive par le bus de données dans le <b>RI</b> (registre d'instruction).</li>\n<li><b>Décodage</b> : l'unité de contrôle identifie l'opération, analyse les champs (sources, destination) et génère les signaux de commande.</li>\n<li><b>Exécution</b> : l'opération est faite, les <b>drapeaux</b> sont positionnés, puis le CO est mis à jour vers l'instruction suivante.</li></ol>\n<div class=\"def\"><b>Tailles de registres (TD 3 ex. 5 et 6)</b><b style=\"display:inline;font:inherit;text-transform:none;letter-spacing:0\">CO</b> contient une <b>adresse</b> de mot mémoire : taille(CO) = ⌈log₂(nombre de mots)⌉.<br>\n<b style=\"display:inline;font:inherit;text-transform:none;letter-spacing:0\">Code opération</b> : ⌈log₂(nombre d'opérations)⌉ bits.<br>\n<b style=\"display:inline;font:inherit;text-transform:none;letter-spacing:0\">RI</b> contient une instruction = code op + champs d'adresse. Format à 3 adresses (celui du corrigé 2024) : code op | @op1 | @op2 | @résultat → taille min(RI) = code op + 3 × taille d'adresse.<br>\n<b style=\"display:inline;font:inherit;text-transform:none;letter-spacing:0\">Taille réelle</b> : le RI reçoit un mot mémoire entier, donc taille réelle(RI) = taille d'un mot = capacité (bits) / nombre de mots.</div>\n<details class=\"ex\"><summary>Exemple guidé : TD 3 ex. 5 (64 mots, 13 opérations, RAM de 192 octets)</summary><div><div class=\"steps\">1. CO : 64 = 2⁶ → 6 bits\n2. Code op : 13 opérations, 2³ = 8 &lt; 13 ≤ 16 = 2⁴ → 4 bits\n   Adresse : 6 bits ; format à 3 adresses → RI min = 4 + 3 × 6 = 22 bits\n3. Mot = 192 × 8 / 64 = 24 bits → taille réelle de RI = 24 bits (22 ≤ 24 ✓)</div>\n<div class=\"trap\"><b>Piège du corrigé 2024</b>Il calcule taille(CO) = log₂(13) = 4 bits : il confond le CO (une adresse d'instruction) et le code opération. La bonne réponse est <b>6 bits</b>. Pour le RI, le format (1, 2 ou 3 adresses) dépend du cours oral : 22 bits avec 3 adresses ; si le prof utilise un format à 1 adresse, ce serait 4 + 6 = 10 bits. Écris le format que tu supposes.</div></div></details>\n<details class=\"ex\"><summary>Exemple guidé : TD 3 ex. 6 (11 opérations 0000 à 1010, CO = 00011)</summary><div><div class=\"steps\">Code op sur 4 bits (codes 0000 à 1010)\nCO affiché sur 5 bits → adresses de 5 bits\n1. RI (3 adresses) = 4 + 3 × 5 = 19 bits\n2. Nombre maximal de mots = 2⁵ = 32 mots</div></div></details>\n<h4>CISC et RISC</h4>\n<div class=\"table-wrap\"><table><tr><th></th><th>CISC (Intel x86, AMD x86)</th><th>RISC (ARM, PowerPC, MIPS, RISC-V)</th></tr>\n<tr><td>Jeu d'instructions</td><td>Complexe, souvent plus de 200 instructions</td><td>Réduit, moins de 100 (les 20 % d'instructions qui font 80 % du travail)</td></tr>\n<tr><td>Câblage</td><td>Complexe, peut ralentir</td><td>Simple, plus rapide</td></tr>\n<tr><td>Avantage</td><td>Programmation en assembleur plus simple</td><td>Exécution plus rapide</td></tr>\n<tr><td>Inconvénient</td><td>Instructions plus longues à exécuter</td><td>Compilateur plus complexe</td></tr></table></div>\n<h4>Puissance</h4>\n<p>L'horloge produit des « tops » (fréquence en Hz). <b>CPI</b> = nombre moyen de cycles par instruction ; unité de puissance : <b>MIPS</b> (millions d'instructions par seconde). MIPS = fréquence (MHz) / CPI. Pour améliorer : augmenter la fréquence (limite matérielle) ou diminuer le CPI (jeu d'instructions adapté).</p>\n<h4>Mémoire cache</h4>\n<p>Le CPU demande une donnée ; si elle est dans le cache : <b>succès</b> (hit) ; sinon <b>défaut</b> (miss) : le cache la demande à la mémoire principale, la garde et la transmet. Elle exploite la <b>localité spatiale</b> (après l'adresse x, on accède probablement à une adresse proche de x) et la <b>localité temporelle</b> (une zone accédée sera probablement réaccédée bientôt).</p>\n<h4>Le 8086</h4>\n<p>Deux unités qui travaillent en parallèle : la <b>BIU</b> (unité d'interface de bus) cherche les instructions en mémoire et les range dans une file d'attente ; l'<b>EU</b> (unité d'exécution) les exécute.</p>\n<div class=\"table-wrap\"><table><tr><th>Groupe</th><th>Registres (16 bits)</th></tr>\n<tr><td>Généraux</td><td><b>AX</b> accumulateur (AH|AL) · <b>BX</b> base (BH|BL) · <b>CX</b> compteur (CH|CL) · <b>DX</b> données (DH|DL)</td></tr>\n<tr><td>Pointeurs et index</td><td><b>SP</b> pointeur de pile · <b>BP</b> pointeur de base · <b>SI</b> index source · <b>DI</b> index destination</td></tr>\n<tr><td>Segments</td><td><b>CS</b> code · <b>DS</b> données · <b>SS</b> pile · <b>ES</b> extra</td></tr>\n<tr><td>Autres</td><td><b>IP</b> pointeur d'instruction (le CO) · <b>FLAGS</b> registre d'état</td></tr></table></div>\n<div class=\"trap\"><b>Piège du corrigé 2024 (TD 4 ex. 1)</b>Il écrit « SI = indice de pile, DI
