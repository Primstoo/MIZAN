 = indice de données ». C'est <b>SI = Source Index</b>, <b>DI = Destination Index</b>.</div>\n<div class=\"formula\">CF (Carry)    : retenue sortante (addition) ou emprunt (soustraction) en non signé\nZF (Zero)     : 1 si le résultat vaut 0\nSF (Sign)     : copie du bit de poids fort du résultat (1 = négatif)\nPF (Parity)   : 1 si l'octet de poids faible du résultat a un nombre PAIR de 1\nOF (Overflow) : 1 si dépassement en signé (même signe en entrée, signe opposé en sortie)</div><h2>Questions de rédaction</h2>\n<section class=\"exo\"><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Décrire les 3 phases du cycle d&#39;exécution d&#39;une instruction.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Recherche : le CO (IP) donne l&#39;adresse, placée sur le bus d&#39;adresses, l&#39;instruction revient par le bus de données dans le RI. Décodage : l&#39;unité de contrôle identifie l&#39;opération et les opérandes et génère les signaux. Exécution : l&#39;UAL fait l&#39;opération, les drapeaux sont positionnés, le CO passe à l&#39;instruction suivante.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Comparer les architectures CISC et RISC.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>CISC : jeu d&#39;instructions complexe (plus de 200), programmation assembleur plus simple, câblage complexe, exécution plus lente (Intel x86). RISC : jeu réduit (moins de 100) aux instructions les plus utilisées (80/20), câblage simple, exécution plus rapide, compilateur plus complexe (ARM, MIPS).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Expliquer le fonctionnement de la mémoire cache et les principes de localité.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Le cache garde une copie des données les plus utilisées. Si la donnée demandée y est : succès ; sinon défaut de cache : on la lit en mémoire principale, on la garde dans le cache et on la transmet. Localité spatiale : après l&#39;adresse x, on accède probablement à une adresse proche. Localité temporelle : une zone accédée le sera probablement de nouveau bientôt.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 10 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Le CO (compteur ordinal) contient…</div><button class=\"opt\" data-o=\"0\">le code de l&#39;opération</button><button class=\"opt\" data-o=\"1\">l&#39;adresse de la prochaine instruction</button><button class=\"opt\" data-o=\"2\">le résultat de l&#39;UAL</button><button class=\"opt\" data-o=\"3\">la pile</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">L&#39;instruction lue en mémoire est rangée dans…</div><button class=\"opt\" data-o=\"0\">le CO</button><button class=\"opt\" data-o=\"1\">le RI</button><button class=\"opt\" data-o=\"2\">l&#39;accumulateur</button><button class=\"opt\" data-o=\"3\">le cache</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Avec 128 mots mémoire, le CO fait…</div><button class=\"opt\" data-o=\"0\">6 bits</button><button class=\"opt\" data-o=\"1\">7 bits</button><button class=\"opt\" data-o=\"2\">8 bits</button><button class=\"opt\" data-o=\"3\">128 bits</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">RISC signifie…</div><button class=\"opt\" data-o=\"0\">jeu d&#39;instructions complexe</button><button class=\"opt\" data-o=\"1\">jeu d&#39;instructions réduit</button><button class=\"opt\" data-o=\"2\">registre d&#39;instruction spécial</button><button class=\"opt\" data-o=\"3\">mémoire cache</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Après SUB AL, AL, quel drapeau vaut 1 ?</div><button class=\"opt\" data-o=\"0\">CF</button><button class=\"opt\" data-o=\"1\">SF</button><button class=\"opt\" data-o=\"2\">ZF</button><button class=\"opt\" data-o=\"3\">OF</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Le registre « compteur » du 8086 est…</div><button class=\"opt\" data-o=\"0\">AX</button><button class=\"opt\" data-o=\"1\">BX</button><button class=\"opt\" data-o=\"2\">CX</button><button class=\"opt\" data-o=\"3\">DX</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"n21","rep":null,"tol":null},{"n":"n21","rep":null,"tol":null},{"n":"n21","rep":null,"tol":null}],"qcm":[{"n":"n21","q":"Le CO (compteur ordinal) contient…","o":["le code de l&#39;opération","l&#39;adresse de la prochaine instruction","le résultat de l&#39;UAL","la pile"],"a":1,"e":"C&#39;est IP sur le 8086."},{"n":"n21","q":"L&#39;instruction lue en mémoire est rangée dans…","o":["le CO","le RI","l&#39;accumulateur","le cache"],"a":1,"e":"Registre d&#39;instruction."},{"n":"n21","q":"Avec 128 mots mémoire, le CO fait…","o":["6 bits","7 bits","8 bits","128 bits"],"a":1,"e":"2⁷ = 128."},{"n":"n21","q":"RISC signifie…","o":["jeu d&#39;instructions complexe","jeu d&#39;instructions réduit","registre d&#39;instruction spécial","mémoire cache"],"a":1,"e":"Reduced Instruction Set Computer."},{"n":"n22","q":"Après SUB AL, AL, quel drapeau vaut 1 ?","o":["CF","SF","ZF","OF"],"a":2,"e":"Le résultat est 0."},{"n":"n22","q":"Le registre « compteur » du 8086 est…","o":["AX","BX","CX","DX"],"a":2,"e":"Utilisé par LOOP et les décalages (CL)."}]},{"id":"L13","t":"Assembleur 8086 (1) : variables, modes d'adressage, MOV, arithmétique","seance":"","imp":5,"html":"<p>Le <b>langage machine</b> est binaire : une instruction = un <b>opcode</b> (nature de l'opération) suivi des opérandes (ex. AB 00 02). L'<b>assembleur</b> en est la représentation symbolique lisible : MOV, ADD, DIV…</p>\n<h4>Variables, constantes, tableaux, chaînes</h4>\n<div class=\"formula\">var1 DB 56d          ; Define Byte : 1 octet (décimal)\nvar2 DB ?            ; non initialisée\nvar3 DW 1210h        ; Define Word : 2 octets      DD : 4 octets\nB4   DB 0FFh         ; un nombre hexa qui commence par une lettre prend un 0 devant\nB5   DB 1010b        ; binaire\nK    EQU 50h         ; constante : remplacée par sa valeur à l'assemblage\ntab  DB 01h,02h,03h  ; tableau ; tab[1] = 02h\nt2   DB 5 DUP(1,2)   ; répète (1,2) 5 fois → 10 octets\nmsg  DB 'HELLO$'     ; chaîne terminée par $\nMOV AX, SEG var1     ; adresse de segment      MOV BX, OFFSET var1 ; déplacement</div>\n<details class=\"ex\"><summary>Exemple guidé : TP 3 ex. 4</summary><div><div class=\"steps\">B0 DB 1        B1 DB 8      B2 DB 17     B3 DB 32h\nB4 DB 0FFh     B5 DB 1b     B6 DB 1010b\nD0 DW 1  …  D6 DW 7                         ; valeurs au choix\nTabB DB 1, 8, 17, 32h, 0FFh, 1b, 1010b\nTabD DW 1, 2, 3, 4, 5, 6, 7\nT1 DB 152 DUP(101)\nT2 DW 150 DUP(0BAC2h)</div>\n<div class=\"trap\"><b>Pièges du corrigé 2024</b>Il écrit <code>TabB DB B0, B1, …</code> : on ne peut pas initialiser un DB avec des noms de variables (ce serait leurs adresses, et ça ne tient pas sur un octet). Et il met <code>152 DUP(8)</code> et <code>0BAC3h</code> au lieu de 101 et BAC2h.</div></div></details>\n<h4>Modes d'adressage (où se trouve l'opérande ?)</h4>\n<div class=\"table-wrap\"><table><tr><th>Mode</th><th>Exemple</th><th>L'opérande est…</th></tr>\n<tr><td>Immédiat</td><td class=\"num\">MOV AH, 12h</td><td>dans l'instruction (constante)</td></tr>\n<tr><td>Registre</td><td class=\"num\">MOV AX, BX · INC AX</td><td>dans un registre</td></tr>\n<tr><td>Direct</td><td class=\"num\">MOV AX, [243]</td><td>en mémoire, offset écrit dans l'instruction (DS par défaut)</td></tr>\n<tr><td>Indirect (basé)</td><td class=\"num\">MOV AX, [BX] · [BX+3] · [BP−100]</td><td>en mémoire, offset dans BX (DS) ou BP (SS), + déplacement éventuel</td></tr>\n<tr><td>Indirect (indexé)</td><td class=\"num\">MOV AX, [SI+200] · [DI−7]</td><td>offset dans SI ou DI (DS)</td></tr>\n<tr><td>Basé indexé</td><td class=\"num\">MOV AX, [BX+DI+7] · [BP+SI−3]</td><td>base + index + déplacement (segment par défaut du registre de base)</td></tr></table></div>\n<p>Pour une instruction à deux opérandes, on nomme le mode d'après l'opérande <b>source</b> en général ; dans <code>MOV [1100h], AL</code> le mode est direct (la destination est en mémoire). Dis-le dans ta réponse.</p>\n<h4>Transfert</h4>\n<div class=\"formula\">MOV dest, source   ; dest ← source (même taille !)\nAutorisés : reg ← reg, mém ← reg, reg ← mém, reg ← constante, mém ← constante, seg ← reg général\nInterdits  : mém ← mém, seg ← constante, deux tailles différentes (MOV AX, BL)\nXCHG a, b          ; échange (reg/reg, reg/mém)</div>\n<h4>Arithmétique</h4>\n<div class=\"formula\">ADD d, s  ; d ← d + s          SUB d, s ; d ← d − s\nINC d     ; d ← d + 1          DEC d    ; d ← d − 1      (INC/DEC ne touchent pas CF)\nMUL s  (non signé)  8 bits : AX ← AL × s          16 bits : DX:AX ← AX × s\nDIV s  (non signé)  8 bits : AL ← AX ÷ s, AH ← reste\n                   16 bits : AX ← DX:AX ÷ s, DX ← reste\nExemples du cours : AL=200, BL=4, MUL BL → AX = 0320h (800)\n                    AX=203, BL=4, DIV BL → AL = 50 (32h), AH = 3</div>\n<details class=\"ex\"><summary>Exemple guidé : TP 3 ex. 2 (registres au départ à 0)</summary><div><div class=\"steps\">MOV AX, 1008h   ; AX = 1008h\nMOV BH, 05h     ; BX = 0500h (BL = 00)\nSUB AX, BX      ; AX = 1008h − 0500h = 0B08h\nSUB AH, 02h     ; AH = 0Bh − 02h = 09h → AX = 0908h\nMUL BH          ; AX = AL × BH = 08h × 05h = 28h → AX = 0028h</div></div></details>\n<details class=\"ex\"><summary>Exemple guidé : TP 4 ex. 2 (MUL et drapeaux)</summary><div><div class=\"steps\">MOV AL,64h ; MOV BL,2 ; MUL BL   → AX = 100 × 2 = 200 = 00C8h, AH = 0 → CF = OF = 0\nMOV AL,64h ; MOV CL,3 ; MUL CL   → AX = 300 = 012Ch, AH ≠ 0 → CF = OF = 1\nRègle : après MUL, CF = OF = 1 si la moitié haute du résultat (AH ou DX) n'est pas nulle.</div></div></details>\n<details class=\"ex\"><summary>Exemple guidé : TP 4 ex. 3, A = 10110000, B = 10111100 (signés)</summary><div><div class=\"steps\">A = B0h = −80 ; B = BCh = −68\nA + B : B0h + BCh = 16Ch → AL = 6Ch, retenue sortante\n        CF = 1, ZF = 0, SF = 0, OF = 1 (négatif + négatif = positif : dépassement, −148 &lt; −128)\nA − B : B0h − BCh = F4h (−12), il faut emprunter\n        CF = 1, ZF = 0, SF = 1, OF = 0</div></div></details>\n<details class=\"ex\"><summary>Exemple guidé : TD 4 ex. 6 / TP 4 ex. 1, sommes de variables</summary><div><div class=\"steps\">.data\nA DB 5      B DB 7      C DW 300     D DW 450\n.code\nMOV AL, A     ; octets → registre 8 bits\nADD AL, B\nMOV A, AL\nMOV AX, C     ; mots → registre 16 bits\nADD AX, D\nMOV C, AX</div>\n<div class=\"trap\"><b>Piège du corrigé 2024</b>Il écrit <code>MOV AX, A</code> avec A en DB : erreur de taille (16 bits ← 8 bits), l'assembleur refuse.</div></div></details><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 6 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">MOV AL, [BX] utilise l&#39;adressage…</div><button class=\"opt\" data-o=\"0\">immédiat</button><button class=\"opt\" data-o=\"1\">direct</button><button class=\"opt\" data-o=\"2\">indirect (basé)</button><button class=\"opt\" data-o=\"3\">registre</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">MOV AH, 12h utilise l&#39;adressage…</div><button class=\"opt\" data-o=\"0\">immédiat</button><button class=\"opt\" data-o=\"1\">direct</button><button class=\"opt\" data-o=\"2\">indirect</button><button class=\"opt\" data-o=\"3\">indexé</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">tab DB 3 DUP(7) réserve…</div><button class=\"opt\" data-o=\"0\">3 octets valant 7</button><button class=\"opt\" data-o=\"1\">7 octets valant 3</button><button class=\"opt\" data-o=\"2\">1 octet</button><button class=\"opt\" data-o=\"3\">21 octets</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Quelle instruction est invalide ?</div><button class=\"opt\" data-o=\"0\">MOV AX, BX</button><button class=\"opt\" data-o=\"1\">MOV [100h], AL</button><button class=\"opt\" data-o=\"2\">MOV [100h], [200h]</button><button class=\"opt\" data-o=\"3\">MOV AL, 5</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">AL = 20, BL = 3, MUL BL → AX = ?</div><button class=\"opt\" data-o=\"0\">0060</button><button class=\"opt\" data-o=\"1\">003Ch</button><button class=\"opt\" data-o=\"2\">0023h</button><button class=\"opt\" data-o=\"3\">0006h</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">AX = 0011h, BL = 4, DIV BL → ?</div><button class=\"opt\" data-o=\"0\">AL = 4, AH = 1</button><button class=\"opt\" data-o=\"1\">AL = 1, AH = 4</button><button class=\"opt\" data-o=\"2\">AX = 4</button><button class=\"opt\" data-o=\"3\">AL = 3, AH = 2</button><div class=\"qq-e\" hidden></div></div></section>","ex":[],"qcm":[{"n":"n23","q":"MOV AL, [BX] utilise l&#39;adressage…","o":["immédiat","direct","indirect (basé)","registre"],"a":2,"e":"L&#39;offset est dans BX."},{"n":"n23","q":"MOV AH, 12h utilise l&#39;adressage…","o":["immédiat","direct","indirect","indexé"],"a":0,"e":"La valeur est dans l&#39;instruction."},{"n":"n23","q":"tab DB 3 DUP(7) réserve…","o":["3 octets valant 7","7 octets valant 3","1 octet","21 octets"],"a":0,"e":"DUP(nombre de répétitions, valeurs)."},{"n":"n24","q":"Quelle instruction est invalide ?","o":["MOV AX, BX","MOV [100h], AL","MOV [100h], [200h]","MOV AL, 5"],"a":2,"e":"Pas de transfert mémoire → mémoire."},{"n":"n24","q":"AL = 20, BL = 3, MUL BL → AX = ?","o":["0060","003Ch","0023h","0006h"],"a":1,"e":"60 = 3Ch."},{"n":"n24","q":"AX = 0011h, BL = 4, DIV BL → ?","o":["AL = 4, AH = 1","AL = 1, AH = 4","AX = 4","AL = 3, AH = 2"],"a":0,"e":"17 ÷ 4 = 4 reste 1."}]},{"id":"L14","t":"Assembleur 8086 (2) : logique, décalages, sauts, boucles, pile","seance":"","imp":4,"html":"<p class=\"small muted\">Les diapos de cette partie (« jeu d'instructions » suite) n'étaient pas dans ton archive. Ce qui suit est le comportement standard du 8086, celui de emu8086 utilisé en TP.</p>\n<h4>Instructions logiques (bit à bit)</h4>\n<div class=\"formula\">AND d, s ; ET bit à bit (sert à forcer des bits à 0 : masque)     → CF = OF = 0\nOR  d, s ; OU bit à bit (forcer des bits à 1)\nXOR d, s ; OU exclusif (XOR AX, AX met AX à 0)\nNOT d    ; complément à 1           NEG d ; complément à 2 (d ← −d)\nExemple TP 3 ex. 3 : AL = DFh ; AND AL,11011111b → DFh ; INC AL → E0h\n                     AH = CCh ; OR AH,20h → ECh ; DEC AH → EBh</div>\n<h4>Décalages et rotations</h4>\n<div class=\"formula\">SHL d, n ; décalage à gauche, entre des 0 à droite, le bit sorti va dans CF  → × 2ⁿ (non signé)\nSHR d, n ; décalage à droite, entre des 0 à gauche, bit sorti dans CF        → ÷ 2ⁿ (quotient)\nROL d, n ; rotation à gauche : le bit qui sort à gauche rentre à droite (et dans CF)\nROR d, n ; rotation à droite\nSur le 8086, n vaut 1 ou CL :  MOV CL, 3 ; SHR AL, CL\n(emu8086 accepte aussi une constante comme SHL AX, 8)</div>\n<details class=\"ex\"><summary>Exemple guidé : TD 5 ex. 1</summary><div><div class=\"steps\">MOV AX, 0      ; AX = 0000h\nINC AX         ; AX = 0001h\nMOV BX, AX     ; BX = 0001h\nSHL AX, 8      ; AX = 0100h   (× 256)\nADD AH, BL     ; AH = 01h + 01h = 02h → AX = 0200h\nMOV BH, BL     ; BH = 01h → BX = 0101h\nMOV DX, AX     ; DX = 0200h\nSUB AX, BX     ; AX = 0200h − 0101h = 00FFh\nAND DX, BX     ; DX = 0200h AND 0101h = 0000h\nXOR AX, AX     ; AX = 0000h\n2. INC AX ⇔ ADD AX, 1\n3. SHL CX,1 : CX = 1010h → 2020h ; CX = 1336h → 266Ch (× 2, CF = 0 dans les deux cas)\n4. SHL AX,V1 et ROL AX,V2 donnent le même AX si V1 = V2 (mod 16) et si les V1 bits de poids\n   fort de AX valent 0 (ROL les ferait revenir à droite, SHL fait entrer des 0).</div></div></details>\n<h4>Comparaison et sauts</h4>\n<div class=\"formula\">CMP a, b   ; calcule a − b sans rien stocker, positionne les drapeaux\nJMP etiq   ; saut inconditionnel\nJE / JZ    ; saut si égal (ZF=1)          JNE / JNZ ; si différent (ZF=0)\nNon signés : JA (a&gt;b)  JAE  JB (a&lt;b)  JBE\nSignés     : JG (a&gt;b)  JGE  JL (a&lt;b)  JLE      JS : si négatif (SF=1)   JC : si CF=1</div>\n<h4>Boucles</h4>\n<div class=\"formula\">LOOP etiq  ; CX ← CX − 1 ; si CX ≠ 0, saute à etiq   → on met d'abord le nombre de tours dans CX</div>\n<details class=\"ex\"><summary>Exemple guidé : TD 5 ex. 4 / TP 5 ex. 4, somme 0 + 1 + … + 11</summary><div><div class=\"steps\">.data\nR DW ?\nN DW 11\n.code\n; Méthode 1 : MOV, CMP, JNE, ADD, INC\n    MOV AX, 0        ; somme\n    MOV BX, 0        ; compteur i\nboucle1:\n    INC BX           ; i = 1, 2, …, 11\n    ADD AX, BX\n    CMP BX, N\n    JNE boucle1\n    MOV R, AX        ; R = 66\n\n; Méthode 2 : LOOP (CX descend de 11 à 1)\n    MOV AX, 0\n    MOV CX, N\nboucle2:\n    ADD AX, CX       ; 11 + 10 + … + 1\n    LOOP boucle2\n    MOV R, AX        ; R = 66</div>\n<div class=\"trap\"><b>Pièges du corrigé 2024</b>Il n'initialise pas AX (valeur inconnue au départ), n'utilise pas N, et met JA au lieu du JNE demandé. Respecte les instructions imposées par l'énoncé : elles sont notées.</div></div></details>\n<h4>Pile</h4>\n<div class=\"formula\">PUSH s  ; SP ← SP − 2 ; [SS:SP] ← s      (16 bits uniquement)\nPOP d   ; d ← [SS:SP] ; SP ← SP + 2\nLa pile est LIFO : le dernier empilé est le premier dépilé.\nTP 4 ex. 4 : PUSH AX ; PUSH BX ; POP AX ; POP BX → AX et BX sont échangés (AX = 5678h, BX = 1234h)\nÉquivalent de PUSH AX : SUB SP, 2 ; MOV BP, SP ; MOV [BP], AX     ([SP] n'est pas un adressage valide)\nÉquivalent de POP AX  : MOV BP, SP ; MOV AX, [BP] ; ADD SP, 2</div>\n<h4>Traduire if / for / while / switch (TP 5)</h4>\n<div class=\"formula\">; for (CX=0; CX&lt;BX; CX++) BX = BX + CX;      avec BX = 10 au départ\n    MOV BX, 10\n    MOV CX, 0\npour: CMP CX, BX\n    JGE finpour        ; (JAE en non signé)\n    ADD BX, CX\n    INC CX\n    JMP pour\nfinpour:\n; ⚠ BX grandit à chaque tour : la boucle ne s'arrête qu'au dépassement de BX (piège voulu de l'énoncé)\n\n; while (BX &gt; 0) BX = BX − 1;   avec BX = 0 → on n'entre jamais dans la boucle\ntq: CMP BX, 0\n    JLE fintq\n    DEC BX\n    JMP tq\nfintq:\n\n; switch (BX)\n    CMP BX, 1\n    JE cas1\n    CMP BX, 2\n    JE cas2\n    CMP BX, 3\n    JE cas3\n    MOV AX, 0          ; default\n    JMP finsw\ncas1: MOV AX, 1\n    JMP finsw\ncas2: MOV AX, 5\n    JMP finsw\ncas3: MOV AX, 10\nfinsw:</div>\n<details class=\"ex\"><summary>Exemple guidé : TP 5 ex. 2, ranger une somme signée selon son signe</summary><div><div class=\"steps\">    MOV AL, [1100h]\n    ADD AL, [1101h]\n    JZ  nul            ; résultat = 0\n    JS  negatif        ; SF = 1\n    MOV [1103h], AL    ; positif\n    JMP fin\nnegatif: MOV [1102h], AL\n    JMP fin\nnul: MOV [1104h], AL\nfin:</div></div></details>\n<h4>Entrées/sorties avec INT 21h (TP 5 ex. 3)</h4>\n<div class=\"formula\">.data\nm1 DB 'Saisir un caractere: $'\nm2 DB 13,10,'Le caractere saisi est: $'\n.code\n    MOV AX, @data\n    MOV DS, AX\n    MOV AH, 09h        ; afficher la chaîne DS:DX terminée par $\n    LEA DX, m1\n    INT 21h\n    MOV AH, 01h        ; lire un caractère → AL\n    INT 21h\n    MOV BL, AL\n    MOV AH, 09h\n    LEA DX, m2\n    INT 21h\n    MOV AH, 02h        ; afficher le caractère contenu dans DL\n    MOV DL, BL\n    INT 21h\n    MOV AH, 4Ch        ; fin du programme\n    INT 21h</div>\n<details class=\"ex\"><summary>Exemple guidé : TD 5 ex. 2 et 3</summary><div><div class=\"steps\">; Diviser par 8 l'octet en 0140h, résultat en 0141h\nMOV AL, [0140h]\nMOV CL, 3\nSHR AL, CL\nMOV [0141h], AL\n\n; a × 2^p, a en 140h, p en 142h, résultat en 144h\nMOV AX, [140h]\nMOV CL, [142h]\nSHL AX, CL\nMOV [144h], AX\n\n; r = x × y (16 bits), x en 30h, y en 32h : le produit fait 32 bits !\nMOV AX, [30h]\nMUL WORD PTR [32h]   ; DX:AX = x × y\nMOV [34h], AX        ; poids faible\nMOV [36h], DX        ; poids fort\n\n; x ÷ y, x sur 16 bits (30h), y sur 8 bits (32h)\nMOV AX, [30h]\nDIV BYTE PTR [32h]   ; AL = quotient, AH = reste (le quotient doit tenir sur 8 bits)\nMOV [34h], AL\nMOV [35h], AH</div>\n<div class=\"trap\"><b>Piège du corrigé 2024</b>Pour r = x × y il ne range que AX : il perd les 16 bits de poids fort (DX).</div></div></details><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">AL = 0F0h ; SHR AL, 4 → AL = ?</div><button class=\"opt\" data-o=\"0\">0Fh</button><button class=\"opt\" data-o=\"1\">00h</button><button class=\"opt\" data-o=\"2\">F0h</button><button class=\"opt\" data-o=\"3\">FFh</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">AL = 81h ; ROL AL, 1 → AL = ?</div><button class=\"opt\" data-o=\"0\">02h</button><button class=\"opt\" data-o=\"1\">03h</button><button class=\"opt\" data-o=\"2\">80h</button><button class=\"opt\" data-o=\"3\">C0h</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Pour mettre AX à 0 en une instruction logique :</div><button class=\"opt\" data-o=\"0\">AND AX, 1</button><button class=\"opt\" data-o=\"1\">XOR AX, AX</button><button class=\"opt\" data-o=\"2\">OR AX, AX</button><button class=\"opt\" data-o=\"3\">NOT AX</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">LOOP décrémente…</div><button class=\"opt\" data-o=\"0\">AX</button><button class=\"opt\" data-o=\"1\">BX</button><button class=\"opt\" data-o=\"2\">CX</button><button class=\"opt\" data-o=\"3\">SP</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Après PUSH AX, SP a…</div><button class=\"opt\" data-o=\"0\">augmenté de 2</button><button class=\"opt\" data-o=\"1\">diminué de 2</button><button class=\"opt\" data-o=\"2\">diminué de 1</button><button class=\"opt\" data-o=\"3\">pas changé</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Pour afficher une chaîne terminée par $, AH = ?</div><button class=\"opt\" data-o=\"0\">01h</button><button class=\"opt\" data-o=\"1\">02h</button><button class=\"opt\" data-o=\"2\">09h</button><button class=\"opt\" data-o=\"3\">4Ch</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">CMP AX, BX puis JE etiq saute si…</div><button class=\"opt\" data-o=\"0\">AX &gt; BX</button><button class=\"opt\" data-o=\"1\">AX = BX</button><button class=\"opt\" data-o=\"2\">AX &lt; BX</button><button class=\"opt\" data-o=\"3\">toujours</button><div class=\"qq-e\" hidden></div></div></section>","ex":[],"qcm":[{"n":"n25","q":"AL = 0F0h ; SHR AL, 4 → AL = ?","o":["0Fh","00h","F0h","FFh"],"a":0,"e":"Division par 16."},{"n":"n25","q":"AL = 81h ; ROL AL, 1 → AL = ?","o":["02h","03h","80h","C0h"],"a":1,"e":"Le 1 de gauche revient à droite : 0000 0011."},{"n":"n25","q":"Pour mettre AX à 0 en une instruction logique :","o":["AND AX, 1","XOR AX, AX","OR AX, AX","NOT AX"],"a":1,"e":"Un nombre XOR lui-même = 0."},{"n":"n26","q":"LOOP décrémente…","o":["AX","BX","CX","SP"],"a":2,"e":"Puis saute si CX ≠ 0."},{"n":"n26","q":"Après PUSH AX, SP a…","o":["augmenté de 2","diminué de 2","diminué de 1","pas changé"],"a":1,"e":"La pile descend vers les adresses basses."},{"n":"n26","q":"Pour afficher une chaîne terminée par $, AH = ?","o":["01h","02h","09h","4Ch"],"a":2,"e":"INT 21h, fonction 09h, chaîne en DS:DX."},{"n":"n26","q":"CMP AX, BX puis JE etiq saute si…","o":["AX &gt; BX","AX = BX","AX &lt; BX","toujours"],"a":1,"e":"JE : ZF = 1."}]},{"id":"td","t":"TD corrigés (TD 1 à 11)","seance":"Travaux dirigés et pratiques","imp":4,"html":"<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p>Cherche d&#39;abord seul, ouvre l&#39;indice si tu bloques, puis compare avec le corrigé et note-toi honnêtement : ta réponse compte dans la maîtrise de la notion.</p>\n</aside><section class=\"exo\"><h3>TD 1 · Représentation de l&#39;information</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p><strong>1.1.</strong> Combien d&#39;entiers positifs peut-on coder en binaire sur un octet ? Combien de bits pour 65 563 entiers différents ? Mots de 32 bits, 4 Mo de mémoire : combien de mots ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>2ⁿ valeurs sur n bits ; cherche le plus petit n avec 2ⁿ ≥ N ; 4 Mo = 4 × 2²⁰ octets.</p>\n</div><div class=\"ex-c\" hidden><p>256 entiers (0 à 255) · 17 bits (2¹⁶ = 65 536 &lt; 65 563) · 4 × 2²⁰ / 4 = 2²⁰ = 1 048 576 mots.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p><strong>1.2a.</strong> Convertir en binaire : (255)₁₀, (642)₈, (BAC)₁₆.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Octal : 3 bits par chiffre ; hexa : 4 bits.</p>\n</div><div class=\"ex-c\" hidden><p>11111111 · 110 100 010 · 1011 1010 1100</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p><strong>1.2b.</strong> Convertir en binaire : (345,5625)₁₀, (26,3)₁₀, (14C,E8)₁₆.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Partie entière par divisions, partie fractionnaire par multiplications successives par 2.</p>\n</div><div class=\"ex-c\" hidden><p>345,5625 = 101011001,1001 · 26,3 = 11010,0100110011… (infini, période 1001) · 14C,E8 = 1 0100 1100,1110 1</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p><strong>1.2c.</strong> Convertir en base 10 : (10010)₂, (BAFF)₁₆, (123)₈, (1E36)₁₆, (10010101)₂.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Forme polynomiale.</p>\n</div><div class=\"ex-c\" hidden><p>18 · 47 871 · 83 · 7 734 · 149</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p><strong>1.2d.</strong> Existe-t-il une base b telle que (2545)<sub>b</sub> = (4)₁₀ ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Regarde le plus grand chiffre utilisé.</p>\n</div><div class=\"ex-c\" hidden><p>Non. Le chiffre 5 impose b ≥ 6, donc (2545)<sub>b</sub> ≥ 2 × 6³ = 432 &gt; 4. (L&#39;équation 2b³ + 5b² + 4b + 1 = 0 n&#39;a que les racines −1 et −½.)</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p><strong>1.3.</strong> Calculer : 11111111 + 11111111 ; 11010011 − 10010111 ; 11010011 × 1001 ; 10010000111 ÷ 1011.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Vérifie en décimal : 255+255, 211−151, 211×9, 1159÷11.</p>\n</div><div class=\"ex-c\" hidden><p>111111110 (510) · 00111100 (60) · 11101101011 (1899) · quotient 1101001 (105), reste 100 (4).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><p><strong>1.4a.</strong> Coder −13 et −127 en complément à 2.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Code |x| sur 8 bits, inverse, ajoute 1.</p>\n</div><div class=\"ex-c\" hidden><p>−13 = 11110011 · −127 = 10000001 (sur 8 bits).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"7\"><div class=\"ex-q\"><p><strong>1.4b.</strong> Que vaut (10010010)₂ en non signé ? en signé ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Non signé : somme des poids. Signé : précise la convention.</p>\n</div><div class=\"ex-c\" hidden><p>Non signé : 146. Signé Ca2 : −110 (Ca1 : −109 ; S/VA : −18). Écris la convention choisie.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"8\"><div class=\"ex-q\"><p><strong>1.4c.</strong> Calculer en Ca2 : 312 − 123 et 145 − 220.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Choisis d&#39;abord n pour que tout tienne en signé : 10 bits pour 312, 9 bits pour 220.</p>\n</div><div class=\"ex-c\" hidden><p>0100111000 + 1110000101 = (1)0010111101 = 189 · 010010001 + 100100100 = 110110101 → −(001001011) = −75.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"9\"><div class=\"ex-q\"><p><strong>1.5a.</strong> Valeur décimale de (C17B0000)ₕ et (40F00000)ₕ en IEEE 754 32 bits.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Sépare 1 | 8 | 23 bits ; E = Eb − 127.</p>\n</div><div class=\"ex-c\" hidden><p>C17B0000 → S=1, Eb=130, E=3, 1,1111011 × 2³ = −15,6875 · 40F00000 → S=0, Eb=129, E=2, 1,111 × 2² = 7,5.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"10\"><div class=\"ex-q\"><p><strong>1.5b.</strong> Représentation IEEE 754 32 bits de −123,75 ; 6,125 ; 18,54.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Binaire → normaliser → Eb = E + 127 → mantisse sur 23 bits → hexa sur 8 chiffres.</p>\n</div><div class=\"ex-c\" hidden><p>−123,75 = C2F78000 · 6,125 = 40C40000 · 18,54 ≈ 419451EB (tronqué) ou 419451EC (arrondi au plus proche).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><section class=\"exo\"><h3>TD 2 · Algèbre de Boole</h3><div class=\"ex\" data-x=\"11\"><div class=\"ex-q\"><p><strong>2.1a.</strong> Exprimer ET avec OU et NON, puis OU avec ET et NON.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>De Morgan.</p>\n</div><div class=\"ex-c\" hidden><p>A·B = (Ā + B̄)‾ · A + B = (Ā·B̄)‾</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"12\"><div class=\"ex-q\"><p><strong>2.1b.</strong> Montrer que A + Ā·B = A + B et que A·(Ā + B) = A·B.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Distributivité du OU sur le ET pour la première.</p>\n</div><div class=\"ex-c\" hidden><p>A + Ā·B = (A + Ā)(A + B) = A + B · A·(Ā + B) = A·Ā + A·B = A·B.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"13\"><div class=\"ex-q\"><p><strong>2.1c.</strong> Complément de Ā + B·C.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>De Morgan deux fois, garde les parenthèses.</p>\n</div><div class=\"ex-c\" hidden><p>(Ā + B·C)‾ = A·(B·C)‾ = A·(B̄ + C̄) = A·B̄ + A·C̄.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"14\"><div class=\"ex-q\"><p><strong>2.1d.</strong> Montrer que les deux règles d&#39;associativité sont duales.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Complémente les deux membres de Ā + (B̄ + C̄) = (Ā + B̄) + C̄.</p>\n</div><div class=\"ex-c\" hidden><p>(Ā + (B̄ + C̄))‾ = A·(B·C) et ((Ā + B̄) + C̄)‾ = (A·B)·C, donc A·(B·C) = (A·B)·C. Même raisonnement en sens inverse.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"15\"><div class=\"ex-q\"><p><strong>2.1e.</strong> Écrire (A ⊕ B)‾ avec OU, ET, NON seulement.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>A ⊕ B = Ā·B + A·B̄, puis De Morgan.</p>\n</div><div class=\"ex-c\" hidden><p>(A ⊕ B)‾ = (A + B̄)(Ā + B) = A·B + Ā·B̄.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"16\"><div class=\"ex-q\"><p><strong>2.1f.</strong> Démontrer F(A,B,C) = A·F(1,B,C) + Ā·F(0,B,C).</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Deux cas : A = 0 et A = 1.</p>\n</div><div class=\"ex-c\" hidden><p>A = 1 : 1·F(1,B,C) + 0 = F(1,B,C). A = 0 : 0 + 1·F(0,B,C) = F(0,B,C). Vrai dans les deux cas (théorème de Shannon).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"17\"><div class=\"ex-q\"><p><strong>2.2.</strong> G(A,B,C) = A + B·C̄ : table de vérité, 1re et 2e formes canoniques.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>G = 1 si A = 1, ou si B = 1 et C = 0.</p>\n</div><div class=\"ex-c\" hidden><p>G = 1 pour 010, 100, 101, 110, 111. 1re forme : Ā·B·C̄ + A·B̄·C̄ + A·B̄·C + A·B·C̄ + A·B·C. 2e forme : (A+B+C)(A+B+C̄)(A+B̄+C̄).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"18\"><div class=\"ex-q\"><p><strong>2.3.</strong> H vaut 1 pour 001, 010, 100, 101, 110 : formes canoniques puis simplification de la 2e.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>H = 0 pour 000, 011, 111.</p>\n</div><div class=\"ex-c\" hidden><p>1re : Ā·B̄·C + Ā·B·C̄ + A·B̄·C̄ + A·B̄·C + A·B·C̄. 2e : (A+B+C)(A+B̄+C̄)(Ā+B̄+C̄). Simplifiée : (A+B+C)(B̄+C̄) = B⊕C + A·C̄ (ou B⊕C + A·B̄).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"19\"><div class=\"ex-q\"><p><strong>2.4.</strong> Logigramme : deux inverseurs, deux ET, un OU donnent S ; un ET donne C. Expressions de S et C ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Lis chaque porte de gauche à droite.</p>\n</div><div class=\"ex-c\" hidden><p>S = A·B̄ + Ā·B = A ⊕ B ; C = A·B. C&#39;est un demi-additionneur.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"20\"><div class=\"ex-q\"><p><strong>2.5.</strong> K = A·B̄·C + A·B·C̄ + Ā·B·C̄ + A·B·C : simplifier, logigramme, version NAND.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Regroupe A·B̄·C avec A·B·C, et A·B·C̄ avec Ā·B·C̄.</p>\n</div><div class=\"ex-c\" hidden><p>K = A·C + B·C̄ = NAND( NAND(A,C), NAND(B, NAND(C,C)) ).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"21\"><div class=\"ex-q\"><p><strong>2.6.</strong> Avec seulement des NAND : NON, ET, OU, XOR et leurs circuits.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>NAND(A,A) = Ā.</p>\n</div><div class=\"ex-c\" hidden><p>Ā = NAND(A,A) · A·B = NAND(N,N) avec N = NAND(A,B) · A+B = NAND(NAND(A,A),NAND(B,B)) · A⊕B = NAND(NAND(A,N),NAND(B,N)) (4 portes).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"22\"><div class=\"ex-q\"><p><strong>2.7.</strong> Karnaugh : F1 = A·B̄·C + A·B·C̄ + A·B·C ; F2 = Ā·B̄·C̄ + A·B̄ + A·B·C ; F3 = Ā·B̄ + Ā·B·C̄ + B̄·C̄ + A·B̄·C ; F4 = B·C̄·D̄ + Ā·B·D̄ + A·B·C·D̄.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Place les mintermes, cherche les plus grands rectangles.</p>\n</div><div class=\"ex-c\" hidden><p>F1 = A·B + A·C · F2 = B̄·C̄ + A·C · F3 = B̄ + Ā·C̄ · F4 = B·D̄</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><section class=\"exo\"><h3>TD 3 · Circuits, mémoire, processeur</h3><div class=\"ex\" data-x=\"23\"><div class=\"ex-q\"><p><strong>3.1.</strong> Circuit à rebouclage S (voir énoncé) : combinatoire ou séquentiel ? Expressions de F et Sn+1.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Une sortie revient-elle en entrée ? Suis le fil de l&#39;inverseur.</p>\n</div><div class=\"ex-c\" hidden><p>Séquentiel (S est rebouclée). F = E1·E2 + (E1+E2)·S̄n ; Sn+1 = E1·E2 + (E1+E2)·Sn.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"24\"><div class=\"ex-q\"><p><strong>3.2.</strong> Complément à 2 d&#39;un nombre de 3 bits avec 3 MUX 8×1.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Table : n → (8 − n) mod 8, une colonne par MUX.</p>\n</div><div class=\"ex-c\" hidden><p>S2 : E1–E4 = 1 · S1 : E1, E2, E5, E6 = 1 · S0 : E1, E3, E5, E7 = 1 (les autres à 0). Commandes a, b, c communes.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"25\"><div class=\"ex-q\"><p><strong>3.3.</strong> Parité d&#39;un mot abc (0 si nombre de 1 pair) : table, MUX 8×1, DEMUX 1×8.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>F = a ⊕ b ⊕ c.</p>\n</div><div class=\"ex-c\" hidden><p>F = 0 1 1 0 1 0 0 1. MUX : E1, E2, E4, E7 = 1. DEMUX (I = 1) : F = S1 + S2 + S4 + S7.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"26\"><div class=\"ex-q\"><p><strong>3.4.</strong> Architecture de Von Neumann (schéma) ; définir unité centrale, microprocesseur, mémoire principale, bus, registre ; où sont programmes et données ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Leçon 1.</p>\n</div><div class=\"ex-c\" hidden><p>Voir leçon 1 : 4 organes reliés par les bus ; programmes et données dans la même mémoire principale.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"27\"><div class=\"ex-q\"><p><strong>3.5.</strong> RAM de 64 mots, 13 opérations : taille du CO, taille minimale du RI, taille réelle du RI si la RAM fait 192 octets.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Le CO contient une adresse. Le RI contient code op + adresses.</p>\n</div><div class=\"ex-c\" hidden><p>CO = 6 bits · code op = 4 bits, RI min = 4 + 3×6 = 22 bits (format à 3 adresses) · mot = 192×8/64 = 24 bits → RI réel = 24 bits.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"28\"><div class=\"ex-q\"><p><strong>3.6.</strong> 11 opérations codées de 0000 à 1010, CO = 00011 : taille du RI ? Nombre maximal de mots ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Le CO fait 5 bits.</p>\n</div><div class=\"ex-c\" hidden><p>RI = 4 + 3×5 = 19 bits (3 adresses) · 2⁵ = 32 mots.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"29\"><div class=\"ex-q\"><p><strong>3.7.</strong> Interactions processeur-mémoire-bus pour : int A=2, B=4, C=3 ; D=A*B ; E=C+D.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Adresse → bus d&#39;adresses ; valeur → bus de données ; calcul → UAL.</p>\n</div><div class=\"ex-c\" hidden><p>Écriture de 2, 4, 3 (adresse sur le bus d&#39;adresses, valeur sur le bus de données). D : lecture de A et B, calcul 8 par l&#39;UAL, écriture à l&#39;adresse de D. E : lecture de C et D, calcul 11, écriture à l&#39;adresse de E. Chaque instruction est d&#39;abord cherchée (CO → bus d&#39;adresses → RI) et décodée.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><section class=\"exo\"><h3>TD 4 · Mémoire, 8086, assembleur (d&#39;après le rapport 2024)</h3><div class=\"ex\" data-x=\"30\"><div class=\"ex-q\"><p><strong>4.1.</strong> Donner les registres du 8086 et leur rôle.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>4 généraux, 4 pointeurs/index, 4 segments, IP, FLAGS.</p>\n</div><div class=\"ex-c\" hidden><p>AX accumulateur, BX base, CX compteur, DX données · SP pointeur de pile, BP pointeur de base, SI index source, DI index destination · CS, DS, SS, ES · IP pointeur d&#39;instruction · FLAGS.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"31\"><div class=\"ex-q\"><p><strong>4.2.</strong> Adresse physique de 3500h:AB00h, 0022h:FFFFh, 2000h:0350h.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>16 × segment + offset.</p>\n</div><div class=\"ex-c\" hidden><p>3FB00h · 1021Fh · 20350h</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"32\"><div class=\"ex-q\"><p><strong>4.4.</strong> Mode d&#39;adressage : MOV AL,12h ; MOV AX,BX ; MOV BL,[1300h] ; MOV [SI],11h ; MOV AX,[BX+DI+7].</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Où est l&#39;opérande ?</p>\n</div><div class=\"ex-c\" hidden><p>Immédiat · registre · direct · indirect indexé (il faut BYTE PTR : MOV BYTE PTR [SI],11h) · basé indexé avec déplacement.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"33\"><div class=\"ex-q\"><p><strong>4.5.</strong> Variables B0–B6 (octets 1, 8, 17, 32h, FFh, 1b, 1010b), D0–D6 (mots), tableaux TabB, TabD, 152 octets valant 101, 150 mots valant BAC2h.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>DB, DW, DUP.</p>\n</div><div class=\"ex-c\" hidden><p>B0 DB 1 … B6 DB 1010b · TabB DB 1,8,17,32h,0FFh,1b,1010b · T1 DB 152 DUP(101) · T2 DW 150 DUP(0BAC2h)</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"34\"><div class=\"ex-q\"><p><strong>4.6.</strong> A, B octets ; C, D mots : A ← A + B, C ← C + D.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Registre de la même taille que la variable.</p>\n</div><div class=\"ex-c\" hidden><p>MOV AL,A ; ADD AL,B ; MOV A,AL ; MOV AX,C ; ADD AX,D ; MOV C,AX</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><section class=\"exo\"><h3>TD 5 · Assembleur</h3><div class=\"ex\" data-x=\"35\"><div class=\"ex-q\"><p><strong>5.1a.</strong> Tracer : MOV AX,0 / INC AX / MOV BX,AX / SHL AX,8 / ADD AH,BL / MOV BH,BL / MOV DX,AX / SUB AX,BX / AND DX,BX / XOR AX,AX.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Note AX, BX, DX en hexa après chaque ligne.</p>\n</div><div class=\"ex-c\" hidden><p>AX : 0000, 0001, -, 0100, 0200, -, -, 00FF, -, 0000 · BX : 0001 puis 0101 · DX : 0200 puis 0000.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"36\"><div class=\"ex-q\"><p><strong>5.1b.</strong> Remplacer INC AX ; effet de SHL CX,1 pour CX = 1010h et 1336h ; conditions pour que SHL AX,V1 et ROL AX,V2 donnent le même résultat.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>SHL = ×2.</p>\n</div><div class=\"ex-c\" hidden><p>ADD AX,1 · 2020h et 266Ch · V1 = V2 (mod 16) et les V1 bits de poids fort de AX à 0.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"37\"><div class=\"ex-q\"><p><strong>5.2.</strong> Diviser par 8 l&#39;octet en 0140h (résultat en 0141h) ; a × 2^p avec a en 140h, p en 142h, résultat en 144h.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>SHR de 3 ; SHL de CL.</p>\n</div><div class=\"ex-c\" hidden><p>MOV AL,[0140h] ; MOV CL,3 ; SHR AL,CL ; MOV [0141h],AL · MOV AX,[140h] ; MOV CL,[142h] ; SHL AX,CL ; MOV [144h],AX</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"38\"><div class=\"ex-q\"><p><strong>5.3.</strong> r = x × y (16 bits, 30h, 32h, 34h) ; r = x ÷ y (x 16 bits, y 8 bits).</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>MUL 16 bits → DX:AX ; DIV 8 bits → AL, AH.</p>\n</div><div class=\"ex-c\" hidden><p>MOV AX,[30h] ; MUL WORD PTR [32h] ; MOV [34h],AX ; MOV [36h],DX · MOV AX,[30h] ; DIV BYTE PTR [32h] ; MOV [34h],AL ; MOV [35h],AH</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"39\"><div class=\"ex-q\"><p><strong>5.4.</strong> Somme 0 + 1 + … + 11 : méthode 1 (MOV, CMP, JNE, ADD, INC/DEC, variables R et N) ; méthode 2 (LOOP).</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Initialise la somme à 0. LOOP utilise CX.</p>\n</div><div class=\"ex-c\" hidden><p>Voir leçon 14 : R = 66 par les deux méthodes.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><section class=\"exo\"><h3>DM · Opérations dans 4 bases</h3><div class=\"ex\" data-x=\"40\"><div class=\"ex-q\"><p><strong>DM.</strong> Pour chaque base 2, 8, 10, 16 : une addition, une soustraction, une multiplication, une division, avec le détail.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Utilise l&#39;atelier « Opérations dans une base » pour t&#39;entraîner.</p>\n</div><div class=\"ex-c\" hidden><p>Exemples : (1011)₂ + (110)₂ = (10001)₂ · (63)₈ + (35)₈ = (120)₈ · (AB3)₁₆ − (23E)₁₆ = (875)₁₆ · (17)₈ × (3)₈ = (55)₈ · (1100)₂ ÷ (11)₂ = (100)₂. Vérifie chaque calcul en base 10.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><section class=\"exo\"><h3>TP 1 · Codeur 4 vers 2 (Logisim)</h3><div class=\"ex\" data-x=\"41\"><div class=\"ex-q\"><p><strong>P1.1.</strong> Table de vérité du codeur 4→2, équations de S0 et S1, nombre de portes, simplification de Karnaugh.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Une seule entrée active ; les autres combinaisons sont des X.</p>\n</div><div class=\"ex-c\" hidden><p>E0 → 00, E1 → 01, E2 → 10, E3 → 11. Avant simplification : S0 = Ē0·E1·Ē2·Ē3 + Ē0·Ē1·Ē2·E3, S1 = Ē0·Ē1·E2·Ē3 + Ē0·Ē1·Ē2·E3 (4 NON, 4 ET à 4 entrées, 2 OU). Après Karnaugh (X partout ailleurs) : S1 = E2 + E3, S0 = E1 + E3 : 2 portes OU seulement.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><section class=\"exo\"><h3>TP 2 · emu8086, registres et mémoire</h3><div class=\"ex\" data-x=\"42\"><div class=\"ex-q\"><p><strong>P2.1.</strong> MOV AL,11H puis MOV AH,04H : contenu des registres.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>AH et AL forment AX.</p>\n</div><div class=\"ex-c\" hidden><p>AX = 0411h.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"43\"><div class=\"ex-q\"><p><strong>P2.2.</strong> mov ax,07h puis mov [102],ax : que voit-on en mémoire ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Little-endian.</p>\n</div><div class=\"ex-c\" hidden><p>À DS:0102 : 07h ; à DS:0103 : 00h. Adresse physique = 16 × DS + 102h (DS dépend de l&#39;émulateur). 07h = 7 en décimal, caractère ASCII de contrôle BEL (sonnerie).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"44\"><div class=\"ex-q\"><p><strong>P2.3.</strong> Partie 1 : AX=10, BX=AX, CX=20, DX=CX. Partie 2 : MOV AX,1234h / MOV [2000h],AX / MOV BX,[2000h].</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>10 et 20 sont en décimal.</p>\n</div><div class=\"ex-c\" hidden><p>AX = BX = 000Ah, CX = DX = 0014h · BX = 1234h ; en mémoire [2000h] = 34h, [2001h] = 12h.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"45\"><div class=\"ex-q\"><p><strong>P2.4.</strong> Modes : mov ax,bx / mov bl,[1100H] / mov [1100H],al / mov al,11H / mov [1100H],11H.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Registre · direct · direct (destination mémoire) · immédiat · immédiat vers mémoire en direct (il faut BYTE PTR).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><section class=\"exo\"><h3>TP 3 · Instructions de base</h3><div class=\"ex\" data-x=\"46\"><div class=\"ex-q\"><p><strong>P3.1.</strong> Transférer 33h dans AX ; CX dans BX ; additionner BL et AL ; multiplier BL et AL.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>MOV AX,33h · MOV BX,CX · ADD AL,BL · MUL BL (AX = AL × BL)</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"47\"><div class=\"ex-q\"><p><strong>P3.2.</strong> MOV AX,1008h / MOV BH,05h / SUB AX,BX / SUB AH,02h / MUL BH : contenu des registres.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>BL vaut 0 au départ.</p>\n</div><div class=\"ex-c\" hidden><p>AX = 1008h → BX = 0500h → AX = 0B08h → AX = 0908h → AX = 08h × 05h = 0028h.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"48\"><div class=\"ex-q\"><p><strong>P3.3.</strong> MOV AL,0DFh / AND AL,11011111b / INC AL / MOV AH,0CCh / OR AH,20h / DEC AH : AL et AH à chaque étape.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>DFh = 11011111.</p>\n</div><div class=\"ex-c\" hidden><p>AL : DF, DF, E0 · AH : CC, EC, EB.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"49\"><div class=\"ex-q\"><p><strong>P3.4.</strong> Variables B0–B6, D0–D6, TabB, TabD, 152 octets de 101, 150 mots de BAC2h.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Voir TD 4 ex. 5.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><section class=\"exo\"><h3>TP 4 · Drapeaux et pile</h3><div class=\"ex\" data-x=\"50\"><div class=\"ex-q\"><p><strong>P4.2.</strong> AL=64h, BL=2, MUL BL puis AL=64h, CL=3, MUL CL : drapeaux.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>CF = OF = 1 si AH ≠ 0 après MUL.</p>\n</div><div class=\"ex-c\" hidden><p>AX = 00C8h, CF = OF = 0 · AX = 012Ch, CF = OF = 1.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"51\"><div class=\"ex-q\"><p><strong>P4.3.</strong> A = 10110000, B = 10111100 signés : A+B et A−B sur 8 bits, drapeaux SF, CF, ZF, OF.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>A = −80, B = −68.</p>\n</div><div class=\"ex-c\" hidden><p>A+B = 6Ch : CF=1, ZF=0, SF=0, OF=1 · A−B = F4h (−12) : CF=1, ZF=0, SF=1, OF=0.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"52\"><div class=\"ex-q\"><p><strong>P4.4.</strong> MOV AX,1234H / MOV BX,5678H / PUSH AX / PUSH BX / POP AX / POP BX : objectif, évolution de SP, équivalents de PUSH et POP.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>LIFO.</p>\n</div><div class=\"ex-c\" hidden><p>Échange AX et BX (AX = 5678h, BX = 1234h). SP : S, S−2, S−4, S−2, S. PUSH AX ⇔ SUB SP,2 ; MOV BP,SP ; MOV [BP],AX. POP AX ⇔ MOV BP,SP ; MOV AX,[BP] ; ADD SP,2.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><section class=\"exo\"><h3>TP 5 · Boucles et E/S</h3><div class=\"ex\" data-x=\"53\"><div class=\"ex-q\"><p><strong>P5.1.</strong> Traduire for, while et switch (voir énoncé).</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>CMP + saut conditionnel + JMP.</p>\n</div><div class=\"ex-c\" hidden><p>Voir leçon 14. Remarque : dans le for, BX grandit à chaque tour.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"54\"><div class=\"ex-q\"><p><strong>P5.2.</strong> N1 (1100H) + N2 (1101H) signés : ranger en 1103H si positif, 1102H si négatif, 1104H si nul.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>JZ puis JS.</p>\n</div><div class=\"ex-c\" hidden><p>Voir leçon 14 (exemple guidé).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"55\"><div class=\"ex-q\"><p><strong>P5.3.</strong> Afficher « Saisir un caractère: », lire un caractère, afficher « Le caractère saisi est: … ».</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>INT 21h, fonctions 09h, 01h, 02h.</p>\n</div><div class=\"ex-c\" hidden><p>Voir leçon 14 (programme complet).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section>","ex":[{"n":"n2","rep":null,"tol":null},{"n":"n3","rep":null,"tol":null},{"n":"n4","rep":null,"tol":null},{"n":"n3","rep":null,"tol":null},{"n":"n3","rep":null,"tol":null},{"n":"n5","rep":null,"tol":null},{"n":"n6","rep":null,"tol":null},{"n":"n6","rep":null,"tol":null},{"n":"n7","rep":null,"tol":null},{"n":"n8","rep":null,"tol":null},{"n":"n8","rep":null,"tol":null},{"n":"n9","rep":null,"tol":null},{"n":"n9","rep":null,"tol":null},{"n":"n9","rep":null,"tol":null},{"n":"n9","rep":null,"tol":null},{"n":"n9","rep":null,"tol":null},{"n":"n9","rep":null,"tol":null},{"n":"n11","rep":null,"tol":null},{"n":"n12","rep":null,"tol":null},{"n":"n10","rep":null,"tol":null},{"n":"n12","rep":null,"tol":null},{"n":"n10","rep":null,"tol":null},{"n":"n13","rep":null,"tol":null},{"n":"n16","rep":null,"tol":null},{"n":"n15","rep":null,"tol":null},{"n":"n15","rep":null,"tol":null},{"n":"n1","rep":null,"tol":null},{"n":"n21","rep":null,"tol":null},{"n":"n21","rep":null,"tol":null},{"n":"n19","rep":null,"tol":null},{"n":"n22","rep":null,"tol":null},{"n":"n20","rep":null,"tol":null},{"n":"n23","rep":null,"tol":null},{"n":"n23","rep":null,"tol":null},{"n":"n24","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n24","rep":null,"tol":null},{"n": const CARTES=[{"n":"n1","k":0,"ch":"L1","q":"<p>Architecture matérielle vs logicielle ?</p>\n","r":"<p>Matérielle : organisation des dispositifs physiques, fonctionnement logique de chaque composant et leurs interactions.<br>Logicielle : organisation des programmes, codage de l&#39;information, jeu d&#39;instructions.</p>\n"},{"n":"n1","k":1,"ch":"L1","q":"<p>Les 4 actions d&#39;un ordinateur (définition du cours) ?</p>\n","r":"<p>Saisir (entrées), stocker (mémoire), traiter (programmes), restituer (sorties) des informations.</p>\n"},{"n":"n1","k":2,"ch":"L1","q":"<p>Von Neumann vs Harvard ?</p>\n","r":"<p>Von Neumann : une seule mémoire pour instructions et données (PC, usage général).<br>Harvard : deux mémoires séparées (microcontrôleurs, embarqué).</p>\n"},{"n":"n1","k":3,"ch":"L1","q":"<p>Où sont stockés programmes et données chez Von Neumann ?</p>\n","r":"<p>Dans la mémoire principale (une seule mémoire pour les deux).</p>\n"},{"n":"n1","k":4,"ch":"L1","q":"<p>Les niveaux d&#39;une machine multi-niveaux (bas → haut) ?</p>\n","r":"<p>Circuits logiques → microarchitecture (UAL, registres) → jeu d&#39;instructions → système d&#39;exploitation → langage d&#39;assemblage → langage de haut niveau.</p>\n"},{"n":"n1","k":5,"ch":"L1","q":"<p>Informatique : étymologie et définition ?</p>\n","r":"<p>Information + automatique. Science du traitement rationnel et automatique de l&#39;information.</p>\n"},{"n":"n2","k":6,"ch":"L2","q":"<p>Combien de valeurs sur n bits ?</p>\n","r":"<p>2ⁿ valeurs ; en non signé de 0 à 2ⁿ − 1.</p>\n"},{"n":"n2","k":7,"ch":"L2","q":"<p>Combien de bits pour N valeurs ?</p>\n","r":"<p>Le plus petit n avec 2ⁿ ≥ N : n = ⌈log₂ N⌉. Ex. 65 563 → 17 bits.</p>\n"},{"n":"n2","k":8,"ch":"L2","q":"<p>1 Mo en octets (cours) ?</p>\n","r":"<p>1 Mo = 1024 Ko = 2²⁰ = 1 048 576 octets.</p>\n"},{"n":"n3","k":9,"ch":"L2","q":"<p>Méthode décimal → base b ?</p>\n","r":"<p>Divisions successives par b ; on lit les restes de bas en haut (le dernier reste est le poids fort).</p>\n"},{"n":"n3","k":10,"ch":"L2","q":"<p>Binaire ↔ octal / hexa ?</p>\n","r":"<p>Regrouper par 3 (octal) ou 4 (hexa) à partir de la virgule, compléter avec des 0.</p>\n"},{"n":"n4","k":11,"ch":"L2","q":"<p>Partie fractionnaire décimal → binaire ?</p>\n","r":"<p>Multiplications successives par 2, on lit les parties entières de haut en bas. Peut être infini (0,3).</p>\n"},{"n":"n5","k":12,"ch":"L3","q":"<p>1 + 1 + 1 en binaire ?</p>\n","r":"<p>1 retenue 1 (= 11₂).</p>\n"},{"n":"n6","k":13,"ch":"L4","q":"<p>Plage du Ca2 sur n bits ?</p>\n","r":"<p>−2ⁿ⁻¹ à 2ⁿ⁻¹ − 1. Sur 8 bits : −128 à +127.</p>\n"},{"n":"n6","k":14,"ch":"L4","q":"<p>Plage S/VA et Ca1 sur n bits ?</p>\n","r":"<p>−(2ⁿ⁻¹ − 1) à +(2ⁿ⁻¹ − 1), avec deux zéros (+0 et −0).</p>\n"},{"n":"n6","k":15,"ch":"L4","q":"<p>Défauts du S/VA ?</p>\n","r":"<p>Deux représentations du zéro, et il faut deux circuits (addition et soustraction).</p>\n"},{"n":"n6","k":16,"ch":"L4","q":"<p>Méthode rapide du Ca2 ?</p>\n","r":"<p>Depuis la droite, garder les bits jusqu&#39;au premier 1 inclus, inverser les suivants.</p>\n"},{"n":"n7","k":17,"ch":"L4","q":"<p>Dépassement en Ca2 ?</p>\n","r":"<p>Deux opérandes de même signe donnent un résultat de signe opposé. La retenue sortante, elle, est ignorée.</p>\n"},{"n":"n8","k":18,"ch":"L5","q":"<p>Format IEEE 754 32 bits ?</p>\n","r":"<p>1 bit de signe, 8 bits d&#39;exposant biaisé (E + 127), 23 bits de mantisse (après le 1, implicite).<br>N = (−1)^S × 1,M × 2^E</p>\n"},{"n":"n8","k":19,"ch":"L5","q":"<p>Biais en double précision ?</p>\n","r":"<p>1023 (2¹¹⁻¹ − 1) ; format 1 + 11 + 52 bits.</p>\n"},{"n":"n9","k":20,"ch":"L6","q":"<p>Lois de De Morgan ?</p>\n","r":"<p>(A + B)‾ = Ā · B̄<br>(A · B)‾ = Ā + B̄</p>\n"},{"n":"n9","k":21,"ch":"L6","q":"<p>Dualité ?</p>\n","r":"<p>Une égalité reste vraie en échangeant ET ↔ OU et 0 ↔ 1.</p>\n"},{"n":"n9","k":22,"ch":"L6","q":"<p>A + Ā·B = ?</p>\n","r":"<p>A + B</p>\n"},{"n":"n9","k":23,"ch":"L6","q":"<p>A + B·C = ? (distributivité)</p>\n","r":"<p>(A + B)·(A + C)</p>\n"},{"n":"n9","k":24,"ch":"L6","q":"<p>A ⊕ B en ET/OU/NON ?</p>\n","r":"<p>Ā·B + A·B̄</p>\n"},{"n":"n10","k":25,"ch":"L6","q":"<p>NON, ET, OU avec des NAND ?</p>\n","r":"<p>Ā = NAND(A,A)<br>A·B = NAND(NAND(A,B), NAND(A,B))<br>A+B = NAND(NAND(A,A), NAND(B,B))</p>\n"},{"n":"n10","k":26,"ch":"L6","q":"<p>Logigramme : définition ?</p>\n","r":"<p>Traduction d&#39;une fonction logique en schéma électronique : chaque opérateur devient une porte.</p>\n"},{"n":"n11","k":27,"ch":"L7","q":"<p>1re et 2e forme canonique ?</p>\n","r":"<p>1re : somme des mintermes (lignes où F = 1).<br>2e : produit des maxtermes (lignes où F = 0).</p>\n"},{"n":"n11","k":28,"ch":"L7","q":"<p>Maxterme de la ligne A=1 B=0 C=1 ?</p>\n","r":"<p>Ā + B + C̄ (on barre les variables qui valent 1).</p>\n"},{"n":"n12","k":29,"ch":"L7","q":"<p>Les 3 techniques de simplification algébrique ?</p>\n","r":"<p>Regrouper des termes adjacents ; rajouter un terme existant (A = A + A) ; supprimer un terme inclus (consensus).</p>\n"},{"n":"n13","k":30,"ch":"L8","q":"<p>Pourquoi l&#39;ordre 00 01 11 10 ?</p>\n","r":"<p>Code de Gray : deux cases voisines ne diffèrent que d&#39;une variable (termes adjacents), bords compris.</p>\n"},{"n":"n13","k":31,"ch":"L8","q":"<p>Groupe de 4 cases : combien de variables éliminées ?</p>\n","r":"<p>2 (groupe de 2ᵏ cases → k variables éliminées).</p>\n"},{"n":"n13","k":32,"ch":"L8","q":"<p>Que faire des X dans Karnaugh ?</p>\n","r":"<p>Les compter comme 1 s&#39;ils agrandissent un groupe, sinon comme 0. Jamais de groupe fait uniquement de X.</p>\n"},{"n":"n14","k":33,"ch":"L9","q":"<p>Additionneur complet : équations ?</p>\n","r":"<p>S = a ⊕ b ⊕ R<br>R&#39; = a·b + (a ⊕ b)·R</p>\n"},{"n":"n14","k":34,"ch":"L9","q":"<p>Décodeur n → 2ⁿ ?</p>\n","r":"<p>n entrées, 2ⁿ sorties, une seule sortie active : celle dont le numéro est sur les entrées.</p>\n"},{"n":"n14","k":35,"ch":"L9","q":"<p>Codeur 4 → 2 simplifié ?</p>\n","r":"<p>S₁ = E₂ + E₃ ; S₀ = E₁ + E₃.</p>\n"},{"n":"n15","k":36,"ch":"L9","q":"<p>Multiplexeur : entrées et sorties ?</p>\n","r":"<p>2ⁿ entrées d&#39;information, n commandes (adresses), 1 sortie qui recopie l&#39;entrée sélectionnée.</p>\n"},{"n":"n15","k":37,"ch":"L9","q":"<p>Fonction de 3 variables avec un MUX 8→1 ?</p>\n","r":"<p>Variables sur les commandes ; sur Eᵢ, la valeur de F à la ligne i (0 = masse, 1 = Vcc).</p>\n"},{"n":"n15","k":38,"ch":"L9","q":"<p>Fonction avec un DEMUX ?</p>\n","r":"<p>I = 1, variables sur les commandes ; F = OU des sorties Sᵢ où F vaut 1.</p>\n"},{"n":"n16","k":39,"ch":"L10","q":"<p>Combinatoire vs séquentiel ?</p>\n","r":"<p>Combinatoire : sorties = f(entrées présentes).<br>Séquentiel : sorties = f(entrées, état précédent) → mémoire, rebouclage.</p>\n"},{"n":"n16","k":40,"ch":"L10","q":"<p>Synchrone vs asynchrone ?</p>\n","r":"<p>Asynchrone : réagit dès que les entrées changent.<br>Synchrone : réagit seulement au signal d&#39;horloge (front montant ou descendant).</p>\n"},{"n":"n16","k":41,"ch":"L10","q":"<p>Table de la bascule RS ?</p>\n","r":"<p>00 : mémoire ; 01 : Q = 0 ; 10 : Q = 1 ; 11 : interdit.</p>\n"},{"n":"n16","k":42,"ch":"L10","q":"<p>Table de la bascule JK ?</p>\n","r":"<p>00 : mémoire ; 01 : 0 ; 10 : 1 ; 11 : basculement (Q̄).<br>Qn+1 = J·Q̄n + K̄·Qn</p>\n"},{"n":"n17","k":43,"ch":"L10","q":"<p>PIPO, PISO, SIPO, SISO ?</p>\n","r":"<p>Entrées/sorties parallèles ou série. Le registre à décalage est un SISO.</p>\n"},{"n":"n18","k":44,"ch":"L11","q":"<p>Les 3 caractéristiques d&#39;une mémoire (cours) ?</p>\n","r":"<p>Volatilité ; vitesse et temps d&#39;accès ; mode de stockage (primaire / secondaire).</p>\n"},{"n":"n18","k":45,"ch":"L11","q":"<p>Hiérarchie des mémoires ?</p>\n","r":"<p>Registres → cache → mémoire principale → mémoire tampon → mémoire de masse.</p>\n"},{"n":"n18","k":46,"ch":"L11","q":"<p>Little-endian ?</p>\n","r":"<p>L&#39;octet de poids faible à la plus petite adresse (Intel / 8086).</p>\n"},{"n":"n19","k":47,"ch":"L11","q":"<p>Bus d&#39;adresses vs bus de données ?</p>\n","r":"<p>Adresses : unidirectionnel (CPU → mémoire), sa largeur fixe la capacité adressable (2ⁿ cases).<br>Données : bidirectionnel, sa largeur fixe la vitesse (nombre de transferts).</p>\n"},{"n":"n19","k":48,"ch":"L11","q":"<p>Débit d&#39;un bus ?</p>\n","r":"<p>Largeur (bits) × fréquence (Hz). 16 bits × 133 MHz = 266 Mo/s.</p>\n"},{"n":"n20","k":49,"ch":"L11","q":"<p>Pourquoi la segmentation sur le 8086 ?</p>\n","r":"<p>1 Mo de mémoire demande 20 bits d&#39;adresse, mais les registres font 16 bits (64 Ko).</p>\n"},{"n":"n20","k":50,"ch":"L11","q":"<p>Adresse physique ?</p>\n","r":"<p>16 × segment + offset (20 bits, 5 chiffres hexa).</p>\n"},{"n":"n21","k":51,"ch":"L12","q":"<p>Les 4 éléments d&#39;un processeur ?</p>\n","r":"<p>Unité de contrôle (séquenceur), UAL, registres, bus interne.</p>\n"},{"n":"n21","k":52,"ch":"L12","q":"<p>Les 3 phases du cycle d&#39;instruction ?</p>\n","r":"<p>Recherche (CO → bus d&#39;adresses → instruction dans RI), décodage, exécution (drapeaux, mise à jour du CO).</p>\n"},{"n":"n21","k":53,"ch":"L12","q":"<p>Taille du CO ?</p>\n","r":"<p>⌈log₂(nombre de mots mémoire)⌉ : il contient une adresse.</p>\n"},{"n":"n21","k":54,"ch":"L12","q":"<p>CISC vs RISC ?</p>\n","r":"<p>CISC : &gt; 200 instructions complexes, programmation plus simple, exécution plus lente (x86).<br>RISC : &lt; 100 instructions simples, plus rapide, compilateur plus complexe (ARM).</p>\n"},{"n":"n21","k":55,"ch":"L12","q":"<p>Localité spatiale / temporelle ?</p>\n","r":"<p>Spatiale : après x, on accède à une adresse proche de x.<br>Temporelle : une zone accédée le sera encore bientôt.</p>\n"},{"n":"n21","k":56,"ch":"L12","q":"<p>Puissance d&#39;un processeur ?</p>\n","r":"<p>En MIPS. MIPS = fréquence (MHz) / CPI. On l&#39;améliore en augmentant la fréquence ou en baissant le CPI.</p>\n"},{"n":"n22","k":57,"ch":"L12","q":"<p>BIU et EU du 8086 ?</p>\n","r":"<p>BIU : cherche les instructions et les met en file d&#39;attente.<br>EU : les exécute. Les deux fonctionnent en même temps.</p>\n"},{"n":"n22","k":58,"ch":"L12","q":"<p>Registres généraux du 8086 ?</p>\n","r":"<p>AX accumulateur, BX base, CX compteur, DX données (chacun = H + L de 8 bits).</p>\n"},{"n":"n22","k":59,"ch":"L12","q":"<p>SI et DI ?</p>\n","r":"<p>Source Index et Destination Index (registres d&#39;index).</p>\n"},{"n":"n22","k":60,"ch":"L12","q":"<p>CF, ZF, SF, OF, PF ?</p>\n","r":"<p>CF retenue/emprunt ; ZF résultat nul ; SF bit de signe ; OF dépassement signé ; PF nombre pair de 1 dans l&#39;octet bas.</p>\n"},{"n":"n23","k":61,"ch":"L13","q":"<p>DB, DW, DD ?</p>\n","r":"<p>1, 2, 4 octets.</p>\n"},{"n":"n23","k":62,"ch":"L13","q":"<p>Mode de MOV AX, [BX+DI+7] ?</p>\n","r":"<p>Basé indexé avec déplacement (segment DS).</p>\n"},{"n":"n23","k":63,"ch":"L13","q":"<p>Segment par défaut de [BP] ?</p>\n","r":"<p>SS (pile). [BX], [SI], [DI] → DS.</p>\n"},{"n":"n24","k":64,"ch":"L13","q":"<p>MUL BL : où va le résultat ?</p>\n","r":"<p>AX = AL × BL.</p>\n"},{"n":"n24","k":65,"ch":"L13","q":"<p>DIV BL : où vont quotient et reste ?</p>\n","r":"<p>AL = quotient de AX ÷ BL, AH = reste.</p>\n"},{"n":"n24","k":66,"ch":"L13","q":"<p>MOV interdits ?</p>\n","r":"<p>Mémoire ← mémoire, segment ← constante, tailles différentes.</p>\n"},{"n":"n25","k":67,"ch":"L14","q":"<p>SHL vs ROL ?</p>\n","r":"<p>SHL : entre des 0 à droite, le bit sorti va dans CF (× 2).<br>ROL : le bit sorti à gauche rentre à droite.</p>\n"},{"n":"n26","k":68,"ch":"L14","q":"<p>Que fait LOOP ?</p>\n","r":"<p>CX ← CX − 1 ; si CX ≠ 0, saute à l&#39;étiquette.</p>\n"},{"n":"n26","k":69,"ch":"L14","q":"<p>PUSH AX ?</p>\n","r":"<p>SP ← SP − 2 puis [SS:SP] ← AX. POP fait l&#39;inverse. Pile LIFO.</p>\n"},{"n":"n26","k":70,"ch":"L14","q":"<p>INT 21h : AH = 01h, 02h, 09h, 4Ch ?</p>\n","r":"<p>01h lire un caractère (AL) ; 02h afficher DL ; 09h afficher la chaîne DS:DX terminée par $ ; 4Ch quitter.</p>\n"}];

const lireJ = (k) => { try { return JSON.parse(localStorage.getItem(k) || "{}") || {}; } catch (e) { return {}; } };
const ecrireJ = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const etat = () => { const S = lireJ(MODULE.cleEtat); S.attempts = S.attempts || {}; S.cards = S.cards || {}; return S; };
function noter(n, ok) { const S = etat(); (S.attempts[n] = S.attempts[n] || []).push(ok ? 1 : 0); if (S.attempts[n].length > 30) S.attempts[n].shift(); ecrireJ(MODULE.cleEtat, S); }
// Maîtrisé = au moins 3 essais et 80 % de réussite sur les 5 derniers (règle commune à la plateforme).
function statut(n) {
  if (MODULE.format === "pc") { const v = lireJ(MODULE.cle)[n]; return v && v.pc !== undefined ? [v.pc >= 80 ? "ok" : "fragile", v.pc / 100] : ["jamais", null]; } const a = (etat().attempts[n] || []).slice(-5); if (!a.length) return ["jamais", null]; const r = a.reduce((x, y) => x + y, 0) / a.length; return [(etat().attempts[n].length >= 3 && r >= 0.8) ? "ok" : "fragile", r]; }
const NCH = {}; NOTIONS.forEach((n) => (NCH[n.ch] = NCH[n.ch] || []).push(n));
function scoreChap(c) {
  if (MODULE.format === "score10") return lireJ(MODULE.cle)[c.id];
  if (MODULE.format === "pc") { const v = lireJ(MODULE.cle)[c.id]; return v && v.pc !== undefined ? Math.round(v.pc / 10) : undefined; }
  const l = NCH[c.id] || []; if (!l.length || !l.some((n) => statut(n.id)[0] !== "jamais")) return undefined;
  return Math.round((10 * l.filter((n) => statut(n.id)[0] === "ok").length) / l.length);
}
