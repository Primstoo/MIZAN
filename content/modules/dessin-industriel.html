<script>
const MODULE={"slug":"dessin-industriel","titre":"Dessin industriel","cle":"dessin_industriel_scores","cleEtat":"dessin_industriel_scores_etat","format":"score10","intro":"<p>Ce module suit le <strong>chapitre 2 du cours de la Pr I. El Hadouti<\/strong> (ENSA Al Hoceima, 27 octobre 2026) : la projection orthogonale.<\/p>\n<p><strong>Chaque chapitre a trois temps<\/strong><\/p>\n<ol>\n<li><strong>Avant de commencer<\/strong> : ce qu&#39;il faut déjà savoir, avec une question pour vérifier.<\/li>\n<li><strong>Comment l&#39;aborder<\/strong> : l&#39;état d&#39;esprit qui rend le chapitre simple, et le piège dans lequel presque tout le monde tombe.<\/li>\n<li><strong>Les idées, illustrées<\/strong> : un schéma, une phrase, un exemple.<\/li>\n<\/ol>\n<p>Une même pièce en L (60 × 40 × 50 mm) sert d&#39;exemple du début à la fin. Termine chaque chapitre par le QCM : <strong>8/10 = chapitre maîtrisé<\/strong>.<\/p>\n<p>Le dessin industriel s&#39;apprend le crayon à la main : refais chaque schéma sur une feuille, avec une règle et une équerre.<\/p>\n<p><strong>Ce qui est sûr<\/strong> : le contenu vient des diapositives du chapitre 2. Ce que nous avons ajouté est signalé par un encadré « Attention ».<\/p>\n<p><strong>À vérifier<\/strong> : le chapitre 1 du cours et les TD ne nous ont pas été fournis, et le format du contrôle n&#39;est pas connu. Demande-les à ta prof.<\/p>\n","annexes":[],"cartes":null,"maths":false};
const CHAPS=[{"id":"projection-orthogonale","t":"La projection orthogonale et le cube de projection","seance":"Chapitre 2 · parties 1 et 2","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu as besoin de deux idées de géométrie : deux droites <strong>parallèles<\/strong> ne se coupent jamais, et une droite <strong>perpendiculaire<\/strong> à un plan le rencontre à angle droit. Et d&#39;un constat : un objet a trois dimensions, la largeur, la hauteur et la profondeur.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Une boîte mesure 60 mm de large, 50 mm de haut et 40 mm de profondeur. Tu la regardes bien en face, l&#39;œil perpendiculaire à sa face avant. Quelles dimensions vois-tu ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Quelle dimension s&#39;éloigne de toi ?<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Tu vois la <strong>largeur (60)<\/strong> et la <strong>hauteur (50)<\/strong>. La profondeur (40) part droit devant toi : elle n&#39;apparaît pas.\nSi tu as répondu « les trois », retiens ceci dès maintenant : c&#39;est la raison pour laquelle il faut plusieurs vues.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense tampon, pas photo.<\/strong> Une photo déforme : ce qui est loin paraît plus petit. La projection orthogonale ne déforme rien. Imagine que tu pousses la pièce bien droit contre un mur et qu&#39;elle y laisse son empreinte : cette empreinte est une vue.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Croire qu&#39;une seule vue montre toute la pièce. Une vue ne montre que <strong>deux dimensions sur trois<\/strong>. Deux pièces différentes peuvent avoir exactement la même vue de face.<\/p>\n<\/aside><p>À la fin, tu sais définir la projection orthogonale, citer ses cinq éléments, nommer les six vues et expliquer à quoi sert le cube de projection.<\/p>\n<h2>Idée 1 · Projeter, c&#39;est tirer des lignes droites vers un plan<\/h2>\n<svg viewBox=\"0 0 360 150\" style=\"width:100%;max-width:440px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Un observateur regarde un objet. Des lignes de projection parallèles, perpendiculaires au plan, reportent l'objet sur le plan placé derrière lui : c'est la vue.\">\n<g font-family=\"sans-serif\" font-size=\"11\" fill=\"currentColor\" stroke-linejoin=\"round\" stroke-linecap=\"round\">\n<circle cx=\"40\" cy=\"74\" r=\"9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><circle cx=\"43\" cy=\"74\" r=\"3\" fill=\"currentColor\" stroke=\"none\"/><text x=\"40\" y=\"104\" text-anchor=\"middle\" stroke=\"none\">observateur<\/text><polygon points=\"120,99.0 186.0,99.0 186.0,77.0 142.0,77.0 142.0,44 120,44\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" /><text x=\"153\" y=\"118\" text-anchor=\"middle\" stroke=\"none\">objet<\/text><line x1=\"300\" y1=\"14\" x2=\"300\" y2=\"128\" stroke=\"currentColor\" stroke-width=\"3\"/><text x=\"300\" y=\"144\" text-anchor=\"middle\" stroke=\"none\">plan de projection<\/text><line x1=\"125\" y1=\"44\" x2=\"292\" y2=\"44\" stroke=\"#D9824F\" stroke-width=\"1.4\" stroke-dasharray=\"4 4\"/><line x1=\"190\" y1=\"77\" x2=\"292\" y2=\"77\" stroke=\"#D9824F\" stroke-width=\"1.4\" stroke-dasharray=\"4 4\"/><line x1=\"190\" y1=\"99\" x2=\"292\" y2=\"99\" stroke=\"#D9824F\" stroke-width=\"1.4\" stroke-dasharray=\"4 4\"/><line x1=\"56\" y1=\"74\" x2=\"108\" y2=\"74\" stroke=\"#D9824F\" stroke-width=\"2\"/><polygon points=\"108,74 101.7,77.0 101.7,71.0\" fill=\"#D9824F\" stroke=\"#D9824F\" stroke-width=\"1\"/><line x1=\"300\" y1=\"44\" x2=\"300\" y2=\"99\" stroke=\"#D9824F\" stroke-width=\"6\"/><text x=\"312\" y=\"74\" text-anchor=\"start\" stroke=\"none\" fill=\"#D9824F\" font-weight=\"700\">vue<\/text><text x=\"232\" y=\"36\" text-anchor=\"middle\" stroke=\"none\" fill=\"#D9824F\" font-size=\"10\">lignes de projection<\/text>\n<\/g>\n<\/svg><p>La projection orthogonale représente un objet à <strong>trois dimensions<\/strong> sur un <strong>plan<\/strong>. Chaque point de l&#39;objet est reporté sur le plan par une ligne de projection. Ces lignes sont :<\/p>\n<ul>\n<li><strong>parallèles entre elles<\/strong> ;<\/li>\n<li><strong>perpendiculaires au plan<\/strong> de projection.<\/li>\n<\/ul>\n<p>Conséquence : les vues obtenues sont <strong>précises et normalisées<\/strong>. Elles décrivent la forme et les dimensions de l&#39;objet.<\/p>\n<p>Le cours retient cinq éléments :<\/p>\n<table>\n<thead>\n<tr>\n<th>Élément<\/th>\n<th>Rôle<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>L&#39;objet<\/td>\n<td>ce qu&#39;on veut représenter<\/td>\n<\/tr>\n<tr>\n<td>Le plan de projection<\/td>\n<td>la surface qui reçoit le dessin<\/td>\n<\/tr>\n<tr>\n<td>La direction d&#39;observation<\/td>\n<td>d&#39;où on regarde<\/td>\n<\/tr>\n<tr>\n<td>Les lignes de projection<\/td>\n<td>perpendiculaires au plan<\/td>\n<\/tr>\n<tr>\n<td>La vue<\/td>\n<td>la projection obtenue<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h2>Idée 2 · L&#39;observateur, l&#39;objet, puis le plan<\/h2>\n<figure class=\"flux\"><figcaption>Dans cet ordre, toujours<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">Observateur<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Objet<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Plan de projection<\/div><\/div><\/figure><p>Le principe tient en trois phrases :<\/p>\n<ol>\n<li>L&#39;observateur se place <strong>perpendiculairement<\/strong> à une face de l&#39;objet.<\/li>\n<li>Cette face est projetée sur un plan <strong>parallèle<\/strong> à elle, situé <strong>derrière l&#39;objet<\/strong>.<\/li>\n<li>Le dessin obtenu sur le plan est une projection orthogonale de l&#39;objet.<\/li>\n<\/ol>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Le plan est <strong>derrière<\/strong> l&#39;objet. Ce détail explique tout le chapitre suivant : si tu regardes depuis la droite, le dessin se forme de l&#39;autre côté, à gauche.<\/p>\n<\/aside><h2>Idée 3 · Six directions, six vues<\/h2>\n<svg viewBox=\"0 0 340 215\" style=\"width:100%;max-width:440px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Pièce en L vue en perspective, avec six flèches : face, dessus, dessous, droite, gauche et arrière.\">\n<g font-family=\"sans-serif\" font-size=\"11\" fill=\"currentColor\" stroke-linejoin=\"round\" stroke-linecap=\"round\">\n<polygon points=\"112.0,128.0 177.0,165.5 177.0,140.5 133.7,115.5 133.7,78.0 112.0,65.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" /><polygon points=\"177.0,165.5 220.3,140.5 220.3,115.5 177.0,140.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" /><polygon points=\"133.7,115.5 177.0,90.5 177.0,53.0 133.7,78.0\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" /><polygon points=\"112.0,65.5 133.7,78.0 177.0,53.0 155.3,40.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" /><polygon points=\"133.7,115.5 177.0,140.5 220.3,115.5 177.0,90.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" /><line x1=\"99.4\" y1=\"160.2\" x2=\"139.3\" y2=\"137.2\" stroke=\"#D9824F\" stroke-width=\"2\"/><polygon points=\"139.3,137.2 135.3,143.0 132.3,137.8\" fill=\"#D9824F\" stroke=\"#D9824F\" stroke-width=\"1\"/><text x=\"95.4\" y=\"172.2\" text-anchor=\"end\" stroke=\"none\" font-weight=\"700\">face<\/text><line x1=\"243.6\" y1=\"166.5\" x2=\"203.8\" y2=\"143.5\" stroke=\"#D9824F\" stroke-width=\"2\"/><polygon points=\"203.8,143.5 210.8,144.0 207.7,149.3\" fill=\"#D9824F\" stroke=\"#D9824F\" stroke-width=\"1\"/><text x=\"247.6\" y=\"178.5\" text-anchor=\"start\" stroke=\"none\" font-weight=\"700\">droite<\/text><line x1=\"144.5\" y1=\"19.2\" x2=\"144.5\" y2=\"53.2\" stroke=\"#D9824F\" stroke-width=\"2\"/><polygon points=\"144.5,53.2 141.4,46.9 147.5,46.9\" fill=\"#D9824F\" stroke=\"#D9824F\" stroke-width=\"1\"/><text x=\"144.5\" y=\"14.2\" text-anchor=\"middle\" stroke=\"none\" font-weight=\"700\">dessus<\/text><line x1=\"93.8\" y1=\"61.2\" x2=\"128.5\" y2=\"81.2\" stroke=\"#D9824F\" stroke-width=\"2\"/><polygon points=\"128.5,81.2 121.5,80.7 124.5,75.5\" fill=\"#D9824F\" stroke=\"#D9824F\" stroke-width=\"1\"/><text x=\"89.8\" y=\"59.2\" text-anchor=\"end\" stroke=\"none\" font-weight=\"700\">gauche<\/text><line x1=\"243.9\" y1=\"73.8\" x2=\"209.2\" y2=\"93.8\" stroke=\"#D9824F\" stroke-width=\"2\"/><polygon points=\"209.2,93.8 213.1,88.0 216.2,93.2\" fill=\"#D9824F\" stroke=\"#D9824F\" stroke-width=\"1\"/><text x=\"247.9\" y=\"71.8\" text-anchor=\"start\" stroke=\"none\" font-weight=\"700\">arrière<\/text><line x1=\"166.1\" y1=\"170.2\" x2=\"166.1\" y2=\"140.2\" stroke=\"#D9824F\" stroke-width=\"2\"/><polygon points=\"166.1,140.2 169.2,146.6 163.1,146.6\" fill=\"#D9824F\" stroke=\"#D9824F\" stroke-width=\"1\"/><text x=\"166.1\" y=\"182.2\" text-anchor=\"middle\" stroke=\"none\" font-weight=\"700\">dessous<\/text>\n<\/g>\n<\/svg><p>On peut regarder un objet de six côtés, comme les six faces d&#39;un cube. La <strong>vue de face<\/strong> est en général choisie comme <strong>vue principale<\/strong>. Les cinq autres se définissent par rapport à elle.<\/p>\n<table>\n<thead>\n<tr>\n<th>Je regarde…<\/th>\n<th>J&#39;obtiens…<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>de face<\/td>\n<td>la vue de face<\/td>\n<\/tr>\n<tr>\n<td>d&#39;en haut<\/td>\n<td>la vue de dessus<\/td>\n<\/tr>\n<tr>\n<td>d&#39;en bas<\/td>\n<td>la vue de dessous<\/td>\n<\/tr>\n<tr>\n<td>depuis la droite<\/td>\n<td>la vue de droite<\/td>\n<\/tr>\n<tr>\n<td>depuis la gauche<\/td>\n<td>la vue de gauche<\/td>\n<\/tr>\n<tr>\n<td>de derrière<\/td>\n<td>la vue arrière<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p><strong>Exemple.<\/strong> La pièce du schéma est une pièce en L : 60 mm de large, 40 mm de profondeur, 50 mm de haut. On la garde pendant tout le module.<\/p>\n<h2>Idée 4 · Le cube de projection<\/h2>\n<p>On enferme la pièce dans un cube imaginaire. Chaque face du cube est un <strong>plan de projection<\/strong> : la pièce est projetée sur chacune.<\/p>\n<p>Trois plans servent le plus souvent :<\/p>\n<table>\n<thead>\n<tr>\n<th>Plan<\/th>\n<th>L&#39;observateur regarde…<\/th>\n<th>Vue obtenue<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Plan frontal<\/td>\n<td>de face<\/td>\n<td>vue de face<\/td>\n<\/tr>\n<tr>\n<td>Plan horizontal<\/td>\n<td>d&#39;en haut<\/td>\n<td>vue de dessus<\/td>\n<\/tr>\n<tr>\n<td>Plan latéral droit<\/td>\n<td>depuis la droite<\/td>\n<td>vue de droite<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Les vues sont pour l&#39;instant sur six faces différentes. Pour les mettre sur une seule feuille, on <strong>rabat<\/strong> les faces du cube dans un même plan. C&#39;est le sujet du chapitre suivant.<\/p>\n<h2>Idée 5 · Une vue, deux dimensions<\/h2>\n<p>Une vue est la représentation obtenue par projection orthogonale <strong>suivant une direction d&#39;observation donnée<\/strong>. Elle décrit avec précision la forme de l&#39;objet, mais chaque vue n&#39;apporte qu&#39;une partie de l&#39;information.<\/p>\n<figure class=\"grille\"><figcaption>Ce que montre chaque vue de la pièce en L (60 × 40 × 50)<\/figcaption><table><tr><th><\/th><th>largeur<\/th><th>hauteur<\/th><th>profondeur<\/th><\/tr><tr><th>face<\/th><td class=\"h1\">60<\/td><td class=\"h1\">50<\/td><td class=\"h0\">—<\/td><\/tr><tr><th>dessus<\/th><td class=\"h1\">60<\/td><td class=\"h0\">—<\/td><td class=\"h1\">40<\/td><\/tr><tr><th>droite<\/th><td class=\"h0\">—<\/td><td class=\"h1\">50<\/td><td class=\"h1\">40<\/td><\/tr><\/table><\/figure><p>Chaque dimension apparaît dans <strong>deux<\/strong> vues, et chaque vue en ignore une. C&#39;est pour cela que plusieurs vues peuvent être nécessaires : elles sont <strong>complémentaires<\/strong> et renseignent sur les faces, les arêtes et les détails.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le tableau ci-dessus est notre façon de résumer. Les diapositives disent la même chose dans le bilan du chapitre : face et dessus partagent les largeurs, face et droite les hauteurs, dessus et droite les profondeurs.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Trois exercices types<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Cite les cinq éléments d&#39;une projection orthogonale.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Qui regarde quoi, vers où, comment, et qu&#39;obtient-on ?<\/p>\n<\/div><div class=\"ex-c\" hidden><p>L&#39;objet, le plan de projection, la direction d&#39;observation, les lignes de projection (perpendiculaires au plan) et la projection obtenue, appelée vue.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>La pièce en L mesure 60 × 40 × 50 (largeur × profondeur × hauteur, en mm). Quelle est la largeur, en mm, du rectangle qui entoure sa vue de dessus ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>Vue d&#39;en haut, la hauteur disparaît.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 60<\/b><\/p><p>60 mm. La vue de dessus montre la largeur (60) et la profondeur (40). La hauteur (50) n&#39;y apparaît pas.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Même pièce. Dans la vue de droite, quelle est la dimension horizontale du rectangle, en mm ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>Depuis la droite, c&#39;est la largeur qui part droit devant toi.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 40<\/b><\/p><p>40 mm. La vue de droite montre la profondeur (40) et la hauteur (50).<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Dans une projection orthogonale, les lignes de projection sont :<\/div><button class=\"opt\" data-o=\"0\">parallèles au plan de projection<\/button><button class=\"opt\" data-o=\"1\">parallèles entre elles et perpendiculaires au plan de projection<\/button><button class=\"opt\" data-o=\"2\">concourantes en un point, l&#39;œil de l&#39;observateur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Lequel n&#39;est PAS un des cinq éléments d&#39;une projection orthogonale ?<\/div><button class=\"opt\" data-o=\"0\">le plan de projection<\/button><button class=\"opt\" data-o=\"1\">la direction d&#39;observation<\/button><button class=\"opt\" data-o=\"2\">le point de fuite<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Dans le principe du cours, le plan de projection est situé :<\/div><button class=\"opt\" data-o=\"0\">entre l&#39;observateur et l&#39;objet<\/button><button class=\"opt\" data-o=\"1\">derrière l&#39;objet<\/button><button class=\"opt\" data-o=\"2\">au-dessus de l&#39;objet<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">L&#39;observateur se place :<\/div><button class=\"opt\" data-o=\"0\">perpendiculairement à l&#39;une des faces de l&#39;objet<\/button><button class=\"opt\" data-o=\"1\">en biais, pour voir trois faces à la fois<\/button><button class=\"opt\" data-o=\"2\">parallèlement à la face qu&#39;il veut dessiner<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Combien de directions d&#39;observation définit-on, par analogie avec un cube ?<\/div><button class=\"opt\" data-o=\"0\">trois<\/button><button class=\"opt\" data-o=\"1\">quatre<\/button><button class=\"opt\" data-o=\"2\">six<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Quelle vue est généralement choisie comme vue principale ?<\/div><button class=\"opt\" data-o=\"0\">la vue de dessus<\/button><button class=\"opt\" data-o=\"1\">la vue de face<\/button><button class=\"opt\" data-o=\"2\">la vue de droite<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Le plan horizontal du cube de projection donne :<\/div><button class=\"opt\" data-o=\"0\">la vue de face<\/button><button class=\"opt\" data-o=\"1\">la vue de droite<\/button><button class=\"opt\" data-o=\"2\">la vue de dessus<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">À quoi sert le rabattement des faces du cube de projection ?<\/div><button class=\"opt\" data-o=\"0\">à agrandir les vues<\/button><button class=\"opt\" data-o=\"1\">à ramener toutes les vues dans un même plan<\/button><button class=\"opt\" data-o=\"2\">à supprimer les arêtes cachées<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Une pièce mesure 60 de large, 40 de profondeur et 50 de haut. Sa vue de face montre :<\/div><button class=\"opt\" data-o=\"0\">60 et 50<\/button><button class=\"opt\" data-o=\"1\">60 et 40<\/button><button class=\"opt\" data-o=\"2\">40 et 50<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Pourquoi a-t-on souvent besoin de plusieurs vues ?<\/div><button class=\"opt\" data-o=\"0\">parce que la norme impose toujours six vues<\/button><button class=\"opt\" data-o=\"1\">parce qu&#39;une vue déforme les dimensions<\/button><button class=\"opt\" data-o=\"2\">parce que chaque vue apporte des informations complémentaires sur les faces, les arêtes et les détails<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"projection-orthogonale","rep":null,"tol":null},{"n":"projection-orthogonale","rep":null,"tol":null},{"n":"projection-orthogonale","rep":["60"],"tol":null},{"n":"projection-orthogonale","rep":["40"],"tol":null}],"qcm":[{"n":"projection-orthogonale","q":"Dans une projection orthogonale, les lignes de projection sont :","o":["parallèles au plan de projection","parallèles entre elles et perpendiculaires au plan de projection","concourantes en un point, l&#39;œil de l&#39;observateur"],"a":1,"e":"C&#39;est la définition. Des lignes qui se rejoignent à l&#39;œil donneraient une perspective, qui déforme."},{"n":"projection-orthogonale","q":"Lequel n&#39;est PAS un des cinq éléments d&#39;une projection orthogonale ?","o":["le plan de projection","la direction d&#39;observation","le point de fuite"],"a":2,"e":"Les cinq éléments : objet, plan, direction d&#39;observation, lignes de projection, vue. Le point de fuite appartient à la perspective."},{"n":"projection-orthogonale","q":"Dans le principe du cours, le plan de projection est situé :","o":["entre l&#39;observateur et l&#39;objet","derrière l&#39;objet","au-dessus de l&#39;objet"],"a":1,"e":"La face observée est projetée sur un plan parallèle à cette face, situé derrière l&#39;objet."},{"n":"projection-orthogonale","q":"L&#39;observateur se place :","o":["perpendiculairement à l&#39;une des faces de l&#39;objet","en biais, pour voir trois faces à la fois","parallèlement à la face qu&#39;il veut dessiner"],"a":0,"e":"Il regarde une face bien droit devant lui. En biais, il obtiendrait une vue en perspective."},{"n":"projection-orthogonale","q":"Combien de directions d&#39;observation définit-on, par analogie avec un cube ?","o":["trois","quatre","six"],"a":2,"e":"Face, dessus, dessous, droite, gauche, arrière : une par face du cube."},{"n":"projection-orthogonale","q":"Quelle vue est généralement choisie comme vue principale ?","o":["la vue de dessus","la vue de face","la vue de droite"],"a":1,"e":"Les cinq autres vues sont définies à partir de la vue de face."},{"n":"projection-orthogonale","q":"Le plan horizontal du cube de projection donne :","o":["la vue de face","la vue de droite","la vue de dessus"],"a":2,"e":"Plan frontal : face. Plan horizontal : dessus. Plan latéral droit : droite."},{"n":"projection-orthogonale","q":"À quoi sert le rabattement des faces du cube de projection ?","o":["à agrandir les vues","à ramener toutes les vues dans un même plan","à supprimer les arêtes cachées"],"a":1,"e":"Les six vues sont sur six faces. On rabat ces faces pour tout dessiner sur une seule feuille."},{"n":"projection-orthogonale","q":"Une pièce mesure 60 de large, 40 de profondeur et 50 de haut. Sa vue de face montre :","o":["60 et 50","60 et 40","40 et 50"],"a":0,"e":"De face, on voit la largeur et la hauteur. La profondeur part droit devant l&#39;observateur."},{"n":"projection-orthogonale","q":"Pourquoi a-t-on souvent besoin de plusieurs vues ?","o":["parce que la norme impose toujours six vues","parce qu&#39;une vue déforme les dimensions","parce que chaque vue apporte des informations complémentaires sur les faces, les arêtes et les détails"],"a":2,"e":"Une vue ne déforme rien, mais elle ne montre que deux dimensions. Les vues se complètent."}]},{"id":"disposition-vues","t":"Disposition des vues · le premier dièdre","seance":"Chapitre 2 · partie 3","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu dois connaître les six vues et le principe de la projection : l&#39;observateur, l&#39;objet, puis le plan.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Dans la projection vue au chapitre précédent, où se trouve le plan de projection : devant l&#39;objet ou derrière lui ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Observateur, objet, plan : dans cet ordre.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><strong>Derrière l&#39;objet.<\/strong> L&#39;observateur regarde l&#39;objet, et le dessin se forme sur le plan placé de l&#39;autre côté.\nSi tu as hésité, relis l&#39;idée 2 du chapitre précédent : tout ce chapitre en découle.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « de l&#39;autre côté ».<\/strong> Le dessin se forme derrière la pièce. Donc ce que tu vois depuis la droite se dessine à gauche, et ce que tu vois d&#39;en haut se dessine en bas. Une seule règle, et tu retrouves les six positions.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Placer la vue de droite à droite de la vue de face. C&#39;est le réflexe naturel, et c&#39;est la disposition américaine. Dans la disposition européenne du cours, la vue de droite est <strong>à gauche<\/strong>.<\/p>\n<\/aside><p>À la fin, tu sais placer les six vues autour de la vue de face, reconnaître le symbole du premier dièdre et appliquer les trois règles de présentation du cours.<\/p>\n<h2>Idée 1 · On déplie le cube<\/h2>\n<p>Après les projections, chaque vue est sur une face du cube. On <strong>rabat<\/strong> ces faces autour de leurs arêtes pour tout ramener dans un même plan. Cette opération s&#39;appelle le <strong>dépliage du cube de projection<\/strong>.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Déplier le cube, pas à pas<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/6 · On part du cube fermé<\/div><p>La pièce est à l&#39;intérieur. Chaque face du cube porte une vue : celle qu&#39;on obtient en regardant la pièce depuis la face opposée.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/6 · La face du fond ne bouge pas<\/div><p>Elle porte la vue de face. C&#39;est la référence : toutes les autres faces vont tourner autour d&#39;elle.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/6 · La face de gauche du cube s&#39;ouvre vers la gauche<\/div><p>Elle porte ce qu&#39;on voit depuis la droite. La vue de droite arrive donc à gauche de la vue de face.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/6 · La face de droite du cube s&#39;ouvre vers la droite<\/div><p>Elle porte ce qu&#39;on voit depuis la gauche. La vue de gauche arrive à droite de la vue de face.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/6 · La face du bas s&#39;ouvre vers le bas<\/div><p>Elle porte ce qu&#39;on voit d&#39;en haut. La vue de dessus arrive sous la vue de face.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">6/6 · La face du haut s&#39;ouvre vers le haut<\/div><p>Elle porte ce qu&#39;on voit d&#39;en bas. La vue de dessous arrive au-dessus de la vue de face.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Idée 2 · La croix du premier dièdre<\/h2>\n<svg viewBox=\"0 0 326 244\" style=\"width:100%;max-width:440px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Disposition du premier dièdre : la vue de face au centre, la vue de droite à sa gauche, la vue de gauche à sa droite, la vue de dessus en dessous, la vue de dessous au-dessus, la vue arrière tout à droite.\">\n<g font-family=\"sans-serif\" font-size=\"11\" fill=\"currentColor\" stroke-linejoin=\"round\" stroke-linecap=\"round\">\n<polygon points=\"10,94 58.0,94 58.0,154.0 10,154.0\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" /><line x1=\"10\" y1=\"130.0\" x2=\"58.0\" y2=\"130.0\" stroke=\"currentColor\" stroke-width=\"2.2\"/><polygon points=\"80,154.0 152.0,154.0 152.0,130.0 104.0,130.0 104.0,94 80,94\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2.8\" /><polygon points=\"174,94 222.0,94 222.0,154.0 174,154.0\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" /><line x1=\"174\" y1=\"130.0\" x2=\"222.0\" y2=\"130.0\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\"/><polygon points=\"244,154.0 316.0,154.0 316.0,94 292.0,94 292.0,130.0 244,130.0\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" /><polygon points=\"80,24 152.0,24 152.0,72.0 80,72.0\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" /><line x1=\"104.0\" y1=\"24\" x2=\"104.0\" y2=\"72.0\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\"/><polygon points=\"80,176 152.0,176 152.0,224.0 80,224.0\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" /><line x1=\"104.0\" y1=\"176\" x2=\"104.0\" y2=\"224.0\" stroke=\"currentColor\" stroke-width=\"2.2\"/><text x=\"34\" y=\"167\" text-anchor=\"middle\" stroke=\"none\" font-size=\"10\">vue de droite<\/text><text x=\"116\" y=\"167\" text-anchor=\"middle\" stroke=\"none\" fill=\"#D9824F\" font-weight=\"700\" font-size=\"10\">FACE<\/text><text x=\"198\" y=\"167\" text-anchor=\"middle\" stroke=\"none\" font-size=\"10\">vue de gauche<\/text><text x=\"280\" y=\"167\" text-anchor=\"middle\" stroke=\"none\" font-size=\"10\">vue arrière<\/text><text x=\"116\" y=\"85\" text-anchor=\"middle\" stroke=\"none\" font-size=\"10\">vue de dessous<\/text><text x=\"116\" y=\"237\" text-anchor=\"middle\" stroke=\"none\" font-size=\"10\">vue de dessus<\/text>\n<\/g>\n<\/svg><p>Dans la <strong>disposition européenne<\/strong>, appelée <strong>premier dièdre<\/strong>, les vues se placent ainsi autour de la vue de face :<\/p>\n<table>\n<thead>\n<tr>\n<th>Vue<\/th>\n<th>Place par rapport à la vue de face<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Vue de droite<\/td>\n<td><strong>à gauche<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Vue de gauche<\/td>\n<td><strong>à droite<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Vue de dessus<\/td>\n<td><strong>au-dessous<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Vue de dessous<\/td>\n<td><strong>au-dessus<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Vue arrière<\/td>\n<td>à droite ou à gauche, selon la disposition choisie<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p><strong>Exemple.<\/strong> Sur le schéma, regarde la pièce en L. Son montant est à gauche dans la vue de face. Dans la vue arrière, il passe à droite : on regarde la pièce de derrière.<\/p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Premier dièdre : chaque vue se place <strong>du côté opposé<\/strong> à celui d&#39;où on regarde. Droite à gauche, gauche à droite, dessus en bas, dessous en haut.<\/p>\n<\/aside><h2>Idée 3 · Le symbole qui annonce la disposition<\/h2>\n<svg viewBox=\"0 0 340 120\" style=\"width:100%;max-width:440px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Symbole du premier dièdre : tronc de cône à gauche, cercles à droite. Symbole du troisième dièdre : cercles à gauche, tronc de cône à droite.\">\n<g font-family=\"sans-serif\" font-size=\"11\" fill=\"currentColor\" stroke-linejoin=\"round\" stroke-linecap=\"round\">\n<rect x=\"4\" y=\"4\" width=\"162\" height=\"112\" rx=\"8\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/><rect x=\"174\" y=\"4\" width=\"162\" height=\"112\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"4 4\"/><text x=\"85\" y=\"22\" text-anchor=\"middle\" stroke=\"none\" fill=\"#D9824F\" font-weight=\"700\">Premier dièdre (Europe)<\/text><polygon points=\"24,50 70,40 70,84 24,74\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" /><line x1=\"16\" y1=\"62\" x2=\"78\" y2=\"62\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"10 3 2 3\"/><circle cx=\"126\" cy=\"62\" r=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><circle cx=\"126\" cy=\"62\" r=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"98\" y1=\"62\" x2=\"154\" y2=\"62\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"10 3 2 3\"/><line x1=\"126\" y1=\"34\" x2=\"126\" y2=\"90\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"10 3 2 3\"/><text x=\"85\" y=\"108\" text-anchor=\"middle\" stroke=\"none\" font-size=\"10\">dessus placé SOUS la face<\/text><text x=\"255\" y=\"22\" text-anchor=\"middle\" stroke=\"none\" font-weight=\"700\">Troisième dièdre (USA)<\/text><circle cx=\"214\" cy=\"62\" r=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><circle cx=\"214\" cy=\"62\" r=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"186\" y1=\"62\" x2=\"242\" y2=\"62\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"10 3 2 3\"/><line x1=\"214\" y1=\"34\" x2=\"214\" y2=\"90\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"10 3 2 3\"/><polygon points=\"260,50 306,40 306,84 260,74\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" /><line x1=\"252\" y1=\"62\" x2=\"314\" y2=\"62\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"10 3 2 3\"/><text x=\"255\" y=\"108\" text-anchor=\"middle\" stroke=\"none\" font-size=\"10\">dessus placé AU-DESSUS<\/text>\n<\/g>\n<\/svg><p>Un dessin indique la disposition utilisée par un petit symbole : un tronc de cône représenté en deux vues.<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Premier dièdre<\/th>\n<th>Troisième dièdre<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Autre nom<\/td>\n<td>méthode européenne<\/td>\n<td>méthode américaine<\/td>\n<\/tr>\n<tr>\n<td>Vue de dessus<\/td>\n<td><strong>sous<\/strong> la vue de face<\/td>\n<td><strong>au-dessus<\/strong> de la vue de face<\/td>\n<\/tr>\n<tr>\n<td>Symbole<\/td>\n<td>tronc de cône à gauche, cercles à droite<\/td>\n<td>cercles à gauche, tronc de cône à droite<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Le cours travaille en <strong>premier dièdre<\/strong>. Le troisième dièdre est seulement à reconnaître.<\/p>\n<h2>Idée 4 · Trois règles de présentation<\/h2>\n<p>Le cours ajoute trois remarques sur la mise en page :<\/p>\n<ul>\n<li>chaque vue représente la pièce selon <strong>une seule direction d&#39;observation<\/strong> ;<\/li>\n<li>on n&#39;inscrit <strong>jamais le nom des vues<\/strong> sur un dessin technique ;<\/li>\n<li>l&#39;espace entre les vues est <strong>adapté à la mise en page<\/strong> du dessin.<\/li>\n<\/ul>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Dans ce module, nos schémas portent le nom des vues, pour t&#39;aider à apprendre. Sur ta copie, ne les écris pas : la position de chaque vue suffit à la reconnaître.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Trois exercices types<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>En premier dièdre, tu as dessiné la vue de face au centre de ta feuille. Où dessines-tu la vue de dessus et la vue de droite ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Du côté opposé à celui d&#39;où tu regardes.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>La vue de dessus se place <strong>sous<\/strong> la vue de face. La vue de droite se place <strong>à gauche<\/strong> de la vue de face.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Un dessin montre une vue placée au-dessus de la vue de face. Le symbole indique le premier dièdre. Quelle est cette vue ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Depuis où regarde-t-on pour que le dessin arrive en haut ?<\/p>\n<\/div><div class=\"ex-c\" hidden><p>C&#39;est la <strong>vue de dessous<\/strong>. En premier dièdre, ce qu&#39;on voit d&#39;en bas se dessine en haut.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Un camarade a écrit « vue de face » et « vue de dessus » sous ses vues. Quelle règle du cours n&#39;a-t-il pas respectée ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Il ne faut jamais inscrire le nom des vues sur un dessin technique. La disposition suffit.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">En premier dièdre, la vue de droite est placée :<\/div><button class=\"opt\" data-o=\"0\">à droite de la vue de face<\/button><button class=\"opt\" data-o=\"1\">à gauche de la vue de face<\/button><button class=\"opt\" data-o=\"2\">au-dessus de la vue de face<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">En premier dièdre, la vue de dessus est placée :<\/div><button class=\"opt\" data-o=\"0\">au-dessous de la vue de face<\/button><button class=\"opt\" data-o=\"1\">au-dessus de la vue de face<\/button><button class=\"opt\" data-o=\"2\">à droite de la vue de face<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">En premier dièdre, la vue placée à droite de la vue de face est :<\/div><button class=\"opt\" data-o=\"0\">la vue de droite<\/button><button class=\"opt\" data-o=\"1\">la vue de gauche<\/button><button class=\"opt\" data-o=\"2\">la vue de dessous<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Le premier dièdre est aussi appelé :<\/div><button class=\"opt\" data-o=\"0\">méthode américaine<\/button><button class=\"opt\" data-o=\"1\">méthode européenne<\/button><button class=\"opt\" data-o=\"2\">méthode isométrique<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Dans la disposition du troisième dièdre, la vue de dessus est placée :<\/div><button class=\"opt\" data-o=\"0\">sous la vue de face<\/button><button class=\"opt\" data-o=\"1\">au-dessus de la vue de face<\/button><button class=\"opt\" data-o=\"2\">à gauche de la vue de face<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Le dépliage du cube de projection consiste à :<\/div><button class=\"opt\" data-o=\"0\">découper la pièce en six morceaux<\/button><button class=\"opt\" data-o=\"1\">tourner la pièce pour la regarder sous six angles<\/button><button class=\"opt\" data-o=\"2\">rabattre les faces du cube autour de leurs arêtes pour ramener les vues dans un même plan<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Sur un dessin technique, le nom des vues :<\/div><button class=\"opt\" data-o=\"0\">s&#39;écrit toujours sous chaque vue<\/button><button class=\"opt\" data-o=\"1\">s&#39;écrit seulement sous la vue de face<\/button><button class=\"opt\" data-o=\"2\">ne s&#39;écrit jamais<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Selon le cours, la vue arrière se place :<\/div><button class=\"opt\" data-o=\"0\">obligatoirement au-dessus de la vue de dessous<\/button><button class=\"opt\" data-o=\"1\">à droite ou à gauche, selon la disposition choisie<\/button><button class=\"opt\" data-o=\"2\">obligatoirement sous la vue de dessus<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Combien de directions d&#39;observation une vue représente-t-elle ?<\/div><button class=\"opt\" data-o=\"0\">une seule<\/button><button class=\"opt\" data-o=\"1\">deux<\/button><button class=\"opt\" data-o=\"2\">autant qu&#39;on veut<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">En premier dièdre, la vue de dessous est placée :<\/div><button class=\"opt\" data-o=\"0\">sous la vue de dessus<\/button><button class=\"opt\" data-o=\"1\">sous la vue de face<\/button><button class=\"opt\" data-o=\"2\">au-dessus de la vue de face<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"disposition-vues","rep":null,"tol":null},{"n":"disposition-vues","rep":null,"tol":null},{"n":"disposition-vues","rep":null,"tol":null},{"n":"disposition-vues","rep":null,"tol":null}],"qcm":[{"n":"disposition-vues","q":"En premier dièdre, la vue de droite est placée :","o":["à droite de la vue de face","à gauche de la vue de face","au-dessus de la vue de face"],"a":1,"e":"Le dessin se forme derrière la pièce : ce qu&#39;on voit depuis la droite se dessine à gauche."},{"n":"disposition-vues","q":"En premier dièdre, la vue de dessus est placée :","o":["au-dessous de la vue de face","au-dessus de la vue de face","à droite de la vue de face"],"a":0,"e":"Ce qu&#39;on voit d&#39;en haut se dessine en bas."},{"n":"disposition-vues","q":"En premier dièdre, la vue placée à droite de la vue de face est :","o":["la vue de droite","la vue de gauche","la vue de dessous"],"a":1,"e":"La vue de gauche se place à droite. C&#39;est l&#39;erreur la plus fréquente du chapitre."},{"n":"disposition-vues","q":"Le premier dièdre est aussi appelé :","o":["méthode américaine","méthode européenne","méthode isométrique"],"a":1,"e":"Premier dièdre : Europe. Troisième dièdre : méthode américaine."},{"n":"disposition-vues","q":"Dans la disposition du troisième dièdre, la vue de dessus est placée :","o":["sous la vue de face","au-dessus de la vue de face","à gauche de la vue de face"],"a":1,"e":"C&#39;est l&#39;inverse du premier dièdre : en méthode américaine, le dessus est en haut."},{"n":"disposition-vues","q":"Le dépliage du cube de projection consiste à :","o":["découper la pièce en six morceaux","tourner la pièce pour la regarder sous six angles","rabattre les faces du cube autour de leurs arêtes pour ramener les vues dans un même plan"],"a":2,"e":"Ce sont les faces du cube qu&#39;on rabat, pas la pièce qu&#39;on tourne."},{"n":"disposition-vues","q":"Sur un dessin technique, le nom des vues :","o":["s&#39;écrit toujours sous chaque vue","s&#39;écrit seulement sous la vue de face","ne s&#39;écrit jamais"],"a":2,"e":"C&#39;est une remarque explicite du cours. La position des vues suffit à les identifier."},{"n":"disposition-vues","q":"Selon le cours, la vue arrière se place :","o":["obligatoirement au-dessus de la vue de dessous","à droite ou à gauche, selon la disposition choisie","obligatoirement sous la vue de dessus"],"a":1,"e":"Elle se met au bout de la ligne horizontale des vues, d&#39;un côté ou de l&#39;autre."},{"n":"disposition-vues","q":"Combien de directions d&#39;observation une vue représente-t-elle ?","o":["une seule","deux","autant qu&#39;on veut"],"a":0,"e":"Chaque vue représente la pièce selon une seule direction d&#39;observation."},{"n":"disposition-vues","q":"En premier dièdre, la vue de dessous est placée :","o":["sous la vue de dessus","sous la vue de face","au-dessus de la vue de face"],"a":2,"e":"Ce qu&#39;on voit d&#39;en bas se dessine en haut."}]},{"id":"correspondances","t":"Correspondances entre les vues et droite à 45°","seance":"Chapitre 2 · partie 4","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu dois savoir placer les vues en premier dièdre.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>En premier dièdre, où se placent la vue de gauche et la vue de dessus par rapport à la vue de face ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Du côté opposé à celui d&#39;où on regarde.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>La vue de gauche est <strong>à droite<\/strong> de la vue de face. La vue de dessus est <strong>au-dessous<\/strong>.\nSi tu as inversé, relis le chapitre « Disposition des vues » avant de continuer : ici, tout repose sur ces positions.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense rails.<\/strong> Les vues ne sont pas trois dessins séparés : c&#39;est le même objet. Chaque point circule d&#39;une vue à l&#39;autre sur un rail horizontal ou vertical. Si tu traces les rails avant les formes, tu ne peux presque plus te tromper.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Dessiner chaque vue « à l&#39;œil », en remesurant tout à la règle. Les vues finissent décalées et les dimensions ne correspondent plus. C&#39;est l&#39;erreur que le cours appelle « non-correspondance des vues ».<\/p>\n<\/aside><p>À la fin, tu sais aligner trois vues, transférer une profondeur avec la droite à 45°, distinguer une arête vue d&#39;une arête cachée et construire la troisième vue à partir de deux autres.<\/p>\n<h2>Idée 1 · Deux alignements à respecter<\/h2>\n<svg viewBox=\"0 0 260 190\" style=\"width:100%;max-width:400px;display:block;margin:10px auto\" role=\"img\" aria-label=\"La vue de face et la vue de gauche sont alignées horizontalement : mêmes hauteurs. La vue de face et la vue de dessus sont alignées verticalement : mêmes largeurs.\">\n<g font-family=\"sans-serif\" font-size=\"11\" fill=\"currentColor\" stroke-linejoin=\"round\" stroke-linecap=\"round\">\n<polygon points=\"20,87.0 98.0,87.0 98.0,61.0 46.0,61.0 46.0,22 20,22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" /><polygon points=\"128,22 180.0,22 180.0,87.0 128,87.0\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" /><line x1=\"128\" y1=\"61.0\" x2=\"180.0\" y2=\"61.0\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\"/><polygon points=\"20,117 98.0,117 98.0,169.0 20,169.0\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" /><line x1=\"46.0\" y1=\"117\" x2=\"46.0\" y2=\"169.0\" stroke=\"currentColor\" stroke-width=\"2.2\"/><line x1=\"46.0\" y1=\"22\" x2=\"128\" y2=\"22\" stroke=\"#D9824F\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><line x1=\"98.0\" y1=\"61.0\" x2=\"128\" y2=\"61.0\" stroke=\"#D9824F\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><line x1=\"98.0\" y1=\"87.0\" x2=\"128\" y2=\"87.0\" stroke=\"#D9824F\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><line x1=\"20\" y1=\"87.0\" x2=\"20\" y2=\"117\" stroke=\"#D9824F\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><line x1=\"46.0\" y1=\"87.0\" x2=\"46.0\" y2=\"117\" stroke=\"#D9824F\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><line x1=\"98.0\" y1=\"87.0\" x2=\"98.0\" y2=\"117\" stroke=\"#D9824F\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><text x=\"59\" y=\"14\" text-anchor=\"middle\" stroke=\"none\" font-size=\"10\">face<\/text><text x=\"154\" y=\"14\" text-anchor=\"middle\" stroke=\"none\" font-size=\"10\">gauche<\/text><text x=\"59\" y=\"182.0\" text-anchor=\"middle\" stroke=\"none\" font-size=\"10\">dessus<\/text><text x=\"190\" y=\"57\" text-anchor=\"start\" stroke=\"none\" fill=\"#D9824F\" font-weight=\"700\" font-size=\"10\">mêmes<\/text><text x=\"190\" y=\"69\" text-anchor=\"start\" stroke=\"none\" fill=\"#D9824F\" font-weight=\"700\" font-size=\"10\">hauteurs ↔<\/text><text x=\"106\" y=\"107\" text-anchor=\"start\" stroke=\"none\" fill=\"#D9824F\" font-weight=\"700\" font-size=\"10\">mêmes largeurs ↕<\/text>\n<\/g>\n<\/svg><p>Après le dépliage du cube, les vues gardent leurs correspondances géométriques :<\/p>\n<ul>\n<li>la vue de face, la vue de gauche, la vue de droite et la vue arrière sont <strong>alignées horizontalement<\/strong> ;<\/li>\n<li>la vue de face, la vue de dessus et la vue de dessous sont <strong>alignées verticalement<\/strong>.<\/li>\n<\/ul>\n<p>Ce que ça veut dire, concrètement :<\/p>\n<table>\n<thead>\n<tr>\n<th>Vues<\/th>\n<th>Ce qu&#39;elles partagent<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Face et dessus<\/td>\n<td>les <strong>largeurs<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Face et droite (ou gauche)<\/td>\n<td>les <strong>hauteurs<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Dessus et droite (ou gauche)<\/td>\n<td>les <strong>profondeurs<\/strong><\/td>\n<\/tr>\n<\/tbody><\/table>\n<p><strong>Exemple.<\/strong> Pièce en L de 60 × 40 × 50. La vue de face fait 60 de large : la vue de dessus aussi, exactement en dessous. La vue de face fait 50 de haut : la vue de gauche aussi, exactement à côté.<\/p>\n<p>Les lignes fines qui relient les vues s&#39;appellent des <strong>lignes de rappel<\/strong>.<\/p>\n<h2>Idée 2 · La droite à 45° transporte la profondeur<\/h2>\n<svg viewBox=\"0 0 270 200\" style=\"width:100%;max-width:420px;display:block;margin:10px auto\" role=\"img\" aria-label=\"La droite à 45 degrés part du point O, au croisement des axes entre les vues. Les lignes venant de la vue de dessus touchent cette droite puis remontent vers la vue de gauche : la profondeur est transférée.\">\n<g font-family=\"sans-serif\" font-size=\"11\" fill=\"currentColor\" stroke-linejoin=\"round\" stroke-linecap=\"round\">\n<polygon points=\"20,87.0 98.0,87.0 98.0,61.0 46.0,61.0 46.0,22 20,22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" /><polygon points=\"128,22 180.0,22 180.0,87.0 128,87.0\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" /><line x1=\"128\" y1=\"61.0\" x2=\"180.0\" y2=\"61.0\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\"/><polygon points=\"20,117 98.0,117 98.0,169.0 20,169.0\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" /><line x1=\"46.0\" y1=\"117\" x2=\"46.0\" y2=\"169.0\" stroke=\"currentColor\" stroke-width=\"2.2\"/><line x1=\"46.0\" y1=\"22\" x2=\"128\" y2=\"22\" stroke=\"#D9824F\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><line x1=\"98.0\" y1=\"61.0\" x2=\"128\" y2=\"61.0\" stroke=\"#D9824F\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><line x1=\"98.0\" y1=\"87.0\" x2=\"128\" y2=\"87.0\" stroke=\"#D9824F\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><line x1=\"20\" y1=\"87.0\" x2=\"20\" y2=\"117\" stroke=\"#D9824F\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><line x1=\"46.0\" y1=\"87.0\" x2=\"46.0\" y2=\"117\" stroke=\"#D9824F\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><line x1=\"98.0\" y1=\"87.0\" x2=\"98.0\" y2=\"117\" stroke=\"#D9824F\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><line x1=\"113\" y1=\"102\" x2=\"195\" y2=\"184\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"183\" y=\"194\" text-anchor=\"start\" stroke=\"none\" fill=\"#D9824F\" font-weight=\"700\">45°<\/text><circle cx=\"113\" cy=\"102\" r=\"3\" fill=\"#D9824F\" stroke=\"none\"/><text x=\"107\" y=\"98\" text-anchor=\"end\" stroke=\"none\" fill=\"#D9824F\" font-weight=\"700\">O<\/text><line x1=\"98.0\" y1=\"117\" x2=\"128\" y2=\"117\" stroke=\"#D9824F\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><line x1=\"128\" y1=\"117\" x2=\"128\" y2=\"90.0\" stroke=\"#D9824F\" stroke-width=\"1.2\"/><polygon points=\"128,90.0 131.0,96.3 125.0,96.3\" fill=\"#D9824F\" stroke=\"#D9824F\" stroke-width=\"1\"/><line x1=\"98.0\" y1=\"169.0\" x2=\"180.0\" y2=\"169.0\" stroke=\"#D9824F\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><line x1=\"180.0\" y1=\"169.0\" x2=\"180.0\" y2=\"90.0\" stroke=\"#D9824F\" stroke-width=\"1.2\"/><polygon points=\"180.0,90.0 183.0,96.3 177.0,96.3\" fill=\"#D9824F\" stroke=\"#D9824F\" stroke-width=\"1\"/><text x=\"59\" y=\"14\" text-anchor=\"middle\" stroke=\"none\" font-size=\"10\">face<\/text><text x=\"154\" y=\"14\" text-anchor=\"middle\" stroke=\"none\" font-size=\"10\">gauche<\/text><text x=\"59\" y=\"182.0\" text-anchor=\"middle\" stroke=\"none\" font-size=\"10\">dessus<\/text><text x=\"206\" y=\"150\" text-anchor=\"start\" stroke=\"none\" fill=\"#D9824F\" font-weight=\"700\" font-size=\"10\">profondeur<\/text><text x=\"206\" y=\"162\" text-anchor=\"start\" stroke=\"none\" fill=\"#D9824F\" font-weight=\"700\" font-size=\"10\">transférée<\/text>\n<\/g>\n<\/svg><p>Il reste un problème : la profondeur. Dans la vue de dessus, elle est <strong>verticale<\/strong>. Dans la vue de gauche, elle est <strong>horizontale<\/strong>. Aucun alignement direct ne les relie.<\/p>\n<p>La solution est une ligne de construction : la <strong>droite à 45°<\/strong>. Elle fait tourner les lignes de rappel d&#39;un quart de tour. Elle sert à :<\/p>\n<ul>\n<li><strong>transférer<\/strong> la profondeur entre la vue de dessus et la vue de côté ;<\/li>\n<li><strong>éviter<\/strong> de remesurer à la règle ;<\/li>\n<li><strong>garantir<\/strong> la cohérence géométrique entre les vues.<\/li>\n<\/ul>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>La méthode de la droite à 45°<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Place le point O<\/div><p>Les vues sont séparées par un espace régulier. O se trouve au croisement des axes qui passent au milieu de ces espaces.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · Trace la droite à 45° depuis O<\/div><p>Elle part vers le coin vide de la feuille, entre la vue de dessus et la vue de côté.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · Tire des lignes depuis la vue de dessus<\/div><p>Depuis chaque élément de la vue de dessus, trace une ligne de rappel horizontale jusqu&#39;à la droite à 45°.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · Remonte vers la vue de côté<\/div><p>Depuis chaque point touché sur la droite à 45°, trace une ligne verticale vers la zone de la vue de gauche.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · Place les éléments de la vue de côté<\/div><p>Les verticales donnent les profondeurs. Les lignes de rappel venues de la vue de face donnent les hauteurs. Il ne reste qu&#39;à repasser les contours.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>Le cours insiste : le point O <strong>ne doit pas toucher le coin de la vue de face<\/strong>. La droite à 45° démarre à l&#39;intersection exacte des axes entre les vues, pour éviter tout décalage.<\/p>\n<\/aside><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Les diapositives parlent tantôt de la vue de gauche, tantôt de la vue de droite. La méthode est la même des deux côtés : seule la position change. Vue de gauche à droite de la face : la droite à 45° descend vers la droite. Vue de droite à gauche de la face : elle descend vers la gauche.<\/p>\n<\/aside><h2>Idée 3 · Arêtes vues, arêtes cachées<\/h2>\n<svg viewBox=\"0 0 332 132\" style=\"width:100%;max-width:440px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Dans la vue de droite, l'arête de la marche est visible : trait continu fort. Dans la vue de gauche, la même arête est cachée par le montant : trait interrompu fin.\">\n<g font-family=\"sans-serif\" font-size=\"11\" fill=\"currentColor\" stroke-linejoin=\"round\" stroke-linecap=\"round\">\n<polygon points=\"50,26 102.0,26 102.0,91.0 50,91.0\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" /><line x1=\"50\" y1=\"65.0\" x2=\"102.0\" y2=\"65.0\" stroke=\"currentColor\" stroke-width=\"2.2\"/><polygon points=\"230,26 282.0,26 282.0,91.0 230,91.0\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" /><line x1=\"230\" y1=\"65.0\" x2=\"282.0\" y2=\"65.0\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\"/><text x=\"76\" y=\"16\" text-anchor=\"middle\" stroke=\"none\">vue de droite<\/text><text x=\"256\" y=\"16\" text-anchor=\"middle\" stroke=\"none\">vue de gauche<\/text><text x=\"76\" y=\"110\" text-anchor=\"middle\" stroke=\"none\" fill=\"#D9824F\" font-weight=\"700\">arête vue<\/text><text x=\"76\" y=\"124\" text-anchor=\"middle\" stroke=\"none\" font-size=\"10\">trait continu fort<\/text><text x=\"256\" y=\"110\" text-anchor=\"middle\" stroke=\"none\" fill=\"#D9824F\" font-weight=\"700\">arête cachée<\/text><text x=\"256\" y=\"124\" text-anchor=\"middle\" stroke=\"none\" font-size=\"10\">trait interrompu fin<\/text><line x1=\"166\" y1=\"8\" x2=\"166\" y2=\"128\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"2 4\"/>\n<\/g>\n<\/svg><table>\n<thead>\n<tr>\n<th>Arête<\/th>\n<th>Trait<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Arête <strong>vue<\/strong><\/td>\n<td>trait <strong>continu fort<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Arête <strong>cachée<\/strong><\/td>\n<td>trait <strong>interrompu fin<\/strong><\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Ces conventions distinguent ce qui est visible de ce qui ne l&#39;est pas dans la direction d&#39;observation.<\/p>\n<p><strong>Exemple.<\/strong> Sur la pièce en L, la marche forme une arête à 20 mm de hauteur. Depuis la droite, on la voit : trait continu fort. Depuis la gauche, le montant la cache : trait interrompu fin. Même arête, même hauteur, deux traits différents.<\/p>\n<h2>Idée 4 · Les trois erreurs à éviter<\/h2>\n<svg viewBox=\"0 0 330 122\" style=\"width:100%;max-width:440px;display:block;margin:10px auto\" role=\"img\" aria-label=\"À gauche, tracé correct : la vue de gauche est alignée avec la vue de face. À droite, tracé incorrect : la vue de gauche est décalée vers le bas, les hauteurs ne correspondent plus.\">\n<g font-family=\"sans-serif\" font-size=\"11\" fill=\"currentColor\" stroke-linejoin=\"round\" stroke-linecap=\"round\">\n<text x=\"75\" y=\"14\" text-anchor=\"middle\" stroke=\"none\" font-weight=\"700\">Correct<\/text><polygon points=\"12,69.0 66.0,69.0 66.0,51.0 30.0,51.0 30.0,24 12,24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" /><polygon points=\"88,24 124.0,24 124.0,69.0 88,69.0\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" /><line x1=\"88\" y1=\"51.0\" x2=\"124.0\" y2=\"51.0\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\"/><line x1=\"30\" y1=\"24\" x2=\"88\" y2=\"24\" stroke=\"#D9824F\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><line x1=\"66\" y1=\"69\" x2=\"88\" y2=\"69\" stroke=\"#D9824F\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><text x=\"255\" y=\"14\" text-anchor=\"middle\" stroke=\"none\" fill=\"#D9824F\" font-weight=\"700\">Incorrect<\/text><polygon points=\"182,69.0 236.0,69.0 236.0,51.0 200.0,51.0 200.0,24 182,24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" /><polygon points=\"258,40 294.0,40 294.0,85.0 258,85.0\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" /><line x1=\"258\" y1=\"67.0\" x2=\"294.0\" y2=\"67.0\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\"/><line x1=\"200\" y1=\"24\" x2=\"300\" y2=\"24\" stroke=\"#D9824F\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><line x1=\"236\" y1=\"69\" x2=\"300\" y2=\"69\" stroke=\"#D9824F\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><text x=\"255\" y=\"104\" text-anchor=\"middle\" stroke=\"none\" fill=\"#D9824F\" font-size=\"10\">vue décalée : les hauteurs<\/text><text x=\"255\" y=\"116\" text-anchor=\"middle\" stroke=\"none\" fill=\"#D9824F\" font-size=\"10\">ne correspondent plus<\/text><text x=\"75\" y=\"104\" text-anchor=\"middle\" stroke=\"none\" font-size=\"10\">tout est aligné<\/text><line x1=\"160\" y1=\"6\" x2=\"160\" y2=\"118\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"2 4\"/>\n<\/g>\n<\/svg><p>Le cours montre trois tracés incorrects :<\/p>\n<table>\n<thead>\n<tr>\n<th>Erreur<\/th>\n<th>Ce qui ne va pas<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Vues mal placées<\/td>\n<td>une vue n&#39;est pas à sa place du premier dièdre<\/td>\n<\/tr>\n<tr>\n<td>Non-correspondance des vues<\/td>\n<td>les vues ne sont pas alignées entre elles<\/td>\n<\/tr>\n<tr>\n<td>Hauteur non respectée<\/td>\n<td>une vue n&#39;a pas la même hauteur que la vue de face<\/td>\n<\/tr>\n<\/tbody><\/table>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Avant de rendre un dessin, contrôle trois choses : chaque vue est <strong>à sa place<\/strong>, les vues sont <strong>alignées<\/strong>, les <strong>dimensions communes<\/strong> sont égales.<\/p>\n<\/aside><h2>Idée 5 · Construire la troisième vue<\/h2>\n<p>C&#39;est l&#39;exercice type : on te donne deux vues, tu complètes la troisième.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Compléter une vue par correspondance<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Repère les arêtes communes<\/div><p>Cherche dans les vues données les arêtes qui doivent apparaître dans la vue manquante.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · Trace les lignes de rappel horizontales<\/div><p>Depuis la vue de face, elles donnent les hauteurs de la vue de côté.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · Positionne la vue de dessus<\/div><p>Sous la vue de face, alignée par des lignes de rappel verticales : elles donnent les largeurs.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · Transfère les profondeurs<\/div><p>Avec la droite à 45°, entre la vue de dessus et la vue de côté.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · Repasse les contours<\/div><p>Arêtes vues en trait continu fort, arêtes cachées en trait interrompu fin.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>La dernière étape (« repasse les contours ») est ajoutée par nous : les diapositives s&#39;arrêtent au transfert des profondeurs. Elle reprend simplement les conventions de traits de l&#39;idée 3.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Quatre exercices types<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Une pièce a une vue de face de 80 mm de large et 30 mm de haut. Sa vue de dessus fait 45 mm de profondeur. Quelle est la hauteur, en mm, de sa vue de gauche ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>Face et vues de côté partagent les hauteurs.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 30<\/b><\/p><p>30 mm. La vue de gauche est alignée horizontalement avec la vue de face : même hauteur.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Même pièce. Quelle est la dimension horizontale de sa vue de gauche, en mm ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>C&#39;est la dimension qu&#39;on transfère avec la droite à 45°.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 45<\/b><\/p><p>45 mm. C&#39;est la profondeur, lue dans la vue de dessus et transférée par la droite à 45°.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Pourquoi ne peut-on pas relier directement la vue de dessus à la vue de gauche par une ligne de rappel droite ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Dans quel sens est la profondeur dans chacune des deux vues ?<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Parce que la profondeur est verticale dans la vue de dessus et horizontale dans la vue de gauche. La droite à 45° fait tourner les lignes de rappel d&#39;un quart de tour pour passer de l&#39;une à l&#39;autre.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Sur la pièce en L, l&#39;arête de la marche est en trait continu fort dans la vue de droite et en trait interrompu fin dans la vue de gauche. Explique.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Depuis la droite, rien ne masque cette arête : elle est vue. Depuis la gauche, le montant se trouve devant elle : elle est cachée.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 9 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quelles vues sont alignées verticalement ?<\/div><button class=\"opt\" data-o=\"0\">face, gauche et droite<\/button><button class=\"opt\" data-o=\"1\">face, dessus et dessous<\/button><button class=\"opt\" data-o=\"2\">dessus, gauche et arrière<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">La vue de face et la vue de dessus partagent :<\/div><button class=\"opt\" data-o=\"0\">les largeurs<\/button><button class=\"opt\" data-o=\"1\">les hauteurs<\/button><button class=\"opt\" data-o=\"2\">les profondeurs<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">La vue de face et la vue de droite partagent :<\/div><button class=\"opt\" data-o=\"0\">les largeurs<\/button><button class=\"opt\" data-o=\"1\">les hauteurs<\/button><button class=\"opt\" data-o=\"2\">les profondeurs<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">La droite à 45° sert à transférer :<\/div><button class=\"opt\" data-o=\"0\">la largeur entre la vue de face et la vue de dessus<\/button><button class=\"opt\" data-o=\"1\">la hauteur entre la vue de face et la vue de côté<\/button><button class=\"opt\" data-o=\"2\">la profondeur entre la vue de dessus et la vue de côté<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Le point O, origine de la droite à 45°, se place :<\/div><button class=\"opt\" data-o=\"0\">sur le coin de la vue de face<\/button><button class=\"opt\" data-o=\"1\">à l&#39;intersection des axes entre les vues<\/button><button class=\"opt\" data-o=\"2\">au centre de la vue de dessus<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Une arête cachée se représente par :<\/div><button class=\"opt\" data-o=\"0\">un trait continu fort<\/button><button class=\"opt\" data-o=\"1\">un trait continu fin<\/button><button class=\"opt\" data-o=\"2\">un trait interrompu fin<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Une arête vue se représente par :<\/div><button class=\"opt\" data-o=\"0\">un trait continu fort<\/button><button class=\"opt\" data-o=\"1\">un trait interrompu fort<\/button><button class=\"opt\" data-o=\"2\">un trait mixte fin<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Une pièce fait 70 de large, 30 de profondeur, 40 de haut. Sa vue de gauche s&#39;inscrit dans un rectangle de :<\/div><button class=\"opt\" data-o=\"0\">70 × 40<\/button><button class=\"opt\" data-o=\"1\">30 × 40<\/button><button class=\"opt\" data-o=\"2\">70 × 30<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Dans la méthode de la droite à 45°, quelle est la première étape ?<\/div><button class=\"opt\" data-o=\"0\">reporter les points vers la vue de gauche<\/button><button class=\"opt\" data-o=\"1\">tracer les lignes de projection à partir des éléments de la vue de dessus<\/button><button class=\"opt\" data-o=\"2\">repasser les contours en trait fort<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Laquelle n&#39;est PAS une erreur de représentation citée par le cours ?<\/div><button class=\"opt\" data-o=\"0\">vues mal placées<\/button><button class=\"opt\" data-o=\"1\">hauteur non respectée<\/button><button class=\"opt\" data-o=\"2\">vue de face trop détaillée<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"10\"><div class=\"qq-q\">Une même arête peut-elle être vue dans une vue et cachée dans une autre ?<\/div><button class=\"opt\" data-o=\"0\">oui, cela dépend de la direction d&#39;observation<\/button><button class=\"opt\" data-o=\"1\">non, une arête est toujours vue<\/button><button class=\"opt\" data-o=\"2\">non, une arête cachée l&#39;est dans toutes les vues<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"correspondances","rep":null,"tol":null},{"n":"correspondances","rep":["30"],"tol":null},{"n":"correspondances","rep":["45"],"tol":null},{"n":"correspondances","rep":null,"tol":null},{"n":"correspondances","rep":null,"tol":null}],"qcm":[{"n":"correspondances","q":"Quelles vues sont alignées verticalement ?","o":["face, gauche et droite","face, dessus et dessous","dessus, gauche et arrière"],"a":1,"e":"Face, dessus et dessous sont l&#39;une au-dessus de l&#39;autre. Face, gauche, droite et arrière sont sur la même ligne horizontale."},{"n":"correspondances","q":"La vue de face et la vue de dessus partagent :","o":["les largeurs","les hauteurs","les profondeurs"],"a":0,"e":"Elles sont alignées verticalement : mêmes largeurs."},{"n":"correspondances","q":"La vue de face et la vue de droite partagent :","o":["les largeurs","les hauteurs","les profondeurs"],"a":1,"e":"Elles sont alignées horizontalement : mêmes hauteurs."},{"n":"correspondances","q":"La droite à 45° sert à transférer :","o":["la largeur entre la vue de face et la vue de dessus","la hauteur entre la vue de face et la vue de côté","la profondeur entre la vue de dessus et la vue de côté"],"a":2,"e":"Largeurs et hauteurs se reportent par simple alignement. Seule la profondeur a besoin de la droite à 45°."},{"n":"correspondances","q":"Le point O, origine de la droite à 45°, se place :","o":["sur le coin de la vue de face","à l&#39;intersection des axes entre les vues","au centre de la vue de dessus"],"a":1,"e":"Le cours précise que O ne doit pas toucher le coin de la vue de face."},{"n":"correspondances","q":"Une arête cachée se représente par :","o":["un trait continu fort","un trait continu fin","un trait interrompu fin"],"a":2,"e":"Arête vue : trait continu fort. Arête cachée : trait interrompu fin."},{"n":"correspondances","q":"Une arête vue se représente par :","o":["un trait continu fort","un trait interrompu fort","un trait mixte fin"],"a":0,"e":"C&#39;est le trait le plus épais du dessin : il marque les contours et arêtes visibles."},{"n":"correspondances","q":"Une pièce fait 70 de large, 30 de profondeur, 40 de haut. Sa vue de gauche s&#39;inscrit dans un rectangle de :","o":["70 × 40","30 × 40","70 × 30"],"a":1,"e":"Une vue de côté montre la profondeur (30) et la hauteur (40)."},{"n":"correspondances","q":"Dans la méthode de la droite à 45°, quelle est la première étape ?","o":["reporter les points vers la vue de gauche","tracer les lignes de projection à partir des éléments de la vue de dessus","repasser les contours en trait fort"],"a":1,"e":"On part de la vue de dessus, on va jusqu&#39;à la droite à 45°, puis on reporte vers la vue de côté."},{"n":"correspondances","q":"Laquelle n&#39;est PAS une erreur de représentation citée par le cours ?","o":["vues mal placées","hauteur non respectée","vue de face trop détaillée"],"a":2,"e":"Les trois erreurs montrées : vues mal placées, non-correspondance des vues, hauteur non respectée."},{"n":"correspondances","q":"Une même arête peut-elle être vue dans une vue et cachée dans une autre ?","o":["oui, cela dépend de la direction d&#39;observation","non, une arête est toujours vue","non, une arête cachée l&#39;est dans toutes les vues"],"a":0,"e":"La visibilité dépend de ce qui se trouve devant l&#39;arête quand on regarde depuis cette direction."}]},{"id":"choix-vues","t":"Choisir les vues · lesquelles et combien","seance":"Chapitre 2 · partie 4 (choix des vues)","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu dois savoir reconnaître une arête cachée.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Par quel trait représente-t-on une arête cachée ? Et une arête vue ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Arête cachée : <strong>trait interrompu fin<\/strong>. Arête vue : <strong>trait continu fort<\/strong>.\nSi tu as hésité, relis l&#39;idée 3 du chapitre précédent : ici, on choisit les vues justement pour limiter les arêtes cachées.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Chaque vue doit payer sa place.<\/strong> Avant de dessiner une vue, demande-toi : qu&#39;est-ce qu&#39;elle montre que les autres ne montrent pas ? Si la réponse est « rien », elle ne sert à rien.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Dessiner trois vues par réflexe, ou six « pour être sûr ». Plus de vues ne veut pas dire un meilleur dessin : une vue redondante prend du temps, de la place, et ajoute des occasions de se tromper.<\/p>\n<\/aside><p>À la fin, tu sais choisir la vue de face, décider du nombre de vues et éliminer celles qui sont inutiles.<\/p>\n<h2>Idée 1 · L&#39;objectif : le minimum de vues<\/h2>\n<p>L&#39;objectif du cours tient en une phrase : <strong>définir complètement l&#39;objet avec le minimum de vues<\/strong>.<\/p>\n<p>Les deux mots comptent :<\/p>\n<ul>\n<li><strong>complètement<\/strong> : toutes les formes doivent être définies, sans ambiguïté ;<\/li>\n<li><strong>minimum<\/strong> : pas une vue de plus que nécessaire.<\/li>\n<\/ul>\n<h2>Idée 2 · La vue de face d&#39;abord<\/h2>\n<svg viewBox=\"0 0 340 160\" style=\"width:100%;max-width:440px;display:block;margin:10px auto\" role=\"img\" aria-label=\"La face choisie comme vue de face est celle qui montre le profil en L. Vue de côté, la pièce n'est qu'un rectangle avec une arête cachée.\">\n<g font-family=\"sans-serif\" font-size=\"11\" fill=\"currentColor\" stroke-linejoin=\"round\" stroke-linecap=\"round\">\n<polygon points=\"20.0,96.0 79.8,130.5 79.8,107.5 39.9,84.5 39.9,50.0 20.0,38.5\" fill=\"#D9824F\" stroke=\"currentColor\" stroke-width=\"2.2\" fill-opacity=\"0.28\"/><polygon points=\"79.8,130.5 119.6,107.5 119.6,84.5 79.8,107.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" /><polygon points=\"39.9,84.5 79.8,61.5 79.8,27.0 39.9,50.0\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" /><polygon points=\"20.0,38.5 39.9,50.0 79.8,27.0 59.8,15.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" /><polygon points=\"39.9,84.5 79.8,107.5 119.6,84.5 79.8,61.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" /><line x1=\"19.9\" y1=\"135.8\" x2=\"43.9\" y2=\"109.8\" stroke=\"#D9824F\" stroke-width=\"2\"/><polygon points=\"43.9,109.8 41.8,116.4 37.4,112.3\" fill=\"#D9824F\" stroke=\"#D9824F\" stroke-width=\"1\"/><text x=\"4\" y=\"151.8\" text-anchor=\"start\" stroke=\"none\" fill=\"#D9824F\" font-weight=\"700\">vue de face<\/text><polygon points=\"196,65.0 250.0,65.0 250.0,47.0 214.0,47.0 214.0,20 196,20\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2.6\" /><text x=\"223\" y=\"82\" text-anchor=\"middle\" stroke=\"none\" fill=\"#D9824F\" font-weight=\"700\" font-size=\"10\">on voit le L : à garder<\/text><polygon points=\"196,98 232.0,98 232.0,143.0 196,143.0\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" /><line x1=\"196\" y1=\"125.0\" x2=\"232.0\" y2=\"125.0\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\"/><text x=\"262\" y=\"118\" text-anchor=\"start\" stroke=\"none\" font-size=\"10\">un rectangle :<\/text><text x=\"262\" y=\"130\" text-anchor=\"start\" stroke=\"none\" font-size=\"10\">forme peu lisible<\/text>\n<\/g>\n<\/svg><p>On choisit comme vue de face la vue <strong>la plus représentative<\/strong> : celle qui montre le mieux la forme de l&#39;objet.<\/p>\n<p><strong>Exemple.<\/strong> Pour la pièce en L, la face choisie est celle où l&#39;on voit le L. Vue de côté, la même pièce n&#39;est qu&#39;un rectangle : on ne devine pas sa forme.<\/p>\n<p>Ensuite, quatre critères guident le choix :<\/p>\n<table>\n<thead>\n<tr>\n<th>Critère<\/th>\n<th>En pratique<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Vue de face la plus représentative<\/td>\n<td>celle qui « ressemble » le plus à la pièce<\/td>\n<\/tr>\n<tr>\n<td>Vues qui montrent le mieux les formes<\/td>\n<td>on garde les vues les plus lisibles<\/td>\n<\/tr>\n<tr>\n<td>Limiter les arêtes cachées<\/td>\n<td>à information égale, la vue avec le moins de traits interrompus<\/td>\n<\/tr>\n<tr>\n<td>Supprimer les vues inutiles ou redondantes<\/td>\n<td>deux vues qui disent la même chose : on en garde une<\/td>\n<\/tr>\n<\/tbody><\/table>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Chaque vue doit apporter une <strong>information complémentaire<\/strong>. Sinon, on la supprime.<\/p>\n<\/aside><h2>Idée 3 · Combien de vues ?<\/h2>\n<svg viewBox=\"0 0 340 132\" style=\"width:100%;max-width:440px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Une vue suffit pour une plaque d'épaisseur constante, deux vues pour une pièce simple, trois vues pour une pièce complexe.\">\n<g font-family=\"sans-serif\" font-size=\"11\" fill=\"currentColor\" stroke-linejoin=\"round\" stroke-linecap=\"round\">\n<rect x=\"14\" y=\"34\" width=\"80\" height=\"48\" rx=\"10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"/><circle cx=\"38\" cy=\"58\" r=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"/><circle cx=\"72\" cy=\"58\" r=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"/><text x=\"54\" y=\"98\" text-anchor=\"middle\" stroke=\"none\" fill=\"#D9824F\" font-weight=\"700\">ép. 3<\/text><text x=\"54\" y=\"18\" text-anchor=\"middle\" stroke=\"none\" font-weight=\"700\">1 vue<\/text><text x=\"54\" y=\"114\" text-anchor=\"middle\" stroke=\"none\" font-size=\"10\">plaque d'épaisseur<\/text><text x=\"54\" y=\"126\" text-anchor=\"middle\" stroke=\"none\" font-size=\"10\">constante<\/text><polygon
