points=\"128,46 160,46 160,36 176,36 176,80 160,80 160,70 128,70\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" /><line x1=\"160\" y1=\"46\" x2=\"160\" y2=\"70\" stroke=\"currentColor\" stroke-width=\"2.2\"/><line x1=\"120\" y1=\"58\" x2=\"184\" y2=\"58\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"10 3 2 3\"/><circle cx=\"212\" cy=\"58\" r=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"/><circle cx=\"212\" cy=\"58\" r=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"/><text x=\"176\" y=\"18\" text-anchor=\"middle\" stroke=\"none\" font-weight=\"700\">2 vues<\/text><text x=\"176\" y=\"114\" text-anchor=\"middle\" stroke=\"none\" font-size=\"10\">pièce simple<\/text><polygon points=\"262,55.0 292.0,55.0 292.0,45.0 272.0,45.0 272.0,30 262,30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" /><polygon points=\"300,30 320.0,30 320.0,55.0 300,55.0\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" /><line x1=\"300\" y1=\"45.0\" x2=\"320.0\" y2=\"45.0\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\"/><polygon points=\"262,63 292.0,63 292.0,83.0 262,83.0\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" /><line x1=\"272.0\" y1=\"63\" x2=\"272.0\" y2=\"83.0\" stroke=\"currentColor\" stroke-width=\"2.2\"/><text x=\"292\" y=\"18\" text-anchor=\"middle\" stroke=\"none\" font-weight=\"700\">3 vues<\/text><text x=\"292\" y=\"114\" text-anchor=\"middle\" stroke=\"none\" font-size=\"10\">pièce complexe<\/text><line x1=\"108\" y1=\"8\" x2=\"108\" y2=\"128\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"2 4\"/><line x1=\"246\" y1=\"8\" x2=\"246\" y2=\"128\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"2 4\"/>\n<\/g>\n<\/svg><table>\n<thead>\n<tr>\n<th>Nombre de vues<\/th>\n<th>Pour quel objet ?<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>3 vues<\/strong><\/td>\n<td>un objet complexe<\/td>\n<\/tr>\n<tr>\n<td><strong>2 vues<\/strong><\/td>\n<td>un objet relativement simple<\/td>\n<\/tr>\n<tr>\n<td><strong>1 vue<\/strong><\/td>\n<td>un objet simple, symétrique ou d&#39;épaisseur constante<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p><strong>Exemple.<\/strong> Une plaque découpée dans une tôle de 3 mm : une seule vue suffit, à condition d&#39;indiquer l&#39;épaisseur à côté. La vue de dessus ne montrerait qu&#39;un rectangle de 3 mm de haut.<\/p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Le nombre de vues dépend de la <strong>forme de l&#39;objet<\/strong> et des <strong>informations nécessaires<\/strong>. Il n&#39;y a pas de nombre obligatoire.<\/p>\n<\/aside><h2>Idée 4 · Éliminer une vue, pas à pas<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Faut-il garder cette vue ?<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Dessine d&#39;abord la vue de face<\/div><p>C&#39;est la vue la plus représentative. On la garde toujours.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · Cherche la dimension manquante<\/div><p>La vue de face ne montre pas la profondeur. Il faut au moins une vue qui la donne, sauf si une simple indication d&#39;épaisseur suffit.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · Compare les candidates<\/div><p>Vue de dessus, vue de droite, vue de gauche : laquelle montre le mieux les formes ?<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · Préfère la vue sans arêtes cachées<\/div><p>Pour la pièce en L, la vue de droite montre la marche en trait fort. La vue de gauche la montre en trait interrompu. On garde la vue de droite.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · Supprime ce qui n&#39;apporte rien<\/div><p>Si une vue ne montre rien de nouveau, elle est redondante : on l&#39;élimine.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p><strong>Exemple complet.<\/strong> Pièce en L : vue de face (le L) et vue de droite (la profondeur, sans arête cachée). Deux vues la définissent complètement. La vue de gauche, la vue de dessous et la vue arrière sont redondantes.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Cet exemple sur la pièce en L est le nôtre. Les diapositives montrent d&#39;autres pièces : une pièce dont on élimine les vues chargées d&#39;arêtes cachées, des pièces où deux vues suffisent et des pièces où une seule vue suffit, dont une d&#39;épaisseur 3 mm.<\/p>\n<\/aside><h2>Idée 5 · Quand les vues principales ne suffisent pas<\/h2>\n<p>Le cours cite des <strong>vues complémentaires<\/strong> : vue auxiliaire, coupe, section, vue partielle.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Ce chapitre ne détaille ni la vue auxiliaire, ni la coupe, ni la section : elles sont seulement nommées. La vue partielle est traitée au chapitre suivant, avec la demi-vue, la vue interrompue et le détail.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Trois exercices types<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Une rondelle plate est découpée dans une tôle de 2 mm. Combien de vues faut-il pour la définir, et à quelle condition ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>C&#39;est un objet d&#39;épaisseur constante.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1<\/b><\/p><p>Une seule vue : celle qui montre les deux cercles. Il suffit d&#39;indiquer l&#39;épaisseur (2 mm) à côté de la vue.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Tu hésites entre la vue de droite et la vue de gauche d&#39;une pièce. Elles donnent les mêmes dimensions, mais la vue de gauche contient quatre arêtes cachées et la vue de droite aucune. Laquelle gardes-tu ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>La <strong>vue de droite<\/strong>. À information égale, on limite les arêtes cachées. L&#39;autre vue est redondante : on la supprime.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Cite les quatre critères de choix des vues.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Choisir la vue de face la plus représentative ; retenir les vues qui montrent le mieux les formes ; limiter les arêtes cachées ; supprimer les vues inutiles ou redondantes.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">L&#39;objectif du choix des vues est de :<\/div><button class=\"opt\" data-o=\"0\">dessiner les six vues de l&#39;objet<\/button><button class=\"opt\" data-o=\"1\">définir complètement l&#39;objet avec le minimum de vues<\/button><button class=\"opt\" data-o=\"2\">dessiner toujours exactement trois vues<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">La vue de face doit être :<\/div><button class=\"opt\" data-o=\"0\">la plus petite<\/button><button class=\"opt\" data-o=\"1\">celle qui contient le plus d&#39;arêtes cachées<\/button><button class=\"opt\" data-o=\"2\">la plus représentative de l&#39;objet<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Pour un objet d&#39;épaisseur constante, il suffit en général de :<\/div><button class=\"opt\" data-o=\"0\">une vue<\/button><button class=\"opt\" data-o=\"1\">deux vues<\/button><button class=\"opt\" data-o=\"2\">trois vues<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Trois vues servent à définir :<\/div><button class=\"opt\" data-o=\"0\">un objet d&#39;épaisseur constante<\/button><button class=\"opt\" data-o=\"1\">un objet symétrique simple<\/button><button class=\"opt\" data-o=\"2\">un objet complexe<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Deux vues donnent la même information. La première n&#39;a aucune arête cachée, la seconde en a cinq. On garde :<\/div><button class=\"opt\" data-o=\"0\">la première<\/button><button class=\"opt\" data-o=\"1\">la seconde<\/button><button class=\"opt\" data-o=\"2\">les deux<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Lequel n&#39;est PAS un critère de choix des vues du cours ?<\/div><button class=\"opt\" data-o=\"0\">limiter les arêtes cachées<\/button><button class=\"opt\" data-o=\"1\">supprimer les vues redondantes<\/button><button class=\"opt\" data-o=\"2\">placer le plus de vues possible sur la feuille<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Selon le cours, le nombre de vues dépend :<\/div><button class=\"opt\" data-o=\"0\">du format de la feuille<\/button><button class=\"opt\" data-o=\"1\">de la forme de l&#39;objet et des informations nécessaires<\/button><button class=\"opt\" data-o=\"2\">de la disposition choisie, premier ou troisième dièdre<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Laquelle de ces vues est citée comme vue complémentaire ?<\/div><button class=\"opt\" data-o=\"0\">la vue arrière<\/button><button class=\"opt\" data-o=\"1\">la coupe<\/button><button class=\"opt\" data-o=\"2\">la vue de dessous<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Une vue qui n&#39;apporte aucune information nouvelle est :<\/div><button class=\"opt\" data-o=\"0\">obligatoire<\/button><button class=\"opt\" data-o=\"1\">redondante, donc à supprimer<\/button><button class=\"opt\" data-o=\"2\">à dessiner en trait fin<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Pour une pièce simple et symétrique, le cours indique qu&#39;on peut se contenter de :<\/div><button class=\"opt\" data-o=\"0\">une vue<\/button><button class=\"opt\" data-o=\"1\">quatre vues<\/button><button class=\"opt\" data-o=\"2\">six vues<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"choix-vues","rep":null,"tol":null},{"n":"choix-vues","rep":["1"],"tol":null},{"n":"choix-vues","rep":null,"tol":null},{"n":"choix-vues","rep":null,"tol":null}],"qcm":[{"n":"choix-vues","q":"L&#39;objectif du choix des vues est de :","o":["dessiner les six vues de l&#39;objet","définir complètement l&#39;objet avec le minimum de vues","dessiner toujours exactement trois vues"],"a":1,"e":"Complètement, mais sans vue inutile."},{"n":"choix-vues","q":"La vue de face doit être :","o":["la plus petite","celle qui contient le plus d&#39;arêtes cachées","la plus représentative de l&#39;objet"],"a":2,"e":"C&#39;est le premier critère : la vue de face est celle qui montre le mieux la forme."},{"n":"choix-vues","q":"Pour un objet d&#39;épaisseur constante, il suffit en général de :","o":["une vue","deux vues","trois vues"],"a":0,"e":"Une vue, avec l&#39;indication de l&#39;épaisseur."},{"n":"choix-vues","q":"Trois vues servent à définir :","o":["un objet d&#39;épaisseur constante","un objet symétrique simple","un objet complexe"],"a":2,"e":"3 vues : objet complexe. 2 vues : objet relativement simple. 1 vue : objet simple, symétrique ou d&#39;épaisseur constante."},{"n":"choix-vues","q":"Deux vues donnent la même information. La première n&#39;a aucune arête cachée, la seconde en a cinq. On garde :","o":["la première","la seconde","les deux"],"a":0,"e":"On limite les arêtes cachées et on supprime la vue redondante."},{"n":"choix-vues","q":"Lequel n&#39;est PAS un critère de choix des vues du cours ?","o":["limiter les arêtes cachées","supprimer les vues redondantes","placer le plus de vues possible sur la feuille"],"a":2,"e":"On cherche au contraire le minimum de vues."},{"n":"choix-vues","q":"Selon le cours, le nombre de vues dépend :","o":["du format de la feuille","de la forme de l&#39;objet et des informations nécessaires","de la disposition choisie, premier ou troisième dièdre"],"a":1,"e":"C&#39;est la phrase « à retenir » de cette partie."},{"n":"choix-vues","q":"Laquelle de ces vues est citée comme vue complémentaire ?","o":["la vue arrière","la coupe","la vue de dessous"],"a":1,"e":"Vues complémentaires : vue auxiliaire, coupe, section, vue partielle. La vue arrière et la vue de dessous font partie des six vues principales."},{"n":"choix-vues","q":"Une vue qui n&#39;apporte aucune information nouvelle est :","o":["obligatoire","redondante, donc à supprimer","à dessiner en trait fin"],"a":1,"e":"Chaque vue doit apporter une information complémentaire."},{"n":"choix-vues","q":"Pour une pièce simple et symétrique, le cours indique qu&#39;on peut se contenter de :","o":["une vue","quatre vues","six vues"],"a":0,"e":"« 1 vue : pour un objet simple, symétrique ou d&#39;épaisseur constante. »"}]},{"id":"vues-particulieres","t":"Vues particulières · demi-vue, vue partielle, vue interrompue, détail","seance":"Chapitre 2 · partie 5","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu dois savoir ce qu&#39;est un axe de symétrie : une droite qui partage une forme en deux moitiés identiques, en miroir.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Une pièce est symétrique par rapport à un axe vertical. Tu connais parfaitement sa moitié gauche. Que sais-tu de sa moitié droite ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><strong>Tout.<\/strong> La moitié droite est le reflet exact de la moitié gauche. La dessiner n&#39;apporte aucune information nouvelle.\nC&#39;est exactement l&#39;idée de la demi-vue, la première vue particulière du chapitre.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Ne dessine que ce qui informe.<\/strong> Chaque vue particulière répond à un problème précis : une moitié répétée, une zone sans intérêt, une pièce trop longue, un détail trop petit. Retiens le problème, tu retrouves la vue.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Confondre vue partielle et vue interrompue. La vue partielle <strong>garde un seul morceau<\/strong> de la pièce. La vue interrompue <strong>garde les deux bouts<\/strong> et supprime le milieu.<\/p>\n<\/aside><p>À la fin, tu sais reconnaître les quatre vues particulières, dire quand utiliser chacune et comment limiter une vue.<\/p>\n<h2>Idée 1 · Pourquoi des vues particulières ?<\/h2>\n<p>On les utilise quand les vues principales ne permettent pas de représenter <strong>simplement et clairement<\/strong> certaines caractéristiques de l&#39;objet.<\/p>\n<table>\n<thead>\n<tr>\n<th>Vue particulière<\/th>\n<th>Le problème qu&#39;elle règle<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Demi-vue<\/td>\n<td>la pièce est symétrique : une moitié suffit<\/td>\n<\/tr>\n<tr>\n<td>Vue partielle<\/td>\n<td>une seule partie de la pièce est utile<\/td>\n<\/tr>\n<tr>\n<td>Vue interrompue<\/td>\n<td>la pièce est longue, de forme constante ou répétitive<\/td>\n<\/tr>\n<tr>\n<td>Détail<\/td>\n<td>une zone est trop petite pour être lisible<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h2>Idée 2 · La demi-vue<\/h2>\n<svg viewBox=\"0 0 300 146\" style=\"width:100%;max-width:380px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Demi-vue d'une bride circulaire : seule la moitié gauche est dessinée, jusqu'à l'axe de symétrie, repéré par deux petits traits fins à chaque extrémité.\">\n<g font-family=\"sans-serif\" font-size=\"11\" fill=\"currentColor\" stroke-linejoin=\"round\" stroke-linecap=\"round\">\n<path d=\"M120 24 A50 50 0 0 0 120 124\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"/><path d=\"M120 56 A18 18 0 0 0 120 92\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"/><circle cx=\"86\" cy=\"74\" r=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"/><line x1=\"120\" y1=\"12\" x2=\"120\" y2=\"136\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"10 3 2 3\"/><line x1=\"114\" y1=\"16\" x2=\"126\" y2=\"16\" stroke=\"#D9824F\" stroke-width=\"1.4\"/><line x1=\"114\" y1=\"20\" x2=\"126\" y2=\"20\" stroke=\"#D9824F\" stroke-width=\"1.4\"/><line x1=\"114\" y1=\"128\" x2=\"126\" y2=\"128\" stroke=\"#D9824F\" stroke-width=\"1.4\"/><line x1=\"114\" y1=\"132\" x2=\"126\" y2=\"132\" stroke=\"#D9824F\" stroke-width=\"1.4\"/><text x=\"136\" y=\"22\" text-anchor=\"start\" stroke=\"none\" font-size=\"10\">axe de symétrie<\/text><text x=\"136\" y=\"78\" text-anchor=\"start\" stroke=\"none\" font-size=\"10\">moitié non dessinée<\/text><line x1=\"180\" y1=\"112\" x2=\"130\" y2=\"129\" stroke=\"#D9824F\" stroke-width=\"2\"/><polygon points=\"130,129 135.0,124.1 136.9,129.9\" fill=\"#D9824F\" stroke=\"#D9824F\" stroke-width=\"1\"/><text x=\"182\" y=\"110\" text-anchor=\"start\" stroke=\"none\" fill=\"#D9824F\" font-weight=\"700\" font-size=\"10\">deux petits traits fins<\/text>\n<\/g>\n<\/svg><p>La demi-vue s&#39;utilise pour les objets qui présentent <strong>une symétrie<\/strong>. On ne représente qu&#39;<strong>une moitié<\/strong> de la vue, jusqu&#39;à l&#39;axe de symétrie.<\/p>\n<p><strong>Exemple.<\/strong> Une bride circulaire de 100 mm de diamètre : la demi-vue ne dessine qu&#39;un demi-disque de 50 mm de rayon. On gagne la moitié de la place et du temps.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Les deux petits traits fins tracés à chaque extrémité de l&#39;axe, sur notre schéma, ne sont pas mentionnés dans les diapositives. C&#39;est le repère habituel d&#39;une demi-vue en dessin normalisé. Vérifie auprès de ta prof si elle les attend.<\/p>\n<\/aside><h2>Idée 3 · La vue partielle<\/h2>\n<p>La vue partielle représente <strong>uniquement la partie nécessaire<\/strong> de l&#39;objet, afin de simplifier le dessin. Le reste de la pièce n&#39;est pas dessiné.<\/p>\n<svg viewBox=\"0 0 340 122\" style=\"width:100%;max-width:440px;display:block;margin:10px auto\" role=\"img\" aria-label=\"À gauche, une vue partielle : seule une partie de la pièce est dessinée, limitée par un trait fin à main levée. À droite, un détail : une petite gorge entourée d'un cercle repéré A est redessinée en plus grand.\">\n<g font-family=\"sans-serif\" font-size=\"11\" fill=\"currentColor\" stroke-linejoin=\"round\" stroke-linecap=\"round\">\n<text x=\"80\" y=\"14\" text-anchor=\"middle\" stroke=\"none\" font-weight=\"700\">Vue partielle<\/text><path d=\"M96 30 H24 V92 H104\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"/><circle cx=\"52\" cy=\"61\" r=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"/><path d=\"M96 26 C108 40 88 52 100 62 S92 84 104 96\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"1.4\"/><text x=\"108\" y=\"58\" text-anchor=\"start\" stroke=\"none\" fill=\"#D9824F\" font-weight=\"700\" font-size=\"10\">trait fin<\/text><text x=\"108\" y=\"70\" text-anchor=\"start\" stroke=\"none\" fill=\"#D9824F\" font-weight=\"700\" font-size=\"10\">à main levée<\/text><line x1=\"180\" y1=\"6\" x2=\"180\" y2=\"118\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"2 4\"/><text x=\"262\" y=\"14\" text-anchor=\"middle\" stroke=\"none\" font-weight=\"700\">Détail<\/text><polygon points=\"190,46 236,46 236,52 240,52 240,46 262,46 262,70 240,70 240,64 236,64 236,70 190,70\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" /><circle cx=\"238\" cy=\"49\" r=\"9\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"1.4\"/><text x=\"238\" y=\"36\" text-anchor=\"middle\" stroke=\"none\" fill=\"#D9824F\" font-weight=\"700\">A<\/text><circle cx=\"304\" cy=\"64\" r=\"28\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"1.4\"/><polyline points=\"280,56 298,56 298,74 310,74 310,56 328,56\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"/><text x=\"292\" y=\"108\" text-anchor=\"middle\" stroke=\"none\" fill=\"#D9824F\" font-weight=\"700\" font-size=\"10\">Détail A, agrandi<\/text>\n<\/g>\n<\/svg><p><strong>Exemple.<\/strong> Sur une longue platine, seul le bout percé nous intéresse : on dessine ce bout, et on arrête la vue par un trait fin à main levée.<\/p>\n<h2>Idée 4 · La vue interrompue<\/h2>\n<svg viewBox=\"0 0 340 142\" style=\"width:100%;max-width:440px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Une barre longue de forme constante. Dans la vue interrompue, la partie du milieu est supprimée et les deux bouts sont rapprochés, limités par un trait fin en zigzag.\">\n<g font-family=\"sans-serif\" font-size=\"11\" fill=\"currentColor\" stroke-linejoin=\"round\" stroke-linecap=\"round\">\n<text x=\"170\" y=\"14\" text-anchor=\"middle\" stroke=\"none\" font-size=\"10\">Pièce longue de forme constante<\/text><polygon points=\"20,28 320,28 320,52 20,52\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" /><line x1=\"12\" y1=\"40\" x2=\"328\" y2=\"40\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"10 3 2 3\"/><line x1=\"120\" y1=\"22\" x2=\"120\" y2=\"58\" stroke=\"#D9824F\" stroke-width=\"1.4\" stroke-dasharray=\"3 3\"/><line x1=\"220\" y1=\"22\" x2=\"220\" y2=\"58\" stroke=\"#D9824F\" stroke-width=\"1.4\" stroke-dasharray=\"3 3\"/><text x=\"170\" y=\"70\" text-anchor=\"middle\" stroke=\"none\" fill=\"#D9824F\" font-weight=\"700\" font-size=\"10\">partie supprimée<\/text><text x=\"170\" y=\"96\" text-anchor=\"middle\" stroke=\"none\" font-weight=\"700\">Vue interrompue<\/text><polyline points=\"134,106 80,106 80,130 134,130\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"/><polyline points=\"134,100 134,111.0 129,115.0 139,121.0 134,125.0 134,136\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\"/><polyline points=\"166,106 220,106 220,130 166,130\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"/><polyline points=\"166,100 166,111.0 161,115.0 171,121.0 166,125.0 166,136\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\"/><line x1=\"72\" y1=\"118\" x2=\"228\" y2=\"118\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"10 3 2 3\"/><text x=\"260\" y=\"116\" text-anchor=\"start\" stroke=\"none\" font-size=\"10\">trait fin<\/text><text x=\"260\" y=\"128\" text-anchor=\"start\" stroke=\"none\" font-size=\"10\">en zigzag<\/text><line x1=\"256\" y1=\"118\" x2=\"174\" y2=\"118\" stroke=\"#D9824F\" stroke-width=\"1.2\"/><polygon points=\"174,118 180.3,115.0 180.3,121.0\" fill=\"#D9824F\" stroke=\"#D9824F\" stroke-width=\"1\"/>\n<\/g>\n<\/svg><p>La vue interrompue s&#39;utilise pour les objets <strong>longs<\/strong>, de forme <strong>constante ou répétitive<\/strong>. On supprime une partie intermédiaire pour réduire la longueur du dessin.<\/p>\n<p><strong>Exemple.<\/strong> Une barre ronde de 2 mètres, identique sur toute sa longueur. On dessine les deux extrémités, on supprime le milieu et on rapproche les deux bouts.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Les diapositives ne le précisent pas, mais c&#39;est la règle habituelle : la pièce n&#39;est pas raccourcie pour autant. Si une cote est portée sur une vue interrompue, elle indique la longueur réelle de la pièce.<\/p>\n<\/aside><h2>Idée 5 · Le détail<\/h2>\n<p>Le détail est une <strong>représentation agrandie<\/strong> d&#39;une partie de l&#39;objet (schéma de l&#39;idée 3, à droite). Il montre avec précision sa forme et ses caractéristiques techniques.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Faire un détail<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · Repère la zone trop petite<\/div><p>Par exemple une gorge de 2 mm sur un arbre de 200 mm : à l&#39;échelle du dessin, elle est illisible.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · Entoure-la et nomme-la<\/div><p>Un cercle fin autour de la zone, avec une lettre : A.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · Redessine-la en plus grand<\/div><p>À côté, sous le titre « Détail A », la même zone agrandie. On voit enfin sa forme.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Idée 6 · Limiter une vue<\/h2>\n<p>Une vue partielle ou une vue interrompue s&#39;arrête quelque part. Cette limite se trace de deux façons :<\/p>\n<table>\n<thead>\n<tr>\n<th>Limite<\/th>\n<th>Comment<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Trait fin <strong>à main levée<\/strong><\/td>\n<td>tracé sans instrument<\/td>\n<\/tr>\n<tr>\n<td>Trait continu fin <strong>en zigzag<\/strong><\/td>\n<td>tracé aux instruments<\/td>\n<\/tr>\n<\/tbody><\/table>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Demi-vue : <strong>symétrie<\/strong>. Vue partielle : <strong>une partie<\/strong>. Vue interrompue : <strong>pièce longue<\/strong>. Détail : <strong>agrandissement<\/strong>. Limite : trait fin, à main levée ou en zigzag.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Quatre exercices types<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Une tige filetée de 1,5 m a la même forme sur toute sa longueur. Quelle vue particulière utilises-tu ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Objet long, forme constante.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>La <strong>vue interrompue<\/strong>. On supprime une partie intermédiaire et on limite les deux bouts par un trait fin, à main levée ou en zigzag.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Un couvercle rond est symétrique. Tu veux gagner de la place sur la feuille. Quelle vue particulière utilises-tu ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>La <strong>demi-vue<\/strong> : on ne représente qu&#39;une moitié de la vue.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Un disque de 120 mm de diamètre est représenté en demi-vue. Quel est le rayon, en mm, du demi-disque dessiné ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>La demi-vue s&#39;arrête à l&#39;axe de symétrie.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 60<\/b><\/p><p>60 mm. La demi-vue garde une moitié de la vue : un demi-disque de rayon 120 / 2 = 60 mm.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Quelle est la différence entre une vue partielle et un détail ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>La vue partielle ne montre qu&#39;une partie de la pièce, à la même taille que le reste du dessin, pour simplifier. Le détail montre une partie <strong>agrandie<\/strong>, pour qu&#39;on puisse la lire.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">La demi-vue s&#39;utilise pour un objet :<\/div><button class=\"opt\" data-o=\"0\">très long<\/button><button class=\"opt\" data-o=\"1\">qui présente une symétrie<\/button><button class=\"opt\" data-o=\"2\">trop petit pour être lisible<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">La vue interrompue s&#39;utilise pour :<\/div><button class=\"opt\" data-o=\"0\">un objet long de forme constante ou répétitive<\/button><button class=\"opt\" data-o=\"1\">un objet symétrique<\/button><button class=\"opt\" data-o=\"2\">un objet d&#39;épaisseur constante<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Le détail est :<\/div><button class=\"opt\" data-o=\"0\">une vue réduite de l&#39;ensemble de la pièce<\/button><button class=\"opt\" data-o=\"1\">une vue de la pièce sans ses arêtes cachées<\/button><button class=\"opt\" data-o=\"2\">une représentation agrandie d&#39;une partie de l&#39;objet<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">La vue partielle représente :<\/div><button class=\"opt\" data-o=\"0\">une moitié de la pièce, jusqu&#39;à l&#39;axe de symétrie<\/button><button class=\"opt\" data-o=\"1\">uniquement la partie nécessaire de l&#39;objet<\/button><button class=\"opt\" data-o=\"2\">les deux extrémités de la pièce, sans le milieu<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">La limite d&#39;une vue partielle peut être tracée par :<\/div><button class=\"opt\" data-o=\"0\">un trait continu fort<\/button><button class=\"opt\" data-o=\"1\">un trait fin à main levée<\/button><button class=\"opt\" data-o=\"2\">un trait interrompu fin<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Le trait continu fin en zigzag se trace :<\/div><button class=\"opt\" data-o=\"0\">à main levée<\/button><button class=\"opt\" data-o=\"1\">aux instruments<\/button><button class=\"opt\" data-o=\"2\">uniquement sur les demi-vues<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Lequel n&#39;est PAS une vue particulière citée dans cette partie du cours ?<\/div><button class=\"opt\" data-o=\"0\">la demi-vue<\/button><button class=\"opt\" data-o=\"1\">le détail<\/button><button class=\"opt\" data-o=\"2\">la vue arrière<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Un arbre de 800 mm porte une petite gorge de 2 mm, illisible sur le dessin. La bonne solution est :<\/div><button class=\"opt\" data-o=\"0\">une demi-vue<\/button><button class=\"opt\" data-o=\"1\">une vue interrompue<\/button><button class=\"opt\" data-o=\"2\">un détail<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">On utilise les vues particulières quand :<\/div><button class=\"opt\" data-o=\"0\">on veut dessiner les six vues<\/button><button class=\"opt\" data-o=\"1\">les vues principales ne représentent pas simplement et clairement certaines caractéristiques<\/button><button class=\"opt\" data-o=\"2\">la pièce est dessinée en troisième dièdre<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Dans une vue interrompue, on supprime :<\/div><button class=\"opt\" data-o=\"0\">une moitié de la pièce<\/button><button class=\"opt\" data-o=\"1\">les deux extrémités<\/button><button class=\"opt\" data-o=\"2\">une partie intermédiaire<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"vues-particulieres","rep":null,"tol":null},{"n":"vues-particulieres","rep":null,"tol":null},{"n":"vues-particulieres","rep":null,"tol":null},{"n":"vues-particulieres","rep":["60"],"tol":null},{"n":"vues-particulieres","rep":null,"tol":null}],"qcm":[{"n":"vues-particulieres","q":"La demi-vue s&#39;utilise pour un objet :","o":["très long","qui présente une symétrie","trop petit pour être lisible"],"a":1,"e":"On ne dessine qu&#39;une moitié, l&#39;autre étant identique en miroir."},{"n":"vues-particulieres","q":"La vue interrompue s&#39;utilise pour :","o":["un objet long de forme constante ou répétitive","un objet symétrique","un objet d&#39;épaisseur constante"],"a":0,"e":"On supprime une partie intermédiaire pour réduire la longueur de la représentation."},{"n":"vues-particulieres","q":"Le détail est :","o":["une vue réduite de l&#39;ensemble de la pièce","une vue de la pièce sans ses arêtes cachées","une représentation agrandie d&#39;une partie de l&#39;objet"],"a":2,"e":"Il sert à montrer précisément une zone trop petite à l&#39;échelle du dessin."},{"n":"vues-particulieres","q":"La vue partielle représente :","o":["une moitié de la pièce, jusqu&#39;à l&#39;axe de symétrie","uniquement la partie nécessaire de l&#39;objet","les deux extrémités de la pièce, sans le milieu"],"a":1,"e":"Une moitié : c&#39;est la demi-vue. Les deux bouts sans le milieu : c&#39;est la vue interrompue."},{"n":"vues-particulieres","q":"La limite d&#39;une vue partielle peut être tracée par :","o":["un trait continu fort","un trait fin à main levée","un trait interrompu fin"],"a":1,"e":"Ou par un trait continu fin en zigzag, tracé aux instruments."},{"n":"vues-particulieres","q":"Le trait continu fin en zigzag se trace :","o":["à main levée","aux instruments","uniquement sur les demi-vues"],"a":1,"e":"Le cours distingue le trait fin à main levée et le trait continu fin en zigzag, exécuté aux instruments."},{"n":"vues-particulieres","q":"Lequel n&#39;est PAS une vue particulière citée dans cette partie du cours ?","o":["la demi-vue","le détail","la vue arrière"],"a":2,"e":"Les quatre vues particulières : demi-vue, vue partielle, vue interrompue, détail. La vue arrière est une des six vues principales."},{"n":"vues-particulieres","q":"Un arbre de 800 mm porte une petite gorge de 2 mm, illisible sur le dessin. La bonne solution est :","o":["une demi-vue","une vue interrompue","un détail"],"a":2,"e":"Une zone trop petite se montre agrandie, dans un détail."},{"n":"vues-particulieres","q":"On utilise les vues particulières quand :","o":["on veut dessiner les six vues","les vues principales ne représentent pas simplement et clairement certaines caractéristiques","la pièce est dessinée en troisième dièdre"],"a":1,"e":"Elles simplifient la représentation de certaines géométries."},{"n":"vues-particulieres","q":"Dans une vue interrompue, on supprime :","o":["une moitié de la pièce","les deux extrémités","une partie intermédiaire"],"a":2,"e":"On garde les extrémités et on enlève le milieu, là où la forme ne change pas."}]},{"id":"revision","t":"Fiche de révision et examen blanc","seance":"Avant le contrôle","imp":3,"html":"<h2>1. Tout le chapitre en cinq tableaux<\/h2>\n<h3>La projection<\/h3>\n<table>\n<thead>\n<tr>\n<th>Question<\/th>\n<th>Réponse<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Les lignes de projection sont…<\/td>\n<td>parallèles entre elles, perpendiculaires au plan<\/td>\n<\/tr>\n<tr>\n<td>Le plan de projection est…<\/td>\n<td>derrière l&#39;objet, parallèle à la face observée<\/td>\n<\/tr>\n<tr>\n<td>Les cinq éléments<\/td>\n<td>objet, plan, direction d&#39;observation, lignes de projection, vue<\/td>\n<\/tr>\n<tr>\n<td>Les trois plans principaux<\/td>\n<td>frontal (face), horizontal (dessus), latéral droit (droite)<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h3>La place des vues en premier dièdre<\/h3>\n<svg viewBox=\"0 0 326 244\" style=\"width:100%;max-width:440px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Disposition du premier dièdre : la vue de face au centre, la vue de droite à sa gauche, la vue de gauche à sa droite, la vue de dessus en dessous, la vue de dessous au-dessus, la vue arrière tout à droite.\">\n<g font-family=\"sans-serif\" font-size=\"11\" fill=\"currentColor\" stroke-linejoin=\"round\" stroke-linecap=\"round\">\n<polygon points=\"10,94 58.0,94 58.0,154.0 10,154.0\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" /><line x1=\"10\" y1=\"130.0\" x2=\"58.0\" y2=\"130.0\" stroke=\"currentColor\" stroke-width=\"2.2\"/><polygon points=\"80,154.0 152.0,154.0 152.0,130.0 104.0,130.0 104.0,94 80,94\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2.8\" /><polygon points=\"174,94 222.0,94 222.0,154.0 174,154.0\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" /><line x1=\"174\" y1=\"130.0\" x2=\"222.0\" y2=\"130.0\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\"/><polygon points=\"244,154.0 316.0,154.0 316.0,94 292.0,94 292.0,130.0 244,130.0\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" /><polygon points=\"80,24 152.0,24 152.0,72.0 80,72.0\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" /><line x1=\"104.0\" y1=\"24\" x2=\"104.0\" y2=\"72.0\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\"/><polygon points=\"80,176 152.0,176 152.0,224.0 80,224.0\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" /><line x1=\"104.0\" y1=\"176\" x2=\"104.0\" y2=\"224.0\" stroke=\"currentColor\" stroke-width=\"2.2\"/><text x=\"34\" y=\"167\" text-anchor=\"middle\" stroke=\"none\" font-size=\"10\">vue de droite<\/text><text x=\"116\" y=\"167\" text-anchor=\"middle\" stroke=\"none\" fill=\"#D9824F\" font-weight=\"700\" font-size=\"10\">FACE<\/text><text x=\"198\" y=\"167\" text-anchor=\"middle\" stroke=\"none\" font-size=\"10\">vue de gauche<\/text><text x=\"280\" y=\"167\" text-anchor=\"middle\" stroke=\"none\" font-size=\"10\">vue arrière<\/text><text x=\"116\" y=\"85\" text-anchor=\"middle\" stroke=\"none\" font-size=\"10\">vue de dessous<\/text><text x=\"116\" y=\"237\" text-anchor=\"middle\" stroke=\"none\" font-size=\"10\">vue de dessus<\/text>\n<\/g>\n<\/svg><table>\n<thead>\n<tr>\n<th>Vue<\/th>\n<th>Place par rapport à la vue de face<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Droite<\/td>\n<td>à gauche<\/td>\n<\/tr>\n<tr>\n<td>Gauche<\/td>\n<td>à droite<\/td>\n<\/tr>\n<tr>\n<td>Dessus<\/td>\n<td>au-dessous<\/td>\n<\/tr>\n<tr>\n<td>Dessous<\/td>\n<td>au-dessus<\/td>\n<\/tr>\n<tr>\n<td>Arrière<\/td>\n<td>à droite ou à gauche<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h3>Les correspondances<\/h3>\n<table>\n<thead>\n<tr>\n<th>Vues<\/th>\n<th>Dimension commune<\/th>\n<th>Moyen<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Face et dessus<\/td>\n<td>largeurs<\/td>\n<td>alignement vertical<\/td>\n<\/tr>\n<tr>\n<td>Face et droite<\/td>\n<td>hauteurs<\/td>\n<td>alignement horizontal<\/td>\n<\/tr>\n<tr>\n<td>Dessus et droite<\/td>\n<td>profondeurs<\/td>\n<td>droite à 45°<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h3>Les traits<\/h3>\n<table>\n<thead>\n<tr>\n<th>Élément<\/th>\n<th>Trait<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Arête vue<\/td>\n<td>continu fort<\/td>\n<\/tr>\n<tr>\n<td>Arête cachée<\/td>\n<td>interrompu fin<\/td>\n<\/tr>\n<tr>\n<td>Limite de vue partielle ou interrompue<\/td>\n<td>fin à main levée, ou continu fin en zigzag<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h3>Le nombre de vues et les vues particulières<\/h3>\n<table>\n<thead>\n<tr>\n<th>Situation<\/th>\n<th>Solution<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Objet complexe<\/td>\n<td>3 vues<\/td>\n<\/tr>\n<tr>\n<td>Objet relativement simple<\/td>\n<td>2 vues<\/td>\n<\/tr>\n<tr>\n<td>Objet simple, symétrique ou d&#39;épaisseur constante<\/td>\n<td>1 vue<\/td>\n<\/tr>\n<tr>\n<td>Objet symétrique<\/td>\n<td>demi-vue<\/td>\n<\/tr>\n<tr>\n<td>Une seule partie utile<\/td>\n<td>vue partielle<\/td>\n<\/tr>\n<tr>\n<td>Objet long de forme constante<\/td>\n<td>vue interrompue<\/td>\n<\/tr>\n<tr>\n<td>Zone trop petite<\/td>\n<td>détail<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h2>2. Les huit pièges qui coûtent des points<\/h2>\n<ol>\n<li>Placer la vue de droite à droite. En premier dièdre, elle est <strong>à gauche<\/strong>.<\/li>\n<li>Placer la vue de dessus en haut. Elle est <strong>sous<\/strong> la vue de face.<\/li>\n<li>Écrire le nom des vues sur le dessin. On ne l&#39;écrit <strong>jamais<\/strong>.<\/li>\n<li>Faire partir la droite à 45° du coin de la vue de face. Elle part du <strong>point O<\/strong>, entre les vues.<\/li>\n<li>Décaler une vue : les hauteurs ou les largeurs ne correspondent plus.<\/li>\n<li>Dessiner une arête cachée en trait fort, ou l&#39;oublier.<\/li>\n<li>Ajouter des vues redondantes. L&#39;objectif est le <strong>minimum<\/strong> de vues.<\/li>\n<li>Confondre vue partielle (un morceau) et vue interrompue (les deux bouts, sans le milieu).<\/li>\n<\/ol>\n<h2>3. Examen blanc (45 minutes)<\/h2>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le format et le barème du vrai contrôle ne figurent pas dans les diapositives. Cet examen blanc est construit par nous à partir du contenu du chapitre : il t&#39;entraîne, il ne prédit pas le sujet.<\/p>\n<\/aside><section class=\"exo\"><h3>Partie A · Questions de cours (8 points)<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Définis la projection orthogonale et cite ses cinq éléments. (2 points)<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Méthode de représentation d&#39;un objet tridimensionnel sur un plan : les points de l&#39;objet sont projetés suivant des droites parallèles entre elles et perpendiculaires au plan de projection. Les cinq éléments : l&#39;objet, le plan de projection, la direction d&#39;observation, les lignes de projection, la vue.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Donne la place des vues de droite, de gauche, de dessus et de dessous en premier dièdre. (2 points)<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Vue de droite : à gauche de la vue de face. Vue de gauche : à droite. Vue de dessus : au-dessous. Vue de dessous : au-dessus.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Énonce les trois règles de correspondance entre les vues de face, de dessus et de droite. (2 points)<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Face et dessus : on conserve les largeurs. Face et droite : on conserve les hauteurs. Dessus et droite : on transfère les profondeurs à l&#39;aide de la droite à 45°.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Cite les quatre vues particulières et le cas d&#39;emploi de chacune. (2 points)<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Demi-vue : objet symétrique. Vue partielle : seule une partie est nécessaire. Vue interrompue : objet long de forme constante ou répétitive. Détail : agrandissement d&#39;une petite zone.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Partie B · La pièce en L (8 points)<\/h3><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>La pièce en L du module mesure 60 mm de large, 40 mm de profondeur et 50 mm de haut. Son montant, à gauche, fait 20 mm de large. Sa semelle fait 20 mm de haut. Dans quel rectangle (largeur × hauteur) s&#39;inscrit sa vue de face ? Donne la largeur en mm.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 60<\/b><\/p><p>La vue de face s&#39;inscrit dans un rectangle de <strong>60 × 50<\/strong>. On y voit le profil en L.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>Dans la vue de dessus, une arête verticale sépare le dessus du montant et le dessus de la semelle. À quelle distance du bord gauche se trouve-t-elle, en mm ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>Face et dessus partagent les largeurs.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 20<\/b><\/p><p>À 20 mm : c&#39;est la largeur du montant, reportée depuis la vue de face par une ligne de rappel verticale.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><p>Dans la vue de gauche, à quelle hauteur, en mm, se trouve le trait qui représente l&#39;arête de la marche ? Est-il continu ou interrompu ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>Face et vue de côté partagent les hauteurs. Que voit-on en premier depuis la gauche ?<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 20<\/b><\/p><p>À 20 mm de hauteur, la hauteur de la semelle. Le trait est <strong>interrompu fin<\/strong> : depuis la gauche, le montant cache la marche.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"7\"><div class=\"ex-q\"><p>Tu ne peux garder que deux vues. Lesquelles choisis-tu ? Justifie.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>La vue de face, la plus représentative, car elle montre le L. Et la vue de droite : elle donne la profondeur sans aucune arête cachée. La vue de gauche donnerait la même information avec un trait interrompu en plus.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Partie C · Choisir la bonne représentation (4 points)<\/h3><div class=\"ex\" data-x=\"8\"><div class=\"ex-q\"><p>Une cornière en acier de 3 m de long a la même section d&#39;un bout à l&#39;autre. Comment la représenter sur une feuille A4 sans réduire l&#39;échelle ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Par une <strong>vue interrompue<\/strong> : on supprime une partie intermédiaire et on limite les deux bouts par un trait fin à main levée ou en zigzag.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"9\"><div class=\"ex-q\"><p>Un joint plat circulaire, d&#39;épaisseur 2 mm, percé au centre. Combien de vues, et pourquoi ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1<\/b><\/p><p>Une seule vue, avec l&#39;indication de l&#39;épaisseur : c&#39;est un objet d&#39;épaisseur constante. Comme il est symétrique, une demi-vue est même possible.<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM de synthèse<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">En premier dièdre, quelle vue se trouve sous la vue de face ?<\/div><button class=\"opt\" data-o=\"0\">la vue de dessous<\/button><button class=\"opt\" data-o=\"1\">la vue de dessus<\/button><button class=\"opt\" data-o=\"2\">la vue arrière<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Les trois vues de face, de dessus et de droite doivent :<\/div><button class=\"opt\" data-o=\"0\">avoir toutes la même taille<\/button><button class=\"opt\" data-o=\"1\">représenter le même objet et respecter les correspondances géométriques<\/button><button class=\"opt\" data-o=\"2\">être séparées par exactement 10 mm<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Une pièce fait 90 de large, 20 de profondeur et 35 de haut. Sa vue de dessus s&#39;inscrit dans un rectangle de :<\/div><button class=\"opt\" data-o=\"0\">90 × 35<\/button><button class=\"opt\" data-o=\"1\">90 × 20<\/button><button class=\"opt\" data-o=\"2\">20 × 35<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Quelle paire de vues partage les profondeurs ?<\/div><button class=\"opt\" data-o=\"0\">face et dessus<\/button><button class=\"opt\" data-o=\"1\">face et droite<\/button><button class=\"opt\" data-o=\"2\">dessus et droite<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Le plan latéral droit du cube de projection donne :<\/div><button class=\"opt\" data-o=\"0\">la vue de droite<\/button><button class=\"opt\" data-o=\"1\">la vue de gauche<\/button><button class=\"opt\" data-o=\"2\">la vue de dessus<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Un trait interrompu fin représente :<\/div><button class=\"opt\" data-o=\"0\">un axe de symétrie<\/button><button class=\"opt\" data-o=\"1\">une arête cachée<\/button><button class=\"opt\" data-o=\"2\">la limite d&#39;une vue partielle<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Un objet relativement simple se définit en général avec :<\/div><button class=\"opt\" data-o=\"0\">une vue<\/button><button class=\"opt\" data-o=\"1\">deux vues<\/button><button class=\"opt\" data-o=\"2\">six vues<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Pour une pièce longue dont la forme se répète, on utilise :<\/div><button class=\"opt\" data-o=\"0\">le détail<\/button><button class=\"opt\" data-o=\"1\">la demi-vue<\/button><button class=\"opt\" data-o=\"2\">la vue interrompue<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Lequel de ces tracés est correct en premier dièdre ?<\/div><button class=\"opt\" data-o=\"0\">vue de gauche à gauche de la face, vue de dessus au-dessus<\/button><button class=\"opt\" data-o=\"1\">vue de gauche à droite de la face, vue de dessus au-dessous<\/button><button class=\"opt\" data-o=\"2\">vue de gauche à droite de la face, vue de dessus au-dessus<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Que permet la projection orthogonale, selon le bilan du cours ?<\/div><button class=\"opt\" data-o=\"0\">représenter précisément un objet en deux dimensions<\/button><button class=\"opt\" data-o=\"1\">représenter un objet tel que l&#39;œil le voit, avec la perspective<\/button><button class=\"opt\" data-o=\"2\">représenter un objet sans avoir besoin de plusieurs vues<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"revision","rep":null,"tol":null},{"n":"revision","rep":null,"tol":null},{"n":"revision","rep":null,"tol":null},{"n":"revision","rep":null,"tol":null},{"n":"revision","rep":["60"],"tol":null},{"n":"revision","rep":["20"],"tol":null},{"n":"revision","rep":["20"],"tol":null},{"n":"revision","rep":null,"tol":null},{"n":"revision","rep":null,"tol":null},{"n":"revision","rep":["1"],"tol":null}],"qcm":[{"n":"revision","q":"En premier dièdre, quelle vue se trouve sous la vue de face ?","o":["la vue de dessous","la vue de dessus","la vue arrière"],"a":1,"e":"Ce qu&#39;on voit d&#39;en haut se dessine en bas."},{"n":"revision","q":"Les trois vues de face, de dessus et de droite doivent :","o":["avoir toutes la même taille","représenter le même objet et respecter les correspondances géométriques","être séparées par exactement 10 mm"],"a":1,"e":"C&#39;est la phrase finale du bilan. L&#39;espace entre les vues, lui, s&#39;adapte à la mise en page."},{"n":"revision","q":"Une pièce fait 90 de large, 20 de profondeur et 35 de haut. Sa vue de dessus s&#39;inscrit dans un rectangle de :","o":["90 × 35","90 × 20","20 × 35"],"a":1,"e":"La vue de dessus montre la largeur et la profondeur."},{"n":"revision","q":"Quelle paire de vues partage les profondeurs ?","o":["face et dessus","face et droite","dessus et droite"],"a":2,"e":"Et c&#39;est pour cette paire qu&#39;on a besoin de la droite à 45°."},{"n":"revision","q":"Le plan latéral droit du cube de projection donne :","o":["la vue de droite","la vue de gauche","la vue de dessus"],"a":0,"e":"L&#39;observateur regarde l&#39;objet depuis la droite : on obtient la vue de droite."},{"n":"revision","q":"Un trait interrompu fin représente :","o":["un axe de symétrie","une arête cachée","la limite d&#39;une vue partielle"],"a":1,"e":"La limite d&#39;une vue se trace en trait fin à main levée ou en zigzag."},{"n":"revision","q":"Un objet relativement simple se définit en général avec :","o":["une vue","deux vues","six vues"],"a":1,"e":"3 vues : complexe. 2 vues : relativement simple. 1 vue : simple, symétrique ou d&#39;épaisseur constante."},{"n":"revision","q":"Pour une pièce longue dont la forme se répète, on utilise :","o":["le détail","la demi-vue","la vue interrompue"],"a":2,"e":"On supprime une partie intermédiaire pour réduire la longueur du dessin."},{"n":"revision","q":"Lequel de ces tracés est correct en premier dièdre ?","o":["vue de gauche à gauche de la face, vue de dessus au-dessus","vue de gauche à droite de la face, vue de dessus au-dessous","vue de gauche à droite de la face, vue de dessus au-dessus"],"a":1,"e":"Gauche à droite, dessus en bas : toujours du côté opposé."},{"n":"revision","q":"Que permet la projection orthogonale, selon le bilan du cours ?","o":["représenter précisément un objet en deux dimensions","représenter un objet tel que l&#39;œil le voit, avec la perspective","représenter un objet sans avoir besoin de plusieurs vues"],"a":0,"e":"Elle est précise parce qu&#39;elle ne déforme pas. Mais il faut souvent plusieurs vues, complémentaires."}]}];
const NOTIONS=[{"id":"projection-orthogonale","t":"La projection orthogonale et le cube de projection","imp":4,"ch":"projection-orthogonale"},{"id":"disposition-vues","t":"Disposition des vues · le premier dièdre","imp":5,"ch":"disposition-vues"},{"id":"correspondances","t":"Correspondances entre les vues et droite à 45°","imp":5,"ch":"correspondances"},{"id":"choix-vues","t":"Choisir les vues · lesquelles et combien","imp":4,"ch":"choix-vues"},{"id":"vues-particulieres","t":"Vues particulières · demi-vue, vue partielle, vue interrompue, détail","imp":4,"ch":"vues-particulieres"},{"id":"revision","t":"Fiche de révision et examen blanc","imp":3,"ch":"revision"}];
const CARTES=[{"n":"projection-orthogonale","k":0,"ch":"projection-orthogonale","q":"<p>Définition de la projection orthogonale<\/p>\n","r":"<p>Méthode qui représente un objet en trois dimensions sur un plan, par des lignes de projection parallèles entre elles et perpendiculaires au plan.<\/p>\n"},{"n":"projection-orthogonale","k":1,"ch":"projection-orthogonale","q":"<p>Les cinq éléments d&#39;une projection orthogonale<\/p>\n","r":"<p>Objet, plan de projection, direction d&#39;observation, lignes de projection, vue.<\/p>\n"},{"n":"projection-orthogonale","k":2,"ch":"projection-orthogonale","q":"<p>Où se trouve le plan de projection par rapport à l&#39;objet ?<\/p>\n","r":"<p>Derrière l&#39;objet, parallèle à la face observée.<\/p>\n"},{"n":"projection-orthogonale","k":3,"ch":"projection-orthogonale","q":"<p>Les six vues<\/p>\n","r":"<p>Face, dessus, dessous, droite, gauche, arrière.<\/p>\n"},{"n":"projection-orthogonale","k":4,"ch":"projection-orthogonale","q":"<p>Quelle vue est la vue principale ?<\/p>\n","r":"<p>La vue de face, en général.<\/p>\n"},{"n":"projection-orthogonale","k":5,"ch":"projection-orthogonale","q":"<p>Les trois plans principaux et leurs vues<\/p>\n","r":"<p>Plan frontal : vue de face. Plan horizontal : vue de dessus. Plan latéral droit : vue de droite.<\/p>\n"},{"n":"projection-orthogonale","k":6,"ch":"projection-orthogonale","q":"<p>À quoi sert le rabattement des faces du cube ?<\/p>\n","r":"<p>À ramener toutes les vues dans un même plan, celui de la feuille.<\/p>\n"},{"n":"projection-orthogonale","k":7,"ch":"projection-orthogonale","q":"<p>Combien de dimensions montre une vue ?<\/p>\n","r":"<p>Deux sur trois. Il faut donc souvent plusieurs vues, qui se complètent.<\/p>\n"},{"n":"disposition-vues","k":8,"ch":"disposition-vues","q":"<p>Qu&#39;est-ce que le dépliage du cube de projection ?<\/p>\n","r":"<p>Le rabattement des faces du cube autour de leurs arêtes, pour ramener toutes les vues dans un même plan.<\/p>\n"},{"n":"disposition-vues","k":9,"ch":"disposition-vues","q":"<p>Premier dièdre : où va la vue de droite ?<\/p>\n","r":"<p>À gauche de la vue de face.<\/p>\n"},{"n":"disposition-vues","k":10,"ch":"disposition-vues","q":"<p>Premier dièdre : où va la vue de gauche ?<\/p>\n","r":"<p>À droite de la vue de face.<\/p>\n"},{"n":"disposition-vues","k":11,"ch":"disposition-vues","q":"<p>Premier dièdre : où va la vue de dessus ?<\/p>\n","r":"<p>Au-dessous de la vue de face.<\/p>\n"},{"n":"disposition-vues","k":12,"ch":"disposition-vues","q":"<p>Premier dièdre : où va la vue de dessous ?<\/p>\n","r":"<p>Au-dessus de la vue de face.<\/p>\n"},{"n":"disposition-vues","k":13,"ch":"disposition-vues","q":"<p>Où se place la vue arrière ?<\/p>\n","r":"<p>À droite ou à gauche, selon la disposition choisie.<\/p>\n"},{"n":"disposition-vues","k":14,"ch":"disposition-vues","q":"<p>Autre nom du premier dièdre ? Du troisième ?<\/p>\n","r":"<p>Premier dièdre : méthode européenne. Troisième dièdre : méthode américaine.<\/p>\n"},{"n":"disposition-vues","k":15,"ch":"disposition-vues","q":"<p>Faut-il écrire le nom des vues sur un dessin ?<\/p>\n","r":"<p>Non, jamais.<\/p>\n"},{"n":"correspondances","k":16,"ch":"correspondances","q":"<p>Quelles vues sont alignées horizontalement ?<\/p>\n","r":"<p>Face, gauche, droite et arrière.<\/p>\n"},{"n":"correspondances","k":17,"ch":"correspondances","q":"<p>Quelles vues sont alignées verticalement ?<\/p>\n","r":"<p>Face, dessus et dessous.<\/p>\n"},{"n":"correspondances","k":18,"ch":"correspondances","q":"<p>Que partagent la vue de face et la vue de dessus ?<\/p>\n","r":"<p>Les largeurs.<\/p>\n"},{"n":"correspondances","k":19,"ch":"correspondances","q":"<p>Que partagent la vue de face et la vue de droite ?<\/p>\n","r":"<p>Les hauteurs.<\/p>\n"},{"n":"correspondances","k":20,"ch":"correspondances","q":"<p>Que partagent la vue de dessus et la vue de droite ?<\/p>\n","r":"<p>Les profondeurs, transférées par la droite à 45°.<\/p>\n"},{"n":"correspondances","k":21,"ch":"correspondances","q":"<p>À quoi sert la droite à 45° ?<\/p>\n","r":"<p>À transférer la profondeur entre la vue de dessus et la vue de côté, sans remesurer, en gardant les vues cohérentes.<\/p>\n"},{"n":"correspondances","k":22,"ch":"correspondances","q":"<p>D&#39;où part la droite à 45° ?<\/p>\n","r":"<p>Du point O, à l&#39;intersection des axes entre les vues. Jamais du coin de la vue de face.<\/p>\n"},{"n":"correspondances","k":23,"ch":"correspondances","q":"<p>Trait d&#39;une arête vue ? D&#39;une arête cachée ?<\/p>\n","r":"<p>Arête vue : trait continu fort. Arête cachée : trait interrompu fin.<\/p>\n"},{"n":"correspondances","k":24,"ch":"correspondances","q":"<p>Les trois erreurs de représentation du cours<\/p>\n","r":"<p>Vues mal placées, non-correspondance des vues, hauteur non respectée.<\/p>\n"},{"n":"choix-vues","k":25,"ch":"choix-vues","q":"<p>Objectif du choix des vues<\/p>\n","r":"<p>Définir complètement l&#39;objet avec le minimum de vues.<\/p>\n"},{"n":"choix-vues","k":26,"ch":"choix-vues","q":"<p>Comment choisir la vue de face ?<\/p>\n","r":"<p>On prend la vue la plus représentative de l&#39;objet.<\/p>\n"},{"n":"choix-vues","k":27,"ch":"choix-vues","q":"<p>Les quatre critères de choix des vues<\/p>\n","r":"<p>Vue de face la plus représentative, vues qui montrent le mieux les formes, limiter les arêtes cachées, supprimer les vues inutiles ou redondantes.<\/p>\n"},{"n":"choix-vues","k":28,"ch":"choix-vues","q":"<p>Quand trois vues ?<\/p>\n","r":"<p>Pour définir un objet complexe.<\/p>\n"},{"n":"choix-vues","k":29,"ch":"choix-vues","q":"<p>Quand deux vues ?<\/p>\n","r":"<p>Pour un objet relativement simple.<\/p>\n"},{"n":"choix-vues","k":30,"ch":"choix-vues","q":"<p>Quand une seule vue ?<\/p>\n","r":"<p>Pour un objet simple, symétrique ou d&#39;épaisseur constante.<\/p>\n"},{"n":"choix-vues","k":31,"ch":"choix-vues","q":"<p>Que doit apporter chaque vue ?<\/p>\n","r":"<p>Une information complémentaire.<\/p>\n"},{"n":"choix-vues","k":32,"ch":"choix-vues","q":"<p>Les vues com       if (code !== null) { code.push(raw); return; }
      let m;
      if (/^\s*\|.*\|\s*$/.test(raw)) { if (list) { out.push('</' + list + '>'); list = null; } (tab = tab || []).push(raw); return; }
      flushTab();
      if ((m = raw.match(/^\s*#{1,6}\s+(.*)$/))) { flush(); olN = 0; out.push('<p><strong>' + inl(m[1]) + '</strong></p>'); }
      else if ((m = raw.match(/^\s*[-*•]\s+(.*)$/))) { if (list !== 'ul') { flush(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + inl(m[1]) + '</li>'); }
      else if ((m = raw.match(/^\s*(\d+)[.)]\s+(.*)$/))) { if (list !== 'ol') { flush(); const n = +m[1]; olN = (n === 1 && olN > 1) ? olN : n; out.push('<ol start="' + olN + '">'); list = 'ol'; } out.push('<li>' + inl(m[2]) + '</li>'); olN++; }
      else if (!raw.trim()) flush();
      else { flush(); out.push('<p>' + inl(raw) + '</p>'); }
    });
    if (code !== null) out.push('<pre>' + esc(code.join('\n')) + '</pre>');
    flush(); return rendreMaths(out.join(''));
  };

  // ---------- MathJax : celui de la page s'il existe, sinon chargé à la première formule ----------
  let mjPret = null;
  const mathjax = () => mjPret || (mjPret = new Promise((ok, ko) => {
    if (!window.MathJax) {
      window.MathJax = { svg: { fontCache: 'global' }, startup: { typeset: false } };
      const s = document.createElement('script'); s.async = true; s.src = 'https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js';
      s.onerror = () => ko(new Error('MathJax')); document.head.appendChild(s);
    }
    let n = 0; const t = setInterval(() => {
      if (window.MathJax && MathJax.tex2svgPromise && MathJax.startup && MathJax.startup.promise) { clearInterval(t); MathJax.startup.promise.then(ok, ko); }
      else if (++n > 150) { clearInterval(t); ko(new Error('MathJax')); }
    }, 100);
  })).catch((e) => { mjPret = null; throw e; });
  const svgCache = new Map(); let file = Promise.resolve();
  // tex2svg ne pose ni la feuille de style MathJax ni le cache des glyphes (police « global ») : sans eux, les glyphes sont invisibles,
  // seuls les caractères hors police (é, ô…) s'affichent en flottant, et le MathML d'accessibilité apparaît en clair. updateDocument les ajoute une fois.
  const pagePrete = () => { try { MathJax.startup.document.updateDocument(); } catch (e) {} };
  function dessinerMaths(racine) {
    const spans = [...racine.querySelectorAll('.mzt-tex:not([data-ok])')]; if (!spans.length) return;
    mathjax().then(() => spans.forEach((sp) => {
      const cle = sp.dataset.d + '|' + sp.textContent;
      const poser = (n) => { if (!sp.isConnected || sp.dataset.ok) return; sp.textContent = ''; sp.appendChild(n.cloneNode(true)); sp.dataset.ok = '1'; };
      if (svgCache.has(cle)) return poser(svgCache.get(cle));
      file = file.then(() => MathJax.tex2svgPromise(sp.textContent, { display: sp.dataset.d === '1' }).then((n) => { svgCache.set(cle, n); poser(n); pagePrete(); })).catch(() => {});
    })).catch(() => {});
  }
  async function ask(q, deep) {
    q = (q || '').trim(); deep = deep || $('#mztDeep').checked;
    if (busy || !q) return; if (!sample) { note(); return; }
    const c = refreshCtx();
    if (!cur || (cur.sec !== c.label && !forced)) { cur = { id: 't' + Date.now().toString(36), sec: c.label, date: today(), title: q.slice(0, 80), msgs: [] }; ST.threads.push(cur); }
    else if (!ST.threads.includes(cur)) ST.threads.push(cur);
    cur.msgs.push({ r: 'u', t: q }); busy = true; renderLog();
    const out = document.createElement('div'); out.className = 'mzt-m a'; out.textContent = deep ? 'Réflexion approfondie…' : 'Réflexion…'; $('#mztLog').appendChild(out);
    $('#mztSend').disabled = true; $('#mztStop').hidden = false;
    const style = deep
      ? 'Réponse APPROFONDIE (400 à 700 mots) : 1) l\'intuition avec une analogie, 2) l\'explication détaillée pas à pas, 3) pourquoi ça marche, 4) un exemple complet chiffré, 5) les pièges fréquents et ce qui tombe à l\'examen, 6) une question pour vérifier la compréhension.'
      : 'Réponse EXPLICATIVE (150 à 250 mots) : 1) l\'idée en une phrase, 2) l\'explication pas à pas, 3) un petit exemple chiffré ou concret, 4) une courte question pour vérifier la compréhension.';
    const mem = [];
    if (ST.memos.length) mem.push('DIFFICULTÉS DÉJÀ REPÉRÉES :\n' + ST.memos.slice(-12).map((m) => `- ${m.date} : ${m.text}`).join('\n'));
    const lastQ = ST.threads.flatMap((t) => t.msgs.filter((m) => m.r === 'u').map((m) => `[${t.sec}] ${m.t.slice(0, 100)}`)).slice(-6);
    if (lastQ.length) mem.push('SES DERNIÈRES QUESTIONS :\n' + lastQ.map((x) => '- ' + x).join('\n'));
    const rules = `Tu es le tuteur de ${C.student}, pour le module ${C.module}${C.prof ? ' du ' + C.prof : ''}. Il apprend souvent la notion pour la première fois.
Règles : réponds en français simple, en Markdown léger (**gras** pour les termes clés, tirets, étapes numérotées). Toute formule ou tout calcul s'écrit en LaTeX : $…$ dans la phrase, $$…$$ seul sur sa ligne pour une formule importante (ex. $\\hat y_i$, $$\\text{MSE}=\\frac{1}{n}\\sum_{i=1}^{n}(y_i-\\hat y_i)^2$$) ; jamais d'accents graves pour une formule, ils sont réservés au code et aux noms de fonctions. Un petit tableau Markdown est permis s'il clarifie (3 colonnes maximum, l'écran est étroit). ${style} Appuie-toi d'abord sur l'EXTRAIT ci-dessous et sur les conventions du prof ; si une source générale diffère du cours, signale l'écart et dis quelle version utiliser à l'examen (celle du prof). Pour un calcul, pose chaque étape et vérifie-la. S'il envoie une réponse ou une photo de brouillon, corrige étape par étape et nomme précisément l'erreur. Si tu n'es pas sûr, dis-le. S'il demande un mini-exercice, donne l'exercice sans la solution.
Utilise sa mémoire pour faire des liens avec ses confusions passées, sans la réciter.
Termine TOUJOURS par une dernière ligne séparée au format exact « MÉMO: … » qui résume en 15 mots maximum la difficulté révélée par sa question (ou « MÉMO: rien »). Cette ligne lui est cachée.
${C.conventions ? 'CONVENTIONS DU PROF : ' + C.conventions + '\n' : ''}MÉMOIRE DE L'ÉLÈVE :
${mem.join('\n\n') || '(rien pour l\'instant)'}
EXTRAIT (${c.label}) :
${c.text.slice(0, deep ? 9000 : 3500)}`;
    const recent = cur.msgs.slice(deep ? -9 : -5, -1).map((m) => ({ role: m.r === 'u' ? 'user' : 'assistant', content: m.t }));
    while (recent.length && recent[0].role !== 'user') recent.shift();
    const msgs = [...recent.filter((m) => m.content && m.content.trim()), { role: 'user', content: q }]; while (msgs.length > 1 && msgs[0].role !== 'user') msgs.shift(); msgs[0] = { role: 'user', content: rules + '\n\n---\nQuestion : ' + msgs[0].content };
    ctl = new AbortController();
    const opts = { modelTier: deep ? 'complex' : 'quick', cache: false, signal: ctl.signal, onText: ({ text }) => { out.innerHTML = md(visible(text)); dessinerMaths(out); $('#mztLog').scrollTop = 1e9; } };
    if (img) opts.images = [img];
    try {
      const r = await sample(msgs, opts);
      const mm = r.text.match(/(?:^|\n)\s*M[ÉE]MO\s*:\s*(.+)\s*$/i);
      cur.msgs.push({ r: 'a', t: visible(r.text) + (r.truncated ? '\n\n(Réponse coupée : pose une question plus ciblée.)' : ''), d: !!deep });
      if (mm && !/^\s*rien/i.test(mm[1])) { ST.memos.push({ date: today(), text: mm[1].trim().slice(0, 160) }); if (ST.memos.length > 30) ST.memos.shift(); saveMemos(); }
      await saveThread(cur);
    } catch (e) {
      const kept = e && e.text ? visible(e.text) : '';
      if (e && e.code === 'cancelled') { if (kept) cur.msgs.push({ r: 'a', t: kept + '\n(Arrêté.)' }); else cur.msgs.pop(); }
      else { cur.msgs.pop(); compacter(!!cur.msgs.length); out.textContent = (kept ? kept + '\n\n' : '') + (ERR[e && e.code] || 'Le tuteur n\'a pas pu répondre. Réessaie dans un instant.'); }
      if (!cur.msgs.length) ST.threads = ST.threads.filter((t) => t !== cur);
      saveLocal();
      if (!(e && e.code === 'cancelled')) { busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImgN').textContent = ''; return; }
    }
    busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImg').value = ''; $('#mztImgN').textContent = ''; renderLog();
  }

  // ---------- événements ----------
  $('#mztBtn').onclick = () => openPanel(null);
  $('#mztX').onclick = closePanel;
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#mztPan').hidden) closePanel(); });
  $('#mztTabH').onclick = () => view($('#mztHist').hidden ? 'hist' : 'chat');
  $('#mztTabM').onclick = () => view($('#mztMem').hidden ? 'mem' : 'chat');
  $('#mztQ').oninput = renderList;
  $('#mztList').onclick = (e) => { const id = e.target.dataset && e.target.dataset.cont; if (!id) return; cur = ST.threads.find((t) => t.id === id); view('chat'); $('#mztCtx').textContent = '· ' + cur.sec; renderLog(); };
  $('#mztMemL').onclick = (e) => { const i = e.target.dataset && e.target.dataset.memdel; if (i == null) return; ST.memos.splice(+i, 1); saveMemos(); renderMem(); };
  $('#mztChips').onclick = (e) => { const b = e.target.closest('[data-chip]'); if (!b) return; const t = $('#mztIn'); t.value = b.dataset.chip + (t.value ? ' : ' + t.value : ''); t.focus(); };
  $('#mztNew').onclick = () => { cur = null; renderLog(); };
  $('#mztStop').onclick = () => { if (ctl) ctl.abort(); };
  $('#mztImg').onchange = (e) => { img = e.target.files[0] || null; $('#mztImgN').textContent = img ? 'Photo : ' + img.name : ''; };
  $('#mztF').onsubmit = (e) => { e.preventDefault(); const v = $('#mztIn').value; $('#mztIn').value = ''; ask(v); };
  $('#mztIn').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#mztF').requestSubmit(); } });

  // ---------- capacités (facultatives) ----------
  const W = window.claude;
  if (W && W.use) {
    W.use('sample').then((s) => { sample = s; ready = true; note();
      if (s && s.limits) s.limits().then((l) => { if (l && l.images) { imgOK = true; $('#mztImgL').hidden = false; if (l.images.mediaTypes) $('#mztImg').accept = l.images.mediaTypes.join(','); } }).catch(() => {});
    }).catch(() => { ready = true; note(); });
    Promise.all([W.use('db'), W.use('user')]).then(async ([d, u]) => {
      if (!d || !u) return; const id = await u.id(); if (!id) return; db = d; base = 'data/users/' + id + '/mzt_' + C.id;
      try {
        const m = await db.doc(base).get(); if (m.exists) { const v = m.data() || {}; if (Array.isArray(v.memos)) ST.memos = JSON.parse(JSON.stringify(v.memos)); }
        const q = await db.collection(base + '/threads').get(); const remote = q.docs.map((x) => Object.assign({ id: x.id }, JSON.parse(JSON.stringify(x.data() || {}))));
        const map = {}; [...ST.threads, ...remote].forEach((t) => { if (!map[t.id] || (t.msgs || []).length > (map[t.id].msgs || []).length) map[t.id] = t; });
        ST.threads = Object.values(map).sort((a, b) => parseInt(a.id.slice(1), 36) - parseInt(b.id.slice(1), 36)); saveLocal();
      } catch (e) {}
    }).catch(() => {});
  } else { ready = true; note(); }

  window.MZT = { open: openPanel, close: closePanel };
})();

</script>

if(window.top===window&&location.protocol==="file:"){a.hidden=true;return}
a.href=p.indexOf("/decouvrir")===0||location.pathname.indexOf("/decouvrir")===0?"/decouvrir":"/app/modules";})();</script>
