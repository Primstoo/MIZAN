rger<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Pour $u_n = \\dfrac{n}{n+1}$, $u_{n+1} - u_n$ vaut $\\dfrac{1}{(n+1)(n+2)}$. La suite est donc :<\/div><button class=\"opt\" data-o=\"0\">croissante<\/button><button class=\"opt\" data-o=\"1\">décroissante<\/button><button class=\"opt\" data-o=\"2\">constante<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Le théorème de Bolzano-Weierstrass affirme que toute suite bornée :<\/div><button class=\"opt\" data-o=\"0\">converge<\/button><button class=\"opt\" data-o=\"1\">admet une sous-suite convergente<\/button><button class=\"opt\" data-o=\"2\">est monotone<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Pour $u_0 = 0$ et $u_{n+1} = \\sqrt{u_n + 2}$, la limite est :<\/div><button class=\"opt\" data-o=\"0\">$-1$<\/button><button class=\"opt\" data-o=\"1\">$2$<\/button><button class=\"opt\" data-o=\"2\">$\\sqrt2$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Une suite décroissante et minorée converge vers :<\/div><button class=\"opt\" data-o=\"0\">son premier terme<\/button><button class=\"opt\" data-o=\"1\">la borne inférieure de ses termes<\/button><button class=\"opt\" data-o=\"2\">n&#39;importe lequel de ses minorants<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"suites-monotones","rep":null,"tol":null},{"n":"suites-monotones","rep":null,"tol":null},{"n":"suites-monotones","rep":null,"tol":null},{"n":"suites-monotones","rep":null,"tol":null}],"qcm":[{"n":"suites-monotones","q":"Une suite croissante et majorée :","o":["converge","tend vers $+\\infty$","peut ne pas avoir de limite"],"a":0,"e":"C&#39;est le théorème de la limite monotone."},{"n":"suites-monotones","q":"$(u_n)$ est croissante et majorée par 5. Sa limite $\\ell$ vérifie :","o":["$\\ell = 5$","$\\ell \\le 5$","$\\ell &gt; 5$"],"a":1,"e":"La limite est la borne supérieure des termes, qui ne dépasse aucun majorant."},{"n":"suites-monotones","q":"Une suite croissante et non majorée :","o":["converge","tend vers $+\\infty$","est bornée"],"a":1,"e":"Elle dépasse toute barre, et comme elle monte, elle reste au-dessus."},{"n":"suites-monotones","q":"Pour que $(u_n)$ et $(v_n)$ soient adjacentes, il faut :","o":["qu&#39;elles soient toutes les deux croissantes","l&#39;une croissante, l&#39;autre décroissante, et $v_n - u_n \\to 0$","qu&#39;elles aient la même limite"],"a":1,"e":"Avoir la même limite est la conclusion, pas la définition."},{"n":"suites-monotones","q":"On sait que $u_{2n} \\to 1$ et $u_{2n+1} \\to -1$. Alors $(u_n)$ :","o":["converge vers 0","converge vers 1","diverge"],"a":2,"e":"Si elle convergeait, toutes ses sous-suites auraient la même limite."},{"n":"suites-monotones","q":"Si $u_n \\to \\ell$, alors la sous-suite $(u_{2n})$ :","o":["tend vers $\\ell$","tend vers $2\\ell$","peut diverger"],"a":0,"e":"Toute sous-suite d&#39;une suite convergente a la même limite."},{"n":"suites-monotones","q":"Pour $u_n = \\dfrac{n}{n+1}$, $u_{n+1} - u_n$ vaut $\\dfrac{1}{(n+1)(n+2)}$. La suite est donc :","o":["croissante","décroissante","constante"],"a":0,"e":"La différence est strictement positive."},{"n":"suites-monotones","q":"Le théorème de Bolzano-Weierstrass affirme que toute suite bornée :","o":["converge","admet une sous-suite convergente","est monotone"],"a":1,"e":"$(-1)^n$ est bornée, ne converge pas, mais ses termes pairs forment une sous-suite convergente."},{"n":"suites-monotones","q":"Pour $u_0 = 0$ et $u_{n+1} = \\sqrt{u_n + 2}$, la limite est :","o":["$-1$","$2$","$\\sqrt2$"],"a":1,"e":"$\\ell = \\sqrt{\\ell + 2}$ donne $\\ell = 2$ ou $\\ell = -1$, et les termes sont positifs."},{"n":"suites-monotones","q":"Une suite décroissante et minorée converge vers :","o":["son premier terme","la borne inférieure de ses termes","n&#39;importe lequel de ses minorants"],"a":1,"e":"Par symétrie avec le cas croissant : le plus grand des minorants."}]},{"id":"suites-cauchy","t":"Suites de Cauchy, suites usuelles, densité par les suites","seance":"Chapitre 2 · Les suites numériques","imp":3,"html":"<h2>Avant de commencer<\/h2>\n<p>Il te faut la <strong>définition de la limite<\/strong> avec $\\varepsilon$ et l&#39;inégalité triangulaire $|a + b| \\le |a| + |b|$.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Si $|u_n - \\ell| &lt; \\tfrac{\\varepsilon}{2}$ et $|u_p - \\ell| &lt; \\tfrac{\\varepsilon}{2}$, que peux-tu dire de $|u_n - u_p|$ ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Écris $u_n - u_p = (u_n - \\ell) + (\\ell - u_p)$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>$|u_n - u_p| \\le |u_n - \\ell| + |\\ell - u_p| &lt; \\varepsilon$. Si ça coince, reprends l&#39;idée 3 du chapitre « Valeur absolue ».<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Une suite de Cauchy, c&#39;est une suite dont les termes se rapprochent les uns des autres.<\/strong> On ne parle plus de la limite : on compare les termes entre eux. C&#39;est l&#39;outil quand la limite est inconnue et que la suite n&#39;est pas monotone.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>« $u_{n+1} - u_n \\to 0$, donc la suite est de Cauchy. » Faux. $u_n = \\sqrt n$ vérifie $u_{n+1} - u_n \\to 0$ et tend pourtant vers $+\\infty$. Il faut contrôler $|u_p - u_n|$ pour <strong>tous<\/strong> les $p, n$ grands, pas seulement deux voisins.<\/p>\n<\/aside><p>À la fin, tu sais prouver qu&#39;une suite est (ou n&#39;est pas) de Cauchy, manipuler suites arithmétiques et géométriques, et caractériser la densité avec des suites.<\/p>\n<h2>Idée 1 · Les termes se resserrent entre eux<\/h2>\n<svg viewBox=\"0 0 340 120\" style=\"width:100%;max-width:440px;display:block;margin:10px auto\" role=\"img\" aria-label=\"À partir du rang N, deux termes quelconques de la suite sont à moins d'epsilon l'un de l'autre\">\n<line x1=\"20\" y1=\"70\" x2=\"330\" y2=\"70\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<rect x=\"200\" y=\"50\" width=\"70\" height=\"40\" fill=\"#D9824F\" opacity=\"0.18\"/>\n<g fill=\"currentColor\"><circle cx=\"40\" cy=\"70\" r=\"4\"/><circle cx=\"120\" cy=\"70\" r=\"4\"/><circle cx=\"170\" cy=\"70\" r=\"4\"/><\/g>\n<g fill=\"#D9824F\"><circle cx=\"210\" cy=\"70\" r=\"4\"/><circle cx=\"255\" cy=\"70\" r=\"4\"/><circle cx=\"228\" cy=\"70\" r=\"4\"/><circle cx=\"242\" cy=\"70\" r=\"4\"/><circle cx=\"236\" cy=\"70\" r=\"4\"/><\/g>\n<g font-family=\"sans-serif\" font-size=\"13\" font-weight=\"700\"><text x=\"196\" y=\"40\" fill=\"#D9824F\">largeur &lt; ε<\/text><text x=\"30\" y=\"105\" fill=\"currentColor\">premiers termes : libres<\/text><text x=\"200\" y=\"105\" fill=\"#D9824F\">après N : serrés<\/text><\/g>\n<\/svg><p>$(u_n)$ est <strong>de Cauchy<\/strong> si : pour tout $\\varepsilon &gt; 0$, il existe $N$ tel que pour tous $p, n \\ge N$, $|u_p - u_n| &lt; \\varepsilon$.<\/p>\n<p>Dans $\\mathbb R$ : <strong>une suite converge si et seulement si elle est de Cauchy<\/strong>. Le sens « convergente donc Cauchy » est le prérequis ci-dessus. L&#39;autre sens utilise Bolzano-Weierstrass.<\/p>\n<p><strong>Exemple.<\/strong> $u_n = \\sum_{k=1}^{n} \\dfrac{\\sin k}{2^k}$. Pour $p &gt; n$ : $|u_p - u_n| \\le \\sum_{k=n+1}^{p} \\dfrac{1}{2^k} &lt; \\dfrac{1}{2^n}$. Comme $\\tfrac1{2^n} \\to 0$, la suite est de Cauchy, donc converge.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Prouver qu'une somme est de Cauchy<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Écrire la différence<\/div><p>Pour $p &gt; n$, $u_p - u_n = \\sum_{k=n+1}^{p} a_k$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Majorer en valeur absolue<\/div><p>Inégalité triangulaire, puis une majoration simple de $|a_k|$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Majorer par un terme qui ne dépend que de n<\/div><p>Souvent une somme géométrique ou télescopique.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Conclure<\/div><p>Ce majorant tend vers 0, donc la suite est de Cauchy, donc convergente.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Idée 2 · Montrer qu&#39;une suite n&#39;est PAS de Cauchy<\/h2>\n<p>On nie la définition : il existe $\\varepsilon &gt; 0$ tel que, pour tout $N$, on trouve $p, n \\ge N$ avec $|u_p - u_n| \\ge \\varepsilon$. En pratique, on prend $p = 2n$.<\/p>\n<p><strong>Exemple (série harmonique).<\/strong> $u_n = \\sum_{k=1}^{n} \\dfrac1k$. Alors $u_{2n} - u_n = \\sum_{k=n+1}^{2n} \\dfrac1k \\ge n \\cdot \\dfrac{1}{2n} = \\dfrac12$. Avec $\\varepsilon = \\tfrac12$ : pas de Cauchy, donc divergente. Comme elle est croissante, elle tend vers $+\\infty$.<\/p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Pour une somme : minore $u_{2n} - u_n$ par $n$ fois le plus petit terme. Si tu obtiens une constante $&gt; 0$, la suite n&#39;est pas de Cauchy.<\/p>\n<\/aside><h2>Idée 3 · Suites arithmétiques et géométriques<\/h2>\n<figure class=\"grille\"><figcaption>Les deux suites de référence<\/figcaption><table><tr><th>Suite,<\/th><th>Terme<\/th><th>général,<\/th><th>Somme<\/th><th>des<\/th><th>termes,<\/th><th>Limite<\/th><\/tr><tr><td class=\"h1\">Arithmétique,<\/td><td>u_n<\/td><td>=<\/td><td>u_0<\/td><td>+<\/td><td>n<\/td><td>r,<\/td><td>(nb<\/td><td>de<\/td><td>termes)(premier<\/td><td>+<\/td><td>dernier)/2,<\/td><td>±∞<\/td><td>si<\/td><td>r<\/td><td>≠<\/td><td>0<\/td><\/tr><tr><td class=\"h1\">Géométrique, u_n = u_0 q^n, u_0 (1 - q^(n+1))/(1 - q) si q ≠ 1, 0 si<\/td><td>q<\/td><td>&lt; 1<\/td><\/tr><\/table><\/figure><p>Pour $q^n$ : il tend vers 0 si $|q| &lt; 1$, vaut 1 si $q = 1$, tend vers $+\\infty$ si $q &gt; 1$, et n&#39;a pas de limite si $q \\le -1$.<\/p>\n<p><strong>Exemple.<\/strong> $\\sum_{k=0}^{n} a^k = \\dfrac{1 - a^{n+1}}{1 - a} \\to \\dfrac{1}{1 - a}$ pour $0 &lt; a &lt; 1$.<\/p>\n<h2>Idée 4 · La densité caractérisée par les suites<\/h2>\n<p>Une partie $D$ de $\\mathbb R$ est <strong>dense<\/strong> si elle rencontre tout intervalle $]x, y[$ avec $x &lt; y$. Version suites : $D$ est dense <strong>si et seulement si<\/strong> tout réel $x$ est limite d&#39;une suite d&#39;éléments de $D$.<\/p>\n<p><strong>Exemple.<\/strong> $\\mathbb Q$ est dense : pour $x$ réel, $r_n = \\dfrac{E(nx)}{n}$ est rationnel et $x - \\tfrac1n &lt; r_n \\le x$, donc $r_n \\to x$ par les gendarmes.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Cauchy en pratique<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Montre que $u_n = \\sum_{k=1}^{n} \\dfrac{1}{k^2}$ est de Cauchy. Indication : $\\dfrac1{k^2} \\le \\dfrac1{k-1} - \\dfrac1k$ pour $k \\ge 2$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>La somme devient télescopique.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Pour $p &gt; n \\ge 1$ : $0 \\le u_p - u_n \\le \\sum_{k=n+1}^{p}\\left(\\tfrac1{k-1} - \\tfrac1k\\right) = \\tfrac1n - \\tfrac1p &lt; \\tfrac1n$. Donc $|u_p - u_n| &lt; \\varepsilon$ dès que $n \\ge N &gt; \\tfrac1\\varepsilon$. La suite est de Cauchy, donc converge.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Montre que $u_n = \\sum_{k=1}^{n} \\dfrac{1}{\\sqrt k}$ n&#39;est pas de Cauchy.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Minore $u_{2n} - u_n$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>$u_{2n} - u_n = \\sum_{k=n+1}^{2n} \\tfrac1{\\sqrt k} \\ge n \\cdot \\tfrac1{\\sqrt{2n}} = \\sqrt{\\tfrac n2} \\ge \\tfrac{1}{\\sqrt 2}$. Pas de Cauchy avec $\\varepsilon = \\tfrac1{\\sqrt2}$ ; croissante, elle tend vers $+\\infty$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Soit $x$ réel. Montre que $\\dfrac{E(nx)}{n} \\to x$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>$nx - 1 &lt; E(nx) \\le nx$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>On divise par $n &gt; 0$ : $x - \\tfrac1n &lt; \\tfrac{E(nx)}{n} \\le x$. Les deux bornes tendent vers $x$ : gendarmes.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Dans $\\mathbb R$, une suite de Cauchy :<\/div><button class=\"opt\" data-o=\"0\">converge toujours<\/button><button class=\"opt\" data-o=\"1\">peut tendre vers $+\\infty$<\/button><button class=\"opt\" data-o=\"2\">est forcément monotone<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">$u_n = \\sqrt n$ vérifie $u_{n+1} - u_n \\to 0$. Elle est :<\/div><button class=\"opt\" data-o=\"0\">de Cauchy<\/button><button class=\"opt\" data-o=\"1\">pas de Cauchy<\/button><button class=\"opt\" data-o=\"2\">convergente<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Pour montrer qu&#39;une somme $\\sum_{k=1}^n a_k$ n&#39;est pas de Cauchy, on minore souvent :<\/div><button class=\"opt\" data-o=\"0\">$u_{n+1} - u_n$<\/button><button class=\"opt\" data-o=\"1\">$u_{2n} - u_n$<\/button><button class=\"opt\" data-o=\"2\">$u_n$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">$\\sum_{k=n+1}^{2n} \\frac1k$ est minorée par :<\/div><button class=\"opt\" data-o=\"0\">$\\frac12$<\/button><button class=\"opt\" data-o=\"1\">$1$<\/button><button class=\"opt\" data-o=\"2\">$\\frac1n$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">$\\sum_{k=0}^{n} \\left(\\frac12\\right)^k$ tend vers :<\/div><button class=\"opt\" data-o=\"0\">1<\/button><button class=\"opt\" data-o=\"1\">2<\/button><button class=\"opt\" data-o=\"2\">$+\\infty$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">$(-2)^n$ :<\/div><button class=\"opt\" data-o=\"0\">tend vers $+\\infty$<\/button><button class=\"opt\" data-o=\"1\">tend vers 0<\/button><button class=\"opt\" data-o=\"2\">n&#39;a pas de limite<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Toute suite convergente est :<\/div><button class=\"opt\" data-o=\"0\">de Cauchy<\/button><button class=\"opt\" data-o=\"1\">croissante<\/button><button class=\"opt\" data-o=\"2\">géométrique<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">$D$ est dense dans $\\mathbb R$ si :<\/div><button class=\"opt\" data-o=\"0\">$D$ contient tous les rationnels<\/button><button class=\"opt\" data-o=\"1\">tout réel est limite d&#39;une suite d&#39;éléments de $D$<\/button><button class=\"opt\" data-o=\"2\">$D$ est infini<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">La suite $\\frac{E(nx)}{n}$ tend vers :<\/div><button class=\"opt\" data-o=\"0\">$E(x)$<\/button><button class=\"opt\" data-o=\"1\">$x$<\/button><button class=\"opt\" data-o=\"2\">0<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Une suite arithmétique de raison $r \\ne 0$ :<\/div><button class=\"opt\" data-o=\"0\">converge<\/button><button class=\"opt\" data-o=\"1\">diverge<\/button><button class=\"opt\" data-o=\"2\">est bornée<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"suites-cauchy","rep":null,"tol":null},{"n":"suites-cauchy","rep":null,"tol":null},{"n":"suites-cauchy","rep":null,"tol":null},{"n":"suites-cauchy","rep":null,"tol":null}],"qcm":[{"n":"suites-cauchy","q":"Dans $\\mathbb R$, une suite de Cauchy :","o":["converge toujours","peut tendre vers $+\\infty$","est forcément monotone"],"a":0,"e":"C&#39;est la complétude de $\\mathbb R$."},{"n":"suites-cauchy","q":"$u_n = \\sqrt n$ vérifie $u_{n+1} - u_n \\to 0$. Elle est :","o":["de Cauchy","pas de Cauchy","convergente"],"a":1,"e":"Elle tend vers $+\\infty$ : l&#39;écart entre voisins ne suffit pas."},{"n":"suites-cauchy","q":"Pour montrer qu&#39;une somme $\\sum_{k=1}^n a_k$ n&#39;est pas de Cauchy, on minore souvent :","o":["$u_{n+1} - u_n$","$u_{2n} - u_n$","$u_n$"],"a":1,"e":"On compare des termes éloignés, pas deux voisins."},{"n":"suites-cauchy","q":"$\\sum_{k=n+1}^{2n} \\frac1k$ est minorée par :","o":["$\\frac12$","$1$","$\\frac1n$"],"a":0,"e":"$n$ termes, chacun $\\ge \\frac1{2n}$."},{"n":"suites-cauchy","q":"$\\sum_{k=0}^{n} \\left(\\frac12\\right)^k$ tend vers :","o":["1","2","$+\\infty$"],"a":1,"e":"$\\frac{1}{1 - 1/2} = 2$."},{"n":"suites-cauchy","q":"$(-2)^n$ :","o":["tend vers $+\\infty$","tend vers 0","n&#39;a pas de limite"],"a":2,"e":"Le signe alterne et la valeur absolue explose."},{"n":"suites-cauchy","q":"Toute suite convergente est :","o":["de Cauchy","croissante","géométrique"],"a":0,"e":"Prérequis du chapitre : on passe par $\\ell$ avec $\\frac\\varepsilon2$."},{"n":"suites-cauchy","q":"$D$ est dense dans $\\mathbb R$ si :","o":["$D$ contient tous les rationnels","tout réel est limite d&#39;une suite d&#39;éléments de $D$","$D$ est infini"],"a":1,"e":"$\\mathbb N$ est infini et pas dense."},{"n":"suites-cauchy","q":"La suite $\\frac{E(nx)}{n}$ tend vers :","o":["$E(x)$","$x$","0"],"a":1,"e":"Encadrement $x - \\frac1n &lt; \\frac{E(nx)}{n} \\le x$."},{"n":"suites-cauchy","q":"Une suite arithmétique de raison $r \\ne 0$ :","o":["converge","diverge","est bornée"],"a":1,"e":"Elle tend vers $\\pm\\infty$ selon le signe de $r$."}]},{"id":"limites-fonctions","t":"Limite d'une fonction","seance":"Chapitre 3 · Fonctions d'une variable réelle","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>C&#39;est la limite des suites, transposée : au lieu de « $n$ grand », on dira « $x$ proche de $a$ ».<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Écris avec des quantificateurs : « $u_n$ tend vers $\\ell$ ».<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$\\forall \\varepsilon &gt; 0,\\ \\exists N,\\ \\forall n \\ge N,\\ |u_n - \\ell| &lt; \\varepsilon$. Si ce n&#39;est pas fluide, relis l&#39;idée 2 de « Limite d&#39;une suite ».<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Deux tubes au lieu d&#39;un.<\/strong> On choisit la précision $\\varepsilon$ autour de $\\ell$ (en vertical), et on trouve une marge $\\delta$ autour de $a$ (en horizontal) qui garantit cette précision.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Croire que la limite en $a$ dépend de $f(a)$. Elle n&#39;en dépend pas : $f$ peut même ne pas être définie en $a$. Exemple : $\\dfrac{\\sin x}{x} \\to 1$ en 0.<\/p>\n<\/aside><p>À la fin, tu sais écrire et utiliser la définition, distinguer limite à gauche et à droite, et prouver qu&#39;une limite n&#39;existe pas avec deux suites.<\/p>\n<h2>Idée 1 · La définition $\\varepsilon$–$\\delta$<\/h2>\n<svg viewBox=\"0 0 340 200\" style=\"width:100%;max-width:440px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Une bande horizontale de demi-largeur epsilon autour de l et une bande verticale de demi-largeur delta autour de a : le graphe dans la bande verticale reste dans la bande horizontale\">\n<rect x=\"30\" y=\"60\" width=\"300\" height=\"50\" fill=\"#D9824F\" opacity=\"0.15\"/>\n<rect x=\"140\" y=\"10\" width=\"60\" height=\"180\" fill=\"currentColor\" opacity=\"0.08\"/>\n<line x1=\"30\" y1=\"185\" x2=\"330\" y2=\"185\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"30\" y1=\"10\" x2=\"30\" y2=\"185\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<path d=\"M40 170 Q120 140 170 85 T320 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"/>\n<line x1=\"30\" y1=\"85\" x2=\"330\" y2=\"85\" stroke=\"#D9824F\" stroke-dasharray=\"5 4\"/>\n<g font-family=\"sans-serif\" font-size=\"13\" font-weight=\"700\"><text x=\"8\" y=\"89\" fill=\"#D9824F\">ℓ<\/text><text x=\"165\" y=\"200\" fill=\"currentColor\">a<\/text><text x=\"250\" y=\"78\" fill=\"#D9824F\">± ε<\/text><text x=\"146\" y=\"25\" fill=\"currentColor\">± δ<\/text><\/g>\n<\/svg><p>$\\lim_{x \\to a} f(x) = \\ell$ signifie : $\\forall \\varepsilon &gt; 0,\\ \\exists \\delta &gt; 0,\\ \\forall x \\in D_f,\\ |x - a| &lt; \\delta \\Rightarrow |f(x) - \\ell| &lt; \\varepsilon$.<\/p>\n<p><strong>Exemple.<\/strong> $f(x) = 3x + 1$ en $a = 2$, $\\ell = 7$ : $|f(x) - 7| = 3|x - 2|$. Il suffit de prendre $\\delta = \\tfrac{\\varepsilon}{3}$.<\/p>\n<p>Variantes : en $+\\infty$, on remplace « $|x - a| &lt; \\delta$ » par « $x &gt; A$ » ; une limite infinie remplace « $|f(x) - \\ell| &lt; \\varepsilon$ » par « $f(x) &gt; B$ ».<\/p>\n<h2>Idée 2 · Limite à gauche, limite à droite<\/h2>\n<p>$\\lim_{x \\to a^+} f(x)$ ne regarde que les $x &gt; a$ ; $\\lim_{x \\to a^-}$ que les $x &lt; a$. La limite en $a$ (pour $x \\ne a$) existe si et seulement si les deux existent et sont égales.<\/p>\n<p><strong>Exemple.<\/strong> $f(x) = \\dfrac{|x|}{x}$ : vaut 1 à droite de 0 et $-1$ à gauche. Deux limites différentes, donc pas de limite en 0.<\/p>\n<p><strong>Exemple.<\/strong> $E(x)$ en $a = 1$ : limite à gauche 0, limite à droite 1.<\/p>\n<h2>Idée 3 · Le pont avec les suites (caractérisation séquentielle)<\/h2>\n<p>$\\lim_{x \\to a} f(x) = \\ell$ <strong>si et seulement si<\/strong> pour toute suite $x_n \\to a$ (avec $x_n \\in D_f$), $f(x_n) \\to \\ell$.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Prouver qu'une limite n'existe pas<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · Choisir deux suites<\/div><p>Deux suites $x_n$ et $y_n$ qui tendent vers $a$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · Calculer les images<\/div><p>Calculer $\\lim f(x_n)$ et $\\lim f(y_n)$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · Comparer<\/div><p>Si les deux limites sont différentes, $f$ n&#39;a pas de limite en $a$.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p><strong>Exemple.<\/strong> $f(x) = \\sin \\tfrac1x$ en 0 : $x_n = \\tfrac{1}{2n\\pi} \\to 0$ donne $f(x_n) = 0$ ; $y_n = \\tfrac{1}{\\pi/2 + 2n\\pi} \\to 0$ donne $f(y_n) = 1$. Pas de limite.<\/p>\n<h2>Idée 4 · Fonctions monotones : la limite existe<\/h2>\n<p>Comme pour les suites : si $f$ est <strong>croissante et majorée<\/strong> sur $]a, b[$, alors $\\lim_{x \\to b^-} f(x)$ existe et vaut $\\sup_{]a,b[} f$.<\/p>\n<p>En particulier, une fonction croissante sur $\\mathbb R$ et majorée admet une limite finie en $+\\infty$. Une fonction périodique non constante, elle, n&#39;a pas de limite en $+\\infty$ (deux suites $x_0 + nT$ et $x_1 + nT$ donnent deux valeurs différentes).<\/p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Les règles de calcul (somme, produit, quotient, gendarmes, composition) sont les mêmes que pour les suites.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Limites de fonctions<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Avec la définition, montre que $\\lim_{x \\to 1} (2x - 5) = -3$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$|2x - 5 + 3| = 2|x - 1|$. Pour $\\varepsilon &gt; 0$, $\\delta = \\tfrac\\varepsilon2$ convient.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Montre que $\\cos x$ n&#39;a pas de limite en $+\\infty$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Deux suites qui tendent vers $+\\infty$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>$x_n = 2n\\pi$ donne $\\cos x_n = 1$ ; $y_n = \\pi + 2n\\pi$ donne $-1$. Limites différentes, donc pas de limite.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Calcule $\\lim_{x \\to 0} x \\sin \\tfrac1x$.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>Gendarmes.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0<\/b><\/p><p>$|x \\sin\\tfrac1x| \\le |x| \\to 0$, donc la limite vaut 0.<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Pour $f(x) = 5x$ en $a = 0$, quel $\\delta$ convient à $\\varepsilon$ donné ?<\/div><button class=\"opt\" data-o=\"0\">$\\delta = 5\\varepsilon$<\/button><button class=\"opt\" data-o=\"1\">$\\delta = \\frac{\\varepsilon}{5}$<\/button><button class=\"opt\" data-o=\"2\">$\\delta = \\varepsilon$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">$\\frac{|x|}{x}$ en 0 :<\/div><button class=\"opt\" data-o=\"0\">tend vers 1<\/button><button class=\"opt\" data-o=\"1\">tend vers 0<\/button><button class=\"opt\" data-o=\"2\">n&#39;a pas de limite<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">$\\lim_{x \\to 1^-} E(x)$ vaut :<\/div><button class=\"opt\" data-o=\"0\">0<\/button><button class=\"opt\" data-o=\"1\">1<\/button><button class=\"opt\" data-o=\"2\">n&#39;existe pas<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Pour prouver qu&#39;une limite n&#39;existe pas, on utilise :<\/div><button class=\"opt\" data-o=\"0\">une seule suite<\/button><button class=\"opt\" data-o=\"1\">deux suites aux images de limites différentes<\/button><button class=\"opt\" data-o=\"2\">la dérivée<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">$\\sin\\frac1x$ en 0 :<\/div><button class=\"opt\" data-o=\"0\">tend vers 0<\/button><button class=\"opt\" data-o=\"1\">tend vers 1<\/button><button class=\"opt\" data-o=\"2\">n&#39;a pas de limite<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">$x\\sin\\frac1x$ en 0 :<\/div><button class=\"opt\" data-o=\"0\">tend vers 0<\/button><button class=\"opt\" data-o=\"1\">n&#39;a pas de limite<\/button><button class=\"opt\" data-o=\"2\">tend vers 1<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Une fonction croissante et majorée sur $\\mathbb R$ en $+\\infty$ :<\/div><button class=\"opt\" data-o=\"0\">a une limite finie<\/button><button class=\"opt\" data-o=\"1\">tend vers $+\\infty$<\/button><button class=\"opt\" data-o=\"2\">peut ne pas avoir de limite<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">$\\lim_{x\\to a} f(x) = +\\infty$ s&#39;écrit :<\/div><button class=\"opt\" data-o=\"0\">$\\forall \\varepsilon, \\exists \\delta, |f(x)| &lt; \\varepsilon$<\/button><button class=\"opt\" data-o=\"1\">$\\forall B, \\exists \\delta &gt; 0, |x - a| &lt; \\delta \\Rightarrow f(x) &gt; B$<\/button><button class=\"opt\" data-o=\"2\">$\\exists B, f(x) &gt; B$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">$f$ n&#39;est pas définie en $a$. Elle peut avoir une limite en $a$ :<\/div><button class=\"opt\" data-o=\"0\">vrai<\/button><button class=\"opt\" data-o=\"1\">faux<\/button><button class=\"opt\" data-o=\"2\">seulement si elle est continue<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">$\\cos x$ en $+\\infty$ :<\/div><button class=\"opt\" data-o=\"0\">tend vers 0<\/button><button class=\"opt\" data-o=\"1\">tend vers 1<\/button><button class=\"opt\" data-o=\"2\">n&#39;a pas de limite<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"limites-fonctions","rep":null,"tol":null},{"n":"limites-fonctions","rep":null,"tol":null},{"n":"limites-fonctions","rep":null,"tol":null},{"n":"limites-fonctions","rep":["0"],"tol":null}],"qcm":[{"n":"limites-fonctions","q":"Pour $f(x) = 5x$ en $a = 0$, quel $\\delta$ convient à $\\varepsilon$ donné ?","o":["$\\delta = 5\\varepsilon$","$\\delta = \\frac{\\varepsilon}{5}$","$\\delta = \\varepsilon$"],"a":1,"e":"$|5x| &lt; \\varepsilon$ dès que $|x| &lt; \\frac\\varepsilon5$."},{"n":"limites-fonctions","q":"$\\frac{|x|}{x}$ en 0 :","o":["tend vers 1","tend vers 0","n&#39;a pas de limite"],"a":2,"e":"1 à droite, $-1$ à gauche."},{"n":"limites-fonctions","q":"$\\lim_{x \\to 1^-} E(x)$ vaut :","o":["0","1","n&#39;existe pas"],"a":0,"e":"Pour $0 \\le x &lt; 1$, $E(x) = 0$."},{"n":"limites-fonctions","q":"Pour prouver qu&#39;une limite n&#39;existe pas, on utilise :","o":["une seule suite","deux suites aux images de limites différentes","la dérivée"],"a":1,"e":"Caractérisation séquentielle."},{"n":"limites-fonctions","q":"$\\sin\\frac1x$ en 0 :","o":["tend vers 0","tend vers 1","n&#39;a pas de limite"],"a":2,"e":"Elle oscille entre $-1$ et 1."},{"n":"limites-fonctions","q":"$x\\sin\\frac1x$ en 0 :","o":["tend vers 0","n&#39;a pas de limite","tend vers 1"],"a":0,"e":"Gendarmes avec $|x|$."},{"n":"limites-fonctions","q":"Une fonction croissante et majorée sur $\\mathbb R$ en $+\\infty$ :","o":["a une limite finie","tend vers $+\\infty$","peut ne pas avoir de limite"],"a":0,"e":"Analogue de la limite monotone."},{"n":"limites-fonctions","q":"$\\lim_{x\\to a} f(x) = +\\infty$ s&#39;écrit :","o":["$\\forall \\varepsilon, \\exists \\delta, |f(x)| &lt; \\varepsilon$","$\\forall B, \\exists \\delta &gt; 0, |x - a| &lt; \\delta \\Rightarrow f(x) &gt; B$","$\\exists B, f(x) &gt; B$"],"a":1,"e":"On dépasse toute barre $B$."},{"n":"limites-fonctions","q":"$f$ n&#39;est pas définie en $a$. Elle peut avoir une limite en $a$ :","o":["vrai","faux","seulement si elle est continue"],"a":0,"e":"Exemple : $\\frac{\\sin x}{x}$ en 0."},{"n":"limites-fonctions","q":"$\\cos x$ en $+\\infty$ :","o":["tend vers 0","tend vers 1","n&#39;a pas de limite"],"a":2,"e":"Suites $2n\\pi$ et $\\pi + 2n\\pi$."}]},{"id":"continuite","t":"Continuité en un point et sur un intervalle","seance":"Chapitre 3 · Fonctions d'une variable réelle","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>La continuité, c&#39;est une limite particulière : celle qui vaut $f(a)$.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>$f(x) = \\dfrac{x^2 - 1}{x - 1}$ pour $x \\ne 1$. Quelle est sa limite en 1 ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 2<\/b><\/p><p>$f(x) = x + 1$ pour $x \\ne 1$, donc la limite vaut 2. Revois « Limite d&#39;une fonction » si besoin.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Continue = on trace sans lever le crayon, mais on le prouve avec une limite.<\/strong> Toutes les fonctions usuelles le sont sur leur domaine ; le travail porte sur les points de raccord.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Oublier de comparer à $f(a)$. Avoir une limite en $a$ ne suffit pas : il faut que cette limite <strong>soit égale<\/strong> à $f(a)$.<\/p>\n<\/aside><p>À la fin, tu sais vérifier la continuité en un point de raccord, prolonger par continuité et utiliser la continuité avec des suites.<\/p>\n<h2>Idée 1 · La définition<\/h2>\n<svg viewBox=\"0 0 340 160\" style=\"width:100%;max-width:440px;display:block;margin:10px auto\" role=\"img\" aria-label=\"À gauche un graphe sans coupure en a, à droite un graphe qui saute en a\">\n<g stroke=\"currentColor\" stroke-width=\"2\" fill=\"none\"><path d=\"M20 130 Q80 120 100 80 T160 30\"/><path d=\"M190 120 Q230 110 250 95\"/><path d=\"M250 55 Q280 45 320 30\"/><\/g>\n<circle cx=\"100\" cy=\"80\" r=\"5\" fill=\"#D9824F\"/><circle cx=\"250\" cy=\"95\" r=\"5\" fill=\"#D9824F\"/><circle cx=\"250\" cy=\"55\" r=\"5\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/>\n<g font-family=\"sans-serif\" font-size=\"13\" font-weight=\"700\"><text x=\"40\" y=\"155\" fill=\"currentColor\">continue en a<\/text><text x=\"200\" y=\"155\" fill=\"#D9824F\">saut : discontinue<\/text><\/g>\n<\/svg><p>$f$ est <strong>continue en $a$<\/strong> si $\\lim_{x \\to a} f(x) = f(a)$. Avec $\\varepsilon$ : $\\forall \\varepsilon &gt; 0, \\exists \\delta &gt; 0, |x - a| &lt; \\delta \\Rightarrow |f(x) - f(a)| &lt; \\varepsilon$.<\/p>\n<p>Continue à droite : $\\lim_{x \\to a^+} f(x) = f(a)$. Continue en $a$ ssi continue à gauche et à droite.<\/p>\n<p><strong>Exemple.<\/strong> $E(x)$ est continue à droite en 1 ($E(1) = 1$) mais pas à gauche (limite 0).<\/p>\n<h2>Idée 2 · Étudier un point de raccord<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Méthode pour une fonction définie par morceaux<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Calculer f(a)<\/div><p>Avec la formule qui contient $a$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Limite à gauche<\/div><p>Avec la formule valable pour $x &lt; a$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Limite à droite<\/div><p>Avec la formule valable pour $x &gt; a$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Comparer<\/div><p>Continue en $a$ ssi les trois nombres sont égaux.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p><strong>Exemple.<\/strong> $f(x) = x^2$ si $x \\le 1$, $f(x) = 2x - 1$ si $x &gt; 1$. $f(1) = 1$, à gauche 1, à droite 1 : continue en 1.<\/p>\n<h2>Idée 3 · Opérations et prolongement<\/h2>\n<ul>\n<li>Sommes, produits, quotients (dénominateur non nul), composées de fonctions continues sont continues.<\/li>\n<li>Polynômes, $\\sin$, $\\cos$, $\\exp$, $\\ln$, $\\sqrt{\\ }$ sont continues sur leur domaine.<\/li>\n<\/ul>\n<p><strong>Prolongement par continuité.<\/strong> Si $f$ n&#39;est pas définie en $a$ mais a une limite finie $\\ell$ en $a$, on pose $\\tilde f(a) = \\ell$ : la nouvelle fonction est continue en $a$.<\/p>\n<p><strong>Exemple.<\/strong> $\\dfrac{\\sin x}{x}$ se prolonge en 0 par la valeur 1.<\/p>\n<h2>Idée 4 · Continuité et suites<\/h2>\n<p>$f$ est continue en $a$ <strong>si et seulement si<\/strong> pour toute suite $x_n \\to a$, $f(x_n) \\to f(a)$.<\/p>\n<p>Deux usages fréquents dans les séries de TD :<\/p>\n<ul>\n<li><strong>Passer à la limite<\/strong> dans $u_{n+1} = f(u_n)$ : si $u_n \\to \\ell$ et $f$ continue en $\\ell$, alors $\\ell = f(\\ell)$.<\/li>\n<li><strong>Densité<\/strong> : si $f$ et $g$ sont continues et égales sur une partie dense $D$ (par exemple $\\mathbb Q$), alors $f = g$ partout. Pour $x$ réel, on prend $d_n \\in D$ avec $d_n \\to x$ : $f(x) = \\lim f(d_n) = \\lim g(d_n) = g(x)$.<\/li>\n<\/ul>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>« Continue + égale sur une partie dense » donne « égale partout ». C&#39;est l&#39;argument final des exercices sur $f(x + y) = f(x) + f(y)$.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Continuité<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Pour quelle valeur de $m$ la fonction $f(x) = x + m$ si $x &lt; 0$, $f(x) = \\cos x$ si $x \\ge 0$ est-elle continue en 0 ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1<\/b><\/p><p>$f(0) = 1$, limite à droite 1, limite à gauche $m$. Il faut $m = 1$.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>$f : \\mathbb R \\to \\mathbb R$ continue et nulle sur $\\mathbb Q$. Montre que $f = 0$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Densité de $\\mathbb Q$ par les suites.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Soit $x$ réel et $r_n = \\tfrac{E(nx)}{n} \\in \\mathbb Q$, $r_n \\to x$. Par continuité, $f(x) = \\lim f(r_n) = 0$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>$f(x) = x \\sin \\tfrac1x$ pour $x \\ne 0$. Se prolonge-t-elle par continuité en 0 ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Oui : $|f(x)| \\le |x| \\to 0$. On pose $f(0) = 0$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">$f$ est continue en $a$ si :<\/div><button class=\"opt\" data-o=\"0\">$f$ a une limite en $a$<\/button><button class=\"opt\" data-o=\"1\">$\\lim_{x\\to a} f(x) = f(a)$<\/button><button class=\"opt\" data-o=\"2\">$f$ est définie en $a$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">$E(x)$ en $x = 2$ est :<\/div><button class=\"opt\" data-o=\"0\">continue à droite seulement<\/button><button class=\"opt\" data-o=\"1\">continue à gauche seulement<\/button><button class=\"opt\" data-o=\"2\">continue<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">$\\frac{\\sin x}{x}$ se prolonge par continuité en 0 par :<\/div><button class=\"opt\" data-o=\"0\">0<\/button><button class=\"opt\" data-o=\"1\">1<\/button><button class=\"opt\" data-o=\"2\">impossible<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Une composée de fonctions continues est :<\/div><button class=\"opt\" data-o=\"0\">continue<\/button><button class=\"opt\" data-o=\"1\">continue seulement si elles sont monotones<\/button><button class=\"opt\" data-o=\"2\">pas forcément continue<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">$f$ continue, nulle sur $\\mathbb Q$. Alors :<\/div><button class=\"opt\" data-o=\"0\">$f$ peut être non nulle sur les irrationnels<\/button><button class=\"opt\" data-o=\"1\">$f$ est nulle partout<\/button><button class=\"opt\" data-o=\"2\">$f$ est constante non nulle<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">$u_n \\to \\ell$, $u_{n+1} = \\cos u_n$. Alors :<\/div><button class=\"opt\" data-o=\"0\">$\\ell = \\cos \\ell$<\/button><button class=\"opt\" data-o=\"1\">$\\ell = 0$<\/button><button class=\"opt\" data-o=\"2\">$\\ell = 1$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">$f(x) = \\frac{1}{x}$ est continue :<\/div><button class=\"opt\" data-o=\"0\">sur $\\mathbb R$<\/button><button class=\"opt\" data-o=\"1\">sur $\\mathbb R^*$<\/button><button class=\"opt\" data-o=\"2\">nulle part<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Pour un raccord en $a$, on compare :<\/div><button class=\"opt\" data-o=\"0\">$f(a)$, limite à gauche et limite à droite<\/button><button class=\"opt\" data-o=\"1\">seulement $f(a)$<\/button><button class=\"opt\" data-o=\"2\">les dérivées à gauche et à droite<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">$f(x) = |x|$ en 0 est :<\/div><button class=\"opt\" data-o=\"0\">continue<\/button><button class=\"opt\" data-o=\"1\">discontinue<\/button><button class=\"opt\" data-o=\"2\">non définie<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Caractérisation séquentielle : $f$ continue en $a$ ssi :<\/div><button class=\"opt\" data-o=\"0\">il existe une suite $x_n \\to a$ avec $f(x_n) \\to f(a)$<\/button><button class=\"opt\" data-o=\"1\">pour toute suite $x_n \\to a$, $f(x_n) \\to f(a)$<\/button><button class=\"opt\" data-o=\"2\">$f(n) \\to f(a)$<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"continuite","rep":["2"],"tol":null},{"n":"continuite","rep":["1"],"tol":null},{"n":"continuite","rep":null,"tol":null},{"n":"continuite","rep":null,"tol":null}],"qcm":[{"n":"continuite","q":"$f$ est continue en $a$ si :","o":["$f$ a une limite en $a$","$\\lim_{x\\to a} f(x) = f(a)$","$f$ est définie en $a$"],"a":1,"e":"Il faut l&#39;égalité avec $f(a)$."},{"n":"continuite","q":"$E(x)$ en $x = 2$ est :","o":["continue à droite seulement","continue à gauche seulement","continue"],"a":0,"e":"Limite à gauche 1, $E(2) = 2$."},{"n":"continuite","q":"$\\frac{\\sin x}{x}$ se prolonge par continuité en 0 par :","o":["0","1","impossible"],"a":1,"e":"Limite connue : 1."},{"n":"continuite","q":"Une composée de fonctions continues est :","o":["continue","continue seulement si elles sont monotones","pas forcément continue"],"a":0,"e":"Résultat général."},{"n":"continuite","q":"$f$ continue, nulle sur $\\mathbb Q$. Alors :","o":["$f$ peut être non nulle sur les irrationnels","$f$ est nulle partout","$f$ est constante non nulle"],"a":1,"e":"Densité de $\\mathbb Q$ et continuité."},{"n":"continuite","q":"$u_n \\to \\ell$, $u_{n+1} = \\cos u_n$. Alors :","o":["$\\ell = \\cos \\ell$","$\\ell = 0$","$\\ell = 1$"],"a":0,"e":"$\\cos$ est continue : on passe à la limite."},{"n":"continuite","q":"$f(x) = \\frac{1}{x}$ est continue :","o":["sur $\\mathbb R$","sur $\\mathbb R^*$","nulle part"],"a":1,"e":"Elle est continue sur son domaine."},{"n":"continuite","q":"Pour un raccord en $a$, on compare :","o":["$f(a)$, limite à gauche et limite à droite","seulement $f(a)$","les dérivées à gauche et à droite"],"a":0,"e":"Les dérivées concernent la dérivabilité."},{"n":"continuite","q":"$f(x) = |x|$ en 0 est :","o":["continue","discontinue","non définie"],"a":0,"e":"Limites à gauche et à droite égales à 0."},{"n":"continuite","q":"Caractérisation séquentielle : $f$ continue en $a$ ssi :","o":["il existe une suite $x_n \\to a$ avec $f(x_n) \\to f(a)$","pour toute suite $x_n \\to a$, $f(x_n) \\to f(a)$","$f(n) \\to f(a)$"],"a":1,"e":"Il faut toutes les suites."}]},{"id":"grands-theoremes-continuite","t":"TVI, bornes atteintes, bijection, continuité uniforme","seance":"Chapitre 3 · Fonctions d'une variable réelle","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir ce qu&#39;est une fonction continue et une borne supérieure.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>$f$ est continue sur $[0, 1]$, $f(0) = -2$, $f(1) = 3$. Peut-on affirmer qu&#39;il existe $c$ avec $f(c) = 0$ ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Oui : c&#39;est exactement le théorème des valeurs intermédiaires, au cœur de ce chapitre. Si « continue » reste flou, relis le chapitre précédent.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Ces théorèmes donnent l&#39;existence, pas la valeur.<\/strong> On ne calcule pas $c$ : on prouve qu&#39;il existe. Chaque fois, vérifie les hypothèses une par une.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Appliquer le TVI sur un ensemble qui n&#39;est pas un intervalle, ou oublier la continuité. $\\frac1x$ vaut $-1$ en $-1$ et $1$ en $1$, mais ne s&#39;annule jamais : elle n&#39;est pas continue sur $[-1, 1]$.<\/p>\n<\/aside><p>À la fin, tu sais montrer qu&#39;une équation a une solution (et une seule), qu&#39;une fonction est bornée et atteint ses bornes, qu&#39;elle est bijective, et distinguer continuité et continuité uniforme.<\/p>\n<h2>Idée 1 · Le théorème des valeurs intermédiaires<\/h2>\n<svg viewBox=\"0 0 340 180\" style=\"width:100%;max-width:440px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Une courbe continue de f(a) négatif à f(b) positif coupe forcément l'axe horizontal en un point c\">\n<line x1=\"20\" y1=\"90\" x2=\"330\" y2=\"90\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<path d=\"M50 150 C100 140 120 60 170 90 S250 30 300 25\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"/>\n<circle cx=\"50\" cy=\"150\" r=\"4.5\" fill=\"currentColor\"/><circle cx=\"300\" cy=\"25\" r=\"4.5\" fill=\"currentColor\"/><circle cx=\"141\" cy=\"90\" r=\"5\" fill=\"#D9824F\"/>\n<g font-family=\"sans-serif\" font-size=\"13\" font-weight=\"700\"><text x=\"30\" y=\"170\" fill=\"currentColor\">f(a) &lt; 0<\/text><text x=\"260\" y=\"18\" fill=\"currentColor\">f(b) &gt; 0<\/text><text x=\"135\" y=\"112\" fill=\"#D9824F\">c<\/text><\/g>\n<\/svg><p>Si $f$ est <strong>continue sur $[a, b]$<\/strong>, elle prend toutes les valeurs entre $f(a)$ et $f(b)$. En particulier, si $f(a)f(b) &lt; 0$, il existe $c \\in ]a, b[$ avec $f(c) = 0$.<\/p>\n<p>Plus généralement : l&#39;image d&#39;un intervalle par une fonction continue est un intervalle.<\/p>\n<p><strong>Exemple.<\/strong> $x^3 + x - 1 = 0$ a une solution dans $]0, 1[$ : $f(0) = -1 &lt; 0$ et $f(1) = 1 &gt; 0$.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Montrer qu'une équation a une unique solution<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Mettre sous la forme f(x) = 0<\/div><p>Tout passer du même côté.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Continuité<\/div><p>Justifier que $f$ est continue sur l&#39;intervalle.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Changement de signe<\/div><p>Trouver $a, b$ avec $f(a)f(b) &lt; 0$ (ou des limites de signes opposés).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Unicité<\/div><p>Montrer que $f$ est strictement monotone.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p><strong>Application : point fixe.<\/strong> Si $f : [0,1] \\to [0,1]$ est continue, $g(x) = f(x) - x$ vérifie $g(0) \\ge 0$ et $g(1) \\le 0$ : $f$ a un point fixe.<\/p>\n<h2>Idée 2 · Une fonction continue sur un segment est bornée et atteint ses bornes<\/h2>\n<p>Si $f$ est continue sur un <strong>segment<\/strong> $[a, b]$ (fermé et borné), alors $f$ est bornée et il existe $x_m, x_M$ avec $f(x_m) = \\min f$ et $f(x_M) = \\max f$. Donc $f([a, b]) = [m, M]$.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Les deux mots comptent. Sur $]0, 1]$, $\\tfrac1x$ n&#39;est pas bornée. Sur $[0, +\\infty[$, $\\arctan$ est bornée mais n&#39;atteint pas $\\tfrac\\pi2$.<\/p>\n<\/aside><h2>Idée 3 · Théorème de la bijection<\/h2>\n<p>Si $f$ est <strong>continue et strictement monotone<\/strong> sur un intervalle $I$, alors $f$ est une bijection de $I$ sur l&#39;intervalle $J = f(I)$. Sa réciproque $f^{-1}$ est continue, strictement monotone, de même sens que $f$.<\/p>\n<p><strong>Exemple.<\/strong> $f(x) = x^3 + 4x - 1$ est continue, strictement croissante sur $\\mathbb R$, avec limites $-\\infty$ et $+\\infty$ : c&#39;est une bijection de $\\mathbb R$ sur $\\mathbb R$.<\/p>\n<p>Les graphes de $f$ et $f^{-1}$ sont symétriques par rapport à la droite $y = x$.<\/p>\n<h2>Idée 4 · Continuité uniforme<\/h2>\n<p>$f$ est <strong>uniformément continue<\/strong> sur $I$ si $\\forall \\varepsilon &gt; 0, \\exists \\delta &gt; 0, \\forall x, y \\in I, |x - y| &lt; \\delta \\Rightarrow |f(x) - f(y)| &lt; \\varepsilon$.<\/p>\n<p>La différence avec la continuité : ici, $\\delta$ ne dépend que de $\\varepsilon$, <strong>pas du point<\/strong>.<\/p>\n<figure class=\"grille\"><figcaption>Ce qui implique quoi<\/figcaption><table><tr><th>Propriété,<\/th><th>Conséquence<\/th><\/tr><tr><td class=\"h1\">k-lipschitzienne (<\/td><td>f(x) - f(y)<\/td><td>≤ k<\/td><td>x - y<\/td><td>), uniformément continue (prendre δ = ε/k)<\/td><\/tr><tr><td class=\"h1\">uniformément<\/td><td>continue,<\/td><td>continue<\/td><\/tr><tr><td class=\"h1\">continue<\/td><td>sur<\/td><td>un<\/td><td>segment<\/td><td>[a,<\/td><td>b],<\/td><td>uniformément<\/td><td>continue<\/td><td>(théorème<\/td><td>de<\/td><td>Heine)<\/td><\/tr><tr><td class=\"h0\">continue<\/td><td>sur<\/td><td>ℝ,<\/td><td>pas<\/td><td>forcément<\/td><td>uniformément<\/td><td>continue<\/td><td>(x²)<\/td><\/tr><\/table><\/figure><p><strong>Exemple.<\/strong> $x \\mapsto x^2$ n&#39;est pas uniformément continue sur $\\mathbb R$ : avec $x_n = n + \\tfrac1n$, $y_n = n$, on a $x_n - y_n \\to 0$ mais $x_n^2 - y_n^2 = 2 + \\tfrac1{n^2} \\ge 2$.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Les grands théorèmes<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>$f : [a, b] \\to \\mathbb R$ continue avec $f(a) &lt; f(b)$. Soit $E = \\{x \\in [a, b] : f(x) \\le f(a)\\}$. Montre que $E$ a une borne supérieure $\\alpha$ et que $a \\le \\alpha &lt; b$. (Série 3, exercice 2)<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>$a \\in E$ et $E \\subset [a, b]$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>$E$ contient $a$ (non vide) et est majoré par $b$ : $\\alpha = \\sup E$ existe et $\\alpha \\ge a$. Par continuité en $b$, $f(x) &gt; f(a)$ pour $x$ proche de $b$, donc ces $x$ ne sont pas dans $E$ : $\\alpha &lt; b$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Montre que l&#39;équation $\\cos x = x$ a une unique solution dans $[0, \\tfrac\\pi2]$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$g(x) = \\cos x - x$ est continue, $g(0) = 1 &gt; 0$, $g(\\tfrac\\pi2) = -\\tfrac\\pi2 &lt; 0$ : existence par le TVI. $g'(x) = -\\sin x - 1 &lt; 0$ sur $]0, \\tfrac\\pi2]$ : strictement décroissante, d&#39;où l&#39;unicité.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Montre que $f(x) = \\dfrac{x}{1 + |x|}$ est 1-lipschitzienne sur $\\mathbb R^+$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Pour $x, y \\ge 0$ : $f(x) - f(y) = \\dfrac{x - y}{(1 + x)(1 + y)}$, donc $|f(x) - f(y)| \\le |x - y|$. Elle est donc uniformément continue.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Le TVI demande :<\/div><button class=\"opt\" data-o=\"0\">$f$ continue sur un intervalle<\/button><button class=\"opt\" data-o=\"1\">$f$ dérivable<\/button><button class=\"opt\" data-o=\"2\">$f$ monotone<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">$x^5 + x - 1 = 0$ admet une solution dans :<\/div><button class=\"opt\" data-o=\"0\">$]0, 1[$<\/button><button class=\"opt\" data-o=\"1\">$]1, 2[$<\/button><button class=\"opt\" data-o=\"2\">aucune<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">$\\frac1x$ sur $[-1, 1] \\setminus\\{0\\}$ ne s&#39;annule pas car :<\/div><button class=\"opt\" data-o=\"0\">le TVI est faux<\/button><button class=\"opt\" data-o=\"1\">l&#39;ensemble n&#39;est pas un intervalle<\/button><button class=\"opt\" data-o=\"2\">$\\frac1x$ n&#39;est pas monotone<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Une fonction continue sur $]0, 1]$ est :<\/div><button class=\"opt\" data-o=\"0\">toujours bornée<\/button><button class=\"opt\" data-o=\"1\">pas forcément bornée<\/button><button class=\"opt\" data-o=\"2\">toujours atteinte en son max<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">L&#39;unicité d&#39;une solution vient en général de :<\/div><button class=\"opt\" data-o=\"0\">la continuité<\/button><button class=\"opt\" data-o=\"1\">la stricte monotonie<\/button><button class=\"opt\" data-o=\"2\">le TVI<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">La réciproque d&#39;une fonction continue strictement décroissante sur un intervalle est :<\/div><button class=\"opt\" data-o=\"0\">croissante<\/button><button class=\"opt\" data-o=\"1\">continue et strictement décroissante<\/button><button class=\"opt\" data-o=\"2\">pas forcément continue<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">$x^2$ sur $\\mathbb R$ est :<\/div><button class=\"opt\" data-o=\"0\">continue mais pas uniformément continue<\/button><button class=\"opt\" data-o=\"1\">uniformément continue<\/button><button class=\"opt\" data-o=\"2\">lipschitzienne<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Théorème de Heine : continue sur un segment implique :<\/div><button class=\"opt\" data-o=\"0\">dérivable<\/button><button class=\"opt\" data-o=\"1\">uniformément continue<\/button><button class=\"opt\" data-o=\"2\">lipschitzienne<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">$f$ $k$-lipschitzienne : quel $\\delta$ pour $\\varepsilon$ ?<\/div><button class=\"opt\" data-o=\"0\">$\\frac{\\varepsilon}{k}$<\/button><button class=\"opt\" data-o=\"1\">$k\\varepsilon$<\/button><button class=\"opt\" data-o=\"2\">$\\varepsilon^2$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">$f : [0,1] \\to [0,1]$ continue :<\/div><button class=\"opt\" data-o=\"0\">a au moins un point fixe<\/button><button class=\"opt\" data-o=\"1\">n&#39;a pas de point fixe<\/button><button class=\"opt\" data-o=\"2\">a exactement un point fixe<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"grands-theoremes-continuite","rep":null,"tol":null},{"n":"grands-theoremes-continuite","rep":null,"tol":null},{"n":"grands-theoremes-continuite","rep":null,"tol":null},{"n":"grands-theoremes-continuite","rep":null,"tol":null}],"qcm":[{"n":"grands-theoremes-continuite","q":"Le TVI demande :","o":["$f$ continue sur un intervalle","$f$ dérivable","$f$ monotone"],"a":0,"e":"La continuité suffit."},{"n":"grands-theoremes-continuite","q":"$x^5 + x - 1 = 0$ admet une solution dans :","o":["$]0, 1[$","$]1, 2[$","aucune"],"a":0,"e":"$f(0) = -1$, $f(1) = 1$."},{"n":"grands-theoremes-continuite","q":"$\\frac1x$ sur $[-1, 1] \\setminus\\{0\\}$ ne s&#39;annule pas car :","o":["le TVI est faux","l&#39;ensemble n&#39;est pas un intervalle","$\\frac1x$ n&#39;est pas monotone"],"a":1,"e":"Le domaine est coupé en 0."},{"n":"grands-theoremes-continuite","q":"Une fonction continue sur $]0, 1]$ est :","o":["toujours bornée","pas forcément bornée","toujours atteinte en son max"],"a":1,"e":"$\\frac1x$ est un contre-exemple."},{"n":"grands-theoremes-continuite","q":"L&#39;unicité d&#39;une solution vient en général de :","o":["la continuité","la stricte monotonie","le TVI"],"a":1,"e":"Une fonction strictement monotone est injective."},{"n":"grands-theoremes-continuite","q":"La réciproque d&#39;une fonction continue strictement décroissante sur un intervalle est :","o":["croissante","continue et strictement décroissante","pas forcément continue"],"a":1,"e":"Théorème de la bijection."},{"n":"grands-theoremes-continuite","q":"$x^2$ sur $\\mathbb R$ est :","o":["continue mais pas uniformément continue","uniformément continue","lipschitzienne"],"a":0,"e":"Sa pente grandit sans limite."},{"n":"grands-theoremes-continuite","q":"Théorème de Heine : continue sur un segment implique :","o":["dérivable","uniformément continue","lipschitzienne"],"a":1,"e":"Le segment est essentiel."},{"n":"grands-theoremes-continuite","q":"$f$ $k$-lipschitzienne : quel $\\delta$ pour $\\varepsilon$ ?","o":["$\\frac{\\varepsilon}{k}$","$k\\varepsilon$","$\\varepsilon^2$"],"a":0,"e":"$|f(x) - f(y)| \\le k|x - y| &lt; k\\delta = \\varepsilon$."},{"n":"grands-theoremes-continuite","q":"$f : [0,1] \\to [0,1]$ continue :","o":["a au moins un point fixe","n&#39;a pas de point fixe","a exactement un point fixe"],"a":0,"e":"TVI sur $f(x) - x$ ; il peut y en avoir plusieurs."}]},{"id":"fonctions-usuelles","t":"Racines n-ièmes, puissances, fonctions circulaires réciproques","seance":"Chapitre 3 · Fonctions d'une variable réelle","imp":3,"html":"<h2>Avant de commencer<\/h2>\n<p>Tout ce chapitre applique le <strong>théorème de la bijection<\/strong> : une fonction continue strictement monotone a une réciproque.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Pourquoi $x \\mapsto x^2$ n&#39;a-t-elle pas de réciproque sur $\\mathbb R$, mais en a une sur $[0, +\\infty[$ ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Sur $\\mathbb R$, elle n&#39;est pas injective ($(-2)^2 = 2^2$). Sur $[0, +\\infty[$, elle est continue et strictement croissante : bijection vers $[0, +\\infty[$, de réciproque $\\sqrt{\\ }$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Une réciproque = restreindre puis inverser.<\/strong> Pour chaque fonction, retiens l&#39;intervalle de départ choisi : c&#39;est lui qui fixe l&#39;image de la réciproque.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Écrire $\\arcsin(\\sin x) = x$ pour tout $x$. C&#39;est faux hors de $[-\\tfrac\\pi2, \\tfrac\\pi2]$ : $\\arcsin(\\sin \\pi) = \\arcsin 0 = 0 \\ne \\pi$.<\/p>\n<\/aside><p>À la fin, tu sais manipuler $\\sqrt[n]{x}$, $x^r$ pour $r$ rationnel, et $\\arcsin$, $\\arccos$, $\\arctan$ avec leurs domaines.<\/p>\n<h2>Idée 1 · La racine n-ième<\/h2>\n<p>Pour $n \\ge 1$, $x \\mapsto x^n$ est continue strictement croissante de $[0, +\\infty[$ sur $[0, +\\infty[$. Sa réciproque est $\\sqrt[n]{x}$ :<\/p>\n<p>$y = \\sqrt[n]{x}$ avec $x \\ge 0$ $\\iff$ $y^n = x$ avec $y \\ge 0$.<\/p>\n<p>Propriétés : $\\sqrt[n]{ab} = \\sqrt[n]a \\sqrt[n]b$ ; $\\sqrt[n]a &lt; \\sqrt[n]b \\iff a &lt; b$ ; $(\\sqrt[n]x)^n = \\sqrt[n]{x^n} = x$ pour $x \\ge 0$.<\/p>\n<h2>Idée 2 · Puissances rationnelles<\/h2>\n<p>Pour $x &gt; 0$ et $r = \\tfrac pq$ ($p \\in \\mathbb Z$, $q \\in \\mathbb N^*$), on pose $x^r = \\sqrt[q]{x^p}$. Le résultat ne dépend pas de l&#39;écriture de $r$.<\/p>\n<p><strong>Exemple.<\/strong> $8^{2/3} = \\sqrt[3]{64} = 4$. Les règles $x^{r+s} = x^r x^s$ et $(x^r)^s = x^{rs}$ restent vraies.<\/p>\n<h2>Idée 3 · arcsin, arccos, arctan<\/h2>\n<figure class=\"grille\"><figcaption>Les trois réciproques<\/figcaption><table><tr><th>Fonction,<\/th><th>Restreinte<\/th><th>à,<\/th><th>Réciproque,<\/th><th>Définie<\/th><th>sur,<\/th><th>À<\/th><th>valeurs<\/th><th>dans<\/th><\/tr><tr><td class=\"h1\">sin<\/td><td>(croissante),<\/td><td>[-π/2,<\/td><td>π/2],<\/td><td>arcsin,<\/td><td>[-1,<\/td><td>1],<\/td><td>[-π/2,<\/td><td>π/2]<\/td><\/tr><tr><td class=\"h1\">cos<\/td><td>(décroissante),<\/td><td>[0,<\/td><td>π],<\/td><td>arccos,<\/td><td>[-1,<\/td><td>1],<\/td><td>[0,<\/td><td>π]<\/td><\/tr><tr><td class=\"h1\">tan<\/td><td>(croissante),<\/td><td>]-π/2,<\/td><td>π/2[,<\/td><td>arctan,<\/td><td>ℝ,<\/td><td>]-π/2,<\/td><td>π/2[<\/td><\/tr><\/table><\/figure><svg viewBox=\"0 0 340 170\" style=\"width:100%;max-width:440px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Graphe de arctan : croissante, entre deux asymptotes horizontales moins pi sur deux et pi sur deux\">\n<line x1=\"20\" y1=\"85\" x2=\"330\" y2=\"85\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line x1=\"175\" y1=\"10\" x2=\"175\" y2=\"160\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n<line x1=\"20\" y1=\"25\" x2=\"330\" y2=\"25\" stroke=\"#D9824F\" stroke-dasharray=\"5 4\"/><line x1=\"20\" y1=\"145\" x2=\"330\" y2=\"145\" stroke=\"#D9824F\" stroke-dasharray=\"5 4\"/>\n<path d=\"M20 141 C120 138 140 120 175 85 S230 32 330 29\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"/>\n<g font-family=\"sans-serif\" font-size=\"13\" font-weight=\"700\"><text x=\"280\" y=\"20\" fill=\"#D9824F\">π/2<\/text><text x=\"272\" y=\"162\" fill=\"#D9824F\">-π/2<\/text><text x=\"30\" y=\"70\" fill=\"currentColor\">arctan<\/text><\/g>\n<\/svg><p>Formules sûres :<\/p>\n<ul>\n<li>$\\sin(\\arcsin x) = x$ pour $x \\in [-1, 1]$ ; $\\arcsin(\\sin x) = x$ seulement pour $x \\in [-\\tfrac\\pi2, \\tfrac\\pi2]$.<\/li>\n<li>$\\cos(\\arcsin x) = \\sqrt{1 - x^2}$ (car $\\cos \\ge 0$ sur $[-\\tfrac\\pi2, \\tfrac\\pi2]$).<\/li>\n<li>$\\arcsin x + \\arccos x = \\dfrac\\pi2$ pour $x \\in [-1, 1]$.<\/li>\n<li>$\\arctan x + \\arctan \\tfrac1x = \\dfrac\\pi2$ pour $x &gt; 0$.<\/li>\n<\/ul>\n<p><strong>Exemple.<\/strong> $\\arcsin \\tfrac12 = \\tfrac\\pi6$, $\\arccos \\tfrac12 = \\tfrac\\pi3$, et $\\tfrac\\pi6 + \\tfrac\\pi3 = \\tfrac\\pi2$. $\\arctan 1 = \\tfrac\\pi4$.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Calculer arcsin(sin x) pour x hors de [-π/2, π/2]<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · Chercher un angle y dans [-π/2, π/2]<\/div><p>Avec $\\sin y = \\sin x$ : essayer $y = \\pi - x$ ou $y = x - 2k\\pi$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · Vérifier l&#39;intervalle<\/div><p>$y$ doit être dans $[-\\tfrac\\pi2, \\tfrac\\pi2]$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · Conclure<\/div><p>$\\arcsin(\\sin x) = y$.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p><strong>Exemple.<\/strong> $\\arcsin(\\sin \\tfrac{5\\pi}{6})$ : $\\pi - \\tfrac{5\\pi}6 = \\tfrac\\pi6 \\in [-\\tfrac\\pi2, \\tfrac\\pi2]$, donc le résultat est $\\tfrac\\pi6$.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Fonctions usuelles<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Calcule $\\cos(\\arctan x)$ pour $x$ réel.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>$1 + \\tan^2 = \\tfrac1{\\cos^2}$, et $\\cos &gt; 0$ sur $]-\\tfrac\\pi2, \\tfrac\\pi2[$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Avec $\\theta = \\arctan x$ : $\\cos^2\\theta = \\tfrac1{1 + x^2}$ et $\\cos\\theta &gt; 0$, donc $\\cos(\\arctan x) = \\tfrac{1}{\\sqrt{1 + x^2}}$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Calcule $\\arccos(\\cos \\tfrac{4\\pi}{3})$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$\\cos\\tfrac{4\\pi}3 = \\cos\\tfrac{2\\pi}3$ et $\\tfrac{2\\pi}3 \\in [0, \\pi]$. Résultat : $\\tfrac{2\\pi}{3}$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Montre que $\\arcsin x + \\arccos x = \\tfrac\\pi2$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Soit $t = \\arccos x \\in [0, \\pi]$. Alors $\\tfrac\\pi2 - t \\in [-\\tfrac\\pi2, \\tfrac\\pi2]$ et $\\sin(\\tfrac\\pi2 - t) = \\cos t = x$, donc $\\arcsin x = \\tfrac\\pi2 - t$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">$\\sqrt[3]{-8}$ dans ce cours (racine définie sur $[0,+\\infty[$) :<\/div><button class=\"opt\" data-o=\"0\">vaut $-2$<\/button><button class=\"opt\" data-o=\"1\">n&#39;est pas définie<\/button><button class=\"opt\" data-o=\"2\">vaut 2<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">$16^{3/4}$ vaut :<\/div><button class=\"opt\" data-o=\"0\">12<\/button><button class=\"opt\" data-o=\"1\">8<\/button><button class=\"opt\" data-o=\"2\">4<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">$\\arcsin(\\sin \\pi)$ vaut :<\/div><button class=\"opt\" data-o=\"0\">0<\/button><button class=\"opt\" data-o=\"1\">$\\pi$<\/button><button class=\"opt\" data-o=\"2\">$\\frac\\pi2$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">arccos est à valeurs dans :<\/div><button class=\"opt\" data-o=\"0\">$[-\\frac\\pi2, \\frac\\pi2]$<\/button><button class=\"opt\" data-o=\"1\">$[0, \\pi]$<\/button><button class=\"opt\" data-o=\"2\">$\\mathbb R$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">$\\arctan 1$ vaut :<\/div><button class=\"opt\" data-o=\"0\">$\\frac\\pi4$<\/button><button class=\"opt\" data-o=\"1\">$\\frac\\pi2$<\/button><button class=\"opt\" data-o=\"2\">1<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">$\\lim_{x\\to+\\infty} \\arctan x$ :<\/div><button class=\"opt\" data-o=\"0\">$+\\infty$<\/button><button class=\"opt\" data-o=\"1\">$\\frac\\pi2$<\/button><button class=\"opt\" data-o=\"2\">$\\pi$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">$\\cos(\\arcsin x)$ vaut :<\/div><button class=\"opt\" data-o=\"0\">$\\sqrt{1 - x^2}$<\/button><button class=\"opt\" data-o=\"1\">$-\\sqrt{1 - x^2}$<\/button><button class=\"opt\" data-o=\"2\">$1 - x^2$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">$\\arcsin\\frac12 + \\arccos\\frac12$ :<\/div><button class=\"opt\" data-o=\"0\">$\\pi$<\/button><button class=\"opt\" data-o=\"1\">$\\frac\\pi2$<\/button><button class=\"opt\" data-o=\"2\">$\\frac\\pi3$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">arcsin est :<\/div><button class=\"opt\" data-o=\"0\">strictement croissante<\/button><button class=\"opt\" data-o=\"1\">strictement décroissante<\/button><button class=\"opt\" data-o=\"2\">périodique<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">$\\arccos(\\cos\\frac{4\\pi}3)$ :<\/div><button class=\"opt\" data-o=\"0\">$\\frac{4\\pi}3$<\/button><button class=\"opt\" data-o=\"1\">$\\frac{2\\pi}3$<\/button><button class=\"opt\" data-o=\"2\">$-\\frac{2\\pi}3$<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"fonctions-usuelles","rep":null,"tol":null},{"n":"fonctions-usuelles","rep":null,"tol":null},{"n":"fonctions-usuelles","rep":null,"tol":null},{"n":"fonctions-usuelles","rep":null,"tol":null}],"qcm":[{"n":"fonctions-usuelles","q":"$\\sqrt[3]{-8}$ dans ce cours (racine définie sur $[0,+\\infty[$) :","o":["vaut $-2$","n&#39;est pas définie","vaut 2"],"a":1,"e":"La racine n-ième est définie ici pour $x \\ge 0$."},{"n":"fonctions-usuelles","q":"$16^{3/4}$ vaut :","o":["12","8","4"],"a":1,"e":"$\\sqrt[4]{16} = 2$, puis $2^3 = 8$."},{"n":"fonctions-usuelles","q":"$\\arcsin(\\sin \\pi)$ vaut :","o":["0","$\\pi$","$\\frac\\pi2$"],"a":0,"e":"$\\sin\\pi = 0$ et $\\arcsin 0 = 0$."},{"n":"fonctions-usuelles","q":"arccos est à valeurs dans :","o":["$[-\\frac\\pi2, \\frac\\pi2]$","$[0, \\pi]$","$\\mathbb R$"],"a":1,"e":"Restriction de $\\cos$ à $[0, \\pi]$."},{"n":"fonctions-usuelles","q":"$\\arctan 1$ vaut :","o":["$\\frac\\pi4$","$\\frac\\pi2$","1"],"a":0,"e":"$\\tan\\frac\\pi4 = 1$."},{"n":"fonctions-usuelles","q":"$\\lim_{x\\to+\\infty} \\arctan x$ :","o":["$+\\infty$","$\\frac\\pi2$","$\\pi$"],"a":1,"e":"Asymptote horizontale."},{"n":"fonctions-usuelles","q":"$\\cos(\\arcsin x)$ vaut :","o":["$\\sqrt{1 - x^2}$","$-\\sqrt{1 - x^2}$","$1 - x^2$"],"a":0,"e":"Le cosinus est positif sur $[-\\frac\\pi2, \\frac\\pi2]$."},{"n":"fonctions-usuelles","q":"$\\arcsin\\frac12 + \\arccos\\frac12$ :","o":["$\\pi$","$\\frac\\pi2$","$\\frac\\pi3$"],"a":1,"e":"Formule générale."},{"n":"fonctions-usuelles","q":"arcsin est :","o":["strictement croissante","strictement décroissante","périodique"],"a":0,"e":"Même sens que $\\sin$ sur $[-\\frac\\pi2, \\frac\\pi2]$."},{"n":"fonctions-usuelles","q":"$\\arccos(\\cos\\frac{4\\pi}3)$ :","o":["$\\frac{4\\pi}3$","$\\frac{2\\pi}3$","$-\\frac{2\\pi}3$"],"a":1,"e":"On ramène dans $[0, \\pi]$."}]},{"id":"derivabilite","t":"Dérivabilité, règles de calcul, dérivée d'une réciproque","seance":"Chapitre 4 · Fonctions dérivables","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>La dérivée est une <strong>limite<\/strong> de taux d&#39;accroissement. Il faut savoir calculer une limite de fonction.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Calcule $\\lim_{h \\to 0} \\dfrac{(1 + h)^2 - 1}{h}$.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 2<\/b><\/p><p>$\\dfrac{2h + h^2}{h} = 2 + h \\to 2$. C&#39;est déjà la dérivée de $x^2$ en 1.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Dérivée = pente de la tangente.<\/strong> Les formules servent partout, mais aux points délicats (raccord, valeur absolue, racine en 0), reviens toujours au taux d&#39;accroissement.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>« Continue donc dérivable. » Faux : $|x|$ est continue en 0 mais pas dérivable. Le sens vrai est l&#39;inverse : dérivable donc continue.<\/p>\n<\/aside><p>À la fin, tu sais étudier la dérivabilité en un point, dériver avec les règles, et dériver une réciproque.<\/p>\n<h2>Idée 1 · Le taux d&#39;accroissement<\/h2>\n<svg viewBox=\"0 0 340 180\" style=\"width:100%;max-width:440px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Les sécantes entre a et a plus h se rapprochent de la tangente en a quand h tend vers 0\">\n<path d=\"M30 160 Q150 150 320 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"/>\n<line x1=\"60\" y1=\"170\" x2=\"320\" y2=\"85\" stroke=\"#D9824F\" stroke-width=\"2\"/>\n<line x1=\"60\" y1=\"190\" x2=\"320\" y2=\"20\" stroke=\"currentColor\" stroke-dasharray=\"5 4\"/>\n<circle cx=\"150\" cy=\"140\" r=\"4.5\" fill=\"#D9824F\"/><circle cx=\"270\" cy=\"62\" r=\"4.5\" fill=\"currentColor\"/>\n<g font-family=\"sans-serif\" font-size=\"13\" font-weight=\"700\"><text x=\"140\" y=\"162\" fill=\"#D9824F\">a<\/text><text x=\"278\" y=\"62\" fill=\"currentColor\">a + h<\/text><text x=\"230\" y=\"112\" fill=\"#D9824F\">tangente<\/text><\/g>\n<\/svg><p>$f$ est <strong>dérivable en $a$<\/strong> si $\\dfrac{f(a + h) - f(a)}{h}$ a une limite <strong>finie<\/strong> quand $h \\to 0$. Cette limite est $f'(a)$. La tangente a pour équation $y = f(a) + f'(a)(x - a)$.<\/p>\n<p><strong>Dérivées à gauche et à droite<\/strong> : mêmes limites avec $h \\to 0^-$ ou $h \\to 0^+$. Dérivable ssi les deux existent et sont égales.<\/p>\n<p><strong>Exemple.<\/strong> $|x|$ en 0 : taux $\\tfrac{|h|}{h}$, vaut 1 à droite et $-1$ à gauche. Pas dérivable (point anguleux).<\/p>\n<p><strong>Exemple.<\/strong> $\\sqrt x$ en 0 : taux $\\tfrac{1}{\\sqrt h} \\to +\\infty$. Pas dérivable (tangente verticale).<\/p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Dérivable en $a$ implique continue en $a$. La réciproque est fausse.<\/p>\n<\/aside><h2>Idée 2 · Les règles de calcul<\/h2>\n<figure class=\"grille\"><figcaption>Formulaire<\/figcaption><table><tr><th>Opération,<\/th><th>Dérivée<\/th><\/tr><tr><td class=\"h1\">u<\/td><td>+<\/td><td>v,<\/td><td>u'<\/td><td>+<\/td><td>v'<\/td><\/tr><tr><td class=\"h1\">uv,<\/td><td>u'v<\/td><td>+<\/td><td>uv'<\/td><\/tr><tr><td class=\"h1\">u<\/td><td>/<\/td><td>v<\/td><td>(v<\/td><td>≠<\/td><td>0),<\/td><td>(u'v<\/td><td>-<\/td><td>uv')<\/td><td>/<\/td><td>v²<\/td><\/tr><tr><td class=\"h1\">g<\/td><td>∘<\/td><td>u,<\/td><td>u'<\/td><td>×<\/td><td>g'(u)<\/td><\/tr><tr><td class=\"h0\">xⁿ,<\/td><td>n<\/td><td>xⁿ⁻¹<\/td><\/tr><tr><td class=\"h0\">√x<\/td><td>(x<\/td><td>&gt;<\/td><td>0),<\/td><td>1<\/td><td>/<\/td><td>(2√x)<\/td><\/tr><tr><td class=\"h0\">arcsin x (<\/td><td>x<\/td><td>&lt; 1), 1 / √(1 - x²)<\/td><\/tr><tr><td class=\"h0\">arctan<\/td><td>x,<\/td><td>1<\/td><td>/<\/td><td>(1<\/td><td>+<\/td><td>x²)<\/td><\/tr><\/table><\/figure><p><strong>Exemple.<\/strong> $(\\sin(x^2))' = 2x\\cos(x^2)$.<\/p>\n<h2>Idée 3 · Dérivée d&#39;une réciproque<\/h2>\n<p>Si $f$ est continue strictement monotone sur $I$, dérivable en $a$ avec $f'(a) \\ne 0$, alors $f^{-1}$ est dérivable en $b = f(a)$ et<\/p>\n<p>$$(f^{-1})'(b) = \\frac{1}{f'(f^{-1}(b))} = \\frac{1}{f'(a)}.$$<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Calculer (f⁻¹)'(b)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · Trouver a<\/div><p>Résoudre $f(a) = b$ (souvent une valeur évidente).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · Calculer f&#39;(a)<\/div><p>Vérifier $f'(a) \\ne 0$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · Inverser<\/div><p>$(f^{-1})'(b) = \\dfrac{1}{f'(a)}$.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p><strong>Exemple (type cours).<\/strong> $f(x) = x^3 + 4x - 1$. On cherche $(f^{-1})'(4)$ : $f(1) = 4$, $f'(x) = 3x^2 + 4$, $f'(1) = 7$. Donc $(f^{-1})'(4) = \\tfrac17$.<\/p>\n<p><strong>Exemple.<\/strong> $\\arctan$ : avec $f = \\tan$, $f' = 1 + \\tan^2$, donc $\\arctan'(x) = \\dfrac{1}{1 + x^2}$.<\/p>\n<h2>Idée 4 · Extremum et dérivée nulle<\/h2>\n<p>Si $f$ est dérivable en $c$, intérieur à l&#39;intervalle, et que $f$ a un maximum ou un minimum local en $c$, alors $f'(c) = 0$.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>La réciproque est fausse : $x^3$ a une dérivée nulle en 0 sans extremum. Et en une <strong>borne<\/strong> de l&#39;intervalle, un extremum n&#39;impose pas $f'(c) = 0$.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Dérivabilité<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>$f(x) = x^2 \\sin\\tfrac1x$ pour $x \\ne 0$, $f(0) = 0$. Est-elle dérivable en 0 ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Taux : $\\tfrac{f(h)}{h} = h\\sin\\tfrac1h$, et $|h \\sin\\tfrac1h| \\le |h| \\to 0$. Oui, $f'(0) = 0$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>$f(x) = x|x|$. Dérivable en 0 ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Taux : $\\tfrac{h|h|}{h} = |h| \\to 0$. Oui, $f'(0) = 0$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>$f(x) = x^5 + x$. Calcule $(f^{-1})'(2)$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$f(1) = 2$, $f'(1) = 5 + 1 = 6$, donc $(f^{-1})'(2) = \\tfrac16$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la ré
