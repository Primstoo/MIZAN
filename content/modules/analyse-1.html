vision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">$|x|$ en 0 est :<\/div><button class=\"opt\" data-o=\"0\">continue mais pas dérivable<\/button><button class=\"opt\" data-o=\"1\">dérivable<\/button><button class=\"opt\" data-o=\"2\">discontinue<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">$\\sqrt x$ en 0 :<\/div><button class=\"opt\" data-o=\"0\">est dérivable de dérivée 0<\/button><button class=\"opt\" data-o=\"1\">n&#39;est pas dérivable (tangente verticale)<\/button><button class=\"opt\" data-o=\"2\">n&#39;est pas continue<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">$(\\cos(3x))'$ :<\/div><button class=\"opt\" data-o=\"0\">$\\sin 3x$<\/button><button class=\"opt\" data-o=\"1\">$-3\\sin 3x$<\/button><button class=\"opt\" data-o=\"2\">$3\\cos 3x$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">$\\arcsin'(x)$ :<\/div><button class=\"opt\" data-o=\"0\">$\\frac{1}{\\sqrt{1 - x^2}}$<\/button><button class=\"opt\" data-o=\"1\">$\\frac{-1}{\\sqrt{1-x^2}}$<\/button><button class=\"opt\" data-o=\"2\">$\\frac{1}{1 + x^2}$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">$f(x) = x^3 + 4x - 1$, $(f^{-1})'(4)$ :<\/div><button class=\"opt\" data-o=\"0\">7<\/button><button class=\"opt\" data-o=\"1\">$\\frac17$<\/button><button class=\"opt\" data-o=\"2\">$\\frac14$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Dérivable en $a$ implique :<\/div><button class=\"opt\" data-o=\"0\">continue en $a$<\/button><button class=\"opt\" data-o=\"1\">monotone autour de $a$<\/button><button class=\"opt\" data-o=\"2\">$f'(a) \\ne 0$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">$f'(c) = 0$ implique un extremum en $c$ :<\/div><button class=\"opt\" data-o=\"0\">toujours<\/button><button class=\"opt\" data-o=\"1\">pas forcément<\/button><button class=\"opt\" data-o=\"2\">jamais<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">$(u/v)'$ :<\/div><button class=\"opt\" data-o=\"0\">$\\frac{u'v' }{v^2}$<\/button><button class=\"opt\" data-o=\"1\">$\\frac{u'v - uv'}{v^2}$<\/button><button class=\"opt\" data-o=\"2\">$\\frac{uv' - u'v}{v^2}$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">$x|x|$ en 0 :<\/div><button class=\"opt\" data-o=\"0\">dérivable, $f'(0) = 0$<\/button><button class=\"opt\" data-o=\"1\">pas dérivable<\/button><button class=\"opt\" data-o=\"2\">dérivable, $f'(0) = 1$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Pour que $f^{-1}$ soit dérivable en $f(a)$, il faut :<\/div><button class=\"opt\" data-o=\"0\">$f'(a) = 0$<\/button><button class=\"opt\" data-o=\"1\">$f'(a) \\ne 0$<\/button><button class=\"opt\" data-o=\"2\">$f$ paire<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"derivabilite","rep":["2"],"tol":null},{"n":"derivabilite","rep":null,"tol":null},{"n":"derivabilite","rep":null,"tol":null},{"n":"derivabilite","rep":null,"tol":null}],"qcm":[{"n":"derivabilite","q":"$|x|$ en 0 est :","o":["continue mais pas dérivable","dérivable","discontinue"],"a":0,"e":"Point anguleux."},{"n":"derivabilite","q":"$\\sqrt x$ en 0 :","o":["est dérivable de dérivée 0","n&#39;est pas dérivable (tangente verticale)","n&#39;est pas continue"],"a":1,"e":"Le taux tend vers $+\\infty$."},{"n":"derivabilite","q":"$(\\cos(3x))'$ :","o":["$\\sin 3x$","$-3\\sin 3x$","$3\\cos 3x$"],"a":1,"e":"Composée."},{"n":"derivabilite","q":"$\\arcsin'(x)$ :","o":["$\\frac{1}{\\sqrt{1 - x^2}}$","$\\frac{-1}{\\sqrt{1-x^2}}$","$\\frac{1}{1 + x^2}$"],"a":0,"e":"Pour $|x| &lt; 1$."},{"n":"derivabilite","q":"$f(x) = x^3 + 4x - 1$, $(f^{-1})'(4)$ :","o":["7","$\\frac17$","$\\frac14$"],"a":1,"e":"$f(1) = 4$, $f'(1) = 7$."},{"n":"derivabilite","q":"Dérivable en $a$ implique :","o":["continue en $a$","monotone autour de $a$","$f'(a) \\ne 0$"],"a":0,"e":"Résultat de cours."},{"n":"derivabilite","q":"$f'(c) = 0$ implique un extremum en $c$ :","o":["toujours","pas forcément","jamais"],"a":1,"e":"$x^3$ en 0."},{"n":"derivabilite","q":"$(u/v)'$ :","o":["$\\frac{u'v' }{v^2}$","$\\frac{u'v - uv'}{v^2}$","$\\frac{uv' - u'v}{v^2}$"],"a":1,"e":"Formule du quotient."},{"n":"derivabilite","q":"$x|x|$ en 0 :","o":["dérivable, $f'(0) = 0$","pas dérivable","dérivable, $f'(0) = 1$"],"a":0,"e":"Taux $|h| \\to 0$."},{"n":"derivabilite","q":"Pour que $f^{-1}$ soit dérivable en $f(a)$, il faut :","o":["$f'(a) = 0$","$f'(a) \\ne 0$","$f$ paire"],"a":1,"e":"Sinon tangente verticale pour la réciproque."}]},{"id":"rolle-accroissements-finis","t":"Théorème de Rolle et accroissements finis","seance":"Chapitre 4 · Fonctions dérivables","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut le résultat « extremum intérieur implique $f'(c) = 0$ » et le fait qu&#39;une fonction continue sur un segment atteint ses bornes.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>$f$ continue sur $[0, 1]$ : atteint-elle un maximum ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Oui : continue sur un segment, elle est bornée et atteint ses bornes. C&#39;est le point de départ de la preuve de Rolle.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Une idée géométrique : quelque part, la tangente est parallèle à la corde.<\/strong> Rolle est le cas où la corde est horizontale ; les accroissements finis, le cas général.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Oublier une hypothèse. Il faut <strong>continue sur $[a, b]$<\/strong> (fermé) <strong>et dérivable sur $]a, b[$<\/strong> (ouvert). $|x|$ sur $[-1, 1]$ : $f(-1) = f(1)$, mais $f'$ ne s&#39;annule jamais, car $f$ n&#39;est pas dérivable en 0.<\/p>\n<\/aside><p>À la fin, tu sais appliquer Rolle, le TAF et l&#39;inégalité des accroissements finis pour encadrer, majorer et compter des racines.<\/p>\n<h2>Idée 1 · Le théorème de Rolle<\/h2>\n<svg viewBox=\"0 0 340 170\" style=\"width:100%;max-width:440px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Une courbe qui part et revient à la même hauteur a un sommet où la tangente est horizontale\">\n<line x1=\"20\" y1=\"150\" x2=\"330\" y2=\"150\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<path d=\"M50 120 C90 30 150 30 190 80 S270 140 300 120\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"/>\n<line x1=\"60\" y1=\"120\" x2=\"290\" y2=\"120\" stroke=\"currentColor\" stroke-dasharray=\"5 4\"/>\n<line x1=\"70\" y1=\"52\" x2=\"170\" y2=\"52\" stroke=\"#D9824F\" stroke-width=\"2.5\"/>\n<circle cx=\"120\" cy=\"52\" r=\"4.5\" fill=\"#D9824F\"/>\n<g font-family=\"sans-serif\" font-size=\"13\" font-weight=\"700\"><text x=\"30\" y=\"115\" fill=\"currentColor\">f(a)<\/text><text x=\"296\" y=\"112\" fill=\"currentColor\">f(b)<\/text><text x=\"100\" y=\"42\" fill=\"#D9824F\">f'(c) = 0<\/text><\/g>\n<\/svg><p>Si $f$ est continue sur $[a, b]$, dérivable sur $]a, b[$ et $f(a) = f(b)$, alors il existe $c \\in ]a, b[$ tel que $f'(c) = 0$.<\/p>\n<p>Pourquoi : $f$ atteint un max et un min sur $[a, b]$. Si les deux sont aux bornes, $f$ est constante et $f' = 0$. Sinon l&#39;un est intérieur, et la dérivée s&#39;y annule.<\/p>\n<p><strong>Usage : compter des racines.<\/strong> Si $f'$ ne s&#39;annule pas sur un intervalle, $f$ y a au plus une racine (sinon Rolle entre les deux donnerait $f'(c) = 0$).<\/p>\n<h2>Idée 2 · Le théorème des accroissements finis (TAF)<\/h2>\n<p>Si $f$ est continue sur $[a, b]$ et dérivable sur $]a, b[$, il existe $c \\in ]a, b[$ tel que<\/p>\n<p>$$f(b) - f(a) = f'(c)(b - a).$$<\/p>\n<p>On l&#39;obtient en appliquant Rolle à $g(x) = f(x) - \\dfrac{f(b) - f(a)}{b - a}(x - a)$, qui vérifie $g(a) = g(b)$.<\/p>\n<p><strong>Conséquences.<\/strong> Sur un intervalle : $f' \\ge 0$ implique $f$ croissante ; $f' = 0$ implique $f$ constante.<\/p>\n<h2>Idée 3 · L&#39;inégalité des accroissements finis (IAF)<\/h2>\n<p>Si de plus $|f'(x)| \\le k$ sur $]a, b[$, alors $|f(b) - f(a)| \\le k|b - a|$. Une dérivée bornée par $k$ rend $f$ $k$-lipschitzienne.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Encadrer une expression avec le TAF<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Reconnaître f(b) - f(a)<\/div><p>Exemple : $\\ln(x + 1) - \\ln x$ avec $f = \\ln$, $a = x$, $b = x + 1$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Appliquer le TAF<\/div><p>Il existe $c \\in ]a, b[$ avec $f(b) - f(a) = f'(c)(b - a)$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Encadrer f&#39;(c)<\/div><p>Avec $a &lt; c &lt; b$ et la monotonie de $f'$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Conclure<\/div><p>Remplacer dans l&#39;égalité.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p><strong>Exemple.<\/strong> Pour $x &gt; 0$ : $\\ln(x + 1) - \\ln x = \\tfrac1c$ avec $x &lt; c &lt; x + 1$, donc $\\dfrac{1}{x+1} &lt; \\ln(x+1) - \\ln x &lt; \\dfrac1x$.<\/p>\n<p><strong>Exemple (type cours).<\/strong> Pour $x &gt; 0$ : $\\sqrt[3]{x + 1} - \\sqrt[3]x = \\dfrac{1}{3c^{2/3}}$ avec $c &gt; x$, donc $0 &lt; \\sqrt[3]{x+1} - \\sqrt[3]x &lt; \\dfrac{1}{3x^{2/3}}$.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Rolle et TAF<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Montre que pour $0 &lt; a &lt; b$ : $\\dfrac{b - a}{b} &lt; \\ln\\dfrac ba &lt; \\dfrac{b - a}{a}$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>TAF à $\\ln$ sur $[a, b]$ : $\\ln b - \\ln a = \\tfrac{b - a}{c}$ avec $a &lt; c &lt; b$. Comme $\\tfrac1b &lt; \\tfrac1c &lt; \\tfrac1a$, on obtient l&#39;encadrement.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Montre que $x^3 + x + 1 = 0$ a exactement une solution réelle.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$f(x) = x^3 + x + 1$ : $f(-1) = -1$, $f(0) = 1$, TVI : au moins une. $f'(x) = 3x^2 + 1 &gt; 0$ : par Rolle, pas deux racines. Exactement une.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Montre que $|\\sin x - \\sin y| \\le |x - y|$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>IAF avec $|\\sin'| = |\\cos| \\le 1$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Montre que pour $x &gt; 0$, $\\arctan x &gt; \\dfrac{x}{1 + x^2}$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>TAF sur $[0, x]$ : $\\arctan x = \\tfrac{x}{1 + c^2}$ avec $0 &lt; c &lt; x$. Comme $c^2 &lt; x^2$, $\\tfrac{x}{1 + c^2} &gt; \\tfrac{x}{1 + x^2}$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Rolle demande que $f$ soit dérivable sur :<\/div><button class=\"opt\" data-o=\"0\">$[a, b]$<\/button><button class=\"opt\" data-o=\"1\">$]a, b[$<\/button><button class=\"opt\" data-o=\"2\">$\\mathbb R$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">$|x|$ sur $[-1, 1]$ :<\/div><button class=\"opt\" data-o=\"0\">vérifie Rolle avec $c = 0$<\/button><button class=\"opt\" data-o=\"1\">ne vérifie pas les hypothèses de Rolle<\/button><button class=\"opt\" data-o=\"2\">a une dérivée nulle quelque part<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Le TAF donne :<\/div><button class=\"opt\" data-o=\"0\">$f(b) - f(a) = f'(c)(b - a)$<\/button><button class=\"opt\" data-o=\"1\">$f'(c) = 0$<\/button><button class=\"opt\" data-o=\"2\">$f(b) = f(a)$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Si $|f'| \\le 2$ sur $\\mathbb R$, alors $|f(5) - f(1)|$ est au plus :<\/div><button class=\"opt\" data-o=\"0\">2<\/button><button class=\"opt\" data-o=\"1\">8<\/button><button class=\"opt\" data-o=\"2\">4<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">$\\ln(x+1) - \\ln x$ pour $x &gt; 0$ est majoré par :<\/div><button class=\"opt\" data-o=\"0\">$\\frac1x$<\/button><button class=\"opt\" data-o=\"1\">$\\frac1{x+1}$<\/button><button class=\"opt\" data-o=\"2\">$x$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">$f' = 0$ sur un intervalle implique :<\/div><button class=\"opt\" data-o=\"0\">$f$ constante<\/button><button class=\"opt\" data-o=\"1\">$f$ nulle<\/button><button class=\"opt\" data-o=\"2\">rien<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">$f' &gt; 0$ sur $\\mathbb R$ : combien de racines au plus pour $f$ ?<\/div><button class=\"opt\" data-o=\"0\">deux<\/button><button class=\"opt\" data-o=\"1\">une<\/button><button class=\"opt\" data-o=\"2\">aucune<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Dans la preuve du TAF, on applique Rolle à :<\/div><button class=\"opt\" data-o=\"0\">$f$<\/button><button class=\"opt\" data-o=\"1\">$f$ moins la droite qui passe par les extrémités<\/button><button class=\"opt\" data-o=\"2\">$f'$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">$f' \\ge 0$ sur un intervalle implique :<\/div><button class=\"opt\" data-o=\"0\">$f$ croissante<\/button><button class=\"opt\" data-o=\"1\">$f$ positive<\/button><button class=\"opt\" data-o=\"2\">$f$ convexe<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">$|\\sin x - \\sin y| \\le$ :<\/div><button class=\"opt\" data-o=\"0\">$|x - y|$<\/button><button class=\"opt\" data-o=\"1\">$|x + y|$<\/button><button class=\"opt\" data-o=\"2\">$2|x - y|^2$<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"rolle-accroissements-finis","rep":null,"tol":null},{"n":"rolle-accroissements-finis","rep":null,"tol":null},{"n":"rolle-accroissements-finis","rep":null,"tol":null},{"n":"rolle-accroissements-finis","rep":null,"tol":null},{"n":"rolle-accroissements-finis","rep":null,"tol":null}],"qcm":[{"n":"rolle-accroissements-finis","q":"Rolle demande que $f$ soit dérivable sur :","o":["$[a, b]$","$]a, b[$","$\\mathbb R$"],"a":1,"e":"Les bornes peuvent être des points non dérivables."},{"n":"rolle-accroissements-finis","q":"$|x|$ sur $[-1, 1]$ :","o":["vérifie Rolle avec $c = 0$","ne vérifie pas les hypothèses de Rolle","a une dérivée nulle quelque part"],"a":1,"e":"Non dérivable en 0."},{"n":"rolle-accroissements-finis","q":"Le TAF donne :","o":["$f(b) - f(a) = f'(c)(b - a)$","$f'(c) = 0$","$f(b) = f(a)$"],"a":0,"e":"Pente de la corde."},{"n":"rolle-accroissements-finis","q":"Si $|f'| \\le 2$ sur $\\mathbb R$, alors $|f(5) - f(1)|$ est au plus :","o":["2","8","4"],"a":1,"e":"IAF : $2 \\times 4$."},{"n":"rolle-accroissements-finis","q":"$\\ln(x+1) - \\ln x$ pour $x &gt; 0$ est majoré par :","o":["$\\frac1x$","$\\frac1{x+1}$","$x$"],"a":0,"e":"TAF avec $c &gt; x$."},{"n":"rolle-accroissements-finis","q":"$f' = 0$ sur un intervalle implique :","o":["$f$ constante","$f$ nulle","rien"],"a":0,"e":"Conséquence du TAF."},{"n":"rolle-accroissements-finis","q":"$f' &gt; 0$ sur $\\mathbb R$ : combien de racines au plus pour $f$ ?","o":["deux","une","aucune"],"a":1,"e":"Rolle."},{"n":"rolle-accroissements-finis","q":"Dans la preuve du TAF, on applique Rolle à :","o":["$f$","$f$ moins la droite qui passe par les extrémités","$f'$"],"a":1,"e":"Ainsi $g(a) = g(b)$."},{"n":"rolle-accroissements-finis","q":"$f' \\ge 0$ sur un intervalle implique :","o":["$f$ croissante","$f$ positive","$f$ convexe"],"a":0,"e":"Conséquence du TAF."},{"n":"rolle-accroissements-finis","q":"$|\\sin x - \\sin y| \\le$ :","o":["$|x - y|$","$|x + y|$","$2|x - y|^2$"],"a":0,"e":"IAF avec $|\\cos| \\le 1$."}]},{"id":"series-td-corrigees","t":"Séries de TD corrigées","seance":"Séries 1 à 3 · Travaux dirigés","imp":5,"html":"<p>Exercices types des séries de TD d&#39;Analyse 1 de la FSABM (nombres réels, suites, fonctions). Les énoncés sont reformulés ; les corrigés sont rédigés par ToumaiLearn.<\/p>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Cherche chaque exercice 10 minutes avant d&#39;ouvrir l&#39;indice, puis le corrigé. Rédige comme en examen : hypothèses, outil, conclusion.<\/p>\n<\/aside><h2>Série 1 · Nombres réels<\/h2>\n<section class=\"exo\"><h3>Irrationalité, récurrence, inégalités<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Montre que $\\dfrac{\\ln 3}{\\ln 2}$ est irrationnel.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Par l&#39;absurde, écris-le $\\tfrac pq$ avec $p, q \\ge 1$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Supposons $\\tfrac{\\ln3}{\\ln2} = \\tfrac pq$ avec $p, q \\in \\mathbb N^*$ (le quotient est $&gt; 0$). Alors $q\\ln 3 = p\\ln 2$, donc $3^q = 2^p$. Le membre de gauche est impair, celui de droite pair ($p \\ge 1$) : contradiction.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Montre que pour tout $n \\ge 1$ : $\\sum_{p=1}^{n} p \\cdot p! = (n + 1)! - 1$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Récurrence ; remarque que $(n+1)\\cdot(n+1)! + (n+1)! = (n+2)!$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Pour $n = 1$ : $1 = 2! - 1$. Si c&#39;est vrai au rang $n$, alors $\\sum_{p=1}^{n+1} p\\cdot p! = (n+1)! - 1 + (n+1)(n+1)! = (n+1)!(n+2) - 1 = (n+2)! - 1$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Montre que $x^2 + y^2 + xy + 1 &gt; 0$ pour tous réels $x, y$, puis que $x \\ne y \\Rightarrow x^3 + x \\ne y^3 + y$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Forme canonique en $x$ ; puis factorise $x^3 - y^3$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>$x^2 + xy + y^2 + 1 = (x + \\tfrac y2)^2 + \\tfrac34 y^2 + 1 &gt; 0$. Si $x^3 + x = y^3 + y$ avec $x \\ne y$ : $(x - y)(x^2 + xy + y^2 + 1) = 0$, donc $x^2 + xy + y^2 + 1 = 0$, impossible.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Pour $a \\ge 1$ et $b \\ge 1$, montre que $a\\sqrt{b - 1} + b\\sqrt{a - 1} \\le ab$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>$(\\sqrt{b-1} - 1)^2 \\ge 0$ donne $2\\sqrt{b - 1} \\le b$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>De $(\\sqrt{b-1} - 1)^2 \\ge 0$ on tire $\\sqrt{b-1} \\le \\tfrac b2$, de même $\\sqrt{a-1} \\le \\tfrac a2$. Donc $a\\sqrt{b-1} + b\\sqrt{a-1} \\le \\tfrac{ab}2 + \\tfrac{ab}2 = ab$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Partie entière et densité<\/h3><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Montre que $E(x + p) = E(x) + p$ pour $x$ réel et $p$ entier.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$E(x) \\le x &lt; E(x) + 1$ donne $E(x) + p \\le x + p &lt; E(x) + p + 1$ ; $E(x) + p$ est un entier : c&#39;est $E(x + p)$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>Montre que $E\\left(\\dfrac{E(nx)}{n}\\right) = E(x)$ pour $n \\ge 1$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Encadre $\\tfrac{E(nx)}{n}$ entre $E(x)$ et $x$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>$nE(x) \\le nx$ et $nE(x)$ entier, donc $nE(x) \\le E(nx) \\le nx$. En divisant : $E(x) \\le \\tfrac{E(nx)}n \\le x &lt; E(x) + 1$. D&#39;où le résultat.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><p>Montre que $D = \\{\\tfrac{m}{2^n},\\ m \\in \\mathbb Z,\\ n \\in \\mathbb N\\}$ est dense dans $\\mathbb R$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Prends $n$ avec $2^n(y - x) &gt; 1$, puis $m = E(2^n x) + 1$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Soient $x &lt; y$. Comme $2^n \\ge n$, il existe $n$ avec $2^n(y - x) &gt; 1$. Avec $m = E(2^n x) + 1$ : $2^n x &lt; m \\le 2^n x + 1 &lt; 2^n y$, donc $x &lt; \\tfrac m{2^n} &lt; y$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"7\"><div class=\"ex-q\"><p>Soit $A = \\left\\{\\dfrac{n - 1}{n},\\ n \\ge 1\\right\\}$. Donne $\\inf A$, $\\sup A$, et dis s&#39;ils sont atteints.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$\\tfrac{n-1}{n} = 1 - \\tfrac1n$ croît de 0 vers 1. $\\min A = 0$ (atteint en $n = 1$). $\\sup A = 1$, non atteint (caractérisation : pour $\\varepsilon &gt; 0$, $1 - \\tfrac1n &gt; 1 - \\varepsilon$ dès que $n &gt; \\tfrac1\\varepsilon$).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Série 2 · Suites réelles<\/h2>\n<section class=\"exo\"><h3>Monotonie, Cauchy, sous-suites<\/h3><div class=\"ex\" data-x=\"8\"><div class=\"ex-q\"><p>Soit $a \\in ]0, 1[$ et $u_n = \\prod_{k=1}^{n}(1 + a^k)$. Montre que $(u_n)$ est croissante, puis que $u_n \\le e^{v_n}$ avec $v_n = \\sum_{k=1}^n a^k$. Conclus.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>$\\ln(1 + t) \\le t$ pour $t &gt; -1$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>$\\tfrac{u_{n+1}}{u_n} = 1 + a^{n+1} &gt; 1$ : croissante. $\\ln u_n = \\sum \\ln(1 + a^k) \\le \\sum a^k = v_n \\le \\tfrac{a}{1 - a}$. Donc $u_n \\le e^{a/(1-a)}$ : croissante et majorée, elle converge.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"9\"><div class=\"ex-q\"><p>Montre que $u_n = \\sum_{k=1}^{n} \\dfrac{(-1)^{k-1}}{k}$ converge.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Montre que $(u_{2n})$ et $(u_{2n+1})$ sont adjacentes.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>$u_{2n+2} - u_{2n} = \\tfrac1{2n+1} - \\tfrac1{2n+2} &gt; 0$ : $(u_{2n})$ croît. $u_{2n+3} - u_{2n+1} = -\\tfrac1{2n+2} + \\tfrac1{2n+3} &lt; 0$ : $(u_{2n+1})$ décroît. $u_{2n+1} - u_{2n} = \\tfrac1{2n+1} \\to 0$. Adjacentes : même limite $\\ell$, donc $u_n \\to \\ell$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"10\"><div class=\"ex-q\"><p>Montre que $u_n = \\sum_{k=1}^{n} \\dfrac1k$ n&#39;est pas de Cauchy, puis que $u_n \\to +\\infty$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$u_{2n} - u_n \\ge n\\cdot\\tfrac1{2n} = \\tfrac12$ : pas de Cauchy, donc divergente. Elle est croissante : non majorée, elle tend vers $+\\infty$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"11\"><div class=\"ex-q\"><p>$u_0 = a$ et $u_{n+1} = \\dfrac12 + \\dfrac{u_n^2}{2}$. Montre que $(u_n)$ est croissante. Si elle converge, quelle est sa limite ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>$u_{n+1} - u_n = \\tfrac12(u_n - 1)^2$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>$u_{n+1} - u_n = \\tfrac12(u_n^2 - 2u_n + 1) = \\tfrac12(u_n - 1)^2 \\ge 0$ : croissante. Si $u_n \\to \\ell$, alors $\\ell = \\tfrac12 + \\tfrac{\\ell^2}2$, soit $(\\ell - 1)^2 = 0$ : $\\ell = 1$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Série 3 · Fonctions d&#39;une variable réelle<\/h2>\n<section class=\"exo\"><h3>Limites, continuité, TVI<\/h3><div class=\"ex\" data-x=\"12\"><div class=\"ex-q\"><p>Montre qu&#39;une fonction périodique non constante n&#39;a pas de limite en $+\\infty$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Soit $T$ la période et $x_0, x_1$ avec $f(x_0) \\ne f(x_1)$. Les suites $x_0 + nT$ et $x_1 + nT$ tendent vers $+\\infty$, et leurs images valent $f(x_0)$ et $f(x_1)$ : deux limites différentes.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"13\"><div class=\"ex-q\"><p>Soit $f : [0, 1] \\to [0, 1]$ continue et croissante. Montre que $f$ a un point fixe.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>TVI sur $g(x) = f(x) - x$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>$g(0) = f(0) \\ge 0$, $g(1) = f(1) - 1 \\le 0$, $g$ continue : il existe $c$ avec $g(c) = 0$, soit $f(c) = c$. (La croissance n&#39;est pas nécessaire ici.)<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"14\"><div class=\"ex-q\"><p>Soit $f$ continue en $a$ avec $f(a) \\ne 0$. Montre que $f$ garde un signe constant au voisinage de $a$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Avec $\\varepsilon = \\tfrac{|f(a)|}2$ : il existe $\\delta$ tel que $|x - a| &lt; \\delta \\Rightarrow |f(x) - f(a)| &lt; \\tfrac{|f(a)|}2$, donc $f(x)$ a le signe de $f(a)$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"15\"><div class=\"ex-q\"><p>$f : \\mathbb R \\to \\mathbb R$ continue en 0, avec $f(x + y) = f(x) + f(y)$ et $f(1) = k$. Montre que $f(x) = kx$ pour tout $x$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>$f(0)$, puis $f(n)$, $f(\\tfrac pq)$, puis densité.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>$f(0) = 2f(0)$ donc $f(0) = 0$ ; $f(-x) = -f(x)$. Par récurrence $f(n) = kn$, puis $f(-n) = -kn$. Pour $r = \\tfrac pq$ : $qf(r) = f(p) = kp$, donc $f(r) = kr$. $f$ est continue partout ($f(x + h) - f(x) = f(h) \\to 0$) et égale à $kx$ sur $\\mathbb Q$, dense : $f(x) = kx$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 7 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Pour montrer que $3^q = 2^p$ est impossible ($p, q \\ge 1$), on utilise :<\/div><button class=\"opt\" data-o=\"0\">la parité<\/button><button class=\"opt\" data-o=\"1\">la monotonie de $\\ln$<\/button><button class=\"opt\" data-o=\"2\">le TVI<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">$(x + \\frac y2)^2 + \\frac34y^2 + 1$ est égal à :<\/div><button class=\"opt\" data-o=\"0\">$x^2 + xy + y^2 + 1$<\/button><button class=\"opt\" data-o=\"1\">$x^2 + y^2 + 1$<\/button><button class=\"opt\" data-o=\"2\">$x^2 + 2xy + y^2 + 1$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">$\\inf\\{1 - \\frac1n, n \\ge 1\\}$ vaut :<\/div><button class=\"opt\" data-o=\"0\">0<\/button><button class=\"opt\" data-o=\"1\">1<\/button><button class=\"opt\" data-o=\"2\">$-1$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Pour la somme alternée $\\sum \\frac{(-1)^{k-1}}{k}$, on utilise :<\/div><button class=\"opt\" data-o=\"0\">la limite monotone directe<\/button><button class=\"opt\" data-o=\"1\">deux sous-suites adjacentes<\/button><button class=\"opt\" data-o=\"2\">le TVI<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">$\\ln(1 + t) \\le t$ sert à majorer :<\/div><button class=\"opt\" data-o=\"0\">un produit<\/button><button class=\"opt\" data-o=\"1\">une somme alternée<\/button><button class=\"opt\" data-o=\"2\">une partie entière<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Si $f(x+y) = f(x) + f(y)$, alors $f(0)$ :<\/div><button class=\"opt\" data-o=\"0\">vaut 0<\/button><button class=\"opt\" data-o=\"1\">vaut 1<\/button><button class=\"opt\" data-o=\"2\">est quelconque<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Pour passer de $\\mathbb Q$ à $\\mathbb R$, il faut :<\/div><button class=\"opt\" data-o=\"0\">la dérivabilité<\/button><button class=\"opt\" data-o=\"1\">la continuité<\/button><button class=\"opt\" data-o=\"2\">la monotonie seulement<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Une fonction périodique non constante en $+\\infty$ :<\/div><button class=\"opt\" data-o=\"0\">tend vers sa moyenne<\/button><button class=\"opt\" data-o=\"1\">n&#39;a pas de limite<\/button><button class=\"opt\" data-o=\"2\">tend vers 0<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">$E(x + 3)$ vaut :<\/div><button class=\"opt\" data-o=\"0\">$E(x) + 3$<\/button><button class=\"opt\" data-o=\"1\">$E(x)$<\/button><button class=\"opt\" data-o=\"2\">$3E(x)$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">$u_{n+1} = \\frac12 + \\frac{u_n^2}2$ converge. Sa limite est :<\/div><button class=\"opt\" data-o=\"0\">1<\/button><button class=\"opt\" data-o=\"1\">0<\/button><button class=\"opt\" data-o=\"2\">$\\frac12$<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"series-td-corrigees","rep":null,"tol":null},{"n":"series-td-corrigees","rep":null,"tol":null},{"n":"series-td-corrigees","rep":null,"tol":null},{"n":"series-td-corrigees","rep":null,"tol":null},{"n":"series-td-corrigees","rep":null,"tol":null},{"n":"series-td-corrigees","rep":null,"tol":null},{"n":"series-td-corrigees","rep":null,"tol":null},{"n":"series-td-corrigees","rep":null,"tol":null},{"n":"series-td-corrigees","rep":null,"tol":null},{"n":"series-td-corrigees","rep":null,"tol":null},{"n":"series-td-corrigees","rep":null,"tol":null},{"n":"series-td-corrigees","rep":null,"tol":null},{"n":"series-td-corrigees","rep":null,"tol":null},{"n":"series-td-corrigees","rep":null,"tol":null},{"n":"series-td-corrigees","rep":null,"tol":null},{"n":"series-td-corrigees","rep":null,"tol":null}],"qcm":[{"n":"series-td-corrigees","q":"Pour montrer que $3^q = 2^p$ est impossible ($p, q \\ge 1$), on utilise :","o":["la parité","la monotonie de $\\ln$","le TVI"],"a":0,"e":"Impair contre pair."},{"n":"series-td-corrigees","q":"$(x + \\frac y2)^2 + \\frac34y^2 + 1$ est égal à :","o":["$x^2 + xy + y^2 + 1$","$x^2 + y^2 + 1$","$x^2 + 2xy + y^2 + 1$"],"a":0,"e":"On développe."},{"n":"series-td-corrigees","q":"$\\inf\\{1 - \\frac1n, n \\ge 1\\}$ vaut :","o":["0","1","$-1$"],"a":0,"e":"Atteint en $n = 1$."},{"n":"series-td-corrigees","q":"Pour la somme alternée $\\sum \\frac{(-1)^{k-1}}{k}$, on utilise :","o":["la limite monotone directe","deux sous-suites adjacentes","le TVI"],"a":1,"e":"Les termes pairs montent, les impairs descendent."},{"n":"series-td-corrigees","q":"$\\ln(1 + t) \\le t$ sert à majorer :","o":["un produit","une somme alternée","une partie entière"],"a":0,"e":"Le $\\ln$ transforme le produit en somme."},{"n":"series-td-corrigees","q":"Si $f(x+y) = f(x) + f(y)$, alors $f(0)$ :","o":["vaut 0","vaut 1","est quelconque"],"a":0,"e":"$f(0) = 2f(0)$."},{"n":"series-td-corrigees","q":"Pour passer de $\\mathbb Q$ à $\\mathbb R$, il faut :","o":["la dérivabilité","la continuité","la monotonie seulement"],"a":1,"e":"Densité et continuité."},{"n":"series-td-corrigees","q":"Une fonction périodique non constante en $+\\infty$ :","o":["tend vers sa moyenne","n&#39;a pas de limite","tend vers 0"],"a":1,"e":"Deux suites, deux valeurs."},{"n":"series-td-corrigees","q":"$E(x + 3)$ vaut :","o":["$E(x) + 3$","$E(x)$","$3E(x)$"],"a":0,"e":"On peut sortir les entiers."},{"n":"series-td-corrigees","q":"$u_{n+1} = \\frac12 + \\frac{u_n^2}2$ converge. Sa limite est :","o":["1","0","$\\frac12$"],"a":0,"e":"$(\\ell - 1)^2 = 0$."}]},{"id":"examen-blanc","t":"Examen blanc corrigé","seance":"Révision · Examen de fin de semestre","imp":5,"payant":true,"html":"<p>Sujet d&#39;entraînement de 1 h 30, dans l&#39;esprit des examens d&#39;Analyse 1 de la FSABM. Sans calculatrice. Barème indicatif sur 20.<\/p>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Lis tout le sujet d&#39;abord. Commence par l&#39;exercice où tu te sens le plus sûr, et rédige chaque question avec hypothèses et conclusion.<\/p>\n<\/aside><h2>Exercice 1 · Borne supérieure (4 points)<\/h2>\n<section class=\"exo\"><h3>Exercice 1<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Soit $A = \\left\\{ \\dfrac{1}{n} + \\dfrac{1}{m},\\ n, m \\in \\mathbb N^* \\right\\}$. Détermine $\\sup A$ et $\\inf A$. Sont-ils atteints ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Majorer chaque terme par 1, minorer par 0, puis la caractérisation avec $\\varepsilon$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Chaque élément vérifie $0 &lt; \\tfrac1n + \\tfrac1m \\le 2$, et 2 est atteint ($n = m = 1$) : $\\max A = \\sup A = 2$. 0 minore $A$. Pour $\\varepsilon &gt; 0$, avec $n = m &gt; \\tfrac2\\varepsilon$ : $\\tfrac2n &lt; \\varepsilon$. Donc $\\inf A = 0$, non atteint (les éléments sont $&gt; 0$).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Exercice 2 · Suite récurrente (5 points)<\/h2>\n<section class=\"exo\"><h3>Exercice 2<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Soit $u_0 = 1$ et $u_{n+1} = \\sqrt{2 + u_n}$. (a) Montre que $1 \\le u_n \\le 2$. (b) Montre que $(u_n)$ est croissante. (c) Conclus et donne la limite.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>Récurrence ; puis $u_{n+1}^2 - u_n^2 = (2 - u_n)(1 + u_n)$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 2<\/b><\/p><p>(a) $u_0 = 1$. Si $1 \\le u_n \\le 2$ : $\\sqrt3 \\le u_{n+1} \\le 2$, donc $1 \\le u_{n+1} \\le 2$. (b) $u_{n+1}^2 - u_n^2 = 2 + u_n - u_n^2 = (2 - u_n)(1 + u_n) \\ge 0$ ; les termes étant positifs, $u_{n+1} \\ge u_n$. (c) Croissante et majorée : elle converge vers $\\ell \\in [1, 2]$ avec $\\ell = \\sqrt{2 + \\ell}$, soit $\\ell^2 - \\ell - 2 = 0$ : $\\ell = 2$.<\/p>\n<\/div><\/div><\/section><h2>Exercice 3 · Somme et critère de Cauchy (3 points)<\/h2>\n<section class=\"exo\"><h3>Exercice 3<\/h3><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Soit $U_n = \\sum_{k=1}^{n} \\dfrac{1}{\\sqrt k}$. Montre que $(U_n)$ n&#39;est pas une suite de Cauchy. Quelle est sa limite ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$U_{2n} - U_n = \\sum_{k=n+1}^{2n}\\tfrac1{\\sqrt k} \\ge \\tfrac{n}{\\sqrt{2n}} = \\sqrt{\\tfrac n2} \\ge \\tfrac1{\\sqrt2}$. Avec $\\varepsilon = \\tfrac1{\\sqrt2}$, ce n&#39;est pas une suite de Cauchy, donc elle diverge. Croissante et divergente : non majorée, elle tend vers $+\\infty$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Exercice 4 · Continuité et équation (4 points)<\/h2>\n<section class=\"exo\"><h3>Exercice 4<\/h3><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Soit $n \\ge 1$ et $g_n(x) = x^n + \\arctan x - 1$ sur $[0, +\\infty[$. (a) Montre que $g_n(x) = 0$ a une unique solution $a_n$, et que $a_n \\in ]0, 1[$. (b) Montre que $(a_n)$ est croissante.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>(b) Calcule $g_{n+1}(a_n)$ en utilisant $a_n^{n+1} &lt; a_n^n$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>(a) $g_n$ est continue, strictement croissante (somme de deux fonctions strictement croissantes). $g_n(0) = -1 &lt; 0$ et $g_n(1) = \\tfrac\\pi4 &gt; 0$ : par le TVI et la bijection, unique solution $a_n \\in ]0, 1[$. (b) Comme $0 &lt; a_n &lt; 1$, $a_n^{n+1} &lt; a_n^n$, donc $g_{n+1}(a_n) &lt; g_n(a_n) = 0 = g_{n+1}(a_{n+1})$. $g_{n+1}$ étant strictement croissante, $a_n &lt; a_{n+1}$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Exercice 5 · Dérivabilité et accroissements finis (4 points)<\/h2>\n<section class=\"exo\"><h3>Exercice 5<\/h3><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>(a) $f(x) = x^2\\sin\\tfrac1x$ si $x \\ne 0$, $f(0) = 0$. Montre que $f$ est dérivable en 0. (b) À l&#39;aide du TAF, montre que pour $x &gt; 0$ : $\\dfrac{1}{2\\sqrt{x+1}} &lt; \\sqrt{x+1} - \\sqrt x &lt; \\dfrac{1}{2\\sqrt x}$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>(a) $\\left|\\tfrac{f(h) - f(0)}{h}\\right| = |h\\sin\\tfrac1h| \\le |h| \\to 0$ : $f'(0) = 0$. (b) TAF à $\\sqrt{\\ }$ sur $[x, x+1]$ : $\\sqrt{x+1} - \\sqrt x = \\tfrac{1}{2\\sqrt c}$ avec $x &lt; c &lt; x + 1$. Comme $\\sqrt x &lt; \\sqrt c &lt; \\sqrt{x+1}$, on obtient l&#39;encadrement.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Bilan<\/h2>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Les points se perdent surtout sur les hypothèses oubliées : « continue sur un intervalle » pour le TVI, « croissante <strong>et<\/strong> majorée » pour la limite monotone, « continue sur $[a,b]$, dérivable sur $]a,b[$ » pour le TAF.<\/p>\n<\/aside>","ex":[{"n":"examen-blanc","rep":null,"tol":null},{"n":"examen-blanc","rep":["2"],"tol":null},{"n":"examen-blanc","rep":null,"tol":null},{"n":"examen-blanc","rep":null,"tol":null},{"n":"examen-blanc","rep":null,"tol":null}],"qcm":[]},{"id":"annale-fstbm-bcg-2021","t":"Annale corrigée · contrôle d'analyse FST Béni Mellal (BCG, février 2021)","seance":"Contrôle d'analyse du 18/02/2021, filière BCG section B, semestre 1 (1 h 30)","imp":4,"payant":true,"html":"<p>Un vrai contrôle de la FST Béni Mellal (filière BCG). Il touche la valeur absolue, les fonctions réciproques, les suites, les équivalents, les DL, les primitives et une équation différentielle. Certaines questions (DL, primitives, équation différentielle) dépassent l&#39;Analyse 1 de certaines facs : saute-les si ton prof ne les a pas faites.<\/p>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Fais le sujet en 1 h 30 sur papier avant d&#39;ouvrir les corrigés.<\/p>\n<\/aside><h2>Questions de cours<\/h2>\n<section class=\"exo\"><h3>Questions de cours<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><ol>\n<li>Montrer $|x + y| \\le |x| + |y|$.<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>On a $-|x| \\le x \\le |x|$ et $-|y| \\le y \\le |y|$. On additionne : $-(|x|+|y|) \\le x + y \\le |x| + |y|$, c&#39;est exactement $|x+y| \\le |x|+|y|$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>2a) Résoudre $\\arccos(\\sin x) = \\pi - x$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Un arccos est dans $[0, \\pi]$, donc il faut $x \\in [0, \\pi]$. Alors $\\sin x = \\cos(\\pi - x)$ donne $\\cos(\\pi - x) = \\sin x$, soit $-\\cos x = \\sin x$ : $x = \\frac{3\\pi}{4}$. Vérification : $\\sin\\frac{3\\pi}{4} = \\frac{\\sqrt2}{2}$ et $\\arccos\\frac{\\sqrt2}{2} = \\frac{\\pi}{4} = \\pi - \\frac{3\\pi}{4}$. <strong>Solution : $x = \\frac{3\\pi}{4}$.<\/strong><\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>2b) Résoudre $|x^2 - 1| = x^2 - 1$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$|A| = A \\iff A \\ge 0$. Donc $x^2 \\ge 1$ : <strong>$x \\in\\, ]-\\infty, -1] \\cup [1, +\\infty[$<\/strong>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><ol start=\"3\">\n<li>DL à l&#39;ordre 3 en 0 de $e^{\\cos x}$, $\\frac{1}{2-x}$, $\\tan x$.<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$e^{\\cos x} = e\\cdot e^{\\cos x - 1} = e\\left(1 - \\frac{x^2}{2}\\right) + o(x^3)$. $\\frac{1}{2-x} = \\frac12 \\cdot \\frac{1}{1 - x/2} = \\frac12 + \\frac{x}{4} + \\frac{x^2}{8} + \\frac{x^3}{16} + o(x^3)$. $\\tan x = x + \\frac{x^3}{3} + o(x^3)$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Exercice 1 · une suite arithmético-géométrique (COVID à Béni Mellal)<\/h2>\n<p><strong>Énoncé.<\/strong> Fin septembre 2020 : $U_0 = 6000$ infectés. Chaque mois, 6 % guérissent et 600 nouveaux cas apparaissent. 1) Calculer $U_1$, $U_2$ et exprimer $U_{n+1}$. 2) $V_n = U_n - 10000$ : montrer qu&#39;elle est géométrique, limite de $U_n$. 3) Quel mois $U_n$ dépasse-t-il 10 000 ?<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Méthode pour toute suite u(n+1) = a·u(n) + b<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · 1. Cherche le point fixe ℓ : ℓ = aℓ + b, ici ℓ = 0,94ℓ + 600, donc ℓ = 10 000.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · 2. Pose v(n) = u(n) − ℓ : elle est géométrique de raison a.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · 3. Écris u(n) = ℓ + (u(0) − ℓ)·aⁿ.<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><section class=\"exo\"><h3>Exercice 1<\/h3><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><ol>\n<li>Valeur de $U_1$ (fin octobre).<\/li>\n<\/ol>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 6240<\/b><\/p><p>$U_{n+1} = 0{,}94\\,U_n + 600$. $U_1 = 0{,}94 \\times 6000 + 600 = 6240$, puis $U_2 = 6465{,}6$.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><ol start=\"2\">\n<li>Nature de $V_n$ et limite de $U_n$.<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$V_{n+1} = U_{n+1} - 10000 = 0{,}94U_n - 9400 = 0{,}94\\,V_n$ : géométrique de raison $0{,}94$, $V_0 = -4000$. Donc $U_n = 10000 - 4000 \\times 0{,}94^n \\to 10000$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><ol start=\"3\">\n<li>Quel mois dépasse 10 000 ?<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><strong>Jamais.<\/strong> $U_n = 10000 - 4000\\times0{,}94^n$ reste strictement inférieur à 10 000 : la suite monte vers 10 000 sans l&#39;atteindre. Écris-le avec cette justification : c&#39;est la réponse attendue, la question est un piège.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Ne cherche pas un n avec la calculatrice : le calcul de $U_n$ explicite montre qu&#39;aucun n ne convient.<\/p>\n<\/aside><h2>Exercice 2 · continuité, équivalent, prolongement<\/h2>\n<p><strong>Énoncé.<\/strong> $f(x) = \\dfrac{\\ln(1+x^2) - 2x\\sin x}{\\sqrt{x^2+1} - 1}$.<\/p>\n<section class=\"exo\"><h3>Exercice 2<\/h3><div class=\"ex\" data-x=\"7\"><div class=\"ex-q\"><ol>\n<li>Continuité de f.<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Le dénominateur s&#39;annule seulement en 0. f est définie et continue sur $\\mathbb R^*$ (somme, produit, quotient de fonctions continues).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"8\"><div class=\"ex-q\"><ol start=\"2\">\n<li>Équivalent de f en 0.<\/li>\n<\/ol>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : -2<\/b><\/p><p>Numérateur : $\\ln(1+x^2) \\sim x^2$ et $2x\\sin x \\sim 2x^2$, donc numérateur $= x^2 - 2x^2 + o(x^2) \\sim -x^2$. Dénominateur : $\\sqrt{1+x^2} - 1 \\sim \\frac{x^2}{2}$. Donc <strong>$f(x) \\to -2$<\/strong> ; f est équivalente à la constante $-2$.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"9\"><div class=\"ex-q\"><ol start=\"3\">\n<li>Prolongement.<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>f a une limite finie $-2$ en 0 : on pose $g(x) = f(x)$ si $x \\ne 0$ et $g(0) = -2$. g est continue sur $\\mathbb R$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Attention à l&#39;équivalent d&#39;une différence : on n&#39;écrit pas « $\\ln(1+x^2) - 2x\\sin x \\sim x^2 - 2x^2$ » sans passer par les DL. Ici c&#39;est juste parce que les termes d&#39;ordre 2 ne s&#39;annulent pas.<\/p>\n<\/aside><h2>Exercice 3 · primitives et équation différentielle<\/h2>\n<section class=\"exo\"><h3>Exercice 3<\/h3><div class=\"ex\" data-x=\"10\"><div class=\"ex-q\"><ol>\n<li>$I = \\int \\frac{x^2}{1+x^2}dx$ et $J = \\int \\tan x\\,dx$.<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$\\frac{x^2}{1+x^2} = 1 - \\frac{1}{1+x^2}$ donc $I = x - \\arctan x + C$. $\\tan x = \\frac{\\sin x}{\\cos x} = -\\frac{(\\cos x)'}{\\cos x}$ donc $J = -\\ln|\\cos x| + C$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"11\"><div class=\"ex-q\"><ol start=\"2\">\n<li>Résoudre $(1+x^2)y' - x^2 y = x\\,e^{x - \\arctan x}$.<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>On divise : $y' - \\frac{x^2}{1+x^2}y = \\frac{x\\,e^{x-\\arctan x}}{1+x^2}$. Une primitive de $\\frac{x^2}{1+x^2}$ est $x - \\arctan x$ (c&#39;est I !). Solutions homogènes : $y_h = C e^{x - \\arctan x}$. Variation de la constante : $C'(x) = \\frac{x}{1+x^2}$, donc $C(x) = \\frac12\\ln(1+x^2) + K$. <strong>$y = \\left(\\frac12\\ln(1+x^2) + K\\right)e^{x - \\arctan x}$.<\/strong><\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Le sujet est construit en chaîne : la primitive I de la question 1 sert de facteur intégrant à la question 2. Repère toujours ces liens dans un sujet.<\/p>\n<\/aside><h2>QCM du sujet<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">$|x^2 - 1| = x^2 - 1$ équivaut à :<\/div><button class=\"opt\" data-o=\"0\">$x \\in [-1, 1]$<\/button><button class=\"opt\" data-o=\"1\">$|x| \\ge 1$<\/button><button class=\"opt\" data-o=\"2\">$x = \\pm1$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">L&#39;image de arccos est :<\/div><button class=\"opt\" data-o=\"0\">$[-1, 1]$<\/button><button class=\"opt\" data-o=\"1\">$[0, \\pi]$<\/button><button class=\"opt\" data-o=\"2\">$[-\\frac{\\pi}{2}, \\frac{\\pi}{2}]$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">DL de $\\tan x$ à l&#39;ordre 3 :<\/div><button class=\"opt\" data-o=\"0\">$x + \\frac{x^3}{3}$<\/button><button class=\"opt\" data-o=\"1\">$x - \\frac{x^3}{6}$<\/button><button class=\"opt\" data-o=\"2\">$x + \\frac{x^3}{6}$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Point fixe de $u_{n+1} = 0{,}94u_n + 600$ :<\/div><button class=\"opt\" data-o=\"0\">600<\/button><button class=\"opt\" data-o=\"1\">10 000<\/button><button class=\"opt\" data-o=\"2\">6 000<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">$V_n = U_n - 10000$ a pour raison :<\/div><button class=\"opt\" data-o=\"0\">0,94<\/button><button class=\"opt\" data-o=\"1\">0,06<\/button><button class=\"opt\" data-o=\"2\">600<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Avec $U_0 = 6000$, la suite $U_n$ :<\/div><button class=\"opt\" data-o=\"0\">dépasse 10 000 au bout d&#39;un an<\/button><button class=\"opt\" data-o=\"1\">croît vers 10 000 sans l&#39;atteindre<\/button><button class=\"opt\" data-o=\"2\">décroît<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">En 0, $\\sqrt{1+x^2} - 1 \\sim$ :<\/div><button class=\"opt\" data-o=\"0\">$x^2$<\/button><button class=\"opt\" data-o=\"1\">$\\frac{x^2}{2}$<\/button><button class=\"opt\" data-o=\"2\">$x$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">$\\lim_{x\\to0} f(x)$ dans l&#39;exercice 2 :<\/div><button class=\"opt\" data-o=\"0\">0<\/button><button class=\"opt\" data-o=\"1\">2<\/button><button class=\"opt\" data-o=\"2\">$-2$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Une primitive de $\\tan x$ :<\/div><button class=\"opt\" data-o=\"0\">$\\ln|\\cos x|$<\/button><button class=\"opt\" data-o=\"1\">$-\\ln|\\cos x|$<\/button><button class=\"opt\" data-o=\"2\">$\\frac{1}{\\cos^2 x}$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Les solutions de $y' = a(x)\\,y$ sont :<\/div><button class=\"opt\" data-o=\"0\">$Ce^{A(x)}$ avec $A' = a$<\/button><butt  - 1 \\sim \\frac{u}{2}$."},{"n":"annale-fstbm-bcg-2021","q":"$\\lim_{x\\to0} f(x)$ dans l&#39;exercice 2 :","o":["0","2","$-2$"],"a":2,"e":"$-x^2 / (x^2/2)$."},{"n":"annale-fstbm-bcg-2021","q":"Une primitive de $\\tan x$ :","o":["$\\ln|\\cos x|$","$-\\ln|\\cos x|$","$\\frac{1}{\\cos^2 x}$"],"a":1,"e":"$\\frac{1}{\\cos^2x}$ est la dérivée de tan."},{"n":"annale-fstbm-bcg-2021","q":"Les solutions de $y' = a(x)\\,y$ sont :","o":["$Ce^{A(x)}$ avec $A' = a$","$Ce^{a(x)}$","$A(x) + C$"],"a":0,"e":"On intègre $y'/y = a$."}]}];
const NOTIONS=[{"id":"valeur-absolue","t":"Inégalités et valeur absolue","imp":5,"ch":"valeur-absolue"},{"id":"borne-superieure","t":"Majorant, borne supérieure, partie entière","imp":4,"ch":"borne-superieure"},{"id":"limite-suite","t":"Suites · la limite, avec ε et N","imp":5,"ch":"limite-suite"},{"id":"calcul-limites","t":"Suites · calculer une limite","imp":5,"ch":"calcul-limites"},{"id":"suites-monotones","t":"Suites monotones, adjacentes, sous-suites","imp":4,"ch":"suites-monotones"},{"id":"suites-cauchy","t":"Suites de Cauchy, suites usuelles, densité par les suites","imp":3,"ch":"suites-cauchy"},{"id":"limites-fonctions","t":"Limite d'une fonction","imp":4,"ch":"limites-fonctions"},{"id":"continuite","t":"Continuité en un point et sur un intervalle","imp":4,"ch":"continuite"},{"id":"grands-theoremes-continuite","t":"TVI, bornes atteintes, bijection, continuité uniforme","imp":5,"ch":"grands-theoremes-continuite"},{"id":"fonctions-usuelles","t":"Racines n-ièmes, puissances, fonctions circulaires réciproques","imp":3,"ch":"fonctions-usuelles"},{"id":"derivabilite","t":"Dérivabilité, règles de calcul, dérivée d'une réciproque","imp":4,"ch":"derivabilite"},{"id":"rolle-accroissements-finis","t":"Théorème de Rolle et accroissements finis","imp":5,"ch":"rolle-accroissements-finis"},{"id":"series-td-corrigees","t":"Séries de TD corrigées","imp":5,"ch":"series-td-corrigees"},{"id":"examen-blanc","t":"Examen blanc corrigé","imp":5,"ch":"examen-blanc"},{"id":"annale-fstbm-bcg-2021","t":"Annale corrigée · contrôle d'analyse FST Béni Mellal (BCG, février 2021)","imp":4,"ch":"annale-fstbm-bcg-2021"}];
const CARTES=[{"n":"valeur-absolue","k":0,"ch":"valeur-absolue","q":"<p>Que mesure $|x - a|$ ?<\/p>\n","r":"<p>La distance entre $x$ et $a$ sur la droite des réels.<\/p>\n"},{"n":"valeur-absolue","k":1,"ch":"valeur-absolue","q":"<p>$|x - a| &lt; r$ équivaut à…<\/p>\n","r":"<p>$a - r &lt; x &lt; a + r$ : l&#39;intervalle centré en $a$, de rayon $r$.<\/p>\n"},{"n":"valeur-absolue","k":2,"ch":"valeur-absolue","q":"<p>$|x - a| \\ge r$ équivaut à…<\/p>\n","r":"<p>$x \\le a - r$ ou $x \\ge a + r$ (deux morceaux).<\/p>\n"},{"n":"valeur-absolue","k":3,"ch":"valeur-absolue","q":"<p>Inégalité triangulaire<\/p>\n","r":"<p>$|a + b| \\le |a| + |b|$, avec égalité quand $a$ et $b$ ont le même signe.<\/p>\n"},{"n":"valeur-absolue","k":4,"ch":"valeur-absolue","q":"<p>$\\sqrt{x^2}$ vaut…<\/p>\n","r":"<p>$|x|$, et pas $x$.<\/p>\n"},{"n":"valeur-absolue","k":5,"ch":"valeur-absolue","q":"<p>Les trois gestes pour majorer<\/p>\n","r":"<p>Factoriser, faire apparaître la quantité contrôlée, appliquer l&#39;inégalité triangulaire.<\/p>\n"},{"n":"borne-superieure","k":6,"ch":"borne-superieure","q":"<p>Majorant de $A$<\/p>\n","r":"<p>Un nombre $M$ tel que tout élément de $A$ est $\\le M$.<\/p>\n"},{"n":"borne-superieure","k":7,"ch":"borne-superieure","q":"<p>Borne supérieure<\/p>\n","r":"<p>Le plus petit des majorants. Elle peut ne pas appartenir à l&#39;ensemble.<\/p>\n"},{"n":"borne-superieure","k":8,"ch":"borne-superieure","q":"<p>Différence entre sup et max<\/p>\n","r":"<p>Le max doit appartenir à l&#39;ensemble. $[0,1[$ a pour sup 1 mais n&#39;a pas de max.<\/p>\n"},{"n":"borne-superieure","k":9,"ch":"borne-superieure","q":"<p>Propriété de la borne supérieure<\/p>\n","r":"<p>Toute partie de $\\mathbb{R}$ non vide et majorée admet une borne supérieure.<\/p>\n"},{"n":"borne-superieure","k":10,"ch":"borne-superieure","q":"<p>Caractérisation du sup avec $\\varepsilon$<\/p>\n","r":"<p>$M$ majore $A$, et pour tout $\\varepsilon &gt; 0$ il existe $x$ dans $A$ avec $x &gt; M - \\varepsilon$.<\/p>\n"},{"n":"borne-superieure","k":11,"ch":"borne-superieure","q":"<p>Partie entière $E(x)$<\/p>\n","r":"<p>L&#39;unique entier tel que $E(x) \\le x &lt; E(x) + 1$. Exemple : $E(-2{,}7) = -3$.<\/p>\n"},{"n":"borne-superieure","k":12,"ch":"borne-superieure","q":"<p>Propriété d&#39;Archimède<\/p>\n","r":"<p>Pour tout réel $x$, il existe un entier $n &gt; x$ : $\\mathbb{N}$ n&#39;est pas majoré.<\/p>\n"},{"n":"limite-suite","k":13,"ch":"limite-suite","q":"<p>Définition de « $(u_n)$ converge vers $\\ell$ »<\/p>\n","r":"<p>Pour tout $\\varepsilon &gt; 0$, il existe $N$ tel que pour tout $n \\ge N$, $|u_n - \\ell| &lt; \\varepsilon$.<\/p>\n"},{"n":"limite-suite","k":14,"ch":"limite-suite","q":"<p>L&#39;image à garder pour la convergence<\/p>\n","r":"<p>Un tube de largeur $\\varepsilon$ autour de $\\ell$ : à partir d&#39;un rang, tous les termes y sont.<\/p>\n"},{"n":"limite-suite","k":15,"ch":"limite-suite","q":"<p>De quoi dépend le rang $N$ ?<\/p>\n","r":"<p>De $\\varepsilon$. Plus la marge est fine, plus $N$ est grand.<\/p>\n"},{"n":"limite-suite","k":16,"ch":"limite-suite","q":"<p>Méthode pour prouver une limite<\/p>\n","r":"<p>Calculer $|u_n - \\ell|$, simplifier ou majorer, isoler $n$, en déduire $N$.<\/p>\n"},{"n":"limite-suite","k":17,"ch":"limite-suite","q":"<p>Convergente implique…<\/p>\n","r":"<p>Bornée. La réciproque est fausse : $(-1)^n$.<\/p>\n"},{"n":"limite-suite","k":18,"ch":"limite-suite","q":"<p>Définition de « $u_n$ tend vers $+\\infty$ »<\/p>\n","r":"<p>Pour tout réel $A$, il existe $N$ tel que pour tout $n \\ge N$, $u_n &gt; A$.<\/p>\n"},{"n":"limite-suite","k":19,"ch":"limite-suite","q":"<p>Combien de limites peut avoir une suite ?<\/p>\n","r":"<p>Une seule au plus : la limite est unique.<\/p>\n"},{"n":"calcul-limites","k":20,"ch":"calcul-limites","q":"<p>Limite de $q^n$ selon $q$<\/p>\n","r":"<p>$0$ si $|q| &lt; 1$ ; $+\\infty$ si $q &gt; 1$ ; pas de limite si $q \\le -1$ ; $1$ si $q = 1$.<\/p>\n"},{"n":"calcul-limites","k":21,"ch":"calcul-limites","q":"<p>Les quatre formes indéterminées<\/p>\n","r":"<p>$\\infty - \\infty$, $0 \\times \\infty$, $\\tfrac{\\infty}{\\infty}$, $\\tfrac00$.<\/p>\n"},{"n":"calcul-limites","k":22,"ch":"calcul-limites","q":"<p>Fraction de polynômes en $n$ : quel geste ?<\/p>\n","r":"<p>Factoriser par la plus grande puissance de $n$, en haut et en bas.<\/p>\n"},{"n":"calcul-limites","k":23,"ch":"calcul-limites","q":"<p>Différence de deux racines : quel geste ?<\/p>\n","r":"<p>Multiplier et diviser par la quantité conjuguée.<\/p>\n"},{"n":"calcul-limites","k":24,"ch":"calcul-limites","q":"<p>Théorème des gendarmes<\/p>\n","r":"<p>Si $v_n \\le u_n \\le w_n$ à partir d&#39;un rang et si $v_n$, $w_n$ tendent vers la même limite $\\ell$, alors $u_n \\to \\ell$.<\/p>\n"},{"n":"calcul-limites","k":25,"ch":"calcul-limites","q":"<p>Bornée × tend vers 0<\/p>\n","r":"<p>Tend vers 0.<\/p>\n"},{"n":"calcul-limites","k":26,"ch":"calcul-limites","q":"<p>$u_n &lt; v_n$ pour tout $n$ : que dire des limites ?<\/p>\n","r":"<p>Seulement $\\ell \\le \\ell'$ : l&#39;inégalité devient large.<\/p>\n"},{"n":"suites-monotones","k":27,"ch":"suites-monotones","q":"<p>Théorème de la limite monotone<\/p>\n","r":"<p>Croissante et majorée : converge vers le sup de ses termes. Décroissante et minorée : converge vers l&#39;inf.<\/p>\n"},{"n":"suites-monotones","k":28,"ch":"suites-monotones","q":"<p>Croissante et majorée par $M$ : la limite vaut-elle $M$ ?<\/p>\n","r":"<p>Pas forcément. La limite est la borne supérieure, qui est $\\le M$.<\/p>\n"},{"n":"suites-monotones","k":29,"ch":"suites-monotones","q":"<p>Croissante et non majorée<\/p>\n","r":"<p>Tend vers $+\\infty$.<\/p>\n"},{"n":"suites-monotones","k":30,"ch":"suites-monotones","q":"<p>Deux méthodes pour le sens de variation<\/p>\n","r":"<p>Signe de $u_{n+1} - u_n$, ou comparaison de $\\tfrac{u_{n+1}}{u_n}$ à 1 si les termes sont strictement positifs.<\/p>\n"},{"n":"suites-monotones","k":31,"ch":"suites-monotones","q":"<p>Définition de suites adjacentes<\/p>\n","r":"<p>L&#39;une croissante, l&#39;autre décroissante, et leur différence tend vers 0. Elles ont alors la même limite.<\/p>\n"},{"n":"suites-monotones","k":32,"ch":"suites-monotones","q":"<p>Prouver une divergence avec des sous-suites<\/p>\n","r":"<p>Trouver deux sous-suites qui tendent vers des limites différentes.<\/p>\n"},{"n":"suites-monotones","k":33,"ch":"suites-monotones","q":"<p>Théorème de Bolzano-Weierstrass<\/p>\n","r":"<p>Toute suite bornée admet une sous-suite convergente.<\/p>\n"},{"n":"suites-monotones","k":34,"ch":"suites-monotones","q":"<p>Plan pour une suite $u_{n+1} = f(u_n)$<\/p>\n","r":"<p>Bornée, monotone, donc convergente, puis la limite vérifie $\\ell = f(\\ell)$.<\/p>\n"},{"n":"suites-cauchy","k":35,"ch":"suites-cauchy","q":"<p>Suite de Cauchy<\/p>\n","r":"<p>Pour tout $\\varepsilon &gt; 0$, il existe $N$ tel que $|u_p - u_n| &lt; \\varepsilon$ pour tous $p, n \\ge N$.<\/p>\n"},{"n":"suites-cauchy","k":36,"ch":"suites-cauchy","q":"<p>Cauchy et convergence dans $\\mathbb R$<\/p>\n","r":"<p>Une suite réelle converge si et seulement si elle est de Cauchy.<\/p>\n"},{"n":"suites-cauchy","k":37,"ch":"suites-cauchy","q":"<p>$u_{n+1} - u_n \\to 0$ suffit-il ?<\/p>\n","r":"<p>Non : $\\sqrt n$ en est un contre-exemple.<\/p>\n"},{"n":"suites-cauchy","k":38,"ch":"suites-cauchy","q":"<p>Nier Cauchy en pratique<\/p>\n","r":"<p>Trouver $\\varepsilon &gt; 0$ avec $|u_{2n} - u_n| \\ge \\varepsilon$ pour tout $n$.<\/p>\n"},{"n":"suites-cauchy","k":39,"ch":"suites-cauchy","q":"<p>Somme géométrique<\/p>\n","r":"<p>$\\sum_{k=0}^{n} q^k = \\dfrac{1 - q^{n+1}}{1 - q}$ si $q \\ne 1$.<\/p>\n"},{"n":"suites-cauchy","k":40,"ch":"suites-cauchy","q":"<p>Limite de $q^n$<\/p>\n","r":"<p>0 si $|q| &lt; 1$ ; 1 si $q = 1$ ; $+\\infty$ si $q &gt; 1$ ; pas de limite si $q \\le -1$.<\/p>\n"},{"n":"suites-cauchy","k":41,"ch":"suites-cauchy","q":"<p>Densité par les suites<\/p>\n","r":"<p>$D$ dense dans $\\mathbb R$ ssi tout réel est limite d&#39;une suite d&#39;éléments de $D$.<\/p>\n"},{"n":"suites-cauchy","k":42,"ch":"suites-cauchy","q":"<p>Série harmonique<\/p>\n","r":"<p>$\\sum_{k=1}^n \\tfrac1k \\to +\\infty$ car $u_{2n} - u_n \\ge \\tfrac12$.<\/p>\n"},{"n":"limites-fonctions","k":43,"ch":"limites-fonctions","q":"<p>Définition de $\\lim_{x\\to a} f(x) = \\ell$<\/p>\n","r":"<p>$\\forall \\varepsilon &gt; 0, \\exists \\delta &gt; 0, |x - a| &lt; \\delta \\Rightarrow |f(x) - \\ell| &lt; \\varepsilon$.<\/p>\n"},{"n":"limites-fonctions","k":44,"ch":"limites-fonctions","q":"<p>La limite en $a$ dépend-elle de $f(a)$ ?<\/p>\n","r":"<p>Non. $f$ peut même ne pas être définie en $a$.<\/p>\n"},{"n":"limites-fonctions","k":45,"ch":"limites-fonctions","q":"<p>Limite en $a$ et limites latérales<\/p>\n","r":"<p>Elle existe ssi les limites à gauche et à droite existent et sont égales.<\/p>\n"},{"n":"limites-fonctions","k":46,"ch":"limites-fonctions","q":"<p>Caractérisation séquentielle<\/p>\n","r":"<p>$f(x) \\to \\ell$ ssi $f(x_n) \\to \\ell$ pour toute suite $x_n \\to a$.<\/p>\n"},{"n":"limites-fonctions","k":47,"ch":"limites-fonctions","q":"<p>Prouver la non-existence d&#39;une limite<\/p>\n","r":"<p>Deux suites vers $a$ dont les images ont des limites différentes.<\/p>\n"},{"n":"limites-fonctions","k":48,"ch":"limites-fonctions","q":"<p>Croissante et majorée sur $]a,b[$<\/p>\n","r":"<p>Admet une limite finie en $b^-$, égale au sup.<\/p>\n"},{"n":"limites-fonctions","k":49,"ch":"limites-fonctions","q":"<p>$\\lim_{x\\to 0} \\frac{\\sin x}{x}$<\/p>\n","r":"<ol>\n<li><\/li>\n<\/ol>\n"},{"n":"limites-fonctions","k":50,"ch":"limites-fonctions","q":"<p>Périodique non constante en $+\\infty$<\/p>\n","r":"<p>Pas de limite.<\/p>\n"},{"n":"continuite","k":51,"ch":"continuite","q":"<p>Continuité en $a$<\/p>\n","r":"<p>$\\lim_{x\\to a} f(x) = f(a)$.<\/p>\n"},{"n":"continuite","k":52,"ch":"continuite","q":"<p>Continue en $a$ et limites latérales<\/p>\n","r":"<p>Continue ssi continue à gauche et à droite.<\/p>\n"},{"n":"continuite","k":53,"ch":"continuite","q":"<p>P
