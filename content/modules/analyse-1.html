<script>
const MODULE={"slug":"analyse-1","titre":"Analyse 1","cle":"analyse1_scores","cleEtat":"analyse1_scores_etat","format":"score10","intro":"<p>Ce cours part de zéro et avance <strong>une idée à la fois</strong>.</p>\n<p><strong>Chaque chapitre a trois temps</strong></p>\n<ol>\n<li><strong>Avant de commencer</strong> : ce qu&#39;il faut déjà savoir, avec une question pour vérifier et un rappel court si ça coince.</li>\n<li><strong>Comment l&#39;aborder</strong> : l&#39;état d&#39;esprit qui rend le chapitre simple, et le piège dans lequel presque tout le monde tombe.</li>\n<li><strong>Les idées, illustrées</strong> : un dessin, une phrase, un exemple.</li>\n</ol>\n<p>Termine par le QCM : <strong>8/10 = chapitre maîtrisé</strong>.</p>\n<p>Ce cours est une rédaction originale de ToumaiLearn. Il couvre le programme habituel d&#39;Analyse 1, mais l&#39;ordre et les notations de ton prof peuvent différer : garde son polycopié à côté.</p>\n","annexes":[],"cartes":null,"maths":true};
const CHAPS=[{"id":"valeur-absolue","t":"Inégalités et valeur absolue","seance":"Chapitre 1 · Les nombres réels","imp":5,"html":"<h2>Avant de commencer</h2>\n<p>Ce chapitre demande une seule chose : savoir manipuler une inégalité.</p>\n<ul>\n<li>Ajouter le même nombre des deux côtés <strong>ne change pas</strong> le sens.</li>\n<li>Multiplier par un nombre <strong>positif</strong> ne change pas le sens.</li>\n<li>Multiplier par un nombre <strong>négatif renverse</strong> le sens.</li>\n</ul>\n<section class=\"exo\"><h3>Vérifie ton prérequis</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Résous $-2x + 6 \\ge 0$.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Isole x. Attention au moment où tu divises par −2.</p>\n</div><div class=\"ex-c\" hidden><p>$-2x \\ge -6$, puis on divise par $-2$, qui est négatif : le sens se renverse. On obtient $x \\le 3$.\nSi tu as trouvé $x \\ge 3$, relis la troisième règle ci-dessus : c&#39;est le seul prérequis du chapitre.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Comment aborder ce chapitre</h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p><strong>Pense distance, pas formule.</strong> La valeur absolue $|x - a|$ est la distance entre $x$ et $a$ sur la droite des réels. Toutes les règles du chapitre se voient sur un dessin.</p>\n</aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>Presque tout le monde écrit un jour $|a + b| = |a| + |b|$. C&#39;est faux dès que $a$ et $b$ sont de signes contraires : $|3 + (-5)| = 2$, alors que $|3| + |-5| = 8$.</p>\n</aside><p>À la fin, tu sais résoudre une inéquation avec valeur absolue en une ligne et majorer une expression, ce qui sert dans <strong>toutes</strong> les preuves de limites.</p>\n<h2>Idée 1 · La valeur absolue est une distance à zéro</h2>\n<svg viewBox=\"0 0 340 90\" style=\"width:100%;max-width:420px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Droite graduée : -3 et 3 sont tous deux à distance 3 de zéro\">\n<line x1=\"10\" y1=\"50\" x2=\"330\" y2=\"50\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<g font-family=\"sans-serif\" font-size=\"13\" text-anchor=\"middle\" fill=\"currentColor\">\n<line x1=\"50\" y1=\"44\" x2=\"50\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"50\" y=\"74\">−3</text>\n<line x1=\"170\" y1=\"44\" x2=\"170\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"170\" y=\"74\">0</text>\n<line x1=\"290\" y1=\"44\" x2=\"290\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"290\" y=\"74\">3</text>\n<text x=\"110\" y=\"24\" fill=\"#D9824F\" font-weight=\"700\">distance 3</text><text x=\"230\" y=\"24\" fill=\"#D9824F\" font-weight=\"700\">distance 3</text></g>\n<line x1=\"54\" y1=\"34\" x2=\"166\" y2=\"34\" stroke=\"#D9824F\" stroke-width=\"3\"/><line x1=\"174\" y1=\"34\" x2=\"286\" y2=\"34\" stroke=\"#D9824F\" stroke-width=\"3\"/>\n</svg><p>$|x|$ vaut $x$ si $x \\ge 0$, et $-x$ si $x &lt; 0$. Donc $|3| = 3$ et $|-3| = 3$ : les deux sont à 3 pas de zéro.</p>\n<p>Trois conséquences à connaître :</p>\n<ul>\n<li>$|x| \\ge 0$, et $|x| = 0$ seulement pour $x = 0$ ;</li>\n<li>$|ab| = |a| \\cdot |b|$ ;</li>\n<li>$\\sqrt{x^2} = |x|$ (et non $x$ : pour $x = -3$, $\\sqrt{9} = 3$).</li>\n</ul>\n<h2>Idée 2 · $|x - a| &lt; r$ dessine un intervalle</h2>\n<svg viewBox=\"0 0 340 96\" style=\"width:100%;max-width:420px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Les x à distance inférieure à r de a forment l'intervalle de a moins r à a plus r\">\n<line x1=\"10\" y1=\"52\" x2=\"330\" y2=\"52\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<line x1=\"80\" y1=\"52\" x2=\"260\" y2=\"52\" stroke=\"#D9824F\" stroke-width=\"7\" stroke-linecap=\"round\"/>\n<g font-family=\"sans-serif\" font-size=\"13\" text-anchor=\"middle\" fill=\"currentColor\">\n<circle cx=\"80\" cy=\"52\" r=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"80\" y=\"80\">a − r</text>\n<circle cx=\"170\" cy=\"52\" r=\"5\" fill=\"currentColor\"/><text x=\"170\" y=\"80\">a</text>\n<circle cx=\"260\" cy=\"52\" r=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"260\" y=\"80\">a + r</text>\n<text x=\"125\" y=\"34\" fill=\"#D9824F\" font-weight=\"700\">r</text><text x=\"215\" y=\"34\" fill=\"#D9824F\" font-weight=\"700\">r</text></g>\n</svg><p>« $x$ est à moins de $r$ de $a$ » : $x$ est dans l&#39;intervalle centré en $a$, de rayon $r$.</p>\n<p>$$|x - a| &lt; r \\iff a - r &lt; x &lt; a + r$$</p>\n<p>Et le contraire : « $x$ est à au moins $r$ de $a$ » donne <strong>deux</strong> morceaux.</p>\n<p>$$|x - a| \\ge r \\iff x \\le a - r \\ \\text{ ou } \\ x \\ge a + r$$</p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Résoudre |2x − 1| ≤ 5, pas à pas</figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · On enlève la valeur absolue</div><p>$|2x - 1| \\le 5$ signifie $-5 \\le 2x - 1 \\le 5$.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · On ajoute 1 partout</div><p>$-4 \\le 2x \\le 6$.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · On divise par 2, qui est positif</div><p>$-2 \\le x \\le 3$. Le sens ne change pas.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · On vérifie avec une valeur</div><p>$x = 0$ donne $|-1| = 1 \\le 5$ : c&#39;est cohérent.</p>\n</div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><h2>Idée 3 · L&#39;inégalité triangulaire</h2>\n<p>$$|a + b| \\le |a| + |b|$$</p>\n<p>En mots : aller de 0 à $a + b$ directement n&#39;est jamais plus long que faire deux trajets.</p>\n<ul>\n<li>Même signe : égalité. $|2 + 5| = 7 = |2| + |5|$.</li>\n<li>Signes contraires : ça se compense. $|3 + (-5)| = 2 &lt; 8$.</li>\n</ul>\n<p>Pourquoi c&#39;est vrai : $-|a| \\le a \\le |a|$ et $-|b| \\le b \\le |b|$. On additionne : $-(|a| + |b|) \\le a + b \\le |a| + |b|$, ce qui est exactement $|a + b| \\le |a| + |b|$ d&#39;après l&#39;idée 2.</p>\n<p>Sa cousine, utile pour minorer : $\\big|\\,|a| - |b|\\,\\big| \\le |a - b|$.</p>\n<h2>Idée 4 · Majorer : la technique de toutes les preuves</h2>\n<p>Majorer, c&#39;est trouver un nombre plus grand que l&#39;expression, à coup sûr.</p>\n<p><strong>Exemple.</strong> On sait que $|x - 1| \\le 2$. Majorer $|x^2 - 1|$.</p>\n<ol>\n<li>On factorise : $|x^2 - 1| = |x - 1| \\cdot |x + 1|$.</li>\n<li>Le premier facteur est connu : $|x - 1| \\le 2$.</li>\n<li>Le second se ramène au premier : $|x + 1| = |(x - 1) + 2| \\le |x - 1| + 2 \\le 4$.</li>\n<li>On multiplie : $|x^2 - 1| \\le 2 \\times 4 = 8$.</li>\n</ol>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p>Pour majorer : <strong>factoriser</strong>, faire apparaître la quantité qu&#39;on contrôle, puis utiliser l&#39;inégalité triangulaire. Tu referas ces trois gestes dans chaque preuve de limite.</p>\n</aside><h2>S&#39;exercer</h2>\n<section class=\"exo\"><h3>Trois exercices types</h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Résous $|x + 1| &lt; 4$.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>x + 1 = x − (−1) : le centre est −1, le rayon 4.</p>\n</div><div class=\"ex-c\" hidden><p>$-4 &lt; x + 1 &lt; 4$, donc $-5 &lt; x &lt; 3$.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Résous $|3 - x| \\ge 2$.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>|3 − x| = |x − 3| : distance entre x et 3.</p>\n</div><div class=\"ex-c\" hidden><p>$x$ est à au moins 2 de 3 : $x \\le 1$ ou $x \\ge 5$.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Montre que si $|x - 3| &lt; 1$, alors $|x^2 - 9| &lt; 7$.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Factorise, puis encadre x + 3.</p>\n</div><div class=\"ex-c\" hidden><p>$|x^2 - 9| = |x - 3| \\cdot |x + 3|$. Comme $2 &lt; x &lt; 4$, on a $5 &lt; x + 3 &lt; 7$, donc $|x + 3| &lt; 7$. Ainsi $|x^2 - 9| &lt; 1 \\times 7 = 7$.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 6 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Que vaut $|-7|$ ?</div><button class=\"opt\" data-o=\"0\">$-7$</button><button class=\"opt\" data-o=\"1\">$7$</button><button class=\"opt\" data-o=\"2\">$0$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">$|x - 2| &lt; 3$ équivaut à :</div><button class=\"opt\" data-o=\"0\">$x &lt; 5$</button><button class=\"opt\" data-o=\"1\">$-1 &lt; x &lt; 5$</button><button class=\"opt\" data-o=\"2\">$x &lt; -1$ ou $x &gt; 5$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Pour tout réel $x$, $\\sqrt{x^2}$ vaut :</div><button class=\"opt\" data-o=\"0\">$x$</button><button class=\"opt\" data-o=\"1\">$-x$</button><button class=\"opt\" data-o=\"2\">$|x|$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Laquelle est vraie pour tous réels $a$ et $b$ ?</div><button class=\"opt\" data-o=\"0\">$|a + b| = |a| + |b|$</button><button class=\"opt\" data-o=\"1\">$|a + b| \\le |a| + |b|$</button><button class=\"opt\" data-o=\"2\">$|a + b| \\ge |a| + |b|$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">L&#39;ensemble des solutions de $|x| &gt; 2$ est :</div><button class=\"opt\" data-o=\"0\">$-2 &lt; x &lt; 2$</button><button class=\"opt\" data-o=\"1\">$x &lt; -2$ ou $x &gt; 2$</button><button class=\"opt\" data-o=\"2\">$x &gt; 2$ seulement</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">La distance entre $-3$ et $4$ vaut :</div><button class=\"opt\" data-o=\"0\">$1$</button><button class=\"opt\" data-o=\"1\">$7$</button><button class=\"opt\" data-o=\"2\">$-7$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Si $|x - 5| \\le 0{,}1$, alors $x$ appartient à :</div><button class=\"opt\" data-o=\"0\">$[5 ; 5{,}1]$</button><button class=\"opt\" data-o=\"1\">$[4{,}9 ; 5{,}1]$</button><button class=\"opt\" data-o=\"2\">$[-0{,}1 ; 0{,}1]$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Dans $|a + b| \\le |a| + |b|$, il y a égalité quand :</div><button class=\"opt\" data-o=\"0\">$a$ et $b$ sont de signes contraires</button><button class=\"opt\" data-o=\"1\">$a$ et $b$ ont le même signe (ou l&#39;un est nul)</button><button class=\"opt\" data-o=\"2\">jamais</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">L&#39;ensemble des solutions de $|2x - 1| \\le 5$ est :</div><button class=\"opt\" data-o=\"0\">$[-2 ; 3]$</button><button class=\"opt\" data-o=\"1\">$[-3 ; 2]$</button><button class=\"opt\" data-o=\"2\">$[-4 ; 6]$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Laquelle de ces affirmations est <strong>fausse</strong> en général ?</div><button class=\"opt\" data-o=\"0\">$|ab| = |a| \\cdot |b|$</button><button class=\"opt\" data-o=\"1\">$|-a| = |a|$</button><button class=\"opt\" data-o=\"2\">$|a - b| \\le |a| - |b|$</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"valeur-absolue","rep":null,"tol":null},{"n":"valeur-absolue","rep":null,"tol":null},{"n":"valeur-absolue","rep":null,"tol":null},{"n":"valeur-absolue","rep":null,"tol":null}],"qcm":[{"n":"valeur-absolue","q":"Que vaut $|-7|$ ?","o":["$-7$","$7$","$0$"],"a":1,"e":"Une valeur absolue est une distance : elle n&#39;est jamais négative."},{"n":"valeur-absolue","q":"$|x - 2| &lt; 3$ équivaut à :","o":["$x &lt; 5$","$-1 &lt; x &lt; 5$","$x &lt; -1$ ou $x &gt; 5$"],"a":1,"e":"Intervalle centré en 2, de rayon 3 : de $2 - 3$ à $2 + 3$."},{"n":"valeur-absolue","q":"Pour tout réel $x$, $\\sqrt{x^2}$ vaut :","o":["$x$","$-x$","$|x|$"],"a":2,"e":"Une racine carrée est positive. Pour $x = -3$ : $\\sqrt{9} = 3 = |-3|$."},{"n":"valeur-absolue","q":"Laquelle est vraie pour tous réels $a$ et $b$ ?","o":["$|a + b| = |a| + |b|$","$|a + b| \\le |a| + |b|$","$|a + b| \\ge |a| + |b|$"],"a":1,"e":"C&#39;est l&#39;inégalité triangulaire. L&#39;égalité n&#39;a lieu que si $a$ et $b$ ont le même signe."},{"n":"valeur-absolue","q":"L&#39;ensemble des solutions de $|x| &gt; 2$ est :","o":["$-2 &lt; x &lt; 2$","$x &lt; -2$ ou $x &gt; 2$","$x &gt; 2$ seulement"],"a":1,"e":"« À plus de 2 de zéro » : deux morceaux, un de chaque côté."},{"n":"valeur-absolue","q":"La distance entre $-3$ et $4$ vaut :","o":["$1$","$7$","$-7$"],"a":1,"e":"$|-3 - 4| = |-7| = 7$."},{"n":"valeur-absolue","q":"Si $|x - 5| \\le 0{,}1$, alors $x$ appartient à :","o":["$[5 ; 5{,}1]$","$[4{,}9 ; 5{,}1]$","$[-0{,}1 ; 0{,}1]$"],"a":1,"e":"Centre 5, rayon 0,1."},{"n":"valeur-absolue","q":"Dans $|a + b| \\le |a| + |b|$, il y a égalité quand :","o":["$a$ et $b$ sont de signes contraires","$a$ et $b$ ont le même signe (ou l&#39;un est nul)","jamais"],"a":1,"e":"Si les signes sont contraires, les deux nombres se compensent et la somme est plus petite."},{"n":"valeur-absolue","q":"L&#39;ensemble des solutions de $|2x - 1| \\le 5$ est :","o":["$[-2 ; 3]$","$[-3 ; 2]$","$[-4 ; 6]$"],"a":0,"e":"$-5 \\le 2x - 1 \\le 5$, donc $-4 \\le 2x \\le 6$, donc $-2 \\le x \\le 3$."},{"n":"valeur-absolue","q":"Laquelle de ces affirmations est <strong>fausse</strong> en général ?","o":["$|ab| = |a| \\cdot |b|$","$|-a| = |a|$","$|a - b| \\le |a| - |b|$"],"a":2,"e":"Contre-exemple : $a = 1$, $b = 3$ donne $|a - b| = 2$ mais $|a| - |b| = -2$. La bonne inégalité est $|a - b| \\ge \\big||a| - |b|\\big|$."}]},{"id":"borne-superieure","t":"Majorant, borne supérieure, partie entière","seance":"Chapitre 1 · Les nombres réels","imp":4,"html":"<h2>Avant de commencer</h2>\n<p>Il te faut deux choses : lire un intervalle, et lire les mots « pour tout » et « il existe ».</p>\n<ul>\n<li>$[0, 1[$ contient 0, ne contient pas 1.</li>\n<li>« <strong>Pour tout</strong> $x$ de $A$, $x \\le 5$ » : aucun élément de $A$ ne dépasse 5.</li>\n<li>« <strong>Il existe</strong> $x$ dans $A$ tel que $x &gt; 4$ » : au moins un élément de $A$ dépasse 4.</li>\n</ul>\n<section class=\"exo\"><h3>Vérifie ton prérequis</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Vrai ou faux : pour tout $x$ de $[0, 3[$, on a $x \\le 5$.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Cherche un élément de [0, 3[ qui dépasserait 5.</p>\n</div><div class=\"ex-c\" hidden><p>Vrai. Tous les éléments de $[0, 3[$ sont plus petits que 3, donc plus petits que 5. Pour que ce soit faux, il faudrait <strong>un</strong> élément qui dépasse 5.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Comment aborder ce chapitre</h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p><strong>Pense plafond.</strong> Un majorant est un plafond au-dessus de l&#39;ensemble. La borne supérieure est le plafond <strong>le plus bas possible</strong>. Qu&#39;il touche l&#39;ensemble ou non n&#39;a pas d&#39;importance.</p>\n</aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>Confondre borne supérieure et maximum. Le maximum doit <strong>appartenir</strong> à l&#39;ensemble, la borne supérieure non. $[0, 1[$ a une borne supérieure (1) mais pas de maximum.</p>\n</aside><p>À la fin, tu sais trouver sup, inf, max et min d&#39;un ensemble, et utiliser la caractérisation avec $\\varepsilon$, qui revient dans tout le chapitre sur les suites.</p>\n<h2>Idée 1 · Majorant : un plafond</h2>\n<svg viewBox=\"0 0 340 100\" style=\"width:100%;max-width:420px;display:block;margin:10px auto\" role=\"img\" aria-label=\"L'intervalle de 0 à 1, 1 exclu, avec ses majorants 1, 1,5 et 2 à droite\">\n<line x1=\"10\" y1=\"56\" x2=\"330\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<line x1=\"60\" y1=\"56\" x2=\"160\" y2=\"56\" stroke=\"#D9824F\" stroke-width=\"7\" stroke-linecap=\"round\"/>\n<g font-family=\"sans-serif\" font-size=\"13\" text-anchor=\"middle\" fill=\"currentColor\">\n<circle cx=\"60\" cy=\"56\" r=\"5\" fill=\"#D9824F\"/><text x=\"60\" y=\"82\">0</text>\n<circle cx=\"160\" cy=\"56\" r=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"160\" y=\"82\">1</text>\n<line x1=\"210\" y1=\"50\" x2=\"210\" y2=\"62\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"210\" y=\"82\">1,5</text>\n<line x1=\"260\" y1=\"50\" x2=\"260\" y2=\"62\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"260\" y=\"82\">2</text>\n<text x=\"110\" y=\"34\" fill=\"#D9824F\" font-weight=\"700\">A = [0, 1[</text><text x=\"235\" y=\"34\">majorants de A</text></g>\n<path d=\"M160 42h150\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-dasharray=\"4 4\" fill=\"none\"/>\n</svg><ul>\n<li>$M$ est un <strong>majorant</strong> de $A$ si tous les éléments de $A$ sont $\\le M$.</li>\n<li>$m$ est un <strong>minorant</strong> de $A$ si tous les éléments de $A$ sont $\\ge m$.</li>\n<li>$A$ est <strong>bornée</strong> si elle a un majorant et un minorant.</li>\n</ul>\n<p>Un majorant n&#39;est jamais seul : si 1 majore $A$, alors 1,5, 2 et 100 aussi. La vraie question est : quel est le plus petit ?</p>\n<h2>Idée 2 · La borne supérieure : le plus petit plafond</h2>\n<p>La <strong>borne supérieure</strong> de $A$, notée $\\sup A$, est le plus petit des majorants de $A$. La <strong>borne inférieure</strong> $\\inf A$ est le plus grand des minorants.</p>\n<p>Pour $A = [0, 1[$ : les majorants sont tous les nombres $\\ge 1$, le plus petit est 1, donc $\\sup A = 1$. Et 1 n&#39;est pas dans $A$ : pas de maximum.</p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p><strong>Propriété de la borne supérieure.</strong> Toute partie de $\\mathbb{R}$ non vide et majorée admet une borne supérieure. C&#39;est ce qui distingue $\\mathbb{R}$ de $\\mathbb{Q}$ : dans $\\mathbb{Q}$, l&#39;ensemble des rationnels dont le carré est inférieur à 2 n&#39;a pas de plus petit majorant rationnel.</p>\n</aside><p>Lien avec le maximum : si $A$ a un maximum, alors $\\sup A = \\max A$. La réciproque est fausse.</p>\n<h2>Idée 3 · Reconnaître un sup avec $\\varepsilon$</h2>\n<svg viewBox=\"0 0 340 100\" style=\"width:100%;max-width:420px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Entre M moins epsilon et M, on trouve toujours un élément de A\">\n<line x1=\"10\" y1=\"56\" x2=\"330\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<line x1=\"40\" y1=\"56\" x2=\"270\" y2=\"56\" stroke=\"#D9824F\" stroke-width=\"7\" stroke-linecap=\"round\" opacity=\".45\"/>\n<g font-family=\"sans-serif\" font-size=\"13\" text-anchor=\"middle\" fill=\"currentColor\">\n<line x1=\"270\" y1=\"46\" x2=\"270\" y2=\"66\" stroke=\"currentColor\" stroke-width=\"2.5\"/><text x=\"270\" y=\"86\">M = sup A</text>\n<line x1=\"190\" y1=\"48\" x2=\"190\" y2=\"64\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"186\" y=\"86\">M − ε</text>\n<circle cx=\"236\" cy=\"56\" r=\"6\" fill=\"#D9824F\"/><text x=\"236\" y=\"34\" fill=\"#D9824F\" font-weight=\"700\">un x de A</text></g>\n</svg><p>$M = \\sup A$ exactement quand deux choses sont vraies :</p>\n<ol>\n<li>$M$ est un majorant : pour tout $x$ de $A$, $x \\le M$.</li>\n<li>On ne peut pas descendre : pour tout $\\varepsilon &gt; 0$, il existe $x$ dans $A$ tel que $x &gt; M - \\varepsilon$.</li>\n</ol>\n<p>La deuxième ligne dit : dès qu&#39;on baisse le plafond, même d&#39;un cheveu, un élément de $A$ passe au-dessus.</p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Exemple : A = { 1 − 1/n, n ≥ 1 }</figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Les premiers éléments</div><p>$0,\\ \\tfrac12,\\ \\tfrac23,\\ \\tfrac34, \\dots$ Ils montent vers 1 sans jamais l&#39;atteindre.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · 1 est un majorant</div><p>$1 - \\tfrac1n &lt; 1$ pour tout $n$.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · On ne peut pas descendre</div><p>Soit $\\varepsilon &gt; 0$. On veut $1 - \\tfrac1n &gt; 1 - \\varepsilon$, c&#39;est-à-dire $\\tfrac1n &lt; \\varepsilon$, donc $n &gt; \\tfrac1\\varepsilon$. Un tel entier existe.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Conclusion</div><p>$\\sup A = 1$, non atteint : pas de maximum. En bas, $\\inf A = 0 = \\min A$ (obtenu pour $n = 1$).</p>\n</div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><h2>Idée 4 · La partie entière</h2>\n<p>La <strong>partie entière</strong> $E(x)$ est le plus grand entier inférieur ou égal à $x$ :</p>\n<p>$$E(x) \\le x &lt; E(x) + 1$$</p>\n<ul>\n<li>$E(2{,}7) = 2$ ;</li>\n<li>$E(5) = 5$ ;</li>\n<li>$E(-2{,}7) = -3$, et non $-2$ : on va vers la <strong>gauche</strong>.</li>\n</ul>\n<p>Elle existe grâce à la <strong>propriété d&#39;Archimède</strong> : pour tout réel $x$, il existe un entier $n$ tel que $n &gt; x$. Autrement dit, $\\mathbb{N}$ n&#39;est pas majoré. C&#39;est elle qui garantit, dans l&#39;exemple précédent, qu&#39;on trouve un entier $n &gt; \\tfrac1\\varepsilon$.</p>\n<h2>S&#39;exercer</h2>\n<section class=\"exo\"><h3>Sup, inf, max, min</h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Donne sup, inf, max et min de $A = ]-2, 5]$.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Une borne qui appartient à l&#39;ensemble est aussi un max ou un min.</p>\n</div><div class=\"ex-c\" hidden><p>$\\sup A = \\max A = 5$ (5 appartient à $A$). $\\inf A = -2$, mais pas de minimum car $-2$ n&#39;est pas dans $A$.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Même question pour $B = \\{ \\tfrac1n,\\ n \\ge 1 \\}$.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Écris les premiers éléments : 1, 1/2, 1/3…</p>\n</div><div class=\"ex-c\" hidden><p>$\\sup B = \\max B = 1$ (pour $n = 1$). $\\inf B = 0$ : 0 minore $B$, et pour tout $\\varepsilon &gt; 0$ il existe $n$ avec $\\tfrac1n &lt; \\varepsilon$. Pas de minimum, car $\\tfrac1n$ ne vaut jamais 0.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Calcule $E(-0{,}5)$.</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button></div><div class=\"ex-h\" hidden><p>Le plus grand entier inférieur ou égal à −0,5.</p>\n</div><div class=\"ex-c\" hidden><p><b>Réponse attendue : -1</b></p><p>$-1 \\le -0{,}5 &lt; 0$, donc $E(-0{,}5) = -1$.</p>\n</div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 7 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">La borne supérieure de $[0, 1[$ est :</div><button class=\"opt\" data-o=\"0\">$0$</button><button class=\"opt\" data-o=\"1\">$1$</button><button class=\"opt\" data-o=\"2\">elle n&#39;existe pas</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">L&#39;intervalle $[0, 1[$ a-t-il un maximum ?</div><button class=\"opt\" data-o=\"0\">Oui, c&#39;est 1</button><button class=\"opt\" data-o=\"1\">Non</button><button class=\"opt\" data-o=\"2\">Oui, c&#39;est 0,999</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Que vaut $E(-2{,}7)$ ?</div><button class=\"opt\" data-o=\"0\">$-2$</button><button class=\"opt\" data-o=\"1\">$-3$</button><button class=\"opt\" data-o=\"2\">$2$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Pour $A = \\{ \\tfrac1n,\\ n \\ge 1 \\}$, la borne inférieure est :</div><button class=\"opt\" data-o=\"0\">$0$, et elle n&#39;est pas atteinte</button><button class=\"opt\" data-o=\"1\">$0$, et c&#39;est le minimum</button><button class=\"opt\" data-o=\"2\">$1$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">La propriété de la borne supérieure affirme que :</div><button class=\"opt\" data-o=\"0\">toute partie de $\\mathbb{R}$ a un maximum</button><button class=\"opt\" data-o=\"1\">toute partie de $\\mathbb{R}$ non vide et majorée a une borne supérieure</button><button class=\"opt\" data-o=\"2\">toute partie majorée de $\\mathbb{Q}$ a une borne supérieure dans $\\mathbb{Q}$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Si un ensemble $A$ a un maximum, alors :</div><button class=\"opt\" data-o=\"0\">$\\sup A = \\max A$</button><button class=\"opt\" data-o=\"1\">$\\sup A &gt; \\max A$</button><button class=\"opt\" data-o=\"2\">$A$ n&#39;a pas de borne supérieure</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">L&#39;ensemble des majorants de $]-\\infty, 3]$ est :</div><button class=\"opt\" data-o=\"0\">$]3, +\\infty[$</button><button class=\"opt\" data-o=\"1\">$[3, +\\infty[$</button><button class=\"opt\" data-o=\"2\">$\\{3\\}$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">$M$ est un majorant de $A$. Pour que $M = \\sup A$, il faut en plus que, pour tout $\\varepsilon &gt; 0$ :</div><button class=\"opt\" data-o=\"0\">tous les éléments de $A$ soient supérieurs à $M - \\varepsilon$</button><button class=\"opt\" data-o=\"1\">il existe un élément de $A$ supérieur à $M - \\varepsilon$</button><button class=\"opt\" data-o=\"2\">$M - \\varepsilon$ soit un majorant de $A$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Pour tout réel $x$, la partie entière vérifie :</div><button class=\"opt\" data-o=\"0\">$E(x) &lt; x \\le E(x) + 1$</button><button class=\"opt\" data-o=\"1\">$E(x) \\le x &lt; E(x) + 1$</button><button class=\"opt\" data-o=\"2\">$E(x) - 1 &lt; x &lt; E(x)$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">L&#39;ensemble $\\mathbb{N}$ est-il majoré dans $\\mathbb{R}$ ?</div><button class=\"opt\" data-o=\"0\">Oui</button><button class=\"opt\" data-o=\"1\">Non</button><button class=\"opt\" data-o=\"2\">Seulement par un nombre irrationnel</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"borne-superieure","rep":null,"tol":null},{"n":"borne-superieure","rep":null,"tol":null},{"n":"borne-superieure","rep":null,"tol":null},{"n":"borne-superieure","rep":["-1"],"tol":null}],"qcm":[{"n":"borne-superieure","q":"La borne supérieure de $[0, 1[$ est :","o":["$0$","$1$","elle n&#39;existe pas"],"a":1,"e":"Les majorants sont les nombres $\\ge 1$. Le plus petit est 1."},{"n":"borne-superieure","q":"L&#39;intervalle $[0, 1[$ a-t-il un maximum ?","o":["Oui, c&#39;est 1","Non","Oui, c&#39;est 0,999"],"a":1,"e":"Un maximum doit appartenir à l&#39;ensemble. 1 n&#39;y est pas, et aucun élément n&#39;est plus grand que tous les autres."},{"n":"borne-superieure","q":"Que vaut $E(-2{,}7)$ ?","o":["$-2$","$-3$","$2$"],"a":1,"e":"$-3 \\le -2{,}7 &lt; -2$. Pour un négatif, la partie entière va vers la gauche."},{"n":"borne-superieure","q":"Pour $A = \\{ \\tfrac1n,\\ n \\ge 1 \\}$, la borne inférieure est :","o":["$0$, et elle n&#39;est pas atteinte","$0$, et c&#39;est le minimum","$1$"],"a":0,"e":"$\\tfrac1n$ s&#39;approche de 0 autant qu&#39;on veut sans jamais valoir 0."},{"n":"borne-superieure","q":"La propriété de la borne supérieure affirme que :","o":["toute partie de $\\mathbb{R}$ a un maximum","toute partie de $\\mathbb{R}$ non vide et majorée a une borne supérieure","toute partie majorée de $\\mathbb{Q}$ a une borne supérieure dans $\\mathbb{Q}$"],"a":1,"e":"Les deux hypothèses comptent : non vide et majorée. Dans $\\mathbb{Q}$, la propriété est fausse."},{"n":"borne-superieure","q":"Si un ensemble $A$ a un maximum, alors :","o":["$\\sup A = \\max A$","$\\sup A &gt; \\max A$","$A$ n&#39;a pas de borne supérieure"],"a":0,"e":"Le maximum est un majorant, et aucun majorant ne peut être plus petit que lui puisqu&#39;il est dans $A$."},{"n":"borne-superieure","q":"L&#39;ensemble des majorants de $]-\\infty, 3]$ est :","o":["$]3, +\\infty[$","$[3, +\\infty[$","$\\{3\\}$"],"a":1,"e":"3 lui-même est un majorant, ainsi que tout nombre plus grand."},{"n":"borne-superieure","q":"$M$ est un majorant de $A$. Pour que $M = \\sup A$, il faut en plus que, pour tout $\\varepsilon &gt; 0$ :","o":["tous les éléments de $A$ soient supérieurs à $M - \\varepsilon$","il existe un élément de $A$ supérieur à $M - \\varepsilon$","$M - \\varepsilon$ soit un majorant de $A$"],"a":1,"e":"Un seul élément suffit : il prouve que $M - \\varepsilon$ n&#39;est plus un plafond."},{"n":"borne-superieure","q":"Pour tout réel $x$, la partie entière vérifie :","o":["$E(x) &lt; x \\le E(x) + 1$","$E(x) \\le x &lt; E(x) + 1$","$E(x) - 1 &lt; x &lt; E(x)$"],"a":1,"e":"L&#39;inégalité large est à gauche : $E(5) = 5$."},{"n":"borne-superieure","q":"L&#39;ensemble $\\mathbb{N}$ est-il majoré dans $\\mathbb{R}$ ?","o":["Oui","Non","Seulement par un nombre irrationnel"],"a":1,"e":"C&#39;est la propriété d&#39;Archimède : pour tout réel, un entier le dépasse."}]},{"id":"limite-suite","t":"Suites · la limite, avec ε et N","seance":"Chapitre 2 · Les suites numériques","imp":5,"html":"<h2>Avant de commencer</h2>\n<p>Un seul prérequis, vu au chapitre 1 : $|u - \\ell| &lt; \\varepsilon$ veut dire que $u$ est à moins de $\\varepsilon$ de $\\ell$, donc dans l&#39;intervalle $]\\ell - \\varepsilon,\\ \\ell + \\varepsilon[$.</p>\n<section class=\"exo\"><h3>Vérifie ton prérequis</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Traduis $|u - 2| &lt; 0{,}1$ en encadrement de $u$.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Centre 2, rayon 0,1.</p>\n</div><div class=\"ex-c\" hidden><p>$1{,}9 &lt; u &lt; 2{,}1$. Si ce passage n&#39;est pas immédiat, reprends l&#39;idée 2 du chapitre « Inégalités et valeur absolue » avant de continuer : toute la définition de la limite repose dessus.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Comment aborder ce chapitre</h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p><strong>Pense à un jeu à deux.</strong> Un adversaire choisit une marge $\\varepsilon$, aussi petite qu&#39;il veut. Toi, tu dois répondre par un rang $N$ à partir duquel <strong>tous</strong> les termes sont dans la marge. Si tu sais toujours répondre, la suite converge.</p>\n</aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>Croire que $N$ est fixé une fois pour toutes. $N$ <strong>dépend de</strong> $\\varepsilon$ : plus la marge est fine, plus il faut aller loin. C&#39;est pour ça que « pour tout $\\varepsilon$ » est écrit <strong>avant</strong> « il existe $N$ ».</p>\n</aside><p>À la fin, tu sais lire la définition, la faire tourner sur un exemple, et prouver qu&#39;une suite n&#39;a pas de limite.</p>\n<h2>Idée 1 · Une suite est une liste numérotée</h2>\n<p>Une suite $(u_n)$ associe un réel à chaque entier $n$.</p>\n<ul>\n<li>$u_n = \\tfrac1n$ : $1,\\ \\tfrac12,\\ \\tfrac13,\\ \\tfrac14,\\dots$ les termes se tassent vers 0.</li>\n<li>$u_n = (-1)^n$ : $-1,\\ 1,\\ -1,\\ 1,\\dots$ elle saute sans se poser.</li>\n<li>$u_n = n^2$ : $1,\\ 4,\\ 9,\\ 16,\\dots$ elle part vers l&#39;infini.</li>\n</ul>\n<p>La question du chapitre : que font les termes <strong>quand $n$ devient grand</strong> ?</p>\n<h2>Idée 2 · Converger, c&#39;est finir dans le tube</h2>\n<svg viewBox=\"0 0 340 190\" style=\"width:100%;max-width:440px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Les termes de la suite 1 sur n entrent dans la bande de largeur epsilon autour de zéro à partir du rang N et n'en sortent plus\">\n<rect x=\"30\" y=\"118\" width=\"300\" height=\"44\" fill=\"#D9824F\" opacity=\".18\"/>\n<line x1=\"30\" y1=\"118\" x2=\"330\" y2=\"118\" stroke=\"#D9824F\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/>\n<line x1=\"30\" y1=\"162\" x2=\"330\" y2=\"162\" stroke=\"#D9824F\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/>\n<line x1=\"30\" y1=\"140\" x2=\"330\" y2=\"140\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<line x1=\"30\" y1=\"10\" x2=\"30\" y2=\"176\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<g fill=\"currentColor\"><circle cx=\"60\" cy=\"20\" r=\"4.5\"/><circle cx=\"90\" cy=\"80\" r=\"4.5\"/><circle cx=\"120\" cy=\"100\" r=\"4.5\"/></g>\n<g fill=\"#D9824F\"><circle cx=\"150\" cy=\"110\" r=\"4.5\"/><circle cx=\"180\" cy=\"116\" r=\"4.5\"/><circle cx=\"210\" cy=\"120\" r=\"4.5\"/><circle cx=\"240\" cy=\"123\" r=\"4.5\"/><circle cx=\"270\" cy=\"125\" r=\"4.5\"/><circle cx=\"300\" cy=\"127\" r=\"4.5\"/></g>\n<line x1=\"210\" y1=\"10\" x2=\"210\" y2=\"176\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-dasharray=\"3 5\"/>\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\">\n<text x=\"214\" y=\"22\" font-weight=\"700\">rang N</text><text x=\"36\" y=\"136\" font-weight=\"700\">ℓ</text><text x=\"36\" y=\"113\" fill=\"#D9824F\" font-weight=\"700\">ℓ + ε</text><text x=\"36\" y=\"177\" fill=\"#D9824F\" font-weight=\"700\">ℓ − ε</text><text x=\"236\" y=\"182\">n ≥ N : dans le tube</text></g>\n</svg><p>On dit que $(u_n)$ <strong>converge vers</strong> $\\ell$ si :</p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p><strong>Pour tout</strong> $\\varepsilon &gt; 0$, <strong>il existe</strong> un rang $N$ tel que, <strong>pour tout</strong> $n \\ge N$ : $|u_n - \\ell| &lt; \\varepsilon$.</p>\n</aside><p>En symboles :</p>\n<p>$$\\forall \\varepsilon &gt; 0,\\ \\exists N,\\ \\forall n \\ge N,\\ |u_n - \\ell| &lt; \\varepsilon$$</p>\n<p>Lecture mot à mot :</p>\n<ul>\n<li><strong>pour tout $\\varepsilon &gt; 0$</strong> : quelle que soit la largeur du tube ;</li>\n<li><strong>il existe $N$</strong> : on trouve un rang ;</li>\n<li><strong>pour tout $n \\ge N$</strong> : à partir de là, <strong>tous</strong> les termes, sans exception ;</li>\n<li><strong>$|u_n - \\ell| &lt; \\varepsilon$</strong> : sont dans le tube.</li>\n</ul>\n<p>Quelques termes dans le tube ne suffisent pas. Il faut qu&#39;ils y soient tous, pour toujours, à partir d&#39;un certain rang.</p>\n<h2>Idée 3 · Faire tourner la définition</h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Prouver que 1/n tend vers 0</figcaption><div class=\"etape\"><div class=\"et-t\">1/6 · L&#39;adversaire joue</div><p>Il donne un $\\varepsilon &gt; 0$ quelconque. On ne le choisit pas.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/6 · Ce qu&#39;on veut</div><p>$\\left|\\tfrac1n - 0\\right| &lt; \\varepsilon$, c&#39;est-à-dire $\\tfrac1n &lt; \\varepsilon$.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/6 · On isole n</div><p>$\\tfrac1n &lt; \\varepsilon$ équivaut à $n &gt; \\tfrac1\\varepsilon$.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">4/6 · On répond par un rang</div><p>$N = E\\!\\left(\\tfrac1\\varepsilon\\right) + 1$. Cet entier est strictement plus grand que $\\tfrac1\\varepsilon$.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">5/6 · On conclut</div><p>Pour tout $n \\ge N$ : $n &gt; \\tfrac1\\varepsilon$, donc $\\tfrac1n &lt; \\varepsilon$. La suite converge vers 0.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">6/6 · Avec un nombre</div><p>Pour $\\varepsilon = 0{,}01$ : $N = 101$. À partir du 101ᵉ terme, tout est à moins de 0,01 de zéro.</p>\n</div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><p><strong>Deuxième exemple.</strong> $u_n = \\dfrac{2n + 1}{n + 3}$ tend vers 2.</p>\n<p>$$|u_n - 2| = \\left|\\frac{2n + 1 - 2(n + 3)}{n + 3}\\right| = \\frac{5}{n + 3}$$</p>\n<p>On veut $\\tfrac{5}{n+3} &lt; \\varepsilon$. Il suffit que $n &gt; \\tfrac5\\varepsilon$, car alors $n + 3 &gt; \\tfrac5\\varepsilon$. On prend $N = E\\!\\left(\\tfrac5\\varepsilon\\right) + 1$.</p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p>La méthode ne change jamais : <strong>calculer $|u_n - \\ell|$, le simplifier ou le majorer, isoler $n$, en déduire $N$.</strong> On n&#39;a pas besoin du plus petit $N$ : n&#39;importe quel rang qui marche suffit.</p>\n</aside><h2>Idée 4 · Ce qui découle de la définition</h2>\n<ul>\n<li><strong>La limite est unique.</strong> Une suite ne peut pas finir dans deux tubes disjoints à la fois.</li>\n<li><strong>Toute suite convergente est bornée.</strong> À partir du rang $N$ les termes sont dans le tube, et avant il n&#39;y en a qu&#39;un nombre fini.</li>\n<li><strong>La réciproque est fausse.</strong> $(-1)^n$ est bornée et ne converge pas.</li>\n</ul>\n<p>Pourquoi $(-1)^n$ n&#39;a pas de limite : supposons qu&#39;elle tende vers $\\ell$, et prenons $\\varepsilon = 1$. À partir d&#39;un rang, on aurait à la fois $|1 - \\ell| &lt; 1$ et $|-1 - \\ell| &lt; 1$. Mais alors $2 = |1 - (-1)| \\le |1 - \\ell| + |\\ell + 1| &lt; 2$ : impossible.</p>\n<p><strong>Limite infinie.</strong> $(u_n)$ tend vers $+\\infty$ si, pour tout réel $A$, il existe un rang $N$ tel que $u_n &gt; A$ pour tout $n \\ge N$. Ici le tube est remplacé par une barre que la suite finit par dépasser pour toujours. Exemple : $n^2 &gt; A$ dès que $n &gt; \\sqrt{|A|}$.</p>\n<h2>S&#39;exercer</h2>\n<section class=\"exo\"><h3>Applique la méthode</h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Prouve que $u_n = \\dfrac{3}{n^2}$ tend vers 0 : donne un rang $N$ en fonction de $\\varepsilon$.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Isole n dans 3/n² &lt; ε.</p>\n</div><div class=\"ex-c\" hidden><p>$\\tfrac{3}{n^2} &lt; \\varepsilon$ équivaut à $n^2 &gt; \\tfrac3\\varepsilon$, soit $n &gt; \\sqrt{3/\\varepsilon}$. On prend $N = E\\!\\left(\\sqrt{3/\\varepsilon}\\right) + 1$.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>La suite $u_n = \\dfrac{(-1)^n}{n}$ converge-t-elle ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Regarde |u_n|.</p>\n</div><div class=\"ex-c\" hidden><p>Oui, vers 0. $|u_n - 0| = \\tfrac1n$, qui est inférieur à $\\varepsilon$ dès que $n &gt; \\tfrac1\\varepsilon$. Le signe qui alterne ne gêne pas : les termes sont dans le tube des deux côtés de 0.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Pour $u_n = \\tfrac1n$ et $\\varepsilon = 0{,}1$, quel est le plus petit rang $N$ qui convient ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button></div><div class=\"ex-h\" hidden><p>Il faut 1/n &lt; 0,1 strictement.</p>\n</div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 11</b></p><p>$\\tfrac1n &lt; 0{,}1$ équivaut à $n &gt; 10$. Le plus petit rang est $N = 11$ (pour $n = 10$, $\\tfrac1{10} = 0{,}1$ n&#39;est pas strictement inférieur).</p>\n</div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 7 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quelle écriture est la définition de « $(u_n)$ converge vers $\\ell$ » ?</div><button class=\"opt\" data-o=\"0\">Il existe $N$ tel que pour tout $\\varepsilon &gt; 0$ et tout $n \\ge N$, $|u_n - \\ell| &lt; \\varepsilon$</button><button class=\"opt\" data-o=\"1\">Pour tout $\\varepsilon &gt; 0$, il existe $N$ tel que pour tout $n \\ge N$, $|u_n - \\ell| &lt; \\varepsilon$</button><button class=\"opt\" data-o=\"2\">Pour tout $\\varepsilon &gt; 0$, il existe $n$ tel que $|u_n - \\ell| &lt; \\varepsilon$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Pour $u_n = \\tfrac1n$ et $\\varepsilon = 0{,}1$, le plus petit rang $N$ qui convient est :</div><button class=\"opt\" data-o=\"0\">$10$</button><button class=\"opt\" data-o=\"1\">$11$</button><button class=\"opt\" data-o=\"2\">$100$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">La suite $u_n = (-1)^n$ :</div><button class=\"opt\" data-o=\"0\">converge vers 0</button><button class=\"opt\" data-o=\"1\">converge vers 1</button><button class=\"opt\" data-o=\"2\">n&#39;a pas de limite</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Toute suite convergente est :</div><button class=\"opt\" data-o=\"0\">bornée</button><button class=\"opt\" data-o=\"1\">croissante</button><button class=\"opt\" data-o=\"2\">positive</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Toute suite bornée est-elle convergente ?</div><button class=\"opt\" data-o=\"0\">Oui</button><button class=\"opt\" data-o=\"1\">Non</button><button class=\"opt\" data-o=\"2\">Oui, si elle est positive</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">La limite de $u_n = \\dfrac{2n + 1}{n + 3}$ est :</div><button class=\"opt\" data-o=\"0\">$\\tfrac13$</button><button class=\"opt\" data-o=\"1\">$2$</button><button class=\"opt\" data-o=\"2\">$+\\infty$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Dans la définition de la limite, le rang $N$ :</div><button class=\"opt\" data-o=\"0\">est le même pour tous les $\\varepsilon$</button><button class=\"opt\" data-o=\"1\">dépend de $\\varepsilon$</button><button class=\"opt\" data-o=\"2\">dépend de $n$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">« À partir d&#39;un certain rang, tous les termes sont dans le tube » veut dire :</div><button class=\"opt\" data-o=\"0\">au moins un terme est dans le tube</button><button class=\"opt\" data-o=\"1\">une infinité de termes sont dans le tube</button><button class=\"opt\" data-o=\"2\">il existe $N$ tel que tous les termes de rang $n \\ge N$ sont dans le tube</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">« $(u_n)$ tend vers $+\\infty$ » signifie :</div><button class=\"opt\" data-o=\"0\">$u_n$ est croissante</button><button class=\"opt\" data-o=\"1\">pour tout réel $A$, il existe $N$ tel que $u_n &gt; A$ pour tout $n \\ge N$</button><button class=\"opt\" data-o=\"2\">$u_n$ n&#39;est pas bornée</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Une suite peut-elle converger vers deux limites différentes ?</div><button class=\"opt\" data-o=\"0\">Oui</button><button class=\"opt\" data-o=\"1\">Non</button><button class=\"opt\" data-o=\"2\">Seulement si elle alterne</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"limite-suite","rep":null,"tol":null},{"n":"limite-suite","rep":null,"tol":null},{"n":"limite-suite","rep":null,"tol":null},{"n":"limite-suite","rep":["11"],"tol":null}],"qcm":[{"n":"limite-suite","q":"Quelle écriture est la définition de « $(u_n)$ converge vers $\\ell$ » ?","o":["Il existe $N$ tel que pour tout $\\varepsilon &gt; 0$ et tout $n \\ge N$, $|u_n - \\ell| &lt; \\varepsilon$","Pour tout $\\varepsilon &gt; 0$, il existe $N$ tel que pour tout $n \\ge N$, $|u_n - \\ell| &lt; \\varepsilon$","Pour tout $\\varepsilon &gt; 0$, il existe $n$ tel que $|u_n - \\ell| &lt; \\varepsilon$"],"a":1,"e":"L&#39;ordre compte : $\\varepsilon$ d&#39;abord, puis $N$ qui en dépend, puis tous les $n \\ge N$."},{"n":"limite-suite","q":"Pour $u_n = \\tfrac1n$ et $\\varepsilon = 0{,}1$, le plus petit rang $N$ qui convient est :","o":["$10$","$11$","$100$"],"a":1,"e":"Il faut $\\tfrac1n &lt; 0{,}1$ strictement, donc $n &gt; 10$."},{"n":"limite-suite","q":"La suite $u_n = (-1)^n$ :","o":["converge vers 0","converge vers 1","n&#39;a pas de limite"],"a":2,"e":"Elle saute entre $-1$ et $1$ : aucun tube de largeur 1 ne contient tous ses termes à partir d&#39;un rang."},{"n":"limite-suite","q":"Toute suite convergente est :","o":["bornée","croissante","positive"],"a":0,"e":"À partir d&#39;un rang les termes sont dans le tube, et avant ce rang il n&#39;y en a qu&#39;un nombre fini."},{"n":"limite-suite","q":"Toute suite bornée est-elle convergente ?","o":["Oui","Non","Oui, si elle est positive"],"a":1,"e":"Contre-exemple : $(-1)^n$ est bornée et ne converge pas."},{"n":"limite-suite","q":"La limite de $u_n = \\dfrac{2n + 1}{n + 3}$ est :","o":["$\\tfrac13$","$2$","$+\\infty$"],"a":1,"e":"$|u_n - 2| = \\tfrac{5}{n+3}$, qui devient aussi petit qu&#39;on veut."},{"n":"limite-suite","q":"Dans la définition de la limite, le rang $N$ :","o":["est le même pour tous les $\\varepsilon$","dépend de $\\varepsilon$","dépend de $n$"],"a":1,"e":"Plus $\\varepsilon$ est petit, plus il faut aller loin dans la suite."},{"n":"limite-suite","q":"« À partir d&#39;un certain rang, tous les termes sont dans le tube » veut dire :","o":["au moins un terme est dans le tube","une infinité de termes sont dans le tube","il existe $N$ tel que tous les termes de rang $n \\ge N$ sont dans le tube"],"a":2,"e":"Une infinité ne suffit pas : $(-1)^n$ a une infinité de termes égaux à 1 sans converger vers 1."},{"n":"limite-suite","q":"« $(u_n)$ tend vers $+\\infty$ » signifie :","o":["$u_n$ est croissante","pour tout réel $A$, il existe $N$ tel que $u_n &gt; A$ pour tout $n \\ge N$","$u_n$ n&#39;est pas bornée"],"a":1,"e":"La suite doit dépasser toute barre et rester au-dessus. « Non bornée » ne suffit pas : $0, 1, 0, 2, 0, 3,\\dots$ n&#39;est pas bornée et ne tend pas vers $+\\infty$."},{"n":"limite-suite","q":"Une suite peut-elle converger vers deux limites différentes ?","o":["Oui","Non","Seulement si elle alterne"],"a":1,"e":"La limite est unique : deux tubes assez fins autour de deux limites distinctes sont disjoints."}]},{"id":"calcul-limites","t":"Suites · calculer une limite","seance":"Chapitre 2 · Les suites numériques","imp":5,"html":"<h2>Avant de commencer</h2>\n<p>Deux acquis du chapitre précédent suffisent : ce que veut dire « $u_n$ tend vers $\\ell$ », et le fait que $\\tfrac1n$ tend vers 0.</p>\n<section class=\"exo\"><h3>Vérifie ton prérequis</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Sans calcul compliqué : vers quoi tend $u_n = 3 + \\dfrac1n$ ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button></div><div class=\"ex-h\" hidden><p>Que devient 1/n quand n grandit ?</p>\n</div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 3</b></p><p>Vers 3. $\\tfrac1n$ devient aussi petit qu&#39;on veut, donc $u_n$ se colle à 3. Si tu hésites, relis l&#39;idée 2 du chapitre « La limite, avec ε et N ».</p>\n</div></div></section><h2>Comment aborder ce chapitre</h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p><strong>Pense briques.</strong> On ne revient presque jamais à $\\varepsilon$. On connaît quelques limites de base, et on les assemble avec des règles : somme, produit, quotient, encadrement.</p>\n</aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>Écrire « $\\infty - \\infty = 0$ » ou « $\\tfrac{\\infty}{\\infty} = 1$ ». Ce sont des <strong>formes indéterminées</strong> : le résultat dépend des suites. Il faut transformer l&#39;expression avant de conclure.</p>\n</aside><p>À la fin, tu sais calculer la limite de presque toutes les suites d&#39;un TD de première année.</p>\n<h2>Idée 1 · Les briques et les règles</h2>\n<p><strong>Limites de référence</strong></p>\n<ul>\n<li>$\\dfrac{1}{n^\\alpha} \\to 0$ pour tout $\\alpha &gt; 0$ (donc $\\tfrac1n$, $\\tfrac1{n^2}$, $\\tfrac1{\\sqrt n}$).</li>\n<li>$q^n \\to 0$ si $|q| &lt; 1$ ; $q^n \\to +\\infty$ si $q &gt; 1$ ; pas de limite si $q \\le -1$.</li>\n</ul>\n<p><strong>Règles.</strong> Si $u_n \\to \\ell$ et $v_n \\to \\ell'$ (deux limites finies) :</p>\n<ul>\n<li>$u_n + v_n \\to \\ell + \\ell'$ ;</li>\n<li>$u_n \\times v_n \\to \\ell \\times \\ell'$ ;</li>\n<li>$\\dfrac{u_n}{v_n} \\to \\dfrac{\\ell}{\\ell'}$ si $\\ell' \\ne 0$.</li>\n</ul>\n<p>Les quatre formes indéterminées à reconnaître : $\\infty - \\infty$, $0 \\times \\infty$, $\\dfrac{\\infty}{\\infty}$, $\\dfrac00$.</p>\n<h2>Idée 2 · Lever une forme indéterminée</h2>\n<p>Deux gestes couvrent la plupart des cas.</p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Geste 1 : factoriser par le terme dominant</figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · La suite</div><p>$u_n = \\dfrac{3n^2 + n}{2n^2 - 5}$. En haut et en bas, ça part vers l&#39;infini : forme $\\tfrac{\\infty}{\\infty}$.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · On factorise par n²</div><p>$u_n = \\dfrac{n^2\\left(3 + \\tfrac1n\\right)}{n^2\\left(2 - \\tfrac5{n^2}\\right)}$.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · On simplifie</div><p>$u_n = \\dfrac{3 + \\tfrac1n}{2 - \\tfrac5{n^2}}$. Il n&#39;y a plus rien d&#39;indéterminé.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · On applique les règles</div><p>Le haut tend vers 3, le bas vers 2. Donc $u_n \\to \\tfrac32$.</p>\n</div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><figure class=\"etapes\" data-i=\"0\"><figcaption>Geste 2 : la quantité conjuguée</figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · La suite</div><p>$u_n = \\sqrt{n + 1} - \\sqrt n$. Forme $\\infty - \\infty$.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · On multiplie en haut et en bas</div><p>par $\\sqrt{n+1} + \\sqrt n$, pour utiliser $(a - b)(a + b) = a^2 - b^2$.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Le haut se simplifie</div><p>$(n + 1) - n = 1$. Donc $u_n = \\dfrac{1}{\\sqrt{n+1} + \\sqrt n}$.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · On conclut</div><p>Le bas tend vers $+\\infty$, donc $u_n \\to 0$.</p>\n</div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p>Fraction de polynômes : <strong>factoriser par la plus grande puissance</strong>. Différence de racines : <strong>quantité conjuguée</strong>.</p>\n</aside><h2>Idée 3 · Le théorème des gendarmes</h2>\n<svg viewBox=\"0 0 340 170\" style=\"width:100%;max-width:440px;display:block;margin:10px auto\" role=\"img\" aria-label=\"La suite u est coincée entre deux suites v et w qui tendent vers la même limite\">\n<line x1=\"30\" y1=\"90\" x2=\"330\" y2=\"90\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-dasharray=\"4 5\"/>\n<path d=\"M40 20 C110 70 200 84 325 88\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"/>\n<path d=\"M40 160 C110 112 200 96 325 92\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"/>\n<g fill=\"#D9824F\"><circle cx=\"60\" cy=\"120\" r=\"4.5\"/><circle cx=\"90\" cy=\"62\" r=\"4.5\"/><circle cx=\"120\" cy=\"108\" r=\"4.5\"/><circle cx=\"150\" cy=\"76\" r=\"4.5\"/><circle cx=\"180\" cy=\"98\" r=\"4.5\"/><circle cx=\"210\" cy=\"84\" r=\"4.5\"/><circle cx=\"240\" cy=\"93\" r=\"4.5\"/><circle cx=\"270\" cy=\"88\" r=\"4.5\"/><circle cx=\"300\" cy=\"91\" r=\"4.5\"/></g>\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\" font-weight=\"700\"><text x=\"48\" y=\"16\">w</text><text x=\"48\" y=\"168\">v</text><text x=\"8\" y=\"94\">ℓ</text><text x=\"96\" y=\"52\" fill=\"#D9824F\">u</text></g>\n</svg><p>Si, à partir d&#39;un certain rang, $v_n \\le u_n \\le w_n$, et si $v_n$ et $w_n$ tendent vers la <strong>même</strong> limite $\\ell$, alors $u_n \\to \\ell$.</p>\n<p><strong>Exemple.</strong> $u_n = \\dfrac{\\sin n}{n}$. On ne sait rien de précis sur $\\sin n$, mais $-1 \\le \\sin n \\le 1$, donc $-\\tfrac1n \\le u_n \\le \\tfrac1n$. Les deux gendarmes tendent vers 0 : $u_n \\to 0$.</p>\n<p>Deux versions qui servent tout le temps :</p>\n<ul>\n<li>si $|u_n - \\ell| \\le v_n$ et $v_n \\to 0$, alors $u_n \\to \\ell$ ;</li>\n<li><strong>bornée × tend vers 0 = tend vers 0</strong>.</li>\n</ul>\n<p>Et vers l&#39;infini, un seul gendarme suffit : si $u_n \\ge v_n$ et $v_n \\to +\\infty$, alors $u_n \\to +\\infty$.</p>\n<h2>Idée 4 · Les inégalités deviennent larges à la limite</h2>\n<p>Si $u_n &lt; v_n$ pour tout $n$ et que les deux suites convergent, on peut seulement dire $\\ell \\le \\ell'$.</p>\n<p><strong>Exemple.</strong> $\\tfrac1n &gt; 0$ pour tout $n$, et pourtant la limite vaut 0, qui n&#39;est pas strictement positif.</p>\n<aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>Une inégalité <strong>stricte</strong> entre les termes donne une inégalité <strong>large</strong> entre les limites.</p>\n</aside><h2>S&#39;exercer</h2>\n<section class=\"exo\"><h3>Calcule ces limites</h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>$u_n = \\dfrac{5n^3 - n}{2n^3 + 7}$</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Factorise par n³ en haut et en bas.</p>\n</div><div class=\"ex-c\" hidden><p>$u_n = \\dfrac{5 - \\tfrac1{n^2}}{2 + \\tfrac7{n^3}} \\to \\dfrac52$.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>$u_n = \\dfrac{n + (-1)^n}{n}$</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button></div><div class=\"ex-h\" hidden><p>Sépare en deux fractions.</p>\n</div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1</b></p><p>$u_n = 1 + \\dfrac{(-1)^n}{n}$. Le second terme est borné × $\\tfrac1n$, il tend vers 0. Donc $u_n \\to 1$.</p>\n</div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>$u_n = \\sqrt{n^2 + n} - n$</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Quantité conjuguée, puis factorise par n au dénominateur.</p>\n</div><div class=\"ex-c\" hidden><p>$u_n = \\dfrac{n}{\\sqrt{n^2 + n} + n} = \\dfrac{1}{\\sqrt{1 + \\tfrac1n} + 1} \\to \\dfrac12$.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>$u_n = \\dfrac{2^n + 3^n}{3^n}$</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button></div><div class=\"ex-h\" hidden><p>Sépare et reconnais une suite géométrique.</p>\n</div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1</b></p><p>$u_n = \\left(\\tfrac23\\right)^n + 1$. Comme $\\left|\\tfrac23\\right| &lt; 1$, $\\left(\\tfrac23\\right)^n \\to 0$, donc $u_n \\to 1$.</p>\n</div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 7 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">La limite de $\\dfrac{3n^2 + n}{2n^2 - 5}$ est :</div><button class=\"opt\" data-o=\"0\">$+\\infty$</button><button class=\"opt\" data-o=\"1\">$\\tfrac32$</button><button class=\"opt\" data-o=\"2\">$0$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">La limite de $(0{,}5)^n$ est :</div><button class=\"opt\" data-o=\"0\">$0$</button><button class=\"opt\" data-o=\"1\">$0{,}5$</button><button class=\"opt\" data-o=\"2\">$+\\infty$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">La limite de $\\dfrac{(-1)^n}{n^2}$ est :</div><button class=\"opt\" data-o=\"0\">elle n&#39;existe pas</button><button class=\"opt\" data-o=\"1\">$0$</button><button class=\"opt\" data-o=\"2\">$1$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Laquelle n&#39;est <strong>pas</strong> une forme indéterminée ?</div><button class=\"opt\" data-o=\"0\">$\\infty - \\infty$</button><button class=\"opt\" data-o=\"1\">$0 \\times \\infty$</button><button class=\"opt\" data-o=\"2\">$+\\infty + \\infty$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Pour appliquer le théorème des gendarmes à $v_n \\le u_n \\le w_n$, il faut que :</div><button class=\"opt\" data-o=\"0\">$v_n$ et $w_n$ soient croissantes</button><button class=\"opt\" data-o=\"1\">$v_n$ et $w_n$ aient la même limite</button><button class=\"opt\" data-o=\"2\">$u_n$ soit positive</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">On sait que $u_n &gt; 0$ pour tout $n$ et que $u_n \\to \\ell$. Alors :</div><button class=\"opt\" data-o=\"0\">$\\ell &gt; 0$</button><button class=\"opt\" data-o=\"1\">$\\ell \\ge 0$</button><button class=\"opt\" data-o=\"2\">on ne peut rien dire</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">La limite de $\\sqrt{n + 1} - \\sqrt n$ est :</div><button class=\"opt\" data-o=\"0\">$0$</button><button class=\"opt\" data-o=\"1\">$1$</button><button class=\"opt\" data-o=\"2\">$+\\infty$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">La suite $2^n$ :</div><button class=\"opt\" data-o=\"0\">tend vers 0</button><button class=\"opt\" data-o=\"1\">tend vers 2</button><button class=\"opt\" data-o=\"2\">tend vers $+\\infty$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">La limite de $\\dfrac{\\sin n}{n}$ est :</div><button class=\"opt\" data-o=\"0\">elle n&#39;existe pas, car $\\sin n$ n&#39;a pas de limite</button><button class=\"opt\" data-o=\"1\">$0$</button><button class=\"opt\" data-o=\"2\">$1$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">$(u_n)$ est bornée et $v_n \\to 0$. Alors $u_n v_n$ :</div><button class=\"opt\" data-o=\"0\">tend vers 0</button><button class=\"opt\" data-o=\"1\">est bornée, sans qu&#39;on puisse en dire plus</button><button class=\"opt\" data-o=\"2\">tend vers la limite de $u_n$</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"calcul-limites","rep":["3"],"tol":null},{"n":"calcul-limites","rep":null,"tol":null},{"n":"calcul-limites","rep":["1"],"tol":null},{"n":"calcul-limites","rep":null,"tol":null},{"n":"calcul-limites","rep":["1"],"tol":null}],"qcm":[{"n":"calcul-limites","q":"La limite de $\\dfrac{3n^2 + n}{2n^2 - 5}$ est :","o":["$+\\infty$","$\\tfrac32$","$0$"],"a":1,"e":"On factorise par $n^2$ : il reste $\\tfrac{3 + 1/n}{2 - 5/n^2}$."},{"n":"calcul-limites","q":"La limite de $(0{,}5)^n$ est :","o":["$0$","$0{,}5$","$+\\infty$"],"a":0,"e":"Suite géométrique de raison $q$ avec $|q| &lt; 1$."},{"n":"calcul-limites","q":"La limite de $\\dfrac{(-1)^n}{n^2}$ est :","o":["elle n&#39;existe pas","$0$","$1$"],"a":1,"e":"$-\\tfrac1{n^2} \\le u_n \\le \\tfrac1{n^2}$ : les deux gendarmes tendent vers 0."},{"n":"calcul-limites","q":"Laquelle n&#39;est <strong>pas</strong> une forme indéterminée ?","o":["$\\infty - \\infty$","$0 \\times \\infty$","$+\\infty + \\infty$"],"a":2,"e":"La somme de deux suites qui tendent vers $+\\infty$ tend vers $+\\infty$, sans ambiguïté."},{"n":"calcul-limites","q":"Pour appliquer le théorème des gendarmes à $v_n \\le u_n \\le w_n$, il faut que :","o":["$v_n$ et $w_n$ soient croissantes","$v_n$ et $w_n$ aient la même limite","$u_n$ soit positive"],"a":1,"e":"Si les deux gendarmes ont des limites différentes, on ne peut rien conclure."},{"n":"calcul-limites","q":"On sait que $u_n &gt; 0$ pour tout $n$ et que $u_n \\to \\ell$. Alors :","o":["$\\ell &gt; 0$","$\\ell \\ge 0$","on ne peut rien dire"],"a":1,"e":"L&#39;inégalité stricte devient large. Exemple : $\\tfrac1n &gt; 0$ et la limite vaut 0."},{"n":"calcul-limites","q":"La limite de $\\sqrt{n + 1} - \\sqrt n$ est :","o":["$0$","$1$","$+\\infty$"],"a":0,"e":"Par la quantité conjuguée, $u_n = \\tfrac{1}{\\sqrt{n+1} + \\sqrt n}$."},{"n":"calcul-limites","q":"La suite $2^n$ :","o":["tend vers 0","tend vers 2","tend vers $+\\infty$"],"a":2,"e":"Raison $q = 2 &gt; 1$."},{"n":"calcul-limites","q":"La limite de $\\dfrac{\\sin n}{n}$ est :","o":["elle n&#39;existe pas, car $\\sin n$ n&#39;a pas de limite","$0$","$1$"],"a":1,"e":"$\\sin n$ est bornée et $\\tfrac1n \\to 0$ : bornée × tend vers 0."},{"n":"calcul-limites","q":"$(u_n)$ est bornée et $v_n \\to 0$. Alors $u_n v_n$ :","o":["tend vers 0","est bornée, sans qu&#39;on puisse en dire plus","tend vers la limite de $u_n$"],"a":0,"e":"Si $|u_n| \\le M$, alors $|u_n v_n| \\le M |v_n|$, qui tend vers 0."}]},{"id":"suites-monotones","t":"Suites monotones, adjacentes, sous-suites","seance":"Chapitre 2 · Les suites numériques","imp":4,"html":"<h2>Avant de commencer</h2>\n<p>Ce chapitre réunit deux idées déjà vues : la <strong>borne supérieure</strong> (le plus petit plafond) et la <strong>définition de la limite</strong>.</p>\n<section class=\"exo\"><h3>Vérifie ton prérequis</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Quelle est la borne supérieure de l&#39;ensemble $\\{ 1 - \\tfrac1n,\\ n \\ge 1 \\}$ ? Est-elle atteinte ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Écris les premiers termes : 0, 1/2, 2/3, 3/4…</p>\n</div><div class=\"ex-c\" hidden><p>La borne supérieure est 1, et elle n&#39;est pas atteinte. Si ce n&#39;est pas clair, reprends l&#39;idée 3 du chapitre « Majorant, borne supérieure, partie entière » : c&#39;est exactement l&#39;outil de la preuve qui suit.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Comment aborder ce chapitre</h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p><strong>On prouve qu&#39;une limite existe sans la connaître.</strong> Jusqu&#39;ici, il fallait deviner $\\ell$ pour montrer la convergence. Ici, deux informations simples suffisent : la suite monte, et elle a un plafond.</p>\n</aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>« Croissante et majorée par 5, donc elle tend vers 5. » Faux. Elle converge, mais vers sa borne supérieure, qui est <strong>au plus</strong> 5. La suite $1 - \\tfrac1n$ est majorée par 5 et tend vers 1.</p>\n</aside><p>À la fin, tu sais prouver une convergence par monotonie, reconnaître deux suites adjacentes et prouver une divergence avec des sous-suites.</p>\n<h2>Idée 1 · Étudier le sens de variation</h2>\n<p>$(u_n)$ est <strong>croissante</strong> si $u_{n+1} \\ge u_n$ pour tout $n$, <strong>décroissante</strong> si $u_{n+1} \\le u_n$.</p>\n<p>Deux méthodes :</p>\n<ul>\n<li>le signe de $u_{n+1} - u_n$ (marche toujours) ;</li>\n<li>si tous les termes sont strictement positifs, comparer $\\dfrac{u_{n+1}}{u_n}$ à 1 (pratique avec des produits et des puissances).</li>\n</ul>\n<p><strong>Exemple.</strong> $u_n = \\dfrac{n}{n+1}$. On calcule $u_{n+1} - u_n = \\dfrac{n+1}{n+2} - \\dfrac{n}{n+1} = \\dfrac{1}{(n+1)(n+2)} &gt; 0$ : la suite est croissante.</p>\n<h2>Idée 2 · Le théorème de la limite monotone</h2>\n<svg viewBox=\"0 0 340 160\" style=\"width:100%;max-width:440px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Une suite croissante monte vers son plafond, la borne supérieure, sans le dépasser\">\n<line x1=\"30\" y1=\"34\" x2=\"330\" y2=\"34\" stroke=\"#D9824F\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/>\n<line x1=\"30\" y1=\"140\" x2=\"330\" y2=\"140\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"30\" y1=\"10\" x2=\"30\" y2=\"140\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<g fill=\"currentColor\"><circle cx=\"55\" cy=\"126\" r=\"4.5\"/><circle cx=\"85\" cy=\"92\" r=\"4.5\"/><circle cx=\"115\" cy=\"70\" r=\"4.5\"/><circle cx=\"145\" cy=\"57\" r=\"4.5\"/><circle cx=\"175\" cy=\"49\" r=\"4.5\"/><circle cx=\"205\" cy=\"44\" r=\"4.5\"/><circle cx=\"235\" cy=\"41\" r=\"4.5\"/><circle cx=\"265\" cy=\"39\" r=\"4.5\"/><circle cx=\"295\" cy=\"38\" r=\"4.5\"/></g>\n<g font-family=\"sans-serif\" font-size=\"13\" font-weight=\"700\"><text x=\"196\" y=\"24\" fill=\"#D9824F\">plafond le plus bas : sup</text><text x=\"60\" y=\"156\" fill=\"currentColor\">la suite monte et se tasse dessous</text></g>\n</svg><ul>\n<li>Toute suite <strong>croissante et majorée</strong> converge, vers la borne supérieure de ses termes.</li>\n<li>Toute suite <strong>décroissante et minorée</strong> converge, vers la borne inférieure de ses termes.</li>\n<li>Une suite croissante <strong>non majorée</strong> tend vers $+\\infty$.</li>\n</ul>\n<p>Pourquoi : notons $\\ell$ la borne supérieure des termes et prenons $\\varepsilon &gt; 0$. Par la caractérisation du sup, un terme $u_N$ dépasse $\\ell - \\varepsilon$. Comme la suite monte, tous les suivants aussi : $\\ell - \\varepsilon &lt; u_N \\le u_n \\le \\ell$ pour $n \\ge N$. Ils sont dans le tube.</p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Exemple complet : u₀ = 0 et uₙ₊₁ = √(uₙ + 2)</figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Majorée par 2</div><p>Par récurrence. $u_0 = 0 \\le 2$. Si $u_n \\le 2$, alors $u_{n+1} = \\sqrt{u_n + 2} \\le \\sqrt4 = 2$.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Croissante</div><p>$u_{n+1} \\ge u_n$ revient à $u_n + 2 \\ge u_n^2$, soit $(u_n - 2)(u_n + 1) \\le 0$. C&#39;est vrai puisque $0 \\le u_n \\le 2$.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Donc elle converge</div><p>Croissante et majorée : la limite $\\ell$ existe, avec $0 \\le \\ell \\le 2$.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · On trouve la limite</div><p>En passant à la limite dans la relation : $\\ell = \\sqrt{\\ell + 2}$, donc $\\ell^2 - \\ell - 2 = 0$, soit $\\ell = 2$ ou $\\ell = -1$. Comme $\\ell \\ge 0$, on garde $\\ell = 2$.</p>\n</div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p>L&#39;ordre ne change pas : <strong>1.</strong> bornée (souvent par récurrence), <strong>2.</strong> monotone, <strong>3.</strong> donc convergente, <strong>4.</strong> la limite vérifie l&#39;équation obtenue en remplaçant $u_n$ et $u_{n+1}$ par $\\ell$.</p>\n</aside><h2>Idée 3 · Les suites adjacentes</h2>\n<svg viewBox=\"0 0 340 150\" style=\"width:100%;max-width:440px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Une suite qui monte et une suite qui descend se resserrent autour de la même limite\">\n<line x1=\"30\" y1=\"75\" x2=\"330\" y2=\"75\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-dasharray=\"4 5\"/>\n<g fill=\"#D9824F\"><circle cx=\"55\" cy=\"18\" r=\"4.5\"/><circle cx=\"95\" cy=\"42\" r=\"4.5\"/><circle cx=\"135\" cy=\"55\" r=\"4.5\"/><circle cx=\"175\" cy=\"63\" r=\"4.5\"/><circle cx=\"215\" cy=\"68\" r=\"4.5\"/><circle cx=\"255\" cy=\"71\" r=\"4.5\"/><circle cx=\"295\" cy=\"73\" r=\"4.5\"/></g>\n<g fill=\"currentColor\"><circle cx=\"55\" cy=\"132\" r=\"4.5\"/><circle cx=\"95\" cy=\"108\" r=\"4.5\"/><circle cx=\"135\" cy=\"95\" r=\"4.5\"/><circle cx=\"175\" cy=\"87\" r=\"4.5\"/><circle cx=\"215\" cy=\"82\" r=\"4.5\"/><circle cx=\"255\" cy=\"79\" r=\"4.5\"/><circle cx=\"295\" cy=\"77\" r=\"4.5\"/></g>\n<g font-family=\"sans-serif\" font-size=\"13\" font-weight=\"700\"><text x=\"68\" y=\"20\" fill=\"#D9824F\">v descend</text><text x=\"68\" y=\"138\" fill=\"currentColor\">u monte</text><text x=\"8\" y=\"79\" fill=\"currentColor\">ℓ</text></g>\n</svg><p>$(u_n)$ et $(v_n)$ sont <strong>adjacentes</strong> si :</p>\n<ol>\n<li>$(u_n)$ est croissante ;</li>\n<li>$(v_n)$ est décroissante ;</li>\n<li>$v_n - u_n \\to 0$.</li>\n</ol>\n<p>Alors elles convergent vers la <strong>même</strong> limite $\\ell$, et $u_n \\le \\ell \\le v_n$ pour tout $n$.</p>\n<p>C&#39;est un étau : chaque paire $(u_n, v_n)$ donne un encadrement de $\\ell$, de plus en plus serré. Exemple simple : $u_n = 1 - \\tfrac1n$ et $v_n = 1 + \\tfrac1n$ encadrent 1.</p>\n<h2>Idée 4 · Les sous-suites</h2>\n<p>Une <strong>sous-suite</strong> s&#39;obtient en ne gardant que certains termes, dans l&#39;ordre : les termes pairs $(u_{2n})$, les termes impairs $(u_{2n+1})$…</p>\n<ul>\n<li>Si $u_n \\to \\ell$, alors <strong>toute</strong> sous-suite tend vers $\\ell$.</li>\n<li>Donc, si deux sous-suites ont des limites différentes, la suite <strong>diverge</strong>. C&#39;est l&#39;outil le plus rapide pour prouver une divergence.</li>\n<li>Dans l&#39;autre sens : si $(u_{2n})$ et $(u_{2n+1})$ tendent vers la même limite $\\ell$, alors $u_n \\to \\ell$.</li>\n</ul>\n<p><strong>Exemple.</strong> $u_n = (-1)^n$ : $u_{2n} = 1 \\to 1$ et $u_{2n+1} = -1 \\to -1$. Deux limites différentes, donc pas de limite. C&#39;est la preuve du chapitre précédent, en une ligne.</p>\n<p><strong>Théorème de Bolzano-Weierstrass.</strong> Toute suite bornée admet une sous-suite convergente. Pour $(-1)^n$, les termes pairs en sont une.</p>\n<h2>S&#39;exercer</h2>\n<section class=\"exo\"><h3>Trois situations types</h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Montre que $u_n = \\dfrac{n}{n+1}$ converge, sans calculer sa limite.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Croissante (idée 1), et majorée par… ?</p>\n</div><div class=\"ex-c\" hidden><p>Elle est croissante (calcul de l&#39;idée 1) et majorée par 1, car $n &lt; n + 1$. Par le théorème de la limite monotone, elle converge. (Sa limite est d&#39;ailleurs 1.)</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Montre que $u_n = (-1)^n + \\dfrac1n$ diverge.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Regarde les termes pairs et les termes impairs.</p>\n</div><div class=\"ex-c\" hidden><p>$u_{2n} = 1 + \\tfrac1{2n} \\to 1$ et $u_{2n+1} = -1 + \\tfrac1{2n+1} \\to -1$. Deux sous-suites ont des limites différentes : la suite diverge.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Les suites $u_n = 1 - \\dfrac1n$ et $v_n = 1 + \\dfrac1n$ sont-elles adjacentes ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Vérifie les trois conditions, une par une.</p>\n</div><div class=\"ex-c\" hidden><p>Oui. $(u_n)$ est croissante car $\\tfrac1n$ décroît ; $(v_n)$ est décroissante ; $v_n - u_n = \\tfrac2n \\to 0$. Leur limite commune est 1.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Une suite croissante et majorée :</div><button class=\"opt\" data-o=\"0\">converge</button><button class=\"opt\" data-o=\"1\">tend vers $+\\infty$</button><button class=\"opt\" data-o=\"2\">peut ne pas avoir de limite</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">$(u_n)$ est croissante et majorée par 5. Sa limite $\\ell$ vérifie :</div><button class=\"opt\" data-o=\"0\">$\\ell = 5$</button><button class=\"opt\" data-o=\"1\">$\\ell \\le 5$</button><button class=\"opt\" data-o=\"2\">$\\ell &gt; 5$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Une suite croissante et non majorée :</div><button class=\"opt\" data-o=\"0\">converge</button><button class=\"opt\" data-o=\"1\">tend vers $+\\infty$</button><button class=\"opt\" data-o=\"2\">est bornée</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Pour que $(u_n)$ et $(v_n)$ soient adjacentes, il faut :</div><button class=\"opt\" data-o=\"0\">qu&#39;elles soient toutes les deux croissantes</button><button class=\"opt\" data-o=\"1\">l&#39;une croissante, l&#39;autre décroissante, et $v_n - u_n \\to 0$</button><button class=\"opt\" data-o=\"2\">qu&#39;elles aient la même limite</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">On sait que $u_{2n} \\to 1$ et $u_{2n+1} \\to -1$. Alors $(u_n)$ :</div><button class=\"opt\" data-o=\"0\">converge vers 0</button><button class=\"opt\" data-o=\"1\">converge vers 1</button><button class=\"opt\" data-o=\"2\">diverge</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Si $u_n \\to \\ell$, alors la sous-suite $(u_{2n})$ :</div><button class=\"opt\" data-o=\"0\">tend vers $\\ell$</button><button class=\"opt\" data-o=\"1\">tend vers $2\\ell$</button><button class=\"opt\" data-o=\"2\">peut diverger</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Pour $u_n = \\dfrac{n}{n+1}$, $u_{n+1} - u_n$ vaut $\\dfrac{1}{(n+1)(n+2)}$. La suite est donc :</div><button class=\"opt\" data-o=\"0\">croissante</button><button class=\"opt\" data-o=\"1\">décroissante</button><button class=\"opt\" data-o=\"2\">constante</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Le théorème de Bolzano-Weierstrass affirme que toute suite bornée :</div><button class=\"opt\" data-o=\"0\">converge</button><button class=\"opt\" data-o=\"1\">admet une sous-suite convergente</button><button class=\"opt\" data-o=\"2\">est monotone</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Pour $u_0 = 0$ et $u_{n+1} = \\sqrt{u_n + 2}$, la limite est :</div><button class=\"opt\" data-o=\"0\">$-1$</button><button class=\"opt\" data-o=\"1\">$2$</button><button class=\"opt\" data-o=\"2\">$\\sqrt2$</button><div class=\"qq-e\" hidde
