s=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Le régime <strong>critique<\/strong> ($R = R_c$, $Q = \\tfrac12$), de temps caractéristique $\\tau_c = 1/\\omega_0$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 10 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Le coefficient d&#39;amortissement du RLC série est…<\/div><button class=\"opt\" data-o=\"0\">$\\dfrac{2L}{R}$<\/button><button class=\"opt\" data-o=\"1\">$\\dfrac{R}{2L}$<\/button><button class=\"opt\" data-o=\"2\">$\\dfrac{1}{RC}$<\/button><button class=\"opt\" data-o=\"3\">$\\dfrac{L}{R}$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Le facteur de qualité du RLC série est…<\/div><button class=\"opt\" data-o=\"0\">$\\dfrac{R}{L\\omega_0}$<\/button><button class=\"opt\" data-o=\"1\">$\\dfrac{L\\omega_0}{R}$<\/button><button class=\"opt\" data-o=\"2\">$R\\sqrt{LC}$<\/button><button class=\"opt\" data-o=\"3\">$\\dfrac{1}{LC}$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">La résistance critique d&#39;un RLC série est…<\/div><button class=\"opt\" data-o=\"0\">$2\\sqrt{LC}$<\/button><button class=\"opt\" data-o=\"1\">$2\\sqrt{L/C}$<\/button><button class=\"opt\" data-o=\"2\">$\\sqrt{L/C}/2$<\/button><button class=\"opt\" data-o=\"3\">$L/C$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Le régime est pseudo-périodique lorsque…<\/div><button class=\"opt\" data-o=\"0\">$Q &lt; \\tfrac12$<\/button><button class=\"opt\" data-o=\"1\">$R &gt; R_c$<\/button><button class=\"opt\" data-o=\"2\">$Q &gt; \\tfrac12$<\/button><button class=\"opt\" data-o=\"3\">$\\lambda &gt; \\omega_0$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Le régime est apériodique lorsque…<\/div><button class=\"opt\" data-o=\"0\">$R &gt; R_c$<\/button><button class=\"opt\" data-o=\"1\">$R &lt; R_c$<\/button><button class=\"opt\" data-o=\"2\">$R = 0$<\/button><button class=\"opt\" data-o=\"3\">$Q &gt; 1$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Pour $R = R_c$, la solution avec $u(0) = E$ et $i(0) = 0$ est…<\/div><button class=\"opt\" data-o=\"0\">$E\\,e^{-\\omega_0 t}\\cos\\omega_0 t$<\/button><button class=\"opt\" data-o=\"1\">$E\\,(1 + \\omega_0 t)\\,e^{-\\omega_0 t}$<\/button><button class=\"opt\" data-o=\"2\">$E\\,(1 - e^{-\\omega_0 t})$<\/button><button class=\"opt\" data-o=\"3\">$E\\cos\\omega_0 t$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Comment se compare la pseudo-pulsation $\\Omega$ à $\\omega_0$ ?<\/div><button class=\"opt\" data-o=\"0\">$\\Omega &gt; \\omega_0$<\/button><button class=\"opt\" data-o=\"1\">$\\Omega &lt; \\omega_0$<\/button><button class=\"opt\" data-o=\"2\">$\\Omega = \\omega_0$<\/button><button class=\"opt\" data-o=\"3\">elles n&#39;ont aucun lien<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Pour $R = 10\\ \\Omega$, $L = 10\\ \\text{mH}$, $C = 50\\ \\mu\\text{F}$, le régime est…<\/div><button class=\"opt\" data-o=\"0\">apériodique<\/button><button class=\"opt\" data-o=\"1\">critique<\/button><button class=\"opt\" data-o=\"2\">pseudo-périodique<\/button><button class=\"opt\" data-o=\"3\">sinusoïdal non amorti<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Pour ce même circuit, $Q$ vaut environ…<\/div><button class=\"opt\" data-o=\"0\">$0{,}5$<\/button><button class=\"opt\" data-o=\"1\">$1{,}41$<\/button><button class=\"opt\" data-o=\"2\">$5$<\/button><button class=\"opt\" data-o=\"3\">$28{,}3$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Dans la réponse à un échelon $E$, la tension $u$ du condensateur tend vers…<\/div><button class=\"opt\" data-o=\"0\">$0$<\/button><button class=\"opt\" data-o=\"1\">$E$<\/button><button class=\"opt\" data-o=\"2\">$E/2$<\/button><button class=\"opt\" data-o=\"3\">$2E$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"10\"><div class=\"qq-q\">Dans la réponse à un échelon, quelle énergie est dissipée dans la résistance au total ?<\/div><button class=\"opt\" data-o=\"0\">$C E^2$<\/button><button class=\"opt\" data-o=\"1\">$\\tfrac12 C E^2$<\/button><button class=\"opt\" data-o=\"2\">$0$<\/button><button class=\"opt\" data-o=\"3\">$\\tfrac12 L E^2$<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"circuit-rlc","rep":["constante"],"tol":null},{"n":"circuit-rlc","rep":null,"tol":null},{"n":"circuit-rlc","rep":["1414"],"tol":1},{"n":"circuit-rlc","rep":["500"],"tol":null},{"n":"circuit-rlc","rep":["1.41"],"tol":0.01},{"n":"circuit-rlc","rep":["28.3"],"tol":0.1},{"n":"circuit-rlc","rep":null,"tol":null},{"n":"circuit-rlc","rep":null,"tol":null},{"n":"circuit-rlc","rep":["200"],"tol":null},{"n":"circuit-rlc","rep":null,"tol":null},{"n":"circuit-rlc","rep":null,"tol":null}],"qcm":[{"n":"circuit-rlc","q":"Le coefficient d&#39;amortissement du RLC série est…","o":["$\\dfrac{2L}{R}$","$\\dfrac{R}{2L}$","$\\dfrac{1}{RC}$","$\\dfrac{L}{R}$"],"a":1,"e":"$\\lambda = R/(2L)$, en s⁻¹."},{"n":"circuit-rlc","q":"Le facteur de qualité du RLC série est…","o":["$\\dfrac{R}{L\\omega_0}$","$\\dfrac{L\\omega_0}{R}$","$R\\sqrt{LC}$","$\\dfrac{1}{LC}$"],"a":1,"e":"$Q = L\\omega_0/R = \\omega_0/(2\\lambda)$."},{"n":"circuit-rlc","q":"La résistance critique d&#39;un RLC série est…","o":["$2\\sqrt{LC}$","$2\\sqrt{L/C}$","$\\sqrt{L/C}/2$","$L/C$"],"a":1,"e":"$R_c = 2\\sqrt{L/C}$ : elle annule $\\Delta'$."},{"n":"circuit-rlc","q":"Le régime est pseudo-périodique lorsque…","o":["$Q &lt; \\tfrac12$","$R &gt; R_c$","$Q &gt; \\tfrac12$","$\\lambda &gt; \\omega_0$"],"a":2,"e":"$Q &gt; \\tfrac12$, c&#39;est-à-dire $R &lt; R_c$ ou $\\lambda &lt; \\omega_0$."},{"n":"circuit-rlc","q":"Le régime est apériodique lorsque…","o":["$R &gt; R_c$","$R &lt; R_c$","$R = 0$","$Q &gt; 1$"],"a":0,"e":"$R &gt; R_c$ équivaut à $\\lambda &gt; \\omega_0$ et $Q &lt; \\tfrac12$."},{"n":"circuit-rlc","q":"Pour $R = R_c$, la solution avec $u(0) = E$ et $i(0) = 0$ est…","o":["$E\\,e^{-\\omega_0 t}\\cos\\omega_0 t$","$E\\,(1 + \\omega_0 t)\\,e^{-\\omega_0 t}$","$E\\,(1 - e^{-\\omega_0 t})$","$E\\cos\\omega_0 t$"],"a":1,"e":"Régime critique : $(a + b\\,t)\\,e^{-\\omega_0 t}$ avec $a = E$ et $b = \\omega_0 E$."},{"n":"circuit-rlc","q":"Comment se compare la pseudo-pulsation $\\Omega$ à $\\omega_0$ ?","o":["$\\Omega &gt; \\omega_0$","$\\Omega &lt; \\omega_0$","$\\Omega = \\omega_0$","elles n&#39;ont aucun lien"],"a":1,"e":"$\\Omega = \\sqrt{\\omega_0^2 - \\lambda^2} &lt; \\omega_0$, donc $T &gt; T_0$."},{"n":"circuit-rlc","q":"Pour $R = 10\\ \\Omega$, $L = 10\\ \\text{mH}$, $C = 50\\ \\mu\\text{F}$, le régime est…","o":["apériodique","critique","pseudo-périodique","sinusoïdal non amorti"],"a":2,"e":"$R_c \\approx 28{,}3\\ \\Omega &gt; R = 10\\ \\Omega$ : pseudo-périodique ($Q \\approx 1{,}41$)."},{"n":"circuit-rlc","q":"Pour ce même circuit, $Q$ vaut environ…","o":["$0{,}5$","$1{,}41$","$5$","$28{,}3$"],"a":1,"e":"$Q = L\\omega_0/R = 0{,}01 \\times 1414 / 10 \\approx 1{,}41$."},{"n":"circuit-rlc","q":"Dans la réponse à un échelon $E$, la tension $u$ du condensateur tend vers…","o":["$0$","$E$","$E/2$","$2E$"],"a":1,"e":"Régime établi : $u_p = E$, indépendant des conditions initiales."},{"n":"circuit-rlc","q":"Dans la réponse à un échelon, quelle énergie est dissipée dans la résistance au total ?","o":["$C E^2$","$\\tfrac12 C E^2$","$0$","$\\tfrac12 L E^2$"],"a":1,"e":"$E \\cdot CE = \\tfrac12 C E^2 + W_J$ donc $W_J = \\tfrac12 C E^2$."}]},{"id":"revision","t":"Fiche de révision et examen blanc","seance":"Chapitre 3 · synthèse 3.8 et exercices 3.9","imp":5,"html":"<h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Une grille en trois questions.<\/strong> Devant un circuit : (1) qu&#39;est-ce qui stocke de l&#39;énergie, donc quelles grandeurs sont continues ? (2) premier ou second ordre ? (3) quelles sont la valeur initiale, la valeur finale et la constante de temps (ou $Q$) ? Avec ça, tu écris la réponse sans recalculer l&#39;équation.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Mélanger les formes. Charge : $E\\,(1 - e^{-t/\\tau})$. Décharge : $E\\,e^{-t/\\tau}$. Fais toujours le test : à $t = 0$ la valeur est-elle bien la valeur initiale, et à l&#39;infini la valeur finale ?<\/p>\n<\/aside><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le format du contrôle (durée, barème, documents autorisés) n&#39;est pas connu : l&#39;examen blanc ci-dessous mélange le type de questions du cours et des exercices du prof. Demande à ton professeur comment il note.<\/p>\n<\/aside><h2>Fiche de synthèse<\/h2>\n<table>\n<thead>\n<tr>\n<th>Circuit<\/th>\n<th>Équation<\/th>\n<th>Paramètres<\/th>\n<th>Réponse à un échelon<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>RC<\/td>\n<td>$\\tau\\,\\dot u + u = E$<\/td>\n<td>$\\tau = RC$<\/td>\n<td>$u = E\\,(1 - e^{-t/\\tau})$<\/td>\n<\/tr>\n<tr>\n<td>RL<\/td>\n<td>$\\tau\\,\\dot i + i = E/R$<\/td>\n<td>$\\tau = L/R$<\/td>\n<td>$i = \\dfrac{E}{R}\\,(1 - e^{-t/\\tau})$<\/td>\n<\/tr>\n<tr>\n<td>LC<\/td>\n<td>$\\ddot u + \\omega_0^2\\,u = \\omega_0^2 E$<\/td>\n<td>$\\omega_0 = 1/\\sqrt{LC}$<\/td>\n<td>oscillations non amorties<\/td>\n<\/tr>\n<tr>\n<td>RLC série<\/td>\n<td>$\\ddot u + \\dfrac{\\omega_0}{Q}\\dot u + \\omega_0^2\\,u = \\omega_0^2 E$<\/td>\n<td>$\\omega_0$, $Q = \\dfrac1R\\sqrt{\\dfrac LC}$<\/td>\n<td>selon $Q$ : 3 régimes<\/td>\n<\/tr>\n<\/tbody><\/table>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p><strong>À retenir du chapitre<\/strong><\/p>\n<ul>\n<li>$u_C$ et $i_L$ sont continus ; $i_C$ et $u_L$ peuvent être discontinus.<\/li>\n<li>En régime permanent continu : condensateur = interrupteur ouvert ; bobine = fil.<\/li>\n<li>Premier ordre : $\\tau$ se lit avec la tangente à l&#39;origine ; 63 % de l&#39;évolution à $t = \\tau$, 99 % à $5\\tau$.<\/li>\n<li>Charge d&#39;un condensateur : 50 % de l&#39;énergie est dissipée, quelle que soit $R$.<\/li>\n<li>RLC : $\\lambda = R/2L$, $\\omega_0 = 1/\\sqrt{LC}$, $Q = L\\omega_0/R$, $R_c = 2\\sqrt{L/C}$ ; pseudo-périodique si $Q &gt; \\tfrac12$.<\/li>\n<\/ul>\n<\/aside><h2>Examen blanc<\/h2>\n<section class=\"exo\"><h3>Examen blanc · Partie 1 : cours<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Pourquoi $u_C$ et $i_L$ sont-ils continus ? Donne un exemple de grandeur qui peut sauter.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>L&#39;énergie stockée ($\\tfrac12 C u_C^2$ et $\\tfrac12 L i_L^2$) ne peut pas varier instantanément, sinon la puissance $dW/dt$ serait infinie. $i_C$ et $u_L$ peuvent sauter : dans un circuit RC à l&#39;échelon, $i$ passe de $0$ à $E/R$ en $t = 0$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Établis l&#39;équation différentielle de la charge d&#39;un condensateur dans un circuit RC série et résous-la.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Loi des mailles $E = R\\,i + u$ avec $i = C\\,u'$ : $\\tau\\,u' + u = E$, $\\tau = RC$. Solution homogène $B\\,e^{-t/\\tau}$, particulière $E$, donc $u = B\\,e^{-t/\\tau} + E$. Avec $u(0) = 0$ : $B = -E$ et $u(t) = E\\,(1 - e^{-t/\\tau})$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Fais le bilan énergétique de la charge d&#39;un condensateur à travers une résistance.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Fournie $E\\,Q = C E^2$ ; stockée $\\tfrac12 C E^2$ ; dissipée dans $R$ : $\\tfrac12 C E^2$. Rendement 50 %, quelle que soit $R$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Examen blanc · Partie 2 : problème (RC puis RL)<\/h3><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Un condensateur $C = 47\\ \\mu\\text{F}$, déchargé, est chargé sous $E = 5\\ \\text{V}$ à travers $R = 2{,}2\\ \\text{k}\\Omega$. Calcule $\\tau$, en ms (arrondis à l&#39;unité).<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>$\\tau = RC$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 103<\/b><\/p><p>$\\tau = 2200 \\times 47\\times10^{-6} \\approx 0{,}103\\ \\text{s} = 103\\ \\text{ms}$.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Quelle est la tension aux bornes du condensateur à $t = \\tau$, en V (deux décimales) ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>$u(\\tau) = E\\,(1 - e^{-1})$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 3.16<\/b><\/p><p>$u(\\tau) = 5 \\times 0{,}632 \\approx 3{,}16\\ \\text{V}$.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>Au bout de combien de temps la charge est-elle pratiquement terminée, en ms ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 515<\/b><\/p><p>$5\\tau \\approx 5 \\times 103 \\approx 515\\ \\text{ms}$ (à 99 %).<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><p>Une bobine idéale $L = 20\\ \\text{mH}$ est en série avec $R = 40\\ \\Omega$ sous $E = 8\\ \\text{V}$. Calcule $\\tau$ en ms et le courant final en mA.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>$\\tau = L/R$ et $I = E/R$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>$\\tau = \\dfrac{L}{R} = \\dfrac{0{,}020}{40} = 0{,}5\\ \\text{ms}$ et $I = \\dfrac{E}{R} = \\dfrac{8}{40} = 0{,}2\\ \\text{A} = 200\\ \\text{mA}$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Examen blanc · Partie 3 : RLC<\/h3><div class=\"ex\" data-x=\"7\"><div class=\"ex-q\"><p>Un circuit RLC série a $L = 0{,}1\\ \\text{H}$, $C = 10\\ \\mu\\text{F}$, $R = 20\\ \\Omega$. Calcule $\\omega_0$ en rad/s.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>$LC = 10^{-6}$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1000<\/b><\/p><p>$\\omega_0 = 1/\\sqrt{0{,}1 \\times 10^{-5}} = 1000\\ \\text{rad/s}$ (vérifié).<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"8\"><div class=\"ex-q\"><p>Calcule $\\lambda$ en s⁻¹, puis $Q$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>$\\lambda = R/2L$ et $Q = \\omega_0/(2\\lambda)$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>$\\lambda = \\dfrac{20}{2 \\times 0{,}1} = 100\\ \\text{s}^{-1}$ et $Q = \\dfrac{\\omega_0}{2\\lambda} = \\dfrac{1000}{200} = 5$ (même résultat avec $L\\omega_0/R = 0{,}1 \\times 1000/20 = 5$).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"9\"><div class=\"ex-q\"><p>Quel est le régime ? Donne $R_c$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$R_c = 2\\sqrt{L/C} = 2\\sqrt{10^4} = 200\\ \\Omega$. $R = 20\\ \\Omega &lt; R_c$ ($Q = 5 &gt; \\tfrac12$) : régime <strong>pseudo-périodique<\/strong>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"10\"><div class=\"ex-q\"><p>Calcule la pseudo-pulsation $\\Omega$ en rad/s (entier).<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>$\\Omega = \\omega_0\\sqrt{1 - 1/(4Q^2)}$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 995<\/b><\/p><p>$\\Omega = \\sqrt{1000^2 - 100^2} = \\sqrt{990000} \\approx 995\\ \\text{rad/s}$ (légèrement inférieure à $\\omega_0$).<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 7 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quelle forme décrit la <strong>charge<\/strong> d&#39;un condensateur sous $E$ ?<\/div><button class=\"opt\" data-o=\"0\">$E\\,e^{-t/\\tau}$<\/button><button class=\"opt\" data-o=\"1\">$E\\,(1 - e^{-t/\\tau})$<\/button><button class=\"opt\" data-o=\"2\">$E\\,\\cos\\omega_0 t$<\/button><button class=\"opt\" data-o=\"3\">$E\\,(1 + t/\\tau)$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Quelle forme décrit la <strong>décharge<\/strong> d&#39;un condensateur chargé sous $E$ ?<\/div><button class=\"opt\" data-o=\"0\">$E\\,e^{-t/\\tau}$<\/button><button class=\"opt\" data-o=\"1\">$E\\,(1 - e^{-t/\\tau})$<\/button><button class=\"opt\" data-o=\"2\">$-E\\,e^{-t/\\tau}$ à $t = 0$<\/button><button class=\"opt\" data-o=\"3\">$E\\,\\sin\\omega_0 t$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">La constante de temps d&#39;un circuit RL est…<\/div><button class=\"opt\" data-o=\"0\">$RL$<\/button><button class=\"opt\" data-o=\"1\">$L/R$<\/button><button class=\"opt\" data-o=\"2\">$R/L$<\/button><button class=\"opt\" data-o=\"3\">$\\sqrt{LC}$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Pour $R = 2{,}2\\ \\text{k}\\Omega$ et $C = 47\\ \\mu\\text{F}$, $\\tau$ vaut environ…<\/div><button class=\"opt\" data-o=\"0\">$10\\ \\text{ms}$<\/button><button class=\"opt\" data-o=\"1\">$103\\ \\text{ms}$<\/button><button class=\"opt\" data-o=\"2\">$1\\ \\text{s}$<\/button><button class=\"opt\" data-o=\"3\">$4{,}7\\ \\text{ms}$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">En régime permanent continu, une bobine idéale est équivalente à…<\/div><button class=\"opt\" data-o=\"0\">un fil<\/button><button class=\"opt\" data-o=\"1\">un interrupteur ouvert<\/button><button class=\"opt\" data-o=\"2\">une source de courant<\/button><button class=\"opt\" data-o=\"3\">un condensateur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Quelle est la différence essentielle entre l&#39;énergie dissipée à la charge d&#39;un RC et à l&#39;établissement d&#39;un RL ?<\/div><button class=\"opt\" data-o=\"0\">aucune<\/button><button class=\"opt\" data-o=\"1\">RC : 50 % dissipés à la charge, quelle que soit $R$ ; RL : après le stockage, tout ce que le générateur fournit est dissipé dans $R$<\/button><button class=\"opt\" data-o=\"2\">RC ne dissipe rien<\/button><button class=\"opt\" data-o=\"3\">RL dissipe 50 %<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">La pulsation propre du circuit LC est…<\/div><button class=\"opt\" data-o=\"0\">$\\sqrt{LC}$<\/button><button class=\"opt\" data-o=\"1\">$1/\\sqrt{LC}$<\/button><button class=\"opt\" data-o=\"2\">$LC$<\/button><button class=\"opt\" data-o=\"3\">$R/L$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Si $R &gt; R_c$ dans un RLC série, le régime est…<\/div><button class=\"opt\" data-o=\"0\">apériodique<\/button><button class=\"opt\" data-o=\"1\">critique<\/button><button class=\"opt\" data-o=\"2\">pseudo-périodique<\/button><button class=\"opt\" data-o=\"3\">non amorti<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Quelle est la résistance critique pour $L = 10\\ \\text{mH}$ et $C = 1\\ \\mu\\text{F}$ ?<\/div><button class=\"opt\" data-o=\"0\">$20\\ \\Omega$<\/button><button class=\"opt\" data-o=\"1\">$100\\ \\Omega$<\/button><button class=\"opt\" data-o=\"2\">$200\\ \\Omega$<\/button><button class=\"opt\" data-o=\"3\">$2\\ \\text{k}\\Omega$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Pour $L = 0{,}1\\ \\text{H}$, $C = 10\\ \\mu\\text{F}$ et $R = 20\\ \\Omega$, $Q$ vaut…<\/div><button class=\"opt\" data-o=\"0\">$0{,}2$<\/button><button class=\"opt\" data-o=\"1\">$2$<\/button><button class=\"opt\" data-o=\"2\">$5$<\/button><button class=\"opt\" data-o=\"3\">$50$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"10\"><div class=\"qq-q\">Dans la réponse à un échelon, la tension finale du condensateur d&#39;un RLC série est…<\/div><button class=\"opt\" data-o=\"0\">$0$<\/button><button class=\"opt\" data-o=\"1\">$E$<\/button><button class=\"opt\" data-o=\"2\">$2E$<\/button><button class=\"opt\" data-o=\"3\">$E/Q$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"11\"><div class=\"qq-q\">Lequel de ces couples est continu à une commutation ?<\/div><button class=\"opt\" data-o=\"0\">$i_C$ et $u_L$<\/button><button class=\"opt\" data-o=\"1\">$u_C$ et $i_L$<\/button><button class=\"opt\" data-o=\"2\">$u_R$ et $i_C$<\/button><button class=\"opt\" data-o=\"3\">$u_L$ et $i_L$<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"revision","rep":null,"tol":null},{"n":"revision","rep":null,"tol":null},{"n":"revision","rep":null,"tol":null},{"n":"revision","rep":["103"],"tol":1},{"n":"revision","rep":["3.16"],"tol":0.01},{"n":"revision","rep":["515"],"tol":5},{"n":"revision","rep":null,"tol":null},{"n":"revision","rep":["1000"],"tol":null},{"n":"revision","rep":null,"tol":null},{"n":"revision","rep":null,"tol":null},{"n":"revision","rep":["995"],"tol":1}],"qcm":[{"n":"revision","q":"Quelle forme décrit la <strong>charge<\/strong> d&#39;un condensateur sous $E$ ?","o":["$E\\,e^{-t/\\tau}$","$E\\,(1 - e^{-t/\\tau})$","$E\\,\\cos\\omega_0 t$","$E\\,(1 + t/\\tau)$"],"a":1,"e":"Elle part de $0$ et tend vers $E$."},{"n":"revision","q":"Quelle forme décrit la <strong>décharge<\/strong> d&#39;un condensateur chargé sous $E$ ?","o":["$E\\,e^{-t/\\tau}$","$E\\,(1 - e^{-t/\\tau})$","$-E\\,e^{-t/\\tau}$ à $t = 0$","$E\\,\\sin\\omega_0 t$"],"a":0,"e":"Elle part de $E$ et tend vers $0$."},{"n":"revision","q":"La constante de temps d&#39;un circuit RL est…","o":["$RL$","$L/R$","$R/L$","$\\sqrt{LC}$"],"a":1,"e":"$\\tau = L/R$."},{"n":"revision","q":"Pour $R = 2{,}2\\ \\text{k}\\Omega$ et $C = 47\\ \\mu\\text{F}$, $\\tau$ vaut environ…","o":["$10\\ \\text{ms}$","$103\\ \\text{ms}$","$1\\ \\text{s}$","$4{,}7\\ \\text{ms}$"],"a":1,"e":"$2200 \\times 47\\times10^{-6} \\approx 0{,}103\\ \\text{s}$."},{"n":"revision","q":"En régime permanent continu, une bobine idéale est équivalente à…","o":["un fil","un interrupteur ouvert","une source de courant","un condensateur"],"a":0,"e":"$u = L\\,di/dt = 0$."},{"n":"revision","q":"Quelle est la différence essentielle entre l&#39;énergie dissipée à la charge d&#39;un RC et à l&#39;établissement d&#39;un RL ?","o":["aucune","RC : 50 % dissipés à la charge, quelle que soit $R$ ; RL : après le stockage, tout ce que le générateur fournit est dissipé dans $R$","RC ne dissipe rien","RL dissipe 50 %"],"a":1,"e":"C&#39;est le point du bilan énergétique du cours : pas de partage « moitié-moitié » pour la bobine."},{"n":"revision","q":"La pulsation propre du circuit LC est…","o":["$\\sqrt{LC}$","$1/\\sqrt{LC}$","$LC$","$R/L$"],"a":1,"e":"$\\omega_0 = 1/\\sqrt{LC}$."},{"n":"revision","q":"Si $R &gt; R_c$ dans un RLC série, le régime est…","o":["apériodique","critique","pseudo-périodique","non amorti"],"a":0,"e":"$R &gt; R_c$ équivaut à $Q &lt; \\tfrac12$."},{"n":"revision","q":"Quelle est la résistance critique pour $L = 10\\ \\text{mH}$ et $C = 1\\ \\mu\\text{F}$ ?","o":["$20\\ \\Omega$","$100\\ \\Omega$","$200\\ \\Omega$","$2\\ \\text{k}\\Omega$"],"a":2,"e":"$2\\sqrt{L/C} = 2\\sqrt{10^4} = 200\\ \\Omega$."},{"n":"revision","q":"Pour $L = 0{,}1\\ \\text{H}$, $C = 10\\ \\mu\\text{F}$ et $R = 20\\ \\Omega$, $Q$ vaut…","o":["$0{,}2$","$2$","$5$","$50$"],"a":2,"e":"$Q = L\\omega_0/R = 0{,}1 \\times 1000 / 20 = 5$."},{"n":"revision","q":"Dans la réponse à un échelon, la tension finale du condensateur d&#39;un RLC série est…","o":["$0$","$E$","$2E$","$E/Q$"],"a":1,"e":"Le régime établi vaut $E$, indépendamment des conditions initiales."},{"n":"revision","q":"Lequel de ces couples est continu à une commutation ?","o":["$i_C$ et $u_L$","$u_C$ et $i_L$","$u_R$ et $i_C$","$u_L$ et $i_L$"],"a":1,"e":"$u_C$ et $i_L$ sont continus ; $i_C$ et $u_L$ peuvent sauter."}]}];
const NOTIONS=[{"id":"regime-transitoire","t":"Régime transitoire, continuité et échelon","imp":4,"ch":"regime-transitoire"},{"id":"condensateur-bobine","t":"Le condensateur et la bobine","imp":5,"ch":"condensateur-bobine"},{"id":"circuit-rc","t":"Le circuit RC : charge et décharge","imp":5,"ch":"circuit-rc"},{"id":"circuit-rl","t":"Le circuit RL : établissement et rupture du courant","imp":5,"ch":"circuit-rl"},{"id":"circuit-lc","t":"Second ordre et circuit LC : oscillations libres","imp":4,"ch":"circuit-lc"},{"id":"circuit-rlc","t":"Le circuit RLC série : les trois régimes","imp":5,"ch":"circuit-rlc"},{"id":"revision","t":"Fiche de révision et examen blanc","imp":5,"ch":"revision"}];
const CARTES=[{"n":"regime-transitoire","k":0,"ch":"regime-transitoire","q":"<p>Définition du régime transitoire ?<\/p>\n","r":"<p>Phase d&#39;évolution pendant laquelle un circuit passe de son état initial à son régime permanent, après la fermeture ou l&#39;ouverture d&#39;un interrupteur.<\/p>\n"},{"n":"regime-transitoire","k":1,"ch":"regime-transitoire","q":"<p>Quelle tension est continue aux bornes d&#39;un condensateur ?<\/p>\n","r":"<p>La tension $u_C$ : l&#39;énergie $\\tfrac12 C u_C^2$ ne peut pas varier instantanément.<\/p>\n"},{"n":"regime-transitoire","k":2,"ch":"regime-transitoire","q":"<p>Quelle grandeur est continue dans une bobine ?<\/p>\n","r":"<p>Le courant $i_L$ : l&#39;énergie $\\tfrac12 L i_L^2$ ne peut pas varier instantanément.<\/p>\n"},{"n":"regime-transitoire","k":3,"ch":"regime-transitoire","q":"<p>Quelles grandeurs peuvent sauter ?<\/p>\n","r":"<p>Le courant $i_C$ dans un condensateur et la tension $u_L$ aux bornes d&#39;une bobine.<\/p>\n"},{"n":"regime-transitoire","k":4,"ch":"regime-transitoire","q":"<p>Pourquoi une énergie ne varie-t-elle pas instantanément ?<\/p>\n","r":"<p>Sinon la puissance $p = dW/dt$ serait infinie, ce qu&#39;aucun générateur ne peut fournir.<\/p>\n"},{"n":"regime-transitoire","k":5,"ch":"regime-transitoire","q":"<p>Qu&#39;est-ce qu&#39;un échelon de tension ?<\/p>\n","r":"<p>Un changement brusque de la tension, d&#39;une valeur constante $E_1$ à une autre $E_2$, en un temps considéré comme nul (souvent $E_1 = 0$).<\/p>\n"},{"n":"regime-transitoire","k":6,"ch":"regime-transitoire","q":"<p>Comment produit-on un échelon ?<\/p>\n","r":"<p>Avec un interrupteur (fermeture $0 \\to E$, ouverture $E \\to 0$) ou avec un GBF en mode créneau.<\/p>\n"},{"n":"regime-transitoire","k":7,"ch":"regime-transitoire","q":"<p>À partir de quand un transitoire est-il pratiquement terminé ?<\/p>\n","r":"<p>Au bout d&#39;environ $5\\tau$ : l&#39;évolution est faite à 99 % (pour une exponentielle).<\/p>\n"},{"n":"condensateur-bobine","k":8,"ch":"condensateur-bobine","q":"<p>Relation courant-tension d&#39;un condensateur ?<\/p>\n","r":"<p>$i = C\\,\\dfrac{du}{dt}$ (et $q = C\\,u$).<\/p>\n"},{"n":"condensateur-bobine","k":9,"ch":"condensateur-bobine","q":"<p>Relation tension-courant d&#39;une bobine idéale ?<\/p>\n","r":"<p>$u = L\\,\\dfrac{di}{dt}$ ; pour une bobine réelle, $u = L\\,\\dfrac{di}{dt} + r\\,i$.<\/p>\n"},{"n":"condensateur-bobine","k":10,"ch":"condensateur-bobine","q":"<p>Condensateur en régime permanent continu ?<\/p>\n","r":"<p>Interrupteur ouvert : $u$ constante donc $i = C\\,du/dt = 0$.<\/p>\n"},{"n":"condensateur-bobine","k":11,"ch":"condensateur-bobine","q":"<p>Bobine en régime permanent continu ?<\/p>\n","r":"<p>Idéale : un fil ($u = 0$). Réelle : un conducteur ohmique de résistance $r$.<\/p>\n"},{"n":"condensateur-bobine","k":12,"ch":"condensateur-bobine","q":"<p>Énergie d&#39;un condensateur, d&#39;une bobine ?<\/p>\n","r":"<p>$W_C = \\tfrac12 C u^2 = \\dfrac{q^2}{2C}$ et $W_L = \\tfrac12 L i^2$.<\/p>\n"},{"n":"condensateur-bobine","k":13,"ch":"condensateur-bobine","q":"<p>Condensateurs en série et en parallèle ?<\/p>\n","r":"<p>Série : $\\dfrac1{C_{eq}} = \\sum \\dfrac1{C_k}$, même charge. Parallèle : $C_{eq} = \\sum C_k$, même tension.<\/p>\n"},{"n":"condensateur-bobine","k":14,"ch":"condensateur-bobine","q":"<p>Bobines (sans couplage) en série et en parallèle ?<\/p>\n","r":"<p>Série : $L_{eq} = L_1 + L_2$. Parallèle : $\\dfrac1{L_{eq}} = \\dfrac1{L_1} + \\dfrac1{L_2}$.<\/p>\n"},{"n":"condensateur-bobine","k":15,"ch":"condensateur-bobine","q":"<p>Que dit la loi de Lenz ?<\/p>\n","r":"<p>La f.é.m. d&#39;auto-induction $e = -L\\,di/dt$ s&#39;oppose à la variation du courant qui lui donne naissance.<\/p>\n"},{"n":"condensateur-bobine","k":16,"ch":"condensateur-bobine","q":"<p>Quand un condensateur est-il récepteur ?<\/p>\n","r":"<p>Quand son énergie augmente ($p = u\\,i &gt; 0$) : il se charge. Il est générateur quand elle diminue.<\/p>\n"},{"n":"circuit-rc","k":17,"ch":"circuit-rc","q":"<p>Équation du circuit RC (charge) ?<\/p>\n","r":"<p>$\\tau\\,\\dfrac{du}{dt} + u = E$ avec $\\tau = RC$ : équation différentielle linéaire du premier ordre.<\/p>\n"},{"n":"circuit-rc","k":18,"ch":"circuit-rc","q":"<p>Charge d&#39;un condensateur : $u(t)$ et $i(t)$ ?<\/p>\n","r":"<p>$u = E\\,(1 - e^{-t/\\tau})$ et $i = \\dfrac{E}{R}\\,e^{-t/\\tau}$.<\/p>\n"},{"n":"circuit-rc","k":19,"ch":"circuit-rc","q":"<p>Décharge d&#39;un condensateur : $v(t)$ ?<\/p>\n","r":"<p>$v = E\\,e^{-t/\\tau}$ avec $\\tau = RC$.<\/p>\n"},{"n":"circuit-rc","k":20,"ch":"circuit-rc","q":"<p>Comment lire $\\tau$ sur la courbe de charge ?<\/p>\n","r":"<p>La tangente à l&#39;origine coupe l&#39;asymptote $u = E$ en $t = \\tau$ ; ou $u(\\tau) \\approx 0{,}63\\,E$.<\/p>\n"},{"n":"circuit-rc","k":21,"ch":"circuit-rc","q":"<p>Valeurs de $u/E$ à $\\tau, 2\\tau, 3\\tau, 4\\tau, 5\\tau$ ?<\/p>\n","r":"<p>0,632 ; 0,865 ; 0,950 ; 0,982 ; 0,993.<\/p>\n"},{"n":"circuit-rc","k":22,"ch":"circuit-rc","q":"<p>Que vaut $i(0^+)$ à la charge, et pourquoi ?<\/p>\n","r":"<p>$E/R$ : $u_C$ est continue et vaut 0, donc toute la tension est aux bornes de $R$.<\/p>\n"},{"n":"circuit-rc","k":23,"ch":"circuit-rc","q":"<p>Bilan énergétique de la charge ?<\/p>\n","r":"<p>Fournie $C E^2$ ; stockée $\\tfrac12 C E^2$ ; dissipée $\\tfrac12 C E^2$ : 50 % de perte, quelle que soit $R$.<\/p>\n"},{"n":"circuit-rc","k":24,"ch":"circuit-rc","q":"<p>Combien de temps pour charger à 99 % ?<\/p>\n","r":"<p>Environ $5\\tau$.<\/p>\n"},{"n":"circuit-rc","k":25,"ch":"circuit-rc","q":"<p>Homogénéité de $RC$ ?<\/p>\n","r":"<p>$\\Omega \\cdot \\text{F} = \\text{s}$ : $RC$ est bien un temps.<\/p>\n"},{"n":"circuit-rl","k":26,"ch":"circuit-rl","q":"<p>Constante de temps d&#39;un circuit RL ?<\/p>\n","r":"<p>$\\tau = L/R$ (homogénéité : $\\text{H}/\\Omega = \\text{s}$).<\/p>\n"},{"n":"circuit-rl","k":27,"ch":"circuit-rl","q":"<p>Établissement du courant dans RL : $i(t)$ et $u(t)$ ?<\/p>\n","r":"<p>$i = \\dfrac{E}{R}\\,(1 - e^{-t/\\tau})$ et $u = L\\,di/dt = E\\,e^{-t/\\tau}$.<\/p>\n"},{"n":"circuit-rl","k":28,"ch":"circuit-rl","q":"<p>Rupture du courant dans RL ?<\/p>\n","r":"<p>$i = \\dfrac{E}{R}\\,e^{-t/\\tau}$ et $u = -E\\,e^{-t/\\tau}$ : la bobine se comporte comme un générateur.<\/p>\n"},{"n":"circuit-rl","k":29,"ch":"circuit-rl","q":"<p>Que valent $u$ et $i$ à $0^+$ à l&#39;établissement ?<\/p>\n","r":"<p>$u = E$ et $i = 0$ : la bobine se comporte comme un interrupteur ouvert.<\/p>\n"},{"n":"circuit-rl","k":30,"ch":"circuit-rl","q":"<p>Que valent $u$ et $i$ en régime permanent (RL) ?<\/p>\n","r":"<p>$u = 0$ et $i = E/R$ : la bobine se comporte comme un fil.<\/p>\n"},{"n":"circuit-rl","k":31,"ch":"circuit-rl","q":"<p>Qu&#39;est-ce qui est continu en $t = 0$ dans RL ?<\/p>\n","r":"<p>Le courant $i$. La tension $u_L$ saute de $0$ à $E$.<\/p>\n"},{"n":"circuit-rl","k":32,"ch":"circuit-rl","q":"<p>Pourquoi une diode de roue libre ?<\/p>\n","r":"<p>Pour éviter la surtension $L\\,di/dt$ (étincelle) à l&#39;ouverture d&#39;un circuit inductif.<\/p>\n"},{"n":"circuit-rl","k":33,"ch":"circuit-rl","q":"<p>Bilan d&#39;énergie RL à l&#39;établissement ?<\/p>\n","r":"<p>La bobine stocke $\\tfrac12 L (E/R)^2$ ; le générateur fournit ensuite $E^2/R$, dissipée dans $R$ : pas de partage 50/50.<\/p>\n"},{"n":"circuit-lc","k":34,"ch":"circuit-lc","q":"<p>Équation du circuit LC ?<\/p>\n","r":"<p>$LC\\,\\dfrac{d^2 u_C}{dt^2} + u_C = 0$, soit $u_C'' + \\omega_0^2 u_C = 0$.<\/p>\n"},{"n":"circuit-lc","k":35,"ch":"circuit-lc","q":"<p>Pulsation propre et période propre du circuit LC ?<\/p>\n","r":"<p>$\\omega_0 = \\dfrac{1}{\\sqrt{LC}}$ et $T_0 = \\dfrac{2\\pi}{\\omega_0} = 2\\pi\\sqrt{LC}$.<\/p>\n"},{"n":"circuit-lc","k":36,"ch":"circuit-lc","q":"<p>Solution du circuit LC avec $u_C(0) = E$, $i(0) = 0$ ?<\/p>\n","r":"<p>$u_C = E\\cos\\omega_0 t$ et $i = -E\\sqrt{C/L}\\,\\sin\\omega_0 t$.<\/p>\n"},{"n":"circuit-lc","k":37,"ch":"circuit-lc","q":"<p>Pourquoi deux conditions initiales ?<\/p>\n","r":"<p>Équation du second ordre : continuité de $u_C$ (valeur) et de $i_L$ (donc la dérivée de $u_C$).<\/p>\n"},{"n":"circuit-lc","k":38,"ch":"circuit-lc","q":"<p>Relation entre $u_C$ et $i$ dans LC ?<\/p>\n","r":"<p>Quadrature : décalage de $T_0/4$. Quand $u_C = 0$, $|i|$ est maximal.<\/p>\n"},{"n":"circuit-lc","k":39,"ch":"circuit-lc","q":"<p>Courant maximal dans LC ?<\/p>\n","r":"<p>$I_m = E\\sqrt{C/L}$, obtenu par $\\tfrac12 C E^2 = \\tfrac12 L I_m^2$.<\/p>\n"},{"n":"circuit-lc","k":40,"ch":"circuit-lc","q":"<p>Énergie totale du circuit LC ?<\/p>\n","r":"<p>$W = E_C + E_L = \\tfrac12 C E^2$, constante (aucune perte).<\/p>\n"},{"n":"circuit-lc","k":41,"ch":"circuit-lc","q":"<p>Solutions de l&#39;équation homogène du 2ᵉ ordre selon $\\Delta$ ?<\/p>\n","r":"<p>$\\Delta &gt; 0$ apériodique ; $\\Delta = 0$ critique $(A + Bt)e^{rt}$ ; $\\Delta &lt; 0$ pseudo-périodique $e^{\\alpha t}(A\\cos\\omega t + B\\sin\\omega t)$.<\/p>\n"},{"n":"circuit-rlc","k":42,"ch":"circuit-rlc","q":"<p>Équation du RLC série (libre) ?<\/p>\n","r":"<p>$u'' + 2\\lambda\\,u' + \\omega_0^2\\,u = 0$, avec $\\lambda = R/2L$ et $\\omega_0 = 1/\\sqrt{LC}$ ; aussi $u'' + \\dfrac{\\omega_0}{Q}u' + \\omega_0^2 u = 0$.<\/p>\n"},{"n":"circuit-rlc","k":43,"ch":"circuit-rlc","q":"<p>Facteur de qualité du RLC série ?<\/p>\n","r":"<p>$Q = \\dfrac{L\\omega_0}{R} = \\dfrac1R\\sqrt{\\dfrac LC} = \\dfrac{\\omega_0}{2\\lambda}$.<\/p>\n"},{"n":"circuit-rlc","k":44,"ch":"circuit-rlc","q":"<p>Résistance critique ?<\/p>\n","r":"<p>$R_c = 2\\sqrt{L/C}$ : elle sépare les régimes avec et sans oscillation.<\/p>\n"},{"n":"circuit-rlc","k":45,"ch":"circuit-rlc","q":"<p>Régime apériodique : conditions ?<\/p>\n","r":"<p>$\\Delta' &gt; 0$ ; $\\lambda &gt; \\omega_0$ ; $Q &lt; \\tfrac12$ ; $R &gt; R_c$. Retour vers 0 sans osciller.<\/p>\n"},{"n":"circuit-rlc","k":46,"ch":"circuit-rlc","q":"<p>Régime critique : conditions et solution ?<\/p>\n","r":"<p>$\\lambda = \\omega_0$ ; $Q = \\tfrac12$ ; $R = R_c$. $u = E\\,(1 + \\omega_0 t)\\,e^{-\\omega_0 t}$. Re           + corps.map((r) => '<tr>' + cellules(r).map((c) => '<td>' + inl(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>');
      } else tab.forEach((r) => out.push('<p>' + inl(r) + '</p>'));
      tab = null;
    };
    const flush = () => { flushTab(); if (list) { out.push('</' + list + '>'); list = null; } };
    protegerMaths(t).split('\n').forEach((raw) => {
      if (/^\s*```/.test(raw)) { if (code === null) { flush(); code = []; } else { out.push('<pre>' + esc(code.join('\n')) + '</pre>'); code = null; } return; }
      if (code !== null) { code.push(raw); return; }
      let m;
      if (/^\s*\|.*\|\s*$/.test(raw)) { if (list) { out.push('</' + list + '>'); list = null; } (tab = tab || []).push(raw); return; }
      flushTab();
      if ((m = raw.match(/^\s*#{1,6}\s+(.*)$/))) { flush(); olN = 0; out.push('<p><strong>' + inl(m[1]) + '</strong></p>'); }
      else if ((m = raw.match(/^\s*[-*•]\s+(.*)$/))) { if (list !== 'ul') { flush(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + inl(m[1]) + '</li>'); }
      else if ((m = raw.match(/^\s*(\d+)[.)]\s+(.*)$/))) { if (list !== 'ol') { flush(); const n = +m[1]; olN = (n === 1 && olN > 1) ? olN : n; out.push('<ol start="' + olN + '">'); list = 'ol'; } out.push('<li>' + inl(m[2]) + '</li>'); olN++; }
      else if (!raw.trim()) flush();
      else { flush(); out.push('<p>' + inl(raw) + '</p>'); }
    });
    if (code !== null) out.push('<pre>' + esc(code.join('\n')) + '</pre>');
    flush(); return rendreMaths(out.join(''));
  };

  // ---------- MathJax : celui de la page s'il existe, sinon chargé à la première formule ----------
  let mjPret = null;
  const mathjax = () => mjPret || (mjPret = new Promise((ok, ko) => {
    if (!window.MathJax) {
      window.MathJax = { svg: { fontCache: 'global' }, startup: { typeset: false } };
      const s = document.createElement('script'); s.async = true; s.src = 'https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js';
      s.onerror = () => ko(new Error('MathJax')); document.head.appendChild(s);
    }
    let n = 0; const t = setInterval(() => {
      if (window.MathJax && MathJax.tex2svgPromise && MathJax.startup && MathJax.startup.promise) { clearInterval(t); MathJax.startup.promise.then(ok, ko); }
      else if (++n > 150) { clearInterval(t); ko(new Error('MathJax')); }
    }, 100);
  })).catch((e) => { mjPret = null; throw e; });
  const svgCache = new Map(); let file = Promise.resolve();
  function dessinerMaths(racine) {
    const spans = [...racine.querySelectorAll('.mzt-tex:not([data-ok])')]; if (!spans.length) return;
    mathjax().then(() => spans.forEach((sp) => {
      const cle = sp.dataset.d + '|' + sp.textContent;
      const poser = (n) => { if (!sp.isConnected || sp.dataset.ok) return; sp.textContent = ''; sp.appendChild(n.cloneNode(true)); sp.dataset.ok = '1'; };
      if (svgCache.has(cle)) return poser(svgCache.get(cle));
      file = file.then(() => MathJax.tex2svgPromise(sp.textContent, { display: sp.dataset.d === '1' }).then((n) => { svgCache.set(cle, n); poser(n); })).catch(() => {});
    })).catch(() => {});
  }
  async function ask(q, deep) {
    q = (q || '').trim(); deep = deep || $('#mztDeep').checked;
    if (busy || !q) return; if (!sample) { note(); return; }
    const c = refreshCtx();
    if (!cur || (cur.sec !== c.label && !forced)) { cur = { id: 't' + Date.now().toString(36), sec: c.label, date: today(), title: q.slice(0, 80), msgs: [] }; ST.threads.push(cur); }
    else if (!ST.threads.includes(cur)) ST.threads.push(cur);
    cur.msgs.push({ r: 'u', t: q }); busy = true; renderLog();
    const out = document.createElement('div'); out.className = 'mzt-m a'; out.textContent = deep ? 'Réflexion approfondie…' : 'Réflexion…'; $('#mztLog').appendChild(out);
    $('#mztSend').disabled = true; $('#mztStop').hidden = false;
    const style = deep
      ? 'Réponse APPROFONDIE (400 à 700 mots) : 1) l\'intuition avec une analogie, 2) l\'explication détaillée pas à pas, 3) pourquoi ça marche, 4) un exemple complet chiffré, 5) les pièges fréquents et ce qui tombe à l\'examen, 6) une question pour vérifier la compréhension.'
      : 'Réponse EXPLICATIVE (150 à 250 mots) : 1) l\'idée en une phrase, 2) l\'explication pas à pas, 3) un petit exemple chiffré ou concret, 4) une courte question pour vérifier la compréhension.';
    const mem = [];
    if (ST.memos.length) mem.push('DIFFICULTÉS DÉJÀ REPÉRÉES :\n' + ST.memos.slice(-12).map((m) => `- ${m.date} : ${m.text}`).join('\n'));
    const lastQ = ST.threads.flatMap((t) => t.msgs.filter((m) => m.r === 'u').map((m) => `[${t.sec}] ${m.t.slice(0, 100)}`)).slice(-6);
    if (lastQ.length) mem.push('SES DERNIÈRES QUESTIONS :\n' + lastQ.map((x) => '- ' + x).join('\n'));
    const rules = `Tu es le tuteur de ${C.student}, pour le module ${C.module}${C.prof ? ' du ' + C.prof : ''}. Il apprend souvent la notion pour la première fois.
Règles : réponds en français simple, en Markdown léger (**gras** pour les termes clés, tirets, étapes numérotées). Toute formule ou tout calcul s'écrit en LaTeX : $…$ dans la phrase, $$…$$ seul sur sa ligne pour une formule importante (ex. $\\hat y_i$, $$\\text{MSE}=\\frac{1}{n}\\sum_{i=1}^{n}(y_i-\\hat y_i)^2$$) ; jamais d'accents graves pour une formule, ils sont réservés au code et aux noms de fonctions. Un petit tableau Markdown est permis s'il clarifie (3 colonnes maximum, l'écran est étroit). ${style} Appuie-toi d'abord sur l'EXTRAIT ci-dessous et sur les conventions du prof ; si une source générale diffère du cours, signale l'écart et dis quelle version utiliser à l'examen (celle du prof). Pour un calcul, pose chaque étape et vérifie-la. S'il envoie une réponse ou une photo de brouillon, corrige étape par étape et nomme précisément l'erreur. Si tu n'es pas sûr, dis-le. S'il demande un mini-exercice, donne l'exercice sans la solution.
Utilise sa mémoire pour faire des liens avec ses confusions passées, sans la réciter.
Termine TOUJOURS par une dernière ligne séparée au format exact « MÉMO: … » qui résume en 15 mots maximum la difficulté révélée par sa question (ou « MÉMO: rien »). Cette ligne lui est cachée.
${C.conventions ? 'CONVENTIONS DU PROF : ' + C.conventions + '\n' : ''}MÉMOIRE DE L'ÉLÈVE :
${mem.join('\n\n') || '(rien pour l\'instant)'}
EXTRAIT (${c.label}) :
${c.text.slice(0, deep ? 9000 : 3500)}`;
    const recent = cur.msgs.slice(deep ? -9 : -5, -1).map((m) => ({ role: m.r === 'u' ? 'user' : 'assistant', content: m.t }));
    while (recent.length && recent[0].role !== 'user') recent.shift();
    const msgs = [...recent.filter((m) => m.content && m.content.trim()), { role: 'user', content: q }]; while (msgs.length > 1 && msgs[0].role !== 'user') msgs.shift(); msgs[0] = { role: 'user', content: rules + '\n\n---\nQuestion : ' + msgs[0].content };
    ctl = new AbortController();
    const opts = { modelTier: deep ? 'complex' : 'quick', cache: false, signal: ctl.signal, onText: ({ text }) => { out.innerHTML = md(visible(text)); dessinerMaths(out); $('#mztLog').scrollTop = 1e9; } };
    if (img) opts.images = [img];
    try {
      const r = await sample(msgs, opts);
      const mm = r.text.match(/(?:^|\n)\s*M[ÉE]MO\s*:\s*(.+)\s*$/i);
      cur.msgs.push({ r: 'a', t: visible(r.text) + (r.truncated ? '\n\n(Réponse coupée : pose une question plus ciblée.)' : ''), d: !!deep });
      if (mm && !/^\s*rien/i.test(mm[1])) { ST.memos.push({ date: today(), text: mm[1].trim().slice(0, 160) }); if (ST.memos.length > 30) ST.memos.shift(); saveMemos(); }
      await saveThread(cur);
    } catch (e) {
      const kept = e && e.text ? visible(e.text) : '';
      if (e && e.code === 'cancelled') { if (kept) cur.msgs.push({ r: 'a', t: kept + '\n(Arrêté.)' }); else cur.msgs.pop(); }
      else { cur.msgs.pop(); compacter(!!cur.msgs.length); out.textContent = (kept ? kept + '\n\n' : '') + (ERR[e && e.code] || 'Le tuteur n\'a pas pu répondre. Réessaie dans un instant.'); }
      if (!cur.msgs.length) ST.threads = ST.threads.filter((t) => t !== cur);
      saveLocal();
      if (!(e && e.code === 'cancelled')) { busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImgN').textContent = ''; return; }
    }
    busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImg').value = ''; $('#mztImgN').textContent = ''; renderLog();
  }

  // ---------- événements ----------
  $('#mztBtn').onclick = () => openPanel(null);
  $('#mztX').onclick = closePanel;
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#mztPan').hidden) closePanel(); });
  $('#mztTabH').onclick = () => view($('#mztHist').hidden ? 'hist' : 'chat');
  $('#mztTabM').onclick = () => view($('#mztMem').hidden ? 'mem' : 'chat');
  $('#mztQ').oninput = renderList;
  $('#mztList').onclick = (e) => { const id = e.target.dataset && e.target.dataset.cont; if (!id) return; cur = ST.threads.find((t) => t.id === id); view('chat'); $('#mztCtx').textContent = '· ' + cur.sec; renderLog(); };
  $('#mztMemL').onclick = (e) => { const i = e.target.dataset && e.target.dataset.memdel; if (i == null) return; ST.memos.splice(+i, 1); saveMemos(); renderMem(); };
  $('#mztChips').onclick = (e) => { const b = e.target.closest('[data-chip]'); if (!b) return; const t = $('#mztIn'); t.value = b.dataset.chip + (t.value ? ' : ' + t.value : ''); t.focus(); };
  $('#mztNew').onclick = () => { cur = null; renderLog(); };
  $('#mztStop').onclick = () => { if (ctl) ctl.abort(); };
  $('#mztImg').onchange = (e) => { img = e.target.files[0] || null; $('#mztImgN').textContent = img ? 'Photo : ' + img.name : ''; };
  $('#mztF').onsubmit = (e) => { e.preventDefault(); const v = $('#mztIn').value; $('#mztIn').value = ''; ask(v); };
  $('#mztIn').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#mztF').requestSubmit(); } });

  // ---------- capacités (facultatives) ----------
  const W = window.claude;
  if (W && W.use) {
    W.use('sample').then((s) => { sample = s; ready = true; note();
      if (s && s.limits) s.limits().then((l) => { if (l && l.images) { imgOK = true; $('#mztImgL').hidden = false; if (l.images.mediaTypes) $('#mztImg').accept = l.images.mediaTypes.join(','); } }).catch(() => {});
    }).catch(() => { ready = true; note(); });
    Promise.all([W.use('db'), W.use('user')]).then(async ([d, u]) => {
      if (!d || !u) return; const id = await u.id(); if (!id) return; db = d; base = 'data/users/' + id + '/mzt_' + C.id;
      try {
        const m = await db.doc(base).get(); if (m.exists) { const v = m.data() || {}; if (Array.isArray(v.memos)) ST.memos = JSON.parse(JSON.stringify(v.memos)); }
        const q = await db.collection(base + '/threads').get(); const remote = q.docs.map((x) => Object.assign({ id: x.id }, JSON.parse(JSON.stringify(x.data() || {}))));
        const map = {}; [...ST.threads, ...remote].forEach((t) => { if (!map[t.id] || (t.msgs || []).length > (map[t.id].msgs || []).length) map[t.id] = t; });
        ST.threads = Object.values(map).sort((a, b) => parseInt(a.id.slice(1), 36) - parseInt(b.id.slice(1), 36)); saveLocal();
      } catch (e) {}
    }).catch(() => {});
  } else { ready = true; note(); }

  window.MZT = { open: openPanel, close: closePanel };
})();

</script>

if(window.top===window&&location.protocol==="file:"){a.hidden=true;return}
a.href=p.indexOf("/decouvrir")===0||location.pathname.indexOf("/decouvrir")===0?"/decouvrir":"/app/modules";})();</script>
