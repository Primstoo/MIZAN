.1 107.6 L424.1 107.5 L426.2 107.5 L428.3 107.5 L430.3 107.4 L432.4 107.4 L434.5 107.4 L436.5 107.3 L438.6 107.3 L440.7 107.3 L442.7 107.2 L444.8 107.2 L446.9 107.2 L448.9 107.2 L451.0 107.1 L453.1 107.1 L455.1 107.1 L457.2 107.1 L459.3 107.0 L461.3 107.0 L463.4 107.0 L465.5 107.0 L467.5 107.0 L469.6 106.9 L471.7 106.9 L473.7 106.9 L475.8 106.9 L477.9 106.9 L479.9 106.8 L482.0 106.8 L484.1 106.8 L486.1 106.8 L488.2 106.8 L490.3 106.8 L492.3 106.7 L494.4 106.7 L496.5 106.7 L498.5 106.7 L500.6 106.7 L502.7 106.7 L504.7 106.7 L506.8 106.6 L508.9 106.6 L510.9 106.6 L513.0 106.6 L515.1 106.6 L517.1 106.6 L519.2 106.6 L521.3 106.5 L523.3 106.5 L525.4 106.5 L527.5 106.5 L529.5 106.5 L531.6 106.5 L533.7 106.5 L535.7 106.5 L537.8 106.5 L539.9 106.5 L541.9 106.4 L544.0 106.4\" stroke=\"#6C8FB8\" stroke-width=\"2.0\" fill=\"none\"/><g font-family=\"sans-serif\" font-size=\"11.5\" fill=\"currentColor\"><circle cx=\"48.0\" cy=\"184.3\" r=\"3.6\" fill=\"#D9824F\"/><text x=\"56.0\" y=\"178.3\" fill=\"#D9824F\">u(0+) = −E<\/text><\/g><\/svg><p>La tension change de signe : la bobine se comporte comme un <strong>générateur<\/strong> qui entretient le courant dans $R$, jusqu&#39;à restituer toute son énergie (environ $5\\tau$).<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p><strong>Surtension à l&#39;ouverture.<\/strong> Si l&#39;on ouvrait brutalement le circuit, $i$ devrait tomber à $0$ instantanément : $u = L\\,\\dfrac{di}{dt}$ deviendrait énorme et provoquerait une étincelle (arc électrique) aux bornes de l&#39;interrupteur. C&#39;est pourquoi on place une <strong>diode de roue libre<\/strong> en parallèle sur les bobines (relais, moteurs) commandées par des interrupteurs électroniques.<\/p>\n<\/aside><h2>Idée 4 · Bilan d&#39;énergie : pas de partage 50/50<\/h2>\n<p>Idée : on multiplie la loi des mailles par $i\\,dt$ : $e\\,i\\,dt = R\\,i^2\\,dt + d\\!\\left(\\tfrac12 L i^2\\right)$.<\/p>\n<ul>\n<li><strong>Établissement<\/strong> : la bobine stocke $W = \\tfrac12 L \\left(\\dfrac{E}{R}\\right)^2$. Ensuite, le générateur continue de fournir la puissance $E^2/R$, entièrement dissipée dans $R$ : il n&#39;y a pas de partage « moitié-moitié » comme pour le condensateur.<\/li>\n<li><strong>Rupture<\/strong> : la bobine restitue $W$, entièrement dissipée par effet Joule dans $R$ : $\\displaystyle\\int_0^\\infty R\\,i^2\\,dt = \\tfrac12 L \\left(\\dfrac{E}{R}\\right)^2$.<\/li>\n<\/ul>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>RC : $u_C$ continue, $\\tau = RC$, interrupteur ouvert en régime permanent. RL : $i_L$ continu, $\\tau = L/R$, fil en régime permanent.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercice 3.2 du cours · Établissement du courant dans une bobine<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Une bobine idéale $L = 0{,}5\\ \\text{H}$ est placée en série avec $R = 100\\ \\Omega$ et alimentée sous $E = 10\\ \\text{V}$ à $t = 0$. Calculer la constante de temps $\\tau$, en ms.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>$\\tau = L/R$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 5<\/b><\/p><p>$\\tau = \\dfrac{L}{R} = \\dfrac{0{,}5}{100} = 5\\ \\text{ms}$.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Calculer le courant en régime permanent, en A.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>En régime permanent, la bobine est un fil.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.1<\/b><\/p><p>$I = \\dfrac{E}{R} = \\dfrac{10}{100} = 0{,}1\\ \\text{A}$.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Calculer l&#39;énergie stockée dans la bobine en régime permanent, en mJ.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>$W = \\tfrac12 L I^2$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 2.5<\/b><\/p><p>$W = \\tfrac12 L I^2 = \\tfrac12 \\times 0{,}5 \\times 0{,}1^2 = 2{,}5\\ \\text{mJ}$.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Calculer $i$ et $u_L$ à $t = \\tau$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>$i(\\tau) = I\\,(1 - e^{-1})$ et $u_L = E\\,e^{-1}$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>$i(\\tau) = 0{,}63 \\times 0{,}1 \\approx 63\\ \\text{mA}$ et $u_L(\\tau) = E\\,e^{-1} \\approx 3{,}7\\ \\text{V}$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Rupture du courant<\/h3><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>Le circuit de l&#39;exercice précédent est mis en régime permanent, puis le générateur est remplacé par un fil à $t = 0$. Que valent $i(0^+)$ et $u_L(0^+)$ ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Le courant dans la bobine est continu. La tension dans $R$ est $R\\,i$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>$i(0^+) = i(0^-) = 0{,}1\\ \\text{A}$ (continuité). La bobine débite dans $R$ : $u_L(0^+) = -R\\,i(0^+) = -10\\ \\text{V} = -E$. Elle se comporte comme un générateur.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><p>Pourquoi place-t-on une diode de roue libre en parallèle sur un relais commandé par un transistor ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>À l&#39;ouverture, le courant de la bobine ne peut pas s&#39;annuler instantanément : sans diode, $u = L\\,di/dt$ devient énorme (surtension, étincelle). La diode offre au courant un chemin pour décroître en $5\\tau$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">La constante de temps d&#39;un circuit RL est…<\/div><button class=\"opt\" data-o=\"0\">$RL$<\/button><button class=\"opt\" data-o=\"1\">$L/R$<\/button><button class=\"opt\" data-o=\"2\">$R/L$<\/button><button class=\"opt\" data-o=\"3\">$1/(LR)$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">À l&#39;établissement du courant, $i(t)$ vaut…<\/div><button class=\"opt\" data-o=\"0\">$\\dfrac{E}{R}\\,e^{-t/\\tau}$<\/button><button class=\"opt\" data-o=\"1\">$\\dfrac{E}{R}\\,(1 - e^{-t/\\tau})$<\/button><button class=\"opt\" data-o=\"2\">$E\\,(1 - e^{-t/\\tau})$<\/button><button class=\"opt\" data-o=\"3\">$\\dfrac{E}{R}\\,(1 + e^{-t/\\tau})$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">À $t = 0^+$, lors de l&#39;établissement, la tension aux bornes de la bobine est…<\/div><button class=\"opt\" data-o=\"0\">$0$<\/button><button class=\"opt\" data-o=\"1\">$E$<\/button><button class=\"opt\" data-o=\"2\">$E/2$<\/button><button class=\"opt\" data-o=\"3\">$-E$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">En régime permanent, la bobine idéale d&#39;un circuit RL est…<\/div><button class=\"opt\" data-o=\"0\">un fil ($u = 0$)<\/button><button class=\"opt\" data-o=\"1\">un interrupteur ouvert<\/button><button class=\"opt\" data-o=\"2\">un générateur<\/button><button class=\"opt\" data-o=\"3\">une résistance infinie<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Dans un circuit RL, quelle grandeur subit une discontinuité à l&#39;établissement ?<\/div><button class=\"opt\" data-o=\"0\">le courant $i$<\/button><button class=\"opt\" data-o=\"1\">la tension $u_L$ aux bornes de la bobine<\/button><button class=\"opt\" data-o=\"2\">l&#39;énergie $W_L$<\/button><button class=\"opt\" data-o=\"3\">aucune<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">À la rupture du courant (générateur remplacé par un fil), la tension aux bornes de $L$ à $0^+$ vaut…<\/div><button class=\"opt\" data-o=\"0\">$E$<\/button><button class=\"opt\" data-o=\"1\">$0$<\/button><button class=\"opt\" data-o=\"2\">$-E$<\/button><button class=\"opt\" data-o=\"3\">$E/2$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Pour $L = 0{,}5\\ \\text{H}$ et $R = 100\\ \\Omega$, la constante de temps est…<\/div><button class=\"opt\" data-o=\"0\">$50\\ \\text{s}$<\/button><button class=\"opt\" data-o=\"1\">$0{,}5\\ \\text{ms}$<\/button><button class=\"opt\" data-o=\"2\">$5\\ \\text{ms}$<\/button><button class=\"opt\" data-o=\"3\">$200\\ \\text{ms}$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">À quoi sert une diode de roue libre ?<\/div><button class=\"opt\" data-o=\"0\">à augmenter le courant<\/button><button class=\"opt\" data-o=\"1\">à éviter la surtension à l&#39;ouverture d&#39;un circuit inductif<\/button><button class=\"opt\" data-o=\"2\">à charger la bobine<\/button><button class=\"opt\" data-o=\"3\">à remplacer la résistance<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Dans un circuit RL, à l&#39;établissement, qui dissipe l&#39;énergie fournie après que la bobine a stocké $\\tfrac12 L I^2$ ?<\/div><button class=\"opt\" data-o=\"0\">la bobine<\/button><button class=\"opt\" data-o=\"1\">la résistance $R$ (puissance $E^2/R$)<\/button><button class=\"opt\" data-o=\"2\">le générateur<\/button><button class=\"opt\" data-o=\"3\">personne<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">À $t = \\tau$ lors de l&#39;établissement, $i$ vaut environ…<\/div><button class=\"opt\" data-o=\"0\">$0{,}37\\,E/R$<\/button><button class=\"opt\" data-o=\"1\">$0{,}63\\,E/R$<\/button><button class=\"opt\" data-o=\"2\">$0{,}99\\,E/R$<\/button><button class=\"opt\" data-o=\"3\">$E/R$<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"circuit-rl","rep":null,"tol":null},{"n":"circuit-rl","rep":["5"],"tol":null},{"n":"circuit-rl","rep":["0.1"],"tol":null},{"n":"circuit-rl","rep":["2.5"],"tol":null},{"n":"circuit-rl","rep":null,"tol":null},{"n":"circuit-rl","rep":null,"tol":null},{"n":"circuit-rl","rep":null,"tol":null}],"qcm":[{"n":"circuit-rl","q":"La constante de temps d&#39;un circuit RL est…","o":["$RL$","$L/R$","$R/L$","$1/(LR)$"],"a":1,"e":"$\\tau = L/R$ (en secondes : $\\text{H}/\\Omega = \\text{s}$)."},{"n":"circuit-rl","q":"À l&#39;établissement du courant, $i(t)$ vaut…","o":["$\\dfrac{E}{R}\\,e^{-t/\\tau}$","$\\dfrac{E}{R}\\,(1 - e^{-t/\\tau})$","$E\\,(1 - e^{-t/\\tau})$","$\\dfrac{E}{R}\\,(1 + e^{-t/\\tau})$"],"a":1,"e":"Le courant part de 0 (continuité) et tend vers $E/R$."},{"n":"circuit-rl","q":"À $t = 0^+$, lors de l&#39;établissement, la tension aux bornes de la bobine est…","o":["$0$","$E$","$E/2$","$-E$"],"a":1,"e":"$i(0^+) = 0$, donc $R\\,i = 0$ et toute la tension $E$ est aux bornes de $L$."},{"n":"circuit-rl","q":"En régime permanent, la bobine idéale d&#39;un circuit RL est…","o":["un fil ($u = 0$)","un interrupteur ouvert","un générateur","une résistance infinie"],"a":0,"e":"$di/dt = 0$ donc $u = 0$ et $i = E/R$."},{"n":"circuit-rl","q":"Dans un circuit RL, quelle grandeur subit une discontinuité à l&#39;établissement ?","o":["le courant $i$","la tension $u_L$ aux bornes de la bobine","l&#39;énergie $W_L$","aucune"],"a":1,"e":"$i$ est continu, $u_L$ saute de $0$ à $E$."},{"n":"circuit-rl","q":"À la rupture du courant (générateur remplacé par un fil), la tension aux bornes de $L$ à $0^+$ vaut…","o":["$E$","$0$","$-E$","$E/2$"],"a":2,"e":"La bobine débite dans $R$ avec $i = E/R$ : $u = -R\\,i = -E$."},{"n":"circuit-rl","q":"Pour $L = 0{,}5\\ \\text{H}$ et $R = 100\\ \\Omega$, la constante de temps est…","o":["$50\\ \\text{s}$","$0{,}5\\ \\text{ms}$","$5\\ \\text{ms}$","$200\\ \\text{ms}$"],"a":2,"e":"$0{,}5/100 = 0{,}005\\ \\text{s}$."},{"n":"circuit-rl","q":"À quoi sert une diode de roue libre ?","o":["à augmenter le courant","à éviter la surtension à l&#39;ouverture d&#39;un circuit inductif","à charger la bobine","à remplacer la résistance"],"a":1,"e":"Elle donne un chemin au courant de la bobine, qui ne peut pas s&#39;annuler instantanément."},{"n":"circuit-rl","q":"Dans un circuit RL, à l&#39;établissement, qui dissipe l&#39;énergie fournie après que la bobine a stocké $\\tfrac12 L I^2$ ?","o":["la bobine","la résistance $R$ (puissance $E^2/R$)","le générateur","personne"],"a":1,"e":"En régime permanent, tout ce que fournit le générateur est dissipé par effet Joule dans $R$."},{"n":"circuit-rl","q":"À $t = \\tau$ lors de l&#39;établissement, $i$ vaut environ…","o":["$0{,}37\\,E/R$","$0{,}63\\,E/R$","$0{,}99\\,E/R$","$E/R$"],"a":1,"e":"$1 - e^{-1} \\approx 0{,}63$."}]},{"id":"circuit-lc","t":"Second ordre et circuit LC : oscillations libres","seance":"Chapitre 3 · section 3.7.1 et 3.7.2","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Pour l&#39;équation $a\\,r^2 + b\\,r + c = 0$, le discriminant est $\\Delta = b^2 - 4ac$. S&#39;il est négatif, les racines sont complexes.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Combien de racines réelles a l&#39;équation $r^2 + 4 = 0$ ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0<\/b><\/p><p>Aucune : $r^2 = -4$ donne deux racines imaginaires pures $r = \\pm 2j$. C&#39;est exactement la situation du circuit LC.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « balançoire sans frottement ».<\/strong> Dans le circuit LC, l&#39;énergie passe sans cesse du condensateur (électrique) à la bobine (magnétique) et revient, sans jamais se perdre. Il y a deux réservoirs, donc deux conditions initiales.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Utiliser une seule condition initiale. Une équation du <strong>second ordre<\/strong> en demande <strong>deux<\/strong> : la tension $u_C(0)$ et le courant $i(0)$ (donc la dérivée de $u_C$ en 0).<\/p>\n<\/aside><p>À la fin, tu sais résoudre l&#39;équation homogène du second ordre selon le signe de $\\Delta$, et décrire l&#39;oscillation libre du circuit LC : $\\omega_0$, $T_0$, quadrature, énergie.<\/p>\n<h2>Idée 1 · Les équations du second ordre<\/h2>\n<p>Idée : les régimes transitoires des circuits linéaires sont régis par $a\\,\\dfrac{d^2 f}{dt^2} + b\\,\\dfrac{df}{dt} + c\\,f = g(t)$ ($a$, $b$, $c$ réels positifs). La solution est $f = f_1 + f_2$ : $f_1$ est le <strong>régime libre<\/strong>, $f_2$ le <strong>régime forcé<\/strong>.<\/p>\n<p>On obtient $f_1$ avec l&#39;équation caractéristique $a\\,r^2 + b\\,r + c = 0$, de discriminant $\\Delta = b^2 - 4ac$.<\/p>\n<table>\n<thead>\n<tr>\n<th>Discriminant<\/th>\n<th>Racines<\/th>\n<th>Solution $f_1(t)$<\/th>\n<th>Régime<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>$\\Delta &gt; 0$<\/td>\n<td>deux réelles négatives $r_1$, $r_2$<\/td>\n<td>$A\\,e^{r_1 t} + B\\,e^{r_2 t}$<\/td>\n<td>apériodique<\/td>\n<\/tr>\n<tr>\n<td>$\\Delta = 0$<\/td>\n<td>une racine double $r$<\/td>\n<td>$(A + B\\,t)\\,e^{r t}$<\/td>\n<td>critique<\/td>\n<\/tr>\n<tr>\n<td>$\\Delta &lt; 0$<\/td>\n<td>complexes $r = \\alpha \\pm j\\omega$<\/td>\n<td>$e^{\\alpha t}\\,[A\\cos\\omega t + B\\sin\\omega t]$<\/td>\n<td>pseudo-périodique (sinusoïdal si $\\alpha = 0$)<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Les constantes $A$ et $B$ se déterminent avec deux conditions initiales : la valeur de $f$ et celle de sa dérivée en $t = 0$.<\/p>\n<h2>Idée 2 · Le circuit LC : un oscillateur sans perte<\/h2>\n<p>Idée : le condensateur chargé sous $E$ se décharge dans une bobine <strong>idéale<\/strong> (sans résistance). Pour $t &lt; 0$ : $K$ en position 1, $u_C = E$. À $t = 0$ : $K$ bascule en position 2.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Établir l'équation du circuit LC<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Loi des mailles<\/div><p>En conventions récepteur : $u_C + u_L = 0$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Exprime $u_L$<\/div><p>$i = C\\,\\dfrac{du_C}{dt}$ et $u_L = L\\,\\dfrac{di}{dt} = LC\\,\\dfrac{d^2 u_C}{dt^2}$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Équation<\/div><p>$LC\\,\\dfrac{d^2 u_C}{dt^2} + u_C = 0$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Forme canonique<\/div><p>$\\dfrac{d^2 u_C}{dt^2} + \\omega_0^2\\,u_C = 0$ avec $\\omega_0 = \\dfrac{1}{\\sqrt{LC}}$ et $T_0 = \\dfrac{2\\pi}{\\omega_0} = 2\\pi\\sqrt{LC}$.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p>Ici $a = LC$, $b = 0$, $c = 1$ : $\\Delta = -4LC &lt; 0$ et les racines sont imaginaires pures, $r = \\pm j\\omega_0$. Donc $u_C = A\\cos\\omega_0 t + B\\sin\\omega_0 t$.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Les deux conditions initiales<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · Première condition<\/div><p>$u_C(0) = E$ (continuité de la tension du condensateur), donc $A = E$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · Deuxième condition<\/div><p>$i(0) = 0$ (continuité du courant dans la bobine), donc $\\dfrac{du_C}{dt}(0) = 0$, donc $B = 0$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · Résultat<\/div><p>$u_C(t) = E\\cos\\omega_0 t$ et $i(t) = C\\,\\dfrac{du_C}{dt} = -E\\sqrt{\\dfrac{C}{L}}\\,\\sin\\omega_0 t$.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><svg viewBox=\"0 0 560 240\" role=\"img\" aria-label=\"Oscillations libres du circuit LC : uC = E cos(w0 t) en orange et i proportionnel à moins sin(w0 t) en bleu, en quadrature\" style=\"max-width:100%;height:auto\"><g stroke=\"currentColor\" stroke-width=\"1.2\" fill=\"none\"><path d=\"M48 12V206\"/><path d=\"M44 111.0H550\"/><\/g><g font-family=\"sans-serif\" font-size=\"11\" fill=\"currentColor\"><path d=\"M110.0 108.0v6\" stroke=\"currentColor\" stroke-width=\"1\"/><text x=\"110.0\" y=\"222\" text-anchor=\"middle\">T0/4<\/text><path d=\"M172.0 108.0v6\" stroke=\"currentColor\" stroke-width=\"1\"/><text x=\"172.0\" y=\"222\" text-anchor=\"middle\">T0/2<\/text><path d=\"M296.0 108.0v6\" stroke=\"currentColor\" stroke-width=\"1\"/><text x=\"296.0\" y=\"222\" text-anchor=\"middle\">T0<\/text><path d=\"M420.0 108.0v6\" stroke=\"currentColor\" stroke-width=\"1\"/><text x=\"420.0\" y=\"222\" text-anchor=\"middle\">3T0/2<\/text><path d=\"M544.0 108.0v6\" stroke=\"currentColor\" stroke-width=\"1\"/><text x=\"544.0\" y=\"222\" text-anchor=\"middle\">2T0<\/text><path d=\"M45 190.2h6\" stroke=\"currentColor\" stroke-width=\"1\"/><text x=\"41\" y=\"194.2\" text-anchor=\"end\">−E<\/text><path d=\"M45 111.0h6\" stroke=\"currentColor\" stroke-width=\"1\"/><text x=\"41\" y=\"115.0\" text-anchor=\"end\">0<\/text><path d=\"M45 31.8h6\" stroke=\"currentColor\" stroke-width=\"1\"/><text x=\"41\" y=\"35.8\" text-anchor=\"end\">E<\/text><text x=\"544\" y=\"234\" text-anchor=\"end\" font-style=\"italic\">t<\/text><text x=\"54\" y=\"22\" font-style=\"italic\">orange : uC · bleu : i (échelle libre)<\/text><\/g><path d=\"M48.0 31.8 L50.1 31.9 L52.1 32.3 L54.2 32.8 L56.3 33.6 L58.3 34.5 L60.4 35.7 L62.5 37.1 L64.5 38.7 L66.6 40.5 L68.7 42.4 L70.7 44.6 L72.8 47.0 L74.9 49.5 L76.9 52.2 L79.0 55.0 L81.1 58.0 L83.1 61.2 L85.2 64.5 L87.3 67.9 L89.3 71.4 L91.4 75.1 L93.5 78.8 L95.5 82.6 L97.6 86.5 L99.7 90.5 L101.7 94.5 L103.8 98.6 L105.9 102.7 L107.9 106.9 L110.0 111.0 L112.1 115.1 L114.1 119.3 L116.2 123.4 L118.3 127.5 L120.3 131.5 L122.4 135.5 L124.5 139.4 L126.5 143.2 L128.6 146.9 L130.7 150.6 L132.7 154.1 L134.8 157.5 L136.9 160.8 L138.9 164.0 L141.0 167.0 L143.1 169.8 L145.1 172.5 L147.2 175.0 L149.3 177.4 L151.3 179.6 L153.4 181.5 L155.5 183.3 L157.5 184.9 L159.6 186.3 L161.7 187.5 L163.7 188.4 L165.8 189.2 L167.9 189.7 L169.9 190.1 L172.0 190.2 L174.1 190.1 L176.1 189.7 L178.2 189.2 L180.3 188.4 L182.3 187.5 L184.4 186.3 L186.5 184.9 L188.5 183.3 L190.6 181.5 L192.7 179.6 L194.7 177.4 L196.8 175.0 L198.9 172.5 L200.9 169.8 L203.0 167.0 L205.1 164.0 L207.1 160.8 L209.2 157.5 L211.3 154.1 L213.3 150.6 L215.4 146.9 L217.5 143.2 L219.5 139.4 L221.6 1 467.5 41.0 L469.6 41.0 L471.7 41.0 L473.7 41.0 L475.8 41.0 L477.9 41.0 L479.9 41.0 L482.0 41.0 L484.1 41.0 L486.1 41.0 L488.2 41.0 L490.3 41.0 L492.3 41.0 L494.4 41.0 L496.5 41.0 L498.5 41.0 L500.6 41.0 L502.7 41.0 L504.7 41.0 L506.8 41.0 L508.9 41.0 L510.9 41.0 L513.0 41.0 L515.1 41.0 L517.1 41.0 L519.2 41.0 L521.3 41.0 L523.3 41.0 L525.4 41.0 L527.5 41.0 L529.5 41.0 L531.6 41.0 L533.7 41.0 L535.7 41.0 L537.8 41.0 L539.9 41.0 L541.9 41.0 L544.0 41.0\" stroke=\"currentColor\" stroke-width=\"1.4\" fill=\"none\"/><g font-family=\"sans-serif\" font-size=\"11.5\" fill=\"currentColor\"><\/g><\/svg><p>$$W = E_C + E_L = \\tfrac12 C E^2 = \\tfrac12 L I_m^2 = \\text{cste}$$<\/p>\n<p>L&#39;énergie passe du condensateur à la bobine en un quart de période, puis revient au quart suivant. L&#39;égalité $\\tfrac12 C E^2 = \\tfrac12 L I_m^2$ redonne $I_m = E\\sqrt{C/L}$.<\/p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>LC : $\\omega_0 = \\dfrac{1}{\\sqrt{LC}}$, $T_0 = 2\\pi\\sqrt{LC}$, $u_C = E\\cos\\omega_0 t$, $i$ en quadrature, énergie totale constante.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Application · circuit LC<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Un condensateur $C = 100\\ \\mu\\text{F}$ chargé sous $E = 10\\ \\text{V}$ se décharge dans une bobine idéale $L = 10\\ \\text{mH}$. Calculer $\\omega_0$, en rad/s.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>$\\omega_0 = 1/\\sqrt{LC}$ avec $LC = 10^{-2}\\times 10^{-4}$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1000<\/b><\/p><p>$LC = 10^{-6}\\ \\text{s}^2$, donc $\\omega_0 = 1/\\sqrt{10^{-6}} = 1000\\ \\text{rad/s}$ (calcul vérifié).<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Calculer la période $T_0$, en ms (une décimale).<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>$T_0 = 2\\pi/\\omega_0$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 6.3<\/b><\/p><p>$T_0 = \\dfrac{2\\pi}{1000} \\approx 6{,}28\\ \\text{ms}$.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Calculer le courant maximal $I_m$, en A.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>$I_m = E\\sqrt{C/L}$, ou égalité des énergies.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1<\/b><\/p><p>$I_m = E\\sqrt{C/L} = 10\\sqrt{\\dfrac{10^{-4}}{10^{-2}}} = 10 \\times 0{,}1 = 1\\ \\text{A}$. Contrôle par l&#39;énergie : $\\tfrac12 C E^2 = 5\\ \\text{mJ} = \\tfrac12 L I_m^2 = \\tfrac12 \\times 10^{-2} \\times 1$.<\/p>\n<\/div><\/div><\/section><section class=\"exo\"><h3>Interpréter les trois lignes<\/h3><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Pourquoi l&#39;équation du circuit LC n&#39;a-t-elle ni terme en $du/dt$ ni second membre ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Pas de terme en $du/dt$ : il n&#39;y a pas de résistance, donc pas de perte d&#39;énergie. Pas de second membre : il n&#39;y a pas de générateur dans la maille, c&#39;est le régime libre. Il reste $LC\\,u'' + u = 0$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>À l&#39;instant où $u_C = 0$, que valent l&#39;énergie du condensateur et celle de la bobine ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$E_C = 0$ et toute l&#39;énergie est dans la bobine : $E_L = \\tfrac12 C E^2 = W$. Le courant est alors maximal ($|i| = I_m$).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Combien de conditions initiales faut-il pour une équation différentielle du second ordre ?<\/div><button class=\"opt\" data-o=\"0\">une<\/button><button class=\"opt\" data-o=\"1\">deux<\/button><button class=\"opt\" data-o=\"2\">trois<\/button><button class=\"opt\" data-o=\"3\">aucune<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Si $\\Delta &gt; 0$ pour l&#39;équation caractéristique, le régime libre est…<\/div><button class=\"opt\" data-o=\"0\">apériodique<\/button><button class=\"opt\" data-o=\"1\">critique<\/button><button class=\"opt\" data-o=\"2\">pseudo-périodique<\/button><button class=\"opt\" data-o=\"3\">sinusoïdal<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Si $\\Delta = 0$, la solution libre s&#39;écrit…<\/div><button class=\"opt\" data-o=\"0\">$A\\,e^{r_1 t} + B\\,e^{r_2 t}$<\/button><button class=\"opt\" data-o=\"1\">$(A + B\\,t)\\,e^{r t}$<\/button><button class=\"opt\" data-o=\"2\">$e^{\\alpha t}[A\\cos\\omega t + B\\sin\\omega t]$<\/button><button class=\"opt\" data-o=\"3\">$A\\cos\\omega t$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">L&#39;équation du circuit LC (libre) est…<\/div><button class=\"opt\" data-o=\"0\">$\\dfrac{du}{dt} + u = 0$<\/button><button class=\"opt\" data-o=\"1\">$LC\\,\\dfrac{d^2 u_C}{dt^2} + u_C = 0$<\/button><button class=\"opt\" data-o=\"2\">$RC\\,\\dfrac{du}{dt} + u = E$<\/button><button class=\"opt\" data-o=\"3\">$L\\,\\dfrac{di}{dt} = 0$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">La pulsation propre du circuit LC est…<\/div><button class=\"opt\" data-o=\"0\">$\\sqrt{LC}$<\/button><button class=\"opt\" data-o=\"1\">$\\dfrac{1}{\\sqrt{LC}}$<\/button><button class=\"opt\" data-o=\"2\">$LC$<\/button><button class=\"opt\" data-o=\"3\">$\\dfrac{1}{LC}$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Pour $L = 10\\ \\text{mH}$ et $C = 100\\ \\mu\\text{F}$, $\\omega_0$ vaut…<\/div><button class=\"opt\" data-o=\"0\">$100\\ \\text{rad/s}$<\/button><button class=\"opt\" data-o=\"1\">$1000\\ \\text{rad/s}$<\/button><button class=\"opt\" data-o=\"2\">$10^6\\ \\text{rad/s}$<\/button><button class=\"opt\" data-o=\"3\">$31{,}6\\ \\text{rad/s}$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Dans le circuit LC, le courant $i$ est…<\/div><button class=\"opt\" data-o=\"0\">en phase avec $u_C$<\/button><button class=\"opt\" data-o=\"1\">en quadrature avec $u_C$<\/button><button class=\"opt\" data-o=\"2\">en opposition de phase avec $u_C$<\/button><button class=\"opt\" data-o=\"3\">constant<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Le courant maximal du circuit LC est…<\/div><button class=\"opt\" data-o=\"0\">$E\\sqrt{L/C}$<\/button><button class=\"opt\" data-o=\"1\">$E\\sqrt{C/L}$<\/button><button class=\"opt\" data-o=\"2\">$E/(LC)$<\/button><button class=\"opt\" data-o=\"3\">$E/R$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Que devient l&#39;énergie totale du circuit LC au cours du temps ?<\/div><button class=\"opt\" data-o=\"0\">elle décroît exponentiellement<\/button><button class=\"opt\" data-o=\"1\">elle reste constante, égale à $\\tfrac12 C E^2$<\/button><button class=\"opt\" data-o=\"2\">elle double à chaque période<\/button><button class=\"opt\" data-o=\"3\">elle s&#39;annule au bout d&#39;une demi-période<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Le circuit LC « réel » (bobine avec résistance) voit ses oscillations…<\/div><button class=\"opt\" data-o=\"0\">rester constantes<\/button><button class=\"opt\" data-o=\"1\">s&#39;amortir (régime pseudo-périodique)<\/button><button class=\"opt\" data-o=\"2\">augmenter<\/button><button class=\"opt\" data-o=\"3\">devenir apériodiques à coup sûr<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"circuit-lc","rep":["0"],"tol":null},{"n":"circuit-lc","rep":["1000"],"tol":null},{"n":"circuit-lc","rep":["6.3"],"tol":0.1},{"n":"circuit-lc","rep":["1"],"tol":null},{"n":"circuit-lc","rep":null,"tol":null},{"n":"circuit-lc","rep":null,"tol":null}],"qcm":[{"n":"circuit-lc","q":"Combien de conditions initiales faut-il pour une équation différentielle du second ordre ?","o":["une","deux","trois","aucune"],"a":1,"e":"La valeur de la fonction et celle de sa dérivée en $t = 0$."},{"n":"circuit-lc","q":"Si $\\Delta &gt; 0$ pour l&#39;équation caractéristique, le régime libre est…","o":["apériodique","critique","pseudo-périodique","sinusoïdal"],"a":0,"e":"Deux racines réelles négatives : $A\\,e^{r_1 t} + B\\,e^{r_2 t}$."},{"n":"circuit-lc","q":"Si $\\Delta = 0$, la solution libre s&#39;écrit…","o":["$A\\,e^{r_1 t} + B\\,e^{r_2 t}$","$(A + B\\,t)\\,e^{r t}$","$e^{\\alpha t}[A\\cos\\omega t + B\\sin\\omega t]$","$A\\cos\\omega t$"],"a":1,"e":"Racine double : régime critique."},{"n":"circuit-lc","q":"L&#39;équation du circuit LC (libre) est…","o":["$\\dfrac{du}{dt} + u = 0$","$LC\\,\\dfrac{d^2 u_C}{dt^2} + u_C = 0$","$RC\\,\\dfrac{du}{dt} + u = E$","$L\\,\\dfrac{di}{dt} = 0$"],"a":1,"e":"Loi des mailles $u_C + u_L = 0$ avec $u_L = LC\\,u_C''$."},{"n":"circuit-lc","q":"La pulsation propre du circuit LC est…","o":["$\\sqrt{LC}$","$\\dfrac{1}{\\sqrt{LC}}$","$LC$","$\\dfrac{1}{LC}$"],"a":1,"e":"$\\omega_0 = 1/\\sqrt{LC}$ (en rad/s)."},{"n":"circuit-lc","q":"Pour $L = 10\\ \\text{mH}$ et $C = 100\\ \\mu\\text{F}$, $\\omega_0$ vaut…","o":["$100\\ \\text{rad/s}$","$1000\\ \\text{rad/s}$","$10^6\\ \\text{rad/s}$","$31{,}6\\ \\text{rad/s}$"],"a":1,"e":"$LC = 10^{-6}$, donc $\\omega_0 = 10^3\\ \\text{rad/s}$."},{"n":"circuit-lc","q":"Dans le circuit LC, le courant $i$ est…","o":["en phase avec $u_C$","en quadrature avec $u_C$","en opposition de phase avec $u_C$","constant"],"a":1,"e":"$u_C = E\\cos\\omega_0 t$ et $i \\propto -\\sin\\omega_0 t$ : décalage de $T_0/4$."},{"n":"circuit-lc","q":"Le courant maximal du circuit LC est…","o":["$E\\sqrt{L/C}$","$E\\sqrt{C/L}$","$E/(LC)$","$E/R$"],"a":1,"e":"$\\tfrac12 C E^2 = \\tfrac12 L I_m^2$."},{"n":"circuit-lc","q":"Que devient l&#39;énergie totale du circuit LC au cours du temps ?","o":["elle décroît exponentiellement","elle reste constante, égale à $\\tfrac12 C E^2$","elle double à chaque période","elle s&#39;annule au bout d&#39;une demi-période"],"a":1,"e":"Aucune résistance : aucune perte. $E_C + E_L = \\tfrac12 C E^2$."},{"n":"circuit-lc","q":"Le circuit LC « réel » (bobine avec résistance) voit ses oscillations…","o":["rester constantes","s&#39;amortir (régime pseudo-périodique)","augmenter","devenir apériodiques à coup sûr"],"a":1,"e":"La résistance dissipe de l&#39;énergie : l&#39;amplitude décroît."}]},{"id":"circuit-rlc","t":"Le circuit RLC série : les trois régimes","seance":"Chapitre 3 · sections 3.7.3 à 3.7.5","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Dans le circuit LC, $\\omega_0 = \\dfrac{1}{\\sqrt{LC}}$ et l&#39;énergie totale se conserve. Ici on ajoute une résistance : l&#39;énergie va s&#39;y perdre.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Dans un circuit LC sans résistance, l&#39;énergie totale reste-t-elle constante ou diminue-t-elle ? Réponds « constante » ou « diminue ».<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : constante<\/b><\/p><p>Elle reste constante : aucune résistance, aucune perte. Avec une résistance $R$, l&#39;énergie diminue par effet Joule : c&#39;est l&#39;amortissement.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Un seul nombre décide : $Q$.<\/strong> Compare $Q$ à $\\tfrac12$. Si $Q &gt; \\tfrac12$ (résistance faible), le circuit oscille en s&#39;amortissant. Si $Q &lt; \\tfrac12$ (résistance forte), il revient à zéro sans osciller. À $Q = \\tfrac12$, c&#39;est le retour le plus rapide sans oscillation.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Confondre la pulsation propre $\\omega_0$ et la pseudo-pulsation $\\Omega$. Quand le circuit oscille avec amortissement, il oscille à $\\Omega = \\sqrt{\\omega_0^2 - \\lambda^2}$, un peu <strong>plus lente<\/strong> que $\\omega_0$ : la pseudo-période $T$ est donc <strong>plus longue<\/strong> que $T_0$.<\/p>\n<\/aside><p>À la fin, tu sais écrire l&#39;équation du RLC série, calculer $\\lambda$, $\\omega_0$, $Q$ et $R_c$, choisir le bon régime et écrire la solution, et décrire la réponse à un échelon.<\/p>\n<h2>Idée 1 · L&#39;équation du RLC série et ses trois paramètres<\/h2>\n<p>Idée : on ferme $K$ à $t = 0$ sur un condensateur chargé sous $E$ ($u(0) = E$, $i(0) = 0$). La loi des mailles donne une équation du second ordre.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Établir l'équation du circuit RLC série<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Loi des mailles<\/div><p>$L\\,\\dfrac{di}{dt} + R\\,i + u = 0$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Remplace $i$<\/div><p>$i = C\\,\\dfrac{du}{dt}$, donc $LC\\,\\dfrac{d^2 u}{dt^2} + RC\\,\\dfrac{du}{dt} + u = 0$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Divise par $LC$<\/div><p>$\\dfrac{d^2 u}{dt^2} + \\dfrac{R}{L}\\,\\dfrac{du}{dt} + \\dfrac{u}{LC} = 0$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Forme canonique<\/div><p>$\\dfrac{d^2 u}{dt^2} + 2\\lambda\\,\\dfrac{du}{dt} + \\omega_0^2\\,u = 0$, ou encore $u'' + \\dfrac{\\omega_0}{Q}\\,u' + \\omega_0^2\\,u = 0$.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><table>\n<thead>\n<tr>\n<th>Grandeur<\/th>\n<th>Expression<\/th>\n<th>Remarque<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Coefficient d&#39;amortissement<\/td>\n<td>$\\lambda = \\dfrac{R}{2L}$<\/td>\n<td>en s⁻¹ ; lié à $R$<\/td>\n<\/tr>\n<tr>\n<td>Pulsation propre<\/td>\n<td>$\\omega_0 = \\dfrac{1}{\\sqrt{LC}}$<\/td>\n<td>en rad/s ; circuit LC seul<\/td>\n<\/tr>\n<tr>\n<td>Facteur de qualité<\/td>\n<td>$Q = \\dfrac{L\\omega_0}{R} = \\dfrac1R\\sqrt{\\dfrac LC} = \\dfrac{\\omega_0}{2\\lambda}$<\/td>\n<td>sans unité ; plus $Q$ est grand, plus l&#39;amortissement est faible<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>La charge $q = C\\,u$ vérifie la même équation.<\/p>\n<h2>Idée 2 · Trois régimes selon le signe de $\\Delta'$<\/h2>\n<p>Idée : l&#39;équation caractéristique $r^2 + 2\\lambda\\,r + \\omega_0^2 = 0$ a pour discriminant réduit $\\Delta' = \\lambda^2 - \\omega_0^2 = \\omega_0^2\\left(\\dfrac{1}{4Q^2} - 1\\right)$. La <strong>résistance critique<\/strong> $R_c = 2\\sqrt{L/C}$ annule $\\Delta'$ et sépare les régimes.<\/p>\n<table>\n<thead>\n<tr>\n<th>Régime<\/th>\n<th>Conditions<\/th>\n<th>Racines<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Apériodique<\/td>\n<td>$\\Delta' &gt; 0$ ; $\\lambda &gt; \\omega_0$ ; $Q &lt; \\tfrac12$ ; $R &gt; R_c$<\/td>\n<td>réelles négatives<\/td>\n<\/tr>\n<tr>\n<td>Critique<\/td>\n<td>$\\Delta' = 0$ ; $\\lambda = \\omega_0$ ; $Q = \\tfrac12$ ; $R = R_c$<\/td>\n<td>double : $-\\omega_0$<\/td>\n<\/tr>\n<tr>\n<td>Pseudo-périodique<\/td>\n<td>$\\Delta' &lt; 0$ ; $\\lambda &lt; \\omega_0$ ; $Q &gt; \\tfrac12$ ; $R &lt; R_c$<\/td>\n<td>complexes : $-\\lambda \\pm j\\Omega$<\/td>\n<\/tr>\n<\/tbody><\/table>\n<svg viewBox=\"0 0 560 250\" role=\"img\" aria-label=\"Les trois régimes libres du circuit RLC pour u(0) = E et i(0) = 0 : apériodique, critique, pseudo-périodique\" style=\"max-width:100%;height:auto\"><g stroke=\"currentColor\" stroke-width=\"1.2\" fill=\"none\"><path d=\"M48 12V216\"/><path d=\"M44 155.4H550\"/><\/g><g font-family=\"sans-serif\" font-size=\"11\" fill=\"currentColor\"><path d=\"M130.7 152.4v6\" stroke=\"currentColor\" stroke-width=\"1\"/><text x=\"130.7\" y=\"232\" text-anchor=\"middle\">2<\/text><path d=\"M213.3 152.4v6\" stroke=\"currentColor\" stroke-width=\"1\"/><text x=\"213.3\" y=\"232\" text-anchor=\"middle\">4<\/text><path d=\"M296.0 152.4v6\" stroke=\"currentColor\" stroke-width=\"1\"/><text x=\"296.0\" y=\"232\" text-anchor=\"middle\">6<\/text><path d=\"M378.7 152.4v6\" stroke=\"currentColor\" stroke-width=\"1\"/><text x=\"378.7\" y=\"232\" text-anchor=\"middle\">8<\/text><path d=\"M461.3 152.4v6\" stroke=\"currentColor\" stroke-width=\"1\"/><text x=\"461.3\" y=\"232\" text-anchor=\"middle\">10<\/text><path d=\"M544.0 152.4v6\" stroke=\"currentColor\" stroke-width=\"1\"/><text x=\"544.0\" y=\"232\" text-anchor=\"middle\">12<\/text><path d=\"M45 216.0h6\" stroke=\"currentColor\" stroke-width=\"1\"/><text x=\"41\" y=\"220.0\" text-anchor=\"end\">−0 isir le régime et écrire u(t) (avec u(0) = E et i(0) = 0)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Calcule $\\lambda$, $\\omega_0$ et $Q$<\/div><p>$\\lambda = R/2L$, $\\omega_0 = 1/\\sqrt{LC}$, $Q = L\\omega_0/R$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · Compare $Q$ à 1/2<\/div><p>ou $R$ à $R_c$, ou $\\lambda$ à $\\omega_0$ : les trois comparaisons donnent le même verdict.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · Apériodique<\/div><p>$u = a\\,e^{r_1 t} + b\\,e^{r_2 t}$ avec $r_{1,2} = -\\lambda \\pm \\sqrt{\\lambda^2 - \\omega_0^2}$. Retour vers 0 sans osciller, d&#39;autant plus lent que $R$ est grande.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · Critique<\/div><p>$u = (a + b\\,t)\\,e^{-\\omega_0 t}$, et avec les conditions initiales $u(t) = E\\,(1 + \\omega_0 t)\\,e^{-\\omega_0 t}$. Retour le plus rapide sans oscillation, temps caractéristique $1/\\omega_0$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · Pseudo-périodique<\/div><p>$u = e^{-\\lambda t}(A\\cos\\Omega t + B\\sin\\Omega t)$ avec $\\Omega = \\sqrt{\\omega_0^2 - \\lambda^2} = \\omega_0\\sqrt{1 - \\tfrac{1}{4Q^2}} &lt; \\omega_0$, et ici $A = E$, $B = \\dfrac{\\lambda E}{\\Omega}$.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Idée 3 · Le régime pseudo-périodique<\/h2>\n<p>Idée : le circuit oscille à la pseudo-pulsation $\\Omega$ dans une enveloppe exponentielle $\\pm e^{-\\lambda t}$.<\/p>\n<svg viewBox=\"0 0 560 240\" role=\"img\" aria-label=\"Régime pseudo-périodique : oscillations de pseudo-période T dans l'enveloppe exponentielle plus ou moins exponentielle de moins lambda t\" style=\"max-width:100%;height:auto\"><g stroke=\"currentColor\" stroke-width=\"1.2\" fill=\"none\"><path d=\"M48 12V206\"/><path d=\"M44 111.0H550\"/><\/g><g font-family=\"sans-seri que, critique ou pseudo-périodique selon $Q$). Après quelques $\\tau$, $u_1 \\to 0$ et $u = E$ : le régime établi <strong>ne dépend pas des conditions initiales<\/strong>.<\/p>\n<svg viewBox=\"0 0 560 240\" role=\"img\" aria-label=\"Réponse du circuit RLC série à un échelon de tension : u tend vers E, sans oscillation (apériodique, critique) ou avec dépassement (pseudo-périodique)\" style=\"max-width:100%;height:auto\"><g stroke=\"currentColor\" stroke-width=\"1.2\" fill=\"none\"><path d=\"M48 12V206\"/><path d=\"M44 206.0H550\"/><\/g><g font-family=\"sans-serif\" font-size=\"11\" fill=\"currentColor\"><path d=\"M130.7 203.0v6\" stroke=\"currentColor\" stroke-width=\"1\"/><text x=\"130.7\" y=\"222\" text-anchor=\"middle\">2<\/text><path d=\"M213.3 203.0v6\" stroke=\"currentColor\" stroke-width=\"1\"/><text x=\"213.3\" y=\"222\" text-anchor=\"middle\">4<\/text><path d=\"M296.0 203.0v6\" stroke=\"currentColor\" stroke-width=\"1\"/><text x=\"296.0\" y=\"222\" text-anchor=\"middle\">6<\/text><path d=\"M378.7 203.0v6\" stroke=\"currentColor\" stroke-width=\"1\"/><text x=\"378.7\" y=\"222\" text-anchor=\"middle\">8<\/text><path d=\"M461.3 203.0v6\" stroke=\"currentColor\" stroke-width=\"1\"/><text x=\"461.3\" y=\"222\" text-anchor=\"middle\">10<\/text><path d=\"M544.0 203.0v6\" stroke=\"currentColor\" stroke-width=\"1\"/><text x=\"544.0\" y=\"222\" text-anchor=\"middle\">12<\/text><path d=\"M45 206.0h6\" stroke=\"currentColor\" stroke-width=\"1\"/><text x=\"41\" y=\"210.0\" text-anchor=\"end\">0<\/text><path d=\"M45 87.3h6\" stroke=\"currentColor\" stroke-width=\"1\"/><text x=\"41\" y=\"91.3\" text-anchor=\"end\">E<\/text><text x=\"544\" y=\"234\" text-anchor=\"end\" font-style=\"italic\">ω0·t<\/text><text x=\"54\" y=\"22\" font-style=\"italic\">u(t) : noir apériodique · bleu critique · orange pseudo-périodique<\/text><\/g><path d=\"M48 87.3H544\" stroke=\"currentColor\" stroke-width=\"0.8\" stroke-dasharray=\"4 4\" opacity=\".55\"/><path d=\"M48.0 206.0 L50.1 205.9 L52.1  L368.3 97.3 L370.4 96.4 L372.5 95.6 L374.5 94.8 L376.6 93.9 L378.7 93.1 L380.7 92.3 L382.8 91.5 L384.9 90.7 L386.9 89.9 L389.0 89.1 L391.1 88.3 L393.1 87.6 L395.2 86.9 L397.3 86.1 L399.3 85.4 L401.4 84.8 L403.5 84.1 L405.5 83.5 L407.6 82.9 L409.7 82.3 L411.7 81.8 L413.8 81.3 L415.9 80.8 L417.9 80.3 L420.0 79.9 L422.1 79.5 L424.1 79.1 L426.2 78.7 L428.3 78.4 L430.3 78.1 L432.4 77.9 L434.5 77.6 L436.5 77.4 L438.6 77.3 L440.7 77.1 L442.7 77.0 L444.8 76.9 L446.9 76.9 L448.9 76.8 L451.0 76.8 L453.1 76.9 L455.1 76.9 L457.2 77.0 L459.3 77.1 L461.3 77.2 L463.4 77.3 L465.5 77.5 L467.5 77.7 L469.6 77.9 L471.7 78.1 L473.7 78.3 L475.8 78.6 L477.9 78.8 L479.9 79.1 L482.0 79.4 L484.1 79.7 L486.1 80.0 L488.2 80.4 L490.3 80.7 L492.3 81.0 L494.4 81.4 L496.5 81.7 L498.5 82.1 L500.6 82.5 L502.7 82.8 L504.7 83.2 L506.8 83.6 L508.9 83.9 L510.9 84.3 L513.0 84.7 L515.1 85.1 L517.1 85.4 L519.2 85.8 L521.3 86.1 L523.3 86.5 L525.4 86.8 L527.5 87.1 L529.5 87.5 L531.6 87.8 L533.7 88.1 L535.7 88.4 L537.8 88.7 L539.9 88.9 L541.9 89.2 L544.0 89.5\" stroke=\"#D9824F\" stroke-width=\"2.6\" fill=\"none\"/><g font-family=\"sans-serif\" font-size=\"11.5\" fill=\"currentColor\"><text x=\"542\" y=\"83.3\" text-anchor=\"end\" opacity=\".85\">E<\/text><\/g><\/svg><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p><strong>Bilan d&#39;énergie.<\/strong> Multiplier $L\\dfrac{di}{dt} + R\\,i + u = E$ par $i\\,dt = C\\,du$ et intégrer de $0$ à $\\infty$ : $E \\cdot CE = \\tfrac12 C E^2 + W_J$, donc $W_J = \\tfrac12 C E^2$. La bobine n&#39;intervient pas dans le bilan global ($i(0) = i(\\infty) = 0$). Comme pour RC, l&#39;énergie $C E^2$ fournie se partage à égalité entre le condensateur et la résistance, quelles que soient $R$ et $L$.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercice 3.3 du cours · RLC série soumis à un échelon<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Un circuit RLC série ($R = 10\\ \\Omega$, $C = 50\\ \\mu\\text{F}$, $L = 10\\ \\text{mH}$) est alimenté sous $E_0 = 10\\ \\text{V}$ à la fermeture de $K$, avec $i(0) = 0$ et $u(0) = 0$. Établir l&#39;équation différentielle vérifiée par $u(t)$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Loi des mailles $u + R\\,i + L\\,\\dfrac{di}{dt} = E_0$ avec $i = C\\,\\dfrac{du}{dt}$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>$\\dfrac{d^2 u}{dt^2} + \\dfrac{R}{L}\\,\\dfrac{du}{dt} + \\dfrac{u}{LC} = \\dfrac{E_0}{LC}$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Calculer $\\omega_0$ en rad/s (nombre entier).<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>$\\omega_0 = 1/\\sqrt{LC}$ avec $LC = 5\\times 10^{-7}$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1414<\/b><\/p><p>$\\omega_0 = \\dfrac{1}{\\sqrt{10^{-2} \\times 50\\times10^{-6}}} \\approx 1414\\ \\text{rad/s}$.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Calculer $\\lambda$ en s⁻¹.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 500<\/b><\/p><p>$\\lambda = \\dfrac{R}{2L} = \\dfrac{10}{2 \\times 0{,}01} = 500\\ \\text{s}^{-1}$.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Calculer $Q$ (deux décimales).<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>$Q = L\\omega_0/R$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1.41<\/b><\/p><p>$Q = \\dfrac{L\\omega_0}{R} = \\dfrac{0{,}01 \\times 1414}{10} \\approx 1{,}41$.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>Calculer $R_c$ en ohms (une décimale).<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>$R_c = 2\\sqrt{L/C}$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 28.3<\/b><\/p><p>$R_c = 2\\sqrt{\\dfrac{L}{C}} = 2\\sqrt{200} \\approx 28{,}3\\ \\Omega$.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><p>Quel est le régime ? Calculer $\\Omega$ (rad/s, nombre entier) et la pseudo-période $T$ (ms, deux décimales).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Compare $R$ à $R_c$. Puis $\\Omega = \\sqrt{\\omega_0^2 - \\lambda^2}$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>$R = 10\\ \\Omega &lt; R_c \\approx 28{,}3\\ \\Omega$ (équivalent : $\\lambda &lt; \\omega_0$, $Q &gt; \\tfrac12$) : régime <strong>pseudo-périodique<\/strong>. $\\Omega = \\sqrt{\\omega_0^2 - \\lambda^2} \\approx 1323\\ \\text{rad/s}$ et $T = 2\\pi/\\Omega \\approx 4{,}75\\ \\text{ms}$ (à comparer à $T_0 \\approx 4{,}44\\ \\text{ms}$).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"7\"><div class=\"ex-q\"><p>Donner $u(t)$ et $i(t)$, puis le premier maximum de $u$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Avec $u(0) = 0$ et $i(0) = 0$ : $u = E_0\\left[1 - e^{-\\lambda t}\\left(\\cos\\Omega t + \\dfrac{\\lambda}{\\Omega}\\sin\\Omega t\\right)\\right]$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>$u(t) = E_0\\left[1 - e^{-\\lambda t}\\left(\\cos\\Omega t + \\dfrac{\\lambda}{\\Omega}\\sin\\Omega t\\right)\\right]$ et $i(t) = \\dfrac{E_0}{L\\Omega}\\,e^{-\\lambda t}\\sin\\Omega t$.<br>Numériquement : $u(t) = 10\\left[1 - e^{-500 t}(\\cos 1323 t + 0{,}378\\sin 1323 t)\\right]$ V et $i(t) \\approx 0{,}756\\,e^{-500 t}\\sin 1323 t$ A.<br>Premier maximum à $t = \\pi/\\Omega \\approx 2{,}37\\ \\text{ms}$ : $u_{max} = E_0\\,(1 + e^{-\\lambda\\pi/\\Omega}) \\approx 13{,}05\\ \\text{V}$, soit un dépassement d&#39;environ 30 % (tout est vérifié par calcul).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><svg viewBox=\"0 0 560 230\" role=\"img\" aria-label=\"Exercice 3.3 : tension u(t) aux bornes du condensateur, dépassement à 13,05 V à 2,37 ms puis retour vers 10 V\" style=\"max-width:100%;height:auto\"><g stroke=\"currentColor\" stroke-width=\"1.2\" fill=\"none\"><path d=\"M48 12V196\"/><path d=\"M44 196.0H550\"/><\/g><g font-family=\"sans-serif\" font-size=\"11\" fill=\"currentColor\"><path d=\"M48.0 193.0v6\" stroke=\"currentColor\" stroke-width=\"1\"/><text x=\"48.0\" y=\"212\" text-anchor=\"middle\">0<\/text><path d=\"M147.2 193.0v6\" stroke=\"currentColor\" stroke-width=\"1\"/><text x=\"147.2\" y=\"212\" text-anchor=\"middle\">2<\/text><path d=\"M246.4 193.0v6\" stroke=\"currentColor\" stroke-width=\"1\"/><text x=\"246.4\" y=\"212\" text-anchor=\"middle\">4<\/text><path d=\"M345.6 193.
