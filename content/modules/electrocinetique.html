<script>
const MODULE={"slug":"electrocinetique","titre":"Électrocinétique : régimes transitoires","cle":"electrocinetique_scores","cleEtat":"electrocinetique_scores_etat","format":"score10","intro":"<p>Ce module suit le <strong>chapitre 3 du cours de Physique 3 – Électrocinétique<\/strong> (ENSA d&#39;Al-Hoceima) : l&#39;étude des régimes transitoires des circuits linéaires.<\/p>\n<p><strong>Chaque chapitre a trois temps<\/strong><\/p>\n<ol>\n<li><strong>Avant de commencer<\/strong> : ce qu&#39;il faut déjà savoir, avec une question pour vérifier.<\/li>\n<li><strong>Comment l&#39;aborder<\/strong> : l&#39;état d&#39;esprit qui rend le chapitre simple, et le piège dans lequel presque tout le monde tombe.<\/li>\n<li><strong>Les idées, illustrées<\/strong> : un schéma, une phrase, un exemple chiffré, puis des exercices.<\/li>\n<\/ol>\n<p>Termine chaque chapitre par le QCM : <strong>8/10 = chapitre maîtrisé<\/strong>. Les exercices 3.1, 3.2 et 3.3 du cours sont placés dans les chapitres RC, RL et RLC.<\/p>\n<p><strong>Ce qui est sûr<\/strong> : le contenu vient du chapitre 3 fourni. Ce que nous avons ajouté est signalé par un encadré « Attention ».<\/p>\n<p><strong>À vérifier<\/strong> : les chapitres 1 et 2 du cours, les TD et le format du contrôle ne nous ont pas été fournis. Le semestre (S3) est supposé : corrige-le si besoin.<\/p>\n","annexes":[],"cartes":null,"maths":true};
const CHAPS=[{"id":"regime-transitoire","t":"Régime transitoire, continuité et échelon","seance":"Chapitre 3 · sections 3.1 et 3.4","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Dans une maille, la somme des tensions vaut zéro (loi des mailles). Pour un conducteur ohmique, $u = R\\,i$.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Une résistance de $100\\ \\Omega$ est parcourue par un courant de $20\\ \\text{mA}$. Quelle est la tension à ses bornes, en volts ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>$u = R\\,i$, avec $i$ en ampères.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 2<\/b><\/p><p>$u = 100 \\times 0{,}020 = 2\\ \\text{V}$. Si tu as trouvé $2000$, tu as oublié de convertir les milliampères en ampères.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Un circuit ne change pas d&#39;état d&#39;un coup : il glisse.<\/strong> Après une commutation, quelque chose met du temps à se remplir ou à se vider : l&#39;énergie stockée dans le condensateur et dans la bobine. Pose-toi toujours la question « qu&#39;est-ce qui stocke de l&#39;énergie ici ? ».<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Croire que <strong>tout<\/strong> est continu. Seules deux grandeurs ne sautent jamais : la tension $u_C$ d&#39;un condensateur et le courant $i_L$ d&#39;une bobine. Le courant $i_C$ et la tension $u_L$, eux, peuvent sauter.<\/p>\n<\/aside><p>À la fin, tu sais définir le régime transitoire, dire quelles grandeurs sont continues et pourquoi, et reconnaître un échelon de tension.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p><strong>Source de ce module.<\/strong> Il suit le chapitre 3 du cours de Physique 3, Électrocinétique, ENSA d&#39;Al-Hoceima (régimes transitoires des circuits linéaires). Les chapitres 1 et 2 du cours, les TD et le format du contrôle ne nous ont pas été fournis. Ce que nous ajoutons au cours est signalé par un encadré « Attention ».<\/p>\n<\/aside><h2>Idée 1 · Le régime transitoire est le trajet entre deux équilibres<\/h2>\n<p>Idée : après une commutation (fermeture ou ouverture d&#39;un interrupteur), le circuit passe de son <strong>ancien équilibre<\/strong> à un <strong>nouveau régime permanent<\/strong>. Le trajet s&#39;appelle le régime transitoire.<\/p>\n<svg viewBox=\"0 0 560 130\" role=\"img\" aria-label=\"Trois phases : ancien équilibre, régime transitoire, nouveau régime permanent, séparées par la commutation à t = 0 et t ≈ 5 tau\" style=\"max-width:100%;height:auto\"><defs><marker id=\"f\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"><path d=\"M0 0L8 4L0 8z\" fill=\"currentColor\"/><\/marker><\/defs><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><path d=\"M10 80H540\" marker-end=\"url(#f)\"/><path d=\"M190 30V100\" stroke=\"#D9824F\" stroke-width=\"2.5\"/><path d=\"M390 30V100\" stroke=\"#D9824F\" stroke-width=\"2.5\" stroke-dasharray=\"5 4\"/><path d=\"M10 70H190C250 70 290 40 390 38H540\" stroke=\"#D9824F\" stroke-width=\"2.2\"/><\/g><g font-family=\"sans-serif\" font-size=\"12.5\" fill=\"currentColor\" text-anchor=\"middle\"><text x=\"100\" y=\"112\">Ancien équilibre<\/text><text x=\"290\" y=\"112\">Régime transitoire<\/text><text x=\"465\" y=\"112\">Nouveau régime permanent<\/text><text x=\"190\" y=\"22\" fill=\"#D9824F\">t = 0 : commutation<\/text><text x=\"390\" y=\"22\" fill=\"#D9824F\">t ≈ 5τ<\/text><\/g><\/svg><p>Analogie hydraulique : le robinet est fermé (débit nul), on l&#39;ouvre brusquement, l&#39;eau accélère et remplit le réseau (transitoire), puis le débit devient constant (permanent).<\/p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Régime permanent : tout est stabilisé, tant que rien ne change dans le montage. Régime transitoire : courants et tensions évoluent d&#39;une ancienne valeur d&#39;équilibre vers la nouvelle. Pour une évolution exponentielle, on le considère terminé au bout de $5\\tau$ (environ 99 % de l&#39;évolution).<\/p>\n<\/aside><h2>Idée 2 · L&#39;énergie ne saute pas, donc $u_C$ et $i_L$ non plus<\/h2>\n<p>Idée : un condensateur et une bobine <strong>stockent<\/strong> de l&#39;énergie. Une énergie ne peut pas varier instantanément, sinon la puissance $p = \\dfrac{dW}{dt}$ serait infinie, ce qu&#39;aucun générateur ne peut fournir.<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Condensateur<\/th>\n<th>Bobine<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Énergie stockée<\/td>\n<td>$W_C = \\tfrac12 C u_C^2$<\/td>\n<td>$W_L = \\tfrac12 L i_L^2$<\/td>\n<\/tr>\n<tr>\n<td>Grandeur <strong>continue<\/strong><\/td>\n<td>la tension $u_C$<\/td>\n<td>le courant $i_L$<\/td>\n<\/tr>\n<tr>\n<td>Grandeur qui <strong>peut sauter<\/strong><\/td>\n<td>le courant $i_C$<\/td>\n<td>la tension $u_L$<\/td>\n<\/tr>\n<\/tbody><\/table>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Utiliser la continuité pour trouver les conditions initiales<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · Avant la commutation<\/div><p>Regarde le régime permanent d&#39;avant et calcule $u_C(0^-)$ ou $i_L(0^-)$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · Applique la continuité<\/div><p>$u_C(0^+) = u_C(0^-)$ pour un condensateur, $i_L(0^+) = i_L(0^-)$ pour une bobine.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · Déduis le reste<\/div><p>Les autres grandeurs ($i_C$, $u_L$, $u_R$) se retrouvent ensuite avec la loi des mailles et la loi d&#39;Ohm. Elles peuvent avoir un saut en $t = 0$.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Conditions initiales d&#39;un circuit : $u_C(0^+) = u_C(0^-)$ et $i_L(0^+) = i_L(0^-)$.<\/p>\n<\/aside><h2>Idée 3 · L&#39;échelon de tension : une excitation simple<\/h2>\n<p>Idée : pour étudier un transitoire, on change la tension d&#39;une valeur constante $E_1$ à une autre valeur constante $E_2$, en un temps considéré comme nul. Le cas courant est $E_1 = 0$ : on « allume » le générateur à $t = 0$.<\/p>\n<div style=\"display:flex;flex-wrap:wrap;gap:10px;justify-content:center\"><svg viewBox=\"0 0 270 160\" role=\"img\" aria-label=\"Échelon de tension montant à t = 0\" style=\"max-width:100%;height:auto\"><g stroke=\"currentColor\" stroke-width=\"1.2\" fill=\"none\"><path d=\"M48 12V126\"/><path d=\"M44 111.3H260\"/><\/g><g font-family=\"sans-serif\" font-size=\"11\" fill=\"currentColor\"><path d=\"M89.2 108.3v6\" stroke=\"currentColor\" stroke-width=\"1\"/><text x=\"89.2\" y=\"142\" text-anchor=\"middle\">0<\/text><path d=\"M45 111.3h6\" stroke=\"currentColor\" stroke-width=\"1\"/><text x=\"41\" y=\"115.3\" text-anchor=\"end\">0<\/text><path d=\"M45 38.0h6\" stroke=\"currentColor\" stroke-width=\"1\"/><text x=\"41\" y=\"42.0\" text-anchor=\"end\">E<\/text><text x=\"254\" y=\"154\" text-anchor=\"end\" font-style=\"italic\">t<\/text><text x=\"54\" y=\"22\" font-style=\"italic\">e(t)<\/text><\/g><path d=\"M48.0 111.3 L48.9 111.3 L49.7 111.3 L50.6 111.3 L51.4 111.3 L52.3 111.3 L53.1 111.3 L54.0 111.3 L54.9 111.3 L55.7 111.3 L56.6 111.3 L57.4 111.3 L58.3 111.3 L59.2 111.3 L60.0 111.3 L60.9 111.3 L61.7 111.3 L62.6 111.3 L63.5 111.3 L64.3 111.3 L65.2 111.3 L66.0 111.3 L66.9 111.3 L67.7 111.3 L68.6 111.3 L69.5 111.3 L70.3 111.3 L71.2 111.3 L72.0 111.3 L72.9 111.3 L73.8 111.3 L74.6 111.3 L75.5 111.3 L76.3 111.3 L77.2 111.3 L78.0 111.3 L78.9 111.3 L79.8 111.3 L80.6 111.3 L81.5 111.3 L82.3 111.3 L83.2 111.3 L 11.3 L230.0 111.3 L230.8 111.3 L231.7 111.3 L232.5 111.3 L233.4 111.3 L234.3 111.3 L235.1 111.3 L236.0 111.3 L236.8 111.3 L237.7 111.3 L238.6 111.3 L239.4 111.3 L240.3 111.3 L241.1 111.3 L242.0 111.3 L242.8 111.3 L243.7 111.3 L244.6 111.3 L245.4 111.3 L246.3 111.3 L247.1 111.3 L248.0 111.3 L248.8 111.3 L249.7 111.3 L250.6 111.3 L251.4 111.3 L252.3 111.3 L253.1 111.3 L254.0 111.3\" stroke=\"#D9824F\" stroke-width=\"2.4\" fill=\"none\"/><g font-family=\"sans-serif\" font-size=\"11.5\" fill=\"currentColor\"><\/g><\/svg><\/div><ul>\n<li>On le produit avec un <strong>interrupteur<\/strong> (fermeture : $0 \\to E$ ; ouverture : $E \\to 0$) ou avec un <strong>GBF en mode créneau<\/strong>, qui répète l&#39;échelon plusieurs fois par seconde et permet de voir la réponse à l&#39;oscilloscope.<\/li>\n<li>Il provoque le régime transitoire et permet de mesurer la <strong>constante de temps $\\tau$<\/strong>, le temps de réponse et la valeur finale.<\/li>\n<\/ul>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p><strong>Ajout hors cours.<\/strong> Le cours donne deux grandeurs pour décrire un transitoire : la constante de temps $\\tau$ (systèmes du premier ordre, évolution en $e^{-t/\\tau}$) et le facteur de qualité $Q$ (systèmes oscillants). On les retrouve aux chapitres suivants du module.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Continuité : qui saute, qui ne saute pas<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Un condensateur initialement déchargé est relié à un générateur de tension $E$ à travers une résistance $R$, à $t = 0$. Donner $u_C(0^+)$ et dire si le courant $i$ est continu en $t = 0$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Quelle grandeur du condensateur est continue ? Applique-la, puis la loi des mailles.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>$u_C(0^+) = u_C(0^-) = 0$ par continuité de la tension du condensateur. La loi des mailles donne alors $E = R\\,i(0^+) + 0$, donc $i(0^+) = E/R$ alors que $i(0^-) = 0$ : le courant <strong>n&#39;est pas continu<\/strong>, il saute de $0$ à $E/R$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Une bobine idéale parcourue par un courant $I_0$ est mise en série avec une résistance $R$ à $t = 0$. Qu&#39;est-ce qui est continu en $t = 0$ : $i_L$ ou $u_L$ ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Quelle énergie est stockée dans une bobine ?<\/p>\n<\/div><div class=\"ex-c\" hidden><p>$i_L$ est continu, car $W_L = \\tfrac12 L i_L^2$ ne peut pas varier instantanément. La tension $u_L = L\\,\\dfrac{di}{dt}$ peut présenter un saut.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Pourquoi $u_C$ ne peut-elle pas être discontinue ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Si $u_C$ sautait, l&#39;énergie $\\tfrac12 C u_C^2$ sauterait aussi. La puissance $p = \\dfrac{dW}{dt}$ serait alors infinie, ce qu&#39;aucun générateur ne peut fournir.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Le régime transitoire est…<\/div><button class=\"opt\" data-o=\"0\">le régime stable atteint après longtemps<\/button><button class=\"opt\" data-o=\"1\">la phase pendant laquelle le circuit évolue entre son ancien équilibre et son nouveau régime permanent<\/button><button class=\"opt\" data-o=\"2\">le régime obtenu avec un générateur alternatif<\/button><button class=\"opt\" data-o=\"3\">le régime d&#39;un circuit sans composants<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Quelle grandeur est toujours continue aux bornes d&#39;un condensateur ?<\/div><button class=\"opt\" data-o=\"0\">le courant $i_C$<\/button><button class=\"opt\" data-o=\"1\">la tension $u_C$<\/button><button class=\"opt\" data-o=\"2\">la puissance reçue<\/button><button class=\"opt\" data-o=\"3\">la charge de l&#39;armature négative uniquement<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Quelle grandeur est toujours continue dans une bobine ?<\/div><button class=\"opt\" data-o=\"0\">la tension $u_L$<\/button><button class=\"opt\" data-o=\"1\">le courant $i_L$<\/button><button class=\"opt\" data-o=\"2\">la tension et le courant à la fois<\/button><button class=\"opt\" data-o=\"3\">aucune<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Parmi ces grandeurs, laquelle peut subir une discontinuité ?<\/div><button class=\"opt\" data-o=\"0\">$u_C$<\/button><button class=\"opt\" data-o=\"1\">$i_L$<\/button><button class=\"opt\" data-o=\"2\">$u_L$<\/button><button class=\"opt\" data-o=\"3\">l&#39;énergie $W_C$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Pourquoi l&#39;énergie stockée ne peut-elle pas varier instantanément ?<\/div><button class=\"opt\" data-o=\"0\">parce que les composants sont parfaits<\/button><button class=\"opt\" data-o=\"1\">parce que la puissance $p = dW/dt$ serait alors infinie<\/button><button class=\"opt\" data-o=\"2\">parce que la résistance est toujours non nulle<\/button><button class=\"opt\" data-o=\"3\">parce que la tension est alternative<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Un échelon de tension est…<\/div><button class=\"opt\" data-o=\"0\">une tension qui croît progressivement<\/button><button class=\"opt\" data-o=\"1\">un changement brusque de la tension d&#39;une valeur constante à une autre, en un temps considéré comme nul<\/button><button class=\"opt\" data-o=\"2\">une tension sinusoïdale<\/button><button class=\"opt\" data-o=\"3\">une tension nulle<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Comment obtient-on expérimentalement des échelons répétés pour les voir à l&#39;oscilloscope ?<\/div><button class=\"opt\" data-o=\"0\">avec un voltmètre<\/button><button class=\"opt\" data-o=\"1\">avec un GBF en mode créneau<\/button><button class=\"opt\" data-o=\"2\">avec un multimètre en mode ohmmètre<\/button><button class=\"opt\" data-o=\"3\">avec un transformateur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">On considère qu&#39;une évolution exponentielle est pratiquement terminée au bout de…<\/div><button class=\"opt\" data-o=\"0\">$\\tau/2$<\/button><button class=\"opt\" data-o=\"1\">$\\tau$<\/button><button class=\"opt\" data-o=\"2\">$5\\tau$<\/button><button class=\"opt\" data-o=\"3\">$50\\tau$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Un condensateur déchargé est relié à un générateur $E$ par une résistance $R$ à $t = 0$. Que vaut $i(0^+)$ ?<\/div><button class=\"opt\" data-o=\"0\">$0$<\/button><button class=\"opt\" data-o=\"1\">$E/R$<\/button><button class=\"opt\" data-o=\"2\">$E\\,R$<\/button><button class=\"opt\" data-o=\"3\">$E/(RC)$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Une bobine $L$ est parcourue par $I_0$ juste avant une commutation. Que vaut $i_L(0^+)$ ?<\/div><button class=\"opt\" data-o=\"0\">$0$<\/button><button class=\"opt\" data-o=\"1\">$I_0$<\/button><button class=\"opt\" data-o=\"2\">$I_0/2$<\/button><button class=\"opt\" data-o=\"3\">$L\\,I_0$<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"regime-transitoire","rep":["2"],"tol":null},{"n":"regime-transitoire","rep":null,"tol":null},{"n":"regime-transitoire","rep":null,"tol":null},{"n":"regime-transitoire","rep":null,"tol":null}],"qcm":[{"n":"regime-transitoire","q":"Le régime transitoire est…","o":["le régime stable atteint après longtemps","la phase pendant laquelle le circuit évolue entre son ancien équilibre et son nouveau régime permanent","le régime obtenu avec un générateur alternatif","le régime d&#39;un circuit sans composants"],"a":1,"e":"C&#39;est la période d&#39;évolution après une commutation, avant que les grandeurs se stabilisent."},{"n":"regime-transitoire","q":"Quelle grandeur est toujours continue aux bornes d&#39;un condensateur ?","o":["le courant $i_C$","la tension $u_C$","la puissance reçue","la charge de l&#39;armature négative uniquement"],"a":1,"e":"$W_C = \\tfrac12 C u_C^2$ ne peut pas sauter : $u_C$ est continue."},{"n":"regime-transitoire","q":"Quelle grandeur est toujours continue dans une bobine ?","o":["la tension $u_L$","le courant $i_L$","la tension et le courant à la fois","aucune"],"a":1,"e":"$W_L = \\tfrac12 L i_L^2$ ne peut pas sauter : $i_L$ est continu."},{"n":"regime-transitoire","q":"Parmi ces grandeurs, laquelle peut subir une discontinuité ?","o":["$u_C$","$i_L$","$u_L$","l&#39;énergie $W_C$"],"a":2,"e":"$u_L = L\\,\\dfrac{di}{dt}$ peut sauter si $i_L$ change brutalement de pente. $u_C$, $i_L$ et les énergies sont continues."},{"n":"regime-transitoire","q":"Pourquoi l&#39;énergie stockée ne peut-elle pas varier instantanément ?","o":["parce que les composants sont parfaits","parce que la puissance $p = dW/dt$ serait alors infinie","parce que la résistance est toujours non nulle","parce que la tension est alternative"],"a":1,"e":"Un générateur ne peut pas fournir une puissance infinie."},{"n":"regime-transitoire","q":"Un échelon de tension est…","o":["une tension qui croît progressivement","un changement brusque de la tension d&#39;une valeur constante à une autre, en un temps considéré comme nul","une tension sinusoïdale","une tension nulle"],"a":1,"e":"C&#39;est l&#39;excitation de base pour provoquer un transitoire."},{"n":"regime-transitoire","q":"Comment obtient-on expérimentalement des échelons répétés pour les voir à l&#39;oscilloscope ?","o":["avec un voltmètre","avec un GBF en mode créneau","avec un multimètre en mode ohmmètre","avec un transformateur"],"a":1,"e":"Le GBF en créneau répète l&#39;échelon plusieurs fois par seconde."},{"n":"regime-transitoire","q":"On considère qu&#39;une évolution exponentielle est pratiquement terminée au bout de…","o":["$\\tau/2$","$\\tau$","$5\\tau$","$50\\tau$"],"a":2,"e":"À $5\\tau$, on a atteint environ 99 % de l&#39;évolution."},{"n":"regime-transitoire","q":"Un condensateur déchargé est relié à un générateur $E$ par une résistance $R$ à $t = 0$. Que vaut $i(0^+)$ ?","o":["$0$","$E/R$","$E\\,R$","$E/(RC)$"],"a":1,"e":"$u_C(0^+) = 0$, donc toute la tension est aux bornes de $R$ : $i(0^+) = E/R$."},{"n":"regime-transitoire","q":"Une bobine $L$ est parcourue par $I_0$ juste avant une commutation. Que vaut $i_L(0^+)$ ?","o":["$0$","$I_0$","$I_0/2$","$L\\,I_0$"],"a":1,"e":"$i_L$ est continu : $i_L(0^+) = i_L(0^-) = I_0$."}]},{"id":"condensateur-bobine","t":"Le condensateur et la bobine","seance":"Chapitre 3 · sections 3.2 et 3.3","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>L&#39;intensité est le débit de charge : $i = \\dfrac{dq}{dt}$. Et la dérivée d&#39;une fonction constante est nulle.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Une grandeur $x(t)$ est constante dans le temps. Que vaut $\\dfrac{dx}{dt}$ ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0<\/b><\/p><p>$0$. C&#39;est la clé du régime permanent : tout ce qui est écrit avec une dérivée disparaît quand les grandeurs sont constantes.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « comment ce composant réagit quand tout est constant ».<\/strong> Le condensateur ne laisse plus passer de courant (interrupteur ouvert), la bobine n&#39;a plus de tension (un fil). Avec ça, tu trouves le régime final d&#39;un circuit sans résoudre d&#39;équation.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Appliquer aux condensateurs les règles des résistances. Pour les condensateurs, c&#39;est <strong>inversé<\/strong> : en parallèle les capacités s&#39;ajoutent, en série ce sont les inverses.<\/p>\n<\/aside><p>À la fin, tu sais écrire la relation tension-courant du condensateur et de la bobine, donner leur comportement en régime permanent et leur énergie, et associer plusieurs composants.<\/p>\n<h2>Idée 1 · Le condensateur : $i = C\\,\\dfrac{du}{dt}$<\/h2>\n<p>Idée : deux armatures séparées par un isolant (le diélectrique). Sous une tension $u$, l&#39;armature qui reçoit le courant porte la charge $+q$, l&#39;autre $-q$. La capacité $C$ (en farads) mesure l&#39;aptitude à accumuler des charges.<\/p>\n<p>$$q(t) = C\\,u(t) \\qquad\\text{et}\\qquad i(t) = \\frac{dq}{dt} = C\\,\\frac{du(t)}{dt}$$<\/p>\n<ul>\n<li><strong>Régime permanent continu<\/strong> : $u$ est constante, donc $i = 0$. Le condensateur se comporte comme un <strong>interrupteur ouvert<\/strong>.<\/li>\n<li><strong>Énergie emmagasinée<\/strong> : $W_C = \\tfrac12 C u^2 = \\dfrac{q^2}{2C}$.<\/li>\n<li><strong>Récepteur ou générateur<\/strong> : si l&#39;énergie augmente ($p = u\\,i &gt; 0$) il se charge, donc il est récepteur ; si elle diminue ($p &lt; 0$) il se décharge, donc il est générateur.<\/li>\n<\/ul>\n<h2>Idée 2 · La bobine : $u = L\\,\\dfrac{di}{dt}$<\/h2>\n<p>Idée : un enroulement de spires. Quand le courant $i$ varie, il crée un champ magnétique variable, dont le flux fait apparaître une tension : c&#39;est l&#39;<strong>auto-induction<\/strong>.<\/p>\n<p>$$u = L\\,\\frac{di}{dt}\\ \\text{(bobine idéale)} \\qquad u = L\\,\\frac{di}{dt} + r\\,i\\ \\text{(bobine réelle, résistance interne } r\\text{)}$$<\/p>\n<ul>\n<li><strong>Loi de Lenz<\/strong> : la f.é.m. d&#39;auto-induction $e = -L\\,\\dfrac{di}{dt}$ s&#39;oppose à la variation du courant. La bobine « freine » toute variation brutale.<\/li>\n<li><strong>Régime permanent continu<\/strong> : $i$ est constant, donc $u = r\\,i$. Une bobine idéale est un <strong>fil<\/strong> ; une bobine réelle est un conducteur ohmique de résistance $r$.<\/li>\n<li><strong>Énergie emmagasinée<\/strong> : $W_L = \\tfrac12 L i^2$. Une bobine réelle dissipe en plus de l&#39;énergie par effet Joule dans $r$.<\/li>\n<\/ul>\n<svg viewBox=\"0 0 560 150\" role=\"img\" aria-label=\"Régime permanent continu : le condensateur se comporte comme un interrupteur ouvert, la bobine comme un fil\" style=\"max-width:100%;height:auto\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><path d=\"M20 60H80M80 40V80M96 40V80M96 60H150\"/><path d=\"M330 60H400C404 40 412 40 416 60C420 40 428 40 432 60C436 40 444 40 448 60H520\"/><path d=\"M180 60H215M215 60l22-18\" stroke=\"#D9824F\"/><path d=\"M470 62H520\" stroke=\"#D9824F\" stroke-width=\"3\" opacity=\"0\"/><\/g><g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\"><text x=\"88\" y=\"110\">Condensateur<\/text><text x=\"88\" y=\"130\" fill=\"#D9824F\">régime permanent : interrupteur ouvert (i = 0)<\/text><text x=\"425\" y=\"110\">Bobine<\/text><text x=\"425\" y=\"130\" fill=\"#D9824F\">régime permanent : fil (u = 0)<\/text><\/g><\/svg><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Condensateur ($C$)<\/th>\n<th>Bobine ($L$)<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Forme d&#39;énergie<\/td>\n<td>électrique (champ entre les armatures)<\/td>\n<td>magnétique (champ créé par le courant)<\/td>\n<\/tr>\n<tr>\n<td>Énergie stockée<\/td>\n<td>$\\tfrac12 C u^2$<\/td>\n<td>$\\tfrac12 L i^2$<\/td>\n<\/tr>\n<tr>\n<td>Grandeur continue<\/td>\n<td>la tension $u$<\/td>\n<td>le courant $i$<\/td>\n<\/tr>\n<tr>\n<td>Relation $u$-$i$<\/td>\n<td>$i = C\\,\\dfrac{du}{dt}$<\/td>\n<td>$u = L\\,\\dfrac{di}{dt}$<\/td>\n<\/tr>\n<tr>\n<td>Régime permanent continu<\/td>\n<td>interrupteur ouvert ($i = 0$)<\/td>\n<td>fil ($u = 0$)<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h2>Idée 3 · Associer des composants<\/h2>\n<p>Idée : les bobines (sans couplage magnétique) s&#39;associent comme les résistances. Les condensateurs, <strong>à l&#39;inverse<\/strong>.<\/p>\n<table>\n<thead>\n<tr>\n<th>Association<\/th>\n<th>Condensateurs<\/th>\n<th>Bobines<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Série<\/td>\n<td>$\\dfrac{1}{C_{eq}} = \\dfrac1{C_1} + \\dfrac1{C_2} + \\dfrac1{C_3}$ (même charge $Q$)<\/td>\n<td>$L_{eq} = L_1 + L_2$<\/td>\n<\/tr>\n<tr>\n<td>Parallèle<\/td>\n<td>$C_{eq} = C_1 + C_2 + C_3$ (même tension)<\/td>\n<td>$\\dfrac1{L_{eq}} = \\dfrac1{L_1} + \\dfrac1{L_2}$<\/td>\n<\/tr>\n<\/tbody><\/table>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Calculer charges et tensions : $C_1 = 10\\ \\mu\\text{F}$ en parallèle avec ($C_2 = 22\\ \\mu\\text{F}$ en série avec $C_3 = 6{,}8\\ \\mu\\text{F}$), sous $15\\ \\text{V}$<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · $C_1$ est seul sur le générateur<\/div><p>$U_{C_1} = 15\\ \\text{V}$ et $Q_1 = C_1 U_{C_1} = 150\\ \\mu\\text{C}$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · $C_2$ et $C_3$ sont en série<\/div><p>Même charge $Q$, et leurs tensions s&#39;ajoutent : $\\dfrac{Q}{C_2} + \\dfrac{Q}{C_3} = E$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Calcule la charge commune<\/div><p>$Q_2 = Q_3 = E\\,\\dfrac{C_2 C_3}{C_2 + C_3} \\approx 77{,}9\\ \\mu\\text{C}$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Déduis les tensions<\/div><p>$U_{C_2} = Q_2/C_2 \\approx 3{,}54\\ \\text{V}$ et $U_{C_3} = Q_3/C_3 \\approx 11{,}46\\ \\text{V}$. Leur somme vaut bien $15\\ \\text{V}$.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Condensateurs : parallèle = somme, série = inverse des inverses. En série, même charge $Q$. En parallèle, même tension.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exemple du cours : condensateurs en série et en parallèle (circuit b)<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Un générateur de $12\\ \\text{V}$ alimente $C_1 = 100\\ \\text{nF}$ en série avec le groupe formé de $C_2 = 22\\ \\text{nF}$ et $C_3 = 68\\ \\text{nF}$ en parallèle, lui-même en série avec $C_4 = 33\\ \\text{nF}$. Calculer $C_{eq}$ en nF (arrondir au dixième).<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>Commence par le parallèle : $C_{23} = C_2 + C_3$. Puis les trois condensateurs en série.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 19.5<\/b><\/p><p>$C_{23} = 22 + 68 = 90\\ \\text{nF}$. En série : $\\dfrac1{C_{eq}} = \\dfrac1{100} + \\dfrac1{90} + \\dfrac1{33} \\approx 0{,}0514\\ \\text{nF}^{-1}$, donc $C_{eq} \\approx 19{,}45\\ \\text{nF}$.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Quelle est la charge $Q$ des éléments en série, et la tension $U_{C_2}$ aux bornes du groupe parallèle ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>$Q = E\\,C_{eq}$ ; puis $U_{C_1} = Q/C_1$, $U_{C_4} = Q/C_4$ et la loi des mailles.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>$Q = E\\,C_{eq} \\approx 233{,}4\\ \\text{nC}$. $U_{C_1} = Q/C_1 \\approx 2{,}33\\ \\text{V}$ et $U_{C_4} = Q/C_4 \\approx 7{,}07\\ \\text{V}$. Loi des mailles : $U_{C_2} = U_{C_3} = 12 - 2{,}33 - 7{,}07 \\approx 2{,}59\\ \\text{V}$. Charges : $Q_2 = C_2 U \\approx 57{,}1\\ \\text{nC}$ et $Q_3 = C_3 U \\approx 176{,}3\\ \\text{nC}$ ; on vérifie $Q_2 + Q_3 = Q$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Énergie et régime permanent<\/h3><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Un condensateur de $100\\ \\mu\\text{F}$ est chargé sous $12\\ \\text{V}$. Quelle énergie stocke-t-il, en mJ ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>$W_C = \\tfrac12 C u^2$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 7.2<\/b><\/p><p>$W_C = \\tfrac12 \\times 100\\times10^{-6} \\times 12^2 = 7{,}2\\ \\text{mJ}$ (vérifié par calcul).<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Une bobine idéale de $0{,}5\\ \\text{H}$ est parcourue par un courant constant de $0{,}1\\ \\text{A}$. Quelle est la tension à ses bornes et l&#39;énergie stockée, en mJ ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>En régime permanent continu, $\\dfrac{di}{dt} = 0$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>$u = L\\,\\dfrac{di}{dt} = 0$ : la bobine idéale se comporte comme un fil. $W_L = \\tfrac12 L i^2 = \\tfrac12 \\times 0{,}5 \\times 0{,}1^2 = 2{,}5\\ \\text{mJ}$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>Deux condensateurs de $10\\ \\mu\\text{F}$ sont montés en série. Quelle est la capacité équivalente ? Et en parallèle ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>En série : $\\dfrac1{C_{eq}} = \\dfrac1{10} + \\dfrac1{10} = \\dfrac15$, donc $C_{eq} = 5\\ \\mu\\text{F}$. En parallèle : $C_{eq} = 10 + 10 = 20\\ \\mu\\text{F}$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 9 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">La relation courant-tension d&#39;un condensateur est…<\/div><button class=\"opt\" data-o=\"0\">$u = C\\,\\dfrac{di}{dt}$<\/button><button class=\"opt\" data-o=\"1\">$i = C\\,\\dfrac{du}{dt}$<\/button><button class=\"opt\" data-o=\"2\">$i = \\dfrac{u}{C}$<\/button><button class=\"opt\" data-o=\"3\">$u = C\\,i$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">En régime permanent continu, un condensateur se comporte comme…<\/div><button class=\"opt\" data-o=\"0\">un fil<\/button><button class=\"opt\" data-o=\"1\">un interrupteur ouvert<\/button><button class=\"opt\" data-o=\"2\">un conducteur ohmique<\/button><button class=\"opt\" data-o=\"3\">un générateur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">En régime permanent continu, une bobine idéale se comporte comme…<\/div><button class=\"opt\" data-o=\"0\">un fil<\/button><button class=\"opt\" data-o=\"1\">un interrupteur ouvert<\/button><button class=\"opt\" data-o=\"2\">une résistance infinie<\/button><button class=\"opt\" data-o=\"3\">un condensateur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">L&#39;énergie emmagasinée dans une bobine est…<\/div><button class=\"opt\" data-o=\"0\">$\\tfrac12 L i$<\/button><button class=\"opt\" data-o=\"1\">$L i^2$<\/button><button class=\"opt\" data-o=\"2\">$\\tfrac12 L i^2$<\/button><button class=\"opt\" data-o=\"3\">$\\tfrac12 L^2 i$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Deux condensateurs de $10\\ \\mu\\text{F}$ en série ont pour capacité équivalente…<\/div><button class=\"opt\" data-o=\"0\">$20\\ \\mu\\text{F}$<\/button><button class=\"opt\" data-o=\"1\">$5\\ \\mu\\text{F}$<\/button><button class=\"opt\" data-o=\"2\">$10\\ \\mu\\text{F}$<\/button><button class=\"opt\" data-o=\"3\">$1\\ \\mu\\text{F}$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Deux condensateurs de $10\\ \\mu\\text{F}$ en parallèle ont pour capacité équivalente…<\/div><button class=\"opt\" data-o=\"0\">$20\\ \\mu\\text{F}$<\/button><button class=\"opt\" data-o=\"1\">$5\\ \\mu\\text{F}$<\/button><button class=\"opt\" data-o=\"2\">$10\\ \\mu\\text{F}$<\/button><button class=\"opt\" data-o=\"3\">$100\\ \\mu\\text{F}$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Deux condensateurs en série portent…<\/div><button class=\"opt\" data-o=\"0\">la même tension<\/button><button class=\"opt\" data-o=\"1\">la même charge<\/button><button class=\"opt\" data-o=\"2\">des courants différents en régime permanent<\/button><button class=\"opt\" data-o=\"3\">des énergies égales<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Une bobine réelle de résistance interne $r$, en régime permanent continu, se comporte comme…<\/div><button class=\"opt\" data-o=\"0\">un fil sans résistance<\/button><button class=\"opt\" data-o=\"1\">un interrupteur ouvert<\/button><button class=\"opt\" data-o=\"2\">un conducteur ohmique de résistance $r$<\/button><button class=\"opt\" data-o=\"3\">un condensateur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Quelle énergie stocke un condensateur de $100\\ \\mu\\text{F}$ chargé sous $12\\ \\text{V}$ ?<\/div><button class=\"opt\" data-o=\"0\">$1{,}2\\ \\text{mJ}$<\/button><button class=\"opt\" data-o=\"1\">$14{,}4\\ \\text{mJ}$<\/button><button class=\"opt\" data-o=\"2\">$7{,}2\\ \\text{mJ}$<\/button><button class=\"opt\" data-o=\"3\">$72\\ \\text{mJ}$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">La loi de Lenz indique que la f.é.m. d&#39;auto-induction…<\/div><button class=\"opt\" data-o=\"0\">favorise la variation du courant<\/button><button class=\"opt\" data-o=\"1\">s&#39;oppose à la variation du courant<\/button><button class=\"opt\" data-o=\"2\">est toujours nulle<\/button><button class=\"opt\" data-o=\"3\">ne dépend que de $R$<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"condensateur-bobine","rep":["0"],"tol":null},{"n":"condensateur-bobine","rep":["19.5"],"tol":0.1},{"n":"condensateur-bobine","rep":null,"tol":null},{"n":"condensateur-bobine","rep":["7.2"],"tol":0.05},{"n":"condensateur-bobine","rep":null,"tol":null},{"n":"condensateur-bobine","rep":null,"tol":null}],"qcm":[{"n":"condensateur-bobine","q":"La relation courant-tension d&#39;un condensateur est…","o":["$u = C\\,\\dfrac{di}{dt}$","$i = C\\,\\dfrac{du}{dt}$","$i = \\dfrac{u}{C}$","$u = C\\,i$"],"a":1,"e":"La charge $q = C u$ et $i = dq/dt$ donnent $i = C\\,du/dt$."},{"n":"condensateur-bobine","q":"En régime permanent continu, un condensateur se comporte comme…","o":["un fil","un interrupteur ouvert","un conducteur ohmique","un générateur"],"a":1,"e":"$u$ est constante, donc $i = C\\,du/dt = 0$."},{"n":"condensateur-bobine","q":"En régime permanent continu, une bobine idéale se comporte comme…","o":["un fil","un interrupteur ouvert","une résistance infinie","un condensateur"],"a":0,"e":"$i$ est constant, donc $u = L\\,di/dt = 0$."},{"n":"condensateur-bobine","q":"L&#39;énergie emmagasinée dans une bobine est…","o":["$\\tfrac12 L i$","$L i^2$","$\\tfrac12 L i^2$","$\\tfrac12 L^2 i$"],"a":2,"e":"$W_L = \\tfrac12 L i^2$."},{"n":"condensateur-bobine","q":"Deux condensateurs de $10\\ \\mu\\text{F}$ en série ont pour capacité équivalente…","o":["$20\\ \\mu\\text{F}$","$5\\ \\mu\\text{F}$","$10\\ \\mu\\text{F}$","$1\\ \\mu\\text{F}$"],"a":1,"e":"$\\dfrac1{C_{eq}} = \\dfrac1{10} + \\dfrac1{10} = \\dfrac15$, donc $C_{eq} = 5\\ \\mu\\text{F}$."},{"n":"condensateur-bobine","q":"Deux condensateurs de $10\\ \\mu\\text{F}$ en parallèle ont pour capacité équivalente…","o":["$20\\ \\mu\\text{F}$","$5\\ \\mu\\text{F}$","$10\\ \\mu\\text{F}$","$100\\ \\mu\\text{F}$"],"a":0,"e":"En parallèle, les capacités s&#39;ajoutent."},{"n":"condensateur-bobine","q":"Deux condensateurs en série portent…","o":["la même tension","la même charge","des courants différents en régime permanent","des énergies égales"],"a":1,"e":"En série, les armatures reliées échangent les mêmes charges : même $Q$."},{"n":"condensateur-bobine","q":"Une bobine réelle de résistance interne $r$, en régime permanent continu, se comporte comme…","o":["un fil sans résistance","un interrupteur ouvert","un conducteur ohmique de résistance $r$","un condensateur"],"a":2,"e":"$u = L\\,di/dt + r\\,i = r\\,i$ quand $i$ est constant."},{"n":"condensateur-bobine","q":"Quelle énergie stocke un condensateur de $100\\ \\mu\\text{F}$ chargé sous $12\\ \\text{V}$ ?","o":["$1{,}2\\ \\text{mJ}$","$14{,}4\\ \\text{mJ}$","$7{,}2\\ \\text{mJ}$","$72\\ \\text{mJ}$"],"a":2,"e":"$\\tfrac12 \\times 100\\times10^{-6} \\times 144 = 7{,}2\\ \\text{mJ}$."},{"n":"condensateur-bobine","q":"La loi de Lenz indique que la f.é.m. d&#39;auto-induction…","o":["favorise la variation du courant","s&#39;oppose à la variation du courant","est toujours nulle","ne dépend que de $R$"],"a":1,"e":"$e = -L\\,di/dt$ : le signe moins traduit l&#39;opposition à la variation."}]},{"id":"circuit-rc","t":"Le circuit RC : charge et décharge","seance":"Chapitre 3 · section 3.5","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>La loi des mailles dit que la somme des tensions d&#39;une maille vaut la tension du générateur. Et la fonction $e^{-t/\\tau}$ vaut $1$ en $t = 0$ et tend vers $0$.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Que vaut $e^{-t/\\tau}$ pour $t = \\tau$ ? (valeur décimale, deux chiffres après la virgule)<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>$e^{-1}$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.37<\/b><\/p><p>$e^{-1} \\approx 0{,}37$. Retiens ce nombre : il revient partout dans ce chapitre (63 % et 37 %).<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « τ » avant de penser « formule ».<\/strong> Tout circuit du premier ordre fait la même chose : il rejoint sa valeur finale en suivant $e^{-t/\\tau}$. À $t = \\tau$ il a fait 63 % du chemin, à $5\\tau$ il a presque fini. Si tu connais $\\tau$ et les deux valeurs (initiale et finale), tu connais toute la courbe.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Écrire $u(t) = E\\,e^{-t/\\tau}$ pour la <strong>charge<\/strong>. La charge monte vers $E$ : $u = E\\,(1 - e^{-t/\\tau})$. La forme $E\\,e^{-t/\\tau}$ est celle de la <strong>décharge<\/strong>.<\/p>\n<\/aside><p>À la fin, tu sais établir l&#39;équation du circuit RC, donner $u(t)$ et $i(t)$ à la charge et à la décharge, lire $\\tau$ sur une courbe, et faire le bilan d&#39;énergie.<\/p>\n<h2>Idée 1 · L&#39;équation du circuit RC<\/h2>\n<p>Idée : la loi des mailles relie $E$, la tension aux bornes de $R$ et celle du condensateur. Avec $i = C\\,\\dfrac{du}{dt}$, on obtient une équation différentielle du <strong>premier ordre<\/strong>.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Établir l'équation (charge sous $e(t) = E$ à $t = 0$)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Loi des mailles<\/div><p>$E = R\\,i(t) + u(t)$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Relation du condensateur<\/div><p>$i = C\\,\\dfrac{du}{dt}$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Remplace $i$<\/div><p>$E = RC\\,\\dfrac{du}{dt} + u$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Pose $\\tau = RC$<\/div><p>$\\tau\\,\\dfrac{du}{dt} + u = E$. C&#39;est l&#39;équation du circuit RC.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Circuit RC : $\\tau\\,\\dfrac{du}{dt} + u = E$ avec $\\tau = RC$. Homogénéité : $\\Omega \\cdot \\text{F} = \\text{s}$.<\/p>\n<\/aside><h2>Idée 2 · La charge : $u(t) = E\\,(1 - e^{-t/\\tau})$<\/h2>\n<p>Idée : la solution générale est la somme d&#39;une solution de l&#39;équation <strong>sans second membre<\/strong> (régime libre) et d&#39;une solution <strong>particulière<\/strong> (régime permanent).<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Résoudre l'équation de la charge<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Solution homogène<\/div><p>$\\tau\\,u' + u = 0$ donne $u_h(t) = B\\,e^{-t/\\tau}$ (séparation des variables).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · Solution particulière<\/div><p>En régime permanent, $u$ est constante, donc $u' = 0$ et $u_p = E$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · Solution complète<\/div><p>$u(t) = B\\,e^{-t/\\tau} + E$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · Condition initiale<\/div><p>Par continuité de $u_C$, $u(0^+) = u(0^-) = 0$, donc $B = -E$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · Résultat<\/div><p>$u(t) = E\\,(1 - e^{-t/\\tau})$ et $i(t) = C\\,\\dfrac{du}{dt} = \\dfrac{E}{R}\\,e^{-t/\\tau}$.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><svg viewBox=\"0 0 560 240\" role=\"img\" aria-label=\"Charge d'un condensateur : u(t)/E monte vers 1, i(t)/(E/R) descend vers 0, tangente à l'origine coupant l'asymptote en t = tau\" style=\"max-width:100%;height:auto\"><g stroke=\"currentColor\" stroke-width=\"1.2\" fill=\"none\"><path d=\"M48 12V206\"/><path d=\"M44 206.0H550\"/><\/g><g font-family=\"sans-serif\" font-size=\"11\" fill=\"currentColor\"><path d=\"M143.4 203.0v6\" stroke=\"currentColor\" stroke-width=\"1\"/><text x=\"143.4\" y=\"222\" text-anchor=\"middle\">1τ<\/text><path d=\"M238.8 203.0v6\" stroke=\"currentColor\" stroke-width=\"1\"/><text x=\"238.8\" y=\"222\" text-anchor=\"middle\">2τ<\/tex  197.1 L329.1 197.3 L331.1 197.5 L333.2 197.7 L335.3 197.9 L337.3 198.0 L339.4 198.2 L341.5 198.4 L343.5 198.5 L345.6 198.7 L347.7 198.9 L349.7 199.0 L351.8 199.2 L353.9 199.3 L355.9 199.5 L358.0 199.6 L360.1 199.7 L362.1 199.9 L364.2 200.0 L366.3 200.1 L368.3 200.3 L370.4 200.4 L372.5 200.5 L374.5 200.6 L376.6 200.7 L378.7 200.8 L380.7 201.0 L382.8 201.1 L384.9 201.2 L386.9 201.3 L389.0 201.4 L391.1 201.5 L393.1 201.6 L395.2 201.7 L397.3 201.8 L399.3 201.8 L401.4 201.9 L403.5 202.0 L405.5 202.1 L407.6 202.2 L409.7 202.3 L411.7 202.4 L413.8 202.4 L415.9 202.5 L417.9 202.6 L420.0 202.7 L422.1 202.7 L424.1 202.8 L426.2 202.9 L428.3 202.9 L430.3 203.0 L432.4 203.1 L434.5 203.1 L436.5 203.2 L438.6 203.2 L440.7 203.3 L442.7 203.4 L444.8 203.4 L446.9 203.5 L448.9 203.5 L451.0 203.6 L453.1 203.6 L455.1 203.7 L457.2 203.7 L459.3 203.8 L461.3 203.8 L463.4 203.9 L465.5 203.9 L467.5 204.0 L469.6 204.0 L471.7 204.1 L473.7 204.1 L475.8 204.1 L477.9 204.2 L479.9 204.2 L482.0 204.3 L484.1 204.3 L486.1 204.3 L488.2 204.4 L490.3 204.4 L492.3 204.4 L494.4 204.5 L496.5 204.5 L498.5 204.5 L500.6 204.6 L502.7 204.6 L504.7 204.6 L506.8 204.7 L508.9 204.7 L510.9 204.7 L513.0 204.7 L515.1 204.8 L517.1 204.8 L519.2 204.8 L521.3 204.8 L523.3 204.9 L525.4 204.9 L527.5 204.9 L529.5 204.9 L531.6 205.0 L533.7 205.0 L535.7 205.0 L537.8 205.0 L539.9 205.0 L541.9 205.1 L544.0 205.1\" stroke=\"#6C8FB8\" stroke-width=\"2.0\" fill=\"none\"/><g font-family=\"sans-serif\" font-size=\"11.5\" fill=\"currentColor\"><circle cx=\"143.4\" cy=\"101.6\" r=\"3.6\" fill=\"#D9824F\"/><text x=\"151.4\" y=\"117.6\" fill=\"#D9824F\">u(τ) ≈ 0,63 E<\/text><text x=\"542\" y=\"36.8\" text-anchor=\"end\" opacity=\".85\">u → E<\/text><\/g><\/svg><ul>\n<li>$u(t)$ est <strong>continue<\/strong> : $u(0^-) = u(0^+) = 0$.<\/li>\n<li>$\\tau$ se lit graphiquement : la <strong>tangente à l&#39;origine<\/strong> coupe l&#39;asymptote $u = E$ en $t = \\tau$, et $u(\\tau) \\approx 0{,}63\\,E$.<\/li>\n<li>$i(t)$ est <strong>discontinue<\/strong> : $i(0^-) = 0$ mais $i(0^+) = E/R$ (le condensateur déchargé se comporte comme un fil). Ensuite $i \\to 0$ : en régime permanent, interrupteur ouvert.<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>$t$<\/th>\n<th>$\\tau$<\/th>\n<th>$2\\tau$<\/th>\n<th>$3\\tau$<\/th>\n<th>$4\\tau$<\/th>\n<th>$5\\tau$<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>$u/E$<\/td>\n<td>0,632<\/td>\n<td>0,865<\/td>\n<td>0,950<\/td>\n<td>0,982<\/td>\n<td>0,993<\/td>\n<\/tr>\n<\/tbody><\/table>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Plus $\\tau$ est petit, plus la charge est rapide. À $5\\tau$, $u \\approx 0{,}99\\,E$ : le régime permanent est atteint.<\/p>\n<\/aside><h2>Idée 3 · La décharge : $v(t) = E\\,e^{-t/\\tau}$<\/h2>\n<p>Idée : le condensateur chargé sous $E$ est débranché du générateur (on ouvre $K$) et se décharge dans $R$.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Établir et résoudre la décharge<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Avant $t = 0$<\/div><p>Régime permanent : le condensateur est un interrupteur ouvert, $v = E$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Équation<\/div><p>Aux bornes de $R$ : $v = R\\,i$ ; le courant sort par la borne +, donc $i = -C\\,\\dfrac{dv}{dt}$. D&#39;où $\\tau\\,\\dfrac{dv}{dt} + v = 0$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Solution<\/div><p>$v(t) = A\\,e^{-t/\\tau}$ avec $v(0) = E$, donc $A = E$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Résultat<\/div><p>$v(t) = E\\,e^{-t/\\tau}$ et $i(t) = \\dfrac{E}{R}\\,e^{-t/\\tau}$.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><svg viewBox=\"0 0 560 220\" role=\"img\" aria-label=\"Décharge d'un condensateur : v(t) décroît de E vers 0, tangente à l'origine coupant l'axe des temps en t = tau\" style=\"max-width:100%;height:auto\  L455.1 183.9 L457.2 184.0 L459.3 184.0 L461.3 184.1 L463.4 184.1 L465.5 184.1 L467.5 184.2 L469.6 184.2 L471.7 184.3 L473.7 184.3 L475.8 184.3 L477.9 184.4 L479.9 184.4 L482.0 184.4 L484.1 184.5 L486.1 184.5 L488.2 184.5 L490.3 184.6 L492.3 184.6 L494.4 184.6 L496.5 184.7 L498.5 184.7 L500.6 184.7 L502.7 184.7 L504.7 184.8 L506.8 184.8 L508.9 184.8 L510.9 184.8 L513.0 184.9 L515.1 184.9 L517.1 184.9 L519.2 184.9 L521.3 185.0 L523.3 185.0 L525.4 185.0 L527.5 185.0 L529.5 185.1 L531.6 185.1 L533.7 185.1 L535.7 185.1 L537.8 185.1 L539.9 185.1 L541.9 185.2 L544.0 185.2\" stroke=\"#D9824F\" stroke-width=\"2.6\" fill=\"none\"/><g font-family=\"sans-serif\" font-size=\"11.5\" fill=\"currentColor\"><circle cx=\"143.4\" cy=\"131.6\" r=\"3.6\" fill=\"#D9824F\"/><text x=\"151.4\" y=\"123.6\" fill=\"#D9824F\">v(τ) ≈ 0,37 E<\/text><\/g><\/svg><p>À $t = \\tau$ : $v = 0{,}37\\,E$ (le condensateur a perdu 63 % de sa tension). À $t = 5\\tau$ : $v &lt; 1\\,\\%$ de $E$, la décharge est pratiquement terminée.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p><strong>Précision ajoutée.<\/strong> Dans la décharge, $i(t)$ s&#39;écrit $\\dfrac{E}{R}e^{-t/\\tau}$ avec le sens du courant pris dans $R$ (le cours l&#39;écrit sans signe). Si tu orientes $i$ dans le sens de la charge, on a $i = C\\,\\dfrac{dv}{dt} = -\\dfrac{E}{R}e^{-t/\\tau}$.<\/p>\n<\/aside><h2>Idée 4 · Bilan d&#39;énergie : 50 % perdus<\/h2>\n<p>Idée : on multiplie la loi des mailles par $i\\,dt = dq$ : $E\\,i\\,dt = R\\,i^2\\,dt + d\\!\\left(\\dfrac{q^2}{2C}\\right)$, c&#39;est-à-dire énergie fournie = énergie dissipée dans $R$ + énergie stockée dans $C$.<\/p>\n<table>\n<thead>\n<tr>\n<th>Énergie<\/th>\n<th>Valeur<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Fournie par le générateur<\/td>\n<td>$W_{fournie} = E\\,Q = C E^2$<\/td>\n<\/tr>\n<tr>\n<td>Stockée dans le condensateur<\/td>\n<td>$W_{stockee} = \\dfrac{Q^2}{2C} = \\tfrac12 C E^2$<\/td>\n<\/tr>\n<tr>\n<td>Dissipée dans $R$ (effet Joule)<\/td>\n<td>$W_J = \\tfrac12 C E^2$<\/td>\n<\/tr>\n<\/tbody><\/table>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>À la charge, la moitié de l&#39;énergie fournie est stockée et l&#39;autre moitié dissipée par effet Joule, <strong>quelle que soit la valeur de $R$<\/strong>. À la décharge, toute l&#39;énergie stockée $\\tfrac12 C E^2$ est dissipée dans $R$.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercice 3.1 du cours · Charge d&#39;un condensateur<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Un condensateur de $100\\ \\mu\\text{F}$, initialement déchargé, est chargé sous $E = 12\\ \\text{V}$ à travers $R = 10\\ \\text{k}\\Omega$. Calculer la constante de temps $\\tau$, en secondes.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>$\\tau = RC$ avec $R = 10^4\\ \\Omega$ et $C = 10^{-4}\\ \\text{F}$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1<\/b><\/p><p>$\\tau = RC = 10^4 \\times 10^{-4} = 1\\ \\text{s}$.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Calculer le courant initial $i(0^+)$, en mA.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>Le condensateur déchargé se comporte comme un fil à $t = 0^+$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1.2<\/b><\/p><p>$i(0^+) = \\dfrac{E}{R} = \\dfrac{12}{10^4} = 1{,}2\\ \\text{mA}$.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Au bout de combien de temps la tension atteint-elle $9\\ \\text{V}$ ? (en secondes, deux décimales)<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>Résous $9 = 12\\,(1 - e^{-t/\\tau})$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1.39<\/b><\/p><p>$9 = 12\\,(1 - e^{-t/\\tau})$ donne $e^{-t/\\tau} = \\tfrac14$, donc $t = \\tau\\,\\ln 4 \\approx 1{,}39\\ \\text{s}$.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Calculer l&#39;énergie stockée en fin de charge et l&#39;énergie dissipée dans $R$, en mJ.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Utilise $W_C = \\tfrac12 C E^2$, puis le bilan à 50 %.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>$W_C = \\tfrac12 \\times 10^{-4} \\times 144 = 7{,}2\\ \\text{mJ}$. L&#39;énergie dissipée dans $R$ est la même : $7{,}2\\ \\text{mJ}$ (le générateur a fourni $14{,}4\\ \\text{mJ}$).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Décharge et lecture de courbe<\/h3><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>Avec $R = 10\\ \\text{k}\\Omega$ et $C = 100\\ \\mu\\text{F}$, combien de temps faut-il pour que la décharge soit pratiquement terminée ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Calcule $\\tau$ puis prends $5\\tau$.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>$\\tau = RC = 1\\ \\text{s}$ ; la décharge est pratiquement terminée au bout de $5\\tau = 5\\ \\text{s}$ (exemple du cours).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><p>On mesure sur une charge sous $E = 10\\ \\text{V}$ que $u = 6{,}32\\ \\text{V}$ à $t = 10\\ \\text{ms}$. Que vaut $\\tau$ ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>Quel pourcentage de $E$ est atteint à $t = \\tau$ ?<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 10<\/b><\/p><p>$6{,}32 / 10 = 0{,}632$ : c&#39;est la valeur de $u/E$ en $t = \\tau$. Donc $\\tau = 10\\ \\text{ms}$ (exemple : $R = 2\\ \\text{k}\\Omega$, $C = 5\\ \\mu\\text{F}$).<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 9 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">La constante de temps d&#39;un circuit RC est…<\/div><button class=\"opt\" data-o=\"0\">$R/C$<\/button><button class=\"opt\" data-o=\"1\">$RC$<\/button><button class=\"opt\" data-o=\"2\">$1/(RC)$<\/button><button class=\"opt\" data-o=\"3\">$C/R$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">À la charge, la tension du condensateur vaut…<\/div><button class=\"opt\" data-o=\"0\">$E\\,e^{-t/\\tau}$<\/button><button class=\"opt\" data-o=\"1\">$E\\,(1 - e^{-t/\\tau})$<\/button><button class=\"opt\" data-o=\"2\">$E\\,(1 + e^{-t/\\tau})$<\/button><button class=\"opt\" data-o=\"3\">$E\\,t/\\tau$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">À $t = \\tau$ pendant la charge, $u$ vaut environ…<\/div><button class=\"opt\" data-o=\"0\">$0{,}37\\,E$<\/button><button class=\"opt\" data-o=\"1\">$0{,}63\\,E$<\/button><button class=\"opt\" data-o=\"2\">$0{,}99\\,E$<\/button><button class=\"opt\" data-o=\"3\">$E/2$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">À $t = 5\\tau$, la charge est pratiquement terminée : $u$ vaut environ…<\/div><button class=\"opt\" data-o=\"0\">$0{,}63\\,E$<\/button><button class=\"opt\" data-o=\"1\">$0{,}86\\,E$<\/button><button class=\"opt\" data-o=\"2\">$0{,}99\\,E$<\/button><button class=\"opt\" data-o=\"3\">$1{,}5\\,E$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">À la charge, à $t = 0^+$, le courant vaut…<\/div><button class=\"opt\" data-o=\"0\">$0$<\/button><button class=\"opt\" data-o=\"1\">$E/R$<\/button><button class=\"opt\" data-o=\"2\">$E\\,C$<\/button><button class=\"opt\" data-o=\"3\">$E/(RC)$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Pendant la décharge, à $t = \\tau$ la tension a diminué de…<\/div><button class=\"opt\" data-o=\"0\">37 %<\/button><button class=\"opt\" data-o=\"1\">63 %<\/button><button class=\"opt\" data-o=\"2\">99 %<\/button><button class=\"opt\" data-o=\"3\">50 %<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Quelle est la constante de temps pour $R = 10\\ \\text{k}\\Omega$ et $C = 100\\ \\mu\\text{F}$ ?<\/div><button class=\"opt\" data-o=\"0\">$0{,}1\\ \\text{s}$<\/button><button class=\"opt\" data-o=\"1\">$1\\ \\text{s}$<\/button><button class=\"opt\" data-o=\"2\">$10\\ \\text{s}$<\/button><button class=\"opt\" data-o=\"3\">$1\\ \\text{ms}$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Lors de la charge, quelle part de l&#39;énergie fournie est dissipée dans $R$ ?<\/div><button class=\"opt\" data-o=\"0\">0 %<\/button><button class=\"opt\" data-o=\"1\">50 %<\/button><button class=\"opt\" data-o=\"2\">100 %<\/button><button class=\"opt\" data-o=\"3\">elle dépend de $R$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Comment lit-on $\\tau$ graphiquement sur la courbe de charge ?<\/div><button class=\"opt\" data-o=\"0\">c&#39;est la valeur de $u$ en $t = 0$<\/button><button class=\"opt\" data-o=\"1\">la tangente à l&#39;origine coupe l&#39;asymptote $u = E$ en $t = \\tau$<\/button><button class=\"opt\" data-o=\"2\">c&#39;est l&#39;instant où $u = E$<\/button><button class=\"opt\" data-o=\"3\">c&#39;est le maximum de $i$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">En régime permanent continu, le condensateur est…<\/div><button class=\"opt\" data-o=\"0\">un fil<\/button><button class=\"opt\" data-o=\"1\">un interrupteur ouvert<\/button><button class=\"opt\" data-o=\"2\">une source de tension<\/button><button class=\"opt\" data-o=\"3\">un conducteur ohmique<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"circuit-rc","rep":["0.37"],"tol":0.01},{"n":"circuit-rc","rep":["1"],"tol":null},{"n":"circuit-rc","rep":["1.2"],"tol":null},{"n":"circuit-rc","rep":["1.39"],"tol":0.01},{"n":"circuit-rc","rep":null,"tol":null},{"n":"circuit-rc","rep":null,"tol":null},{"n":"circuit-rc","rep":["10"],"tol":null}],"qcm":[{"n":"circuit-rc","q":"La constante de temps d&#39;un circuit RC est…","o":["$R/C$","$RC$","$1/(RC)$","$C/R$"],"a":1,"e":"$\\tau = RC$ (en secondes : $\\Omega \\cdot \\text{F} = \\text{s}$)."},{"n":"circuit-rc","q":"À la charge, la tension du condensateur vaut…","o":["$E\\,e^{-t/\\tau}$","$E\\,(1 - e^{-t/\\tau})$","$E\\,(1 + e^{-t/\\tau})$","$E\\,t/\\tau$"],"a":1,"e":"Elle part de 0 (continuité) et tend vers $E$."},{"n":"circuit-rc","q":"À $t = \\tau$ pendant la charge, $u$ vaut environ…","o":["$0{,}37\\,E$","$0{,}63\\,E$","$0{,}99\\,E$","$E/2$"],"a":1,"e":"$1 - e^{-1} \\approx 0{,}632$."},{"n":"circuit-rc","q":"À $t = 5\\tau$, la charge est pratiquement terminée : $u$ vaut environ…","o":["$0{,}63\\,E$","$0{,}86\\,E$","$0{,}99\\,E$","$1{,}5\\,E$"],"a":2,"e":"$1 - e^{-5} \\approx 0{,}993$."},{"n":"circuit-rc","q":"À la charge, à $t = 0^+$, le courant vaut…","o":["$0$","$E/R$","$E\\,C$","$E/(RC)$"],"a":1,"e":"$u(0^+) = 0$, donc $i(0^+) = E/R$."},{"n":"circuit-rc","q":"Pendant la décharge, à $t = \\tau$ la tension a diminué de…","o":["37 %","63 %","99 %","50 %"],"a":1,"e":"$v(\\tau) = 0{,}37\\,E$ : elle a perdu 63 %."},{"n":"circuit-rc","q":"Quelle est la constante de temps pour $R = 10\\ \\text{k}\\Omega$ et $C = 100\\ \\mu\\text{F}$ ?","o":["$0{,}1\\ \\text{s}$","$1\\ \\text{s}$","$10\\ \\text{s}$","$1\\ \\text{ms}$"],"a":1,"e":"$10^4 \\times 10^{-4} = 1\\ \\text{s}$."},{"n":"circuit-rc","q":"Lors de la charge, quelle part de l&#39;énergie fournie est dissipée dans $R$ ?","o":["0 %","50 %","100 %","elle dépend de $R$"],"a":1,"e":"Moitié stockée, moitié dissipée, quelle que soit $R$."},{"n":"circuit-rc","q":"Comment lit-on $\\tau$ graphiquement sur la courbe de charge ?","o":["c&#39;est la valeur de $u$ en $t = 0$","la tangente à l&#39;origine coupe l&#39;asymptote $u = E$ en $t = \\tau$","c&#39;est l&#39;instant où $u = E$","c&#39;est le maximum de $i$"],"a":1,"e":"La tangente à l&#39;origine de $E(1 - e^{-t/\\tau})$ a pour pente $E/\\tau$ : elle atteint $E$ en $t = \\tau$."},{"n":"circuit-rc","q":"En régime permanent continu, le condensateur est…","o":["un fil","un interrupteur ouvert","une source de tension","un conducteur ohmique"],"a":1,"e":"$i = C\\,du/dt = 0$."}]},{"id":"circuit-rl","t":"Le circuit RL : établissement et rupture du courant","seance":"Chapitre 3 · section 3.6","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Une bobine idéale a pour relation $u = L\\,\\dfrac{di}{dt}$, et son courant $i_L$ est continu. C&#39;est le même jeu que le circuit RC, avec les rôles de la tension et du courant échangés.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Dans une bobine, quelle grandeur est continue : la tension $u_L$ ou le courant $i_L$ ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Le <strong>courant<\/strong> $i_L$ (l&#39;énergie $\\tfrac12 L i_L^2$ ne saute pas). La tension $u_L$ peut sauter.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Le circuit RL est le jumeau du circuit RC.<\/strong> Même équation du premier ordre, même méthode (homogène + particulière + condition initiale), même $5\\tau$. Seuls changent : $\\tau = L/R$, et c&#39;est le <strong>courant<\/strong> qui monte progressivement, pas la tension.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Croire que la bobine est un fil dès l&#39;instant $t = 0^+$. Elle ne l&#39;est qu&#39;en régime permanent. À $t = 0^+$, elle s&#39;oppose au courant : elle se comporte comme un interrupteur ouvert ($i = 0$, $u = E$).<\/p>\n<\/aside><p>À la fin, tu sais donner $i(t)$ et $u(t)$ à l&#39;établissement et à la rupture, expliquer la surtension à l&#39;ouverture et faire le bilan d&#39;énergie.<\/p>\n<h2>Idée 1 · L&#39;équation du circuit RL<\/h2>\n<p>Idée : une résistance en série avec une bobine idéale, sous un échelon $e(t)$.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Établir l'équation du circuit RL<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · Loi des mailles<\/div><p>$e(t) = R\\,i + u$ avec $u = L\\,\\dfrac{di}{dt}$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · Mets en forme<\/div><p>$e(t) = R\\,i + L\\,\\dfrac{di}{dt}$, puis divise par $R$ : $\\dfrac{L}{R}\\,\\dfrac{di}{dt} + i = \\dfrac{e}{R}$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · Pose $\\tau = L/R$<\/div><p>$\\tau\\,\\dfrac{di}{dt} + i = \\dfrac{e}{R}$. Circuit du premier ordre, comme RC.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Circuit RL : $\\tau = \\dfrac{L}{R}$. Homogénéité : $\\text{H}/\\Omega = \\text{s}$.<\/p>\n<\/aside><h2>Idée 2 · L&#39;établissement du courant<\/h2>\n<p>Idée : à $t = 0$ la tension passe de $0$ à $E$. Régime libre $B\\,e^{-t/\\tau}$, régime permanent $i = E/R$ (car $di/dt = 0$).<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Résoudre l'établissement du courant<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Solution générale<\/div><p>$i(t) = B\\,e^{-t/\\tau} + \\dfrac{E}{R}$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Condition initiale<\/div><p>$i(0) = 0$ (continuité du courant dans la bobine), donc $B = -\\dfrac{E}{R}$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Courant<\/div><p>$i(t) = \\dfrac{E}{R}\\,\\left(1 - e^{-t/\\tau}\\right)$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Tension aux bornes de $L$<\/div><p>$u(t) = L\\,\\dfrac{di}{dt} = E\\,e^{-t/\\tau}$.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><svg viewBox=\"0 0 560 230\" role=\"img\" aria-label=\"Établissement du courant dans un circuit RL : i(t) monte vers E/R, uL(t) descend de E vers 0\" style=\"max-width:100%;height:auto\"><g stroke=\"currentColor\" stroke-width=\"1.2\" fill=\"none\"><path d=\"M48 12V196\"/><path d=\"M44 196.0H550\"/><\/g><g font-family=\"sans-serif\" font-size=\"11\" fill=\"currentColor\"><pa
