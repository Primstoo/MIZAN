<script>
const MODULE={"slug":"sd-c","titre":"Structures de données en C","cle":"sd-c_scores","cleEtat":"sd-c_scores_etat","format":"score10","intro":"<p>Ce module suit <strong>le cours du Pr A. Farchane<\/strong> (introduction, listes, piles et files, arbres) et corrige les <strong>TD 1 à 3<\/strong> et les <strong>TP 1 et 2<\/strong>.<\/p>\n<p><strong>Comment l&#39;utiliser<\/strong><\/p>\n<ol>\n<li>Lis un chapitre : les schémas montrent ce que deviennent les pointeurs à chaque opération.<\/li>\n<li>Recopie et compile les programmes (<code>gcc prog.c -o prog<\/code>). Dessine les cases et les flèches sur papier : c&#39;est la seule façon de ne pas se perdre.<\/li>\n<li>Fais le QCM du chapitre. <strong>8/10 = chapitre maîtrisé.<\/strong><\/li>\n<li>Termine par l&#39;examen blanc : il reprend le format de l&#39;examen 2024-2025 (écrire tout le code d&#39;une liste chaînée et d&#39;un ABR).<\/li>\n<\/ol>\n<p><strong>Ce qui est sûr<\/strong> : le contenu vient du cours et des corrections de TD ; tous les programmes C de ce module ont été compilés et exécutés.\n<strong>À noter<\/strong> : le plan du cours annonce aussi les arbres AVL, B et rouge-noir, mais le support s&#39;arrête aux ABR. Ils ne sont pas traités ici.<\/p>\n","annexes":[],"cartes":null,"maths":false};
const CHAPS=[{"id":"sd-introduction","t":"Introduction · organiser les données en mémoire","seance":"Chapitre I · Introduction aux structures de données","imp":3,"html":"<h2>Avant de commencer<\/h2>\n<p>Il te faut deux bases de C : la <code>struct<\/code> et le pointeur (une variable qui contient une adresse).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Si <code>int x = 5; int *p = &amp;x; *p = 8;<\/code>, que vaut <code>x<\/code> ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p><code>*p<\/code> désigne la case dont p contient l&#39;adresse.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 8<\/b><\/p><p><code>p<\/code> pointe sur <code>x<\/code>. Écrire dans <code>*p<\/code>, c&#39;est écrire dans <code>x<\/code>. Donc <code>x<\/code> vaut 8.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Une structure de données, ce n&#39;est pas du code compliqué : c&#39;est <strong>un choix de rangement<\/strong>. Demande-toi toujours « quelle opération dois-je faire vite ? ».<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Croire qu&#39;il existe une structure « meilleure » que les autres. Le tableau gagne pour l&#39;accès par indice, la liste chaînée pour l&#39;insertion sans décalage.<\/p>\n<\/aside><p>À la fin, tu sais classer une structure (linéaire ou non) et justifier le choix tableau ou liste chaînée.<\/p>\n<h2>Idée 1 · Une structure = des données + des opérations<\/h2>\n<p>Une structure de données organise, stocke et manipule les données en mémoire. Elle fixe <strong>la forme<\/strong> des données et <strong>les opérations<\/strong> permises.<\/p>\n<p>Exemple du prof : stocker des noms.<\/p>\n<ul>\n<li>Nombre de noms fixe → un <strong>tableau<\/strong>.<\/li>\n<li>Noms ajoutés et supprimés en cours de route → une <strong>liste chaînée<\/strong>.<\/li>\n<\/ul>\n<p>Le choix change l&#39;algorithme : dans une liste <strong>triée<\/strong>, on cherche par dichotomie en O(log n) ; dans une liste non triée, il faut une recherche linéaire en O(n). Pour 1 000 éléments : environ 10 comparaisons contre 1 000.<\/p>\n<h2>Idée 2 · Deux familles<\/h2>\n<figure class=\"flux\"><figcaption>Les catégories du cours<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">Structures de données<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Linéaires : listes chaînées, piles, files<\/div><\/div><div class=\"flux-l\"><div class=\"flux-b\">Structures de données<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Non linéaires : arbres, graphes, tables de hachage<\/div><\/div><\/figure><ul>\n<li><strong>Linéaire<\/strong> : les éléments se suivent l&#39;un après l&#39;autre.<\/li>\n<li><strong>Non linéaire<\/strong> : un élément peut avoir plusieurs successeurs (hiérarchie, réseau).<\/li>\n<\/ul>\n<p>Chaque structure a son usage : la <strong>pile<\/strong> gère le « dernier entré, premier sorti » (LIFO), la <strong>file<\/strong> le « premier entré, premier sorti » (FIFO), l&#39;<strong>arbre<\/strong> une hiérarchie, la <strong>table de hachage<\/strong> un accès rapide par clé.<\/p>\n<h2>Idée 3 · Tableau ou liste chaînée<\/h2>\n<svg viewBox=\"0 0 600 170\" style=\"width:100%;max-width:600px;display:block;margin:10px auto\" role=\"img\" aria-label=\"En haut un tableau de quatre cases contiguës, en bas une liste chaînée de quatre nœuds dispersés reliés par des flèches jusqu'à NULL\">\n<g font-family=\"sans-serif\" font-size=\"14\" fill=\"currentColor\" text-anchor=\"middle\">\n<text x=\"40\" y=\"38\">Tableau<\/text>\n<rect x=\"90\" y=\"18\" width=\"50\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"115\" y=\"38\">2<\/text>\n<rect x=\"140\" y=\"18\" width=\"50\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"165\" y=\"38\">4<\/text>\n<rect x=\"190\" y=\"18\" width=\"50\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"215\" y=\"38\">6<\/text>\n<rect x=\"240\" y=\"18\" width=\"50\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"265\" y=\"38\">7<\/text>\n<text x=\"420\" y=\"38\" fill=\"#D9824F\">cases contiguës, accès t[i] direct<\/text>\n<text x=\"40\" y=\"128\">Liste<\/text>\n<rect x=\"90\" y=\"108\" width=\"40\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"110\" y=\"128\">2<\/text><rect x=\"130\" y=\"108\" width=\"20\" height=\"30\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/>\n<rect x=\"200\" y=\"88\" width=\"40\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"220\" y=\"108\">4<\/text><rect x=\"240\" y=\"88\" width=\"20\" height=\"30\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/>\n<rect x=\"310\" y=\"120\" width=\"40\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"330\" y=\"140\">6<\/text><rect x=\"350\" y=\"120\" width=\"20\" height=\"30\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/>\n<rect x=\"420\" y=\"96\" width=\"40\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"440\" y=\"116\">7<\/text><rect x=\"460\" y=\"96\" width=\"20\" height=\"30\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/>\n<text x=\"540\" y=\"116\">NULL<\/text>\n<\/g>\n<g stroke=\"#D9824F\" stroke-width=\"2\" fill=\"none\"><path d=\"M140 123 L198 105\"/><path d=\"M250 103 L308 133\"/><path d=\"M360 135 L418 113\"/><path d=\"M470 111 L515 111\"/><\/g>\n<\/svg><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Tableau<\/th>\n<th>Liste chaînée<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Mémoire<\/td>\n<td>contiguë, taille fixe<\/td>\n<td>dispersée, allouée au besoin (<code>malloc<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>Accès au i-ème<\/td>\n<td>direct, O(1)<\/td>\n<td>parcours, O(n)<\/td>\n<\/tr>\n<tr>\n<td>Insertion au milieu<\/td>\n<td>décalage, O(n)<\/td>\n<td>changer deux pointeurs<\/td>\n<\/tr>\n<tr>\n<td>Coût mémoire<\/td>\n<td>données seules<\/td>\n<td>données + un pointeur par nœud<\/td>\n<\/tr>\n<\/tbody><\/table>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Liste chaînée : <strong>taille dynamique<\/strong>, insertion/suppression faciles. Prix à payer : <strong>accès séquentiel O(n)<\/strong> et un pointeur de plus par élément.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Choisir une structure<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Une appli de la FSABM doit garder l&#39;historique des pages visitées pour un bouton « Retour ». Quelle structure ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Une <strong>pile<\/strong> : la dernière page visitée est la première qu&#39;on retrouve (LIFO). C&#39;est l&#39;exemple du navigateur cité dans le cours.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>On reçoit des demandes d&#39;impression qu&#39;il faut traiter dans l&#39;ordre d&#39;arrivée. Quelle structure ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Une <strong>file<\/strong> (FIFO) : la première demande arrivée est la première servie.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Classe : arbre, pile, graphe, file, liste chaînée, table de hachage.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Linéaires : liste chaînée, pile, file. Non linéaires : arbre, graphe, table de hachage.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Une structure de données définit :<\/div><button class=\"opt\" data-o=\"0\">seulement le type des variables<\/button><button class=\"opt\" data-o=\"1\">l&#39;organisation des données et les opérations possibles<\/button><button class=\"opt\" data-o=\"2\">uniquement l&#39;algorithme de tri<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Laquelle est non linéaire ?<\/div><button class=\"opt\" data-o=\"0\">la pile<\/button><button class=\"opt\" data-o=\"1\">la file<\/button><button class=\"opt\" data-o=\"2\">l&#39;arbre<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Le principe d&#39;une pile est :<\/div><button class=\"opt\" data-o=\"0\">LIFO<\/button><button class=\"opt\" data-o=\"1\">FIFO<\/button><button class=\"opt\" data-o=\"2\">aléatoire<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Le principe d&#39;une file est :<\/div><button class=\"opt\" data-o=\"0\">LIFO<\/button><button class=\"opt\" data-o=\"1\">FIFO<\/button><button class=\"opt\" data-o=\"2\">par priorité seulement<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Accéder au 500ᵉ élément d&#39;une liste chaînée coûte :<\/div><button class=\"opt\" data-o=\"0\">O(1)<\/button><button class=\"opt\" data-o=\"1\">O(n)<\/button><button class=\"opt\" data-o=\"2\">O(log n)<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Accéder à <code>t[499]<\/code> dans un tableau coûte :<\/div><button class=\"opt\" data-o=\"0\">O(1)<\/button><button class=\"opt\" data-o=\"1\">O(n)<\/button><button class=\"opt\" data-o=\"2\">O(n²)<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Pourquoi une liste chaînée consomme plus de mémoire par élément ?<\/div><button class=\"opt\" data-o=\"0\">parce que <code>malloc<\/code> double la taille<\/button><button class=\"opt\" data-o=\"1\">parce que chaque nœud stocke aussi un pointeur<\/button><button class=\"opt\" data-o=\"2\">parce que les données sont copiées deux fois<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">La recherche dichotomique exige :<\/div><button class=\"opt\" data-o=\"0\">une liste chaînée<\/button><button class=\"opt\" data-o=\"1\">des données triées<\/button><button class=\"opt\" data-o=\"2\">une pile<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Quelle structure donne un accès rapide via une clé ?<\/div><button class=\"opt\" data-o=\"0\">la file<\/button><button class=\"opt\" data-o=\"1\">la liste simplement chaînée<\/button><button class=\"opt\" data-o=\"2\">la table de hachage<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Un avantage de la liste chaînée sur le tableau statique :<\/div><button class=\"opt\" data-o=\"0\">l&#39;accès direct par indice<\/button><button class=\"opt\" data-o=\"1\">pas besoin de connaître la taille à l&#39;avance<\/button><button class=\"opt\" data-o=\"2\">la mémoire contiguë<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"sd-introduction","rep":["8"],"tol":null},{"n":"sd-introduction","rep":null,"tol":null},{"n":"sd-introduction","rep":null,"tol":null},{"n":"sd-introduction","rep":null,"tol":null}],"qcm":[{"n":"sd-introduction","q":"Une structure de données définit :","o":["seulement le type des variables","l&#39;organisation des données et les opérations possibles","uniquement l&#39;algorithme de tri"],"a":1,"e":"C&#39;est la définition du cours : forme + opérations."},{"n":"sd-introduction","q":"Laquelle est non linéaire ?","o":["la pile","la file","l&#39;arbre"],"a":2,"e":"L&#39;arbre organise les données en hiérarchie."},{"n":"sd-introduction","q":"Le principe d&#39;une pile est :","o":["LIFO","FIFO","aléatoire"],"a":0,"e":"Dernier entré, premier sorti."},{"n":"sd-introduction","q":"Le principe d&#39;une file est :","o":["LIFO","FIFO","par priorité seulement"],"a":1,"e":"Premier entré, premier sorti."},{"n":"sd-introduction","q":"Accéder au 500ᵉ élément d&#39;une liste chaînée coûte :","o":["O(1)","O(n)","O(log n)"],"a":1,"e":"Il faut suivre les pointeurs depuis la tête."},{"n":"sd-introduction","q":"Accéder à <code>t[499]<\/code> dans un tableau coûte :","o":["O(1)","O(n)","O(n²)"],"a":0,"e":"L&#39;adresse se calcule directement."},{"n":"sd-introduction","q":"Pourquoi une liste chaînée consomme plus de mémoire par élément ?","o":["parce que <code>malloc<\/code> double la taille","parce que chaque nœud stocke aussi un pointeur","parce que les données sont copiées deux fois"],"a":1,"e":"Donnée + pointeur vers le suivant."},{"n":"sd-introduction","q":"La recherche dichotomique exige :","o":["une liste chaînée","des données triées","une pile"],"a":1,"e":"Sans tri, on ne sait pas de quel côté continuer."},{"n":"sd-introduction","q":"Quelle structure donne un accès rapide via une clé ?","o":["la file","la liste simplement chaînée","la table de hachage"],"a":2,"e":"Cité dans le cours parmi les structures non linéaires."},{"n":"sd-introduction","q":"Un avantage de la liste chaînée sur le tableau statique :","o":["l&#39;accès direct par indice","pas besoin de connaître la taille à l&#39;avance","la mémoire contiguë"],"a":1,"e":"Les nœuds sont alloués au fur et à mesure."}]},{"id":"liste-simple","t":"Listes simplement chaînées","seance":"Chapitre II · Listes (1)","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu dois savoir allouer avec <code>malloc<\/code>, libérer avec <code>free<\/code>, et accéder à un champ par pointeur avec <code>-&gt;<\/code>.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p><code>node *p = malloc(sizeof(node));<\/code> Comment écrire 12 dans le champ <code>data<\/code> du nœud pointé par <code>p<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>p-&gt;data = 12;<\/code> (équivalent à <code>(*p).data = 12;<\/code>).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Dessine avant de coder.<\/strong> Une case pour la donnée, une case pour <code>next<\/code>, une flèche. Chaque ligne de code déplace une flèche : vérifie-la sur ton dessin.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Avancer la tête elle-même pour parcourir (<code>liste = liste-&gt;next<\/code>). Tu perds l&#39;adresse du début : la liste est perdue. On parcourt <strong>toujours<\/strong> avec un pointeur temporaire <code>p<\/code>.<\/p>\n<\/aside><p>À la fin, tu sais écrire de mémoire : la structure, l&#39;insertion en tête et en queue, l&#39;affichage, la recherche, la suppression et la libération.<\/p>\n<h2>Idée 1 · Un nœud = une donnée + l&#39;adresse du suivant<\/h2>\n<svg viewBox=\"0 0 600 110\" style=\"width:100%;max-width:600px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Pointeur liste vers le nœud 2, puis 4, puis 6, puis 7 qui pointe vers NULL\">\n<g font-family=\"sans-serif\" font-size=\"14\" fill=\"currentColor\" text-anchor=\"middle\">\n<text x=\"35\" y=\"30\">liste<\/text><rect x=\"15\" y=\"40\" width=\"40\" height=\"30\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/>\n<rect x=\"100\" y=\"40\" width=\"45\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"122\" y=\"60\">2<\/text><rect x=\"145\" y=\"40\" width=\"25\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<rect x=\"215\" y=\"40\" width=\"45\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"237\" y=\"60\">4<\/text><rect x=\"260\" y=\"40\" width=\"25\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<rect x=\"330\" y=\"40\" width=\"45\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"352\" y=\"60\">6<\/text><rect x=\"375\" y=\"40\" width=\"25\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<rect x=\"445\" y=\"40\" width=\"45\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"467\" y=\"60\">7<\/text><rect x=\"490\" y=\"40\" width=\"25\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<text x=\"565\" y=\"60\">NULL<\/text>\n<text x=\"122\" y=\"95\">tête<\/text><text x=\"467\" y=\"95\">queue<\/text><text x=\"157\" y=\"30\" font-size=\"11\">next<\/text><text x=\"122\" y=\"30\" font-size=\"11\">data<\/text>\n<\/g>\n<g stroke=\"#D9824F\" stroke-width=\"2\"><line x1=\"35\" y1=\"55\" x2=\"98\" y2=\"55\"/><line x1=\"157\" y1=\"55\" x2=\"213\" y2=\"55\"/><line x1=\"272\" y1=\"55\" x2=\"328\" y2=\"55\"/><line x1=\"387\" y1=\"55\" x2=\"443\" y2=\"55\"/><line x1=\"502\" y1=\"55\" x2=\"540\" y2=\"55\"/><\/g>\n<\/svg><p>Le premier nœud est la <strong>tête<\/strong>, le dernier la <strong>queue<\/strong> (son <code>next<\/code> vaut <code>NULL<\/code>). La liste est désignée par l&#39;adresse de sa tête. Liste vide : <code>node *liste = NULL;<\/code>.<\/p>\n<pre class=\"\"><code>typedef struct node {\n    int data;\n    struct node *next;   /* pointeur vers un nœud du même type */\n} node;<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Sur la diapo, le <code>;<\/code> manque après <code>struct node * next<\/code>. Sans lui, le code ne compile pas.<\/p>\n<\/aside><h2>Idée 2 · Insérer en tête et en queue<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Insertion en tête de 12<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Allouer<\/div><p><code>newNode = malloc(sizeof(node));<\/code><\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Remplir<\/div><p><code>newNode-&gt;data = 12;<\/code><\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Chaîner<\/div><p><code>newNode-&gt;next = *liste;<\/code> le nouveau pointe sur l&#39;ancienne tête.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Mettre à jour la tête<\/div><p><code>*liste = newNode;<\/code> C&#39;est pour ça qu&#39;on passe <code>node **liste<\/code> : on modifie le pointeur du <code>main<\/code>.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p>En queue : on crée le nœud avec <code>next = NULL<\/code>, puis soit la liste est vide (il devient la tête), soit on cherche le dernier avec <code>for (p = *liste; p-&gt;next != NULL; p = p-&gt;next);<\/code> et on fait <code>p-&gt;next = newNode<\/code>.<\/p>\n<pre class=\"\"><code>#include &lt;stdio.h&gt;\n#include &lt;stdlib.h&gt;\n\ntypedef struct node { int data; struct node *next; } node;\n\nvoid inserer_en_tete(node **liste, int donnee) {\n    node *newNode = malloc(sizeof(node));\n    newNode-&gt;data = donnee;\n    newNode-&gt;next = *liste;\n    *liste = newNode;\n}\n\nvoid inserer_en_queue(node **liste, int donnee) {\n    node *newNode = malloc(sizeof(node)), *p;\n    if (newNode == NULL) { printf(&quot;Erreur&quot;); return; }\n    newNode-&gt;data = donnee;\n    newNode-&gt;next = NULL;\n    if (*liste == NULL) *liste = newNode;\n    else {\n        for (p = *liste; p-&gt;next != NULL; p = p-&gt;next);\n        p-&gt;next = newNode;\n    }\n}\n\nvoid afficherListe(node *liste) {\n    node *p = liste;\n    while (p != NULL) { printf(&quot;%d -&gt; &quot;, p-&gt;data); p = p-&gt;next; }\n    printf(&quot;NULL\\n&quot;);\n}\n\nint main(void) {\n    node *liste = NULL;\n    inserer_en_queue(&amp;liste, 4);\n    inserer_en_tete(&amp;liste, 2);\n    inserer_en_queue(&amp;liste, 6);\n    inserer_en_queue(&amp;liste, 7);\n    afficherListe(liste);\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>2 -&gt; 4 -&gt; 6 -&gt; 7 -&gt; NULL<\/code><\/pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Si une fonction doit <strong>changer la tête<\/strong>, deux styles du prof : passer <code>node **liste<\/code>, ou retourner la nouvelle tête (<code>liste = inserer(liste, x);<\/code>). Avec un simple <code>node *liste<\/code> sans retour, la modification est perdue.<\/p>\n<\/aside><h2>Idée 3 · Rechercher et supprimer<\/h2>\n<p>Rechercher = parcourir et comparer, retourner l&#39;adresse du nœud ou <code>NULL<\/code>.<\/p>\n<figure class=\"grille\"><figcaption>Supprimer en queue : on garde precedent un cran derrière temp<\/figcaption><table><tr><th><\/th><th>2<\/th><th>4<\/th><th>6<\/th><th>7<\/th><\/tr><tr><th>début<\/th><td class=\"h2\">2<\/td><td>4<\/td><td>6<\/td><td>7<\/td><\/tr><tr><th>étape2<\/th><td>2<\/td><td class=\"h2\">4<\/td><td>6<\/td><td>7<\/td><\/tr><tr><th>étape3<\/th><td>2<\/td><td>4<\/td><td class=\"h2\">6<\/td><td class=\"h1\">7<\/td><\/tr><tr><th>fin<\/th><td>2<\/td><td>4<\/td><td class=\"h2\">6<\/td><td class=\"h0\">7<\/td><\/tr><\/table><\/figure><p>(bleu : <code>precedent<\/code>, orange : <code>temp<\/code>, grisé : nœud libéré ; <code>precedent-&gt;next = NULL<\/code>.)<\/p>\n<pre class=\"\"><code>#include &lt;stdio.h&gt;\n#include &lt;stdlib.h&gt;\n\ntypedef struct node { int data; struct node *next; } node;\n\nvoid inserer_en_tete(node **liste, int d) {\n    node *n = malloc(sizeof(node)); n-&gt;data = d; n-&gt;next = *liste; *liste = n;\n}\nvoid afficherListe(node *liste) {\n    for (node *p = liste; p != NULL; p = p-&gt;next) printf(&quot;%d -&gt; &quot;, p-&gt;data);\n    printf(&quot;NULL\\n&quot;);\n}\nnode *rechercher(node *tete, int valeur) {\n    node *temp = tete;\n    while (temp != NULL) {\n        if (temp-&gt;data == valeur) return temp;\n        temp = temp-&gt;next;\n    }\n    return NULL;\n}\nvoid supprimer_tete(node **liste) {\n    if (*liste != NULL) {\n        node *p = *liste;\n        *liste = (*liste)-&gt;next;\n        free(p);\n    }\n}\nvoid supprimerFin(node **tete) {\n    if (*tete == NULL) return;\n    if ((*tete)-&gt;next == NULL) { free(*tete); *tete = NULL; return; } /* un seul nœud */\n    node *temp = *tete, *precedent = NULL;\n    while (temp-&gt;next != NULL) { precedent = temp; temp = temp-&gt;next; }\n    precedent-&gt;next = NULL;\n    free(temp);\n}\nnode *liberer(node *tete) {\n    while (tete != NULL) { node *s = tete-&gt;next; free(tete); tete = s; }\n    return NULL;\n}\n\nint main(void) {\n    node *L = NULL;\n    for (int v = 7; v &gt;= 1; v -= 2) inserer_en_tete(&amp;L, v);\n    afficherListe(L);\n    printf(&quot;6 %s\\n&quot;, rechercher(L, 6) ? &quot;trouvé&quot; : &quot;absent&quot;);\n    printf(&quot;5 %s\\n&quot;, rechercher(L, 5) ? &quot;trouvé&quot; : &quot;absent&quot;);\n    supprimer_tete(&amp;L);\n    supprimerFin(&amp;L);\n    afficherListe(L);\n    supprimerFin(&amp;L); supprimerFin(&amp;L); supprimerFin(&amp;L);\n    afficherListe(L);\n    L = liberer(L);\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>1 -&gt; 3 -&gt; 5 -&gt; 7 -&gt; NULL\n6 absent\n5 trouvé\n3 -&gt; 5 -&gt; NULL\nNULL<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>La fonction <code>supprimerFin<\/code> de la diapo plante si la liste n&#39;a <strong>qu&#39;un seul nœud<\/strong> : <code>precedent<\/code> reste <code>NULL<\/code> et <code>precedent-&gt;next = NULL<\/code> déréférence <code>NULL<\/code>. La version ci-dessus traite ce cas à part (et remet la tête à <code>NULL<\/code>).<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices types (TD1, examen 2025)<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Écris <code>int compter(node *tete)<\/code> qui retourne le nombre de nœuds (TD1, ex. 1.2).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>int count = 0; for (node *p = tete; p != NULL; p = p-&gt;next) count++; return count;<\/code><\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Écris une fonction qui inverse une liste simplement chaînée (TD1, ex. 1.3).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Trois pointeurs : <code>inverse<\/code> (déjà retourné), <code>temp<\/code> (reste à traiter), <code>actuel<\/code>.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><code>node *inverse = NULL, *temp = tete, *actuel;<\/code>\n<code>while (temp != NULL) { actuel = temp; temp = temp-&gt;next; actuel-&gt;next = inverse; inverse = actuel; }<\/code>\n<code>return inverse;<\/code> Chaque nœud est retiré du début et posé devant <code>inverse<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Pourquoi <code>void inserer(node *liste, int x)<\/code> qui fait <code>liste = nouveau;<\/code> ne modifie pas la liste du <code>main<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Le paramètre est une <strong>copie<\/strong> du pointeur. Il faut passer <code>node **liste<\/code> ou retourner la nouvelle tête.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Que contient le champ <code>next<\/code> du dernier nœud ?<\/div><button class=\"opt\" data-o=\"0\">l&#39;adresse de la tête<\/button><button class=\"opt\" data-o=\"1\"><code>NULL<\/code><\/button><button class=\"opt\" data-o=\"2\">0 dans le champ data<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Quelle est la complexité de l&#39;insertion en tête ?<\/div><button class=\"opt\" data-o=\"0\">O(1)<\/button><button class=\"opt\" data-o=\"1\">O(n)<\/button><button class=\"opt\" data-o=\"2\">O(log n)<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Quelle est la complexité de l&#39;insertion en queue sans pointeur de queue ?<\/div><button class=\"opt\" data-o=\"0\">O(1)<\/button><button class=\"opt\" data-o=\"1\">O(n)<\/button><button class=\"opt\" data-o=\"2\">O(n²)<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Dans l&#39;insertion en tête, quelle instruction vient juste avant <code>*liste = newNode;<\/code> ?<\/div><button class=\"opt\" data-o=\"0\"><code>free(newNode);<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>newNode-&gt;next = *liste;<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>(*liste)-&gt;next = newNode;<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Pourquoi parcourir avec un pointeur <code>p<\/code> et pas avec <code>liste<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">c&#39;est plus rapide<\/button><button class=\"opt\" data-o=\"1\">pour ne pas perdre l&#39;adresse de la tête<\/button><button class=\"opt\" data-o=\"2\">parce que <code>liste<\/code> est constant<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\"><code>rechercher<\/code> retourne quoi si la valeur est absente ?<\/div><button class=\"opt\" data-o=\"0\">-1<\/button><button class=\"opt\" data-o=\"1\"><code>NULL<\/code><\/button><button class=\"opt\" data-o=\"2\">l&#39;adresse de la queue<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Dans <code>supprimer_tete<\/code>, pourquoi sauver <code>p = *liste<\/code> avant d&#39;avancer ?<\/div><button class=\"opt\" data-o=\"0\">pour pouvoir faire <code>free(p)<\/code> sur l&#39;ancienne tête<\/button><button class=\"opt\" data-o=\"1\">pour l&#39;afficher<\/button><button class=\"opt\" data-o=\"2\">pour le remettre en queue<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">La condition de la boucle <code>for (p = liste; p-&gt;next != NULL; p = p-&gt;next);<\/code> sur une liste vide :<\/div><button class=\"opt\" data-o=\"0\">s&#39;arrête tout de suite<\/button><button class=\"opt\" data-o=\"1\">plante (déréférence NULL)<\/button><button class=\"opt\" data-o=\"2\">retourne NULL<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Après <code>supprimerFin<\/code> (version corrigée) sur une liste d&#39;un nœud, la tête vaut :<\/div><button class=\"opt\" data-o=\"0\">l&#39;ancien nœud<\/button><button class=\"opt\" data-o=\"1\"><code>NULL<\/code><\/button><button class=\"opt\" data-o=\"2\">indéfinie<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Quel oubli provoque une fuite mémoire ?<\/div><button class=\"opt\" data-o=\"0\">oublier <code>printf<\/code><\/button><button class=\"opt\" data-o=\"1\">ne pas appeler <code>free<\/code> sur les nœuds<\/button><button class=\"opt\" data-o=\"2\">utiliser <code>-&gt;<\/code> au lieu de <code>.<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"liste-simple","rep":null,"tol":null},{"n":"liste-simple","rep":null,"tol":null},{"n":"liste-simple","rep":null,"tol":null},{"n":"liste-simple","rep":null,"tol":null}],"qcm":[{"n":"liste-simple","q":"Que contient le champ <code>next<\/code> du dernier nœud ?","o":["l&#39;adresse de la tête","<code>NULL<\/code>","0 dans le champ data"],"a":1,"e":"Dans une liste non circulaire, la fin est marquée par NULL."},{"n":"liste-simple","q":"Quelle est la complexité de l&#39;insertion en tête ?","o":["O(1)","O(n)","O(log n)"],"a":0,"e":"Aucun parcours : on change deux pointeurs."},{"n":"liste-simple","q":"Quelle est la complexité de l&#39;insertion en queue sans pointeur de queue ?","o":["O(1)","O(n)","O(n²)"],"a":1,"e":"Il faut parcourir jusqu&#39;au dernier nœud."},{"n":"liste-simple","q":"Dans l&#39;insertion en tête, quelle instruction vient juste avant <code>*liste = newNode;<\/code> ?","o":["<code>free(newNode);<\/code>","<code>newNode-&gt;next = *liste;<\/code>","<code>(*liste)-&gt;next = newNode;<\/code>"],"a":1,"e":"On accroche d&#39;abord le nouveau à l&#39;ancienne tête, sinon on la perd."},{"n":"liste-simple","q":"Pourquoi parcourir avec un pointeur <code>p<\/code> et pas avec <code>liste<\/code> ?","o":["c&#39;est plus rapide","pour ne pas perdre l&#39;adresse de la tête","parce que <code>liste<\/code> est constant"],"a":1,"e":"Si on avance <code>liste<\/code>, le début est perdu."},{"n":"liste-simple","q":"<code>rechercher<\/code> retourne quoi si la valeur est absente ?","o":["-1","<code>NULL<\/code>","l&#39;adresse de la queue"],"a":1,"e":"Elle retourne un <code>node*<\/code>."},{"n":"liste-simple","q":"Dans <code>supprimer_tete<\/code>, pourquoi sauver <code>p = *liste<\/code> avant d&#39;avancer ?","o":["pour pouvoir faire <code>free(p)<\/code> sur l&#39;ancienne tête","pour l&#39;afficher","pour le remettre en queue"],"a":0,"e":"Après <code>*liste = (*liste)-&gt;next<\/code>, on n&#39;aurait plus son adresse."},{"n":"liste-simple","q":"La condition de la boucle <code>for (p = liste; p-&gt;next != NULL; p = p-&gt;next);<\/code> sur une liste vide :","o":["s&#39;arrête tout de suite","plante (déréférence NULL)","retourne NULL"],"a":1,"e":"<code>p<\/code> vaut NULL et <code>p-&gt;next<\/code> est invalide : d&#39;où le test <code>if (*liste == NULL)<\/code> avant."},{"n":"liste-simple","q":"Après <code>supprimerFin<\/code> (version corrigée) sur une liste d&#39;un nœud, la tête vaut :","o":["l&#39;ancien nœud","<code>NULL<\/code>","indéfinie"],"a":1,"e":"Le nœud est libéré et la tête remise à NULL."},{"n":"liste-simple","q":"Quel oubli provoque une fuite mémoire ?","o":["oublier <code>printf<\/code>","ne pas appeler <code>free<\/code> sur les nœuds","utiliser <code>-&gt;<\/code> au lieu de <code>.<\/code>"],"a":1,"e":"Chaque <code>malloc<\/code> doit avoir son <code>free<\/code>."}]},{"id":"liste-double-circulaire","t":"Listes doublement chaînées et circulaires","seance":"Chapitre II · Listes (2)","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Ce chapitre réutilise tout le chapitre précédent : insertion en tête et en queue d&#39;une liste simple.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Dans une liste simple, en combien d&#39;opérations accède-t-on au <strong>prédécesseur<\/strong> d&#39;un nœud dont on a l&#39;adresse ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>On ne peut pas y remonter : il faut repartir de la tête et parcourir, donc O(n). C&#39;est exactement ce que corrige la liste double.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Une liste double, c&#39;est <strong>deux listes simples superposées<\/strong> : une dans chaque sens. À chaque opération, compte les flèches à refaire : souvent 4 au lieu de 2.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Écrire <code>temp-&gt;suivant-&gt;precedent = …<\/code> sans tester <code>temp-&gt;suivant != NULL<\/code>. Sur le dernier nœud, c&#39;est un plantage assuré. Même chose pour <code>precedent<\/code> sur la tête.<\/p>\n<\/aside><p>À la fin, tu sais insérer, supprimer et afficher dans une liste double, et parcourir une liste circulaire sans boucle infinie.<\/p>\n<h2>Idée 1 · Deux pointeurs par nœud<\/h2>\n<svg viewBox=\"0 0 600 110\" style=\"width:100%;max-width:600px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Trois nœuds 5, 10, 20 reliés dans les deux sens ; le precedent du premier et le suivant du dernier valent NULL\">\n<g font-family=\"sans-serif\" font-size=\"14\" fill=\"currentColor\" text-anchor=\"middle\">\n<text x=\"40\" y=\"60\">NULL<\/text>\n<rect x=\"100\" y=\"40\" width=\"20\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><rect x=\"120\" y=\"40\" width=\"40\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"140\" y=\"60\">5<\/text><rect x=\"160\" y=\"40\" width=\"20\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<rect x=\"240\" y=\"40\" width=\"20\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><rect x=\"260\" y=\"40\" width=\"40\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"280\" y=\"60\">10<\/text><rect x=\"300\" y=\"40\" width=\"20\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<rect x=\"380\" y=\"40\" width=\"20\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><rect x=\"400\" y=\"40\" width=\"40\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"420\" y=\"60\">20<\/text><rect x=\"440\" y=\"40\" width=\"20\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<text x=\"540\" y=\"60\">NULL<\/text><text x=\"140\" y=\"95\">tete<\/text><text x=\"110\" y=\"30\" font-size=\"10\">prec<\/text><text x=\"170\" y=\"30\" font-size=\"10\">suiv<\/text>\n<\/g>\n<g stroke=\"#D9824F\" stroke-width=\"2\"><line x1=\"170\" y1=\"48\" x2=\"238\" y2=\"48\"/><line x1=\"250\" y1=\"62\" x2=\"182\" y2=\"62\"/><line x1=\"310\" y1=\"48\" x2=\"378\" y2=\"48\"/><line x1=\"390\" y1=\"62\" x2=\"322\" y2=\"62\"/><line x1=\"110\" y1=\"55\" x2=\"65\" y2=\"55\"/><line x1=\"450\" y1=\"55\" x2=\"515\" y2=\"55\"/><\/g>\n<\/svg><pre class=\"\"><code>typedef struct Element {\n    int donnee;\n    struct Element *suivant;\n    struct Element *precedent;\n} Element;<\/code><\/pre><p>Avantage : on avance <strong>et<\/strong> on recule. Prix : un pointeur de plus par nœud et plus de pointeurs à mettre à jour.<\/p>\n<h2>Idée 2 · Les opérations de la liste double<\/h2>\n<p>Le prof retourne la nouvelle tête : <code>tete = insererTete(tete, 5);<\/code>.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Supprimer la valeur 10 dans 5 ⇄ 10 ⇄ 20<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Chercher<\/div><p><code>temp<\/code> avance jusqu&#39;au nœud 10. S&#39;il vaut NULL, la valeur est absente : on retourne la tête.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Recâbler le précédent<\/div><p><code>temp-&gt;precedent<\/code> existe (c&#39;est 5), donc <code>5-&gt;suivant = 20<\/code>. Sinon on supprimait la tête : <code>tete = temp-&gt;suivant<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Recâbler le suivant<\/div><p><code>temp-&gt;suivant<\/code> existe (c&#39;est 20), donc <code>20-&gt;precedent = 5<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Libérer<\/div><p><code>free(temp);<\/code> puis <code>return tete;<\/code><\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><pre class=\"\"><code>#include &lt;stdio.h&gt;\n#include &lt;stdlib.h&gt;\n\ntypedef struct Element { int donnee; struct Element *suivant, *precedent; } Element;\n\nElement *insererTete(Element *tete, int val) {\n    Element *n = malloc(sizeof(Element));\n    n-&gt;donnee = val; n-&gt;suivant = tete; n-&gt;precedent = NULL;\n    if (tete != NULL) tete-&gt;precedent = n;\n    return n;\n}\nElement *insererFin(Element *tete, int val) {\n    if (tete == NULL) return insererTete(tete, val);\n    Element *n = malloc(sizeof(Element)), *t = tete;\n    n-&gt;donnee = val; n-&gt;suivant = NULL;\n    while (t-&gt;suivant != NULL) t = t-&gt;suivant;\n    t-&gt;suivant = n; n-&gt;precedent = t;\n    return tete;\n}\nElement *supprimer(Element *tete, int val) {\n    Element *temp = tete;\n    while (temp != NULL &amp;&amp; temp-&gt;donnee != val) temp = temp-&gt;suivant;\n    if (temp == NULL) return tete;\n    if (temp-&gt;precedent != NULL) temp-&gt;precedent-&gt;suivant = temp-&gt;suivant;\n    else tete = temp-&gt;suivant;\n    if (temp-&gt;suivant != NULL) temp-&gt;suivant-&gt;precedent = temp-&gt;precedent;\n    free(temp);\n    return tete;\n}\nvoid afficherListe(Element *tete) {\n    for (Element *a = tete; a != NULL; a = a-&gt;suivant) printf(&quot;%d &lt;-&gt; &quot;, a-&gt;donnee);\n    printf(&quot;NULL\\n&quot;);\n}\nvoid afficherInverse(Element *tete) {\n    if (tete == NULL) { printf(&quot;NULL\\n&quot;); return; }\n    Element *a = tete;\n    while (a-&gt;suivant != NULL) a = a-&gt;suivant;\n    for (; a != NULL; a = a-&gt;precedent) printf(&quot;%d &lt;-&gt; &quot;, a-&gt;donnee);\n    printf(&quot;NULL\\n&quot;);\n}\nElement *libererListe(Element *tete) {\n    Element *s;\n    while (tete != NULL) { s = tete-&gt;suivant; free(tete); tete = s; }\n    return NULL;\n}\nint main(void) {\n    Element *L = NULL;\n    L = insererTete(L, 10);\n    L = insererFin(L, 20);\n    L = insererTete(L, 5);\n    afficherListe(L);\n    afficherInverse(L);\n    L = supprimer(L, 10);\n    afficherListe(L);\n    L = supprimer(L, 5);\n    afficherListe(L);\n    L = libererListe(L);\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>5 &lt;-&gt; 10 &lt;-&gt; 20 &lt;-&gt; NULL\n20 &lt;-&gt; 10 &lt;-&gt; 5 &lt;-&gt; NULL\n5 &lt;-&gt; 20 &lt;-&gt; NULL\n20 &lt;-&gt; NULL<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Dans la correction du TD1 (ex. 1.6), la suppression de la tête fait <code>lst = lst-&gt;suivant; lst-&gt;precedent = NULL;<\/code>. Si la liste n&#39;a qu&#39;un nœud, <code>lst<\/code> devient NULL et <code>lst-&gt;precedent<\/code> plante. Il faut tester <code>if (lst != NULL)<\/code> avant. La version du cours ci-dessus n&#39;a pas ce défaut.<\/p>\n<\/aside><h2>Idée 3 · La liste circulaire : la queue pointe sur la tête<\/h2>\n<svg viewBox=\"0 0 520 150\" style=\"width:100%;max-width:520px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Trois nœuds 1, 2, 3 ; le dernier pointe de nouveau vers le premier\">\n<g font-family=\"sans-serif\" font-size=\"14\" fill=\"currentColor\" text-anchor=\"middle\">\n<rect x=\"60\" y=\"40\" width=\"40\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"80\" y=\"60\">1<\/text><rect x=\"100\" y=\"40\" width=\"20\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<rect x=\"210\" y=\"40\" width=\"40\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"230\" y=\"60\">2<\/text><rect x=\"250\" y=\"40\" width=\"20\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<rect x=\"360\" y=\"40\" width=\"40\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"380\" y=\"60\">3<\/text><rect x=\"400\" y=\"40\" width=\"20\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<text x=\"80\" y=\"30\">head<\/text><\/g>\n<g stroke=\"#D9824F\" stroke-width=\"2\" fill=\"none\"><line x1=\"110\" y1=\"55\" x2=\"208\" y2=\"55\"/><line x1=\"260\" y1=\"55\" x2=\"358\" y2=\"55\"/><path d=\"M410 70 L410 120 L80 120 L80 72\"/><\/g>\n<\/svg><p>Plus de <code>NULL<\/code> à la fin : la condition <code>while (p != NULL)<\/code> tournerait <strong>à l&#39;infini<\/strong>. On utilise une boucle <code>do … while (temp != head)<\/code> : on traite le premier nœud, puis on s&#39;arrête quand on revient à la tête.<\/p>\n<pre class=\"\"><code>#include &lt;stdio.h&gt;\n#include &lt;stdlib.h&gt;\n\ntypedef struct Node { int data; struct Node *next; } Node;\n\nNode *insererEnFin(Node *head, int v) {\n    Node *n = malloc(sizeof(Node)); n-&gt;data = v;\n    if (head == NULL) { n-&gt;next = n; return n; }   /* pointe sur lui-même */\n    Node *t = head;\n    while (t-&gt;next != head) t = t-&gt;next;\n    t-&gt;next = n; n-&gt;next = head;\n    return head;\n}\nNode *insererEnDebut(Node *head, int v) {\n    Node *n = malloc(sizeof(Node)); n-&gt;data = v;\n    if (head == NULL) { n-&gt;next = n; return n; }\n    Node *t = head;\n    while (t-&gt;next != head) t = t-&gt;next;\n    t-&gt;next = n; n-&gt;next = head;\n    return n;                                      /* seule différence */\n}\nint compter(Node *head) {\n    if (head == NULL) return 0;\n    int c = 0; Node *t = head;\n    do { c++; t = t-&gt;next; } while (t != head);\n    return c;\n}\nint main(void) {\n    Node *h = NULL;\n    h = insererEnFin(h, 2);\n    h = insererEnFin(h, 3);\n    h = insererEnDebut(h, 1);\n    Node *t = h;\n    for (int i = 0; i &lt; 7; i++) { printf(&quot;%d &quot;, t-&gt;data); t = t-&gt;next; }\n    printf(&quot;\\nnoeuds : %d\\n&quot;, compter(h));\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>1 2 3 1 2 3 1 \nnoeuds : 3<\/code><\/pre><p>Le tour de 7 pas montre bien la boucle : après 3, on revient à 1.<\/p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Insertion en début et en fin d&#39;une circulaire : <strong>le même code<\/strong>. Seule la valeur retournée change (<code>n<\/code> = nouvelle tête, ou <code>head<\/code>).<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices types<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Écris l&#39;affichage d&#39;une liste double « de la fin vers le début » (TD1, ex. 1.6, question 5).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Aller au dernier nœud (<code>while (a-&gt;suivant != NULL) a = a-&gt;suivant;<\/code>), puis remonter avec <code>a = a-&gt;precedent<\/code> jusqu&#39;à NULL en affichant. Voir <code>afficherInverse<\/code> ci-dessus.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Pourquoi la fonction <code>rechercher<\/code> d&#39;une liste circulaire utilise <code>do … while<\/code> et pas <code>while (temp != head)<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Avec <code>while<\/code>, on testerait <code>temp != head<\/code> dès le départ : faux, donc on ne regarderait aucun nœud. <code>do…while<\/code> traite d&#39;abord la tête.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Combien de pointeurs modifie l&#39;insertion en tête d&#39;une liste double non vide ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 3<\/b><\/p><p><code>nouveau-&gt;suivant<\/code>, <code>nouveau-&gt;precedent<\/code> (NULL) et <code>ancienneTete-&gt;precedent<\/code>. Plus la tête elle-même, mise à jour par le retour.<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Un nœud de liste doublement chaînée contient :<\/div><button class=\"opt\" data-o=\"0\">une donnée et un pointeur<\/button><button class=\"opt\" data-o=\"1\">une donnée et deux pointeurs<\/button><button class=\"opt\" data-o=\"2\">deux données et un pointeur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Après <code>insererTete<\/code> sur une liste double non vide, <code>ancienneTete-&gt;precedent<\/code> vaut :<\/div><button class=\"opt\" data-o=\"0\">NULL<\/button><button class=\"opt\" data-o=\"1\">l&#39;adresse du nouveau nœud<\/button><button class=\"opt\" data-o=\"2\">l&#39;adresse de la queue<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Dans <code>supprimer<\/code> (liste double), si <code>temp-&gt;precedent == NULL<\/code>, c&#39;est que :<\/div><button class=\"opt\" data-o=\"0\">on supprime la tête<\/button><button class=\"opt\" data-o=\"1\">on supprime la queue<\/button><button class=\"opt\" data-o=\"2\">la liste est vide<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Pourquoi tester <code>temp-&gt;suivant != NULL<\/code> avant <code>temp-&gt;suivant-&gt;precedent = …<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">pour gagner du temps<\/button><button class=\"opt\" data-o=\"1\">parce que la queue n&#39;a pas de suivant<\/button><button class=\"opt\" data-o=\"2\">ce test est inutile<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Dans une liste circulaire, <code>while (p != NULL)<\/code> :<\/div><button class=\"opt\" data-o=\"0\">parcourt la liste une fois<\/button><button class=\"opt\" data-o=\"1\">boucle à l&#39;infini<\/button><button class=\"opt\" data-o=\"2\">ne s&#39;exécute jamais<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">La liste circulaire <code>1 → 2 → 3 → (1)<\/code> : après 5 pas depuis 1, on est sur :<\/div><button class=\"opt\" data-o=\"0\">2<\/button><button class=\"opt\" data-o=\"1\">3<\/button><button class=\"opt\" data-o=\"2\">1<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Une liste circulaire peut être :<\/div><button class=\"opt\" data-o=\"0\">seulement simplement chaînée<\/button><button class=\"opt\" data-o=\"1\">seulement doublement chaînée<\/button><button class=\"opt\" data-o=\"2\">simplement ou doublement chaînée<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Dans le cours, <code>insererTete<\/code> d&#39;une liste double :<\/div><button class=\"opt\" data-o=\"0\">retourne la nouvelle tête<\/button><button class=\"opt\" data-o=\"1\">prend un <code>Element **<\/code><\/button><button class=\"opt\" data-o=\"2\">ne retourne rien<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Le défaut de la correction du TD1 (suppression de la tête d&#39;une liste double) apparaît quand :<\/div><button class=\"opt\" data-o=\"0\">la liste a deux nœuds<\/button><button class=\"opt\" data-o=\"1\">la liste n&#39;a qu&#39;un nœud<\/button><button class=\"opt\" data-o=\"2\">la valeur est absente<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Dans une liste circulaire de n nœuds, trouver le dernier depuis <code>head<\/code> coûte :<\/div><button class=\"opt\" data-o=\"0\">O(1)<\/button><button class=\"opt\" data-o=\"1\">O(n)<\/button><button class=\"opt\" data-o=\"2\">O(log n)<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"liste-double-circulaire","rep":null,"tol":null},{"n":"liste-double-circulaire","rep":null,"tol":null},{"n":"liste-double-circulaire","rep":null,"tol":null},{"n":"liste-double-circulaire","rep":["3"],"tol":null}],"qcm":[{"n":"liste-double-circulaire","q":"Un nœud de liste doublement chaînée contient :","o":["une donnée et un pointeur","une donnée et deux pointeurs","deux données et un pointeur"],"a":1,"e":"suivant + precedent."},{"n":"liste-double-circulaire","q":"Après <code>insererTete<\/code> sur une liste double non vide, <code>ancienneTete-&gt;precedent<\/code> vaut :","o":["NULL","l&#39;adresse du nouveau nœud","l&#39;adresse de la queue"],"a":1,"e":"Le chaînage arrière doit être mis à jour."},{"n":"liste-double-circulaire","q":"Dans <code>supprimer<\/code> (liste double), si <code>temp-&gt;precedent == NULL<\/code>, c&#39;est que :","o":["on supprime la tête","on supprime la queue","la liste est vide"],"a":0,"e":"On fait alors <code>tete = temp-&gt;suivant<\/code>."},{"n":"liste-double-circulaire","q":"Pourquoi tester <code>temp-&gt;suivant != NULL<\/code> avant <code>temp-&gt;suivant-&gt;precedent = …<\/code> ?","o":["pour gagner du temps","parce que la queue n&#39;a pas de suivant","ce test est inutile"],"a":1,"e":"Sinon on déréférence NULL."},{"n":"liste-double-circulaire","q":"Dans une liste circulaire, <code>while (p != NULL)<\/code> :","o":["parcourt la liste une fois","boucle à l&#39;infini","ne s&#39;exécute jamais"],"a":1,"e":"Aucun nœud ne pointe vers NULL."},{"n":"liste-double-circulaire","q":"La liste circulaire <code>1 → 2 → 3 → (1)<\/code> : après 5 pas depuis 1, on est sur :","o":["2","3","1"],"a":1,"e":"1,2,3,1,2,3 : le 6ᵉ nœud visité (5 pas) est 3."},{"n":"liste-double-circulaire","q":"Une liste circulaire peut être :","o":["seulement simplement chaînée","seulement doublement chaînée","simplement ou doublement chaînée"],"a":2,"e":"Le cours présente les deux variantes."},{"n":"liste-double-circulaire","q":"Dans le cours, <code>insererTete<\/code> d&#39;une liste double :","o":["retourne la nouvelle tête","prend un <code>Element **<\/code>","ne retourne rien"],"a":0,"e":"On l&#39;appelle <code>tete = insererTete(tete, val);<\/code>."},{"n":"liste-double-circulaire","q":"Le défaut de la correction du TD1 (suppression de la tête d&#39;une liste double) apparaît quand :","o":["la liste a deux nœuds","la liste n&#39;a qu&#39;un nœud","la valeur est absente"],"a":1,"e":"<code>lst<\/code> devient NULL puis on écrit <code>lst-&gt;precedent<\/code>."},{"n":"liste-double-circulaire","q":"Dans une liste circulaire de n nœuds, trouver le dernier depuis <code>head<\/code> coûte :","o":["O(1)","O(n)","O(log n)"],"a":1,"e":"On avance jusqu&#39;à <code>t-&gt;next == head<\/code>."}]},{"id":"liste-tableau","t":"Liste avec un tableau (contiguë)","seance":"Chapitre II · Listes (3)","imp":3,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir parcourir un tableau avec une boucle <code>for<\/code> et passer une structure par adresse (<code>Liste *lst<\/code>, puis <code>lst-&gt;taille<\/code>).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p><code>int t[5] = {1,2,3}; <\/code> Quels indices sont valides pour <code>t<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>De 0 à 4 (taille 5). Les cases 3 et 4 valent 0 ici car le tableau est partiellement initialisé.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Ici tout est une histoire de <strong>décalage<\/strong>. Insérer au milieu = pousser vers la droite ; supprimer = tirer vers la gauche. Le sens de la boucle est la seule vraie difficulté.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Décaler vers la droite en partant du <strong>début<\/strong> (<code>for (i = index; …; i++)<\/code>) : tu écrases tout avec la même valeur. Pour insérer, on part de la <strong>fin<\/strong>.<\/p>\n<\/aside><p>À la fin, tu sais écrire une liste contiguë complète (TD1 ex. 1.1, TP1 ex. 1) et dire quand elle est préférable à une liste chaînée.<\/p>\n<h2>Idée 1 · Un tableau + un compteur<\/h2>\n<pre class=\"\"><code>#define MAX 100\ntypedef struct {\n    int data[MAX];   /* les éléments */\n    int taille;      /* nombre d'éléments présents */\n} Liste;\nvoid initialiserListe(Liste *lst) { lst-&gt;taille = 0; }<\/code><\/pre><p>Seules les cases <code>0 … taille-1<\/code> comptent. Accès direct O(1), mais capacité fixe (<code>MAX<\/code>) et insertion/suppression au milieu en O(n).<\/p>\n<h2>Idée 2 · Insérer à une position = décaler à droite<\/h2>\n<figure class=\"grille\"><figcaption>insererA(lst, 9, 1) sur [4, 7, 8] : décalage depuis la fin, puis écriture<\/figcaption><table><tr><th><\/th><th>0<\/th><th>1<\/th><th>2<\/th><th>3<\/th><\/tr><tr><th>avant<\/th><td>4<\/td><td>7<\/td><td>8<\/td><td class=\"h0\">_<\/td><\/tr><tr><th>décalé<\/th><td>4<\/td><td>7<\/td><td class=\"h1\">7<\/td><td class=\"h1\">8<\/td><\/tr><tr><th>après<\/th><td>4<\/td><td class=\"h2\">9<\/td><td>7<\/td><td>8<\/td><\/tr><\/table><\/figure><figure class=\"etapes\" data-i=\"0\"><figcaption>insererA(lst, valeur, index)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Liste pleine ?<\/div><p><code>if (lst-&gt;taille &gt;= MAX)<\/code> : message et retour.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Indice valide ?<\/div><p><code>0 ≤ index ≤ taille<\/code> (index = taille revient à ajouter à la fin).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Décaler<\/div><p><code>for (i = lst-&gt;taille; i &gt; index; i--) lst-&gt;data[i] = lst-&gt;data[i-1];<\/code><\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Écrire et compter<\/div><p><code>lst-&gt;data[index] = valeur; lst-&gt;taille++;<\/code><\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Idée 3 · Supprimer = décaler à gauche<\/h2>\n<pre class=\"\"><code>#include &lt;stdio.h&gt;\n#define MAX 100\n\ntypedef struct { int data[MAX]; int taille; } Liste;\n\nvoid initialiserListe(Liste *lst) { lst-&gt;taille = 0; }\nvoid afficherListe(Liste *lst) {\n    if (lst-&gt;taille == 0) { printf(&quot;La liste est vide.\\n&quot;); return; }\n    printf(&quot;Liste : &quot;);\n    for (int i = 0; i &lt; lst-&gt;taille; i++) printf(&quot;%d &quot;, lst-&gt;data[i]);\n    printf(&quot;\\n&quot;);\n}\nvoid insererA(Liste *lst, int valeur, int index) {\n    if (lst-&gt;taille &gt;= MAX) { printf(&quot;Liste pleine !\\n&quot;); return; }\n    if (index &lt; 0 || index &gt; lst-&gt;taille) { printf(&quot;Indice invalide !\\n&quot;); return; }\n    for (int i = lst-&gt;taille; i &gt; index; i--) lst-&gt;data[i] = lst-&gt;data[i - 1];\n    lst-&gt;data[index] = valeur;\n    lst-&gt;taille++;\n}\nvoid supprimerElement(Liste *lst, int valeur) {\n    int i, index = -1;\n    if (lst-&gt;taille == 0) { printf(&quot;Liste vide !\\n&quot;); return; }\n    for (i = 0; i &lt; lst-&gt;taille; i++)\n        if (lst-&gt;data[i] == valeur) { index = i; break; }\n    if (index == -1) { printf(&quot;Element non trouve !\\n&quot;); return; }\n    for (i = index; i &lt; lst-&gt;taille - 1; i++) lst-&gt;data[i] = lst-&gt;data[i + 1];\n    lst-&gt;taille--;\n}\nint rechercher(Liste *lst, int valeur) {\n    for (int i = 0; i &lt; lst-&gt;taille; i++) if (lst-&gt;data[i] == valeur) return i;\n    return -1;\n}\nint main(void) {\n    Liste L;\n    initialiserListe(&amp;L);\n    insererA(&amp;L, 4, 0); insererA(&amp;L, 7, 1); insererA(&amp;L, 8, 2);\n    insererA(&amp;L, 9, 1);\n    afficherListe(&amp;L);\n    insererA(&amp;L, 5, 9);\n    printf(&quot;position de 7 : %d\\n&quot;, rechercher(&amp;L, 7));\n    supprimerElement(&amp;L, 9);\n    supprimerElement(&amp;L, 42);\n    afficherListe(&amp;L);\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Liste : 4 9 7 8 \nIndice invalide !\nposition de 7 : 2\nElement non trouve !\nListe : 4 7 8 <\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Sur la diapo <code>supprimerElement<\/code>, l&#39;accolade du <code>if (lst-&gt;taille == 0) { … return;<\/code> n&#39;est pas fermée : tout le reste de la fonction se retrouve dans le <code>if<\/code>. Ferme-la juste après <code>return;<\/code>. La diapo écrit aussi « Indece » pour « Indice ».<\/p>\n<\/aside><aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>Le TP1 demande la même liste avec un <strong>tableau alloué dynamiquement<\/strong> : <code>int *data = malloc(capacite * sizeof(int));<\/code> au lieu de <code>int data[MAX]<\/code>, et <code>free(data)<\/code> à la fin.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices types (TD1 ex. 1.1)<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Écris <code>Supprimer(liste *lst, int pos)<\/code> qui supprime l&#39;élément à la <strong>position<\/strong> <code>pos<\/code> (et non une valeur).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>if (pos &lt; 0 || pos &gt;= lst-&gt;taille) { printf(&quot;indice invalide&quot;); return; }<\/code>\n<code>for (i = pos; i &lt; lst-&gt;taille - 1; i++) lst-&gt;donnee[i] = lst-&gt;donnee[i+1];<\/code>\n<code>lst-&gt;taille--;<\/code> Attention : ici <code>pos == taille<\/code> est <strong>invalide<\/strong> (contrairement à l&#39;insertion).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Combien d&#39;affectations fait <code>insererA<\/code> pour insérer en position 0 dans une liste de 50 éléments (décalages + écriture) ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 51<\/b><\/p><p>50 décalages vers la droite + 1 écriture.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Quelle liste choisir pour lire souvent le k-ième élément et insérer rarement ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>La liste contiguë (tableau) : accès direct O(1).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Dans une liste contiguë vide, <code>taille<\/code> vaut :<\/div><button class=\"opt\" data-o=\"0\">0<\/button><button class=\"opt\" data-o=\"1\">-1<\/button><button class=\"opt\" data-o=\"2\">MAX<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">La liste est pleine quand :<\/div><button class=\"opt\" data-o=\"0\"><code>taille == 0<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>taille &gt;= MAX<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>taille == MAX - 1<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Pour insérer en position <code>index<\/code>, la boucle de décalage est :<\/div><button class=\"opt\" data-o=\"0\"><code>for (i = index; i &lt; taille; i++) data[i+1] = data[i];<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>for (i = taille; i &gt; index; i--) data[i] = data[i-1];<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>for (i = 0; i &lt; index; i++) data[i] = data[i+1];<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\"><code>insererA(&amp;L, x, L.taille)<\/code> :<\/div><button class=\"opt\" data-o=\"0\">ajoute x à la fin<\/button><button class=\"opt\" data-o=\"1\">est refusé<\/button><button class=\"opt\" data-o=\"2\">écrase le dernier<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\"><code>rechercher<\/code> retourne quoi si la valeur est absente ?<\/div><button class=\"opt\" data-o=\"0\">0<\/button><button class=\"opt\" data-o=\"1\">-1<\/button><button class=\"opt\" data-o=\"2\">NULL<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Coût de la suppression du premier élément d&#39;une liste contiguë de n éléments :<\/div><button class=\"opt\" data-o=\"0\">O(1)<\/button><button class=\"opt\" data-o=\"1\">O(n)<\/button><button class=\"opt\" data-o=\"2\">O(log n)<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Inconvénient principal de la version <code>int data[MAX]<\/code> :<\/div><button class=\"opt\" data-o=\"0\">capacité fixe<\/button><button class=\"opt\" data-o=\"1\">accès lent<\/button><button class=\"opt\" data-o=\"2\">pas de recherche possible<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Après suppression, il ne faut pas oublier :<\/div><button class=\"opt\" data-o=\"0\"><code>free(lst)<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>lst-&gt;taille--<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>lst-&gt;taille = 0<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Sur [4, 9, 7, 8], <code>supprimerElement(&amp;L, 9)<\/code> donne :<\/div><button class=\"opt\" data-o=\"0\">[4, 7, 8, 8]<\/button><button class=\"opt\" data-o=\"1\">[4, 7, 8]<\/button><button class=\"opt\" data-o=\"2\">[9, 7, 8]<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">La diapo <code>supprimerElement<\/code> a un défaut de syntaxe :<\/div><button class=\"opt\" data-o=\"0\">un <code>;<\/code> en trop<\/button><button class=\"opt\" data-o=\"1\">une accolade non fermée après le test « liste vide »<\/button><button class=\"opt\" data-o=\"2\">un mauvais type de retour<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"liste-tableau","rep":null,"tol":null},{"n":"liste-tableau","rep":null,"tol":null},{"n":"liste-tableau","rep":["51"],"tol":null},{"n":"liste-tableau","rep":null,"tol":null}],"qcm":[{"n":"liste-tableau","q":"Dans une liste contiguë vide, <code>taille<\/code> vaut :","o":["0","-1","MAX"],"a":0,"e":"On initialise <code>taille<\/code> à 0."},{"n":"liste-tableau","q":"La liste est pleine quand :","o":["<code>taille == 0<\/code>","<code>taille &gt;= MAX<\/code>","<code>taille == MAX - 1<\/code>"],"a":1,"e":"Toutes les cases 0…MAX-1 sont occupées."},{"n":"liste-tableau","q":"Pour insérer en position <code>index<\/code>, la boucle de décalage est :","o":["<code>for (i = index; i &lt; taille; i++) data[i+1] = data[i];<\/code>","<code>for (i = taille; i &gt; index; i--) data[i] = data[i-1];<\/code>","<code>for (i = 0; i &lt; index; i++) data[i] = data[i+1];<\/code>"],"a":1,"e":"On part de la fin pour ne rien écraser."},{"n":"liste-tableau","q":"<code>insererA(&amp;L, x, L.taille)<\/code> :","o":["ajoute x à la fin","est refusé","écrase le dernier"],"a":0,"e":"index = taille est valide : aucun décalage."},{"n":"liste-tableau","q":"<code>rechercher<\/code> retourne quoi si la valeur est absente ?","o":["0","-1","NULL"],"a":1,"e":"-1 n&#39;est jamais un indice valide."},{"n":"liste-tableau","q":"Coût de la suppression du premier élément d&#39;une liste contiguë de n éléments :","o":["O(1)","O(n)","O(log n)"],"a":1,"e":"Tout le reste est décalé vers la gauche."},{"n":"liste-tableau","q":"Inconvénient principal de la version <code>int data[MAX]<\/code> :","o":["capacité fixe","accès lent","pas de recherche possible"],"a":0,"e":"La taille maximale est figée à la compilation."},{"n":"liste-tableau","q":"Après suppression, il ne faut pas oublier :","o":["<code>free(lst)<\/code>","<code>lst-&gt;taille--<\/code>","<code>lst-&gt;taille = 0<\/code>"],"a":1,"e":"Sinon la dernière case est comptée deux fois."},{"n":"liste-tableau","q":"Sur [4, 9, 7, 8], <code>supprimerElement(&amp;L, 9)<\/code> donne :","o":["[4, 7, 8, 8]","[4, 7, 8]","[9, 7, 8]"],"a":1,"e":"Décalage à gauche, puis taille passe de 4 à 3."},{"n":"liste-tableau","q":"La diapo <code>supprimerElement<\/code> a un défaut de syntaxe :","o":["un <code>;<\/code> en trop","une accolade non fermée après le test « liste vide »","un mauvais type de retour"],"a":1,"e":"Il faut fermer le <code>if<\/code> juste après <code>return;<\/code>."}]},{"id":"piles","t":"Piles (LIFO) · tableau et liste chaînée","seance":"Chapitre III · Piles et files (1)","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Une pile est une liste où l&#39;on ne touche qu&#39;<strong>un seul bout<\/strong>. Il te faut l&#39;insertion et la suppression en tête d&#39;une liste simple (chapitre 2).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Dans une liste simple, quelle insertion et quelle suppression sont en O(1) ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>L&#39;insertion <strong>en tête<\/strong> et la suppression <strong>en tête<\/strong>. C&#39;est pour ça que le sommet d&#39;une pile chaînée est la tête de la liste.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Pense à une pile d&#39;assiettes : on pose sur le dessus, on prend sur le dessus. Le seul repère est le <strong>sommet<\/strong>.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Dans la version tableau, <code>top<\/code> est l&#39;indice du <strong>dernier élément<\/strong>, pas le nombre d&#39;éléments. Pile vide : <code>top == -1<\/code>. Pile pleine : <code>top == MAX_SIZE - 1<\/code>.<\/p>\n<\/aside><p>À la fin, tu sais écrire une pile en tableau et en liste chaînée, avec <code>empiler<\/code>, <code>depiler<\/code>, <code>sommet<\/code>, <code>estVide<\/code>, <code>viderPile<\/code>.<\/p>\n<h2>Idée 1 · LIFO : dernier entré, premier sorti<\/h2>\n<p>Exemple du cours : on empile 6, 3, 16, on dépile, puis on empile 87.<\/p>\n<svg viewBox=\"0 0 600 170\" style=\"width:100%;max-width:600px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Evolution de la pile : 6 ; 6 3 ; 6 3 16 ; après dépilement 6 3 ; puis 6 3 87\">\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\">\n<g transform=\"translate(20,0)\"><rect x=\"0\" y=\"110\" width=\"70\" height=\"28\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"35\" y=\"129\">6<\/text><text x=\"35\" y=\"160\">push 6<\/text><\/g>\n<g transform=\"translate(135,0)\"><rect x=\"0\" y=\"110\" width=\"70\" height=\"28\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"35\" y=\"129\">6<\/text><rect x=\"0\" y=\"82\" width=\"70\" height=\"28\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"35\" y=\"101\">3<\/text><text x=\"35\" y=\"160\">push 3<\/text><\/g>\n<g transform=\"translate(250,0)\"><rect x=\"0\" y=\"110\" width=\"70\" height=\"28\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"35\" y=\"129\">6<\/text><rect x=\"0\" y=\"82\" width=\"70\" height=\"28\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"35\" y=\"101\">3<\/text><rect x=\"0\" y=\"54\" width=\"70\" height=\"28\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"35\" y=\"73\">16<\/text><text x=\"35\" y=\"160\">push 16<\/text><\/g>\n<g transform=\"translate(365,0)\"><rect x=\"0\" y=\"110\" width=\"70\" height=\"28\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"35\" y=\"129\">6<\/text><rect x=\"0\" y=\"82\" width=\"70\" height=\"28\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"35\" y=\"101\">3<\/text><text x=\"35\" y=\"40\" fill=\"#D9824F\">16 sort<\/text><text x=\"35\" y=\"160\">pop<\/text><\/g>\n<g transform=\"translate(480,0)\"><rect x=\"0\" y=\"110\" width=\"70\" height=\"28\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"35\" y=\"129\">6<\/text><rect x=\"0\" y=\"82\" width=\"70\" height=\"28\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"35\" y=\"101\">3<\/text><rect x=\"0\" y=\"54\" width=\"70\" height=\"28\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"35\" y=\"73\">87<\/text><text x=\"35\" y=\"160\">push 87<\/text><\/g>\n<\/g><\/svg><p>Opérations : <strong>empiler<\/strong> (push), <strong>dépiler<\/strong> (pop), <strong>sommet<\/strong> (peek, lire sans retirer), <strong>estVide<\/strong>, <strong>estPleine<\/strong> (tableau seulement). Usages du cours : annuler (Undo), historique d&#39;un navigateur, parcours en profondeur.<\/p>\n<h2>Idée 2 · Pile en tableau : un indice <code>top<\/code><\/h2>\n<pre class=\"\"><code>#include &lt;stdio.h&gt;\n#define MAX_SIZE 100\n\ntypedef struct { int data[MAX_SIZE]; int top; } Pile;\n\nvoid init(Pile *s) { s-&gt;top = -1; }\nint estVide(Pile *s) { return s-&gt;top == -1; }\nvoid empile(Pile *s, int value) {\n    if (s-&gt;top == MAX_SIZE - 1) { printf(&quot;La pile est pleine.\\n&quot;); return; }\n    s-&gt;top++;\n    s-&gt;data[s-&gt;top] = value;\n}\nint depile(Pile *s) {\n    if (estVide(s)) { printf(&quot;La pile est vide.\\n&quot;); return -1; }\n    return s-&gt;data[s-&gt;top--];\n}\nint peek(Pile *s) {\n    if (estVide(s)) { printf(&quot;La pile est vide.\\n&quot;); return -1; }\n    return s-&gt;data[s-&gt;top];\n}\nvoid afficherPile(Pile *s) {\n    printf(&quot;Pile : &quot;);\n    for (int i = s-&gt;top; i &gt;= 0; i--) printf(&quot;%d &quot;, s-&gt;data[i]);\n    printf(&quot;\\n&quot;);\n}\nint main(void) {\n    Pile p; init(&amp;p);\n    empile(&amp;p, 6); empile(&amp;p, 3); empile(&amp;p, 16);\n    printf(&quot;depile : %d\\n&quot;, depile(&amp;p));\n    empile(&amp;p, 87);\n    afficherPile(&amp;p);\n    printf(&quot;sommet : %d, top = %d\\n&quot;, peek(&amp;p), p.top);\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>depile : 16\nPile : 87 3 6 \nsommet : 87, top = 2<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Dans les diapos, <code>peek<\/code> et <code>depile<\/code> font <code>return ;<\/code> (sans valeur) quand la pile est vide, alors qu&#39;elles retournent un <code>int<\/code>. C&#39;est un comportement indéfini. Retourne une valeur d&#39;erreur, comme <code>-1<\/code> (choix fait aussi dans la version chaînée du cours).<\/p>\n<\/aside><h2>Idée 3 · Pile chaînée : le sommet est la tête<\/h2>\n<figure class=\"flux\"><figcaption>Pile chaînée après empiler 10, 20, 30<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">pile (sommet)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">30<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">20<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">10<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">NULL<\/div><\/div><\/figure><p>Empiler = insérer en tête, dépiler = supprimer en tête. Pas de limite de taille, pas de <code>estPleine<\/code>.<\/p>\n<pre class=\"\"><code>#include &lt;stdio.h&gt;\n#include &lt;stdlib.h&gt;\n\ntypedef struct Noeud { int donnee; struct Noeud *suivant; } Noeud;\n\nvoid initialiser(Noeud **pile) { *pile = NULL; }\nint estVide(Noeud *pile) { return pile == NULL; }\nNoeud *empiler(Noeud *pile, int valeur) {\n    Noeud *n = malloc(sizeof(Noeud));\n    if (n == NULL) { printf(&quot;Erreur d'allocation\\n&quot;); return pile; }\n    n-&gt;donnee = valeur; n-&gt;suivant = pile;\n    return n;\n}\nint depiler(Noeud **pile) {\n    if (estVide(*pile)) { printf(&quot;pile vide\\n&quot;); return -1; }\n    Noeud *temp = *pile;\n    int val = temp-&gt;donnee;\n    *pile = temp-&gt;suivant;\n    free(temp);\n    return val;\n}\nint sommet(Noeud *pile) { return estVide(pile) ? -1 : pile-&gt;donnee; }\nint taille_pile(Noeud *pile) {\n    int c = 0;\n    for (; pile != NULL; pile = pile-&gt;suivant) c++;\n    return c;\n}\nvoid afficher(Noeud *pile) {\n    printf(&quot;Pile :&quot;);\n    for (; pile != NULL; pile = pile-&gt;suivant) printf(&quot; %d&quot;, pile-&gt;donnee);\n    printf(&quot;\\n&quot;);\n}\nNoeud *viderPile(Noeud *pile) {\n    while (!estVide(pile)) depiler(&amp;pile);\n    return NULL;\n}\nint main(void) {\n    Noeud *pile;\n    initialiser(&amp;pile);\n    pile = empiler(pile, 10); pile = empiler(pile, 20); pile = empiler(pile, 30);\n    afficher(pile);\n    printf(&quot;taille %d, sommet %d\\n&quot;, taille_pile(pile), sommet(pile));\n    printf(&quot;depile : %d\\n&quot;, depiler(&amp;pile));\n    afficher(pile);\n    pile = viderPile(pile);\n    printf(&quot;vide ? %d\\n&quot;, estVide(pile));\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Pile : 30 20 10\ntaille 3, sommet 30\ndepile : 30\nPile : 20 10\nvide ? 1<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Diapo <code>push<\/code> : en cas d&#39;échec de <code>malloc<\/code>, elle fait <code>return ;<\/code> dans une fonction qui retourne <code>Noeud*<\/code>. On retourne plutôt <code>pile<\/code> inchangée. La diapo écrit aussi <code>Nœud**<\/code> (avec œ) dans <code>pop<\/code> : ce n&#39;est pas un identifiant C valide, c&#39;est <code>Noeud<\/code>.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices types (TD2, TP2)<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Écris <code>Noeud* inverse_pile(Noeud *pile)<\/code> (TD2 / TP2 question 8).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Dépile tout dans une nouvelle pile.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><code>Noeud *r = NULL; while (!estVide(pile)) r = empiler(r, depiler(&amp;pile)); return r;<\/code> Le sommet devient la base.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/butt
