on><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Écris <code>copierPile<\/code> qui renvoie une copie <strong>indépendante<\/strong> dans le même ordre (TP2 question 11).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Deux passages : on parcourt la pile en empilant dans une pile <code>tmp<\/code> (ordre inversé), puis on parcourt <code>tmp<\/code> en empilant dans <code>copie<\/code> (ordre rétabli), et on vide <code>tmp<\/code>. On n&#39;a pas le droit de faire <code>copie = pile<\/code> : ce serait le même chaînage.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Pile tableau vide puis : empile 5, empile 8, depile, empile 2, empile 9. Que vaut <code>top<\/code> ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 2<\/b><\/p><p>3 éléments (5, 2, 9) aux indices 0, 1, 2 : top = 2.<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 9 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">On empile 1, 2, 3 puis on dépile une fois. On obtient :<\/div><button class=\"opt\" data-o=\"0\">1<\/button><button class=\"opt\" data-o=\"1\">2<\/button><button class=\"opt\" data-o=\"2\">3<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Dans la pile tableau du cours, <code>init<\/code> fait :<\/div><button class=\"opt\" data-o=\"0\"><code>s-&gt;top = -1;<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>s-&gt;top = 0;<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>s-&gt;top = MAX_SIZE;<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Avec <code>top = 4<\/code>, combien d&#39;éléments contient la pile ?<\/div><button class=\"opt\" data-o=\"0\">4<\/button><button class=\"opt\" data-o=\"1\">5<\/button><button class=\"opt\" data-o=\"2\">3<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Pourquoi le sommet d&#39;une pile chaînée est-il la tête ?<\/div><button class=\"opt\" data-o=\"0\">par convention arbitraire<\/button><button class=\"opt\" data-o=\"1\">parce que l&#39;insertion et la suppression en tête sont en O(1)<\/button><button class=\"opt\" data-o=\"2\">parce que la queue est NULL<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Quelle opération n&#39;existe que pour la pile en tableau ?<\/div><button class=\"opt\" data-o=\"0\">estVide<\/button><button class=\"opt\" data-o=\"1\">estPleine<\/button><button class=\"opt\" data-o=\"2\">sommet<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\"><code>peek<\/code> :<\/div><button class=\"opt\" data-o=\"0\">retire le sommet<\/button><button class=\"opt\" data-o=\"1\">lit le sommet sans le retirer<\/button><button class=\"opt\" data-o=\"2\">vide la pile<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Dans <code>depiler<\/code> (chaînée), l&#39;ordre correct est :<\/div><button class=\"opt\" data-o=\"0\">sauver le nœud, lire la valeur, avancer la tête, <code>free<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>free<\/code>, lire la valeur, avancer la tête<\/button><button class=\"opt\" data-o=\"2\">avancer la tête, <code>free<\/code> de la tête<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Pourquoi <code>depiler<\/code> prend-il <code>Noeud **pile<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">pour aller plus vite<\/button><button class=\"opt\" data-o=\"1\">parce qu&#39;il modifie le sommet du <code>main<\/code><\/button><button class=\"opt\" data-o=\"2\">parce qu&#39;il retourne un pointeur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Le parcours en profondeur utilise :<\/div><button class=\"opt\" data-o=\"0\">une pile<\/button><button class=\"opt\" data-o=\"1\">une file<\/button><button class=\"opt\" data-o=\"2\">un tableau trié<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Diapo <code>peek<\/code> : <code>return ;<\/code> dans une fonction <code>int<\/code> est :<\/div><button class=\"opt\" data-o=\"0\">correct<\/button><button class=\"opt\" data-o=\"1\">une erreur (valeur de retour indéfinie)<\/button><button class=\"opt\" data-o=\"2\">obligatoire<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"piles","rep":null,"tol":null},{"n":"piles","rep":null,"tol":null},{"n":"piles","rep":null,"tol":null},{"n":"piles","rep":["2"],"tol":null}],"qcm":[{"n":"piles","q":"On empile 1, 2, 3 puis on dépile une fois. On obtient :","o":["1","2","3"],"a":2,"e":"Le dernier entré sort en premier."},{"n":"piles","q":"Dans la pile tableau du cours, <code>init<\/code> fait :","o":["<code>s-&gt;top = -1;<\/code>","<code>s-&gt;top = 0;<\/code>","<code>s-&gt;top = MAX_SIZE;<\/code>"],"a":0,"e":"-1 signifie « aucun élément »."},{"n":"piles","q":"Avec <code>top = 4<\/code>, combien d&#39;éléments contient la pile ?","o":["4","5","3"],"a":1,"e":"Indices 0 à 4."},{"n":"piles","q":"Pourquoi le sommet d&#39;une pile chaînée est-il la tête ?","o":["par convention arbitraire","parce que l&#39;insertion et la suppression en tête sont en O(1)","parce que la queue est NULL"],"a":1,"e":"En queue, il faudrait parcourir toute la liste."},{"n":"piles","q":"Quelle opération n&#39;existe que pour la pile en tableau ?","o":["estVide","estPleine","sommet"],"a":1,"e":"La pile chaînée n&#39;a pas de taille maximale."},{"n":"piles","q":"<code>peek<\/code> :","o":["retire le sommet","lit le sommet sans le retirer","vide la pile"],"a":1,"e":"C&#39;est la définition du cours."},{"n":"piles","q":"Dans <code>depiler<\/code> (chaînée), l&#39;ordre correct est :","o":["sauver le nœud, lire la valeur, avancer la tête, <code>free<\/code>","<code>free<\/code>, lire la valeur, avancer la tête","avancer la tête, <code>free<\/code> de la tête"],"a":0,"e":"Après <code>free<\/code>, on ne peut plus lire le nœud."},{"n":"piles","q":"Pourquoi <code>depiler<\/code> prend-il <code>Noeud **pile<\/code> ?","o":["pour aller plus vite","parce qu&#39;il modifie le sommet du <code>main<\/code>","parce qu&#39;il retourne un pointeur"],"a":1,"e":"Il change la tête et retourne la valeur."},{"n":"piles","q":"Le parcours en profondeur utilise :","o":["une pile","une file","un tableau trié"],"a":0,"e":"Explicite (DFS itératif) ou implicite (pile d&#39;appels récursifs)."},{"n":"piles","q":"Diapo <code>peek<\/code> : <code>return ;<\/code> dans une fonction <code>int<\/code> est :","o":["correct","une erreur (valeur de retour indéfinie)","obligatoire"],"a":1,"e":"Il faut retourner une valeur d&#39;erreur, par exemple -1."}]},{"id":"files","t":"Files (FIFO) · liste chaînée et tableau","seance":"Chapitre III · Piles et files (2)","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Une file ajoute <strong>en queue<\/strong> et retire <strong>en tête<\/strong>. Il te faut l&#39;insertion en queue et la suppression en tête d&#39;une liste simple.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Dans une liste simple qui ne garde que la tête, combien coûte l&#39;insertion en queue ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>O(n) : il faut parcourir jusqu&#39;au dernier. La file garde donc <strong>deux<\/strong> pointeurs, <code>tete<\/code> et <code>queue<\/code>, pour enfiler en O(1).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Pense à la file d&#39;attente à la scolarité de la FSABM : on entre par l&#39;arrière, on sort par l&#39;avant. Deux repères : <code>tete<\/code> (qui sort) et <code>queue<\/code> (qui vient d&#39;arriver).<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Oublier de remettre <code>queue<\/code> à NULL quand on défile le <strong>dernier<\/strong> élément. La tête vaut NULL mais <code>queue<\/code> pointe sur un nœud libéré : le prochain <code>enfiler<\/code> écrit dans de la mémoire libérée.<\/p>\n<\/aside><p>À la fin, tu sais écrire une file chaînée complète et expliquer la limite de la file en tableau statique.<\/p>\n<h2>Idée 1 · FIFO avec deux pointeurs<\/h2>\n<svg viewBox=\"0 0 600 130\" style=\"width:100%;max-width:600px;display:block;margin:10px auto\" role=\"img\" aria-label=\"File 10, 20, 30 : tete pointe sur 10, queue pointe sur 30 ; on défile à gauche, on enfile à droite\">\n<g font-family=\"sans-serif\" font-size=\"14\" fill=\"currentColor\" text-anchor=\"middle\">\n<rect x=\"130\" y=\"50\" width=\"45\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"152\" y=\"70\">10<\/text><rect x=\"175\" y=\"50\" width=\"20\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<rect x=\"250\" y=\"50\" width=\"45\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"272\" y=\"70\">20<\/text><rect x=\"295\" y=\"50\" width=\"20\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<rect x=\"370\" y=\"50\" width=\"45\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"392\" y=\"70\">30<\/text><rect x=\"415\" y=\"50\" width=\"20\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<text x=\"490\" y=\"70\">NULL<\/text><text x=\"152\" y=\"20\">tete<\/text><text x=\"392\" y=\"20\">queue<\/text>\n<text x=\"60\" y=\"70\" fill=\"#D9824F\">← défiler<\/text><text x=\"540\" y=\"115\" fill=\"#D9824F\">enfiler →<\/text>\n<\/g>\n<g stroke=\"#D9824F\" stroke-width=\"2\"><line x1=\"185\" y1=\"65\" x2=\"248\" y2=\"65\"/><line x1=\"305\" y1=\"65\" x2=\"368\" y2=\"65\"/><line x1=\"425\" y1=\"65\" x2=\"465\" y2=\"65\"/><line x1=\"152\" y1=\"26\" x2=\"152\" y2=\"48\"/><line x1=\"392\" y1=\"26\" x2=\"392\" y2=\"48\"/><\/g>\n<\/svg><pre class=\"\"><code>#include &lt;stdio.h&gt;\n#include &lt;stdlib.h&gt;\n\ntypedef struct Noeud { int data; struct Noeud *next; } Noeud;\ntypedef struct File { Noeud *tete; Noeud *queue; } File;\n\nvoid initialiser(File *f) { f-&gt;tete = f-&gt;queue = NULL; }\nint estVide(File *f) { return f-&gt;tete == NULL; }\nvoid enfiler(File *f, int valeur) {\n    Noeud *n = malloc(sizeof(Noeud));\n    if (n == NULL) { printf(&quot;Erreur d'allocation !\\n&quot;); return; }\n    n-&gt;data = valeur; n-&gt;next = NULL;\n    if (estVide(f)) f-&gt;tete = f-&gt;queue = n;\n    else { f-&gt;queue-&gt;next = n; f-&gt;queue = n; }\n}\nint defiler(File *f) {\n    if (estVide(f)) { printf(&quot;Erreur : File vide !\\n&quot;); return -1; }\n    Noeud *temp = f-&gt;tete;\n    int valeur = temp-&gt;data;\n    f-&gt;tete = f-&gt;tete-&gt;next;\n    if (f-&gt;tete == NULL) f-&gt;queue = NULL;   /* la file devient vide */\n    free(temp);\n    return valeur;\n}\nvoid afficherFile(File *f) {\n    if (estVide(f)) { printf(&quot;File vide !\\n&quot;); return; }\n    printf(&quot;File : &quot;);\n    for (Noeud *t = f-&gt;tete; t; t = t-&gt;next) printf(&quot;%d -&gt; &quot;, t-&gt;data);\n    printf(&quot;NULL\\n&quot;);\n}\nvoid libererFile(File *f) { while (!estVide(f)) defiler(f); }\n\nint main(void) {\n    File f; initialiser(&amp;f);\n    enfiler(&amp;f, 10); enfiler(&amp;f, 20); enfiler(&amp;f, 30);\n    afficherFile(&amp;f);\n    printf(&quot;Defile : %d\\n&quot;, defiler(&amp;f));\n    afficherFile(&amp;f);\n    libererFile(&amp;f);\n    afficherFile(&amp;f);\n    printf(&quot;queue NULL ? %d\\n&quot;, f.queue == NULL);\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>File : 10 -&gt; 20 -&gt; 30 -&gt; NULL\nDefile : 10\nFile : 20 -&gt; 30 -&gt; NULL\nFile vide !\nqueue NULL ? 1<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le « programme complet » de la diapo utilise <code>f-&gt;front<\/code> dans <code>afficherFile<\/code> alors que la structure a les champs <code>tete<\/code> et <code>queue<\/code> : ça ne compile pas. Le commentaire de <code>enfiler<\/code> parle aussi de <code>rear<\/code> : c&#39;est <code>queue<\/code>.<\/p>\n<\/aside><h2>Idée 2 · File en tableau statique : <code>debut<\/code> et <code>fin<\/code><\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>File tableau (MAX = 4) : enfiler 1, 2, 3 puis défiler<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Initialisation<\/div><p><code>debut = 0<\/code>, <code>fin = -1<\/code>. Vide si <code>debut &gt; fin<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Enfiler 1, 2, 3<\/div><p><code>fin<\/code> passe à 0, 1, 2. Cases : [1, 2, 3, _].<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Défiler<\/div><p>on lit <code>elements[0] = 1<\/code>, puis <code>debut = 1<\/code>. Cases utiles : 2, 3.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Le problème<\/div><p>pleine si <code>fin == MAX - 1<\/code>. Après 1 enfilement de plus, la file est « pleine » alors que la case 0 est libre.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><figure class=\"grille\"><figcaption>Après défilement : la case 0 est perdue (grisée), debut en bleu, fin en orange<\/figcaption><table><tr><th>0<\/th><th>1<\/th><th>2<\/th><th>3<\/th><\/tr><tr><td class=\"h0\">1<\/td><td class=\"h2\">2<\/td><td>3<\/td><td class=\"h1\">4<\/td><\/tr><\/table><\/figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>La file en tableau du cours ne réutilise pas les cases libérées au début. Elle convient pour un nombre total d&#39;enfilements inférieur à <code>MAX<\/code>.<\/p>\n<\/aside><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Hors support : la solution classique est la <strong>file circulaire<\/strong> (<code>fin = (fin + 1) % MAX<\/code>), qui réutilise les cases du début. Elle n&#39;est pas dans le cours ; ne l&#39;utilise à l&#39;examen que si on te la demande.<\/p>\n<\/aside><h2>Idée 3 · Coûts<\/h2>\n<table>\n<thead>\n<tr>\n<th>Opération<\/th>\n<th>Complexité<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Enfiler<\/td>\n<td>O(1)<\/td>\n<\/tr>\n<tr>\n<td>Défiler<\/td>\n<td>O(1)<\/td>\n<\/tr>\n<tr>\n<td>Vérifier si vide<\/td>\n<td>O(1)<\/td>\n<\/tr>\n<tr>\n<td>Afficher<\/td>\n<td>O(n)<\/td>\n<\/tr>\n<tr>\n<td>Libérer<\/td>\n<td>O(n)<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>La file sert aussi au <strong>parcours en largeur<\/strong> d&#39;un arbre (chapitre 7).<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices types<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Écris <code>int tailleFile(File *f)<\/code>.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>int c = 0; for (Noeud *t = f-&gt;tete; t != NULL; t = t-&gt;next) c++; return c;<\/code><\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>File chaînée vide. On fait : enfiler 4, enfiler 7, défiler, enfiler 9, défiler. Quelle valeur est en tête ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 9<\/b><\/p><p>Après enfiler 4, 7 : [4, 7]. Défiler → [7]. Enfiler 9 → [7, 9]. Défiler → [9].<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Que se passe-t-il si on enlève la ligne <code>if (f-&gt;tete == NULL) f-&gt;queue = NULL;<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Après avoir défilé le dernier élément, <code>queue<\/code> pointe sur un nœud libéré. <code>estVide<\/code> dit vrai (tête NULL), donc le prochain <code>enfiler<\/code> fait <code>tete = queue = n<\/code> : ça marche par chance ici, mais toute fonction qui lit <code>queue<\/code> sur une file vide lit de la mémoire libérée. On remet toujours <code>queue<\/code> à NULL.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">On enfile A, B, C puis on défile. On obtient :<\/div><button class=\"opt\" data-o=\"0\">A<\/button><button class=\"opt\" data-o=\"1\">C<\/button><button class=\"opt\" data-o=\"2\">B<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Pourquoi garder un pointeur <code>queue<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">pour défiler en O(1)<\/button><button class=\"opt\" data-o=\"1\">pour enfiler en O(1)<\/button><button class=\"opt\" data-o=\"2\">pour afficher à l&#39;envers<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Enfiler dans une file vide :<\/div><button class=\"opt\" data-o=\"0\"><code>queue-&gt;next = n<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>tete = queue = n<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>tete = n<\/code> seulement<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Défiler retire l&#39;élément :<\/div><button class=\"opt\" data-o=\"0\">en tête<\/button><button class=\"opt\" data-o=\"1\">en queue<\/button><button class=\"opt\" data-o=\"2\">au milieu<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Après avoir défilé le seul élément, il faut :<\/div><button class=\"opt\" data-o=\"0\">libérer la structure File<\/button><button class=\"opt\" data-o=\"1\">mettre <code>queue<\/code> à NULL<\/button><button class=\"opt\" data-o=\"2\">mettre <code>tete<\/code> à <code>queue<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Dans la file tableau du cours, la file est vide quand :<\/div><button class=\"opt\" data-o=\"0\"><code>fin == -1<\/code> seulement<\/button><button class=\"opt\" data-o=\"1\"><code>debut &gt; fin<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>debut == 0<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Complexité de « Défiler » :<\/div><button class=\"opt\" data-o=\"0\">O(1)<\/button><button class=\"opt\" data-o=\"1\">O(n)<\/button><button class=\"opt\" data-o=\"2\">O(log n)<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Quelle erreur contient le programme complet de la diapo ?<\/div><button class=\"opt\" data-o=\"0\"><code>malloc<\/code> non casté<\/button><button class=\"opt\" data-o=\"1\"><code>f-&gt;front<\/code> au lieu de <code>f-&gt;tete<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>free<\/code> manquant dans <code>defiler<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Quel parcours d&#39;arbre utilise une file ?<\/div><button class=\"opt\" data-o=\"0\">le parcours préfixé<\/button><button class=\"opt\" data-o=\"1\">le parcours en largeur<\/button><button class=\"opt\" data-o=\"2\">le parcours postfixé<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Avec MAX = 3 (tableau) : enfiler 1, 2, 3, défiler, puis enfiler 4. Résultat :<\/div><button class=\"opt\" data-o=\"0\">4 est placé en case 0<\/button><button class=\"opt\" data-o=\"1\">« File pleine ! » car fin == MAX - 1<\/button><button class=\"opt\" data-o=\"2\">4 remplace 3<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"files","rep":null,"tol":null},{"n":"files","rep":null,"tol":null},{"n":"files","rep":["9"],"tol":null},{"n":"files","rep":null,"tol":null}],"qcm":[{"n":"files","q":"On enfile A, B, C puis on défile. On obtient :","o":["A","C","B"],"a":0,"e":"Premier entré, premier sorti."},{"n":"files","q":"Pourquoi garder un pointeur <code>queue<\/code> ?","o":["pour défiler en O(1)","pour enfiler en O(1)","pour afficher à l&#39;envers"],"a":1,"e":"Sans lui, il faudrait parcourir jusqu&#39;au dernier."},{"n":"files","q":"Enfiler dans une file vide :","o":["<code>queue-&gt;next = n<\/code>","<code>tete = queue = n<\/code>","<code>tete = n<\/code> seulement"],"a":1,"e":"Le nœud est à la fois premier et dernier."},{"n":"files","q":"Défiler retire l&#39;élément :","o":["en tête","en queue","au milieu"],"a":0,"e":"On sort par l&#39;avant."},{"n":"files","q":"Après avoir défilé le seul élément, il faut :","o":["libérer la structure File","mettre <code>queue<\/code> à NULL","mettre <code>tete<\/code> à <code>queue<\/code>"],"a":1,"e":"Sinon <code>queue<\/code> pointe sur de la mémoire libérée."},{"n":"files","q":"Dans la file tableau du cours, la file est vide quand :","o":["<code>fin == -1<\/code> seulement","<code>debut &gt; fin<\/code>","<code>debut == 0<\/code>"],"a":1,"e":"Après des défilements, debut dépasse fin."},{"n":"files","q":"Complexité de « Défiler » :","o":["O(1)","O(n)","O(log n)"],"a":0,"e":"Tableau du cours."},{"n":"files","q":"Quelle erreur contient le programme complet de la diapo ?","o":["<code>malloc<\/code> non casté","<code>f-&gt;front<\/code> au lieu de <code>f-&gt;tete<\/code>","<code>free<\/code> manquant dans <code>defiler<\/code>"],"a":1,"e":"La structure n&#39;a pas de champ <code>front<\/code>."},{"n":"files","q":"Quel parcours d&#39;arbre utilise une file ?","o":["le parcours préfixé","le parcours en largeur","le parcours postfixé"],"a":1,"e":"On traite les nœuds niveau par niveau."},{"n":"files","q":"Avec MAX = 3 (tableau) : enfiler 1, 2, 3, défiler, puis enfiler 4. Résultat :","o":["4 est placé en case 0","« File pleine ! » car fin == MAX - 1","4 remplace 3"],"a":1,"e":"La case 0 libérée n&#39;est pas réutilisée."}]},{"id":"arbres-binaires","t":"Arbres et arbres binaires · vocabulaire et parcours","seance":"Chapitre IV · Arbres (1)","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Les parcours d&#39;arbre sont <strong>récursifs<\/strong>. Il faut savoir suivre une fonction qui s&#39;appelle elle-même.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p><code>void f(int n) { if (n &gt; 0) { f(n - 1); printf(&quot;%d &quot;, n); } }<\/code> Qu&#39;affiche <code>f(3)<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>1 2 3<\/code>. L&#39;appel <code>f(3)<\/code> lance d&#39;abord <code>f(2)<\/code>, qui lance <code>f(1)<\/code>, qui lance <code>f(0)<\/code> (rien). Les <code>printf<\/code> se font au retour : 1, puis 2, puis 3.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Retiens les parcours par <strong>la place de la racine<\/strong> : avant (préfixe, RGD), au milieu (infixe, GRD), après (postfixe, GDR). Gauche passe toujours avant droite.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Appliquer l&#39;ordre une seule fois à la racine puis lister « à l&#39;œil ». L&#39;ordre s&#39;applique <strong>à chaque sous-arbre<\/strong>, récursivement. Fais-le nœud par nœud.<\/p>\n<\/aside><p>À la fin, tu sais donner taille, hauteur, feuilles, degré d&#39;un arbre et écrire ses trois parcours en profondeur et son parcours en largeur.<\/p>\n<h2>Idée 1 · Le vocabulaire sur un exemple<\/h2>\n<p>L&#39;arbre du cours (notation parenthésée <code>1(2(4,5(,8)),3(6,7))<\/code>) :<\/p>\n<svg viewBox=\"0 0 420 230\" style=\"width:100%;max-width:420px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Arbre binaire : racine 1, fils 2 et 3 ; 2 a pour fils 4 et 5 ; 5 a un fils droit 8 ; 3 a pour fils 6 et 7\">\n<g stroke=\"currentColor\" stroke-width=\"2\"><line x1=\"210\" y1=\"30\" x2=\"110\" y2=\"90\"/><line x1=\"210\" y1=\"30\" x2=\"310\" y2=\"90\"/><line x1=\"110\" y1=\"90\" x2=\"60\" y2=\"150\"/><line x1=\"110\" y1=\"90\" x2=\"160\" y2=\"150\"/><line x1=\"160\" y1=\"150\" x2=\"200\" y2=\"205\"/><line x1=\"310\" y1=\"90\" x2=\"260\" y2=\"150\"/><line x1=\"310\" y1=\"90\" x2=\"360\" y2=\"150\"/><\/g>\n<g font-family=\"sans-serif\" font-size=\"15\" text-anchor=\"middle\">\n<circle cx=\"210\" cy=\"30\" r=\"17\" fill=\"#D9824F\"/><text x=\"210\" y=\"35\" fill=\"#fff\">1<\/text>\n<circle cx=\"110\" cy=\"90\" r=\"17\" fill=\"var(--bg, #fff)\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"110\" y=\"95\" fill=\"currentColor\">2<\/text>\n<circle cx=\"310\" cy=\"90\" r=\"17\" fill=\"var(--bg, #fff)\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"310\" y=\"95\" fill=\"currentColor\">3<\/text>\n<circle cx=\"60\" cy=\"150\" r=\"17\" fill=\"var(--bg, #fff)\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"60\" y=\"155\" fill=\"currentColor\">4<\/text>\n<circle cx=\"160\" cy=\"150\" r=\"17\" fill=\"var(--bg, #fff)\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"160\" y=\"155\" fill=\"currentColor\">5<\/text>\n<circle cx=\"260\" cy=\"150\" r=\"17\" fill=\"var(--bg, #fff)\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"260\" y=\"155\" fill=\"currentColor\">6<\/text>\n<circle cx=\"360\" cy=\"150\" r=\"17\" fill=\"var(--bg, #fff)\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"360\" y=\"155\" fill=\"currentColor\">7<\/text>\n<circle cx=\"200\" cy=\"205\" r=\"17\" fill=\"var(--bg, #fff)\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"200\" y=\"210\" fill=\"currentColor\">8<\/text>\n<text x=\"20\" y=\"35\" fill=\"currentColor\" font-size=\"12\" text-anchor=\"start\">niveau 0<\/text><text x=\"20\" y=\"95\" fill=\"currentColor\" font-size=\"12\" text-anchor=\"start\">1<\/text><text x=\"20\" y=\"210\" fill=\"currentColor\" font-size=\"12\" text-anchor=\"start\">3<\/text>\n<\/g><\/svg><table>\n<thead>\n<tr>\n<th>Terme<\/th>\n<th>Définition<\/th>\n<th>Ici<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Racine<\/td>\n<td>nœud sans père<\/td>\n<td>1<\/td>\n<\/tr>\n<tr>\n<td>Feuille<\/td>\n<td>nœud sans fils<\/td>\n<td>4, 8, 6, 7<\/td>\n<\/tr>\n<tr>\n<td>Nœud interne<\/td>\n<td>pas une feuille<\/td>\n<td>1, 2, 3, 5<\/td>\n<\/tr>\n<tr>\n<td>Degré d&#39;un nœud<\/td>\n<td>nombre de fils<\/td>\n<td>d°(5) = 1, d°(2) = 2<\/td>\n<\/tr>\n<tr>\n<td>Taille<\/td>\n<td>nombre de nœuds<\/td>\n<td>8<\/td>\n<\/tr>\n<tr>\n<td>Profondeur (niveau) d&#39;un nœud<\/td>\n<td>nombre de liens depuis la racine<\/td>\n<td>h(8) = 3<\/td>\n<\/tr>\n<tr>\n<td>Hauteur de l&#39;arbre<\/td>\n<td>profondeur maximale<\/td>\n<td>3<\/td>\n<\/tr>\n<tr>\n<td>Ancêtres de 8<\/td>\n<td>nœuds sur le chemin depuis la racine<\/td>\n<td>5, 2, 1<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Un <strong>arbre binaire<\/strong> : chaque nœud a au plus 2 fils, et on distingue <strong>gauche<\/strong> et <strong>droit<\/strong>. Ici 8 est le fils <strong>droit<\/strong> de 5 : d&#39;où la virgule dans <code>5(,8)<\/code>.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le cours appelle « hauteur d&#39;un nœud » ce qui est la <strong>profondeur<\/strong> (distance à la racine), puis dit qu&#39;un arbre vide a une hauteur « nulle ». Plus loin, la fonction <code>hauteur<\/code> retourne <strong>-1<\/strong> pour un arbre vide, et la correction du TD3 retourne <strong>0<\/strong>. Les deux conventions existent : à l&#39;examen, <strong>écris laquelle tu prends<\/strong> (avec -1, une feuille a hauteur 0 ; avec 0, une feuille a hauteur 1).<\/p>\n<\/aside><h2>Idée 2 · Représentation chaînée en C<\/h2>\n<p>Chaque nœud : une valeur, l&#39;adresse du fils gauche, l&#39;adresse du fils droit. L&#39;arbre est désigné par un pointeur sur la racine ; arbre vide = <code>NULL<\/code>.<\/p>\n<pre class=\"\"><code>typedef struct noeud {\n    int donnee;\n    struct noeud *gauche;   /* fils gauche */\n    struct noeud *droit;    /* fils droit  */\n} ArbreB;<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Diapos 151 et 153 : la structure est déclarée <code>struct nœud<\/code> (avec œ, invalide en C) puis pointe vers <code>struct noeud<\/code>, et <code>ajouterNoeud<\/code> écrit <code>Noeud-&gt;droite<\/code> alors que le champ s&#39;appelle <code>droit<\/code>. Utilise <strong>un seul nom<\/strong> partout (<code>noeud<\/code>, <code>droit<\/code>). On y trouve aussi <code>prinft<\/code> pour <code>printf<\/code>.<\/p>\n<\/aside><h2>Idée 3 · Les trois parcours en profondeur (DFS)<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Parcours préfixe (RGD) de l'arbre ci-dessus<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Racine 1<\/div><p>on affiche 1, puis on parcourt le sous-arbre gauche (2), puis le droit (3).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · Sous-arbre 2<\/div><p>affiche 2, puis gauche 4 (feuille : affiche 4), puis droit 5.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · Sous-arbre 5<\/div><p>affiche 5, gauche vide, droit 8 : affiche 8.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · Sous-arbre 3<\/div><p>affiche 3, puis 6, puis 7.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · Résultat<\/div><p>1 2 4 5 8 3 6 7<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><pre class=\"\"><code>#include &lt;stdio.h&gt;\n#include &lt;stdlib.h&gt;\n\ntypedef struct noeud { int donnee; struct noeud *gauche, *droit; } ArbreB;\n\nArbreB *ajouterNoeud(int v) {\n    ArbreB *n = malloc(sizeof(ArbreB));\n    n-&gt;donnee = v; n-&gt;gauche = n-&gt;droit = NULL;\n    return n;\n}\nint estVide(ArbreB *A) { return A == NULL; }\nvoid prefixe(ArbreB *A) {\n    if (!estVide(A)) { printf(&quot;%d &quot;, A-&gt;donnee); prefixe(A-&gt;gauche); prefixe(A-&gt;droit); }\n}\nvoid infixe(ArbreB *A) {\n    if (!estVide(A)) { infixe(A-&gt;gauche); printf(&quot;%d &quot;, A-&gt;donnee); infixe(A-&gt;droit); }\n}\nvoid postfixe(ArbreB *A) {\n    if (!estVide(A)) { postfixe(A-&gt;gauche); postfixe(A-&gt;droit); printf(&quot;%d &quot;, A-&gt;donnee); }\n}\n/* parcours en largeur avec une file (tableau de pointeurs) */\nvoid largeur(ArbreB *A) {\n    ArbreB *file[100]; int debut = 0, fin = 0;\n    if (A == NULL) return;\n    file[fin++] = A;                         /* enfiler la racine */\n    while (debut &lt; fin) {                    /* tant que la file n'est pas vide */\n        ArbreB *c = file[debut++];           /* défiler */\n        printf(&quot;%d &quot;, c-&gt;donnee);\n        if (c-&gt;gauche) file[fin++] = c-&gt;gauche;\n        if (c-&gt;droit)  file[fin++] = c-&gt;droit;\n    }\n}\nint taille(ArbreB *A) { return A ? 1 + taille(A-&gt;gauche) + taille(A-&gt;droit) : 0; }\nint feuilles(ArbreB *A) {\n    if (!A) return 0;\n    if (!A-&gt;gauche &amp;&amp; !A-&gt;droit) return 1;\n    return feuilles(A-&gt;gauche) + feuilles(A-&gt;droit);\n}\nvoid liberer(ArbreB *A) {                    /* postfixe : les fils avant le père */\n    if (A) { liberer(A-&gt;gauche); liberer(A-&gt;droit); free(A); }\n}\nint main(void) {\n    ArbreB *N[9];\n    for (int i = 1; i &lt;= 8; i++) N[i] = ajouterNoeud(i);\n    N[1]-&gt;gauche = N[2]; N[1]-&gt;droit = N[3];\n    N[2]-&gt;gauche = N[4]; N[2]-&gt;droit = N[5];\n    N[5]-&gt;droit = N[8];\n    N[3]-&gt;gauche = N[6]; N[3]-&gt;droit = N[7];\n    printf(&quot;prefixe  : &quot;); prefixe(N[1]);  printf(&quot;\\n&quot;);\n    printf(&quot;infixe   : &quot;); infixe(N[1]);   printf(&quot;\\n&quot;);\n    printf(&quot;postfixe : &quot;); postfixe(N[1]); printf(&quot;\\n&quot;);\n    printf(&quot;largeur  : &quot;); largeur(N[1]);  printf(&quot;\\n&quot;);\n    printf(&quot;taille %d, feuilles %d\\n&quot;, taille(N[1]), feuilles(N[1]));\n    liberer(N[1]);\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>prefixe  : 1 2 4 5 8 3 6 7 \ninfixe   : 4 2 5 8 1 6 3 7 \npostfixe : 4 8 5 2 6 7 3 1 \nlargeur  : 1 2 3 4 5 6 7 8 \ntaille 8, feuilles 4<\/code><\/pre><p>On retrouve les résultats des diapos : 12458367, 42581637, 48526731.<\/p>\n<aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>Usages cités par le prof : préfixe pour <strong>copier<\/strong> un arbre, infixe pour écrire une expression arithmétique, postfixe pour <strong>libérer la mémoire<\/strong> (on libère les fils avant le père).<\/p>\n<\/aside><h2>Idée 4 · Le parcours en largeur (BFS)<\/h2>\n<figure class=\"flux\"><figcaption>Algorithme du cours<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">Enfiler la racine<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Défiler un nœud<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Le traiter<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Enfiler son fils gauche puis son fils droit<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Recommencer tant que la file n&#39;est pas vide<\/div><\/div><\/figure><p>Niveau par niveau, de gauche à droite : 1 2 3 4 5 6 7 8. Pas de récursion : c&#39;est une <strong>file<\/strong> qui retient les nœuds à visiter (le DFS itératif, lui, utilise une <strong>pile<\/strong>).<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Parcours à la main<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Donne les trois parcours de l&#39;arbre A(B(D,E(H,I)),C(F,G)) (exemple des diapos).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Préfixe : A B D E H I C F G. Infixe : D B H E I A F C G. Postfixe : D H I E B F G C A.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Donne la notation parenthésée de l&#39;arbre : racine 1, fils gauche 2 (fils gauche 4, fils droit 5 qui a un fils gauche 8), fils droit 3 (6, 7 qui a 9 et 10).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>1(2(4,5(8,)),3(6,7(9,10)))<\/code> (arbre B des diapos).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Combien de nœuds a l&#39;arbre A(B(D,E(H,I)),C(F,G)) ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 9<\/b><\/p><p>A, B, C, D, E, F, G, H, I.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Écris <code>int hauteur(ArbreB *A)<\/code> avec la convention « arbre vide = -1 ».<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>if (A == NULL) return -1; int hg = hauteur(A-&gt;gauche), hd = hauteur(A-&gt;droit); return 1 + (hg &gt; hd ? hg : hd);<\/code><\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 10 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Dans un arbre binaire, chaque nœud a :<\/div><button class=\"opt\" data-o=\"0\">exactement 2 fils<\/button><button class=\"opt\" data-o=\"1\">au plus 2 fils<\/button><button class=\"opt\" data-o=\"2\">au moins 1 fils<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Le parcours préfixe de <code>1(2,3)<\/code> est :<\/div><button class=\"opt\" data-o=\"0\">1 2 3<\/button><button class=\"opt\" data-o=\"1\">2 1 3<\/button><button class=\"opt\" data-o=\"2\">2 3 1<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Le parcours infixe de <code>1(2,3)<\/code> est :<\/div><button class=\"opt\" data-o=\"0\">1 2 3<\/button><button class=\"opt\" data-o=\"1\">2 1 3<\/button><button class=\"opt\" data-o=\"2\">2 3 1<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Le parcours postfixe de <code>1(2,3)<\/code> est :<\/div><button class=\"opt\" data-o=\"0\">1 2 3<\/button><button class=\"opt\" data-o=\"1\">2 1 3<\/button><button class=\"opt\" data-o=\"2\">2 3 1<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Le parcours en largeur utilise :<\/div><button class=\"opt\" data-o=\"0\">une pile<\/button><button class=\"opt\" data-o=\"1\">une file<\/button><button class=\"opt\" data-o=\"2\">un tri<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Dans <code>1(2(4,5(,8)),3(6,7))<\/code>, 8 est :<\/div><button class=\"opt\" data-o=\"0\">le fils gauche de 5<\/button><button class=\"opt\" data-o=\"1\">le fils droit de 5<\/button><button class=\"opt\" data-o=\"2\">le fils droit de 2<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Hauteur de l&#39;arbre <code>1(2(4,5(,8)),3(6,7))<\/code> (racine au niveau 0) :<\/div><button class=\"opt\" data-o=\"0\">2<\/button><button class=\"opt\" data-o=\"1\">3<\/button><button class=\"opt\" data-o=\"2\">4<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Combien de feuilles dans <code>1(2(4,5(,8)),3(6,7))<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">3<\/button><button class=\"opt\" data-o=\"1\">4<\/button><button class=\"opt\" data-o=\"2\">5<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Pour libérer un arbre, on utilise :<\/div><button class=\"opt\" data-o=\"0\">le préfixe<\/button><button class=\"opt\" data-o=\"1\">l&#39;infixe<\/button><button class=\"opt\" data-o=\"2\">le postfixe<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Un arbre vide est représenté en C par :<\/div><button class=\"opt\" data-o=\"0\">un pointeur racine égal à NULL<\/button><button class=\"opt\" data-o=\"1\">un nœud de valeur 0<\/button><button class=\"opt\" data-o=\"2\">un nœud sans fils<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"arbres-binaires","rep":null,"tol":null},{"n":"arbres-binaires","rep":null,"tol":null},{"n":"arbres-binaires","rep":null,"tol":null},{"n":"arbres-binaires","rep":["9"],"tol":null},{"n":"arbres-binaires","rep":null,"tol":null}],"qcm":[{"n":"arbres-binaires","q":"Dans un arbre binaire, chaque nœud a :","o":["exactement 2 fils","au plus 2 fils","au moins 1 fils"],"a":1,"e":"0, 1 ou 2 fils."},{"n":"arbres-binaires","q":"Le parcours préfixe de <code>1(2,3)<\/code> est :","o":["1 2 3","2 1 3","2 3 1"],"a":0,"e":"Racine d&#39;abord."},{"n":"arbres-binaires","q":"Le parcours infixe de <code>1(2,3)<\/code> est :","o":["1 2 3","2 1 3","2 3 1"],"a":1,"e":"Gauche, racine, droit."},{"n":"arbres-binaires","q":"Le parcours postfixe de <code>1(2,3)<\/code> est :","o":["1 2 3","2 1 3","2 3 1"],"a":2,"e":"La racine en dernier."},{"n":"arbres-binaires","q":"Le parcours en largeur utilise :","o":["une pile","une file","un tri"],"a":1,"e":"On enfile les fils, on défile dans l&#39;ordre d&#39;arrivée."},{"n":"arbres-binaires","q":"Dans <code>1(2(4,5(,8)),3(6,7))<\/code>, 8 est :","o":["le fils gauche de 5","le fils droit de 5","le fils droit de 2"],"a":1,"e":"La virgule avant 8 indique un fils gauche vide."},{"n":"arbres-binaires","q":"Hauteur de l&#39;arbre <code>1(2(4,5(,8)),3(6,7))<\/code> (racine au niveau 0) :","o":["2","3","4"],"a":1,"e":"Le chemin 1-2-5-8 compte 3 liens."},{"n":"arbres-binaires","q":"Combien de feuilles dans <code>1(2(4,5(,8)),3(6,7))<\/code> ?","o":["3","4","5"],"a":1,"e":"4, 8, 6, 7."},{"n":"arbres-binaires","q":"Pour libérer un arbre, on utilise :","o":["le préfixe","l&#39;infixe","le postfixe"],"a":2,"e":"On ne peut pas libérer un père avant d&#39;avoir lu l&#39;adresse de ses fils."},{"n":"arbres-binaires","q":"Un arbre vide est représenté en C par :","o":["un pointeur racine égal à NULL","un nœud de valeur 0","un nœud sans fils"],"a":0,"e":"Convention du cours."}]},{"id":"abr","t":"Arbres binaires de recherche (ABR)","seance":"Chapitre IV · Arbres (2)","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Un ABR est un arbre binaire (chapitre 7) avec une règle d&#39;ordre. Il faut connaître le parcours infixe.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Donne le parcours infixe (GRD) de <code>50(30(20,40),70(60,80))<\/code>.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>20 30 40 50 60 70 80. Remarque : c&#39;est <strong>trié<\/strong>. Ce n&#39;est pas un hasard, c&#39;est la propriété clé des ABR.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Chaque opération d&#39;un ABR est une <strong>descente<\/strong> : plus petit → à gauche, plus grand → à droite. Insérer, chercher, trouver le min : c&#39;est la même descente.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Vérifier la règle seulement entre un père et ses fils. Elle porte sur <strong>tout le sous-arbre<\/strong> : dans <code>50(30(20,60),70)<\/code>, 60 &gt; 30 est correct localement, mais 60 est dans le sous-arbre <strong>gauche<\/strong> de 50 : ce n&#39;est pas un ABR.<\/p>\n<\/aside><p>À la fin, tu sais écrire tout l&#39;exercice 2 de l&#39;examen 2025 : structure, insertion, recherche, infixe, hauteur, suppression, libération.<\/p>\n<h2>Idée 1 · La règle d&#39;ordre<\/h2>\n<p>Pour tout nœud p : les clés du sous-arbre <strong>gauche<\/strong> sont <strong>plus petites<\/strong> que p, celles du sous-arbre <strong>droit<\/strong> sont <strong>plus grandes<\/strong>. Le cours n&#39;accepte pas de doublons dans l&#39;insertion.<\/p>\n<svg viewBox=\"0 0 440 200\" style=\"width:100%;max-width:440px;display:block;margin:10px auto\" role=\"img\" aria-label=\"ABR obtenu en insérant 50, 30, 70, 20, 40, 60, 80 ; la recherche de 60 passe par 50 puis 70 puis 60\">\n<g stroke=\"currentColor\" stroke-width=\"2\"><line x1=\"220\" y1=\"30\" x2=\"120\" y2=\"95\"/><line x1=\"220\" y1=\"30\" x2=\"320\" y2=\"95\"/><line x1=\"120\" y1=\"95\" x2=\"70\" y2=\"165\"/><line x1=\"120\" y1=\"95\" x2=\"170\" y2=\"165\"/><line x1=\"320\" y1=\"95\" x2=\"370\" y2=\"165\"/><\/g>\n<g stroke=\"#D9824F\" stroke-width=\"4\"><line x1=\"220\" y1=\"30\" x2=\"320\" y2=\"95\"/><line x1=\"320\" y1=\"95\" x2=\"270\" y2=\"165\"/><\/g>\n<g font-family=\"sans-serif\" font-size=\"14\" text-anchor=\"middle\">\n<circle cx=\"220\" cy=\"30\" r=\"18\" fill=\"#D9824F\"/><text x=\"220\" y=\"35\" fill=\"#fff\">50<\/text>\n<circle cx=\"120\" cy=\"95\" r=\"18\" fill=\"var(--bg, #fff)\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"120\" y=\"100\" fill=\"currentColor\">30<\/text>\n<circle cx=\"320\" cy=\"95\" r=\"18\" fill=\"#D9824F\"/><text x=\"320\" y=\"100\" fill=\"#fff\">70<\/text>\n<circle cx=\"70\" cy=\"165\" r=\"18\" fill=\"var(--bg, #fff)\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"70\" y=\"170\" fill=\"currentColor\">20<\/text>\n<circle cx=\"170\" cy=\"165\" r=\"18\" fill=\"var(--bg, #fff)\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"170\" y=\"170\" fill=\"currentColor\">40<\/text>\n<circle cx=\"270\" cy=\"165\" r=\"18\" fill=\"#D9824F\"/><text x=\"270\" y=\"170\" fill=\"#fff\">60<\/text>\n<circle cx=\"370\" cy=\"165\" r=\"18\" fill=\"var(--bg, #fff)\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"370\" y=\"170\" fill=\"currentColor\">80<\/text>\n<text x=\"400\" y=\"40\" fill=\"#D9824F\" font-size=\"12\">chercher 60 :<\/text><text x=\"400\" y=\"56\" fill=\"#D9824F\" font-size=\"12\">60&gt;50, 60&lt;70<\/text>\n<\/g><\/svg><ul>\n<li><strong>Minimum<\/strong> : descendre à gauche tant que possible (20). <strong>Maximum<\/strong> : à droite (80).<\/li>\n<li><strong>Infixe = ordre croissant.<\/strong><\/li>\n<li>Une recherche visite au plus h + 1 nœuds (h = hauteur) : rapide si l&#39;arbre est équilibré, O(n) s&#39;il est dégénéré (insertion de valeurs déjà triées : on obtient une « liste »).<\/li>\n<\/ul>\n<h2>Idée 2 · Insérer et chercher<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Insérer 27 dans l'ABR<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Partir de la racine<\/div><p>comparer 27 à la clé du nœud courant.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Descendre<\/div><p>plus petit → sous-arbre gauche ; plus grand → sous-arbre droit ; égal → on ne fait rien (pas de doublon).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Trouver NULL<\/div><p>la place vide rencontrée est celle du nouveau nœud.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Accrocher<\/div><p><code>*racine = creerNoeud(27);<\/code> d&#39;où le paramètre <code>Noeud **racine<\/code>.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Idée 3 · Supprimer : trois cas<\/h2>\n<figure class=\"flux\"><figcaption>Cas de la suppression<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">Nœud trouvé<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Feuille : free, on renvoie NULL<\/div><\/div><div class=\"flux-l\"><div class=\"flux-b\">Nœud trouvé<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Un seul fils : on renvoie ce fils au parent, free<\/div><\/div><div class=\"flux-l\"><div class=\"flux-b\">Nœud trouvé<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Deux fils : on copie le min du sous-arbre droit, puis on supprime ce min à droite<\/div><\/div><\/figure><p>Le programme ci-dessous reprend la correction du TD3 et les questions de l&#39;examen 2025.<\/p>\n<pre class=\"\"><code>#include &lt;stdio.h&gt;\n#include &lt;stdlib.h&gt;\n#include &lt;limits.h&gt;\n\ntypedef struct Noeud { int val; struct Noeud *gauche, *droite; } Noeud;\n\nNoeud *creerNoeud(int v) {\n    Noeud *n = malloc(sizeof(Noeud));\n    n-&gt;val = v; n-&gt;gauche = n-&gt;droite = NULL;\n    return n;\n}\nvoid inserer(Noeud **racine, int v) {\n    if (*racine == NULL) { *racine = creerNoeud(v); return; }\n    if (v &lt; (*racine)-&gt;val) inserer(&amp;(*racine)-&gt;gauche, v);\n    else if (v &gt; (*racine)-&gt;val) inserer(&amp;(*racine)-&gt;droite, v);\n}\nNoeud *rechercher(Noeud *r, int v) {\n    if (r == NULL || r-&gt;val == v) return r;\n    return v &lt; r-&gt;val ? rechercher(r-&gt;gauche, v) : rechercher(r-&gt;droite, v);\n}\nvoid infixe(Noeud *r) {\n    if (r) { infixe(r-&gt;gauche); printf(&quot;%d &quot;, r-&gt;val); infixe(r-&gt;droite); }\n}\nint minABR(Noeud *r) { while (r-&gt;gauche) r = r-&gt;gauche; return r-&gt;val; }\nint maxABR(Noeud *r) { while (r-&gt;droite) r = r-&gt;droite; return r-&gt;val; }\nint hauteur(Noeud *r) {               /* convention du cours : vide = -1 */\n    if (r == NULL) return -1;\n    int hg = hauteur(r-&gt;gauche), hd = hauteur(r-&gt;droite);\n    return 1 + (hg &gt; hd ? hg : hd);\n}\nNoeud *supprimer(Noeud *r, int v) {\n    if (r == NULL) return NULL;\n    if (v &lt; r-&gt;val) r-&gt;gauche = supprimer(r-&gt;gauche, v);\n    else if (v &gt; r-&gt;val) r-&gt;droite = supprimer(r-&gt;droite, v);\n    else {\n        if (r-&gt;gauche == NULL) { Noeud *t = r-&gt;droite; free(r); return t; }\n        if (r-&gt;droite == NULL) { Noeud *t = r-&gt;gauche; free(r); return t; }\n        int m = minABR(r-&gt;droite);     /* successeur */\n        r-&gt;val = m;\n        r-&gt;droite = supprimer(r-&gt;droite, m);\n    }\n    return r;\n}\nint estABR(Noeud *r, int min, int max) {\n    if (r == NULL) return 1;\n    if (r-&gt;val &lt;= min || r-&gt;val &gt;= max) return 0;\n    return estABR(r-&gt;gauche, min, r-&gt;val) &amp;&amp; estABR(r-&gt;droite, r-&gt;val, max);\n}\nvoid libererABR(Noeud *r) {\n    if (r) { libererABR(r-&gt;gauche); libererABR(r-&gt;droite); free(r); }\n}\nint main(void) {\n    Noeud *racine = NULL;\n    int t[] = {50, 30, 70, 20, 40, 60, 80};\n    for (int i = 0; i &lt; 7; i++) inserer(&amp;racine, t[i]);\n    printf(&quot;Infixe : &quot;); infixe(racine); printf(&quot;\\n&quot;);\n    printf(&quot;Min %d, Max %d, Hauteur %d\\n&quot;, minABR(racine), maxABR(racine), hauteur(racine));\n    printf(&quot;40 %s\\n&quot;, rechercher(racine, 40) ? &quot;trouve&quot; : &quot;absent&quot;);\n    racine = supprimer(racine, 20);   /* feuille */\n    racine = supprimer(racine, 30);   /* un fils */\n    racine = supprimer(racine, 50);   /* deux fils : remplacé par 60 */\n    printf(&quot;Apres suppressions : &quot;); infixe(racine); printf(&quot;\\n&quot;);\n    printf(&quot;Nouvelle racine : %d\\n&quot;, racine-&gt;val);\n    printf(&quot;ABR ? %d\\n&quot;, estABR(racine, INT_MIN, INT_MAX));\n    racine-&gt;gauche-&gt;val = 99;          /* on casse l'ordre volontairement */\n    printf(&quot;ABR ? %d\\n&quot;, estABR(racine, INT_MIN, INT_MAX));\n    libererABR(racine);\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Infixe : 20 30 40 50 60 70 80 \nMin 20, Max 80, Hauteur 2\n40 trouve\nApres suppressions : 40 60 70 80 \nNouvelle racine : 60\nABR ? 1\nABR ? 0<\/code><\/pre><aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>Point important du cours : <strong>le parcours infixe d&#39;un ABR affiche les clés en ordre croissant<\/strong>. Si ton infixe n&#39;est pas trié après une insertion, ton insertion est fausse.<\/p>\n<\/aside><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Les fonctions <code>minABR<\/code>/<code>maxABR<\/code> du TD3 ne testent pas <code>r == NULL<\/code> : sur un arbre vide elles plantent. Les versions du cours (<code>minimum<\/code>, <code>maximum<\/code>) retournent <code>NULL<\/code> dans ce cas. Autre écart : la <code>hauteur<\/code> du TD3 retourne 0 pour un arbre vide (elle compte les niveaux), celle du cours retourne -1 (elle compte les liens). Sur l&#39;arbre initial ci-dessus : 3 avec le TD3, 2 avec le cours.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices types (TD3, examen 2025)<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Hauteur de l&#39;ABR 50(30(20,40),70(60,80)) avec la convention du TD3 (arbre vide = 0) ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 3<\/b><\/p><p>Une feuille vaut 1, son père 2, la racine 3 : on compte les <strong>niveaux<\/strong>. Avec la convention du cours (vide = -1), on trouve 2 : on compte les <strong>liens<\/strong>.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Écris la recherche dans un ABR en version <strong>itérative<\/strong> (exercice proposé dans le cours).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>while (A != NULL &amp;&amp; A-&gt;val != e) A = (e &gt; A-&gt;val) ? A-&gt;droite : A-&gt;gauche; return A;<\/code><\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>On insère dans un ABR vide : 40, 20, 60, 10, 30, 80, 90. Donne la hauteur (convention du cours).<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 3<\/b><\/p><p>40 a pour fils 20 (10, 30) et 60 ; 60 a un fils droit 80, qui a un fils droit 90. Chemin 40-60-80-90 : 3 liens. C&#39;est l&#39;exemple de la dernière diapo.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Que devient <code>50(30(20,40),70(60,80))<\/code> après suppression de 50 ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>50 a deux fils : on le remplace par le min du sous-arbre droit, 60, puis on supprime 60 à droite. On obtient <code>60(30(20,40),70(,80))<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 10 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Dans un ABR, le sous-arbre gauche d&#39;un nœud contient :<\/div><button class=\"opt\" data-o=\"0\">des clés plus petites<\/button><button class=\"opt\" data-o=\"1\">des clés plus grandes<\/button><button class=\"opt\" data-o=\"2\">n&#39;importe quelles clés<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Le parcours qui donne les clés triées est :<\/div><button class=\"opt\" data-o=\"0\">préfixe<\/button><button class=\"opt\" data-o=\"1\">infixe<\/button><button class=\"opt\" data-o=\"2\">en largeur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Pour chercher 25 dans <code>30(20,40)<\/code>, on va :<\/div><button class=\"opt\" data-o=\"0\">à gauche de 30, puis à droite de 20, et on trouve NULL<\/button><button class=\"opt\" data-o=\"1\">à droite de 30<\/button><button class=\"opt\" data-o=\"2\">on parcourt tout l&#39;arbre<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">On insère 50, 30, 70, 20 dans un ABR vide. Où est 20 ?<\/div><button class=\"opt\" data-o=\"0\">fils droit de 30<\/button><button class=\"opt\" data-o=\"1\">fils gauche de 30<\/button><button class=\"opt\" data-o=\"2\">fils gauche de 70<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Le minimum d&#39;un ABR est :<\/div><button class=\"opt\" data-o=\"0\">toujours la racine<\/button><button class=\"opt\" data-o=\"1\">le nœud le plus à gauche<\/button><button class=\"opt\" data-o=\"2\">toujours une feuille de droite<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Supprimer un nœud à deux fils : on le remplace par<\/div><button class=\"opt\" data-o=\"0\">son fils gauche<\/button><button class=\"opt\" data-o=\"1\">le plus petit nœud de son sous-arbre droit<\/button><button class=\"opt\" data-o=\"2\">la racine<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Insérer 1, 2, 3, 4, 5 dans cet ordre donne un arbre :<\/div><button class=\"opt\" data-o=\"0\">équilibré<\/button><button class=\"opt\" data-o=\"1\">dégénéré (comme une liste)<\/button><button class=\"opt\" data-o=\"2\">vide<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Dans le cours, insérer une valeur déjà présente :<\/div><button class=\"opt\" data-o=\"0\">crée un doublon à gauche<\/button><button class=\"opt\" data-o=\"1\">ne fait rien<\/button><button class=\"opt\" data-o=\"2\">remplace le nœud<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\"><code>estABR(r, INT_MIN, INT_MAX)<\/code> en descendant à gauche de r appelle :<\/div><button class=\"opt\" data-o=\"0\"><code>estABR(r-&gt;gauche, min, r-&gt;val)<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>estABR(r-&gt;gauche, r-&gt;val, max)<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>estABR(r-&gt;gauche, min, max)<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Hauteur de <code>50(30(20,40),70(60,80))<\/code> avec la convention du cours (vide = -1) :<\/div><button class=\"opt\" data-o=\"0\">1<\/button><button class=\"opt\" data-o=\"1\">2<\/button><button class=\"opt\" data-o=\"2\">3<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"abr","rep":null,"tol":null},{"n":"abr","rep":["3"],"tol":null},{"n":"abr","rep":null,"tol":null},{"n":"abr","rep":["3"],"tol":null},{"n":"abr","rep":null,"tol":null}],"qcm":[{"n":"abr","q":"Dans un ABR, le sous-arbre gauche d&#39;un nœud contient :","o":["des clés plus petites","des clés plus grandes","n&#39;importe quelles clés"],"a":0,"e":"C&#39;est la règle d&#39;ordre."},{"n":"abr","q":"Le parcours qui donne les clés triées est :","o":["préfixe","infixe","en largeur"],"a":1,"e":"Gauche (plus petits), racine, droite (plus grands)."},{"n":"abr","q":"Pour chercher 25 dans <code>30(20,40)<\/code>, on va :","o":["à gauche de 30, puis à droite de 20, et on trouve NULL","à droite de 30","on parcourt tout l&#39;arbre"],"a":0,"e":"25 &lt; 30 puis 25 &gt; 20 : le fils droit de 20 est vide, 25 est absent."},{"n":"abr","q":"On insère 50, 30, 70, 20 dans un ABR vide. Où est 20 ?","o":["fils droit de 30","fils gauche de 30","fils gauche de 70"],"a":1,"e":"20 &lt; 50 → gauche ; 20 &lt; 30 → gauche."},{"n":"abr","q":"Le minimum d&#39;un ABR est :","o":["toujours la racine","le nœud le plus à gauche","toujours une feuille de droite"],"a":1,"e":"On descend à gauche tant que possible."},{"n":"abr","q":"Supprimer un nœud à deux fils : on le remplace par","o":["son fils gauche","le plus petit nœud de son sous-arbre droit","la racine"],"a":1,"e":"C&#39;est le successeur (choix du cours)."},{"n":"abr","q":"Insérer 1, 2, 3, 4, 5 dans cet ordre donne un arbre :","o":["équilibré","dégénéré (comme une liste)","vide"],"a":1,"e":"Chaque valeur va à droite de la précédente : recherche en O(n)."},{"n":"abr","q":"Dans le cours, insérer une valeur déjà présente :","o":["crée un doublon à gauche","ne fait rien","remplace le nœud"],"a":1,"e":"« pas de doublons »."},{"n":"abr","q":"<code>estABR(r, INT_MIN, INT_MAX)<\/code> en descendant à gauche de r appelle :","o":["<code>estABR(r-&gt;gauche, min, r-&gt;val)<\/code>","<code>estABR(r-&gt;gauche, r-&gt;val, max)<\/code>","<code>estABR(r-&gt;gauche, min, max)<\/code>"],"a":0,"e":"Tout le sous-arbre gauche doit être &lt; r-&gt;val."},{"n":"abr","q":"Hauteur de <code>50(30(20,40),70(60,80))<\/code> avec la convention du cours (vide = -1) :","o":["1","2","3"],"a":1,"e":"Deux liens de la racine aux feuilles."}]},{"id":"td-tp-corriges","t":"TD 1 à 3 et TP 1-2 corrigés","seance":"TD1 (listes), TD2 (piles), TD3 (ABR), TP1-TP2","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Ce chapitre reprend les exercices des TD avec une correction <strong>testée<\/strong>. Lis d&#39;abord les chapitres 2 à 8.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Quelle est la différence entre retourner la nouvelle tête et passer <code>Noeud **<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Les deux permettent de modifier la tête du <code>main<\/code>. Retour : <code>L = f(L, x);<\/code>. Double pointeur : <code>f(&amp;L, x);<\/code>. Les corrections de TD utilisent surtout le retour.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Avant de regarder une correction, écris ta version sur papier, puis teste-la sur trois cas : liste vide, un seul élément, plusieurs éléments.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Les cas limites. Presque toutes les erreurs trouvées dans les corrections scannées viennent du premier ou du dernier nœud.<\/p>\n<\/aside><p>À la fin, tu sais refaire seul les exercices des trois TD.<\/p>\n<h2>Idée 1 · TD1 : liste simple (ex. 1.2) et deux défauts de la correction<\/h2>\n<figure class=\"flux\"><figcaption>Exercice 1.2 : opérations demandées<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">Créer<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Insérer début et fin<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Afficher<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Rechercher<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Supprimer<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Compter<\/div><\/div><\/figure><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Correction scannée du TD1, <code>recherche<\/code> : la boucle est <code>while (temp-&gt;next != NULL)<\/code>. Elle s&#39;arrête <strong>avant<\/strong> d&#39;examiner le dernier nœud : chercher la dernière valeur répond « absent ». La bonne condition est <code>while (temp != NULL)<\/code>.<\/p>\n<\/aside><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Correction du TD1, <code>supprimer<\/code> : après <code>while (temp-&gt;next != NULL &amp;&amp; temp-&gt;data != val)<\/code>, on fait <code>prev-&gt;next = temp-&gt;next<\/code> sans vérifier qu&#39;on a trouvé <code>val<\/code>. Si la valeur est absente, le <strong>dernier nœud est supprimé<\/strong> à tort. Il faut tester <code>if (temp-&gt;data == val)<\/code> avant de supprimer.<\/p>\n<\/aside><h2>Idée 2 · TD1 : fusion (1.4), doublons (1.5)<\/h2>\n<figure class=\"grille\"><figcaption>Fusion de 1→4→7 et 2→3→9 : on prend à chaque fois la plus petite tête<\/figcaption><table><tr><th><\/th><th>étape1<\/th><th>étape2<\/th><th>étape3<\/th><th>étape4<\/th><th>étape5<\/th><th>étape6<\/th><\/tr><tr><th>choisi<\/th><td class=\"h1\">1<\/td><td class=\"h2\">2<\/td><td class=\"h2\">3<\/td><td class=\"h1\">4<\/td><td class=\"h1\">7<\/td><td class=\"h2\">9<\/td><\/tr><\/table><\/figure><pre class=\"\"><code>#include &lt;stdio.h&gt;\n#include &lt;stdlib.h&gt;\n\ntypedef struct Noeud { int data; struct Noeud *next; } Noeud;\n\nNoeud *inserer_en_fin(Noeud *tete, int val) {\n    Noeud *n = malloc(sizeof(Noeud)), *t;\n    n-&gt;data = val; n-&gt;next = NULL;\n    if (tete == NULL) return n;\n    for (t = tete; t-&gt;next != NULL; t = t-&gt;next);\n    t-&gt;next = n;\n    return tete;\n}\nvoid affiche(Noeud *t) {\n    for (; t; t = t-&gt;next) printf(&quot;%d &quot;, t-&gt;data);\n    printf(&quot;\\n&quot;);\n}\n/* Exercice 1.4 : version récursive de la correction */\nNoeud *fusionner(Noeud *l1, Noeud *l2) {\n    if (l1 == NULL) return l2;\n    if (l2 == NULL) return l1;\n    if (l1-&gt;data &lt; l2-&gt;data) { l1-&gt;next = fusionner(l1-&gt;next, l2); return l1; }\n    else { l2-&gt;next = fusionner(l1, l2-&gt;next); return l2; }\n}\n/* Exercice 1.5 : supprimer les doublons d'une liste triée */\nvoid supprimer_doublons(Noeud *tete) {\n    Noeud *actuel = tete;\n    while (actuel != NULL &amp;&amp; actuel-&gt;next != NULL) {\n        if (actuel-&gt;data == actuel-&gt;next-&gt;data) {\n            Noeud *d = actuel-&gt;next;\n            actuel-&gt;next = d-&gt;next;\n            free(d);\n        } else actuel = actuel-&gt;next;\n    }\n}\nint main(void) {\n    Noeud *a = NULL, *b = NULL;\n    int x[] = {1, 4, 7}, y[] = {2, 3, 9};\n    for (int i = 0; i &lt; 3; i++) { a = inserer_en_fin(a, x[i]); b = inserer_en_fin(b, y[i]); }\n    Noeud *f = fusionner(a, b);\n    affiche(f);\n    Noeud *d = NULL;\n    int z[] = {10, 10, 20, 30, 30, 30};\n    for (int i = 0; i &lt; 6; i++) d = inserer_en_fin(d, z[i]);\n    supprimer_doublons(d);\n    affiche(d);\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>1 2 3 4 7 9 \n10 20 30 <\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>La correction de 1.5 commence par <code>while (actuel-&gt;next != NULL)<\/code> : sur une liste <strong>vide<\/strong>, <code>actuel<\/code> vaut NULL et ça plante. La version ci-dessus teste <code>actuel != NULL<\/code> d&#39;abord. Elle est aussi plus simple : un seul pointeur suffit puisque la liste est triée (les doublons sont côte à côte).<\/p>\n<\/aside><aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>Une correction itérative de la fusion (fiche « Correction de l&#39;exercice 1.4 ») est aussi fournie : elle insère les nœuds de la seconde liste dans la première sans allouer de mémoire. La version récursive est plus courte et c&#39;est celle du TD.<\/p>\n<\/aside><h2>Idée 3 · TD2 et TP2 : pile chaînée complète<\/h2>\n<p>Le TP2 demande : <code>initPile<\/code>, <code>empiler<\/code>, <code>depiler<\/code>, <code>affichage<\/code>, <code>taille<\/code>, <code>estVide<\/code>, <code>sommet<\/code>, <code>inverser<\/code>, <code>rechercher<\/code>, <code>viderPile<\/code>, <code>copierPile<\/code>, puis un <code>main<\/code> qui empile 5 éléments et teste tout.<\/p>\n<pre class=\"\"><code>#include &lt;stdio.h&gt;\n#include &lt;stdlib.h&gt;\n\ntypedef struct Noeud { int donnee; struct Noeud *suivant; } Noeud;\n\nint estVide(Noeud *p) { return p == NULL; }\nNoeud *empiler(Noeud *p, int v) {\n    Noeud *n = malloc(sizeof(Noeud)); n-&gt;donnee = v; n-&gt;suivant = p; return n;\n}\nint depiler(Noeud **p) {\n    if (estVide(*p)) return -1;\n    Noeud *t = *p; int v = t-&gt;donnee; *p = t-&gt;suivant; free(t); return v;\n}\nvoid affichage(Noeud *p) {\n    printf(&quot;Pile (haut-&gt;bas) :&quot;);\n    for (; p; p = p-&gt;suivant) printf(&quot; %d&quot;, p-&gt;donnee);\n    printf(&quot;\\n&quot;);\n}\nint taille(Noeud *p) { int c = 0; for (; p; p = p-&gt;suivant) c++; return c; }\nint rechercher(Noeud *p, int v) { for (; p; p = p-&gt;suivant) if (p-&gt;donnee == v) return 1; return 0; }\nNoeud *inverser(Noeud *p) { Noeud *r = NULL; while (!estVide(p)) r = empiler(r, depiler(&amp;p)); return r; }\nNoeud *viderPile(Noeud *p) { while (!estVide(p)) depiler(&amp;p); return NULL; }\nNoeud *copierPile(Noeud *p) {\n    Noeud *tmp = NULL, *copie = NULL;\n    for (Noeud *q = p; q; q = q-&gt;suivant) tmp = empiler(tmp, q-&gt;donnee);\n    for (Noeud *q = tmp; q; q = q-&gt;suivant) copie = empiler(copie, q-&gt;donnee);\n    viderPile(tmp);\n    return copie;\n}\nint main(void) {\n    Noeud *pile = NULL;\n    for (int v = 10; v &lt;= 50; v += 10) pile = empiler(pile, v);\n    affichage(pile);\n    printf(&quot;taille %d, sommet %d, 30 present ? %d\\n&quot;, taille(pile), pile-&gt;donnee, rechercher(pile, 30));\n    Noeud *copie = copierPile(pile);\n    pile = inverser(pile);\n    affichage(pile);\n    affichage(copie);\n    pile = viderPile(pile); copie = viderPile(copie);\n    printf(&quot;vides ? %d %d\\n&quot;, estVide(pile), estVide(copie));\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Pile (haut-&gt;bas) : 50 40 30 20 10\ntaille 5, sommet 50, 30 present ? 1\nPile (haut-&gt;bas) : 10 20 30 40 50\nPile (haut-&gt;bas) : 50 40 30 20 10\nvides ? 1 1<\/code><\/pre><h2>Idée 4 · TD3 : ABR<\/h2>\n<p>Les exercices 3.1 à 3.8 (insérer, rechercher, trois parcours, min/max, hauteur, supprimer, libérer, <code>estABR<\/code>) sont tous écrits et testés dans le chapitre 8. Ce qu&#39;il faut retenir de la correction :<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>estABR(r, min, max) sur 50(30,70)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Racine 50<\/div><p>INT_MIN &lt; 50 &lt; INT_MAX : ok. On vérifie la gauche avec max = 50 et la droite avec min = 50.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Gauche 30<\/div><p>INT_MIN &lt; 30 &lt; 50 : ok. Ses fils NULL renvoient 1.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Droite 70<\/div><p>50 &lt; 70 &lt; INT_MAX : ok.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Résultat<\/div><p>1, c&#39;est un ABR. Il faut <code>#include &lt;limits.h&gt;<\/code> pour INT_MIN et INT_MAX.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>TP1 et variantes<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>TP1 ex. 1 : comment déclarer une liste contiguë <strong>dynamique<\/strong> de capacité choisie à l&#39;exécution ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>typedef struct { int *data; int taille, capacite; } Liste;<\/code> puis <code>L.data = malloc(cap * sizeof(int)); L.capacite = cap; L.taille = 0;<\/code> et à la fin <code>free(L.data);<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>TP1 ex. 2 : écris la suppression à la position <code>pos<\/code> (0 = tête) d&#39;une liste simple.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Si <code>pos == 0<\/code> : suppression en tête. Sinon, avancer <code>prev<\/code> de <code>pos - 1<\/code> pas (en vérifiant <code>prev-&gt;next != NULL<\/code>), puis <code>Noeud *d = prev-&gt;next; prev-&gt;next = d-&gt;next; free(d);<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Pourquoi <code>copierPile<\/code> ne peut pas simplement retourner <code>p<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Les deux variables pointeraient sur <strong>les mêmes nœuds<\/strong> : vider l&#39;une détruirait l&#39;autre. Il faut allouer de nouveaux nœuds.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Fusionner 1→5 et 2→3→8. Combien de nœuds a le résultat ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 5<\/b><\/p><p>1 2 3 5 8.<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\"><code>fusionner(1→4, 2→3)<\/code> retourne :<\/div><button class=\"opt\" data-o=\"0\">1→2→3→4<\/button><button class=\"opt\" data-o=\"1\">1→4→2→3<\/button><button class=\"opt\" data-o=\"2\">2→3→1→4<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Après <code>supprimer_doublons<\/code> sur 5→5→5→6 :<\/div><button class=\"opt\" data-o=\"0\">5→5→6<\/button><button class=\"opt\" data-o=\"1\">5→6<\/button><button class=\"opt\" data-o=\"2\">6<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Dans la correction du TD1, <code>recherche(liste, dernier)<\/code> :<\/div><button class=\"opt\" data-o=\"0\">trouve la valeur<\/button><button class=\"opt\" data-o=\"1\">répond « absent » à tort<\/button><button class=\"opt\" data-o=\"2\">plante toujours<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\"><code>inverser<\/code> sur la pile (haut→bas) 3 2 1 donne :<\/div><button class=\"opt\" data-o=\"0\">1 2 3<\/button><button class=\"opt\" data-o=\"1\">3 2 1<\/button><button class=\"opt\" data-o=\"2\">2 3 1<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Combien de piles temporaires utilise <code>copierPile<\/code> (version ci-dessus) ?<\/div><button class=\"opt\" data-o=\"0\">0<\/button><button class=\"opt\" data-o=\"1\">1<\/button><button class=\"opt\" data-o=\"2\">2<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Pour tester <code>estABR<\/code> sur toutes les valeurs possibles, on appelle :<\/div><button class=\"opt\" data-o=\"0\"><code>estABR(r, INT_MIN, INT_MAX)<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>estABR(r, 0, 0)<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>estABR(r, r-&gt;val, r-&gt;val)<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">La fusion récursive alloue :<\/div><button class=\"opt\" data-o=\"0\">un nœud par élément<\/button><button class=\"opt\" data-o=\"1\">aucun nœud<\/button><button class=\"opt\" data-o=\"2\">deux listes neuves<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Le TP2 demande l&#39;affichage de la pile :<\/div><button class=\"opt\" data-o=\"0\">de haut en bas<\/button><button class=\"opt\" data-o=\"1\">de bas en haut<\/button><button class=\"opt\" data-o=\"2\">dans un ordre aléatoire<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Dans le TP1, la liste « dynamique avec tableaux » utilise :<\/div><button class=\"opt\" data-o=\"0\">un <code>int data[MAX]<\/code><\/button><button class=\"opt\" data-o=\"1\">un tableau alloué avec <code>malloc<\/code><\/button><button class=\"opt\" data-o=\"2\">une liste chaînée<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Le défaut de la correction de 1.5 apparaît pour :<\/div><button class=\"opt\" data-o=\"0\">une liste vide<\/button><button class=\"opt\" data-o=\"1\">une liste sans doublon<\/button><button class=\"opt\" data-o=\"2\">une liste de 2 éléments égaux<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"td-tp-corriges","rep":null,"tol":null},{"n":"td-tp-corriges","rep":null,"tol":null},{"n":"td-tp-corriges","rep":null,"tol":null},{"n":"td-tp-corriges","rep":null,"tol":null},{"n":"td-tp-corriges","rep":["5"],"tol":null}],"qcm":[{"n":"td-tp-corriges","q":"<code>fusionner(1→4, 2→3)<\/code> retourne :","o":["1→2→3→4","1→4→2→3","2→3→1→4"],"a":0,"e":"À chaque étape, la plus petite tête."},{"n":"td-tp-corriges","q":"Après <code>supprimer_doublons<\/code> sur 5→5→5→6 :","o":["5→5→6","5→6","6"],"a":1,"e":"Les copies voisines sont supprimées."},{"n":"td-tp-corriges","q":"Dans la correction du TD1, <code>recherche(liste, dernier)<\/code> :","o":["trouve la valeur","répond « absent » à tort","plante toujours"],"a":1,"e":"La boucle s&#39;arrête avant le dernier nœud."},{"n":"td-tp-corriges","q":"<code>inverser<\/code> sur la pile (haut→bas) 3 2 1 donne :","o":["1 2 3","3 2 1","2 3 1"],"a":0,"e":"Le fond devient le sommet."},{"n":"td-tp-corriges","q":"Combien de piles temporaires utilise <code>copierPile<\/code> (version ci-dessus) ?","o":["0","1","2"],"a":1,"e":"<code>tmp<\/code>, vidée à la fin."},{"n":"td-tp-corriges","q":"Pour tester <code>estABR<\/code> sur toutes les valeurs possibles, on appelle :","o":["<code>estABR(r, INT_MIN, INT_MAX)<\/code>","<code>estABR(r, 0, 0)<\/code>","<code>estABR(r, r-&gt;val, r-&gt;val)<\/code>"],"a":0,"e":"Bornes les plus larges."},{"n":"td-tp-corriges","q":"La fusion récursive alloue :","o":["un nœud par élément","aucun nœud","deux listes neuves"],"a":1,"e":"Elle recâble les nœuds existants."},{"n":"td-tp-corriges","q":"Le TP2 demande l&#39;affichage de la pile :","o":["de haut en bas","de bas en haut","dans un ordre aléatoire"],"a":0,"e":"Du sommet vers la base."},{"n":"td-tp-corriges","q":"Dans le TP1, la liste « dynamique avec tableaux » utilise :","o":["un <code>int data[MAX]<\/code>","un tableau alloué avec <code>malloc<\/code>","une liste chaînée"],"a":1,"e":"Tableau alloué dynamiquement."},{"n":"td-tp-corriges","q":"Le défaut de la correction de 1.5 apparaît pour :","o":["une liste vide","une liste sans doublon","une liste de 2 éléments égaux"],"a":0,"e":"<code>actuel-&gt;next<\/code> avec <code>actuel == NULL<\/code>."}]},{"id":"revision-examen","t":"Révision et examen blanc","seance":"Préparation à l'examen (1 h 30)","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>L&#39;examen 2024-2025 (session ordinaire, 1 h 30) contenait <strong>deux exercices de code<\/strong> : une liste simplement chaînée complète, puis un ABR complet. Pas de question de cours isolée.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Sans regarder, écris la structure d&#39;un nœud de liste simple d&#39;entiers.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>typedef struct Noeud { int data; struct Noeud *next; } Noeud;<\/code> N&#39;oublie pas le <code>;<\/code> après chaque champ et après <code>Noeud<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside clas
