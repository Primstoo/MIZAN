s=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>À l&#39;examen, <strong>écris d&#39;abord toutes les structures et les signatures<\/strong>, puis remplis. Une signature correcte rapporte déjà des points.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Oublier le <code>main<\/code> ou la libération mémoire : l&#39;énoncé 2025 demande explicitement « créez et initialisez » et « libérez la mémoire ».<\/p>\n<\/aside><p>À la fin, tu as écrit un examen complet en temps limité.<\/p>\n<h2>Idée 1 · Le tableau de bord<\/h2>\n<table>\n<thead>\n<tr>\n<th>Structure<\/th>\n<th>Opération clé<\/th>\n<th>Coût<\/th>\n<th>Cas limite à tester<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Liste simple<\/td>\n<td>insertion en tête<\/td>\n<td>O(1)<\/td>\n<td>liste vide<\/td>\n<\/tr>\n<tr>\n<td>Liste simple<\/td>\n<td>suppression en queue<\/td>\n<td>O(n)<\/td>\n<td>un seul nœud<\/td>\n<\/tr>\n<tr>\n<td>Liste double<\/td>\n<td>suppression<\/td>\n<td>O(n) recherche + O(1)<\/td>\n<td>tête, queue<\/td>\n<\/tr>\n<tr>\n<td>Liste circulaire<\/td>\n<td>parcours<\/td>\n<td>O(n)<\/td>\n<td><code>do…while<\/code><\/td>\n<\/tr>\n<tr>\n<td>Pile tableau<\/td>\n<td>push / pop<\/td>\n<td>O(1)<\/td>\n<td><code>top == -1<\/code>, <code>top == MAX-1<\/code><\/td>\n<\/tr>\n<tr>\n<td>Pile chaînée<\/td>\n<td>push / pop<\/td>\n<td>O(1)<\/td>\n<td>pile vide<\/td>\n<\/tr>\n<tr>\n<td>File chaînée<\/td>\n<td>enfiler / défiler<\/td>\n<td>O(1)<\/td>\n<td>remettre <code>queue<\/code> à NULL<\/td>\n<\/tr>\n<tr>\n<td>ABR<\/td>\n<td>recherche / insertion<\/td>\n<td>O(h)<\/td>\n<td>doublon, arbre vide<\/td>\n<\/tr>\n<\/tbody><\/table>\n<figure class=\"flux\"><figcaption>Méthode pour toute fonction<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">Structure et signature<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Cas vide<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Cas général (dessin)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Cas un seul élément<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">free<\/div><\/div><\/figure><h2>Idée 2 · Examen blanc (sur le modèle de 2025)<\/h2>\n<p>Durée conseillée : <strong>1 h 30<\/strong>. Écris tout sur papier, puis compare.<\/p>\n<section class=\"exo\"><h3>Exercice 1 · Liste simplement chaînée (8 pts)<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><ol>\n<li>Définis la structure d&#39;un nœud contenant un entier. 2) Crée et initialise une liste vide.<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>typedef struct Noeud { int data; struct Noeud *next; } Noeud;<\/code> puis dans le <code>main<\/code> : <code>Noeud *liste = NULL;<\/code><\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><ol start=\"3\">\n<li>Écris <code>Noeud* insererTete(Noeud *tete, int v)<\/code>.<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>Noeud *n = malloc(sizeof(Noeud)); if (!n) return tete; n-&gt;data = v; n-&gt;next = tete; return n;<\/code><\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><ol start=\"4\">\n<li>Écris <code>Noeud* supprimerTete(Noeud *tete)<\/code>.<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>if (tete == NULL) return NULL; Noeud *s = tete-&gt;next; free(tete); return s;<\/code><\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><ol start=\"5\">\n<li>Écris <code>Noeud* rechercher(Noeud *tete, int v)<\/code>.<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>while (tete != NULL &amp;&amp; tete-&gt;data != v) tete = tete-&gt;next; return tete;<\/code><\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><ol start=\"6\">\n<li>Écris l&#39;affichage et 7) la libération.<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Affichage : <code>for (Noeud *p = tete; p; p = p-&gt;next) printf(&quot;%d &quot;, p-&gt;data);<\/code>\nLibération : <code>while (tete) { Noeud *s = tete-&gt;next; free(tete); tete = s; } return NULL;<\/code><\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Exercice 2 · ABR d&#39;entiers (12 pts)<\/h3><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><p>1-2) Structure d&#39;un nœud d&#39;ABR et arbre vide.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>typedef struct Noeud { int val; struct Noeud *gauche, *droite; } Noeud;<\/code> et <code>Noeud *racine = NULL;<\/code><\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"7\"><div class=\"ex-q\"><ol start=\"3\">\n<li>Insertion (récursive).<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>void inserer(Noeud **r, int v) { if (*r == NULL) { *r = creerNoeud(v); return; } if (v &lt; (*r)-&gt;val) inserer(&amp;(*r)-&gt;gauche, v); else if (v &gt; (*r)-&gt;val) inserer(&amp;(*r)-&gt;droite, v); }<\/code><\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"8\"><div class=\"ex-q\"><ol start=\"4\">\n<li>Recherche.<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>Noeud *rechercher(Noeud *r, int v) { if (!r || r-&gt;val == v) return r; return v &lt; r-&gt;val ? rechercher(r-&gt;gauche, v) : rechercher(r-&gt;droite, v); }<\/code><\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"9\"><div class=\"ex-q\"><ol start=\"5\">\n<li>Affichage infixe. Que donne-t-il après insertion de 45, 12, 60, 3, 20 ?<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>if (r) { infixe(r-&gt;gauche); printf(&quot;%d &quot;, r-&gt;val); infixe(r-&gt;droite); }<\/code> → 3 12 20 45 60 (ordre croissant).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"10\"><div class=\"ex-q\"><ol start=\"6\">\n<li>Hauteur. Valeur pour l&#39;arbre de la question 5 (convention : vide = -1) ?<\/li>\n<\/ol>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 2<\/b><\/p><p>45 → 12 → 3 (ou 20) : 2 liens. Avec la convention « vide = 0 », on répondrait 3 : précise toujours la convention.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"11\"><div class=\"ex-q\"><ol start=\"7\">\n<li>Suppression : décris les trois cas, puis supprime 12 dans l&#39;arbre de la question 5.<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Feuille : free et NULL. Un fils : on renvoie le fils. Deux fils : on copie le min du sous-arbre droit puis on le supprime. 12 a deux fils (3 et 20) : il est remplacé par 20 (min de son sous-arbre droit). Infixe : 3 20 45 60.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"12\"><div class=\"ex-q\"><ol start=\"8\">\n<li>Libération de l&#39;arbre.<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Postfixe : <code>void liberer(Noeud *r) { if (r) { liberer(r-&gt;gauche); liberer(r-&gt;droite); free(r); } }<\/code><\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><p>Le programme de référence de l&#39;exercice 2 (vérifié) :<\/p>\n<pre class=\"\"><code>#include &lt;stdio.h&gt;\n#include &lt;stdlib.h&gt;\n\ntypedef struct Noeud { int val; struct Noeud *gauche, *droite; } Noeud;\n\nNoeud *creerNoeud(int v) { Noeud *n = malloc(sizeof(Noeud)); n-&gt;val = v; n-&gt;gauche = n-&gt;droite = NULL; return n; }\nvoid inserer(Noeud **r, int v) {\n    if (*r == NULL) { *r = creerNoeud(v); return; }\n    if (v &lt; (*r)-&gt;val) inserer(&amp;(*r)-&gt;gauche, v);\n    else if (v &gt; (*r)-&gt;val) inserer(&amp;(*r)-&gt;droite, v);\n}\nvoid infixe(Noeud *r) { if (r) { infixe(r-&gt;gauche); printf(&quot;%d &quot;, r-&gt;val); infixe(r-&gt;droite); } }\nint hauteur(Noeud *r) {\n    if (!r) return -1;\n    int g = hauteur(r-&gt;gauche), d = hauteur(r-&gt;droite);\n    return 1 + (g &gt; d ? g : d);\n}\nNoeud *supprimer(Noeud *r, int v) {\n    if (!r) return NULL;\n    if (v &lt; r-&gt;val) r-&gt;gauche = supprimer(r-&gt;gauche, v);\n    else if (v &gt; r-&gt;val) r-&gt;droite = supprimer(r-&gt;droite, v);\n    else {\n        if (!r-&gt;gauche) { Noeud *t = r-&gt;droite; free(r); return t; }\n        if (!r-&gt;droite) { Noeud *t = r-&gt;gauche; free(r); return t; }\n        Noeud *m = r-&gt;droite; while (m-&gt;gauche) m = m-&gt;gauche;\n        r-&gt;val = m-&gt;val;\n        r-&gt;droite = supprimer(r-&gt;droite, m-&gt;val);\n    }\n    return r;\n}\nvoid liberer(Noeud *r) { if (r) { liberer(r-&gt;gauche); liberer(r-&gt;droite); free(r); } }\nint main(void) {\n    Noeud *racine = NULL;\n    int t[] = {45, 12, 60, 3, 20};\n    for (int i = 0; i &lt; 5; i++) inserer(&amp;racine, t[i]);\n    infixe(racine); printf(&quot;| hauteur %d\\n&quot;, hauteur(racine));\n    racine = supprimer(racine, 12);\n    infixe(racine); printf(&quot;| gauche de 45 : %d\\n&quot;, racine-&gt;gauche-&gt;val);\n    liberer(racine);\n    return 0;\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>3 12 20 45 60 | hauteur 2\n3 20 45 60 | gauche de 45 : 20<\/code><\/pre><h2>Idée 3 · Barème indicatif<\/h2>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le barème ci-dessus (8 + 12 pts) est <strong>une hypothèse<\/strong> de ToumaiLearn : l&#39;énoncé 2025 n&#39;indique pas de points. Demande le barème au prof.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Questions éclair<\/h3><div class=\"ex\" data-x=\"13\"><div class=\"ex-q\"><p>Quel parcours d&#39;un ABR affiche les clés triées ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : infixe<\/b><\/p><p>Le parcours infixe (GRD).<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"14\"><div class=\"ex-q\"><p>Quelle structure utilise le parcours en largeur ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : file<\/b><\/p><p>Une file (FIFO).<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"15\"><div class=\"ex-q\"><p>Dans une pile tableau, que vaut <code>top<\/code> pour une pile vide ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : -1<\/b><\/p><p>-1.<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 6 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quelle opération est en O(1) sur une liste simple ?<\/div><button class=\"opt\" data-o=\"0\">insertion en tête<\/button><button class=\"opt\" data-o=\"1\">insertion en queue sans pointeur de queue<\/button><button class=\"opt\" data-o=\"2\">recherche<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Après insertion de 45, 12, 60, 3, 20, la racine est :<\/div><button class=\"opt\" data-o=\"0\">3<\/button><button class=\"opt\" data-o=\"1\">45<\/button><button class=\"opt\" data-o=\"2\">20<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Dans cet arbre, le parent de 20 est :<\/div><button class=\"opt\" data-o=\"0\">12<\/button><button class=\"opt\" data-o=\"1\">45<\/button><button class=\"opt\" data-o=\"2\">60<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">On supprime 12 (deux fils 3 et 20). Il est remplacé par :<\/div><button class=\"opt\" data-o=\"0\">3<\/button><button class=\"opt\" data-o=\"1\">20<\/button><button class=\"opt\" data-o=\"2\">45<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Pour supprimer en tête d&#39;une liste vide, la fonction doit :<\/div><button class=\"opt\" data-o=\"0\">retourner NULL sans rien libérer<\/button><button class=\"opt\" data-o=\"1\">appeler free(NULL-&gt;next)<\/button><button class=\"opt\" data-o=\"2\">planter<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">File : enfiler 1, 2, 3, défiler, défiler. Il reste :<\/div><button class=\"opt\" data-o=\"0\">1<\/button><button class=\"opt\" data-o=\"1\">2<\/button><button class=\"opt\" data-o=\"2\">3<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Pile : empiler 1, 2, 3, dépiler, dépiler. Il reste :<\/div><button class=\"opt\" data-o=\"0\">1<\/button><button class=\"opt\" data-o=\"1\">2<\/button><button class=\"opt\" data-o=\"2\">3<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Quelle liste demande un <code>do…while<\/code> pour être parcourue ?<\/div><button class=\"opt\" data-o=\"0\">simplement chaînée<\/button><button class=\"opt\" data-o=\"1\">doublement chaînée<\/button><button class=\"opt\" data-o=\"2\">circulaire<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Une recherche dans un ABR dégénéré de n nœuds coûte :<\/div><button class=\"opt\" data-o=\"0\">O(1)<\/button><button class=\"opt\" data-o=\"1\">O(log n)<\/button><button class=\"opt\" data-o=\"2\">O(n)<\/butto   async function saveMemos() { saveLocal(); if (!db) return; try { await db.doc(base).set({ memos: ST.memos.slice(-30), updated: Date.now() }); } catch (e) {} }

  // ---------- appel au tuteur ----------
  const ERR = { not_granted: 'Tu n\'as pas autorisé la page à utiliser Claude. Recharge-la et accepte la demande, ou change-le dans le menu Autorisations de l\'artifact.', rate_limited: 'Trop de questions d\'un coup, ou limite d\'usage atteinte. Réessaie dans un moment.', prompt_too_large: 'L\'extrait est trop long : ouvre une partie plus précise du cours.', image_rejected: 'Cette photo n\'est pas acceptée. Essaie un JPEG ou un PNG plus léger.', refused: 'Claude n\'a pas pu répondre à cette demande. Reformule ta question.' };
  const visible = (t) => {
    const L = String(t).split('\n');
    for (let i = L.length - 1; i >= Math.max(0, L.length - 3); i--) if (/^\s*M[ÉE]MO\s*:/i.test(L[i])) return L.slice(0, i).join('\n').trim();
    return String(t).trim();
  };
  // rendu léger : on échappe le HTML d'abord, puis gras, italique, code, titres, puces, tableaux et blocs de code.
  // Les formules ($…$, $$…$$, \(…\), \[…\]) sont mises de côté avant le Markdown, puis dessinées par MathJax.
  const MATHS = [];
  const protegerMaths = (t) => {
    MATHS.length = 0;
    const garde = (tex, d) => { MATHS.push({ tex: tex.trim(), d }); return '\u0000' + (MATHS.length - 1) + '\u0000'; };
    const RX = /\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$(?=[^\s$\d])([^$\n]*?[^\s$\\])\$(?!\d)/g;
    // le code (blocs ``` et `…`) n'est jamais lu comme une formule
    return String(t).split(/(```[\s\S]*?(?:```|$))/).map((bloc, i) => i % 2 ? bloc
      : bloc.split(/(`[^`\n]*`)/).map((x, j) => j % 2 ? x : x.replace(RX, (_, a, b, c, d) => a != null ? garde(a, 1) : b != null ? garde(b, 1) : c != null ? garde(c, 0) : garde(d, 0))).join('')).join('');
  };
  const rendreMaths = (h) => h.replace(/\u0000(\d+)\u0000/g, (_, n) => { const m = MATHS[+n]; return m ? `<span class="mzt-tex${m.d ? ' d' : ''}" data-d="${m.d}">${esc(m.tex)}</span>` : ''; });
  const inl = (s) => {
    const p = s.split('`'); if (p.length % 2 === 0) { const last = p.pop(); p[p.length - 1] += '`' + last; }
    return p.map((x, i) => i % 2 ? '<code>' + esc(x) + '</code>' : esc(x).replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*\w])\*([^*\n]+)\*(?![*\w])/g, '$1<em>$2</em>')).join('');
  };
  const cellules = (l) => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim());
  const md = (t) => {
    const out = []; let list = null, code = null, tab = null;
    const flushTab = () => {
      if (!tab) return;
      if (tab.length >= 2 && /^[\s|:-]+$/.test(tab[1]) && tab[1].includes('-')) {
        const [tete, , ...corps] = tab;
        out.push('<div class="mzt-tab"><table><thead><tr>' + cellules(tete).map((c) => '<th>' + inl(c) + '</th>').join('') + '</tr></thead><tbody>'
          + corps.map((r) => '<tr>' + cellules(r).map((c) => '<td>' + inl(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>');
      } else tab.forEach((r) => out.push('<p>' + inl(r) + '</p>'));
      tab = null;
    };
    const flush = () => { flushTab(); if (list) { out.push('</' + list + '>'); list = null; } };
    protegerMaths(t).split('\n').forEach((raw) => {
      if (/^\s*```/.test(raw)) { if (code === null) { flush(); code = []; } else { out.push('<pre>' + esc(code.join('\n')) + '</pre>'); code = null; } return; }
      if (code !== null) { code.push(raw); return; }
      let m;
      if (/^\s*\|.*\|\s*$/.test(raw)) { if (list) { out.push('</' + list + '>'); list = null; } (tab = tab || []).push(raw); return; }
      flushTab();
      if ((m = raw.match(/^\s*#{1,6}\s+(.*)$/))) { flush(); out.push('<p><strong>' + inl(m[1]) + '</strong></p>'); }
      else if ((m = raw.match(/^\s*[-*•]\s+(.*)$/))) { if (list !== 'ul') { flush(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + inl(m[1]) + '</li>'); }
      else if ((m = raw.match(/^\s*\d+[.)]\s+(.*)$/))) { if (list !== 'ol') { flush(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + inl(m[1]) + '</li>'); }
      else if (!raw.trim()) flush();
      else { flush(); out.push('<p>' + inl(raw) + '</p>'); }
    });
    if (code !== null) out.push('<pre>' + esc(code.join('\n')) + '</pre>');
    flush(); return rendreMaths(out.join(''));
  };

  // ---------- MathJax : celui de la page s'il existe, sinon chargé à la première formule ----------
  let mjPret = null;
  const mathjax = () => mjPret || (mjPret = new Promise((ok, ko) => {
    if (!window.MathJax) {
      window.MathJax = { svg: { fontCache: 'global' }, startup: { typeset: false } };
      const s = document.createElement('script'); s.async = true; s.src = 'https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js';
      s.onerror = () => ko(new Error('MathJax')); document.head.appendChild(s);
    }
    let n = 0; const t = setInterval(() => {
      if (window.MathJax && MathJax.tex2svgPromise && MathJax.startup && MathJax.startup.promise) { clearInterval(t); MathJax.startup.promise.then(ok, ko); }
      else if (++n > 150) { clearInterval(t); ko(new Error('MathJax')); }
    }, 100);
  })).catch((e) => { mjPret = null; throw e; });
  const svgCache = new Map(); let file = Promise.resolve();
  function dessinerMaths(racine) {
    const spans = [...racine.querySelectorAll('.mzt-tex:not([data-ok])')]; if (!spans.length) return;
    mathjax().then(() => spans.forEach((sp) => {
      const cle = sp.dataset.d + '|' + sp.textContent;
      const poser = (n) => { if (!sp.isConnected || sp.dataset.ok) return; sp.textContent = ''; sp.appendChild(n.cloneNode(true)); sp.dataset.ok = '1'; };
      if (svgCache.has(cle)) return poser(svgCache.get(cle));
      file = file.then(() => MathJax.tex2svgPromise(sp.textContent, { display: sp.dataset.d === '1' }).then((n) => { svgCache.set(cle, n); poser(n); })).catch(() => {});
    })).catch(() => {});
  }
  async function ask(q, deep) {
    q = (q || '').trim(); deep = deep || $('#mztDeep').checked;
    if (busy || !q) return; if (!sample) { note(); return; }
    const c = refreshCtx();
    if (!cur || (cur.sec !== c.label && !forced)) { cur = { id: 't' + Date.now().toString(36), sec: c.label, date: today(), title: q.slice(0, 80), msgs: [] }; ST.threads.push(cur); }
    else if (!ST.threads.includes(cur)) ST.threads.push(cur);
    cur.msgs.push({ r: 'u', t: q }); busy = true; renderLog();
    const out = document.createElement('div'); out.className = 'mzt-m a'; out.textContent = deep ? 'Réflexion approfondie…' : 'Réflexion…'; $('#mztLog').appendChild(out);
    $('#mztSend').disabled = true; $('#mztStop').hidden = false;
    const style = deep
      ? 'Réponse APPROFONDIE (400 à 700 mots) : 1) l\'intuition avec une analogie, 2) l\'explication détaillée pas à pas, 3) pourquoi ça marche, 4) un exemple complet chiffré, 5) les pièges fréquents et ce qui tombe à l\'examen, 6) une question pour vérifier la compréhension.'
      : 'Réponse EXPLICATIVE (150 à 250 mots) : 1) l\'idée en une phrase, 2) l\'explication pas à pas, 3) un petit exemple chiffré ou concret, 4) une courte question pour vérifier la compréhension.';
    const mem = [];
    if (ST.memos.length) mem.push('DIFFICULTÉS DÉJÀ REPÉRÉES :\n' + ST.memos.slice(-12).map((m) => `- ${m.date} : ${m.text}`).join('\n'));
    const lastQ = ST.threads.flatMap((t) => t.msgs.filter((m) => m.r === 'u').map((m) => `[${t.sec}] ${m.t.slice(0, 100)}`)).slice(-6);
    if (lastQ.length) mem.push('SES DERNIÈRES QUESTIONS :\n' + lastQ.map((x) => '- ' + x).join('\n'));
    const rules = `Tu es le tuteur de ${C.student}, pour le module ${C.module}${C.prof ? ' du ' + C.prof : ''}. Il apprend souvent la notion pour la première fois.
Règles : réponds en français simple, en Markdown léger (**gras** pour les termes clés, tirets, étapes numérotées). Toute formule ou tout calcul s'écrit en LaTeX : $…$ dans la phrase, $$…$$ seul sur sa ligne pour une formule importante (ex. $\\hat y_i$, $$\\text{MSE}=\\frac{1}{n}\\sum_{i=1}^{n}(y_i-\\hat y_i)^2$$) ; jamais d'accents graves pour une formule, ils sont réservés au code et aux noms de fonctions. Un petit tableau Markdown est permis s'il clarifie (3 colonnes maximum, l'écran est étroit). ${style} Appuie-toi d'abord sur l'EXTRAIT ci-dessous et sur les conventions du prof ; si une source générale diffère du cours, signale l'écart et dis quelle version utiliser à l'examen (celle du prof). Pour un calcul, pose chaque étape et vérifie-la. S'il envoie une réponse ou une photo de brouillon, corrige étape par étape et nomme précisément l'erreur. Si tu n'es pas sûr, dis-le. S'il demande un mini-exercice, donne l'exercice sans la solution.
Utilise sa mémoire pour faire des liens avec ses confusions passées, sans la réciter.
Termine TOUJOURS par une dernière ligne séparée au format exact « MÉMO: … » qui résume en 15 mots maximum la difficulté révélée par sa question (ou « MÉMO: rien »). Cette ligne lui est cachée.
${C.conventions ? 'CONVENTIONS DU PROF : ' + C.conventions + '\n' : ''}MÉMOIRE DE L'ÉLÈVE :
${mem.join('\n\n') || '(rien pour l\'instant)'}
EXTRAIT (${c.label}) :
${c.text.slice(0, deep ? 9000 : 3500)}`;
    const recent = cur.msgs.slice(deep ? -9 : -5, -1).map((m) => ({ role: m.r === 'u' ? 'user' : 'assistant', content: m.t }));
    while (recent.length && recent[0].role !== 'user') recent.shift();
    const msgs = [...recent.filter((m) => m.content && m.content.trim()), { role: 'user', content: q }]; while (msgs.length > 1 && msgs[0].role !== 'user') msgs.shift(); msgs[0] = { role: 'user', content: rules + '\n\n---\nQuestion : ' + msgs[0].content };
    ctl = new AbortController();
    const opts = { modelTier: deep ? 'complex' : 'quick', cache: false, signal: ctl.signal, onText: ({ text }) => { out.innerHTML = md(visible(text)); dessinerMaths(out); $('#mztLog').scrollTop = 1e9; } };
    if (img) opts.images = [img];
    try {
      const r = await sample(msgs, opts);
      const mm = r.text.match(/(?:^|\n)\s*M[ÉE]MO\s*:\s*(.+)\s*$/i);
      cur.msgs.push({ r: 'a', t: visible(r.text) + (r.truncated ? '\n\n(Réponse coupée : pose une question plus ciblée.)' : ''), d: !!deep });
      if (mm && !/^\s*rien/i.test(mm[1])) { ST.memos.push({ date: today(), text: mm[1].trim().slice(0, 160) }); if (ST.memos.length > 30) ST.memos.shift(); saveMemos(); }
      await saveThread(cur);
    } catch (e) {
      const kept = e && e.text ? visible(e.text) : '';
      if (e && e.code === 'cancelled') { if (kept) cur.msgs.push({ r: 'a', t: kept + '\n(Arrêté.)' }); else cur.msgs.pop(); }
      else { cur.msgs.pop(); compacter(!!cur.msgs.length); out.textContent = (kept ? kept + '\n\n' : '') + (ERR[e && e.code] || 'Le tuteur n\'a pas pu répondre. Réessaie dans un instant.'); }
      if (!cur.msgs.length) ST.threads = ST.threads.filter((t) => t !== cur);
      saveLocal();
      if (!(e && e.code === 'cancelled')) { busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImgN').textContent = ''; return; }
    }
    busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImg').value = ''; $('#mztImgN').textContent = ''; renderLog();
  }

  // ---------- événements ----------
  $('#mztBtn').onclick = () => openPanel(null);
  $('#mztX').onclick = closePanel;
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#mztPan').hidden) closePanel(); });
  $('#mztTabH').onclick = () => view($('#mztHist').hidden ? 'hist' : 'chat');
  $('#mztTabM').onclick = () => view($('#mztMem').hidden ? 'mem' : 'chat');
  $('#mztQ').oninput = renderList;
  $('#mztList').onclick = (e) => { const id = e.target.dataset && e.target.dataset.cont; if (!id) return; cur = ST.threads.find((t) => t.id === id); view('chat'); $('#mztCtx').textContent = '· ' + cur.sec; renderLog(); };
  $('#mztMemL').onclick = (e) => { const i = e.target.dataset && e.target.dataset.memdel; if (i == null) return; ST.memos.splice(+i, 1); saveMemos(); renderMem(); };
  $('#mztChips').onclick = (e) => { const b = e.target.closest('[data-chip]'); if (!b) return; const t = $('#mztIn'); t.value = b.dataset.chip + (t.value ? ' : ' + t.value : ''); t.focus(); };
  $('#mztNew').onclick = () => { cur = null; renderLog(); };
  $('#mztStop').onclick = () => { if (ctl) ctl.abort(); };
  $('#mztImg').onchange = (e) => { img = e.target.files[0] || null; $('#mztImgN').textContent = img ? 'Photo : ' + img.name : ''; };
  $('#mztF').onsubmit = (e) => { e.preventDefault(); const v = $('#mztIn').value; $('#mztIn').value = ''; ask(v); };
  $('#mztIn').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#mztF').requestSubmit(); } });

  // ---------- capacités (facultatives) ----------
  const W = window.claude;
  if (W && W.use) {
    W.use('sample').then((s) => { sample = s; ready = true; note();
      if (s && s.limits) s.limits().then((l) => { if (l && l.images) { imgOK = true; $('#mztImgL').hidden = false; if (l.images.mediaTypes) $('#mztImg').accept = l.images.mediaTypes.join(','); } }).catch(() => {});
    }).catch(() => { ready = true; note(); });
    Promise.all([W.use('db'), W.use('user')]).then(async ([d, u]) => {
      if (!d || !u) return; const id = await u.id(); if (!id) return; db = d; base = 'data/users/' + id + '/mzt_' + C.id;
      try {
        const m = await db.doc(base).get(); if (m.exists) { const v = m.data() || {}; if (Array.isArray(v.memos)) ST.memos = JSON.parse(JSON.stringify(v.memos)); }
        const q = await db.collection(base + '/threads').get(); const remote = q.docs.map((x) => Object.assign({ id: x.id }, JSON.parse(JSON.stringify(x.data() || {}))));
        const map = {}; [...ST.threads, ...remote].forEach((t) => { if (!map[t.id] || (t.msgs || []).length > (map[t.id].msgs || []).length) map[t.id] = t; });
        ST.threads = Object.values(map).sort((a, b) => parseInt(a.id.slice(1), 36) - parseInt(b.id.slice(1), 36)); saveLocal();
      } catch (e) {}
    }).catch(() => {});
  } else { ready = true; note(); }

  window.MZT = { open: openPanel, close: closePanel };
})();

</script>
<script>(function(){var a=document.getElementById("retour");if(!a)return;var p="";try{p=window.top.location.pathname}catch(e){}
if(window.top===window&&location.protocol==="file:"){a.hidden=true;return}
a.href=p.indexOf("/decouvrir")===0||location.pathname.indexOf("/decouvrir")===0?"/decouvrir":"/app/modules";})();</script>
