d<\/th><td>p =&gt; p &gt; 200<\/td><td class=\"h1\">250<\/td><td>1 élément (ou undefined)<\/td><\/tr><tr><th>reduce<\/th><td>(acc, p) =&gt; acc + p, 0<\/td><td class=\"h1\">750<\/td><td>1 valeur<\/td><\/tr><\/table><\/figure><p>Aucune de ces méthodes ne modifie le tableau d&#39;origine.<\/p>\n<pre class=\"\"><code>const parcServeurs = [\n  { id: &quot;SRV-01&quot;, statut: &quot;actif&quot;, charge: 85 },\n  { id: &quot;SRV-02&quot;, statut: &quot;inactif&quot;, charge: 0 },\n  { id: &quot;SRV-03&quot;, statut: &quot;actif&quot;, charge: 92 },\n  { id: &quot;SRV-04&quot;, statut: &quot;maintenance&quot;, charge: 10 }\n];\nconst actifs = parcServeurs.filter(s =&gt; s.statut === &quot;actif&quot;);\nconst ids = actifs.map(s =&gt; s.id);\nconst total = parcServeurs.reduce((acc, s) =&gt; acc + s.charge, 0);\nconst critique = parcServeurs.find(s =&gt; s.charge &gt; 90);\nconsole.log(ids);\nconsole.log(total);\nconsole.log(critique.id);<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>[ 'SRV-01', 'SRV-03' ]\n187\nSRV-03<\/code><\/pre><p>C&#39;est l&#39;exercice 1 du TD 2.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Comment reduce calcule 187<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Départ<\/div><p>l&#39;accumulateur vaut la valeur initiale 0.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · SRV-01<\/div><p>0 + 85 = 85.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · SRV-02<\/div><p>85 + 0 = 85.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · SRV-03<\/div><p>85 + 92 = 177.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · SRV-04<\/div><p>177 + 10 = 187. Fin : reduce renvoie 187.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>Toujours donner la <strong>valeur initiale<\/strong> de <code>reduce<\/code> (le <code>0<\/code>). Sans elle, <code>[].reduce(...)<\/code> lève une TypeError.<\/p>\n<\/aside><h2>Idée 3 · Callbacks et fonctions fléchées<\/h2>\n<p>Un <strong>callback<\/strong> est une fonction A passée en argument à une fonction B, qui décide <strong>quand<\/strong> l&#39;appeler (<strong>inversion de contrôle<\/strong>). En JS, les fonctions sont des <strong>citoyens de première classe<\/strong> : on les range dans des variables, on les passe, on les renvoie.<\/p>\n<pre class=\"\"><code>function traiterTransactionFlexible(montant, actionSuivante) {\n  const total = montant * 1.2;\n  actionSuivante(total);\n}\nfunction archiver(m) { console.log(&quot;Archivé : &quot; + m); }\nfunction envoyerSMS(m) { console.log(&quot;SMS envoyé pour : &quot; + m); }\n\ntraiterTransactionFlexible(100, archiver);\ntraiterTransactionFlexible(500, envoyerSMS);<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Archivé : 120\nSMS envoyé pour : 600<\/code><\/pre><p>La même fonction de calcul sert deux scénarios : c&#39;est la <strong>séparation des préoccupations<\/strong>. Appeler <code>archiver<\/code> directement dans la fonction l&#39;aurait rendue rigide.<\/p>\n<p>Les trois écritures d&#39;un même callback :<\/p>\n<figure class=\"flux\"><figcaption>Du plus long au plus court<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">function(prix) { return prix * 1.2; }<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">(prix) =&gt; { return prix * 1.2; }<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">prix =&gt; prix * 1.2<\/div><\/div><\/figure><p>Une fléchée <strong>n&#39;a pas son propre <code>this<\/code><\/strong> : elle prend celui du contexte où elle est écrite (portée lexicale). C&#39;est utile dans un <code>setTimeout<\/code> à l&#39;intérieur d&#39;une méthode :<\/p>\n<pre class=\"\"><code>const serveur = {\n  nom: &quot;Serveur_DB&quot;,\n  demarrer() {\n    setTimeout(function () { console.log(&quot;classique : &quot; + this.nom); }, 0);\n    setTimeout(() =&gt; { console.log(&quot;fléchée : &quot; + this.nom); }, 0);\n  }\n};\nserveur.demarrer();<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>classique : undefined\nfléchée : Serveur_DB<\/code><\/pre><h2>Idée 4 · Call Stack, Web APIs, Task Queue, Event Loop<\/h2>\n<svg viewBox=\"0 0 600 210\" style=\"width:100%;max-width:600px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Le callback de setTimeout passe de la Call Stack aux Web APIs, puis à la Task Queue ; l'Event Loop le remet dans la pile quand elle est vide\">\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\">\n<rect x=\"20\" y=\"30\" width=\"150\" height=\"150\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"95\" y=\"22\" font-weight=\"700\">Call Stack (LIFO)<\/text>\n<rect x=\"35\" y=\"140\" width=\"120\" height=\"28\" rx=\"4\" fill=\"none\" stroke=\"currentColor\"/><text x=\"95\" y=\"159\">global<\/text>\n<rect x=\"225\" y=\"30\" width=\"150\" height=\"70\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"300\" y=\"22\" font-weight=\"700\">Web APIs<\/text><text x=\"300\" y=\"70\">timer 0 ms<\/text>\n<rect x=\"425\" y=\"30\" width=\"155\" height=\"70\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"502\" y=\"22\" font-weight=\"700\">Task Queue (FIFO)<\/text><text x=\"502\" y=\"70\" fill=\"#D9824F\" font-weight=\"700\">callback<\/text>\n<text x=\"300\" y=\"165\" fill=\"#D9824F\" font-weight=\"700\">Event Loop : pile vide ? alors push<\/text><\/g>\n<line x1=\"170\" y1=\"60\" x2=\"222\" y2=\"60\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<line x1=\"375\" y1=\"65\" x2=\"422\" y2=\"65\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<path d=\"M500 100 C500 160 300 190 172 150\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/>\n<\/svg><ul>\n<li><strong>Call Stack<\/strong> (LIFO) : chaque appel fait un <em>push<\/em>, chaque <code>return<\/code> un <em>pop<\/em>. Une récursion sans fin la sature (<em>stack overflow<\/em>).<\/li>\n<li><strong>Web APIs<\/strong> : le navigateur (ou Node) gère en arrière-plan les tâches longues (timers, réseau).<\/li>\n<li><strong>Task Queue<\/strong> (FIFO) : les callbacks terminés y attendent leur tour.<\/li>\n<li><strong>Event Loop<\/strong> : si (et seulement si) la pile est <strong>vide<\/strong>, elle prend le premier callback de la file et le pousse dans la pile.<\/li>\n<\/ul>\n<pre class=\"\"><code>console.log(&quot;A - Initialisation du système&quot;);\nsetTimeout(() =&gt; {\n  console.log(&quot;B - Nettoyage de la mémoire terminé&quot;);\n}, 0);\nconsole.log(&quot;C - Démarrage des processus&quot;);<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>A - Initialisation du système\nC - Démarrage des processus\nB - Nettoyage de la mémoire terminé<\/code><\/pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p><strong>0 ms ne veut pas dire « tout de suite ».<\/strong> Le callback passe forcément par la Task Queue, et attend que tout le code synchrone soit fini. Ordre : A, C, B (TD 2, ex. 4).<\/p>\n<\/aside><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Une diapo dit que l&#39;Event Loop est « intégrée au moteur ». Plus précisément, elle est fournie par le <strong>runtime<\/strong> (navigateur ou Node.js), pas par V8 lui-même, comme les Web APIs.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices type examen 2025 et TD 2<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>(Examen 2025, ex. 2) <code>const T1 = [12, 3, 90, 7, 99, 145, 5, 13, 88, 9];<\/code> Écris une fonction nominale qui renvoie les éléments strictement inférieurs à 100, une qui renvoie les pairs, une fléchée qui renvoie la somme, une fléchée qui trie par ordre décroissant.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>function inferieursA100(t) { return t.filter(x =&gt; x &lt; 100); }<\/code> → [12, 3, 90, 7, 99, 5, 13, 88, 9]. <code>function pairs(t) { return t.filter(x =&gt; x % 2 === 0); }<\/code> → [12, 90, 88]. <code>const somme = t =&gt; t.reduce((a, x) =&gt; a + x, 0);<\/code> → 471. <code>const trierDec = t =&gt; [...t].sort((a, b) =&gt; b - a);<\/code> → [145, 99, 90, 88, 13, 12, 9, 7, 5, 3].<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Que vaut la somme des éléments de T1 ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 471<\/b><\/p><p>12+3+90+7+99+145+5+13+88+9 = 471.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>(TD 2, ex. 3) Écris <code>analyserFichier(nomFichier, callbackResolution)<\/code> qui affiche « Analyse en cours... » puis appelle le callback, et deux callbacks <code>archiver<\/code> et <code>alerterSecurite<\/code>.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>function analyserFichier(nomFichier, callbackResolution) { console.log(&quot;Analyse en cours...&quot;); callbackResolution(nomFichier); }<\/code> ; <code>function archiver(f) { console.log(&quot;Archivé : &quot; + f); }<\/code> ; <code>function alerterSecurite(f) { console.log(&quot;Alerte sécurité : &quot; + f); }<\/code> ; puis <code>analyserFichier(&quot;rapport.pdf&quot;, archiver); analyserFichier(&quot;virus.exe&quot;, alerterSecurite);<\/code>. La fonction hôte ne sait pas ce que fait le callback : elle est réutilisable.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 10 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\"><code>[1, 2, 3].map(x =&gt; x * 10)<\/code> renvoie :<\/div><button class=\"opt\" data-o=\"0\">[10, 20, 30]<\/button><button class=\"opt\" data-o=\"1\">60<\/button><button class=\"opt\" data-o=\"2\">[1, 2, 3]<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\"><code>[5, 12, 8].filter(x =&gt; x &gt; 6)<\/code> renvoie :<\/div><button class=\"opt\" data-o=\"0\">12<\/button><button class=\"opt\" data-o=\"1\">[12, 8]<\/button><button class=\"opt\" data-o=\"2\">[true, false, true]<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\"><code>[5, 12, 8].find(x =&gt; x &gt; 6)<\/code> renvoie :<\/div><button class=\"opt\" data-o=\"0\">12<\/button><button class=\"opt\" data-o=\"1\">[12, 8]<\/button><button class=\"opt\" data-o=\"2\">8<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\"><code>[1, 2, 3].reduce((a, x) =&gt; a + x, 0)<\/code> vaut :<\/div><button class=\"opt\" data-o=\"0\">[1, 3, 6]<\/button><button class=\"opt\" data-o=\"1\">6<\/button><button class=\"opt\" data-o=\"2\">0<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\"><code>[10, 9, 100].sort()<\/code> donne :<\/div><button class=\"opt\" data-o=\"0\">[10, 100, 9]<\/button><button class=\"opt\" data-o=\"1\">[9, 10, 100]<\/button><button class=\"opt\" data-o=\"2\">[100, 10, 9]<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Quel comparateur trie par ordre décroissant ?<\/div><button class=\"opt\" data-o=\"0\">(a, b) =&gt; a - b<\/button><button class=\"opt\" data-o=\"1\">(a, b) =&gt; b - a<\/button><button class=\"opt\" data-o=\"2\">(a, b) =&gt; a &gt; b<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\"><code>t.map(x =&gt; { x * 2 })<\/code> renvoie :<\/div><button class=\"opt\" data-o=\"0\">les doubles<\/button><button class=\"opt\" data-o=\"1\">un tableau de undefined<\/button><button class=\"opt\" data-o=\"2\">une erreur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Ordre d&#39;affichage : <code>console.log(1); setTimeout(() =&gt; console.log(2), 0); console.log(3);<\/code><\/div><button class=\"opt\" data-o=\"0\">1 2 3<\/button><button class=\"opt\" data-o=\"1\">1 3 2<\/button><button class=\"opt\" data-o=\"2\">2 1 3<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Quelle structure est LIFO ?<\/div><button class=\"opt\" data-o=\"0\">La Call Stack<\/button><button class=\"opt\" data-o=\"1\">La Task Queue<\/button><button class=\"opt\" data-o=\"2\">Le Heap<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Pourquoi utiliser une fléchée dans un <code>setTimeout<\/code> à l&#39;intérieur d&#39;une méthode ?<\/div><button class=\"opt\" data-o=\"0\">Elle est plus rapide<\/button><button class=\"opt\" data-o=\"1\">Elle garde le this de la méthode<\/button><button class=\"opt\" data-o=\"2\">Elle évite la Task Queue<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"tableaux-callbacks","rep":["42"],"tol":null},{"n":"tableaux-callbacks","rep":null,"tol":null},{"n":"tableaux-callbacks","rep":["471"],"tol":null},{"n":"tableaux-callbacks","rep":null,"tol":null}],"qcm":[{"n":"tableaux-callbacks","q":"<code>[1, 2, 3].map(x =&gt; x * 10)<\/code> renvoie :","o":["[10, 20, 30]","60","[1, 2, 3]"],"a":0,"e":"map transforme chaque élément et renvoie un nouveau tableau."},{"n":"tableaux-callbacks","q":"<code>[5, 12, 8].filter(x =&gt; x &gt; 6)<\/code> renvoie :","o":["12","[12, 8]","[true, false, true]"],"a":1,"e":"filter garde les éléments pour lesquels le callback renvoie true."},{"n":"tableaux-callbacks","q":"<code>[5, 12, 8].find(x =&gt; x &gt; 6)<\/code> renvoie :","o":["12","[12, 8]","8"],"a":0,"e":"find s&#39;arrête au premier élément qui convient."},{"n":"tableaux-callbacks","q":"<code>[1, 2, 3].reduce((a, x) =&gt; a + x, 0)<\/code> vaut :","o":["[1, 3, 6]","6","0"],"a":1,"e":"Somme accumulée à partir de 0."},{"n":"tableaux-callbacks","q":"<code>[10, 9, 100].sort()<\/code> donne :","o":["[10, 100, 9]","[9, 10, 100]","[100, 10, 9]"],"a":0,"e":"Sans comparateur, le tri est alphabétique : &quot;10&quot; &lt; &quot;100&quot; &lt; &quot;9&quot;."},{"n":"tableaux-callbacks","q":"Quel comparateur trie par ordre décroissant ?","o":["(a, b) =&gt; a - b","(a, b) =&gt; b - a","(a, b) =&gt; a &gt; b"],"a":1,"e":"b − a positif quand b &gt; a : b passe devant."},{"n":"tableaux-callbacks","q":"<code>t.map(x =&gt; { x * 2 })<\/code> renvoie :","o":["les doubles","un tableau de undefined","une erreur"],"a":1,"e":"Avec des accolades, il faut écrire return."},{"n":"tableaux-callbacks","q":"Ordre d&#39;affichage : <code>console.log(1); setTimeout(() =&gt; console.log(2), 0); console.log(3);<\/code>","o":["1 2 3","1 3 2","2 1 3"],"a":1,"e":"Le callback attend dans la Task Queue que la pile soit vide."},{"n":"tableaux-callbacks","q":"Quelle structure est LIFO ?","o":["La Call Stack","La Task Queue","Le Heap"],"a":0,"e":"Dernier entré, premier sorti. La Task Queue est FIFO."},{"n":"tableaux-callbacks","q":"Pourquoi utiliser une fléchée dans un <code>setTimeout<\/code> à l&#39;intérieur d&#39;une méthode ?","o":["Elle est plus rapide","Elle garde le this de la méthode","Elle évite la Task Queue"],"a":1,"e":"Une fonction classique aurait son propre this (global/undefined)."}]},{"id":"dom","t":"Manipuler le DOM","seance":"Séance 4 · Manipulation du DOM","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut connaître les sélecteurs CSS (<code>#id<\/code>, <code>.classe<\/code>, <code>div p<\/code>, <code>[attribut=&#39;valeur&#39;]<\/code>) : ce chapitre les réutilise tels quels.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Quel sélecteur CSS vise le paragraphe <code>&lt;p&gt;<\/code> placé dans un élément de classe <code>module-cours<\/code> dont l&#39;attribut <code>data-statut<\/code> vaut <code>en-attente<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>.module-cours[data-statut=&#39;en-attente&#39;] p<\/code> : la classe, puis l&#39;attribut entre crochets, puis un espace pour « descendant », puis la balise.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Le DOM est un <strong>arbre<\/strong>. Chaque manipulation suit le même schéma : <strong>sélectionner<\/strong> un nœud, <strong>le ranger dans une constante<\/strong> (préfixe <code>$<\/code> chez le prof), puis <strong>lire ou modifier<\/strong>. Teste tout dans la console du navigateur (F12).<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Mettre une saisie utilisateur dans <code>innerHTML<\/code>. Si elle contient <code>&lt;img src=x onerror=&quot;...&quot;&gt;<\/code>, le script s&#39;exécute : c&#39;est une faille <strong>XSS<\/strong>. Pour du texte, <code>textContent<\/code>.<\/p>\n<\/aside><p>À la fin, tu sais sélectionner, modifier le texte, les attributs et les classes, créer et supprimer des éléments, et remonter l&#39;arbre avec <code>closest<\/code>.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Les exemples de ce chapitre ont besoin d&#39;un navigateur (<code>document<\/code> n&#39;existe pas dans Node.js) : ils ne sont pas exécutés automatiquement ici. Copie-les dans la console de ta page.<\/p>\n<\/aside><h2>Idée 1 · L&#39;arbre et la sélection<\/h2>\n<svg viewBox=\"0 0 560 200\" style=\"width:100%;max-width:560px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Arbre du DOM : document, html, head et body ; body contient un ul avec deux li ; les sauts de ligne sont des nœuds texte\">\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\">\n<rect x=\"230\" y=\"8\" width=\"100\" height=\"26\" rx=\"5\" fill=\"none\" stroke=\"currentColor\"/><text x=\"280\" y=\"26\">document<\/text>\n<rect x=\"230\" y=\"52\" width=\"100\" height=\"26\" rx=\"5\" fill=\"none\" stroke=\"currentColor\"/><text x=\"280\" y=\"70\">html<\/text>\n<rect x=\"120\" y=\"96\" width=\"90\" height=\"26\" rx=\"5\" fill=\"none\" stroke=\"currentColor\"/><text x=\"165\" y=\"114\">head<\/text>\n<rect x=\"350\" y=\"96\" width=\"90\" height=\"26\" rx=\"5\" fill=\"none\" stroke=\"currentColor\"/><text x=\"395\" y=\"114\">body<\/text>\n<rect x=\"350\" y=\"140\" width=\"90\" height=\"26\" rx=\"5\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"395\" y=\"158\">ul#liste<\/text>\n<rect x=\"250\" y=\"172\" width=\"80\" height=\"24\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-dasharray=\"4 3\"/><text x=\"290\" y=\"189\">#text \"\\n\"<\/text>\n<rect x=\"350\" y=\"172\" width=\"80\" height=\"24\" rx=\"5\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"390\" y=\"189\">li<\/text>\n<rect x=\"450\" y=\"172\" width=\"80\" height=\"24\" rx=\"5\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"490\" y=\"189\">li<\/text><\/g>\n<g stroke=\"currentColor\"><line x1=\"280\" y1=\"34\" x2=\"280\" y2=\"52\"/><line x1=\"280\" y1=\"78\" x2=\"165\" y2=\"96\"/><line x1=\"280\" y1=\"78\" x2=\"395\" y2=\"96\"/><line x1=\"395\" y1=\"122\" x2=\"395\" y2=\"140\"/><line x1=\"395\" y1=\"166\" x2=\"290\" y2=\"172\"/><line x1=\"395\" y1=\"166\" x2=\"390\" y2=\"172\"/><line x1=\"395\" y1=\"166\" x2=\"490\" y2=\"172\"/><\/g>\n<\/svg><p>Tout est <strong>nœud<\/strong> (Node) : balises, textes, et même les sauts de ligne invisibles (nœud texte en pointillés). Un <strong>élément<\/strong> (Element) est un nœud qui est une vraie balise.<\/p>\n<figure class=\"grille\"><figcaption>Les méthodes de sélection<\/figcaption><table><tr><th><\/th><th>renvoie<\/th><th>si rien<\/th><th>mise à jour<\/th><\/tr><tr><th>getElementById(&quot;id&quot;)<\/th><td>un élément<\/td><td>null<\/td><td>-<\/td><\/tr><tr><th>getElementsByClassName(&quot;c&quot;)<\/th><td>HTMLCollection<\/td><td>collection vide<\/td><td class=\"h0\">live (suit le DOM)<\/td><\/tr><tr><th>querySelector(&quot;sel&quot;)<\/th><td class=\"h1\">le premier élément<\/td><td class=\"h1\">null<\/td><td>-<\/td><\/tr><tr><th>querySelectorAll(&quot;sel&quot;)<\/th><td class=\"h1\">NodeList<\/td><td class=\"h1\">liste vide<\/td><td class=\"h1\">statique (photo)<\/td><\/tr><\/table><\/figure><pre class=\"\"><code>const $tableauDeBord = document.querySelector(&quot;#tableau-de-bord&quot;);\nconst $premierModule = document.querySelector(&quot;.module-cours&quot;);      // le premier seulement\nconst $p = document.querySelector(&quot;.module-cours[data-statut='en-attente'] p&quot;);\nconst $champs = document.querySelectorAll(&quot;form input[type='text']&quot;);\n$champs.forEach($c =&gt; console.log($c.value));                        // NodeList a forEach<\/code><\/pre><aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p><strong>Mise en cache<\/strong> : ne cherche jamais deux fois le même élément. <code>const $compteur = document.querySelector(&quot;.compteur&quot;);<\/code> puis utilise <code>$compteur<\/code>. Chaque recherche traverse le pont JS ↔ rendu.<\/p>\n<\/aside><h2>Idée 2 · Modifier texte, HTML, attributs, style, classes<\/h2>\n<table>\n<thead>\n<tr>\n<th>Propriété<\/th>\n<th>Fait quoi<\/th>\n<th>Attention<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>textContent<\/code><\/td>\n<td>texte brut, même caché<\/td>\n<td>rapide, sûr<\/td>\n<\/tr>\n<tr>\n<td><code>innerText<\/code><\/td>\n<td>texte tel qu&#39;affiché<\/td>\n<td>force un calcul du CSS (reflow)<\/td>\n<\/tr>\n<tr>\n<td><code>innerHTML<\/code><\/td>\n<td>interprète des balises<\/td>\n<td><strong>XSS<\/strong> avec des données utilisateur<\/td>\n<\/tr>\n<\/tbody><\/table>\n<pre class=\"\"><code>const $titre = document.querySelector(&quot;#nom-utilisateur&quot;);\n$titre.textContent = &quot;Administrateur Système&quot;;            // sûr : pas d'interprétation HTML\n\nconst $lien = document.querySelector(&quot;a&quot;);\n$lien.setAttribute(&quot;href&quot;, &quot;https://fpbm.usms.ac.ma&quot;);\nconsole.log($lien.getAttribute(&quot;href&quot;));\ndocument.querySelector(&quot;button&quot;).disabled = true;          // attribut standard = propriété\n\n$titre.dataset.role;                                         // lit data-role (hors diapos)<\/code><\/pre><p>Pour le style, le prof distingue :<\/p>\n<ul>\n<li><code>element.style.backgroundColor = &quot;red&quot;<\/code> : style en ligne, en <strong>camelCase<\/strong>. Anti-pattern, sauf pour une valeur <strong>calculée<\/strong> (<code>$barre.style.width = progression + &quot;%&quot;<\/code>).<\/li>\n<li><strong><code>classList<\/code><\/strong> : le standard. JS dit « tu es en état d&#39;erreur », le CSS décide de la couleur.<\/li>\n<\/ul>\n<pre class=\"\"><code>$menu.classList.add(&quot;visible&quot;);\n$menu.classList.remove(&quot;cache&quot;);\n$menu.classList.contains(&quot;visible&quot;);   // true / false\n$menu.classList.toggle(&quot;menu-ouvert&quot;); // ajoute si absente, retire si présente<\/code><\/pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p><strong>JS gère l&#39;état, CSS gère l&#39;apparence.<\/strong> On communique par les classes (<code>classList<\/code>), pas par <code>style<\/code>.<\/p>\n<\/aside><h2>Idée 3 · Créer, insérer, supprimer<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Ajouter un élément à une liste<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Créer en mémoire<\/div><p>const $li = document.createElement(&quot;li&quot;); — l&#39;élément n&#39;est pas encore visible.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Configurer<\/div><p>$li.textContent = &quot;Mysql&quot;; $li.classList.add(&quot;item&quot;);<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Sélectionner le parent<\/div><p>const $liste = document.querySelector(&quot;#todoList&quot;);<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Attacher<\/div><p>$liste.append($li); — il apparaît en dernier enfant (appendChild fait pareil pour un seul nœud).<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><table>\n<thead>\n<tr>\n<th>Méthode<\/th>\n<th>Place<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>parent.append(a, &quot;texte&quot;, b)<\/code><\/td>\n<td>à la fin, plusieurs nœuds et du texte<\/td>\n<\/tr>\n<tr>\n<td><code>parent.appendChild(n)<\/code><\/td>\n<td>à la fin, un seul nœud (ancienne école)<\/td>\n<\/tr>\n<tr>\n<td><code>parent.prepend(n)<\/code><\/td>\n<td>au début<\/td>\n<\/tr>\n<tr>\n<td><code>parent.insertBefore(n, ref)<\/code><\/td>\n<td>juste avant <code>ref<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>el.insertAdjacentHTML(pos, html)<\/code><\/td>\n<td><code>beforebegin<\/code>, <code>afterbegin<\/code>, <code>beforeend<\/code>, <code>afterend<\/code><\/td>\n<\/tr>\n<\/tbody><\/table>\n<p><code>insertAdjacentHTML<\/code> ne reconstruit pas les enfants existants, contrairement à <code>innerHTML +=<\/code> ; mais il interprète le HTML, donc même risque XSS.<\/p>\n<p><strong>Création en masse<\/strong> : chaque insertion dans le DOM peut provoquer un recalcul de la mise en page (reflow). On remplit d&#39;abord un <strong>DocumentFragment<\/strong> (conteneur fantôme), puis on l&#39;insère <strong>une seule fois<\/strong>.<\/p>\n<pre class=\"\"><code>const $logs = document.querySelector(&quot;#liste-logs&quot;);\nconst $fragment = document.createDocumentFragment();\nmessages.forEach(msg =&gt; {\n  const $li = document.createElement(&quot;li&quot;);\n  $li.textContent = msg;\n  $fragment.append($li);\n});\n$logs.append($fragment); // un seul accès au DOM visible<\/code><\/pre><p><strong>Supprimer<\/strong> : <code>$el.remove()<\/code> (moderne) ou <code>$el.parentNode.removeChild($el)<\/code> (historique).<\/p>\n<h2>Idée 4 · Naviguer dans l&#39;arbre<\/h2>\n<figure class=\"grille\"><figcaption>Nœuds (risqué) vs éléments (recommandé)<\/figcaption><table><tr><th><\/th><th>tous les nœuds<\/th><th>éléments seulement<\/th><\/tr><tr><th>enfants<\/th><td>childNodes<\/td><td class=\"h1\">children<\/td><\/tr><tr><th>premier<\/th><td>firstChild<\/td><td class=\"h1\">firstElementChild<\/td><\/tr><tr><th>dernier<\/th><td>lastChild<\/td><td class=\"h1\">lastElementChild<\/td><\/tr><tr><th>nombre<\/th><td>childNodes.length<\/td><td class=\"h1\">childElementCount<\/td><\/tr><tr><th>frère suivant<\/th><td>nextSibling<\/td><td class=\"h1\">nextElementSibling<\/td><\/tr><tr><th>frère précédent<\/th><td>previousSibling<\/td><td class=\"h1\">previousElementSibling<\/td><\/tr><tr><th>parent<\/th><td>parentNode<\/td><td class=\"h1\">parentElement<\/td><\/tr><\/table><\/figure><p><code>firstChild<\/code> peut renvoyer le saut de ligne invisible : préfère les versions <strong>Element<\/strong>.<\/p>\n<p>Pour remonter, <code>closest(sélecteur)<\/code> remonte jusqu&#39;au premier ancêtre qui correspond (ou <code>null<\/code>). C&#39;est robuste : si un designer ajoute une <code>&lt;div&gt;<\/code>, ça marche encore, alors que <code>parentElement.parentElement<\/code> casse.<\/p>\n<pre class=\"\"><code>const $bouton = document.querySelector(&quot;.btn-reboot&quot;);\nconst $ligne = $bouton.closest(&quot;tr&quot;);      // remonte jusqu'au &lt;tr&gt;, quelle que soit la profondeur\n$ligne.classList.add(&quot;en-maintenance&quot;);<\/code><\/pre><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices type TD 3<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>(TD 3, ex. 1.3) Un attaquant contrôle <code>const payload = &quot;&lt;img src=&#39;x&#39; onerror=&#39;alert(\\&quot;Piraté!\\&quot;)&#39;&gt;&quot;;<\/code>. Injecte-le dans <code>.zone-securisee<\/code> sans que le script s&#39;exécute.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>document.querySelector(&quot;.zone-securisee&quot;).textContent = payload;<\/code> Le texte est affiché tel quel, les balises ne sont pas interprétées. Avec <code>innerHTML<\/code>, l&#39;image fautive déclencherait <code>onerror<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>(TD 3, ex. 2) Grise la ligne <code>&lt;tr&gt;<\/code> du premier serveur, en partant uniquement de son bouton.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>const $btn = document.querySelector(&quot;.btn-reboot&quot;); const $tr = $btn.closest(&quot;tr&quot;); $tr.classList.add(&quot;en-maintenance&quot;);<\/code><\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>(TD 3, ex. 4) Supprime la ligne du « Serveur Beta » de la manière la plus directe.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>document.querySelector(&quot;.serveur-hs&quot;).remove();<\/code><\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>(Examen 2025, ex. 3.1) Ajoute un <code>&lt;li&gt;<\/code> « Mysql » à la fin de <code>#todoList<\/code>.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>const $li = document.createElement(&quot;li&quot;); $li.textContent = &quot;Mysql&quot;; document.querySelector(&quot;#todoList&quot;).append($li);<\/code><\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 10 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\"><code>document.querySelector(&quot;.p&quot;)<\/code> renvoie :<\/div><button class=\"opt\" data-o=\"0\">tous les éléments de classe p<\/button><button class=\"opt\" data-o=\"1\">le premier élément de classe p, ou null<\/button><button class=\"opt\" data-o=\"2\">la balise <code>&lt;p&gt;<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Différence entre <code>querySelector(&quot;#p&quot;)<\/code>, <code>(&quot;.p&quot;)<\/code> et <code>(&quot;p&quot;)<\/code> (examen 2025) ?<\/div><button class=\"opt\" data-o=\"0\">id « p », classe « p », balise <code>&lt;p&gt;<\/code><\/button><button class=\"opt\" data-o=\"1\">trois écritures identiques<\/button><button class=\"opt\" data-o=\"2\">balise, id, classe<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Quelle collection est <strong>live<\/strong> ?<\/div><button class=\"opt\" data-o=\"0\">getElementsByClassName (HTMLCollection)<\/button><button class=\"opt\" data-o=\"1\">querySelectorAll (NodeList)<\/button><button class=\"opt\" data-o=\"2\">un tableau JS<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Pour afficher un commentaire utilisateur en toute sécurité :<\/div><button class=\"opt\" data-o=\"0\">innerHTML<\/button><button class=\"opt\" data-o=\"1\">textContent<\/button><button class=\"opt\" data-o=\"2\">insertAdjacentHTML<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">En JS, la propriété CSS <code>background-color<\/code> s&#39;écrit :<\/div><button class=\"opt\" data-o=\"0\">style[&quot;background-color&quot;] uniquement<\/button><button class=\"opt\" data-o=\"1\">style.backgroundColor<\/button><button class=\"opt\" data-o=\"2\">style.background_color<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Le prof recommande de changer l&#39;apparence via :<\/div><button class=\"opt\" data-o=\"0\">element.style<\/button><button class=\"opt\" data-o=\"1\">element.classList<\/button><button class=\"opt\" data-o=\"2\">innerHTML<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Un élément créé par <code>createElement<\/code> est visible :<\/div><button class=\"opt\" data-o=\"0\">tout de suite<\/button><button class=\"opt\" data-o=\"1\">seulement après insertion (append, prepend…)<\/button><button class=\"opt\" data-o=\"2\">après un rechargement<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Pour insérer 100 <code>&lt;li&gt;<\/code> avec un seul accès au DOM visible :<\/div><button class=\"opt\" data-o=\"0\">innerHTML += dans une boucle<\/button><button class=\"opt\" data-o=\"1\">un DocumentFragment<\/button><button class=\"opt\" data-o=\"2\">100 appendChild sur la liste<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\"><code>$btn.closest(&quot;tr&quot;)<\/code> :<\/div><button class=\"opt\" data-o=\"0\">remonte jusqu&#39;au premier ancêtre <code>&lt;tr&gt;<\/code><\/button><button class=\"opt\" data-o=\"1\">cherche un <code>&lt;tr&gt;<\/code> parmi les enfants<\/button><button class=\"opt\" data-o=\"2\">renvoie le <code>&lt;tr&gt;<\/code> le plus proche dans la page<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Quelle propriété peut renvoyer un nœud texte invisible ?<\/div><button class=\"opt\" data-o=\"0\">firstChild<\/button><button class=\"opt\" data-o=\"1\">firstElementChild<\/button><button class=\"opt\" data-o=\"2\">children[0]<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"dom","rep":null,"tol":null},{"n":"dom","rep":null,"tol":null},{"n":"dom","rep":null,"tol":null},{"n":"dom","rep":null,"tol":null},{"n":"dom","rep":null,"tol":null}],"qcm":[{"n":"dom","q":"<code>document.querySelector(&quot;.p&quot;)<\/code> renvoie :","o":["tous les éléments de classe p","le premier élément de classe p, ou null","la balise <code>&lt;p&gt;<\/code>"],"a":1,"e":"<code>.p<\/code> est une classe ; querySelector s&#39;arrête au premier."},{"n":"dom","q":"Différence entre <code>querySelector(&quot;#p&quot;)<\/code>, <code>(&quot;.p&quot;)<\/code> et <code>(&quot;p&quot;)<\/code> (examen 2025) ?","o":["id « p », classe « p », balise <code>&lt;p&gt;<\/code>","trois écritures identiques","balise, id, classe"],"a":0,"e":"Mêmes sélecteurs qu&#39;en CSS."},{"n":"dom","q":"Quelle collection est <strong>live<\/strong> ?","o":["getElementsByClassName (HTMLCollection)","querySelectorAll (NodeList)","un tableau JS"],"a":0,"e":"Elle se met à jour si le DOM change."},{"n":"dom","q":"Pour afficher un commentaire utilisateur en toute sécurité :","o":["innerHTML","textContent","insertAdjacentHTML"],"a":1,"e":"textContent n&#39;interprète pas les balises."},{"n":"dom","q":"En JS, la propriété CSS <code>background-color<\/code> s&#39;écrit :","o":["style[&quot;background-color&quot;] uniquement","style.backgroundColor","style.background_color"],"a":1,"e":"camelCase en JavaScript."},{"n":"dom","q":"Le prof recommande de changer l&#39;apparence via :","o":["element.style","element.classList","innerHTML"],"a":1,"e":"JS change l&#39;état (classe), le CSS décide du rendu."},{"n":"dom","q":"Un élément créé par <code>createElement<\/code> est visible :","o":["tout de suite","seulement après insertion (append, prepend…)","après un rechargement"],"a":1,"e":"Il n&#39;existe d&#39;abord qu&#39;en mémoire."},{"n":"dom","q":"Pour insérer 100 <code>&lt;li&gt;<\/code> avec un seul accès au DOM visible :","o":["innerHTML += dans une boucle","un DocumentFragment","100 appendChild sur la liste"],"a":1,"e":"On remplit le fragment, puis une seule insertion."},{"n":"dom","q":"<code>$btn.closest(&quot;tr&quot;)<\/code> :","o":["remonte jusqu&#39;au premier ancêtre <code>&lt;tr&gt;<\/code>","cherche un <code>&lt;tr&gt;<\/code> parmi les enfants","renvoie le <code>&lt;tr&gt;<\/code> le plus proche dans la page"],"a":0,"e":"closest remonte les ancêtres (en commençant par l&#39;élément lui-même)."},{"n":"dom","q":"Quelle propriété peut renvoyer un nœud texte invisible ?","o":["firstChild","firstElementChild","children[0]"],"a":0,"e":"Les sauts de ligne du HTML sont des nœuds texte."}]},{"id":"evenements","t":"Gestion des événements","seance":"Séance 5 · Gestion des événements","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Ce chapitre combine deux choses déjà vues : les <strong>callbacks<\/strong> (chapitre 5) et la <strong>sélection d&#39;éléments<\/strong> (chapitre 6).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Dans <code>traiter(100, archiver)<\/code>, qui décide du moment où <code>archiver<\/code> est appelée ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>La fonction <code>traiter<\/code>, pas toi : c&#39;est l&#39;inversion de contrôle. Avec les événements, c&#39;est le <strong>navigateur<\/strong> qui appelle ton callback quand l&#39;utilisateur agit.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Un écouteur, c&#39;est une consigne : « <strong>si<\/strong> l&#39;utilisateur clique <strong>ici<\/strong>, <strong>exécute<\/strong> ça ». Trois ingrédients : l&#39;élément, le type d&#39;événement, la fonction.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Confondre <code>preventDefault()<\/code> et <code>stopPropagation()<\/code>. Le premier bloque l&#39;action <strong>du navigateur<\/strong> (rechargement, lien). Le second bloque la <strong>remontée<\/strong> vers les parents. L&#39;un n&#39;implique pas l&#39;autre.<\/p>\n<\/aside><p>À la fin, tu sais attacher et retirer un écouteur, utiliser l&#39;objet <code>e<\/code>, expliquer capture et bouillonnement, et coder une délégation d&#39;événements.<\/p>\n<h2>Idée 1 · addEventListener et les types d&#39;événements<\/h2>\n<pre class=\"\"><code>const $monBouton = document.querySelector(&quot;#monBouton&quot;);\n$monBouton.addEventListener(&quot;click&quot;, function () {\n  console.log(&quot;Vous avez cliqué sur le bouton !&quot;);\n});<\/code><\/pre><table>\n<thead>\n<tr>\n<th>Famille<\/th>\n<th>Événements<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Souris<\/td>\n<td><code>click<\/code>, <code>dblclick<\/code>, <code>mouseenter<\/code>, <code>mouseleave<\/code>, <code>mousemove<\/code><\/td>\n<\/tr>\n<tr>\n<td>Clavier<\/td>\n<td><code>keydown<\/code> (enfoncée), <code>keyup<\/code> (relâchée)<\/td>\n<\/tr>\n<tr>\n<td>Formulaire<\/td>\n<td><code>submit<\/code>, <code>input<\/code> (à chaque frappe), <code>change<\/code> (validé), <code>focus<\/code>, <code>blur<\/code><\/td>\n<\/tr>\n<tr>\n<td>Fenêtre / DOM<\/td>\n<td><code>DOMContentLoaded<\/code> (HTML prêt), <code>load<\/code> (images comprises), <code>scroll<\/code>, <code>resize<\/code>, <code>beforeunload<\/code><\/td>\n<\/tr>\n<tr>\n<td>Unifié<\/td>\n<td><code>pointerdown<\/code>, <code>pointermove<\/code> : souris, doigt ou stylet (<code>e.pointerType<\/code>)<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Le 3e paramètre, un objet d&#39;options : <code>{ once: true }<\/code> (l&#39;écouteur se détache après le 1er appel, ex. paiement unique), <code>{ passive: true }<\/code> (promet de ne pas appeler <code>preventDefault<\/code>, utile pour <code>scroll<\/code>), <code>{ capture: true }<\/code> (écoute pendant la descente).<\/p>\n<p><strong>Retirer un écouteur<\/strong> : <code>removeEventListener<\/code> exige <strong>la même fonction en mémoire<\/strong>. Avec une fléchée anonyme, c&#39;est impossible.<\/p>\n<pre class=\"\"><code>const cible = new EventTarget();\nlet n = 0;\nfunction direBonjour() { n++; cible.removeEventListener(&quot;click&quot;, direBonjour); }\ncible.addEventListener(&quot;click&quot;, direBonjour);\ncible.addEventListener(&quot;click&quot;, () =&gt; console.log(&quot;anonyme&quot;));\ncible.removeEventListener(&quot;click&quot;, () =&gt; console.log(&quot;anonyme&quot;));\ncible.dispatchEvent(new Event(&quot;click&quot;));\ncible.dispatchEvent(new Event(&quot;click&quot;));\nconsole.log(&quot;direBonjour appelée&quot;, n, &quot;fois&quot;);<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>anonyme\nanonyme\ndireBonjour appelée 1 fois<\/code><\/pre><p>L&#39;écouteur anonyme n&#39;a pas été retiré : la fléchée passée à <code>removeEventListener<\/code> est une <strong>autre<\/strong> fonction. La fonction nommée, elle, s&#39;est retirée après le premier clic.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Cet exemple utilise <code>EventTarget<\/code>, disponible aussi dans Node.js, pour pouvoir être exécuté ici. Dans la page, c&#39;est la même API sur un bouton.<\/p>\n<\/aside><h2>Idée 2 · Les 3 phases : capture, cible, bouillonnement<\/h2>\n<svg viewBox=\"0 0 560 200\" style=\"width:100%;max-width:560px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Un clic descend de window jusqu'au bouton (capture), atteint la cible, puis remonte jusqu'à window (bouillonnement)\">\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\">\n<rect x=\"210\" y=\"10\" width=\"140\" height=\"26\" rx=\"5\" fill=\"none\" stroke=\"currentColor\"/><text x=\"280\" y=\"28\">window / document<\/text>\n<rect x=\"210\" y=\"55\" width=\"140\" height=\"26\" rx=\"5\" fill=\"none\" stroke=\"currentColor\"/><text x=\"280\" y=\"73\">body<\/text>\n<rect x=\"210\" y=\"100\" width=\"140\" height=\"26\" rx=\"5\" fill=\"none\" stroke=\"currentColor\"/><text x=\"280\" y=\"118\">ul (parent)<\/text>\n<rect x=\"210\" y=\"150\" width=\"140\" height=\"30\" rx=\"5\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/><text x=\"280\" y=\"170\" fill=\"#D9824F\" font-weight=\"700\">li cliqué (target)<\/text>\n<text x=\"120\" y=\"100\">1. capture ↓<\/text><text x=\"450\" y=\"100\" fill=\"#D9824F\" font-weight=\"700\">3. bouillonnement ↑<\/text><text x=\"420\" y=\"172\">2. cible<\/text><\/g>\n<path d=\"M195 20 L195 160\" stroke=\"currentColor\" stroke-width=\"2\"/><path d=\"M188 150 L195 165 L202 150\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<path d=\"M365 165 L365 25\" stroke=\"#D9824F\" stroke-width=\"3\"/><path d=\"M358 35 L365 20 L372 35\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/>\n<\/svg><p>Par défaut, les écouteurs réagissent au <strong>bouillonnement<\/strong> : un clic sur un <code>&lt;li&gt;<\/code> déclenche aussi les écouteurs du <code>&lt;ul&gt;<\/code>, du <code>&lt;body&gt;<\/code>…<\/p>\n<table>\n<thead>\n<tr>\n<th>Appel<\/th>\n<th>Le parent entend-il le clic ?<\/th>\n<th>Le lien navigue-t-il ?<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>rien<\/td>\n<td>oui<\/td>\n<td>oui<\/td>\n<\/tr>\n<tr>\n<td><code>e.preventDefault()<\/code><\/td>\n<td>oui<\/td>\n<td><strong>non<\/strong><\/td>\n<\/tr>\n<tr>\n<td><code>e.stopPropagation()<\/code><\/td>\n<td><strong>non<\/strong><\/td>\n<td>oui<\/td>\n<\/tr>\n<tr>\n<td>les deux<\/td>\n<td>non<\/td>\n<td>non<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p><code>e.stopImmediatePropagation()<\/code> bloque aussi les autres écouteurs du <strong>même<\/strong> élément.<\/p>\n<h2>Idée 3 · L&#39;objet événement e<\/h2>\n<p>Le navigateur passe un objet événement comme <strong>premier argument<\/strong> du callback.<\/p>\n<ul>\n<li><code>e.type<\/code> (<code>&quot;click&quot;<\/code>), <code>e.timeStamp<\/code>, <code>e.isTrusted<\/code> (<code>false<\/code> si l&#39;événement est simulé par un script, ex. <code>bouton.click()<\/code>).<\/li>\n<li><strong><code>e.target<\/code><\/strong> : l&#39;élément réellement touché (ex. l&#39;<code>&lt;img&gt;<\/code> dans le bouton). <strong><code>e.currentTarget<\/code><\/strong> : l&#39;élément qui porte l&#39;écouteur (le <code>&lt;button&gt;<\/code>).<\/li>\n<li>Clavier : <code>e.key<\/code> (le caractère, dépend de la disposition AZERTY/QWERTY) ; <code>e.code<\/code> (la touche physique, ex. <code>&quot;KeyW&quot;<\/code>).<\/li>\n<li>Pointeur : <code>e.clientX/Y<\/code> (par rapport à la fenêtre visible), <code>e.pageX/Y<\/code> (par rapport au document entier).<\/li>\n<\/ul>\n<h2>Idée 4 · La délégation d&#39;événements<\/h2>\n<p>Au lieu de 1000 écouteurs sur 1000 <code>&lt;li&gt;<\/code>, <strong>un seul<\/strong> sur le parent. Les clics remontent jusqu&#39;à lui ; <code>e.target.closest(...)<\/code> retrouve l&#39;élément visé. Bonus : les <code>&lt;li&gt;<\/code> ajoutés plus tard marchent aussi.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Coder une délégation<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Un seul écouteur sur le parent<\/div><p>$liste.addEventListener(&quot;click&quot;, (e) =&gt; { ... })<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Retrouver l&#39;élément visé<\/div><p>const $item = e.target.closest(&quot;li&quot;); — même si on a cliqué sur un <code>&lt;span&gt;<\/code> dedans.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Ignorer les clics à côté<\/div><p>if (!$item) return;<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Agir<\/div><p>$item.classList.toggle(&quot;barre&quot;);<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><pre class=\"\"><code>const $todo = document.querySelector(&quot;#todoList&quot;);\n$todo.addEventListener(&quot;click&quot;, (e) =&gt; {\n  const $li = e.target.closest(&quot;li&quot;);\n  if (!$li) return;\n  $li.classList.toggle(&quot;barre&quot;);   /* .barre { text-decoration: line-through; } */\n});<\/code><\/pre><p>C&#39;est la question 2 de l&#39;exercice 3 de l&#39;examen 2025.<\/p>\n<h2>Idée 5 · Événements avancés : debounce, throttle, CustomEvent, cycle de vie<\/h2>\n<ul>\n<li><strong>Debounce<\/strong> : attendre un silence (ex. 300 ms) avant d&#39;exécuter. Pour une barre de recherche qui appelle une API.<\/li>\n<li><strong>Throttle<\/strong> : au plus une exécution toutes les X ms. Pour <code>scroll<\/code> / <code>resize<\/code>.<\/li>\n<\/ul>\n<pre class=\"\"><code>function debounce(fonctionMetier, delai) {\n  let chronometre;\n  return function (...args) {\n    clearTimeout(chronometre);\n    chronometre = setTimeout(() =&gt; fonctionMetier.apply(this, args), delai);\n  };\n}\nconst rechercher = debounce(q =&gt; console.log(&quot;Requête serveur pour : &quot; + q), 50);\nrechercher(&quot;J&quot;);\nrechercher(&quot;Ja&quot;);\nrechercher(&quot;JavaScript&quot;);<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Requête serveur pour : JavaScript<\/code><\/pre><p>Trois frappes, <strong>une<\/strong> requête. La variable <code>chronometre<\/code> survit entre les appels grâce à une <strong>fermeture<\/strong> (closure).<\/p>\n<p><strong>CustomEvent<\/strong> : un module diffuse un événement, les autres s&#39;y abonnent, sans se connaître.<\/p>\n<pre class=\"\"><code>const bus = new EventTarget();\nbus.addEventListener(&quot;achatValide&quot;, (e) =&gt; {\n  console.log(`Article ${e.detail.idProduit} payé (${e.detail.prix} DH)`);\n});\nbus.dispatchEvent(new CustomEvent(&quot;achatValide&quot;, { detail: { idProduit: &quot;PRD-404&quot;, prix: 99.99 } }));<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Article PRD-404 payé (99.99 DH)<\/code><\/pre><p>Dans la page, le prof diffuse sur <code>window<\/code> : <code>window.dispatchEvent(eventAchat)<\/code>.<\/p>\n<p><strong>Cycle de vie<\/strong> : attends <code>DOMContentLoaded<\/code> avant de chercher des éléments (sinon <code>querySelector<\/code> renvoie <code>null<\/code>). <code>load<\/code> attend en plus les images. <code>MutationObserver<\/code> surveille les changements du DOM sans <code>setInterval<\/code>.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices type TD 4, TP 3 et examen<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>(TD 4, ex. 2) 10 000 employés, un bouton <code>.btn-bannir<\/code> par carte <code>.carte-employe<\/code>. Un seul écouteur autorisé : supprime la carte du bouton cliqué.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>document.querySelector(&quot;#liste-employes&quot;).addEventListener(&quot;click&quot;, (e) =&gt; { const $btn = e.target.closest(&quot;.btn-bannir&quot;); if (!$btn) return; $btn.closest(&quot;.carte-employe&quot;).remove(); });<\/code><\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>(Examen 2025, ex. 3.3) Double-clic sur un <code>&lt;li&gt;<\/code> : le remplacer par un <code>&lt;input type=&quot;text&quot;&gt;<\/code> pré-rempli ; « Entrée » valide et remet un <code>&lt;li&gt;<\/code> avec le nouveau texte.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Délégation sur <code>#todoList<\/code> avec <code>dblclick<\/code> : <code>const $li = e.target.closest(&quot;li&quot;); if (!$li) return; const $in = document.createElement(&quot;input&quot;); $in.type = &quot;text&quot;; $in.value = $li.textContent; $li.replaceWith($in); $in.focus();<\/code> puis <code>$in.addEventListener(&quot;keydown&quot;, (ev) =&gt; { if (ev.key === &quot;Enter&quot;) { const $n = document.createElement(&quot;li&quot;); $n.textContent = $in.value; $in.replaceWith($n); } });<\/code>. (<code>replaceWith<\/code> n&#39;est pas dans les diapos ; équivalent : <code>parent.insertBefore(nouveau, ancien)<\/code> puis <code>ancien.remove()<\/code>.)<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Un lien <code>&lt;a href=&quot;/page&quot;&gt;<\/code> est dans une carte cliquable. On veut que le lien ne navigue pas mais que la carte réagisse. Quelle méthode ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>e.preventDefault()<\/code> seulement : l&#39;action native (navigation) est annulée, mais l&#39;événement continue de remonter vers la carte.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 10 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quel événement se déclenche à <strong>chaque frappe<\/strong> dans un champ ?<\/div><button class=\"opt\" data-o=\"0\">input<\/button><button class=\"opt\" data-o=\"1\">change<\/button><button class=\"opt\" data-o=\"2\">submit<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Pour empêcher un formulaire de recharger la page :<\/div><button class=\"opt\" data-o=\"0\">e.preventDefault() dans l&#39;écouteur submit<\/button><button class=\"opt\" data-o=\"1\">e.stopPropagation()<\/button><button class=\"opt\" data-o=\"2\">return false dans le HTML uniquement<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Pourquoi <code>btn.removeEventListener(&quot;click&quot;, () =&gt; f())<\/code> échoue-t-il ?<\/div><button class=\"opt\" data-o=\"0\">removeEventListener n&#39;existe pas<\/button><button class=\"opt\" data-o=\"1\">La fléchée est une nouvelle fonction, différente de celle attachée<\/button><button class=\"opt\" data-o=\"2\">Il faut passer once: true<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Ordre des phases d&#39;un événement :<\/div><button class=\"opt\" data-o=\"0\">bouillonnement, cible, capture<\/button><button class=\"opt\" data-o=\"1\">capture, cible, bouillonnement<\/button><button class=\"opt\" data-o=\"2\">cible, capture, bouillonnement<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Clic sur une <code>&lt;img&gt;<\/code> dans un <code>&lt;button&gt;<\/code> qui porte l&#39;écouteur : <code>e.target<\/code> vaut<\/div><button class=\"opt\" data-o=\"0\">l&#39;img<\/button><button class=\"opt\" data-o=\"1\">le button<\/button><button class=\"opt\" data-o=\"2\">document<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Quelle option détache l&#39;écouteur après la première exécution ?<\/div><button class=\"opt\" data-o=\"0\">passive: true<\/button><button class=\"opt\" data-o=\"1\">once: true<\/button><button class=\"opt\" data-o=\"2\">capture: true<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Intérêt principal de la délégation :<\/div><button class=\"opt\" data-o=\"0\">Un seul écouteur, qui marche aussi pour les éléments ajoutés plus tard<\/button><button class=\"opt\" data-o=\"1\">Elle bloque le bouillonnement<\/button><button class=\"opt\" data-o=\"2\">Elle évite le DOM<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Pour un jeu, quelle propriété vise la même touche physique en AZERTY et QWERTY ?<\/div><button class=\"opt\" data-o=\"0\">e.key<\/button><button class=\"opt\" data-o=\"1\">e.code<\/button><button class=\"opt\" data-o=\"2\">e.type<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Une barre de recherche qui interroge une API à chaque lettre doit utiliser :<\/div><button class=\"opt\" data-o=\"0\">debounce<\/button><button class=\"opt\" data-o=\"1\">throttle<\/button><button class=\"opt\" data-o=\"2\">stopPropagation<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Quelle API permet de créer son propre événement avec des données ?<\/div><button class=\"opt\" data-o=\"0\">new Event(&quot;x&quot;, data)<\/button><button class=\"opt\" data-o=\"1\">new CustomEvent(&quot;x&quot;, { detail: {...} }) puis dispatchEvent<\/button><button class=\"opt\" data-o=\"2\">addEventListener(&quot;custom&quot;)<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"evenements","rep":null,"tol":null},{"n":"evenements","rep":null,"tol":null},{"n":"evenements","rep":null,"tol":null},{"n":"evenements","rep":null,"tol":null}],"qcm":[{"n":"evenements","q":"Quel événement se déclenche à <strong>chaque frappe<\/strong> dans un champ ?","o":["input","change","submit"],"a":0,"e":"change attend la fin de la modification."},{"n":"evenements","q":"Pour empêcher un formulaire de recharger la page :","o":["e.preventDefault() dans l&#39;écouteur submit","e.stopPropagation()","return false dans le HTML uniquement"],"a":0,"e":"On annule l&#39;action native du navigateur."},{"n":"evenements","q":"Pourquoi <code>btn.removeEventListener(&quot;click&quot;, () =&gt; f())<\/code> échoue-t-il ?","o":["removeEventListener n&#39;existe pas","La fléchée est une nouvelle fonction, différente de celle attachée","Il faut passer once: true"],"a":1,"e":"Il faut la même référence de fonction."},{"n":"evenements","q":"Ordre des phases d&#39;un événement :","o":["bouillonnement, cible, capture","capture, cible, bouillonnement","cible, capture, bouillonnement"],"a":1,"e":"Descente, cible, remontée."},{"n":"evenements","q":"Clic sur une <code>&lt;img&gt;<\/code> dans un <code>&lt;button&gt;<\/code> qui porte l&#39;écouteur : <code>e.target<\/code> vaut","o":["l&#39;img","le button","document"],"a":0,"e":"target = origine physique ; currentTarget = le button."},{"n":"evenements","q":"Quelle option détache l&#39;écouteur après la première exécution ?","o":["passive: true","once: true","capture: true"],"a":1,"e":"Utile contre les doubles paiements."},{"n":"evenements","q":"Intérêt principal de la délégation :","o":["Un seul écouteur, qui marche aussi pour les éléments ajoutés plus tard","Elle bloque le bouillonnement","Elle évite le DOM"],"a":0,"e":"Elle repose justement sur le bouillonnement."},{"n":"evenements","q":"Pour un jeu, quelle propriété vise la même touche physique en AZERTY et QWERTY ?","o":["e.key","e.code","e.type"],"a":1,"e":"e.code vaut &quot;KeyW&quot; quelle que soit la langue."},{"n":"evenements","q":"Une barre de recherche qui interroge une API à chaque lettre doit utiliser :","o":["debounce","throttle","stopPropagation"],"a":0,"e":"On attend que l&#39;utilisateur ait fini de taper."},{"n":"evenements","q":"Quelle API permet de créer son propre événement avec des données ?","o":["new Event(&quot;x&quot;, data)","new CustomEvent(&quot;x&quot;, { detail: {...} }) puis dispatchEvent","addEventListener(&quot;custom&quot;)"],"a":1,"e":"Les données passent dans detail."}]},{"id":"stockage-erreurs","t":"JSON, Web Storage et gestion des erreurs","seance":"Séance 6 · Persistance côté client et exceptions","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir écrire un objet littéral et lire une propriété (chapitre 4).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Toutes tes variables JS sont en RAM. Que deviennent-elles quand l&#39;utilisateur rafraîchit la page ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Elles sont <strong>détruites<\/strong> : la page repart de zéro. HTTP est en plus « sans état » : le serveur ne se souvient pas de toi. D&#39;où le besoin de stocker des données dans le navigateur.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Le Web Storage ne connaît que les <strong>chaînes<\/strong>. Retiens le pont : <strong><code>JSON.stringify<\/code> à l&#39;écriture, <code>JSON.parse<\/code> à la lecture.<\/strong><\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p><code>localStorage.setItem(&quot;config&quot;, objet)<\/code> sans <code>stringify<\/code> enregistre la chaîne <code>&quot;[object Object]&quot;<\/code> : la donnée est perdue.<\/p>\n<\/aside><p>À la fin, tu sais sérialiser un objet, choisir entre <code>localStorage<\/code> et <code>sessionStorage<\/code>, et protéger un code avec <code>try / catch / finally<\/code> et <code>throw<\/code>.<\/p>\n<h2>Idée 1 · JSON : sérialiser et désérialiser<\/h2>\n<p><strong>JSON<\/strong> est un format <strong>texte<\/strong> : clés et chaînes entre <strong>guillemets doubles<\/strong>. C&#39;est le standard d&#39;échange du web (il a remplacé XML).<\/p>\n<figure class=\"flux\"><figcaption>Le pont JSON<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">objet JS<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">JSON.stringify<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">chaîne JSON (réseau, stockage)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">JSON.parse<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">objet JS<\/div><\/div><\/figure><pre class=\"\"><code>const userPrefs = { theme: &quot;dark&quot;, fontSize: 14 };\nconst payload = JSON.stringify(userPrefs);\nconsole.log(typeof payload, payload);\n\nconst data = JSON.parse('{&quot;status&quot;:&quot;success&quot;,&quot;id&quot;:42}');\nconsole.log(typeof data, data.id);<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>string {&quot;theme&quot;:&quot;dark&quot;,&quot;fontSize&quot;:14}\nobject 42<\/code><\/pre><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p><code>stringify<\/code> ne garde que les <strong>données<\/strong> : les fonctions, les <code>undefined<\/code> et les <code>Symbol<\/code> disparaissent en silence.<\/p>\n<\/aside><pre class=\"\"><code>const vehicule = {\n  marque: &quot;Renault&quot;,\n  prix: undefined,\n  demarrer() { console.log(&quot;Vroom&quot;); }\n};\nconsole.log(JSON.stringify(vehicule));<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>{&quot;marque&quot;:&quot;Renault&quot;}<\/code><\/pre><h2>Idée 2 · localStorage et sessionStorage<\/h2>\n<figure class=\"grille\"><figcaption>Les deux stockages (environ 5 Mo par domaine, chaînes uniquement)<\/figcaption><table><tr><th><\/th><th>durée de vie<\/th><th>partagé entre onglets ?<\/th><th>usage<\/th><\/tr><tr><th>sessionStorage<\/th><td>fermé avec l'onglet<\/td><td>non, un par onglet<\/td><td>étapes d'un long formulaire, panier éphémère<\/td><\/tr><tr><th>localStorage<\/th><td class=\"h1\">sans expiration<\/td><td class=\"h1\">oui, même domaine<\/td><td class=\"h1\">thème sombre, langue, cache d'API<\/td><\/tr><\/table><\/figure><p>Les cookies, eux, sont limités à environ 4 Ko.<\/p>\n<pre class=\"\"><code>const parametres = { theme: &quot;dark&quot;, volume: 80 };\nlocalStorage.setItem(&quot;appConfig&quot;, JSON.stringify(parametres));   // 1. écrire\n\nconst brut = localStorage.getItem(&quot;appConfig&quot;);                    // 2. lire (null si absent)\nif (brut) {\n  const config = JSON.parse(brut);\n  console.log(&quot;Volume restauré :&quot;, config.volume);\n} else {\n  console.log(&quot;Aucune configuration : valeurs par défaut.&quot;);\n}\nlocalStorage.removeItem(&quot;appConfig&quot;);   // supprimer une clé (hors diapos : clear() vide tout)<\/code><\/pre><aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p><strong>Jamais de données sensibles<\/strong> dans le Web Storage : mots de passe, numéros de carte, jetons d&#39;authentification. Tout script qui tourne sur ton domaine (y compris un script injecté par XSS) peut les lire.<\/p>\n<\/aside><h2>Idée 3 · try, catch, finally<\/h2>\n<p>Une <strong>erreur<\/strong> fatale arrête le script ; une <strong>exception<\/strong> est un événement anormal mais prévisible (serveur absent, JSON mal formé). Objectif : <strong>gérer la panne<\/strong> au lieu d&#39;afficher une page blanche.<\/p>\n<pre class=\"\"><code>function analyserDonnees(texte) {\n  console.log(&quot;1. Ouverture&quot;);\n  try {\n    const objet = JSON.parse(texte);\n    console.log(&quot;2. Succès :&quot;, objet.nom);\n  } catch (erreur) {\n    console.log(&quot;2. Échec :&quot;, erreur.name);\n  } finally {\n    console.log(&quot;3. Fermeture&quot;);\n  }\n}\nanalyserDonnees('{&quot;nom&quot;: &quot;Alice&quot;}');\nanalyserDonnees(&quot;Ceci n'est pas un JSON valide&quot;);<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>1. Ouverture\n2. Succès : Alice\n3. Fermeture\n1. Ouverture\n2. Échec : SyntaxError\n3. Fermeture<\/code><\/pre><ul>\n<li><code>catch (err)<\/code> ne s&#39;exécute que si le <code>try<\/code> a levé une erreur. <code>err.name<\/code> donne le type, <code>err.message<\/code> l&#39;explication.<\/li>\n<li><code>finally<\/code> s&#39;exécute <strong>toujours<\/strong>, même après un <code>return<\/code> : on y arrête un spinner, on réactive un bouton.<\/li>\n<\/ul>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Sur la diapo, le second appel est écrit <code>analyserDonnees(&#39;Ceci n&#39;est pas un JSON valide&#39;);<\/code>. L&#39;apostrophe de « n&#39;est » ferme la chaîne : ce code ne se lance même pas (<code>SyntaxError<\/code> à la lecture du fichier, que <code>try<\/code> ne peut pas attraper). Il faut des guillemets doubles autour, comme ci-dessus, ou échapper l&#39;apostrophe (<code>&#39;n\\&#39;est&#39;<\/code>).<\/p>\n<\/aside><h2>Idée 4 · throw et les types d&#39;erreurs<\/h2>\n<p><code>throw<\/code> lève <strong>ta propre<\/strong> erreur quand une règle métier est violée.<\/p>\n<pre class=\"\"><code>function verifierAge(age) {\n  if (age &lt; 0) throw new Error(&quot;L'âge ne peut pas être négatif !&quot;);\n  return age &gt;= 18;\n}\ntry {\n  console.log(verifierAge(20));\n  verifierAge(-5);\n  console.log(&quot;jamais affiché&quot;);\n} catch (err) {\n  console.log(&quot;Validation échouée : &quot; + err.message);\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>true\nValidation échouée : L'âge ne peut pas être négatif !<\/code><\/pre><pre class=\"\"><code>const essais = [\n  () =&gt; variableInconnue,\n  () =&gt; (42)(),\n  () =&gt; new Array(-1),\n  () =&gt; JSON.parse(&quot;{mauvais}&quot;)\n];\nfor (const f of essais) {\n  try { f(); } catch (e) { console.log(e.name); }\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>ReferenceError\nTypeError\nRangeError\nSyntaxError<\/code><\/pre><table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Cause<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>ReferenceError<\/code><\/td>\n<td>variable non déclarée<\/td>\n<\/tr>\n<tr>\n<td><code>TypeError<\/code><\/td>\n<td>mauvais type (appeler un nombre comme une fonction, réassigner une <code>const<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><code>SyntaxError<\/code><\/td>\n<td>code ou JSON mal écrit<\/td>\n<\/tr>\n<tr>\n<td><code>RangeError<\/code><\/td>\n<td>valeur hors limites (taille de tableau négative)<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices type TD 4 et cours<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Sauvegarde le nom d&#39;un administrateur (<code>&quot;Zouina&quot;<\/code>) puis relis-le au chargement suivant (TD 4, ex. 3).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Écriture : <code>localStorage.setItem(&quot;admin&quot;, &quot;Zouina&quot;);<\/code> (c&#39;est déjà une chaîne, pas besoin de stringify). Lecture : <code>const nom = localStorage.getItem(&quot;admin&quot;);<\/code> puis tester <code>if (nom)<\/code>. Pour un objet : <code>setItem(&quot;admin&quot;, JSON.stringify({ nom: &quot;Zouina&quot; }))<\/code> et <code>JSON.parse(getItem(&quot;admin&quot;))<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Que vaut <code>JSON.stringify({ a: 1, b: undefined, c: &quot;x&quot; })<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>&#39;{&quot;a&quot;:1,&quot;c&quot;:&quot;x&quot;}&#39;<\/code> : la clé b, qui vaut undefined, disparaît.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Pourquoi ne pas stocker un jeton d&#39;authentification dans le localStorage ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Tout JavaScript exécuté sur le domaine peut le lire. Un script injecté par une faille XSS peut donc le voler.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 9 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\"><code>typeof JSON.stringify({ a: 1 })<\/code> vaut :<\/div><button class=\"opt\" data-o=\"0\">&quot;object&quot;<\/button><button class=\"opt\" data-o=\"1\">&quot;string&quot;<\/button><button class=\"opt\" data-o=\"2\">&quot;json&quot;<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Que renvoie <code>JSON.stringify({ f() {}, x: 1 })<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">&#39;{&quot;x&quot;:1}&#39;<\/button><button class=\"opt\" data-o=\"1\">&#39;{&quot;f&quot;:&quot;function&quot;,&quot;x&quot;:1}&#39;<\/button><button class=\"opt\" data-o=\"2\">une erreur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\"><code>localStorage.setItem(&quot;c&quot;, { a: 1 })<\/code> enregistre :<\/div><button class=\"opt\" data-o=\"0\">l&#39;objet<\/button><button class=\"opt\" data-o=\"1\">la chaîne &quot;[object Object]&quot;<\/button><button class=\"opt\" data-o=\"2\">rien<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Quel stockage disparaît à la fermeture de l&#39;onglet ?<\/div><button class=\"opt\" data-o=\"0\">sessionStorage<\/button><button class=\"opt\" data-o=\"1\">localStorage<\/button><button class=\"opt\" data-o=\"2\">les deux<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Capacité approximative du Web Storage selon le cours :<\/div><button class=\"opt\" data-o=\"0\">4 Ko<\/button><button class=\"opt\" data-o=\"1\">environ 5 Mo par domaine<\/button><button class=\"opt\" data-o=\"2\">illimitée<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\"><code>localStorage.getItem(&quot;absent&quot;)<\/code> renvoie :<\/div><button class=\"opt\" data-o=\"0\">undefined<\/button><button class=\"opt\" data-o=\"1\">null<\/button><button class=\"opt\" data-o=\"2\">&quot;&quot;<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\"><code>JSON.parse(&quot;Texte Invalide&quot;)<\/code> lève :<\/div><button class=\"opt\" data-o=\"0\">TypeError<\/button><button class=\"opt\" data-o=\"1\">SyntaxError<\/button><button class=\"opt\" data-o=\"2\">RangeError<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Le bloc <code>finally<\/code> :<\/div><button class=\"opt\" data-o=\"0\">ne s&#39;exécute qu&#39;en cas d&#39;erreur<\/button><button class=\"opt\" data-o=\"1\">ne s&#39;exécute qu&#39;en cas de succès<\/button><button class=\"opt\" data-o=\"2\">s&#39;exécute dans tous les cas<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Appeler <code>(42)()<\/code> lève :<\/div><button class=\"opt\" data-o=\"0\">TypeError<\/button><button class=\"opt\" data-o=\"1\">ReferenceError<\/button><button class=\"opt\" data-o=\"2\">SyntaxError<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Pour signaler qu&#39;un âge négatif est interdit :<\/div><button class=\"opt\" data-o=\"0\">return -1<\/button><button class=\"opt\" data-o=\"1\">throw new Error(&quot;…&quot;)<\/button><button class=\"opt\" data-o=\"2\">console.log(&quot;erreur&quot;)<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"stockage-erreurs","rep":null,"tol":null},{"n":"stockage-erreurs","rep":null,"tol":null},{"n":"stockage-erreurs","rep":null,"tol":null},{"n":"stockage-erreurs","rep":null,"tol":null}],"qcm":[{"n":"stockage-erreurs","q":"<code>typeof JSON.stringify({ a: 1 })<\/code> vaut :","o":["&quot;object&quot;","&quot;string&quot;","&quot;json&quot;"],"a":1,"e":"stringify produit une chaîne."},{"n":"stockage-erreurs","q":"Que renvoie <code>JSON.stringify({ f() {}, x: 1 })<\/code> ?","o":["&#39;{&quot;x&quot;:1}&#39;","&#39;{&quot;f&quot;:&quot;function&quot;,&quot;x&quot;:1}&#39;","une erreur"],"a":0,"e":"Les fonctions sont supprimées."},{"n":"stockage-erreurs","q":"<code>localStorage.setItem(&quot;c&quot;, { a: 1 })<\/code> enregistre :","o":["l&#39;objet","la chaîne &quot;[object Object]&quot;","rien"],"a":1,"e":"Le Storage convertit en chaîne. Il fallait JSON.stringify."},{"n":"stockage-erreurs","q":"Quel stockage disparaît à la fermeture de l&#39;onglet ?","o":["sessionStorage","localStorage","les deux"],"a":0,"e":"localStorage n&#39;a pas d&#39;expiration."},{"n":"stockage-erreurs","q":"Capacité approximative du Web Storage selon le cours :","o":["4 Ko","environ 5 Mo par domaine","illimitée"],"a":1,"e":"4 Ko, c&#39;est la limite des cookies."},{"n":"stockage-erreurs","q":"<code>localStorage.getItem(&quot;absent&quot;)<\/code> renvoie :","o":["undefined","null","&quot;&quot;"],"a":1,"e":"D&#39;où le test <code>if (brut)<\/code> avant JSON.parse."},{"n":"stockage-erreurs","q":"<code>JSON.parse(&quot;Texte Invalide&quot;)<\/code> lève :","o":["TypeError","SyntaxError","RangeError"],"a":1,"e":"Le texte n&#39;est pas du JSON valide."},{"n":"stockage-erreurs","q":"Le bloc <code>finally<\/code> :","o":["ne s&#39;exécute qu&#39;en cas d&#39;erreur","ne s&#39;exécute qu&#39;en cas de succès","s&#39;exécute dans tous les cas"],"a":2,"e":"Idéal pour réactiver un bouton ou cacher un spinner."},{"n":"stockage-erreurs","q":"Appeler <code>(42)()<\/code> lève :","o":["TypeError","ReferenceError","SyntaxError"],"a":0,"e":"On appelle un nombre comme une fonction."},{"n":"stockage-erreurs","q":"Pour signaler qu&#39;un âge négatif est interdit :","o":["return -1","throw new Error(&quot;…&quot;)","console.log(&quot;erreur&quot;)"],"a":1,"e":"throw interrompt et laisse l&#39;appelant gérer avec catch."}]},{"id":"promesses-fetch","t":"HTTP, promesses, async/await et fetch","seance":"Séance 7 · Requêtes HTTP et APIs (Fetch)","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut avoir compris l&#39;Event Loop (chapitre 5) : une tâche longue est déléguée, et son callback revient plus tard.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Pourquoi JavaScript n&#39;attend-il pas simplement la réponse du serveur, ligne par ligne ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Il n&#39;a qu&#39;un seul thread. Attendre bloquerait la pile d&#39;appels : plus aucun clic ne marcherait, la page gèlerait. Il délègue donc la requête et continue.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Une promesse est un <strong>ticket de retrait<\/strong> : tu le reçois tout de suite, la commande arrivera plus tard (ou sera annulée). <code>then<\/code> = « quand c&#39;est prêt », <code>catch<\/code> = « si ça rate ». <code>await<\/code> = « j&#39;attends mon ticket ici ».<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Croire que <code>fetch<\/code> rejette sur une erreur 404 ou 500. Non : il ne rejette que si le <strong>réseau<\/strong> échoue. Il faut tester <code>response.ok<\/code> soi-même.<\/p>\n<\/aside><p>À la fin, tu sais lire une requête/réponse HTTP, créer et consommer une promesse, appeler une API avec <code>fetch<\/code> et <code>async/await<\/code>, et choisir entre <code>Promise.all<\/code>, <code>allSettled<\/code>, <code>race<\/code> et <code>any<\/code>.<\/p>\n<h2>Idée 1 · HTTP et REST en bref<\/h2>\n<ul>\n<li><strong>Client<\/strong> (navigateur) envoie des requêtes ; <strong>serveur<\/strong> (Node, Python, PHP) gère la base et la logique. HTTP est <strong>sans état<\/strong>.<\/li>\n<li>Requête = <strong>URL<\/strong> (endpoint) + <strong>méthode<\/strong> + <strong>headers<\/strong> (<code>Content-Type<\/code>, <code>Authorization<\/code>) + <strong>body<\/strong> (POST/PUT/PATCH).<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>Méthode<\/th>\n<th>Action<\/th>\n<th>Exemple REST<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>GET<\/td>\n<td>lire<\/td>\n<td><code>GET /users<\/code>, <code>GET /users/42<\/code><\/td>\n<\/tr>\n<tr>\n<td>POST<\/td>\n<td>créer<\/td>\n<td><code>POST /users<\/code><\/td>\n<\/tr>\n<tr>\n<td>PUT / PATCH<\/td>\n<td>modifier<\/td>\n<td><code>PUT /users/42<\/code><\/td>\n<\/tr>\n<tr>\n<td>DELETE<\/td>\n<td>supprimer<\/td>\n<td><code>DELETE /users/42<\/code><\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Codes de réponse : <strong>2xx<\/strong> succès (200 OK, 201 Created), <strong>3xx<\/strong> redirection, <strong>4xx<\/strong> erreur du client (400, 401, 404), <strong>5xx<\/strong> erreur du serveur (500). Format d&#39;échange : JSON, type MIME <code>application/json<\/code>.<\/p>\n<h2>Idée 2 · Les promesses<\/h2>\n<p>L&#39;ancien monde : des callbacks imbriqués (<code>getUser(1, user =&gt; getPosts(user.id, posts =&gt; ...))<\/code>), la « pyramide de l&#39;enfer ». Une <strong>promesse<\/strong> est un objet qui représente le résultat futur d&#39;une opération.<\/p>\n<figure class=\"flux\"><figcaption>Les 3 états d'une promesse<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">pending (en attente)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">fulfilled (resolve : succès)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">.then<\/div><\/div><div class=\"flux-l\"><div class=\"flux-b\">pending (en attente)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">rejected (reject : échec)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">.catch<\/div><\/div><\/figure><p>Une promesse n&#39;appelle <strong>qu&#39;une fois<\/strong> <code>resolve<\/code> <strong>ou<\/strong> <code>reject<\/code> : le premier appel fixe l&#39;état final.<\/p>\n<pre class=\"\"><code>const testerConnexion = (estConnecte) =&gt; {\n  return new Promise((resolve, reject) =&gt; {\n    if (estConnecte === true) resolve(&quot;Connexion réussie !&quot;);\n    else reject(new Error(&quot;Connexion perdue.&quot;));\n  });\n};\ntesterConnexion(true)\n  .then(message =&gt; console.log(message))\n  .catch(erreur =&gt; console.log(&quot;Échec :&quot;, erreur.message));\ntesterConnexion(false)\n  .then(message =&gt; console.log(message))\n  .catch(erreur =&gt; console.log(&quot;Échec :&quot;, erreur.message));<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div>
