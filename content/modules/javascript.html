const MODULE={"slug":"javascript","titre":"JavaScript","cle":"javascript_scores","cleEtat":"javascript_scores_etat","format":"score10","intro":"<p>Ce module suit <strong>les 7 séances du Pr Zouina<\/strong> (Programmation web 2, S4 2025-2026), puis corrige les <strong>TD 1 à 4<\/strong> et les <strong>TP<\/strong>, et finit par un <strong>examen blanc<\/strong> construit sur l&#39;examen de 2025.<\/p>\n<p><strong>Comment l&#39;utiliser<\/strong><\/p>\n<ol>\n<li>Lis un chapitre en entier. Chaque chapitre commence par un prérequis à vérifier.<\/li>\n<li>Exécute les exemples : <code>node fichier.js<\/code> pour le JavaScript pur, la console du navigateur (F12) pour le DOM.<\/li>\n<li>Fais le QCM du chapitre. <strong>8/10 = chapitre maîtrisé.<\/strong> Sinon, relis les encadrés « Piège ».<\/li>\n<li>Le tuteur (en bas à droite) répond à tes questions sur le chapitre ouvert.<\/li>\n<\/ol>\n<p><strong>Ce qui est sûr<\/strong> : le contenu vient des diapositives, des TD et des TP du prof. Tous les exemples marqués comme exécutés ont tourné sous Node.js 22.\n<strong>À vérifier<\/strong> : le barème de l&#39;examen et le poids du mini-projet. Demande-les au prof.<\/p>\n","annexes":[],"cartes":null,"maths":false};
const CHAPS=[{"id":"introduction-js","t":"Introduction à JavaScript · web, moteur et balise script","seance":"Séance 1 · Introduction","imp":2,"html":"<h2>Avant de commencer<\/h2>\n<p>Il te faut une seule idée : une page web est un fichier HTML que le navigateur lit, puis affiche. Le reste du chapitre explique qui fait quoi dans ce navigateur.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Dans l&#39;URL <code>http://www.example.com/chemin/page.html?q=req<\/code>, quelle partie est le protocole, laquelle est l&#39;hôte, laquelle est la chaîne de requête ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Lis de gauche à droite : le protocole est avant <code>://<\/code>.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Protocole : <code>http<\/code>. Hôte : <code>www.example.com<\/code>. Chemin : <code>/chemin/<\/code>, page : <code>page.html<\/code>. Chaîne de requête : <code>q=req<\/code> (après le <code>?<\/code>), transmise à la page.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Le prof compare la page web à un ordinateur : <strong>HTML = le châssis<\/strong>, <strong>CSS = l&#39;habillage<\/strong>, <strong>JavaScript = le processeur<\/strong> qui lit l&#39;état et modifie l&#39;affichage. Garde cette image : elle revient dans toutes les séances.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Croire que <code>document.getElementById<\/code> « fait partie de JavaScript ». Non : le DOM est une <strong>API du navigateur<\/strong> (écrite en C++). Le moteur JS seul (par exemple dans Node.js) ne connaît ni <code>document<\/code> ni <code>window<\/code>.<\/p>\n<\/aside><p>À la fin, tu sais expliquer comment le code JS est exécuté (compilation JIT), ce qu&#39;est le DOM, et où placer la balise <code>&lt;script&gt;<\/code> (avec <code>defer<\/code>).<\/p>\n<h2>Idée 1 · Web, Internet et client/serveur<\/h2>\n<p><strong>Internet<\/strong> est le réseau mondial (depuis ARPANET, années 1960). <strong>Le Web<\/strong> n&#39;est qu&#39;un de ses services, à côté des e-mails (SMTP, IMAP, POP3), du streaming ou du FTP. Le Web repose sur les pages, les liens hypertextes et HTTP/HTTPS.<\/p>\n<figure class=\"flux\"><figcaption>Une page dynamique interprétée côté client<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">Navigateur (client)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">requête HTTP<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Serveur<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">renvoie HTML + CSS + JS<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">le navigateur exécute le JS<\/div><\/div><\/figure><ul>\n<li><strong>Page statique<\/strong> : le serveur renvoie toujours le même fichier.<\/li>\n<li><strong>Page dynamique côté serveur<\/strong> : le serveur (PHP, Python, Node) fabrique la page à chaque requête.<\/li>\n<li><strong>Page dynamique côté client<\/strong> : le JavaScript, exécuté dans le navigateur, modifie la page <strong>sans la recharger<\/strong>. C&#39;est le rôle de JS.<\/li>\n<\/ul>\n<h2>Idée 2 · Le moteur JavaScript et la compilation JIT<\/h2>\n<p>JavaScript est un <strong>langage de script<\/strong> standardisé par <strong>ECMAScript<\/strong> (ES6 en 2015 : classes, promesses, modules). Il a été créé en 10 jours par Brendan Eich en 1995.<\/p>\n<p>Ses caractéristiques, telles que le prof les résume :<\/p>\n<table>\n<thead>\n<tr>\n<th>Propriété<\/th>\n<th>Sens<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Multi-paradigme<\/td>\n<td>impératif, orienté objet (prototypes, classes), fonctionnel (callbacks)<\/td>\n<\/tr>\n<tr>\n<td>Typage dynamique<\/td>\n<td>le type n&#39;est pas déclaré, il est fixé à l&#39;exécution<\/td>\n<\/tr>\n<tr>\n<td>Typage faible<\/td>\n<td>conversions implicites (coercition)<\/td>\n<\/tr>\n<tr>\n<td>Mémoire automatique<\/td>\n<td>Heap pour objets/tableaux/fonctions, Stack pour les primitives ; Garbage Collector<\/td>\n<\/tr>\n<tr>\n<td>Mono-thread<\/td>\n<td>une seule pile d&#39;appels : une boucle lourde fige la page<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Le <strong>moteur<\/strong> (V8 pour Chrome, Edge et Node.js ; SpiderMonkey pour Firefox ; JavaScriptCore pour Safari) traduit le code en langage machine. Il ne choisit ni la compilation complète à l&#39;avance (AOT, comme le C) ni l&#39;interprétation ligne par ligne : il fait du <strong>JIT<\/strong> (Just-In-Time).<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Le pipeline d'exécution de V8<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/6 · Parser<\/div><p>lit le texte source, découpe les mots-clés (tokens : let, function, =) et vérifie la syntaxe.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/6 · AST<\/div><p>les tokens deviennent un arbre syntaxique en mémoire.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/6 · Interpréteur (Ignition)<\/div><p>génère un bytecode et l&#39;exécute tout de suite : démarrage rapide.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/6 · Profiler<\/div><p>repère les « fonctions chaudes », exécutées très souvent (boucles).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/6 · Compilateur optimiseur (TurboFan)<\/div><p>compile ces fonctions chaudes en code machine natif (x86, ARM).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">6/6 · Dé-optimisation<\/div><p>si un type change (un nombre devient une chaîne), le code machine est jeté et on revient au bytecode.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p><strong>JIT = démarrer comme un interpréteur, accélérer comme un compilateur.<\/strong> La dé-optimisation explique pourquoi changer le type d&#39;une variable coûte cher.<\/p>\n<\/aside><h2>Idée 3 · Moteur, runtime, Web APIs et DOM<\/h2>\n<svg viewBox=\"0 0 560 190\" style=\"width:100%;max-width:560px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Le navigateur (runtime) contient le moteur JavaScript et les Web APIs : DOM, fetch, setTimeout\">\n<rect x=\"10\" y=\"10\" width=\"540\" height=\"170\" rx=\"10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<text x=\"24\" y=\"34\" font-family=\"sans-serif\" font-size=\"14\" fill=\"currentColor\" font-weight=\"700\">Navigateur = runtime<\/text>\n<rect x=\"30\" y=\"55\" width=\"200\" height=\"105\" rx=\"8\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/>\n<text x=\"130\" y=\"95\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#D9824F\" font-weight=\"700\">Moteur JS (V8)<\/text>\n<text x=\"130\" y=\"118\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"currentColor\">calcule seulement<\/text>\n<text x=\"130\" y=\"136\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"currentColor\">Call Stack + Heap<\/text>\n<line x1=\"230\" y1=\"107\" x2=\"300\" y2=\"107\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/>\n<text x=\"265\" y=\"98\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"currentColor\">pont<\/text>\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\">\n<rect x=\"300\" y=\"55\" width=\"230\" height=\"30\" rx=\"6\" fill=\"none\" stroke=\"currentColor\"/><text x=\"415\" y=\"75\">DOM (document)<\/text>\n<rect x=\"300\" y=\"92\" width=\"230\" height=\"30\" rx=\"6\" fill=\"none\" stroke=\"currentColor\"/><text x=\"415\" y=\"112\">Réseau : fetch<\/text>\n<rect x=\"300\" y=\"129\" width=\"230\" height=\"30\" rx=\"6\" fill=\"none\" stroke=\"currentColor\"/><text x=\"415\" y=\"149\">Timers : setTimeout<\/text><\/g>\n<\/svg><p>Le moteur ne connaît ni l&#39;écran ni le réseau. Le <strong>navigateur<\/strong> (le runtime) l&#39;entoure et lui fournit des <strong>Web APIs<\/strong> en C++ : le DOM, <code>fetch<\/code>, <code>setTimeout<\/code>.<\/p>\n<p>Le <strong>DOM<\/strong> (Document Object Model) est l&#39;arbre des balises HTML en mémoire : <code>window<\/code> (objet global) → <code>document<\/code> (point d&#39;entrée) → <code>&lt;html&gt;<\/code> → <code>&lt;head&gt;<\/code>, <code>&lt;body&gt;<\/code>. JS le <strong>lit<\/strong> (entrée) et le <strong>modifie<\/strong> (sortie), comme des registres d&#39;entrée/sortie.<\/p>\n<aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>L&#39;accès au DOM traverse un « pont » entre moteur JS et moteur de rendu : c&#39;est <strong>le principal goulot de performance<\/strong>. Règle : minimiser les accès, grouper les modifications.<\/p>\n<\/aside><h2>Idée 4 · Intégrer le script : async ou defer ?<\/h2>\n<p>Trois façons d&#39;écrire du JS dans une page :<\/p>\n<ol>\n<li><strong>Inline<\/strong> (<code>onclick=&quot;...&quot;<\/code> dans le HTML) : à bannir (illisible, risque XSS).<\/li>\n<li><strong>Interne<\/strong> (<code>&lt;script&gt;...&lt;/script&gt;<\/code>) : pour un petit script d&#39;une page ; pas mis en cache.<\/li>\n<li><strong>Externe<\/strong> (<code>&lt;script src=&quot;app.js&quot;&gt;&lt;/script&gt;<\/code>) : recommandé (réutilisable, mis en cache).<\/li>\n<\/ol>\n<p>Un <code>&lt;script&gt;<\/code> classique <strong>bloque<\/strong> le parseur HTML : il s&#39;arrête, télécharge, exécute, puis reprend. Écran blanc si le script est lourd.<\/p>\n<figure class=\"grille\"><figcaption>Comportement des trois balises<\/figcaption><table><tr><th><\/th><th>Téléchargement<\/th><th>Exécution<\/th><th>Ordre garanti<\/th><th>Usage<\/th><\/tr><tr><th>script seul<\/th><td>bloque le parseur<\/td><td>tout de suite<\/td><td>oui<\/td><td>rare aujourd'hui<\/td><\/tr><tr><th>async<\/th><td>en parallèle<\/td><td>dès qu'il est téléchargé<\/td><td class=\"h0\">non<\/td><td>analytique, pubs<\/td><\/tr><tr><th>defer<\/th><td class=\"h1\">en parallèle<\/td><td class=\"h1\">après tout le HTML<\/td><td class=\"h1\">oui<\/td><td class=\"h1\">choix par défaut<\/td><\/tr><\/table><\/figure><script defer src=\"app.js\"><\/script><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p><strong><code>defer<\/code> par défaut<\/strong> : le DOM est complet quand ton code s&#39;exécute, et l&#39;ordre des scripts est respecté. La vieille astuce (mettre le script juste avant <code>&lt;/body&gt;<\/code>) marche aussi, mais le téléchargement commence tard.<\/p>\n<\/aside><p><strong>DevTools<\/strong> (F12 ou Ctrl+Maj+J) : la <strong>console<\/strong> (<code>console.log<\/code>, la sortie standard), l&#39;onglet <strong>Sources<\/strong> pour poser des <strong>points d&#39;arrêt<\/strong> et avancer pas à pas, en lisant la <strong>Call Stack<\/strong> et le <strong>Scope<\/strong>.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Questions de cours<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Pourquoi l&#39;attribut <code>defer<\/code> est-il le choix par défaut pour un script qui manipule la page ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Le script est téléchargé en parallèle du HTML (pas de blocage), puis exécuté <strong>après<\/strong> la fin de la lecture du HTML : le DOM est complet. En plus, l&#39;ordre des scripts <code>defer<\/code> est respecté.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Explique en deux phrases la « dé-optimisation » dans V8.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>TurboFan compile une fonction chaude en supposant des types fixes. Si un type change (un nombre devient une chaîne), cette hypothèse tombe : le code machine est jeté et le moteur revient au bytecode, plus lent.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Un camarade lance <code>node app.js<\/code> et obtient <code>ReferenceError: document is not defined<\/code>. Pourquoi ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>document<\/code> est une Web API fournie par le navigateur, pas par le moteur JavaScript. Node.js embarque V8 mais pas de DOM.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Qui a créé JavaScript, et en combien de temps ?<\/div><button class=\"opt\" data-o=\"0\">Microsoft, en 1997<\/button><button class=\"opt\" data-o=\"1\">Brendan Eich, en 10 jours (1995)<\/button><button class=\"opt\" data-o=\"2\">Google, avec le moteur V8 en 2008<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Quel organisme standardise le langage ?<\/div><button class=\"opt\" data-o=\"0\">Le W3C<\/button><button class=\"opt\" data-o=\"1\">L&#39;ECMA (norme ECMAScript)<\/button><button class=\"opt\" data-o=\"2\">L&#39;IETF<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Quel moteur utilise Node.js ?<\/div><button class=\"opt\" data-o=\"0\">SpiderMonkey<\/button><button class=\"opt\" data-o=\"1\">JavaScriptCore<\/button><button class=\"opt\" data-o=\"2\">V8<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Dans le pipeline de V8, quel composant repère les fonctions « chaudes » ?<\/div><button class=\"opt\" data-o=\"0\">Le parser<\/button><button class=\"opt\" data-o=\"1\">Le profiler<\/button><button class=\"opt\" data-o=\"2\">Le garbage collector<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Que produit l&#39;interpréteur Ignition ?<\/div><button class=\"opt\" data-o=\"0\">Du bytecode, exécuté immédiatement<\/button><button class=\"opt\" data-o=\"1\">Du code machine optimisé<\/button><button class=\"opt\" data-o=\"2\">Un fichier .exe<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\"><code>setTimeout<\/code>, <code>fetch<\/code> et le DOM sont :<\/div><button class=\"opt\" data-o=\"0\">des mots-clés du langage<\/button><button class=\"opt\" data-o=\"1\">des Web APIs fournies par le navigateur<\/button><button class=\"opt\" data-o=\"2\">des fonctions du moteur V8<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Que fait le parseur HTML quand il rencontre un <code>&lt;script src&gt;<\/code> sans attribut ?<\/div><button class=\"opt\" data-o=\"0\">Il continue et exécute le script à la fin<\/button><button class=\"opt\" data-o=\"1\">Il s&#39;arrête, télécharge et exécute le script, puis reprend<\/button><button class=\"opt\" data-o=\"2\">Il ignore le script<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Quel attribut garantit que le DOM est complet et que l&#39;ordre des scripts est respecté ?<\/div><button class=\"opt\" data-o=\"0\">async<\/button><button class=\"opt\" data-o=\"1\">defer<\/button><button class=\"opt\" data-o=\"2\">type=&quot;module&quot; n&#39;existe pas<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Pourquoi bannir le code inline (<code>onclick=&quot;...&quot;<\/code>) ?<\/div><button class=\"opt\" data-o=\"0\">Il est plus lent à télécharger<\/button><button class=\"opt\" data-o=\"1\">Il mélange HTML et logique, et ouvre la porte aux failles XSS<\/button><button class=\"opt\" data-o=\"2\">Il ne fonctionne pas dans Chrome<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Dans les DevTools, où regarde-t-on la pile d&#39;appels pendant un point d&#39;arrêt ?<\/div><button class=\"opt\" data-o=\"0\">Dans l&#39;onglet Réseau<\/button><button class=\"opt\" data-o=\"1\">Dans l&#39;onglet Sources (Call Stack, Scope)<\/button><button class=\"opt\" data-o=\"2\">Dans la console uniquement<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"introduction-js","rep":null,"tol":null},{"n":"introduction-js","rep":null,"tol":null},{"n":"introduction-js","rep":null,"tol":null},{"n":"introduction-js","rep":null,"tol":null}],"qcm":[{"n":"introduction-js","q":"Qui a créé JavaScript, et en combien de temps ?","o":["Microsoft, en 1997","Brendan Eich, en 10 jours (1995)","Google, avec le moteur V8 en 2008"],"a":1,"e":"Créé en 1995 par Brendan Eich (d&#39;abord « Mocha », puis « LiveScript »). V8 date de 2008."},{"n":"introduction-js","q":"Quel organisme standardise le langage ?","o":["Le W3C","L&#39;ECMA (norme ECMAScript)","L&#39;IETF"],"a":1,"e":"JavaScript suit la spécification ECMAScript (ES6 en 2015, etc.)."},{"n":"introduction-js","q":"Quel moteur utilise Node.js ?","o":["SpiderMonkey","JavaScriptCore","V8"],"a":2,"e":"V8 est le moteur de Chrome, Edge et Node.js."},{"n":"introduction-js","q":"Dans le pipeline de V8, quel composant repère les fonctions « chaudes » ?","o":["Le parser","Le profiler","Le garbage collector"],"a":1,"e":"Le profiler observe l&#39;exécution du bytecode et marque les fonctions répétées pour TurboFan."},{"n":"introduction-js","q":"Que produit l&#39;interpréteur Ignition ?","o":["Du bytecode, exécuté immédiatement","Du code machine optimisé","Un fichier .exe"],"a":0,"e":"Ignition produit un bytecode indépendant du processeur. C&#39;est TurboFan qui produit le code machine."},{"n":"introduction-js","q":"<code>setTimeout<\/code>, <code>fetch<\/code> et le DOM sont :","o":["des mots-clés du langage","des Web APIs fournies par le navigateur","des fonctions du moteur V8"],"a":1,"e":"Ce sont des interfaces du runtime (navigateur), écrites en C++, externes au moteur."},{"n":"introduction-js","q":"Que fait le parseur HTML quand il rencontre un <code>&lt;script src&gt;<\/code> sans attribut ?","o":["Il continue et exécute le script à la fin","Il s&#39;arrête, télécharge et exécute le script, puis reprend","Il ignore le script"],"a":1,"e":"C&#39;est le blocage (« pipeline stall ») : écran blanc si le script est lent."},{"n":"introduction-js","q":"Quel attribut garantit que le DOM est complet et que l&#39;ordre des scripts est respecté ?","o":["async","defer","type=&quot;module&quot; n&#39;existe pas"],"a":1,"e":"<code>defer<\/code> télécharge en parallèle et exécute après le parsing, dans l&#39;ordre des balises."},{"n":"introduction-js","q":"Pourquoi bannir le code inline (<code>onclick=&quot;...&quot;<\/code>) ?","o":["Il est plus lent à télécharger","Il mélange HTML et logique, et ouvre la porte aux failles XSS","Il ne fonctionne pas dans Chrome"],"a":1,"e":"Il casse la séparation des préoccupations et il est difficile à maintenir."},{"n":"introduction-js","q":"Dans les DevTools, où regarde-t-on la pile d&#39;appels pendant un point d&#39;arrêt ?","o":["Dans l&#39;onglet Réseau","Dans l&#39;onglet Sources (Call Stack, Scope)","Dans la console uniquement"],"a":1,"e":"L&#39;onglet Sources est le débogueur : points d&#39;arrêt, pas à pas, Call Stack (LIFO) et Scope."}]},{"id":"variables-types","t":"Variables, types et opérateurs","seance":"Séance 2 · Syntaxe et fondamentaux (1/2)","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu as déjà déclaré des variables en C ou en Python. Ici, la nouveauté est qu&#39;il existe <strong>trois<\/strong> mots-clés (<code>var<\/code>, <code>let<\/code>, <code>const<\/code>) qui ne se comportent pas pareil.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>En C, <code>int a = 5; int b = a; b = 7;<\/code> : que vaut <code>a<\/code> à la fin ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>a<\/code> vaut toujours 5. L&#39;affectation <code>b = a<\/code> copie la <strong>valeur<\/strong>. En JavaScript, c&#39;est pareil pour les nombres et les chaînes, mais <strong>pas<\/strong> pour les objets et les tableaux (Idée 3).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Raisonne toujours avec deux questions : <strong>où vit la variable ?<\/strong> (portée) et <strong>peut-elle changer ?<\/strong> (mutabilité). <code>const<\/code> par défaut, <code>let<\/code> si la valeur doit changer, <code>var<\/code> jamais.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Écrire <code>==<\/code> au lieu de <code>===<\/code>. <code>1 == &quot;1&quot;<\/code> vaut <code>true<\/code> car JS convertit en silence. Le prof est clair : <code>===<\/code> toujours.<\/p>\n<\/aside><p>À la fin, tu sais choisir entre <code>let<\/code> et <code>const<\/code>, prévoir ce qu&#39;affiche un code avec hoisting, distinguer primitive et référence, et prévoir une coercition (<code>5 + &quot;5&quot;<\/code>).<\/p>\n<h2>Idée 1 · var, let, const et la portée<\/h2>\n<p>La <strong>portée<\/strong> (scope) dit où une variable est visible. Globale (racine du fichier, visible partout : risque de collisions) ou locale (fonction ou bloc <code>{}<\/code>).<\/p>\n<figure class=\"grille\"><figcaption>Les trois déclarations<\/figcaption><table><tr><th><\/th><th>Portée<\/th><th>Réassignation<\/th><th>Accès avant la déclaration<\/th><\/tr><tr><th>var<\/th><td>fonction (ignore les blocs)<\/td><td>oui<\/td><td>undefined (hoisting)<\/td><\/tr><tr><th>let<\/th><td class=\"h1\">bloc {}<\/td><td class=\"h1\">oui<\/td><td class=\"h1\">ReferenceError (TDZ)<\/td><\/tr><tr><th>const<\/th><td class=\"h1\">bloc {}<\/td><td class=\"h0\">non : TypeError<\/td><td class=\"h1\">ReferenceError (TDZ)<\/td><\/tr><\/table><\/figure><p><code>var<\/code> « fuit » hors d&#39;un <code>for<\/code> ou d&#39;un <code>if<\/code> :<\/p>\n<pre class=\"\"><code>for (var i = 0; i &lt; 3; i++) {}\nconsole.log(&quot;var après la boucle :&quot;, i);\n\nfor (let j = 0; j &lt; 3; j++) {}\nconsole.log(typeof j);<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>var après la boucle : 3\nundefined<\/code><\/pre><p><code>typeof j<\/code> donne <code>&quot;undefined&quot;<\/code> : <code>j<\/code> n&#39;existe pas hors de la boucle.<\/p>\n<h2>Idée 2 · Le hoisting et la zone morte (TDZ)<\/h2>\n<p>Avant d&#39;exécuter, le moteur parcourt le code et enregistre les déclarations. Avec <code>var<\/code>, <strong>la déclaration est hissée, pas la valeur<\/strong>.<\/p>\n<pre class=\"\"><code>function calculerTotal() {\n  console.log(total);\n  var total = 50;\n  console.log(total);\n}\ncalculerTotal();<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>undefined\n50<\/code><\/pre><p>Le moteur l&#39;a lu comme : <code>var total; console.log(total); total = 50; ...<\/code>.<\/p>\n<p>Avec <code>let<\/code> et <code>const<\/code>, la variable est aussi enregistrée, mais placée dans une <strong>Temporal Dead Zone<\/strong> jusqu&#39;à sa ligne : y accéder lève une erreur. C&#39;est le principe <strong>fail-fast<\/strong> : mieux vaut planter tout de suite que continuer avec <code>undefined<\/code>.<\/p>\n<pre class=\"\"><code>try {\n  console.log(prix);\n  let prix = 100;\n} catch (e) {\n  console.log(e.name);\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>ReferenceError<\/code><\/pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p><code>var<\/code> → <code>undefined<\/code> en silence. <code>let<\/code>/<code>const<\/code> → <code>ReferenceError<\/code>. Une <strong>déclaration de fonction<\/strong> (<code>function f() {}<\/code>) est hissée <strong>entièrement<\/strong> : on peut l&#39;appeler avant sa ligne.<\/p>\n<\/aside><h2>Idée 3 · Primitives (valeur) et références<\/h2>\n<svg viewBox=\"0 0 560 200\" style=\"width:100%;max-width:560px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Deux variables obj1 et obj2 dans la pile pointent vers le même objet dans le tas ; deux nombres a et b ont chacun leur copie\">\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\">\n<text x=\"90\" y=\"22\" text-anchor=\"middle\" font-weight=\"700\">Pile (Stack)<\/text>\n<text x=\"420\" y=\"22\" text-anchor=\"middle\" font-weight=\"700\">Tas (Heap)<\/text>\n<rect x=\"20\" y=\"35\" width=\"140\" height=\"30\" rx=\"5\" fill=\"none\" stroke=\"currentColor\"/><text x=\"30\" y=\"55\">a = 5<\/text>\n<rect x=\"20\" y=\"70\" width=\"140\" height=\"30\" rx=\"5\" fill=\"none\" stroke=\"currentColor\"/><text x=\"30\" y=\"90\">b = 5 (copie)<\/text>\n<rect x=\"20\" y=\"120\" width=\"140\" height=\"30\" rx=\"5\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"30\" y=\"140\">obj1 → @A1<\/text>\n<rect x=\"20\" y=\"155\" width=\"140\" height=\"30\" rx=\"5\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"30\" y=\"175\">obj2 → @A1<\/text>\n<rect x=\"330\" y=\"120\" width=\"180\" height=\"65\" rx=\"8\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/><text x=\"345\" y=\"145\">@A1<\/text><text x=\"345\" y=\"168\">{ solde: 5000 }<\/text><\/g>\n<line x1=\"160\" y1=\"135\" x2=\"328\" y2=\"145\" stroke=\"#D9824F\" stroke-width=\"2\"/>\n<line x1=\"160\" y1=\"170\" x2=\"328\" y2=\"160\" stroke=\"#D9824F\" stroke-width=\"2\"/>\n<\/svg><ul>\n<li><strong>Primitives<\/strong> : <code>number<\/code>, <code>bigint<\/code>, <code>string<\/code>, <code>boolean<\/code>, <code>undefined<\/code> (déclarée, sans valeur), <code>null<\/code> (vide <strong>volontaire<\/strong>), <code>symbol<\/code>. Taille fixe, copiées <strong>par valeur<\/strong>.<\/li>\n<li><strong>Références<\/strong> : objets <code>{}<\/code>, tableaux <code>[]<\/code>, fonctions. Stockées dans le tas ; la variable ne garde que <strong>l&#39;adresse<\/strong>.<\/li>\n<\/ul>\n<pre class=\"\"><code>let a = 5;\nlet b = a;\nb = 7;\nconsole.log(a, b);\n\nconst compte1 = { solde: 5000 };\nconst compte2 = compte1;\ncompte2.solde = 0;\nconsole.log(compte1.solde);<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>5 7\n0<\/code><\/pre><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p><code>const compte2 = compte1<\/code> ne copie <strong>pas<\/strong> l&#39;objet (copie superficielle de la référence). Modifier <code>compte2<\/code> modifie <code>compte1<\/code>. Et <code>const<\/code> interdit seulement de <strong>réassigner<\/strong> la variable : <code>compte2.solde = 0<\/code> est permis.<\/p>\n<\/aside><h2>Idée 4 · Coercition et opérateurs<\/h2>\n<p>Le typage est <strong>faible<\/strong> : face à deux types différents, JS convertit au lieu de planter.<\/p>\n<pre class=\"\"><code>console.log(5 + &quot;5&quot;);\nconsole.log(5 - &quot;2&quot;);\nconsole.log(&quot;3&quot; * &quot;4&quot;);\nconsole.log(1 == &quot;1&quot;, 1 === &quot;1&quot;);\nconsole.log(typeof null, typeof undefined, typeof NaN);<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>55\n3\n12\ntrue false\nobject undefined number<\/code><\/pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p><code>+<\/code> avec <strong>au moins une chaîne<\/strong> → concaténation. <code>-<\/code>, <code>*<\/code>, <code>/<\/code> → conversion en nombre. <code>===<\/code> compare <strong>valeur et type<\/strong>, sans conversion.<\/p>\n<\/aside><p>Les quatre familles d&#39;opérateurs : arithmétiques (<code>+ - * / %<\/code>), affectation (<code>= += -=<\/code>), comparaison (<code>== === != !== &gt; &lt;<\/code>), logiques (<code>&amp;&amp; || !<\/code>).<\/p>\n<p>Les logiques sont <strong>court-circuités<\/strong> : dans <code>a &amp;&amp; b<\/code>, si <code>a<\/code> est faux, <code>b<\/code> n&#39;est même pas évalué.<\/p>\n<pre class=\"\"><code>let appels = 0;\nfunction verifier() { appels++; return true; }\nconst r = false &amp;&amp; verifier();\nconsole.log(r, appels);<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>false 0<\/code><\/pre><p>Conventions de nommage vues en cours : <code>camelCase<\/code> (variables, fonctions), <code>PascalCase<\/code> (classes), <code>SNAKE_CASE<\/code> majuscule (constantes, ex. <code>TAUX_TVA<\/code>), <code>kebab-case<\/code> (classes CSS, pas d&#39;identifiant JS car <code>-<\/code> est une soustraction).<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices type TD 1<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>(TD 1, ex. 1.1) Où sont stockées une primitive et une référence ? Que contient la variable dans chaque cas ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Une primitive (String, Number…) est stockée dans la <strong>pile<\/strong> : la variable contient la valeur elle-même, taille fixe, accès rapide. Pour une référence (Object, Array), l&#39;objet est alloué dans le <strong>tas<\/strong> ; la variable, dans la pile, ne contient que son <strong>adresse<\/strong>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>(TD 1, ex. 2 A) <code>const codeSaisi = &quot;404&quot;; if (codeSaisi == 404) {...}<\/code>. Quelle est la faille ? Corrige.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>==<\/code> provoque une conversion implicite (la chaîne devient un nombre) : la condition passe alors que les types diffèrent. Correction : <code>if (codeSaisi === &quot;404&quot;)<\/code>, ou conversion explicite <code>if (Number(codeSaisi) === 404)<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Que vaut <code>&quot;10&quot; - 3 + &quot;1&quot;<\/code> ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>De gauche à droite : d&#39;abord <code>-<\/code>, puis <code>+<\/code>.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 71<\/b><\/p><p><code>&quot;10&quot; - 3<\/code> donne le nombre 7 (le <code>-<\/code> convertit). Puis <code>7 + &quot;1&quot;<\/code> concatène : <code>&quot;71&quot;<\/code>.<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 9 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quelle déclaration a une portée de <strong>fonction<\/strong> et ignore les blocs ?<\/div><button class=\"opt\" data-o=\"0\">var<\/button><button class=\"opt\" data-o=\"1\">let<\/button><button class=\"opt\" data-o=\"2\">const<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Que fait <code>const x = 1; x = 2;<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">x vaut 2<\/button><button class=\"opt\" data-o=\"1\">TypeError : assignation à une constante<\/button><button class=\"opt\" data-o=\"2\">ReferenceError<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\"><code>console.log(n); var n = 3;<\/code> affiche :<\/div><button class=\"opt\" data-o=\"0\">3<\/button><button class=\"opt\" data-o=\"1\">undefined<\/button><button class=\"opt\" data-o=\"2\">ReferenceError<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\"><code>console.log(n); let n = 3;<\/code> donne :<\/div><button class=\"opt\" data-o=\"0\">undefined<\/button><button class=\"opt\" data-o=\"1\">3<\/button><button class=\"opt\" data-o=\"2\">ReferenceError (TDZ)<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Que vaut <code>5 + &quot;5&quot;<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">10<\/button><button class=\"opt\" data-o=\"1\">&quot;55&quot;<\/button><button class=\"opt\" data-o=\"2\">NaN<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Que vaut <code>5 - &quot;2&quot;<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">3<\/button><button class=\"opt\" data-o=\"1\">&quot;52&quot;<\/button><button class=\"opt\" data-o=\"2\">NaN<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\"><code>1 === &quot;1&quot;<\/code> vaut :<\/div><button class=\"opt\" data-o=\"0\">true<\/button><button class=\"opt\" data-o=\"1\">false<\/button><button class=\"opt\" data-o=\"2\">TypeError<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\"><code>const t = [1, 2]; t.push(3);<\/code> est-il valide ?<\/div><button class=\"opt\" data-o=\"0\">Oui : const interdit la réassignation, pas la modification du contenu<\/button><button class=\"opt\" data-o=\"1\">Non : TypeError<\/button><button class=\"opt\" data-o=\"2\">Non : ReferenceError<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\"><code>typeof null<\/code> renvoie :<\/div><button class=\"opt\" data-o=\"0\">&quot;null&quot;<\/button><button class=\"opt\" data-o=\"1\">&quot;object&quot;<\/button><button class=\"opt\" data-o=\"2\">&quot;undefined&quot;<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Dans <code>false &amp;&amp; f()<\/code>, la fonction <code>f<\/code> :<\/div><button class=\"opt\" data-o=\"0\">est appelée une fois<\/button><button class=\"opt\" data-o=\"1\">n&#39;est pas appelée (court-circuit)<\/button><button class=\"opt\" data-o=\"2\">provoque une erreur<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"variables-types","rep":null,"tol":null},{"n":"variables-types","rep":null,"tol":null},{"n":"variables-types","rep":null,"tol":null},{"n":"variables-types","rep":["71"],"tol":null}],"qcm":[{"n":"variables-types","q":"Quelle déclaration a une portée de <strong>fonction<\/strong> et ignore les blocs ?","o":["var","let","const"],"a":0,"e":"<code>var<\/code> ne respecte pas les accolades d&#39;un <code>if<\/code> ou d&#39;un <code>for<\/code> : elle « fuit » dans toute la fonction."},{"n":"variables-types","q":"Que fait <code>const x = 1; x = 2;<\/code> ?","o":["x vaut 2","TypeError : assignation à une constante","ReferenceError"],"a":1,"e":"<code>const<\/code> verrouille l&#39;identifiant : toute réassignation lève une TypeError."},{"n":"variables-types","q":"<code>console.log(n); var n = 3;<\/code> affiche :","o":["3","undefined","ReferenceError"],"a":1,"e":"La déclaration <code>var n<\/code> est hissée, l&#39;affectation reste à sa place."},{"n":"variables-types","q":"<code>console.log(n); let n = 3;<\/code> donne :","o":["undefined","3","ReferenceError (TDZ)"],"a":2,"e":"<code>let<\/code> est dans la zone morte temporelle jusqu&#39;à sa ligne : échec rapide."},{"n":"variables-types","q":"Que vaut <code>5 + &quot;5&quot;<\/code> ?","o":["10","&quot;55&quot;","NaN"],"a":1,"e":"Avec une chaîne, <code>+<\/code> concatène."},{"n":"variables-types","q":"Que vaut <code>5 - &quot;2&quot;<\/code> ?","o":["3","&quot;52&quot;","NaN"],"a":0,"e":"<code>-<\/code> force la conversion en nombre."},{"n":"variables-types","q":"<code>1 === &quot;1&quot;<\/code> vaut :","o":["true","false","TypeError"],"a":1,"e":"Égalité stricte : types différents, donc false."},{"n":"variables-types","q":"<code>const t = [1, 2]; t.push(3);<\/code> est-il valide ?","o":["Oui : const interdit la réassignation, pas la modification du contenu","Non : TypeError","Non : ReferenceError"],"a":0,"e":"La variable pointe toujours vers le même tableau ; seul son contenu change."},{"n":"variables-types","q":"<code>typeof null<\/code> renvoie :","o":["&quot;null&quot;","&quot;object&quot;","&quot;undefined&quot;"],"a":1,"e":"C&#39;est une bizarrerie historique de JavaScript : null est pourtant une primitive."},{"n":"variables-types","q":"Dans <code>false &amp;&amp; f()<\/code>, la fonction <code>f<\/code> :","o":["est appelée une fois","n&#39;est pas appelée (court-circuit)","provoque une erreur"],"a":1,"e":"Le résultat est déjà connu (faux), la suite n&#39;est pas évaluée."}]},{"id":"controle-fonctions","t":"Conditions, boucles et fonctions","seance":"Séance 2 · Syntaxe et fondamentaux (2/2)","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu connais <code>if<\/code>, <code>for<\/code> et <code>while<\/code> en C : la syntaxe est presque la même. Ce chapitre insiste sur ce qui est <strong>propre à JS<\/strong> : valeurs truthy/falsy, <code>for...of<\/code> / <code>for...in<\/code>, arguments manquants.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Combien de fois s&#39;affiche « Connexion... » ? <code>let t = 0; while (t &lt; 3) { console.log(&quot;Connexion...&quot;); t++; }<\/code><\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 3<\/b><\/p><p>3 fois (t vaut 0, 1, 2). Sans <code>t++<\/code>, la boucle serait infinie et figerait le thread principal.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Avant de lire un <code>if<\/code>, demande-toi : <strong>cette valeur est-elle falsy ?<\/strong> La liste des valeurs fausses est courte et fermée. Tout le reste est vrai.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Oublier <code>break<\/code> dans un <code>switch<\/code>. Sans lui, l&#39;exécution « tombe » dans les <code>case<\/code> suivants (fall-through). C&#39;est l&#39;exercice 2 B du TD 1.<\/p>\n<\/aside><p>À la fin, tu sais choisir la bonne boucle, écrire un <code>switch<\/code> correct, et sécuriser une fonction avec des paramètres par défaut.<\/p>\n<h2>Idée 1 · Conditions, truthy/falsy, switch, ternaire<\/h2>\n<p><code>if / else if / else<\/code> : le moteur teste de haut en bas et <strong>sort dès qu&#39;une condition est vraie<\/strong>.<\/p>\n<figure class=\"grille\"><figcaption>Les 6 valeurs falsy (tout le reste est truthy)<\/figcaption><table><tr><th><\/th><th>valeur<\/th><\/tr><tr><th>1<\/th><td class=\"h1\">false<\/td><\/tr><tr><th>2<\/th><td class=\"h1\">0<\/td><\/tr><tr><th>3<\/th><td class=\"h1\">&quot;&quot;<\/td><td>(chaîne<\/td><td>vide)<\/td><\/tr><tr><th>4<\/th><td class=\"h1\">null<\/td><\/tr><tr><th>5<\/th><td class=\"h1\">undefined<\/td><\/tr><tr><th>6<\/th><td class=\"h1\">NaN<\/td><\/tr><\/table><\/figure><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p><code>[]<\/code>, <code>{}<\/code>, <code>&quot;0&quot;<\/code> et <code>&quot;false&quot;<\/code> sont <strong>truthy<\/strong>. Pour tester un tableau vide, écris <code>if (tab.length === 0)<\/code>.<\/p>\n<\/aside><p>Le <code>switch<\/code> compare avec <code>===<\/code> (pas de conversion) :<\/p>\n<pre class=\"\"><code>const niveauAcces = &quot;Moderateur&quot;;\nswitch (niveauAcces) {\n  case &quot;Admin&quot;:\n    console.log(&quot;Accès total&quot;);\n    break;\n  case &quot;Moderateur&quot;:\n    console.log(&quot;Accès édition&quot;);\n    break;\n  case &quot;Invite&quot;:\n    console.log(&quot;Accès lecture seule&quot;);\n    break;\n  default:\n    console.log(&quot;Accès refusé&quot;);\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Accès édition<\/code><\/pre><p>Le <strong>ternaire<\/strong> <code>condition ? siVrai : siFaux<\/code> sert à une affectation simple : <code>const statut = age &gt;= 18 ? &quot;Majeur&quot; : &quot;Mineur&quot;;<\/code>. Ne pas les imbriquer.<\/p>\n<h2>Idée 2 · Les boucles et break / continue<\/h2>\n<figure class=\"grille\"><figcaption>Quelle boucle choisir ?<\/figcaption><table><tr><th><\/th><th>Quand l'utiliser<\/th><th>break / continue ?<\/th><\/tr><tr><th>while<\/th><td>nombre de tours inconnu<\/td><td>oui<\/td><\/tr><tr><th>do...while<\/th><td>au moins un tour garanti (menu)<\/td><td>oui<\/td><\/tr><tr><th>for<\/th><td class=\"h1\">nombre de tours connu<\/td><td class=\"h1\">oui<\/td><\/tr><tr><th>forEach<\/th><td>effet sur chaque élément d'un tableau<\/td><td class=\"h0\">non : impossible de l'arrêter<\/td><\/tr><tr><th>for...of<\/th><td class=\"h1\">valeurs d'un tableau, d'une chaîne<\/td><td class=\"h1\">oui<\/td><\/tr><tr><th>for...in<\/th><td>clés d'un objet<\/td><td>oui (jamais sur un tableau)<\/td><\/tr><\/table><\/figure><p><code>continue<\/code> saute le tour en cours ; <code>break<\/code> arrête toute la boucle.<\/p>\n<pre class=\"\"><code>for (let i = 0; i &lt; 10; i++) {\n  if (i === 3) continue;\n  if (i === 7) break;\n  console.log(&quot;Traitement du lot :&quot;, i);\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Traitement du lot : 0\nTraitement du lot : 1\nTraitement du lot : 2\nTraitement du lot : 4\nTraitement du lot : 5\nTraitement du lot : 6<\/code><\/pre><p><code>for...of<\/code> donne les <strong>valeurs<\/strong>, <code>for...in<\/code> les <strong>clés<\/strong> :<\/p>\n<pre class=\"\"><code>const serveurs = [&quot;Web&quot;, &quot;BDD&quot;];\nfor (const nom of serveurs) console.log(&quot;valeur :&quot;, nom);\n\nconst config = { host: &quot;localhost&quot;, port: 5432 };\nfor (const cle in config) console.log(cle, &quot;=&gt;&quot;, config[cle]);\n\nfor (const i in serveurs) console.log(typeof i);<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>valeur : Web\nvaleur : BDD\nhost =&gt; localhost\nport =&gt; 5432\nstring\nstring<\/code><\/pre><p>La dernière boucle montre pourquoi <code>for...in<\/code> sur un tableau est déconseillé : les indices arrivent sous forme de <strong>chaînes<\/strong> <code>&quot;0&quot;<\/code>, <code>&quot;1&quot;<\/code>.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Sur la diapo, le commentaire dit que <code>const<\/code> convient dans <code>for (const x of ...)<\/code> « car la variable est réaffectée à chaque cycle ». C&#39;est l&#39;inverse : à chaque tour, une <strong>nouvelle<\/strong> variable est créée ; elle n&#39;est jamais réaffectée, c&#39;est pour ça que <code>const<\/code> est permis. Dans un <code>for (let i = 0; ...; i++)<\/code> classique, <code>const<\/code> est interdit car <code>i++<\/code> réaffecte.<\/p>\n<\/aside><h2>Idée 3 · Fonctions : déclaration, appel, arguments<\/h2>\n<figure class=\"flux\"><figcaption>Ce qui se passe à l'appel<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">appel f(…)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">push du contexte dans la Call Stack<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">exécution<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">return : valeur renvoyée<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">pop du contexte<\/div><\/div><\/figure><ul>\n<li><strong>Déclaration<\/strong> : <code>function nom(params) { ... }<\/code> enregistre la fonction ; rien ne s&#39;exécute. Elle est <strong>hissée<\/strong> : on peut l&#39;appeler avant sa ligne.<\/li>\n<li><strong>Appel<\/strong> : <code>nom(args)<\/code>. Sans les parenthèses, <code>nom<\/code> désigne la fonction elle-même, sans l&#39;exécuter.<\/li>\n<li><strong>Paramètres<\/strong> (dans la signature) vs <strong>arguments<\/strong> (valeurs passées à l&#39;appel).<\/li>\n<li>Sans <code>return<\/code>, une fonction renvoie <code>undefined<\/code>. Après <code>return<\/code>, le code est mort.<\/li>\n<\/ul>\n<p>JS <strong>ne vérifie pas<\/strong> le nombre d&#39;arguments : il manque → <code>undefined<\/code> ; il y en a trop → ignorés.<\/p>\n<pre class=\"\"><code>function calculerCout(prix, quantite, fraisPort) {\n  return prix * quantite + fraisPort;\n}\nconsole.log(calculerCout(100, 2, 10));\nconsole.log(calculerCout(100));\nconsole.log(calculerCout(100, 2, 10, &quot;CodePromo&quot;));\n\nfunction calculerCoutSecurise(prix, quantite = 1, fraisPort = 0) {\n  return prix * quantite + fraisPort;\n}\nconsole.log(calculerCoutSecurise(100));<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>210\nNaN\n210\n100<\/code><\/pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p><strong>Paramètres par défaut (ES6)<\/strong> = programmation défensive : <code>function f(a = 0, b = 0)<\/code>. Ils évitent la cascade <code>undefined<\/code> → <code>NaN<\/code>.<\/p>\n<\/aside><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Une diapo qualifie le hoisting de « comportement asynchrone ». Le mot est mal choisi : le hoisting vient de la phase de <strong>création<\/strong> (le moteur lit les déclarations avant d&#39;exécuter). Cela n&#39;a rien à voir avec l&#39;asynchronisme (Event Loop, chapitre 5).<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices type TD 1 et TP 1<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>(TD 1, ex. 1.2) <code>console.log(initialisationApp()); function initialisationApp() { let statut = &quot;Actif&quot;; return statut; } console.log(statut);<\/code> : que se passe-t-il ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Ligne 1 : affiche <code>Actif<\/code>. La déclaration de fonction est hissée entièrement, on peut l&#39;appeler avant. Dernière ligne : <code>ReferenceError: statut is not defined<\/code>. <code>statut<\/code> est locale à la fonction, invisible depuis la portée globale.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>(TD 1, ex. 3) <code>const transactions = [102, 105, &quot;erreur&quot;, 108, 110, 404, 115];<\/code> Avec un <code>for<\/code> classique : ignorer ce qui n&#39;est pas un nombre, s&#39;arrêter à 404, afficher les autres.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>On utilise <code>continue<\/code> pour filtrer et <code>break<\/code> pour couper :\n<code>for (let i = 0; i &lt; transactions.length; i++) { if (typeof transactions[i] !== &quot;number&quot;) continue; if (transactions[i] === 404) break; console.log(transactions[i]); }<\/code>\nAffiche 102, 105, 108, 110. 115 n&#39;est jamais atteint.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>(TD 1, ex. 4) Écris <code>calculerSalaireNet(tauxHoraire, heuresTravaillees, bonus)<\/code>. Par défaut : taux 15, heures 0, bonus 0. Brut = taux × heures. Net = brut − 20 % + bonus. Elle <strong>retourne<\/strong> le net. Que vaut <code>calculerSalaireNet(20, 100)<\/code> ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1600<\/b><\/p><p><code>function calculerSalaireNet(tauxHoraire = 15, heuresTravaillees = 0, bonus = 0) { const brut = tauxHoraire * heuresTravaillees; return brut * 0.8 + bonus; }<\/code>. Brut = 2000, net = 1600 + 0 = 1600. L&#39;appel vide <code>calculerSalaireNet()<\/code> donne 0, pas <code>NaN<\/code>.<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 9 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Laquelle de ces valeurs est <strong>truthy<\/strong> ?<\/div><button class=\"opt\" data-o=\"0\">0<\/button><button class=\"opt\" data-o=\"1\">&quot;&quot;<\/button><button class=\"opt\" data-o=\"2\">&quot;0&quot;<\/button><button class=\"opt\" data-o=\"3\">NaN<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Dans un <code>switch<\/code> sans <code>break<\/code>, que se passe-t-il quand un <code>case<\/code> correspond ?<\/div><button class=\"opt\" data-o=\"0\">Seul ce case s&#39;exécute<\/button><button class=\"opt\" data-o=\"1\">Ce case et tous les suivants s&#39;exécutent<\/button><button class=\"opt\" data-o=\"2\">Erreur de syntaxe<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Quelle boucle exécute son bloc <strong>au moins une fois<\/strong> ?<\/div><button class=\"opt\" data-o=\"0\">while<\/button><button class=\"opt\" data-o=\"1\">do...while<\/button><button class=\"opt\" data-o=\"2\">for<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Peut-on arrêter un <code>forEach<\/code> avec <code>break<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">Oui<\/button><button class=\"opt\" data-o=\"1\">Non, c&#39;est une erreur de syntaxe ou c&#39;est ignoré<\/button><button class=\"opt\" data-o=\"2\">Oui, avec return<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\"><code>for (const i in [&quot;a&quot;, &quot;b&quot;])<\/code> donne <code>i<\/code> de type :<\/div><button class=\"opt\" data-o=\"0\">number<\/button><button class=\"opt\" data-o=\"1\">string<\/button><button class=\"opt\" data-o=\"2\">undefined<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\"><code>function f(a, b) { return a + b; }<\/code> puis <code>f(2)<\/code> renvoie :<\/div><button class=\"opt\" data-o=\"0\">2<\/button><button class=\"opt\" data-o=\"1\">NaN<\/button><button class=\"opt\" data-o=\"2\">TypeError<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Comment rendre <code>b<\/code> optionnel à 0 ?<\/div><button class=\"opt\" data-o=\"0\"><code>function f(a, b = 0)<\/code><\/button><button class=\"opt\" data-o=\"1\"><code>function f(a, b ?= 0)<\/code><\/button><button class=\"opt\" data-o=\"2\"><code>function f(a, optional b)<\/code><\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Une fonction déclarée avec <code>function nom() {}<\/code> peut être appelée :<\/div><button class=\"opt\" data-o=\"0\">avant sa ligne de définition (hoisting)<\/button><button class=\"opt\" data-o=\"1\">seulement après sa définition<\/button><button class=\"opt\" data-o=\"2\">seulement dans un bloc<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\"><code>const r = age &gt;= 18 ? &quot;Majeur&quot; : &quot;Mineur&quot;;<\/code> avec age = 16 donne :<\/div><button class=\"opt\" data-o=\"0\">&quot;Majeur&quot;<\/button><button class=\"opt\" data-o=\"1\">&quot;Mineur&quot;<\/button><button class=\"opt\" data-o=\"2\">undefined<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Que vaut <code>typeof f<\/code> pour une fonction <code>f<\/code>, et que fait <code>f<\/code> sans parenthèses ?<\/div><button class=\"opt\" data-o=\"0\">&quot;function&quot; ; rien n&#39;est exécuté<\/button><button class=\"opt\" data-o=\"1\">&quot;object&quot; ; la fonction s&#39;exécute<\/button><button class=\"opt\" data-o=\"2\">&quot;undefined&quot; ; erreur<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"controle-fonctions","rep":["3"],"tol":null},{"n":"controle-fonctions","rep":null,"tol":null},{"n":"controle-fonctions","rep":null,"tol":null},{"n":"controle-fonctions","rep":["1600"],"tol":null}],"qcm":[{"n":"controle-fonctions","q":"Laquelle de ces valeurs est <strong>truthy<\/strong> ?","o":["0","&quot;&quot;","&quot;0&quot;","NaN"],"a":2,"e":"Une chaîne non vide est vraie, même si elle contient &quot;0&quot;."},{"n":"controle-fonctions","q":"Dans un <code>switch<\/code> sans <code>break<\/code>, que se passe-t-il quand un <code>case<\/code> correspond ?","o":["Seul ce case s&#39;exécute","Ce case et tous les suivants s&#39;exécutent","Erreur de syntaxe"],"a":1,"e":"C&#39;est le fall-through."},{"n":"controle-fonctions","q":"Quelle boucle exécute son bloc <strong>au moins une fois<\/strong> ?","o":["while","do...while","for"],"a":1,"e":"La condition est testée à la fin du tour."},{"n":"controle-fonctions","q":"Peut-on arrêter un <code>forEach<\/code> avec <code>break<\/code> ?","o":["Oui","Non, c&#39;est une erreur de syntaxe ou c&#39;est ignoré","Oui, avec return"],"a":1,"e":"<code>forEach<\/code> parcourt toujours tout. <code>return<\/code> ne fait que passer à l&#39;élément suivant."},{"n":"controle-fonctions","q":"<code>for (const i in [&quot;a&quot;, &quot;b&quot;])<\/code> donne <code>i<\/code> de type :","o":["number","string","undefined"],"a":1,"e":"for...in énumère des clés, toujours sous forme de chaînes."},{"n":"controle-fonctions","q":"<code>function f(a, b) { return a + b; }<\/code> puis <code>f(2)<\/code> renvoie :","o":["2","NaN","TypeError"],"a":1,"e":"b vaut undefined, et 2 + undefined donne NaN."},{"n":"controle-fonctions","q":"Comment rendre <code>b<\/code> optionnel à 0 ?","o":["<code>function f(a, b = 0)<\/code>","<code>function f(a, b ?= 0)<\/code>","<code>function f(a, optional b)<\/code>"],"a":0,"e":"Paramètre par défaut ES6."},{"n":"controle-fonctions","q":"Une fonction déclarée avec <code>function nom() {}<\/code> peut être appelée :","o":["avant sa ligne de définition (hoisting)","seulement après sa définition","seulement dans un bloc"],"a":0,"e":"Les déclarations de fonction sont hissées entièrement."},{"n":"controle-fonctions","q":"<code>const r = age &gt;= 18 ? &quot;Majeur&quot; : &quot;Mineur&quot;;<\/code> avec age = 16 donne :","o":["&quot;Majeur&quot;","&quot;Mineur&quot;","undefined"],"a":1,"e":"La condition est fausse, on prend la troisième partie."},{"n":"controle-fonctions","q":"Que vaut <code>typeof f<\/code> pour une fonction <code>f<\/code>, et que fait <code>f<\/code> sans parenthèses ?","o":["&quot;function&quot; ; rien n&#39;est exécuté","&quot;object&quot; ; la fonction s&#39;exécute","&quot;undefined&quot; ; erreur"],"a":0,"e":"Sans (), on manipule la fonction comme une valeur."}]},{"id":"objets-classes","t":"Objets, classes et objets intégrés","seance":"Séance 3 · Tableaux, objets et fonctions avancées (1/2)","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut avoir compris le chapitre 2 : une variable qui contient un objet ne contient que son <strong>adresse<\/strong>.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p><code>const p = { x: 1 }; const q = p; q.x = 9;<\/code> Que vaut <code>p.x<\/code> ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 9<\/b><\/p><ol start=\"9\">\n<li><code>q<\/code> et <code>p<\/code> pointent vers le même objet dans le tas : c&#39;est l&#39;état partagé.<\/li>\n<\/ol>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Un objet = <strong>état<\/strong> (propriétés) + <strong>comportement<\/strong> (méthodes). Une classe = le <strong>plan de fabrication<\/strong> de ces objets. Pense « moule » et « pièces ».<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Écrire une méthode d&#39;objet avec une <strong>fonction fléchée<\/strong> : <code>this<\/code> ne pointerait plus vers l&#39;objet. Pour les méthodes, utilise la syntaxe courte <code>nom() { ... }<\/code>.<\/p>\n<\/aside><p>À la fin, tu sais écrire un objet littéral avec getter/setter, une classe avec <code>constructor<\/code>, <code>extends<\/code>, <code>super<\/code> et <code>#prive<\/code>, faire une copie profonde, et utiliser <code>String<\/code>, <code>Math<\/code>, <code>Date<\/code>.<\/p>\n<h2>Idée 1 · Mode strict et TypeScript<\/h2>\n<p>JS est historiquement permissif (il se tait face aux erreurs). Deux garde-fous :<\/p>\n<ul>\n<li><strong><code>&quot;use strict&quot;;<\/code><\/strong> en tête de fichier ou de fonction : interdit les variables non déclarées, interdit <code>delete<\/code> sur une variable, et <code>this<\/code> ne vaut plus l&#39;objet global par défaut. Principe <strong>fail-fast<\/strong>.<\/li>\n<li><strong>TypeScript<\/strong> (Microsoft) : sur-ensemble de JS avec <strong>typage statique<\/strong> (<code>let montant: number = 50;<\/code>). Le compilateur <code>tsc<\/code> le transpile en <code>.js<\/code>, car les navigateurs ne lisent pas le TS.<\/li>\n<\/ul>\n<pre class=\"\"><code>&quot;use strict&quot;;\ntry {\n  compteur = 1;\n} catch (e) {\n  console.log(e.name + &quot; : &quot; + e.message);\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>ReferenceError : compteur is not defined<\/code><\/pre><p>Sans <code>&quot;use strict&quot;<\/code>, cette ligne aurait créé en silence une variable globale.<\/p>\n<h2>Idée 2 · Objets littéraux, this, getters et setters<\/h2>\n<p>Un objet regroupe des paires <strong>clé/valeur<\/strong>. Accès par <strong>point<\/strong> (<code>obj.port<\/code>, nom connu) ou par <strong>crochets<\/strong> (<code>obj[cle]<\/code>, nom dans une variable).<\/p>\n<p>Dans une méthode classique, <strong><code>this<\/code> désigne l&#39;objet qui appelle la méthode<\/strong>.<\/p>\n<pre class=\"\"><code>const compteBancaire = {\n  titulaire: &quot;Mouad&quot;,\n  solde: 5000,\n  afficherSolde() {\n    console.log(`Titulaire: ${this.titulaire} | Solde: ${this.solde} DH`);\n  },\n  deposer(montant) {\n    this.solde += montant;\n  }\n};\ncompteBancaire.deposer(1500);\ncompteBancaire.afficherSolde();\nconst champ = &quot;solde&quot;;\nconsole.log(compteBancaire[champ]);<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Titulaire: Mouad | Solde: 6500 DH\n6500<\/code><\/pre><p>Un <strong>getter<\/strong> se lit comme une propriété mais exécute une fonction ; un <strong>setter<\/strong> filtre l&#39;affectation. Le préfixe <code>_<\/code> signale par convention une propriété interne.<\/p>\n<pre class=\"\"><code>const utilisateur = {\n  _age: 25,\n  get age() { return `${this._age} ans`; },\n  set age(v) {\n    if (v &gt; 0 &amp;&amp; v &lt; 120) this._age = v;\n    else console.log(&quot;Valeur d'âge non conforme.&quot;);\n  }\n};\nconsole.log(utilisateur.age);\nutilisateur.age = -5;\nconsole.log(utilisateur.age);<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>25 ans\nValeur d'âge non conforme.\n25 ans<\/code><\/pre><h2>Idée 3 · Classes, héritage et membres privés<\/h2>\n<figure class=\"flux\"><figcaption>De la classe aux instances<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">class Serveur (plan)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">new Serveur(&quot;192.168.1.1&quot;, 80)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">constructor() initialise this<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">instance propre dans le tas<\/div><\/div><\/figure><pre class=\"\"><code>class Vehicule {\n  #prix;\n  constructor(marque, prix) {\n    this.marque = marque;\n    this.prix = prix;\n  }\n  get prix() { return this.#prix; }\n  set prix(v) {\n    if (v &lt;= 0) throw new Error(&quot;prix invalide&quot;);\n    this.#prix = v;\n  }\n  afficherFiche() { return `${this.marque} - ${this.prix} DH`; }\n}\n\nclass Voiture extends Vehicule {\n  constructor(marque, prix, nombreDePortes) {\n    super(marque, prix);\n    this.nombreDePortes = nombreDePortes;\n  }\n  afficherFiche() { return super.afficherFiche() + ` - ${this.nombreDePortes} portes`; }\n}\n\nconst v = new Voiture(&quot;Dacia&quot;, 150000, 5);\nconsole.log(v.afficherFiche());\nconsole.log(v instanceof Vehicule);\ntry { v.prix = -1; } catch (e) { console.log(e.message); }<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Dacia - 150000 DH - 5 portes\ntrue\nprix invalide<\/code><\/pre><ul>\n<li><code>#prix<\/code> est <strong>privé<\/strong> (ES2022) : <code>v.#prix<\/code> hors de la classe est une erreur de syntaxe.<\/li>\n<li><code>_nom<\/code> : convention « protected », rien n&#39;est bloqué.<\/li>\n<li><code>super(...)<\/code> appelle le constructeur parent ; il doit venir <strong>avant<\/strong> tout <code>this<\/code> dans le constructeur de la classe fille.<\/li>\n<li>Une propriété <strong>statique<\/strong> (<code>static nom = &quot;Garage&quot;<\/code>) appartient à la classe, pas aux instances.<\/li>\n<\/ul>\n<aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>C&#39;est exactement le TP 2 (garage : <code>Moteur<\/code>, <code>Vehicule<\/code>, <code>Voiture extends Vehicule<\/code>, <code>Garage<\/code>). Le corrigé complet est au chapitre 10.<\/p>\n<\/aside><h2>Idée 4 · Copie superficielle et copie profonde<\/h2>\n<p>Copier une référence (<code>const b = a<\/code>) partage l&#39;objet. Le prof montre un <strong>constructeur de copie<\/strong> qui recrée l&#39;objet imbriqué à une nouvelle adresse :<\/p>\n<pre class=\"\"><code>class ConfigurationServeur {\n  constructor(nom, specsReseau) {\n    if (nom instanceof ConfigurationServeur) {\n      const source = nom;\n      this.nom = source.nom + &quot; (Clone)&quot;;\n      this.specsReseau = { port: source.specsReseau.port, protocole: source.specsReseau.protocole };\n    } else {\n      this.nom = nom;\n      this.specsReseau = specsReseau;\n    }\n  }\n}\nconst configProd = new ConfigurationServeur(&quot;Prod&quot;, { port: 443, protocole: &quot;HTTPS&quot; });\nconst configTest = new ConfigurationServeur(configProd);\nconfigTest.specsReseau.port = 8080;\nconsole.log(configProd.specsReseau.port, configTest.specsReseau.port);<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>443 8080<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Hors supports : la fonction native <code>structuredClone(obj)<\/code> (navigateurs récents, Node 17+) fait une copie profonde en une ligne.<\/p>\n<\/aside><h2>Idée 5 · Objets intégrés : String, Math, Date<\/h2>\n<p><strong>Autoboxing<\/strong> : <code>&quot;Sofia&quot;.length<\/code> marche car le moteur enveloppe un instant la primitive dans un objet <code>String<\/code>.<\/p>\n<pre class=\"\"><code>const nom = &quot;Sofia&quot;;\nconsole.log(nom.length, nom.toUpperCase(), nom);\nconsole.log(nom.includes(&quot;fi&quot;), nom.slice(0, 2));\nconsole.log(&quot;  aLi &quot;.trim().toUpperCase());\nconsole.log(&quot;a,b,c&quot;.split(&quot;,&quot;));\nconsole.log(Array.from(&quot;CODE&quot;));\n\nconsole.log(Math.round(Math.PI * Math.pow(5.5, 2)));\n\nconst d = new Date(2026, 3, 1);\nconsole.log(d.getFullYear(), d.getMonth() + 1, d.getDate());<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>5 SOFIA Sofia\ntrue So\nALI\n[ 'a', 'b', 'c' ]\n[ 'C', 'O', 'D', 'E' ]\n95\n2026 4 1<\/code><\/pre><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Dans <code>new Date(2026, 3, 1)<\/code>, <strong>les mois commencent à 0<\/strong> : 3 = avril. D&#39;où le <code>+ 1<\/code> à la lecture. Les jours, eux, commencent à 1.<\/p>\n<\/aside><ul>\n<li>Les méthodes de <code>String<\/code> ne modifient <strong>jamais<\/strong> la chaîne : elles en créent une nouvelle (immutabilité).<\/li>\n<li><code>Math<\/code> est <strong>statique<\/strong> : <code>new Math()<\/code> lève une TypeError. <code>Date<\/code> s&#39;instancie avec <code>new<\/code>.<\/li>\n<li><code>Date<\/code> stocke un <strong>timestamp<\/strong> : millisecondes depuis le 1er janvier 1970 UTC (<code>getTime()<\/code>). Pour une API, envoie <code>toISOString()<\/code> (format ISO 8601, en UTC).<\/li>\n<\/ul>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices type TD 2 et examen<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>(TD 2, ex. 2) <code>const prenomBrut = &quot;  aLi &quot;;<\/code> Nettoie les espaces, mets en majuscules sans modifier la variable d&#39;origine. Puis génère un entier entre 1 et 1000, et la date du jour au format ISO.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>const prenomPropre = prenomBrut.trim().toUpperCase();<\/code> → <code>&quot;ALI&quot;<\/code> ; <code>prenomBrut<\/code> reste intact (chaînes immuables). <code>const id = Math.floor(Math.random() * 1000) + 1;<\/code> (random donne [0, 1[, donc ×1000 → [0, 1000[, floor → 0..999, +1 → 1..1000). <code>const iso = new Date().toISOString();<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>(Examen 2025, Q7) Quelle est la syntaxe d&#39;un membre privé de classe ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Le préfixe <code>#<\/code> : <code>class Compte { #solde = 0; getSolde() { return this.#solde; } }<\/code>. Il est inaccessible hors de la classe.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Pourquoi <code>const objet = { nom: &quot;A&quot;, saluer: () =&gt; this.nom }<\/code> ne marche-t-il pas ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Une fléchée n&#39;a pas son propre <code>this<\/code> : elle prend celui du contexte où l&#39;objet est écrit (global), pas l&#39;objet. Il faut <code>saluer() { return this.nom; }<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 10 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Que fait <code>&quot;use strict&quot;<\/code> face à <code>x = 5<\/code> (x non déclaré) ?<\/div><button class=\"opt\" data-o=\"0\">Crée une variable globale x<\/button><button class=\"opt\" data-o=\"1\">Lève une ReferenceError<\/button><button class=\"opt\" data-o=\"2\">Ignore la ligne<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Dans <code>compte.deposer(100)<\/code>, <code>this<\/code> à l&#39;intérieur de <code>deposer<\/code> désigne :<\/div><button class=\"opt\" data-o=\"0\">compte<\/button><button class=\"opt\" data-o=\"1\">window<\/button><button class=\"opt\" data-o=\"2\">la fonction deposer<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Comment lire la propriété dont le nom est dans la variable <code>champ<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">obj.champ<\/button><button class=\"opt\" data-o=\"1\">obj[champ]<\/button><button class=\"opt\" data-o=\"2\">obj-&gt;champ<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Quel mot-clé appelle le constructeur de la classe parente ?<\/div><button class=\"opt\" data-o=\"0\">parent()<\/button><button class=\"opt\" data-o=\"1\">super()<\/button><button class=\"opt\" data-o=\"2\">this.parent()<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Quelle syntaxe déclare un champ <strong>privé<\/strong> ?<\/div><button class=\"opt\" data-o=\"0\">private solde<\/button><button class=\"opt\" data-o=\"1\">_solde<\/button><button class=\"opt\" data-o=\"2\">#solde<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\"><code>new Date(2026, 0, 15)<\/code> correspond au :<\/div><button class=\"opt\" data-o=\"0\">15 janvier 2026<\/button><button class=\"opt\" data-o=\"1\">15 février 2026<\/button><button class=\"opt\" data-o=\"2\">0 janvier 2026<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\"><code>new Math()<\/code> :<\/div><button class=\"opt\" data-o=\"0\">crée un objet Math<\/button><button class=\"opt\" data-o=\"1\">lève une TypeError : Math n&#39;est pas un constructeur<\/button><button class=\"opt\" data-o=\"2\">renvoie undefined<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Après <code>const s = &quot;abc&quot;; s.toUpperCase();<\/code>, <code>s<\/code> vaut :<\/div><button class=\"opt\" data-o=\"0\">&quot;abc&quot;<\/button><button class=\"opt\" data-o=\"1\">&quot;ABC&quot;<\/button><button class=\"opt\" data-o=\"2\">undefined<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\"><code>structuredClone<\/code> / constructeur de copie servent à :<\/div><button class=\"opt\" data-o=\"0\">copier la référence<\/button><button class=\"opt\" data-o=\"1\">faire une copie profonde, indépendante de l&#39;original<\/button><button class=\"opt\" data-o=\"2\">supprimer un objet<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Pour une méthode d&#39;objet littéral, il faut éviter :<\/div><button class=\"opt\" data-o=\"0\">la syntaxe courte nom() {}<\/button><button class=\"opt\" data-o=\"1\">function()<\/button><button class=\"opt\" data-o=\"2\">la fonction fléchée, qui n&#39;a pas son propre this<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"objets-classes","rep":["9"],"tol":null},{"n":"objets-classes","rep":null,"tol":null},{"n":"objets-classes","rep":null,"tol":null},{"n":"objets-classes","rep":null,"tol":null}],"qcm":[{"n":"objets-classes","q":"Que fait <code>&quot;use strict&quot;<\/code> face à <code>x = 5<\/code> (x non déclaré) ?","o":["Crée une variable globale x","Lève une ReferenceError","Ignore la ligne"],"a":1,"e":"Le mode strict transforme les erreurs silencieuses en exceptions."},{"n":"objets-classes","q":"Dans <code>compte.deposer(100)<\/code>, <code>this<\/code> à l&#39;intérieur de <code>deposer<\/code> désigne :","o":["compte","window","la fonction deposer"],"a":0,"e":"Dans une méthode classique, this = l&#39;objet avant le point."},{"n":"objets-classes","q":"Comment lire la propriété dont le nom est dans la variable <code>champ<\/code> ?","o":["obj.champ","obj[champ]","obj-&gt;champ"],"a":1,"e":"obj.champ chercherait une propriété nommée littéralement &quot;champ&quot;."},{"n":"objets-classes","q":"Quel mot-clé appelle le constructeur de la classe parente ?","o":["parent()","super()","this.parent()"],"a":1,"e":"super(...) dans le constructeur de la classe fille."},{"n":"objets-classes","q":"Quelle syntaxe déclare un champ <strong>privé<\/strong> ?","o":["private solde","_solde","#solde"],"a":2,"e":"<code>#<\/code> est la syntaxe officielle (ES2022). <code>_<\/code> n&#39;est qu&#39;une convention."},{"n":"objets-classes","q":"<code>new Date(2026, 0, 15)<\/code> correspond au :","o":["15 janvier 2026","15 février 2026","0 janvier 2026"],"a":0,"e":"Les mois commencent à 0."},{"n":"objets-classes","q":"<code>new Math()<\/code> :","o":["crée un objet Math","lève une TypeError : Math n&#39;est pas un constructeur","renvoie undefined"],"a":1,"e":"Math est une boîte à outils statique."},{"n":"objets-classes","q":"Après <code>const s = &quot;abc&quot;; s.toUpperCase();<\/code>, <code>s<\/code> vaut :","o":["&quot;abc&quot;","&quot;ABC&quot;","undefined"],"a":0,"e":"Les chaînes sont immuables : la méthode renvoie une nouvelle chaîne."},{"n":"objets-classes","q":"<code>structuredClone<\/code> / constructeur de copie servent à :","o":["copier la référence","faire une copie profonde, indépendante de l&#39;original","supprimer un objet"],"a":1,"e":"Modifier la copie ne touche plus l&#39;original."},{"n":"objets-classes","q":"Pour une méthode d&#39;objet littéral, il faut éviter :","o":["la syntaxe courte nom() {}","function()","la fonction fléchée, qui n&#39;a pas son propre this"],"a":2,"e":"Le prof l&#39;appelle un anti-pattern."}]},{"id":"tableaux-callbacks","t":"Tableaux (map, filter, reduce), callbacks et Event Loop","seance":"Séance 3 · Tableaux, objets et fonctions avancées (2/2)","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir écrire une fonction qui reçoit un paramètre et renvoie une valeur (chapitre 3).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Que renvoie <code>function double(x) { return x * 2; }<\/code> pour <code>double(21)<\/code> ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 42<\/b><\/p><ol start=\"42\">\n<li>Dans ce chapitre, on va <strong>passer<\/strong> <code>double<\/code> à une autre fonction au lieu de l&#39;appeler nous-mêmes.<\/li>\n<\/ol>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Avant <code>map<\/code>, <code>filter<\/code>, <code>find<\/code>, <code>reduce<\/code>, pose-toi une question : <strong>qu&#39;est-ce que je veux à la fin ?<\/strong> Un tableau de même taille → <code>map<\/code>. Un sous-tableau → <code>filter<\/code>. Un seul élément → <code>find<\/code>. Une seule valeur (somme, total) → <code>reduce<\/code>.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Oublier <code>return<\/code> dans un callback entre accolades : <code>t.map(x =&gt; { x * 2 })<\/code> donne <code>[undefined, undefined, ...]<\/code>. Sans accolades, le retour est implicite.<\/p>\n<\/aside><p>À la fin, tu sais transformer un tableau sans boucle, écrire des callbacks et des fléchées, et prévoir l&#39;ordre d&#39;affichage d&#39;un code avec <code>setTimeout(..., 0)<\/code>.<\/p>\n<h2>Idée 1 · Créer un tableau<\/h2>\n<ul>\n<li>Littéral (standard) : <code>const ports = [80, 443, 8080];<\/code><\/li>\n<li><code>new Array(100)<\/code> : 100 cases vides (rare).<\/li>\n<li><code>Array.from(&quot;CODE&quot;)<\/code> : tableau à partir d&#39;un itérable → <code>[&quot;C&quot;, &quot;O&quot;, &quot;D&quot;, &quot;E&quot;]<\/code>.<\/li>\n<\/ul>\n<p>Méthodes de base utiles en TD et examen : <code>push<\/code> (ajoute à la fin), <code>pop<\/code>, <code>length<\/code>, <code>includes<\/code>, <code>indexOf<\/code>, <code>sort<\/code>.<\/p>\n<pre class=\"\"><code>const t = [12, 3, 90, 7, 99];\nconsole.log([...t].sort());\nconsole.log([...t].sort((a, b) =&gt; a - b));\nconsole.log([...t].sort((a, b) =&gt; b - a));<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>[ 12, 3, 7, 90, 99 ]\n[ 3, 7, 12, 90, 99 ]\n[ 99, 90, 12, 7, 3 ]<\/code><\/pre><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p><code>sort()<\/code> sans argument trie <strong>comme du texte<\/strong> (&quot;12&quot; avant &quot;3&quot;). Pour des nombres : <code>(a, b) =&gt; a - b<\/code> (croissant) ou <code>(a, b) =&gt; b - a<\/code> (décroissant). C&#39;est la question 5 de l&#39;examen 2025. Attention aussi : <code>sort<\/code> <strong>modifie<\/strong> le tableau (d&#39;où la copie <code>[...t]<\/code>).<\/p>\n<\/aside><h2>Idée 2 · map, filter, find, reduce<\/h2>\n<figure class=\"grille\"><figcaption>Ce que renvoie chaque méthode sur [100, 250, 400]<\/figcaption><table><tr><th><\/th><th>appel<\/th><th>résultat<\/th><th>taille<\/th><\/tr><tr><th>map<\/th><td>p =&gt; p * 1.2<\/td><td class=\"h1\">[120, 300, 480]<\/td><td>3<\/td><\/tr><tr><th>filter<\/th><td>p =&gt; p &gt; 200<\/td><td class=\"h1\">[250, 400]<\/td><td>2 (ou [])<\/td><\/tr><tr><th>fin
