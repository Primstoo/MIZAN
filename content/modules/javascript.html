<code>Connexion réussie !\nÉchec : Connexion perdue.<\/code><\/pre><p>« Promisifier » un minuteur :<\/p>\n<pre class=\"\"><code>const wait = (ms) =&gt; new Promise(resolve =&gt; setTimeout(resolve, ms));\nconsole.log(&quot;avant&quot;);\nwait(100).then(() =&gt; console.log(&quot;100 ms écoulées&quot;));\nconsole.log(&quot;après&quot;);<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>avant\naprès\n100 ms écoulées<\/code><\/pre><h2>Idée 3 · async / await<\/h2>\n<p><code>async<\/code> déclare une fonction qui renvoie toujours une promesse. <strong><code>await<\/code><\/strong> suspend <strong>cette fonction<\/strong> (pas toute la page) jusqu&#39;à ce que la promesse soit résolue, et en extrait la valeur. Les erreurs se gèrent avec <code>try / catch<\/code>.<\/p>\n<pre class=\"\"><code>const simulerCreationCompte = (nom, mdp) =&gt; new Promise((resolve, reject) =&gt; {\n  if (mdp.length &lt; 8) return reject(new Error(&quot;Mot de passe trop court&quot;));\n  setTimeout(() =&gt; resolve(`Compte ${nom} créé`), 100);\n});\n\nconst inscrire = async (nom, mdp) =&gt; {\n  console.log(&quot;Création en cours...&quot;);\n  try {\n    const message = await simulerCreationCompte(nom, mdp);\n    console.log(&quot;Succès :&quot;, message);\n  } catch (err) {\n    console.log(&quot;Erreur :&quot;, err.message);\n  } finally {\n    console.log(&quot;Bouton réactivé&quot;);\n  }\n};\n\n(async () =&gt; {\n  await inscrire(&quot;admin&quot;, &quot;123&quot;);\n  await inscrire(&quot;zouina&quot;, &quot;motdepasse&quot;);\n})();<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Création en cours...\nErreur : Mot de passe trop court\nBouton réactivé\nCréation en cours...\nSuccès : Compte zouina créé\nBouton réactivé<\/code><\/pre><p>C&#39;est le squelette de l&#39;exercice 3 du TD 4 (sans le DOM).<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Une diapo affirme qu&#39;avec async/await « nous ne pouvons plus utiliser <code>.catch()<\/code> ». C&#39;est trop fort : une fonction <code>async<\/code> renvoie une promesse, donc <code>maFonction().catch(...)<\/code> reste valable. Le <code>try / catch<\/code> est simplement l&#39;écriture <strong>recommandée<\/strong> à l&#39;intérieur de la fonction.<\/p>\n<\/aside><h2>Idée 4 · fetch : GET, vérification, POST<\/h2>\n<p><code>fetch(url)<\/code> renvoie une promesse. Il faut <strong>deux<\/strong> étapes : la réponse (headers), puis le corps (<code>response.json()<\/code>, qui renvoie lui aussi une promesse).<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Le modèle complet d'un appel fetch<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/6 · Lancer la requête<\/div><p>const res = await fetch(url); — rejette seulement si le réseau échoue.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/6 · Vérifier le statut<\/div><p>if (!res.ok) throw new Error(&quot;Erreur HTTP: &quot; + res.status); — 404 et 500 ne rejettent pas.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/6 · Lire le corps<\/div><p>const data = await res.json(); — deuxième attente : téléchargement + parsing.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/6 · Afficher<\/div><p>on met à jour le DOM avec data (textContent ou createElement).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/6 · Gérer l&#39;échec<\/div><p>catch (err) affiche un message clair à l&#39;utilisateur.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">6/6 · Nettoyer<\/div><p>finally réactive le bouton, cache « Chargement... ».<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><pre class=\"\"><code>const $btn = document.querySelector(&quot;#charger&quot;);\nconst $p = document.querySelector(&quot;#resultat&quot;);\n\n$btn.addEventListener(&quot;click&quot;, async () =&gt; {\n  $btn.disabled = true;\n  $p.textContent = &quot;Chargement...&quot;;                       // 1. loading\n  try {\n    const res = await fetch(&quot;https://jsonplaceholder.typicode.com/users&quot;);\n    if (!res.ok) throw new Error(&quot;Erreur HTTP: &quot; + res.status);\n    const users = await res.json();\n    $p.textContent = users.map(u =&gt; u.name).join(&quot;, &quot;); // 2. succès\n  } catch (err) {\n    $p.textContent = &quot;Erreur : &quot; + err.message;          // 3. erreur\n  } finally {\n    $btn.disabled = false;\n  }\n});<\/code><\/pre><p>C&#39;est le TP 4 (« Charger les utilisateurs »).<\/p>\n<p>Envoyer des données (POST) : on configure les options.<\/p>\n<pre class=\"\"><code>fetch(&quot;https://api.exemple.com/posts&quot;, {\n  method: &quot;POST&quot;,\n  headers: { &quot;Content-Type&quot;: &quot;application/json&quot; },\n  body: JSON.stringify({ title: &quot;Architecture&quot;, author: &quot;M. Zouina&quot; })\n});<\/code><\/pre><h2>Idée 5 · Plusieurs promesses à la fois<\/h2>\n<p><code>await<\/code> en série additionne les durées. Si les requêtes sont indépendantes, on les lance <strong>en parallèle<\/strong>.<\/p>\n<table>\n<thead>\n<tr>\n<th>Méthode<\/th>\n<th>Réussit quand<\/th>\n<th>Échoue quand<\/th>\n<th>Usage<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>Promise.all<\/code><\/td>\n<td><strong>toutes<\/strong> réussissent<\/td>\n<td><strong>dès la première<\/strong> qui échoue<\/td>\n<td>tableau de bord complet<\/td>\n<\/tr>\n<tr>\n<td><code>Promise.allSettled<\/code><\/td>\n<td>toujours (rapport de chaque résultat)<\/td>\n<td>jamais<\/td>\n<td>envoi de 5 fichiers<\/td>\n<\/tr>\n<tr>\n<td><code>Promise.race<\/code><\/td>\n<td>la première <strong>terminée<\/strong> réussit<\/td>\n<td>la première terminée échoue<\/td>\n<td>délai maximum (timeout)<\/td>\n<\/tr>\n<tr>\n<td><code>Promise.any<\/code><\/td>\n<td>la première <strong>réussite<\/strong><\/td>\n<td>toutes échouent (<code>AggregateError<\/code>)<\/td>\n<td>serveurs miroirs<\/td>\n<\/tr>\n<\/tbody><\/table>\n<pre class=\"\"><code>const req = (nom, ms, ok = true) =&gt; new Promise((res, rej) =&gt;\n  setTimeout(() =&gt; ok ? res(nom) : rej(new Error(nom + &quot; en panne&quot;)), ms));\n\n(async () =&gt; {\n  console.log(await Promise.all([req(&quot;api1&quot;, 30), req(&quot;api2&quot;, 10)]));\n  console.log(await Promise.race([req(&quot;api1&quot;, 30), req(&quot;api2&quot;, 10)]));\n  console.log(await Promise.any([req(&quot;api1&quot;, 5, false), req(&quot;api2&quot;, 20), req(&quot;api3&quot;, 40)]));\n  const r = await Promise.allSettled([req(&quot;a&quot;, 5), req(&quot;b&quot;, 5, false)]);\n  console.log(r.map(x =&gt; x.status));\n  try { await Promise.all([req(&quot;a&quot;, 5), req(&quot;b&quot;, 5, false)]); }\n  catch (e) { console.log(&quot;all a échoué :&quot;, e.message); }\n})();<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>[ 'api1', 'api2' ]\napi2\napi2\n[ 'fulfilled', 'rejected' ]\nall a échoué : b en panne<\/code><\/pre><p><code>Promise.all<\/code> garde l&#39;<strong>ordre du tableau<\/strong>, pas l&#39;ordre d&#39;arrivée. <code>Promise.any<\/code> ignore api1 (en panne) et prend la première réussite.<\/p>\n<aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>Examen 2025, ex. 4 : trois serveurs identiques, prendre <strong>le plus rapide qui répond<\/strong>, même si certains sont en panne. C&#39;est <code>Promise.any<\/code> (corrigé complet au chapitre 11).<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices type examen et TD 4<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>(Examen 2025, Q8) Différence entre la gestion des erreurs avec les promesses et avec async/await ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Avec les promesses chaînées, on attache <code>.catch(err =&gt; ...)<\/code> à la fin de la chaîne <code>.then(...)<\/code>. Avec async/await, on écrit du code d&#39;allure synchrone et on entoure les <code>await<\/code> d&#39;un <code>try { } catch (err) { }<\/code> (plus <code>finally<\/code>). Les deux attrapent les rejets ; <code>try/catch<\/code> attrape en plus les erreurs ordinaires du même bloc.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Un serveur répond 404. <code>fetch(url).then(r =&gt; r.json()).catch(...)<\/code> : le <code>catch<\/code> est-il déclenché par le 404 ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Non. Pour fetch, une réponse 404 est une communication réussie : la promesse est tenue. Il faut tester <code>if (!r.ok) throw new Error(...)<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Deux requêtes indépendantes de 2 s et 3 s. Durée totale avec deux <code>await<\/code> successifs, puis avec <code>Promise.all<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>En série : 2 + 3 = 5 s. Avec <code>Promise.all<\/code> : 3 s (la plus longue).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 11 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quelle méthode HTTP sert à <strong>créer<\/strong> une ressource ?<\/div><button class=\"opt\" data-o=\"0\">GET<\/button><button class=\"opt\" data-o=\"1\">POST<\/button><button class=\"opt\" data-o=\"2\">DELETE<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Un code 404 signifie :<\/div><button class=\"opt\" data-o=\"0\">erreur du serveur<\/button><button class=\"opt\" data-o=\"1\">ressource introuvable (erreur du client)<\/button><button class=\"opt\" data-o=\"2\">succès<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Combien de fois une promesse peut-elle changer d&#39;état final ?<\/div><button class=\"opt\" data-o=\"0\">Une seule<\/button><button class=\"opt\" data-o=\"1\">Autant qu&#39;on appelle resolve<\/button><button class=\"opt\" data-o=\"2\">Deux (resolve puis reject)<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\"><code>fetch<\/code> reçoit une réponse 500. La promesse est :<\/div><button class=\"opt\" data-o=\"0\">tenue (fulfilled), avec res.ok === false<\/button><button class=\"opt\" data-o=\"1\">rejetée<\/button><button class=\"opt\" data-o=\"2\">en attente pour toujours<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\"><code>res.json()<\/code> renvoie :<\/div><button class=\"opt\" data-o=\"0\">directement un objet<\/button><button class=\"opt\" data-o=\"1\">une promesse de l&#39;objet<\/button><button class=\"opt\" data-o=\"2\">une chaîne<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\"><code>await<\/code> peut s&#39;utiliser :<\/div><button class=\"opt\" data-o=\"0\">n&#39;importe où<\/button><button class=\"opt\" data-o=\"1\">dans une fonction async (ou au niveau supérieur d&#39;un module)<\/button><button class=\"opt\" data-o=\"2\">seulement dans un then<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Pour envoyer un objet en JSON avec fetch, le body doit être :<\/div><button class=\"opt\" data-o=\"0\">l&#39;objet lui-même<\/button><button class=\"opt\" data-o=\"1\">JSON.stringify(objet)<\/button><button class=\"opt\" data-o=\"2\">JSON.parse(objet)<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Interroger 3 serveurs miroirs et garder la première <strong>réussite<\/strong> :<\/div><button class=\"opt\" data-o=\"0\">Promise.all<\/button><button class=\"opt\" data-o=\"1\">Promise.race<\/button><button class=\"opt\" data-o=\"2\">Promise.any<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\"><code>Promise.all([p1, p2])<\/code> si p2 est rejetée :<\/div><button class=\"opt\" data-o=\"0\">rejette avec l&#39;erreur de p2<\/button><button class=\"opt\" data-o=\"1\">renvoie [p1, undefined]<\/button><button class=\"opt\" data-o=\"2\">attend p1 puis réussit<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Quel bloc permet de réactiver le bouton après un fetch, réussi ou non ?<\/div><button class=\"opt\" data-o=\"0\">catch<\/button><button class=\"opt\" data-o=\"1\">then<\/button><button class=\"opt\" data-o=\"2\">finally<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"promesses-fetch","rep":null,"tol":null},{"n":"promesses-fetch","rep":null,"tol":null},{"n":"promesses-fetch","rep":null,"tol":null},{"n":"promesses-fetch","rep":null,"tol":null}],"qcm":[{"n":"promesses-fetch","q":"Quelle méthode HTTP sert à <strong>créer<\/strong> une ressource ?","o":["GET","POST","DELETE"],"a":1,"e":"GET lit, POST crée, PUT/PATCH modifie, DELETE supprime."},{"n":"promesses-fetch","q":"Un code 404 signifie :","o":["erreur du serveur","ressource introuvable (erreur du client)","succès"],"a":1,"e":"Les 4xx sont des erreurs côté client."},{"n":"promesses-fetch","q":"Combien de fois une promesse peut-elle changer d&#39;état final ?","o":["Une seule","Autant qu&#39;on appelle resolve","Deux (resolve puis reject)"],"a":0,"e":"Le premier appel verrouille l&#39;état."},{"n":"promesses-fetch","q":"<code>fetch<\/code> reçoit une réponse 500. La promesse est :","o":["tenue (fulfilled), avec res.ok === false","rejetée","en attente pour toujours"],"a":0,"e":"Seul un échec réseau la rejette."},{"n":"promesses-fetch","q":"<code>res.json()<\/code> renvoie :","o":["directement un objet","une promesse de l&#39;objet","une chaîne"],"a":1,"e":"D&#39;où le second then ou le second await."},{"n":"promesses-fetch","q":"<code>await<\/code> peut s&#39;utiliser :","o":["n&#39;importe où","dans une fonction async (ou au niveau supérieur d&#39;un module)","seulement dans un then"],"a":1,"e":"Hors fonction async, c&#39;est une erreur de syntaxe dans un script classique."},{"n":"promesses-fetch","q":"Pour envoyer un objet en JSON avec fetch, le body doit être :","o":["l&#39;objet lui-même","JSON.stringify(objet)","JSON.parse(objet)"],"a":1,"e":"Le corps est du texte."},{"n":"promesses-fetch","q":"Interroger 3 serveurs miroirs et garder la première <strong>réussite<\/strong> :","o":["Promise.all","Promise.race","Promise.any"],"a":2,"e":"race prendrait aussi un échec s&#39;il arrive en premier."},{"n":"promesses-fetch","q":"<code>Promise.all([p1, p2])<\/code> si p2 est rejetée :","o":["rejette avec l&#39;erreur de p2","renvoie [p1, undefined]","attend p1 puis réussit"],"a":0,"e":"Tout ou rien."},{"n":"promesses-fetch","q":"Quel bloc permet de réactiver le bouton après un fetch, réussi ou non ?","o":["catch","then","finally"],"a":2,"e":"finally s&#39;exécute dans tous les cas."}]},{"id":"td-tp-corriges","t":"TD 1 à 4 et TP corrigés","seance":"Travaux dirigés et travaux pratiques","imp":4,"html":"<p>Ce chapitre reprend les énoncés des <strong>TD 1 à 4<\/strong> et des <strong>TP 1 à 4<\/strong> du Pr Zouina, avec une correction rédigée par ToumaiLearn. Essaie d&#39;abord seul : ouvre le corrigé seulement après.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Les fiches sont scannées. Les corrigés manuscrits fournis (TD 1, TD 4) ont servi de référence ; les autres corrections sont rédigées ici à partir du cours. Le code DOM se teste dans le navigateur, le reste a été exécuté avec Node.js.<\/p>\n<\/aside><h2>Avant de commencer<\/h2>\n<p>Ce chapitre suppose les chapitres 2 à 9 lus. Un seul réflexe à vérifier : savoir où se teste un code.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Peut-on tester <code>document.querySelector(&quot;#liste&quot;)<\/code> avec <code>node fichier.js<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Non : <code>document<\/code> est fourni par le navigateur. Le code DOM se teste dans une page HTML (console F12) ; le JavaScript pur (tableaux, classes, promesses) peut se tester avec Node.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Pour chaque exercice, repère d&#39;abord <strong>la notion du cours visée<\/strong> (le titre de l&#39;exercice la donne presque toujours : « Délégation », « Création de masse », « Callbacks »…). La solution attendue est celle du cours, pas une autre.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Recopier un corrigé sans l&#39;exécuter. Ouvre une page vide, colle le HTML de l&#39;énoncé, puis ton script avec <code>defer<\/code>.<\/p>\n<\/aside><p>À la fin, tu as traité les quatre TD et les quatre TP, qui couvrent tout le programme de l&#39;examen.<\/p>\n<h2>TD 1 · Mémoire, flux et sous-programmes<\/h2>\n<p>Les exercices 1 à 4 sont corrigés dans les chapitres 2 et 3 (hoisting, <code>==<\/code>, <code>switch<\/code> sans <code>break<\/code>, boucle sur <code>transactions<\/code>, <code>calculerSalaireNet<\/code>). Version complète de l&#39;exercice 4 :<\/p>\n<pre class=\"\"><code>function calculerSalaireNet(tauxHoraire = 15, heuresTravaillees = 0, bonus = 0) {\n  const brut = tauxHoraire * heuresTravaillees;\n  return brut - brut * 0.20 + bonus;\n}\nconst complet = calculerSalaireNet(20, 100, 300);\nconst sansBonus = calculerSalaireNet(20, 100);\nconst vide = calculerSalaireNet();\nconsole.log(complet, sansBonus, vide);<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>1900 1600 0<\/code><\/pre><h2>TD 2 · Programmation fonctionnelle, objets intégrés, callbacks<\/h2>\n<p>Exercices 1, 3 et 4 : voir chapitre 5 (<code>filter<\/code>/<code>map<\/code>/<code>reduce<\/code> sur <code>parcServeurs<\/code> → <code>[&#39;SRV-01&#39;,&#39;SRV-03&#39;]<\/code> et 187 ; <code>analyserFichier<\/code> ; ordre A, C, B). Exercice 2 :<\/p>\n<pre class=\"\"><code>const prenomBrut = &quot;  aLi &quot;;\nconst prenomPropre = prenomBrut.trim().toUpperCase();\nconsole.log(`[${prenomPropre}] [${prenomBrut}]`);\n\nconst idSession = Math.floor(Math.random() * 1000) + 1;\nconsole.log(idSession &gt;= 1 &amp;&amp; idSession &lt;= 1000);\n\nconst iso = new Date(Date.UTC(2026, 3, 1, 10, 0, 44)).toISOString();\nconsole.log(iso);<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>[ALI] [  aLi ]\ntrue\n2026-04-01T10:00:44.000Z<\/code><\/pre><p>Dans le vrai code, <code>new Date().toISOString()<\/code> donne l&#39;instant présent ; ici la date est fixée pour que la sortie soit vérifiable.<\/p>\n<h2>TD 3 · DOM<\/h2>\n<p>Le HTML : un <code>#dashboard<\/code> avec <code>header.carte-profil<\/code> (contenant <code>h2#nom-utilisateur<\/code> « Invité » et <code>div.zone-securisee<\/code>), une <code>table.table-serveurs<\/code> (deux lignes, la seconde <code>tr.serveur-hs<\/code>), une <code>ul#liste-logs<\/code> vide.<\/p>\n<pre class=\"\"><code>// Ex. 1 : sélection, sécurité, état\ndocument.querySelector(&quot;#nom-utilisateur&quot;).textContent = &quot;Administrateur Système&quot;;\nconst $carte = document.querySelector(&quot;header.carte-profil&quot;);\n$carte.classList.add(&quot;connecte&quot;);\nconst payload = &quot;&lt;img src='x' onerror='alert(\\&quot;Piraté!\\&quot;)'&gt;&quot;;\ndocument.querySelector(&quot;.zone-securisee&quot;).textContent = payload;   // pas innerHTML !\n\n// Ex. 2 : navigation agnostique\nconst $btn = document.querySelector(&quot;.btn-reboot&quot;);\n$btn.closest(&quot;tr&quot;).classList.add(&quot;en-maintenance&quot;);\n\n// Ex. 3 : création de masse, une seule insertion\nconst logs = Array.from({ length: 100 }, (_, i) =&gt; `Log n°${i + 1}`);\nconst $fragment = document.createDocumentFragment();\nlogs.forEach(texte =&gt; {\n  const $li = document.createElement(&quot;li&quot;);\n  $li.textContent = texte;\n  $fragment.append($li);\n});\ndocument.querySelector(&quot;#liste-logs&quot;).append($fragment);\n\n// Ex. 4 : suppression directe\ndocument.querySelector(&quot;.serveur-hs&quot;).remove();<\/code><\/pre><h2>TD 4 · Formulaires, délégation, promesses et persistance<\/h2>\n<p>Le HTML : <code>form#form-creation-compte<\/code> (<code>#input-nom<\/code>, <code>#input-mdp<\/code>, bouton submit, <code>#zone-erreurs<\/code>) et <code>ul#liste-employes<\/code> avec des <code>li.carte-employe<\/code> contenant un <code>button.btn-bannir<\/code>.<\/p>\n<pre class=\"\"><code>const $formulaire = document.querySelector(&quot;#form-creation-compte&quot;);\nconst $inputNom = document.querySelector(&quot;#input-nom&quot;);\nconst $inputMdp = document.querySelector(&quot;#input-mdp&quot;);\nconst $zoneErreurs = document.querySelector(&quot;#zone-erreurs&quot;);\nconst $bouton = $formulaire.querySelector(&quot;button[type='submit']&quot;);\n\n// Ex. 2 : un seul écouteur pour 10 000 boutons (délégation)\ndocument.querySelector(&quot;#liste-employes&quot;).addEventListener(&quot;click&quot;, (e) =&gt; {\n  const $btn = e.target.closest(&quot;.btn-bannir&quot;);\n  if (!$btn) return;\n  $btn.closest(&quot;.carte-employe&quot;).remove();\n});\n\n// Ex. 3 : promesse simulée\nconst simulerCreationCompte = (nom, mdp) =&gt; new Promise((resolve, reject) =&gt; {\n  if (mdp.length &lt; 8) return reject(new Error(&quot;Le mot de passe doit faire 8 caractères minimum.&quot;));\n  setTimeout(() =&gt; resolve(nom), 2000);\n});\n\n// Ex. 1 + 3 : validation, puis async/await\n$formulaire.addEventListener(&quot;submit&quot;, async (e) =&gt; {\n  e.preventDefault();                                   // pas de rechargement\n  const nom = $inputNom.value.trim();\n  const mdp = $inputMdp.value;\n  if (nom === &quot;&quot;) {                                      // ex. 1 (le mdp est vérifié par la promesse)\n    $zoneErreurs.textContent = &quot;Le nom est obligatoire.&quot;;\n    return;\n  }\n  const texteOrigine = $bouton.textContent;\n  $bouton.disabled = true;\n  $bouton.textContent = &quot;Création en cours...&quot;;\n  $zoneErreurs.textContent = &quot;&quot;;\n  try {\n    const nomCree = await simulerCreationCompte(nom, mdp);\n    localStorage.setItem(&quot;dernierAdmin&quot;, nomCree);\n    $formulaire.reset();\n    alert(&quot;Compte créé avec succès&quot;);\n  } catch (err) {\n    $zoneErreurs.textContent = err.message;\n  } finally {\n    $bouton.disabled = false;\n    $bouton.textContent = texteOrigine;\n  }\n});<\/code><\/pre><aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>Dans son corrigé de l&#39;exercice 1, le prof teste <code>nom === &quot;&quot; || mdp.length &lt; 8<\/code>, écrit l&#39;erreur dans <code>#zone-erreurs<\/code> avec <code>textContent<\/code>, fait un <code>return<\/code> (court-circuit), puis <code>form.reset()<\/code> et <code>console.log(&quot;Compte créé avec succès&quot;)<\/code>. Les deux écouteurs <code>submit<\/code> (ex. 1 et ex. 3) ne doivent pas coexister : garde la version de l&#39;exercice 3.<\/p>\n<\/aside><h2>TP 1 · Bases (prompt, alert, conditions, fonctions, boucles)<\/h2>\n<p><code>prompt()<\/code> renvoie <strong>toujours une chaîne<\/strong> : convertis avec <code>Number()<\/code> avant de calculer. Ces fonctions n&#39;existent que dans le navigateur.<\/p>\n<pre class=\"\"><code>const prenom = prompt(&quot;Ton prénom ?&quot;);\nconst pays = &quot;Maroc&quot;;\nalert(`Bonjour, je m'appelle ${prenom} et je vis au ${pays}.`);\nalert(prenom.length);\n\nconst heure = Number(prompt(&quot;Quelle heure est-il (0-23) ?&quot;));\nif (heure &lt; 12) alert(&quot;Bonjour !&quot;);\nelse if (heure &lt; 18) alert(&quot;Bon après-midi !&quot;);\nelse alert(&quot;Bonsoir !&quot;);<\/code><\/pre><p>La logique, sans <code>prompt<\/code>, peut se tester avec Node :<\/p>\n<pre class=\"\"><code>const meteoMessage = (meteo) =&gt; {\n  switch (meteo) {\n    case &quot;ensoleillé&quot;: return &quot;Lunettes de soleil !&quot;;\n    case &quot;pluvieux&quot;: return &quot;Prends un parapluie.&quot;;\n    case &quot;nuageux&quot;: return &quot;Une veste suffira.&quot;;\n    default: return &quot;Météo inconnue.&quot;;\n  }\n};\nconst calculerAge = (anneeNaissance, anneeCourante = 2026) =&gt; anneeCourante - anneeNaissance;\nconst estMajeur = age =&gt; age &gt;= 18;\nfunction afficherProfil(nom, anneeNaissance) {\n  const age = calculerAge(anneeNaissance);\n  return `Nom : ${nom} | Âge : ${age} | Majeur ? ${estMajeur(age) ? &quot;Oui&quot; : &quot;Non&quot;}`;\n}\nconst pays = &quot;maroc&quot;, age = 18;\nconsole.log(meteoMessage(&quot;pluvieux&quot;));\nconsole.log(pays === &quot;maroc&quot; &amp;&amp; age &gt;= 18 ? &quot;Accès autorisé&quot; : &quot;Accès restreint&quot;);\nconsole.log(afficherProfil(&quot;Patrick&quot;, 2004));\nfor (let i = 1; i &lt;= 3; i++) console.log(`Café n°${i}`);<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Prends un parapluie.\nAccès autorisé\nNom : Patrick | Âge : 22 | Majeur ? Oui\nCafé n°1\nCafé n°2\nCafé n°3<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le TP propose <code>new Date().getFullYear()<\/code> pour l&#39;année en cours. On a mis <code>anneeCourante = 2026<\/code> en paramètre par défaut uniquement pour que la sortie ci-dessus reste vérifiable.<\/p>\n<\/aside><h2>TP 2 · Garage automobile (classes)<\/h2>\n<pre class=\"\"><code>class Moteur {\n  constructor(type, puissance) { this.type = type; this.puissance = puissance; }\n}\n\nclass Vehicule {\n  #prix;\n  constructor(marque, modele, annee, moteur, prix) {\n    this.marque = marque; this.modele = modele; this.annee = annee;\n    this.moteur = moteur;\n    this.prix = prix;                      // passe par le setter\n  }\n  get prix() { return this.#prix; }\n  set prix(v) { if (v &lt;= 0) throw new Error(&quot;prix invalide&quot;); this.#prix = v; }\n  getAnciennete(anneeCourante = 2026) { return anneeCourante - this.annee; }\n  afficherFiche() {\n    return `${this.marque} ${this.modele} (${this.annee}) ${this.moteur.type} ${this.moteur.puissance} CH - ${this.prix} DH`;\n  }\n}\n\nclass Voiture extends Vehicule {\n  constructor(marque, modele, annee, moteur, prix, nombreDePortes) {\n    super(marque, modele, annee, moteur, prix);\n    this.nombreDePortes = nombreDePortes;\n  }\n  afficherFiche() { return `${super.afficherFiche()} - ${this.nombreDePortes} portes`; }\n}\n\nclass Garage {\n  static nom = &quot;Garage FSABM&quot;;\n  constructor() { this.vehicules = []; }\n  ajouterVehicule(v) { this.vehicules.push(v); }\n  afficherTousLesVehicules() { this.vehicules.forEach(v =&gt; console.log(v.afficherFiche())); }\n  rechercherParMarque(marque) { return this.vehicules.filter(v =&gt; v.marque === marque); }\n  vehiculesRecents() { return this.vehicules.filter(v =&gt; v.annee &gt; 2020); }\n  calculerValeurTotale() { return this.vehicules.reduce((s, v) =&gt; s + v.prix, 0); }\n}\n\nconst essence = new Moteur(&quot;essence&quot;, 90);\nconst diesel = new Moteur(&quot;diesel&quot;, 110);\nconst electrique = new Moteur(&quot;électrique&quot;, 150);\nconst garage = new Garage();\n[\n  new Voiture(&quot;Renault&quot;, &quot;Clio&quot;, 2019, essence, 120000, 5),\n  new Voiture(&quot;Dacia&quot;, &quot;Logan&quot;, 2022, diesel, 140000, 5),\n  new Voiture(&quot;Renault&quot;, &quot;Megane&quot;, 2021, diesel, 210000, 5),\n  new Voiture(&quot;Peugeot&quot;, &quot;208&quot;, 2018, essence, 110000, 3),\n  new Voiture(&quot;Tesla&quot;, &quot;Model 3&quot;, 2023, electrique, 450000, 4)\n].forEach(v =&gt; garage.ajouterVehicule(v));\n\nconsole.log(Garage.nom);\ngarage.afficherTousLesVehicules();\nconsole.log(garage.rechercherParMarque(&quot;Renault&quot;).map(v =&gt; v.modele));\nconsole.log(garage.vehiculesRecents().map(v =&gt; v.modele));\nconsole.log(garage.calculerValeurTotale());<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Garage FSABM\nRenault Clio (2019) essence 90 CH - 120000 DH - 5 portes\nDacia Logan (2022) diesel 110 CH - 140000 DH - 5 portes\nRenault Megane (2021) diesel 110 CH - 210000 DH - 5 portes\nPeugeot 208 (2018) essence 90 CH - 110000 DH - 3 portes\nTesla Model 3 (2023) électrique 150 CH - 450000 DH - 4 portes\n[ 'Clio', 'Megane' ]\n[ 'Logan', 'Megane', 'Model 3' ]\n1030000<\/code><\/pre><h2>TP 3 · DOM et événements<\/h2>\n<p>Les exercices finissent par une validation de formulaire (champs non vides, message rouge ou vert dans <code>#msg<\/code>, pas de rechargement) et une todo-list (<code>ul#todo-list<\/code>, un écouteur sur <code>&lt;ul&gt;<\/code>, <code>event.target<\/code>, classe qui barre l&#39;élément).<\/p>\n<pre class=\"\"><code>// Formulaire\ndocument.querySelector(&quot;form&quot;).addEventListener(&quot;submit&quot;, (e) =&gt; {\n  e.preventDefault();\n  const $msg = document.querySelector(&quot;#msg&quot;);\n  const vides = [...e.target.querySelectorAll(&quot;input&quot;)].some($in =&gt; $in.value.trim() === &quot;&quot;);\n  $msg.textContent = vides ? &quot;Tous les champs sont obligatoires.&quot; : &quot;Envoyé !&quot;;\n  $msg.style.color = vides ? &quot;red&quot; : &quot;green&quot;;   // ou mieux : classList.toggle(&quot;erreur&quot;, vides)\n});\n\n// Todo-list (délégation)\ndocument.querySelector(&quot;#todo-list&quot;).addEventListener(&quot;click&quot;, (event) =&gt; {\n  if (event.target.tagName === &quot;LI&quot;) event.target.classList.toggle(&quot;barre&quot;);\n});<\/code><\/pre><h2>TP 4 · Charger des utilisateurs depuis une API<\/h2>\n<p>Le corrigé complet (bouton, <code>fetch<\/code> sur <code>https://jsonplaceholder.typicode.com/users<\/code>, <code>response.ok<\/code>, affichage des noms dans un paragraphe, <code>try/catch/finally<\/code>) est dans le chapitre 9, Idée 4.<\/p>\n<h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">TD 1 : <code>calculerSalaireNet(20, 100, 300)<\/code> (net = brut − 20 % + bonus) vaut :<\/div><button class=\"opt\" data-o=\"0\">2300<\/button><button class=\"opt\" data-o=\"1\">1900<\/button><button class=\"opt\" data-o=\"2\">1600<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">TD 2 : <code>&quot;  aLi &quot;.trim().toUpperCase()<\/code> donne :<\/div><button class=\"opt\" data-o=\"0\">&quot;ALI&quot;<\/button><button class=\"opt\" data-o=\"1\">&quot;  ALI &quot;<\/button><button class=\"opt\" data-o=\"2\">&quot;Ali&quot;<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">TD 2 : <code>Math.random()<\/code> renvoie un nombre dans :<\/div><button class=\"opt\" data-o=\"0\">[0, 1]<\/button><button class=\"opt\" data-o=\"1\">[0, 1[<\/button><button class=\"opt\" data-o=\"2\">[1, 1000]<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">TD 3, ex. 1.3 : pour injecter le payload sans exécution :<\/div><button class=\"opt\" data-o=\"0\">innerHTML<\/button><button class=\"opt\" data-o=\"1\">textContent<\/button><button class=\"opt\" data-o=\"2\">insertAdjacentHTML<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">TD 3, ex. 2 : remonter du bouton à sa ligne, quelle que soit la profondeur :<\/div><button class=\"opt\" data-o=\"0\">parentElement.parentElement<\/button><button class=\"opt\" data-o=\"1\">closest(&quot;tr&quot;)<\/button><button class=\"opt\" data-o=\"2\">previousElementSibling<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">TD 4, ex. 1 : première instruction de l&#39;écouteur submit :<\/div><button class=\"opt\" data-o=\"0\">e.preventDefault()<\/button><button class=\"opt\" data-o=\"1\">e.stopPropagation()<\/button><button class=\"opt\" data-o=\"2\">form.reset()<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">TD 4, ex. 3 : où remettre le bouton dans son état d&#39;origine ?<\/div><button class=\"opt\" data-o=\"0\">dans try<\/button><button class=\"opt\" data-o=\"1\">dans catch<\/button><button class=\"opt\" data-o=\"2\">dans finally<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">TP 1 : avec <code>const age = prompt(&quot;Âge ?&quot;)<\/code>, <code>age + 1<\/code> pour la saisie 18 donne :<\/div><button class=\"opt\" data-o=\"0\">19<\/button><button class=\"opt\" data-o=\"1\">&quot;181&quot;<\/button><button class=\"opt\" data-o=\"2\">NaN<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">TP 2 : quelle méthode de tableau pour <code>vehiculesRecents()<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">map<\/button><button class=\"opt\" data-o=\"1\">filter<\/button><button class=\"opt\" data-o=\"2\">reduce<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">TP 3 : dans l&#39;écouteur posé sur <code>&lt;ul&gt;<\/code>, quel <code>&lt;li&gt;<\/code> a été cliqué ?<\/div><button class=\"opt\" data-o=\"0\">event.target<\/button><button class=\"opt\" data-o=\"1\">event.currentTarget<\/button><button class=\"opt\" data-o=\"2\">this.children[0]<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"td-tp-corriges","rep":null,"tol":null}],"qcm":[{"n":"td-tp-corriges","q":"TD 1 : <code>calculerSalaireNet(20, 100, 300)<\/code> (net = brut − 20 % + bonus) vaut :","o":["2300","1900","1600"],"a":1,"e":"2000 × 0,8 = 1600, + 300 = 1900."},{"n":"td-tp-corriges","q":"TD 2 : <code>&quot;  aLi &quot;.trim().toUpperCase()<\/code> donne :","o":["&quot;ALI&quot;","&quot;  ALI &quot;","&quot;Ali&quot;"],"a":0,"e":"trim enlève les espaces aux extrémités."},{"n":"td-tp-corriges","q":"TD 2 : <code>Math.random()<\/code> renvoie un nombre dans :","o":["[0, 1]","[0, 1[","[1, 1000]"],"a":1,"e":"1 est exclu, d&#39;où floor puis + 1."},{"n":"td-tp-corriges","q":"TD 3, ex. 1.3 : pour injecter le payload sans exécution :","o":["innerHTML","textContent","insertAdjacentHTML"],"a":1,"e":"Les deux autres interprètent le HTML."},{"n":"td-tp-corriges","q":"TD 3, ex. 2 : remonter du bouton à sa ligne, quelle que soit la profondeur :","o":["parentElement.parentElement","closest(&quot;tr&quot;)","previousElementSibling"],"a":1,"e":"closest est robuste aux changements de structure."},{"n":"td-tp-corriges","q":"TD 4, ex. 1 : première instruction de l&#39;écouteur submit :","o":["e.preventDefault()","e.stopPropagation()","form.reset()"],"a":0,"e":"Elle bloque le rechargement de la page."},{"n":"td-tp-corriges","q":"TD 4, ex. 3 : où remettre le bouton dans son état d&#39;origine ?","o":["dans try","dans catch","dans finally"],"a":2,"e":"Exécuté en cas de succès comme d&#39;échec."},{"n":"td-tp-corriges","q":"TP 1 : avec <code>const age = prompt(&quot;Âge ?&quot;)<\/code>, <code>age + 1<\/code> pour la saisie 18 donne :","o":["19","&quot;181&quot;","NaN"],"a":1,"e":"prompt renvoie une chaîne : + concatène."},{"n":"td-tp-corriges","q":"TP 2 : quelle méthode de tableau pour <code>vehiculesRecents()<\/code> ?","o":["map","filter","reduce"],"a":1,"e":"On garde un sous-ensemble (annee &gt; 2020)."},{"n":"td-tp-corriges","q":"TP 3 : dans l&#39;écouteur posé sur <code>&lt;ul&gt;<\/code>, quel <code>&lt;li&gt;<\/code> a été cliqué ?","o":["event.target","event.currentTarget","this.children[0]"],"a":0,"e":"currentTarget serait le <code>&lt;ul&gt;<\/code> lui-même."}]},{"id":"revision-examen","t":"Révision et examen blanc","seance":"Préparation à l'examen (session 1, 1h30)","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Ce chapitre suppose tout le module lu. L&#39;examen 2025 (session 1, 1h30) comptait <strong>4 exercices<\/strong> : questions de cours courtes, fonctions sur un tableau, DOM sur une todo-list, <code>fetch<\/code> sur trois serveurs.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Sans regarder : cite les 4 méthodes de tableau du cours et ce que chacune renvoie.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>map<\/code> → nouveau tableau de même taille ; <code>filter<\/code> → sous-tableau ; <code>find<\/code> → premier élément (ou undefined) ; <code>reduce<\/code> → une seule valeur. Si tu as hésité, relis le chapitre 5 avant l&#39;examen blanc.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Fais l&#39;examen blanc <strong>en 1h30, sur papier<\/strong>, sans exécuter. L&#39;examen se passe sans ordinateur : écrire du JS juste à la main, ça s&#39;entraîne. Ensuite seulement, compare avec le corrigé et exécute.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Perdre des points sur les détails de syntaxe vus en Q1 de 2025 : nom de variable invalide (<code>maVariable+<\/code>), <code>const<\/code> réassignée, <code>sort()<\/code> sans comparateur, <code>#<\/code> pour le privé.<\/p>\n<\/aside><p>À la fin, tu as fait un examen complet dans les conditions réelles et tu sais où sont tes points faibles.<\/p>\n<h2>Idée 1 · La fiche de révision en une page<\/h2>\n<figure class=\"grille\"><figcaption>Les 12 réflexes qui rapportent des points<\/figcaption><table><tr><th><\/th><th>réflexe<\/th><\/tr><tr><th>1<\/th><td class=\"h1\">const<\/td><td>par<\/td><td>défaut,<\/td><td>let<\/td><td>si<\/td><td>mutation,<\/td><td>jamais<\/td><td>var<\/td><\/tr><tr><th>2<\/th><td class=\"h1\">===<\/td><td>et<\/td><td class=\"h2\">==<\/td><td>toujours<\/td><\/tr><tr><th>3<\/th><td>var<\/td><td>→<\/td><td>undefined<\/td><td>avant<\/td><td>la<\/td><td>ligne<\/td><td>;<\/td><td>let/const<\/td><td>→<\/td><td>ReferenceError<\/td><td>(TDZ)<\/td><\/tr><tr><th>4<\/th><td>falsy<\/td><td>:<\/td><td>false,<\/td><td>0,<\/td><td>&quot;&quot;,<\/td><td>null,<\/td><td>undefined,<\/td><td>NaN<\/td><\/tr><tr><th>5<\/th><td>objets<\/td><td>et<\/td><td>tableaux<\/td><td>copiés<\/td><td>par<\/td><td>référence<\/td><\/tr><tr><th>6<\/th><td class=\"h1\">map<\/td><td>/<\/td><td>filter<\/td><td>/<\/td><td>find<\/td><td>/<\/td><td>reduce(…,<\/td><td>0)<\/td><\/tr><tr><th>7<\/th><td>sort((a,<\/td><td>b)<\/td><td>=&gt;<\/td><td>a<\/td><td>-<\/td><td>b)<\/td><td>pour<\/td><td>des<\/td><td>nombres<\/td><\/tr><tr><th>8<\/th><td>setTimeout(…,<\/td><td>0)<\/td><td>passe<\/td><td>après<\/td><td>tout<\/td><td>le<\/td><td>code<\/td><td>synchrone<\/td><\/tr><tr><th>9<\/th><td class=\"h1\">textContent<\/td><td>pour<\/td><td>les<\/td><td>données<\/td><td>utilisateur<\/td><td>(XSS)<\/td><\/tr><tr><th>10<\/th><td class=\"h1\">délégation<\/td><td>:<\/td><td>un<\/td><td>écouteur<\/td><td>sur<\/td><td>le<\/td><td>parent<\/td><td>+<\/td><td>closest<\/td><\/tr><tr><th>11<\/th><td>JSON.stringify<\/td><td>pour<\/td><td>stocker,<\/td><td>JSON.parse<\/td><td>pour<\/td><td>relire<\/td><\/tr><tr><th>12<\/th><td class=\"h1\">fetch<\/td><td>:<\/td><td>tester<\/td><td>res.ok,<\/td><td>deux<\/td><td>await,<\/td><td>try/catch/finally<\/td><\/tr><\/table><\/figure><p>Noms de variables : une lettre, <code>_<\/code> ou <code>$<\/code> en premier, puis lettres, chiffres, <code>_<\/code>, <code>$<\/code>. Donc <code>maVariable<\/code> et <code>$maVariable<\/code> sont valides ; <code>maVariable+<\/code> ne l&#39;est pas.<\/p>\n<h2>Idée 2 · L&#39;exercice type « plusieurs serveurs »<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Méthode pour un exercice fetch<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/6 · Lister les URL<\/div><p>const urls = [&quot;<a href=\"https://api1.example.com/users\">https://api1.example.com/users<\/a>&quot;, ...];<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/6 · Choisir la combinaison<\/div><p>le plus rapide qui réussit → Promise.any ; tout est indispensable → Promise.all.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/6 · Écrire une fonction qui charge UNE source<\/div><p>fetch, test de res.ok (throw sinon), return res.json().<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/6 · Combiner<\/div><p>const users = await Promise.any(urls.map(charger));<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/6 · Afficher<\/div><p>boucle sur users, createElement(&quot;li&quot;), textContent = u.name, append dans le <code>&lt;ul&gt;<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">6/6 · Brancher sur le bouton<\/div><p>addEventListener(&quot;click&quot;, async () =&gt; { try { … } catch { … } }).<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p>Simulation exécutable (le « réseau » est remplacé par des promesses à délai) :<\/p>\n<pre class=\"\"><code>const fauxServeur = (url, ms, enPanne = false) =&gt; new Promise((resolve, reject) =&gt;\n  setTimeout(() =&gt; enPanne ? reject(new Error(url + &quot; en panne&quot;))\n                           : resolve([{ name: &quot;Leanne&quot; }, { name: &quot;Ervin&quot; }]), ms));\n\nconst sources = [\n  () =&gt; fauxServeur(&quot;api1&quot;, 50),\n  () =&gt; fauxServeur(&quot;api2&quot;, 10, true),\n  () =&gt; fauxServeur(&quot;api3&quot;, 30)\n];\n\n(async () =&gt; {\n  try {\n    const users = await Promise.any(sources.map(f =&gt; f()));\n    console.log(users.map(u =&gt; u.name));\n  } catch (e) {\n    console.log(&quot;Toutes les sources sont en panne&quot;);\n  }\n})();<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>[ 'Leanne', 'Ervin' ]<\/code><\/pre><p>api2 répond en premier mais en panne : <code>Promise.any<\/code> l&#39;ignore et prend api3.<\/p>\n<h2>Examen blanc<\/h2>\n<p>Durée : 1h30. Sans documents, sans ordinateur. Inspiré de l&#39;examen de session 1 de 2025.<\/p>\n<section class=\"exo\"><h3>Exercice 1 · Questions de cours (6 points)<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><ol>\n<li>Parmi <code>maVariable<\/code>, <code>maVariable+<\/code>, <code>$maVariable<\/code>, lesquelles sont valides ?<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>maVariable<\/code> et <code>$maVariable<\/code>. <code>+<\/code> est un opérateur, interdit dans un identifiant.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><ol start=\"2\">\n<li>Qu&#39;affiche ce code ? <code>function hello(n, nom) { let i = 0; while (i &lt; n) { console.log(&quot;Hello &quot; + nom); i++; } } hello(3, &quot;Mohamed&quot;, &quot;Mahmoud&quot;, &quot;Ahmed&quot;);<\/code><\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Trois fois « Hello Mohamed ». <code>n<\/code> vaut 3, <code>nom<\/code> vaut &quot;Mohamed&quot;, les arguments en trop sont ignorés.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><ol start=\"3\">\n<li>Modifie <code>hello<\/code> pour qu&#39;elle ait des valeurs par défaut.<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>function hello(n = 1, nom = &quot;inconnu&quot;) { ... }<\/code>. <code>hello()<\/code> affiche alors une fois « Hello inconnu ».<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><ol start=\"4\">\n<li>Parmi <code>let compteur = 0;<\/code>, <code>const compteur = 0; compteur = 1;<\/code>, <code>var compteur = 0;<\/code>, lesquelles sont valides et que se passe-t-il ?<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>let<\/code> : valide, réassignable, portée de bloc. <code>const ... compteur = 1<\/code> : la déclaration est valide mais la réassignation lève une TypeError. <code>var<\/code> : valide mais déconseillée (portée de fonction, hoisting).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><ol start=\"5\">\n<li>Différence entre <code>array.sort((a, b) =&gt; a - b)<\/code> et <code>array.sort((a, b) =&gt; b - a)<\/code> ?<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Le premier trie par ordre croissant, le second par ordre décroissant. Les deux modifient le tableau.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><ol start=\"6\">\n<li>Différence entre <code>querySelector(&quot;#p&quot;)<\/code>, <code>querySelector(&quot;.p&quot;)<\/code>, <code>querySelector(&quot;p&quot;)<\/code> ?<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Premier élément d&#39;id <code>p<\/code> ; premier élément de classe <code>p<\/code> ; premier élément <code>&lt;p&gt;<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"7\"><div class=\"ex-q\"><ol start=\"7\">\n<li>Syntaxe d&#39;un membre privé de classe ?<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>#nom<\/code> : <code>class A { #secret = 1; lire() { return this.#secret; } }<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"8\"><div class=\"ex-q\"><ol start=\"8\">\n<li>Gestion des erreurs : promesses vs async/await ?<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Promesses : <code>.then(...).catch(err =&gt; ...)<\/code> en fin de chaîne. async/await : <code>try { await ... } catch (err) { ... } finally { ... }<\/code>, écrit comme du code synchrone.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Exercice 2 · Fonctions sur un tableau (5 points)<\/h3><div class=\"ex\" data-x=\"9\"><div class=\"ex-q\"><p>Avec <code>const T1 = [12, 3, 90, 7, 99, 145, 5, 13, 88, 9];<\/code> : (1) fonction nominale → T2 des éléments strictement inférieurs à 100 ; (2) fonction nominale → T3 des pairs ; (3) fléchée → somme ; (4) fléchée → tri décroissant ; (5) programme qui appelle tout et affiche les résultats.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>filter pour 1 et 2, reduce avec 0 pour 3, une copie puis sort((a, b) =&gt; b - a) pour 4.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><code>function inferieursA100(t) { return t.filter(x =&gt; x &lt; 100); }<\/code> ; <code>function pairs(t) { return t.filter(x =&gt; x % 2 === 0); }<\/code> ; <code>const somme = t =&gt; t.reduce((acc, x) =&gt; acc + x, 0);<\/code> ; <code>const trierDecroissant = t =&gt; [...t].sort((a, b) =&gt; b - a);<\/code> ; puis <code>console.log(inferieursA100(T1), pairs(T1), somme(T1), trierDecroissant(T1));<\/code>. Résultats : <code>[12, 3, 90, 7, 99, 5, 13, 88, 9]<\/code>, <code>[12, 90, 88]<\/code>, <code>471<\/code>, <code>[145, 99, 90, 88, 13, 12, 9, 7, 5, 3]<\/code>. La copie <code>[...t]<\/code> évite de modifier T1.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"10\"><div class=\"ex-q\"><p>Que vaut <code>somme(pairs(T1))<\/code> ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 190<\/b><\/p><p>12 + 90 + 88 = 190.<\/p>\n<\/div><\/div><\/section><section class=\"exo\"><h3>Exercice 3 · DOM : la todo-list (5 points)<\/h3><div class=\"ex\" data-x=\"11\"><div class=\"ex-q\"><p>HTML : <code>&lt;ul id=&quot;todoList&quot;&gt;&lt;li&gt;JavaScript&lt;/li&gt;&lt;li&gt;C++&lt;/li&gt;&lt;/ul&gt;<\/code>. (1) Ajoute un <code>&lt;li&gt;<\/code> « Mysql » à la fin. (2) Clic sur un <code>&lt;li&gt;<\/code> : il est barré (<code>text-decoration: line-through<\/code>), un nouveau clic le remet normal. (3) Double-clic : le <code>&lt;li&gt;<\/code> devient un <code>&lt;input type=&quot;text&quot;&gt;<\/code> avec son texte ; « Entrée » valide et remet un <code>&lt;li&gt;<\/code>.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Une classe CSS .barre + classList.toggle ; un seul écouteur sur la liste (délégation).<\/p>\n<\/div><div class=\"ex-c\" hidden><p>(1) <code>const $liste = document.querySelector(&quot;#todoList&quot;); const $li = document.createElement(&quot;li&quot;); $li.textContent = &quot;Mysql&quot;; $liste.append($li);<\/code>\n(2) CSS : <code>.barre { text-decoration: line-through; }<\/code>. JS : <code>$liste.addEventListener(&quot;click&quot;, (e) =&gt; { const $item = e.target.closest(&quot;li&quot;); if ($item) $item.classList.toggle(&quot;barre&quot;); });<\/code>\n(3) <code>$liste.addEventListener(&quot;dblclick&quot;, (e) =&gt; { const $item = e.target.closest(&quot;li&quot;); if (!$item) return; const $input = document.createElement(&quot;input&quot;); $input.type = &quot;text&quot;; $input.value = $item.textContent; $liste.insertBefore($input, $item); $item.remove(); $input.focus(); $input.addEventListener(&quot;keydown&quot;, (ev) =&gt; { if (ev.key !== &quot;Enter&quot;) return; const $nouveau = document.createElement(&quot;li&quot;); $nouveau.textContent = $input.value; $liste.insertBefore($nouveau, $input); $input.remove(); }); });<\/code>\nLa délégation fait que « Mysql » et les <code>&lt;li&gt;<\/code> recréés réagissent aussi.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Exercice 4 · fetch et trois serveurs (4 points)<\/h3><div class=\"ex\" data-x=\"12\"><div class=\"ex-q\"><p>La même API est sur <code>https://api1.example.com/users<\/code>, <code>api2<\/code> et <code>api3<\/code> ; chacune renvoie un tableau d&#39;objets avec un champ <code>name<\/code>. (A) Récupérer les noms depuis la source qui répond le plus vite (certaines peuvent être en panne ou lentes). (B) Les afficher dans le <code>&lt;ul&gt;<\/code> de la page. (C) Le tout au clic sur <code>#usersDataLoad<\/code>.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Le plus rapide qui RÉUSSIT : ni all, ni race.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><code>const urls = [&quot;https://api1.example.com/users&quot;, &quot;https://api2.example.com/users&quot;, &quot;https://api3.example.com/users&quot;];<\/code>\n<code>const charger = async (url) =&gt; { const res = await fetch(url); if (!res.ok) throw new Error(url + &quot; : &quot; + res.status); return res.json(); };<\/code>\n<code>document.querySelector(&quot;#usersDataLoad&quot;).addEventListener(&quot;click&quot;, async () =&gt; { const $ul = document.querySelector(&quot;ul&quot;); try { const users = await Promise.any(urls.map(charger)); $ul.textContent = &quot;&quot;; users.forEach(u =&gt; { const $li = document.createElement(&quot;li&quot;); $li.textContent = u.name; $ul.append($li); }); } catch (err) { $ul.textContent = &quot;Aucun serveur disponible.&quot;; } });<\/code>\n<code>Promise.any<\/code> prend la première réussite ; <code>race<\/code> pourrait renvoyer un échec rapide ; <code>all<\/code> attendrait les trois et échouerait si un seul est en panne. <code>textContent<\/code> évite le XSS.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 6 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Lequel est un identifiant <strong>invalide<\/strong> ?<\/div><button class=\"opt\" data-o=\"0\">$maVariable<\/button><button class=\"opt\" data-o=\"1\">_total<\/button><button class=\"opt\" data-o=\"2\">maVariable+<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\"><code>hello(3, &quot;Mohamed&quot;, &quot;Mahmoud&quot;, &quot;Ahmed&quot;)<\/code> avec <code>function hello(n, nom)<\/code> affiche :<\/div><button class=\"opt\" data-o=\"0\">3 fois « Hello Mohamed »<\/button><button class=\"opt\" data-o=\"1\">Hello Mohamed, Hello Mahmoud, Hello Ahmed<\/button><button class=\"opt\" data-o=\"2\">une erreur : trop d&#39;arguments<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\"><code>const c = 0; c = 1;<\/code> :<\/div><button class=\"opt\" data-o=\"0\">c vaut 1<\/button><button class=\"opt\" data-o=\"1\">TypeError<\/button><button class=\"opt\" data-o=\"2\">SyntaxError à la déclaration<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\"><code>[12, 3, 90].filter(x =&gt; x % 2 === 0)<\/code> :<\/div><button class=\"opt\" data-o=\"0\">[12, 90]<\/button><button class=\"opt\" data-o=\"1\">[3]<\/button><button class=\"opt\" data-o=\"2\">102<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Ordre affiché : <code>console.log(&quot;A&quot;); setTimeout(() =&gt; console.log(&quot;B&quot;), 0); console.log(&quot;C&quot;);<\/code><\/div><button class=\"opt\" data-o=\"0\">A B C<\/button><button class=\"opt\" data-o=\"1\">A C B<\/button><button class=\"opt\" data-o=\"2\">B A C<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Pour afficher un nom venant d&#39;une API dans un <code>&lt;li&gt;<\/code> :<\/div><button class=\"opt\" data-o=\"0\">$li.textContent = u.name<\/button><button class=\"opt\" data-o=\"1\">$li.innerHTML = u.name<\/button><button class=\"opt\" data-o=\"2\">$li.style = u.name<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Un seul écouteur pour tous les <code>&lt;li&gt;<\/code>, même ajoutés plus tard :<\/div><button class=\"opt\" data-o=\"0\">querySelectorAll(&quot;li&quot;).forEach(addEventListener)<\/button><button class=\"opt\" data-o=\"1\">écouteur sur le <code>&lt;ul&gt;<\/code> + e.target.closest(&quot;li&quot;)<\/button><button class=\"opt\" data-o=\"2\">un écouteur sur window avec capture<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Pour stocker un tableau d&#39;objets dans le localStorage :<\/div><button class=\"opt\" data-o=\"0\">setItem(&quot;t&quot;, tableau)<\/button><button class=\"opt\" data-o=\"1\">setItem(&quot;t&quot;, JSON.stringify(tableau))<\/button><button class=\"opt\" data-o=\"2\">setItem(JSON.parse(tableau))<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Trois serveurs, prendre le plus rapide qui <strong>réussit<\/strong> :<\/div><button class=\"opt\" data-o=\"0\">Promise.all<\/button><button class=\"opt\" data-o=\"1\">Promise.race<\/but const CARTES=[{"n":"introduction-js","k":0,"ch":"introduction-js","q":"<p>Rôle de JavaScript dans la page (image du prof)<\/p>\n","r":"<p>Le processeur : il lit l&#39;état, exécute la logique et modifie l&#39;affichage. HTML = structure, CSS = présentation.<\/p>\n"},{"n":"introduction-js","k":1,"ch":"introduction-js","q":"<p>Que signifie JIT ?<\/p>\n","r":"<p>Just-In-Time : le code est compilé en code machine pendant l&#39;exécution, seulement pour les fonctions chaudes.<\/p>\n"},{"n":"introduction-js","k":2,"ch":"introduction-js","q":"<p>Les étapes du pipeline V8<\/p>\n","r":"<p>Parser → AST → interpréteur (bytecode) → profiler → compilateur optimiseur (code machine).<\/p>\n"},{"n":"introduction-js","k":3,"ch":"introduction-js","q":"<p>Moteurs JS à connaître<\/p>\n","r":"<p>V8 (Chrome, Edge, Node.js), SpiderMonkey (Firefox), JavaScriptCore (Safari).<\/p>\n"},{"n":"introduction-js","k":4,"ch":"introduction-js","q":"<p>Le DOM fait-il partie de JS ?<\/p>\n","r":"<p>Non : c&#39;est une Web API du navigateur (C++), exposée via document.<\/p>\n"},{"n":"introduction-js","k":5,"ch":"introduction-js","q":"<p>async vs defer<\/p>\n","r":"<p>async : exécuté dès la fin du téléchargement, ordre non garanti. defer : exécuté après tout le HTML, dans l&#39;ordre.<\/p>\n"},{"n":"introduction-js","k":6,"ch":"introduction-js","q":"<p>Typage de JavaScript<\/p>\n","r":"<p>Dynamique (type fixé à l&#39;exécution) et faible (conversions implicites).<\/p>\n"},{"n":"introduction-js","k":7,"ch":"introduction-js","q":"<p>Mono-thread, conséquence<\/p>\n","r":"<p>Une seule Call Stack : une boucle lourde fige toute l&#39;interface.<\/p>\n"},{"n":"variables-types","k":8,"ch":"variables-types","q":"<p>var, let, const : portées<\/p>\n","r":"<p>var → fonction (ignore les blocs). let et const → bloc {}.<\/p>\n"},{"n":"variables-types","k":9,"ch":"variables-types","q":"<p>Accès à une var avant sa déclaration<\/p>\n","r":"<p>undefined (seule la déclaration est hissée).<\/p>\n"},{"n":"variables-types","k":10,"ch":"variables-types","q":"<p>Accès à un let avant sa déclaration<\/p>\n","r":"<p>ReferenceError : la variable est dans la Temporal Dead Zone.<\/p>\n"},{"n":"variables-types","k":11,"ch":"variables-types","q":"<p>Règle d&#39;or du prof sur const<\/p>\n","r":"<p>const par défaut ; let seulement si la valeur doit changer (ex. compteur de boucle).<\/p>\n"},{"n":"variables-types","k":12,"ch":"variables-types","q":"<p>Les 7 types primitifs<\/p>\n","r":"<p>number, bigint, string, boolean, undefined, null, symbol.<\/p>\n"},{"n":"variables-types","k":13,"ch":"variables-types","q":"<p>undefined vs null<\/p>\n","r":"<p>undefined : déclarée sans valeur (état par défaut du moteur). null : vide volontaire, mis par le développeur.<\/p>\n"},{"n":"variables-types","k":14,"ch":"variables-types","q":"<p>5 + &quot;5&quot; et 5 - &quot;2&quot;<\/p>\n","r":"<p>&quot;55&quot; (concaténation) et 3 (conversion en nombre).<\/p>\n"},{"n":"variables-types","k":15,"ch":"variables-types","q":"<p>== vs ===<\/p>\n","r":"<p>== compare après conversion. === compare valeur ET type, sans conversion.<\/p>\n"},{"n":"variables-types","k":16,"ch":"variables-types","q":"<p>let b = obj (objet) copie quoi ?<\/p>\n","r":"<p>Seulement la référence : les deux variables pointent vers le même objet.<\/p>\n"},{"n":"controle-fonctions","k":17,"ch":"controle-fonctions","q":"<p>Les 6 valeurs falsy<\/p>\n","r":"<p>false, 0, &quot;&quot; (chaîne vide), null, undefined, NaN.<\/p>\n"},{"n":"controle-fonctions","k":18,"ch":"controle-fonctions","q":"<p>[] et {} dans un if<\/p>\n","r":"<p>Truthy ! Tester tab.length ou Object.keys(obj).length.<\/p>\n"},{"n":"controle-fonctions","k":19,"ch":"controle-fonctions","q":"<p>switch : quel type d&#39;égalité ?<\/p>\n","r":"<p>Stricte (===).<\/p>\n"},{"n":"controle-fonctions","k":20,"ch":"controle-fonctions","q":"<p>Rôle de break dans un switch<\/p>\n","r":"<p>Empêche le fall-through (exécution des case suivants).<\/p>\n"},{"n":"controle-fonctions","k":21,"ch":"controle-foncti       }
    });
    dessinerMaths(log); log.scrollTop = 1e9;
  }
  function renderList() {
    const q = norm($('#mztQ').value || ''); const ts = [...ST.threads].reverse().filter((t) => !q || norm(t.msgs.map((m) => m.t).join(' ')).includes(q));
    $('#mztList').innerHTML = ts.length ? ts.map((t) => `<details class="mzt-item"><summary>${esc(t.title)}</summary><div class="mzt-meta">${esc(t.sec)} · ${esc(t.date)}</div>${t.msgs.map((m) => `<div class="mzt-m ${m.r === 'u' ? 'u' : 'a'}" style="margin:6px 0">${m.r === 'u' ? esc(m.t) : md(m.t)}</div>`).join('')}<button type="button" data-cont="${esc(t.id)}">Continuer cette discussion</button></details>`).join('')
      : `<p class="mzt-note">${ST.threads.length ? 'Aucune discussion ne contient ce mot.' : 'Aucune discussion pour l\'instant.'}</p>`;
    dessinerMaths($('#mztList'));
  }
  function renderMem() {
    $('#mztMemL').innerHTML = ST.memos.length ? ST.memos.map((m, i) => `<div class="mzt-item"><div class="mzt-meta">${esc(m.date)}</div>${esc(m.text)}<div><button type="button" data-memdel="${i}" style="margin-top:4px">Effacer</button></div></div>`).join('')
      : '<p class="mzt-note">Aucune note pour l\'instant. Elles apparaîtront au fil de tes questions.</p>';
  }

  // ---------- stockage compte ----------
  async function saveThread(t) {
    saveLocal(); if (!db) return;
    try { await db.collection(base + '/threads').doc(t.id).set({ sec: t.sec, date: t.date, title: t.title, msgs: t.msgs.slice(-40) }); } catch (e) {}
  }
  async function saveMemos() { saveLocal(); if (!db) return; try { await db.doc(base).set({ memos: ST.memos.slice(-30), updated: Date.now() }); } catch (e) {} }

  // ---------- appel au tuteur ----------
  const ERR = { not_granted: 'Tu n\'as pas autorisé la page à utiliser Claude. Recharge-la et accepte la demande, ou change-le dans le menu Autorisations de l\'artifact.', rate_limited: 'Trop de questions d\'un coup, ou limite d\'usage atteinte. Réessaie dans un moment.', prompt_too_large: 'L\'extrait est trop long : ouvre une partie plus précise du cours.', image_rejected: 'Cette photo n\'est pas acceptée. Essaie un JPEG ou un PNG plus léger.', refused: 'Claude n\'a pas pu répondre à cette demande. Reformule ta question.' };
  const visible = (t) => {
    const L = String(t).split('\n');
    for (let i = L.length - 1; i >= Math.max(0, L.length - 3); i--) if (/^\s*M[ÉE]MO\s*:/i.test(L[i])) return L.slice(0, i).join('\n').trim();
    return String(t).trim();
  };
  // rendu léger : on échappe le HTML d'abord, puis gras, italique, code, titres, puces, tableaux et blocs de code.
  // Les formules ($…$, $$…$$, \(…\), \[…\]) sont mises de côté avant le Markdown, puis dessinées par MathJax.
  const MATHS = [];
  const protegerMaths = (t) => {
    MATHS.length = 0;
    const garde = (tex, d) => { MATHS.push({ tex: tex.trim(), d }); return '\u0000' + (MATHS.length - 1) + '\u0000'; };
    const RX = /\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$(?=[^\s$\d])([^$\n]*?[^\s$\\])\$(?!\d)/g;
    // le code (blocs ``` et `…`) n'est jamais lu comme une formule
    return String(t).split(/(```[\s\S]*?(?:```|$))/).map((bloc, i) => i % 2 ? bloc
      : bloc.split(/(`[^`\n]*`)/).map((x, j) => j % 2 ? x : x.replace(RX, (_, a, b, c, d) => a != null ? garde(a, 1) : b != null ? garde(b, 1) : c != null ? garde(c, 0) : garde(d, 0))).join('')).join('');
  };
  const rendreMaths = (h) => h.replace(/\u0000(\d+)\u0000/g, (_, n) => { const m = MATHS[+n]; return m ? `<span class="mzt-tex${m.d ? ' d' : ''}" data-d="${m.d}">${esc(m.tex)}</span>` : ''; });
  const inl = (s) => {
    const p = s.split('`'); if (p.length % 2 === 0) { const last = p.pop(); p[p.length - 1] += '`' + last; }
    return p.map((x, i) => i % 2 ? '<code>' + esc(x) + '</code>' : esc(x).replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*\w])\*([^*\n]+)\*(?![*\w])/g, '$1<em>$2</em>')).join('');
  };
  const cellules = (l) => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim());
  const md = (t) => {
    const out = []; let list = null, code = null, tab = null, olN = 0;
    const flushTab = () => {
      if (!tab) return;
      if (tab.length >= 2 && /^[\s|:-]+$/.test(tab[1]) && tab[1].includes('-')) {
        const [tete, , ...corps] = tab;
        out.push('<div class="mzt-tab"><table><thead><tr>' + cellules(tete).map((c) => '<th>' + inl(c) + '</th>').join('') + '</tr></thead><tbody>'
          + corps.map((r) => '<tr>' + cellules(r).map((c) => '<td>' + inl(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>');
      } else tab.forEach((r) => out.push('<p>' + inl(r) + '</p>'));
      tab = null;
    };
    const flush = () => { flushTab(); if (list) { out.push('</' + list + '>'); list = null; } };
    protegerMaths(t).split('\n').forEach((raw) => {
      if (/^\s*```/.test(raw)) { if (code === null) { flush(); code = []; } else { out.push('<pre>' + esc(code.join('\n')) + '</pre>'); code = null; } return; }
      if (code !== null) { code.push(raw); return; }
      let m;
      if (/^\s*\|.*\|\s*$/.test(raw)) { if (list) { out.push('</' + list + '>'); list = null; } (tab = tab || []).push(raw); return; }
      flushTab();
      if ((m = raw.match(/^\s*#{1,6}\s+(.*)$/))) { flush(); olN = 0; out.push('<p><strong>' + inl(m[1]) + '</strong></p>'); }
      else if ((m = raw.match(/^\s*[-*•]\s+(.*)$/))) { if (list !== 'ul') { flush(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + inl(m[1]) + '</li>'); }
      else if ((m = raw.match(/^\s*(\d+)[.)]\s+(.*)$/))) { if (list !== 'ol') { flush(); const n = +m[1]; olN = (n === 1 && olN > 1) ? olN : n; out.push('<ol start="' + olN + '">'); list = 'ol'; } out.push('<li>' + inl(m[2]) + '</li>'); olN++; }
      else if (!raw.trim()) flush();
      else { flush(); out.push('<p>' + inl(raw) + '</p>'); }
    });
    if (code !== null) out.push('<pre>' + esc(code.join('\n')) + '</pre>');
    flush(); return rendreMaths(out.join(''));
  };

  // ---------- MathJax : celui de la page s'il existe, sinon chargé à la première formule ----------
  let mjPret = null;
  const mathjax = () => mjPret || (mjPret = new Promise((ok, ko) => {
    if (!window.MathJax) {
      window.MathJax = { svg: { fontCache: 'global' }, startup: { typeset: false } };
      const s = document.createElement('script'); s.async = true; s.src = 'https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js';
      s.onerror = () => ko(new Error('MathJax')); document.head.appendChild(s);
    }
    let n = 0; const t = setInterval(() => {
      if (window.MathJax && MathJax.tex2svgPromise && MathJax.startup && MathJax.startup.promise) { clearInterval(t); MathJax.startup.promise.then(ok, ko); }
      else if (++n > 150) { clearInterval(t); ko(new Error('MathJax')); }
    }, 100);
  })).catch((e) => { mjPret = null; throw e; });
  const svgCache = new Map(); let file = Promise.resolve();
  function dessinerMaths(racine) {
    const spans = [...racine.querySelectorAll('.mzt-tex:not([data-ok])')]; if (!spans.length) return;
    mathjax().then(() => spans.forEach((sp) => {
      const cle = sp.dataset.d + '|' + sp.textContent;
      const poser = (n) => { if (!sp.isConnected || sp.dataset.ok) return; sp.textContent = ''; sp.appendChild(n.cloneNode(true)); sp.dataset.ok = '1'; };
      if (svgCache.has(cle)) return poser(svgCache.get(cle));
      file = file.then(() => MathJax.tex2svgPromise(sp.textContent, { display: sp.dataset.d === '1' }).then((n) => { svgCache.set(cle, n); poser(n); })).catch(() => {});
    })).catch(() => {});
  }
  async function ask(q, deep) {
    q = (q || '').trim(); deep = deep || $('#mztDeep').checked;
    if (busy || !q) return; if (!sample) { note(); return; }
    const c = refreshCtx();
    if (!cur || (cur.sec !== c.label && !forced)) { cur = { id: 't' + Date.now().toString(36), sec: c.label, date: today(), title: q.slice(0, 80), msgs: [] }; ST.threads.push(cur); }
    else if (!ST.threads.includes(cur)) ST.threads.push(cur);
    cur.msgs.push({ r: 'u', t: q }); busy = true; renderLog();
    const out = document.createElement('div'); out.className = 'mzt-m a'; out.textContent = deep ? 'Réflexion approfondie…' : 'Réflexion…'; $('#mztLog').appendChild(out);
    $('#mztSend').disabled = true; $('#mztStop').hidden = false;
    const style = deep
      ? 'Réponse APPROFONDIE (400 à 700 mots) : 1) l\'intuition avec une analogie, 2) l\'explication détaillée pas à pas, 3) pourquoi ça marche, 4) un exemple complet chiffré, 5) les pièges fréquents et ce qui tombe à l\'examen, 6) une question pour vérifier la compréhension.'
      : 'Réponse EXPLICATIVE (150 à 250 mots) : 1) l\'idée en une phrase, 2) l\'explication pas à pas, 3) un petit exemple chiffré ou concret, 4) une courte question pour vérifier la compréhension.';
    const mem = [];
    if (ST.memos.length) mem.push('DIFFICULTÉS DÉJÀ REPÉRÉES :\n' + ST.memos.slice(-12).map((m) => `- ${m.date} : ${m.text}`).join('\n'));
    const lastQ = ST.threads.flatMap((t) => t.msgs.filter((m) => m.r === 'u').map((m) => `[${t.sec}] ${m.t.slice(0, 100)}`)).slice(-6);
    if (lastQ.length) mem.push('SES DERNIÈRES QUESTIONS :\n' + lastQ.map((x) => '- ' + x).join('\n'));
    const rules = `Tu es le tuteur de ${C.student}, pour le module ${C.module}${C.prof ? ' du ' + C.prof : ''}. Il apprend souvent la notion pour la première fois.
Règles : réponds en français simple, en Markdown léger (**gras** pour les termes clés, tirets, étapes numérotées). Toute formule ou tout calcul s'écrit en LaTeX : $…$ dans la phrase, $$…$$ seul sur sa ligne pour une formule importante (ex. $\\hat y_i$, $$\\text{MSE}=\\frac{1}{n}\\sum_{i=1}^{n}(y_i-\\hat y_i)^2$$) ; jamais d'accents graves pour une formule, ils sont réservés au code et aux noms de fonctions. Un petit tableau Markdown est permis s'il clarifie (3 colonnes maximum, l'écran est étroit). ${style} Appuie-toi d'abord sur l'EXTRAIT ci-dessous et sur les conventions du prof ; si une source générale diffère du cours, signale l'écart et dis quelle version utiliser à l'examen (celle du prof). Pour un calcul, pose chaque étape et vérifie-la. S'il envoie une réponse ou une photo de brouillon, corrige étape par étape et nomme précisément l'erreur. Si tu n'es pas sûr, dis-le. S'il demande un mini-exercice, donne l'exercice sans la solution.
Utilise sa mémoire pour faire des liens avec ses confusions passées, sans la réciter.
Termine TOUJOURS par une dernière ligne séparée au format exact « MÉMO: … » qui résume en 15 mots maximum la difficulté révélée par sa question (ou « MÉMO: rien »). Cette ligne lui est cachée.
${C.conventions ? 'CONVENTIONS DU PROF : ' + C.conventions + '\n' : ''}MÉMOIRE DE L'ÉLÈVE :
${mem.join('\n\n') || '(rien pour l\'instant)'}
EXTRAIT (${c.label}) :
${c.text.slice(0, deep ? 9000 : 3500)}`;
    const recent = cur.msgs.slice(deep ? -9 : -5, -1).map((m) => ({ role: m.r === 'u' ? 'user' : 'assistant', content: m.t }));
    while (recent.length && recent[0].role !== 'user') recent.shift();
    const msgs = [...recent.filter((m) => m.content && m.content.trim()), { role: 'user', content: q }]; while (msgs.length > 1 && msgs[0].role !== 'user') msgs.shift(); msgs[0] = { role: 'user', content: rules + '\n\n---\nQuestion : ' + msgs[0].content };
    ctl = new AbortController();
    const opts = { modelTier: deep ? 'complex' : 'quick', cache: false, signal: ctl.signal, onText: ({ text }) => { out.innerHTML = md(visible(text)); dessinerMaths(out); $('#mztLog').scrollTop = 1e9; } };
    if (img) opts.images = [img];
    try {
      const r = await sample(msgs, opts);
      const mm = r.text.match(/(?:^|\n)\s*M[ÉE]MO\s*:\s*(.+)\s*$/i);
      cur.msgs.push({ r: 'a', t: visible(r.text) + (r.truncated ? '\n\n(Réponse coupée : pose une question plus ciblée.)' : ''), d: !!deep });
      if (mm && !/^\s*rien/i.test(mm[1])) { ST.memos.push({ date: today(), text: mm[1].trim().slice(0, 160) }); if (ST.memos.length > 30) ST.memos.shift(); saveMemos(); }
      await saveThread(cur);
    } catch (e) {
      const kept = e && e.text ? visible(e.text) : '';
      if (e && e.code === 'cancelled') { if (kept) cur.msgs.push({ r: 'a', t: kept + '\n(Arrêté.)' }); else cur.msgs.pop(); }
      else { cur.msgs.pop(); compacter(!!cur.msgs.length); out.textContent = (kept ? kept + '\n\n' : '') + (ERR[e && e.code] || 'Le tuteur n\'a pas pu répondre. Réessaie dans un instant.'); }
      if (!cur.msgs.length) ST.threads = ST.threads.filter((t) => t !== cur);
      saveLocal();
      if (!(e && e.code === 'cancelled')) { busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImgN').textContent = ''; return; }
    }
    busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImg').value = ''; $('#mztImgN').textContent = ''; renderLog();
  }

  // ---------- événements ----------
  $('#mztBtn').onclick = () => openPanel(null);
  $('#mztX').onclick = closePanel;
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#mztPan').hidden) closePanel(); });
  $('#mztTabH').onclick = () => view($('#mztHist').hidden ? 'hist' : 'chat');
  $('#mztTabM').onclick = () => view($('#mztMem').hidden ? 'mem' : 'chat');
  $('#mztQ').oninput = renderList;
  $('#mztList').onclick = (e) => { const id = e.target.dataset && e.target.dataset.cont; if (!id) return; cur = ST.threads.find((t) => t.id === id); view('chat'); $('#mztCtx').textContent = '· ' + cur.sec; renderLog(); };
  $('#mztMemL').onclick = (e) => { const i = e.target.dataset && e.target.dataset.memdel; if (i == null) return; ST.memos.splice(+i, 1); saveMemos(); renderMem(); };
  $('#mztChips').onclick = (e) => { const b = e.target.closest('[data-chip]'); if (!b) return; const t = $('#mztIn'); t.value = b.dataset.chip + (t.value ? ' : ' + t.value : ''); t.focus(); };
  $('#mztNew').onclick = () => { cur = null; renderLog(); };
  $('#mztStop').onclick = () => { if (ctl) ctl.abort(); };
  $('#mztImg').onchange = (e) => { img = e.target.files[0] || null; $('#mztImgN').textContent = img ? 'Photo : ' + img.name : ''; };
  $('#mztF').onsubmit = (e) => { e.preventDefault(); const v = $('#mztIn').value; $('#mztIn').value = ''; ask(v); };
  $('#mztIn').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#mztF').requestSubmit(); } });

  // ---------- capacités (facultatives) ----------
  const W = window.claude;
  if (W && W.use) {
    W.use('sample').then((s) => { sample = s; ready = true; note();
      if (s && s.limits) s.limits().then((l) => { if (l && l.images) { imgOK = true; $('#mztImgL').hidden = false; if (l.images.mediaTypes) $('#mztImg').accept = l.images.mediaTypes.join(','); } }).catch(() => {});
    }).catch(() => { ready = true; note(); });
    Promise.all([W.use('db'), W.use('user')]).then(async ([d, u]) => {
      if (!d || !u) return; const id = await u.id(); if (!id) return; db = d; base = 'data/users/' + id + '/mzt_' + C.id;
      try {
        const m = await db.doc(base).get(); if (m.exists) { const v = m.data() || {}; if (Array.isArray(v.memos)) ST.memos = JSON.parse(JSON.stringify(v.memos)); }
        const q = await db.collection(base + '/threads').get(); const remote = q.docs.map((x) => Object.assign({ id: x.id }, JSON.parse(JSON.stringify(x.data() || {}))));
        const map = {}; [...ST.threads, ...remote].forEach((t) => { if (!map[t.id] || (t.msgs || []).length > (map[t.id].msgs || []).length) map[t.id] = t; });
        ST.threads = Object.values(map).sort((a, b) => parseInt(a.id.slice(1), 36) - parseInt(b.id.slice(1), 36)); saveLocal();
      } catch (e) {}
    }).catch(() => {});
  } else { ready = true; note(); }

  window.MZT = { open: openPanel, close: closePanel };
})();

</script>

if(window.top===window&&location.protocol==="file:"){a.hidden=true;return}
a.href=p.indexOf("/decouvrir")===0||location.pathname.indexOf("/decouvrir")===0?"/decouvrir":"/app/modules";})();</script>
