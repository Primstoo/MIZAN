const MODULE={"slug":"optique-radioactivite","titre":"Optique géométrique et radioactivité","cle":"optique-radioactivite_scores","cleEtat":"optique-radioactivite_scores_etat","format":"score10","intro":"<p>Ce module suit <strong>le cours et les séries 1 à 3<\/strong> de la FST Béni Mellal (optique géométrique, puis radioactivité) et se termine par <strong>les deux examens 2021 corrigés<\/strong> (normale et rattrapage).<\/p>\n<p><strong>Comment l&#39;utiliser<\/strong><\/p>\n<ol>\n<li>Lis un chapitre, puis refais chaque construction de rayons sur papier.<\/li>\n<li>Respecte les signes : toutes les distances sont algébriques.<\/li>\n<li>Fais le QCM du chapitre. <strong>8/10 = chapitre maîtrisé.<\/strong><\/li>\n<\/ol>\n<p><strong>À vérifier<\/strong> : certaines figures des sujets manquent dans les fichiers fournis ; les questions qui en dépendent sont traitées par la méthode.<\/p>\n","annexes":[],"cartes":null,"maths":true};
const CHAPS=[{"id":"fermat-descartes","t":"Principe de Fermat et lois de Descartes","seance":"Chapitres 1 et 2 · Série 1","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut connaître l&#39;indice d&#39;un milieu : $n = \\frac{c}{v}$, toujours ≥ 1.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>La lumière va à $2\\cdot10^8$ m/s dans un verre. Son indice ($c = 3\\cdot10^8$ m/s) ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1.5<\/b><\/p><p>$n = 3/2 = 1{,}5$.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « la lumière est paresseuse ».<\/strong> Elle prend le chemin dont la durée est stationnaire (minimale le plus souvent) : c&#39;est le principe de Fermat. Les lois de Descartes en découlent.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Mesurer les angles par rapport à la surface. Les angles d&#39;incidence et de réfraction se mesurent par rapport à la <strong>normale<\/strong>.<\/p>\n<\/aside><p>À la fin, tu sais appliquer Descartes et prévoir une réflexion totale.<\/p>\n<h2>Idée 1 · Les lois de Descartes<\/h2>\n<svg viewBox=\"0 0 320 140\" role=\"img\" aria-label=\"Rayon incident, réfléchi et réfracté de part et d'autre de la normale\" style=\"max-width:360px;width:100%\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M20 70h280\"/><path d=\"M160 10v120\" stroke-dasharray=\"4 4\"/><path d=\"M90 15L160 70L230 15\"/><path d=\"M160 70L195 130\" stroke=\"#D9824F\"/><\/g>\n<g fill=\"currentColor\" font-size=\"11\"><text x=\"128\" y=\"45\">i<\/text><text x=\"178\" y=\"45\">i'<\/text><text x=\"168\" y=\"110\">r<\/text><text x=\"24\" y=\"62\">n₁<\/text><text x=\"24\" y=\"88\">n₂<\/text><\/g>\n<\/svg><figure class=\"grille\"><figcaption>Les deux lois<\/figcaption><table><tr><th>Phénomène,<\/th><th>Loi<\/th><\/tr><tr><td class=\"h1\">Réflexion,<\/td><td>i'<\/td><td>=<\/td><td>i<\/td><td>(dans<\/td><td>le<\/td><td>plan<\/td><td>d'incidence)<\/td><\/tr><tr><td class=\"h1\">Réfraction,<\/td><td>n₁<\/td><td>sin<\/td><td>i<\/td><td>=<\/td><td>n₂<\/td><td>sin<\/td><td>r<\/td><\/tr><\/table><\/figure><h2>Idée 2 · La réflexion totale<\/h2>\n<p>Si $n_1 &gt; n_2$, le rayon réfracté s&#39;écarte de la normale. Au-delà de l&#39;angle limite $\\lambda$ tel que $\\sin\\lambda = \\frac{n_2}{n_1}$, il n&#39;y a plus de réfraction : tout est réfléchi.<\/p>\n<p><strong>Exemple.<\/strong> Verre ($n = 1{,}5$) vers air : $\\sin\\lambda = \\frac{1}{1{,}5}$, $\\lambda \\approx 41{,}8°$.<\/p>\n<h2>Idée 3 · Retrouver Descartes avec Fermat (série 1)<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Méthode<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · 1. Écris la durée $t = \\frac{AI}{v_1} + \\frac{IB}{v_2}$ en fonction de la position de I.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · 2. Dérive par rapport à la position de I et pose $dt = 0$.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · 3. Une des équations impose que A, I, B soient dans un même plan (plan d&#39;incidence).<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · 4. L&#39;autre donne $\\frac{\\sin i}{v_1} = \\frac{\\sin r}{v_2}$, soit $n_1\\sin i = n_2\\sin r$.<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Série 1<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Ex. 4 : rayon incident à 45° de la face d&#39;un cube, réfracté à 60° de la face. Indice ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1.41<\/b><\/p><p>Angles mesurés à la normale : i = 90° − 45° = 45° dans l&#39;air et r = 90° − 60° = 30° dans le plastique (le rayon réfracté se rapproche de la normale). $n = \\frac{\\sin 45°}{\\sin 30°} = \\sqrt2 \\approx 1{,}41$ et $v = c/n \\approx 2{,}12\\cdot10^8$ m/s.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Ex. 3 : combien d&#39;images d&#39;un point A voit-on dans deux miroirs perpendiculaires ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 3<\/b><\/p><p>Trois : A₁ (dans M₁), A₂ (dans M₂) et A₁₂ = A₂₁ (image double, symétrique de A par rapport à l&#39;arête).<\/p>\n<\/div><\/div><\/section><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Dans la figure de l&#39;exercice 4, les angles 60° et 45° sont mesurés par rapport à la face ; la figure n&#39;étant pas dans le fichier, on a retenu la seule lecture physiquement possible.<\/p>\n<\/aside><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Les angles se mesurent par rapport à :<\/div><button class=\"opt\" data-o=\"0\">la surface<\/button><button class=\"opt\" data-o=\"1\">la normale<\/button><button class=\"opt\" data-o=\"2\">l&#39;axe optique<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">En passant de l&#39;air au verre, le rayon :<\/div><button class=\"opt\" data-o=\"0\">se rapproche de la normale<\/button><button class=\"opt\" data-o=\"1\">s&#39;en écarte<\/button><button class=\"opt\" data-o=\"2\">n&#39;est pas dévié<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">La réflexion totale est possible :<\/div><button class=\"opt\" data-o=\"0\">de l&#39;air vers l&#39;eau<\/button><button class=\"opt\" data-o=\"1\">de l&#39;eau vers l&#39;air<\/button><button class=\"opt\" data-o=\"2\">toujours<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Angle limite verre-air ($n = 1{,}5$) :<\/div><button class=\"opt\" data-o=\"0\">30°<\/button><button class=\"opt\" data-o=\"1\">≈ 42°<\/button><button class=\"opt\" data-o=\"2\">60°<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">L&#39;angle de réflexion vaut :<\/div><button class=\"opt\" data-o=\"0\">l&#39;angle d&#39;incidence<\/button><button class=\"opt\" data-o=\"1\">son double<\/button><button class=\"opt\" data-o=\"2\">90° moins l&#39;incidence<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Le principe de Fermat porte sur :<\/div><button class=\"opt\" data-o=\"0\">le chemin optique<\/button><button class=\"opt\" data-o=\"1\">l&#39;intensité<\/button><button class=\"opt\" data-o=\"2\">la couleur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Un indice de 1,33 correspond à :<\/div><button class=\"opt\" data-o=\"0\">l&#39;eau<\/button><button class=\"opt\" data-o=\"1\">le diamant<\/button><button class=\"opt\" data-o=\"2\">le vide<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">La vitesse de la lumière dans un milieu d&#39;indice 2 :<\/div><button class=\"opt\" data-o=\"0\">$6\\cdot10^8$ m/s<\/button><button class=\"opt\" data-o=\"1\">$1{,}5\\cdot10^8$ m/s<\/button><button class=\"opt\" data-o=\"2\">$3\\cdot10^8$ m/s<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Incident, réfléchi, réfracté et normale sont :<\/div><button class=\"opt\" data-o=\"0\">dans un même plan<\/button><button class=\"opt\" data-o=\"1\">dans trois plans différents<\/button><button class=\"opt\" data-o=\"2\">toujours parallèles<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Sous incidence normale (i = 0), le rayon réfracté :<\/div><button class=\"opt\" data-o=\"0\">n&#39;est pas dévié<\/button><button class=\"opt\" data-o=\"1\">est réfléchi totalement<\/button><button class=\"opt\" data-o=\"2\">est dévié de 90°<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"fermat-descartes","rep":["1.5"],"tol":null},{"n":"fermat-descartes","rep":["1.41"],"tol":null},{"n":"fermat-descartes","rep":["3"],"tol":null}],"qcm":[{"n":"fermat-descartes","q":"Les angles se mesurent par rapport à :","o":["la surface","la normale","l&#39;axe optique"],"a":1,"e":"Toujours la normale."},{"n":"fermat-descartes","q":"En passant de l&#39;air au verre, le rayon :","o":["se rapproche de la normale","s&#39;en écarte","n&#39;est pas dévié"],"a":0,"e":"$n_2 &gt; n_1$."},{"n":"fermat-descartes","q":"La réflexion totale est possible :","o":["de l&#39;air vers l&#39;eau","de l&#39;eau vers l&#39;air","toujours"],"a":1,"e":"Il faut $n_1 &gt; n_2$."},{"n":"fermat-descartes","q":"Angle limite verre-air ($n = 1{,}5$) :","o":["30°","≈ 42°","60°"],"a":1,"e":"$\\arcsin(2/3)$."},{"n":"fermat-descartes","q":"L&#39;angle de réflexion vaut :","o":["l&#39;angle d&#39;incidence","son double","90° moins l&#39;incidence"],"a":0,"e":"i&#39; = i."},{"n":"fermat-descartes","q":"Le principe de Fermat porte sur :","o":["le chemin optique","l&#39;intensité","la couleur"],"a":0,"e":"Durée stationnaire."},{"n":"fermat-descartes","q":"Un indice de 1,33 correspond à :","o":["l&#39;eau","le diamant","le vide"],"a":0,"e":"Le diamant vaut 2,42."},{"n":"fermat-descartes","q":"La vitesse de la lumière dans un milieu d&#39;indice 2 :","o":["$6\\cdot10^8$ m/s","$1{,}5\\cdot10^8$ m/s","$3\\cdot10^8$ m/s"],"a":1,"e":"$c/n$."},{"n":"fermat-descartes","q":"Incident, réfléchi, réfracté et normale sont :","o":["dans un même plan","dans trois plans différents","toujours parallèles"],"a":0,"e":"Plan d&#39;incidence."},{"n":"fermat-descartes","q":"Sous incidence normale (i = 0), le rayon réfracté :","o":["n&#39;est pas dévié","est réfléchi totalement","est dévié de 90°"],"a":0,"e":"sin r = 0."}]},{"id":"miroirs","t":"Miroirs plans et sphériques","seance":"Chapitre III · Série 2, exercice 1","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut manipuler des distances <strong>algébriques<\/strong> : $\\overline{SA}$ est positive si on va de S à A dans le sens de la lumière, négative sinon.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>La lumière va vers la droite. A est 4 cm à gauche de S. Que vaut $\\overline{SA}$ ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : -4<\/b><\/p><p>$\\overline{SA} = -4$ cm.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « une formule, des signes ».<\/strong> Toute la difficulté est dans les signes. Pose les valeurs algébriques avant de remplacer.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Pour un miroir concave éclairé par la gauche, le centre C est du côté de la lumière : $\\overline{SC} &lt; 0$. Beaucoup prennent R positif et tout le reste devient faux.<\/p>\n<\/aside><p>À la fin, tu sais trouver l&#39;image donnée par un miroir sphérique et son grandissement.<\/p>\n<h2>Idée 1 · Le miroir plan<\/h2>\n<p>L&#39;image est symétrique de l&#39;objet par rapport au miroir, de même taille, virtuelle pour un objet réel.<\/p>\n<h2>Idée 2 · Le miroir sphérique<\/h2>\n<svg viewBox=\"0 0 320 130\" role=\"img\" aria-label=\"Miroir concave, axe optique, centre C et foyer F au milieu de SC\" style=\"max-width:380px;width:100%\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M10 65h300\"/><path d=\"M270 10q-30 55 0 110\" stroke=\"#D9824F\" stroke-width=\"3\"/><\/g>\n<g fill=\"currentColor\" font-size=\"11\"><circle cx=\"110\" cy=\"65\" r=\"3\"/><circle cx=\"185\" cy=\"65\" r=\"3\"/><circle cx=\"258\" cy=\"65\" r=\"3\"/><text x=\"105\" y=\"82\">C<\/text><text x=\"180\" y=\"82\">F<\/text><text x=\"262\" y=\"82\">S<\/text><text x=\"20\" y=\"55\">lumière →<\/text><\/g>\n<\/svg><figure class=\"grille\"><figcaption>Formules (origine au sommet S)<\/figcaption><table><tr><th>Grandeur,<\/th><th>Formule<\/th><\/tr><tr><td class=\"h1\">Conjugaison,<\/td><td>1/SA'<\/td><td>+<\/td><td>1/SA<\/td><td>=<\/td><td>2/SC<\/td><\/tr><tr><td class=\"h1\">Foyer,<\/td><td>SF<\/td><td>=<\/td><td>SF'<\/td><td>=<\/td><td>SC/2<\/td><\/tr><tr><td class=\"h1\">Grandissement,<\/td><td>γ<\/td><td>=<\/td><td>−SA'/SA<\/td><\/tr><\/table><\/figure><figure class=\"etapes\" data-i=\"0\"><figcaption>Trouver une image<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · 1. Écris $\\overline{SA}$ et $\\overline{SC}$ avec leurs signes.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · 2. Conjugaison : $\\frac{1}{\\overline{SA'}} = \\frac{2}{\\overline{SC}} - \\frac{1}{\\overline{SA}}$.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · 3. Grandissement : $\\gamma = -\\overline{SA'}/\\overline{SA}$ ; γ &lt; 0 : image renversée.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · 4. Image réelle si elle est du côté de la lumière ($\\overline{SA'} &lt; 0$ pour un miroir éclairé par la gauche).<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Série 2, exercice 1<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Image réelle, renversée, 3 fois plus grande, $\\overline{AA_1} = -8$ cm. Position de l&#39;objet ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : -4<\/b><\/p><p>γ = −3 donne $\\overline{SA_1} = 3\\overline{SA}$. Alors $\\overline{AA_1} = \\overline{SA_1} - \\overline{SA} = 2\\overline{SA} = -8$, d&#39;où <strong>$\\overline{SA} = -4$ cm<\/strong> et $\\overline{SA_1} = -12$ cm.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Rayon de courbure et foyer ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : -6<\/b><\/p><p>$\\frac{2}{\\overline{SC}} = \\frac{1}{-12} + \\frac{1}{-4} = -\\frac{1}{3}$, donc <strong>$\\overline{SC} = -6$ cm<\/strong> et $\\overline{SF} = -3$ cm.<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Le foyer d&#39;un miroir sphérique est :<\/div><button class=\"opt\" data-o=\"0\">au milieu de SC<\/button><button class=\"opt\" data-o=\"1\">en C<\/button><button class=\"opt\" data-o=\"2\">en S<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Un miroir concave éclairé par la gauche a :<\/div><button class=\"opt\" data-o=\"0\">$\\overline{SC} &lt; 0$<\/button><button class=\"opt\" data-o=\"1\">$\\overline{SC} &gt; 0$<\/button><button class=\"opt\" data-o=\"2\">$\\overline{SC} = 0$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">γ = −2 signifie :<\/div><button class=\"opt\" data-o=\"0\">image renversée, deux fois plus grande<\/button><button class=\"opt\" data-o=\"1\">image droite, deux fois plus petite<\/button><button class=\"opt\" data-o=\"2\">image virtuelle<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">L&#39;image d&#39;un objet réel dans un miroir plan est :<\/div><button class=\"opt\" data-o=\"0\">réelle<\/button><button class=\"opt\" data-o=\"1\">virtuelle<\/button><button class=\"opt\" data-o=\"2\">renversée<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Objet au centre C d&#39;un miroir concave : l&#39;image est<\/div><button class=\"opt\" data-o=\"0\">en C, renversée, même taille<\/button><button class=\"opt\" data-o=\"1\">à l&#39;infini<\/button><button class=\"opt\" data-o=\"2\">en F<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Objet au foyer F : l&#39;image est<\/div><button class=\"opt\" data-o=\"0\">en S<\/button><button class=\"opt\" data-o=\"1\">à l&#39;infini<\/button><button class=\"opt\" data-o=\"2\">en C<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Le miroir convexe donne d&#39;un objet réel une image :<\/div><button class=\"opt\" data-o=\"0\">virtuelle, droite, plus petite<\/button><button class=\"opt\" data-o=\"1\">réelle, renversée<\/button><button class=\"opt\" data-o=\"2\">réelle, plus grande<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Avec $\\overline{SA} = -4$ et $\\overline{SC} = -6$, $\\overline{SA'}$ vaut :<\/div><button class=\"opt\" data-o=\"0\">−12 cm<\/button><button class=\"opt\" data-o=\"1\">−2,4 cm<\/button><button class=\"opt\" data-o=\"2\">12 cm<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">La distance focale d&#39;un miroir de rayon 20 cm :<\/div><button class=\"opt\" data-o=\"0\">20 cm<\/button><button class=\"opt\" data-o=\"1\">10 cm<\/button><button class=\"opt\" data-o=\"2\">40 cm<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Les distances algébriques sont orientées :<\/div><button class=\"opt\" data-o=\"0\">dans le sens de la lumière<\/button><button class=\"opt\" data-o=\"1\">toujours vers la droite<\/button><button class=\"opt\" data-o=\"2\">vers le haut<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"miroirs","rep":["-4"],"tol":null},{"n":"miroirs","rep":["-4"],"tol":null},{"n":"miroirs","rep":["-6"],"tol":null}],"qcm":[{"n":"miroirs","q":"Le foyer d&#39;un miroir sphérique est :","o":["au milieu de SC","en C","en S"],"a":0,"e":"$\\overline{SF} = \\overline{SC}/2$."},{"n":"miroirs","q":"Un miroir concave éclairé par la gauche a :","o":["$\\overline{SC} &lt; 0$","$\\overline{SC} &gt; 0$","$\\overline{SC} = 0$"],"a":0,"e":"C est du côté de la lumière."},{"n":"miroirs","q":"γ = −2 signifie :","o":["image renversée, deux fois plus grande","image droite, deux fois plus petite","image virtuelle"],"a":0,"e":"Signe : sens ; valeur : taille."},{"n":"miroirs","q":"L&#39;image d&#39;un objet réel dans un miroir plan est :","o":["réelle","virtuelle","renversée"],"a":1,"e":"Derrière le miroir."},{"n":"miroirs","q":"Objet au centre C d&#39;un miroir concave : l&#39;image est","o":["en C, renversée, même taille","à l&#39;infini","en F"],"a":0,"e":"γ = −1."},{"n":"miroirs","q":"Objet au foyer F : l&#39;image est","o":["en S","à l&#39;infini","en C"],"a":1,"e":"Les rayons ressortent parallèles."},{"n":"miroirs","q":"Le miroir convexe donne d&#39;un objet réel une image :","o":["virtuelle, droite, plus petite","réelle, renversée","réelle, plus grande"],"a":0,"e":"Rétroviseurs."},{"n":"miroirs","q":"Avec $\\overline{SA} = -4$ et $\\overline{SC} = -6$, $\\overline{SA'}$ vaut :","o":["−12 cm","−2,4 cm","12 cm"],"a":0,"e":"$2/(-6) - 1/(-4) = -1/12$."},{"n":"miroirs","q":"La distance focale d&#39;un miroir de rayon 20 cm :","o":["20 cm","10 cm","40 cm"],"a":1,"e":"R/2."},{"n":"miroirs","q":"Les distances algébriques sont orientées :","o":["dans le sens de la lumière","toujours vers la droite","vers le haut"],"a":0,"e":"Convention du cours."}]},{"id":"dioptres-lentilles","t":"Dioptres et lentilles","seance":"Chapitres IV et V · Série 2, exercices 2 et 3","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir additionner des inverses : $\\frac1a - \\frac1b$.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Calcule $\\frac{1}{30} - \\frac{1}{90}$ puis prends l&#39;inverse.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 45<\/b><\/p><p>$\\frac{3 - 1}{90} = \\frac{2}{90}$, inverse : 45.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense vergence.<\/strong> La vergence $V = \\frac{1}{f'}$ (en dioptries, f&#39; en mètres) s&#39;additionne pour des lentilles accolées. C&#39;est l&#39;outil le plus rapide.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Oublier le signe moins dans la conjugaison des lentilles : $\\frac{1}{\\overline{OA'}} - \\frac{1}{\\overline{OA}} = \\frac{1}{f'}$, avec $\\overline{OA} &lt; 0$ pour un objet réel.<\/p>\n<\/aside><p>À la fin, tu sais trouver l&#39;image par une lentille et la vergence d&#39;une lentille épaisse.<\/p>\n<h2>Idée 1 · Le dioptre sphérique<\/h2>\n<figure class=\"grille\"><figcaption>Formules du dioptre (origine au sommet S)<\/figcaption><table><tr><th>Grandeur,<\/th><th>Formule<\/th><\/tr><tr><td class=\"h1\">Conjugaison,<\/td><td>n₂/SA'<\/td><td>−<\/td><td>n₁/SA<\/td><td>=<\/td><td>(n₂<\/td><td>−<\/td><td>n₁)/SC<\/td><\/tr><tr><td class=\"h1\">Vergence,<\/td><td>V<\/td><td>=<\/td><td>(n₂<\/td><td>−<\/td><td>n₁)/SC<\/td><\/tr><tr><td class=\"h1\">Foyer<\/td><td>image,<\/td><td>SF'<\/td><td>=<\/td><td>n₂·SC/(n₂<\/td><td>−<\/td><td>n₁)<\/td><\/tr><tr><td class=\"h1\">Foyer<\/td><td>objet,<\/td><td>SF<\/td><td>=<\/td><td>−n₁·SC/(n₂<\/td><td>−<\/td><td>n₁)<\/td><\/tr><\/table><\/figure><h2>Idée 2 · La lentille mince<\/h2>\n<svg viewBox=\"0 0 320 130\" role=\"img\" aria-label=\"Lentille convergente : rayon parallèle passant par F', rayon passant par O non dévié\" style=\"max-width:380px;width:100%\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M10 65h300\"/><path d=\"M160 10v110\" stroke=\"#D9824F\" stroke-width=\"3\"/><path d=\"M155 15l5-5 5 5M155 115l5 5 5-5\" stroke=\"#D9824F\"/>\n<path d=\"M50 35h110l100 60\"/><path d=\"M50 35L270 101\" stroke-dasharray=\"4 4\"/><\/g>\n<g fill=\"currentColor\" font-size=\"11\"><circle cx=\"210\" cy=\"65\" r=\"3\"/><circle cx=\"110\" cy=\"65\" r=\"3\"/><text x=\"205\" y=\"82\">F'<\/text><text x=\"105\" y=\"82\">F<\/text><text x=\"164\" y=\"80\">O<\/text><text x=\"40\" y=\"30\">B<\/text><\/g>\n<\/svg><figure class=\"etapes\" data-i=\"0\"><figcaption>Image par une lentille mince<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · 1. Conjugaison : $\\frac{1}{\\overline{OA'}} = \\frac{1}{f'} + \\frac{1}{\\overline{OA}}$.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · 2. Grandissement : $\\gamma = \\frac{\\overline{OA'}}{\\overline{OA}}$.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · 3. Vérifie par la construction : le rayon par O n&#39;est pas dévié, le rayon parallèle passe par F&#39;.<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p><strong>Exemple (série 2, ex. 3).<\/strong> Objet à 90 cm devant une lentille de f&#39; = 30 cm : $\\frac{1}{\\overline{OA'}} = \\frac{1}{30} - \\frac{1}{90}$, donc $\\overline{OA'} = 45$ cm ; γ = 45/(−90) = −0,5 : image réelle, renversée, deux fois plus petite.<\/p>\n<h2>Idée 3 · Lentille épaisse : formule de Gullstrand<\/h2>\n<p>$$V = V_1 + V_2 - \\frac{e}{n}V_1V_2$$<\/p>\n<p>avec e l&#39;épaisseur et n l&#39;indice entre les deux dioptres. Pour deux lentilles minces dans l&#39;air distantes de e : $V = V_1 + V_2 - eV_1V_2$.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Série 2<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Ex. 2 : boule de verre (n = 1,5, rayon R). Où converge un faisceau parallèle ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Premier dioptre : $\\frac{1{,}5}{\\overline{S_1A_1}} = \\frac{0{,}5}{R}$ donne $\\overline{S_1A_1} = 3R$, soit R après S₂. Second dioptre : $\\frac{1}{\\overline{S_2A'}} - \\frac{1{,}5}{R} = \\frac{-0{,}5}{-R}$ donne $\\overline{S_2A'} = \\frac{R}{2}$. A&#39; est le <strong>foyer image<\/strong> de la boule, à R/2 après S₂. Par symétrie, F est à R/2 avant S₁.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Vergence d&#39;une lentille mince de f&#39; = 25 cm ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 4<\/b><\/p><p>V = 1/0,25 = 4 δ.<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Une lentille divergente a :<\/div><button class=\"opt\" data-o=\"0\">f&#39; &gt; 0<\/button><button class=\"opt\" data-o=\"1\">f&#39; &lt; 0<\/button><button class=\"opt\" data-o=\"2\">V &gt; 0<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Le rayon passant par le centre optique O :<\/div><button class=\"opt\" data-o=\"0\">n&#39;est pas dévié<\/button><button class=\"opt\" data-o=\"1\">passe par F&#39;<\/button><button class=\"opt\" data-o=\"2\">ressort parallèle<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Objet au foyer objet F d&#39;une lentille convergente : image<\/div><button class=\"opt\" data-o=\"0\">à l&#39;infini<\/button><button class=\"opt\" data-o=\"1\">en F&#39;<\/button><button class=\"opt\" data-o=\"2\">en O<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Deux lentilles minces accolées de 2 δ et 3 δ :<\/div><button class=\"opt\" data-o=\"0\">5 δ<\/button><button class=\"opt\" data-o=\"1\">6 δ<\/button><button class=\"opt\" data-o=\"2\">1,2 δ<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Vergence du dioptre air → verre ($n = 1{,}5$), $\\overline{SC} = 10$ cm :<\/div><button class=\"opt\" data-o=\"0\">5 δ<\/button><button class=\"opt\" data-o=\"1\">15 δ<\/button><button class=\"opt\" data-o=\"2\">0,05 δ<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Objet à 90 cm, f&#39; = 30 cm : l&#39;image est à<\/div><button class=\"opt\" data-o=\"0\">30 cm<\/button><button class=\"opt\" data-o=\"1\">45 cm<\/button><button class=\"opt\" data-o=\"2\">60 cm<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">γ = −0,5 signifie une image :<\/div><button class=\"opt\" data-o=\"0\">renversée, deux fois plus petite<\/button><button class=\"opt\" data-o=\"1\">droite, deux fois plus grande<\/button><button class=\"opt\" data-o=\"2\">virtuelle<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Une lentille biconcave en verre dans l&#39;air est :<\/div><button class=\"opt\" data-o=\"0\">convergente<\/button><button class=\"opt\" data-o=\"1\">divergente<\/button><button class=\"opt\" data-o=\"2\">sans effet<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Le foyer image d&#39;une boule de verre (n = 1,5) est à<\/div><button class=\"opt\" data-o=\"0\">R/2 après la boule<\/button><button class=\"opt\" data-o=\"1\">au centre<\/button><button class=\"opt\" data-o=\"2\">R avant la boule<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">1 dioptrie équivaut à :<\/div><button class=\"opt\" data-o=\"0\">1 m⁻¹<\/button><button class=\"opt\" data-o=\"1\">1 m<\/button><button class=\"opt\" data-o=\"2\">1 cm⁻¹<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"dioptres-lentilles","rep":["45"],"tol":null},{"n":"dioptres-lentilles","rep":null,"tol":null},{"n":"dioptres-lentilles","rep":["4"],"tol":null}],"qcm":[{"n":"dioptres-lentilles","q":"Une lentille divergente a :","o":["f&#39; &gt; 0","f&#39; &lt; 0","V &gt; 0"],"a":1,"e":"Vergence négative."},{"n":"dioptres-lentilles","q":"Le rayon passant par le centre optique O :","o":["n&#39;est pas dévié","passe par F&#39;","ressort parallèle"],"a":0,"e":"Propriété du centre optique."},{"n":"dioptres-lentilles","q":"Objet au foyer objet F d&#39;une lentille convergente : image","o":["à l&#39;infini","en F&#39;","en O"],"a":0,"e":"Rayons parallèles en sortie."},{"n":"dioptres-lentilles","q":"Deux lentilles minces accolées de 2 δ et 3 δ :","o":["5 δ","6 δ","1,2 δ"],"a":0,"e":"Les vergences s&#39;ajoutent."},{"n":"dioptres-lentilles","q":"Vergence du dioptre air → verre ($n = 1{,}5$), $\\overline{SC} = 10$ cm :","o":["5 δ","15 δ","0,05 δ"],"a":0,"e":"0,5 / 0,1 m."},{"n":"dioptres-lentilles","q":"Objet à 90 cm, f&#39; = 30 cm : l&#39;image est à","o":["30 cm","45 cm","60 cm"],"a":1,"e":"Exemple du chapitre."},{"n":"dioptres-lentilles","q":"γ = −0,5 signifie une image :","o":["renversée, deux fois plus petite","droite, deux fois plus grande","virtuelle"],"a":0,"e":"|γ| &lt; 1."},{"n":"dioptres-lentilles","q":"Une lentille biconcave en verre dans l&#39;air est :","o":["convergente","divergente","sans effet"],"a":1,"e":"Bords épais."},{"n":"dioptres-lentilles","q":"Le foyer image d&#39;une boule de verre (n = 1,5) est à","o":["R/2 après la boule","au centre","R avant la boule"],"a":0,"e":"Exercice 2."},{"n":"dioptres-lentilles","q":"1 dioptrie équivaut à :","o":["1 m⁻¹","1 m","1 cm⁻¹"],"a":0,"e":"V = 1/f&#39;."}]},{"id":"oeil-instruments","t":"L'œil et les instruments","seance":"Chapitre V · Œil, correction, systèmes grossissants","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir qu&#39;un petit angle en radians vaut à peu près sa tangente : $\\alpha \\approx \\frac{AB}{d}$.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Un objet de 1 cm vu à 25 cm : angle en radians ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.04<\/b><\/p><p>$\\alpha \\approx 1/25 = 0{,}04$ rad.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « l&#39;œil est une lentille dont la rétine ne bouge pas ».<\/strong> Pour voir net de près, l&#39;œil réduit sa distance focale (accommodation), pas la distance cristallin-rétine.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Corriger un myope avec une lentille convergente. Le myope voit mal de loin : il faut une lentille <strong>divergente<\/strong>, dont le foyer image est au punctum remotum.<\/p>\n<\/aside><p>À la fin, tu sais traiter un œil myope et calculer le grossissement d&#39;un système à deux lentilles.<\/p>\n<h2>Idée 1 · L&#39;œil réduit<\/h2>\n<figure class=\"grille\"><figcaption>Vocabulaire<\/figcaption><table><tr><th>Terme,<\/th><th>Sens<\/th><\/tr><tr><td class=\"h1\">Punctum<\/td><td>remotum<\/td><td>(PR),<\/td><td>point<\/td><td>le<\/td><td>plus<\/td><td>loin<\/td><td>vu<\/td><td>net<\/td><td>sans<\/td><td>accommoder<\/td><td>(infini<\/td><td>pour<\/td><td>un<\/td><td>œil<\/td><td>normal)<\/td><\/tr><tr><td class=\"h1\">Punctum<\/td><td>proximum<\/td><td>(PP),<\/td><td>point<\/td><td>le<\/td><td>plus<\/td><td>proche<\/td><td>vu<\/td><td>net<\/td><td>en<\/td><td>accommodant<\/td><td>au<\/td><td>maximum<\/td><td>(≈<\/td><td>25<\/td><td>cm)<\/td><\/tr><tr><td class=\"h1\">Myope,<\/td><td>PR<\/td><td>à<\/td><td>distance<\/td><td>finie,<\/td><td>œil<\/td><td>trop<\/td><td>convergent<\/td><\/tr><tr><td class=\"h1\">Hypermétrope,<\/td><td>œil<\/td><td>pas<\/td><td>assez<\/td><td>convergent<\/td><\/tr><\/table><\/figure><svg viewBox=\"0 0 320 110\" role=\"img\" aria-label=\"Œil réduit : lentille et rétine à distance fixe\" style=\"max-width:360px;width:100%\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M10 55h290\"/><path d=\"M150 15v80\" stroke=\"#D9824F\" stroke-width=\"3\"/><path d=\"M260 15v80\" stroke-width=\"4\"/><path d=\"M40 30L150 55L260 80\" stroke-dasharray=\"4 4\"/><\/g>\n<g fill=\"currentColor\" font-size=\"11\"><text x=\"140\" y=\"108\">cristallin<\/text><text x=\"245\" y=\"108\">rétine<\/text><text x=\"190\" y=\"48\">≈ 17 mm<\/text><\/g>\n<\/svg><h2>Idée 2 · Corriger la myopie<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Lentille de correction (accolée à l'œil)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · 1. La lentille doit donner d&#39;un objet à l&#39;infini une image au PR.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · 2. Donc son foyer image est au PR : $f' = -d_{PR}$.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · 3. Exemple : PR à 12 cm, f&#39; = −12 cm, V ≈ −8,3 δ.<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Idée 3 · Le grossissement<\/h2>\n<p>$G = \\dfrac{\\alpha'}{\\alpha}$, où α est l&#39;angle sous lequel on voit l&#39;objet à l&#39;œil nu au PP (25 cm), α&#39; l&#39;angle de l&#39;image à travers l&#39;instrument. Pour observer <strong>sans fatigue<\/strong>, l&#39;image finale est à l&#39;infini : l&#39;image intermédiaire est au foyer objet de l&#39;oculaire.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Application<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Œil myope : au repos il voit net à 12 cm avec f = 16 mm. Distance cristallin-rétine ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 18.5<\/b><\/p><p>$\\frac{1}{d'} = \\frac{1}{16} - \\frac{1}{120}$ (mm), $d' \\approx 18{,}5$ mm.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>En accommodant au maximum, f = 14,8 mm. Distance minimale de vision ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 7.5<\/b><\/p><p>$\\frac{1}{\\overline{OA}} = \\frac{1}{18{,}46} - \\frac{1}{14{,}8} \\approx -0{,}0134$, soit <strong>≈ 7,5 cm<\/strong>.<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Le myope voit mal :<\/div><button class=\"opt\" data-o=\"0\">de loin<\/button><button class=\"opt\" data-o=\"1\">de près<\/button><button class=\"opt\" data-o=\"2\">en couleur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">On corrige la myopie avec une lentille :<\/div><button class=\"opt\" data-o=\"0\">convergente<\/button><button class=\"opt\" data-o=\"1\">divergente<\/button><button class=\"opt\" data-o=\"2\">cylindrique<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Le PP d&#39;un œil normal est vers :<\/div><button class=\"opt\" data-o=\"0\">25 cm<\/button><button class=\"opt\" data-o=\"1\">1 m<\/button><button class=\"opt\" data-o=\"2\">l&#39;infini<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Pour voir de près, l&#39;œil :<\/div><button class=\"opt\" data-o=\"0\">diminue sa focale<\/button><button class=\"opt\" data-o=\"1\">avance la rétine<\/button><button class=\"opt\" data-o=\"2\">augmente sa focale<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Le PR d&#39;un œil normal est :<\/div><button class=\"opt\" data-o=\"0\">à l&#39;infini<\/button><button class=\"opt\" data-o=\"1\">à 25 cm<\/button><button class=\"opt\" data-o=\"2\">à 1 m<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Observer sans fatigue signifie :<\/div><button class=\"opt\" data-o=\"0\">image finale à l&#39;infini<\/button><button class=\"opt\" data-o=\"1\">image au PP<\/button><button class=\"opt\" data-o=\"2\">image réelle<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">PR à 50 cm : vergence de la correction<\/div><button class=\"opt\" data-o=\"0\">−2 δ<\/button><button class=\"opt\" data-o=\"1\">+2 δ<\/button><button class=\"opt\" data-o=\"2\">−0,5 δ<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Le grossissement compare :<\/div><button class=\"opt\" data-o=\"0\">deux angles<\/button><button class=\"opt\" data-o=\"1\">deux longueurs<\/button><button class=\"opt\" data-o=\"2\">deux vergences<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Distance cristallin-rétine pendant l&#39;accommodation :<\/div><button class=\"opt\" data-o=\"0\">constante<\/button><button class=\"opt\" data-o=\"1\">diminue<\/button><button class=\"opt\" data-o=\"2\">augmente<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">L&#39;hypermétrope a un œil :<\/div><button class=\"opt\" data-o=\"0\">trop convergent<\/button><button class=\"opt\" data-o=\"1\">pas assez convergent<\/button><button class=\"opt\" data-o=\"2\">normal<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"oeil-instruments","rep":["0.04"],"tol":null},{"n":"oeil-instruments","rep":["18.5"],"tol":null},{"n":"oeil-instruments","rep":["7.5"],"tol":null}],"qcm":[{"n":"oeil-instruments","q":"Le myope voit mal :","o":["de loin","de près","en couleur"],"a":0,"e":"PR à distance finie."},{"n":"oeil-instruments","q":"On corrige la myopie avec une lentille :","o":["convergente","divergente","cylindrique"],"a":1,"e":"Elle réduit la vergence de l&#39;ensemble."},{"n":"oeil-instruments","q":"Le PP d&#39;un œil normal est vers :","o":["25 cm","1 m","l&#39;infini"],"a":0,"e":"Distance minimale de vision distincte."},{"n":"oeil-instruments","q":"Pour voir de près, l&#39;œil :","o":["diminue sa focale","avance la rétine","augmente sa focale"],"a":0,"e":"Accommodation."},{"n":"oeil-instruments","q":"Le PR d&#39;un œil normal est :","o":["à l&#39;infini","à 25 cm","à 1 m"],"a":0,"e":"Vision de loin sans effort."},{"n":"oeil-instruments","q":"Observer sans fatigue signifie :","o":["image finale à l&#39;infini","image au PP","image réelle"],"a":0,"e":"L&#39;œil n&#39;accommode pas."},{"n":"oeil-instruments","q":"PR à 50 cm : vergence de la correction","o":["−2 δ","+2 δ","−0,5 δ"],"a":0,"e":"f&#39; = −0,5 m."},{"n":"oeil-instruments","q":"Le grossissement compare :","o":["deux angles","deux longueurs","deux vergences"],"a":0,"e":"α&#39;/α."},{"n":"oeil-instruments","q":"Distance cristallin-rétine pendant l&#39;accommodation :","o":["constante","diminue","augmente"],"a":0,"e":"C&#39;est la focale qui change."},{"n":"oeil-instruments","q":"L&#39;hypermétrope a un œil :","o":["trop convergent","pas assez convergent","normal"],"a":1,"e":"Il se corrige avec une lentille convergente."}]},{"id":"radioactivite","t":"Radioactivité et dosimétrie","seance":"Chapitre 6 · Partie atomique, partie nucléaire, dosimétrie","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut connaître la notation d&#39;un noyau : ${}^A_Z X$, avec Z protons et A nucléons (protons + neutrons).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Combien de neutrons dans ${}^{24}_{11}\\text{Na}$ ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 13<\/b><\/p><p>A − Z = 24 − 11 = 13.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « on conserve A et Z ».<\/strong> Toute équation de désintégration s&#39;écrit en équilibrant le haut (A) et le bas (Z) des deux côtés.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Confondre demi-vie et durée de vie totale. Après une demi-vie, il reste la <strong>moitié<\/strong> ; après deux, un quart, pas zéro.<\/p>\n<\/aside><p>À la fin, tu sais écrire une désintégration, utiliser la loi de décroissance et faire un calcul de dilution comme à l&#39;examen.<\/p>\n<h2>Idée 1 · Les désintégrations<\/h2>\n<figure class=\"grille\"><figcaption>Types de désintégration<\/figcaption><table><tr><th>Type,<\/th><th>Particule<\/th><th>émise,<\/th><th>Effet<\/th><th>sur<\/th><th>le<\/th><th>noyau<\/th><\/tr><tr><td class=\"h1\">α,<\/td><td>noyau<\/td><td>d'hélium<\/td><td>⁴₂He,<\/td><td>A<\/td><td>−<\/td><td>4<\/td><td>et<\/td><td>Z<\/td><td>−<\/td><td>2<\/td><\/tr><tr><td class=\"h1\">β⁻,<\/td><td>électron<\/td><td>⁰₋₁e<\/td><td>(+<\/td><td>antineutrino),<\/td><td>Z<\/td><td>+<\/td><td>1,<\/td><td>A<\/td><td>inchangé<\/td><\/tr><tr><td class=\"h1\">β⁺,<\/td><td>positon<\/td><td>⁰₊₁e<\/td><td>(+<\/td><td>neutrino),<\/td><td>Z<\/td><td>−<\/td><td>1,<\/td><td>A<\/td><td>inchangé<\/td><\/tr><tr><td class=\"h1\">γ,<\/td><td>photon,<\/td><td>désexcitation,<\/td><td>ni<\/td><td>A<\/td><td>ni<\/td><td>Z<\/td><td>ne<\/td><td>changent<\/td><\/tr><\/table><\/figure><p><strong>Exemple.<\/strong> ${}^{24}_{11}\\text{Na} \\to {}^{24}_{12}\\text{Mg} + {}^{0}_{-1}e$ : désintégration β⁻.<\/p>\n<h2>Idée 2 · La loi de décroissance<\/h2>\n<p>$$N(t) = N_0\\,e^{-\\lambda t}, \\qquad T = \\frac{\\ln 2}{\\lambda}, \\qquad A(t) = \\lambda N(t)$$<\/p>\n<svg viewBox=\"0 0 320 130\" role=\"img\" aria-label=\"Courbe de décroissance exponentielle : N0, N0/2 à T, N0/4 à 2T\" style=\"max-width:360px;width:100%\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M30 10v100h270\"/><path d=\"M30 20C80 60 120 80 160 88S260 104 295 107\" stroke=\"#D9824F\"/><path d=\"M30 65h70v45M30 87h130v23\" stroke-dasharray=\"3 4\"/><\/g>\n<g fill=\"currentColor\" font-size=\"10\"><text x=\"2\" y=\"24\">N₀<\/text><text x=\"0\" y=\"68\">N₀/2<\/text><text x=\"0\" y=\"90\">N₀/4<\/text><text x=\"96\" y=\"124\">T<\/text><text x=\"154\" y=\"124\">2T<\/text><\/g>\n<\/svg><p>L&#39;activité A se mesure en becquerels (1 Bq = 1 désintégration par seconde).<\/p>\n<h2>Idée 3 · Dosimétrie<\/h2>\n<figure class=\"grille\"><figcaption>Grandeurs<\/figcaption><table><tr><th>Grandeur,<\/th><th>Définition,<\/th><th>Unité<\/th><\/tr><tr><td class=\"h1\">Dose<\/td><td>absorbée<\/td><td>D,<\/td><td>énergie<\/td><td>reçue<\/td><td>par<\/td><td>kg,<\/td><td>gray<\/td><td>(Gy<\/td><td>=<\/td><td>J/kg)<\/td><\/tr><tr><td class=\"h1\">Dose<\/td><td>équivalente<\/td><td>H,<\/td><td>D<\/td><td>×<\/td><td>facteur<\/td><td>de<\/td><td>pondération<\/td><td>du<\/td><td>rayonnement,<\/td><td>sievert<\/td><td>(Sv)<\/td><\/tr><tr><td class=\"h1\">Dose<\/td><td>efficace<\/td><td>E,<\/td><td>somme<\/td><td>des<\/td><td>H<\/td><td>×<\/td><td>facteurs<\/td><td>tissulaires,<\/td><td>sievert<\/td><td>(Sv)<\/td><\/tr><\/table><\/figure><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Application<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Na 24, T = 15 h. Constante radioactive en h⁻¹ ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.0462<\/b><\/p><p>$\\lambda = \\ln2 / 15 \\approx 0{,}0462$ h⁻¹ (≈ $1{,}28\\cdot10^{-5}$ s⁻¹).<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Quelle fraction reste après 45 h ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.125<\/b><\/p><p>45 h = 3 demi-vies : $\\frac18$ = 12,5 %.<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">En α, A diminue de :<\/div><button class=\"opt\" data-o=\"0\">4<\/button><button class=\"opt\" data-o=\"1\">2<\/button><button class=\"opt\" data-o=\"2\">1<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">En β⁻, Z :<\/div><button class=\"opt\" data-o=\"0\">augmente de 1<\/button><button class=\"opt\" data-o=\"1\">diminue de 1<\/button><button class=\"opt\" data-o=\"2\">ne change pas<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Après 2 demi-vies, il reste :<\/div><button class=\"opt\" data-o=\"0\">la moitié<\/button><button class=\"opt\" data-o=\"1\">le quart<\/button><button class=\"opt\" data-o=\"2\">rien<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">$T = $<\/div><button class=\"opt\" data-o=\"0\">$\\ln2/\\lambda$<\/button><button class=\"opt\" data-o=\"1\">$\\lambda\\ln2$<\/button><button class=\"opt\" data-o=\"2\">$1/\\lambda$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">1 Bq vaut :<\/div><button class=\"opt\" data-o=\"0\">1 désintégration par seconde<\/button><button class=\"opt\" data-o=\"1\">1 J/kg<\/button><button class=\"opt\" data-o=\"2\">1 Sv<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Le gray mesure :<\/div><button class=\"opt\" data-o=\"0\">l&#39;énergie absorbée par kg<\/button><button class=\"opt\" data-o=\"1\">l&#39;activité<\/button><button class=\"opt\" data-o=\"2\">l&#39;effet biologique<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Le rayonnement γ modifie :<\/div><button class=\"opt\" data-o=\"0\">A<\/button><button class=\"opt\" data-o=\"1\">Z<\/button><button class=\"opt\" data-o=\"2\">ni A ni Z<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Le Na 24 se désintègre en :<\/div><button class=\"opt\" data-o=\"0\">Mg 24 (β⁻)<\/button><button class=\"opt\" data-o=\"1\">Ne 24 (β⁺)<\/button><button class=\"opt\" data-o=\"2\">Na 23<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">L&#39;activité d&#39;un échantillon au cours du temps :<\/div><button class=\"opt\" data-o=\"0\">décroît exponentiellement<\/button><button class=\"opt\" data-o=\"1\">reste constante<\/button><button class=\"opt\" data-o=\"2\">croît<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Plus λ est grand, plus la demi-vie est :<\/div><button class=\"opt\" data-o=\"0\">courte<\/button><button class=\"opt\" data-o=\"1\">longue<\/button><button class=\"opt\" data-o=\"2\">infinie<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"radioactivite","rep":["13"],"tol":null},{"n":"radioactivite","rep":["0.0462"],"tol":null},{"n":"radioactivite","rep":["0.125"],"tol":null}],"qcm":[{"n":"radioactivite","q":"En α, A diminue de :","o":["4","2","1"],"a":0,"e":"On perd un noyau d&#39;hélium."},{"n":"radioactivite","q":"En β⁻, Z :","o":["augmente de 1","diminue de 1","ne change pas"],"a":0,"e":"Un neutron devient proton."},{"n":"radioactivite","q":"Après 2 demi-vies, il reste :","o":["la moitié","le quart","rien"],"a":1,"e":"$(1/2)^2$."},{"n":"radioactivite","q":"$T = $","o":["$\\ln2/\\lambda$","$\\lambda\\ln2$","$1/\\lambda$"],"a":0,"e":"$1/\\lambda$ est la constante de temps."},{"n":"radioactivite","q":"1 Bq vaut :","o":["1 désintégration par seconde","1 J/kg","1 Sv"],"a":0,"e":"Unité d&#39;activité."},{"n":"radioactivite","q":"Le gray mesure :","o":["l&#39;énergie absorbée par kg","l&#39;activité","l&#39;effet biologique"],"a":0,"e":"Le sievert pondère l&#39;effet."},{"n":"radioactivite","q":"Le rayonnement γ modifie :","o":["A","Z","ni A ni Z"],"a":2,"e":"Désexcitation du noyau."},{"n":"radioactivite","q":"Le Na 24 se désintègre en :","o":["Mg 24 (β⁻)","Ne 24 (β⁺)","Na 23"],"a":0,"e":"Z passe de 11 à 12."},{"n":"radioactivite","q":"L&#39;activité d&#39;un échantillon au cours du temps :","o":["décroît exponentiellement","reste constante","croît"],"a":0,"e":"$A = \\lambda N_0 e^{-\\lambda t}$."},{"n":"radioactivite","q":"Plus λ est grand, plus la demi-vie est :","o":["courte","longue","infinie"],"a":0,"e":"T inversement proportionnel à λ."}]},{"id":"annales-2021","t":"Annales corrigées · examens 2021 (normale et rattrapage)","seance":"Optique géométrique et radioactivité, BCG section B (1 h 30)","imp":5,"payant":true,"html":"<p>Les deux vrais sujets 2020-2021 de la FST Béni Mellal. Les méthodes sont aux chapitres 2 à 5.<\/p>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Fais un sujet en 1 h 30 sur papier, puis compare.<\/p>\n<\/aside><h2>Session normale · exercice 1 (lentille biconcave épaisse)<\/h2>\n<p><strong>Énoncé.<\/strong> Lentille biconcave en verre (n = 3/2) dans l&#39;air : $\\overline{S_1C_1} = -R$, $\\overline{S_2C_2} = R$, $\\overline{S_1S_2} = R$, R = 7 cm.<\/p>\n<section class=\"exo\"><h3>Partie A<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>A-1, 2) Nature des dioptres et distances focales.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Deux dioptres concaves (divergents). D₁ (air → verre) : $f_1' = \\frac{n\\overline{S_1C_1}}{n-1} = -3R = -21$ cm, $f_1 = 2R = 14$ cm. D₂ (verre → air) : $f_2' = \\frac{\\overline{S_2C_2}}{1-n} = -2R = -14$ cm, $f_2 = 3R = 21$ cm.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>A-4, 5) Vergence (Gullstrand), f&#39; et nature.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : -6<\/b><\/p><p>$V_1 = V_2 = -\\frac{0{,}5}{R}$. $V = V_1 + V_2 - \\frac{R}{n}V_1V_2 = -\\frac1R - \\frac{1}{6R} = -\\frac{7}{6R} \\approx -16{,}7$ δ. Donc <strong>f&#39; = −6 cm<\/strong>, f = +6 cm : système <strong>divergent<\/strong>.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>A-6) Position des foyers.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : -8<\/b><\/p><p>$\\overline{S_2F'} = f'\\left(1 - \\frac{e}{n}V_1\\right) = -6\\times\\frac43 = -8$ cm. Par symétrie, $\\overline{S_1F} = +8$ cm. (Vérifié par calcul matriciel.)<\/p>\n<\/div><\/div><\/section><p>Partie B (face de sortie métallisée) : on obtient un <strong>système catadioptrique<\/strong>, équivalent à un <strong>miroir sphérique<\/strong> unique. Son centre Ω est l&#39;image de C₂ à travers D₁, son sommet Σ l&#39;image de S₂ à travers D₁. Méthode : applique deux fois la conjugaison de D₁.<\/p>\n<h2>Session normale · exercice 2 (système grossissant)<\/h2>\n<p><strong>Énoncé.<\/strong> L₁ : f&#39;₁ = 3 cm ; L₂ : f&#39;₂ = −6 cm ; $\\overline{O_1O_2} = 9$ cm. Œil normal (PP = 25 cm), observation sans fatigue.<\/p>\n<section class=\"exo\"><h3>Exercice 2<\/h3><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Position de l&#39;image intermédiaire A₁ et de l&#39;objet.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : -3.75<\/b><\/p><p>Image finale à l&#39;infini : A₁ au foyer objet de L₂, $\\overline{O_2F_2} = +6$ cm, donc $\\overline{O_1A_1} = 15$ cm. Conjugaison L₁ : $\\frac{1}{\\overline{O_1A}} = \\frac{1}{15} - \\frac13 = -\\frac{4}{15}$, donc <strong>$\\overline{O_1A} = -3{,}75$ cm<\/strong>.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Grossissement G.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 16.7<\/b><\/p><p>$\\gamma_1 = 15/(-3{,}75) = -4$. α = AB/25 ; α&#39; = |A₁B₁|/6 = 4AB/6. <strong>|G| = (4/6) × 25 ≈ 16,7<\/strong> (image renversée).<\/p>\n<\/div><\/div><\/section><h2>Session normale · exercice 3 (sodium 24)<\/h2>\n<section class=\"exo\"><h3>Exercice 3<\/h3><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>Équation et λ.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>${}^{24}_{11}\\text{Na} \\to {}^{24}_{12}\\text{Mg} + {}^{0}_{-1}e$ (β⁻). λ = ln 2 / 15 h ≈ 0,0462 h⁻¹ ≈ 1,28·10⁻⁵ s⁻¹.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><p>n₁ à t₁ = 3 h.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$n_0 = C_0V_0 = 10^{-3}\\times5\\cdot10^{-3} = 5\\cdot10^{-6}$ mol. $n_1 = n_0\\,2^{-3/15} \\approx 4{,}35\\cdot10^{-6}$ mol.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"7\"><div class=\"ex-q\"><p>Volume de sang perdu.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.85<\/b><\/p><p>Concentration mesurée : $2{,}1\\cdot10^{-9} / 2\\cdot10^{-3} = 1{,}05\\cdot10^{-6}$ mol/L. Volume restant : $4{,}35\\cdot10^{-6}/1{,}05\\cdot10^{-6} \\approx 4{,}15$ L. <strong>Vp ≈ 5 − 4,15 ≈ 0,85 L.<\/strong><\/p>\n<\/div><\/div><\/section><h2>Rattrapage · exercice 1 (œil myope)<\/h2>\n<section class=\"exo\"><h3>Rattrapage<\/h3><div class=\"ex\" data-x=\"8\"><div class=\"ex-q\"><p>Distance rétine-cristallin, PP, correction.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : -12<\/b><\/p><p>Voir chapitre 4 : ≈ 18,5 mm ; PP ≈ 7,5 cm ; lentille divergente <strong>f&#39; = −12 cm<\/strong> (foyer au PR).<\/p>\n<\/div><\/div><\/section><p>Exercices 2 et 3 du rattrapage (dioptre + dioptre plan, miroir + lame) : les figures et les signes des rayons sont illisibles dans le fichier. Méthode : enchaîne les conjugaisons, objet de chaque élément = image du précédent. Pour une lame d&#39;épaisseur e et d&#39;indice n, le déplacement apparent vaut $e\\left(1 - \\frac1n\\right)$, résultat à démontrer dans le sujet.<\/p>\n<h2>QCM du sujet<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Une lentille biconcave en verre dans l&#39;air est :<\/div><button class=\"opt\" data-o=\"0\">divergente<\/button><button class=\"opt\" data-o=\"1\">convergente<\/button><button class=\"opt\" data-o=\"2\">afocale<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Un système avec une face métallisée s&#39;appelle :<\/div><button class=\"opt\" data-o=\"0\">catadioptrique<\/button><button class=\"opt\" data-o=\"1\">afocal<\/button><button class=\"opt\" data-o=\"2\">dioptrique<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Pour observer sans fatigue, A₁ doit être :<\/div><button class=\"opt\" data-o=\"0\">au foyer objet de l&#39;oculaire<\/button><button class=\"opt\" data-o=\"1\">au foyer image de l&#39;objectif<\/button><button class=\"opt\" data-o=\"2\">à 25 cm<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Le foyer objet d&#39;une lentille divergente ($f' = -6$) est :<\/div><button class=\"opt\" data-o=\"0\">6 cm après la lentille<\/button><button class=\"opt\" data-o=\"1\">6 cm avant<\/button><button class=\"opt\" data-o=\"2\">en O<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">La particule émise par le Na 24 est :<\/div><button class=\"opt\" data-o=\"0\">un électron<\/button><button class=\"opt\" data-o=\"1\">un positon<\/button><button class=\"opt\" data-o=\"2\">un noyau d&#39;hélium<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Fraction de Na 24 restant après 3 h :<\/div><button class=\"opt\" data-o=\"0\">≈ 87 %<\/button><button class=\"opt\" data-o=\"1\">50 %<\/button><button class=\"opt\" data-o=\"2\">20 %<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Déplacement apparent dû à une lame :<\/div><button class=\"opt\" data-o=\"0\">$e(1 - 1/n)$<\/button><button class=\"opt\" data-o=\"1\">$e\\,n$<\/button><button class=\"opt\" data-o=\"2\">$e/n$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Le système objectif + oculaire divergent est de type :<\/div><button class=\"opt\" data-o=\"0\">lunette de Galilée<\/button><button class=\"opt\" data-o=\"1\">microscope<\/button><button class=\"opt\" data-o=\"2\">loupe<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Correction d&#39;un PR à 12 cm :<\/div><button class=\"opt\" data-o=\"0\">f&#39; = −12 cm<\/button><button class=\"opt\" data-o=\"1\">f&#39; = +12 cm<\/button><button class=\"opt\" data-o=\"2\">f&#39; = −1,2 cm<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Gullstrand s&#39;utilise pour :<\/div><button class=\"opt\" data-o=\"0\">deux éléments séparés d&#39;une distance e<\/button><button class=\"opt\" data-o=\"1\">un miroir plan<\/button><button class=\"opt\" data-o=\"2\">la radioactivité<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"annales-2021","rep":null,"tol":null},{"n":"annales-2021","rep":["-6"],"tol":null},{"n":"annales-2021","rep":["-8"],"tol":null},{"n":"annales-2021","rep":["-3.75"],"tol":null},{"n":"annales-2021","rep":["16.7"],"tol":null},{"n":"annales-2021","rep":null,"tol":null},{"n":"annales-2021","rep":null,"tol":null},{"n":"annales-2021","rep":["0.85"],"tol":null},{"n":"annales-2021","rep":["-12"],"tol":null}],"qcm":[{"n":"annales-2021","q":"Une lentille biconcave en verre dans l&#39;air est :","o":["divergente","convergente","afocale"],"a":0,"e":"f&#39; = −6 cm ici."},{"n":"annales-2021","q":"Un système avec une face métallisée s&#39;appelle :","o":["catadioptrique","afocal","dioptrique"],"a":0,"e":"Il réfracte puis réfléchit."},{"n":"annales-2021","q":"Pour observer sans fatigue, A₁ doit être :","o":["au foyer objet de l&#39;oculaire","au foyer image de l&#39;objectif","à       ? 'Réponse APPROFONDIE (400 à 700 mots) : 1) l\'intuition avec une analogie, 2) l\'explication détaillée pas à pas, 3) pourquoi ça marche, 4) un exemple complet chiffré, 5) les pièges fréquents et ce qui tombe à l\'examen, 6) une question pour vérifier la compréhension.'
      : 'Réponse EXPLICATIVE (150 à 250 mots) : 1) l\'idée en une phrase, 2) l\'explication pas à pas, 3) un petit exemple chiffré ou concret, 4) une courte question pour vérifier la compréhension.';
    const mem = [];
    if (ST.memos.length) mem.push('DIFFICULTÉS DÉJÀ REPÉRÉES :\n' + ST.memos.slice(-12).map((m) => `- ${m.date} : ${m.text}`).join('\n'));
    const lastQ = ST.threads.flatMap((t) => t.msgs.filter((m) => m.r === 'u').map((m) => `[${t.sec}] ${m.t.slice(0, 100)}`)).slice(-6);
    if (lastQ.length) mem.push('SES DERNIÈRES QUESTIONS :\n' + lastQ.map((x) => '- ' + x).join('\n'));
    const rules = `Tu es le tuteur de ${C.student}, pour le module ${C.module}${C.prof ? ' du ' + C.prof : ''}. Il apprend souvent la notion pour la première fois.
Règles : réponds en français simple, en Markdown léger (**gras** pour les termes clés, tirets, étapes numérotées). Toute formule ou tout calcul s'écrit en LaTeX : $…$ dans la phrase, $$…$$ seul sur sa ligne pour une formule importante (ex. $\\hat y_i$, $$\\text{MSE}=\\frac{1}{n}\\sum_{i=1}^{n}(y_i-\\hat y_i)^2$$) ; jamais d'accents graves pour une formule, ils sont réservés au code et aux noms de fonctions. Un petit tableau Markdown est permis s'il clarifie (3 colonnes maximum, l'écran est étroit). ${style} Appuie-toi d'abord sur l'EXTRAIT ci-dessous et sur les conventions du prof ; si une source générale diffère du cours, signale l'écart et dis quelle version utiliser à l'examen (celle du prof). Pour un calcul, pose chaque étape et vérifie-la. S'il envoie une réponse ou une photo de brouillon, corrige étape par étape et nomme précisément l'erreur. Si tu n'es pas sûr, dis-le. S'il demande un mini-exercice, donne l'exercice sans la solution.
Utilise sa mémoire pour faire des liens avec ses confusions passées, sans la réciter.
Termine TOUJOURS par une dernière ligne séparée au format exact « MÉMO: … » qui résume en 15 mots maximum la difficulté révélée par sa question (ou « MÉMO: rien »). Cette ligne lui est cachée.
${C.conventions ? 'CONVENTIONS DU PROF : ' + C.conventions + '\n' : ''}MÉMOIRE DE L'ÉLÈVE :
${mem.join('\n\n') || '(rien pour l\'instant)'}
EXTRAIT (${c.label}) :
${c.text.slice(0, deep ? 9000 : 3500)}`;
    const recent = cur.msgs.slice(deep ? -9 : -5, -1).map((m) => ({ role: m.r === 'u' ? 'user' : 'assistant', content: m.t }));
    while (recent.length && recent[0].role !== 'user') recent.shift();
    const msgs = [...recent.filter((m) => m.content && m.content.trim()), { role: 'user', content: q }]; while (msgs.length > 1 && msgs[0].role !== 'user') msgs.shift(); msgs[0] = { role: 'user', content: rules + '\n\n---\nQuestion : ' + msgs[0].content };
    ctl = new AbortController();
    const opts = { modelTier: deep ? 'complex' : 'quick', cache: false, signal: ctl.signal, onText: ({ text }) => { out.innerHTML = md(visible(text)); dessinerMaths(out); $('#mztLog').scrollTop = 1e9; } };
    if (img) opts.images = [img];
    try {
      const r = await sample(msgs, opts);
      const mm = r.text.match(/(?:^|\n)\s*M[ÉE]MO\s*:\s*(.+)\s*$/i);
      cur.msgs.push({ r: 'a', t: visible(r.text) + (r.truncated ? '\n\n(Réponse coupée : pose une question plus ciblée.)' : ''), d: !!deep });
      if (mm && !/^\s*rien/i.test(mm[1])) { ST.memos.push({ date: today(), text: mm[1].trim().slice(0, 160) }); if (ST.memos.length > 30) ST.memos.shift(); saveMemos(); }
      await saveThread(cur);
    } catch (e) {
      const kept = e && e.text ? visible(e.text) : '';
      if (e && e.code === 'cancelled') { if (kept) cur.msgs.push({ r: 'a', t: kept + '\n(Arrêté.)' }); else cur.msgs.pop(); }
      else { cur.msgs.pop(); compacter(!!cur.msgs.length); out.textContent = (kept ? kept + '\n\n' : '') + (ERR[e && e.code] || 'Le tuteur n\'a pas pu répondre. Réessaie dans un instant.'); }
      if (!cur.msgs.length) ST.threads = ST.threads.filter((t) => t !== cur);
      saveLocal();
      if (!(e && e.code === 'cancelled')) { busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImgN').textContent = ''; return; }
    }
    busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImg').value = ''; $('#mztImgN').textContent = ''; renderLog();
  }

  // ---------- événements ----------
  $('#mztBtn').onclick = () => openPanel(null);
  $('#mztX').onclick = closePanel;
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#mztPan').hidden) closePanel(); });
  $('#mztTabH').onclick = () => view($('#mztHist').hidden ? 'hist' : 'chat');
  $('#mztTabM').onclick = () => view($('#mztMem').hidden ? 'mem' : 'chat');
  $('#mztQ').oninput = renderList;
  $('#mztList').onclick = (e) => { const id = e.target.dataset && e.target.dataset.cont; if (!id) return; cur = ST.threads.find((t) => t.id === id); view('chat'); $('#mztCtx').textContent = '· ' + cur.sec; renderLog(); };
  $('#mztMemL').onclick = (e) => { const i = e.target.dataset && e.target.dataset.memdel; if (i == null) return; ST.memos.splice(+i, 1); saveMemos(); renderMem(); };
  $('#mztChips').onclick = (e) => { const b = e.target.closest('[data-chip]'); if (!b) return; const t = $('#mztIn'); t.value = b.dataset.chip + (t.value ? ' : ' + t.value : ''); t.focus(); };
  $('#mztNew').onclick = () => { cur = null; renderLog(); };
  $('#mztStop').onclick = () => { if (ctl) ctl.abort(); };
  $('#mztImg').onchange = (e) => { img = e.target.files[0] || null; $('#mztImgN').textContent = img ? 'Photo : ' + img.name : ''; };
  $('#mztF').onsubmit = (e) => { e.preventDefault(); const v = $('#mztIn').value; $('#mztIn').value = ''; ask(v); };
  $('#mztIn').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#mztF').requestSubmit(); } });

  // ---------- capacités (facultatives) ----------
  const W = window.claude;
  if (W && W.use) {
    W.use('sample').then((s) => { sample = s; ready = true; note();
      if (s && s.limits) s.limits().then((l) => { if (l && l.images) { imgOK = true; $('#mztImgL').hidden = false; if (l.images.mediaTypes) $('#mztImg').accept = l.images.mediaTypes.join(','); } }).catch(() => {});
    }).catch(() => { ready = true; note(); });
    Promise.all([W.use('db'), W.use('user')]).then(async ([d, u]) => {
      if (!d || !u) return; const id = await u.id(); if (!id) return; db = d; base = 'data/users/' + id + '/mzt_' + C.id;
      try {
        const m = await db.doc(base).get(); if (m.exists) { const v = m.data() || {}; if (Array.isArray(v.memos)) ST.memos = JSON.parse(JSON.stringify(v.memos)); }
        const q = await db.collection(base + '/threads').get(); const remote = q.docs.map((x) => Object.assign({ id: x.id }, JSON.parse(JSON.stringify(x.data() || {}))));
        const map = {}; [...ST.threads, ...remote].forEach((t) => { if (!map[t.id] || (t.msgs || []).length > (map[t.id].msgs || []).length) map[t.id] = t; });
        ST.threads = Object.values(map).sort((a, b) => parseInt(a.id.slice(1), 36) - parseInt(b.id.slice(1), 36)); saveLocal();
      } catch (e) {}
    }).catch(() => {});
  } else { ready = true; note(); }

  window.MZT = { open: openPanel, close: closePanel };
})();

</script>

if(window.top===window&&location.protocol==="file:"){a.hidden=true;return}
a.href=p.indexOf("/decouvrir")===0||location.pathname.indexOf("/decouvrir")===0?"/decouvrir":"/app/modules";})();</script>
