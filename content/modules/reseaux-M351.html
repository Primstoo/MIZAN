-table (fais d&#39;abord un ping PC-A → R1 pour que le switch apprenne les adresses).<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>PC-A<\/b> : oui, c80a.a9fa.de0d, type DYNAMIC, port <b>Fa0/6<\/b>.<br><b>R1<\/b> : oui, 30f7.0da3.1821, type DYNAMIC, port <b>Fa0/5<\/b>.<br>Cela colle à la topologie : R1 est sur F0/5 et PC-A sur F0/6. Ces deux lignes sont <b>DYNAMIC<\/b> : le switch les a apprises en lisant la MAC source des trames reçues (elles disparaissent après un certain temps sans trafic).<br>Les 20 autres lignes sur 22 sont <b>STATIC / CPU<\/b> : adresses réservées au switch lui-même (0100.0ccc.cccc…, 0180.c200.00xx pour des protocoles de contrôle comme le spanning tree) et ffff.ffff.ffff, l&#39;adresse de diffusion.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"19\"><div class=\"ex-q\"><p><strong>p3h.<\/strong> Remarques générales 1) Les diffusions sont-elles possibles au niveau de la couche 2 ? Si oui, quelle serait l&#39;adresse MAC ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Regarde la dernière ligne STATIC de la table MAC.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Oui<\/b>. La diffusion (broadcast) existe en couche 2 : l&#39;adresse MAC de destination est <b>FF-FF-FF-FF-FF-FF<\/b> (48 bits à 1, notée ffff.ffff.ffff). Le switch envoie alors la trame sur <b>tous<\/b> ses ports. C&#39;est ce que fait un ARP Request (« qui a l&#39;adresse IP 192.168.1.1 ? »).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"20\"><div class=\"ex-q\"><p><strong>p3i.<\/strong> Remarques générales 2) Pourquoi devez-vous connaître l&#39;adresse MAC d&#39;un périphérique ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Pense à la livraison d&#39;une trame dans un réseau local.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>① <b>Livrer les trames<\/b> : sur un réseau local, une trame est adressée à une MAC, pas à une IP. Pour écrire à une IP, on demande d&#39;abord sa MAC (ARP).<br>② <b>Le switch s&#39;en sert<\/b> pour construire sa table MAC et choisir le bon port.<br>③ <b>Identifier et contrôler<\/b> : l&#39;OUI donne le fabricant ; on peut filtrer ou autoriser des appareils par leur MAC (sécurité des ports, DHCP) et dépanner (qui est branché où ?).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Partie 3 · Quatre réseaux sur deux switchs<\/h3><div class=\"ex\" data-x=\"21\"><div class=\"ex-q\"><p><strong>p4a.<\/strong> 1) Réaliser la maquette.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Deux switchs reliés entre eux, deux PC sur chacun. Masque 255.255.255.0 partout, aucune passerelle.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Switch du haut : PC <b>192.168.20.1<\/b> et PC <b>192.168.16.2<\/b>. Switch du bas : PC <b>192.168.22.4<\/b> et PC <b>192.168.18.3<\/b>.<br>Les deux switchs sont reliés par un câble <b>croisé<\/b> (équipements de même nature, comme en partie 1). Masque <b>255.255.255.0<\/b> sur les 4 PC, aucune passerelle.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"22\"><div class=\"ex-q\"><p><strong>p4b.<\/strong> 2-3) Ping entre les différentes machines. Pourquoi aucune communication n&#39;est-elle possible ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Calcule l&#39;adresse réseau de chaque PC avec le masque /24 : ce sont les 3 premiers octets.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Tous les pings échouent<\/b>, quelle que soit la paire.<br>Chaque PC est dans un réseau différent : 192.168.<b>20<\/b>.0/24, 192.168.<b>16<\/b>.0/24, 192.168.<b>22<\/b>.0/24 et 192.168.<b>18<\/b>.0/24. Avec le masque 255.255.255.0, il faut que les 3 premiers octets soient identiques pour être « chez soi ». Ici, le troisième octet diffère (20, 16, 22, 18).<br>Un PC envoie donc tout ce qui vise un autre réseau à sa <b>passerelle<\/b>, qui n&#39;est pas configurée, et les switchs, de couche 2, ne routent pas. Les PC sont reliés physiquement, mais pas logiquement.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"23\"><div class=\"ex-q\"><p><strong>p4c.<\/strong> 4) Proposer deux solutions pratiques pour résoudre ce problème.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Deux pistes : mettre les PC dans le même réseau, ou ajouter un équipement qui relie les réseaux.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Solution 1 : un seul réseau.<\/b> Changer le masque en <b>255.255.248.0<\/b> (/21) sur les 4 PC, sans changer leurs adresses. Le réseau devient 192.168.16.0/21 : il couvre 192.168.16.0 à 192.168.23.255, donc 16, 18, 20 et 22 en font partie (en binaire, le 3e octet commence par 00010 pour les quatre). Variante : donner aux 4 PC des adresses du même /24 (ex. 192.168.20.1 à .4).<br><b>Solution 2 : un routeur.<\/b> Un routeur relie les 4 réseaux ; chaque PC reçoit pour passerelle l&#39;adresse du routeur dans son réseau (ex. 192.168.20.254 pour le PC 192.168.20.1). Comme tous les PC sont sur les mêmes switchs, on sépare d&#39;abord les réseaux par des VLAN, puis on utilise une interface (ou sous-interface) du routeur par réseau.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section>","ex":[{"n":"n9","rep":null,"tol":null},{"n":"n9","rep":null,"tol":null},{"n":"n9","rep":null,"tol":null},{"n":"n9","rep":null,"tol":null},{"n":"n9","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n9","rep":null,"tol":null},{"n":"n28","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n28","rep":null,"tol":null},{"n":"n28","rep":null,"tol":null},{"n":"n28","rep":null,"tol":null},{"n":"n28","rep":null,"tol":null},{"n":"n28","rep":null,"tol":null},{"n":"n28","rep":null,"tol":null},{"n":"n37","rep":null,"tol":null},{"n":"n37","rep":null,"tol":null},{"n":"n28","rep":null,"tol":null},{"n":"n9","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null}],"qcm":[]},{"id":"tp3","t":"TP 3 · Routage statique (Packet Tracer)","seance":"Travaux dirigés et pratiques","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il te faut deux choses du chapitre sur l&#39;adressage : savoir trouver l&#39;<strong>adresse réseau<\/strong> d&#39;une adresse avec son masque, et savoir qu&#39;un PC envoie à sa <strong>passerelle<\/strong> tout ce qui sort de son réseau.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Quelle est l&#39;adresse réseau de 209.165.201.129 avec le masque 255.255.255.252 (/30) ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>/30 = 2 bits machine dans le dernier octet. Écris 129 en binaire et mets ces 2 bits à 0.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>129 = 100000<strong>01<\/strong>. Bits machine à 0 : 10000000 = 128. Réseau = <strong>209.165.201.128/30<\/strong>.\nUn /30 ne contient que 2 adresses utilisables (.129 et .130) : c&#39;est le masque des liaisons série entre deux routeurs. Tu en croiseras trois dans ce TP.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense aller ET retour.<\/strong> Un ping ne réussit que si le paquet trouve un chemin vers la destination <strong>et<\/strong> si la réponse trouve un chemin pour revenir. À chaque échec du TP, demande-toi : quel routeur ne sait pas où envoyer, et dans quel sens ?<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Croire qu&#39;une route ajoutée sur R1 suffit à tout le réseau. Une route statique ne sert <strong>qu&#39;au routeur où on l&#39;écrit<\/strong>. Les autres ne l&#39;apprennent jamais : c&#39;est tout le principe du routage statique (aucun échange entre routeurs).<\/p>\n<\/aside><p>À la fin, tu sais compter les routes nécessaires, écrire une route récursive, reliée directement, par défaut, récapitulative et flottante, les lire dans <code>show ip route<\/code>, et expliquer chaque échec de ping du TP.<\/p>\n<h2>Idée 1 · Le réseau : 6 réseaux, 3 routeurs<\/h2>\n<svg viewBox=\"0 0 640 266\" style=\"width:100%;max-width:680px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Topologie du TP 3. R1 relie les réseaux locaux 172.16.12.0/24 (PC3) et 172.16.11.0/24 (PC2). R1 est relié à R2 par la liaison série 209.165.201.0/30. R2 porte l'interface Loopback 192.168.10.0/24 et est relié à ISP par la liaison série 209.165.201.128/30. ISP relie le réseau 209.165.200.224/27 de PC1. En pointillés, la liaison de secours R1–ISP 209.165.202.0/30 ajoutée à la tâche 6.\">\n<g font-family=\"sans-serif\" font-size=\"14\" fill=\"currentColor\" stroke-linecap=\"round\">\n<line x1=\"320\" y1=\"52\" x2=\"320\" y2=\"28\" stroke=\"currentColor\" stroke-width=\"1.6\"/>\n<text x=\"320\" y=\"20\" text-anchor=\"middle\" stroke=\"none\">Lo0 · 192.168.10.0/24<\/text>\n<line x1=\"184\" y1=\"159\" x2=\"306\" y2=\"81\" stroke=\"#D9824F\" stroke-width=\"2.6\"/>\n<text x=\"232\" y=\"108\" text-anchor=\"end\" stroke=\"none\" fill=\"#D9824F\" font-weight=\"700\">209.165.201.0/30<\/text>\n<line x1=\"334\" y1=\"81\" x2=\"456\" y2=\"159\" stroke=\"#D9824F\" stroke-width=\"2.6\"/>\n<text x=\"408\" y=\"108\" text-anchor=\"start\" stroke=\"none\" fill=\"#D9824F\" font-weight=\"700\">209.165.201.128/30<\/text>\n<line x1=\"190\" y1=\"176\" x2=\"450\" y2=\"176\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-dasharray=\"6 5\"/>\n<text x=\"320\" y=\"196\" text-anchor=\"middle\" stroke=\"none\">209.165.202.0/30 (secours, tâche 6)<\/text>\n<circle cx=\"320\" cy=\"70\" r=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"/><text x=\"320\" y=\"74\" text-anchor=\"middle\" stroke=\"none\" font-weight=\"700\">R2<\/text>\n<circle cx=\"170\" cy=\"170\" r=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"/><text x=\"170\" y=\"174\" text-anchor=\"middle\" stroke=\"none\" font-weight=\"700\">R1<\/text>\n<circle cx=\"470\" cy=\"170\" r=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"/><text x=\"470\" y=\"174\" text-anchor=\"middle\" stroke=\"none\" font-weight=\"700\">ISP<\/text>\n<line x1=\"153\" y1=\"163\" x2=\"66\" y2=\"124\" stroke=\"currentColor\" stroke-width=\"1.6\"/>\n<rect x=\"22\" y=\"108\" width=\"40\" height=\"26\" rx=\"3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"/><text x=\"42\" y=\"125\" text-anchor=\"middle\" stroke=\"none\">PC3<\/text>\n<text x=\"20\" y=\"98\" text-anchor=\"start\" stroke=\"none\" font-weight=\"700\">172.16.12.0/24<\/text>\n<line x1=\"153\" y1=\"178\" x2=\"66\" y2=\"222\" stroke=\"currentColor\" stroke-width=\"1.6\"/>\n<rect x=\"22\" y=\"210\" width=\"40\" height=\"26\" rx=\"3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"/><text x=\"42\" y=\"227\" text-anchor=\"middle\" stroke=\"none\">PC2<\/text>\n<text x=\"20\" y=\"258\" text-anchor=\"start\" stroke=\"none\" font-weight=\"700\">172.16.11.0/24<\/text>\n<line x1=\"488\" y1=\"170\" x2=\"574\" y2=\"170\" stroke=\"currentColor\" stroke-width=\"1.6\"/>\n<rect x=\"576\" y=\"157\" width=\"40\" height=\"26\" rx=\"3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"/><text x=\"596\" y=\"174\" text-anchor=\"middle\" stroke=\"none\">PC1<\/text>\n<text x=\"620\" y=\"210\" text-anchor=\"end\" stroke=\"none\" font-weight=\"700\">209.165.200.224/27<\/text>\n<\/g>\n<\/svg><p>Un routeur connaît <strong>seul<\/strong> les réseaux branchés sur ses interfaces (code <code>C<\/code> dans sa table). Pour tous les autres, il faut lui écrire une route.<\/p>\n<table>\n<thead>\n<tr>\n<th>Routeur<\/th>\n<th>Réseaux connectés directement<\/th>\n<th>Réseaux à apprendre<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>R1<\/td>\n<td>172.16.12.0/24, 172.16.11.0/24, 209.165.201.0/30<\/td>\n<td>192.168.10.0/24, 209.165.201.128/30, 209.165.200.224/27<\/td>\n<\/tr>\n<tr>\n<td>R2<\/td>\n<td>209.165.201.0/30, 209.165.201.128/30, 192.168.10.0/24<\/td>\n<td>172.16.11.0/24, 172.16.12.0/24, 209.165.200.224/27<\/td>\n<\/tr>\n<tr>\n<td>ISP<\/td>\n<td>209.165.201.128/30, 209.165.200.224/27<\/td>\n<td>172.16.11.0/24, 172.16.12.0/24, 209.165.201.0/30, 192.168.10.0/24<\/td>\n<\/tr>\n<\/tbody><\/table>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Routes à écrire sur un routeur = réseaux du schéma − réseaux connectés à ce routeur. Ici 6 − 3 = 3 pour R1, 6 − 3 = 3 pour R2, 6 − 2 = 4 pour ISP.<\/p>\n<\/aside><h2>Idée 2 · Un ping, c&#39;est deux trajets<\/h2>\n<p>Chaque routeur décide seul, saut par saut, en lisant <strong>l&#39;adresse de destination<\/strong> et sa propre table. S&#39;il ne trouve aucune ligne qui correspond, il jette le paquet.<\/p>\n<figure class=\"flux\"><figcaption>Tâche 4, étape 1 : PC2 → Loopback de R2 (aller réussi)<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">PC2<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">R1 (route vers 192.168.10.0)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">R2 (c&#39;est son adresse)<\/div><\/div><\/figure><figure class=\"flux\"><figcaption>Le retour échoue<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">R2 : réponse pour 172.16.11.10<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">aucune route vers 172.16.11.0<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">paquet jeté<\/div><\/div><\/figure><p>PC2 voit « Request timed out » : la demande est arrivée, c&#39;est la réponse qui s&#39;est perdue.<\/p>\n<h2>Idée 3 · Trois façons d&#39;écrire une route statique<\/h2>\n<p>Syntaxe commune : <code>ip route &lt;réseau&gt; &lt;masque&gt; &lt;où envoyer&gt; [distance]<\/code>.<\/p>\n<table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Ce qu&#39;on donne<\/th>\n<th>Exemple du TP<\/th>\n<th>Dans <code>show ip route<\/code><\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Récursive<\/td>\n<td>l&#39;adresse IP du <strong>prochain routeur<\/strong><\/td>\n<td><code>ip route 192.168.10.0 255.255.255.0 209.165.201.2<\/code><\/td>\n<td><code>S 192.168.10.0/24 [1/0] via 209.165.201.2<\/code><\/td>\n<\/tr>\n<tr>\n<td>Reliée directement<\/td>\n<td>l&#39;<strong>interface de sortie<\/strong><\/td>\n<td><code>ip route 172.16.11.0 255.255.255.0 s0/0/0<\/code><\/td>\n<td><code>S 172.16.11.0/24 is directly connected, Serial0/0/0<\/code><\/td>\n<\/tr>\n<tr>\n<td>Par défaut<\/td>\n<td>réseau 0.0.0.0, masque 0.0.0.0<\/td>\n<td><code>ip route 0.0.0.0 0.0.0.0 209.165.201.130<\/code><\/td>\n<td><code>S* 0.0.0.0/0 [1/0] via 209.165.201.130<\/code><\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Pourquoi « récursive » ? Le routeur connaît l&#39;adresse du voisin, pas la porte de sortie. Il doit donc chercher deux fois.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>R1 doit envoyer un paquet vers 192.168.10.1<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · 1ʳᵉ recherche<\/div><p>R1 cherche 192.168.10.1 dans sa table. Il trouve « 192.168.10.0/24 via 209.165.201.2 ». Il sait à QUI donner le paquet, pas par OÙ sortir.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · 2ᵉ recherche<\/div><p>R1 cherche maintenant 209.165.201.2. Il trouve « C 209.165.201.0/30, Serial0/0/0 ».<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · Envoi<\/div><p>Le paquet sort par Serial0/0/0 vers R2. Une route reliée directement donne l&#39;interface tout de suite : une seule recherche.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>La route par défaut n&#39;est pas « une route de plus ». Elle correspond à <strong>toutes<\/strong> les destinations (masque /0), mais elle ne sert qu&#39;en dernier recours : le routeur prend toujours la correspondance la plus longue. Une route /24 gagne toujours contre 0.0.0.0/0.<\/p>\n<\/aside><h2>Idée 4 · Une seule route pour deux réseaux : la récapitulative<\/h2>\n<p>ISP doit atteindre 172.16.11.0/24 et 172.16.12.0/24, et les deux passent par le même chemin (R2). On les résume en un seul réseau qui les contient tous les deux.<\/p>\n<figure class=\"grille\"><figcaption>3ᵉ octet en binaire (orange = bits communs)<\/figcaption><table><tr><th><\/th><th>b7<\/th><th>b6<\/th><th>b5<\/th><th>b4<\/th><th>b3<\/th><th>b2<\/th><th>b1<\/th><th>b0<\/th><\/tr><tr><th>11<\/th><td class=\"h1\">0<\/td><td class=\"h1\">0<\/td><td class=\"h1\">0<\/td><td class=\"h1\">0<\/td><td class=\"h1\">1<\/td><td>0<\/td><td>1<\/td><td>1<\/td><\/tr><tr><th>12<\/th><td class=\"h1\">0<\/td><td class=\"h1\">0<\/td><td class=\"h1\">0<\/td><td class=\"h1\">0<\/td><td class=\"h1\">1<\/td><td>1<\/td><td>0<\/td><td>0<\/td><\/tr><\/table><\/figure><figure class=\"etapes\" data-i=\"0\"><figcaption>Calculer la route récapitulative<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Écris l&#39;octet qui change<\/div><p>Les deux premiers octets sont identiques (172.16). Le 3ᵉ change : 11 = 00001011 et 12 = 00001100.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · Compte les bits communs à gauche<\/div><p>00001 : 5 bits. Préfixe = 16 + 5 = /21.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · Mets le reste à 0<\/div><p>00001000 = 8. Réseau = 172.16.8.0/21.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · Écris le masque<\/div><p>/21 = 11111111.11111111.11111000.00000000 = 255.255.248.0.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · Écris la route<\/div><p>ip route 172.16.8.0 255.255.248.0 209.165.201.129<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>On n&#39;obtient pas un /23 : 11 et 12 ne sont pas dans le même bloc de 2 (10-11 et 12-13). Le résumé couvre donc 172.16.8.0 à 172.16.15.255, plus large que nécessaire. Ce n&#39;est pas grave ici, mais c&#39;est une question classique : « le résumé englobe-t-il d&#39;autres réseaux ? » Oui, 172.16.8, 9, 10, 13, 14 et 15.<\/p>\n<\/aside><h2>Idée 5 · La route de secours : la route flottante<\/h2>\n<p>Chaque source de route a une <strong>distance administrative<\/strong> (AD) : sa crédibilité. Plus elle est petite, plus la route est préférée.<\/p>\n<table>\n<thead>\n<tr>\n<th>Source<\/th>\n<th>AD<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Réseau connecté<\/td>\n<td>0<\/td>\n<\/tr>\n<tr>\n<td>Route statique<\/td>\n<td>1<\/td>\n<\/tr>\n<tr>\n<td>EIGRP<\/td>\n<td>90<\/td>\n<\/tr>\n<tr>\n<td>OSPF<\/td>\n<td>110<\/td>\n<\/tr>\n<tr>\n<td>RIP<\/td>\n<td>120<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Une <strong>route flottante<\/strong> est une route statique avec une AD plus grande que celle de la route principale (ici 5 &gt; 1). Tant que la route principale existe, la flottante reste cachée. Si la principale disparaît (lien coupé), la flottante « remonte » dans la table.<\/p>\n<figure class=\"flux\"><figcaption>Tâche 6 : R2 en panne<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">Liaison R1–R2 coupée<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">route [1/0] via R2 supprimée<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">route [5/0] via 209.165.202.2 installée<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">trafic par la liaison R1–ISP<\/div><\/div><\/figure><h2>Mise en place sous Packet Tracer<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Construire la maquette sans perdre de temps<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/6 · Routeurs<\/div><p>Prends trois routeurs 2911 (ou 1941). Ils ont des ports Gig0/0 et Gig0/1, mais pas de port série.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/6 · Cartes série<\/div><p>Clique sur le routeur → onglet Physical → éteins-le (bouton d&#39;alimentation), glisse le module HWIC-2T dans le premier emplacement, rallume. Tu obtiens Serial0/0/0 et Serial0/0/1. À faire sur R1, R2 et ISP.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/6 · Câbles série<\/div><p>Connections → Serial DCE. Le routeur sur lequel tu cliques en premier reçoit le côté DCE : commence par R1 pour R1–R2, par R2 pour R2–ISP. C&#39;est ce côté qui reçoit clock rate.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/6 · Switchs et PC<\/div><p>S3 et S2 sur R1 (G0/0 → PC3, G0/1 → PC2), S1 sur ISP. Câbles droits. Attention : G0/0 de R1 va vers PC3 (172.16.12.0), pas vers PC2.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/6 · Adresses des PC<\/div><p>Desktop → IP Configuration : PC1 209.165.200.226 / 255.255.255.224, passerelle 209.165.200.225. PC2 172.16.11.10 / 24, passerelle 172.16.11.1. PC3 172.16.12.10 / 24, passerelle 172.16.12.1.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">6/6 · Vérifier<\/div><p>Sur chaque routeur, show ip interface brief : toutes les interfaces utilisées doivent être up / up. Un lien série down/down vient souvent d&#39;un clock rate oublié côté DCE.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p><strong>Erreurs de frappe dans l&#39;énoncé<\/strong> : « R1, R1 et ISP » → lire <strong>R1, R2 et ISP<\/strong> ; « copy runing-config » → <strong>copy running-config startup-config<\/strong> ; « 209.165.202..2/30 » → <strong>209.165.202.2/30<\/strong> ; <code>show controllers serial 0/0<\/code> → sur ces routeurs, <strong>show controllers serial 0/0/0<\/strong>.<\/p>\n<\/aside><h2>Le TP<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Cherche d&#39;abord seul, ouvre l&#39;indice si tu bloques, puis compare avec le corrigé et note-toi honnêtement : ta réponse compte dans la maîtrise de la notion.<\/p>\n<\/aside><section class=\"exo\"><h3>Tâches 1 et 2 · Effacement et configuration de base<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p><strong>t1.<\/strong> Effacer la configuration des routeurs puis les recharger. Que se passe-t-il ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Mode privilégié (Router#). Deux commandes, dans cet ordre.<\/p>\n<\/div><div class=\"ex-c\" hidden><pre><code>Router# erase startup-config\nRouter# reload\nSystem configuration has been modified. Save? [yes/no]: no<\/code><\/pre>\n<p>erase startup-config vide la configuration enregistrée (NVRAM). reload redémarre : le routeur repart d&#39;une configuration vide. On répond <strong>no<\/strong> sinon la configuration en cours (running-config) serait réécrite dans la NVRAM et l&#39;effacement ne servirait à rien. Sur un routeur neuf de Packet Tracer, la configuration est déjà vide : l&#39;étape ne change rien, mais il faut la connaître.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p><strong>t2.<\/strong> Configuration de base et des interfaces. À quoi servent no ip domain-lookup, enable secret et clock rate ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Pense à ce qui se passe si tu tapes mal une commande, à la sécurité, et au câble série.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><strong>no ip domain-lookup<\/strong> : quand tu tapes une commande inconnue, le routeur la prend pour un nom d&#39;hôte et cherche un serveur DNS pendant de longues secondes. Cette commande l&#39;en empêche.\n<strong>enable secret<\/strong> : mot de passe (chiffré) pour passer du mode utilisateur <code>&gt;<\/code> au mode privilégié <code>#<\/code>.\n<strong>clock rate 128000<\/strong> : sur une liaison série, le côté <strong>DCE<\/strong> fournit l&#39;horloge, c&#39;est-à-dire le rythme d&#39;envoi des bits. Sans elle, le lien reste down. On la configure uniquement côté DCE : R1 Se0/0/0 et R2 Se0/0/1 dans ce TP. Vérification : <code>show controllers serial 0/0/0<\/code> affiche « DCE cable ».\n<strong>no shut<\/strong> : les interfaces d&#39;un routeur sont éteintes par défaut. <strong>wr<\/strong> (ou copy running-config startup-config) enregistre.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Tâche 3 · Examen du réseau et besoins en routage<\/h3><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p><strong>t3a.<\/strong> Nombre total de réseaux sur le schéma ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>Compte un réseau par LAN, par liaison série et pour la Loopback.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 6<\/b><\/p><p><strong>6 réseaux<\/strong> : 172.16.12.0/24, 172.16.11.0/24, 209.165.201.0/30, 192.168.10.0/24 (Loopback), 209.165.201.128/30, 209.165.200.224/27. (La 7ᵉ, 209.165.202.0/30, n&#39;arrive qu&#39;à la tâche 6.)<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p><strong>t3b.<\/strong> Combien de réseaux sont connectés directement à R1, R2 et ISP ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Un réseau par interface configurée.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><strong>R1 : 3<\/strong> (172.16.12.0/24, 172.16.11.0/24, 209.165.201.0/30).\n<strong>R2 : 3<\/strong> (209.165.201.0/30, 209.165.201.128/30, 192.168.10.0/24).\n<strong>ISP : 2<\/strong> (209.165.201.128/30, 209.165.200.224/27).\nCommande pour le voir : <code>show ip route connected<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p><strong>t3c.<\/strong> Combien de routes statiques sont nécessaires sur chaque routeur pour atteindre les réseaux non connectés ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Total des réseaux moins les réseaux connectés.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><strong>R1 : 6 − 3 = 3<\/strong>, <strong>R2 : 6 − 3 = 3<\/strong>, <strong>ISP : 6 − 2 = 4<\/strong>, soit 10 routes.\nOn peut en écrire moins : c&#39;est la suite du TP. R2 utilise une <strong>route par défaut<\/strong> vers ISP au lieu de la route vers 209.165.200.224/27, et ISP une <strong>route récapitulative<\/strong> pour les deux LAN de R1.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><p><strong>t3d.<\/strong> Ping de PC1 vers PC2 et PC3. Pourquoi est-ce un échec ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>PC1 envoie à sa passerelle. Quelle est-elle, et que contient sa table ?<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Le ping échoue. PC2 et PC3 ne sont pas dans le réseau de PC1, donc PC1 envoie à sa passerelle, <strong>ISP<\/strong> (209.165.200.225). ISP n&#39;a <strong>aucune route<\/strong> vers 172.16.11.0/24 ni 172.16.12.0/24 : seulement ses 2 réseaux connectés. Il jette le paquet et répond en général « Destination host unreachable » (réponse venant de 209.165.200.225).\nC&#39;est normal : aucune route statique n&#39;est encore écrite. Un routeur ne connaît que ses réseaux connectés.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Tâche 4 · Étape 1 : routes statiques récursives sur R1<\/h3><div class=\"ex\" data-x=\"7\"><div class=\"ex-q\"><p><strong>t4a.<\/strong> Qu&#39;est-ce qu&#39;une route statique récursive ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Une route statique dont la sortie est l&#39;<strong>adresse IP du prochain saut<\/strong> (le routeur voisin), et pas une interface.\n<code>ip route 192.168.10.0 255.255.255.0 209.165.201.2<\/code><\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"8\"><div class=\"ex-q\"><p><strong>t4b.<\/strong> Pourquoi une route récursive nécessite-t-elle deux recherches dans la table de routage ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Avec une adresse de prochain saut, le routeur sait-il par quelle interface sortir ?<\/p>\n<\/div><div class=\"ex-c\" hidden><p>1ʳᵉ recherche : la destination (ex. 192.168.10.1) → la route donne le <strong>prochain saut<\/strong> 209.165.201.2.\n2ᵉ recherche : le prochain saut 209.165.201.2 → il appartient au réseau connecté 209.165.201.0/30 → <strong>interface de sortie<\/strong> Serial0/0/0.\nL&#39;adresse du voisin ne dit pas par où sortir : il faut la chercher à son tour. D&#39;où le nom « récursive ».<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"9\"><div class=\"ex-q\"><p><strong>t4c.<\/strong> Configurer une route récursive vers chaque réseau non connecté à R1, y compris la liaison WAN R2–ISP.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>3 réseaux à atteindre, tous derrière R2. Prochain saut : l&#39;adresse de R2 sur la liaison avec R1.<\/p>\n<\/div><div class=\"ex-c\" hidden><pre><code>R1(config)# ip route 192.168.10.0 255.255.255.0 209.165.201.2\nR1(config)# ip route 209.165.201.128 255.255.255.252 209.165.201.2\nR1(config)# ip route 209.165.200.224 255.255.255.224 209.165.201.2<\/code><\/pre>\n<p>Le prochain saut est toujours <strong>209.165.201.2<\/strong> (Se0/0/0 de R2) : tout ce qui n&#39;est pas chez R1 passe par R2. Dans <code>show ip route<\/code>, chaque ligne s&#39;affiche <code>S ... [1/0] via 209.165.201.2<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"10\"><div class=\"ex-q\"><p><strong>t4d.<\/strong> Ping de PC2 vers la Loopback de R2 (192.168.10.1). Pourquoi est-ce un échec ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>L&#39;aller fonctionne-t-il ? Et le retour ?<\/p>\n<\/div><div class=\"ex-c\" hidden><p><strong>L&#39;aller réussit<\/strong> : PC2 → R1 (route vers 192.168.10.0 via R2) → R2, qui reconnaît sa propre adresse.\n<strong>Le retour échoue<\/strong> : la réponse doit aller vers 172.16.11.10, et <strong>R2 n&#39;a aucune route vers 172.16.11.0/24<\/strong>. Il la jette. PC2 affiche « Request timed out ».\nLes routes de R1 ne servent qu&#39;à R1. Il faut configurer R2 : c&#39;est l&#39;étape 2.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Tâche 4 · Étape 2 : routes reliées directement sur R2<\/h3><div class=\"ex\" data-x=\"11\"><div class=\"ex-q\"><p><strong>t4e.<\/strong> Différence entre une route statique reliée directement et une route récursive ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><strong>Reliée directement<\/strong> : on donne l&#39;<strong>interface de sortie<\/strong> (<code>s0/0/0<\/code>). Une seule recherche, le routeur sait tout de suite par où sortir.\n<strong>Récursive<\/strong> : on donne l&#39;<strong>adresse du prochain saut<\/strong>. Deux recherches.\nSur une liaison série point à point (un seul voisin au bout), l&#39;interface suffit. Sur Ethernet, où il peut y avoir plusieurs voisins, on préfère donner l&#39;adresse IP (ou les deux).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"12\"><div class=\"ex-q\"><p><strong>t4f.<\/strong> Configurer sur R2 une route reliée directement vers chaque réseau local de R1.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Les deux LAN de R1 sont derrière l&#39;interface de R2 qui regarde vers R1.<\/p>\n<\/div><div class=\"ex-c\" hidden><pre><code>R2(config)# ip route 172.16.11.0 255.255.255.0 s0/0/0\nR2(config)# ip route 172.16.12.0 255.255.255.0 s0/0/0<\/code><\/pre>\n<p>Après ça, le ping de PC2 vers 192.168.10.1 <strong>réussit<\/strong> : R2 sait maintenant renvoyer la réponse.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"13\"><div class=\"ex-q\"><p><strong>t4g.<\/strong> Quelle commande affiche uniquement les réseaux connectés directement ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : show ip route connected<\/b><\/p><p><code>show ip route connected<\/code><\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"14\"><div class=\"ex-q\"><p><strong>t4h.<\/strong> Quelle commande affiche uniquement les routes statiques ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : show ip route static<\/b><\/p><p><code>show ip route static<\/code><\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"15\"><div class=\"ex-q\"><p><strong>t4i.<\/strong> Dans la table complète, comment distinguer une route statique reliée directement d&#39;un réseau connecté ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Regarde la première lettre de la ligne.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Par le <strong>code en début de ligne<\/strong> :\n<code>C 209.165.201.0/30 is directly connected, Serial0/0/0<\/code> → réseau connecté (C).\n<code>S 172.16.11.0/24 is directly connected, Serial0/0/0<\/code> → route <strong>statique<\/strong> (S) reliée directement.\nLes deux disent « is directly connected » : seul le code C ou S les distingue. (Tu verras aussi des lignes <code>L<\/code> : l&#39;adresse de l&#39;interface elle-même, en /32.)<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Tâche 4 · Étapes 3 et 4 : route par défaut sur R2 et vérifications<\/h3><div class=\"ex\" data-x=\"16\"><div class=\"ex-q\"><p><strong>t4j.<\/strong> Différence entre une route par défaut et une route statique normale ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Une route statique normale vise <strong>un réseau précis<\/strong> (ex. 172.16.11.0/24). La route par défaut vise <strong>tout le reste<\/strong> : 0.0.0.0 masque 0.0.0.0 (/0) correspond à n&#39;importe quelle adresse.\nElle ne sert qu&#39;en <strong>dernier recours<\/strong> : le routeur choisit toujours la correspondance la plus longue, donc une route plus précise passe avant. Typique d&#39;un routeur qui n&#39;a qu&#39;une sortie vers Internet (ici, R2 vers ISP).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"17\"><div class=\"ex-q\"><p><strong>t4k.<\/strong> Configurer sur R2 une route par défaut vers ISP.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><pre><code>R2(config)# ip route 0.0.0.0 0.0.0.0 209.165.201.130<\/code><\/pre>\n<p>(Variante reliée directement : <code>ip route 0.0.0.0 0.0.0.0 s0/0/1<\/code>.) 209.165.201.130 est l&#39;adresse de ISP sur la liaison avec R2.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"18\"><div class=\"ex-q\"><p><strong>t4l.<\/strong> Comment la route par défaut s&#39;affiche-t-elle dans la table de routage ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><pre><code>Gateway of last resort is 209.165.201.130 to network 0.0.0.0\nS*   0.0.0.0/0 [1/0] via 209.165.201.130<\/code><\/pre>\n<p>Code <strong>S*<\/strong> : S = statique, * = candidate par défaut. La ligne « Gateway of last resort », qui indiquait « not set », donne maintenant la passerelle de dernier recours.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"19\"><div class=\"ex-q\"><p><strong>t4m.<\/strong> Ping de PC2 vers PC1. La requête aboutit-elle ? Justifier.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Suis l&#39;aller (R1, R2, ISP) puis le retour depuis ISP.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><strong>Non.<\/strong> L&#39;aller fonctionne : R1 → route vers 209.165.200.224/27 via R2 → R2 → route par défaut vers ISP → ISP → PC1, qui répond.\nLe retour échoue : PC1 renvoie à ISP, et <strong>ISP n&#39;a aucune route vers 172.16.11.0/24<\/strong>. Il jette la réponse : « Request timed out ». La tâche 5 corrige cela.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"20\"><div class=\"ex-q\"><p><strong>t4n.<\/strong> Quelles commandes show permettent de vérifier les routes statiques ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>show ip route<\/code> (table complète, codes S et S*) ; <code>show ip route static<\/code> (uniquement les statiques) ; <code>show running-config | include ip route<\/code> (les commandes tapées, même si une route n&#39;est pas installée) ; <code>show ip interface brief<\/code> (interfaces up/up, sinon la route ne s&#39;installe pas). Puis on teste avec <code>ping<\/code> et <code>traceroute<\/code> (<code>tracert<\/code> sur les PC).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Tâche 5 · Route récapitulative sur ISP<\/h3><div class=\"ex\" data-x=\"21\"><div class=\"ex-q\"><p><strong>t5a.<\/strong> Depuis ISP, combien de routes faut-il pour atteindre les réseaux locaux de R1 ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 2<\/b><\/p><p><strong>2 routes<\/strong> : 172.16.11.0/24 et 172.16.12.0/24.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"22\"><div class=\"ex-q\"><p><strong>t5b.<\/strong> Le chemin pour atteindre ces réseaux est-il unique ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><strong>Oui.<\/strong> Les deux réseaux sont derrière R1, et ISP n&#39;atteint R1 qu&#39;en passant par R2 (prochain saut 209.165.201.129, sortie Se0/0/0). Même chemin pour les deux : on peut les remplacer par une seule route récapitulative.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"23\"><div class=\"ex-q\"><p><strong>t5c.<\/strong> Configurer une route récapitulative sur ISP qui englobe les réseaux locaux de R1.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Écris 11 et 12 en binaire et compte les bits communs à gauche.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>11 = 0000<strong>1<\/strong>011, 12 = 0000<strong>1<\/strong>100 : 5 bits communs dans le 3ᵉ octet → 16 + 5 = <strong>/21<\/strong> → réseau <strong>172.16.8.0<\/strong>, masque <strong>255.255.248.0<\/strong>.<\/p>\n<pre><code>ISP(config)# ip route 172.16.8.0 255.255.248.0 209.165.201.129<\/code><\/pre>\n<p>Dans la table : <code>S 172.16.8.0/21 [1/0] via 209.165.201.129<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"24\"><div class=\"ex-q\"><p><strong>t5d.<\/strong> Tester la connectivité entre les réseaux locaux de R1 et ISP.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Les pings <strong>réussissent<\/strong> : PC1 ↔ PC2 et PC1 ↔ PC3.\nAller PC2 → PC1 : R1 (route vers 209.165.200.224/27) → R2 (route par défaut) → ISP → PC1.\nRetour : ISP (résumé 172.16.8.0/21) → R2 (route vers 172.16.11.0 par s0/0/0) → R1 → PC2.\nChaque routeur sur le chemin sait maintenant où envoyer dans les deux sens.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Tâche 6 · Routes flottantes<\/h3><div class=\"ex\" data-x=\"25\"><div class=\"ex-q\"><p><strong>t6.<\/strong> Ajouter la liaison série R1 Se0/0/1 ↔ ISP Se0/0/1 (209.165.202.0/30).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Câble Serial DCE. clock rate du côté DCE uniquement.<\/p>\n<\/div><div class=\"ex-c\" hidden><pre><code>R1(config)# interface s0/0/1\nR1(config-if)# ip address 209.165.202.1 255.255.255.252\nR1(config-if)# clock rate 128000\nR1(config-if)# no shutdown\nISP(config)# interface s0/0/1\nISP(config-if)# ip address 209.165.202.2 255.255.255.252\nISP(config-if)# no shutdown<\/code><\/pre>\n<p>Ici le côté DCE est supposé être R1 (clique d&#39;abord sur R1 en posant le câble). L&#39;énoncé ne le précise pas : vérifie avec <code>show controllers serial 0/0/1<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"26\"><div class=\"ex-q\"><p><strong>t6a.<\/strong> Quelle est la distance administrative d&#39;une route statique ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1<\/b><\/p><p><strong>1<\/strong> (un réseau connecté a 0). Plus l&#39;AD est petite, plus la route est crue. Dans <code>[1/0]<\/code>, le premier nombre est l&#39;AD, le second la métrique.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"27\"><div class=\"ex-q\"><p><strong>t6b.<\/strong> Route flottante sur R1 vers le réseau local de ISP, AD 5.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><pre><code>R1(config)# ip route 209.165.200.224 255.255.255.224 209.165.202.2 5<\/code><\/pre>\n<p>Le dernier nombre est l&#39;AD. 5 &gt; 1 : tant que la route via R2 (AD 1) existe, celle-ci reste en réserve.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"28\"><div class=\"ex-q\"><p><strong>t6c.<\/strong> Route flottante résumée sur ISP vers les réseaux locaux de R1, AD 5.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><pre><code>ISP(config)# ip route 172.16.8.0 255.255.248.0 209.165.202.1 5<\/code><\/pre>\n<p>Même résumé qu&#39;à la tâche 5, mais par la nouvelle liaison et avec une AD de 5.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"29\"><div class=\"ex-q\"><p><strong>t6d.<\/strong> Vérifier que ces routes ne figurent pas dans les tables de routage de R1 et ISP.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>show ip route static<\/code> sur R1 : seulement <code>S 209.165.200.224/27 [1/0] via 209.165.201.2<\/code>. Sur ISP : seulement <code>S 172.16.8.0/21 [1/0] via 209.165.201.129<\/code>.\nLes routes flottantes n&#39;apparaissent pas : pour une même destination, le routeur n&#39;installe que la route à la plus petite AD (1 &lt; 5). Elles sont bien enregistrées : <code>show running-config | include ip route<\/code> les montre.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"30\"><div class=\"ex-q\"><p><strong>t6e.<\/strong> Tester la route flottante en désactivant R2.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Éteins R2 (onglet Physical, bouton d&#39;alimentation) ou tape shutdown sur ses deux interfaces série.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Les liaisons R1–R2 et R2–ISP tombent. Sur R1, le prochain saut 209.165.201.2 n&#39;est plus joignable : la route <code>[1/0]<\/code> disparaît et la flottante s&#39;installe : <code>S 209.165.200.224/27 [5/0] via 209.165.202.2<\/code>. Sur ISP de même : <code>S 172.16.8.0/21 [5/0] via 209.165.202.1<\/code>.\nLe ping PC2 ↔ PC1 <strong>réussit de nouveau<\/strong> (un ou deux paquets peuvent se perdre pendant le basculement). <code>tracert 209.165.200.226<\/code> depuis PC2 montre le nouveau chemin : 172.16.11.1 → 209.165.202.2 → 209.165.200.226.\nQuand R2 revient, les routes à AD 1 reprennent leur place et les flottantes repassent en réserve.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>La Loopback 192.168.10.1 n&#39;est plus joignable pendant la panne : elle est sur R2. C&#39;est normal.<\/p>\n<\/aside><div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Toutes les commandes du TP<\/h2>\n<p>À coller dans le CLI de chaque routeur, après la configuration des interfaces (tâche 2).<\/p>\n<pre class=\"\"><code>! ---- R1 ----\nip route 192.168.10.0 255.255.255.0 209.165.201.2\nip route 209.165.201.128 255.255.255.252 209.165.201.2\nip route 209.165.200.224 255.255.255.224 209.165.201.2\ninterface s0/0/1\n ip address 209.165.202.1 255.255.255.252\n clock rate 128000\n no shutdown\n exit\nip route 209.165.200.224 255.255.255.224 209.165.202.2 5\n\n! ---- R2 ----\nip route 172.16.11.0 255.255.255.0 s0/0/0\nip route 172.16.12.0 255.255.255.0 s0/0/0\nip route 0.0.0.0 0.0.0.0 209.165.201.130\n\n! ---- ISP ----\nip route 172.16.8.0 255.255.248.0 209.165.201.129\ninterface s0/0/1\n ip address 209.165.202.2 255.255.255.252\n no shutdown\n exit\nip route 172.16.8.0 255.255.248.0 209.165.202.1 5<\/code><\/pre><aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>Les réponses de ce chapitre ont été vérifiées par une simulation des tables de routage à chaque étape (qui peut joindre qui, à l&#39;aller et au retour). Les messages exacts affichés par Packet Tracer peuvent varier légèrement selon la version.<\/p>\n<\/aside><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 9 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Combien de routes statiques faut-il sur ISP, sans résumé ni route par défaut, pour joindre tous les réseaux du TP (avant la tâche 6) ?<\/div><button class=\"opt\" data-o=\"0\">2<\/button><button class=\"opt\" data-o=\"1\">3<\/button><button class=\"opt\" data-o=\"2\">4<\/button><button class=\"opt\" data-o=\"3\">6<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Dans <code>ip route 192.168.10.0 255.255.255.0 209.165.201.2<\/code>, que représente 209.165.201.2 ?<\/div><button class=\"opt\" data-o=\"0\">l&#39;adresse du réseau de destination<\/button><button class=\"opt\" data-o=\"1\">l&#39;adresse du prochain saut (le routeur voisin)<\/button><button class=\"opt\" data-o=\"2\">l&#39;adresse de la passerelle du PC<\/button><button class=\"opt\" data-o=\"3\">l&#39;interface de sortie<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Pourquoi une route récursive demande-t-elle deux recherches dans la table ?<\/div><button class=\"opt\" data-o=\"0\">parce que le routeur vérifie la route deux fois par sécurité<\/button><button class=\"opt\" data-o=\"1\">parce qu&#39;il doit ensuite chercher par quelle interface joindre le prochain saut<\/button><button class=\"opt\" data-o=\"2\">parce que la distance administrative est calculée à part<\/button><button class=\"opt\" data-o=\"3\">parce que le masque est inversé<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Après la tâche 4 étape 1, PC2 ne peut pas pinger 192.168.10.1. Pourquoi ?<\/div><button class=\"opt\" data-o=\"0\">R1 n&#39;a pas de route vers 192.168.10.0<\/button><button class=\"opt\" data-o=\"1\">la Loopback est éteinte<\/button><button class=\"opt\" data-o=\"2\">R2 n&#39;a pas de route pour renvoyer la réponse vers 172.16.11.0/24<\/button><button class=\"opt\" data-o=\"3\">PC2 n&#39;a pas de passerelle<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Comment s&#39;affiche une route statique reliée directement ?<\/div><button class=\"opt\" data-o=\"0\">C 172.16.11.0/24 is directly connected, Serial0/0/0<\/button><button class=\"opt\" data-o=\"1\">S 172.16.11.0/24 is directly connected, Serial0/0/0<\/button><button class=\"opt\" data-o=\"2\">S 172.16.11.0/24 [1/0] via 209.165.201.1<\/button><button class=\"opt\" data-o=\"3\">L 172.16.11.0/24 is directly connected, Serial0/0/0<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Quelle commande crée une route par défaut sur R2 vers ISP ?<\/div><button class=\"opt\" data-o=\"0\">ip route 255.255.255.255 0.0.0.0 209.165.201.130<\/button><button class=\"opt\" data-o=\"1\">ip default-route 209.165.201.130<\/button><button class=\"opt\" data-o=\"2\">ip route 0.0.0.0 0.0.0.0 209.165.201.130<\/button><button class=\"opt\" data-o=\"3\">ip route 209.165.201.128 255.255.255.252 0.0.0.0<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Un routeur a une route vers 172.16.11.0/24 et une route par défaut. Un paquet vers 172.16.11.10 utilise :<\/div><button class=\"opt\" data-o=\"0\">la route 172.16.11.0/24<\/button><button class=\"opt\" data-o=\"1\">la route par défaut, car elle est prioritaire<\/button><button class=\"opt\" data-o=\"2\">les deux, en alternance<\/button><button class=\"opt\" data-o=\"3\">celle configurée en dernier<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Quelle route récapitulative englobe 172.16.11.0/24 et 172.16.12.0/24 ?<\/div><button class=\"opt\" data-o=\"0\">172.16.11.0/23<\/button><button class=\"opt\" data-o=\"1\">172.16.10.0/22<\/button><button class=\"opt\" data-o=\"2\">172.16.8.0/21<\/button><button class=\"opt\" data-o=\"3\">172.16.0.0/24<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Quel masque correspond à /21 ?<\/div><button class=\"opt\" data-o=\"0\">255.255.240.0<\/button><button class=\"opt\" data-o=\"1\">255.255.248.0<\/button><button class=\"opt\" data-o=\"2\">255.255.252.0<\/button><button class=\"opt\" data-o=\"3\">255.255.255.248<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Quelle est la distance administrative par défaut d&#39;une route statique ?<\/div><button class=\"opt\" data-o=\"0\">0<\/button><button class=\"opt\" data-o=\"1\">1<\/button><button class=\"opt\" data-o=\"2\">5<\/button><button class=\"opt\" data-o=\"3\">110<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"10\"><div class=\"qq-q\">Avec R2 en marche, la route <code>ip route 209.165.200.224 255.255.255.224 209.165.202.2 5<\/code> n&#39;apparaît pas dans la table de R1. Pourquoi ?<\/div><button class=\"opt\" data-o=\"0\">elle contient une erreur de syntaxe<\/button><button class=\"opt\" data-o=\"1\">l&#39;interface Se0/0/1 est éteinte<\/button><button class=\"opt\" data-o=\"2\">une route vers le même réseau avec une AD plus petite (1) est déjà installée<\/button><button class=\"opt\" data-o=\"3\">les routes statiques n&#39;acceptent pas d&#39;AD<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"11\"><div class=\"qq-q\">On éteint R2. Que devient la table de R1 ?<\/div><button class=\"opt\" data-o=\"0\">elle ne change pas<\/button><button class=\"opt\" data-o=\"1\">toutes les routes statiques sont supprimées<\/button><button class=\"opt\" data-o=\"2\">la route via 209.165.201.2 disparaît et la route flottante [5/0] via 209.165.202.2 s&#39;installe<\/button><button class=\"opt\" data-o=\"3\">R1 apprend automatiquement une nouvelle route par ISP<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"n45","rep":null,"tol":null},{"n":"n49","rep":null,"tol":null},{"n":"n49","rep":null,"tol":null},{"n":"n49","rep":["6"],"tol":null},{"n":"n49","rep":null,"tol":null},{"n":"n49","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n49","rep":null,"tol":null},{"n":"n49","rep":null,"tol":null},{"n":"n49","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n49","rep":null,"tol":null},{"n":"n49","rep":null,"tol":null},{"n":"n49","rep":["show ip route connected","sh ip route connected","show ip route c"],"tol":null},{"n":"n49","rep":["show ip route static","sh ip route static","show ip route s"],"tol":null},{"n":"n49","rep":null,"tol":null},{"n":"n49","rep":null,"tol":null},{"n":"n49","rep":null,"tol":null},{"n":"n49","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n49","rep":null,"tol":null},{"n":"n50","rep":["2"],"tol":null},{"n":"n50","rep":null,"tol":null},{"n":"n50","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n51","rep":null,"tol":null},{"n":"n51","rep":["1"],"tol":null},{"n":"n51","rep":null,"tol":null},{"n":"n51","rep":null,"tol":null},{"n":"n51","rep":null,"tol":null},{"n":"n51","rep":null,"tol":null}],"qcm":[{"n":"n49","q":"Combien de routes statiques faut-il sur ISP, sans résumé ni route par défaut, pour joindre tous les réseaux du TP (avant la tâche 6) ?","o":["2","3","4","6"],"a":2,"e":"6 réseaux au total, 2 connectés à ISP : 6 − 2 = 4."},{"n":"n49","q":"Dans <code>ip route 192.168.10.0 255.255.255.0 209.165.201.2<\/code>, que représente 209.165.201.2 ?","o":["l&#39;adresse du réseau de destination","l&#39;adresse du prochain saut (le routeur voisin)","l&#39;adresse de la passerelle du PC","l&#39;interface de sortie"],"a":1,"e":"C&#39;est une route récursive : on donne l&#39;IP du voisin, ici Se0/0/0 de R2."},{"n":"n49","q":"Pourquoi une route récursive demande-t-elle deux recherches dans la table ?","o":["parce que le routeur vérifie la route deux fois par sécurité","parce qu&#39;il doit ensuite chercher par quelle interface joindre le prochain saut","parce que la distance administrative est calculée à part","parce que le masque est inversé"],"a":1,"e":"1ʳᵉ recherche : la destination → prochain saut. 2ᵉ : le prochain saut → interface de sortie."},{"n":"n34","q":"Après la tâche 4 étape 1, PC2 ne peut pas pinger 192.168.10.1. Pourquoi ?","o":["R1 n&#39;a pas de route vers 192.168.10.0","la Loopback est éteinte","R2 n&#39;a pas de route pour renvoyer la réponse vers 172.16.11.0/24","PC2 n&#39;a pas de passerelle"],"a":2,"e":"L&#39;aller fonctionne grâce à R1. Le retour échoue : R2 ne connaît pas 172.16.11.0/24."},{"n":"n49","q":"Comment s&#39;affiche une route statique reliée directement ?","o":["C 172.16.11.0/24 is directly connected, Serial0/0/0","S 172.16.11.0/24 is directly connected, Serial0/0/0","S 172.16.11.0/24 [1/0] via 209.165.201.1","L 172.16.11.0/24 is directly connected, Serial0/0/0"],"a":1,"e":"Même texte qu&#39;un réseau connecté, mais avec le code S au lieu de C."},{"n":"n49","q":"Quelle commande crée une route par défaut sur R2 vers ISP ?","o":["ip route 255.255.255.255 0.0.0.0 209.165.201.130","ip default-route 209.165.201.130","ip route 0.0.0.0 0.0.0.0 209.165.201.130","ip route 209.165.201.128 255.255.255.252 0.0.0.0"],"a":2,"e":"Réseau 0.0.0.0 et masque 0.0.0.0 : la route correspond à toutes les destinations."},{"n":"n49","q":"Un routeur a une route vers 172.16.11.0/24 et une route par défaut. Un paquet vers 172.16.11.10 utilise :","o":["la route 172.16.11.0/24","la route par défaut, car elle est prioritaire","les deux, en alternance","celle configurée en dernier"],"a":0,"e":"Correspondance la plus longue : /24 l&#39;emporte sur /0."},{"n":"n50","q":"Quelle route récapitulative englobe 172.16.11.0/24 et 172.16.12.0/24 ?","o":["172.16.11.0/23","172.16.10.0/22","172.16.8.0/21","172.16.0.0/24"],"a":2,"e":"11 = 00001011 et 12 = 00001100 : 5 bits communs (00001) → /21, réseau 172.16.8.0."},{"n":"n50","q":"Quel masque correspond à /21 ?","o":["255.255.240.0","255.255.248.0","255.255.252.0","255.255.255.248"],"a":1,"e":"21 bits à 1 : 8 + 8 + 5. Dans le 3ᵉ octet, 11111000 = 248."},{"n":"n51","q":"Quelle est la distance administrative par défaut d&#39;une route statique ?","o":["0","1","5","110"],"a":1,"e":"Connecté 0, statique 1. 110 est celle d&#39;OSPF."},{"n":"n51","q":"Avec R2 en marche, la route <code>ip route 209.165.200.224 255.255.255.224 209.165.202.2 5<\/code> n&#39;apparaît pas dans la table de R1. Pourquoi ?","o":["elle contient une erreur de syntaxe","l&#39;interface Se0/0/1 est éteinte","une route vers le même réseau avec une AD plus petite (1) est déjà installée","les routes statiques n&#39;acceptent pas d&#39;AD"],"a":2,"e":"C&#39;est le principe de la route flottante : elle reste en réserve tant que la route d&#39;AD 1 existe."},{"n":"n51","q":"On éteint R2. Que devient la table de R1 ?","o":["elle ne change pas","toutes les routes statiques sont supprimées","la route via 209.165.201.2 disparaît et la route flottante [5/0] via 209.165.202.2 s&#39;installe","R1 apprend automatiquement une nouvelle route par ISP"],"a":2,"e":"Le prochain saut n&#39;est plus joignable, la route principale est retirée, la flottante prend sa place."}]},{"id":"entrainement","t":"Entraînement : calculs, rédaction, TD inédit","seance":"Outils interactifs","imp":3,"html":"<h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Mets-toi en conditions d&#39;examen.<\/strong> Chronomètre, pas de notes. L&#39;objectif est de trouver ce qui te coûte des points.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Refaire seulement les calculs que tu réussis déjà. Commence par ton journal d&#39;erreurs.<\/p>\n<\/aside><h2>L&#39;entraînement<\/h2>\n<h2>Calculs générés<\/h2>\n<p>Débits, temps de transfert, délais : de nouveaux nombres à chaque fois, corrigés en détail.<\/p>\n<div class=\"integre\" data-src=\"reseaux-M351-outils.html\" data-ancre=\"calc\" data-cible=\"[data-tab=&quot;calc&quot;]\" data-garder=\"\"><div class=\"integre-att\">Chargement de l'outil…<\/div><\/div><h2>Rédaction corrigée<\/h2>\n<p>Réponds comme à l&#39;examen ;
