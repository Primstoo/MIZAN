{"n":"n28","rep":null,"tol":null},{"n":"n28","rep":null,"tol":null},{"n":"n28","rep":null,"tol":null},{"n":"n28","rep":null,"tol":null},{"n":"n37","rep":null,"tol":null},{"n":"n37","rep":null,"tol":null},{"n":"n28","rep":null,"tol":null},{"n":"n9","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null}],"qcm":[]}];

{"id":"n27","t":"Ch2 · MTU, MSS et segmentation","imp":4,"ch":"s10"},{"id":"n28","t":"Équipements : carte réseau, répéteur, adresse IP/MAC","imp":3,"ch":"s10"},{"id":"n36","t":"Ch2 · Liaison : délimitation, fanion, bit de transparence","imp":4,"ch":"s11"},{"id":"n37","t":"Ch2 · Liaison : services, LLC/MAC, accès au support, contrôle de flux","imp":4,"ch":"s11"},{"id":"n29","t":"Ch2 · Parité (VRC / LRC)","imp":5,"ch":"s11"},{"id":"n30","t":"Ch2 · CRC (division polynomiale)","imp":5,"ch":"s11"},{"id":"n31","t":"Ch2 · Code de Hamming (7,4)","imp":5,"ch":"s11"},{"id":"n32","t":"Ch2 · Physique : codages NRZ, RZ, Manchester, Miller…","imp":5,"ch":"s12"},{"id":"n33","t":"Ch2 · Physique : modes de transmission, câbles, sans fil","imp":4,"ch":"s12"},{"id":"n34","t":"Ch2 · Réseau : IPv4, routage, passerelle, diffusion, ICMP","imp":4,"ch":"s13"},{"id":"n35","t":"Ch2 · Transport (fenêtre, FIN) et messages HTTP","imp":3,"ch":"s13"},{"id":"n38","t":"En-tête IPv4 : les 12 champs fixes (signal du prof)","imp":5,"ch":"s14"},{"id":"n39","t":"En-tête TCP : champs et drapeaux (signal du prof)","imp":5,"ch":"s14"},{"id":"n40","t":"En-tête UDP (signal du prof)","imp":4,"ch":"s14"},{"id":"n41","t":"Ch2 · Trame Ethernet : champs et décodage","imp":4,"ch":"s11"},{"id":"n42","t":"Ch2 · TCP : Seq, ACK cumulatif, fenêtres (rwnd, cwnd)","imp":5,"ch":"s10"},{"id":"n43","t":"Domaines de collision et de diffusion","imp":4,"ch":"s3"}];
const CARTES=[{"n":"n1","k":0,"ch":"s1","q":"<p>Définition d&#39;un réseau informatique (cours) ?</p>\n","r":"<p>Ensemble d&#39;appareils (ordinateurs et périphériques) reliés entre eux pour permettre à leurs utilisateurs de transférer des informations électroniques, de communiquer et de partager des ressources matérielles et logicielles.</p>\n"},{"n":"n1","k":1,"ch":"s1","q":"<p>3 utilités des réseaux pour une entreprise ?</p>\n","r":"<p>Au choix : partage des ressources ; fiabilité / résistance aux pannes (duplication) ; réduction des coûts ; outils de communication ; commerce électronique.</p>\n"},{"n":"n2","k":2,"ch":"s2","q":"<p>Définition d&#39;un protocole ?</p>\n","r":"<p>Un ensemble de règles utilisées par les périphériques en réseau pour communiquer.</p>\n"},{"n":"n2","k":3,"ch":"s2","q":"<p>Les 5 règles (protocoles) qui régissent une communication ?</p>\n","r":"<ol>\n<li>Identification de l&#39;expéditeur et du destinataire<br>2. Méthode de communication convenue<br>3. Langue et syntaxe communes<br>4. Vitesse et rythme<br>5. Demande de confirmation ou de reçu</li>\n</ol>\n"},{"n":"n3","k":4,"ch":"s2","q":"<p>Les 3 facteurs INTERNES de qualité d&#39;une communication ?</p>\n","r":"<p>Taille du message, complexité du message, importance du message (liés à la nature du message).</p>\n"},{"n":"n3","k":5,"ch":"s2","q":"<p>Les 5 facteurs EXTERNES de qualité ?</p>\n","r":"<p>Qualité du chemin d&#39;accès ; nombre de changements de forme ; nombre de redirections / réadressages ; quantité d&#39;autres messages simultanés ; délai alloué à la communication.</p>\n"},{"n":"n4","k":6,"ch":"s2","q":"<p>Les éléments d&#39;une communication (schéma) ?</p>\n","r":"<p>Émetteur/récepteur ↔ coupleur de communication ↔ médium ↔ coupleur ↔ émetteur/récepteur. Les informations sont des éléments physiques (lumière, son, tension…) auxquels on a donné un sens.</p>\n"},{"n":"n5","k":7,"ch":"s2","q":"<p>Segmentation : définition + 2 avantages ?</p>\n","r":"<p>Diviser les données en parties plus petites et plus faciles à gérer.<br>+ Les parties n&#39;ont pas besoin de suivre le même chemin.<br>+ Si une partie est perdue, seule cette partie est retransmise (plus de fiabilité).</p>\n"},{"n":"n5","k":8,"ch":"s2","q":"<p>Multiplexage : définition ?</p>\n","r":"<p>La fusion de plusieurs flux de données sur un même canal : de nombreuses conversations peuvent s&#39;entremêler sur le réseau.</p>\n"},{"n":"n5","k":9,"ch":"s2","q":"<p>Inconvénient de la segmentation et du multiplexage ?</p>\n","r":"<p>Le niveau de complexité ajouté : il faut étiqueter chaque partie pour pouvoir l&#39;acheminer puis la réassembler.</p>\n"},{"n":"n6","k":10,"ch":"s2","q":"<p>Réseau convergent ?</p>\n","r":"<p>Une plateforme unique qui réunit des réseaux autrefois séparés (téléphone, radio, TV, données).</p>\n"},{"n":"n5","k":128,"ch":"s2","q":"<p>Ordre d&#39;une communication, de l&#39;émetteur au récepteur ?</p>\n","r":"<p>Segmentation → multiplexage → étiquetage → encodage → émission → réception → décodage → assemblage.</p>\n"},{"n":"n7","k":11,"ch":"s3","q":"<p>Les 5 éléments de base d&#39;un réseau ?</p>\n","r":"<p>Périphériques ; nœuds intermédiaires ; messages ; supports de transmission ; protocoles (règles de communication).</p>\n"},{"n":"n8","k":12,"ch":"s3","q":"<p>Hôte vs périphérique partagé ?</p>\n","r":"<p>Hôte (end-user) : envoie et reçoit directement sur le réseau (PC, serveur…).<br>Périphérique partagé : pas directement connecté, il accède au réseau à travers un hôte (imprimante, webcam…).</p>\n"},{"n":"n8","k":13,"ch":"s3","q":"<p>Serveur vs client ?</p>\n","r":"<p>Serveur : hôte qui fournit des données ou des services (DHCP, DNS, Web…).<br>Client : hôte avec un logiciel qui interroge le serveur et affiche les informations.</p>\n"},{"n":"n9","k":14,"ch":"s3","q":"<p>Rôle d&#39;un nœud intermédiaire ?</p>\n","r":"<p>Transférer les messages d&#39;une ligne d&#39;entrée vers une ligne de sortie : routeur, commutateur (switch), concentrateur (hub).</p>\n"},{"n":"n9","k":15,"ch":"s3","q":"<p>Switch/hub vs routeur ?</p>\n","r":"<p>Switch et hub : connectent les hôtes au sein d&#39;un MÊME segment.<br>Routeur : connecte les segments ENTRE EUX.</p>\n"},{"n":"n9","k":16,"ch":"s3","q":"<p>Messages : sous quelle forme circulent-ils ?</p>\n","r":"<p>Convertis en bits, c&#39;est-à-dire en signaux numériques codés en binaire.</p>\n"},{"n":"n10","k":17,"ch":"s3","q":"<p>3 catégories de supports de transmission ?</p>\n","r":"<p>Filaires (grandeur électrique sur câble métallique) ; optiques (lumière) ; sans fil / hertziens (ondes électromagnétiques). Ils se situent au niveau de la couche physique.</p>\n"},{"n":"n10","k":18,"ch":"s3","q":"<p>4 critères de choix d&#39;un support ?</p>\n","r":"<p>Distance ; environnement d&#39;installation ; quantité de données et débit ; coût du support et de l&#39;installation.</p>\n"},{"n":"n11","k":19,"ch":"s3","q":"<p>Pile de protocoles serveur web ↔ navigateur (haut → bas) ?</p>\n","r":"<p>HTTP → TCP → IP → Ethernet</p>\n"},{"n":"n11","k":20,"ch":"s3","q":"<p>Que fait une suite de protocoles ? (4 éléments)</p>\n","r":"<p>Le format du message ; la façon de partager les chemins vers d&#39;autres réseaux ; comment et quand transférer les messages d&#39;erreur et système ; l&#39;établissement et l&#39;arrêt des sessions.</p>\n"},{"n":"n11","k":21,"ch":"s3","q":"<p>Norme : définition ?</p>\n","r":"<p>Processus ou protocole reconnu par l&#39;industrie et ratifié par un organisme de normalisation (IEEE, IETF).</p>\n"},{"n":"n11","k":22,"ch":"s3","q":"<p>IEEE vs IETF : exemples ?</p>\n","r":"<p>IEEE : 802.3 (Ethernet), 802.11 (WLAN).<br>IETF : normes Internet publiées en RFC (Request for Comments) : TCP, IP, HTTP, FTP.</p>\n"},{"n":"n8","k":129,"ch":"s3","q":"<p>Client-serveur ou pair à pair ?</p>\n","r":"<p>Client-serveur : un serveur dédié fournit un service à des clients. Pair à pair : chaque hôte est à la fois client et serveur, sans serveur central.</p>\n"},{"n":"n43","k":144,"ch":"s3","q":"<p>Domaines de collision : combien chez un hub, un switch, un routeur ?</p>\n","r":"<p>Hub : un seul pour tous les ports. Switch : un par port. Routeur : un par interface.</p>\n"},{"n":"n43","k":145,"ch":"s3","q":"<p>Domaines de diffusion : qui les sépare ?</p>\n","r":"<p>Seul le routeur (un domaine par interface). Hubs et switchs laissent passer la diffusion.</p>\n"},{"n":"n43","k":146,"ch":"s3","q":"<p>À quel domaine de collision appartient une liaison switch–hub ?</p>\n","r":"<p>À celui du hub : le câble partage le support avec tous les ports du hub.</p>\n"},{"n":"n12","k":23,"ch":"s4","q":"<p>Critères de classification des réseaux ?</p>\n","r":"<p>Couverture géographique ; topologie ; architecture (poste-à-poste / client-serveur) ; technique de transfert ; débit ; ouverture (privé/public) ; méthode d&#39;accès (CSMA/CD, CSMA/CA, jeton) ; QoS.</p>\n"},{"n":"n13","k":24,"ch":"s4","q":"<p>PAN : portée et technologies ?</p>\n","r":"<p>Réseau personnel d&#39;environ 1 m², surtout sans fil (souris, clavier, imprimante) : Bluetooth, infrarouge.</p>\n"},{"n":"n13","k":25,"ch":"s4","q":"<p>LAN : 4 caractéristiques ?</p>\n","r":"<p>Zone géographique unique, sous un même contrôle administratif ; Ethernet ou WLAN ; débits très élevés ; relie des unités adjacentes (entreprise, campus).</p>\n"},{"n":"n13","k":26,"ch":"s4","q":"<p>MAN ?</p>\n","r":"<p>Interconnecte plusieurs LAN géographiquement proches (quelques dizaines de km, une ville), souvent en fibre optique à haut débit. Les machines communiquent comme si elles étaient dans un même LAN.</p>\n"},{"n":"n13","k":27,"ch":"s4","q":"<p>WAN : rôle + technologies ?</p>\n","r":"<p>Relie des LAN séparés géographiquement. Technologies : PPP, HDLC, relais de trames, ATM, RNIS, MPLS.</p>\n"},{"n":"n14","k":28,"ch":"s5","q":"<p>Topologie logique vs physique ?</p>\n","r":"<p>Logique : périphériques, ports et schéma d&#39;adressage IP.<br>Physique : emplacement physique des périphériques, des ports configurés et des câbles.</p>\n"},{"n":"n15","k":29,"ch":"s5","q":"<p>Les 6 topologies physiques du cours ?</p>\n","r":"<p>Bus, anneau, étoile, étoile étendue, maillée (mesh), hiérarchique.</p>\n"},{"n":"n15","k":30,"ch":"s5","q":"<p>Bus : support, avantage, inconvénient ?</p>\n","r":"<p>Toutes les machines sont sur une même ligne (souvent du câble coaxial).<br>+ Simple, facile à mettre en œuvre.<br>− Si le câble commun se rompt, tout le réseau tombe.</p>\n"},{"n":"n15","k":31,"ch":"s5","q":"<p>Anneau : fonctionnement + FDDI ?</p>\n","r":"<p>Hôtes chaînés en boucle, données passées au voisin dans un seul sens ; un jeton circule (Token Ring).<br>FDDI = double anneau : le second anneau assure la tolérance aux pannes du premier.</p>\n"},{"n":"n15","k":32,"ch":"s5","q":"<p>Étoile : avantage / inconvénient ?</p>\n","r":"<ul>\n<li>Un nœud défectueux n&#39;affecte pas le reste du réseau.<br>− Si le nœud central (hub/switch) tombe, tout le réseau est inutilisable.</li>\n</ul>\n"},{"n":"n15","k":33,"ch":"s5","q":"<p>Étoile étendue ?</p>\n","r":"<p>Chaque nœud relié au nœud central est lui-même le centre d&#39;une autre étoile (plusieurs étoiles reliées par un routeur central). C&#39;est la topologie la plus utilisée.</p>\n"},{"n":"n15","k":34,"ch":"s5","q":"<p>Topologie hiérarchique : intérêt + 3 couches Cisco ?</p>\n","r":"<p>Rend le réseau modulable et facile à agrandir, simplifie l&#39;administration et isole vite les problèmes.<br>Couches : cœur, distribution, accès.</p>\n"},{"n":"n16","k":35,"ch":"s5","q":"<p>Maillage complet : nombre de liaisons pour N terminaux ?</p>\n","r":"<p>N × (N − 1) / 2<br>ex. N = 10 → 45 liaisons.</p>\n"},{"n":"n16","k":36,"ch":"s5","q":"<p>Maillée : usage + inconvénient ?</p>\n","r":"<p>Pour les structures qui ne tolèrent aucune coupure (centrales nucléaires, routeurs du cœur d&#39;Internet).<br>− Le nombre de liaisons explose quand N grandit.</p>\n"},{"n":"n17","k":37,"ch":"s6","q":"<p>4 caractéristiques qu&#39;une architecture réseau doit prendre en compte ?</p>\n","r":"<p>Tolérance aux pannes ; évolutivité ; qualité de service (QoS) ; sécurité.</p>\n"},{"n":"n18","k":38,"ch":"s6","q":"<p>Commutation de circuits : 4 caractéristiques ?</p>\n","r":"<p>Circuit dédié ; service garanti (bande passante, QoS) ; utilisation inefficace du support ; chemin unique, pas de redondance.</p>\n"},{"n":"n18","k":39,"ch":"s6","q":"<p>Commutation de paquets : 4 caractéristiques ?</p>\n","r":"<p>Circuit partagé ; messages divisés en paquets ; utilisation efficace du support ; redondance, plusieurs chemins possibles.</p>\n"},{"n":"n19","k":40,"ch":"s7","q":"<p>Internet : définition ?</p>\n","r":"<p>Réseau des réseaux à l&#39;échelle mondiale, qui interconnecte des réseaux internationaux, régionaux et locaux, tous basés sur la pile TCP/IP.</p>\n"},{"n":"n19","k":41,"ch":"s7","q":"<p>4 grands types d&#39;applications et de services Internet ?</p>\n","r":"<p>Messagerie (individuelle, collective, forums) ; traitement informatique (connexion à distance VPN, FTP) ; publication et information (Web) ; communication directe (chat, visio, peer-to-peer).</p>\n"},{"n":"n20","k":42,"ch":"s8","q":"<p>Bande passante (définition) ?</p>\n","r":"<p>Débit nominal : la capacité du réseau, c&#39;est-à-dire la quantité de données qui peut circuler par unité de temps, en bits/s.</p>\n"},{"n":"n20","k":43,"ch":"s8","q":"<p>4 caractéristiques de la bande passante ?</p>\n","r":"<p>Limitée ; source d&#39;économies (on paie la bande passante) ; mesure clé de conception et de performance ; la demande augmente sans cesse.</p>\n"},{"n":"n20","k":44,"ch":"s8","q":"<p>Débit vs bande passante ?</p>\n","r":"<p>Le débit est la bande passante réelle, mesurée à un instant donné. Il est souvent inférieur à la bande passante, qui est le maximum du média.</p>\n"},{"n":"n20","k":45,"ch":"s8","q":"<p>Débit physique (effectif) vs applicatif (utile) ?</p>\n","r":"<p>Physique : bits émis par seconde sur le support (pour Ethernet : 10, 100, 1000 Mbit/s, 10 Gbit/s).<br>Applicatif : bits de données utiles par seconde au niveau des applications.<br>Le physique est TOUJOURS supérieur, car les couches 2, 3, 4… ajoutent des en-têtes.</p>\n"},{"n":"n20","k":46,"ch":"s8","q":"<p>Équivalences d&#39;unités de débit (cours) ?</p>\n","r":"<p>1 kbit/s = 10³ bit/s<br>1 Mbit/s = 10⁶ bit/s<br>1 Gbit/s = 10⁹ bit/s</p>\n"},{"n":"n21","k":47,"ch":"s8","q":"<p>Formule du temps théorique ?</p>\n","r":"<p>T = taille du fichier (bits) / bande passante (bits/s)</p>\n"},{"n":"n21","k":48,"ch":"s8","q":"<p>Formule du temps réel ?</p>\n","r":"<p>T = taille du fichier (bits) / débit réel au moment du transfert (bits/s)</p>\n"},{"n":"n21","k":49,"ch":"s8","q":"<p>1 Go en bits (convention du prof) ?</p>\n","r":"<p>1 × 1024 × 1024 × 1024 × 8 = 8 589 934 592 bits</p>\n"},{"n":"n21","k":50,"ch":"s8","q":"<p>1 Go à 3 Mbit/s : temps théorique ?</p>\n","r":"<p>8 589 934 592 / 3 000 000 ≈ 2 863 s = 47 min 43 s</p>\n"},{"n":"n22","k":51,"ch":"s9","q":"<p>Les 7 couches OSI (7 → 1) ?</p>\n","r":"<p>7 Application · 6 Présentation · 5 Session · 4 Transport · 3 Réseau · 2 Liaison de données · 1 Physique</p>\n"},{"n":"n22","k":52,"ch":"s9","q":"<p>Rôle court de chaque couche OSI (cours) ?</p>\n","r":"<p>7 Communication avec les logiciels<br>6 Gestion de la syntaxe<br>5 Contrôle du dialogue<br>4 Qualité de la transmission<br>3 Sélection du chemin<br>2 Préparation de l&#39;envoi sur le média<br>1 Envoi sur le média physique</p>\n"},{"n":"n22","k":53,"ch":"s9","q":"<p>Qui a développé le modèle OSI ?</p>\n","r":"<p>L&#39;ISO (International Organization for Standardization). OSI = Open Systems Interconnection.</p>\n"},{"n":"n22","k":54,"ch":"s9","q":"<p>3 fonctions de la couche Présentation ?</p>\n","r":"<p>Codage et conversion des données ; compression / décompression ; chiffrement / déchiffrement.</p>\n"},{"n":"n22","k":55,"ch":"s9","q":"<p>Rôle de la couche Session ?</p>\n","r":"<p>Gérer le dialogue entre applications : l&#39;initier, le maintenir, redémarrer les sessions interrompues ou inactives.</p>\n"},{"n":"n23","k":56,"ch":"s9","q":"<p>Les 4 couches TCP/IP avec leur numéro (prof) ?</p>\n","r":"<p>4 Application (= OSI 5-7)<br>3 Transport (= OSI 4)<br>2 Internet (= OSI 3)<br>1 Accès réseau (= OSI 1-2)</p>\n"},{"n":"n23","k":57,"ch":"s9","q":"<p>Protocoles par couche TCP/IP (cours) ?</p>\n","r":"<p>Application : HTTP/HTTPS, SMTP/POP3, FTP, DNS, Telnet<br>Transport : TCP, UDP<br>Internet : IP, ICMP, IPsec, IGMP<br>Accès réseau : Ethernet, Wi-Fi, PPP, ARP</p>\n"},{"n":"n23","k":58,"ch":"s9","q":"<p>OSI vs TCP/IP : différence clé ?</p>\n","r":"<p>OSI = modèle de référence théorique (cadre d&#39;apprentissage), pas implémenté physiquement.<br>TCP/IP = modèle opérationnel, sur lequel les réseaux sont construits.</p>\n"},{"n":"n24","k":59,"ch":"s9","q":"<p>PDU de chaque couche ?</p>\n","r":"<p>Couches 5-7 : Données<br>4 : Segment<br>3 : Paquet<br>2 : Trame<br>1 : Bits</p>\n"},{"n":"n24","k":60,"ch":"s9","q":"<p>Encapsulation ?</p>\n","r":"<p>À l&#39;émission, quand les données descendent la pile, chaque couche ajoute ses informations de contrôle (en-tête ; la couche 2 ajoute aussi une queue). La désencapsulation est l&#39;inverse, à la réception.</p>\n"},{"n":"n25","k":61,"ch":"s10","q":"<p>DNS : rôle + port ?</p>\n","r":"<p>Traduit un nom de domaine en adresse IP. Base de données distribuée et hiérarchique. Port 53 (TCP/UDP).</p>\n"},{"n":"n25","k":62,"ch":"s10","q":"<p>SMTP vs POP3 / IMAP ?</p>\n","r":"<p>SMTP (port 25) : ENVOI du courrier (client → serveur, et serveur → serveur).<br>POP3 (port 110) / IMAP : RÉCUPÉRATION du courrier depuis le serveur.</p>\n"},{"n":"n25","k":63,"ch":"s10","q":"<p>Les 3 parties d&#39;une URL (cours) ?</p>\n","r":"<p><a href=\"http://www.fpbm.ma/web-server.htm\">http://www.fpbm.ma/web-server.htm</a><br>http = protocole · <a href=\"http://www.fpbm.ma\">www.fpbm.ma</a> = nom du serveur · web-server.htm = fichier demandé</p>\n"},{"n":"n25","k":64,"ch":"s10","q":"<p>WWW, HTML, HTTP ?</p>\n","r":"<p>WWW : le système de pages web reliées par des liens hypertextes.<br>HTML : le langage qui décrit le contenu des pages.<br>HTTP : le protocole application qui transfère ces pages du serveur vers le client (requête/réponse, sur TCP).</p>\n"},{"n":"n25","k":65,"ch":"s10","q":"<p>Telnet : couche, port, défaut ?</p>\n","r":"<p>Couche Application, port TCP 23. Accès distant (session VTY), mais tout passe en clair, sans chiffrement → on lui préfère SSH (port 22).</p>\n"},{"n":"n25","k":66,"ch":"s10","q":"<p>DHCP : ce qu&#39;il fournit + port ?</p>\n","r":"<p>Bail avec : adresse IP, masque, passerelle par défaut, nom de domaine, serveur DNS. Port UDP 67.</p>\n"},{"n":"n25","k":67,"ch":"s10","q":"<p>Messages HTTP courants + codes ?</p>\n","r":"<p>GET, POST, PUT.<br>200 OK · 301 déplacé définitivement · 400 requête erronée · 404 non trouvé · 505 version non gérée.</p>\n"},{"n":"n26","k":68,"ch":"s10","q":"<p>Ports à connaître (TD) ?</p>\n","r":"<p>20/21 FTP (données/contrôle) · 22 SSH · 23 Telnet · 25 SMTP · 53 DNS · 67 DHCP · 80 HTTP · 110 POP3 · 443 HTTPS</p>\n"},{"n":"n26","k":69,"ch":"s10","q":"<p>TCP vs UDP ?</p>\n","r":"<p>TCP : fiable, orienté connexion, contrôle d&#39;erreurs, de flux et de congestion, remise dans l&#39;ordre (HTTP, SMTP, FTP, Telnet).<br>UDP : non fiable, sans connexion, rapide (DNS couramment, SNMP, VoIP, DHCP).</p>\n"},{"n":"n26","k":70,"ch":"s10","q":"<p>Ports réservés : plage ?</p>\n","r":"<p>0 à 1023 (services courants : HTTP, POP3/SMTP, Telnet…).</p>\n"},{"n":"n26","k":71,"ch":"s10","q":"<p>Ouverture d&#39;une connexion TCP ?</p>\n","r":"<p>Poignée de main en 3 temps : SYN → SYN-ACK → ACK. La fermeture se fait en 4 temps (FIN, ACK, FIN, ACK).</p>\n"},{"n":"n27","k":72,"ch":"s10","q":"<p>MTU vs MSS ?</p>\n","r":"<p>MTU : taille maximale d&#39;un paquet sur l&#39;interface (Ethernet : 1500 octets).<br>MSS : taille maximale des données d&#39;un segment TCP = MTU − 40 (20 IP + 20 TCP) → 1460.</p>\n"},{"n":"n28","k":73,"ch":"s10","q":"<p>Rôle d&#39;une carte réseau ?</p>\n","r":"<p>Interface physique qui connecte un hôte au support du réseau. Elle porte l&#39;adresse MAC.</p>\n"},{"n":"n28","k":74,"ch":"s10","q":"<p>Rôle d&#39;un répéteur ?</p>\n","r":"<p>Régénérer (amplifier) le signal pour augmenter la distance. Couche 1 (physique).</p>\n"},{"n":"n28","k":75,"ch":"s10","q":"<p>Numéro qui identifie un ordinateur sur un réseau, modifiable ?</p>\n","r":"<p>L&#39;adresse IP (logique, couche 3, configurable). L&#39;adresse MAC est en principe fixe (gravée dans la carte).</p>\n"},{"n":"n25","k":130,"ch":"s10","q":"<p>POP3 ou IMAP ?</p>\n","r":"<p>POP3 (110) : télécharge le courrier, souvent supprimé du serveur, une seule boîte, un seul appareil. IMAP (143) : le courrier reste sur le serveur, plusieurs dossiers, synchronisé entre appareils.</p>\n"},{"n":"n25","k":131,"ch":"s10","q":"<p>Chemin d&#39;un e-mail de <a href=\"mailto:A@x.fr\">A@x.fr</a> vers <a href=\"mailto:B@y.com\">B@y.com</a> ?</p>\n","r":"<p>MUA de A → (SMTP) MTA de x.fr → (SMTP, après recherche DNS MX) MTA de y.com → MDA dépose dans la boîte de B → B la récupère avec son MUA par POP3 ou IMAP.</p>\n"},{"n":"n42","k":137,"ch":"s10","q":"<p>Seq et ACK : que désignent-ils ?</p>\n","r":"<p>Seq = numéro du premier octet de données du segment. ACK = numéro du prochain octet attendu (= dernier octet reçu en ordre + 1).</p>\n"},{"n":"n42","k":138,"ch":"s10","q":"<p>Seq initial 2001, segments de 1000, 1000, 500 : Seq et ACK ?</p>\n","r":"<p>Seq 2001, 3001, 4001 ; ACK attendus 3001, 4001, 4501. Le dernier ACK (4501) acquitte tout : c&#39;est un ACK cumulatif.</p>\n"},{"n":"n42","k":139,"ch":"s10","q":"<p>ACK cumulatif ?</p>\n","r":"<p>« ACK = n » confirme tous les octets jusqu&#39;à n − 1 : un seul accusé peut acquitter plusieurs segments reçus en ordre.</p>\n"},{"n":"n42","k":140,"ch":"s10","q":"<p>rwnd et cwnd : qui les fixe, pour quel contrôle ?</p>\n","r":"<p>rwnd : annoncée par le récepteur (contrôle de flux, capacité de son tampon). cwnd : calculée par l&#39;émetteur (contrôle de congestion du réseau).</p>\n"},{"n":"n42","k":141,"ch":"s10","q":"<p>Fenêtre effective de l&#39;émetteur ?</p>\n","r":"<p>W = min(cwnd, rwnd) : maximum d&#39;octets envoyés sans accusé. Il reste à envoyer W − (octets déjà en vol).</p>\n"},{"n":"n42","k":142,"ch":"s10","q":"<p>Perte à partir de l&#39;octet 501 : que font récepteur et émetteur ?</p>\n","r":"<p>Le récepteur renvoie ACK = 501 (il redemande l&#39;octet 501). L&#39;émetteur retransmet à partir de Seq = 501. Cela se passe à la couche transport.</p>\n"},{"n":"n42","k":143,"ch":"s10","q":"<p>Un ACK pur (sans données) consomme-t-il des numéros de séquence ?</p>\n","r":"<p>Non : le Seq de celui qui l&#39;envoie ne change pas. Seuls les octets de données, le SYN et le FIN en consomment.</p>\n"},{"n":"n36","k":76,"ch":"s11","q":"<p>2 méthodes de délimitation des trames ?</p>\n","r":"<ol>\n<li>Compter les caractères (champ de longueur dans l&#39;en-tête, rarement utilisé seul).<br>2. Délimiteurs (fanions) en début et en fin de trame, avec des bits de transparence.</li>\n</ol>\n"},{"n":"n36","k":77,"ch":"s11","q":"<p>Fanion et bit de transparence (HDLC, PPP) ?</p>\n","r":"<p>Fanion = 01111110.<br>Bit de transparence : on insère un 0 après toute suite de cinq 1 dans la trame, et le récepteur le retire.</p>\n"},{"n":"n37","k":78,"ch":"s11","q":"<p>4 services de la couche liaison ?</p>\n","r":"<p>Délimitation des trames ; contrôle d&#39;erreurs (détection et correction) ; contrôle de flux ; contrôle d&#39;accès au canal partagé (MAC).</p>\n"},{"n":"n37","k":79,"ch":"s11","q":"<p>Sous-couches LLC et MAC ?</p>\n","r":"<p>LLC (haut) : services logiciels vers la couche réseau ; indique quel protocole de couche 3 (IP, IPX) est dans la trame.<br>MAC (bas) : prépare la transmission physique, adressage de couche 2, marque le début et la fin de la trame.</p>\n"},{"n":"n37","k":80,"ch":"s11","q":"<p>2 méthodes d&#39;accès au support partagé ?</p>\n","r":"<p>Accès contrôlé (chacun son tour : déterministe, programmé).<br>Accès basé sur le conflit (concurrence : aléatoire, CSMA/CD, CSMA/CA).</p>\n"},{"n":"n37","k":81,"ch":"s11","q":"<p>Send and Wait vs Sliding Window ?</p>\n","r":"<p>Send and Wait : une trame à la fois, dans un seul sens, on attend l&#39;acquittement.<br>Fenêtre d&#39;anticipation : plusieurs trames à la fois, dans les deux sens, numéros de séquence = la fenêtre.</p>\n"},{"n":"n29","k":82,"ch":"s11","q":"<p>Bit de parité paire / impaire : règle ?</p>\n","r":"<p>Paire : le nombre total de 1 (bit de parité compris) doit être pair.<br>Impaire : il doit être impair.<br>Ex. du cours : 0011010 → paire 00110101 ; impaire 00110100.</p>\n"},{"n":"n29","k":83,"ch":"s11","q":"<p>Limite de la parité simple (VRC) ?</p>\n","r":"<p>Elle ne détecte que les erreurs portant sur un nombre IMPAIR de bits. Deux bits faux s&#39;annulent et passent inaperçus.</p>\n"},{"n":"n29","k":84,"ch":"s11","q":"<p>VRC + LRC (parité croisée) ?</p>\n","r":"<p>VRC : un bit de parité par caractère (mot).<br>LRC : un bit de parité par position, sur tout le bloc.<br>Ensemble, ils détectent ET localisent une erreur simple, qu&#39;on peut donc corriger.</p>\n"},{"n":"n30","k":85,"ch":"s11","q":"<p>Principe du codage CRC (émission) ?</p>\n","r":"<p>Ajouter r zéros à M (r = degré de G), diviser modulo 2 (XOR) par G, garder le reste R sur r bits. Trame émise T = M suivi de R.</p>\n"},{"n":"n30","k":86,"ch":"s11","q":"<p>Vérification CRC (réception) ?</p>\n","r":"<p>On divise la suite reçue T&#39;(x) par G(x).<br>Reste R&#39;(x) = 0 → pas d&#39;erreur.<br>Reste ≠ 0 → erreur, on demande la retransmission.</p>\n"},{"n":"n30","k":87,"ch":"s11","q":"<p>Autres noms de la zone de contrôle ?</p>\n","r":"<p>CRC (Cyclic Redundancy Check) ou FCS (Frame Check Sequence).</p>\n"},{"n":"n31","k":88,"ch":"s11","q":"<p>Hamming C(n,k) : relations ?</p>\n","r":"<p>n = 2^r − 1 et r = n − k.<br>Ex. : n = 7, r = 3, k = 4 ; n = 15, r = 4, k = 11.</p>\n"},{"n":"n31","k":89,"ch":"s11","q":"<p>Hamming (7,4) : disposition des bits (cours) ?</p>\n","r":"<p>Positions 1 à 7 : C0 C1 U0 C2 U1 U2 U3.<br>Les contrôles sont aux puissances de 2 : 1, 2, 4.</p>\n"},{"n":"n31","k":90,"ch":"s11","q":"<p>Formules des bits de contrôle (cours) ?</p>\n","r":"<p>C0 = U0 + U1 + U3<br>C1 = U0 + U2 + U3<br>C2 = U1 + U2 + U3<br>(somme modulo 2)</p>\n"},{"n":"n31","k":91,"ch":"s11","q":"<p>Hamming : coder 1010 (exemple du cours) ?</p>\n","r":"<p>C0 = 1, C1 = 0, C2 = 1 → mot émis 1011010</p>\n"},{"n":"n31","k":92,"ch":"s11","q":"<p>Hamming : localiser l&#39;erreur ?</p>\n","r":"<p>Recalculer chaque Ci. S&#39;il est différent du Ci reçu, ajouter sa position (1, 2 ou 4) au compteur C. C = 0 : pas d&#39;erreur ; sinon C = numéro du bit erroné.<br>Ex. : 1011000 reçu → C = 2 + 4 = 6.</p>\n"},{"n":"n41","k":132,"ch":"s11","q":"<p>Les champs d&#39;une trame Ethernet, dans l&#39;ordre ?</p>\n","r":"<p>Préambule (7 o) · SFD (1 o) · MAC destination (6 o) · MAC source (6 o) · EtherType (2 o) · Données (46 à 1500 o) · FCS (4 o).</p>\n"},{"n":"n41","k":133,"ch":"s11","q":"<p>Préambule et SFD : valeurs et rôle ?</p>\n","r":"<p>Préambule : 7 octets aa (10101010), pour la synchronisation. SFD : 1 octet ab (10101011), qui marque le début de la trame.</p>\n"},{"n":"n41","k":134,"ch":"s11","q":"<p>EtherType 0800, 0806, 86DD ?</p>\n","r":"<p>0800 = IPv4 · 0806 = ARP · 86DD = IPv6.</p>\n"},{"n":"n41","k":135,"ch":"s11","q":"<p>Que contiennent les 4 derniers octets d&#39;une trame Ethernet ?</p>\n","r":"<p>Le FCS (séquence de contrôle, CRC-32) : le récepteur le recalcule ; s&#39;il diffère, la trame est rejetée.</p>\n"},{"n":"n41","k":136,"ch":"s11","q":"<p>Taille minimale et maximale d&#39;une trame Ethernet (hors préambule) ?</p>\n","r":"<p>64 à 1518 octets : données de 46 à 1500 octets, avec du bourrage (padding) si elles sont plus courtes que 46.</p>\n"},{"n":"n32","k":93,"ch":"s12","q":"<p>NRZ / Tout ou rien / Bipolaire ?</p>\n","r":"<p>Tout ou rien : 0 → 0 V, 1 → +V<br>NRZ : 0 → −V, 1 → +V<br>Bipolaire : 0 → 0, 1 → alternativement +V puis −V</p>\n"},{"n":"n32","k":94,"ch":"s12","q":"<p>RZ ?</p>\n","r":"<p>0 → 0 ; 1 → +V pendant la 1re moitié du bit, puis 0 pendant la 2e moitié.</p>\n"},{"n":"n32","k":95,"ch":"s12","q":"<p>Manchester (convention du cours) ?</p>\n","r":"<p>Transition au milieu de chaque bit :<br>0 → du bas vers le haut<br>1 → du haut vers le bas</p>\n"},{"n":"n32","k":96,"ch":"s12","q":"<p>Miller ?</p>\n","r":"<p>1 → transition au milieu du bit.<br>0 → pas de transition si le bit suivant est 1 ; transition à la fin du bit si le bit suivant est 0.</p>\n"},{"n":"n32","k":97,"ch":"s12","q":"<p>3 fonctions de la couche physique + caractéristiques modifiées ?</p>\n","r":"<p>Codage des données, signalisation, composants physiques.<br>Un bit est représenté en changeant l&#39;amplitude, la fréquence ou la phase du signal.</p>\n"},{"n":"n33","k":98,"ch":"s12","q":"<p>Simplex / half duplex / full duplex ?</p>\n","r":"<p>Simplex : un seul sens (TV).<br>Half duplex : deux sens, mais un seul émetteur à la fois (radio de police).<br>Full duplex : deux sens simultanés (téléphone).</p>\n"},{"n":"n33","k":99,"ch":"s12","q":"<p>STP : caractéristiques (cours) ?</p>\n","r":"<p>10 à 10 000 Mbit/s ; 100 m max ; connecteur RJ45 ; moyennement cher.</p>\n"},{"n":"n33","k":100,"ch":"s12","q":"<p>RJ45 : broches et normes ?</p>\n","r":"<p>10/100 Mbit/s : broches 1-2 et 3-6 ; 1 Gbit/s : les 8 broches.<br>T568A et T568B : seules les paires 2 (orange) et 3 (vert) sont inversées. La plupart des câbles sont en T568B.</p>\n"},{"n":"n33","k":101,"ch":"s12","q":"<p>Câble droit, croisé, console ?</p>\n","r":"<p>Droit : équipements différents (PC ↔ switch, switch ↔ routeur).<br>Croisé : équipements de même type (PC ↔ PC, switch ↔ switch, routeur ↔ routeur, et PC ↔ routeur).<br>Console (inversé) : PC ↔ port console pour configurer un routeur ou un switch.</p>\n"},{"n":"n33","k":102,"ch":"s12","q":"<p>4 normes sans fil (cours) ?</p>\n","r":"<p>802.15 Bluetooth (PAN, 1 à 100 m) ; 802.11 Wi-Fi (WLAN, CSMA/CA) ; 802.16 WiMAX (point-à-multipoint) ; GSM/GPRS (données sur réseau mobile).</p>\n"},{"n":"n34","k":103,"ch":"s13","q":"<p>Fonctions clés de la couche réseau ?</p>\n","r":"<p>Adressage IP ; routage (meilleur chemin) ; fragmentation selon la MTU ; détection des erreurs d&#39;acheminement (ICMP).<br>Protocoles : IP, ICMP, RIP, OSPF, BGP.</p>\n"},{"n":"n34","k":104,"ch":"s13","q":"<p>3 caractéristiques d&#39;IPv4 ?</p>\n","r":"<p>Sans connexion ; au mieux (peu fiable, best effort) ; indépendant des médias.</p>\n"},{"n":"n34","k":105,"ch":"s13","q":"<p>Saut, domaine de diffusion, passerelle ?</p>\n","r":"<p>Saut : chaque route empruntée jusqu&#39;au périphérique suivant.<br>Domaine de diffusion : zone où chaque machine peut joindre toutes les autres sans routeur.<br>Passerelle par défaut : l&#39;interface du routeur qui permet de sortir du réseau local.</p>\n"},{"n":"n34","k":106,"ch":"s13","q":"<p>Types ICMP à connaître ?</p>\n","r":"<p>0 Echo Reply · 3 Destination Unreachable (code 0 réseau, 1 hôte, 3 port) · 5 Redirect · 8 Echo Request · 11 Time Exceeded (TTL expiré).<br>Ping = 8 puis 0 ; traceroute utilise le type 11.</p>\n"},{"n":"n34","k":107,"ch":"s13","q":"<p>ICMP et sécurité ?</p>\n","r":"<p>Attaques : Ping Flood, Ping of Death, tunneling ICMP (exfiltration de données).<br>Mesures : filtrer certains types au pare-feu, limiter le débit des requêtes (rate limiting).</p>\n"},{"n":"n35","k":108,"ch":"s13","q":"<p>Fenêtre TCP et numéro d&#39;ACK ?</p>\n","r":"<p>La taille de fenêtre est le nombre d&#39;octets envoyés avant d&#39;attendre un accusé de réception.<br>Le numéro d&#39;ACK est le numéro du PROCHAIN octet attendu.</p>\n"},{"n":"n35","k":109,"ch":"s13","q":"<p>Fermeture d&#39;une connexion TCP ?</p>\n","r":"<p>En 4 temps : le client envoie FIN, le serveur répond ACK, le serveur envoie FIN, le client répond ACK.</p>\n"},{"n":"n35","k":110,"ch":"s13","q":"<p>Codes HTTP du cours ?</p>\n","r":"<p>200 OK · 301 déplacé définitivement · 400 syntaxe erronée · 404 non trouvé · 505 version HTTP non gérée</p>\n"},{"n":"n34","k":148,"ch":"s13","q":"<p>ARP : rôle et portée de la requête ?</p>\n","r":"<p>Il trouve la MAC d&#39;une IP du même réseau. La requête est diffusée (FF:FF:FF:FF:FF:FF) dans le domaine de diffusion ; un routeur ne la retransmet pas.</p>\n"},{"n":"n34","k":149,"ch":"s13","q":"<p>traceroute : principe ?</p>\n","r":"<p>Paquets avec TTL = 1, 2, 3… Chaque routeur qui fait tomber le TTL à 0 renvoie ICMP Time Exceeded (type 11) : la source découvre chaque saut.</p>\n"},{"n":"n34","k":150,"ch":"s13","q":"<p>traceroute : trois colonnes de temps et « * * * » ?</p>\n","r":"<p>Les 3 colonnes sont les RTT de 3 sondes vers ce saut. « * * * » : aucune réponse avant la fin du délai (ICMP filtré ou paquets perdus) ; ça ne coupe pas forcément la route.</p>\n"},{"n":"n34","k":151,"ch":"s13","q":"<p>Pourquoi un routeur envoie-t-il ICMP Destination Unreachable (type 3) ?</p>\n","r":"<p>Il n&#39;a pas de route pour la destination : il détruit le paquet et renvoie le message avec l&#39;en-tête IP du paquet fautif et les 8 premiers octets de ses données.</p>\n"},{"n":"n38","k":111,"ch":"s14","q":"<p>En-tête IPv4 : taille minimale et nombre de lignes ?</p>\n","r":"<p>20 octets = 5 lignes de 32 bits (sans options). Le champ IHL vaut alors 5 (il compte en mots de 32 bits).</p>\n"},{"n":"n38","k":112,"ch":"s14","q":"<p>IPv4, ligne 1 (32 bits) ?</p>\n","r":"<p>Version (4) | IHL, longueur d&#39;en-tête (4) | Type de service (8) | Longueur totale (16)</p>\n"},{"n":"n38","k":113,"ch":"s14","q":"<p>IPv4, ligne 2 ?</p>\n","r":"<p>Identification (16) | Flags (3) | Décalage de fragment (13)</p>\n"},{"n":"n38","k":114,"ch":"s14","q":"<p>IPv4, ligne 3 ?</p>\n","r":"<p>TTL (8) | Protocole (8) | Somme de contrôle d&#39;en-tête (16)</p>\n"},{"n":"n38","k":115,"ch":"s14","q":"<p>IPv4, lignes 4 et 5 ?</p>\n","r":"<p>Adresse IP source (32 bits), puis adresse IP destination (32 bits). Ensuite : options éventuelles + bourrage.</p>\n"},{"n":"n38","k":116,"ch":"s14","q":"<p>Champ Protocole d&#39;IPv4 : valeurs à connaître ?</p>\n","r":"<p>1 = ICMP · 6 = TCP · 17 = UDP</p>\n"},{"n":"n38","k":117,"ch":"s14","q":"<p>Identification, Flags, Décalage : à quoi servent-ils ?</p>\n","r":"<p>À la fragmentation. Identification = numéro commun à tous les fragments d&#39;un paquet. Flags : DF (ne pas fragmenter) et MF (d&#39;autres fragments suivent). Décalage = position du fragment, en unités de 8 octets.</p>\n"},{"n":"n38","k":118,"ch":"s14","q":"<p>Longueur totale et IHL : différence ?</p>\n","r":"<p>IHL = taille de l&#39;en-tête seul, en mots de 32 bits (5 → 20 octets).<br>Longueur totale = en-tête + données, en octets (max 65 535).</p>\n"},{"n":"n38","k":119,"ch":"s14","q":"<p>Somme de contrôle IPv4 : que protège-t-elle ?</p>\n","r":"<p>L&#39;en-tête seulement (pas les données). Elle est recalculée à chaque routeur, puisque le TTL change à chaque saut.</p>\n"},{"n":"n39","k":120,"ch":"s14","q":"<p>En-tête TCP : taille minimale ?</p>\n","r":"<p>20 octets = 5 lignes de 32 bits (sans options), comme IPv4.</p>\n"},{"n":"n39","k":121,"ch":"s14","q":"<p>TCP, lignes 1 à 3 ?</p>\n","r":"<p>1 : Port source (16) | Port destination (16)<br>2 : Numéro de séquence (32)<br>3 : Numéro d&#39;acquittement (32)</p>\n"},{"n":"n39","k":122,"ch":"s14","q":"<p>TCP, lignes 4 et 5 ?</p>\n","r":"<p>4 : Longueur d&#39;en-tête (4) | Réservé (6) | Drapeaux (6) | Fenêtre (16)<br>5 : Somme de contrôle (16) | Pointeur urgent (16)<br>Puis options éventuelles.</p>\n"},{"n":"n39","k":123,"ch":"s14","q":"<p>Les 6 drapeaux TCP (dans l&#39;ordre) ?</p>\n","r":"<p>URG · ACK · PSH · RST · SYN · FIN<br>Astuce : « Un Agent Pressé Range Ses Fichiers ».</p>\n"},{"n":"n39","k":124,"ch":"s14","q":"<p>Rôle de chaque drapeau TCP ?</p>\n","r":"<p>URG : pointeur urgent valide · ACK : le n° d&#39;acquittement est valide · PSH : livrer tout de suite à l&#39;application · RST : réinitialiser (couper) la connexion · SYN : ouvrir, synchroniser les numéros · FIN : fermer.</p>\n"},{"n":"n39","k":125,"ch":"s14","q":"<p>Champ Fenêtre (TCP) ?</p>\n","r":"<p>Nombre d&#39;octets que le récepteur accepte de recevoir avant d&#39;envoyer un accusé : c&#39;est le contrôle de flux.</p>\n"},{"n":"n40","k":126,"ch":"s14","q":"<p>En-tête UDP : les 4 champs ?</p>\n","r":"<p>Port source (16) | Port destination (16) | Longueur (16) | Somme de contrôle (16) = 8 octets en tout.</p>\n"},{"n":"n40","k":127,"ch":"s14","q":"<p>Pourquoi l&#39;en-tête UDP est-il si court ?</p>\n","r":"<p>UDP ne fait ni connexion, ni numérotation, ni accusés : pas de séquence, d&#39;ACK ni de fenêtre. Juste les ports, la longueur et un contrôle.</p>\n"},{"n":"n39","k":147,"ch":"s14","q":"<p>Comment lire un segment TCP en hexadécimal ?</p>\n","r":"<p>Octets 1-2 port source, 3-4 port destination, 5-8 Seq, 9-12 ACK, 13 : longueur d&#39;en-tête (1er chiffre × 4), 14 : drapeaux (02 SYN, 12 SYN+ACK, 10 ACK, 18 PSH+ACK, 11 FIN+ACK), 15-16 fenêtre, 17-18 checksum, 19-20 urgent.</p>\n"}];

// ---------- Sauvegarde ----------
// Format « essais » : un objet partagé avec l'ancien module (attempts par notion, cards par indice) ; on ne touche qu'à ces deux champs.
// Format « score10 » : scores des chapitres dans MODULE.cle, essais et cartes dans MODULE.cleEtat.
const lireJ = (k) => { try { return JSON.parse(localStorage.getItem(k) || "{}") || {}; } catch (e) { return {}; } };
const ecrireJ = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const etat = () => { const S = lireJ(MODULE.cleEtat); S.attempts = S.attempts || {}; S.cards = S.cards || {}; return S; };
function noter(n, ok) { const S = etat(); (S.attempts[n] = S.attempts[n] || []).push(ok ? 1 : 0); if (S.attempts[n].length > 30) S.attempts[n].shift(); ecrireJ(MODULE.cleEtat, S); }
// Maîtrisé = au moins 3 essais et 80 % de réussite sur les 5 derniers (règle commune à la plateforme).
function statut(n) {
  if (MODULE.format === "pc") { const v = lireJ(MODULE.cle)[n]; return v && v.pc !== undefined ? [v.pc >= 80 ? "ok" : "fragile", v.pc / 100] : ["jamais", null]; } const a = (etat().attempts[n] || []).slice(-5); if (!a.length) return ["jamais", null]; const r = a.reduce((x, y) => x + y, 0) / a.length; return [(etat().attempts[n].length >= 3 && r >= 0.8) ? "ok" : "fragile", r]; }
const NCH = {}; NOTIONS.forEach((n) => (NCH[n.ch] = NCH[n.ch] || []).push(n));
function scoreChap(c) {
  if (MODULE.format === "score10") return lireJ(MODULE.cle)[c.id];
  if (MODULE.format === "pc") { const v = lireJ(MODULE.cle)[c.id]; return v && v.pc !== undefined ? Math.round(v.pc / 10) : undefined; }
  const l = NCH[c.id] || []; if (!l.length || !l.some((n) => statut(n.id)[0] !== "jamais")) return undefined;
  return Math.round((10 * l.filter((n) => statut(n.id)[0] === "ok").length) / l.length);
}
// ---------- Flashcards (boîtes de Leitner, mêmes intervalles que les anciens modules) ----------
const CFG_C = MODULE.cartes || { champ: "box", intervalles: [0, 1, 3, 7, 14, 30], echec: 1, depart: 0 };
const INTV = CFG_C.intervalles, CHAMP = CFG_C.champ;
const jour = () => new Date().toISOString().slice(0, 10);
const numJour = (d) => Math.floor(new Date(d + "T00:00:00").getTime() / 864e5);
const dansJours = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const aRevoir = () => { const S = etat(), t = numJour(jour()); return CARTES.map((_, i) => i).filter((i) => { const st = S.cards[CARTES[i].k]; return !st || numJour(st.due) <= t; }); };
let file = [], montre = false;

const nav = document.getElementById("nav"), main = document.getElementById("main"), pct = document.getElementById("pct");
let cur = -1, rep = {};
const VUES = { bord: -3, cartes: -2, intro: -1 };
function dessinerNav() {
  let ok = 0;
  const ligne = (i, titre, sous, v) => `<button class="${cur === i ? "on" : ""}" data-go="${i}"><span>${titre}${sous ? `<span class="se">${sous}</span>` : ""}</span><span class="sc ${v >= 8 ? "ok" : ""}">${v === undefined ? "" : v + "/10"}</span></button>`;
  const dues = CARTES.length ? aRevoir().length : 0;
  let h = ligne(VUES.bord, "📊 Tableau de bord");
  if (CARTES.length) h += ligne(VUES.cartes, `🃏 Flashcards${dues ? ` <b>(${dues})</b>` : ""}`);
  if (MODULE.intro) h += ligne(VUES.intro, "Avant de commencer");
  h += '<div class="sep"></div>' + CHAPS.map((c, i) => { const v = scoreChap(c); if (v >= 8) ok++; return ligne(i, `${i + 1}. ${c.t}`, c.seance, v); }).join("");
  if (MODULE.annexes.length) h += '<div class="sep"></div>' + MODULE.annexes.map((a) => `<a href="${a.fichier}${a.ancre ? "#" + a.ancre : ""}">🧰 ${a.titre}</a>`).join("");
  nav.innerHTML = h;
  pct.textContent = `${ok}/${CHAPS.length} maîtrisés`;
}
function vueBord() {
  const st = NOTIONS.map((n) => ({ ...n, s: statut(n.id) }));
  const okN = st.filter((n) => n.s[0] === "ok").length, fr = st.filter((n) => n.s[0] === "fragile"), jam = st.filter((n) => n.s[0] === "jamais");
  const chapDe = (id) => CHAPS.findIndex((c) => c.id === id);
  const li = (n) => `<li><button data-go="${chapDe(n.ch)}">${n.t}</button><span>${n.s[1] === null ? "jamais testé" : Math.round(100 * n.s[1]) + " %"}</span></li>`;
  return `<h1 class="t">Tableau de bord</h1>
  <div class="kpi"><div><b>${okN}/${NOTIONS.length}</b>${MODULE.format === "essais" ? "notions" : "chapitres"} maîtrisé(e)s</div><div><b>${fr.length}</b>à consolider</div><div><b>${CARTES.length ? aRevoir().length : 0}</b>flashcards à revoir aujourd'hui</div></div>

  }
  function renderList() {
    const q = norm($('#mztQ').value || ''); const ts = [...ST.threads].reverse().filter((t) => !q || norm(t.msgs.map((m) => m.t).join(' ')).includes(q));
    $('#mztList').innerHTML = ts.length ? ts.map((t) => `<details class="mzt-item"><summary>${esc(t.title)}</summary><div class="mzt-meta">${esc(t.sec)} · ${esc(t.date)}</div>${t.msgs.map((m) => `<div class="mzt-m ${m.r === 'u' ? 'u' : 'a'}" style="margin:6px 0">${m.r === 'u' ? esc(m.t) : md(m.t)}</div>`).join('')}<button type="button" data-cont="${esc(t.id)}">Continuer cette discussion</button></details>`).join('')
      : `<p class="mzt-note">${ST.threads.length ? 'Aucune discussion ne contient ce mot.' : 'Aucune discussion pour l\'instant.'}</p>`;
  }
  function renderMem() {
    $('#mztMemL').innerHTML = ST.memos.length ? ST.memos.map((m, i) => `<div class="mzt-item"><div class="mzt-meta">${esc(m.date)}</div>${esc(m.text)}<div><button type="button" data-memdel="${i}" style="margin-top:4px">Effacer</button></div></div>`).join('')
      : '<p class="mzt-note">Aucune note pour l\'instant. Elles apparaîtront au fil de tes questions.</p>';
  }

  // ---------- stockage compte ----------
  async function saveThread(t) {
    saveLocal(); if (!db) return;
    try { await db.collection(base + '/threads').doc(t.id).set({ sec: t.sec, date: t.date, title: t.title, msgs: t.msgs.slice(-40) }); } catch (e) {}
  }
  async function saveMemos() { saveLocal(); if (!db) return; try { await db.doc(base).set({ memos: ST.memos.slice(-30), updated: Date.now() }); } catch (e) {} }

  // ---------- appel au tuteur ----------
  const ERR = { not_granted: 'Tu n\'as pas autorisé la page à utiliser Claude. Recharge-la et accepte la demande, ou change-le dans le menu Autorisations de l\'artifact.', rate_limited: 'Trop de questions d\'un coup, ou limite d\'usage atteinte. Réessaie dans un moment.', prompt_too_large: 'L\'extrait est trop long : ouvre une partie plus précise du cours.', image_rejected: 'Cette photo n\'est pas acceptée. Essaie un JPEG ou un PNG plus léger.', refused: 'Claude n\'a pas pu répondre à cette demande. Reformule ta question.' };
  const visible = (t) => {
    const L = String(t).split('\n');
    for (let i = L.length - 1; i >= Math.max(0, L.length - 3); i--) if (/^\s*M[ÉE]MO\s*:/i.test(L[i])) return L.slice(0, i).join('\n').trim();
    return String(t).trim();
  };
  // rendu léger : on échappe le HTML d'abord, puis gras, italique, code, titres, puces et blocs de code
  const inl = (s) => {
    const p = s.split('`'); if (p.length % 2 === 0) { const last = p.pop(); p[p.length - 1] += '`' + last; }
    return p.map((x, i) => i % 2 ? '<code>' + esc(x) + '</code>' : esc(x).replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*\w])\*([^*\n]+)\*(?![*\w])/g, '$1<em>$2</em>')).join('');
  };
  const md = (t) => {
    const out = []; let list = null, code = null;
    const flush = () => { if (list) { out.push('</' + list + '>'); list = null; } };
    String(t).split('\n').forEach((raw) => {
      if (/^\s*```/.test(raw)) { if (code === null) { flush(); code = []; } else { out.push('<pre>' + esc(code.join('\n')) + '</pre>'); code = null; } return; }
      if (code !== null) { code.push(raw); return; }
      let m;
      if ((m = raw.match(/^\s*#{1,6}\s+(.*)$/))) { flush(); out.push('<p><strong>' + inl(m[1]) + '</strong></p>'); }
      else if ((m = raw.match(/^\s*[-*•]\s+(.*)$/))) { if (list !== 'ul') { flush(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + inl(m[1]) + '</li>'); }
      else if ((m = raw.match(/^\s*\d+[.)]\s+(.*)$/))) { if (list !== 'ol') { flush(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + inl(m[1]) + '</li>'); }
      else if (!raw.trim()) flush();
      else { flush(); out.push('<p>' + inl(raw) + '</p>'); }
    });
    if (code !== null) out.push('<pre>' + esc(code.join('\n')) + '</pre>');
    flush(); return out.join('');
  };
  async function ask(q, deep) {
    q = (q || '').trim(); deep = deep || $('#mztDeep').checked;
    if (busy || !q) return; if (!sample) { note(); return; }
    const c = refreshCtx();
    if (!cur || (cur.sec !== c.label && !forced)) { cur = { id: 't' + Date.now().toString(36), sec: c.label, date: today(), title: q.slice(0, 80), msgs: [] }; ST.threads.push(cur); }
    else if (!ST.threads.includes(cur)) ST.threads.push(cur);
    cur.msgs.push({ r: 'u', t: q }); busy = true; renderLog();
    const out = document.createElement('div'); out.className = 'mzt-m a'; out.textContent = deep ? 'Réflexion approfondie…' : 'Réflexion…'; $('#mztLog').appendChild(out);
    $('#mztSend').disabled = true; $('#mztStop').hidden = false;
    const style = deep
      ? 'Réponse APPROFONDIE (400 à 700 mots) : 1) l\'intuition avec une analogie, 2) l\'explication détaillée pas à pas, 3) pourquoi ça marche, 4) un exemple complet chiffré, 5) les pièges fréquents et ce qui tombe à l\'examen, 6) une question pour vérifier la compréhension.'
      : 'Réponse EXPLICATIVE (150 à 250 mots) : 1) l\'idée en une phrase, 2) l\'explication pas à pas, 3) un petit exemple chiffré ou concret, 4) une courte question pour vérifier la compréhension.';
    const mem = [];
    if (ST.memos.length) mem.push('DIFFICULTÉS DÉJÀ REPÉRÉES :\n' + ST.memos.slice(-12).map((m) => `- ${m.date} : ${m.text}`).join('\n'));
    const lastQ = ST.threads.flatMap((t) => t.msgs.filter((m) => m.r === 'u').map((m) => `[${t.sec}] ${m.t.slice(0, 100)}`)).slice(-6);
    if (lastQ.length) mem.push('SES DERNIÈRES QUESTIONS :\n' + lastQ.map((x) => '- ' + x).join('\n'));
    const rules = `Tu es le tuteur de ${C.student}, pour le module ${C.module}${C.prof ? ' du ' + C.prof : ''}. Il apprend souvent la notion pour la première fois.
Règles : réponds en français simple, en Markdown léger (**gras** pour les termes clés, tirets, étapes numérotées, formules et calculs entre accents graves ; pas de tableaux). ${style} Appuie-toi d'abord sur l'EXTRAIT ci-dessous et sur les conventions du prof ; si une source générale diffère du cours, signale l'écart et dis quelle version utiliser à l'examen (celle du prof). Pour un calcul, pose chaque étape et vérifie-la. S'il envoie une réponse ou une photo de brouillon, corrige étape par étape et nomme précisément l'erreur. Si tu n'es pas sûr, dis-le. S'il demande un mini-exercice, donne l'exercice sans la solution.
Utilise sa mémoire pour faire des liens avec ses confusions passées, sans la réciter.
Termine TOUJOURS par une dernière ligne séparée au format exact « MÉMO: … » qui résume en 15 mots maximum la difficulté révélée par sa question (ou « MÉMO: rien »). Cette ligne lui est cachée.
${C.conventions ? 'CONVENTIONS DU PROF : ' + C.conventions + '\n' : ''}MÉMOIRE DE L'ÉLÈVE :
${mem.join('\n\n') || '(rien pour l\'instant)'}
EXTRAIT (${c.label}) :
${c.text.slice(0, deep ? 9000 : 3500)}`;
    const recent = cur.msgs.slice(deep ? -9 : -5, -1).map((m) => ({ role: m.r === 'u' ? 'user' : 'assistant', content: m.t }));
    while (recent.length && recent[0].role !== 'user') recent.shift();
    const msgs = [...recent.filter((m) => m.content && m.content.trim()), { role: 'user', content: q }]; while (msgs.length > 1 && msgs[0].role !== 'user') msgs.shift(); msgs[0] = { role: 'user', content: rules + '\n\n---\nQuestion : ' + msgs[0].content };
    ctl = new AbortController();
    const opts = { modelTier: deep ? 'complex' : 'quick', cache: false, signal: ctl.signal, onText: ({ text }) => { out.innerHTML = md(visible(text)); $('#mztLog').scrollTop = 1e9; } };
    if (img) opts.images = [img];
    try {
      const r = await sample(msgs, opts);
      const mm = r.text.match(/(?:^|\n)\s*M[ÉE]MO\s*:\s*(.+)\s*$/i);
      cur.msgs.push({ r: 'a', t: visible(r.text) + (r.truncated ? '\n\n(Réponse coupée : pose une question plus ciblée.)' : ''), d: !!deep });
      if (mm && !/^\s*rien/i.test(mm[1])) { ST.memos.push({ date: today(), text: mm[1].trim().slice(0, 160) }); if (ST.memos.length > 30) ST.memos.shift(); saveMemos(); }
      await saveThread(cur);
    } catch (e) {
      const kept = e && e.text ? visible(e.text) : '';
      if (e && e.code === 'cancelled') { if (kept) cur.msgs.push({ r: 'a', t: kept + '\n(Arrêté.)' }); else cur.msgs.pop(); }
      else { cur.msgs.pop(); out.textContent = (kept ? kept + '\n\n' : '') + (ERR[e && e.code] || 'Le tuteur n\'a pas pu répondre. Réessaie dans un instant.'); }
      if (!cur.msgs.length) ST.threads = ST.threads.filter((t) => t !== cur);
      saveLocal();
      if (!(e && e.code === 'cancelled')) { busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImgN').textContent = ''; return; }
    }
    busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImg').value = ''; $('#mztImgN').textContent = ''; renderLog();
  }

  // ---------- événements ----------
  $('#mztBtn').onclick = () => openPanel(null);
  $('#mztX').onclick = closePanel;
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#mztPan').hidden) closePanel(); });
  $('#mztTabH').onclick = () => view($('#mztHist').hidden ? 'hist' : 'chat');
  $('#mztTabM').onclick = () => view($('#mztMem').hidden ? 'mem' : 'chat');
  $('#mztQ').oninput = renderList;
  $('#mztList').onclick = (e) => { const id = e.target.dataset && e.target.dataset.cont; if (!id) return; cur = ST.threads.find((t) => t.id === id); view('chat'); $('#mztCtx').textContent = '· ' + cur.sec; renderLog(); };
  $('#mztMemL').onclick = (e) => { const i = e.target.dataset && e.target.dataset.memdel; if (i == null) return; ST.memos.splice(+i, 1); saveMemos(); renderMem(); };
  $('#mztChips').onclick = (e) => { const b = e.target.closest('[data-chip]'); if (!b) return; const t = $('#mztIn'); t.value = b.dataset.chip + (t.value ? ' : ' + t.value : ''); t.focus(); };
  $('#mztNew').onclick = () => { cur = null; renderLog(); };
  $('#mztStop').onclick = () => { if (ctl) ctl.abort(); };
  $('#mztImg').onchange = (e) => { img = e.target.files[0] || null; $('#mztImgN').textContent = img ? 'Photo : ' + img.name : ''; };
  $('#mztF').onsubmit = (e) => { e.preventDefault(); const v = $('#mztIn').value; $('#mztIn').value = ''; ask(v); };
  $('#mztIn').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#mztF').requestSubmit(); } });

  // ---------- capacités (facultatives) ----------
  const W = window.claude;
  if (W && W.use) {
    W.use('sample').then((s) => { sample = s; ready = true; note();
      if (s && s.limits) s.limits().then((l) => { if (l && l.images) { imgOK = true; $('#mztImgL').hidden = false; if (l.images.mediaTypes) $('#mztImg').accept = l.images.mediaTypes.join(','); } }).catch(() => {});
    }).catch(() => { ready = true; note(); });
    Promise.all([W.use('db'), W.use('user')]).then(async ([d, u]) => {
      if (!d || !u) return; const id = await u.id(); if (!id) return; db = d; base = 'data/users/' + id + '/mzt_' + C.id;
      try {
        const m = await db.doc(base).get(); if (m.exists) { const v = m.data() || {}; if (Array.isArray(v.memos)) ST.memos = JSON.parse(JSON.stringify(v.memos)); }
        const q = await db.collection(base + '/threads').get(); const remote = q.docs.map((x) => Object.assign({ id: x.id }, JSON.parse(JSON.stringify(x.data() || {}))));
        const map = {}; [...ST.threads, ...remote].forEach((t) => { if (!map[t.id] || (t.msgs || []).length > (map[t.id].msgs || []).length) map[t.id] = t; });
        ST.threads = Object.values(map).sort((a, b) => parseInt(a.id.slice(1), 36) - parseInt(b.id.slice(1), 36)); saveLocal();
      } catch (e) {}
    }).catch(() => {});
  } else { ready = true; note(); }

  window.MZT = { open: openPanel, close: closePanel };
})();

</script>
</body>
</html>
