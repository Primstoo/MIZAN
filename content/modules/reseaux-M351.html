<script>
const MODULE={"slug":"reseaux-m351","titre":"Réseaux informatiques (M351)","cle":"m351-revision-v1","cleEtat":"m351-revision-v1","format":"essais","intro":"<p>Le cours chapitre par chapitre, avec <strong>QCM</strong>, <strong>flashcards</strong> (révision espacée) et <strong>TD corrigés</strong>.</p>\n<ul>\n<li><strong>Tableau de bord</strong> : tes notions à consolider, les plus importantes d&#39;abord.</li>\n<li><strong>Flashcards</strong> : quelques minutes par jour ; une carte réussie revient après 1, 3, 7, 14 puis 30 jours.</li>\n<li><strong>TD</strong> : cherche, ouvre l&#39;indice si besoin, compare avec le corrigé et note-toi.</li>\n<li><strong>Outils interactifs</strong> (en bas du menu) : calculs générés, rédaction corrigée par le tuteur, TD inédit, journal d&#39;erreurs.</li>\n</ul>\n<p>Ta progression d&#39;avant la nouvelle version est conservée.</p>\n","annexes":[{"fichier":"reseaux-M351-outils.html","titre":"Outils interactifs (calculs générés, rédaction corrigée par le tuteur, TD inédit, journal d'erreurs)"}],"cartes":null};
const CHAPS=[{"id":"s1","t":"Introduction générale","seance":"Chapitre 1","imp":2,"html":"<p>Les réseaux relient des entités (personnes, matériels…) quelle que soit leur zone géographique, pour partager des informations et des ressources. Il en existe de plusieurs catégories : communication (téléphone, radio, TV), informatique ou de données (Internet, LAN, WAN), transport, social, biologique.</p>\n  <div class=\"def\"><b>Définition, réseau informatique</b>Ensemble d'appareils (ordinateurs et périphériques) reliés entre eux pour permettre à leurs utilisateurs de transférer des informations électroniques. Il permet de communiquer et de partager des ressources matérielles et logicielles.</div>\n  <p><b>Utilités pour les entreprises :</b> partage des ressources, fiabilité et résistance aux pannes (duplication, disponibilité), réduction de coût, outils de communication, commerce électronique.<br><b>Pour les particuliers :</b> accès à l'information (Web, téléchargement, FTP), communication (email, messagerie, forums), achats en ligne.</p><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 2 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Lequel n&#39;est PAS cité dans le cours comme utilité d&#39;un réseau pour une entreprise ?</div><button class=\"opt\" data-o=\"0\">Partage des ressources</button><button class=\"opt\" data-o=\"1\">Fiabilité et résistance aux pannes</button><button class=\"opt\" data-o=\"2\">Augmentation de la consommation électrique</button><button class=\"opt\" data-o=\"3\">Réduction de coût</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Un réseau informatique permet principalement de…</div><button class=\"opt\" data-o=\"0\">Communiquer et partager des ressources matérielles et logicielles</button><button class=\"opt\" data-o=\"1\">Remplacer le système d&#39;exploitation</button><button class=\"opt\" data-o=\"2\">Augmenter la mémoire RAM</button><button class=\"opt\" data-o=\"3\">Chiffrer les disques</button><div class=\"qq-e\" hidden></div></div></section>","ex":[],"qcm":[{"n":"n1","q":"Lequel n&#39;est PAS cité dans le cours comme utilité d&#39;un réseau pour une entreprise ?","o":["Partage des ressources","Fiabilité et résistance aux pannes","Augmentation de la consommation électrique","Réduction de coût"],"a":2,"e":"Les utilités citées : partage des ressources, fiabilité, réduction de coût, outils de communication, commerce électronique."},{"n":"n1","q":"Un réseau informatique permet principalement de…","o":["Communiquer et partager des ressources matérielles et logicielles","Remplacer le système d&#39;exploitation","Augmenter la mémoire RAM","Chiffrer les disques"],"a":0,"e":"Définition du cours : transférer des informations électroniques, communiquer, partager des ressources matérielles et logicielles."}]},{"id":"s2","t":"Communication sur un réseau","seance":"Chapitre 1","imp":4,"html":"<div class=\"def\"><b>Définition, protocole</b>Un ensemble de règles utilisées par les périphériques en réseau pour communiquer.</div>\n  <p><b>Les 5 règles d'une communication :</b> (1) identification de l'expéditeur et du destinataire, (2) méthode de communication convenue, (3) langue et syntaxe communes, (4) vitesse et rythme, (5) demande de confirmation ou de reçu.</p>\n  <h3>Qualité des communications</h3>\n  <div class=\"table-wrap\"><table><thead><tr><th>Facteurs internes (nature du message)</th><th>Facteurs externes (complexité du réseau)</th></tr></thead><tbody><tr><td>Taille du message<br>Complexité du message<br>Importance du message</td><td>Qualité du chemin d'accès<br>Nombre de changements de forme<br>Nombre de redirections / réadressages<br>Quantité d'autres messages simultanés<br>Délai alloué à la communication</td></tr></tbody></table></div>\n  <h3>Éléments de communication</h3>\n  <div class=\"formula\">Émetteur/Récepteur ⇄ Coupleur ⇄ ─── Médium ─── ⇄ Coupleur ⇄ Émetteur/Récepteur\n                         (informations)</div>\n  <p>Les <b>informations</b> sont des éléments physiques (lumière, son, image, tension électrique…) auxquels on a attribué un sens.</p>\n  <h3>Segmentation et multiplexage</h3>\n  <ul><li><b>Segmentation :</b> diviser les données en parties plus petites et plus faciles à gérer. Elle augmente la fiabilité : les parties peuvent suivre des chemins différents, et seules les parties manquantes sont retransmises.</li>\n  <li><b>Multiplexage :</b> fusion de plusieurs flux de données sur un même canal. De nombreuses conversations s'entremêlent sur le réseau.</li>\n  <li><b>Étiquetage :</b> chaque partie est étiquetée pour pouvoir être dirigée puis réassemblée à l'arrivée.</li></ul>\n  <div class=\"trap\"><b>Piège</b>L'inconvénient de la segmentation et du multiplexage n'est pas la perte de fiabilité : c'est la <b>complexité</b> ajoutée au processus.</div>\n  <p><b>Réseau convergent :</b> les réseaux de téléphonie, radio, TV et données, autrefois séparés, sont réunis sur une même plateforme.</p>\n  <h3>Chronologie d'une communication (TD 2, ex. 1)</h3>\n  <div class=\"formula\">Côté émetteur :  1 Segmentation → 2 Multiplexage → 3 Étiquetage → 4 Encodage → 5 Émission\nCôté récepteur : 6 Réception → 7 Décodage → 8 Assemblage</div>\n  <ul>\n    <li><b>Segmentation</b> : découper le message en segments. <b>Multiplexage</b> : entrelacer sur le même canal les segments de plusieurs conversations. <b>Étiquetage</b> : ajouter à chaque segment les informations de remise (adresses, numéro de séquence, port).</li>\n    <li><b>Encodage</b> : transformer les bits en signaux adaptés au médium (électriques, lumineux, radio). <b>Émission</b> : envoyer ces signaux sur le support.</li>\n    <li>Le récepteur fait l'inverse : <b>réception</b> du signal, <b>décodage</b> (signal → bits), puis <b>assemblage</b> des segments dans l'ordre grâce aux étiquettes.</li>\n  </ul>\n  <div class=\"trap\"><b>Écart à connaître</b>La correction manuscrite du TD 2 que j'ai lue place le multiplexage après l'émission (segmentation, étiquetage, encodage, émission, multiplexage, réception…). L'ordre ci-dessus suit la logique du cours (le multiplexage prépare les segments, il ne se fait pas après l'envoi). Certitude : moyenne à élevée. Je n'ai pas le corrigé officiel : si ton prof a donné l'autre ordre en classe, écris le sien à l'examen.</div><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 10 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Un protocole est…</div><button class=\"opt\" data-o=\"0\">Un câble réseau normalisé</button><button class=\"opt\" data-o=\"1\">Un ensemble de règles utilisées par les périphériques en réseau pour communiquer</button><button class=\"opt\" data-o=\"2\">Un logiciel antivirus</button><button class=\"opt\" data-o=\"3\">Un type de topologie</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Laquelle de ces règles ne figure PAS parmi les règles de communication du cours ?</div><button class=\"opt\" data-o=\"0\">Identification de l&#39;expéditeur et du destinataire</button><button class=\"opt\" data-o=\"1\">Langue et syntaxe communes</button><button class=\"opt\" data-o=\"2\">Vitesse et rythme</button><button class=\"opt\" data-o=\"3\">Chiffrement obligatoire du message</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">« La complexité du message » est un facteur…</div><button class=\"opt\" data-o=\"0\">Externe</button><button class=\"opt\" data-o=\"1\">Interne</button><button class=\"opt\" data-o=\"2\">Physique</button><button class=\"opt\" data-o=\"3\">Applicatif</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">« Le nombre de fois où le message doit être réadressé » est un facteur…</div><button class=\"opt\" data-o=\"0\">Interne</button><button class=\"opt\" data-o=\"1\">Externe</button><button class=\"opt\" data-o=\"2\">Logique</button><button class=\"opt\" data-o=\"3\">Protocolaire</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Dans le schéma de communication, l&#39;élément qui relie l&#39;émetteur/récepteur au médium est…</div><button class=\"opt\" data-o=\"0\">Le protocole</button><button class=\"opt\" data-o=\"1\">Le coupleur de communication</button><button class=\"opt\" data-o=\"2\">Le serveur</button><button class=\"opt\" data-o=\"3\">Le multiplexeur</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Avantage de la segmentation :</div><button class=\"opt\" data-o=\"0\">On retransmet tout le message en cas de perte</button><button class=\"opt\" data-o=\"1\">Seules les parties manquantes sont retransmises</button><button class=\"opt\" data-o=\"2\">Toutes les parties suivent obligatoirement le même chemin</button><button class=\"opt\" data-o=\"3\">Elle supprime la nécessité d&#39;étiqueter</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Le multiplexage, c&#39;est…</div><button class=\"opt\" data-o=\"0\">Diviser un message en segments</button><button class=\"opt\" data-o=\"1\">Fusionner plusieurs flux de données sur un même canal</button><button class=\"opt\" data-o=\"2\">Chiffrer les paquets</button><button class=\"opt\" data-o=\"3\">Choisir le meilleur chemin</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Inconvénient commun à la segmentation et au multiplexage :</div><button class=\"opt\" data-o=\"0\">Perte de fiabilité</button><button class=\"opt\" data-o=\"1\">Complexité ajoutée au processus</button><button class=\"opt\" data-o=\"2\">Débit doublé</button><button class=\"opt\" data-o=\"3\">Impossible sur Internet</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Un réseau convergent…</div><button class=\"opt\" data-o=\"0\">Réunit voix, vidéo et données sur une même plateforme</button><button class=\"opt\" data-o=\"1\">Est un réseau en anneau</button><button class=\"opt\" data-o=\"2\">Est un réseau sans routeur</button><button class=\"opt\" data-o=\"3\">Ne transporte que la voix</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Quelle étape vient juste avant l&#39;émission, côté émetteur ?</div><button class=\"opt\" data-o=\"0\">La segmentation</button><button class=\"opt\" data-o=\"1\">Le décodage</button><button class=\"opt\" data-o=\"2\">L&#39;encodage</button><button class=\"opt\" data-o=\"3\">L&#39;assemblage</button><div class=\"qq-e\" hidden></div></div></section>","ex":[],"qcm":[{"n":"n2","q":"Un protocole est…","o":["Un câble réseau normalisé","Un ensemble de règles utilisées par les périphériques en réseau pour communiquer","Un logiciel antivirus","Un type de topologie"],"a":1,"e":"Définition mot pour mot du cours."},{"n":"n2","q":"Laquelle de ces règles ne figure PAS parmi les règles de communication du cours ?","o":["Identification de l&#39;expéditeur et du destinataire","Langue et syntaxe communes","Vitesse et rythme","Chiffrement obligatoire du message"],"a":3,"e":"Les 5 règles : identification, méthode convenue, langue/syntaxe, vitesse/rythme, confirmation ou reçu."},{"n":"n3","q":"« La complexité du message » est un facteur…","o":["Externe","Interne","Physique","Applicatif"],"a":1,"e":"Les facteurs internes sont liés à la nature du message : sa taille, sa complexité, son importance."},{"n":"n3","q":"« Le nombre de fois où le message doit être réadressé » est un facteur…","o":["Interne","Externe","Logique","Protocolaire"],"a":1,"e":"Les facteurs externes sont liés à la complexité du réseau et au nombre de périphériques traversés."},{"n":"n4","q":"Dans le schéma de communication, l&#39;élément qui relie l&#39;émetteur/récepteur au médium est…","o":["Le protocole","Le coupleur de communication","Le serveur","Le multiplexeur"],"a":1,"e":"Émetteur/récepteur → coupleur de communication → médium."},{"n":"n5","q":"Avantage de la segmentation :","o":["On retransmet tout le message en cas de perte","Seules les parties manquantes sont retransmises","Toutes les parties suivent obligatoirement le même chemin","Elle supprime la nécessité d&#39;étiqueter"],"a":1,"e":"Les parties peuvent suivre des chemins différents, et seules les parties perdues sont renvoyées."},{"n":"n5","q":"Le multiplexage, c&#39;est…","o":["Diviser un message en segments","Fusionner plusieurs flux de données sur un même canal","Chiffrer les paquets","Choisir le meilleur chemin"],"a":1,"e":"Le multiplexage fusionne plusieurs flux sur un même canal. Ne le confonds pas avec la segmentation, qui découpe un message."},{"n":"n5","q":"Inconvénient commun à la segmentation et au multiplexage :","o":["Perte de fiabilité","Complexité ajoutée au processus","Débit doublé","Impossible sur Internet"],"a":1,"e":"Il faut étiqueter, diriger et réassembler les parties, ce qui ajoute de la complexité."},{"n":"n6","q":"Un réseau convergent…","o":["Réunit voix, vidéo et données sur une même plateforme","Est un réseau en anneau","Est un réseau sans routeur","Ne transporte que la voix"],"a":0,"e":"Il réunit sur une seule plateforme des réseaux autrefois séparés."},{"n":"n5","q":"Quelle étape vient juste avant l&#39;émission, côté émetteur ?","o":["La segmentation","Le décodage","L&#39;encodage","L&#39;assemblage"],"a":2,"e":"On encode les bits en signaux (encodage) puis on les émet. Le décodage et l&#39;assemblage se font côté récepteur."}]},{"id":"s3","t":"Composants de base","seance":"Chapitre 1","imp":4,"html":"<div class=\"def\"><b>Les 5 éléments de base</b>Périphériques · Nœuds intermédiaires · Messages · Supports de transmission · Protocoles</div>\n  <ul><li><b>Hôtes (end-users) :</b> envoient et reçoivent directement sur le réseau (PC, serveur, PDA). <b>Serveur</b> = hôte qui fournit des données ou des services (DHCP, DNS, Web). <b>Client</b> = hôte dont le logiciel interroge le serveur et affiche les informations.</li>\n  <li><b>Périphériques partagés :</b> pas directement connectés au réseau, ils y accèdent à travers un hôte (imprimante, webcam).</li>\n  <li><b>Nœuds intermédiaires :</b> transfèrent les messages d'une ligne d'entrée vers une ligne de sortie. <b>Commutateurs et concentrateurs</b> : hôtes d'un même segment. <b>Routeurs</b> : relient les segments entre eux.</li>\n  <li><b>Messages :</b> convertis en bits (signaux numériques codés en binaire) avant l'envoi.</li>\n  <li><b>Supports</b> (couche physique) : filaires (signal électrique sur câble métallique), optiques (lumière), sans fil / hertziens (ondes). <b>Critères de choix :</b> distance, environnement, quantité de données et débit, coût.</li></ul>\n  <h3>Protocoles et normes</h3>\n  <p>Une suite de protocoles décrit : le format du message ; le partage des chemins avec d'autres réseaux ; comment et quand transférer les messages d'erreur et système ; l'établissement et l'arrêt des sessions.</p>\n  <div class=\"formula\">Serveur Web ⇄ Navigateur\n  HTTP      (Hypertext Transfer Protocol)\n  TCP       (Transmission Control Protocol)\n  IP        (Internet Protocol)\n  Ethernet</div>\n  <p><b>Norme :</b> processus ou protocole reconnu par l'industrie et ratifié par un organisme. <b>IEEE</b> : 802.3 (Ethernet), 802.11 (WLAN). <b>IETF</b> : normes Internet publiées en RFC (TCP, IP, HTTP, FTP).</p>\n  <h3>Deux façons de se connecter à un autre périphérique (TD 2, ex. 1)</h3>\n  <div class=\"formula\">CLIENT-SERVEUR                         PAIR À PAIR (P2P)\n Client 1 ─┐                             Pair A ──── switch ──── Pair B\n Client 2 ─┼── Serveur                   (chaque machine est à la fois\n Client 3 ─┘                              client et serveur)</div>\n  <ul>\n    <li><b>Client-serveur</b> : un serveur dédié détient les ressources et fournit un service (Web, DNS, DHCP, messagerie) ; les clients envoient des requêtes. Administration et sécurité centralisées, mais le serveur est un point unique de panne.</li>\n    <li><b>Pair à pair</b> : pas de serveur dédié, chaque hôte partage ses ressources avec les autres (partage de fichiers entre postes). Facile à installer, mais peu sécurisé et difficile à administrer quand le réseau grandit.</li>\n  </ul>\n  <h3>Domaines de collision et domaines de diffusion</h3>\n  <div class=\"table-wrap\"><table><thead><tr><th>Équipement</th><th>Couche</th><th>Domaines de collision</th><th>Domaines de diffusion</th></tr></thead><tbody><tr><td>Hub</td><td>1</td><td>un seul pour tous ses ports</td><td>ne sépare pas</td></tr><tr><td>Switch</td><td>2</td><td>un par port</td><td>ne sépare pas</td></tr><tr><td>Routeur</td><td>3</td><td>un par interface</td><td>un par interface</td></tr></tbody></table></div>\n  <p><b>Domaine de collision</b> : zone où deux émissions simultanées se brouillent (support partagé). <b>Domaine de diffusion</b> : zone atteinte par une trame de diffusion (adresse FF:FF:FF:FF:FF:FF). Seul le routeur arrête la diffusion.</p>\n  <div class=\"def\"><b>Méthode pour compter sur un schéma</b>① Compte les câbles. ② <b>Collisions</b> : chaque câble est un domaine, sauf ceux qui touchent un même hub, qui se fondent en un seul (la liaison hub-switch appartient au domaine du hub). ③ <b>Diffusion</b> : les hubs et les switchs relient leurs câbles dans un même domaine ; chaque interface de routeur ouvre un domaine de plus (un PC branché directement sur un routeur forme le sien, et une liaison routeur-routeur aussi).</div><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 16 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Lequel ne fait PAS partie des 5 éléments de base d&#39;un réseau ?</div><button class=\"opt\" data-o=\"0\">Messages</button><button class=\"opt\" data-o=\"1\">Supports de transmission</button><button class=\"opt\" data-o=\"2\">Système d&#39;exploitation</button><button class=\"opt\" data-o=\"3\">Protocoles</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Une imprimante branchée en USB sur un PC du réseau est…</div><button class=\"opt\" data-o=\"0\">Un hôte</button><button class=\"opt\" data-o=\"1\">Un périphérique partagé</button><button class=\"opt\" data-o=\"2\">Un nœud intermédiaire</button><button class=\"opt\" data-o=\"3\">Un serveur DNS</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Un hôte qui fournit un service DHCP est un…</div><button class=\"opt\" data-o=\"0\">Client</button><button class=\"opt\" data-o=\"1\">Serveur</button><button class=\"opt\" data-o=\"2\">Concentrateur</button><button class=\"opt\" data-o=\"3\">Périphérique partagé</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Selon le cours, quel équipement connecte des segments ENTRE EUX ?</div><button class=\"opt\" data-o=\"0\">Hub</button><button class=\"opt\" data-o=\"1\">Switch</button><button class=\"opt\" data-o=\"2\">Routeur</button><button class=\"opt\" data-o=\"3\">Carte réseau</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Avant d&#39;être envoyés, tous les messages sont convertis en…</div><button class=\"opt\" data-o=\"0\">Paquets IP</button><button class=\"opt\" data-o=\"1\">Bits (signaux numériques codés en binaire)</button><button class=\"opt\" data-o=\"2\">Ondes radio</button><button class=\"opt\" data-o=\"3\">Trames HTTP</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Les supports de transmission se situent au niveau de la couche…</div><button class=\"opt\" data-o=\"0\">Application</button><button class=\"opt\" data-o=\"1\">Transport</button><button class=\"opt\" data-o=\"2\">Physique</button><button class=\"opt\" data-o=\"3\">Réseau</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Lequel n&#39;est PAS un critère de choix d&#39;un support ?</div><button class=\"opt\" data-o=\"0\">La distance</button><button class=\"opt\" data-o=\"1\">L&#39;environnement</button><button class=\"opt\" data-o=\"2\">La couleur du câble</button><button class=\"opt\" data-o=\"3\">Le coût</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Ordre correct de la pile web, du haut vers le bas :</div><button class=\"opt\" data-o=\"0\">IP → TCP → HTTP → Ethernet</button><button class=\"opt\" data-o=\"1\">HTTP → TCP → IP → Ethernet</button><button class=\"opt\" data-o=\"2\">Ethernet → IP → TCP → HTTP</button><button class=\"opt\" data-o=\"3\">HTTP → IP → TCP → Ethernet</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">La norme 802.11 (WLAN) est publiée par…</div><button class=\"opt\" data-o=\"0\">IETF</button><button class=\"opt\" data-o=\"1\">IEEE</button><button class=\"opt\" data-o=\"2\">ISO uniquement</button><button class=\"opt\" data-o=\"3\">Cisco</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Les normes de l&#39;IETF sont publiées sous forme de…</div><button class=\"opt\" data-o=\"0\">RFC</button><button class=\"opt\" data-o=\"1\">ISO 9001</button><button class=\"opt\" data-o=\"2\">Normes 802.x</button><button class=\"opt\" data-o=\"3\">Brevets</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"10\"><div class=\"qq-q\">Un switch de 8 ports, un PC sur chaque port : combien de domaines de collision ?</div><button class=\"opt\" data-o=\"0\">1</button><button class=\"opt\" data-o=\"1\">8</button><button class=\"opt\" data-o=\"2\">2</button><button class=\"opt\" data-o=\"3\">16</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"11\"><div class=\"qq-q\">Quel équipement sépare les domaines de diffusion ?</div><button class=\"opt\" data-o=\"0\">Le hub</button><button class=\"opt\" data-o=\"1\">Le switch</button><button class=\"opt\" data-o=\"2\">Le routeur</button><button class=\"opt\" data-o=\"3\">Le répéteur</button><div class=\"qq-e\" hidden></div></div></section>","ex":[],"qcm":[{"n":"n7","q":"Lequel ne fait PAS partie des 5 éléments de base d&#39;un réseau ?","o":["Messages","Supports de transmission","Système d&#39;exploitation","Protocoles"],"a":2,"e":"Les 5 éléments : périphériques, nœuds intermédiaires, messages, supports, protocoles."},{"n":"n8","q":"Une imprimante branchée en USB sur un PC du réseau est…","o":["Un hôte","Un périphérique partagé","Un nœud intermédiaire","Un serveur DNS"],"a":1,"e":"Elle n&#39;est pas directement connectée au réseau : elle y accède à travers un hôte."},{"n":"n8","q":"Un hôte qui fournit un service DHCP est un…","o":["Client","Serveur","Concentrateur","Périphérique partagé"],"a":1,"e":"Serveur = hôte qui fournit des données ou des services (DHCP, DNS, Web…)."},{"n":"n9","q":"Selon le cours, quel équipement connecte des segments ENTRE EUX ?","o":["Hub","Switch","Routeur","Carte réseau"],"a":2,"e":"Hub et switch connectent les hôtes d&#39;un même segment ; le routeur relie les segments entre eux."},{"n":"n9","q":"Avant d&#39;être envoyés, tous les messages sont convertis en…","o":["Paquets IP","Bits (signaux numériques codés en binaire)","Ondes radio","Trames HTTP"],"a":1,"e":"Diapo 22 : tous les types de messages sont convertis en bits."},{"n":"n10","q":"Les supports de transmission se situent au niveau de la couche…","o":["Application","Transport","Physique","Réseau"],"a":2,"e":"Le cours le précise explicitement : couche physique."},{"n":"n10","q":"Lequel n&#39;est PAS un critère de choix d&#39;un support ?","o":["La distance","L&#39;environnement","La couleur du câble","Le coût"],"a":2,"e":"Les 4 critères : distance, environnement, quantité de données et débit, coût."},{"n":"n11","q":"Ordre correct de la pile web, du haut vers le bas :","o":["IP → TCP → HTTP → Ethernet","HTTP → TCP → IP → Ethernet","Ethernet → IP → TCP → HTTP","HTTP → IP → TCP → Ethernet"],"a":1,"e":"Application (HTTP), transport (TCP), réseau (IP), accès réseau (Ethernet)."},{"n":"n11","q":"La norme 802.11 (WLAN) est publiée par…","o":["IETF","IEEE","ISO uniquement","Cisco"],"a":1,"e":"IEEE : 802.3 Ethernet, 802.11 WLAN."},{"n":"n11","q":"Les normes de l&#39;IETF sont publiées sous forme de…","o":["RFC","ISO 9001","Normes 802.x","Brevets"],"a":0,"e":"RFC = Request for Comments (TCP, IP, HTTP, FTP)."},{"n":"n43","q":"Un switch de 8 ports, un PC sur chaque port : combien de domaines de collision ?","o":["1","8","2","16"],"a":1,"e":"Un domaine de collision par port de switch. Un hub, lui, n&#39;en formerait qu&#39;un seul."},{"n":"n43","q":"Quel équipement sépare les domaines de diffusion ?","o":["Le hub","Le switch","Le routeur","Le répéteur"],"a":2,"e":"Seul le routeur arrête la diffusion : chaque interface appartient à un domaine de diffusion différent."}]},{"id":"s4","t":"Classification : couverture","seance":"Chapitre 1","imp":5,"html":"<p><b>Critères de classification :</b> couverture géographique, topologie, architecture (poste-à-poste / client-serveur), technique de transfert, débit, ouverture (privé/public), méthode d'accès (CSMA/CD, CSMA/CA, jeton), QoS.</p>\n  <div class=\"table-wrap\"><table><thead><tr><th>Type</th><th>Étendue</th><th>Caractéristiques et technos</th></tr></thead><tbody>\n  <tr><td><b>PAN</b></td><td>≈ 1 m²</td><td>Réseau personnel, surtout sans fil : Bluetooth, infrarouge (souris, clavier, imprimante)</td></tr>\n  <tr><td><b>LAN</b></td><td>Une zone (entreprise, campus)</td><td>Même contrôle administratif ; Ethernet ou WLAN ; débits très élevés ; unités adjacentes</td></tr>\n  <tr><td><b>MAN</b></td><td>Dizaines de km (une ville)</td><td>Interconnecte des LAN proches, souvent en fibre optique ; les machines communiquent comme dans un seul LAN</td></tr>\n  <tr><td><b>WAN</b></td><td>LAN séparés géographiquement</td><td>PPP, HDLC, relais de trames, ATM, RNIS, MPLS</td></tr></tbody></table></div>\n  <div class=\"exam\"><b>Ce qui tombe</b>Classer des exemples concrets (« agences d'une banque entre deux villes » → WAN) et citer 2 caractéristiques par type.</div><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 5 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">CSMA/CD, CSMA/CA et le jeton sont des exemples de critère de classification selon…</div><button class=\"opt\" data-o=\"0\">La topologie</button><button class=\"opt\" data-o=\"1\">La méthode d&#39;accès</button><button class=\"opt\" data-o=\"2\">La couverture géographique</button><button class=\"opt\" data-o=\"3\">L&#39;ouverture</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Un casque Bluetooth relié à un téléphone forme un…</div><button class=\"opt\" data-o=\"0\">PAN</button><button class=\"opt\" data-o=\"1\">LAN</button><button class=\"opt\" data-o=\"2\">MAN</button><button class=\"opt\" data-o=\"3\">WAN</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Plusieurs LAN répartis dans une même ville et reliés en fibre optique forment un…</div><button class=\"opt\" data-o=\"0\">PAN</button><button class=\"opt\" data-o=\"1\">LAN</button><button class=\"opt\" data-o=\"2\">MAN</button><button class=\"opt\" data-o=\"3\">WAN</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Les agences d&#39;une banque entre Béni Mellal et Casablanca sont reliées par un…</div><button class=\"opt\" data-o=\"0\">PAN</button><button class=\"opt\" data-o=\"1\">LAN</button><button class=\"opt\" data-o=\"2\">MAN</b , HDLC, relais de trames, ATM, RNIS, MPLS."},{"n":"n13","q":"Un LAN est caractérisé par…","o":["Une administration partagée entre plusieurs opérateurs","Un même contrôle administratif et des débits très élevés","Des débits faibles et des liaisons satellites","Une couverture mondiale"],"a":1,"e":"LAN : zone unique, même contrôle administratif, Ethernet/WLAN, débits très élevés."}]},{"id":"s5","t":"Topologies","seance":"Chapitre 1","imp":5,"html":"<p><b>Topologie logique :</b> périphériques, ports et schéma d'adressage IP. <b>Topologie physique :</b> emplacement physique des périphériques, des ports configurés et des câbles.</p>\n  <div class=\"topos\">\n   <div class=\"topo\"><svg viewBox=\"0 0 150 104\" role=\"img\" aria-label=\"Topologie bus\"><line class=\"ln\" x1=\"10\" y1=\"50\" x2=\"140\" y2=\"50\"/><line class=\"ln\" x1=\"25\" y1=\"50\" x2=\"25\" y2=\"25\"/><circle class=\"nd\" cx=\"25\" cy=\"25\" r=\"7\"/><line class=\"ln\" x1=\"55\" y1=\"50\" x2=\"55\" y2=\"75\"/><circle class=\"nd\" cx=\"55\" cy=\"75\" r=\"7\"/><line class=\"ln\" x1=\"85\" y1=\"50\" x2=\"85\" y2=\"25\"/><circle class=\"nd\" cx=\"85\" cy=\"25\" r=\"7\"/><line class=\"ln\" x1=\"115\" y1=\"50\" x2=\"115\" y2=\"75\"/><circle class=\"nd\" cx=\"115\" cy=\"75\" r=\"7\"/><line class=\"ln\" x1=\"135\" y1=\"50\" x2=\"135\" y2=\"25\"/><circle class=\"nd\" cx=\"135\" cy=\"25\" r=\"7\"/></svg><b>Bus</b>Une ligne commune, souvent en coaxial. Simple, mais si le câble se rompt, tout tombe.</div>\n   <div class=\"topo\"><svg viewBox=\"0 0 150 104\" role=\"img\" aria-label=\"Topologie anneau\"><circle class=\"ln\" cx=\"75\" cy=\"50\" r=\"38\"/><circle class=\"nd\" cx=\"75\" cy=\"12\" r=\"7\"/><circle class=\"nd\" cx=\"107.90896534380866\" cy=\"31\" r=\"7\"/><circle class=\"nd\" cx=\"107.90896534380867\" cy=\"69\" r=\"7\"/><circle class=\"nd\" cx=\"75\" cy=\"88\" r=\"7\"/><circle class=\"nd\" cx=\"42.09103465619134\" cy=\"69.00000000000001\" r=\"7\"/><circle class=\"nd\" cx=\"42.09103465619133\" cy=\"30.99999
