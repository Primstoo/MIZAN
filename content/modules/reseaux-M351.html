us suit la règle Cisco classique (certitude élevée).<\/p>\n  <h3>Normes sans fil<\/h3>\n  <p><b>802.15<\/b> Bluetooth (PAN, 1 à 100 m) · <b>802.11<\/b> Wi-Fi (WLAN, CSMA/CA) · <b>802.16<\/b> WiMAX (point-à-multipoint, accès large bande) · <b>GSM/GPRS<\/b> (données sur réseau mobile).<\/p><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 10 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Dans le codage NRZ du cours, le bit 0 est représenté par…<\/div><button class=\"opt\" data-o=\"0\">0 V<\/button><button class=\"opt\" data-o=\"1\">−V<\/button><button class=\"opt\" data-o=\"2\">+V<\/button><button class=\"opt\" data-o=\"3\">Une transition<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Manchester (convention du cours) : le bit 1 est…<\/div><button class=\"opt\" data-o=\"0\">Une transition du bas vers le haut au milieu<\/button><button class=\"opt\" data-o=\"1\">Une transition du haut vers le bas au milieu<\/button><button class=\"opt\" data-o=\"2\">+V sur tout le bit<\/button><button class=\"opt\" data-o=\"3\">Pas de transition<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Le codage bipolaire représente les 1 par…<\/div><button class=\"opt\" data-o=\"0\">Toujours +V<\/button><button class=\"opt\" data-o=\"1\">Alternativement +V et −V<\/button><button class=\"opt\" data-o=\"2\">0 V<\/button><button class=\"opt\" data-o=\"3\">Une transition au milieu<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">La radio de police est un exemple de transmission…<\/div><button class=\"opt\" data-o=\"0\">Simplex<\/button><button class=\"opt\" data-o=\"1\">Half duplex<\/button><button class=\"opt\" data-o=\"2\">Full duplex<\/button><button class=\"opt\" data-o=\"3\">Parallèle<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Pour relier deux PC directement, on utilise un câble…<\/div><button class=\"opt\" data-o=\"0\">Droit<\/button><button class=\"opt\" data-o=\"1\">Croisé<\/button><button class=\"opt\" data-o=\"2\">Console<\/button><button class=\"opt\" data-o=\"3\">Coaxial obligatoirement<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Pour configurer un routeur neuf depuis un PC, on utilise un câble…<\/div><button class=\"opt\" data-o=\"0\">Droit<\/button><button class=\"opt\" data-o=\"1\">Croisé<\/button><button class=\"opt\" data-o=\"2\">Console (inversé)<\/button><button class=\"opt\" data-o=\"3\">Fibre<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">La norme IEEE de Bluetooth est…<\/div><button class=\"opt\" data-o=\"0\">802.3<\/button><button class=\"opt\" data-o=\"1\">802.11<\/button><button class=\"opt\" data-o=\"2\">802.15<\/button><button class=\"opt\" data-o=\"3\">802.16<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[],"qcm":[{"n":"n32","q":"Dans le codage NRZ du cours, le bit 0 est représenté par…","o":["0 V","−V","+V","Une transition"],"a":1,"e":"NRZ : 0 → −V, 1 → +V. En « tout ou rien », 0 → 0 V."},{"n":"n32","q":"Manchester (convention du cours) : le bit 1 est…","o":["Une transition du bas vers le haut au milieu","Une transition du haut vers le bas au milieu","+V sur tout le bit","Pas de transition"],"a":1,"e":"Selon ton prof : 0 = bas → haut, 1 = haut → bas. Attention, la norme IEEE 802.3 utilise la convention inverse : à l&#39;examen, suis le cours."},{"n":"n32","q":"Le codage bipolaire représente les 1 par…","o":["Toujours +V","Alternativement +V et −V","0 V","Une transition au milieu"],"a":1,"e":"Bipolaire : 0 → 0 ; les 1 alternent +V et −V."},{"n":"n33","q":"La radio de police est un exemple de transmission…","o":["Simplex","Half duplex","Full duplex","Parallèle"],"a":1,"e":"Deux sens, mais un seul émetteur à la fois : half duplex (à l&#39;alternat)."},{"n":"n33","q":"Pour relier deux PC directement, on utilise un câble…","o":["Droit","Croisé","Console","Coaxial obligatoirement"],"a":1,"e":"Équipements de même type → câble croisé."},{"n":"n33","q":"Pour configurer un routeur neuf depuis un PC, on utilise un câble…","o":["Droit","Croisé","Console (inversé)","Fibre"],"a":2,"e":"Le câble console (inversé) relie le PC au port console du routeur."},{"n":"n33","q":"La norme IEEE de Bluetooth est…","o":["802.3","802.11","802.15","802.16"],"a":2,"e":"802.15 Bluetooth (PAN) ; 802.11 Wi-Fi ; 802.16 WiMAX ; 802.3 Ethernet."}]},{"id":"s13","t":"Ch2 · Couche réseau et ICMP","seance":"Chapitre 2","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>La différence entre adresse IP et adresse MAC.<\/p>\n<details class=\"prereq\"><summary><b>Vérifie ton prérequis.<\/b> Sur le lien local, quelle adresse identifie une carte réseau : IP ou MAC ?<\/summary><p>L'adresse MAC. L'adresse IP, elle, sert à atteindre la machine de bout en bout.<\/p><\/details><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Trois rôles à ne pas mélanger.<\/strong> IP choisit le chemin de bout en bout, ARP trouve l&#39;adresse MAC du prochain saut, ICMP signale les problèmes et sert aux tests (ping, tracert).<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Croire qu&#39;une requête ARP traverse le routeur. C&#39;est une diffusion locale : elle reste dans son domaine de diffusion.<\/p>\n<\/aside><p>À la fin, tu sais expliquer le rôle de la couche réseau, dérouler un échange ARP et interpréter un message ICMP.<\/p>\n<h2>Le cours<\/h2>\n<p><b>Rôle :<\/b> acheminer les paquets d'un réseau à un autre, de la source à la destination. <b>Fonctions :<\/b> adressage IP (IPv4, IPv6), routage (meilleur chemin), fragmentation selon la MTU, détection des erreurs d'acheminement (ICMP). <b>Protocoles :<\/b> IP, ICMP, RIP, OSPF, BGP. <b>Équipements :<\/b> routeurs, pare-feux L3.<\/p>\n  <p><b>IPv4 :<\/b> sans connexion · au mieux (peu fiable) · indépendant des médias. Chaque routeur examine l'adresse IP de destination ; chaque tronçon jusqu'au périphérique suivant est un <b>saut<\/b>.<\/p>\n  <p><b>Domaine de diffusion :<\/b> zone où chaque machine peut joindre directement toutes les autres sans passer par un routeur. <b>Passerelle par défaut :<\/b> l'interface du routeur connectée au LAN, qui sert de sortie ; tous les hôtes d'un même réseau ont la même. Sans elle, un hôte ne communique que dans son réseau local. (Linux : <code>netstat -rn<\/code>.)<\/p>\n  <h3>ICMP (RFC 792)<\/h3>\n  <div class=\"table-wrap\"><table><thead><tr><th>Type<\/th><th>Message<\/th><th>Usage<\/th><\/tr><\/thead><tbody>\n  <tr><td class=\"num\">0<\/td><td>Echo Reply<\/td><td>Réponse au ping<\/td><\/tr>\n  <tr><td class=\"num\">3<\/td><td>Destination Unreachable<\/td><td>Code 0 réseau, 1 hôte, 3 port injoignable<\/td><\/tr>\n  <tr><td class=\"num\">5<\/td><td>Redirect<\/td><td>Redirection vers un autre routeur<\/td><\/tr>\n  <tr><td class=\"num\">8<\/td><td>Echo Request<\/td><td>Requête ping<\/td><\/tr>\n  <tr><td class=\"num\">11<\/td><td>Time Exceeded<\/td><td>TTL expiré (utilisé par traceroute)<\/td><\/tr><\/tbody><\/table><\/div>\n  <p>En-tête ICMP de 8 octets (type, code, checksum, reste) ; il est encapsulé dans IP (protocole n° 1). Une erreur sur un message ICMP ne génère jamais d'autre message ICMP. <b>Sécurité :<\/b> Ping Flood, Ping of Death, tunneling ICMP ; parades : filtrage au pare-feu, rate limiting.<\/p>\n  <h3>ARP : retrouver une adresse MAC à partir d'une IP (TD 2, ex. 7)<\/h3>\n  <ul>\n    <li>Pour envoyer à une IP du <b>même réseau<\/b>, l'hôte cherche d'abord la MAC dans sa table ARP. S'il ne la connaît pas, il <b>diffuse<\/b> une requête ARP (« qui a cette IP ? ») avec la MAC de destination FF:FF:FF:FF:FF:FF. Seule la machine concernée répond, en envoyant directement sa MAC.<\/li>\n    <li>La requête se propage dans tout le <b>domaine de diffusion<\/b> (le réseau local : tous les ports du switch). Un routeur branché sur ce même switch la reçoit aussi, puisqu'il est dans le LAN, mais il ne la retransmet pas vers un autre réseau.<\/li>\n    <li>Pour une IP d'un <b>autre réseau<\/b>, l'hôte fait l'ARP de sa <b>passerelle par défaut<\/b>, pas celui de la destination.<\/li>\n  <\/ul>\n  <h3>ICMP : compléments du TD 2<\/h3>\n  <ul>\n    <li><b>ping<\/b> : une réponse (Echo Reply, type 0) prouve que la machine est joignable et que sa pile IP fonctionne. Un silence ne prouve pas toujours une panne : un pare-feu peut bloquer l'ICMP.<\/li>\n    <li><b>Destination inconnue<\/b> : un routeur qui n'a pas de route détruit le paquet et renvoie un <b>Destination Unreachable<\/b> (type 3). Le message contient l'<b>en-tête IP du paquet fautif et les 8 premiers octets de ses données<\/b>, pour que l'émetteur sache quelle communication a échoué.<\/li>\n    <li><b>Lire la sortie de traceroute<\/b> : chaque ligne donne le saut, l'adresse du routeur et <b>trois temps<\/b> : les <b>temps aller-retour (RTT)<\/b> de 3 sondes vers ce saut, pas des durées cumulées d'un saut au suivant. Le temps total jusqu'à la destination est celui de la dernière ligne (environ la moyenne de ses trois mesures). « <b>* * *<\/b> » : aucune réponse avant la fin du délai (routeur qui filtre l'ICMP, ou paquets perdus) ; la route n'est pas forcément coupée, car les sauts suivants peuvent répondre.<\/li>\n  <\/ul><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 12 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">IPv4 est dit « au mieux » car…<\/div><button class=\"opt\" data-o=\"0\">Il garantit la livraison<\/button><button class=\"opt\" data-o=\"1\">Il n&#39;utilise aucune surcharge pour garantir la transmission<\/button><button class=\"opt\" data-o=\"2\">Il chiffre les paquets<\/button><button class=\"opt\" data-o=\"3\">Il établit une connexion<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Un ping envoie un ICMP de type…<\/div><button class=\"opt\" data-o=\"0\">0<\/button><button class=\"opt\" data-o=\"1\">3<\/button><button class=\"opt\" data-o=\"2\">8<\/button><button class=\"opt\" data-o=\"3\">11<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Sans passerelle par défaut, un hôte…<\/div><button class=\"opt\" data-o=\"0\">Ne peut communiquer qu&#39;avec son réseau local<\/button><button class=\"opt\" data-o=\"1\">Ne peut plus rien envoyer<\/button><button class=\"opt\" data-o=\"2\">Utilise le DNS<\/button><button class=\"opt\" data-o=\"3\">Devient un routeur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Traceroute s&#39;appuie sur les messages ICMP…<\/div><button class=\"opt\" data-o=\"0\">Echo Reply<\/button><button class=\"opt\" data-o=\"1\">Redirect<\/button><button class=\"opt\" data-o=\"2\">Time Exceeded (11)<\/button><button class=\"opt\" data-o=\"3\">Destination Unreachable<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Le numéro d&#39;accusé de réception TCP indique…<\/div><button class=\"opt\" data-o=\"0\">Le dernier octet reçu<\/button><button class=\"opt\" data-o=\"1\">Le prochain octet attendu<\/button><button class=\"opt\" data-o=\"2\">La taille de la fenêtre<\/button><button class=\"opt\" data-o=\"3\">Le port<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">La fermeture d&#39;une connexion TCP se fait en…<\/div><button class=\"opt\" data-o=\"0\">2 temps<\/button><button class=\"opt\" data-o=\"1\">3 temps<\/button><button class=\"opt\" data-o=\"2\">4 temps<\/button><button class=\"opt\" data-o=\"3\">1 temps<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Le code HTTP 404 signifie…<\/div><button class=\"opt\" data-o=\"0\">OK<\/button><button class=\"opt\" data-o=\"1\">Document déplacé<\/button><button class=\"opt\" data-o=\"2\">Document non trouvé<\/button><button class=\"opt\" data-o=\"3\">Version non gérée<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Dans traceroute, quel message ICMP renvoie chaque routeur intermédiaire ?<\/div><button class=\"opt\" data-o=\"0\">Echo Reply<\/button><button class=\"opt\" data-o=\"1\">Time Exceeded<\/button><button class=\"opt\" data-o=\"2\">Redirect<\/button><button class=\"opt\" data-o=\"3\">Destination Unreachable<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">ICMP transporte-t-il des données utilisateur, comme TCP ou UDP ?<\/div><button class=\"opt\" data-o=\"0\">Oui, comme TCP<\/button><button class=\"opt\" data-o=\"1\">Oui, comme UDP<\/button><button class=\"opt\" data-o=\"2\">Non : des messages de contrôle et d&#39;erreur, encapsulés dans IP<\/button><button class=\"opt\" data-o=\"3\">Non : il est encapsulé dans TCP<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[],"qcm":[{"n":"n34","q":"IPv4 est dit « au mieux » car…","o":["Il garantit la livraison","Il n&#39;utilise aucune surcharge pour garantir la transmission","Il chiffre les paquets","Il établit une connexion"],"a":1,"e":"Au mieux = peu fiable : il ne garantit pas la livraison. C&#39;est TCP, au-dessus, qui fiabilise."},{"n":"n34","q":"Un ping envoie un ICMP de type…","o":["0","3","8","11"],"a":2,"e":"Echo Request = 8 ; la réponse est Echo Reply = 0."},{"n":"n34","q":"Sans passerelle par défaut, un hôte…","o":["Ne peut communiquer qu&#39;avec son réseau local","Ne peut plus rien envoyer","Utilise le DNS","Devient un routeur"],"a":0,"e":"La passerelle est la sortie du réseau local."},{"n":"n34","q":"Traceroute s&#39;appuie sur les messages ICMP…","o":["Echo Reply","Redirect","Time Exceeded (11)","Destination Unreachable"],"a":2,"e":"Chaque saut renvoie un Time Exceeded quand le TTL arrive à 0."},{"n":"n35","q":"Le numéro d&#39;accusé de réception TCP indique…","o":["Le dernier octet reçu","Le prochain octet attendu","La taille de la fenêtre","Le port"],"a":1,"e":"ACK = numéro du prochain octet attendu."},{"n":"n35","q":"La fermeture d&#39;une connexion TCP se fait en…","o":["2 temps","3 temps","4 temps","1 temps"],"a":2,"e":"FIN, ACK, FIN, ACK : chaque côté ferme séparément."},{"n":"n35","q":"Le code HTTP 404 signifie…","o":["OK","Document déplacé","Document non trouvé","Version non gérée"],"a":2,"e":"200 OK · 301 déplacé · 400 syntaxe · 404 non trouvé · 505 version."},{"n":"n34","q":"Dans traceroute, quel message ICMP renvoie chaque routeur intermédiaire ?","o":["Echo Reply","Time Exceeded","Redirect","Destination Unreachable"],"a":1,"e":"Time Exceeded (type 11) : le TTL est arrivé à 0 sur ce routeur, ce qui révèle son adresse."},{"n":"n34","q":"ICMP transporte-t-il des données utilisateur, comme TCP ou UDP ?","o":["Oui, comme TCP","Oui, comme UDP","Non : des messages de contrôle et d&#39;erreur, encapsulés dans IP","Non : il est encapsulé dans TCP"],"a":2,"e":"ICMP est un protocole de contrôle et de diagnostic, encapsulé dans IP (protocole n° 1)."}]},{"id":"adressage","t":"Ch3 · Adressage IP, sous-réseaux, IPv6","seance":"Chapitre 3","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Une adresse IPv4 est faite de 4 octets. Chaque octet s&#39;écrit sur 8 bits : 128, 64, 32, 16, 8, 4, 2, 1.<\/p>\n<details class=\"prereq\"><summary><b>Vérifie ton prérequis.<\/b> Écris 192 en binaire sur 8 bits.<\/summary><p>11000000 (128 + 64 = 192). Les 8 bits se lisent 128, 64, 32, 16, 8, 4, 2, 1.<\/p><\/details><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense en bits, pas en points.<\/strong> Une adresse IPv4 est une suite de 32 bits. Le masque dit où couper : à gauche le réseau, à droite la machine. Tout le chapitre découle de cette coupure.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Compter toutes les adresses d&#39;un réseau comme des machines. La première (bits machine à 0) est l&#39;adresse du réseau, la dernière (bits machine à 1) est l&#39;adresse de diffusion : il reste 2^h − 2 adresses pour les machines.<\/p>\n<\/aside><p>À la fin, tu sais distinguer unicast, multicast et broadcast, reconnaître une adresse privée ou spéciale, trouver la classe d&#39;une adresse, calculer réseau, diffusion et plage d&#39;hôtes, découper un bloc en sous-réseaux égaux ou en VLSM, expliquer pourquoi deux réseaux ne se parlent pas sans routeur, et lire une adresse IPv6.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p><strong>Sources.<\/strong> Cours du chapitre 3 et TD 4 de ton prof. Les exercices 6 et 7 du TD ne sont pas corrigés dans le scan : leurs corrigés sont rédigés ici et vérifiés par calcul.<\/p>\n<\/aside><h2>Idée 1 · Qui reçoit le paquet, et qui donne l&#39;adresse<\/h2>\n<p>Idée : une adresse sert à viser <strong>une<\/strong> machine, <strong>un groupe<\/strong> ou <strong>tout le réseau<\/strong>. Elle est posée à la main (statique) ou prêtée par un serveur DHCP (dynamique).<\/p>\n<svg viewBox=\"0 0 560 150\" role=\"img\" aria-label=\"Trois types de communication : unicast d'une machine vers une seule, multicast vers un groupe inscrit, broadcast vers toutes les machines du réseau local\" style=\"max-width:100%;height:auto\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><circle cx=\"40\" cy=\"75\" r=\"12\" stroke=\"#D9824F\" stroke-width=\"2.5\"/><circle cx=\"140\" cy=\"40\" r=\"10\" stroke=\"#D9824F\" stroke-width=\"2.5\"/><circle cx=\"140\" cy=\"75\" r=\"10\"/><circle cx=\"140\" cy=\"110\" r=\"10\"/><path d=\"M52 72L129 43\" stroke=\"#D9824F\" stroke-width=\"2\"/><circle cx=\"230\" cy=\"75\" r=\"12\" stroke=\"#D9824F\" stroke-width=\"2.5\"/><circle cx=\"330\" cy=\"40\" r=\"10\" stroke=\"#D9824F\" stroke-width=\"2.5\"/><circle cx=\"330\" cy=\"75\" r=\"10\"/><circle cx=\"330\" cy=\"110\" r=\"10\" stroke=\"#D9824F\" stroke-width=\"2.5\"/><path d=\"M242 72L319 43M242 78L319 107\" stroke=\"#D9824F\" stroke-width=\"2\"/><circle cx=\"420\" cy=\"75\" r=\"12\" stroke=\"#D9824F\" stroke-width=\"2.5\"/><circle cx=\"520\" cy=\"40\" r=\"10\" stroke=\"#D9824F\" stroke-width=\"2.5\"/><circle cx=\"520\" cy=\"75\" r=\"10\" stroke=\"#D9824F\" stroke-width=\"2.5\"/><circle cx=\"520\" cy=\"110\" r=\"10\" stroke=\"#D9824F\" stroke-width=\"2.5\"/><path d=\"M432 72L509 43M432 75H509M432 78L509 107\" stroke=\"#D9824F\" stroke-width=\"2\"/><\/g><g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\"><text x=\"90\" y=\"142\">unicast : 1 → 1<\/text><text x=\"280\" y=\"142\">multicast : 1 → groupe<\/text><text x=\"470\" y=\"142\">broadcast : 1 → tous<\/text><\/g><\/svg><table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Vers qui<\/th>\n<th>Exemple d&#39;adresse<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Monodiffusion (unicast)<\/td>\n<td>une seule machine<\/td>\n<td>192.168.1.10<\/td>\n<\/tr>\n<tr>\n<td>Multidiffusion (multicast)<\/td>\n<td>les machines inscrites à un groupe<\/td>\n<td>224.0.0.0 à 239.255.255.255<\/td>\n<\/tr>\n<tr>\n<td>Diffusion (broadcast)<\/td>\n<td>toutes les machines du réseau local<\/td>\n<td>192.168.1.255 en /24<\/td>\n<\/tr>\n<\/tbody><\/table>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Statique<\/th>\n<th>Dynamique (DHCP)<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Qui pose l&#39;adresse<\/td>\n<td>l&#39;administrateur, à la main<\/td>\n<td>un serveur DHCP, automatiquement<\/td>\n<\/tr>\n<tr>\n<td>Durée<\/td>\n<td>ne change pas<\/td>\n<td>prêtée pour une durée (le bail), peut changer<\/td>\n<\/tr>\n<tr>\n<td>Pour qui<\/td>\n<td>serveurs, imprimantes réseau, caméras IP<\/td>\n<td>PC, téléphones, Wi-Fi public, écoles<\/td>\n<\/tr>\n<tr>\n<td>Risque<\/td>\n<td>conflit si deux machines ont la même adresse<\/td>\n<td>panne du serveur DHCP = plus d&#39;adresses<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Qui distribue les adresses publiques ? L&#39;<strong>IANA<\/strong> les répartit entre 5 registres régionaux (<strong>RIR<\/strong>) : ARIN (Amérique du Nord), RIPE NCC (Europe, Moyen-Orient, Asie centrale), APNIC (Asie-Pacifique), LACNIC (Amérique latine), <strong>AFRINIC (Afrique, donc le Maroc et le Tchad)<\/strong>. L&#39;IANA ne donne jamais d&#39;adresse directement à un utilisateur.<\/p>\n<aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>Dans les diapos, l&#39;inconvénient « temps de configuration plus long » est listé pour le statique <strong>et<\/strong> pour le DHCP. C&#39;est un copier-coller : le DHCP est justement ce qui évite de configurer à la main. Ne le cite pas comme inconvénient du DHCP.<\/p>\n<\/aside><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Unicast 1 → 1, multicast 1 → groupe, broadcast 1 → tous (réseau local). Statique pour ce qui doit rester joignable à la même adresse, DHCP pour le reste.<\/p>\n<\/aside><h2>Idée 2 · Une adresse IPv4 = réseau + machine<\/h2>\n<p>Idée : l&#39;adresse est une seule suite de 32 bits ; la <strong>classe<\/strong> (lue dans le premier octet) dit où se trouve la coupure par défaut.<\/p>\n<svg viewBox=\"0 0 560 120\" role=\"img\" aria-label=\"Adresse IPv4 de 32 bits en 4 octets, avec la coupure réseau machine d'une classe B après 16 bits\" style=\"max-width:100%;height:auto\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><rect x=\"10\" y=\"30\" width=\"135\" height=\"44\" rx=\"5\" stroke=\"#D9824F\" stroke-width=\"2.5\"/><rect x=\"145\" y=\"30\" width=\"135\" height=\"44\" rx=\"5\" stroke=\"#D9824F\" stroke-width=\"2.5\"/><rect x=\"280\" y=\"30\" width=\"135\" height=\"44\" rx=\"5\"/><rect x=\"415\" y=\"30\" width=\"135\" height=\"44\" rx=\"5\"/><path d=\"M280 20v64\" stroke=\"#D9824F\" stroke-width=\"3\" stroke-dasharray=\"5 4\"/><\/g><g font-family=\"sans-serif\" font-size=\"15\" fill=\"currentColor\" text-anchor=\"middle\"><text x=\"77\" y=\"58\">138<\/text><text x=\"212\" y=\"58\">96<\/text><text x=\"347\" y=\"58\">32<\/text><text x=\"482\" y=\"58\">3<\/text><text x=\"212\" y=\"100\" fill=\"#D9824F\" font-size=\"13\">réseau (16 bits)<\/text><text x=\"482\" y=\"100\" font-size=\"13\">machine (16 bits)<\/text><text x=\"347\" y=\"100\" font-size=\"13\">machine<\/text><text x=\"280\" y=\"14\" font-size=\"12\" fill=\"#D9824F\">coupure /16<\/text><\/g><\/svg><table>\n<thead>\n<tr>\n<th>Classe<\/th>\n<th>1er octet<\/th>\n<th>Bits de début<\/th>\n<th>Masque par défaut<\/th>\n<th>Hôtes par réseau<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>A<\/td>\n<td>0 à 127<\/td>\n<td>0<\/td>\n<td>/8 (255.0.0.0)<\/td>\n<td>2²⁴ − 2 = 16 777 214<\/td>\n<\/tr>\n<tr>\n<td>B<\/td>\n<td>128 à 191<\/td>\n<td>10<\/td>\n<td>/16 (255.255.0.0)<\/td>\n<td>2¹⁶ − 2 = 65 534<\/td>\n<\/tr>\n<tr>\n<td>C<\/td>\n<td>192 à 223<\/td>\n<td>110<\/td>\n<td>/24 (255.255.255.0)<\/td>\n<td>2⁸ − 2 = 254<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Les classes D (224 à 239, multicast) et E (réservée) ne s&#39;attribuent pas à des machines.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Trouver la classe et le nombre d'hôtes : 191.16.32.29<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Lis le premier octet<\/div><ol start=\"191\">\n<li><\/li>\n<\/ol>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · Place-le dans un intervalle<\/div><p>191 est dans [128, 191] donc classe B. Contrôle en binaire : 191 = 10111111, il commence par 10.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · Déduis le masque<\/div><p>Classe B, donc /16.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · Compte les bits machine<\/div><p>32 − 16 = 16 bits machine.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · Calcule les hôtes<\/div><p>2¹⁶ − 2 = 65 534 (on retire l&#39;adresse du réseau et celle de diffusion).<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Classe A : /8. Classe B : /16. Classe C : /24. Hôtes = 2^(bits machine) − 2.<\/p>\n<\/aside><h3>Application · TD 4, exercice 1 (question 1)<\/h3>\n<section class=\"exo\"><h3>TD 4 · Exercice 1 · Classes d&#39;adresses<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p><strong>T4.1.1.<\/strong> Quelles sont les classes des adresses suivantes ? Combien d&#39;adresses machines chacune peut-elle utiliser ? a) 204.160.241.93 · b) 138.96.32.3 · c) 18.181.0.31 · d) 191.16.32.29<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Regarde seulement le premier octet : 0-127 classe A, 128-191 classe B, 192-223 classe C. Hôtes = 2^(bits machine) − 2.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>a)<\/b> 204 ∈ [192, 223] → <b>classe C<\/b>, /24, 2⁸ − 2 = <b>254<\/b> hôtes.<br><b>b)<\/b> 138 ∈ [128, 191] → <b>classe B<\/b>, /16, 2¹⁶ − 2 = <b>65 534<\/b>.<br><b>c)<\/b> 18 ∈ [0, 127] → <b>classe A<\/b>, /8, 2²⁴ − 2 = <b>16 777 214<\/b>.<br><b>d)<\/b> 191 = 10111111 commence par 10 → <b>classe B<\/b>, /16, <b>65 534<\/b> hôtes (191 est le dernier octet de la classe B, pas de la classe C).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Idée 3 · Le masque coupe l&#39;adresse : réseau, diffusion, plage d&#39;hôtes<\/h2>\n<p>Idée : le masque est une suite de 1 (partie réseau) puis de 0 (partie machine). Un « ET » bit à bit entre l&#39;adresse et le masque donne l&#39;adresse du réseau.<\/p>\n<svg viewBox=\"0 0 560 130\" role=\"img\" aria-label=\"Adresse 200.100.10.60 avec masque /27 : 27 bits de réseau et 5 bits de machine\" style=\"max-width:100%;height:auto\"><g font-family=\"monospace\" font-size=\"15\" fill=\"currentColor\"><text x=\"10\" y=\"28\" xml:space=\"preserve\">adresse&#160;&#160;11001000.01100100.00001010.001<tspan fill=\"#D9824F\">11100<\/tspan><\/text><text x=\"10\" y=\"58\" xml:space=\"preserve\">masque&#160;&#160;&#160;11111111.11111111.11111111.111<tspan fill=\"#D9824F\">00000<\/tspan><\/text><text x=\"10\" y=\"88\" xml:space=\"preserve\">réseau&#160;&#160;&#160;11001000.01100100.00001010.001<tspan fill=\"#D9824F\">00000<\/tspan><\/text><\/g><g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\"><text x=\"10\" y=\"118\">→ 200.100.10.32 (27 bits réseau, 5 bits machine en orange)<\/text><\/g><\/svg><table>\n<thead>\n<tr>\n<th>Masque<\/th>\n<th>Notation<\/th>\n<th>Bits machine<\/th>\n<th>Hôtes<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>255.255.255.192<\/td>\n<td>/26<\/td>\n<td>6<\/td>\n<td>62<\/td>\n<\/tr>\n<tr>\n<td>255.255.255.224<\/td>\n<td>/27<\/td>\n<td>5<\/td>\n<td>30<\/td>\n<\/tr>\n<tr>\n<td>255.255.255.240<\/td>\n<td>/28<\/td>\n<td>4<\/td>\n<td>14<\/td>\n<\/tr>\n<tr>\n<td>255.255.255.248<\/td>\n<td>/29<\/td>\n<td>3<\/td>\n<td>6<\/td>\n<\/tr>\n<tr>\n<td>255.255.240.0<\/td>\n<td>/20<\/td>\n<td>12<\/td>\n<td>4 094<\/td>\n<\/tr>\n<\/tbody><\/table>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Adresse réseau, diffusion et plage d'hôtes de 200.100.10.60 / 255.255.255.224<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/6 · Trouve la longueur du masque<\/div><p>224 = 11100000, donc 3 bits dans le dernier octet : 24 + 3 = /27. Il reste 5 bits machine.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/6 · Écris le dernier octet de l&#39;adresse<\/div><p>60 = 00111100. Les 3 premiers bits (001) sont réseau, les 5 derniers (11100) sont machine.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/6 · Adresse du réseau<\/div><p>Bits machine à 0 : 00100000 = 32. Réseau = 200.100.10.32.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/6 · Adresse de diffusion<\/div><p>Bits machine à 1 : 00111111 = 63. Diffusion = 200.100.10.63.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/6 · Plage d&#39;hôtes<\/div><p>De réseau + 1 à diffusion − 1 : 200.100.10.33 à 200.100.10.62 (30 hôtes).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">6/6 · Appartenance<\/div><p>200.100.10.35 = 00100011, ET avec le masque = 00100000 = 32 : même réseau, il appartient au sous-réseau.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Réseau : bits machine à 0. Diffusion : bits machine à 1. Premier hôte = réseau + 1. Dernier hôte = diffusion − 1.<\/p>\n<\/aside><h3>Application · TD 4, exercices 2 et 3<\/h3>\n<section class=\"exo\"><h3>TD 4 · Exercice 2 · Tableau d&#39;adressage<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p><strong>T4.2.1.<\/strong> Pour 145.16.64.0/18 : masque, première adresse IP, dernière adresse IP, adresse de diffusion.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>/18 = 16 + 2 bits dans le 3ᵉ octet : 11000000 = 192. Le bloc fait 64 dans le 3ᵉ octet (256 − 192).<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Masque <b>255.255.192.0<\/b> · première <b>145.16.64.1<\/b> · dernière <b>145.16.127.254<\/b> · diffusion <b>145.16.127.255<\/b> (16 382 hôtes).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p><strong>T4.2.2.<\/strong> Pour 192.168.1.32/27 : masque, première, dernière, diffusion.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>/27 → 5 bits machine, bloc de 32 dans le dernier octet.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Masque <b>255.255.255.224<\/b> · première <b>192.168.1.33<\/b> · dernière <b>192.168.1.62<\/b> · diffusion <b>192.168.1.63<\/b> (30 hôtes).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p><strong>T4.2.3.<\/strong> Pour 200.168.1.0/28 : masque, première, dernière, diffusion.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>/28 → 4 bits machine, bloc de 16.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Masque <b>255.255.255.240<\/b> · première <b>200.168.1.1<\/b> · dernière <b>200.168.1.14<\/b> · diffusion <b>200.168.1.15<\/b> (14 hôtes).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p><strong>T4.2.4.<\/strong> Pour 18.1.5.24/29 : masque, première, dernière, diffusion.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>/29 → 3 bits machine, bloc de 8 : 24 à 31.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Masque <b>255.255.255.248<\/b> · première <b>18.1.5.25<\/b> · dernière <b>18.1.5.30<\/b> · diffusion <b>18.1.5.31<\/b> (6 hôtes).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p><strong>T4.2.5.<\/strong> Pour 145.16.64.0/20 : masque, première, dernière, diffusion.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>/20 = 16 + 4 bits dans le 3ᵉ octet : 11110000 = 240. Le bloc fait 16 dans le 3ᵉ octet : 64 à 79.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Masque <b>255.255.240.0<\/b> · première <b>145.16.64.1<\/b> · dernière <b>145.16.79.254<\/b> · diffusion <b>145.16.79.255<\/b> (4 094 hôtes).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><p><strong>T4.2.6.<\/strong> Pour 10.96.0.0/11 : masque, première, dernière, diffusion.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>/11 = 8 + 3 bits dans le 2ᵉ octet : 11100000 = 224. Le bloc fait 32 dans le 2ᵉ octet : 96 à 127.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Masque <b>255.224.0.0<\/b> · première <b>10.96.0.1<\/b> · dernière <b>10.127.255.254<\/b> · diffusion <b>10.127.255.255<\/b> (2 097 150 hôtes). Tous les résultats de ce tableau sont vérifiés par programme.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>TD 4 · Exercice 3 · Paramètres de l&#39;ordinateur P1<\/h3><div class=\"ex\" data-x=\"7\"><div class=\"ex-q\"><p><strong>T4.3.1.<\/strong> P1 a pour adresse 200.100.10.60 et pour masque 255.255.255.224. Codez l&#39;adresse IP en binaire.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>200 = 128 + 64 + 8, 100 = 64 + 32 + 4, 10 = 8 + 2, 60 = 32 + 16 + 8 + 4.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>11001000.01100100.00001010.00111100<\/b><\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"8\"><div class=\"ex-q\"><p><strong>T4.3.2.<\/strong> Quelle est la classe du réseau ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Regarde les premiers bits du premier octet.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Le premier octet 11001000 commence par <b>110<\/b> (200 ∈ [192, 223]) : <b>classe C<\/b>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"9\"><div class=\"ex-q\"><p><strong>T4.3.3.<\/strong> Quelle est l&#39;adresse du sous-réseau ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Deux méthodes : ET logique avec le masque, ou bits machine à 0.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Masque dernier octet 11100000. 60 = 00111100. ET = 00100000 = 32. Sous-réseau : <b>200.100.10.32<\/b> (/27).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"10\"><div class=\"ex-q\"><p><strong>T4.3.4.<\/strong> Quelle est l&#39;adresse de diffusion de ce sous-réseau ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Bits machine (les 5 derniers) à 1.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>00111111 = 63. Diffusion : <b>200.100.10.63<\/b>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"11\"><div class=\"ex-q\"><p><strong>T4.3.5.<\/strong> L&#39;adresse 200.100.10.35 appartient-elle à ce sous-réseau ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Fais le ET avec le masque et compare avec l&#39;adresse du sous-réseau.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>35 = 00100011. ET avec 11100000 = 00100000 = 32 = adresse du sous-réseau. <b>Oui<\/b>, elle appartient à 200.100.10.32/27 (plage 33 à 62).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Idée 4 · Adresses spéciales, privées et publiques<\/h2>\n<p>Idée : certaines plages ne s&#39;attribuent jamais à un PC sur Internet. Il faut les reconnaître au premier coup d&#39;œil.<\/p>\n<svg viewBox=\"0 0 560 140\" role=\"img\" aria-label=\"Un réseau local en adresses privées 192.168.1.0/24 sort sur Internet par un routeur NAT qui le remplace par une adresse publique fournie par le FAI\" style=\"max-width:100%;height:auto\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><rect x=\"10\" y=\"30\" width=\"200\" height=\"80\" rx=\"8\"/><circle cx=\"290\" cy=\"70\" r=\"24\" stroke=\"#D9824F\" stroke-width=\"2.5\"/><path d=\"M210 70h56M314 70h56\"/><path d=\"M380 60c10-30 60-30 75-10c25-15 70 0 60 25c25 15 0 45-25 35c-15 20-70 20-85 0c-30 5-45-30-25-50z\"/><\/g><g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\"><text x=\"110\" y=\"62\">LAN : adresses privées<\/text><text x=\"110\" y=\"85\">192.168.1.0/24<\/text><text x=\"290\" y=\"74\" fill=\"#D9824F\">NAT<\/text><text x=\"455\" y=\"78\">Internet<\/text><text x=\"290\" y=\"125\" fill=\"#D9824F\" font-size=\"12\">privée → publique (du FAI)<\/text><\/g><\/svg><table>\n<thead>\n<tr>\n<th>Plage<\/th>\n<th>Rôle<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>10.0.0.0 à 10.255.255.255 (10.0.0.0/8)<\/td>\n<td>privée (classe A)<\/td>\n<\/tr>\n<tr>\n<td>172.16.0.0 à 172.31.255.255 (172.16.0.0/12)<\/td>\n<td>privée (classe B)<\/td>\n<\/tr>\n<tr>\n<td>192.168.0.0 à 192.168.255.255 (192.168.0.0/16)<\/td>\n<td>privée (classe C)<\/td>\n<\/tr>\n<tr>\n<td>127.0.0.0/8 (souvent 127.0.0.1)<\/td>\n<td>bouclage : la machine se parle à elle-même<\/td>\n<\/tr>\n<tr>\n<td>169.254.0.0/16<\/td>\n<td>lien local : prise toute seule quand aucun DHCP ne répond<\/td>\n<\/tr>\n<tr>\n<td>192.0.2.0/24 (TEST-NET)<\/td>\n<td>réservée aux exemples et à la documentation<\/td>\n<\/tr>\n<tr>\n<td>0.0.0.0/8<\/td>\n<td>« ce réseau » ; 0.0.0.0/0 sert d&#39;écriture à la route par défaut<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Les adresses <strong>privées<\/strong> ne sont pas routées sur Internet : des milliers de réseaux utilisent les mêmes. Pour sortir, le routeur les traduit en une adresse <strong>publique<\/strong> fournie par le FAI : c&#39;est le <strong>NAT<\/strong>, vu en détail au chapitre 5.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Classer 172.20.5.9, 172.40.1.1 et 169.254.3.7<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · 172.20.5.9<\/div><p>172.20 est entre 172.16 et 172.31 : privée.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · 172.40.1.1<\/div><p>172.40 dépasse 172.31 : publique (piège classique).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · 169.254.3.7<\/div><p>Plage 169.254.0.0/16 : lien local. La machine n&#39;a pas trouvé de serveur DHCP.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>La diapo 17 écrit « 69.254.0.0 à 169.254.255.255 » : il manque le 1, c&#39;est <strong>169.254.0.0<\/strong>. Elle appelle aussi « route par défaut » la plage 0.0.0.0 à 0.255.255.255 : cette plage veut dire « ce réseau » ; la route par défaut, c&#39;est 0.0.0.0/0 (chapitre 4).<\/p>\n<\/aside><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Privées : 10/8, 172.16/12 (de 172.16 à 172.31), 192.168/16. Bouclage 127/8. Lien local 169.254/16.<\/p>\n<\/aside><section class=\"exo\"><h3>Adresses spéciales<\/h3><div class=\"ex\" data-x=\"12\"><div class=\"ex-q\"><p>Un PC affiche l&#39;adresse 169.254.12.4. Que s&#39;est-il passé ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Regarde à quelle plage spéciale appartient 169.254.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>C&#39;est une adresse de <strong>lien local<\/strong> (169.254.0.0/16) : le PC était réglé en DHCP mais <strong>aucun serveur DHCP n&#39;a répondu<\/strong>. Il s&#39;est donné une adresse tout seul, qui ne permet pas de sortir du réseau local.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"13\"><div class=\"ex-q\"><p>Parmi 10.4.4.4, 172.32.0.1, 192.168.100.1 et 8.8.8.8, lesquelles sont privées ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>172.16 à 172.31 seulement pour la classe B.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><strong>10.4.4.4<\/strong> et <strong>192.168.100.1<\/strong>. 172.32.0.1 est publique (172.32 &gt; 172.31), 8.8.8.8 aussi.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Idée 5 · Découper un bloc en sous-réseaux<\/h2>\n<p>Idée : pour obtenir n sous-réseaux, on <strong>emprunte<\/strong> x bits à la partie machine, avec 2^x ≥ n. Ces bits s&#39;ajoutent au préfixe.<\/p>\n<svg viewBox=\"0 0 560 110\" role=\"img\" aria-label=\"Réseau 172.32.0.0 de classe B : 16 bits de réseau, 4 bits de sous-réseau empruntés, 12 bits de machine\" style=\"max-width:100%;height:auto\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><rect x=\"10\" y=\"26\" width=\"240\" height=\"46\" rx=\"5\"/><rect x=\"250\" y=\"26\" width=\"60\" height=\"46\" rx=\"5\" stroke=\"#D9824F\" stroke-width=\"2.5\"/><rect x=\"310\" y=\"26\" width=\"240\" height=\"46\" rx=\"5\"/><\/g><g font-family=\"sans-serif\" font-size=\"14\" fill=\"currentColor\" text-anchor=\"middle\"><text x=\"130\" y=\"55\">réseau : 16 bits<\/text><text x=\"280\" y=\"55\" fill=\"#D9824F\">4<\/text><text x=\"430\" y=\"55\">machine : 12 bits<\/text><text x=\"280\" y=\"96\" fill=\"#D9824F\" font-size=\"13\">bits empruntés : 2⁴ = 16 sous-réseaux<\/text><\/g><\/svg><figure class=\"etapes\" data-i=\"0\"><figcaption>Découper 172.32.0.0 pour 10 succursales<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/6 · Classe<\/div><p>172 ∈ [128, 191] : classe B, masque par défaut /16.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/6 · Combien de bits emprunter<\/div><p>2ˣ ≥ 10 donne x = 4 (2³ = 8 est trop petit, 2⁴ = 16 convient).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/6 · Nouveau masque<\/div><p>16 + 4 = /20, soit 255.255.240.0.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/6 · Machines par sous-réseau<\/div><p>32 − 20 = 12 bits machine : 2¹² − 2 = 4 094 hôtes.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/6 · Pas entre deux sous-réseaux<\/div><p>256 − 240 = 16 dans le 3ᵉ octet : 172.32.0.0, 172.32.16.0, 172.32.32.0, 172.32.48.0…<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">6/6 · Diffusion du sous-réseau 3<\/div><p>172.32.32.0 = 172.32.0010 0000.0 ; bits machine à 1 : 172.32.0010 1111.1111 = 172.32.47.255.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>n sous-réseaux : 2ˣ ≥ n. Masque = préfixe d&#39;origine + x. Pas = 256 − (valeur du masque dans l&#39;octet concerné).<\/p>\n<\/aside><h3>Application · TD 4, exercices 1 (question 2), 5 et 6<\/h3>\n<section class=\"exo\"><h3>TD 4 · Exercice 1 · Question 2 · Hôte valide avec 11 bits de sous-réseau<\/h3><div class=\"ex\" data-x=\"14\"><div class=\"ex-q\"><p><strong>T4.1.2.<\/strong> Laquelle des adresses suivantes est une adresse IP valide d&#39;un hôte, l&#39;adresse du réseau étant 191.254.0.0 quand on utilise 11 bits pour la création de sous-réseaux ? a) 191.254.0.32 · b) 191.254.0.96 · c) 191.254.0.29 · d) 191.54.1.64<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>191.254.0.0 est de classe B (/16). 11 bits de sous-réseau donnent /27 : 5 bits machine, blocs de 32. Un hôte ne peut pas avoir tous ses bits machine à 0 (adresse du réseau) ni tous à 1 (diffusion).<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Masque /27 : blocs de 32 dans le dernier octet.<br>a) 32 = 00100000 : bits machine 00000 → <b>adresse de sous-réseau<\/b>, pas un hôte.<br>b) 96 = 01100000 : bits machine 00000 → <b>adresse de sous-réseau<\/b>, pas un hôte.<br>c) 29 = 00011101 : bits machine 11101 → ni tout à 0, ni tout à 1 → <b>hôte valide<\/b> (du sous-réseau 191.254.0.0/27).<br>d) 191.<b>54<\/b>.1.64 : le 2ᵉ octet n&#39;est pas 254, ce n&#39;est pas le réseau 191.254.0.0.<br><b>Réponse : c) 191.254.0.29.<\/b><br><br><b>Attention :<\/b> le corrigé manuscrit du TD retient b) 191.254.0.96. Ce n&#39;est pas un hôte : 96 est le début d&#39;un bloc de 32. Certitude : élevée (calcul vérifié par programme). À confirmer avec ton prof, en lui montrant les bits machine 00000.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>TD 4 · Exercice 5 · Entreprise à 10 succursales (172.32.0.0)<\/h3><div class=\"ex\" data-x=\"15\"><div class=\"ex-q\"><p><strong>T4.5.1.<\/strong> De quelle classe d&#39;adressage s&#39;agit-il ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>172 ∈ [128, 191] : <b>classe B<\/b>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"16\"><div class=\"ex-q\"><p><strong>T4.5.2.<\/strong> Donnez et expliquez la valeur du masque de sous-réseau correspondant à ce besoin.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Il faut au moins 10 sous-réseaux : 2ˣ ≥ 10.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>2⁴ = 16 ≥ 10 (2³ = 8 &lt; 10) : on emprunte <b>4 bits<\/b>. Masque = 16 + 4 = <b>/20 = 255.255.240.0<\/b>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"17\"><div class=\"ex-q\"><p><strong>T4.5.3.<\/strong> Combien de machines chaque sous-réseau pourra-t-il comporter, et pourquoi ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Il reste 32 − 20 = 12 bits machine.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>2¹² − 2 = <b>4 094 machines<\/b>. On retire deux adresses : celle du sous-réseau (bits machine à 0) et celle de diffusion (bits machine à 1).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"18\"><div class=\"ex-q\"><p><strong>T4.5.4.<\/strong> Pour chaque sous-réseau : adresse du sous-réseau, première et dernière machine.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Le pas est de 16 dans le 3ᵉ octet.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>SR1 172.32.0.0/20 · 172.32.0.1 · 172.32.15.254<br>SR2 172.32.16.0/20 · 172.32.16.1 · 172.32.31.254<br>SR3 172.32.32.0/20 · 172.32.32.1 · 172.32.47.254<br>SR4 172.32.48.0/20 · 172.32.48.1 · 172.32.63.254<br>SR5 172.32.64.0/20 · 172.32.64.1 · 172.32.79.254<br>SR6 172.32.80.0/20 · 172.32.80.1 · 172.32.95.254<br>SR7 172.32.96.0/20 · 172.32.96.1 · 172.32.111.254<br>SR8 172.32.112.0/20 · 172.32.112.1 · 172.32.127.254<br>SR9 172.32.128.0/20 · 172.32.128.1 · 172.32.143.254<br>SR10 172.32.144.0/20 · 172.32.144.1 · 172.32.159.254<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"19\"><div class=\"ex-q\"><p><strong>T4.5.5.<\/strong> Quelle est l&#39;adresse de diffusion du sous-réseau 3 (expliquez) ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Mets tous les bits machine du sous-réseau 3 à 1.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>SR3 = 172.32.32.0/20 = 172.32.0010 0000.00000000. Bits machine (4 derniers bits du 3ᵉ octet + tout le 4ᵉ) à 1 : 172.32.0010 1111.11111111 = <b>172.32.47.255<\/b>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>TD 4 · Exercice 6 · Société à trois sites (172.32.0.0/20) · corrigé rédigé ici<\/h3><div class=\"ex\" data-x=\"20\"><div class=\"ex-q\"><p><strong>T4.6.1.<\/strong> Selon le schéma (3 sites, chacun avec son routeur R1, R2, R3, reliés deux à deux par des lignes séries), donnez le nombre de sous-réseaux.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Un sous-réseau = un domaine de diffusion = un côté d&#39;un routeur. Compte les réseaux locaux, puis les liaisons entre routeurs.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>3 réseaux locaux (un par site : Switch1, Switch2 + hub, Switch3) + 3 liaisons séries (R1-R2, R1-R3, R2-R3) = <b>6 sous-réseaux<\/b>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"21\"><div class=\"ex-q\"><p><strong>T4.6.2.<\/strong> Donnez la valeur du masque pour ce besoin.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>2ˣ ≥ 6, à partir de /20.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>2³ = 8 ≥ 6 : on emprunte 3 bits : 20 + 3 = <b>/23 = 255.255.254.0<\/b> (510 hôtes par sous-réseau).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"22\"><div class=\"ex-q\"><p><strong>T4.6.3.<\/strong> Donnez le nombre de domaines de collision et le nombre de domaines de diffusion.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Collision : chaque port de switch (et chaque liaison routeur-routeur) en est un ; un hub en partage un avec tout ce qui lui est relié. Diffusion : un routeur sépare les domaines de diffusion.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Diffusion : 6<\/b> (un par sous-réseau).<br><b>Collision : 13<\/b> en lisant le schéma : site 1 = 3 (PC1, imprimante 1, routeur sur Switch1), site 2 = 3 (routeur, Server2, et le segment du hub avec PC2 et imprimante 2), site 3 = 4 (routeur, PC4, PC3, PC5), plus 3 liaisons séries.<br>Certitude : moyenne pour le 13, car il dépend de ce que montre le schéma (nombre de PC du site 3, hub relié à Switch2). Refais le décompte sur ton énoncé.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"23\"><div class=\"ex-q\"><p><strong>T4.6.4.<\/strong> Copiez le schéma et affectez les adresses IP nécessaires.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Un bloc /23 par sous-réseau, en avançant de 2 dans le 3ᵉ octet.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Plan possible (un bloc /23 par sous-réseau) :<br>Site 1 : 172.32.0.0/23 · Site 2 : 172.32.2.0/23 · Site 3 : 172.32.4.0/23<br>R1-R2 : 172.32.6.0/23 · R1-R3 : 172.32.8.0/23 · R2-R3 : 172.32.10.0/23<br>Sur chaque LAN, l&#39;interface Fa0/0 du routeur prend la première adresse (172.32.0.1, 172.32.2.1, 172.32.4.1) ; les PC et imprimantes prennent les suivantes, avec la passerelle par défaut = l&#39;adresse du routeur. Sur chaque liaison série, S2/0 et S3/0 prennent .6.1 et .6.2 (par exemple). Il reste 2 blocs /23 libres (172.32.12.0 et 172.32.14.0).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"24\"><div class=\"ex-q\"><p><strong>T4.6.5.<\/strong> Donnez l&#39;adresse de diffusion de chaque sous-réseau.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Pour un /23, la diffusion est le dernier octet 255 du 2ᵉ des deux blocs de 256.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Site 1 <b>172.32.1.255<\/b> · Site 2 <b>172.32.3.255<\/b> · Site 3 <b>172.32.5.255<\/b> · R1-R2 <b>172.32.7.255<\/b> · R1-R3 <b>172.32.9.255<\/b> · R2-R3 <b>172.32.11.255<\/b>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"25\"><div class=\"ex-q\"><p><strong>T4.6.6.<\/strong> Donnez le nombre total d&#39;adresses IP gaspillées dans les lignes séries.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Une liaison série n&#39;a besoin que de 2 adresses.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Chaque liaison série reçoit un /23 : 510 hôtes possibles pour 2 utilisés = 508 gaspillées. Pour les 3 liaisons : 3 × 508 = <b>1 524 adresses gaspillées<\/b>. (Piste d&#39;amélioration hors cours : un masque /30 pour les liaisons séries, avec 2 hôtes chacune, ne gaspille rien.)<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h3>Application · exercice du cours (diapo 31)<\/h3>\n<section class=\"exo\"><h3>Découper 192.168.20.0/24 en 5 sous-réseaux<\/h3><div class=\"ex\" data-x=\"26\"><div class=\"ex-q\"><p>Donne le masque, puis pour chaque sous-réseau : adresse, première machine, dernière machine, diffusion.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>2ˣ ≥ 5 donne x = 3. 24 + 3 = /27, blocs de 32.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Masque <b>/27 = 255.255.255.224<\/b> (8 sous-réseaux possibles, 30 hôtes chacun).<br>SR1 192.168.20.0 · .1 · .30 · <b>.31<\/b><br>SR2 192.168.20.32 · .33 · .62 · <b>.63<\/b><br>SR3 192.168.20.64 · .65 · .94 · <b>.95<\/b><br>SR4 192.168.20.96 · .97 · .126 · <b>.127<\/b><br>SR5 192.168.20.128 · .129 · .158 · <b>.159<\/b><br>Vérifié par programme, identique à la diapo 32.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Idée 6 · VLSM : un masque adapté à chaque sous-réseau<\/h2>\n<p>Idée : quand les besoins sont différents (126 machines ici, 2 là), des sous-réseaux tous de la même taille gaspillent des adresses. Le <strong>VLSM<\/strong> découpe <strong>le plus grand d&#39;abord<\/strong>, puis redécoupe ce qui reste.<\/p>\n<svg viewBox=\"0 0 560 120\" role=\"img\" aria-label=\"Le bloc 192.168.0.0/24 découpé en VLSM : un /25 de 128 adresses, trois /27 de 32, un /28 de 16 et quatre /30 de 4\" style=\"max-width:100%;height:auto\"><g stroke=\"currentColor\" stroke-width=\"1.2\"><rect x=\"10\" y=\"30\" width=\"270\" height=\"40\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/><rect x=\"280\" y=\"30\" width=\"67.5\" height=\"40\" fill=\"none\"/><rect x=\"347.5\" y=\"30\" width=\"67.5\" height=\"40\" fill=\"none\"/><rect x=\"415\" y=\"30\" width=\"67.5\" height=\"40\" fill=\"none\"/><rect x=\"482.5\" y=\"30\" width=\"33.75\" height=\"40\" fill=\"none\"/><rect x=\"516.25\" y=\"30\" width=\"8.44\" height=\"40\" fill=\"none\"/><rect x=\"524.69\" y=\"30\" width=\"8.44\" height=\"40\" fill=\"none\"/><rect x=\"533.13\" y=\"30\" width=\"8.44\" height=\"40\" fill=\"none\"/><rect x=\"541.56\" y=\"30\" width=\"8.44\" height=\"40\" fill=\"none\"/><\/g><g font-family=\"sans-serif\" font-size=\"12\" fill=\"currentColor\" text-anchor=\"middle\"><text x=\"145\" y=\"55\" fill=\"#D9824F\">SR1 /25 (126)<\/text><text x=\"314\" y=\"55\">SR2 /27<\/text><text x=\"381\" y=\"55\">SR3 /27<\/text><text x=\"449\" y=\"55\">SR4 /27<\/text><text x=\"499\" y=\"92\">SR5<\/text><text x=\"533\" y=\"20\">/30<\/text><text x=\"280\" y=\"110\">.0 → .127 | .128 → .223 | .224 → .239 | .240 → .255<\/text><\/g><\/svg><figure class=\"etapes\" data-i=\"0\"><figcaption>Plan d'adressage VLSM de 192.168.0.0/24 (exercice du cours, diapo 40)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/6 · Trie les besoins<\/div><p>126, 26, 26, 26, 14, 2, 2, 2, 2 machines.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/6 · Taille de chaque bloc<\/div><p>126 → /25 (2⁷ − 2 = 126). 26 → /27 (2⁵ − 2 = 30). 14 → /28 (2⁴ − 2 = 14). 2 → /30 (2² − 2 = 2).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/6 · Place le plus grand<\/div><p>SR1 = 192.168.0.0/25 (de .0 à .127).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/6 · Redécoupe le reste en /27<\/div><p>SR2 = .128/27, SR3 = .160/27, SR4 = .192/27. Il reste .224/27.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/6 · Redécoupe .224/27 en /28<\/div><p>SR5 = .224/28 (de .224 à .239). Il reste .240/28.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">6/6 · Redécoupe .240/28 en /30<\/div><p>SR6 = .240/30, SR7 = .244/30, SR8 = .248/30, SR9 = .252/30. Tout le bloc est utilisé.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>VLSM : trier du plus grand au plus petit, prendre le plus petit bloc où 2^h − 2 ≥ besoin, redécouper ce qui reste. Les liaisons entre deux routeurs : /30.<\/p>\n<\/aside><aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>Dans l&#39;exemple 192.168.50.0 (diapos 36 à 38), les diapos parlent de « 125 », « 60 » et « 29 adresses utilisables » : ce sont les <strong>besoins<\/strong>. Les adresses réellement utilisables sont 126 (/25), 62 (/26) et 30 (/27). Sur la diapo 41, « 2⁴ − 2 = 16 » vaut en fait <strong>14<\/strong>.<\/p>\n<\/aside><section class=\"exo\"><h3>VLSM<\/h3><div class=\"ex\" data-x=\"27\"><div class=\"ex-q\"><p>Dans l&#39;exemple du cours, 192.168.50.0/24 doit fournir 125, 60, 29 et 29 adresses. Donne les 4 sous-réseaux.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>125 → /25, 60 → /26, 29 → /27. Le plus grand d&#39;abord.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>SR1 <b>192.168.50.0/25<\/b> (126 hôtes) · SR2 <b>192.168.50.128/26<\/b> (62) · SR3 <b>192.168.50.192/27<\/b> (30) · SR4 <b>192.168.50.224/27<\/b> (30).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"28\"><div class=\"ex-q\"><p>Quel masque choisir pour une liaison entre deux routeurs, et pourquoi ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Combien d&#39;adresses faut-il sur une liaison point à point ?<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>/30 (255.255.255.252)<\/b> : 2² − 2 = 2 hôtes, exactement les deux interfaces des routeurs. Aucun gaspillage.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Idée 7 · Deux réseaux ne se parlent pas sans routeur<\/h2>\n<p>Idée : deux machines sont dans le même réseau si leur adresse ET masque donne le même résultat. Sinon, il faut un routeur et une passerelle par défaut.<\/p>\n<svg viewBox=\"0 0 560 150\" role=\"img\" aria-label=\"Quatre machines de quatre réseaux différents reliées par un routeur central, une interface par réseau\" style=\"max-width:100%;height:auto\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><circle cx=\"280\" cy=\"75\" r=\"26\" stroke=\"#D9824F\" stroke-width=\"2.5\"/><path d=\"M254 75L170 30M254 75L170 120M306 75L390 30M306 75L390 120\"/><rect x=\"20\" y=\"14\" width=\"150\" height=\"32\" rx=\"5\"/><rect x=\"20\" y=\"104\" width=\"150\" height=\"32\" rx=\"5\"/><rect x=\"390\" y=\"14\" width=\"150\" height=\"32\" rx=\"5\"/><rect x=\"390\" y=\"104\" width=\"150\" height=\"32\" rx=\"5\"/><\/g><g font-family=\"sans-serif\" font-size=\"12.5\" fill=\"currentColor\" text-anchor=\"middle\"><text x=\"280\" y=\"79\" fill=\"#D9824F\">Routeur<\/text><text x=\"95\" y=\"35\">192.168.20.1/24<\/text><text x=\"95\" y=\"125\">192.168.22.4/24<\/text><text x=\"465\" y=\"35\">192.168.16.2/24<\/text><text x=\"465\" y=\"125\">192.168.18.3/24<\/text><\/g><\/svg><figure class=\"etapes\" data-i=\"0\"><figcaption>Pourquoi 192.168.20.1 ne parle pas à 192.168.16.2 (TD 4, exercice 4)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Calcule le réseau de chaque machine<\/div><p>Masque 255.255.255.0 = /24. Les réseaux sont 192.168.20.0, 192.168.16.0, 192.168.22.0 et 192.168.18.0 : quatre réseaux différents.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Regarde ce qui les relie<\/div><p>Seulement des switchs. Un switch travaille dans un seul réseau : il ne passe pas d&#39;un réseau à l&#39;autre.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Cherche un routeur<\/div><p>Il n&#39;y en a pas, donc pas de passerelle par défaut : aucun paquet ne sort de son réseau.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Choisis une solution<\/div><p>Routeur (une interface par réseau), ou même réseau pour tout le monde, ou sur-réseau (CIDR).<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Même réseau : même (adresse ET masque). Réseaux différents : routeur obligatoire, et passerelle par défaut = adresse du routeur dans le réseau de la machine. Masque plus long que le masque par défaut : sous-réseau. Plus court : sur-réseau.<\/p>\n<\/aside><h3>Application · TD 4, exercice 4<\/h3>\n<section class=\"exo\"><h3>TD 4 · Exercice 4 · La maquette à 4 machines<\/h3><div class=\"ex\" data-x=\"29\"><div class=\"ex-q\"><p><strong>T4.4.1.<\/strong> Quatre machines (192.168.20.1, 192.168.16.2, 192.168.22.4, 192.168.18.3, toutes en 255.255.255.0) sont reliées par deux switchs. Pourquoi ne peut-on pas avoir de communications entre elles ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Calcule le réseau de chaque machine avec son masque /24.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Chaque machine appartient à un <b>réseau différent<\/b> (192.168.20.0, 192.168.16.0, 192.168.22.0, 192.168.18.0). Les 4 machines sont reliées par des switchs, qui ne font pas passer d&#39;un réseau à l&#39;autre, et il n&#39;y a <b>ni routeur ni passerelle par défaut<\/b> : aucune communication n&#39;est possible.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"30\"><div class=\"ex-q\"><p><strong>T4.4.2.<\/strong> Proposez des solutions pour résoudre ce problème.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Trois idées : ajouter un équipement de couche 3, changer les adresses, ou changer les masques.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Solution 1 : un routeur<\/b> à la place des switchs, une interface par réseau, avec une adresse libre de chaque réseau (par exemple 192.168.20.254/24, 192.168.16.254/24, 192.168.18.254/24, 192.168.22.254/24), puis configurer cette adresse comme <b>passerelle par défaut<\/b> de chaque machine. (Le scan note .3 et .4 pour deux interfaces : ce sont les adresses des PC, pas celles du routeur.)<br><b>Solution 2 : même réseau<\/b> pour les 4 machines, par exemple 192.168.20.1 à 192.168.20.4, toutes en /24, avec les switchs.<br><b>Solution 3 : un sur-réseau (CIDR)<\/b> : les adresses 192.168.16.x, .18.x, .20.x, .22.x ont en commun les 21 premiers bits (3ᵉ octet : 00010000, 00010010, 00010100, 00010110, donc 00010 en commun) : on les met dans 192.168.16.0/21 en changeant le masque en 255.255.248.0.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"31\"><div class=\"ex-q\"><p><strong>T4.4.3.<\/strong> Pourquoi n&#39;a-t-on pas choisi l&#39;une des deux adresses 192.168.16.0 et 192.168.16.255 comme adresse machine ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Le masque est /24 : regarde les bits machine du dernier octet.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Dans 192.168.16.0/24, <b>192.168.16.0<\/b> a tous ses bits machine à 0 : c&#39;est l&#39;<b>adresse du réseau<\/b>. <b>192.168.16.255<\/b> les a tous à 1 : c&#39;est l&#39;<b>adresse de diffusion<\/b>. Aucune des deux ne peut être attribuée à une machine.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Idée 8 · IPv6 : 128 bits, une écriture plus courte<\/h2>\n<p>Idée : IPv6 règle le manque d&#39;adresses d&#39;IPv4. Une adresse fait 128 bits, écrits en 8 groupes de 4 chiffres hexadécimaux.<\/p>\n<svg viewBox=\"0 0 560 100\" role=\"img\" aria-label=\"Adresse IPv6 : 8 groupes de 16 bits, soit 128 bits\" style=\"max-width:100%;height:auto\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><rect x=\"10\" y=\"28\" width=\"62\" height=\"40\" rx=\"4\"/><rect x=\"76\" y=\"28\" width=\"62\" height=\"40\" rx=\"4\"/><rect x=\"142\" y=\"28\" width=\"62\" height=\"40\" rx=\"4\"/><rect x=\"208\" y=\"28\" width=\"62\" height=\"40\" rx=\"4\"/><rect x=\"274\" y=\"28\" width=\"62\" height=\"40\" rx=\"4\" stroke=\"#D9824F\" stroke-width=\"2.5\"/><rect x=\"340\" y=\"28\" width=\"62\" height=\"40\" rx=\"4\" stroke=\"#D9824F\" stroke-width=\"2.5\"/><rect x=\"406\" y=\"28\" width=\"62\" height=\"40\" rx=\"4\"/><rect x=\"472\" y=\"28\" width=\"62\" height=\"40\" rx=\"4\"/><\/g><g font-family=\"monospace\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\"><text x=\"41\" y=\"53\">2001<\/text><text x=\"107\" y=\"53\">0082<\/text><text x=\"173\" y=\"53\">0007<\/text><text x=\"239\" y=\"53\">0071<\/text><text x=\"305\" y=\"53\" fill=\"#D9824F\">0000<\/text><text x=\"371\" y=\"53\" fill=\"#D9824F\">0000<\/text><text x=\"437\" y=\"53\">00fe<\/text><text x=\"503\" y=\"53\">00b1<\/text><text x=\"338\" y=\"90\" font-family=\"sans-serif\" fill=\"#D9824F\" font-size=\"12\">groupes de zéros → ::<\/text><\/g><\/svg><p>Règles d&#39;écriture : on peut supprimer les zéros de tête de chaque groupe (0082 → 82), et remplacer <strong>une seule fois<\/strong> une suite de groupes nuls par <code>::<\/code>.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Retrouver la forme complète de 2001:82:7:71::fe:b1<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Compte les groupes écrits<\/div><p>2001, 82, 7, 71, fe, b1 : 6 groupes. Une adresse en a 8.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Complète avec des groupes nuls<\/div><p>Il manque 8 − 6 = 2 groupes : le double deux-points vaut 0000:0000.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Complète chaque groupe à 4 chiffres<\/div><p>82 → 0082, 7 → 0007, 71 → 0071, fe → 00fe, b1 → 00b1.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Résultat<\/div><p>2001:0082:0007:0071:0000:0000:00fe:00b1.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><figure class=\"etapes\" data-i=\"0\"><figcaption>Adresse lien local (link-local) à partir d'une adresse MAC : 02:00:4c:4f:4f:50<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Coupe la MAC en deux<\/div><p>02:00:4c | 4f:4f:50.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · Insère ff:fe au milieu<\/div><p>02:00:4c:ff:fe:4f:4f:50 (c&#39;est l&#39;identifiant EUI-64).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · Inverse le 7ᵉ bit du 1ᵉʳ octet<\/div><p>02 = 00000010, le bit « universel/local » passe de 1 à 0 : 00.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · Écris l&#39;identifiant<\/div><p>00:00:4c:ff:fe:4f:4f:50, soit 0000:4cff:fe4f:4f50.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · Ajoute le préfixe<\/div><p>Devant l&#39;identifiant, on met fe80:: ce qui donne fe80::4cff:fe4f:4f50.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h3>Application · TD 4, exercice 7<\/h3>\n<section class=\"exo\"><h3>TD 4 · Exercice 7 · IPv6 et multicast · corrigé rédigé ici<\/h3><div class=\"ex\" data-x=\"32\"><div class=\"ex-q\"><p><strong>T4.7.1.<\/strong> Citez les avantages d&#39;utiliser l&#39;adressage IPv6.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Pense à la taille, à la configuration, à l&#39;en-tête et à la sécurité.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Espace d&#39;adressage immense (2¹²⁸ adresses) qui supprime le manque d&#39;adresses et le besoin de NAT · autoconfiguration des machines (adresse lien local, SLAAC) · en-tête simplifié, donc routage plus efficace · plus de diffusion : remplacée par le multicast et l&#39;anycast · IPsec prévu dès la conception.<br>(Rédigé ici à partir de connaissances standard, certitude élevée ; la liste exacte du cours du prof peut différer.)<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"33\"><div class=\"ex-q\"><p><strong>T4.7.2.<\/strong> Donnez la forme complète des adresses : a) ::1 · b) 2001:82:7:71::fe:b1 · c) FF02::2 · d) 2001:ac3::3030:510:0:4<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Compte les groupes écrits : « :: » remplace les groupes manquants pour arriver à 8. Complète chaque groupe à 4 chiffres.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>a) <b>0000:0000:0000:0000:0000:0000:0000:0001<\/b><br>b) <b>2001:0082:0007:0071:0000:0000:00fe:00b1<\/b><br>c) <b>ff02:0000:0000:0000:0000:0000:0000:0002<\/b><br>d) <b>2001:0ac3:0000:0000:3030:0510:0000:0004<\/b> (6 groupes écrits : « :: » remplace 2 groupes). Vérifié par programme.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"34\"><div class=\"ex-q\"><p><strong>T4.7.3.<\/strong> Calculez l&#39;adresse lien local (link-local) de la machine d&#39;adresse MAC 02:00:4c:4f:4f:50.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>EUI-64 : insère ff:fe au milieu de la MAC, inverse le 7ᵉ bit du premier octet, ajoute le préfixe fe80::.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>02:00:4c : ff:fe : 4f:4f:50 → 02:00:4c:ff:fe:4f:4f:50. Le premier octet 02 (00000010) devient 00 une fois le bit U/L inversé. Adresse : <b>fe80::4cff:fe4f:4f50<\/b> (forme complète fe80:0000:0000:0000:0000:4cff:fe4f:4f50). Vérifié par programme.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"35\"><div class=\"ex-q\"><p><strong>T4.7.4.<\/strong> Calculez l&#39;adresse MAC multicast équivalente à l&#39;adresse IP multicast 224.212.110.199.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>MAC multicast IPv4 = 01:00:5e suivi des 23 bits de poids faible de l&#39;adresse IP (donc le 1ᵉʳ bit du 2ᵉ octet est mis à 0).<\/p>\n<\/div><div class=\"ex-c\" hidden><p>212 = 11010100 → on garde 7 bits : 1010100 = 0x54. 110 = 0x6e. 199 = 0xc7. Adresse MAC : <b>01:00:5e:54:6e:c7<\/b>. Vérifié par programme.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Idée 9 · En-tête IPv6 et types d&#39;adresses<\/h2>\n<p>Idée : IPv6 garde l&#39;essentiel de l&#39;en-tête IPv4, renomme certains champs et en <strong>supprime<\/strong> d&#39;autres pour aller plus vite. Le broadcast disparaît.<\/p>\n<table>\n<thead>\n<tr>\n<th>IPv4<\/th>\n<th>IPv6<\/th>\n<th>Ce qui change<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Version<\/td>\n<td>Version<\/td>\n<td>6 au lieu de 4<\/td>\n<\/tr>\n<tr>\n<td>Longueur d&#39;en-tête (IHL)<\/td>\n<td>supprimé<\/td>\n<td>l&#39;en-tête IPv6 fait toujours 40 octets<\/td>\n<\/tr>\n<tr>\n<td>Type de service<\/td>\n<td>Classe de trafic<\/td>\n<td>même rôle (priorité)<\/td>\n<\/tr>\n<tr>\n<td>aucun<\/td>\n<td>Étiquette de flux (flow label, 20 bits)<\/td>\n<td>nouveau : repère un flux pour la qualité de service<\/td>\n<\/tr>\n<tr>\n<td>Longueur totale<\/td>\n<td>Longueur des données (payload length)<\/td>\n<td>ne compte plus l&#39;en-tête<\/td>\n<\/tr>\n<tr>\n<td>Identification, drapeaux, décalage<\/td>\n<td>supprimés<\/td>\n<td>les routeurs ne fragmentent plus ; seule la source le fait (en-tête d&#39;extension)<\/td>\n<\/tr>\n<tr>\n<td>TTL<\/td>\n<td>Limite de sauts (hop limit)<\/td>\n<td>même rôle, nom plus juste<\/td>\n<\/tr>\n<tr>\n<td>Protocole<\/td>\n<td>En-tête suivant (next header)<\/td>\n<td>même rôle<\/td>\n<\/tr>\n<tr>\n<td>Somme de contrôle d&#39;en-tête<\/td>\n<td>supprimée<\/td>\n<td>déjà faite par les couches 2 et 4<\/td>\n<\/tr>\n<tr>\n<td>Adresses (32 bits)<\/td>\n<td>Adresses (128 bits)<\/td>\n<td>4 fois plus longues<\/td>\n<\/tr>\n<\/tbody><\/table>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Les diapos 44 à 54 sur l&#39;en-tête sont des images. Ce tableau est rédigé d&#39;après la norme IPv6 (RFC 8200), certitude élevée ; compare-le avec le résumé de la diapo 54.<\/p>\n<\/aside><table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Rôle<\/th>\n<th>Exemple<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Unicast global<\/td>\n<td>adresse publique d&#39;une interface<\/td>\n<td>commence par 2 ou 3 (2000::/3)<\/td>\n<\/tr>\n<tr>\n<td>Unicast lien local<\/td>\n<td>ne sort pas du lien<\/td>\n<td>FE80::/10<\/td>\n<\/tr>\n<tr>\n<td>Multicast<\/td>\n<td>un groupe : remplace le broadcast<\/td>\n<td>FF00::/8, ex. FF02::1 (tous les nœuds du lien)<\/td>\n<\/tr>\n<tr>\n<td>Anycast<\/td>\n<td>même adresse sur plusieurs machines, la plus proche répond<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Une adresse <strong>unicast globale<\/strong> se lit en trois morceaux : <strong>préfixe de routage global<\/strong> (donné par le FAI, souvent 48 bits), <strong>ID de sous-réseau<\/strong> (16 bits, soit 65 536 sous-réseaux), <strong>ID d&#39;interface<\/strong> (64 bits, la « partie hôte »). Une même interface peut avoir plusieurs adresses IPv6 (au moins une lien local, plus une ou des globales).<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Abréger FF02:0000:0000:0000:0000:0001:FF00:0001 (diapo 59)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · Enlève les zéros de tête<\/div><p>FF02:0:0:0:0:1:FF00:1.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · Repère la plus longue suite de groupes nuls<\/div><p>les 4 groupes après FF02.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · Remplace-la une seule fois par<\/div><p>:: FF02::1:FF00:1.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Utiliser « :: » deux fois. 2001::14::95 est <strong>interdit<\/strong> : on ne saurait pas combien de zéros mettre de chaque côté (diapo 59).<\/p>\n<\/aside><section class=\"exo\"><h3>IPv6 : écriture et types<\/h3><div class=\"ex\" data-x=\"36\"><div class=\"ex-q\"><p>Lesquelles sont des adresses IPv6 valides ? a) 2001.1111.2222.3333.4444.5555.6666.7777 · b) 2001:AAAA:BBBB:CCCC:DDDD:EEEE:FFFF:
