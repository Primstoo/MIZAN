x-h\" hidden><p>Découpe : 8 octets, puis 6, puis 6, puis 2. Les 4 derniers octets sont la fin de la trame.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>a)<\/b> Le préambule (7 octets aa = 10101010, synchronisation) suivi du SFD (ab = 10101011, début de trame).<br><b>b)<\/b> Destinataire : <b>00:40:07:03:04:2b<\/b>. Émetteur : <b>02:60:8c:e8:02:91<\/b>.<br><b>c)<\/b> EtherType <b>0800 = IPv4<\/b>. Dans l&#39;en-tête IPv4 (45 = version 4, 20 octets), le champ Protocole vaut 06 : c&#39;est du <b>TCP<\/b> (IP 147.210.94.99 vers 147.210.94.92, TTL 60).<br><b>d)<\/b> <b>9a b2 5c 48 = FCS<\/b> (séquence de contrôle, CRC-32). Juste avant, 02 80 est du bourrage : l&#39;IP annonce 44 octets (20 d&#39;IP + 24 de TCP), alors que les données d&#39;une trame doivent faire au moins 46.<br>Contrôle : 8 + 6 + 6 + 2 + 46 + 4 = 72 octets, soit une trame de 64 octets plus le préambule et le SFD. J&#39;ai décodé les octets par un script ; je n&#39;ai pas recalculé le CRC (l&#39;exemple du TD n&#39;a pas forcément un FCS valide).<br>Le corrigé manuscrit ne mentionne pas le bourrage.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"40\"><div class=\"ex-q\"><p><strong>T2.2.2.<\/strong> Décodez les informations sur la connexion et les numéros de séquence du segment TCP suivant, donné en hexadécimal : 00 15 0F 87 9C CB 7E 01 27 E3 EA 01 50 12 10 00 DF 3D 00 00<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>20 octets : ports (2 + 2), Seq (4), ACK (4), longueur et drapeaux (2), fenêtre (2), checksum (2), urgent (2).<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Port source<\/b> 00 15 = <b>21<\/b> (FTP, contrôle) · <b>port destination<\/b> 0F 87 = <b>3975<\/b> (port éphémère du client).<br><b>Seq<\/b> 9C CB 7E 01 = <b>2 630 581 761<\/b> (numéro du premier octet envoyé, ici le numéro initial du serveur).<br><b>ACK<\/b> 27 E3 EA 01 = <b>669 248 001<\/b> (4 octets : le corrigé manuscrit n&#39;en note que 2).<br><b>Longueur d&#39;en-tête<\/b> : 5 × 4 = 20 octets, donc sans option.<br><b>Drapeaux<\/b> 0x12 = 0x10 (ACK) + 0x02 (SYN) = <b>SYN + ACK<\/b>.<br><b>Fenêtre<\/b> 0x1000 = <b>4096<\/b> · checksum DF 3D · urgent 00 00.<br>Conclusion : c&#39;est la <b>2e étape de la poignée de main<\/b> : le serveur FTP accepte la connexion. ACK = numéro initial du client + 1, donc le client avait choisi 669 248 000.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Exercice 3 · Numéros de séquence et ACK<\/h3><div class=\"ex\" data-x=\"41\"><div class=\"ex-q\"><p><strong>T2.3.1.<\/strong> Un client envoie des données via TCP. Sa MSS est de 1000 octets. Il envoie successivement 3 segments de 1000, 1000 et 500 octets (sans options TCP). Le Seq initial du premier octet envoyé est 2001. Pour chaque segment, donnez : le Seq dans l&#39;en-tête, la longueur utile, l&#39;ACK attendu du serveur si tout est reçu en ordre, et l&#39;ACK envoyé par le client après réception d&#39;un ACK cumulatif.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Seq suivant = Seq + longueur utile. ACK = prochain octet attendu.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Segment 1 : Seq <b>2001<\/b>, utile <b>1000<\/b> (octets 2001 à 3000), ACK attendu <b>3001<\/b>.<br>Segment 2 : Seq <b>3001<\/b>, utile <b>1000<\/b> (3001 à 4000), ACK attendu <b>4001<\/b>.<br>Segment 3 : Seq <b>4001<\/b>, utile <b>500<\/b> (4001 à 4500), ACK attendu <b>4501<\/b>.<br><b>ACK cumulatif<\/b> : le serveur peut n&#39;envoyer qu&#39;un seul accusé final, <b>ACK = 4501<\/b>, après avoir reçu le segment 3 : il confirme les 2500 octets d&#39;un coup (2001 à 4500).<br>Règle : ACK = dernier octet reçu en ordre + 1.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Exercice 4 · Fenêtres cwnd et rwnd<\/h3><div class=\"ex\" data-x=\"42\"><div class=\"ex-q\"><p><strong>T2.4.1.<\/strong> Un émetteur TCP a cwnd = 3000 octets et rwnd = 2500 octets. Sa MSS = 1000. Combien d&#39;octets peut-il envoyer immédiatement ? Combien de segments ? Que se passe-t-il si rwnd tombe à 1200 après l&#39;envoi d&#39;un segment ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Fenêtre effective = le plus petit des deux. Puis retranche ce qui est déjà parti.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>W = min(cwnd, rwnd) = min(3000, 2500) = 2500 octets<\/b> à envoyer sans attendre d&#39;ACK.<br>Segments : 2500 = 1000 + 1000 + 500, soit <b>3 segments<\/b> (2 de 1000 octets et 1 de 500).<br><b>rwnd = 1200<\/b> : W = min(3000, 1200) = <b>1200 octets<\/b>. L&#39;émetteur doit respecter cette nouvelle limite : il ne peut pas avoir plus de 1200 octets non acquittés. Après un segment de 1000 octets, il peut encore envoyer 1200 − 1000 = <b>200 octets<\/b> (un segment partiel), puis il attend un ACK.<br>cwnd = contrôle de <b>congestion<\/b> (côté émetteur) ; rwnd = contrôle de <b>flux<\/b> (côté récepteur).<br>Note : TCP peut préférer attendre d&#39;avoir de quoi remplir un segment complet ; le TD compte le segment partiel.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Exercice 5 · Lire un en-tête TCP, pertes et fenêtre<\/h3><div class=\"ex\" data-x=\"43\"><div class=\"ex-q\"><p><strong>T2.5.1.<\/strong> Trame de 100 octets, n° d&#39;ordre de début = 1. En-tête TCP : port source 41152, port destination 80, SEQ 101, fenêtre 1000 octets. 1) Que peut-on en dire ? a) Quel protocole d&#39;application a envoyé le message ? b) Quel type de données serait attaché à cet en-tête ? c) C&#39;est l&#39;en-tête de la trame n° combien ? d) Quand le récepteur enverra-t-il un accusé de réception, et quel sera son numéro ACK ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Port 80 = quel protocole ? La trame 1 porte les octets 1 à 100.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>a)<\/b> Le port de destination 80 indique <b>HTTP<\/b> (le port source 41152 est le port éphémère du client).<br><b>b)<\/b> Une <b>requête HTTP<\/b> adressée à un serveur Web (par exemple un GET qui demande une page HTML).<br><b>c)<\/b> La <b>trame n° 2<\/b> : la trame 1 porte les octets 1 à 100, donc la trame 2 commence à SEQ = 101.<br><b>d)<\/b> La fenêtre est de 1000 octets : l&#39;émetteur envoie 10 trames de 100 octets avant d&#39;attendre. Le récepteur accuse réception après ces <b>10 trames<\/b> (octets 1 à 1000) : <b>ACK = 1001<\/b>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"44\"><div class=\"ex-q\"><p><strong>T2.5.2.<\/strong> Même situation. e) Schématisez l&#39;en-tête de la dernière trame avant le premier accusé de réception. f) Schématisez l&#39;accusé de réception.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>La dernière trame avant l&#39;ACK est la 10e : quel est son SEQ ?<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>e) Trame n° 10<\/b> : port source <b>41152<\/b> · port destination <b>80<\/b> · SEQ <b>901<\/b> · ACK — · longueur — · réservé — · indicateur — · fenêtre <b>1000<\/b>.<br><b>f) Accusé de réception<\/b> : port source <b>80<\/b> · port destination <b>41152<\/b> (les ports s&#39;inversent) · SEQ <b>1<\/b> (le récepteur n&#39;envoie pas de données) · ACK <b>1001<\/b> · fenêtre <b>1000<\/b>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"45\"><div class=\"ex-q\"><p><strong>T2.5.3.<\/strong> Si, pendant la transmission, les trames sont perdues à partir du n° 501 : a) Que fait le récepteur ? b) Que fait l&#39;émetteur ? c) À quel niveau de couche agissent-ils ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Le récepteur n&#39;acquitte que ce qu&#39;il a reçu dans l&#39;ordre.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>a)<\/b> Le récepteur envoie un accusé avec <b>ACK = 501<\/b> : il confirme les octets jusqu&#39;à 500 et redemande le 501.<br><b>b)<\/b> L&#39;émetteur <b>retransmet à partir de SEQ = 501<\/b>, soit après expiration de son délai d&#39;attente, soit après plusieurs ACK identiques.<br><b>c)<\/b> À la <b>couche transport<\/b> (TCP assure la fiabilité).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"46\"><div class=\"ex-q\"><p><strong>T2.5.4.<\/strong> Suite à cette perte, le récepteur décide de réduire la fenêtre à 500. a) Schématisez la trame envoyée par le récepteur. b) Quelle sera la prochaine trame envoyée par le récepteur ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>a) l&#39;ACK de la perte, avec la nouvelle fenêtre. b) Une fois les octets 501 à 1000 retransmis, quel est le nouvel ACK ?<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>a)<\/b> Port source <b>80<\/b> · port destination <b>41152<\/b> · SEQ <b>1<\/b> · ACK <b>501<\/b> · fenêtre <b>500<\/b>.<br><b>b)<\/b> La fenêtre de 500 octets permet de retransmettre les octets 501 à 1000 (5 trames de 100). Le récepteur acquitte alors : port source <b>80<\/b> · port destination <b>41152<\/b> · SEQ <b>1<\/b> · ACK <b>1001<\/b> · fenêtre <b>500<\/b>.<br>⚠ Le corrigé manuscrit met SEQ = 2 sur cette dernière trame. Un ACK pur ne consomme pas de numéro de séquence, donc SEQ reste 1 d&#39;après les règles de TCP (certitude moyenne : vérifie avec le prof ce qu&#39;il note).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Exercice 6 · Domaines de collision et de diffusion<\/h3><div class=\"ex\" data-x=\"47\"><div class=\"ex-q\"><p><strong>T2.6.1.<\/strong> D&#39;après la figure du TD (deux équipements de chaque type X, Y et Z, 10 PC, 15 câbles), complétez le tableau : pour chaque combinaison de X, Y, Z (Hub, Switch, Routeur), le nombre de domaines de collision et de diffusion. Combinaisons : (X, Y, Z) = (Hub, Switch, Hub) ; (Switch, Hub, Routeur) ; (Routeur, Switch, Switch) ; (Routeur, Routeur, Switch).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Compte les câbles (15). Un hub fond tous ses câbles en un seul domaine de collision. Seul un routeur coupe la diffusion.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>(Hub, Switch, Hub)<\/b> : <b>5<\/b> domaines de collision · <b>1<\/b> de diffusion.<br><b>(Switch, Hub, Routeur)<\/b> : <b>11<\/b> · <b>6<\/b>.<br><b>(Routeur, Switch, Switch)<\/b> : <b>15<\/b> · <b>6<\/b>.<br><b>(Routeur, Routeur, Switch)<\/b> : <b>15<\/b> · <b>10<\/b>.<br>Méthode : la figure a 15 câbles (5 entre équipements, 10 vers les PC). Sans hub, chaque câble est un domaine de collision (15). Un hub fond ses câbles : avec Hub-Switch-Hub, les hubs X et Z regroupent leurs câbles voisins, d&#39;où 5. Pour la diffusion, hubs et switchs relient leurs câbles dans un même domaine ; chaque interface de routeur en ouvre un de plus.<br>⚠ Le corrigé manuscrit donne 12 pour la dernière case de diffusion. J&#39;ai compté 10 à la main puis vérifié par un programme (graphe de la figure) : les trois autres lignes concordent avec le manuscrit, pas celle-là. Certitude : élevée pour 10 avec cette figure ; vérifie ce que le prof note.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Exercice 7 · ARP, ICMP, ping et traceroute (corrigé rédigé ici, absent du document)<\/h3><div class=\"ex\" data-x=\"48\"><div class=\"ex-q\"><p><strong>T2.7.1.<\/strong> Sur un réseau Ethernet 192.168.10.0/24, l&#39;hôte A veut envoyer à l&#39;IP 192.168.10.200. Il n&#39;a pas l&#39;adresse MAC correspondante. Que se passe-t-il ? Dans quel domaine se propage la requête ARP ? Le routeur connecté au même switch reçoit-il cette ARP ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>192.168.10.200 est-elle dans le même réseau que A ? Qu&#39;utilise-t-on comme MAC de destination pour une diffusion ?<\/p>\n<\/div><div class=\"ex-c\" hidden><p>192.168.10.200 appartient au même réseau /24 : A ne passe pas par une passerelle, il doit connaître la MAC de cette IP. Il diffuse une <b>requête ARP<\/b> (« qui a 192.168.10.200 ? ») dans une trame de MAC destination <b>FF:FF:FF:FF:FF:FF<\/b>. La machine qui porte cette IP répond directement à A avec sa MAC (réponse unicast) ; A la range dans sa table ARP, puis envoie ses données.<br>La requête se propage dans le <b>domaine de diffusion<\/b> : tout le réseau local, donc tous les ports du switch.<br><b>Oui<\/b>, le routeur branché sur le même switch reçoit la requête, car il est dans le même domaine de diffusion. Mais il <b>ne la retransmet pas<\/b> vers ses autres réseaux : la diffusion s&#39;arrête au routeur.<br>Si personne ne répond, l&#39;ARP échoue et l&#39;envoi aussi.<br>(Corrigé rédigé ici : le document du TD n&#39;a pas l&#39;exercice 7. Certitude élevée, c&#39;est du cours standard.)<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"49\"><div class=\"ex-q\"><p><strong>T2.7.2.<\/strong> Expliquez à quoi sert le protocole ICMP dans une communication IP. Indiquez si ICMP transporte des données utilisateur (comme TCP/UDP) ou non.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Pense aux messages d&#39;erreur et aux outils de diagnostic.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>ICMP (Internet Control Message Protocol) est le protocole de <b>contrôle et de signalisation d&#39;erreurs<\/b> d&#39;IP : il signale qu&#39;un paquet n&#39;a pas pu être livré (destination inaccessible, TTL expiré), et permet de tester la joignabilité (ping) et d&#39;explorer un chemin (traceroute).<br><b>Non, il ne transporte pas de données utilisateur.<\/b> TCP et UDP transportent les données des applications ; ICMP ne transporte que des messages de contrôle (type, code, checksum), encapsulés directement dans IP (champ Protocole = 1).<br>(Corrigé rédigé ici, certitude élevée.)<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"50\"><div class=\"ex-q\"><p><strong>T2.7.3.<\/strong> Un administrateur exécute : ping 192.168.1.10. Expliquez les messages ICMP échangés, leur type et leur code, et ce que cela signifie si l&#39;hôte répond ou non.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Deux messages : une requête et une réponse. Quels types ?<\/p>\n<\/div><div class=\"ex-c\" hidden><p>L&#39;émetteur envoie un <b>Echo Request<\/b> : <b>type 8, code 0<\/b>. Si l&#39;hôte est joignable, il répond par un <b>Echo Reply<\/b> : <b>type 0, code 0<\/b>.<br><b>Réponse reçue<\/b> : l&#39;hôte est joignable et sa pile IP fonctionne, le chemin aller-retour existe (le temps affiché est le RTT).<br><b>Pas de réponse<\/b> (délai dépassé) : hôte éteint ou injoignable, route manquante, perte de paquets, ou ICMP bloqué par un pare-feu. Un routeur peut aussi répondre par <b>Destination Unreachable<\/b> (type 3) pour dire qu&#39;il n&#39;a pas de route.<br>(Corrigé rédigé ici, certitude élevée.)<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"51\"><div class=\"ex-q\"><p><strong>T2.7.4.<\/strong> Lorsqu&#39;un routeur reçoit un paquet IP vers une destination inconnue, il renvoie un message ICMP à l&#39;émetteur. a) Quel type de message ICMP est envoyé ? b) Que contient ce message ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Un seul mot en anglais pour le type : destination …<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>a)<\/b> Un message <b>Destination Unreachable<\/b> (<b>type 3<\/b>), avec un code qui précise la cause (0 = réseau inaccessible, 1 = hôte inaccessible, 3 = port inaccessible). Le routeur détruit le paquet.<br><b>b)<\/b> Il contient le type, le code et le checksum ICMP, puis <b>l&#39;en-tête IP du paquet qui a échoué et les 8 premiers octets de ses données<\/b> (de quoi retrouver les ports TCP/UDP), pour que l&#39;émetteur sache quelle communication a échoué.<br>(Corrigé rédigé ici, certitude élevée.)<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"52\"><div class=\"ex-q\"><p><strong>T2.7.5.<\/strong> On exécute traceroute <a href=\"http://www.google.com\">www.google.com<\/a> et on obtient : 1) 192.168.1.1  1.123 / 1.034 / 1.110 ms · 2) 10.0.0.1  10.234 / 9.987 / 10.012 ms · 3) * * * · 4) 172.16.5.1  25.234 / 25.876 / 25.540 ms · 5) 8.8.8.8  30.123 / 30.010 / 30.222 ms. a) Rôle de traceroute ? b) Que représentent les trois colonnes de temps ? c) Que signifient les étoiles ? d) Quel est le temps total aller-retour approximatif jusqu&#39;à la destination ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Pense au champ TTL, qui baisse de 1 à chaque routeur.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>a)<\/b> Il <b>découvre la route<\/b> : il envoie des paquets avec un TTL de 1, 2, 3… Le routeur qui fait tomber le TTL à 0 détruit le paquet et renvoie un message ICMP <b>Time Exceeded<\/b> (type 11) : l&#39;émetteur apprend ainsi l&#39;adresse de chaque saut. Le dernier saut est la destination, qui répond directement.<br><b>b)<\/b> Les <b>temps aller-retour (RTT)<\/b> de 3 sondes envoyées vers ce saut, en millisecondes. Ce ne sont pas des temps cumulés d&#39;un saut au suivant : chacun mesure le trajet complet jusqu&#39;à ce routeur et retour.<br><b>c)<\/b> <b>* * *<\/b> : aucune réponse avant la fin du délai. Ce routeur ne renvoie pas d&#39;ICMP (filtre ou limitation) ou les paquets ont été perdus. La route n&#39;est pas coupée, puisque les sauts 4 et 5 répondent.<br><b>d)<\/b> Environ <b>30 ms<\/b> : la moyenne des trois mesures du dernier saut (8.8.8.8) vaut (30,123 + 30,010 + 30,222) / 3 ≈ 30,12 ms.<br>(Corrigé rédigé ici, certitude élevée.)<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Le <strong>TD 3<\/strong> (délimitation, parité, CRC, Hamming) est désormais dans le chapitre « Couche liaison et contrôle d&#39;erreurs », sous chaque partie du cours. Le <strong>TD 4<\/strong> (adressage IP, sous-réseaux, IPv6) est dans le chapitre « Adressage IP ».<\/p>\n<\/aside>","ex":[{"n":"n21","rep":null,"tol":null},{"n":"n21","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n28","rep":null,"tol":null},{"n":"n9","rep":null,"tol":null},{"n":"n28","rep":null,"tol":null},{"n":"n28","rep":null,"tol":null},{"n":"n23","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n26","rep":null,"tol":null},{"n":"n22","rep":null,"tol":null},{"n":"n24","rep":null,"tol":null},{"n":"n15","rep":null,"tol":null},{"n":"n7","rep":null,"tol":null},{"n":"n10","rep":null,"tol":null},{"n":"n8","rep":null,"tol":null},{"n":"n13","rep":null,"tol":null},{"n":"n13","rep":null,"tol":null},{"n":"n13","rep":null,"tol":null},{"n":"n10","rep":null,"tol":null},{"n":"n27","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n13","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n22","rep":null,"tol":null},{"n":"n24","rep":null,"tol":null},{"n":"n26","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n5","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n8","rep":null,"tol":null},{"n":"n41","rep":null,"tol":null},{"n":"n39","rep":null,"tol":null},{"n":"n42","rep":null,"tol":null},{"n":"n42","rep":null,"tol":null},{"n":"n42","rep":null,"tol":null},{"n":"n39","rep":null,"tol":null},{"n":"n42","rep":null,"tol":null},{"n":"n42","rep":null,"tol":null},{"n":"n43","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null}],"qcm":[]},{"id":"tp1","t":"TP 1 · ping, tracert, DNS, HTTP (Wireshark)","seance":"Travaux dirigés et pratiques","imp":4,"html":"<h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Refais les commandes toi-même.<\/strong> Lance ping, tracert et une capture Wireshark sur ton PC en lisant : une capture qu&#39;on a faite se retient, une capture qu&#39;on a lue s&#39;oublie.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Regarder une capture sans chercher une couche précise. Demande-toi à chaque ligne : quel protocole, quelle couche, quelles adresses ?<\/p>\n<\/aside><h2>Le TP<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Cherche d&#39;abord seul, ouvre l&#39;indice si tu bloques, puis compare avec le corrigé et note-toi honnêtement : ta réponse compte dans la maîtrise de la notion.<\/p>\n<\/aside><section class=\"exo\"><h3>VII.2-3 · Commande ping (capture : ping -n 10 <a href=\"http://www.google.fr\">www.google.fr<\/a>)<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p><strong>7a1.<\/strong> a1) Quels sont les protocoles indiqués dans la colonne Protocol ? (Les paquets ICMP sont-ils précédés de DNS ?)<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Colonne « Protocol » de la liste. Filtre utile : icmp || dns<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Tu dois voir surtout <b>DNS<\/b> puis <b>ICMP<\/b>. Avant de pinguer, le PC demande l&#39;adresse IP de <a href=\"http://www.google.fr\">www.google.fr<\/a> au DNS (requête puis réponse), et c&#39;est seulement ensuite qu&#39;il envoie les pings. D&#39;autres protocoles de fond peuvent apparaître (ARP, TLS, TCP, UDP, QUIC, MDNS, SSDP) : c&#39;est le trafic normal de ta machine.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p><strong>7a2.<\/strong> a2) Relever l&#39;adresse IP renvoyée avec la réponse DNS.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Filtre : dns.flags.response == 1. Dans le détail : Domain Name System (response) → Answers → <a href=\"http://www.google.fr\">www.google.fr<\/a>: type A, addr …<\/p>\n<\/div><div class=\"ex-c\" hidden><p>C&#39;est l&#39;enregistrement de <b>type A<\/b> dans « Answers » (une adresse IPv4 de Google, du type 142.250.x.x ou 216.58.x.x). Vérification : c&#39;est la même que celle que la console affiche entre crochets [ ] au début du ping.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p><strong>7b1.<\/strong> b1) Premier Echo Request : adresse IP destination ? Valeur du champ Protocol Type ? Valeur du champ Time To Live ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Filtre : icmp.type == 8, premier paquet. Développe « Internet Protocol Version 4 ».<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Destination<\/b> = l&#39;IP de Google relevée en a2.<br><b>Protocol<\/b> = <b>1 (ICMP)<\/b> : c&#39;est ce champ de l&#39;en-tête IP qui dit que la charge est de l&#39;ICMP (6 = TCP, 17 = UDP).<br><b>TTL = 128<\/b> si tu es sous Windows (64 sous Linux ou macOS) : c&#39;est la valeur de départ choisie par ton système.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p><strong>7b2.<\/strong> b2) Type de message ICMP ? Identificateur ? Numéro de séquence ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Développe « Internet Control Message Protocol ».<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Type 8 (Echo request), code 0<\/b>.<br><b>Identifier<\/b> : un numéro fixe pour toute la commande ping (sous Windows, souvent 0x0001). Wireshark l&#39;affiche en BE et en LE, deux ordres de lecture des octets.<br><b>Sequence number<\/b> : il augmente de 1 à chaque ping (10 valeurs pour -n 10).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p><strong>7b3.<\/strong> b3) Sélectionner les octets de données de la requête et les comparer avec l&#39;affichage brut.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Clique sur « Data » dans l&#39;ICMP : les octets se surlignent dans la zone du bas (hexa + ASCII).<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Sous Windows, ping envoie <b>32 octets<\/b> de remplissage : abcdefghijklmnopqrstuvwabcdefghi. En hexa : 61 62 63 64… (le code ASCII de a, b, c, d…). C&#39;est la démonstration du TP : la zone du milieu (champs décodés) et la zone du bas (octets bruts) montrent la même chose, sous deux formes.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p><strong>7c1.<\/strong> c1) Premier Echo Reply : adresses IP source et destination ? Champ Protocol Type ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Filtre : icmp.type == 0. Le premier paquet.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Elles sont <b>inversées<\/b> par rapport à la requête : <b>source = Google<\/b>, <b>destination = ton PC<\/b>. Protocol = <b>1 (ICMP)<\/b>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><p><strong>7c2.<\/strong> c2) Valeur du champ Time To Live de la réponse ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Internet Protocol → Time to Live, dans l&#39;Echo Reply.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Elle est <b>plus petite qu&#39;une valeur ronde<\/b> (ex. 117 ou 118). Le serveur l&#39;a envoyée avec un TTL de départ (souvent 128 ou 64), et chaque routeur traversé a retiré 1. Estimation du nombre de sauts = la valeur de départ juste au-dessus − le TTL reçu (ex. 128 − 117 = 11 routeurs).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"7\"><div class=\"ex-q\"><p><strong>7c3.<\/strong> c3) Type de message ICMP de la réponse ? Comparer l&#39;identificateur et le numéro de séquence avec ceux de la requête.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>ICMP de l&#39;Echo Reply. Wireshark ajoute un lien « [Request frame: …] ».<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Type 0 (Echo reply), code 0<\/b>. L&#39;identifiant et le numéro de séquence sont <b>identiques<\/b> à ceux de la requête correspondante : c&#39;est comme ça que ping associe chaque réponse à sa requête et calcule le temps aller-retour.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"8\"><div class=\"ex-q\"><p><strong>7c4.<\/strong> c4) Comparer les données de la réponse avec celles de la requête.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Clique sur « Data » de l&#39;Echo Reply.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Les données sont <b>exactement les mêmes<\/b> (abcdef…). L&#39;Echo Reply renvoie à l&#39;identique ce qu&#39;il a reçu, d&#39;où le nom « écho ».<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>VII.4-5 · Commande tracert (capture : tracert <a href=\"http://www.google.fr\">www.google.fr<\/a>)<\/h3><div class=\"ex\" data-x=\"9\"><div class=\"ex-q\"><p><strong>75a1.<\/strong> a1) Quels sont les protocoles indiqués dans la colonne Protocol ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Filtre : icmp || dns<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>DNS<\/b> (au début, pour l&#39;IP de Google, puis des requêtes « PTR » pour retrouver le nom de chaque routeur) et <b>ICMP<\/b> : des <b>Echo Request<\/b> envoyés par ton PC, et des <b>Time-to-live exceeded (type 11)<\/b> renvoyés par chaque routeur, puis des Echo Reply du serveur final.<br>⚠ Sous Windows, tu ne verras pas d&#39;UDP : tracert utilise ICMP. C&#39;est traceroute, sous Linux, qui envoie de l&#39;UDP (ports 33434 et plus), et c&#39;est de lui que parle l&#39;énoncé.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"10\"><div class=\"ex-q\"><p><strong>75b1.<\/strong> b1) Premier paquet envoyé par tracert : adresse IP destination ? Champ Protocol Type ? Time To Live ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Filtre : icmp.type == 8 (Windows) ou udp (Linux). Le premier paquet.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Destination<\/b> = l&#39;IP de Google. <b>Protocol<\/b> = 1 (ICMP) sous Windows, 17 (UDP) sous Linux. <b>TTL = 1<\/b> : c&#39;est toute l&#39;astuce. Le 1er routeur met le TTL à 0, détruit le paquet et répond par un ICMP Time Exceeded, ce qui révèle son adresse. Puis tracert recommence avec TTL = 2, 3… (3 paquets par valeur de TTL).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"11\"><div class=\"ex-q\"><p><strong>75b2.<\/strong> b2) Comparer l&#39;IP destination relevée avec celle de la réponse DNS. Noter les valeurs caractéristiques de l&#39;en-tête IP.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Internet Protocol du 1er paquet tracert.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>C&#39;est <b>la même IP<\/b> que celle donnée par le DNS : tracert vise bien le serveur final. Seul le TTL varie d&#39;un envoi à l&#39;autre. Valeurs à noter : Version 4, Header length 20 octets, Protocol 1 (ou 17), TTL 1, 2, 3…, l&#39;IP source (ton PC) et l&#39;IP destination (Google).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"12\"><div class=\"ex-q\"><p><strong>75b3.<\/strong> b3) Combien d&#39;octets de données sont présents dans ce message de requête ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Clique sur « Data » : sa longueur est indiquée entre crochets [Length: …].<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Lis la valeur dans ta capture. Sous Windows, tracert envoie en général <b>64 octets<\/b> de données (certitude moyenne), contre 32 pour ping. Sous Linux, traceroute UDP envoie 32 octets. Vérifie avec le calcul : longueur totale IP − 20 (en-tête IP) − 8 (en-tête ICMP ou UDP) = données.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>VIII.3-a/b · Navigation Web : trame, IP et UDP du 1er message DNS<\/h3><div class=\"ex\" data-x=\"13\"><div class=\"ex-q\"><p><strong>8a1.<\/strong> a1) Protocoles de la capture : confirmer la présence de DNS, TCP et HTTP.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Filtre : dns || tcp || http || tls. Statistics → Protocol Hierarchy.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Tu dois voir <b>DNS<\/b> (résolution de <a href=\"http://www.fpbm.ma\">www.fpbm.ma<\/a>), <b>TCP<\/b> (connexion en 3 temps) et <b>HTTP<\/b>. ⚠ Comme le site passe en HTTPS, tu verras surtout du <b>TLS<\/b>, et au mieux un seul échange HTTP : la redirection 301. Écris-le dans ton compte-rendu, puis refais la capture avec <a href=\"http://neverssl.com\">http://neverssl.com<\/a> pour avoir du vrai HTTP.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"14\"><div class=\"ex-q\"><p><strong>8b1.<\/strong> b1) 1er message DNS du client : adresses MAC (Ethernet) et IP du client ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Filtre : dns.flags.response == 0, premier paquet. Développe « Ethernet II » (Src) et « Internet Protocol » (Src). Vérifie avec ipconfig /all.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>MAC source<\/b> = l&#39;adresse physique de TA carte réseau (6 octets, ex. a4:5e:60:…). <b>IP source<\/b> = ton adresse locale (ex. 192.168.1.x ou 10.x.x.x). Elles doivent correspondre à « Adresse physique » et « Adresse IPv4 » dans ipconfig /all.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"15\"><div class=\"ex-q\"><p><strong>8b2.<\/strong> b2) Contenu du champ Type de la trame Ethernet ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Ethernet II → Type.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>0x0800 = IPv4<\/b>. Ce champ dit à la couche 2 quel protocole de couche 3 est transporté (0x0806 = ARP, 0x86DD = IPv6). C&#39;est le rôle de la sous-couche LLC vu en cours.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"16\"><div class=\"ex-q\"><p><strong>8b3.<\/strong> b3) Adresses MAC et IP de destination ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Ethernet II → Dst ; Internet Protocol → Dst.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>MAC destination<\/b> = la MAC de ta <b>passerelle<\/b> (la box ou le routeur), pas celle du serveur DNS. <b>IP destination<\/b> = celle du <b>serveur DNS<\/b> (souvent l&#39;IP de la passerelle elle-même, ou un DNS public comme 8.8.8.8, ou celui de la fac). Vérifie dans ipconfig /all, ligne « Serveurs DNS ».<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"17\"><div class=\"ex-q\"><p><strong>8b4.<\/strong> b4) À quelles machines correspondent ces adresses ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Compare avec ipconfig /all (passerelle par défaut et serveurs DNS).<\/p>\n<\/div><div class=\"ex-c\" hidden><p>La <b>MAC<\/b> désigne le <b>prochain saut<\/b> local, la passerelle, parce que la couche 2 ne livre qu&#39;au voisin direct. L&#39;<b>IP<\/b> désigne la <b>destination finale<\/b>, le serveur DNS. C&#39;est la différence couche 2 / couche 3 du cours : la MAC change à chaque saut, l&#39;IP reste la même de bout en bout.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"18\"><div class=\"ex-q\"><p><strong>8b5.<\/strong> IP b1) Taille de l&#39;en-tête IP ? Longueur totale du paquet ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Internet Protocol → Header Length et Total Length.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>En-tête = 20 octets<\/b> (sans options). La <b>longueur totale<\/b> dépend du nom demandé (en général 50 à 80 octets) : c&#39;est en-tête IP (20) + en-tête UDP (8) + message DNS.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"19\"><div class=\"ex-q\"><p><strong>8b6.<\/strong> IP b2) Champ Protocol de l&#39;en-tête : numéro et type du protocole transporté ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Internet Protocol → Protocol.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>17 = UDP<\/b>. Le DNS passe par UDP, parce que c&#39;est rapide et qu&#39;une petite question-réponse n&#39;a pas besoin de la connexion TCP.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"20\"><div class=\"ex-q\"><p><strong>8b7.<\/strong> UDP b1) Ports du client et du serveur ? Particularités ? Protocole applicatif ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>User Datagram Protocol → Source Port, Destination Port.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Port destination = 53<\/b> : port réservé (bien connu, entre 0 et 1023) du DNS. <b>Port source<\/b> = un grand numéro choisi au hasard par le système (port éphémère, au-dessus de 1023, ex. 5xxxx ou 6xxxx). Il sert à reconnaître la conversation au retour. Protocole applicatif : <b>DNS<\/b>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"21\"><div class=\"ex-q\"><p><strong>8b8.<\/strong> UDP b2) Valeur du champ longueur de l&#39;en-tête UDP ? Correspond-elle à l&#39;en-tête IP ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>UDP → Length, à comparer avec IP → Total Length.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Longueur UDP = longueur totale IP − 20<\/b> (l&#39;en-tête IP). Elle inclut les 8 octets d&#39;en-tête UDP et les données DNS. Exemple : IP 62 → UDP 42 → DNS 34 octets. Cela montre l&#39;encapsulation : chaque couche contient la précédente.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>VIII.3-c · Service DNS (requête puis réponse)<\/h3><div class=\"ex\" data-x=\"22\"><div class=\"ex-q\"><p><strong>8c1.<\/strong> Requête c1) Quel champ indique s&#39;il s&#39;agit d&#39;une requête ou d&#39;une réponse ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Domain Name System → Flags → Response.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Le bit <b>QR (Response)<\/b> dans les Flags : <b>0 = requête (query)<\/b>, 1 = réponse. Pour une requête standard, les flags valent 0x0100.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"23\"><div class=\"ex-q\"><p><strong>8c2.<\/strong> Requête c2) Information transportée dans le corps de la requête ? Type et classe ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>DNS → Queries.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Le <b>nom demandé<\/b> : <a href=\"http://www.fpbm.ma\">www.fpbm.ma<\/a>. <b>Type A<\/b> (adresse IPv4 ; tu peux aussi voir une requête AAAA pour IPv6) et <b>classe IN<\/b> (Internet, 0x0001).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"24\"><div class=\"ex-q\"><p><strong>8c3.<\/strong> Requête c3) Identificateur de transaction ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>DNS → Transaction ID.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Un nombre sur 16 bits, en hexadécimal (ex. 0x3f2a), choisi par le client. Note ta valeur : tu en auras besoin pour la réponse.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"25\"><div class=\"ex-q\"><p><strong>8c4.<\/strong> Réponse c1) Adresses MAC et IP attendues pour la réponse ? Vérifier.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Filtre : dns.flags.response == 1, la réponse correspondante.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Tout est <b>inversé<\/b> : <b>MAC source = la passerelle<\/b>, <b>MAC destination = ton PC<\/b> ; <b>IP source = le serveur DNS<\/b>, <b>IP destination = ton PC<\/b>. Les ports aussi sont inversés : 53 vers ton port éphémère.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"26\"><div class=\"ex-q\"><p><strong>8c5.<\/strong> Réponse c2) Taille du paquet IP et du message UDP ? Est-elle plus grande que celle de la requête ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>IP → Total Length et UDP → Length de la réponse.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Oui, elle est plus grande<\/b>. La réponse recopie la question, puis ajoute une ou plusieurs <b>réponses<\/b> (Answers : CNAME, adresse A…), parfois des serveurs d&#39;autorité. Plus de contenu, donc des longueurs IP et UDP plus grandes.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"27\"><div class=\"ex-q\"><p><strong>8c6.<\/strong> Réponse c3) Identificateur de transaction de la réponse ? Correspond-il à la requête ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>DNS → Transaction ID de la réponse.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Identique<\/b> à celui de la requête. C&#39;est ce qui permet au client d&#39;associer chaque réponse à sa question, surtout quand plusieurs requêtes partent en même temps. UDP ne le fait pas pour lui, puisqu&#39;il est sans connexion.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>VIII.3-d · Requête HTTP GET (refais la capture avec <a href=\"http://neverssl.com\">http://neverssl.com<\/a>)<\/h3><div class=\"ex\" data-x=\"28\"><div class=\"ex-q\"><p><strong>8d1.<\/strong> d1) Numéros de séquence et d&#39;acquittement de l&#39;en-tête TCP du GET ? Vérifier qu&#39;ils correspondent aux valeurs attendues.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Filtre : http.request.method == &quot;GET&quot;. TCP → Sequence Number (relative) et Acknowledgment Number. Pour comprendre, regarde les 3 paquets avant : filtre tcp.stream == N (clic droit → Conversation Filter → TCP).<\/p>\n<\/div><div class=\"ex-c\" hidden><p>En numérotation relative (celle de Wireshark par défaut) : <b>Seq = 1, Ack = 1<\/b>. Pourquoi : la poignée de main est SYN (Seq 0) → SYN-ACK (Seq 0, Ack 1) → ACK (Seq 1, Ack 1). Le SYN « consomme » 1 numéro, donc le premier octet de données du client porte le numéro 1, et le client attend l&#39;octet 1 du serveur. En valeur brute (raw), ce sont de grands nombres aléatoires, les ISN, mais la logique reste la même.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"29\"><div class=\"ex-q\"><p><strong>8d2.<\/strong> d2) Indicateurs d&#39;état (flags) actifs de l&#39;en-tête TCP ? Pourquoi ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>TCP → Flags.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>PSH et ACK<\/b> (0x018). <b>ACK<\/b> : le segment acquitte ce que le serveur a envoyé, ce qui est toujours le cas après la poignée de main. <b>PSH<\/b> : « pousse » les données vers l&#39;application sans attendre, puisque le segment contient la requête complète.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"30\"><div class=\"ex-q\"><p><strong>8d3.<\/strong> d3) Longueur de l&#39;en-tête TCP et de la « charge » du message ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>TCP → Header Length et [TCP Segment Len].<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>En-tête TCP = 20 octets<\/b> (32 si des options sont présentes). <b>Charge<\/b> = TCP Segment Len = la taille du texte de la requête GET (en général quelques centaines d&#39;octets). Vérifie : Total Length IP − 20 (IP) − en-tête TCP = charge.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>VIII.3-e · Réponse HTTP<\/h3><div class=\"ex\" data-x=\"31\"><div class=\"ex-q\"><p><strong>8e1.<\/strong> e1) Temps écoulé entre le GET et la réponse correspondante ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Différence des valeurs de la colonne Time, ou dans la réponse : HTTP → [Time since request].<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Lis-le dans ta capture : en général quelques dizaines à quelques centaines de millisecondes. Ce délai comprend l&#39;aller-retour sur le réseau et le temps de traitement du serveur.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"32\"><div class=\"ex-q\"><p><strong>8e2.<\/strong> e2) Le serveur répond-il avec un message HTTP ou avec un segment TCP ACK ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Regarde le paquet du serveur juste après le GET.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Souvent, le serveur envoie <b>d&#39;abord un ACK TCP seul<\/b> (sans données) pour accuser réception du GET, <b>puis<\/b> la réponse HTTP (200 OK). Parfois les deux sont combinés : la réponse HTTP porte elle-même le flag ACK. Dis lequel des deux cas tu observes.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"33\"><div class=\"ex-q\"><p><strong>8e3.<\/strong> e3) Numéro de séquence émis par le serveur ? Correspond-il à la valeur attendue ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>TCP du premier segment du serveur après le GET.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Seq = 1<\/b> (relatif) : c&#39;est exactement la valeur de l&#39;Ack envoyé par le client dans le GET (« j&#39;attends ton octet 1 »). Et l&#39;<b>Ack du serveur = 1 + longueur du GET<\/b> : il confirme avoir reçu tous les octets de la requête. C&#39;est la règle du cours : ACK = numéro du prochain octet attendu.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"34\"><div class=\"ex-q\"><p><strong>8e4.<\/strong> Réponse e1) Longueur de la « charge » dans l&#39;en-tête TCP de la réponse HTTP ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>TCP → [TCP Segment Len] du 200 OK. Si la page est grande : [Reassembled TCP Segments].<\/p>\n<\/div><div class=\"ex-c\" hidden><p>C&#39;est la taille de l&#39;en-tête HTTP plus le début de la page. Si la page dépasse le <b>MSS (1460 octets)<\/b>, elle est découpée en <b>plusieurs segments<\/b> que Wireshark réassemble. C&#39;est la segmentation de ton cours, vue en vrai.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"35\"><div class=\"ex-q\"><p><strong>8e5.<\/strong> Réponse e2) Flags actifs de l&#39;en-tête TCP de la réponse ? Pourquoi ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>TCP → Flags du 200 OK.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>PSH, ACK<\/b> (parfois <b>FIN, PSH, ACK<\/b> si le serveur ferme la connexion juste après). ACK : il acquitte la requête. PSH : il livre les données tout de suite. FIN : il ouvre la fermeture en 4 temps.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"36\"><div class=\"ex-q\"><p><strong>8e6.<\/strong> Réponse e3) Prochain numéro de séquence attendu dans le message suivant émis par le client ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Calcule avec les valeurs relatives de ta capture, puis vérifie sur le paquet suivant du client.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Le client continue sa propre numérotation : <b>Seq suivant du client = 1 + longueur du GET<\/b>, puisqu&#39;il a déjà « consommé » ces octets. Son <b>Ack<\/b> vaudra <b>Seq du serveur + longueur de la réponse<\/b> : le prochain octet qu&#39;il attend. Exemple : GET de 400 octets, réponse de 1200 octets → le client envoie Seq = 401, Ack = 1201.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section>","ex":[{"n":"n34","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n24","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n24","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n24","rep":null,"tol":null},{"n":"n24","rep":null,"tol":null},{"n":"n28","rep":null,"tol":null},{"n":"n24","rep":null,"tol":null},{"n":"n28","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n24","rep":null,"tol":null},{"n":"n24","rep":null,"tol":null},{"n":"n26","rep":null,"tol":null},{"n":"n24","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n28","rep":null,"tol":null},{"n":"n24","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n26","rep":null,"tol":null},{"n":"n26","rep":null,"tol":null},{"n":"n26","rep":null,"tol":null},{"n":"n35","rep":null,"tol":null},{"n":"n26","rep":null,"tol":null},{"n":"n35","rep":null,"tol":null},{"n":"n26","rep":null,"tol":null},{"n":"n26","rep":null,"tol":null},{"n":"n35","rep":null,"tol":null}],"qcm":[]},{"id":"tp2","t":"TP 2 · Packet Tracer","seance":"Travaux dirigés et pratiques","imp":4,"html":"<h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Construis le réseau en même temps.<\/strong> Ouvre Packet Tracer et reproduis chaque étape : le but est de savoir refaire la manipulation, pas de reconnaître une capture d&#39;écran.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Oublier de tester après chaque configuration. Un ping entre deux machines à chaque étape évite de chercher l&#39;erreur à la fin.<\/p>\n<\/aside><h2>Le TP<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Cherche d&#39;abord seul, ouvre l&#39;indice si tu bloques, puis compare avec le corrigé et note-toi honnêtement : ta réponse compte dans la maîtrise de la notion.<\/p>\n<\/aside><section class=\"exo\"><h3>Partie 1 · Hub et switch (2 maquettes sous Packet Tracer)<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p><strong>p1a.<\/strong> 1-2) Réaliser et configurer les deux maquettes.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Packet Tracer : End Devices → PC ; Network Devices → Hubs → Hub-PT, puis Switches → un switch 2950 ou 2960. Câbles : Connections → Copper Straight-Through. Sur chaque PC : Desktop → IP Configuration (ou onglet Config).<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Maquette 1<\/b> : Hub0 relié à PC0, PC1 et PC2 par des câbles droits.<br>PC0 10.0.0.1 · PC1 10.0.0.2 · PC2 10.0.0.3, masque 255.0.0.0.<br><b>Maquette 2<\/b> : Switch1 relié à PC3, PC4 et PC5.<br>PC3 11.0.0.1 · PC4 11.0.0.2 · PC5 11.0.0.3, masque 255.0.0.0.<br>Aucune passerelle : le sujet n&#39;en donne pas. Attends que les points de liaison soient verts (sur un switch, ils passent par l&#39;orange pendant quelques secondes).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p><strong>p1b.<\/strong> 3) Ping entre PC0 et PC2. Que remarquez-vous ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>PC0 → Desktop → Command Prompt → ping 10.0.0.3. Pour voir le chemin des trames : bascule en mode « Simulation » (en bas à droite), envoie un ping et avance pas à pas.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Le ping réussit<\/b> : PC0 (10.0.0.1) et PC2 (10.0.0.3) sont dans le même réseau 10.0.0.0/8.<br>En mode Simulation, on voit que le <b>hub recopie la trame sur tous ses autres ports<\/b> : PC1 la reçoit aussi, même s&#39;il n&#39;est pas concerné (sa carte l&#39;ignore, ce n&#39;est pas sa MAC). Le hub ne lit aucune adresse.<br><b>Le 1er paquet est souvent perdu<\/b> (« Request timed out ») : PC0 ne connaît pas encore la MAC de PC2 et doit d&#39;abord la demander par un ARP en diffusion. Les suivants passent. C&#39;est normal.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p><strong>p1c.<\/strong> 4) Ping entre PC3 et PC4. Que remarquez-vous ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Même méthode : ping 11.0.0.2 depuis PC3, en mode Simulation. Puis ouvre la table du switch : clique sur Switch1 → CLI → show mac address-table.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Le ping réussit aussi<\/b> (réseau 11.0.0.0/8). La différence est dans le trajet : après le premier échange, le <b>switch envoie la trame uniquement vers le port de PC4<\/b>. PC5 ne reçoit plus rien.<br>Pourquoi : à chaque trame reçue, le switch lit la <b>MAC source<\/b> et la range dans sa table (MAC → port). Pour livrer, il lit la <b>MAC destination<\/b> et cherche le bon port. Seule la diffusion (l&#39;ARP du tout début) ou une MAC inconnue est envoyée sur tous les ports.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p><strong>p1d.<\/strong> 5) Pourquoi le switch est-il « intelligent » par rapport au hub ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Question de cours : compare les deux équipements couche par couche (modèle OSI).<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Hub<\/b> (concentrateur) : couche 1, un simple répéteur. Il recopie chaque signal sur tous les ports et ne lit aucune adresse. Tout le monde partage la même bande passante et les mêmes collisions (un seul domaine de collision, half-duplex).<br><b>Switch<\/b> (commutateur) : couche 2. Il lit les adresses MAC, apprend où se trouve chaque machine (table MAC) et n&#39;envoie la trame qu&#39;au port concerné. Résultat : pas de collisions entre ports, chaque port dispose de toute la bande passante (full-duplex possible), et les autres machines ne voient pas les trames qui ne leur sont pas destinées (plus sûr).<br>En une phrase : le hub diffuse, le switch commute.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p><strong>p1e.<\/strong> 6) Connecter les deux maquettes par un câble RJ45.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Connections → Copper Cross-Over. Relie un port libre de Hub0 à un port libre de Switch1.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>On relie <b>Hub0 à Switch1<\/b> avec un <b>câble croisé<\/b> : hub et switch sont deux équipements intermédiaires de même nature, et la règle du cours est que deux équipements de même nature se relient en croisé (PC–switch = droit, switch–switch = croisé). Les deux maquettes ne forment alors plus qu&#39;un seul segment physique : 6 PC, un hub et un switch.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p><strong>p1f.<\/strong> 7) Ping entre PC0 et PC4. Pourquoi les deux machines ne peuvent-elles pas communiquer ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Compare les adresses de PC0 et PC4 avec le masque : on garde la partie réseau (les octets à 255) et on compare.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Le ping échoue<\/b> (« Destination host unreachable » ou « Request timed out »).<br>Le câble ne suffit pas : <b>les deux PC sont dans deux réseaux IP différents<\/b>.<br>PC0 : 10.0.0.1 ET 255.0.0.0 = <b>10<\/b>.0.0.0. PC4 : 11.0.0.2 ET 255.0.0.0 = <b>11<\/b>.0.0.0. Les réseaux sont différents (10 ≠ 11), donc PC0 considère PC4 comme « hors de mon réseau » et doit passer par une <b>passerelle<\/b> (un routeur) : il n&#39;y en a pas.<br>Hub et switch ne routent pas : ils travaillent aux couches 1 et 2 et ne regardent jamais l&#39;adresse IP.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><p><strong>p1g.<\/strong> 8) Proposer une solution physique pour résoudre ce problème.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Quel équipement relie des réseaux différents ? (cours : le routeur, couche 3)<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Insérer un <b>routeur<\/b> entre les deux maquettes : on débranche la liaison hub–switch, puis Hub0 va sur une interface du routeur (ex. 10.0.0.254, masque 255.0.0.0) et Switch1 sur une autre (ex. 11.0.0.254, masque 255.0.0.0). Chaque PC reçoit la passerelle de son réseau : 10.0.0.254 pour PC0, PC1, PC2 ; 11.0.0.254 pour PC3, PC4, PC5. Le routeur relie des réseaux différents (couche 3), le hub et le switch relient des machines d&#39;un même réseau.<br><i>Variante sans matériel en plus :<\/i> mettre tous les PC dans le même réseau (même adresse réseau, par exemple 10.0.0.x partout).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Partie 2 · I-II : topologie R1 – S1 – PC-A et configuration de base<\/h3><div class=\"ex\" data-x=\"7\"><div class=\"ex-q\"><p><strong>p2a.<\/strong> I. Câblage et initialisation du routeur et du commutateur.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Packet Tracer : un routeur (1941 ou 2911, qui possède un port G0/1), un switch 2960 et un PC. Câbles droits : R1 G0/1 ↔ S1 F0/5 et S1 F0/6 ↔ PC-A (FastEthernet0).<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Câblage : <b>R1 G0/1 — S1 F0/5<\/b> et <b>S1 F0/6 — PC-A<\/b> (câbles droits : routeur–switch et switch–PC sont des équipements de natures différentes).<br>Initialisation (utile surtout sur du vrai matériel : un équipement neuf de Packet Tracer est déjà vierge) :<br>Router&gt;enable<br>Router#erase startup-config      (confirmer)<br>Router#reload      (répondre « no » si on propose d&#39;enregistrer)<br>Switch&gt;enable<br>Switch#erase startup-config<br>Switch#delete vlan.dat      (si le fichier existe)<br>Switch#reload<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"8\"><div class=\"ex-q\"><p><strong>p2b.<\/strong> II.1a) Configurer l&#39;adresse IPv4, le masque et la passerelle par défaut de PC-A.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>PC-A → Desktop → IP Configuration → Static.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>IP address : <b>192.168.1.3<\/b><br>Subnet mask : <b>255.255.255.0<\/b><br>Default gateway : <b>192.168.1.1<\/b> (l&#39;adresse de G0/1 sur R1)<br>La passerelle est l&#39;adresse du routeur sur ce réseau : c&#39;est par elle que PC-A sortira de son réseau.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"9\"><div class=\"ex-q\"><p><strong>p2c.<\/strong> II.1b) Les pings vers la passerelle 192.168.1.1 ont-ils abouti ? Justifiez.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>PC-A → Command Prompt → ping 192.168.1.1, AVANT d&#39;avoir configuré le routeur.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Non<\/b> (« Request timed out » ou « Destination host unreachable »).<br>Pourquoi : PC-A est bien configuré, mais <b>le routeur ne l&#39;est pas encore<\/b>. Une interface de routeur est <b>désactivée par défaut<\/b> (shutdown) et n&#39;a pas d&#39;adresse IP : personne ne répond à 192.168.1.1. Le câblage correct ne suffit donc pas, il faut aussi configurer et activer l&#39;interface.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"10\"><div class=\"ex-q\"><p><strong>p2d.<\/strong> II.2) Configurer le routeur : accès console, nom d&#39;hôte R1, no ip domain-lookup, interface G0/1.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Clique sur R1 → onglet CLI (ou PC-A → Desktop → Terminal, avec un câble Console vers R1). Réponds « no » à l&#39;assistant de configuration initiale.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Router&gt;enable<br>Router#configure terminal<br>Router(config)#hostname R1<br>R1(config)#no ip domain-lookup<br>R1(config)#interface g0/1<br>R1(config-if)#ip address 192.168.1.1 255.255.255.0<br>R1(config-if)#no shutdown<br>R1(config-if)#end<br>R1#copy running-config startup-config<br>R1#show ip interface brief<br><br><b>hostname<\/b> : donne le nom prévu par la table d&#39;adressage. <b>no ip domain-lookup<\/b> : empêche IOS de prendre une commande mal tapée pour un nom à résoudre par DNS (sinon il attend environ une minute). <b>no shutdown<\/b> : allume l&#39;interface. Dans show ip interface brief, G0/1 doit afficher « up / up ».<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"11\"><div class=\"ex-q\"><p><strong>p2e.<\/strong> II.3a) Ping de PC-A vers la passerelle R1 : les requêtes ont-elles abouti ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Même commande qu&#39;avant : ping 192.168.1.1 depuis PC-A, une fois G0/1 « up / up ».<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Oui<\/b> : « Reply from 192.168.1.1 », sans perte (le tout premier paquet peut être perdu à cause de l&#39;ARP).<br>La liaison est maintenant complète : PC-A et G0/1 sont dans le même réseau 192.168.1.0/24, l&#39;interface est active, et PC-A et R1 se sont appris leurs adresses MAC par ARP (voir la partie III).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Partie 2 · III : adresses MAC Ethernet<\/h3><div class=\"ex\" data-x=\"12\"><div class=\"ex-q\"><p><strong>p3a.<\/strong> III.1a) Exemple du sujet (carte Realtek, C8-0A-A9-FA-DE-0D) : partie OUI ? Partie numéro de série ? Fournisseur ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Une MAC fait 48 bits = 6 octets. Les 3 premiers = OUI ; les 3 derniers = numéro de série de la carte. Cherche l&#39;OUI dans la base de l&#39;IEEE ou sur un site « MAC address lookup ».<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>OUI<\/b> = <b>C8-0A-A9<\/b> (3 octets attribués par l&#39;IEEE au fabricant).<br><b>Numéro de série<\/b> = <b>FA-DE-0D<\/b> (3 octets choisis par le fabricant).<br><b>Fournisseur<\/b> : l&#39;OUI C8:0A:A9 est enregistré au nom de <b>Quanta Computer Inc.<\/b> (vérifié dans une base de recherche d&#39;OUI).<br>⚠ « Realtek PCIe GBE Family Controller » est le nom de la <b>puce<\/b> réseau (ligne Description), pas le fabricant donné par l&#39;OUI : ce sont deux informations différentes.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"13\"><div class=\"ex-q\"><p><strong>p3b.<\/strong> III.1b) Sur TON PC-A (ipconfig /all) : partie OUI, numéro de série, fournisseur ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>PC-A → Desktop → Command Prompt → ipconfig /all, ligne « Physical Address ». Puis recherche de l&#39;OUI sur un site « MAC address lookup ».<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Recopie ta ligne <b>Physical Address<\/b>. Les 6 premiers chiffres hexadécimaux sont l&#39;<b>OUI<\/b>, les 6 derniers le <b>numéro de série<\/b>. Exemple inventé pour illustrer : 0001.C7A3.D2B1 → OUI 0001.C7, série A3.D2B1.<br>Pour le fournisseur, cherche ton OUI dans une base. Sous <b>Packet Tracer<\/b>, les PC sont simulés : leurs adresses commencent souvent par 0001, 0002… et ces préfixes sont des préfixes <b>Cisco<\/b> (à vérifier avec ton propre OUI).<br>Sur un vrai PC, le fournisseur est celui de la carte réseau (Intel, Realtek, Quanta…).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"14\"><div class=\"ex-q\"><p><strong>p3c.<\/strong> III.2a) Routeur R1 (exemple 30f7.0da3.1821) : adresse MAC de G0/1, numéro de série, OUI, fournisseur ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>R1 → CLI → show interfaces g0/1, ligne « Hardware is … address is ».<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Adresse MAC de G0/1<\/b> : <b>30f7.0da3.1821<\/b> (soit 30:F7:0D:A3:18:21).<br><b>OUI<\/b> : <b>30:F7:0D<\/b>. <b>Numéro de série<\/b> : <b>A3:18:21<\/b> (a3.1821).<br><b>Fournisseur<\/b> : <b>Cisco Systems, Inc.<\/b> (préfixe 30:F7:0D vérifié).<br>Sur ton routeur Packet Tracer les valeurs seront différentes : relève les tiennes après « address is ».<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"15\"><div class=\"ex-q\"><p><strong>p3d.<\/strong> Que représente « bia » ? Pourquoi le résultat affiche-t-il la même adresse MAC deux fois ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Dans show interfaces g0/1 : « address is … (bia …) ».<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>bia<\/b> = <b>burned-in address<\/b> : l&#39;adresse MAC <b>gravée en usine<\/b> dans la carte (UAA, adresse administrée universellement). Elle ne change pas.<br>« address is » = l&#39;adresse MAC <b>actuellement utilisée<\/b> par l&#39;interface. Par défaut, c&#39;est la même que la bia, d&#39;où deux fois la même valeur. Elles ne seraient différentes que si un administrateur avait imposé une autre MAC avec la commande mac-address (adresse administrée localement).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"16\"><div class=\"ex-q\"><p><strong>p3e.<\/strong> III.2b) show arp : quelles adresses de couche 2 et de couche 3 s&#39;affichent sur R1 ? Pourquoi aucune information sur le commutateur ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>R1 → CLI → show arp (après un ping depuis PC-A, sinon l&#39;entrée de PC-A n&#39;existe pas encore).<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Couche 2 (MAC)<\/b> : 30f7.0da3.1821 (R1 lui-même, âge « - ») et c80a.a9fa.de0d (PC-A).<br><b>Couche 3 (IP)<\/b> : 192.168.1.1 (R1) et 192.168.1.3 (PC-A).<br>La table ARP <b>associe chaque IP à sa MAC<\/b>.<br><b>Pas de switch :<\/b> S1 n&#39;a pas d&#39;adresse IP configurée et il est transparent : il ne fait que faire passer les trames. R1 ne communique jamais avec lui au niveau IP, donc aucune entrée ARP n&#39;est créée pour lui.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"17\"><div class=\"ex-q\"><p><strong>p3f.<\/strong> III.3a) Switch : adresse MAC de F0/5 et de F0/6 ? Les OUI sont-ils les mêmes que sur le routeur ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>S1 → CLI → show interfaces f0/5, puis show interfaces f0/6 (ligne « address is »).<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Dans l&#39;exemple du sujet, <b>F0/5 = 0cd9.96e8.7285<\/b>. Pour F0/6, relève ta valeur : sur un switch Cisco les ports reçoivent des adresses MAC <b>consécutives<\/b> (F0/6 = …7286, à confirmer sur ta sortie).<br><b>OUI<\/b> du switch : 0C:D9:96. <b>OUI<\/b> du routeur : 30:F7:0D. <b>Ils sont différents<\/b>, mais les deux appartiennent à <b>Cisco Systems<\/b> : un fabricant possède souvent plusieurs OUI (les deux préfixes sont vérifiés).<br>Le switch retient les MAC de R1 et de PC-A (couche 2), jamais leurs adresses IP.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"18\"><div class=\"ex-q\"><p><strong>p3g.<\/strong> III.3b) show mac address-table : le switch affiche-t-il la MAC de PC-A ? de R1 ? sur quels ports ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>S1 → CLI → show mac address
