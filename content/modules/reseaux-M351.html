const CHAPS=[{"id":"s1","t":"Introduction générale","seance":"Chapitre 1","imp":2,"html":"<h2>Avant de commencer<\/h2>\n<p>Aucun prérequis : c&#39;est le point de départ du module.<\/p>\n<details class=\"prereq\"><summary><b>Vérifie ton prérequis.<\/b> En une phrase, à quoi sert un réseau ?<\/summary><p>À relier des appareils pour qu'ils échangent des informations et partagent des ressources.<\/p><\/details><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense à la poste.<\/strong> Un expéditeur, un destinataire, une enveloppe, un trajet. Tout le module ne fait que détailler ce trajet, étape par étape.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Réciter les utilités d&#39;un réseau en vrac. Range-les en deux colonnes, <strong>entreprises<\/strong> et <strong>particuliers<\/strong> : c&#39;est ainsi que la question est posée.<\/p>\n<\/aside><p>À la fin, tu sais définir un réseau informatique et citer ses utilités.<\/p>\n<h2>Le cours<\/h2>\n<p>Les réseaux relient des entités (personnes, matériels…) quelle que soit leur zone géographique, pour partager des informations et des ressources. Il en existe de plusieurs catégories : communication (téléphone, radio, TV), informatique ou de données (Internet, LAN, WAN), transport, social, biologique.<\/p>\n  <div class=\"def\"><b>Définition, réseau informatique<\/b>Ensemble d'appareils (ordinateurs et périphériques) reliés entre eux pour permettre à leurs utilisateurs de transférer des informations électroniques. Il permet de communiquer et de partager des ressources matérielles et logicielles.<\/div>\n  <p><b>Utilités pour les entreprises :<\/b> partage des ressources, fiabilité et résistance aux pannes (duplication, disponibilité), réduction de coût, outils de communication, commerce électronique.<br><b>Pour les particuliers :<\/b> accès à l'information (Web, téléchargement, FTP), communication (email, messagerie, forums), achats en ligne.<\/p><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 2 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Lequel n&#39;est PAS cité dans le cours comme utilité d&#39;un réseau pour une entreprise ?<\/div><button class=\"opt\" data-o=\"0\">Partage des ressources<\/button><button class=\"opt\" data-o=\"1\">Fiabilité et résistance aux pannes<\/button><button class=\"opt\" data-o=\"2\">Augmentation de la consommation électrique<\/button><button class=\"opt\" data-o=\"3\">Réduction de coût<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Un réseau informatique permet principalement de…<\/div><button class=\"opt\" data-o=\"0\">Communiquer et partager des ressources matérielles et logicielles<\/button><button class=\"opt\" data-o=\"1\">Remplacer le système d&#39;exploitation<\/button><button class=\"opt\" data-o=\"2\">Augmenter la mémoire RAM<\/button><button class=\"opt\" data-o=\"3\">Chiffrer les disques<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[],"qcm":[{"n":"n1","q":"Lequel n&#39;est PAS cité dans le cours comme utilité d&#39;un réseau pour une entreprise ?","o":["Partage des ressources","Fiabilité et résistance aux pannes","Augmentation de la consommation électrique","Réduction de coût"],"a":2,"e":"Les utilités citées : partage des ressources, fiabilité, réduction de coût, outils de communication, commerce électronique."},{"n":"n1","q":"Un réseau informatique permet principalement de…","o":["Communiquer et partager des ressources matérielles et logicielles","Remplacer le système d&#39;exploitation","Augmenter la mémoire RAM","Chiffrer les disques"],"a":0,"e":"Définition du cours : transférer des informations électroniques, communiquer, partager des ressources matérielles et logicielles."}]},{"id":"s2","t":"Communication sur un réseau","seance":"Chapitre 1","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>L&#39;idée qu&#39;une communication a un émetteur et un récepteur.<\/p>\n<details class=\"prereq\"><summary><b>Vérifie ton prérequis.<\/b> Quels sont les trois éléments de toute communication ?<\/summary><p>Une source (l'émetteur), une destination (le récepteur) et un canal (le support qui les relie).<\/p><\/details><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Un gros message ne voyage jamais d&#39;un bloc.<\/strong> Il est découpé en morceaux (segmentation), et les morceaux de plusieurs conversations se partagent le même support (multiplexage).<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Croire que découper ralentit. Sans segmentation, un seul envoi bloquerait le support pour tout le monde, et la moindre erreur obligerait à tout renvoyer.<\/p>\n<\/aside><p>À la fin, tu sais décrire les éléments d&#39;une communication et expliquer segmentation et multiplexage.<\/p>\n<h2>Le cours<\/h2>\n<div class=\"def\"><b>Définition, protocole<\/b>Un ensemble de règles utilisées par les périphériques en réseau pour communiquer.<\/div>\n  <p><b>Les 5 règles d'une communication :<\/b> (1) identification de l'expéditeur et du destinataire, (2) méthode de communication convenue, (3) langue et syntaxe communes, (4) vitesse et rythme, (5) demande de confirmation ou de reçu.<\/p>\n  <h3>Qualité des communications<\/h3>\n  <div class=\"table-wrap\"><table><thead><tr><th>Facteurs internes (nature du message)<\/th><th>Facteurs externes (complexité du réseau)<\/th><\/tr><\/thead><tbody><tr><td>Taille du message<br>Complexité du message<br>Importance du message<\/td><td>Qualité du chemin d'accès<br>Nombre de changements de forme<br>Nombre de redirections / réadressages<br>Quantité d'autres messages simultanés<br>Délai alloué à la communication<\/td><\/tr><\/tbody><\/table><\/div>\n  <h3>Éléments de communication<\/h3>\n  <div class=\"formula\">Émetteur/Récepteur ⇄ Coupleur ⇄ ─── Médium ─── ⇄ Coupleur ⇄ Émetteur/Récepteur\n                         (informations)<\/div>\n  <p>Les <b>informations<\/b> sont des éléments physiques (lumière, son, image, tension électrique…) auxquels on a attribué un sens.<\/p>\n  <h3>Segmentation et multiplexage<\/h3>\n  <ul><li><b>Segmentation :<\/b> diviser les données en parties plus petites et plus faciles à gérer. Elle augmente la fiabilité : les parties peuvent suivre des chemins différents, et seules les parties manquantes sont retransmises.<\/li>\n  <li><b>Multiplexage :<\/b> fusion de plusieurs flux de données sur un même canal. De nombreuses conversations s'entremêlent sur le réseau.<\/li>\n  <li><b>Étiquetage :<\/b> chaque partie est étiquetée pour pouvoir être dirigée puis réassemblée à l'arrivée.<\/li><\/ul>\n  <div class=\"trap\"><b>Piège<\/b>L'inconvénient de la segmentation et du multiplexage n'est pas la perte de fiabilité : c'est la <b>complexité<\/b> ajoutée au processus.<\/div>\n  <p><b>Réseau convergent :<\/b> les réseaux de téléphonie, radio, TV et données, autrefois séparés, sont réunis sur une même plateforme.<\/p>\n  <h3>Chronologie d'une communication (TD 2, ex. 1)<\/h3>\n  <div class=\"formula\">Côté émetteur :  1 Segmentation → 2 Multiplexage → 3 Étiquetage → 4 Encodage → 5 Émission\nCôté récepteur : 6 Réception → 7 Décodage → 8 Assemblage<\/div>\n  <ul>\n    <li><b>Segmentation<\/b> : découper le message en segments. <b>Multiplexage<\/b> : entrelacer sur le même canal les segments de plusieurs conversations. <b>Étiquetage<\/b> : ajouter à chaque segment les informations de remise (adresses, numéro de séquence, port).<\/li>\n    <li><b>Encodage<\/b> : transformer les bits en signaux adaptés au médium (électriques, lumineux, radio). <b>Émission<\/b> : envoyer ces signaux sur le support.<\/li>\n    <li>Le récepteur fait l'inverse : <b>réception<\/b> du signal, <b>décodage<\/b> (signal → bits), puis <b>assemblage<\/b> des segments dans l'ordre grâce aux étiquettes.<\/li>\n  <\/ul>\n  <div class=\"trap\"><b>Écart à connaître<\/b>La correction manuscrite du TD 2 que j'ai lue place le multiplexage après l'émission (segmentation, étiquetage, encodage, émission, multiplexage, réception…). L'ordre ci-dessus suit la logique du cours (le multiplexage prépare les segments, il ne se fait pas après l'envoi). Certitude : moyenne à élevée. Je n'ai pas le corrigé officiel : si ton prof a donné l'autre ordre en classe, écris le sien à l'examen.<\/div><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 10 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Un protocole est…<\/div><button class=\"opt\" data-o=\"0\">Un câble réseau normalisé<\/button><button class=\"opt\" data-o=\"1\">Un ensemble de règles utilisées par les périphériques en réseau pour communiquer<\/button><button class=\"opt\" data-o=\"2\">Un logiciel antivirus<\/button><button class=\"opt\" data-o=\"3\">Un type de topologie<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Laquelle de ces règles ne figure PAS parmi les règles de communication du cours ?<\/div><button class=\"opt\" data-o=\"0\">Identification de l&#39;expéditeur et du destinataire<\/button><button class=\"opt\" data-o=\"1\">Langue et syntaxe communes<\/button><button class=\"opt\" data-o=\"2\">Vitesse et rythme<\/button><button class=\"opt\" data-o=\"3\">Chiffrement obligatoire du message<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">« La complexité du message » est un facteur…<\/div><button class=\"opt\" data-o=\"0\">Externe<\/button><button class=\"opt\" data-o=\"1\">Interne<\/button><button class=\"opt\" data-o=\"2\">Physique<\/button><button class=\"opt\" data-o=\"3\">Applicatif<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">« Le nombre de fois où le message doit être réadressé » est un facteur…<\/div><button class=\"opt\" data-o=\"0\">Interne<\/button><button class=\"opt\" data-o=\"1\">Externe<\/button><button class=\"opt\" data-o=\"2\">Logique<\/button><button class=\"opt\" data-o=\"3\">Protocolaire<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Dans le schéma de communication, l&#39;élément qui relie l&#39;émetteur/récepteur au médium est…<\/div><button class=\"opt\" data-o=\"0\">Le protocole<\/button><button class=\"opt\" data-o=\"1\">Le coupleur de communication<\/button><button class=\"opt\" data-o=\"2\">Le serveur<\/button><button class=\"opt\" data-o=\"3\">Le multiplexeur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Avantage de la segmentation :<\/div><button class=\"opt\" data-o=\"0\">On retransmet tout le message en cas de perte<\/button><button class=\"opt\" data-o=\"1\">Seules les parties manquantes sont retransmises<\/button><button class=\"opt\" data-o=\"2\">Toutes les parties suivent obligatoirement le même chemin<\/button><button class=\"opt\" data-o=\"3\">Elle supprime la nécessité d&#39;étiqueter<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Le multiplexage, c&#39;est…<\/div><button class=\"opt\" data-o=\"0\">Diviser un message en segments<\/button><button class=\"opt\" data-o=\"1\">Fusionner plusieurs flux de données sur un même canal<\/button><button class=\"opt\" data-o=\"2\">Chiffrer les paquets<\/button><button class=\"opt\" data-o=\"3\">Choisir le meilleur chemin<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Inconvénient commun à la segmentation et au multiplexage :<\/div><button class=\"opt\" data-o=\"0\">Perte de fiabilité<\/button><button class=\"opt\" data-o=\"1\">Complexité ajoutée au processus<\/button><button class=\"opt\" data-o=\"2\">Débit doublé<\/button><button class=\"opt\" data-o=\"3\">Impossible sur Internet<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Un réseau convergent…<\/div><button class=\"opt\" data-o=\"0\">Réunit voix, vidéo et données sur une même plateforme<\/button><button class=\"opt\" data-o=\"1\">Est un réseau en anneau<\/button><button class=\"opt\" data-o=\"2\">Est un réseau sans routeur<\/button><button class=\"opt\" data-o=\"3\">Ne transporte que la voix<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Quelle étape vient juste avant l&#39;émission, côté émetteur ?<\/div><button class=\"opt\" data-o=\"0\">La segmentation<\/button><button class=\"opt\" data-o=\"1\">Le décodage<\/button><button class=\"opt\" data-o=\"2\">L&#39;encodage<\/button><button class=\"opt\" data-o=\"3\">L&#39;assemblage<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[],"qcm":[{"n":"n2","q":"Un protocole est…","o":["Un câble réseau normalisé","Un ensemble de règles utilisées par les périphériques en réseau pour communiquer","Un logiciel antivirus","Un type de topologie"],"a":1,"e":"Définition mot pour mot du cours."},{"n":"n2","q":"Laquelle de ces règles ne figure PAS parmi les règles de communication du cours ?","o":["Identification de l&#39;expéditeur et du destinataire","Langue et syntaxe communes","Vitesse et rythme","Chiffrement obligatoire du message"],"a":3,"e":"Les 5 règles : identification, méthode convenue, langue/syntaxe, vitesse/rythme, confirmation ou reçu."},{"n":"n3","q":"« La complexité du message » est un facteur…","o":["Externe","Interne","Physique","Applicatif"],"a":1,"e":"Les facteurs internes sont liés à la nature du message : sa taille, sa complexité, son importance."},{"n":"n3","q":"« Le nombre de fois où le message doit être réadressé » est un facteur…","o":["Interne","Externe","Logique","Protocolaire"],"a":1,"e":"Les facteurs externes sont liés à la complexité du réseau et au nombre de périphériques traversés."},{"n":"n4","q":"Dans le schéma de communication, l&#39;élément qui relie l&#39;émetteur/récepteur au médium est…","o":["Le protocole","Le coupleur de communication","Le serveur","Le multiplexeur"],"a":1,"e":"Émetteur/récepteur → coupleur de communication → médium."},{"n":"n5","q":"Avantage de la segmentation :","o":["On retransmet tout le message en cas de perte","Seules les parties manquantes sont retransmises","Toutes les parties suivent obligatoirement le même chemin","Elle supprime la nécessité d&#39;étiqueter"],"a":1,"e":"Les parties peuvent suivre des chemins différents, et seules les parties perdues sont renvoyées."},{"n":"n5","q":"Le multiplexage, c&#39;est…","o":["Diviser un message en segments","Fusionner plusieurs flux de données sur un même canal","Chiffrer les paquets","Choisir le meilleur chemin"],"a":1,"e":"Le multiplexage fusionne plusieurs flux sur un même canal. Ne le confonds pas avec la segmentation, qui découpe un message."},{"n":"n5","q":"Inconvénient commun à la segmentation et au multiplexage :","o":["Perte de fiabilité","Complexité ajoutée au processus","Débit doublé","Impossible sur Internet"],"a":1,"e":"Il faut étiqueter, diriger et réassembler les parties, ce qui ajoute de la complexité."},{"n":"n6","q":"Un réseau convergent…","o":["Réunit voix, vidéo et données sur une même plateforme","Est un réseau en anneau","Est un réseau sans routeur","Ne transporte que la voix"],"a":0,"e":"Il réunit sur une seule plateforme des réseaux autrefois séparés."},{"n":"n5","q":"Quelle étape vient juste avant l&#39;émission, côté émetteur ?","o":["La segmentation","Le décodage","L&#39;encodage","L&#39;assemblage"],"a":2,"e":"On encode les bits en signaux (encodage) puis on les émet. Le décodage et l&#39;assemblage se font côté récepteur."}]},{"id":"s3","t":"Composants de base","seance":"Chapitre 1","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Savoir ce qu&#39;est un périphérique final : un PC, un téléphone, une imprimante.<\/p>\n<details class=\"prereq\"><summary><b>Vérifie ton prérequis.<\/b> Un commutateur (switch) est-il un périphérique final ou intermédiaire ?<\/summary><p>Intermédiaire : il relie les périphériques finaux entre eux, comme le routeur.<\/p><\/details><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Classe chaque équipement avec deux questions.<\/strong> Laisse-t-il passer une collision ? Laisse-t-il passer une diffusion ? Les réponses donnent les domaines de collision et de diffusion.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Confondre les deux domaines. Un commutateur sépare les domaines de collision (un par port) mais laisse passer les diffusions. Il faut un routeur pour séparer les domaines de diffusion.<\/p>\n<\/aside><p>À la fin, tu sais nommer les composants d&#39;un réseau et compter les domaines sur un schéma.<\/p>\n<h2>Le cours<\/h2>\n<div class=\"def\"><b>Les 5 éléments de base<\/b>Périphériques · Nœuds intermédiaires · Messages · Supports de transmission · Protocoles<\/div>\n  <ul><li><b>Hôtes (end-users) :<\/b> envoient et reçoivent directement sur le réseau (PC, serveur, PDA). <b>Serveur<\/b> = hôte qui fournit des données ou des services (DHCP, DNS, Web). <b>Client<\/b> = hôte dont le logiciel interroge le serveur et affiche les informations.<\/li>\n  <li><b>Périphériques partagés :<\/b> pas directement connectés au réseau, ils y accèdent à travers un hôte (imprimante, webcam).<\/li>\n  <li><b>Nœuds intermédiaires :<\/b> transfèrent les messages d'une ligne d'entrée vers une ligne de sortie. <b>Commutateurs et concentrateurs<\/b> : hôtes d'un même segment. <b>Routeurs<\/b> : relient les segments entre eux.<\/li>\n  <li><b>Messages :<\/b> convertis en bits (signaux numériques codés en binaire) avant l'envoi.<\/li>\n  <li><b>Supports<\/b> (couche physique) : filaires (signal électrique sur câble métallique), optiques (lumière), sans fil / hertziens (ondes). <b>Critères de choix :<\/b> distance, environnement, quantité de données et débit, coût.<\/li><\/ul>\n  <h3>Protocoles et normes<\/h3>\n  <p>Une suite de protocoles décrit : le format du message ; le partage des chemins avec d'autres réseaux ; comment et quand transférer les messages d'erreur et système ; l'établissement et l'arrêt des sessions.<\/p>\n  <div class=\"formula\">Serveur Web ⇄ Navigateur\n  HTTP      (Hypertext Transfer Protocol)\n  TCP       (Transmission Control Protocol)\n  IP        (Internet Protocol)\n  Ethernet<\/div>\n  <p><b>Norme :<\/b> processus ou protocole reconnu par l'industrie et ratifié par un organisme. <b>IEEE<\/b> : 802.3 (Ethernet), 802.11 (WLAN). <b>IETF<\/b> : normes Internet publiées en RFC (TCP, IP, HTTP, FTP).<\/p>\n  <h3>Deux façons de se connecter à un autre périphérique (TD 2, ex. 1)<\/h3>\n  <div class=\"formula\">CLIENT-SERVEUR                         PAIR À PAIR (P2P)\n Client 1 ─┐                             Pair A ──── switch ──── Pair B\n Client 2 ─┼── Serveur                   (chaque machine est à la fois\n Client 3 ─┘                              client et serveur)<\/div>\n  <ul>\n    <li><b>Client-serveur<\/b> : un serveur dédié détient les ressources et fournit un service (Web, DNS, DHCP, messagerie) ; les clients envoient des requêtes. Administration et sécurité centralisées, mais le serveur est un point unique de panne.<\/li>\n    <li><b>Pair à pair<\/b> : pas de serveur dédié, chaque hôte partage ses ressources avec les autres (partage de fichiers entre postes). Facile à installer, mais peu sécurisé et difficile à administrer quand le réseau grandit.<\/li>\n  <\/ul>\n  <h3>Domaines de collision et domaines de diffusion<\/h3>\n  <div class=\"table-wrap\"><table><thead><tr><th>Équipement<\/th><th>Couche<\/th><th>Domaines de collision<\/th><th>Domaines de diffusion<\/th><\/tr><\/thead><tbody><tr><td>Hub<\/td><td>1<\/td><td>un seul pour tous ses ports<\/td><td>ne sépare pas<\/td><\/tr><tr><td>Switch<\/td><td>2<\/td><td>un par port<\/td><td>ne sépare pas<\/td><\/tr><tr><td>Routeur<\/td><td>3<\/td><td>un par interface<\/td><td>un par interface<\/td><\/tr><\/tbody><\/table><\/div>\n  <p><b>Domaine de collision<\/b> : zone où deux émissions simultanées se brouillent (support partagé). <b>Domaine de diffusion<\/b> : zone atteinte par une trame de diffusion (adresse FF:FF:FF:FF:FF:FF). Seul le routeur arrête la diffusion.<\/p>\n  <div class=\"def\"><b>Méthode pour compter sur un schéma<\/b>① Compte les câbles. ② <b>Collisions<\/b> : chaque câble est un domaine, sauf ceux qui touchent un même hub, qui se fondent en un seul (la liaison hub-switch appartient au domaine du hub). ③ <b>Diffusion<\/b> : les hubs et les switchs relient leurs câbles dans un même domaine ; chaque interface de routeur ouvre un domaine de plus (un PC branché directement sur un routeur forme le sien, et une liaison routeur-routeur aussi).<\/div><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 16 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Lequel ne fait PAS partie des 5 éléments de base d&#39;un réseau ?<\/div><button class=\"opt\" data-o=\"0\">Messages<\/button><button class=\"opt\" data-o=\"1\">Supports de transmission<\/button><button class=\"opt\" data-o=\"2\">Système d&#39;exploitation<\/button><button class=\"opt\" data-o=\"3\">Protocoles<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Une imprimante branchée en USB sur un PC du réseau est…<\/div><button class=\"opt\" data-o=\"0\">Un hôte<\/button><button class=\"opt\" data-o=\"1\">Un périphérique partagé<\/button><button class=\"opt\" data-o=\"2\">Un nœud intermédiaire<\/button><button class=\"opt\" data-o=\"3\">Un serveur DNS<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Un hôte qui fournit un service DHCP est un…<\/div><button class=\"opt\" data-o=\"0\">Client<\/button><button class=\"opt\" data-o=\"1\">Serveur<\/button><button class=\"opt\" data-o=\"2\">Concentrateur<\/button><button class=\"opt\" data-o=\"3\">Périphérique partagé<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Selon le cours, quel équipement connecte des segments ENTRE EUX ?<\/div><button class=\"opt\" data-o=\"0\">Hub<\/button><button class=\"opt\" data-o=\"1\">Switch<\/button><button class=\"opt\" data-o=\"2\">Routeur<\/button><button class=\"opt\" data-o=\"3\">Carte réseau<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Avant d&#39;être envoyés, tous les messages sont convertis en…<\/div><button class=\"opt\" data-o=\"0\">Paquets IP<\/button><button class=\"opt\" data-o=\"1\">Bits (signaux numériques codés en binaire)<\/button><button class=\"opt\" data-o=\"2\">Ondes radio<\/button><button class=\"opt\" data-o=\"3\">Trames HTTP<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Les supports de transmission se situent au niveau de la couche…<\/div><button class=\"opt\" data-o=\"0\">Application<\/button><button class=\"opt\" data-o=\"1\">Transport<\/button><button class=\"opt\" data-o=\"2\">Physique<\/button><button class=\"opt\" data-o=\"3\">Réseau<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Lequel n&#39;est PAS un critère de choix d&#39;un support ?<\/div><button class=\"opt\" data-o=\"0\">La distance<\/button><button class=\"opt\" data-o=\"1\">L&#39;environnement<\/button><button class=\"opt\" data-o=\"2\">La couleur du câble<\/button><button class=\"opt\" data-o=\"3\">Le coût<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Ordre correct de la pile web, du haut vers le bas :<\/div><button class=\"opt\" data-o=\"0\">IP → TCP → HTTP → Ethernet<\/button><button class=\"opt\" data-o=\"1\">HTTP → TCP → IP → Ethernet<\/button><button class=\"opt\" data-o=\"2\">Ethernet → IP → TCP → HTTP<\/button><button class=\"opt\" data-o=\"3\">HTTP → IP → TCP → Ethernet<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">La norme 802.11 (WLAN) est publiée par…<\/div><button class=\"opt\" data-o=\"0\">IETF<\/button><button class=\"opt\" data-o=\"1\">IEEE<\/button><button class=\"opt\" data-o=\"2\">ISO uniquement<\/button><button class=\"opt\" data-o=\"3\">Cisco<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Les normes de l&#39;IETF sont publiées sous forme de…<\/div><button class=\"opt\" data-o=\"0\">RFC<\/button><button class=\"opt\" data-o=\"1\">ISO 9001<\/button><button class=\"opt\" data-o=\"2\">Normes 802.x<\/button><button class=\"opt\" data-o=\"3\">Brevets<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"10\"><div class=\"qq-q\">Un switch de 8 ports, un PC sur chaque port : combien de domaines de collision ?<\/div><button class=\"opt\" data-o=\"0\">1<\/button><button class=\"opt\" data-o=\"1\">8<\/button><button class=\"opt\" data-o=\"2\">2<\/button><button class=\"opt\" data-o=\"3\">16<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"11\"><div class=\"qq-q\">Quel équipement sépare les domaines de diffusion ?<\/div><button class=\"opt\" data-o=\"0\">Le hub<\/button><button class=\"opt\" data-o=\"1\">Le switch<\/button><button class=\"opt\" data-o=\"2\">Le routeur<\/button><button class=\"opt\" data-o=\"3\">Le répéteur<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[],"qcm":[{"n":"n7","q":"Lequel ne fait PAS partie des 5 éléments de base d&#39;un réseau ?","o":["Messages","Supports de transmission","Système d&#39;exploitation","Protocoles"],"a":2,"e":"Les 5 éléments : périphériques, nœuds intermédiaires, messages, supports, protocoles."},{"n":"n8","q":"Une imprimante branchée en USB sur un PC du réseau est…","o":["Un hôte","Un périphérique partagé","Un nœud intermédiaire","Un serveur DNS"],"a":1,"e":"Elle n&#39;est pas directement connectée au réseau : elle y accède à travers un hôte."},{"n":"n8","q":"Un hôte qui fournit un service DHCP est un…","o":["Client","Serveur","Concentrateur","Périphérique partagé"],"a":1,"e":"Serveur = hôte qui fournit des données ou des services (DHCP, DNS, Web…)."},{"n":"n9","q":"Selon le cours, quel équipement connecte des segments ENTRE EUX ?","o":["Hub","Switch","Routeur","Carte réseau"],"a":2,"e":"Hub et switch connectent les hôtes d&#39;un même segment ; le routeur relie les segments entre eux."},{"n":"n9","q":"Avant d&#39;être envoyés, tous les messages sont convertis en…","o":["Paquets IP","Bits (signaux numériques codés en binaire)","Ondes radio","Trames HTTP"],"a":1,"e":"Diapo 22 : tous les types de messages sont convertis en bits."},{"n":"n10","q":"Les supports de transmission se situent au niveau de la couche…","o":["Application","Transport","Physique","Réseau"],"a":2,"e":"Le cours le précise explicitement : couche physique."},{"n":"n10","q":"Lequel n&#39;est PAS un critère de choix d&#39;un support ?","o":["La distance","L&#39;environnement","La couleur du câble","Le coût"],"a":2,"e":"Les 4 critères : distance, environnement, quantité de données et débit, coût."},{"n":"n11","q":"Ordre correct de la pile web, du haut vers le bas :","o":["IP → TCP → HTTP → Ethernet","HTTP → TCP → IP → Ethernet","Ethernet → IP → TCP → HTTP","HTTP → IP → TCP → Ethernet"],"a":1,"e":"Application (HTTP), transport (TCP), réseau (IP), accès réseau (Ethernet)."},{"n":"n11","q":"La norme 802.11 (WLAN) est publiée par…","o":["IETF","IEEE","ISO uniquement","Cisco"],"a":1,"e":"IEEE : 802.3 Ethernet, 802.11 WLAN."},{"n":"n11","q":"Les normes de l&#39;IETF sont publiées sous forme de…","o":["RFC","ISO 9001","Normes 802.x","Brevets"],"a":0,"e":"RFC = Request for Comments (TCP, IP, HTTP, FTP)."},{"n":"n43","q":"Un switch de 8 ports, un PC sur chaque port : combien de domaines de collision ?","o":["1","8","2","16"],"a":1,"e":"Un domaine de collision par port de switch. Un hub, lui, n&#39;en formerait qu&#39;un seul."},{"n":"n43","q":"Quel équipement sépare les domaines de diffusion ?","o":["Le hub","Le switch","Le routeur","Le répéteur"],"a":2,"e":"Seul le routeur arrête la diffusion : chaque interface appartient à un domaine de diffusion différent."}]},{"id":"s4","t":"Classification : couverture","seance":"Chapitre 1","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Aucun prérequis technique.<\/p>\n<details class=\"prereq\"><summary><b>Vérifie ton prérequis.<\/b> Le réseau de ta fac est-il plutôt un LAN ou un WAN ?<\/summary><p>Un LAN : il couvre un site. Un WAN relie des sites éloignés, à l'échelle d'un pays ou du monde.<\/p><\/details><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Une seule question classe un réseau : quelle distance couvre-t-il ?<\/strong> Une personne, un bâtiment, une ville, un pays.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Classer selon le nombre de machines. Le critère est l&#39;<strong>étendue géographique<\/strong>, pas la taille du parc.<\/p>\n<\/aside><p>À la fin, tu sais classer un réseau selon sa couverture et donner un exemple de chaque type.<\/p>\n<h2>Le cours<\/h2>\n<p><b>Critères de classification :<\/b> couverture géographique, topologie, architecture (poste-à-poste / client-serveur), technique de transfert, débit, ouverture (privé/public), méthode d'accès (CSMA/CD, CSMA/CA, jeton), QoS.<\/p>\n  <div class=\"table-wrap\"><table><thead><tr><th>Type<\/th><th>Étendue<\/th><th>Caractéristiques et technos<\/th><\/tr><\/thead><tbody>\n  <tr><td><b>PAN<\/b><\/td><td>≈ 1 m²<\/td><td>Réseau personnel, surtout sans fil : Bluetooth, infrarouge (souris, clavier, imprimante)<\/td><\/tr>\n  <tr><td><b>LAN<\/b><\/td><td>Une zone (entreprise, campus)<\/td><td>Même contrôle administratif ; Ethernet ou WLAN ; débits très élevés ; unités adjacentes<\/td><\/tr>\n  <tr><td><b>MAN<\/b><\/td><td>Dizaines de km (une ville)<\/td><td>Interconnecte des LAN proches, souvent en fibre optique ; les machines communiquent comme dans un seul LAN<\/td><\/tr>\n  <tr><td><b>WAN<\/b><\/td><td>LAN séparés géographiquement<\/td><td>PPP, HDLC, relais de trames, ATM, RNIS, MPLS<\/td><\/tr><\/tbody><\/table><\/div>\n  <div class=\"exam\"><b>Ce qui tombe<\/b>Classer des exemples concrets (« agences d'une banque entre deux villes » → WAN) et citer 2 caractéristiques par type.<\/div><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 5 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">CSMA/CD, CSMA/CA et le jeton sont des exemples de critère de classification selon…<\/div><button class=\"opt\" data-o=\"0\">La topologie<\/button><button class=\"opt\" data-o=\"1\">La méthode d&#39;accès<\/button><button class=\"opt\" data-o=\"2\">La couverture géographique<\/button><button class=\"opt\" data-o=\"3\">L&#39;ouverture<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Un casque Bluetooth relié à un téléphone forme un…<\/div><button class=\"opt\" data-o=\"0\">PAN<\/button><button class=\"opt\" data-o=\"1\">LAN<\/button><button class=\"opt\" data-o=\"2\">MAN<\/button><button class=\"opt\" data-o=\"3\">WAN<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Plusieurs LAN répartis dans une même ville et reliés en fibre optique forment un…<\/div><button class=\"opt\" data-o=\"0\">PAN<\/button><button class=\"opt\" data-o=\"1\">LAN<\/button><button class=\"opt\" data-o=\"2\">MAN<\/button><button class=\"opt\" data-o=\"3\">WAN<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Les agences d&#39;une banque entre Béni Mellal et Casablanca sont reliées par un…<\/div><button class=\"opt\" data-o=\"0\">PAN<\/button><button class=\"opt\" data-o=\"1\">LAN<\/button><button class=\"opt\" data-o=\"2\">MAN<\/button><button class=\"opt\" data-o=\"3\">WAN<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Laquelle de ces technologies est une technologie WAN citée dans le cours ?<\/div><button class=\"opt\" data-o=\"0\">Bluetooth<\/button><button class=\"opt\" data-o=\"1\">MPLS<\/button><button class=\"opt\" data-o=\"2\">Wi-Fi 802.11<\/button><button class=\"opt\" data-o=\"3\">Infrarouge<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Un LAN est caractérisé par…<\/div><button class=\"opt\" data-o=\"0\">Une administration partagée entre plusieurs opérateurs<\/button><button class=\"opt\" data-o=\"1\">Un même contrôle administratif et des débits très élevés<\/button><button class=\"opt\" data-o=\"2\">Des débits faibles et des liaisons satellites<\/button><button class=\"opt\" data-o=\"3\">Une couverture mondiale<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[],"qcm":[{"n":"n12","q":"CSMA/CD, CSMA/CA et le jeton sont des exemples de critère de classification selon…","o":["La topologie","La méthode d&#39;accès","La couverture géographique","L&#39;ouverture"],"a":1,"e":"Ce sont des méthodes d&#39;accès au support."},{"n":"n13","q":"Un casque Bluetooth relié à un téléphone forme un…","o":["PAN","LAN","MAN","WAN"],"a":0,"e":"PAN : faible portée (environ 1 m²), Bluetooth ou infrarouge."},{"n":"n13","q":"Plusieurs LAN répartis dans une même ville et reliés en fibre optique forment un…","o":["PAN","LAN","MAN","WAN"],"a":2,"e":"MAN : quelques dizaines de km, une ville, souvent en fibre."},{"n":"n13","q":"Les agences d&#39;une banque entre Béni Mellal et Casablanca sont reliées par un…","o":["PAN","LAN","MAN","WAN"],"a":3,"e":"Des LAN séparés géographiquement (villes différentes) sont reliés par un WAN."},{"n":"n13","q":"Laquelle de ces technologies est une technologie WAN citée dans le cours ?","o":["Bluetooth","MPLS","Wi-Fi 802.11","Infrarouge"],"a":1,"e":"Technologies WAN : PPP, HDLC, relais de trames, ATM, RNIS, MPLS."},{"n":"n13","q":"Un LAN est caractérisé par…","o":["Une administration partagée entre plusieurs opérateurs","Un même contrôle administratif et des débits très élevés","Des débits faibles et des liaisons satellites","Une couverture mondiale"],"a":1,"e":"LAN : zone unique, même contrôle administratif, Ethernet/WLAN, débits très élevés."}]},{"id":"s5","t":"Topologies","seance":"Chapitre 1","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Les mots « nœud » (un appareil) et « lien » (ce qui relie deux appareils).<\/p>\n<details class=\"prereq\"><summary><b>Vérifie ton prérequis.<\/b> Pour relier 4 machines, chacune directement à toutes les autres, combien de liens faut-il ?<\/summary><p>6. Pour n machines : n × (n − 1) / 2 liens.<\/p><\/details><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Dessine.<\/strong> Une topologie est un dessin : bus, anneau, étoile, maillage. Pour chacune, pose la même question : que se passe-t-il si un lien ou le centre tombe ?<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Confondre les deux topologies. Dans ce cours, la topologie <strong>logique<\/strong> décrit les périphériques, les ports et l&#39;adressage IP ; la topologie <strong>physique<\/strong> décrit l&#39;emplacement des équipements et des câbles.<\/p>\n<\/aside><p>À la fin, tu sais reconnaître une topologie, donner ses avantages et calculer le nombre de liens d&#39;un maillage.<\/p>\n<h2>Le cours<\/h2>\n<p><b>Topologie logique :<\/b> périphériques, ports et schéma d'adressage IP. <b>Topologie physique :<\/b> emplacement physique des périphériques, des ports configurés et des câbles.<\/p>\n  <div class=\"topos\">\n   <div class=\"topo\"><svg viewBox=\"0 0 150 104\" role=\"img\" aria-label=\"Topologie bus\"><line class=\"ln\" x1=\"10\" y1=\"50\" x2=\"140\" y2=\"50\"/><line class=\"ln\" x1=\"25\" y1=\"50\" x2=\"25\" y2=\"25\"/><circle class=\"nd\" cx=\"25\" cy=\"25\" r=\"7\"/><line class=\"ln\" x1=\"55\" y1=\"50\" x2=\"55\" y2=\"75\"/><circle class=\"nd\" cx=\"55\" cy=\"75\" r=\"7\"/><line class=\"ln\" x1=\"85\" y1=\"50\" x2=\"85\" y2=\"25\"/><circle class=\"nd\" cx=\"85\" cy=\"25\" r=\"7\"/><line class=\"ln\" x1=\"115\" y1=\"50\" x2=\"115\" y2=\"75\"/><circle class=\"nd\" cx=\"115\" cy=\"75\" r=\"7\"/><line class=\"ln\" x1=\"135\" y1=\"50\" x2=\"135\" y2=\"25\"/><circle class=\"nd\" cx=\"135\" cy=\"25\" r=\"7\"/><\/svg><b>Bus<\/b>Une ligne commune, souvent en coaxial. Simple, mais si le câble se rompt, tout tombe.<\/div>\n   <div class=\"topo\"><svg viewBox=\"0 0 150 104\" role=\"img\" aria-label=\"Topologie anneau\"><circle class=\"ln\" cx=\"75\" cy=\"50\" r=\"38\"/><circle class=\"nd\" cx=\"75\" cy=\"12\" r=\"7\"/><circle class=\"nd\" cx=\"107.90896534380866\" cy=\"31\" r=\"7\"/><circle class=\"nd\" cx=\"107.90896534380867\" cy=\"69\" r=\"7\"/><circle class=\"nd\" cx=\"75\" cy=\"88\" r=\"7\"/><circle class=\"nd\" cx=\"42.09103465619134\" cy=\"69.00000000000001\" r=\"7\"/><circle class=\"nd\" cx=\"42.09103465619133\" cy=\"30.999999999999996\" r=\"7\"/><path class=\"ln\" d=\"M100 18 l8 2 l-4 7\" /><\/svg><b>Anneau<\/b>Sens unique, jeton (Token Ring). Le FDDI est un double anneau pour la tolérance aux pannes.<\/div>\n   <div class=\"topo\"><svg viewBox=\"0 0 150 104\" role=\"img\" aria-label=\"Topologie etoile\"><line class=\"ln\" x1=\"75\" y1=\"50\" x2=\"115\" y2=\"50\"/><circle class=\"nd\" cx=\"115\" cy=\"50\" r=\"7\"/><line class=\"ln\" x1=\"75\" y1=\"50\" x2=\"95\" y2=\"82.90896534380866\"/><circle class=\"nd\" cx=\"95\" cy=\"82.90896534380866\" r=\"7\"/><line class=\"ln\" x1=\"75\" y1=\"50\" x2=\"55.00000000000001\" y2=\"82.90896534380867\"/><circle class=\"nd\" cx=\"55.00000000000001\" cy=\"82.90896534380867\" r=\"7\"/><line class=\"ln\" x1=\"75\" y1=\"50\" x2=\"35\" y2=\"50.00000000000001\"/><circle class=\"nd\" cx=\"35\" cy=\"50.00000000000001\" r=\"7\"/><line class=\"ln\" x1=\"75\" y1=\"50\" x2=\"54.999999999999986\" y2=\"17.09103465619134\"/><circle class=\"nd\" cx=\"54.999999999999986\" cy=\"17.09103465619134\" r=\"7\"/><line class=\"ln\" x1=\"75\" y1=\"50\" x2=\"95\" y2=\"17.091034656191333\"/><circle class=\"nd\" cx=\"95\" cy=\"17.091034656191333\" r=\"7\"/><rect class=\"hub\" x=\"66\" y=\"42\" width=\"18\" height=\"16\" rx=\"3\"/><\/svg><b>Étoile<\/b>Hub/switch central. Un nœud en panne n'affecte rien ; si le centre tombe, tout tombe.<\/div>\n   <div class=\"topo\"><svg viewBox=\"0 0 150 104\" role=\"img\" aria-label=\"Topologie etendue\"><line class=\"ln\" x1=\"75\" y1=\"62\" x2=\"35\" y2=\"50\"/><line class=\"ln\" x1=\"35\" y1=\"50\" x2=\"52.551651237807455\" y2=\"59.588510772084064\"/><circle class=\"nd\" cx=\"52.551651237807455\" cy=\"59.588510772084064\" r=\"5\"/><line class=\"ln\" x1=\"35\" y1=\"50\" x2=\"17.862224932621054\" y2=\"60.31002743642928\"/><circle class=\"nd\" cx=\"17.862224932621054\" cy=\"60.31002743642928\" r=\"5\"/><line class=\"ln\" x1=\"35\" y1=\"50\" x2=\"34.75222673074219\" y2=\"30.001534848717984\"/><circle class=\"nd\" cx=\"34.75222673074219\" cy=\"30.001534848717984\" r=\"5\"/><rect class=\"hub\" x=\"28\" y=\"44\" width=\"14\" height=\"12\" rx=\"2\"/><line class=\"ln\" x1=\"75\" y1=\"62\" x2=\"115\" y2=\"50\"/><line class=\"ln\" x1=\"115\" y1=\"50\" x2=\"132.55165123780745\" y2=\"59.588510772084064\"/><circle class=\"nd\" cx=\"132.55165123780745\" cy=\"59.588510772084064\" r=\"5\"/><line class=\"ln\" x1=\"115\" y1=\"50\" x2=\"97.86222493262105\" y2=\"60.31002743642928\"/><circle class=\"nd\" cx=\"97.86222493262105\" cy=\"60.31002743642928\" r=\"5\"/><line class=\"ln\" x1=\"115\" y1=\"50\" x2=\"114.7522267307422\" y2=\"30.001534848717984\"/><circle class=\"nd\" cx=\"114.7522267307422\" cy=\"30.001534848717984\" r=\"5\"/><rect class=\"hub\" x=\"108\" y=\"44\" width=\"14\" height=\"12\" rx=\"2\"/><line class=\"ln\" x1=\"75\" y1=\"62\" x2=\"75\" y2=\"20\"/><line class=\"ln\" x1=\"75\" y1=\"20\" x2=\"92.55165123780745\" y2=\"29.58851077208406\"/><circle class=\"nd\" cx=\"92.55165123780745\" cy=\"29.58851077208406\" r=\"5\"/><line class=\"ln\" x1=\"75\" y1=\"20\" x2=\"57.862224932621054\" y2=\"30.310027436429284\"/><circle class=\"nd\" cx=\"57.862224932621054\" cy=\"30.310027436429284\" r=\"5\"/><line class=\"ln\" x1=\"75\" y1=\"20\" x2=\"74.7522267307422\" y2=\"0.0015348487179842607\"/><circle class=\"nd\" cx=\"74.7522267307422\" cy=\"0.0015348487179842607\" r=\"5\"/><rect class=\"hub\" x=\"68\" y=\"14\" width=\"14\" height=\"12\" rx=\"2\"/><circle class=\"rt\" cx=\"75\" cy=\"68\" r=\"9\"/><\/svg><b>Étoile étendue<\/b>Des étoiles reliées par un routeur central. C'est la plus utilisée.<\/div>\n   <div class=\"topo\"><svg viewBox=\"0 0 150 104\" role=\"img\" aria-label=\"Topologie maille\"><line class=\"ln\" x1=\"75\" y1=\"14\" x2=\"111.14014761921584\" y2=\"40.257354213751995\"/><line class=\"ln\" x1=\"75\" y1=\"14\" x2=\"97.33583958711398\" y2=\"82.742645786248\"/><line class=\"ln\" x1=\"75\" y1=\"14\" x2=\"52.66416041288603\" y2=\"82.742645786248\"/><line class=\"ln\" x1=\"75\" y1=\"14\" x2=\"38.85985238078416\" y2=\"40.257354213752\"/><line class=\"ln\" x1=\"111.14014761921584\" y1=\"40.257354213751995\" x2=\"97.33583958711398\" y2=\"82.742645786248\"/><line class=\"ln\" x1=\"111.14014761921584\" y1=\"40.257354213751995\" x2=\"52.66416041288603\" y2=\"82.742645786248\"/><line class=\"ln\" x1=\"111.14014761921584\" y1=\"40.257354213751995\" x2=\"38.85985238078416\" y2=\"40.257354213752\"/><line class=\"ln\" x1=\"97.33583958711398\" y1=\"82.742645786248\" x2=\"52.66416041288603\" y2=\"82.742645786248\"/><line class=\"ln\" x1=\"97.33583958711398\" y1=\"82.742645786248\" x2=\"38.85985238078416\" y2=\"40.257354213752\"/><line class=\"ln\" x1=\"52.66416041288603\" y1=\"82.742645786248\" x2=\"38.85985238078416\" y2=\"40.257354213752\"/><circle class=\"nd\" cx=\"75\" cy=\"14\" r=\"7\"/><circle class=\"nd\" cx=\"111.14014761921584\" cy=\"40.257354213751995\" r=\"7\"/><circle class=\"nd\" cx=\"97.33583958711398\" cy=\"82.742645786248\" r=\"7\"/><circle class=\"nd\" cx=\"52.66416041288603\" cy=\"82.742645786248\" r=\"7\"/><circle class=\"nd\" cx=\"38.85985238078416\" cy=\"40.257354213752\" r=\"7\"/><\/svg><b>Maillée<\/b>Chaque hôte relié à tous les autres. Aucune coupure tolérée, mais beaucoup de câbles.<\/div>\n   <div class=\"topo\"><svg viewBox=\"0 0 150 104\" role=\"img\" aria-label=\"Topologie hier\"><line class=\"ln\" x1=\"75\" y1=\"14\" x2=\"40\" y2=\"48\"/><line class=\"ln\" x1=\"75\" y1=\"14\" x2=\"110\" y2=\"48\"/><line class=\"ln\" x1=\"40\" y1=\"48\" x2=\"20\" y2=\"84\"/><line class=\"ln\" x1=\"40\" y1=\"48\" x2=\"60\" y2=\"84\"/><circle class=\"nd\" cx=\"20\" cy=\"84\" r=\"7\"/><circle class=\"nd\" cx=\"60\" cy=\"84\" r=\"7\"/><rect class=\"hub\" x=\"32\" y=\"41\" width=\"16\" height=\"14\" rx=\"2\"/><line class=\"ln\" x1=\"110\" y1=\"48\" x2=\"90\" y2=\"84\"/><line class=\"ln\" x1=\"110\" y1=\"48\" x2=\"130\" y2=\"84\"/><circle class=\"nd\" cx=\"90\" cy=\"84\" r=\"7\"/><circle class=\"nd\" cx=\"130\" cy=\"84\" r=\"7\"/><rect class=\"hub\" x=\"102\" y=\"41\" width=\"16\" height=\"14\" rx=\"2\"/><circle class=\"rt\" cx=\"75\" cy=\"14\" r=\"9\"/><text class=\"tx\" x=\"92\" y=\"18\">cœur<\/text><text class=\"tx\" x=\"2\" y=\"38\">distrib.<\/text><text class=\"tx\" x=\"2\" y=\"100\">accès<\/text><\/svg><b>Hiérarchique<\/b>Modèle Cisco à 3 couches : cœur, distribution, accès. Modulable, administration simple.<\/div>\n  <\/div>\n  <div class=\"formula\">Maillage complet : nombre de liaisons = N × (N − 1) / 2\n  N = 5  → 10      N = 10 → 45      N = 20 → 190<\/div>\n  <div class=\"trap\"><b>Piège<\/b>N(N−1) sans la division par 2 compte chaque câble deux fois. Pour retrouver N à partir du nombre de liaisons L : cherche deux entiers consécutifs dont le produit vaut 2L.<\/div><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 9 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Le schéma d&#39;adressage IP apparaît sur la topologie…<\/div><button class=\"opt\" data-o=\"0\">Physique<\/button><button class=\"opt\" data-o=\"1\">Logique<\/button><button class=\"opt\" data-o=\"2\">En bus<\/button><button class=\"opt\" data-o=\"3\">Hiérarchique<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Dans une topologie en bus, si le câble commun se rompt…<\/div><button class=\"opt\" data-o=\"0\">Seule la machine voisine est touchée<\/button><button class=\"opt\" data-o=\"1\">Tout le réseau tombe en panne<\/button><button class=\"opt\" data-o=\"2\">Le jeton est régénéré<\/button><button class=\"opt\" data-o=\"3\">Le second anneau prend le relais<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Dans une topologie en étoile, si le nœud central tombe…<\/div><button class=\"opt\" data-o=\"0\">Rien ne se passe<\/button><button class=\"opt\" data-o=\"1\">Seul un hôte est isolé<\/button><button class=\"opt\" data-o=\"2\">Tout le réseau devient inutilisable<\/button><button class=\"opt\" data-o=\"3\">Le trafic passe par le bus<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Le FDDI est…<\/div><button class=\"opt\" data-o=\"0\">Un anneau simple<\/button><button class=\"opt\" data-o=\"1\">Un double anneau qui assure la tolérance aux pannes<\/button><button class=\"opt\" data-o=\"2\">Une étoile étendue<\/button><button class=\"opt\" data-o=\"3\">Un protocole WAN<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Selon le cours, la topologie la plus couramment utilisée est…<\/div><button class=\"opt\" data-o=\"0\">Bus<\/button><button class=\"opt\" data-o=\"1\">Anneau<\/button><button class=\"opt\" data-o=\"2\">Étoile étendue<\/button><button class=\"opt\" data-o=\"3\">Maillée<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Les 3 couches du modèle hiérarchique de Cisco sont…<\/div><button class=\"opt\" data-o=\"0\">Physique, liaison, réseau<\/button><button class=\"opt\" data-o=\"1\">Cœur, distribution, accès<\/button><button class=\"opt\" data-o=\"2\">Client, serveur, routeur<\/button><button class=\"opt\" data-o=\"3\">Accès, transport, application<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Dans un anneau Token Ring, les données circulent…<\/div><button class=\"opt\" data-o=\"0\">Dans les deux sens simultanément<\/button><button class=\"opt\" data-o=\"1\">Dans un sens unique, grâce à un jeton<\/button><button class=\"opt\" data-o=\"2\">Par diffusion à tous les hôtes<\/button><button class=\"opt\" data-o=\"3\">Via un hub central<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Combien de liaisons pour un maillage complet de 8 terminaux ?<\/div><button class=\"opt\" data-o=\"0\">56<\/button><button class=\"opt\" data-o=\"1\">28<\/button><button class=\"opt\" data-o=\"2\">64<\/button><button class=\"opt\" data-o=\"3\">16<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Un maillage complet compte 66 liaisons. Combien de terminaux ?<\/div><button class=\"opt\" data-o=\"0\">11<\/button><button class=\"opt\" data-o=\"1\">12<\/button><button class=\"opt\" data-o=\"2\">33<\/button><button class=\"opt\" data-o=\"3\">13<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">La topologie maillée est surtout utilisée…<\/div><button class=\"opt\" data-o=\"0\">Dans les petits bureaux pour réduire les coûts<\/button><button class=\"opt\" data-o=\"1\">Là où aucune rupture de communication n&#39;est tolérée<\/button><button class=\"opt\" data-o=\"2\">Pour les réseaux personnels<\/button><button class=\"opt\" data-o=\"3\">Uniquement en Wi-Fi<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[],"qcm":[{"n":"n14","q":"Le schéma d&#39;adressage IP apparaît sur la topologie…","o":["Physique","Logique","En bus","Hiérarchique"],"a":1,"e":"Topologie logique : périphériques, ports et adressage IP. Topologie physique : emplacements et câbles."},{"n":"n15","q":"Dans une topologie en bus, si le câble commun se rompt…","o":["Seule la machine voisine est touchée","Tout le réseau tombe en panne","Le jeton est régénéré","Le second anneau prend le relais"],"a":1,"e":"C&#39;est la faiblesse principale du bus."},{"n":"n15","q":"Dans une topologie en étoile, si le nœud central tombe…","o":["Rien ne se passe","Seul un hôte est isolé","Tout le réseau devient inutilisable","Le trafic passe par le bus"],"a":2,"e":"Inconvénient principal de l&#39;étoile. En revanche, un nœud périphérique en panne n&#39;affecte pas le reste."},{"n":"n15","q":"Le FDDI est…","o":["Un anneau simple","Un double anneau qui assure la tolérance aux pannes","Une étoile étendue","Un protocole WAN"],"a":1,"e":"FDDI : paire d&#39;anneaux ; le second permet la tolérance de panne du premier."},{"n":"n15","q":"Selon le cours, la topologie la plus couramment utilisée est…","o":["Bus","Anneau","Étoile étendue","Maillée"],"a":2,"e":"Diapo 41 : l&#39;étoile étendue est la plus couramment utilisée."},{"n":"n15","q":"Les 3 couches du modèle hiérarchique de Cisco sont…","o":["Physique, liaison, réseau","Cœur, distribution, accès","Client, serveur, routeur","Accès, transport, application"],"a":1,"e":"Cœur, distribution, accès."},{"n":"n15","q":"Dans un anneau Token Ring, les données circulent…","o":["Dans les deux sens simultanément","Dans un sens unique, grâce à un jeton","Par diffusion à tous les hôtes","Via un hub central"],"a":1,"e":"Chaque hôte passe les données à son voisin dans un sens unique ; un jeton circule."},{"n":"n16","q":"Combien de liaisons pour un maillage complet de 8 terminaux ?","o":["56","28","64","16"],"a":1,"e":"8 × 7 / 2 = 28. Le piège : 56 = N(N−1), sans diviser par 2."},{"n":"n16","q":"Un maillage complet compte 66 liaisons. Combien de terminaux ?","o":["11","12","33","13"],"a":1,"e":"N(N−1)/2 = 66 donne N(N−1) = 132 = 12 × 11, donc N = 12."},{"n":"n16","q":"La topologie maillée est surtout utilisée…","o":["Dans les petits bureaux pour réduire les coûts","Là où aucune rupture de communication n&#39;est tolérée","Pour les réseaux personnels","Uniquement en Wi-Fi"],"a":1,"e":"Exemples du cours : centrales nucléaires, routeurs qui assurent la connexion Internet."}]},{"id":"s6","t":"Architecture et transfert","seance":"Chapitre 1","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>L&#39;idée de chemin entre deux machines, vue avec les topologies.<\/p>\n<details class=\"prereq\"><summary><b>Vérifie ton prérequis.<\/b> Un appel téléphonique classique réserve-t-il une ligne pendant toute la conversation ?<\/summary><p>Oui. C'est la commutation de circuits : le chemin est dédié, même pendant les silences.<\/p><\/details><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Circuit ou colis.<\/strong> En commutation de circuits, on réserve une route entière. En commutation de paquets, le message part en colis qui prennent chacun la route disponible.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Croire que le circuit est toujours meilleur parce qu&#39;il est garanti. Il utilise mal le support et n&#39;offre aucune redondance ; les paquets font l&#39;inverse.<\/p>\n<\/aside><p>À la fin, tu sais citer les quatre caractéristiques d&#39;une architecture réseau et comparer les deux commutations.<\/p>\n<h2>Le cours<\/h2>\n<p><b>Les 4 caractéristiques d'une architecture réseau :<\/b> tolérance aux pannes, évolutivité, qualité de service (QoS), sécurité.<\/p>\n  <div class=\"table-wrap\"><table><thead><tr><th>Commutation de circuits<\/th><th>Commutation de paquets<\/th><\/tr><\/thead><tbody>\n  <tr><td>Circuit dédié<\/td><td>Circuit partagé<\/td><\/tr>\n  <tr><td>Service garanti (bande passante), QoS<\/td><td>Messages divisés en paquets<\/td><\/tr>\n  <tr><td>Utilisation inefficace du support<\/td><td>Utilisation efficace du support<\/td><\/tr>\n  <tr><td>Chemin unique, pas de redondance<\/td><td>Redondance, plusieurs chemins possibles<\/td><\/tr><\/tbody><\/table><\/div><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 3 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Laquelle n&#39;est PAS une des 4 caractéristiques d&#39;une architecture réseau ?<\/div><button class=\"opt\" data-o=\"0\">Tolérance aux pannes<\/button><button class=\"opt\" data-o=\"1\">Évolutivité<\/button><button class=\"opt\" data-o=\"2\">QoS<\/button><button class=\"opt\" data-o=\"3\">Topologie en bus<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">La commutation de circuits…<\/div><button class=\"opt\" data-o=\"0\">Partage le circuit entre plusieurs utilisateurs<\/button><button class=\"opt\" data-o=\"1\">Garantit la bande passante grâce à un circuit dédié<\/button><button class=\"opt\" data-o=\"2\">Utilise efficacement le support<\/button><button class=\"opt\" data-o=\"3\">Offre plusieurs chemins<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">La commutation de paquets…<\/div><button class=\"opt\" data-o=\"0\">Utilise un chemin unique sans redondance<\/button><button class=\"opt\" data-o=\"1\">Divise les messages en paquets et utilise efficacement le support<\/button><button class=\"opt\" data-o=\"2\">Réserve un circuit dédié<\/button><button class=\"opt\" data-o=\"3\">Garantit toujours la QoS<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[],"qcm":[{"n":"n17","q":"Laquelle n&#39;est PAS une des 4 caractéristiques d&#39;une architecture réseau ?","o":["Tolérance aux pannes","Évolutivité","QoS","Topologie en bus"],"a":3,"e":"Les 4 : tolérance aux pannes, évolutivité, QoS, sécurité."},{"n":"n18","q":"La commutation de circuits…","o":["Partage le circuit entre plusieurs utilisateurs","Garantit la bande passante grâce à un circuit dédié","Utilise efficacement le support","Offre plusieurs chemins"],"a":1,"e":"Circuits : circuit dédié, service garanti (QoS), support mal utilisé, chemin unique."},{"n":"n18","q":"La commutation de paquets…","o":["Utilise un chemin unique sans redondance","Divise les messages en paquets et utilise efficacement le support","Réserve un circuit dédié","Garantit toujours la QoS"],"a":1,"e":"Paquets : circuit partagé, messages en paquets, utilisation efficace, plusieurs chemins possibles."}]},{"id":"s7","t":"Le réseau Internet","seance":"Chapitre 1","imp":2,"html":"<h2>Avant de commencer<\/h2>\n<p>Les types de réseaux selon leur couverture (LAN, WAN).<\/p>\n<details class=\"prereq\"><summary><b>Vérifie ton prérequis.<\/b> Sur quelle pile de protocoles repose Internet ?<\/summary><p>TCP/IP. C'est ce langage commun qui permet à des réseaux très différents de communiquer.<\/p><\/details><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Internet n&#39;est pas un réseau, c&#39;est un réseau de réseaux.<\/strong> Des réseaux locaux, régionaux et internationaux, reliés entre eux et qui parlent tous TCP/IP.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Confondre Internet et le Web. Le Web est un service parmi d&#39;autres (messagerie, transfert de fichiers…) qui circule sur Internet.<\/p>\n<\/aside><p>À la fin, tu sais définir Internet et citer ses quatre types d&#39;applications et de services.<\/p>\n<h2>Le cours<\/h2>\n<p>Réseau mondial des réseaux qui interconnecte des réseaux internationaux, régionaux et locaux, tous basés sur la pile <b>TCP/IP<\/b>. C'est un enchevêtrement de réseaux, de protocoles (TCP, IP, HTTP, FTP, SMTP), d'applications et de services.<\/p>\n  <p><b>4 types d'applications et de services :<\/b> messagerie (individuelle, collective, forums) ; traitement informatique (connexion à distance comme le VPN, transfert de fichiers FTP) ; publication et information (Web) ; communication directe (chat, visio, peer-to-peer). Ces applications, longtemps distinctes, sont aujourd'hui fusionnées sur le Web.<\/p><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 2 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Internet repose sur la pile de protocoles…<\/div><button class=\"opt\" data-o=\"0\">OSI uniquement<\/button><button class=\"opt\" data-o=\"1\">TCP/IP<\/button><button class=\"opt\" data-o=\"2\">IPX/SPX<\/button><button class=\"opt\" data-o=\"3\">Token Ring<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Un VPN entre dans la catégorie des services…<\/div><button class=\"opt\" data-o=\"0\">De messagerie<\/button><button class=\"opt\" data-o=\"1\">De traitement informatique (connexion à distance)<\/button><button class=\"opt\" data-o=\"2\">De publication (Web)<\/button><button class=\"opt\" data-o=\"3\">De communication directe<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[],"qcm":[{"n":"n19","q":"Internet repose sur la pile de protocoles…","o":["OSI uniquement","TCP/IP","IPX/SPX","Token Ring"],"a":1,"e":"Réseau des réseaux, tous basés sur TCP/IP."},{"n":"n19","q":"Un VPN entre dans la catégorie des services…","o":["De messagerie","De traitement informatique (connexion à distance)","De publication (Web)","De communication directe"],"a":1,"e":"Traitement informatique : connexion à distance (VPN), transfert de fichiers (FTP)."}]},{"id":"s8","t":"Bande passante, débit, temps","seance":"Chapitre 1","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Les conversions entre bits et octets : 1 octet = 8 bits.<\/p>\n<details class=\"prereq\"><summary><b>Vérifie ton prérequis.<\/b> Avec la convention du cours, combien de bits y a-t-il dans 1 Ko ?<\/summary><p>1 Ko = 1024 octets = 1024 × 8 = 8 192 bits. Les tailles de fichier se comptent en binaire.<\/p><\/details><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Une seule formule : T = taille en bits / débit en bits par seconde.<\/strong> Toute la difficulté est dans les conversions, jamais dans la formule.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Mélanger les deux systèmes. Dans ce cours, les <strong>tailles<\/strong> sont en binaire (× 1024) et les <strong>débits<\/strong> en décimal (1 Mbit/s = 1 000 000 bit/s).<\/p>\n<\/aside><p>À la fin, tu sais calculer un temps de téléchargement sans te tromper d&#39;unité.<\/p>\n<h2>Le cours<\/h2>\n<div class=\"def\"><b>Bande passante (débit nominal)<\/b>Capacité du réseau : la quantité de données qui peut circuler par unité de temps, en bits par seconde. Elle est limitée, elle a un coût, c'est une mesure clé de la conception et des performances, et la demande augmente sans cesse.<\/div>\n  <div class=\"table-wrap\"><table><thead><tr><th>Unité<\/th><th>Équivalence (décimal)<\/th><\/tr><\/thead><tbody>\n  <tr><td>kbit/s<\/td><td class=\"num\">1 000 bit/s = 10³<\/td><\/tr><tr><td>Mbit/s<\/td><td class=\"num\">1 000 000 bit/s = 10⁶<\/td><\/tr><tr><td>Gbit/s<\/td><td class=\"num\">1 000 000 000 bit/s = 10⁹<\/td><\/tr><\/tbody><\/table><\/div>\n  <p><b>Débit :<\/b> la bande passante réelle, mesurée à un instant précis, souvent inférieure à la bande passante. Il dépend de la machine du client, du serveur, des autres utilisateurs, de la topologie, du nombre d'utilisateurs, des nœuds et de leur charge, du type de données et des pannes.<\/p>\n  <ul><li><b>Débit physique (effectif) :<\/b> bits émis par seconde sur le support. Il dépend du médium, du codage et de la fréquence. Ethernet : 10 / 100 / 1000 Mbit/s, 10 Gbit/s.<\/li>\n  <li><b>Débit applicatif (utile) :<\/b> bits de données utiles par seconde au niveau des applications, une fois retirées les informations ajoutées par les couches 2, 3, 4.<\/li><\/ul>\n  <div class=\"exam\"><b>À retenir<\/b>Débit physique &gt; débit applicatif, car le physique est le maximum que l'applicatif peut atteindre.<\/div>\n  <h3>Temps de téléchargement<\/h3>\n  <div class=\"formula\">T théorique = taille du fichier (bits) / bande passante (bits/s)\nT réel      = taille du fichier (bits) / débit réel au moment du transfert (bits/s)<\/div>\n  <div class=\"formula\">Exemple du cours : 1 Go à 3 Mbit/s\n  Taille = 1 × 1024 × 1024 × 1024 × 8 = 8 589 934 592 bits\n  BP     = 3 × 1000 × 1000          = 3 000 000 bits/s\n  T      = 8 589 934 592 / 3 000 000 ≈ 2 863 s = 47 min 43 s\n\nExemple du cours : 1 Go avec un débit réel de 512 kbit/s\n  T = 8 589 934 592 / 512 000 ≈ 16 777 s = 4 h 39 min 37 s<\/div>\n  <div class=\"trap\"><b>Pièges<\/b>① La TAILLE est en binaire (×1024), les DÉBITS sont en décimal (×1000) : c'est la convention du prof, applique-la à l'examen. ② Octet (o, B) = 8 bits (b) : oublier le ×8 est l'erreur n°1. ③ La diapo 54 écrit « 512 Mbit/s », mais le calcul utilise bien 512 <b>k<\/b>bit/s : c'est une coquille. ④ Convertis toujours les secondes en h/min/s à la fin. ⑤ Si l'énoncé donne la taille en « millions d'octets » (TD, ex. 1), c'est du décimal : 4 millions d'octets = 4 000 000 o, sans 1024.<\/div><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 9 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Le débit (réel) est généralement…<\/div><button class=\"opt\" data-o=\"0\">Supérieur à la bande passante<\/button><button class=\"opt\" data-o=\"1\">Égal à la bande passante<\/button><button class=\"opt\" data-o=\"2\">Inférieur à la bande passante<\/button><button class=\"opt\" data-o=\"3\">Sans lien avec la bande passante<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Pourquoi le débit applicatif est-il inférieur au débit physique ?<\/div><button class=\"opt\" data-o=\"0\">Parce que les câbles s&#39;usent<\/button><button class=\"opt\" data-o=\"1\">Parce que les couches 2, 3, 4… ajoutent des informations (en-têtes) aux données<\/button><button class=\"opt\" data-o=\"2\">Parce que l&#39;application compresse les données<\/button><button class=\"opt\" data-o=\"3\">Ce n&#39;est pas le cas<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">1 Mbit/s vaut, selon le cours…<\/div><button class=\"opt\" data-o=\"0\">1 048 576 bit/s<\/button><button class=\"opt\" data-o=\"1\">1 000 000 bit/s<\/button><button class=\"opt\" data-o=\"2\">8 000 000 bit/s<\/button><button class=\"opt\" data-o=\"3\">1 024 000 bit/s<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Lequel n&#39;influence PAS le débit selon le cours ?<\/div><button class=\"opt\" data-o=\"0\">Le nombre d&#39;utilisateurs<\/button><button class=\"opt\" data-o=\"1\">La topologie<\/button><button class=\"opt\" data-o=\"2\">Le type de données transmises<\/button><button class=\"opt\" data-o=\"3\">La couleur de la carte réseau<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">1 Go en bits (convention du prof) =<\/div><button class=\"opt\" data-o=\"0\">8 000 000 000<\/button><button class=\"opt\" data-o=\"1\">8 589 934 592<\/button><button class=\"opt\" data-o=\"2\">1 073 741 824<\/button><button class=\"opt\" data-o=\"3\">1 000 000 000<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Temps théorique pour 500 Mo à 8 Mbit/s ?<\/div><button class=\"opt\" data-o=\"0\">62,5 s<\/button><button class=\"opt\" data-o=\"1\">524,3 s ≈ 8 min 44 s<\/button><button class=\"opt\" data-o=\"2\">500 s<\/button><button class=\"opt\" data-o=\"3\">4 194 s<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Temps réel pour 2 Go à un débit réel de 20 Mbit/s ?<\/div><button class=\"opt\" data-o=\"0\">≈ 859 s ≈ 14 min 19 s<\/button><button class=\"opt\" data-o=\"1\">800 s<\/button><button class=\"opt\" data-o=\"2\">≈ 107 s<\/button><button class=\"opt\" data-o=\"3\">≈ 1 718 s<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Pour le TEMPS RÉEL, on divise la taille par…<\/div><button class=\"opt\" data-o=\"0\">La bande passante<\/button><button class=\"opt\" data-o=\"1\">Le débit réel au moment du transfert<\/button><button class=\"opt\" data-o=\"2\">Le débit physique Ethernet<\/button><button class=\"opt\" data-o=\"3\">La taille du segment<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">(TD) Fichier de 4 millions d&#39;octets, lien de 500 kbps. Durée du transfert ?<\/div><button class=\"opt\" data-o=\"0\">8 s<\/button><button class=\"opt\" data-o=\"1\">64 s<\/button><button class=\"opt\" data-o=\"2\">62,5 s<\/button><button class=\"opt\" data-o=\"3\">512 s<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">(TD) 2 Go avec une bande passante de 5 Mbit/s : temps théorique ?<\/div><button class=\"opt\" data-o=\"0\">3 200 s<\/button><button class=\"opt\" data-o=\"1\">≈ 3 436 s ≈ 57 min 16 s<\/button><button class=\"opt\" data-o=\"2\">≈ 429 s<\/button><button class=\"opt\" data-o=\"3\">≈ 27 488 s<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[],"qcm":[{"n":"n20","q":"Le débit (réel) est généralement…","o":["Supérieur à la bande passante","Égal à la bande passante","Inférieur à la bande passante","Sans lien avec la bande passante"],"a":2,"e":"La bande passante est le maximum du média ; le débit mesuré est généralement plus faible."},{"n":"n20","q":"Pourquoi le débit applicatif est-il inférieur au débit physique ?","o":["Parce que les câbles s&#39;usent","Parce que les couches 2, 3, 4… ajoutent des informations (en-têtes) aux données","Parce que l&#39;application compresse les données","Ce n&#39;est pas le cas"],"a":1,"e":"Le débit physique est le maximum ; les en-têtes des couches et la charge réduisent le débit utile."},{"n":"n20","q":"1 Mbit/s vaut, selon le cours…","o":["1 048 576 bit/s","1 000 000 bit/s","8 000 000 bit/s","1 024 000 bit/s"],"a":1,"e":"Débits en décimal : 1 Mbit/s = 10⁶ bit/s."},{"n":"n20","q":"Lequel n&#39;influence PAS le débit selon le cours ?","o":["Le nombre d&#39;utilisateurs","La topologie","Le type de données transmises","La couleur de la carte réseau"],"a":3,"e":"Le cours cite la machine du client, le serveur, les autres utilisateurs, la topologie, les nœuds et leur charge, le type de données et les pannes."},{"n":"n21","q":"1 Go en bits (convention du prof) =","o":["8 000 000 000","8 589 934 592","1 073 741 824","1 000 000 000"],"a":1,"e":"1 Go = 1024³ octets × 8 = 8 589 934 592 bits. Le piège : 1 073 741 824 correspond aux octets, pas aux bits."},{"n":"n21","q":"Temps théorique pour 500 Mo à 8 Mbit/s ?","o":["62,5 s","524,3 s ≈ 8 min 44 s","500 s","4 194 s"],"a":1,"e":"500 × 1024² × 8 = 4 194 304 000 bits ; ÷ 8 000 000 = 524,3 s."},{"n":"n21","q":"Temps réel pour 2 Go à un débit réel de 20 Mbit/s ?","o":["≈ 859 s ≈ 14 min 19 s","800 s","≈ 107 s","≈ 1 718 s"],"a":0,"e":"2 × 8 589 934 592 = 17 179 869 184 bits ; ÷ 20 000 000 = 859 s, soit 14 min 19 s."},{"n":"n21","q":"Pour le TEMPS RÉEL, on divise la taille par…","o":["La bande passante","Le débit réel au moment du transfert","Le débit physique Ethernet","La taille du segment"],"a":1,"e":"Temps théorique : bande passante. Temps réel : débit réel mesuré."},{"n":"n21","q":"(TD) Fichier de 4 millions d&#39;octets, lien de 500 kbps. Durée du transfert ?","o":["8 s","64 s","62,5 s","512 s"],"a":1,"e":"4 000 000 × 8 = 32 000 000 bits ; ÷ 500 000 = 64 s. Ici la taille est donnée en millions d&#39;octets (décimal), donc pas de 1024."},{"n":"n21","q":"(TD) 2 Go avec une bande passante de 5 Mbit/s : temps théorique ?","o":["3 200 s","≈ 3 436 s ≈ 57 min 16 s","≈ 429 s","≈ 27 488 s"],"a":1,"e":"2 × 8 589 934 592 = 17 179 869 184 bits ; ÷ 5 000 000 ≈ 3 436 s."}]},{"id":"s9","t":"Ch2 · Modèles OSI et TCP/IP","seance":"Chapitre 2","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>La notion de protocole, vue au chapitre « Composants de base ».<\/p>\n<details class=\"prereq\"><summary><b>Vérifie ton prérequis.<\/b> Combien de couches compte le modèle OSI ? Et le modèle TCP/IP ?<\/summary><p>7 pour OSI, 4 pour TCP/IP.<\/p><\/details><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense à des enveloppes emboîtées.<\/strong> À l&#39;émission, chaque couche glisse les données dans son enveloppe (elle ajoute son en-tête). À la réception, chaque couche ouvre la sienne.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Numéroter TCP/IP à l&#39;envers. Dans ce cours : 1 Accès réseau, 2 Internet, 3 Transport, 4 Application. Et les unités : Données, Segment, Paquet, Trame, Bits.<\/p>\n<\/aside><p>À la fin, tu sais placer un protocole dans sa couche et nommer l&#39;unité de données de chaque couche.<\/p>\n<h2>Le cours<\/h2>\n<p>On découpe la communication en couches pour standardiser, faciliter la conception et la maintenance, diagnostiquer par couche et assurer l'interopérabilité. À l'émission, les données descendent de la couche Application à la couche Physique ; à la réception, elles remontent. Chaque couche ne dialogue qu'avec son équivalente sur l'autre système.<\/p>\n  <div class=\"table-wrap\"><table><thead><tr><th>N° OSI<\/th><th>Couche OSI<\/th><th>Rôle (cours)<\/th><th>N° TCP/IP<\/th><th>Couche TCP/IP<\/th><th>PDU<\/th><th>Protocoles<\/th><\/tr><\/thead><tbody>\n  <tr><td class=\"num\">7<\/td><td>Application<\/td><td>Communication avec les logiciels<\/td><td class=\"num\" rowspan=\"3\">4<\/td><td rowspan=\"3\">Application<\/td><td rowspan=\"3\">Données<\/td><td rowspan=\"3\">HTTP/HTTPS, DNS, FTP, SMTP, POP3, Telnet, SSH, DHCP, SNMP<\/td><\/tr>\n  <tr><td class=\"num\">6<\/td><td>Présentation<\/td><td>Gestion de la syntaxe (codage, compression, chiffrement)<\/td><\/tr>\n  <tr><td class=\"num\">5<\/td><td>Session<\/td><td>Contrôle du dialogue<\/td><\/tr>\n  <tr><td class=\"num\">4<\/td><td>Transport<\/td><td>Qualité de la transmission<\/td><td class=\"num\">3<\/td><td>Transport<\/td><td>Segment<\/td><td>TCP, UDP<\/td><\/tr>\n  <tr><td class=\"num\">3<\/td><td>Réseau<\/td><td>Sélection du chemin<\/td><td class=\"num\">2<\/td><td>Internet<\/td><td>Paquet<\/td><td>IP, ICMP, IPsec, IGMP<\/td><\/tr>\n  <tr><td class=\"num\">2<\/td><td>Liaison de données<\/td><td>Préparation de l'envoi sur le média<\/td><td class=\"num\" rowspan=\"2\">1<\/td><td rowspan=\"2\">Accès réseau<\/td><td>Trame<\/td><td rowspan=\"2\">Ethernet, Wi-Fi, PPP, ARP (+ câbles UTP/STP, fibre)<\/td><\/tr>\n  <tr><td class=\"num\">1<\/td><td>Physique<\/td><td>Envoi sur le média physique<\/td><td>Bits<\/td><\/tr><\/tbody><\/table><\/div>\n  <div class=\"exam\"><b>Ce qui tombe (TD ex. 3)<\/b>Remplir exactement ce tableau. Note la numérotation TCP/IP du prof : 1 = Accès réseau, en bas ; 4 = Application, en haut.<\/div>\n  <div class=\"formula\">Encapsulation (émission, on descend)       Désencapsulation (réception, on remonte)\nDonnées  ──►  [TCP | Données] = Segment\n              [IP | Segment]  = Paquet\n              [Eth | Paquet | FCS] = Trame\n              0110101…  = Bits<\/div>\n  <p><b>OSI<\/b> est développé par l'ISO : c'est un modèle de référence théorique, qui n'est pas implémenté physiquement. <b>TCP/IP<\/b> vient d'ARPANET (années 1970) et devient le standard d'Internet en 1983 : c'est le modèle opérationnel. Points communs : tous deux sont en couches, ont une couche application, des couches transport et réseau comparables, et utilisent la commutation de paquets.<\/p>\n  <div class=\"trap\"><b>Pièges<\/b>① Session et Présentation n'existent pas séparément dans TCP/IP : elles sont dans sa couche Application. ② La couche 2 est la seule qui ajoute aussi une <i>queue<\/i>. ③ Ne confonds pas la couche n°2 TCP/IP (Internet) avec la couche n°2 OSI (Liaison).<\/div><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 10 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">La couche OSI qui assure la « sélection du chemin » est la couche…<\/div><button class=\"opt\" data-o=\"0\">Transport (4)<\/button><button class=\"opt\" data-o=\"1\">Réseau (3)<\/button><button class=\"opt\" data-o=\"2\">Liaison (2)<\/button><button class=\"opt\" data-o=\"3\">Session (5)<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Chiffrement, compression et codage des données relèvent de la couche…<\/div><button class=\"opt\" data-o=\"0\">Session<\/button><button class=\"opt\" data-o=\"1\">Présentation<\/button><button class=\"opt\" data-o=\"2\">Application<\/button><button class=\"opt\" data-o=\"3\">Transport<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Le modèle OSI a été développé par…<\/div><button class=\"opt\" data-o=\"0\">IETF<\/button><button class=\"opt\" data-o=\"1\">IEEE<\/button><button class=\"opt\" data-o=\"2\">ISO<\/button><button class=\"opt\" data-o=\"3\">ARPANET<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">(TD) Telnet appartient à la couche…<\/div><button class=\"opt\" data-o=\"0\">Transport<\/button><button class=\"opt\" data-o=\"1\">Session<\/button><button class=\"opt\" data-o=\"2\">Application<\/button><button class=\"opt\" data-o=\"3\">Réseau<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Un répéteur travaille à la couche…<\/div><button class=\"opt\" data-o=\"0\">1 Physique<\/button><button class=\"opt\" data-o=\"1\">2 Liaison<\/button><button class=\"opt\" data-o=\"2\">3 Réseau<\/button><button class=\"opt\" data-o=\"3\">4 Transport<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Dans le modèle TCP/IP du prof, la couche n°2 est…<\/div><button class=\"opt\" data-o=\"0\">Transport<\/button><button class=\"opt\" data-o=\"1\">Internet<\/button><button class=\"opt\" data-o=\"2\">Accès réseau<\/button><button class=\"opt\" data-o=\"3\">Application<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">La couche Application TCP/IP regroupe les couches OSI…<\/div><button class=\"opt\" data-o=\"0\">5, 6, 7<\/button><button class=\"opt\" data-o=\"1\">6, 7<\/button><button class=\"opt\" data-o=\"2\">4, 5, 6, 7<\/button><button class=\"opt\" data-o=\"3\">7 seulement<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">(TD) Le protocole réseau utilisé par Internet est…<\/div><button class=\"opt\" data-o=\"0\">IPX/SPX<\/button><button class=\"opt\" data-o=\"1\">TCP/IP<\/button><button class=\"opt\" data-o=\"2\">NetBEUI<\/button><button class=\"opt\" data-o=\"3\">X.25<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">La PDU de la couche Transport est…<\/div><button class=\"opt\" data-o=\"0\">La trame<\/button><button class=\"opt\" data-o=\"1\">Le paquet<\/button><button class=\"opt\" data-o=\"2\">Le segment<\/button><button class=\"opt\" data-o=\"3\">Le bit<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Quelle couche ajoute un en-tête ET une queue (FCS/CRC) ?<\/div><button class=\"opt\" data-o=\"0\">Transport<\/button><button class=\"opt\" data-o=\"1\">Réseau<\/button><button class=\"opt\" data-o=\"2\">Liaison de données<\/button><button class=\"opt\" data-o=\"3\">Application<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"10\"><div class=\"qq-q\">(TD) Ordre d&#39;encapsulation complet, du haut vers le bas ?<\/div><button class=\"opt\" data-o=\"0\">Ethernet frame → IP packet → TCP → HTTP<\/button><button class=\"opt\" data-o=\"1\">HTTP GET → segment TCP → paquet IP → trame Ethernet<\/button><button class=\"opt\" data-o=\"2\">IP → TCP → HTTP → Ethernet<\/button><button class=\"opt\" data-o=\"3\">TCP → HTTP → IP → Ethernet<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[],"qcm":[{"n":"n22","q":"La couche OSI qui assure la « sélection du chemin » est la couche…","o":["Transport (4)","Réseau (3)","Liaison (2)","Session (5)"],"a":1,"e":"Couche 3 Réseau : routage, adressage IP."},{"n":"n22","q":"Chiffrement, compression et codage des données relèvent de la couche…","o":["Session","Présentation","Application","Transport"],"a":1,"e":"Couche 6 Présentation : codage/conversion, compression, chiffrement."},{"n":"n22","q":"Le modèle OSI a été développé par…","o":["IETF","IEEE","ISO","ARPANET"],"a":2,"e":"ISO = International Organization for Standardization."},{"n":"n22","q":"(TD) Telnet appartient à la couche…","o":["Transport","Session","Application","Réseau"],"a":2,"e":"Telnet est un protocole de la couche Application (port TCP 23)."},{"n":"n22","q":"Un répéteur travaille à la couche…","o":["1 Physique","2 Liaison","3 Réseau","4 Transport"],"a":0,"e":"Il régénère le signal : couche physique."},{"n":"n23","q":"Dans le modèle TCP/IP du prof, la couche n°2 est…","o":["Transport","Internet","Accès réseau","Application"],"a":1,"e":"Numérotation du prof : 1 Accès réseau, 2 Internet, 3 Transport, 4 Application."},{"n":"n23","q":"La couche Application TCP/IP regroupe les couches OSI…","o":["5, 6, 7","6, 7","4, 5, 6, 7","7 seulement"],"a":0,"e":"Application TCP/IP = Session + Présentation + Application OSI."},{"n":"n23","q":"(TD) Le protocole réseau utilisé par Internet est…","o":["IPX/SPX","TCP/IP","NetBEUI","X.25"],"a":1,"e":"Internet repose sur la pile TCP/IP."},{"n":"n24","q":"La PDU de la couche Transport est…","o":["La trame","Le paquet","Le segment","Le bit"],"a":2,"e":"4 Segment · 3 Paquet · 2 Trame · 1 Bits."},{"n":"n24","q":"Quelle couche ajoute un en-tête ET une queue (FCS/CRC) ?","o":["Transport","Réseau","Liaison de données","Application"],"a":2,"e":"La trame = en-tête + paquet + queue de bande (contrôle d&#39;erreurs)."},{"n":"n24","q":"(TD) Ordre d&#39;encapsulation complet, du haut vers le bas ?","o":["Ethernet frame → IP packet → TCP → HTTP","HTTP GET → segment TCP → paquet IP → trame Ethernet","IP → TCP → HTTP → Ethernet","TCP → HTTP → IP → Ethernet"],"a":1,"e":"Données (HTTP) → Segment (TCP) → Paquet (IP) → Trame (Ethernet) → bits."}]},{"id":"s10","t":"Ch2 · Protocoles, ports, MTU","seance":"Chapitre 2","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Les couches Transport et Application du chapitre précédent.<\/p>\n<details class=\"prereq\"><summary><b>Vérifie ton prérequis.<\/b> Comment s'appelle l'unité de données de la couche Transport ?<\/summary><p>Le segment.<\/p><\/details><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Un port est un numéro de porte.<\/strong> L&#39;adresse IP amène jusqu&#39;à l&#39;immeuble (la machine), le port jusqu&#39;à l&#39;appartement (l&#39;application).<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Conf
