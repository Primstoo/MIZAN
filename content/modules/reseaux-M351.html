<div class=\"qq-q\">Sans passerelle par défaut, un hôte…</div><button class=\"opt\" data-o=\"0\">Ne peut communiquer qu&#39;avec son réseau local</button><button class=\"opt\" data-o=\"1\">Ne peut plus rien envoyer</button><button class=\"opt\" data-o=\"2\">Utilise le DNS</button><button class=\"opt\" data-o=\"3\">Devient un routeur</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Traceroute s&#39;appuie sur les messages ICMP…</div><button class=\"opt\" data-o=\"0\">Echo Reply</button><button class=\"opt\" data-o=\"1\">Redirect</button><button class=\"opt\" data-o=\"2\">Time Exceeded (11)</button><button class=\"opt\" data-o=\"3\">Destination Unreachable</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Le numéro d&#39;accusé de réception TCP indique…</div><button class=\"opt\" data-o=\"0\">Le dernier octet reçu</button><button class=\"opt\" data-o=\"1\">Le prochain octet attendu</button><button class=\"opt\" data-o=\"2\">La taille de la fenêtre</button><button class=\"opt\" data-o=\"3\">Le port</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">La fermeture d&#39;une connexion TCP se fait en…</div><button class=\"opt\" data-o=\"0\">2 temps</button><button class=\"opt\" data-o=\"1\">3 temps</button><button class=\"opt\" data-o=\"2\">4 temps</button><button class=\"opt\" data-o=\"3\">1 temps</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Le code HTTP 404 signifie…</div><button class=\"opt\" data-o=\"0\">OK</button><button class=\"opt\" data-o=\"1\">Document déplacé</button><button class=\"opt\" data-o=\"2\">Document non trouvé</button><button class=\"opt\" data-o=\"3\">Version non gérée</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Dans traceroute, quel message ICMP renvoie chaque routeur intermédiaire ?</div><button class=\"opt\" data-o=\"0\">Echo Reply</button><button class=\"opt\" data-o=\"1\">Time Exceeded</button><button class=\"opt\" data-o=\"2\">Redirect</button><button class=\"opt\" data-o=\"3\">Destination Unreachable</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">ICMP transporte-t-il des données utilisateur, comme TCP ou UDP ?</div><button class=\"opt\" data-o=\"0\">Oui, comme TCP</button><button class=\"opt\" data-o=\"1\">Oui, comme UDP</button><button class=\"opt\" data-o=\"2\">Non : des messages de contrôle et d&#39;erreur, encapsulés dans IP</button><button class=\"opt\" data-o=\"3\">Non : il est encapsulé dans TCP</button><div class=\"qq-e\" hidden></div></div></section>","ex":[],"qcm":[{"n":"n34","q":"IPv4 est dit « au mieux » car…","o":["Il garantit la livraison","Il n&#39;utilise aucune surcharge pour garantir la transmission","Il chiffre les paquets","Il établit une connexion"],"a":1,"e":"Au mieux = peu fiable : il ne garantit pas la livraison. C&#39;est TCP, au-dessus, qui fiabilise."},{"n":"n34","q":"Un ping envoie un ICMP de type…","o":["0","3","8","11"],"a":2,"e":"Echo Request = 8 ; la réponse est Echo Reply = 0."},{"n":"n34","q":"Sans passerelle par défaut, un hôte…","o":["Ne peut communiquer qu&#39;avec son réseau local","Ne peut plus rien envoyer","Utilise le DNS","Devient un routeur"],"a":0,"e":"La passerelle est la sortie du réseau local."},{"n":"n34","q":"Traceroute s&#39;appuie sur les messages ICMP…","o":["Echo Reply","Redirect","Time Exceeded (11)","Destination Unreachable"],"a":2,"e":"Chaque saut renvoie un Time Exceeded quand le TTL arrive à 0."},{"n":"n35","q":"Le numéro d&#39;accusé de réception TCP indique…","o":["Le dernier octet reçu","Le prochain octet attendu","La taille de la fenêtre","Le port"],"a":1,"e":"ACK = numéro du prochain octet attendu."},{"n":"n35","q":"La fermeture d&#39;une connexion TCP se fait en…","o":["2 temps","3 temps","4 temps","1 temps"],"a":2,"e":"FIN, ACK, FIN, ACK : chaque côté ferme séparément."},{"n":"n35","q":"Le code HTTP 404 signifie…","o":["OK","Document déplacé","Document non trouvé","Version non gérée"],"a":2,"e":"200 OK · 301 déplacé · 400 syntaxe · 404 non trouvé · 505 version."},{"n":"n34","q":"Dans traceroute, quel message ICMP renvoie chaque routeur intermédiaire ?","o":["Echo Reply","Time Exceeded","Redirect","Destination Unreachable"],"a":1,"e":"Time Exceeded (type 11) : le TTL est arrivé à 0 sur ce routeur, ce qui révèle son adresse."},{"n":"n34","q":"ICMP transporte-t-il des données utilisateur, comme TCP ou UDP ?","o":["Oui, comme TCP","Oui, comme UDP","Non : des messages de contrôle et d&#39;erreur, encapsulés dans IP","Non : il est encapsulé dans TCP"],"a":2,"e":"ICMP est un protocole de contrôle et de diagnostic, encapsulé dans IP (protocole n° 1)."}]},{"id":"s14","t":"En-têtes IP, TCP et UDP (à mémoriser)","seance":"Chapitre 1","imp":5,"html":"<div class=\"exam\"><b>Signal du prof (29/10)</b>« Vous avez déjà l'en-tête IP et TCP dans le support : il faut le mémoriser pour l'examen. » Attends-toi à devoir <b>dessiner un en-tête</b>, nommer un champ, donner sa taille ou expliquer son rôle.</div>\n  <p><b>Comment lire ces schémas :</b> chaque ligne fait <b>32 bits</b>, soit 4 octets. La largeur d'une case est proportionnelle au nombre de bits du champ. <b>Clique sur une case</b> pour voir son rôle.</p>\n  <h3>En-tête IPv4 (5 lignes = 20 octets minimum)</h3>\n  <div class=\"flow\"><svg viewBox=\"0 0 564 230\" style=\"width:100%;min-width:560px;max-width:760px\" role=\"img\" aria-label=\"En-tête IPv4\"><text class=\"tx\" x=\"10\" y=\"14\" text-anchor=\"start\">0</text><text class=\"tx\" x=\"146\" y=\"14\" text-anchor=\"start\">8</text><text class=\"tx\" x=\"282\" y=\"14\" text-anchor=\"start\">16</text><text class=\"tx\" x=\"418\" y=\"14\" text-anchor=\"start\">24</text><text class=\"tx\" x=\"554\" y=\"14\" text-anchor=\"end\">32</text><g data-hf=\"ip:0:0\" style=\"cursor:pointer\"><rect x=\"10\" y=\"24\" width=\"68\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"44\" y=\"42\" text-anchor=\"middle\" style=\"font-weight:600\">Version</text><text class=\"tx\" x=\"44\" y=\"56\" text-anchor=\"middle\">4 bits</text></g><g data-hf=\"ip:0:1\" style=\"cursor:pointer\"><rect x=\"78\" y=\"24\" width=\"68\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"112\" y=\"42\" text-anchor=\"middle\" style=\"font-weight:600\">IHL</text><text class=\"tx\" x=\"112\" y=\"56\" text-anchor=\"middle\">4 bits</text></g><g data-hf=\"ip:0:2\" style=\"cursor:pointer\"><rect x=\"146\" y=\"24\" width=\"136\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"214\" y=\"42\" text-anchor=\"middle\" style=\"font-weight:600\">Type de service</text><text class=\"tx\" x=\"214\" y=\"56\" text-anchor=\"middle\">8 bits</text></g><g data-hf=\"ip:0:3\" style=\"cursor:pointer\"><rect x=\"282\" y=\"24\" width=\"272\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"418\" y=\"42\" text-anchor=\"middle\" style=\"font-weight:600\">Longueur totale</text><text class=\"tx\" x=\"418\" y=\"56\" text-anchor=\"middle\">16 bits</text></g><g data-hf=\"ip:1:0\" style=\"cursor:pointer\"><rect x=\"10\" y=\"64\" width=\"272\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"146\" y=\"82\" text-anchor=\"middle\" style=\"font-weight:600\">Identification</text><text class=\"tx\" x=\"146\" y=\"96\" text-anchor=\"middle\">16 bits</text></g><g data-hf=\"ip:1:1\" style=\"cursor:pointer\"><rect x=\"282\" y=\"64\" width=\"51\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"307.5\" y=\"82\" text-anchor=\"middle\" style=\"font-weight:600\">Flags</text><text class=\"tx\" x=\"307.5\" y=\"96\" text-anchor=\"middle\">3 bits</text></g><g data-hf=\"ip:1:2\" style=\"cursor:pointer\"><rect x=\"333\" y=\"64\" width=\"221\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"443.5\" y=\"82\" text-anchor=\"middle\" style=\"font-weight:600\">Décalage de fragment</text><text class=\"tx\" x=\"443.5\" y=\"96\" text-anchor=\"middle\">13 bits</text></g><g data-hf=\"ip:2:0\" style=\"cursor:pointer\"><rect x=\"10\" y=\"104\" width=\"136\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"78\" y=\"122\" text-anchor=\"middle\" style=\"font-weight:600\">TTL</text><text class=\"tx\" x=\"78\" y=\"136\" text-anchor=\"middle\">8 bits</text></g><g data-hf=\"ip:2:1\" style=\"cursor:pointer\"><rect x=\"146\" y=\"104\" width=\"136\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"214\" y=\"122\" text-anchor=\"middle\" style=\"font-weight:600\">Protocole</text><text class=\"tx\" x=\"214\" y=\"136\" text-anchor=\"middle\">8 bits</text></g><g data-hf=\"ip:2:2\" style=\"cursor:pointer\"><rect x=\"282\" y=\"104\" width=\"272\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"418\" y=\"122\" text-anchor=\"middle\" style=\"font-weight:600\">Somme de contrôle</text><text class=\"tx\" x=\"418\" y=\"136\" text-anchor=\"middle\">16 bits</text></g><g data-hf=\"ip:3:0\" style=\"cursor:pointer\"><rect x=\"10\" y=\"144\" width=\"544\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"282\" y=\"162\" text-anchor=\"middle\" style=\"font-weight:600\">Adresse IP source</text><text class=\"tx\" x=\"282\" y=\"176\" text-anchor=\"middle\">32 bits</text></g><g data-hf=\"ip:4:0\" style=\"cursor:pointer\"><rect x=\"10\" y=\"184\" width=\"544\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"282\" y=\"202\" text-anchor=\"middle\" style=\"font-weight:600\">Adresse IP destination</text><text class=\"tx\" x=\"282\" y=\"216\" text-anchor=\"middle\">32 bits</text></g></svg></div><div class=\"expl\" id=\"hdrInfo-ip\">Clique sur un champ.</div>\n  <div class=\"def\"><b>Moyen mnémotechnique, une phrase par ligne</b>L1 <b>V</b>ersion · <b>I</b>HL · <b>T</b>ype de service · <b>L</b>ongueur totale → « <b>V</b>a, <b>I</b>l <b>T</b>e <b>L</b>it »<br>L2 <b>I</b>dentification · <b>F</b>lags · <b>F</b>ragment (décalage) → « <b>I</b>l <b>F</b>aut <b>F</b>ragmenter »<br>L3 <b>T</b>TL · <b>P</b>rotocole · <b>C</b>hecksum → « <b>T</b>rois <b>P</b>oints <b>C</b>lés »<br>L4-L5 <b>S</b>ource puis <b>D</b>estination, 32 bits chacune.<br>Tailles de la ligne 1 : 4-4-8-16 ; ligne 2 : 16-3-13 ; ligne 3 : 8-8-16.</div>\n  <div class=\"trap\"><b>Pièges</b>① IHL compte en <b>mots de 32 bits</b> (5 = 20 octets), mais la longueur totale compte en <b>octets</b>. ② Protocole : 1 = ICMP, 6 = TCP, 17 = UDP. ③ La somme de contrôle IP ne protège que l'en-tête. ④ Ce sont les adresses IP qui sont dans l'en-tête IP. Les adresses MAC (48 bits) sont dans l'en-tête de la trame Ethernet, à la couche 2.</div>\n  <h3>En-tête TCP (5 lignes = 20 octets minimum)</h3>\n  <div class=\"flow\"><svg viewBox=\"0 0 564 230\" style=\"width:100%;min-width:560px;max-width:760px\" role=\"img\" aria-label=\"En-tête TCP\"><text class=\"tx\" x=\"10\" y=\"14\" text-anchor=\"start\">0</text><text class=\"tx\" x=\"146\" y=\"14\" text-anchor=\"start\">8</text><text class=\"tx\" x=\"282\" y=\"14\" text-anchor=\"start\">16</text><text class=\"tx\" x=\"418\" y=\"14\" text-anchor=\"start\">24</text><text class=\"tx\" x=\"554\" y=\"14\" text-anchor=\"end\">32</text><g data-hf=\"tcp:0:0\" style=\"cursor:pointer\"><rect x=\"10\" y=\"24\" width=\"272\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"146\" y=\"42\" text-anchor=\"middle\" style=\"font-weight:600\">Port source</text><text class=\"tx\" x=\"146\" y=\"56\" text-anchor=\"middle\">16 bits</text></g><g data-hf=\"tcp:0:1\" style=\"cursor:pointer\"><rect x=\"282\" y=\"24\" width=\"272\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"418\" y=\"42\" text-anchor=\"middle\" style=\"font-weight:600\">Port destination</text><text class=\"tx\" x=\"418\" y=\"56\" text-anchor=\"middle\">16 bits</text></g><g data-hf=\"tcp:1:0\" style=\"cursor:pointer\"><rect x=\"10\" y=\"64\" width=\"544\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"282\" y=\"82\" text-anchor=\"middle\" style=\"font-weight:600\">Numéro de séquence</text><text class=\"tx\" x=\"282\" y=\"96\" text-anchor=\"middle\">32 bits</text></g><g data-hf=\"tcp:2:0\" style=\"cursor:pointer\"><rect x=\"10\" y=\"104\" width=\"544\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"282\" y=\"122\" text-anchor=\"middle\" style=\"font-weight:600\">Numéro d'acquittement</text><text class=\"tx\" x=\"282\" y=\"136\" text-anchor=\"middle\">32 bits</text></g><g data-hf=\"tcp:3:0\" style=\"cursor:pointer\"><rect x=\"10\" y=\"144\" width=\"68\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"44\" y=\"162\" text-anchor=\"middle\" style=\"font-weight:600\">Lg en-tête</text><text class=\"tx\" x=\"44\" y=\"176\" text-anchor=\"middle\">4 bits</text></g><g data-hf=\"tcp:3:1\" style=\"cursor:pointer\"><rect x=\"78\" y=\"144\" width=\"102\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"129\" y=\"162\" text-anchor=\"middle\" style=\"font-weight:600\">Réservé</text><text class=\"tx\" x=\"129\" y=\"176\" text-anchor=\"middle\">6 bits</text></g><g data-hf=\"tcp:3:2\" style=\"cursor:pointer\"><rect x=\"180\" y=\"144\" width=\"102\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"231\" y=\"162\" text-anchor=\"middle\" style=\"font-weight:600\">Drapeaux</text><text class=\"tx\" x=\"231\" y=\"176\" text-anchor=\"middle\">6 bits</text></g><g data-hf=\"tcp:3:3\" style=\"cursor:pointer\"><rect x=\"282\" y=\"144\" width=\"272\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"418\" y=\"162\" text-anchor=\"middle\" style=\"font-weight:600\">Fenêtre</text><text class=\"tx\" x=\"418\" y=\"176\" text-anchor=\"middle\">16 bits</text></g><g data-hf=\"tcp:4:0\" style=\"cursor:pointer\"><rect x=\"10\" y=\"184\" width=\"272\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"146\" y=\"202\" text-anchor=\"middle\" style=\"font-weight:600\">Somme de contrôle</text><text class=\"tx\" x=\"146\" y=\"216\" text-anchor=\"middle\">16 bits</text></g><g data-hf=\"tcp:4:1\" style=\"cursor:pointer\"><rect x=\"282\" y=\"184\" width=\"272\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"418\" y=\"202\" text-anchor=\"middle\" style=\"font-weight:600\">Pointeur urgent</text><text class=\"tx\" x=\"418\" y=\"216\" text-anchor=\"middle\">16 bits</text></g></svg></div><div class=\"expl\" id=\"hdrInfo-tcp\">Clique sur un champ.</div>\n  <div class=\"def\"><b>Moyen mnémotechnique</b>L1 les deux <b>ports</b> (16 + 16) · L2 <b>Séquence</b> (32) · L3 <b>Acquittement</b> (32) · L4 <b>Longueur</b> (4), <b>Réservé</b> (6), <b>Drapeaux</b> (6), <b>Fenêtre</b> (16) · L5 <b>Checksum</b> (16), <b>Urgent</b> (16).<br>Les 6 drapeaux, dans l'ordre : <b>U A P R S F</b> → « <b>U</b>n <b>A</b>gent <b>P</b>ressé <b>R</b>ange <b>S</b>es <b>F</b>ichiers ».</div>\n  <div class=\"trap\"><b>Pièges</b>① Ce sont les <b>ports</b> qui sont dans l'en-tête TCP. Les adresses IP n'y sont pas : elles sont dans l'en-tête IP, en dessous. ② Les numéros de séquence et d'acquittement font chacun une ligne entière de 32 bits. ③ Les manuels récents découpent « Réservé + Drapeaux » en 4 + 8 bits, en ajoutant les drapeaux CWR et ECE. Garde la version 6 + 6 du cours classique, sauf si le support de ton prof montre l'autre : envoie-moi une photo de sa diapo pour qu'on vérifie.</div>\n  <h3>En-tête UDP (2 lignes = 8 octets)</h3>\n  <div class=\"flow\"><svg viewBox=\"0 0 564 110\" style=\"width:100%;min-width:560px;max-width:760px\" role=\"img\" aria-label=\"En-tête UDP\"><text class=\"tx\" x=\"10\" y=\"14\" text-anchor=\"start\">0</text><text class=\"tx\" x=\"146\" y=\"14\" text-anchor=\"start\">8</text><text class=\"tx\" x=\"282\" y=\"14\" text-anchor=\"start\">16</text><text class=\"tx\" x=\"418\" y=\"14\" text-anchor=\"start\">24</text><text class=\"tx\" x=\"554\" y=\"14\" text-anchor=\"end\">32</text><g data-hf=\"udp:0:0\" style=\"cursor:pointer\"><rect x=\"10\" y=\"24\" width=\"272\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"146\" y=\"42\" text-anchor=\"middle\" style=\"font-weight:600\">Port source</text><text class=\"tx\" x=\"146\" y=\"56\" text-anchor=\"middle\">16 bits</text></g><g data-hf=\"udp:0:1\" style=\"cursor:pointer\"><rect x=\"282\" y=\"24\" width=\"272\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"418\" y=\"42\" text-anchor=\"middle\" style=\"font-weight:600\">Port destination</text><text class=\"tx\" x=\"418\" y=\"56\" text-anchor=\"middle\">16 bits</text></g><g data-hf=\"udp:1:0\" style=\"cursor:pointer\"><rect x=\"10\" y=\"64\" width=\"272\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"146\" y=\"82\" text-anchor=\"middle\" style=\"font-weight:600\">Longueur</text><text class=\"tx\" x=\"146\" y=\"96\" text-anchor=\"middle\">16 bits</text></g><g data-hf=\"udp:1:1\" style=\"cursor:pointer\"><rect x=\"282\" y=\"64\" width=\"272\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"418\" y=\"82\" text-anchor=\"middle\" style=\"font-weight:600\">Somme de contrôle</text><text class=\"tx\" x=\"418\" y=\"96\" text-anchor=\"middle\">16 bits</text></g></svg></div><div class=\"expl\" id=\"hdrInfo-udp\">Clique sur un champ.</div>\n  <p>Comparaison à retenir : TCP a besoin de séquence, d'acquittement, de drapeaux et de fenêtre pour être fiable, d'où ses 20 octets. UDP n'a que l'essentiel : 8 octets. Le cours dit « Longueur : longueur d'en-tête UDP ». En réalité, ce champ donne la longueur <b>de l'en-tête et des données</b> (dans le TP, longueur UDP = longueur IP − 20). Écris « en-tête + données » sur ta copie : c'est la définition exacte (RFC 768).</p>\n  <div class=\"exam\"><b>Entraîne-toi</b>Onglet Rédaction → « Reconstituer un en-tête » : tu remplis les champs dans l'ordre, de mémoire. Fais-le jusqu'à 100 %, puis refais-le à J+1, J+3 et J+7.</div>\n  <h3>Lire un segment TCP en hexadécimal (TD 2, ex. 2)</h3>\n  <div class=\"table-wrap\"><table><thead><tr><th>Octets</th><th>1-2</th><th>3-4</th><th>5-8</th><th>9-12</th><th>13</th><th>14</th><th>15-16</th><th>17-18</th><th>19-20</th></tr></thead><tbody><tr><td>Champ</td><td>port source</td><td>port dest.</td><td>Seq</td><td>ACK</td><td>1er chiffre = longueur d'en-tête (× 4 octets)</td><td>drapeaux</td><td>fenêtre</td><td>checksum</td><td>urgent</td></tr></tbody></table></div>\n  <p><b>Octet des drapeaux</b> : FIN = 01, SYN = 02, RST = 04, PSH = 08, ACK = 10, URG = 20 (on additionne). Courants : <b>02</b> = SYN, <b>12</b> = SYN + ACK, <b>10</b> = ACK, <b>18</b> = PSH + ACK, <b>11</b> = FIN + ACK, <b>04</b> = RST.</p>\n  <div class=\"def\"><b>Exemple du TD 2</b>00 15 0F 87 9C CB 7E 01 27 E3 EA 01 50 12 10 00 DF 3D 00 00<br>Port source 0x0015 = 21 (FTP, contrôle) · port destination 0x0F87 = 3975 (port éphémère du client) · Seq 0x9CCB7E01 = 2 630 581 761 · ACK 0x27E3EA01 = 669 248 001 · en-tête 5 × 4 = 20 octets · drapeaux 0x12 = <b>SYN + ACK</b> · fenêtre 0x1000 = 4096 · checksum DF3D · urgent 0.<br>C'est la <b>2e étape de la poignée de main</b> : le serveur FTP répond au SYN du client (son numéro initial était 669 248 000, d'où ACK = 669 248 001).</div><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 18 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Taille minimale de l&#39;en-tête IPv4 ?</div><button class=\"opt\" data-o=\"0\">8 octets</button><button class=\"opt\" data-o=\"1\">20 octets</button><button class=\"opt\" data-o=\"2\">32 octets</button><button class=\"opt\" data-o=\"3\">40 octets</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Le champ IHL vaut 5. Taille de l&#39;en-tête ?</div><button class=\"opt\" data-o=\"0\">5 octets</button><button class=\"opt\" data-o=\"1\">20 octets</button><button class=\"opt\" data-o=\"2\">40 octets</button><button class=\"opt\" data-o=\"3\">5 bits</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Quel champ IPv4 diminue de 1 à chaque routeur ?</div><button class=\"opt\" data-o=\"0\">Identification</button><button class=\"opt\" data-o=\"1\">Longueur totale</button><button class=\"opt\" data-o=\"2\">TTL</button><button class=\"opt\" data-o=\"3\">Protocole</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Champ Protocole = 6. Que transporte le paquet ?</div><button class=\"opt\" data-o=\"0\">ICMP</button><button class=\"opt\" data-o=\"1\">TCP</button><button class=\"opt\" data-o=\"2\">UDP</button><button class=\"opt\" data-o=\"3\">IPv6</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Quels champs servent à la fragmentation ?</div><button class=\"opt\" data-o=\"0\">TTL et Protocole</button><button class=\"opt\" data-o=\"1\">Identification, Flags et Décalage de fragment</button><button class=\"opt\" data-o=\"2\">Version et IHL</button><button class=\"opt\" data-o=\"3\">Source et Destination</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Taille d&#39;une adresse IPv4 dans l&#39;en-tête ?</div><button class=\"opt\" data-o=\"0\">16 bits</button><button class=\"opt\" data-o=\"1\">32 bits</button><button class=\"opt\" data-o=\"2\">48 bits</button><button class=\"opt\" data-o=\"3\">64 bits</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">La somme de contrôle IPv4 protège…</div><button class=\"opt\" data-o=\"0\">les données</button><button class=\"opt\" data-o=\"1\">l&#39;en-tête seulement</button><button class=\"opt\" data-o=\"2\">toute la trame</button><button class=\"opt\" data-o=\"3\">rien</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Taille du numéro de séquence TCP ?</div><button class=\"opt\" data-o=\"0\">16 bits</button><button class=\"opt\" data-o=\"1\">32 bits</button><button class=\"opt\" data-o=\"2\">8 bits</button><button class=\"opt\" data-o=\"3\">48 bits</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Lequel n&#39;est PAS un drapeau TCP ?</div><button class=\"opt\" data-o=\"0\">SYN</button><button class=\"opt\" data-o=\"1\">FIN</button><button class=\"opt\" data-o=\"2\">TTL</button><button class=\"opt\" data-o=\"3\">RST</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Quel champ TCP sert au contrôle de flux ?</div><button class=\"opt\" data-o=\"0\">Pointeur urgent</button><button class=\"opt\" data-o=\"1\">Fenêtre</button><button class=\"opt\" data-o=\"2\">Somme de contrôle</button><button class=\"opt\" data-o=\"3\">Port source</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"10\"><div class=\"qq-q\">Taille d&#39;un champ de port (TCP ou UDP) ?</div><button class=\"opt\" data-o=\"0\">8 bits</button><button class=\"opt\" data-o=\"1\">16 bits</button><button class=\"opt\" data-o=\"2\">32 bits</button><button class=\"opt\" data-o=\"3\">4 bits</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"11\"><div class=\"qq-q\">Le drapeau qui coupe brutalement une connexion TCP est…</div><button class=\"opt\" data-o=\"0\">FIN</button><button class=\"opt\" data-o=\"1\">RST</button><button class=\"opt\" data-o=\"2\">PSH</button><button class=\"opt\" data-o=\"3\">URG</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"12\"><div class=\"qq-q\">Taille de l&#39;en-tête UDP ?</div><button class=\"opt\" data-o=\"0\">8 octets</button><button class=\"opt\" data-o=\"1\">20 octets</button><button class=\"opt\" data-o=\"2\">4 octets</button><button class=\"opt\" data-o=\"3\">12 octets</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"13\"><div class=\"qq-q\">Lequel de ces champs existe dans UDP ?</div><button class=\"opt\" data-o=\"0\">Numéro de séquence</button><button class=\"opt\" data-o=\"1\">Fenêtre</button><button class=\"opt\" data-o=\"2\">Longueur</button><button class=\"opt\" data-o=\"3\">Drapeaux</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"14\"><div class=\"qq-q\">L&#39;octet des drapeaux d&#39;un segment TCP vaut 0x12. Quels drapeaux sont levés ?</div><button class=\"opt\" data-o=\"0\">SYN seul</button><button class=\"opt\" data-o=\"1\">SYN et ACK</button><button class=\"opt\" data-o=\"2\">ACK seul</button><button class=\"opt\" data-o=\"3\">FIN et ACK</button><div class=\"qq-e\" hidden></div></div></section>","ex":[],"qcm":[{"n":"n38","q":"Taille minimale de l&#39;en-tête IPv4 ?","o":["8 octets","20 octets","32 octets","40 octets"],"a":1,"e":"5 lignes de 32 bits = 20 octets."},{"n":"n38","q":"Le champ IHL vaut 5. Taille de l&#39;en-tête ?","o":["5 octets","20 octets","40 octets","5 bits"],"a":1,"e":"IHL compte en mots de 32 bits (4 octets) : 5 × 4 = 20 octets."},{"n":"n38","q":"Quel champ IPv4 diminue de 1 à chaque routeur ?","o":["Identification","Longueur totale","TTL","Protocole"],"a":2,"e":"À 0, le paquet est détruit et le routeur renvoie un ICMP 11."},{"n":"n38","q":"Champ Protocole = 6. Que transporte le paquet ?","o":["ICMP","TCP","UDP","IPv6"],"a":1,"e":"1 ICMP, 6 TCP, 17 UDP."},{"n":"n38","q":"Quels champs servent à la fragmentation ?","o":["TTL et Protocole","Identification, Flags et Décalage de fragment","Version et IHL","Source et Destination"],"a":1,"e":"C&#39;est toute la ligne 2 de l&#39;en-tête."},{"n":"n38","q":"Taille d&#39;une adresse IPv4 dans l&#39;en-tête ?","o":["16 bits","32 bits","48 bits","64 bits"],"a":1,"e":"32 bits, soit 4 octets (ex. 192.168.1.10). 48 bits, c&#39;est une adresse MAC."},{"n":"n38","q":"La somme de contrôle IPv4 protège…","o":["les données","l&#39;en-tête seulement","toute la trame","rien"],"a":1,"e":"Seulement l&#39;en-tête. Elle est recalculée à chaque saut, car le TTL change."},{"n":"n39","q":"Taille du numéro de séquence TCP ?","o":["16 bits","32 bits","8 bits","48 bits"],"a":1,"e":"32 bits, comme le numéro d&#39;acquittement (une ligne entière chacun)."},{"n":"n39","q":"Lequel n&#39;est PAS un drapeau TCP ?","o":["SYN","FIN","TTL","RST"],"a":2,"e":"TTL est un champ d&#39;IP. Les drapeaux TCP : URG, ACK, PSH, RST, SYN, FIN."},{"n":"n39","q":"Quel champ TCP sert au contrôle de flux ?","o":["Pointeur urgent","Fenêtre","Somme de contrôle","Port source"],"a":1,"e":"La fenêtre dit combien d&#39;octets le récepteur accepte avant d&#39;acquitter."},{"n":"n39","q":"Taille d&#39;un champ de port (TCP ou UDP) ?","o":["8 bits","16 bits","32 bits","4 bits"],"a":1,"e":"16 bits, d&#39;où des ports de 0 à 65 535."},{"n":"n39","q":"Le drapeau qui coupe brutalement une connexion TCP est…","o":["FIN","RST","PSH","URG"],"a":1,"e":"RST réinitialise. FIN ferme proprement, en 4 temps."},{"n":"n40","q":"Taille de l&#39;en-tête UDP ?","o":["8 octets","20 octets","4 octets","12 octets"],"a":0,"e":"4 champs de 16 bits = 8 octets."},{"n":"n40","q":"Lequel de ces champs existe dans UDP ?","o":["Numéro de séquence","Fenêtre","Longueur","Drapeaux"],"a":2,"e":"UDP : port source, port destination, longueur, somme de contrôle."},{"n":"n39","q":"L&#39;octet des drapeaux d&#39;un segment TCP vaut 0x12. Quels drapeaux sont levés ?","o":["SYN seul","SYN et ACK","ACK seul","FIN et ACK"],"a":1,"e":"0x12 = 0x10 (ACK) + 0x02 (SYN) : c&#39;est la réponse du serveur dans la poignée de main."}]},{"id":"td","t":"TD corrigés (séries 1 à 3)","seance":"Travaux dirigés et pratiques","imp":4,"html":"<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p>Cherche d&#39;abord seul, ouvre l&#39;indice si tu bloques, puis compare avec le corrigé et note-toi honnêtement : ta réponse compte dans la maîtrise de la notion.</p>\n</aside><section class=\"exo\"><h3>Exercice 1 · Temps de transfert</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p><strong>1.1.</strong> L&#39;hôte A envoie un fichier volumineux à l&#39;hôte B. Le chemin de A à B a un lien de 500 kbps. Le fichier fait 4 millions d&#39;octets. En divisant la taille par le débit, combien de temps faut-il pour le transfert ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Taille en bits (× 8). « 4 millions d&#39;octets » est en décimal. 500 kbps = 500 000 bit/s.</p>\n</div><div class=\"ex-c\" hidden><p>Taille = 4 000 000 × 8 = 32 000 000 bits<br>Débit = 500 × 1000 = 500 000 bits/s<br>T = 32 000 000 / 500 000 = <b>64 s</b><br><br>Remarque : la taille est donnée en millions d&#39;octets (décimal), donc pas de 1024 ici, contrairement à « 1 Go » dans le cours.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p><strong>1.2.</strong> Combien de temps théorique faut-il pour télécharger un fichier de 2 Go avec une connexion dont la bande passante est de 5 Mbit/s ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Convention du prof : 1 Go = 1024³ × 8 bits ; 5 Mbit/s = 5 × 10⁶.</p>\n</div><div class=\"ex-c\" hidden><p>Taille = 2 × 1024 × 1024 × 1024 × 8 = 17 179 869 184 bits<br>BP = 5 × 1 000 000 = 5 000 000 bits/s<br>T = 17 179 869 184 / 5 000 000 ≈ 3 436 s = <b>57 min 16 s</b><br><br>(Vérifié par calcul : 3 435,97 s.)</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><section class=\"exo\"><h3>Exercice 2 · Questions de cours</h3><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p><strong>2.1.</strong> Quelle partie d&#39;un réseau fournit des applications et des données aux ordinateurs hôtes ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Le <b>serveur</b> (hôte qui fournit des données ou des services : Web, DNS, DHCP…).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p><strong>2.2.</strong> À quoi sert une carte réseau ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Elle est l&#39;<b>interface</b> entre l&#39;ordinateur et le support de transmission : elle permet à l&#39;hôte d&#39;envoyer et de recevoir des données sur le réseau (conversion données ↔ signaux). Elle porte l&#39;<b>adresse MAC</b>.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p><strong>2.3.</strong> Que connectent les routeurs ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Des <b>réseaux (segments) différents entre eux</b> ; ils choisissent le chemin des paquets (couche 3). Les switchs et les hubs, eux, connectent les hôtes d&#39;un même segment.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p><strong>2.4.</strong> À quoi sert un répéteur ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>À <b>régénérer / amplifier le signal</b> affaibli pour augmenter la distance de transmission. Couche 1 (physique).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><p><strong>2.5.</strong> Numéro permettant d&#39;identifier de manière unique un ordinateur sur un réseau local ou sur Internet (ce numéro est modifiable) :</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>L&#39;<b>adresse IP</b>. Elle est logique et configurable. L&#39;adresse MAC identifie la carte, mais elle est en principe fixe : le mot « modifiable » oriente vers l&#39;IP.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"7\"><div class=\"ex-q\"><p><strong>2.6.</strong> Quel est le protocole réseau utilisé par Internet ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p><b>TCP/IP</b> (la pile de protocoles TCP/IP ; au niveau réseau, IP).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"8\"><div class=\"ex-q\"><p><strong>2.7.</strong> Lequel des services suivants permet de traduire une adresse Web en adresse IP ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Le <b>DNS</b> (Domain Name System), port 53.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"9\"><div class=\"ex-q\"><p><strong>2.8.</strong> Lesquels de ces protocoles interviennent au niveau de la couche application du modèle OSI ? (deux réponses) IP, TCP, UDP, http, DNS, Ethernet</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p><b>http et DNS</b>.<br>TCP et UDP → transport ; IP → réseau ; Ethernet → liaison/physique.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"10\"><div class=\"ex-q\"><p><strong>2.9.</strong> Lors du transfert des données, quelles sont les deux principales responsabilités de l&#39;hôte récepteur ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p><b>L&#39;accusé de réception</b> (confirmer la bonne réception) et <b>le réassemblage</b> des segments dans l&#39;ordre pour reconstituer les données.<br>(C&#39;est la réponse attendue dans le cursus Cisco ; certitude élevée.)</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"11\"><div class=\"ex-q\"><p><strong>2.10.</strong> Vous vous connectez à un système UNIX distant à partir de votre PC grâce au protocole TELNET. À quelle couche ce protocole appartient-il ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>À la couche <b>Application</b> (couche 7 OSI ; couche 4 TCP/IP). Il utilise TCP, port 23.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><section class=\"exo\"><h3>Exercice 3 · Tableau OSI / TCP-IP</h3><div class=\"ex\" data-x=\"12\"><div class=\"ex-q\"><p><strong>3.</strong> Remplir le tableau : N° OSI, nom de couche OSI, N° TCP/IP, nom de couche TCP/IP, unités d&#39;encapsulation, protocoles TCP/IP.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>7 couches OSI contre 4 couches TCP/IP. Chez le prof, la numérotation TCP/IP part du bas (1 = Accès réseau).</p>\n</div><div class=\"ex-c\" hidden><p>7 Application · 6 Présentation · 5 Session → <b>4 Application</b> · PDU : <b>Données</b> · HTTP, DNS, FTP, SMTP, POP3, Telnet, DHCP<br>4 Transport → <b>3 Transport</b> · <b>Segment</b> · TCP, UDP<br>3 Réseau → <b>2 Internet</b> · <b>Paquet</b> · IP, ICMP, IGMP, IPsec<br>2 Liaison de données → <b>1 Accès réseau</b> · <b>Trame</b> · Ethernet, Wi-Fi, PPP, ARP<br>1 Physique → <b>1 Accès réseau</b> · <b>Bits</b> · (supports : UTP, STP, fibre)<br><br>Voir le tableau complet dans Cours, section 9.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><section class=\"exo\"><h3>Exercice 4 · Salle informatique (schéma : 5 PC + imprimante sur un switch 2960)</h3><div class=\"ex\" data-x=\"13\"><div class=\"ex-q\"><p><strong>4.1a.</strong> Une salle informatique : 5 ordinateurs et une imprimante partagée. Quel type de réseau ? Quelle topologie ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Un <b>LAN</b> (réseau local). Topologie physique <b>en étoile</b> : tous les équipements sont reliés au switch central (2960-24TT).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"14\"><div class=\"ex-q\"><p><strong>4.1b.</strong> Quels sont les équipements matériels utilisés dans ce réseau ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p><b>5 PC</b> (hôtes), <b>1 imprimante</b> réseau, <b>1 commutateur (switch)</b> Cisco 2960, les <b>cartes réseau</b> de chaque équipement et les <b>câbles</b> avec connecteurs RJ45.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"15\"><div class=\"ex-q\"><p><strong>4.1c.</strong> Quel type de câble est utilisé ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Du câble en <b>paires torsadées (UTP)</b> avec connecteurs <b>RJ45</b>, en <b>câble droit</b>, car on relie des équipements différents (PC ↔ switch). Longueur max 100 m.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"16\"><div class=\"ex-q\"><p><strong>4.1d.</strong> L&#39;utilisateur du poste 1 peut-il utiliser l&#39;imprimante ? Justifier.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p><b>Oui.</b> L&#39;imprimante est connectée au switch, donc elle est dans le même LAN (même segment) que le PC1. Le switch transmet les données entre les deux sans routeur. (Il faut bien sûr que l&#39;imprimante soit partagée et que les adresses IP soient dans le même réseau.)</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"17\"><div class=\"ex-q\"><p><strong>4.2a.</strong> Dans chaque établissement scolaire, les équipements de la salle sont en réseau. Quel type de réseau dans chaque salle ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Un <b>LAN</b>.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"18\"><div class=\"ex-q\"><p><strong>4.2b.</strong> Peut-on relier les réseaux des salles des établissements d&#39;une ville ? Si oui, comment s&#39;appelle ce réseau ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p><b>Oui</b> : c&#39;est un <b>MAN</b> (réseau métropolitain), qui interconnecte des LAN proches, à l&#39;échelle d&#39;une ville.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"19\"><div class=\"ex-q\"><p><strong>4.2c.</strong> Peut-on faire la même chose au niveau de tout le pays ? Si oui, comment s&#39;appelle ce réseau ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p><b>Oui</b> : c&#39;est un <b>WAN</b> (réseau étendu).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"20\"><div class=\"ex-q\"><p><strong>4.2d.</strong> Quels supports de transmission peut-on utiliser dans ces deux derniers cas ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>MAN : surtout la <b>fibre optique</b> (haut débit), éventuellement des <b>liaisons sans fil</b> (faisceaux hertziens, WiMAX).<br>WAN : <b>fibre optique</b>, <b>câbles cuivre</b> / lignes louées des opérateurs, <b>faisceaux hertziens</b>, <b>satellite</b>.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><section class=\"exo\"><h3>Exercice 5 · Segmentation et MTU</h3><div class=\"ex\" data-x=\"21\"><div class=\"ex-q\"><p><strong>5.</strong> Un utilisateur transfère 6400 octets de données vers une machine du même réseau local, de MTU 1800 octets ; les en-têtes font 20 octets. 1) Taille des données utilisateur ? 2) Nombre de segments ? 3) Taille de chaque segment ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Chaque segment transporte au plus MTU − en-têtes octets de données. Arrondis le nombre de segments au-dessus.</p>\n</div><div class=\"ex-c\" hidden><p><b>1)</b> Données utilisateur = <b>6400 octets</b>.<br><br><b>Lecture A (20 octets d&#39;en-têtes au total, la plus probable vu l&#39;énoncé)</b><br>Données max par segment = 1800 − 20 = 1780 o<br><b>2)</b> 6400 / 1780 = 3,6 → <b>4 segments</b><br><b>3)</b> 3 segments de 1800 o (1780 données + 20) et 1 dernier de <b>1080 o</b> (1060 données + 20)<br>Vérification : 3 × 1780 + 1060 = 6400 ✓<br><br><b>Lecture B (20 o IP + 20 o TCP = 40 o, comme MSS = MTU − 40 dans le Ch. 2)</b><br>1800 − 40 = 1760 o → toujours 4 segments : 3 × 1800 o et 1 de 1160 o (1120 données + 40).<br><br>⚠ L&#39;énoncé est ambigu. Demande au prof en TD quelle lecture il attend, puis utilise /insiste pour que je l&#39;enregistre.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><section class=\"exo\"><h3>Exercice 6 · Internet, Web et messagerie</h3><div class=\"ex\" data-x=\"22\"><div class=\"ex-q\"><p><strong>6.1.</strong> Donner la définition et le rôle de WWW, HTML et HTTP.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p><b>WWW</b> (World Wide Web) : service d&#39;Internet, un ensemble de pages et de ressources reliées par des liens hypertextes, consultées avec un navigateur.<br><b>HTML</b> (HyperText Markup Language) : langage de balisage qui décrit la structure et le contenu des pages Web ; le navigateur l&#39;interprète pour afficher la page.<br><b>HTTP</b> (HyperText Transfer Protocol) : protocole de la couche application, de type requête/réponse (GET, POST, PUT), qui transfère les pages du serveur Web vers le client. Il s&#39;appuie sur TCP (port 80 ; HTTPS = 443, chiffré par TLS).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"23\"><div class=\"ex-q\"><p><strong>6.2.</strong> URL <a href=\"http://www.microsoft.com/products/pc.htm\">http://www.microsoft.com/products/pc.htm</a> : a) définition et rôle d&#39;une URL ; b) décomposer l&#39;URL en donnant le rôle de chaque partie.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p><b>a)</b> URL (Uniform Resource Locator) : adresse unique d&#39;une ressource sur le Web. Elle indique au navigateur quel protocole utiliser, quel serveur contacter et quelle ressource demander.<br><b>b)</b><br>• <b>http</b> : protocole utilisé<br>• <b><a href=\"http://www.microsoft.com\">www.microsoft.com</a></b> : nom du serveur (domaine), traduit en IP par le DNS ; « www » = serveur Web, « microsoft » = domaine, « .com » = domaine de premier niveau<br>• <b>/products/</b> : chemin (répertoire) sur le serveur<br>• <b>pc.htm</b> : fichier demandé (page HTML)</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"24\"><div class=\"ex-q\"><p><strong>6.3.</strong> Par quel moyen fait-on la correspondance entre l&#39;adresse IP d&#39;un serveur et son nom sur Internet ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Par le <b>DNS</b> (Domain Name System) : une base de données distribuée et hiérarchique qui associe les noms de domaine aux adresses IP (port 53).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"25\"><div class=\"ex-q\"><p><strong>6.4.</strong> Définition et rôle de SMTP.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p><b>SMTP</b> (Simple Mail Transfer Protocol) : protocole application qui assure l&#39;<b>envoi</b> du courrier, du client expéditeur vers son serveur de messagerie, puis entre serveurs de messagerie (MTA). Port TCP 25.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"26\"><div class=\"ex-q\"><p><strong>6.5.</strong> Définition et rôle de POP.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p><b>POP3</b> (Post Office Protocol v3) : protocole application qui permet au client de <b>récupérer</b> (télécharger) son courrier depuis le serveur de messagerie. Port TCP 110. (IMAP fait la même chose en laissant les messages sur le serveur.)</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"27\"><div class=\"ex-q\"><p><strong>6.6.</strong> Syntaxe générale d&#39;une adresse e-mail.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p><b>nom_utilisateur@nom_de_domaine</b>, par exemple <a href=\"mailto:etudiant@fpbm.ma\">etudiant@fpbm.ma</a>. La partie avant le @ désigne la boîte aux lettres ; la partie après le @ désigne le domaine du serveur de messagerie.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"28\"><div class=\"ex-q\"><p><strong>6.7.</strong> Citer 4 possibilités d&#39;accès à un fournisseur d&#39;accès Internet.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Au choix : <b>ADSL</b> (ligne téléphonique) ; <b>fibre optique</b> ; <b>réseau mobile 3G/4G/5G</b> ; <b>RNIS</b> (cité dans l&#39;énoncé) ; modem RTC (bas débit) ; <b>satellite</b> ; câble ; liaison louée / spécialisée ; WiMAX.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"29\"><div class=\"ex-q\"><p><strong>6.8.</strong> Compléter le schéma entre le client et le serveur de courrier : « Réception du courrier par … » / « Envoi du courrier par … ».</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p><b>Envoi</b> du courrier par <b>SMTP</b> (client → serveur).<br><b>Réception</b> du courrier par <b>POP3</b> (ou IMAP) (serveur → client).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><section class=\"exo\"><h3>Exercice 7 · Couches, encapsulation et ports</h3><div class=\"ex\" data-x=\"30\"><div class=\"ex-q\"><p><strong>7.1.</strong> Un utilisateur accède à un site Web en tapant une URL. Quelles couches OSI sont impliquées et quelles sont leurs fonctions dans ce scénario ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p><b>Toutes les 7 couches</b> côté client et côté serveur :<br>7 Application : HTTP (requête GET), DNS (résolution du nom)<br>6 Présentation : codage des données (HTML, images), chiffrement TLS si HTTPS<br>5 Session : ouverture, maintien et fermeture du dialogue avec le serveur<br>4 Transport : TCP, port 80/443, connexion en 3 temps, segmentation, fiabilité<br>3 Réseau : IP source et destination, routage à travers Internet<br>2 Liaison : trames Ethernet/Wi-Fi, adresses MAC, contrôle d&#39;erreurs (FCS)<br>1 Physique : transmission des bits sur le câble ou les ondes.<br>Les routeurs intermédiaires n&#39;utilisent que les couches 1 à 3.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"31\"><div class=\"ex-q\"><p><strong>7.2.</strong> Lors d&#39;une capture réseau, vous observez : TCP SYN, HTTP GET, IP packet, TCP ACK, Ethernet frame. Classez-les dans l&#39;ordre de l&#39;encapsulation complète.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Deux idées : la chronologie (la connexion TCP s&#39;établit avant la requête) et l&#39;imbrication des couches.</p>\n</div><div class=\"ex-c\" hidden><p>Chronologie de l&#39;échange : <b>TCP SYN → (SYN-ACK du serveur) → TCP ACK → HTTP GET</b>. La connexion TCP en 3 temps précède la requête HTTP.<br>Encapsulation de la requête, de haut en bas : <b>HTTP GET (données) → segment TCP → IP packet → Ethernet frame</b>.<br>Donc : TCP SYN, TCP ACK, HTTP GET, IP packet, Ethernet frame.<br>(L&#39;énoncé mélange chronologie et couches ; certitude moyenne sur l&#39;ordre exact attendu. Si le prof ne veut que l&#39;encapsulation : HTTP GET → TCP → IP → Ethernet.)</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"32\"><div class=\"ex-q\"><p><strong>7.3.</strong> Pour chaque port, donner le service et le protocole de transport : 20/21, 22, 25, 53, 80, 443, 110.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>20/21 → <b>FTP</b> (20 données, 21 contrôle) · TCP<br>22 → <b>SSH</b> · TCP<br>25 → <b>SMTP</b> · TCP<br>53 → <b>DNS</b> · UDP (et TCP)<br>80 → <b>HTTP</b> · TCP<br>443 → <b>HTTPS</b> · TCP<br>110 → <b>POP3</b> · TCP</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"33\"><div class=\"ex-q\"><p><strong>7.4.</strong> Un utilisateur ouvre sa boîte mail via un navigateur (ex. Gmail). Expliquez les protocoles utilisés à la couche Application.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>• <b>DNS</b> : traduit mail.google.com en adresse IP.<br>• <b>HTTPS</b> (HTTP + TLS) : entre le navigateur et le serveur Gmail, pour afficher la boîte, lire et envoyer les messages (webmail).<br>• Côté serveurs : <b>SMTP</b> pour acheminer les messages envoyés vers les autres serveurs de messagerie. POP3/IMAP ne servent que si on utilise un client lourd (Outlook) ; avec un webmail, le navigateur passe par HTTPS.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"34\"><div class=\"ex-q\"><p><strong>7.5.</strong> Un utilisateur entre <a href=\"https://www.fpbm.ma\">https://www.fpbm.ma</a> dans son navigateur. Expliquez le rôle de la couche Application dans ce processus.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><ol>\n<li>Le navigateur (client) interprète l&#39;URL : protocole <b>HTTPS</b>, serveur <b><a href=\"http://www.fpbm.ma\">www.fpbm.ma</a></b>, fichier par défaut (index).<br>2. <b>DNS</b> : résolution de <a href=\"http://www.fpbm.ma\">www.fpbm.ma</a> en adresse IP.<br>3. <b>HTTPS</b> : la requête GET part, chiffrée par SSL/TLS, vers le port 443 du serveur Web.<br>4. Le serveur répond (200 OK + code HTML) ; le navigateur interprète le HTML et affiche la page.<br>La couche Application sert d&#39;interface entre l&#39;utilisateur et le réseau : elle fournit les services (DNS, HTTP) et définit le format des échanges.</li>\n</ol>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><section class=\"exo\"><h3>Exercice 1 · Communication, messagerie, modes de connexion</h3><div class=\"ex\" data-x=\"35\"><div class=\"ex-q\"><p><strong>T2.1.1.</strong> Organisez ces termes par ordre chronologique : segmentation / multiplexage / étiquetage / émission / réception / encodage / décodage / assemblage.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Sépare d&#39;abord ce que fait l&#39;émetteur de ce que fait le récepteur.</p>\n</div><div class=\"ex-c\" hidden><p><b>1 Segmentation → 2 Multiplexage → 3 Étiquetage → 4 Encodage → 5 Émission → 6 Réception → 7 Décodage → 8 Assemblage</b><br>Émetteur : on découpe le message, on entremêle les conversations sur le même canal, on ajoute les étiquettes de remise, on encode les bits en signaux puis on les envoie. Récepteur : il reçoit, décode les signaux en bits et réassemble les segments dans l&#39;ordre grâce aux étiquettes.<br>⚠ La correction manuscrite du TD place le multiplexage après l&#39;émission (segmentation, étiquetage, encodage, émission, multiplexage, réception, décodage, assemblage). Je n&#39;ai pas le corrigé officiel : l&#39;ordre ci-dessus est l&#39;ordre logique du cours (certitude moyenne à élevée). Demande au prof l&#39;ordre qu&#39;il note.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"36\"><div class=\"ex-q\"><p><strong>T2.1.2.</strong> Expliquez par un schéma comment on envoie un message de la boîte <a href=\"mailto:zzz@yahoo.fr\">zzz@yahoo.fr</a> vers la boîte <a href=\"mailto:yyy@gmail.com\">yyy@gmail.com</a>. À chaque étape, donnez les agents et les protocoles en jeu.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Quatre agents : MUA, MTA, MTA, MDA. Pense à SMTP pour pousser et à POP3 ou IMAP pour récupérer.</p>\n</div><div class=\"ex-c\" hidden><p><b><a href=\"mailto:zzz@yahoo.fr\">zzz@yahoo.fr</a> (MUA)</b> ──SMTP──▶ <b>MTA yahoo.fr</b> ──SMTP──▶ <b>MTA gmail.com</b> ──▶ <b>MDA</b> (dépôt dans la boîte) ──POP3 ou IMAP──▶ <b>MUA de <a href=\"mailto:yyy@gmail.com\">yyy@gmail.com</a></b><br>1) Envoi : le MUA (client de messagerie) remet le message à son serveur par <b>SMTP</b> (TCP 25).<br>2) Transfert : le MTA de yahoo.fr cherche le serveur de gmail.com dans le <b>DNS</b> (enregistrement MX) et lui transmet le message par <b>SMTP</b>.<br>3) Remise : le <b>MDA</b> de gmail.com dépose le message dans la boîte de yyy.<br>4) Lecture : yyy le récupère avec son MUA par <b>POP3</b> (110) ou <b>IMAP</b> (143), ou par HTTP en webmail.<br>À noter : le schéma manuscrit du corrigé a inversé les adresses (il fait partir <a href=\"mailto:333@gmail.com\">333@gmail.com</a> vers <a href=\"mailto:yyy@yahoo.fr\">yyy@yahoo.fr</a>), mais les agents et les protocoles sont les mêmes ; suis le sens de l&#39;énoncé.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"37\"><div class=\"ex-q\"><p><strong>T2.1.3.</strong> Indiquez les différences majeures entre POP3 et IMAP (flux, stockage côté serveur, gestion des dossiers, accès multiple).</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Un tableau à 4 lignes : une pour chaque critère de l&#39;énoncé.</p>\n</div><div class=\"ex-c\" hidden><p><b>Flux</b> : POP3 télécharge les messages vers la machine locale (souvent en les supprimant du serveur) ; IMAP consulte les messages directement sur le serveur et ne synchronise que les actions (lecture, suppression).<br><b>Stockage serveur</b> : POP3 minimal ; IMAP conserve tout sur le serveur, accessible depuis plusieurs appareils.<br><b>Dossiers</b> : POP3 gère une seule boîte de réception ; IMAP gère plusieurs dossiers (brouillons, envoyés, archives, spam).<br><b>Accès multiple</b> : POP3 convient à un seul appareil, sans synchronisation d&#39;état ; IMAP synchronise lecture, suppression et déplacements sur tous les clients.<br>En résumé : POP3 = usage simple et local ; IMAP = usage connecté et multi-appareils (ports 110 et 143).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"38\"><div class=\"ex-q\"><p><strong>T2.1.4.</strong> Expliquez par deux schémas comment on peut se connecter à un autre périphérique du réseau.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Qui joue le rôle de serveur dans chaque cas ?</p>\n</div><div class=\"ex-c\" hidden><p><b>1) Mode client-serveur</b><br>   Client 1 ─┐<br>   Client 2 ─┼── Serveur   (chaque client exécute une application cliente et envoie ses requêtes au serveur dédié)<br>   Client 3 ─┘<br><b>2) Mode pair à pair (P2P)</b><br>   Pair A ──── switch ──── Pair B   (chaque machine est à la fois client et serveur, sans serveur central)<br>Client-serveur : administration et sécurité centralisées, mais le serveur est un point unique de panne. P2P : simple et sans serveur dédié, mais peu sécurisé et difficile à administrer à grande échelle.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><section class=\"exo\"><h3>Exercice 2 · Décoder une trame Ethernet et un segment TCP</h3><div class=\"ex\" data-x=\"39\"><div class=\"ex-q\"><p><strong>T2.2.1.</strong> Trame Ethernet : aa aa aa aa aa aa aa ab 00 40 07 03 04 2b 02 60 8c e8 02 91 08 00 45 00 00 2c 14 ee 00 00 3c 06 85 7a 93 d2 5e 63 93 d2 5e 5c 10 a4 09 e7 42 0c 56 01 00 00 00 00 60 02 40 00 c1 29 00 00 02 04 05 b4 02 80 9a b2 5c 48. a) Que représentent les 8 octets de début ? b) Donnez les adresses MAC du destinataire et de l&#39;émetteur. c) Quel protocole est encapsulé ? d) Que représentent les 4 octets de la fin ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Découpe : 8 octets, puis 6, puis 6, puis 2. Les 4 derniers octets sont la fin de la trame.</p>\n</div><div class=\"ex-c\" hidden><p><b>a)</b> Le préambule (7 octets aa = 10101010, synchronisation) suivi du SFD (ab = 10101011, début de trame).<br><b>b)</b> Destinataire : <b>00:40:07:03:04:2b</b>. Émetteur : <b>02:60:8c:e8:02:91</b>.<br><b>c)</b> EtherType <b>0800 = IPv4</b>. Dans l&#39;en-tête IPv4 (45 = version 4, 20 octets), le champ Protocole vaut 06 : c&#39;est du <b>TCP</b> (IP 147.210.94.99 vers 147.210.94.92, TTL 60).<br><b>d)</b> <b>9a b2 5c 48 = FCS</b> (séquence de contrôle, CRC-32). Juste avant, 02 80 est du bourrage : l&#39;IP annonce 44 octets (20 d&#39;IP + 24 de TCP), alors que les données d&#39;une trame doivent faire au moins 46.<br>Contrôle : 8 + 6 + 6 + 2 + 46 + 4 = 72 octets, soit une trame de 64 octets plus le préambule et le SFD. J&#39;ai décodé les octets par un script ; je n&#39;ai pas recalculé le CRC (l&#39;exemple du TD n&#39;a pas forcément un FCS valide).<br>Le corrigé manuscrit ne mentionne pas le bourrage.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"40\"><div class=\"ex-q\"><p><strong>T2.2.2.</strong> Décodez les informations sur la connexion et les numéros de séquence du segment TCP suivant, donné en hexadécimal : 00 15 0F 87 9C CB 7E 01 27 E3 EA 01 50 12 10 00 DF 3D 00 00</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>20 octets : ports (2 + 2), Seq (4), ACK (4), longueur et drapeaux (2), fenêtre (2), checksum (2), urgent (2).</p>\n</div><div class=\"ex-c\" hidden><p><b>Port source</b> 00 15 = <b>21</b> (FTP, contrôle) · <b>port destination</b> 0F 87 = <b>3975</b> (port éphémère du client).<br><b>Seq</b> 9C CB 7E 01 = <b>2 630 581 761</b> (numéro du premier octet envoyé, ici le numéro initial du serveur).<br><b>ACK</b> 27 E3 EA 01 = <b>669 248 001</b> (4 octets : le corrigé manuscrit n&#39;en note que 2).<br><b>Longueur d&#39;en-tête</b> : 5 × 4 = 20 octets, donc sans option.<br><b>Drapeaux</b> 0x12 = 0x10 (ACK) + 0x02 (SYN) = <b>SYN + ACK</b>.<br><b>Fenêtre</b> 0x1000 = <b>4096</b> · checksum DF 3D · urgent 00 00.<br>Conclusion : c&#39;est la <b>2e étape de la poignée de main</b> : le serveur FTP accepte la connexion. ACK = numéro initial du client + 1, donc le client avait choisi 669 248 000.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><section class=\"exo\"><h3>Exercice 3 · Numéros de séquence et ACK</h3><div class=\"ex\" data-x=\"41\"><div class=\"ex-q\"><p><strong>T2.3.1.</strong> Un client envoie des données via TCP. Sa MSS est de 1000 octets. Il envoie successivement 3 segments de 1000, 1000 et 500 octets (sans options TCP). Le Seq initial du premier octet envoyé est 2001. Pour chaque segment, donnez : le Seq dans l&#39;en-tête, la longueur utile, l&#39;ACK attendu du serveur si tout est reçu en ordre, et l&#39;ACK envoyé par le client après réception d&#39;un ACK cumulatif.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Seq suivant = Seq + longueur utile. ACK = prochain octet attendu.</p>\n</div><div class=\"ex-c\" hidden><p>Segment 1 : Seq <b>2001</b>, utile <b>1000</b> (octets 2001 à 3000), ACK attendu <b>3001</b>.<br>Segment 2 : Seq <b>3001</b>, utile <b>1000</b> (3001 à 4000), ACK attendu <b>4001</b>.<br>Segment 3 : Seq <b>4001</b>, utile <b>500</b> (4001 à 4500), ACK attendu <b>4501</b>.<br><b>ACK cumulatif</b> : le serveur peut n&#39;envoyer qu&#39;un seul accusé final, <b>ACK = 4501</b>, après avoir reçu le segment 3 : il confirme les 2500 octets d&#39;un coup (2001 à 4500).<br>Règle : ACK = dernier octet reçu en ordre + 1.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><section class=\"exo\"><h3>Exercice 4 · Fenêtres cwnd et rwnd</h3><div class=\"ex\" data-x=\"42\"><div class=\"ex-q\"><p><strong>T2.4.1.</strong> Un émetteur TCP a cwnd = 3000 octets et rwnd = 2500 octets. Sa MSS = 1000. Combien d&#39;octets peut-il envoyer immédiatement ? Combien de segments ? Que se passe-t-il si rwnd tombe à 1200 après l&#39;envoi d&#39;un segment ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Fenêtre effective = le plus petit des deux. Puis retranche ce qui est déjà parti.</p>\n</div><div class=\"ex-c\" hidden><p><b>W = min(cwnd, rwnd) = min(3000, 2500) = 2500 octets</b> à envoyer sans attendre d&#39;ACK.<br>Segments : 2500 = 1000 + 1000 + 500, soit <b>3 segments</b> (2 de 1000 octets et 1 de 500).<br><b>rwnd = 1200</b> : W = min(3000, 1200) = <b>1200 octets</b>. L&#39;émetteur doit respecter cette nouvelle limite : il ne peut pas avoir plus de 1200 octets non acquittés. Après un segment de 1000 octets, il peut encore envoyer 1200 − 1000 = <b>200 octets</b> (un segment partiel), puis il attend un ACK.<br>cwnd = contrôle de <b>congestion</b> (côté émetteur) ; rwnd = contrôle de <b>flux</b> (côté récepteur).<br>Note : TCP peut préférer attendre d&#39;avoir de quoi remplir un segment complet ; le TD compte le segment partiel.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><section class=\"exo\"><h3>Exercice 5 · Lire un en-tête TCP, pertes et fenêtre</h3><div class=\"ex\" data-x=\"43\"><div class=\"ex-q\"><p><strong>T2.5.1.</strong> Trame de 100 octets, n° d&#39;ordre de début = 1. En-tête TCP : port source 41152, port destination 80, SEQ 101, fenêtre 1000 octets. 1) Que peut-on en dire ? a) Quel protocole d&#39;application a envoyé le message ? b) Quel type de données serait attaché à cet en-tête ? c) C&#39;est l&#39;en-tête de la trame n° combien ? d) Quand le récepteur enverra-t-il un accusé de réception, et quel sera son numéro ACK ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Port 80 = quel protocole ? La trame 1 porte les octets 1 à 100.</p>\n</div><div class=\"ex-c\" hidden><p><b>a)</b> Le port de destination 80 indique <b>HTTP</b> (le port source 41152 est le port éphémère du client).<br><b>b)</b> Une <b>requête HTTP</b> adressée à un serveur Web (par exemple un GET qui demande une page HTML).<br><b>c)</b> La <b>trame n° 2</b> : la trame 1 porte les octets 1 à 100, donc la trame 2 commence à SEQ = 101.<br><b>d)</b> La fenêtre est de 1000 octets : l&#39;émetteur envoie 10 trames de 100 octets avant d&#39;attendre. Le récepteur accuse réception après ces <b>10 trames</b> (octets 1 à 1000) : <b>ACK = 1001</b>.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"44\"><div class=\"ex-q\"><p><strong>T2.5.2.</strong> Même situation. e) Schématisez l&#39;en-tête de la dernière trame avant le premier accusé de réception. f) Schématisez l&#39;accusé de réception.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>La dernière trame avant l&#39;ACK est la 10e : quel est son SEQ ?</p>\n</div><div class=\"ex-c\" hidden><p><b>e) Trame n° 10</b> : port source <b>41152</b> · port destination <b>80</b> · SEQ <b>901</b> · ACK — · longueur — · réservé — · indicateur — · fenêtre <b>1000</b>.<br><b>f) Accusé de réception</b> : port source <b>80</b> · port destination <b>41152</b> (les ports s&#39;inversent) · SEQ <b>1</b> (le récepteur n&#39;envoie pas de données) · ACK <b>1001</b> · fenêtre <b>1000</b>.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"45\"><div class=\"ex-q\"><p><strong>T2.5.3.</strong> Si, pendant la transmission, les trames sont perdues à partir du n° 501 : a) Que fait le récepteur ? b) Que fait l&#39;émetteur ? c) À quel niveau de couche agissent-ils ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Le récepteur n&#39;acquitte que ce qu&#39;il a reçu dans l&#39;ordre.</p>\n</div><div class=\"ex-c\" hidden><p><b>a)</b> Le récepteur envoie un accusé avec <b>ACK = 501</b> : il confirme les octets jusqu&#39;à 500 et redemande le 501.<br><b>b)</b> L&#39;émetteur <b>retransmet à partir de SEQ = 501</b>, soit après expiration de son délai d&#39;attente, soit après plusieurs ACK identiques.<br><b>c)</b> À la <b>couche transport</b> (TCP assure la fiabilité).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"46\"><div class=\"ex-q\"><p><strong>T2.5.4.</strong> Suite à cette perte, le récepteur décide de réduire la fenêtre à 500. a) Schématisez la trame envoyée par le récepteur. b) Quelle sera la prochaine trame envoyée par le récepteur ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>a) l&#39;ACK de la perte, avec la nouvelle fenêtre. b) Une fois les octets 501 à 1000 retransmis, quel est le nouvel ACK ?</p>\n</div><div class=\"ex-c\" hidden><p><b>a)</b> Port source <b>80</b> · port destination <b>41152</b> · SEQ <b>1</b> · ACK <b>501</b> · fenêtre <b>500</b>.<br><b>b)</b> La fenêtre de 500 octets permet de retransmettre les octets 501 à 1000 (5 trames de 100). Le récepteur acquitte alors : port source <b>80</b> · port destination <b>41152</b> · SEQ <b>1</b> · ACK <b>1001</b> · fenêtre <b>500</b>.<br>⚠ Le corrigé manuscrit met SEQ = 2 sur cette dernière trame. Un ACK pur ne consomme pas de numéro de séquence, donc SEQ reste 1 d&#39;après les règles de TCP (certitude moyenne : vérifie avec le prof ce qu&#39;il note).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><section class=\"exo\"><h3>Exercice 6 · Domaines de collision et de diffusion</h3><div class=\"ex\" data-x=\"47\"><div class=\"ex-q\"><p><strong>T2.6.1.</strong> D&#39;après la figure du TD (deux équipements de chaque type X, Y et Z, 10 PC, 15 câbles), complétez le tableau : pour chaque combinaison de X, Y, Z (Hub, Switch, Routeur), le nombre de domaines de collision et de diffusion. Combinaisons : (X, Y, Z) = (Hub, Switch, Hub) ; (Switch, Hub, Routeur) ; (Routeur, Switch, Switch) ; (Routeur, Routeur, Switch).</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Compte les câbles (15). Un hub fond tous ses câbles en un seul domaine de collision. Seul un routeur coupe la diffusion.</p>\n</div><div class=\"ex-c\" hidden><p><b>(Hub, Switch, Hub)</b> : <b>5</b> domaines de collision · <b>1</b> de diffusion.<br><b>(Switch, Hub, Routeur)</b> : <b>11</b> · <b>6</b>.<br><b>(Routeur, Switch, Switch)</b> : <b>15</b> · <b>6</b>.<br><b>(Routeur, Routeur, Switch)</b> : <b>15</b> · <b>10</b>.<br>Méthode : la figure a 15 câbles (5 entre équipements, 10 vers les PC). Sans hub, chaque câble est un domaine de collision (15). Un hub fond ses câbles : avec Hub-Switch-Hub, les hubs X et Z regroupent leurs câbles voisins, d&#39;où 5. Pour la diffusion, hubs et switchs relient leurs câbles dans un même domaine ; chaque interface de routeur en ouvre un de plus.<br>⚠ Le corrigé manuscrit donne 12 pour la dernière case de diffusion. J&#39;ai compté 10 à la main puis vérifié par un programme (graphe de la figure) : les trois autres lignes concordent avec le manuscrit, pas celle-là. Certitude : élevée pour 10 avec cette figure ; vérifie ce que le prof note.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><section class=\"exo\"><h3>Exercice 7 · ARP, ICMP, ping et traceroute (corrigé rédigé ici, absent du document)</h3><div class=\"ex\" data-x=\"48\"><div class=\"ex-q\"><p><strong>T2.7.1.</strong> Sur un réseau Ethernet 192.168.10.0/24, l&#39;hôte A veut envoyer à l&#39;IP 192.168.10.200. Il n&#39;a pas l&#39;adresse MAC correspondante. Que se passe-t-il ? Dans quel domaine se propage la requête ARP ? Le routeur connecté au même switch reçoit-il cette ARP ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>192.168.10.200 est-elle dans le même réseau que A ? Qu&#39;utilise-t-on comme MAC de destination pour une diffusion ?</p>\n</div><div class=\"ex-c\" hidden><p>192.168.10.200 appartient au même réseau /24 : A ne passe pas par une passerelle, il doit connaître la MAC de cette IP. Il diffuse une <b>requête ARP</b> (« qui a 192.168.10.200 ? ») dans une trame de MAC destination <b>FF:FF:FF:FF:FF:FF</b>. La machine qui porte cette IP répond directement à A avec sa MAC (réponse unicast) ; A la range dans sa table ARP, puis envoie ses données.<br>La requête se propage dans le <b>domaine de diffusion</b> : tout le réseau local, donc tous les ports du switch.<br><b>Oui</b>, le routeur branché sur le même switch reçoit la requête, car il est dans le même domaine de diffusion. Mais il <b>ne la retransmet pas</b> vers ses autres réseaux : la diffusion s&#39;arrête au routeur.<br>Si personne ne répond, l&#39;ARP échoue et l&#39;envoi aussi.<br>(Corrigé rédigé ici : le document du TD n&#39;a pas l&#39;exercice 7. Certitude élevée, c&#39;est du cours standard.)</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"49\"><div class=\"ex-q\"><p><strong>T2.7.2.</strong> Expliquez à quoi sert le protocole ICMP dans une communication IP. Indiquez si ICMP transporte des données utilisateur (comme TCP/UDP) ou non.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Pense aux messages d&#39;erreur et aux outils de diagnostic.</p>\n</div><div class=\"ex-c\" hidden><p>ICMP (Internet Control Message Protocol) est le protocole de <b>contrôle et de signalisation d&#39;erreurs</b> d&#39;IP : il signale qu&#39;un paquet n&#39;a pas pu être livré (destination inaccessible, TTL expiré), et permet de tester la joignabilité (ping) et d&#39;explorer un chemin (traceroute).<br><b>Non, il ne transporte pas de données utilisateur.</b> TCP et UDP transportent les données des applications ; ICMP ne transporte que des messages de contrôle (type, code, checksum), encapsulés directement dans IP (champ Protocole = 1).<br>(Corrigé rédigé ici, certitude élevée.)</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"50\"><div class=\"ex-q\"><p><strong>T2.7.3.</strong> Un administrateur exécute : ping 192.168.1.10. Expliquez les messages ICMP échangés, leur type et leur code, et ce que cela signifie si l&#39;hôte répond ou non.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Deux messages : une requête et une réponse. Quels types ?</p>\n</div><div class=\"ex-c\" hidden><p>L&#39;émetteur envoie un <b>Echo Request</b> : <b>type 8, code 0</b>. Si l&#39;hôte est joignable, il répond par un <b>Echo Reply</b> : <b>type 0, code 0</b>.<br><b>Réponse reçue</b> : l&#39;hôte est joignable et sa pile IP fonctionne, le chemin aller-retour existe (le temps affiché est le RTT).<br><b>Pas de réponse</b> (délai dépassé) : hôte éteint ou injoignable, route manquante, perte de paquets, ou ICMP bloqué par un pare-feu. Un routeur peut aussi répondre par <b>Destination Unreachable</b> (type 3) pour dire qu&#39;il n&#39;a pas de route.<br>(Corrigé rédigé ici, certitude élevée.)</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"51\"><div class=\"ex-q\"><p><strong>T2.7.4.</strong> Lorsqu&#39;un routeur reçoit un paquet IP vers une destination inconnue, il renvoie un message ICMP à l&#39;émetteur. a) Quel type de message ICMP est envoyé ? b) Que contient ce message ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Un seul mot en anglais pour le type : destination …</p>\n</div><div class=\"ex-c\" hidden><p><b>a)</b> Un message <b>Destination Unreachable</b> (<b>type 3</b>), avec un code qui précise la cause (0 = réseau inaccessible, 1 = hôte inaccessible, 3 = port ina
