GGGG · c) 2001:d02::14:0:0:95 · d) 2001:1111:2222:3333:44444:55555:6666:7777<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Séparateur « : », chiffres 0-9 et a-f, au plus 4 chiffres par groupe, 8 groupes en tout.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Seule <b>c)<\/b> est valide. a) séparée par des points · b) G n&#39;est pas hexadécimal · d) des groupes de 5 chiffres.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"37\"><div class=\"ex-q\"><p>Abrège 3001:0000:0000:0000:0000:0000:0000:1111.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><b>3001::1111<\/b>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"38\"><div class=\"ex-q\"><p>Pourquoi n&#39;y a-t-il pas d&#39;adresse de diffusion en IPv6 ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Le broadcast dérangeait toutes les machines du réseau. IPv6 le remplace par le <b>multicast<\/b> (par exemple FF02::1 pour joindre tous les nœuds du lien), qui ne touche que les machines concernées.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 19 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">L&#39;adresse 172.20.5.9 est de classe…<\/div><button class=\"opt\" data-o=\"0\">A<\/button><button class=\"opt\" data-o=\"1\">B<\/button><button class=\"opt\" data-o=\"2\">C<\/button><button class=\"opt\" data-o=\"3\">D<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Combien de machines peut-on adresser dans un réseau de classe C ?<\/div><button class=\"opt\" data-o=\"0\">256<\/button><button class=\"opt\" data-o=\"1\">255<\/button><button class=\"opt\" data-o=\"2\">254<\/button><button class=\"opt\" data-o=\"3\">65 534<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Le masque 255.255.255.224 s&#39;écrit en notation CIDR…<\/div><button class=\"opt\" data-o=\"0\">/24<\/button><button class=\"opt\" data-o=\"1\">/26<\/button><button class=\"opt\" data-o=\"2\">/27<\/button><button class=\"opt\" data-o=\"3\">/28<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Quelle est l&#39;adresse de diffusion du réseau 192.168.1.32/27 ?<\/div><button class=\"opt\" data-o=\"0\">192.168.1.62<\/button><button class=\"opt\" data-o=\"1\">192.168.1.63<\/button><button class=\"opt\" data-o=\"2\">192.168.1.64<\/button><button class=\"opt\" data-o=\"3\">192.168.1.255<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Combien d&#39;hôtes utilisables dans un réseau /28 ?<\/div><button class=\"opt\" data-o=\"0\">16<\/button><button class=\"opt\" data-o=\"1\">14<\/button><button class=\"opt\" data-o=\"2\">30<\/button><button class=\"opt\" data-o=\"3\">28<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Quelle est la dernière adresse utilisable de 10.96.0.0/11 ?<\/div><button class=\"opt\" data-o=\"0\">10.96.255.254<\/button><button class=\"opt\" data-o=\"1\">10.127.255.254<\/button><button class=\"opt\" data-o=\"2\">10.255.255.254<\/button><button class=\"opt\" data-o=\"3\">10.1  le 2ᵉ octet, blocs de 32 : 96 à 127. Diffusion 10.127.255.255, donc dernier hôte 10.127.255.254."},{"n":"n46","q":"On veut 10 sous-réseaux à partir d&#39;un réseau de classe B. Combien de bits faut-il emprunter ?","o":["3","4","5","10"],"a":1,"e":"2³ = 8 &lt; 10 et 2⁴ = 16 ≥ 10 : 4 bits, donc un masque /20."},{"n":"n46","q":"172.32.0.0 est découpé en /20. Quelle est l&#39;adresse du sous-réseau n° 3 ?","o":["172.32.3.0","172.32.16.0","172.32.32.0","172.32.48.0"],"a":2,"e":"Le pas est 16 dans le 3ᵉ octet : SR1 = 0, SR2 = 16, SR3 = 32."},{"n":"n47","q":"Deux PC de réseaux différents, reliés seulement par des switchs, ne communiquent pas parce que…","o":["les switchs sont trop lents","il n&#39;y a pas de routeur ni de passerelle par défaut","leurs adresses sont de classes différentes","leur masque est /24"],"a":1,"e":"Un switch ne passe pas d&#39;un réseau à l&#39;autre. Il faut un routeur et une passerelle par défaut."},{"n":"n47","q":"Un masque plus court que le masque par défaut de la classe correspond à…","o":["un sous-réseau","un sur-réseau (CIDR)","une adresse de diffusion","une adresse IPv6"],"a":1,"e":"Plus de bits machine qu&#39;à l&#39;origine : on regroupe plusieurs réseaux en un seul (agrégation CIDR)."},{"n":"n48","q":"Combien de bits fait une adresse IPv6 ?","o":["32","64","128","256"],"a":2,"e":"8 groupes de 16 bits : 128 bits, contre 32 pour IPv4."},{"n":"n48","q":"L&#39;adresse MAC multicast liée à une adresse IP multicast IPv4 commence par…","o":["33:33","01:00:5e","ff:ff:ff","02:00:4c"],"a":1,"e":"Pour IPv4, 01:00:5e suivi des 23 bits de poids faible de l&#39;adresse IP (TD 4, exercice 7)."},{"n":"n57","q":"Un message envoyé à toutes les machines du réseau local est une…","o":["monodiffusion","multidiffusion","diffusion (broadcast)","anycast"],"a":2,"e":"Broadcast : 1 vers tous les hôtes du réseau local. Multicast : seulement un groupe inscrit."},{"n":"n57","q":"Pour une imprimante réseau partagée, on préfère…","o":["une adresse statique","une adresse DHCP","une adresse 169.254.x.x","une adresse multicast"],"a":0,"e":"Elle doit rester joignable à la même adresse : statique."},{"n":"n58","q":"Laquelle de ces adresses est privée ?","o":["172.32.10.1","172.18.10.1","192.169.1.1","11.0.0.1"],"a":1,"e":"Plage privée de classe B : 172.16 à 172.31. 172.18 en fait partie."},{"n":"n58","q":"Quel organisme distribue les adresses IP en Afrique ?","o":["RIPE NCC","ARIN","AFRINIC","l&#39;IANA, directement aux utilisateurs"],"a":2,"e":"AFRINIC est le RIR de l&#39;Afrique. L&#39;IANA ne donne rien directement aux utilisateurs."},{"n":"n59","q":"En VLSM, quel bloc donner à un sous-réseau de 26 machines ?","o":["/26","/27","/28","/24"],"a":1,"e":"/27 : 2⁵ − 2 = 30 ≥ 26. /28 ne donne que 14."},{"n":"n59","q":"Quel masque pour une liaison point à point entre deux routeurs ?","o":["/24","/29","/30","/32"],"a":2,"e":"/30 : 2 adresses utilisables, une par interface."},{"n":"n60","q":"Quel champ IPv4 n&#39;existe plus dans l&#39;en-tête IPv6 ?","o":["Version","Adresse source","Somme de contrôle d&#39;en-tête","Limite de sauts"],"a":2,"e":"La somme de contrôle est supprimée (déjà faite par les couches 2 et 4). Le TTL devient la limite de sauts."},{"n":"n60","q":"En IPv6, ce qui remplace le broadcast, c&#39;est…","o":["l&#39;anycast","le multicast","le lien local","le NAT"],"a":1,"e":"Pas de broadcast en IPv6 : le multicast (ex. FF02::1) le remplace."}]},{"id":"routage","t":"Ch4 · Routage IP : statique, RIP, OSPF","seance":"Chapitre 4","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il te faut deux choses du chapitre 3 : trouver l&#39;adresse réseau d&#39;une machine (adresse ET masque), et savoir que deux réseaux différents ne se parlent qu&#39;à travers un routeur.<\/p>\n<details class=\"prereq\"><summary><b>Vérifie ton prérequis.<\/b> Un paquet va vers 172.16.3.10. Le routeur connaît 172.16.3.0/24 et 172.16.0.0/16. Laquelle des deux routes correspond ?<\/summary><p>Les deux : 172.16.3.10 ET 255.255.255.0 = 172.16.3.0, et ET 255.255.0.0 = 172.16.0.0. Le routeur choisit la plus précise, le /24 (préfixe le plus long). C'est la règle de base de ce chapitre.<\/p><\/details><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « panneau indicateur ».<\/strong> Un routeur ne connaît jamais le chemin complet : pour chaque réseau, il sait seulement <strong>par où envoyer<\/strong> (le prochain saut). Tout le chapitre répond à une question : comment le routeur remplit ses panneaux ? À la main (statique) ou en discutant avec ses voisins (dynamique : RIP, OSPF, BGP).<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Croire qu&#39;une route suffit dans un sens. Un ping a besoin d&#39;une route <strong>à l&#39;aller et au retour<\/strong> : chaque routeur traversé doit connaître le réseau de la source. C&#39;est l&#39;erreur n° 1 en TP (voir le TP 3).<\/p>\n<\/aside><p>À la fin, tu sais lire une table de routage, fragmenter un datagramme, écrire les quatre types de routes statiques, distinguer vecteur de distance et état de liens, et configurer RIPv2 et OSPF à zone unique.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p><strong>Sources.<\/strong> Chapitre 4 de ton prof. Plusieurs diapos (en-têtes, tables de routage, sorties de commandes, schémas SPF) sont des images : les explications correspondantes sont rédigées ici d&#39;après le fonctionnement standard de Cisco IOS, certitude élevée. Il n&#39;y a pas d&#39;annales de ce chapitre dans ton dossier.<\/p>\n<\/aside><h2>Idée 1 · Le routeur choisit le prochain saut<\/h2>\n<p>Idée : pour chaque paquet, le routeur lit l&#39;<strong>adresse IP de destination<\/strong>, cherche dans sa <strong>table de routage<\/strong> la route la plus précise, et envoie le paquet au <strong>prochain saut<\/strong> (next hop) par l&#39;<strong>interface de sortie<\/strong>.<\/p>\n<svg viewBox=\"0 0 560 150\" role=\"img\" aria-label=\"PC A envoie vers PC B à travers R1, R2 et R3. Chaque routeur ne connaît que le prochain saut ; le TTL baisse de 1 à chaque routeur\" style=\"max-width:100%;height:auto\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><rect x=\"10\" y=\"55\" width=\"50\" height=\"34\" rx=\"5\"/><circle cx=\"160\" cy=\"72\" r=\"22\" stroke=\"#D9824F\" stroke-width=\"2.5\"/><circle cx=\"280\" cy=\"72\" r=\"22\" stroke=\"#D9824F\" stroke-width=\"2.5\"/><circle cx=\"400\" cy=\"72\" r=\"22\" stroke=\"#D9824F\" stroke-width=\"2.5\"/><rect x=\"500\" y=\"55\" width=\"50\" height=\"34\" rx=\"5\"/><path d=\"M60 72h78M182 72h76M302 72h76M422 72h78\"/><\/g><g font-family=\"sans-serif\" font-size=\"12.5\" fill=\"currentColor\" text-anchor=\"middle\"><text x=\"35\" y=\"77\">A<\/text><text x=\"160\" y=\"76\">R1<\/text><text x=\"280\" y=\"76\">R2<\/text><text x=\"400\" y=\"76\">R3<\/text><text x=\"525\" y=\"77\">B<\/text><text x=\"100\" y=\"45\">TTL 64<\/text><text x=\"220\" y=\"45\">TTL 63<\/text><text x=\"340\" y=\"45\">TTL 62<\/text><text x=\"460\" y=\"45\">TTL 61<\/text><text x=\"280\" y=\"125\" fill=\"#D9824F\">chaque routeur : « pour le réseau de B, j'envoie au suivant »<\/text><\/g><\/svg><table>\n<thead>\n<tr>\n<th>Élément de la table<\/th>\n<th>Rôle<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Réseau de destination + masque<\/td>\n<td>le réseau atteignable<\/td>\n<\/tr>\n<tr>\n<td>Prochain saut<\/td>\n<td>l&#39;adresse du routeur suivant<\/td>\n<\/tr>\n<tr>\n<td>Interface de sortie<\/td>\n<td>par où envoyer<\/td>\n<\/tr>\n<tr>\n<td>Métrique<\/td>\n<td>le « coût » du chemin (sauts, coût, délai)<\/td>\n<\/tr>\n<tr>\n<td>Route par défaut 0.0.0.0/0<\/td>\n<td>utilisée quand aucune autre route ne correspond (souvent vers Internet)<\/td>\n<\/tr>\n<\/tbody><\/table>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Ce que fait le routeur pour chaque paquet<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Lit la destination<\/div><p>L&#39;adresse IP de destination, dans l&#39;en-tête.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Cherche la route la plus précise<\/div><p>Préfixe le plus long qui correspond ; sinon la route par défaut ; sinon le paquet est jeté (et un message ICMP « destination inaccessible » est renvoyé).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Décrémente le TTL<\/div><p>TTL − 1. S&#39;il tombe à 0, le paquet est éliminé : ça évite qu&#39;il tourne en boucle.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Réencapsule et transmet<\/div><p>Nouvelle trame (nouvelles adresses MAC) vers le prochain saut. Les adresses IP, elles, ne changent pas.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>La diapo 3 se termine par « s&#39;appelle. » sans le mot : ce mécanisme s&#39;appelle le <strong>routage saut par saut<\/strong> (hop-by-hop).<\/p>\n<\/aside><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Destination → préfixe le plus long → prochain saut + interface. TTL − 1 à chaque routeur. L&#39;IP ne change pas, la MAC change à chaque saut.<\/p>\n<\/aside><h2>Idée 2 · Le datagramme IP et la fragmentation<\/h2>\n<p>Idée : quand un paquet est plus grand que la <strong>MTU<\/strong> du lien suivant, le routeur IPv4 le <strong>découpe en fragments<\/strong>. Chaque fragment garde la même <strong>identification<\/strong> ; le <strong>décalage<\/strong> (offset) dit où il se place, compté en <strong>blocs de 8 octets<\/strong> ; le drapeau <strong>MF<\/strong> (More Fragments) vaut 1 tant qu&#39;il en reste. Le réassemblage se fait <strong>à la destination<\/strong>.<\/p>\n<table>\n<thead>\n<tr>\n<th>Champ<\/th>\n<th>Rôle<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Version, IHL<\/td>\n<td>IPv4 ; longueur de l&#39;en-tête (20 octets sans options)<\/td>\n<\/tr>\n<tr>\n<td>ToS / DSCP<\/td>\n<td>qualité de service<\/td>\n<\/tr>\n<tr>\n<td>Longueur totale<\/td>\n<td>en-tête + données<\/td>\n<\/tr>\n<tr>\n<td>Identification, drapeaux (DF, MF), décalage<\/td>\n<td>fragmentation<\/td>\n<\/tr>\n<tr>\n<td>TTL<\/td>\n<td>nombre maximal de routeurs traversés<\/td>\n<\/tr>\n<tr>\n<td>Protocole<\/td>\n<td>1 ICMP, 6 TCP, 17 UDP<\/td>\n<\/tr>\n<tr>\n<td>Somme de contrôle<\/td>\n<td>vérifie l&#39;en-tête<\/td>\n<\/tr>\n<tr>\n<td>Adresses source et destination<\/td>\n<td>32 bits chacune<\/td>\n<\/tr>\n<\/tbody><\/table>\n<table>\n<thead>\n<tr>\n<th>Réseau<\/th>\n<th>MTU<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Ethernet<\/td>\n<td>1500 octets<\/td>\n<\/tr>\n<tr>\n<td>FDDI<\/td>\n<td>4470 octets<\/td>\n<\/tr>\n<tr>\n<td>Anneau à jeton 16 Mbit/s<\/td>\n<td>17 914 octets<\/td>\n<\/tr>\n<\/tbody><\/table>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Fragmenter 4000 octets sur une MTU de 1500 (diapo 20)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/6 · Données à transporter<\/div><p>4000 − 20 d&#39;en-tête = 3980 octets.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/6 · Données max par fragment<\/div><p>1500 − 20 = 1480 octets (multiple de 8 : 1480 / 8 = 185 blocs).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/6 · Découpe<\/div><p>1480 + 1480 + 1020 = 3980 : 3 fragments.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/6 · Décalages<\/div><p>0, puis 185, puis 370 (en blocs de 8 octets).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/6 · Drapeau MF<\/div><p>1, 1, puis 0 pour le dernier.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">6/6 · Tailles totales<\/div><p>1500, 1500 et 20 + 1020 = 1040 octets.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p><strong>Diapo 19.<\/strong> Le second fragment est noté « décalage-fragment = 600 ». En octets, oui, mais le champ de l&#39;en-tête compte en blocs de 8 : il vaut <strong>75<\/strong> (600 / 8). La diapo 20 et la figure de la diapo 21 (offsets 410, 820, 1230) utilisent bien les blocs de 8 : c&#39;est cette convention qu&#39;il faut suivre en examen. Vérifié par programme.<\/p>\n<\/aside><section class=\"exo\"><h3>Fragmentation<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>A envoie un paquet de 1100 octets (en-tête de 20) sur un lien de MTU 620. Donne pour chaque fragment : taille totale, MF, décalage.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>Données = 1080. Par fragment : 620 − 20 = 600 octets de données.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 75<\/b><\/p><p>Fragment 1 : <b>620 octets<\/b>, MF = 1, décalage <b>0<\/b>.<br>Fragment 2 : 20 + 480 = <b>500 octets<\/b>, MF = 0, décalage <b>75<\/b> (600 octets / 8).<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Un datagramme porte 11 980 octets de données. La MTU est de 3300. Combien de fragments, et quel décalage pour le dernier ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>3300 − 20 = 3280 octets par fragment, soit 410 blocs de 8.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>3280 × 3 = 9840, reste 2140 : <b>4 fragments<\/b>. Décalages 0, 410, 820 et <b>1230<\/b> (figure de la diapo 21).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Qui réassemble les fragments : le routeur suivant ou la destination ? Pourquoi ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><b>La destination.<\/b> Les fragments peuvent prendre des chemins différents ; un routeur intermédiaire ne les verra pas forcément tous.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Idée 3 · Routage statique : quatre sortes de routes<\/h2>\n<p>Idée : l&#39;administrateur écrit lui-même chaque route. C&#39;est simple, stable et sûr pour un petit réseau, mais rien ne s&#39;adapte en cas de panne.<\/p>\n<svg viewBox=\"0 0 560 140\" role=\"img\" aria-label=\"R1 est un routeur d'extrémité avec un seul voisin R2 : une route par défaut sur R1 vers R2 suffit, et R2 a une route statique vers le LAN de R1, 172.16.3.0/24\" style=\"max-width:100%;height:auto\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><rect x=\"10\" y=\"50\" width=\"130\" height=\"40\" rx=\"6\"/><circle cx=\"210\" cy=\"70\" r=\"24\" stroke=\"#D9824F\" stroke-width=\"2.5\"/><circle cx=\"380\" cy=\"70\" r=\"24\"/><path d=\"M140 70h46M234 70h122M404 70h60\"/><path d=\"M470 50c10-20 60-20 70 5c15 15-5 40-30 30c-15 15-45 5-40-10z\"/><\/g><g font-family=\"sans-serif\" font-size=\"12\" fill=\"currentColor\" text-anchor=\"middle\"><text x=\"75\" y=\"75\">172.16.3.0/24<\/text><text x=\"210\" y=\"74\" fill=\"#D9824F\">R1<\/text><text x=\"380\" y=\"74\">R2<\/text><text x=\"505\" y=\"70\">reste<\/text><text x=\"210\" y=\"120\" fill=\"#D9824F\">R1 : route par défaut → R2<\/text><text x=\"390\" y=\"120\">R2 : route vers 172.16.3.0/24 → R1<\/text><\/g><\/svg><table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>À quoi ça sert<\/th>\n<th>Exemple de commande<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Standard<\/td>\n<td>atteindre un réseau précis<\/td>\n<td><code>ip route 172.16.3.0 255.255.255.0 172.16.2.2<\/code><\/td>\n<\/tr>\n<tr>\n<td>Par défaut<\/td>\n<td>tout ce qui n&#39;a pas de route (réseau d&#39;extrémité, Internet)<\/td>\n<td><code>ip route 0.0.0.0 0.0.0.0 s0/0/0<\/code><\/td>\n<\/tr>\n<tr>\n<td>Récapitulative<\/td>\n<td>une seule route pour plusieurs réseaux contigus qui sortent au même endroit<\/td>\n<td><code>ip route 172.16.8.0 255.255.248.0 …<\/code><\/td>\n<\/tr>\n<tr>\n<td>Flottante<\/td>\n<td>secours : distance administrative plus grande, n&#39;apparaît que si la principale tombe<\/td>\n<td><code>ip route 0.0.0.0 0.0.0.0 10.1.1.1 5<\/code><\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Syntaxe : <code>ip route réseau masque {adresse-du-prochain-saut | interface-de-sortie}<\/code>.<\/p>\n<table>\n<thead>\n<tr>\n<th>Forme<\/th>\n<th>Le routeur doit…<\/th>\n<th>Usage<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Prochain saut (route <strong>récursive<\/strong>)<\/td>\n<td>faire 2 recherches : trouver le saut, puis l&#39;interface vers ce saut<\/td>\n<td>liens Ethernet (supports de diffusion)<\/td>\n<\/tr>\n<tr>\n<td>Interface de sortie (route <strong>reliée directement<\/strong>)<\/td>\n<td>une seule recherche<\/td>\n<td>liaisons point à point (séries)<\/td>\n<\/tr>\n<\/tbody><\/table>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Vérifier ses routes statiques<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · show ip route<\/div><p>Les routes statiques sont marquées S, la route par défaut S*. Les réseaux directement connectés : C (et L pour l&#39;adresse de l&#39;interface).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · show ip route 172.16.3.0<\/div><p>Le détail d&#39;une seule entrée.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · show running-config | include ip route<\/div><p>Les commandes ip route tapées.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Statique : <code>ip route réseau masque saut|interface<\/code>. Défaut = 0.0.0.0 0.0.0.0. Récursive = 2 recherches. Flottante = distance administrative &gt; 1. Tout ça est pratiqué pas à pas dans le <strong>TP 3<\/strong>.<\/p>\n<\/aside><section class=\"exo\"><h3>Routes statiques<\/h3><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>R1 est un routeur d&#39;extrémité : son seul voisin est R2 (172.16.2.2). Quelle route unique suffit sur R1 ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Tout ce qui n&#39;est pas local part au même endroit.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Une route statique par défaut : <b>ip route 0.0.0.0 0.0.0.0 172.16.2.2<\/b> (ou l&#39;interface de sortie à la place de l&#39;adresse).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Quelle est la différence entre ip route 172.16.1.0 255.255.255.0 172.16.2.1 et ip route 172.16.1.0 255.255.255.0 s0/0/1 ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>La première est <b>récursive<\/b> : le routeur cherche d&#39;abord la route vers 172.16.2.1 pour trouver l&#39;interface (2 recherches). La seconde est <b>reliée directement<\/b> : l&#39;interface est donnée, une seule recherche.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>À quoi reconnaît-on une route flottante ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>On ajoute à la fin une <b>distance administrative<\/b> plus grande que celle de la route principale (une statique vaut 1). Elle reste cachée tant que la principale fonctionne.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Idée 4 · Routage dynamique : IGP, EGP et distance administrative<\/h2>\n<p>Idée : les routeurs <strong>échangent<\/strong> ce qu&#39;ils savent et recalculent seuls en cas de panne. Ça coûte de la bande passante et du processeur, mais ça passe à l&#39;échelle.<\/p>\n<figure class=\"flux\"><figcaption>Classer les protocoles de routage<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">IGP, dans un AS<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">vecteur de distance : RIP, IGRP, EIGRP<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">état de liens : OSPF, IS-IS<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">EGP, entre AS : BGP<\/div><\/div><\/figure><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Statique<\/th>\n<th>Dynamique<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Configuration<\/td>\n<td>à la main, route par route<\/td>\n<td>on active un protocole<\/td>\n<\/tr>\n<tr>\n<td>Panne<\/td>\n<td>rien ne change seul<\/td>\n<td>recalcul automatique<\/td>\n<\/tr>\n<tr>\n<td>Ressources<\/td>\n<td>aucune<\/td>\n<td>bande passante + CPU<\/td>\n<\/tr>\n<tr>\n<td>Taille idéale<\/td>\n<td>petit réseau, réseau d&#39;extrémité<\/td>\n<td>moyen et grand réseau<\/td>\n<\/tr>\n<\/tbody><\/table>\n<ul>\n<li><strong>Protocole routé<\/strong> : celui qui transporte les données (IP).<\/li>\n<li><strong>Protocole de routage<\/strong> : celui qui remplit les tables (RIP, OSPF, BGP).<\/li>\n<li><strong>Système autonome (AS)<\/strong> : les routeurs d&#39;une même administration (une entreprise, un FAI).<\/li>\n<li><strong>BGP<\/strong> : le protocole d&#39;Internet entre les AS. Il choisit selon des <strong>politiques<\/strong> et le chemin d&#39;AS (AS-path), pas seulement la distance. Il parle via <strong>TCP, port 179<\/strong>.<\/li>\n<\/ul>\n<p>Quand deux sources proposent une route vers le même réseau, le routeur garde celle qui a la plus petite <strong>distance administrative<\/strong> (la plus fiable) :<\/p>\n<table>\n<thead>\n<tr>\n<th>Origine<\/th>\n<th>Distance administrative<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Directement connecté<\/td>\n<td>0<\/td>\n<\/tr>\n<tr>\n<td>Statique<\/td>\n<td>1<\/td>\n<\/tr>\n<tr>\n<td>EIGRP<\/td>\n<td>90<\/td>\n<\/tr>\n<tr>\n<td>OSPF<\/td>\n<td>110<\/td>\n<\/tr>\n<tr>\n<td>RIP<\/td>\n<td>120<\/td>\n<\/tr>\n<\/tbody><\/table>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Seule la valeur 110 d&#39;OSPF est dans les diapos ; les autres sont les valeurs par défaut de Cisco IOS (certitude élevée).<\/p>\n<\/aside><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>IGP dans un AS (RIP, EIGRP, OSPF, IS-IS), EGP entre AS (BGP, TCP 179). Plus la distance administrative est petite, plus la route est préférée.<\/p>\n<\/aside><h2>Idée 5 · Vecteur de distance : RIP<\/h2>\n<p>Idée : un routeur à vecteur de distance ne connaît que la <strong>distance<\/strong> (pour RIP : le nombre de sauts) et la <strong>direction<\/strong> (l&#39;interface ou le voisin). Il croit ses voisins sur parole : les routeurs servent de « poteaux indicateurs ».<\/p>\n<svg viewBox=\"0 0 560 120\" role=\"img\" aria-label=\"R1 sait que 172.16.3.0/24 est à 1 saut, dans la direction de l'interface S0/0/0 vers R2\" style=\"max-width:100%;height:auto\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><circle cx=\"90\" cy=\"55\" r=\"24\" stroke=\"#D9824F\" stroke-width=\"2.5\"/><circle cx=\"300\" cy=\"55\" r=\"24\"/><rect x=\"420\" y=\"38\" width=\"130\" height=\"34\" rx=\"6\"/><path d=\"M114 55h162M324 55h96\"/><path d=\"M200 45l14 10l-14 10\" stroke=\"#D9824F\" stroke-width=\"2\"/><\/g><g font-family=\"sans-serif\" font-size=\"12.5\" fill=\"currentColor\" text-anchor=\"middle\"><text x=\"90\" y=\"59\" fill=\"#D9824F\">R1<\/text><text x=\"300\" y=\"59\">R2<\/text><text x=\"485\" y=\"60\">172.16.3.0/24<\/text><text x=\"195\" y=\"35\">S0/0/0<\/text><text x=\"280\" y=\"105\" fill=\"#D9824F\">distance : 1 saut · vecteur : vers S0/0/0<\/text><\/g><\/svg><table>\n<thead>\n<tr>\n<th>Protocole<\/th>\n<th>En bref<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>RIPv1<\/td>\n<td>ancien, avec classes (n&#39;envoie pas les masques)<\/td>\n<\/tr>\n<tr>\n<td>RIPv2<\/td>\n<td>sans classe : envoie les masques, gère le VLSM<\/td>\n<\/tr>\n<tr>\n<td>IGRP<\/td>\n<td>Cisco, obsolète, remplacé par EIGRP<\/td>\n<\/tr>\n<tr>\n<td>EIGRP<\/td>\n<td>Cisco, vecteur de distance avancé<\/td>\n<\/tr>\n<\/tbody><\/table>\n<pre class=\"\"><code>R1# conf t\nR1(config)# router rip\nR1(config-router)# version 2\nR1(config-router)# network 192.168.1.0\nR1(config-router)# network 192.168.2.0\nR1(config-router)# no auto-summary\nR1(config-router)# end\nR1# show ip protocols\nR1# show ip route rip<\/code><\/pre><figure class=\"etapes\" data-i=\"0\"><figcaption>Configurer RIPv2<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/6 · router rip<\/div><p>Entre en mode de configuration RIP (ça ne lance rien tout seul).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/6 · version 2<\/div><p>Envoie et reçoit uniquement des messages RIPv2.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/6 · network …<\/div><p>Un réseau directement connecté par commande, sans masque (adresse avec classe). Les interfaces de ces réseaux participent à RIP.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/6 · no auto-summary<\/div><p>Coupe la récapitulation automatique aux frontières de classe (activée par défaut). À taper après version 2.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/6 · Vérifier<\/div><p>show ip protocols (version, réseaux annoncés), show ip route (routes marquées R).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">6/6 · no router rip<\/div><p>Supprime tout le processus RIP et sa configuration.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Oublier <code>no auto-summary<\/code> avec des sous-réseaux discontinus : RIP annonce alors 172.16.0.0/16 au lieu des vrais sous-réseaux, et des routes partent au mauvais endroit.<\/p>\n<\/aside><section class=\"exo\"><h3>RIP<\/h3><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><p>Que sait R1 d&#39;un réseau appris par RIP, et que ne sait-il pas ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Il sait la <b>distance<\/b> (nombre de sauts) et la <b>direction<\/b> (interface ou voisin). Il ne connaît <b>pas le chemin complet<\/b> ni la topologie.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"7\"><div class=\"ex-q\"><p>Après router rip, R1 n&#39;envoie toujours aucune mise à jour. Pourquoi ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Quelle commande dit à RIP quelles interfaces utiliser ?<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Il manque les commandes <b>network<\/b> : sans elles, aucune interface ne participe à RIP.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Idée 6 · État de liens : OSPF et l&#39;algorithme de Dijkstra<\/h2>\n<p>Idée : chaque routeur OSPF connaît <strong>toute la carte<\/strong> de sa zone (les liens et leurs coûts), puis calcule lui-même le chemin le moins coûteux avec l&#39;algorithme <strong>SPF de Dijkstra<\/strong>.<\/p>\n<svg viewBox=\"0 0 560 170\" role=\"img\" aria-label=\"Exemple du cours : de R2 au réseau local de R3, le chemin R2 vers R1 coûte 20, R1 vers R3 coûte 5, R3 vers le LAN coûte 2, total 27\" style=\"max-width:100%;height:auto\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><circle cx=\"70\" cy=\"110\" r=\"24\"/><circle cx=\"250\" cy=\"40\" r=\"24\"/><circle cx=\"420\" cy=\"110\" r=\"24\"/><rect x=\"480\" y=\"140\" width=\"70\" height=\"26\" rx=\"5\"/><path d=\"M92 100L228 50M272 50L398 100M442 122L490 145\" stroke=\"#D9824F\" stroke-width=\"2.5\"/><\/g><g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\"><text x=\"70\" y=\"114\">R2<\/text><text x=\"250\" y=\"44\">R1<\/text><text x=\"420\" y=\"114\">R3<\/text><text x=\"515\" y=\"158\" font-size=\"11\">LAN<\/text><text x=\"145\" y=\"65\" fill=\"#D9824F\">20<\/text><text x=\"350\" y=\"65\" fill=\"#D9824F\">5<\/text><text x=\"475\" y=\"125\" fill=\"#D9824F\">2<\/text><text x=\"250\" y=\"160\">20 + 5 + 2 = 27<\/text><\/g><\/svg><figure class=\"etapes\" data-i=\"0\"><figcaption>Comment OSPF construit ses routes<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Rencontrer les voisins<\/div><p>Les routeurs OSPF se découvrent et forment des contiguïtés (table de voisinage, show ip ospf neighbor).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Échanger l&#39;état des liens<\/div><p>Chacun envoie ses LSA (réseaux connectés, état des interfaces, coûts) dans des paquets LSU. Tous les routeurs d&#39;une zone ont la même base LSDB (la carte).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Calculer<\/div><p>Chaque routeur lance SPF (Dijkstra) depuis sa propre position et obtient un arbre des plus courts chemins.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Remplir la table<\/div><p>Les meilleures routes vont dans la table de routage (show ip route, marquées O). Distance administrative : 110.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><table>\n<thead>\n<tr>\n<th>Vecteur de distance (RIP)<\/th>\n<th>État de liens (OSPF)<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>connaît distance + direction<\/td>\n<td>connaît toute la topologie de la zone<\/td>\n<\/tr>\n<tr>\n<td>métrique : nombre de sauts<\/td>\n<td>métrique : coût (lié au débit)<\/td>\n<\/tr>\n<tr>\n<td>mises à jour périodiques<\/td>\n<td>mises à jour seulement quand ça change<\/td>\n<\/tr>\n<tr>\n<td>converge lentement<\/td>\n<td>converge vite<\/td>\n<\/tr>\n<tr>\n<td>simple<\/td>\n<td>plus de mémoire et de calcul<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Atouts d&#39;OSPF (diapo 66) : <strong>sans classe<\/strong> (VLSM, CIDR), <strong>efficace<\/strong>, <strong>convergence rapide<\/strong>, <strong>évolutif<\/strong> (découpage en zones), <strong>sécurisé<\/strong> (authentification MD5).<\/p>\n<aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>La diapo 66 dit que les routeurs acceptent « uniquement les mises à jour de routage <strong>chiffrées<\/strong> ». MD5 sert à <strong>authentifier<\/strong> (prouver que la mise à jour vient d&#39;un voisin qui connaît le mot de passe), pas à chiffrer : le contenu reste lisible. Et la LSDB s&#39;affiche avec <code>show ip ospf database<\/code> ; <code>show ip ospf<\/code> (diapo 69) donne les informations générales du processus.<\/p>\n<\/aside><section class=\"exo\"><h3>Dijkstra<\/h3><div class=\"ex\" data-x=\"8\"><div class=\"ex-q\"><p>Dans l&#39;exemple du cours, quel est le coût du meilleur chemin de R2 vers le LAN de R3 ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>Additionne les coûts des liens du chemin R2 → R1 → R3 → LAN.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 27<\/b><\/p><p>20 + 5 + 2 = <b>27<\/b>.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"9\"><div class=\"ex-q\"><p>Pourquoi chaque routeur OSPF a-t-il une table de routage différente alors que leur LSDB est identique ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Chacun lance SPF <b>depuis sa propre position<\/b> : même carte, mais point de départ différent, donc arbre des plus courts chemins différent.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Idée 7 · Configurer OSPF à zone unique<\/h2>\n<p>Idée : trois réglages suffisent : lancer le processus, fixer l&#39;ID du routeur, et dire quelles interfaces participent avec <code>network … masque-générique area 0<\/code>.<\/p>\n<pre class=\"\"><code>R1(config)# router ospf 10\nR1(config-router)# router-id 1.1.1.1\nR1(config-router)# network 172.16.1.0 0.0.0.255 area 0\nR1(config-router)# network 172.16.3.0 0.0.0.3 area 0\nR1(config-router)# network 192.168.10.5 0.0.0.3 area 0\nR1(config-router)# passive-interface g0/0\nR1(config-router)# end\nR1# show ip protocols\nR1# show ip ospf neighbor<\/code><\/pre><figure class=\"etapes\" data-i=\"0\"><figcaption>Les réglages, un par un<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/6 · router ospf 10<\/div><p>Le process-id (1 à 65 535) est local : il peut être différent sur chaque routeur.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/6 · router-id 1.1.1.1<\/div><p>Un identifiant de 32 bits écrit comme une adresse IPv4. Il nomme le routeur dans la zone et départage l&#39;élection du DR (priorité OSPF la plus haute, puis ID le plus haut).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/6 · Sans router-id<\/div><p>Le routeur prend la plus haute adresse d&#39;interface de bouclage, sinon la plus haute adresse d&#39;interface active.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/6 · Changer l&#39;ID<\/div><p>Il ne s&#39;applique qu&#39;après clear ip ospf process (ou un redémarrage) : les contiguïtés sont renégociées.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/6 · network … area 0<\/div><p>Les interfaces dont l&#39;adresse correspond participent. Même zone partout ; 0 est la bonne pratique en zone unique.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">6/6 · passive-interface g0/0<\/div><p>Pas de messages OSPF sur le LAN (aucun routeur à rencontrer), mais le réseau reste annoncé. Aucune contiguïté possible sur cette interface.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><figure class=\"etapes\" data-i=\"0\"><figcaption>Calculer un masque générique (wildcard)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Règle<\/div><p>255.255.255.255 − masque de sous-réseau.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · /24<\/div><p>255.255.255.255 − 255.255.255.0 = 0.0.0.255.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · /30<\/div><p>255.255.255.255 − 255.255.255.252 = 0.0.0.3.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · Lecture<\/div><p>Un bit 0 = « vérifie ce bit », un bit 1 = « ignore-le ». C&#39;est l&#39;inverse d&#39;un masque.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · Une seule interface<\/div><p>network 192.168.10.5 0.0.0.0 area 0 vise exactement cette adresse.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p><code>router ospf id<\/code> → <code>router-id<\/code> → <code>network réseau wildcard area 0<\/code> → <code>passive-interface<\/code> sur les LAN. Wildcard = 255.255.255.255 − masque. Distance administrative OSPF : 110.<\/p>\n<\/aside><section class=\"exo\"><h3>OSPF<\/h3><div class=\"ex\" data-x=\"10\"><div class=\"ex-q\"><p>Quel masque générique pour annoncer 10.1.4.0/22 ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>/22 = 255.255.252.0.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>255.255.255.255 − 255.255.252.0 = <b>0.0.3.255<\/b>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"11\"><div class=\"ex-q\"><p>R1 a une loopback 1.1.1.1/32, une interface 192.168.10.5 et aucune commande router-id. Quel est son ID OSPF ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Ordre de choix : router-id, puis loopback la plus haute, puis interface active la plus haute.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>1.1.1.1<\/b> : une interface de bouclage passe avant les interfaces physiques.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"12\"><div class=\"ex-q\"><p>Pourquoi déclarer l&#39;interface du LAN en passive ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Aucun routeur OSPF n&#39;est derrière : envoyer des Hello y est inutile (et donne des informations à n&#39;importe quel PC). L&#39;interface ne forme pas de voisinage mais son réseau reste annoncé.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Synthèse du chapitre<\/h3><div class=\"ex\" data-x=\"13\"><div class=\"ex-q\"><p>Un routeur reçoit un paquet pour 10.5.7.1. Sa table contient 10.0.0.0/8 via R2, 10.5.0.0/16 via R3 et 0.0.0.0/0 via R4. Où part le paquet ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Préfixe le plus long.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Les trois correspondent ; le plus précis est <b>10.5.0.0/16<\/b> : le paquet part vers <b>R3<\/b>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"14\"><div class=\"ex-q\"><p>Le routeur apprend 172.16.5.0/24 par RIP et par OSPF. Laquelle met-il dans sa table ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Celle d&#39;<b>OSPF<\/b> : distance administrative 110 contre 120 pour RIP.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"15\"><div class=\"ex-q\"><p>Un paquet part avec un TTL de 3 et doit traverser 4 routeurs. Que se passe-t-il ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Le TTL vaut 2, 1, puis <b>0 au 3ᵉ routeur<\/b> : le paquet est éliminé avant la destination (et un ICMP « temps dépassé » est renvoyé à la source, c&#39;est ce qu&#39;utilise tracert).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 12 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Un routeur reçoit un paquet avec TTL = 1. Que fait-il ?<\/div><button class=\"opt\" data-o=\"0\">Il le transmet avec TTL = 1<\/button><button class=\"opt\" data-o=\"1\">Il le transmet avec TTL = 0<\/button><button class=\"opt\" data-o=\"2\">Il l&#39;élimine<\/button><button class=\"opt\" data-o=\"3\">Il le renvoie à la source sans modification<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">3980 octets de données sur une MTU de 1500 : quel est le décalage du 3ᵉ fragment ?<\/div><button class=\"opt\" data-o=\"0\">2960<\/button><button class=\"opt\" data-o=\"1\">370<\/button><button class=\"opt\" data-o=\"2\">185<\/button><button class=\"opt\" data-o=\"3\">296<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Le drapeau MF du dernier fragment vaut…<\/div><button class=\"opt\" data-o=\"0\">0<\/button><button class=\"opt\" data-o=\"1\">1<\/button><button class=\"opt\" data-o=\"2\">le nombre de fragments<\/button><button class=\"opt\" data-o=\"3\">la même valeur que DF<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">La route statique par défaut s&#39;écrit…<\/div><button class=\"opt\" data-o=\"0\">ip route 255.255.255.255 0.0.0.0 …<\/button><button class=\"opt\" data-o=\"1\">ip route 0.0.0.0 0.0.0.0 …<\/button><button class=\"opt\" data-o=\"2\">ip route default …<\/button><button class=\"opt\" data-o=\"3\">ip default-network 0.0.0.0<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Quelle route impose deux recherches dans la table ?<\/div><button class=\"opt\" data-o=\"0\">Une route avec l&#39;adresse du prochain saut (récursive)<\/button><button class=\"opt\" data-o=\"1\">Une route avec l&#39;interface de sortie<\/button><button class=\"opt\" data-o=\"2\">Un réseau directement connecté<\/button><button class=\"opt\" data-o=\"3\">Une route OSPF<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Une route statique flottante se distingue par…<\/div><button class=\"opt\" data-o=\"0\">son masque 0.0.0.0<\/button><button class=\"opt\" data-o=\"1\">une distance administrative plus grande que la route principale<\/button><button class=\"opt\" data-o=\"2\">l&#39;interface Loopback<\/button><button class=\"opt\" data-o=\"3\">le mot-clé overload<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">BGP est un protocole…<\/div><button class=\"opt\" data-o=\"0\">à état de liens, à l&#39;intérieur d&#39;un AS<\/button><button class=\"opt\" data-o=\"1\">à vecteur de distance, propriétaire Cisco<\/button><button class=\"opt\" data-o=\"2\">de routage entre systèmes autonomes (EGP)<\/button><button class=\"opt\" data-o=\"3\">de couche 2<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">RIP et OSPF proposent chacun une route vers le même réseau. Le routeur garde…<\/div><button class=\"opt\" data-o=\"0\">celle de RIP (120)<\/button><button class=\"opt\" data-o=\"1\">celle d&#39;OSPF (110)<\/button><button class=\"opt\" data-o=\"2\">les deux à égalité<\/button><button class=\"opt\" data-o=\"3\">la plus ancienne<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">La métrique de RIP est…<\/div><button class=\"opt\" data-o=\"0\">le coût lié au débit<\/button><button class=\"opt\" data-o=\"1\">le nombre de sauts<\/button><button class=\"opt\" data-o=\"2\">le délai<\/button><button class=\"opt\" data-o=\"3\">la distance administrative<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">À quoi sert no auto-summary sous RIPv2 ?<\/div><button class=\"opt\" data-o=\"0\">À activer RIPv2<\/button><button class=\"opt\" data-o=\"1\">À annoncer les vrais sous-réseaux au lieu du réseau avec classe<\/button><button class=\"opt\" data-o=\"2\">À arrêter RIP<\/button><button class=\"opt\" data-o=\"3\">À rendre une interface passive<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"10\"><div class=\"qq-q\">OSPF calcule ses meilleurs chemins avec l&#39;algorithme…<\/div><button class=\"opt\" data-o=\"0\">de Bellman-Ford<\/button><button class=\"opt\" data-o=\"1\">SPF de Dijkstra<\/button><button class=\"opt\" data-o=\"2\">du saut par saut<\/button><button class=\"opt\" data-o=\"3\">de Hamming<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"11\"><div class=\"qq-q\">Quel masque générique pour un réseau /30 dans une commande network OSPF ?<\/div><button class=\"opt\" data-o=\"0\">255.255.255.252<\/button><button class=\"opt\" data-o=\"1\">0.0.0.252<\/button><button class=\"opt\" data-o=\"2\">0.0.0.3<\/button><button class=\"opt\" data-o=\"3\">0.0.0.255<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"n61","rep":["75"],"tol":null},{"n":"n61","rep":null,"tol":null},{"n":"n61","rep":null,"tol":null},{"n":"n62","rep":null,"tol":null},{"n":"n62","rep":null,"tol":null},{"n":"n62","rep":null,"tol":null},{"n":"n64","rep":null,"tol":null},{"n":"n64","rep":null,"tol":null},{"n":"n65","rep":["27"],"tol":null},{"n":"n65","rep":null,"tol":null},{"n":"n65","rep":null,"tol":null},{"n":"n65","rep":null,"tol":null},{"n":"n65","rep":null,"tol":null},{"n":"n62","rep":null,"tol":null},{"n":"n63","rep":null,"tol":null},{"n":"n61","rep":null,"tol":null}],"qcm":[{"n":"n61","q":"Un routeur reçoit un paquet avec TTL = 1. Que fait-il ?","o":["Il le transmet avec TTL = 1","Il le transmet avec TTL = 0","Il l&#39;élimine","Il le renvoie à la source sans modification"],"a":2,"e":"TTL − 1 = 0 : le paquet est éliminé, pour éviter les boucles."},{"n":"n61","q":"3980 octets de données sur une MTU de 1500 : quel est le décalage du 3ᵉ fragment ?","o":["2960","370","185","296"],"a":1,"e":"2 × 1480 = 2960 octets, soit 2960 / 8 = 370 blocs."},{"n":"n61","q":"Le drapeau MF du dernier fragment vaut…","o":["0","1","le nombre de fragments","la même valeur que DF"],"a":0,"e":"MF = 1 tant que d&#39;autres fragments suivent, 0 pour le dernier."},{"n":"n62","q":"La route statique par défaut s&#39;écrit…","o":["ip route 255.255.255.255 0.0.0.0 …","ip route 0.0.0.0 0.0.0.0 …","ip route default …","ip default-network 0.0.0.0"],"a":1,"e":"Destination 0.0.0.0 avec le masque 0.0.0.0 : correspond à toutes les adresses."},{"n":"n62","q":"Quelle route impose deux recherches dans la table ?","o":["Une route avec l&#39;adresse du prochain saut (récursive)","Une route avec l&#39;interface de sortie","Un réseau directement connecté","Une route OSPF"],"a":0,"e":"Il faut d&#39;abord trouver comment joindre le prochain saut pour connaître l&#39;interface."},{"n":"n62","q":"Une route statique flottante se distingue par…","o":["son masque 0.0.0.0","une distance administrative plus grande que la route principale","l&#39;interface Loopback","le mot-clé overload"],"a":1,"e":"Elle n&#39;apparaît que si la route principale (distance plus petite) disparaît."},{"n":"n63","q":"BGP est un protocole…","o":["à état de liens, à l&#39;intérieur d&#39;un AS","à vecteur de distance, propriétaire Cisco","de routage entre systèmes autonomes (EGP)","de couche 2"],"a":2,"e":"BGP relie les AS d&#39;Internet, selon des politiques, via TCP port 179."},{"n":"n63","q":"RIP et OSPF proposent chacun une route vers le même réseau. Le routeur garde…","o":["celle de RIP (120)","celle d&#39;OSPF (110)","les deux à égalité","la plus ancienne"],"a":1,"e":"La plus petite distance administrative gagne."},{"n":"n64","q":"La métrique de RIP est…","o":["le coût lié au débit","le nombre de sauts","le délai","la distance administrative"],"a":1,"e":"RIP compte les routeurs à traverser."},{"n":"n64","q":"À quoi sert no auto-summary sous RIPv2 ?","o":["À activer RIPv2","À annoncer les vrais sous-réseaux au lieu du réseau avec classe","À arrêter RIP","À rendre une interface passive"],"a":1,"e":"Par défaut RIPv2 résume aux frontières de classe ; no auto-summary l&#39;en empêche."},{"n":"n65","q":"OSPF calcule ses meilleurs chemins avec l&#39;algorithme…","o":["de Bellman-Ford","SPF de Dijkstra","du saut par saut","de Hamming"],"a":1,"e":"Chaque routeur lance SPF (Dijkstra) sur la LSDB depuis sa position."},{"n":"n65","q":"Quel masque générique pour un réseau /30 dans une commande network OSPF ?","o":["255.255.255.252","0.0.0.252","0.0.0.3","0.0.0.255"],"a":2,"e":"255.255.255.255 − 255.255.255.252 = 0.0.0.3."}]},{"id":"nat","t":"Ch5 · NAT : traduction d'adresses","seance":"Chapitre 5","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il te faut deux choses : savoir qu&#39;une adresse comme <strong>192.168.x.x<\/strong> est <strong>privée<\/strong> (elle n&#39;existe pas sur Internet), et savoir qu&#39;un routeur a une interface de chaque côté (vers le réseau local, vers l&#39;extérieur).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>PC1 a l&#39;adresse 192.168.10.10. Peut-il recevoir directement un paquet envoyé depuis Internet à 192.168.10.10 ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Les routeurs d&#39;Internet ont-ils une route vers 192.168.0.0/16 ?<\/p>\n<\/div><div class=\"ex-c\" hidden><p><strong>Non.<\/strong> 192.168.0.0/16 fait partie des plages <strong>privées<\/strong> (avec 10.0.0.0/8 et 172.16.0.0/12). Des milliers de réseaux locaux utilisent les mêmes : les routeurs d&#39;Internet ne les acheminent jamais.\nPour sortir sur Internet, PC1 doit donc emprunter une adresse <strong>publique<\/strong>. C&#39;est le rôle du NAT.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « déguisement ».<\/strong> Le routeur NAT déguise l&#39;adresse privée en adresse publique à la sortie, note le déguisement dans sa table, et enlève le déguisement au retour. Tout le chapitre (types, commandes, vérification) répond à trois questions : qui est déguisé, avec quelle adresse, et comment le routeur s&#39;en souvient.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Mélanger les quatre noms d&#39;adresses. « Locale / globale » dit <strong>d&#39;où on regarde<\/strong> (de l&#39;intérieur ou de l&#39;extérieur). « Interne / externe » dit <strong>à qui appartient l&#39;adresse<\/strong> (une machine de chez nous ou la machine d&#39;en face). Presque toutes les erreurs d&#39;examen viennent de là.<\/p>\n<\/aside><p>À la fin, tu sais remplir une table NAT, choisir entre NAT statique, dynamique et PAT, écrire leur configuration Cisco et lire <code>show ip nat translations<\/code>.<\/p>\n<h2>Idée 1 · Le NAT remplace l&#39;adresse privée à la frontière<\/h2>\n<svg viewBox=\"0 0 660 250\" style=\"width:100%;max-width:680px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Réseau du cours. PC1 192.168.10.10 et PC2 192.168.11.10 sont reliés à R1, lui-même relié à R2 par le lien 10.1.1.0/30. R2 est le routeur NAT, à la frontière entre le réseau interne et Internet. Le paquet de PC1 part avec la source 192.168.10.10 ; après R2, sa source devient 209.165.200.226. Le serveur Web est en 209.165.201.1.\">\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\" stroke-linecap=\"round\">\n<rect x=\"10\" y=\"30\" width=\"345\" height=\"200\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"4 4\" opacity=\".5\"/>\n<text x=\"20\" y=\"22\" stroke=\"none\" font-weight=\"700\">Réseau interne (adresses privées)<\/text>\n<text x=\"420\" y=\"22\" stroke=\"none\" font-weight=\"700\">Externe (Internet)<\/text>\n<line x1=\"380\" y1=\"30\" x2=\"380\" y2=\"230\" stroke=\"#D9824F\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/>\n<rect x=\"24\" y=\"60\" width=\"44\" height=\"28\" rx=\"3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"/><text x=\"46\" y=\"78\" text-anchor=\"middle\" stroke=\"none\">PC1<\/text>\n<text x=\"24\" y=\"104\" stroke=\"none\">192.168.10.10<\/text>\n<rect x=\"24\" y=\"160\" width=\"44\" height=\"28\" rx=\"3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"/><text x=\"46\" y=\"178\" text-anchor=\"middle\" stroke=\"none\">PC2<\/text>\n<text x=\"24\" y=\"204\" stroke=\"none\">192.168.11.10<\/text>\n<line x1=\"70\" y1=\"76\" x2=\"152\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"1.6\"/>\n<line x1=\"70\" y1=\"172\" x2=\"152\" y2=\"136\" stroke=\"currentColor\" stroke-width=\"1.6\"/>\n<circle cx=\"170\" cy=\"128\" r=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"/><text x=\"170\" y=\"132\" text-anchor=\"middle\" stroke=\"none\" font-weight=\"700\">R1<\/text>\n<line x1=\"188\" y1=\"128\" x2=\"342\" y2=\"128\" stroke=\"currentColor\" stroke-width=\"1.6\"/>\n<text x=\"265\" y=\"120\" text-anchor=\"middle\" stroke=\"none\">10.1.1.0/30<\/text>\n<circle cx=\"380\" cy=\"128\" r=\"20\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2.6\"/><text x=\"380\" y=\"132\" text-anchor=\"middle\" stroke=\"none\" font-weight=\"700\" fill=\"#D9824F\">R2<\/text>\n<text x=\"380\" y=\"166\" text-anchor=\"middle\" stroke=\"none\" fill=\"#D9824F\" font-weight=\"700\">routeur NAT<\/text>\n<line x1=\"400\" y1=\"128\" x2=\"560\" y2=\"128\" stroke=\"currentColor\" stroke-width=\"1.6\"/>\n<rect x=\"566\" y=\"110\" width=\"80\" height=\"36\" rx=\"4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"/><text x=\"606\" y=\"132\" text-anchor=\"middle\" stroke=\"none\">Serveur<\/text>\n<text x=\"606\" y=\"164\" text-anchor=\"middle\" stroke=\"none\">209.165.201.1<\/text>\n<text x=\"265\" y=\"62\" text-anchor=\"middle\" stroke=\"none\">source : 192.168.10.10<\/text>\n<text x=\"480\" y=\"62\" text-anchor=\"middle\" stroke=\"none\" fill=\"#D9824F\" font-weight=\"700\">source : 209.165.200.226<\/text>\n<line x1=\"200\" y1=\"72\" x2=\"360\" y2=\"72\" stroke=\"currentColor\" stroke-width=\"1.4\" marker-end=\"url(#fl5)\"/>\n<line x1=\"400\" y1=\"72\" x2=\"560\" y2=\"72\" stroke=\"#D9824F\" stroke-width=\"1.8\" marker-end=\"url(#fl5)\"/>\n<defs><marker id=\"fl5\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"currentColor\"/><\/marker><\/defs>\n<\/g>\n<\/svg><p>Le NAT (Network Address Translation) <strong>modifie l&#39;adresse IP d&#39;un paquet<\/strong> quand il traverse le routeur entre le réseau local et Internet. Il existe pour trois raisons : il manque d&#39;adresses IPv4 publiques, il cache les adresses internes, et il permet à tout un réseau de sortir avec <strong>une seule<\/strong> adresse publique.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Un aller-retour PC1 → serveur Web<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Départ<\/div><p>PC1 envoie le paquet : source 192.168.10.10, destination 209.165.201.1. R1 le passe à R2.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · Traduction<\/div><p>R2 vérifie que la source fait partie des adresses à traduire, la remplace par 209.165.200.226 et <strong>note le couple<\/strong> dans sa table NAT.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · Envoi<\/div><p>Le paquet part sur Internet avec la source 209.165.200.226. Le serveur ne voit jamais 192.168.10.10.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · Réponse<\/div><p>Le serveur répond à 209.165.200.226.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · Traduction inverse<\/div><p>R2 trouve 209.165.200.226 dans sa table, remet 192.168.10.10 en destination et transmet à PC1.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Sans table NAT, pas de retour. C&#39;est elle qui permet à R2 de savoir à quelle machine interne rendre la réponse.<\/p>\n<\/aside><p><strong>Ce que le NAT apporte, et ses limites.<\/strong> Il économise les adresses publiques et rend les machines internes injoignables directement depuis Internet. Mais il <strong>ne remplace pas un pare-feu<\/strong> : il ne filtre pas le trafic. Et il gêne les applications qui ont besoin de connexions entrantes : VoIP, jeux en ligne, P2P.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p><strong>Dans les diapos (diapo 13)<\/strong> : il est écrit que R2 « lit l&#39;adresse IPv4 de destination » pour décider s&#39;il traduit, puis la phrase suivante parle de l&#39;adresse <strong>source<\/strong>. Pour un paquet qui sort, c&#39;est bien la <strong>source<\/strong> que R2 compare à la liste des adresses à traduire (l&#39;ACL, Idée 5).<\/p>\n<\/aside><h2>Idée 2 · Les quatre noms d&#39;adresses<\/h2>\n<svg viewBox=\"0 0 560 230\" style=\"width:100%;max-width:600px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Tableau deux sur deux. Lignes : interne (l'adresse de PC1) et externe (l'adresse du serveur). Colonnes : locale (vue de l'intérieur) et globale (vue de l'extérieur). Locale interne 192.168.10.10, globale interne 209.165.200.226, locale externe 209.165.201.1, globale externe 209.165.201.1. Seule la case globale interne change grâce au NAT.\">\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\">\n<text x=\"270\" y=\"22\" text-anchor=\"middle\" font-weight=\"700\">Locale<\/text><text x=\"270\" y=\"40\" text-anchor=\"middle\">vue de l'intérieur<\/text>\n<text x=\"450\" y=\"22\" text-anchor=\"middle\" font-weight=\"700\">Globale<\/text><text x=\"450\" y=\"40\" text-anchor=\"middle\">vue de l'extérieur<\/text>\n<text x=\"10\" y=\"94\" font-weight=\"700\">Interne<\/text><text x=\"10\" y=\"112\">l'adresse de PC1<\/text>\n<text x=\"10\" y=\"174\" font-weight=\"700\">Externe<\/text><text x=\"10\" y=\"192\">l'adresse du serveur<\/text>\n<rect x=\"180\" y=\"56\" width=\"180\" height=\"76\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/>\n<text x=\"270\" y=\"90\" text-anchor=\"middle\" font-weight=\"700\">192.168.10.10<\/text><text x=\"270\" y=\"110\" text-anchor=\"middle\">locale interne<\/text>\n<rect x=\"370\" y=\"56\" width=\"180\" height=\"76\" rx=\"6\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2.6\"/>\n<text x=\"460\" y=\"90\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#D9824F\">209.165.200.226<\/text><text x=\"460\" y=\"110\" text-anchor=\"middle\" fill=\"#D9824F\">globale interne<\/text>\n<rect x=\"180\" y=\"142\" width=\"180\" height=\"76\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/>\n<text x=\"270\" y=\"176\" text-anchor=\"middle\" font-weight=\"700\">209.165.201.1<\/text><text x=\"270\" y=\"196\" text-anchor=\"middle\">locale externe<\/text>\n<rect x=\"370\" y=\"142\" width=\"180\" height=\"76\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/>\n<text x=\"460\" y=\"176\" text-anchor=\"middle\" font-weight=\"700\">209.165.201.1<\/text><text x=\"460\" y=\"196\" text-anchor=\"middle\">globale externe<\/text>\n<\/g>\n<\/svg><p>Lis chaque nom en deux morceaux : <strong>interne / externe<\/strong> = la machine (chez nous ou en face), <strong>locale / globale<\/strong> = le côté d&#39;où on regarde.<\/p>\n<table>\n<thead>\n<tr>\n<th>Nom<\/th>\n<th>De quelle machine ?<\/th>\n<th>Vue d&#39;où ?<\/th>\n<th>Exemple du cours<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Locale interne (inside local)<\/td>\n<td>PC1<\/td>\n<td>de l&#39;intérieur<\/td>\n<td>192.168.10.10<\/td>\n<\/tr>\n<tr>\n<td>Globale interne (inside global)<\/td>\n<td>PC1<\/td>\n<td>d&#39;Internet<\/td>\n<td>209.165.200.226<\/td>\n<\/tr>\n<tr>\n<td>Locale externe (outside local)<\/td>\n<td>le serveur<\/td>\n<td>de l&#39;intérieur<\/td>\n<td>209.165.201.1<\/td>\n<\/tr>\n<tr>\n<td>Globale externe (outside global)<\/td>\n<td>le serveur<\/td>\n<td>d&#39;Internet<\/td>\n<td>209.165.201.1<\/td>\n<\/tr>\n<\/tbody><\/table>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Le NAT du cours ne traduit que l&#39;adresse de <strong>notre<\/strong> machine : seule la <strong>globale interne<\/strong> diffère de la locale interne. Locale externe et globale externe sont presque toujours identiques.<\/p>\n<\/aside><p><strong>SNAT et DNAT.<\/strong> Le <strong>SNAT<\/strong> change l&#39;adresse <strong>source<\/strong> (un PC interne sort sur Internet). Le <strong>DNAT<\/strong> change l&#39;adresse <strong>destination<\/strong> (un client d&#39;Internet est renvoyé vers un serveur interne).<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Avant<\/th>\n<th>Après<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>SNAT (sortie)<\/td>\n<td>src 192.168.10.10 → dst 209.165.201.1<\/td>\n<td>src <strong>209.165.200.226<\/strong> → dst 209.165.201.1<\/td>\n<\/tr>\n<tr>\n<td>DNAT (entrée)<\/td>\n<td>src 209.165.201.1 → dst 209.165.200.226<\/td>\n<td>src 209.165.201.1 → dst <strong>192.168.10.10<\/strong><\/td>\n<\/tr>\n<\/tbody><\/table>\n<h2>Idée 3 · Trois types de NAT<\/h2>\n<table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Association<\/th>\n<th>Pour quoi ?<\/th>\n<th>Exemple<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>NAT statique<\/strong><\/td>\n<td>1 : 1, fixe<\/td>\n<td>un serveur interne joignable depuis Internet<\/td>\n<td>192.168.10.254 ↔ toujours 209.165.201.5<\/td>\n<\/tr>\n<tr>\n<td><strong>NAT dynamique<\/strong><\/td>\n<td>m : n (m &gt; n), pool d&#39;adresses publiques<\/td>\n<td>des PC qui sortent, adresse prise au premier arrivé<\/td>\n<td>192.168.10.12 → la 1ʳᵉ adresse libre du pool<\/td>\n<\/tr>\n<tr>\n<td><strong>PAT<\/strong> (NAT avec surcharge)<\/td>\n<td>m : 1, une seule adresse publique<\/td>\n<td>tout un réseau derrière une adresse ; le plus utilisé (box, entreprises)<\/td>\n<td>192.168.10.10:1444 → 209.165.200.225:1444<\/td>\n<\/tr>\n<\/tbody><\/table>\n<figure class=\"flux\"><figcaption>NAT statique : toujours la même adresse<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">Svr1 192.168.10.10<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">R2 (table fixe)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">209.165.200.226, même au millième paquet<\/div><\/div><\/figure><figure class=\"flux\"><figcaption>NAT dynamique : on puise dans un pool<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">PC3 192.168.10.12 sort<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">R2 prend la 1ʳᵉ adresse libre du pool (209.165.200.226 à .230)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">la garde tant que l&#39;entrée vit<\/div><\/div><\/figure><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Le NAT dynamique n&#39;est <strong>pas<\/strong> fait pour plusieurs PC en même temps sur une seule adresse : c&#39;est 1 PC = 1 adresse du pool. Si le pool compte 5 adresses et qu&#39;un 6ᵉ PC veut sortir, il attend qu&#39;une entrée expire (son paquet est rejeté). Pour partager une adresse, il faut le <strong>PAT<\/strong>.<\/p>\n<\/aside><h2>Idée 4 · Le PAT distingue les machines par le port<\/h2>\n<svg viewBox=\"0 0 640 200\" style=\"width:100%;max-width:680px;display:block;margin:10px auto\" role=\"img\" aria-label=\"PAT. PC1 192.168.10.10 port 1444 et PC2 192.168.10.11 port 1444 sortent tous les deux par R2 avec la même adresse 209.165.200.225. R2 garde le port 1444 pour PC1 et prend le port 1445 pour PC2, car 1444 est déjà utilisé.\">\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\">\n<rect x=\"10\" y=\"30\" width=\"200\" height=\"44\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/>\n<text x=\"110\" y=\"50\" text-anchor=\"middle\" font-weight=\"700\">PC1<\/text><text x=\"110\" y=\"66\" text-anchor=\"middle\">192.168.10.10 : 1444<\/text>\n<rect x=\"10\" y=\"120\" width=\"200\" height=\"44\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/>\n<text x=\"110\" y=\"140\" text-anchor=\"middle\" font-weight=\"700\">PC2<\/text><text x=\"110\" y=\"156\" text-anchor=\"middle\">192.168.10.11 : 1444<\/text>\n<line x1=\"212\" y1=\"52\" x2=\"290\" y2=\"94\" stroke=\"currentColor\" stroke-width=\"1.6\"/>\n<line x1=\"212\" y1=\"142\" x2=\"290\" y2=\"106\" stroke=\"currentColor\" stroke-width=\"1.6\"/>\n<circle cx=\"310\" cy=\"100\" r=\"20\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2.6\"/><text x=\"310\" y=\"104\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#D9824F\">R2<\/text>\n<line x1=\"332\" y1=\"94\" x2=\"410\" y2=\"52\" stroke=\"currentColor\" stroke-width=\"1.6\"/>\n<line x1=\"332\" y1=\"106\" x2=\"410\" y2=\"142\" stroke=\"currentColor\" stroke-width=\"1.6\"/>\n<rect x=\"412\" y=\"30\" width=\"218\" height=\"44\" rx=\"5\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/>\n<text x=\"521\" y=\"50\" text-anchor=\"middle\">vers Svr1 209.165.201.1:80<\/text><text x=\"521\" y=\"66\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#D9824F\">209.165.200.225 : 1444<\/text>\n<rect x=\"412\" y=\"120\" width=\"218\" height=\"44\" rx=\"5\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/>\n<text x=\"521\" y=\"140\" text-anchor=\"middle\">vers Svr2 209.165.202.129:80<\/text><text x=\"521\" y=\"156\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#D9824F\">209.165.200.225 : 1445<\/text>\n<text x=\"310\" y=\"190\" text-anchor=\"middle\">même adresse publique, ports différents<\/text>\n<\/g>\n<\/svg><p>Avec une seule adresse publique, R2 ne peut plus reconnaître les machines par leur IP. Il ajoute donc le <strong>numéro de port source<\/strong> à chaque entrée de sa table.<\/p>\n<table>\n<thead>\n<tr>\n<th>Globale interne<\/th>\n<th>Locale interne<\/th>\n<th>Locale externe<\/th>\n<th>Globale externe<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>209.165.200.225:<strong>1444<\/strong><\/td>\n<td>192.168.10.10:1444<\/td>\n<td>209.165.201.1:80<\/td>\n<td>209.165.201.1:80<\/td>\n<\/tr>\n<tr>\n<td>209.165.200.225:<strong>1445<\/strong><\/td>\n<td>192.168.10.11:1444<\/td>\n<td>209.165.202.129:80<\/td>\n<td>209.165.202.129:80<\/td>\n<\/tr>\n<\/tbody><\/table>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Ce que fait R2 (diapos 39 et 40)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · PC1 sort<\/div><p>Source 192.168.10.10:1444. Le port 1444 est libre sur l&#39;adresse publique : R2 le <strong>garde<\/strong> → 209.165.200.225:1444.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · PC2 sort<\/div><p>Source 192.168.10.11:1444. Le port 1444 est déjà pris : R2 en <strong>choisit un autre<\/strong>, 1445 → 209.165.200.225:1445.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · Svr2 répond<\/div><p>Destination 209.165.200.225:1445. R2 lit la ligne « 1445 » et rend le paquet à 192.168.10.11:1444.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>PAT = adresse <strong>et port<\/strong>. R2 garde le port d&#39;origine s&#39;il est libre, sinon il en prend un autre. C&#39;est le couple (adresse, port) qui rend chaque ligne unique.<\/p>\n<\/aside><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Les diapos 20-21 utilisent 209.165.200.<strong>226<\/strong> et les diapos 36-40 209.165.200.<strong>225<\/strong> : ce ne sont pas des erreurs, ce sont deux exemples différents. 226 est une adresse prise dans un <strong>pool<\/strong>, 225 est l&#39;adresse de <strong>l&#39;interface<\/strong> Serial0/1/0 de R2 (PAT « adresse unique »).<\/p>\n<\/aside><h2>Idée 5 · Configurer le NAT sur un routeur Cisco<\/h2>\n<p>Trois briques reviennent dans toutes les configurations :<\/p>\n<ul>\n<li><strong>inside / outside<\/strong> : on marque chaque interface. <code>ip nat inside<\/code> côté réseau local, <code>ip nat outside<\/code> côté Internet. Sans ces deux marques, rien n&#39;est traduit.<\/li>\n<li><strong>l&#39;ACL<\/strong> : la liste des adresses <strong>sources<\/strong> à traduire. <code>access-list 1 permit 192.168.0.0 0.0.255.255<\/code>.<\/li>\n<li><strong>la règle<\/strong> <code>ip nat inside source …<\/code>, qui dit avec quoi traduire.<\/li>\n<\/ul>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Le masque de l&#39;ACL est un <strong>masque générique<\/strong> (wildcard) : c&#39;est l&#39;inverse du masque réseau. 0 = « ce bit doit correspondre », 1 = « peu importe ». 0.0.255.255 est l&#39;inverse de 255.255.0.0 : il accepte toute adresse 192.168.x.x. (Le cours donne la commande sans détailler ce point.)<\/p>\n<\/aside><p><strong>NAT statique<\/strong> (diapo 25 : le serveur Web 192.168.10.254 est publié en 209.165.201.5) :<\/p>\n<pre class=\"\"><code>R2(config)# ip nat inside source static 192.168.10.254 209.165.201.5\nR2(config)# interface Serial0/0/0\nR2(config-if)# ip address 10.1.1.2 255.255.255.252\nR2(config-if)# ip nat inside\nR2(config-if)# exit\nR2(config)# interface Serial0/1/0\nR2(config-if)# ip address 209.165.200.225 255.255.255.224\nR2(config-if)# ip nat outside<\/code><\/pre><p>Pas d&#39;ACL : la correspondance est écrite à la main. Pour la supprimer : <code>no ip nat inside source static 192.168.10.254 209.165.201.5<\/code>.<\/p>\n<p><strong>NAT dynamique<\/strong> (diapo 32) :<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Les 5 étapes du NAT dynamique<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · 1. Le pool<\/div><p>ip nat pool NAT-POOL1 209.165.200.226 209.165.200.240 netmask 255.255.255.224 (ou prefix-length 27)<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · 2. L&#39;ACL<\/div><p>access-list 1 permit 192.168.0.0 0.0.255.255<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · 3. La règle<\/div><p>ip nat inside source list 1 pool NAT-POOL1<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · 4. L&#39;interface interne<\/div><p>interface Serial0/0/0 puis ip nat inside<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · 5. L&#39;interface externe<\/div><p>interface Serial0/1/0 puis ip nat outside<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p><strong>PAT<\/strong> : la même chose avec le mot-clé <strong>overload<\/strong>, qui active la surcharge.<\/p>\n<table>\n<thead>\n<tr>\n<th>PAT avec…<\/th>\n<th>Commande clé (étape 3)<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>un pool d&#39;adresses<\/td>\n<td><code>ip nat inside source list 1 pool NAT-POOL2 overload<\/code><\/td>\n<\/tr>\n<tr>\n<td>l&#39;adresse de l&#39;interface externe<\/td>\n<td><code>ip nat inside source list 1 interface Serial0/1/0 overload<\/code><\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>La version « adresse unique » n&#39;a <strong>pas de pool<\/strong> : elle emprunte l&#39;adresse de l&#39;interface de sortie (ici 209.165.200.225). C&#39;est ce que fait ta box Internet.<\/p>\n<aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Oublier <code>overload<\/code>. La règle devient alors du NAT dynamique un pour un : le 16ᵉ PC (pool de 15 adresses) ne sort plus.<\/p>\n<\/aside><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p><strong>Erreurs dans les diapos.<\/strong> Diapo 32 : la dernière annotation dit « Identifiez l&#39;interface série 0/0/0 comme interne » au-dessus de <code>interface Serial0/1/0<\/code> et <code>ip nat outside<\/code>. Il faut lire <strong>0/1/0 externe<\/strong>. Diapos 31 et 34 : « prefix-legth » s&#39;écrit <strong>prefix-length<\/strong>. Diapo 29 : la première sortie indique l&#39;interface externe Serial0/0/<strong>1<\/strong>, la seconde Serial0/<strong>1<\/strong>/0, qui est la bonne dans cet exemple.<\/p>\n<\/aside><h2>Idée 6 · Vérifier<\/h2>\n<table>\n<thead>\n<tr>\n<th>Commande<\/th>\n<th>Ce qu&#39;elle montre<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>show ip nat translations<\/code><\/td>\n<td>les traductions actives, une ligne par entrée<\/td>\n<\/tr>\n<tr>\n<td><code>show ip nat translations verbose<\/code><\/td>\n<td>en plus : date de création, dernière utilisation, délai d&#39;expiration<\/td>\n<\/tr>\n<tr>\n<td><code>show ip nat statistics<\/code><\/td>\n<td>nombre de traductions (static / dynamic / extended), interfaces inside et outside, Hits et Misses<\/td>\n<\/tr>\n<tr>\n<td><code>clear ip nat statistics<\/code><\/td>\n<td>remet les compteurs à zéro<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Une entrée <strong>statique<\/strong> est toujours là, même sans trafic. Les colonnes « Outside » ne se remplissent que pendant une session :<\/p>\n<pre class=\"\"><code>R2# show ip nat translations\nPro Inside global   Inside local     Outside local    Outside global\n--- 209.165.201.5   192.168.10.254   ---              ---<\/code><\/pre><pre class=\"\"><code>R2# show ip nat translations\nPro Inside global   Inside local     Outside local    Outside global\n--- 209.165.201.5   192.168.10.254   209.165.200.254  209.165.200.254<\/code><\/pre><p>Dans <code>show ip nat statistics<\/code>, <strong>Hits<\/strong> compte les paquets traduits avec une entrée existante. Il passe de 0 à 5 dans l&#39;exemple du cours après la connexion du client. Une entrée <strong>dynamique<\/strong> expire si elle ne sert plus : <code>timeout:86400000<\/code> dans la sortie verbose, en millisecondes, soit <strong>24 h<\/strong>.<\/p>\n<h2>Résumé du cours<\/h2>\n<table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Principe<\/th>\n<th>IP privée<\/th>\n<th>IP publique<\/th>\n<th>Usage<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>NAT statique (1:1)<\/td>\n<td>une IP privée ↔ toujours la même IP publique<\/td>\n<td>192.168.1.10<\/td>\n<td>203.0.113.5<\/td>\n<td>serveur interne joignable depuis Internet<\/td>\n<\/tr>\n<tr>\n<td>NAT dynamique (M:N, M &gt; N)<\/td>\n<td>IP prise dans un pool à la connexion<\/td>\n<td>192.168.1.2 / .3<\/td>\n<td>203.0.113.10 / .11<\/td>\n<td>PC qui sortent, adresse pas fixe<\/td>\n<\/tr>\n<tr>\n<td>PAT (M:1)<\/td>\n<td>une IP publique partagée, distinction par le port<\/td>\n<td>192.168.1.2 / .3 / .4<\/td>\n<td>203.0.113.50:10001 / :10002 / :10003<\/td>\n<td>réseaux domestiques et d&#39;entreprise<\/td>\n<\/tr>\n<\/tbody><\/table>\n<aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>La conclusion du cours dit que « le NAT » permet à plusieurs machines de sortir avec une seule adresse publique : c&#39;est vrai du <strong>PAT<\/strong> en particulier. En examen, précise le type.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Table NAT et types<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>PC2 (192.168.11.10) ouvre une page sur 209.165.201.1. R2 lui attribue 209.165.200.227. Donne les quatre adresses de la ligne de la table NAT.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Interne = PC2, externe = le serveur. Seule l&#39;adresse
