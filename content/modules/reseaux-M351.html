de PC2 vue de l&#39;extérieur change.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><strong>Globale interne<\/strong> 209.165.200.227 · <strong>Locale interne<\/strong> 192.168.11.10 · <strong>Locale externe<\/strong> 209.165.201.1 · <strong>Globale externe<\/strong> 209.165.201.1.\nLocale et globale externes sont identiques : le NAT ne touche pas à l&#39;adresse du serveur.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Le serveur Web répond à PC2. Avant et après R2, quelles sont les adresses source et destination du paquet ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>C&#39;est la traduction inverse : R2 modifie la destination.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Avant R2 : source 209.165.201.1, destination <strong>209.165.200.227<\/strong>.\nAprès R2 : source 209.165.201.1, destination <strong>192.168.11.10<\/strong>.\nVu depuis Internet, c&#39;est du DNAT au retour : R2 change l&#39;adresse de destination grâce à sa table.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Une entreprise a un serveur Web interne (192.168.10.254) qui doit être joignable depuis Internet, et 200 PC qui naviguent avec une seule adresse publique. Quel type de NAT pour chacun ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><strong>Serveur : NAT statique.<\/strong> Les clients d&#39;Internet doivent toujours le trouver à la même adresse publique (209.165.201.5 dans le cours).\n<strong>PC : PAT.<\/strong> 200 machines, 1 adresse : seul le port permet de les distinguer. Le NAT dynamique demanderait autant d&#39;adresses publiques que de PC connectés en même temps.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Combien d&#39;adresses publiques contient le pool <code>ip nat pool NAT-POOL1 209.165.200.226 209.165.200.240 netmask 255.255.255.224<\/code> ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>Compte de 226 à 240, bornes comprises.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 15<\/b><\/p><p>240 − 226 + 1 = <strong>15 adresses<\/strong>. Le masque /27 (bloc 209.165.200.224 à .255) indique seulement le réseau auquel elles appartiennent.\nEn NAT dynamique sans overload, 15 machines au maximum peuvent sortir en même temps.<\/p>\n<\/div><\/div><\/section><section class=\"exo\"><h3>Configuration<\/h3><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>Écris la configuration du NAT statique qui publie un serveur 192.168.10.254 sous l&#39;adresse 209.165.201.5. Interne : Serial0/0/0, externe : Serial0/1/0.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Une règle « static », puis on marque les deux interfaces.<\/p>\n<\/div><div class=\"ex-c\" hidden><pre><code>R2(config)# ip nat inside source static 192.168.10.254 209.165.201.5\nR2(config)# interface Serial0/0/0\nR2(config-if)# ip nat inside\nR2(config-if)# exit\nR2(config)# interface Serial0/1/0\nR2(config-if)# ip nat outside<\/code><\/pre>\n<p>Pas de pool ni d&#39;ACL : la correspondance est fixée à la main.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><p>Écris la configuration PAT qui fait sortir tout 192.168.0.0/16 avec l&#39;adresse de l&#39;interface Serial0/1/0.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>ACL, règle avec « interface … overload », puis inside / outside.<\/p>\n<\/div><div class=\"ex-c\" hidden><pre><code>R2(config)# access-list 1 permit 192.168.0.0 0.0.255.255\nR2(config)# ip nat inside source list 1 interface Serial0/1/0 overload\nR2(config)# interface Serial0/0/0\nR2(config-if)# ip nat inside\nR2(config-if)# exit\nR2(config)# interface Serial0/1/0\nR2(config-if)# ip nat outside<\/code><\/pre>\n<p><strong>overload<\/strong> active le PAT. Sans lui, une seule machine pourrait sortir à la fois (une seule adresse disponible).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"7\"><div class=\"ex-q\"><p>Un étudiant a tapé le pool, l&#39;ACL et <code>ip nat inside source list 1 pool NAT-POOL1<\/code>, mais rien n&#39;est traduit. <code>show ip nat statistics<\/code> affiche « Inside interfaces: » vide. Que manque-t-il ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Il a oublié de marquer l&#39;interface interne : <code>interface Serial0/0/0<\/code> puis <code>ip nat inside<\/code>. Le routeur ne traduit que les paquets qui <strong>entrent par une interface inside<\/strong> et <strong>sortent par une interface outside<\/strong>. Vérifie aussi <code>ip nat outside<\/code> sur Serial0/1/0.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>PAT<\/h3><div class=\"ex\" data-x=\"8\"><div class=\"ex-q\"><p>Avec le PAT sur 209.165.200.225, un 3ᵉ poste (192.168.10.12) ouvre une connexion avec le port source 1444 vers 209.165.201.1:80, alors que les deux lignes de l&#39;Idée 4 existent déjà. Quelle ligne R2 ajoute-t-il, au plus probable ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Les ports 1444 et 1445 sont déjà pris sur l&#39;adresse publique.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Globale interne <strong>209.165.200.225:1446<\/strong> · locale interne 192.168.10.12:1444 · locale et globale externes 209.165.201.1:80.\nR2 ne peut garder ni 1444 ni 1445 (déjà utilisés). Il prend un autre port libre ; 1446 est le plus probable, mais le numéro exact dépend du routeur. Ce qui compte : un port <strong>unique<\/strong> sur l&#39;adresse publique.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"9\"><div class=\"ex-q\"><p>Dans <code>show ip nat statistics<\/code>, « Hits: 0 » passe à « Hits: 5 » après la connexion du client. Que signifie ce chiffre ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>5 paquets ont été traduits en utilisant une <strong>entrée déjà présente<\/strong> dans la table NAT (ici l&#39;entrée statique du serveur). « Misses » compte les fois où aucune entrée n&#39;existait et où le routeur a dû en créer une.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 15 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quel est le rôle principal du NAT ?<\/div><button class=\"opt\" data-o=\"0\">chiffrer les paquets qui sortent vers Internet<\/button><button class=\"opt\" data-o=\"1\">remplacer l&#39;adresse IP privée par une adresse publique à la sortie, et inversement au retour<\/button><button class=\"opt\" data-o=\"2\">attribuer automatiquement des adresses aux PC du réseau local<\/button><button class=\"opt\" data-o=\"3\">choisir le meilleur chemin vers Internet<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Dans l&#39;exemple du cours, 192.168.10.10 est l&#39;adresse…<\/div><button class=\"opt\" data-o=\"0\">locale interne de PC1<\/button><button class=\"opt\" data-o=\"1\">globale interne de PC1<\/button><button class=\"opt\" data-o=\"2\">locale externe du serveur<\/button><button class=\"opt\" data-o=\"3\">globale externe du serveur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">PC1 (192.168.10.10) est traduit en 209.165.200.226 pour joindre 209.165.201.1. Quelle est l&#39;adresse globale interne ?<\/div><button class=\"opt\" data-o=\"0\">192.168.10.10<\/button><button class=\"opt\" data-o=\"1\">209.165.200.226<\/button><button class=\"opt\" data-o=\"2\">209.165.201.1<\/button><button class=\"opt\" data-o=\"3\">10.1.1.2<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Un client d&#39;Internet envoie un paquet à 209.165.200.226 et R2 change la destination en 192.168.10.10. C&#39;est…<\/div><button class=\"opt\" data-o=\"0\">du SNAT<\/button><button class=\"opt\" data-o=\"1\">du DNAT<\/button><button class=\"opt\" data-o=\"2\">du PAT<\/button><button class=\"opt\" data-o=\"3\">du routage statique<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Quel type de NAT pour un serveur Web interne qui doit toujours être joignable à la même adresse publique ?<\/div><button class=\"opt\" data-o=\"0\">NAT statique<\/button><button class=\"opt\" data-o=\"1\">NAT dynamique<\/button><button class=\"opt\" data-o=\"2\">PAT avec pool<\/button><button class=\"opt\" data-o=\"3\">aucun, un serveur n&#39;a pas besoin de NAT<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Un pool de 5 adresses publiques en NAT dynamique (sans overload). Un 6ᵉ PC veut sortir alors que les 5 adresses sont prises. Que se passe-t-il ?<\/div><button class=\"opt\" data-o=\"0\">il partage l&#39;adresse du 5ᵉ PC grâce au port<\/button><button class=\"opt\" data-o=\"1\">il ne peut pas sortir tant qu&#39;aucune adresse n&#39;est libérée<\/button><button class=\"opt\" data-o=\"2\">R2 crée une 6ᵉ adresse publique<\/button><button class=\"opt\" data-o=\"3\">il sort avec son adresse privée<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Comment le PAT distingue-t-il deux PC qui sortent avec la même adresse publique ?<\/div><button class=\"opt\" data-o=\"0\">par leur adresse MAC<\/button><button class=\"opt\" data-o=\"1\">par le numéro de port source<\/button><button class=\"opt\" data-o=\"2\">par le TTL des paquets<\/button><button class=\"opt\" data-o=\"3\">il ne les distingue pas<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">PC1 sort avec le port 1444 → 209.165.200.225:1444. PC2 sort aussi avec le port 1444. Que fait R2 ?<\/div><button class=\"opt\" data-o=\"0\">il rejette le paquet de PC2<\/button><button class=\"opt\" data-o=\"1\">il réutilise 209.165.200.225:1444 pour les deux<\/button><button class=\"opt\" data-o=\"2\">il attribue un autre port à PC2, par exemple 209.165.200.225:1445<\/button><button class=\"opt\" data-o=\"3\">il donne à PC2 une autre adresse publique<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Quel mot-clé transforme une règle de NAT dynamique en PAT ?<\/div><button class=\"opt\" data-o=\"0\">static<\/button><button class=\"opt\" data-o=\"1\">pool<\/button><button class=\"opt\" data-o=\"2\">overload<\/button><button class=\"opt\" data-o=\"3\">extendable<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Dans <code>access-list 1 permit 192.168.0.0 0.0.255.255<\/code>, quelles adresses sont traduites ?<\/div><button class=\"opt\" data-o=\"0\">seulement 192.168.0.0<\/button><button class=\"opt\" data-o=\"1\">192.168.0.0 à 192.168.0.255<\/button><button class=\"opt\" data-o=\"2\">toutes les adresses 192.168.x.x<\/button><button class=\"opt\" data-o=\"3\">toutes les adresses sauf 192.168.x.x<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"10\"><div class=\"qq-q\">Que fait <code>ip nat inside<\/code> sur une interface ?<\/div><button class=\"opt\" data-o=\"0\">il active le NAT statique<\/button><button class=\"opt\" data-o=\"1\">il indique que l&#39;interface est du côté du réseau local<\/button><button class=\"opt\" data-o=\"2\">il donne une adresse privée à l&#39;interface<\/button><button class=\"opt\" data-o=\"3\">il crée le pool d&#39;adresses<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"11\"><div class=\"qq-q\">Quelle commande crée une traduction statique de 192.168.10.254 vers 209.165.201.5 ?<\/div><button class=\"opt\" data-o=\"0\">ip nat outside source static 209.165.201.5 192.168.10.254<\/button><button class=\"opt\" data-o=\"1\">ip nat inside source static 192.168.10.254 209.165.201.5<\/button><button class=\"opt\" data-o=\"2\">ip nat pool static 192.168.10.254 209.165.201.5<\/button><button class=\"opt\" data-o=\"3\">ip nat inside source list 1 static 209.165.201.5<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"12\"><div class=\"qq-q\">Quelle commande affiche les traductions NAT actives ?<\/div><button class=\"opt\" data-o=\"0\">show ip route nat<\/button><button class=\"opt\" data-o=\"1\">show ip nat translations<\/button><button class=\"opt\" data-o=\"2\">show nat table<\/button><button class=\"opt\" data-o=\"3\">show ip interface brief<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"13\"><div class=\"qq-q\">Avant toute connexion, <code>show ip nat translations<\/code> affiche déjà une ligne 209.165.201.5 / 192.168.10.254 avec « --- » côté Outside. Pourquoi ?<\/div><button class=\"opt\" data-o=\"0\">le NAT est mal configuré<\/button><button class=\"opt\" data-o=\"1\">c&#39;est une traduction statique : elle est toujours présente dans la table<\/button><button class=\"opt\" data-o=\"2\">un client est déjà connecté<\/button><button class=\"opt\" data-o=\"3\">c&#39;est une entrée dynamique qui n&#39;a pas encore expiré<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"n52","rep":null,"tol":null},{"n":"n52","rep":null,"tol":null},{"n":"n52","rep":null,"tol":null},{"n":"n53","rep":null,"tol":null},{"n":"n54","rep":["15"],"tol":null},{"n":"n54","rep":null,"tol":null},{"n":"n55","rep":null,"tol":null},{"n":"n54","rep":null,"tol":null},{"n":"n55","rep":null,"tol":null},{"n":"n56","rep":null,"tol":null}],"qcm":[{"n":"n52","q":"Quel est le rôle principal du NAT ?","o":["chiffrer les paquets qui sortent vers Internet","remplacer l&#39;adresse IP privée par une adresse publique à la sortie, et inversement au retour","attribuer automatiquement des adresses aux PC du réseau local","choisir le meilleur chemin vers Internet"],"a":1,"e":"Attribuer les adresses, c&#39;est DHCP ; choisir le chemin, c&#39;est le routage. Le NAT traduit les adresses."},{"n":"n52","q":"Dans l&#39;exemple du cours, 192.168.10.10 est l&#39;adresse…","o":["locale interne de PC1","globale interne de PC1","locale externe du serveur","globale externe du serveur"],"a":0,"e":"C&#39;est l&#39;adresse de notre machine (interne) vue depuis le réseau local (locale)."},{"n":"n52","q":"PC1 (192.168.10.10) est traduit en 209.165.200.226 pour joindre 209.165.201.1. Quelle est l&#39;adresse globale interne ?","o":["192.168.10.10","209.165.200.226","209.165.201.1","10.1.1.2"],"a":1,"e":"Globale interne = l&#39;adresse de PC1 telle qu&#39;Internet la voit."},{"n":"n52","q":"Un client d&#39;Internet envoie un paquet à 209.165.200.226 et R2 change la destination en 192.168.10.10. C&#39;est…","o":["du SNAT","du DNAT","du PAT","du routage statique"],"a":1,"e":"DNAT = Destination NAT : l&#39;adresse de destination est modifiée."},{"n":"n53","q":"Quel type de NAT pour un serveur Web interne qui doit toujours être joignable à la même adresse publique ?","o":["NAT statique","NAT dynamique","PAT avec pool","aucun, un serveur n&#39;a pas besoin de NAT"],"a":0,"e":"1:1 fixe : les clients d&#39;Internet le trouvent toujours à la même adresse."},{"n":"n53","q":"Un pool de 5 adresses publiques en NAT dynamique (sans overload). Un 6ᵉ PC veut sortir alors que les 5 adresses sont prises. Que se passe-t-il ?","o":["il partage l&#39;adresse du 5ᵉ PC grâce au port","il ne peut pas sortir tant qu&#39;aucune adresse n&#39;est libérée","R2 crée une 6ᵉ adresse publique","il sort avec son adresse privée"],"a":1,"e":"En NAT dynamique, une adresse du pool = une machine. Partager une adresse, c&#39;est le PAT."},{"n":"n55","q":"Comment le PAT distingue-t-il deux PC qui sortent avec la même adresse publique ?","o":["par leur adresse MAC","par le numéro de port source","par le TTL des paquets","il ne les distingue pas"],"a":1,"e":"Chaque entrée de la table est un couple (adresse, port) unique."},{"n":"n55","q":"PC1 sort avec le port 1444 → 209.165.200.225:1444. PC2 sort aussi avec le port 1444. Que fait R2 ?","o":["il rejette le paquet de PC2","il réutilise 209.165.200.225:1444 pour les deux","il attribue un autre port à PC2, par exemple 209.165.200.225:1445","il donne à PC2 une autre adresse publique"],"a":2,"e":"Le port 1444 étant déjà pris sur l&#39;adresse publique, R2 en choisit un autre (1445 dans le cours)."},{"n":"n55","q":"Quel mot-clé transforme une règle de NAT dynamique en PAT ?","o":["static","pool","overload","extendable"],"a":2,"e":"ip nat inside source list 1 pool NAT-POOL2 overload"},{"n":"n54","q":"Dans <code>access-list 1 permit 192.168.0.0 0.0.255.255<\/code>, quelles adresses sont traduites ?","o":["seulement 192.168.0.0","192.168.0.0 à 192.168.0.255","toutes les adresses 192.168.x.x","toutes les adresses sauf 192.168.x.x"],"a":2,"e":"0.0.255.255 est un masque générique : les deux derniers octets peuvent valoir n&#39;importe quoi."},{"n":"n54","q":"Que fait <code>ip nat inside<\/code> sur une interface ?","o":["il active le NAT statique","il indique que l&#39;interface est du côté du réseau local","il donne une adresse privée à l&#39;interface","il crée le pool d&#39;adresses"],"a":1,"e":"Le routeur traduit les paquets qui passent d&#39;une interface inside à une interface outside."},{"n":"n54","q":"Quelle commande crée une traduction statique de 192.168.10.254 vers 209.165.201.5 ?","o":["ip nat outside source static 209.165.201.5 192.168.10.254","ip nat inside source static 192.168.10.254 209.165.201.5","ip nat pool static 192.168.10.254 209.165.201.5","ip nat inside source list 1 static 209.165.201.5"],"a":1,"e":"Ordre : d&#39;abord la locale interne, ensuite la globale interne."},{"n":"n56","q":"Quelle commande affiche les traductions NAT actives ?","o":["show ip route nat","show ip nat translations","show nat table","show ip interface brief"],"a":1,"e":"Ajoute verbose pour voir création, utilisation et délai d&#39;expiration."},{"n":"n56","q":"Avant toute connexion, <code>show ip nat translations<\/code> affiche déjà une ligne 209.165.201.5 / 192.168.10.254 avec « --- » côté Outside. Pourquoi ?","o":["le NAT est mal configuré","c&#39;est une traduction statique : elle est toujours présente dans la table","un client est déjà connecté","c&#39;est une entrée dynamique qui n&#39;a pas encore expiré"],"a":1,"e":"Les colonnes Outside ne se remplissent qu&#39;une fois une session ouverte."}]},{"id":"s14","t":"En-têtes IP, TCP et UDP (à mémoriser)","seance":"Chapitre 1","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Passer de l&#39;hexadécimal au binaire.<\/p>\n<details class=\"prereq\"><summary><b>Vérifie ton prérequis.<\/b> Combien de bits représente un chiffre hexadécimal ?<\/summary><p>4 bits. Deux chiffres hexadécimaux font donc un octet.<\/p><\/details><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Dessine l&#39;en-tête en lignes de 32 bits.<\/strong> IPv4 : 5 lignes, soit 20 octets au minimum. TCP : 5 lignes. UDP : 2 lignes, soit 8 octets. Apprends le dessin, pas une liste.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Lire la longueur d&#39;en-tête IP en octets. Elle est exprimée en mots de 32 bits : la valeur 5 signifie 5 × 4 = 20 octets.<\/p>\n<\/aside><p>À la fin, tu sais redessiner les trois en-têtes et lire un segment donné en hexadécimal.<\/p>\n<h2>Le cours<\/h2>\n<div class=\"exam\"><b>Signal du prof (29/10)<\/b>« Vous avez déjà l'en-tête IP et TCP dans le support : il faut le mémoriser pour l'examen. » Attends-toi à devoir <b>dessiner un en-tête<\/b>, nommer un champ, donner sa taille ou expliquer son rôle.<\/div>\n  <p><b>Comment lire ces schémas :<\/b> chaque ligne fait <b>32 bits<\/b>, soit 4 octets. La largeur d'une case est proportionnelle au nombre de bits du champ. <b>Clique sur une case<\/b> pour voir son rôle.<\/p>\n  <h3>En-tête IPv4 (5 lignes = 20 octets minimum)<\/h3>\n  <div class=\"flow\"><svg viewBox=\"0 0 564 230\" style=\"width:100%;min-width:560px;max-width:760px\" role=\"img\" aria-label=\"En-tête IPv4\"><text class=\"tx\" x=\"10\" y=\"14\" text-anchor=\"start\">0<\/text><text class=\"tx\" x=\"146\" y=\"14\" text-anchor=\"start\">8<\/text><text class=\"tx\" x=\"282\" y=\"14\" text-anchor=\"start\">16<\/text><text class=\"tx\" x=\"418\" y=\"14\" text-anchor=\"start\">24<\/text><text class=\"tx\" x=\"554\" y=\"14\" text-anchor=\"end\">32<\/text><g data-hf=\"ip:0:0\" style=\"cursor:pointer\"><rect x=\"10\" y=\"24\" width=\"68\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"44\" y=\"42\" text-anchor=\"middle\" style=\"font-weight:600\">Version<\/text><text class=\"tx\" x=\"44\" y=\"56\" text-anchor=\"middle\">4 bits<\/text><\/g><g data-hf=\"ip:0:1\" style=\"cursor:pointer\"><rect x=\"78\" y=\"24\" width=\"68\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"112\" y=\"42\" text-anchor=\"middle\" style=\"font-weight:600\">IHL<\/text><text class=\"tx\" x=\"112\" y=\"56\" text-anchor=\"middle\">4 bits<\/text><\/g><g data-hf=\"ip:0:2\" style=\"cursor:pointer\"><rect x=\"146\" y=\"24\" width=\"136\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"214\" y=\"42\" text-anchor=\"middle\" style=\"font-weight:600\">Type de service<\/text><text class=\"tx\" x=\"214\" y=\"56\" text-anchor=\"middle\">8 bits<\/text><\/g><g data-hf=\"ip:0:3\" style=\"cursor:pointer\"><rect x=\"282\" y=\"24\" width=\"272\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"418\" y=\"42\" text-anchor=\"middle\" style=\"font-weight:600\">Longueur totale<\/text><text class=\"tx\" x=\"418\" y=\"56\" text-anchor=\"middle\">16 bits<\/text><\/g><g data-hf=\"ip:1:0\" style=\"cursor:pointer\"><rect x=\"10\" y=\"64\" width=\"272\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"146\" y=\"82\" text-anchor=\"middle\" style=\"font-weight:600\">Identification<\/text><text class=\"tx\" x=\"146\" y=\"96\" text-anchor=\"middle\">16 bits<\/text><\/g><g data-hf=\"ip:1:1\" style=\"cursor:pointer\"><rect x=\"282\" y=\"64\" width=\"51\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"307.5\" y=\"82\" text-anchor=\"middle\" style=\"font-weight:600\">Flags<\/text><text class=\"tx\" x=\"307.5\" y=\"96\" text-anchor=\"middle\">3 bits<\/text><\/g><g data-hf=\"ip:1:2\" style=\"cursor:pointer\"><rect x=\"333\" y=\"64\" width=\"221\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"443.5\" y=\"82\" text-anchor=\"middle\" style=\"font-weight:600\">Décalage de fragment<\/text><text class=\"tx\" x=\"443.5\" y=\"96\" text-anchor=\"middle\">13 bits<\/text><\/g><g data-hf=\"ip:2:0\" style=\"cursor:pointer\"><rect x=\"10\" y=\"104\" width=\"136\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"78\" y=\"122\" text-anchor=\"middle\" style=\"font-weight:600\">TTL<\/text><text class=\"tx\" x=\"78\" y=\"136\" text-anchor=\"middle\">8 bits<\/text><\/g><g data-hf=\"ip:2:1\" style=\"cursor:pointer\"><rect x=\"146\" y=\"104\" width=\"136\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"214\" y=\"122\" text-anchor=\"middle\" style=\"font-weight:600\">Protocole<\/text><text class=\"tx\" x=\"214\" y=\"136\" text-anchor=\"middle\">8 bits<\/text><\/g><g data-hf=\"ip:2:2\" style=\"cursor:pointer\"><rect x=\"282\" y=\"104\" width=\"272\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"418\" y=\"122\" text-anchor=\"middle\" style=\"font-weight:600\">Somme de contrôle<\/text><text class=\"tx\" x=\"418\" y=\"136\" text-anchor=\"middle\">16 bits<\/text><\/g><g data-hf=\"ip:3:0\" style=\"cursor:pointer\"><rect x=\"10\" y=\"144\" width=\"544\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"282\" y=\"162\" text-anchor=\"middle\" style=\"font-weight:600\">Adresse IP source<\/text><text class=\"tx\" x=\"282\" y=\"176\" text-anchor=\"middle\">32 bits<\/text><\/g><g data-hf=\"ip:4:0\" style=\"cursor:pointer\"><rect x=\"10\" y=\"184\" width=\"544\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"282\" y=\"202\" text-anchor=\"middle\" style=\"font-weight:600\">Adresse IP destination<\/text><text class=\"tx\" x=\"282\" y=\"216\" text-anchor=\"middle\">32 bits<\/text><\/g><\/svg><\/div><div class=\"expl\" id=\"hdrInfo-ip\">Clique sur un champ.<\/div>\n  <div class=\"def\"><b>Moyen mnémotechnique, une phrase par ligne<\/b>L1 <b>V<\/b>ersion · <b>I<\/b>HL · <b>T<\/b>ype de service · <b>L<\/b>ongueur totale → « <b>V<\/b>a, <b>I<\/b>l <b>T<\/b>e <b>L<\/b>it »<br>L2 <b>I<\/b>dentification · <b>F<\/b>lags · <b>F<\/b>ragment (décalage) → « <b>I<\/b>l <b>F<\/b>aut <b>F<\/b>ragmenter »<br>L3 <b>T<\/b>TL · <b>P<\/b>rotocole · <b>C<\/b>hecksum → « <b>T<\/b>rois <b>P<\/b>oints <b>C<\/b>lés »<br>L4-L5 <b>S<\/b>ource puis <b>D<\/b>estination, 32 bits chacune.<br>Tailles de la ligne 1 : 4-4-8-16 ; ligne 2 : 16-3-13 ; ligne 3 : 8-8-16.<\/div>\n  <div class=\"trap\"><b>Pièges<\/b>① IHL compte en <b>mots de 32 bits<\/b> (5 = 20 octets), mais la longueur totale compte en <b>octets<\/b>. ② Protocole : 1 = ICMP, 6 = TCP, 17 = UDP. ③ La somme de contrôle IP ne protège que l'en-tête. ④ Ce sont les adresses IP qui sont dans l'en-tête IP. Les adresses MAC (48 bits) sont dans l'en-tête de la trame Ethernet, à la couche 2.<\/div>\n  <h3>En-tête TCP (5 lignes = 20 octets minimum)<\/h3>\n  <div class=\"flow\"><svg viewBox=\"0 0 564 230\" style=\"width:100%;min-width:560px;max-width:760px\" role=\"img\" aria-label=\"En-tête TCP\"><text class=\"tx\" x=\"10\" y=\"14\" text-anchor=\"start\">0<\/text><text class=\"tx\" x=\"146\" y=\"14\" text-anchor=\"start\">8<\/text><text class=\"tx\" x=\"282\" y=\"14\" text-anchor=\"start\">16<\/text><text class=\"tx\" x=\"418\" y=\"14\" text-anchor=\"start\">24<\/text><text class=\"tx\" x=\"554\" y=\"14\" text-anchor=\"end\">32<\/text><g data-hf=\"tcp:0:0\" style=\"cursor:pointer\"><rect x=\"10\" y=\"24\" width=\"272\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"146\" y=\"42\" text-anchor=\"middle\" style=\"font-weight:600\">Port source<\/text><text class=\"tx\" x=\"146\" y=\"56\" text-anchor=\"middle\">16 bits<\/text><\/g><g data-hf=\"tcp:0:1\" style=\"cursor:pointer\"><rect x=\"282\" y=\"24\" width=\"272\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"418\" y=\"42\" text-anchor=\"middle\" style=\"font-weight:600\">Port destination<\/text><text class=\"tx\" x=\"418\" y=\"56\" text-anchor=\"middle\">16 bits<\/text><\/g><g data-hf=\"tcp:1:0\" style=\"cursor:pointer\"><rect x=\"10\" y=\"64\" width=\"544\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"282\" y=\"82\" text-anchor=\"middle\" style=\"font-weight:600\">Numéro de séquence<\/text><text class=\"tx\" x=\"282\" y=\"96\" text-anchor=\"middle\">32 bits<\/text><\/g><g data-hf=\"tcp:2:0\" style=\"cursor:pointer\"><rect x=\"10\" y=\"104\" width=\"544\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"282\" y=\"122\" text-anchor=\"middle\" style=\"font-weight:600\">Numéro d'acquittement<\/text><text class=\"tx\" x=\"282\" y=\"136\" text-anchor=\"middle\">32 bits<\/text><\/g><g data-hf=\"tcp:3:0\" style=\"cursor:pointer\"><rect x=\"10\" y=\"144\" width=\"68\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"44\" y=\"162\" text-anchor=\"middle\" style=\"font-weight:600\">Lg en-tête<\/text><text class=\"tx\" x=\"44\" y=\"176\" text-anchor=\"middle\">4 bits<\/text><\/g><g data-hf=\"tcp:3:1\" style=\"cursor:pointer\"><rect x=\"78\" y=\"144\" width=\"102\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"129\" y=\"162\" text-anchor=\"middle\" style=\"font-weight:600\">Réservé<\/text><text class=\"tx\" x=\"129\" y=\"176\" text-anchor=\"middle\">6 bits<\/text><\/g><g data-hf=\"tcp:3:2\" style=\"cursor:pointer\"><rect x=\"180\" y=\"144\" width=\"102\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"231\" y=\"162\" text-anchor=\"middle\" style=\"font-weight:600\">Drapeaux<\/text><text class=\"tx\" x=\"231\" y=\"176\" text-anchor=\"middle\">6 bits<\/text><\/g><g data-hf=\"tcp:3:3\" style=\"cursor:pointer\"><rect x=\"282\" y=\"144\" width=\"272\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"418\" y=\"162\" text-anchor=\"middle\" style=\"font-weight:600\">Fenêtre<\/text><text class=\"tx\" x=\"418\" y=\"176\" text-anchor=\"middle\">16 bits<\/text><\/g><g data-hf=\"tcp:4:0\" style=\"cursor:pointer\"><rect x=\"10\" y=\"184\" width=\"272\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"146\" y=\"202\" text-anchor=\"middle\" style=\"font-weight:600\">Somme de contrôle<\/text><text class=\"tx\" x=\"146\" y=\"216\" text-anchor=\"middle\">16 bits<\/text><\/g><g data-hf=\"tcp:4:1\" style=\"cursor:pointer\"><rect x=\"282\" y=\"184\" width=\"272\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"418\" y=\"202\" text-anchor=\"middle\" style=\"font-weight:600\">Pointeur urgent<\/text><text class=\"tx\" x=\"418\" y=\"216\" text-anchor=\"middle\">16 bits<\/text><\/g><\/svg><\/div><div class=\"expl\" id=\"hdrInfo-tcp\">Clique sur un champ.<\/div>\n  <div class=\"def\"><b>Moyen mnémotechnique<\/b>L1 les deux <b>ports<\/b> (16 + 16) · L2 <b>Séquence<\/b> (32) · L3 <b>Acquittement<\/b> (32) · L4 <b>Longueur<\/b> (4), <b>Réservé<\/b> (6), <b>Drapeaux<\/b> (6), <b>Fenêtre<\/b> (16) · L5 <b>Checksum<\/b> (16), <b>Urgent<\/b> (16).<br>Les 6 drapeaux, dans l'ordre : <b>U A P R S F<\/b> → « <b>U<\/b>n <b>A<\/b>gent <b>P<\/b>ressé <b>R<\/b>ange <b>S<\/b>es <b>F<\/b>ichiers ».<\/div>\n  <div class=\"trap\"><b>Pièges<\/b>① Ce sont les <b>ports<\/b> qui sont dans l'en-tête TCP. Les adresses IP n'y sont pas : elles sont dans l'en-tête IP, en dessous. ② Les numéros de séquence et d'acquittement font chacun une ligne entière de 32 bits. ③ Les manuels récents découpent « Réservé + Drapeaux » en 4 + 8 bits, en ajoutant les drapeaux CWR et ECE. Garde la version 6 + 6 du cours classique, sauf si le support de ton prof montre l'autre : envoie-moi une photo de sa diapo pour qu'on vérifie.<\/div>\n  <h3>En-tête UDP (2 lignes = 8 octets)<\/h3>\n  <div class=\"flow\"><svg viewBox=\"0 0 564 110\" style=\"width:100%;min-width:560px;max-width:760px\" role=\"img\" aria-label=\"En-tête UDP\"><text class=\"tx\" x=\"10\" y=\"14\" text-anchor=\"start\">0<\/text><text class=\"tx\" x=\"146\" y=\"14\" text-anchor=\"start\">8<\/text><text class=\"tx\" x=\"282\" y=\"14\" text-anchor=\"start\">16<\/text><text class=\"tx\" x=\"418\" y=\"14\" text-anchor=\"start\">24<\/text><text class=\"tx\" x=\"554\" y=\"14\" text-anchor=\"end\">32<\/text><g data-hf=\"udp:0:0\" style=\"cursor:pointer\"><rect x=\"10\" y=\"24\" width=\"272\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"146\" y=\"42\" text-anchor=\"middle\" style=\"font-weight:600\">Port source<\/text><text class=\"tx\" x=\"146\" y=\"56\" text-anchor=\"middle\">16 bits<\/text><\/g><g data-hf=\"udp:0:1\" style=\"cursor:pointer\"><rect x=\"282\" y=\"24\" width=\"272\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"418\" y=\"42\" text-anchor=\"middle\" style=\"font-weight:600\">Port destination<\/text><text class=\"tx\" x=\"418\" y=\"56\" text-anchor=\"middle\">16 bits<\/text><\/g><g data-hf=\"udp:1:0\" style=\"cursor:pointer\"><rect x=\"10\" y=\"64\" width=\"272\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"146\" y=\"82\" text-anchor=\"middle\" style=\"font-weight:600\">Longueur<\/text><text class=\"tx\" x=\"146\" y=\"96\" text-anchor=\"middle\">16 bits<\/text><\/g><g data-hf=\"udp:1:1\" style=\"cursor:pointer\"><rect x=\"282\" y=\"64\" width=\"272\" height=\"40\" fill=\"var(--soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text class=\"tx\" x=\"418\" y=\"82\" text-anchor=\"middle\" style=\"font-weight:600\">Somme de contrôle<\/text><text class=\"tx\" x=\"418\" y=\"96\" text-anchor=\"middle\">16 bits<\/text><\/g><\/svg><\/div><div class=\"expl\" id=\"hdrInfo-udp\">Clique sur un champ.<\/div>\n  <p>Comparaison à retenir : TCP a besoin de séquence, d'acquittement, de drapeaux et de fenêtre pour être fiable, d'où ses 20 octets. UDP n'a que l'essentiel : 8 octets. Le cours dit « Longueur : longueur d'en-tête UDP ». En réalité, ce champ donne la longueur <b>de l'en-tête et des données<\/b> (dans le TP, longueur UDP = longueur IP − 20). Écris « en-tête + données » sur ta copie : c'est la définition exacte (RFC 768).<\/p>\n  <div class=\"exam\"><b>Entraîne-toi<\/b>Onglet Rédaction → « Reconstituer un en-tête » : tu remplis les champs dans l'ordre, de mémoire. Fais-le jusqu'à 100 %, puis refais-le à J+1, J+3 et J+7.<\/div>\n  <h3>Lire un segment TCP en hexadécimal (TD 2, ex. 2)<\/h3>\n  <div class=\"table-wrap\"><table><thead><tr><th>Octets<\/th><th>1-2<\/th><th>3-4<\/th><th>5-8<\/th><th>9-12<\/th><th>13<\/th><th>14<\/th><th>15-16<\/th><th>17-18<\/th><th>19-20<\/th><\/tr><\/thead><tbody><tr><td>Champ<\/td><td>port source<\/td><td>port dest.<\/td><td>Seq<\/td><td>ACK<\/td><td>1er chiffre = longueur d'en-tête (× 4 octets)<\/td><td>drapeaux<\/td><td>fenêtre<\/td><td>checksum<\/td><td>urgent<\/td><\/tr><\/tbody><\/table><\/div>\n  <p><b>Octet des drapeaux<\/b> : FIN = 01, SYN = 02, RST = 04, PSH = 08, ACK = 10, URG = 20 (on additionne). Courants : <b>02<\/b> = SYN, <b>12<\/b> = SYN + ACK, <b>10<\/b> = ACK, <b>18<\/b> = PSH + ACK, <b>11<\/b> = FIN + ACK, <b>04<\/b> = RST.<\/p>\n  <div class=\"def\"><b>Exemple du TD 2<\/b>00 15 0F 87 9C CB 7E 01 27 E3 EA 01 50 12 10 00 DF 3D 00 00<br>Port source 0x0015 = 21 (FTP, contrôle) · port destination 0x0F87 = 3975 (port éphémère du client) · Seq 0x9CCB7E01 = 2 630 581 761 · ACK 0x27E3EA01 = 669 248 001 · en-tête 5 × 4 = 20 octets · drapeaux 0x12 = <b>SYN + ACK<\/b> · fenêtre 0x1000 = 4096 · checksum DF3D · urgent 0.<br>C'est la <b>2e étape de la poignée de main<\/b> : le serveur FTP répond au SYN du client (son numéro initial était 669 248 000, d'où ACK = 669 248 001).<\/div><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 18 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Taille minimale de l&#39;en-tête IPv4 ?<\/div><button class=\"opt\" data-o=\"0\">8 octets<\/button><button class=\"opt\" data-o=\"1\">20 octets<\/button><button class=\"opt\" data-o=\"2\">32 octets<\/button><button class=\"opt\" data-o=\"3\">40 octets<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Le champ IHL vaut 5. Taille de l&#39;en-tête ?<\/div><button class=\"opt\" data-o=\"0\">5 octets<\/button><button class=\"opt\" data-o=\"1\">20 octets<\/button><button class=\"opt\" data-o=\"2\">40 octets<\/button><button class=\"opt\" data-o=\"3\">5 bits<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Quel champ IPv4 diminue de 1 à chaque routeur ?<\/div><button class=\"opt\" data-o=\"0\">Identification<\/button><button class=\"opt\" data-o=\"1\">Longueur totale<\/button><button class=\"opt\" data-o=\"2\">TTL<\/button><button class=\"opt\" data-o=\"3\">Protocole<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Champ Protocole = 6. Que transporte le paquet ?<\/div><button class=\"opt\" data-o=\"0\">ICMP<\/button><button class=\"opt\" data-o=\"1\">TCP<\/button><button class=\"opt\" data-o=\"2\">UDP<\/button><button class=\"opt\" data-o=\"3\">IPv6<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Quels champs servent à la fragmentation ?<\/div><button class=\"opt\" data-o=\"0\">TTL et Protocole<\/button><button class=\"opt\" data-o=\"1\">Identification, Flags et Décalage de fragment<\/button><button class=\"opt\" data-o=\"2\">Version et IHL<\/button><button class=\"opt\" data-o=\"3\">Source et Destination<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Taille d&#39;une adresse IPv4 dans l&#39;en-tête ?<\/div><button class=\"opt\" data-o=\"0\">16 bits<\/button><button class=\"opt\" data-o=\"1\">32 bits<\/button><button class=\"opt\" data-o=\"2\">48 bits<\/button><button class=\"opt\" data-o=\"3\">64 bits<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">La somme de contrôle IPv4 protège…<\/div><button class=\"opt\" data-o=\"0\">les données<\/button><button class=\"opt\" data-o=\"1\">l&#39;en-tête seulement<\/button><button class=\"opt\" data-o=\"2\">toute la trame<\/button><button class=\"opt\" data-o=\"3\">rien<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Taille du numéro de séquence TCP ?<\/div><button class=\"opt\" data-o=\"0\">16 bits<\/button><button class=\"opt\" data-o=\"1\">32 bits<\/button><button class=\"opt\" data-o=\"2\">8 bits<\/button><button class=\"opt\" data-o=\"3\">48 bits<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Lequel n&#39;est PAS un drapeau TCP ?<\/div><button class=\"opt\" data-o=\"0\">SYN<\/button><button class=\"opt\" data-o=\"1\">FIN<\/button><button class=\"opt\" data-o=\"2\">TTL<\/button><button class=\"opt\" data-o=\"3\">RST<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Quel champ TCP sert au contrôle de flux ?<\/div><button class=\"opt\" data-o=\"0\">Pointeur urgent<\/button><button class=\"opt\" data-o=\"1\">Fenêtre<\/button><button class=\"opt\" data-o=\"2\">Somme de contrôle<\/button><button class=\"opt\" data-o=\"3\">Port source<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"10\"><div class=\"qq-q\">Taille d&#39;un champ de port (TCP ou UDP) ?<\/div><button class=\"opt\" data-o=\"0\">8 bits<\/button><button class=\"opt\" data-o=\"1\">16 bits<\/button><button class=\"opt\" data-o=\"2\">32 bits<\/button><button class=\"opt\" data-o=\"3\">4 bits<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"11\"><div class=\"qq-q\">Le drapeau qui coupe brutalement une connexion TCP est…<\/div><button class=\"opt\" data-o=\"0\">FIN<\/button><button class=\"opt\" data-o=\"1\">RST<\/button><button class=\"opt\" data-o=\"2\">PSH<\/button><button class=\"opt\" data-o=\"3\">URG<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"12\"><div class=\"qq-q\">Taille de l&#39;en-tête UDP ?<\/div><button class=\"opt\" data-o=\"0\">8 octets<\/button><button class=\"opt\" data-o=\"1\">20 octets<\/button><button class=\"opt\" data-o=\"2\">4 octets<\/button><button class=\"opt\" data-o=\"3\">12 octets<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"13\"><div class=\"qq-q\">Lequel de ces champs existe dans UDP ?<\/div><button class=\"opt\" data-o=\"0\">Numéro de séquence<\/button><button class=\"opt\" data-o=\"1\">Fenêtre<\/button><button class=\"opt\" data-o=\"2\">Longueur<\/button><button class=\"opt\" data-o=\"3\">Drapeaux<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"14\"><div class=\"qq-q\">L&#39;octet des drapeaux d&#39;un segment TCP vaut 0x12. Quels drapeaux sont levés ?<\/div><button class=\"opt\" data-o=\"0\">SYN seul<\/button><button class=\"opt\" data-o=\"1\">SYN et ACK<\/button><button class=\"opt\" data-o=\"2\">ACK seul<\/button><button class=\"opt\" data-o=\"3\">FIN et ACK<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[],"qcm":[{"n":"n38","q":"Taille minimale de l&#39;en-tête IPv4 ?","o":["8 octets","20 octets","32 octets","40 octets"],"a":1,"e":"5 lignes de 32 bits = 20 octets."},{"n":"n38","q":"Le champ IHL vaut 5. Taille de l&#39;en-tête ?","o":["5 octets","20 octets","40 octets","5 bits"],"a":1,"e":"IHL compte en mots de 32 bits (4 octets) : 5 × 4 = 20 octets."},{"n":"n38","q":"Quel champ IPv4 diminue de 1 à chaque routeur ?","o":["Identification","Longueur totale","TTL","Protocole"],"a":2,"e":"À 0, le paquet est détruit et le routeur renvoie un ICMP 11."},{"n":"n38","q":"Champ Protocole = 6. Que transporte le paquet ?","o":["ICMP","TCP","UDP","IPv6"],"a":1,"e":"1 ICMP, 6 TCP, 17 UDP."},{"n":"n38","q":"Quels champs servent à la fragmentation ?","o":["TTL et Protocole","Identification, Flags et Décalage de fragment","Version et IHL","Source et Destination"],"a":1,"e":"C&#39;est toute la ligne 2 de l&#39;en-tête."},{"n":"n38","q":"Taille d&#39;une adresse IPv4 dans l&#39;en-tête ?","o":["16 bits","32 bits","48 bits","64 bits"],"a":1,"e":"32 bits, soit 4 octets (ex. 192.168.1.10). 48 bits, c&#39;est une adresse MAC."},{"n":"n38","q":"La somme de contrôle IPv4 protège…","o":["les données","l&#39;en-tête seulement","toute la trame","rien"],"a":1,"e":"Seulement l&#39;en-tête. Elle est recalculée à chaque saut, car le TTL change."},{"n":"n39","q":"Taille du numéro de séquence TCP ?","o":["16 bits","32 bits","8 bits","48 bits"],"a":1,"e":"32 bits, comme le numéro d&#39;acquittement (une ligne entière chacun)."},{"n":"n39","q":"Lequel n&#39;est PAS un drapeau TCP ?","o":["SYN","FIN","TTL","RST"],"a":2,"e":"TTL est un champ d&#39;IP. Les drapeaux TCP : URG, ACK, PSH, RST, SYN, FIN."},{"n":"n39","q":"Quel champ TCP sert au contrôle de flux ?","o":["Pointeur urgent","Fenêtre","Somme de contrôle","Port source"],"a":1,"e":"La fenêtre dit combien d&#39;octets le récepteur accepte avant d&#39;acquitter."},{"n":"n39","q":"Taille d&#39;un champ de port (TCP ou UDP) ?","o":["8 bits","16 bits","32 bits","4 bits"],"a":1,"e":"16 bits, d&#39;où des ports de 0 à 65 535."},{"n":"n39","q":"Le drapeau qui coupe brutalement une connexion TCP est…","o":["FIN","RST","PSH","URG"],"a":1,"e":"RST réinitialise. FIN ferme proprement, en 4 temps."},{"n":"n40","q":"Taille de l&#39;en-tête UDP ?","o":["8 octets","20 octets","4 octets","12 octets"],"a":0,"e":"4 champs de 16 bits = 8 octets."},{"n":"n40","q":"Lequel de ces champs existe dans UDP ?","o":["Numéro de séquence","Fenêtre","Longueur","Drapeaux"],"a":2,"e":"UDP : port source, port destination, longueur, somme de contrôle."},{"n":"n39","q":"L&#39;octet des drapeaux d&#39;un segment TCP vaut 0x12. Quels drapeaux sont levés ?","o":["SYN seul","SYN et ACK","ACK seul","FIN et ACK"],"a":1,"e":"0x12 = 0x10 (ACK) + 0x02 (SYN) : c&#39;est la réponse du serveur dans la poignée de main."}]},{"id":"td","t":"TD corrigés (séries 1 et 2)","seance":"Travaux dirigés et pratiques","imp":4,"html":"<h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Papier d&#39;abord, corrigé ensuite.<\/strong> Fais l&#39;exercice en entier, écris les conventions du prof en haut de ta feuille (tailles en binaire, débits en décimal), puis seulement compare.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Lire un corrigé en se disant « j&#39;aurais trouvé ». Tant que tu ne l&#39;as pas écrit, tu ne le sais pas.<\/p>\n<\/aside><h2>Les exercices<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Cherche d&#39;abord seul, ouvre l&#39;indice si tu bloques, puis compare avec le corrigé et note-toi honnêtement : ta réponse compte dans la maîtrise de la notion.<\/p>\n<\/aside><section class=\"exo\"><h3>Exercice 1 · Temps de transfert<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p><strong>1.1.<\/strong> L&#39;hôte A envoie un fichier volumineux à l&#39;hôte B. Le chemin de A à B a un lien de 500 kbps. Le fichier fait 4 millions d&#39;octets. En divisant la taille par le débit, combien de temps faut-il pour le transfert ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Taille en bits (× 8). « 4 millions d&#39;octets » est en décimal. 500 kbps = 500 000 bit/s.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Taille = 4 000 000 × 8 = 32 000 000 bits<br>Débit = 500 × 1000 = 500 000 bits/s<br>T = 32 000 000 / 500 000 = <b>64 s<\/b><br><br>Remarque : la taille est donnée en millions d&#39;octets (décimal), donc pas de 1024 ici, contrairement à « 1 Go » dans le cours.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p><strong>1.2.<\/strong> Combien de temps théorique faut-il pour télécharger un fichier de 2 Go avec une connexion dont la bande passante est de 5 Mbit/s ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Convention du prof : 1 Go = 1024³ × 8 bits ; 5 Mbit/s = 5 × 10⁶.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Taille = 2 × 1024 × 1024 × 1024 × 8 = 17 179 869 184 bits<br>BP = 5 × 1 000 000 = 5 000 000 bits/s<br>T = 17 179 869 184 / 5 000 000 ≈ 3 436 s = <b>57 min 16 s<\/b><br><br>(Vérifié par calcul : 3 435,97 s.)<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Exercice 2 · Questions de cours<\/h3><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p><strong>2.1.<\/strong> Quelle partie d&#39;un réseau fournit des applications et des données aux ordinateurs hôtes ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Le <b>serveur<\/b> (hôte qui fournit des données ou des services : Web, DNS, DHCP…).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p><strong>2.2.<\/strong> À quoi sert une carte réseau ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Elle est l&#39;<b>interface<\/b> entre l&#39;ordinateur et le support de transmission : elle permet à l&#39;hôte d&#39;envoyer et de recevoir des données sur le réseau (conversion données ↔ signaux). Elle porte l&#39;<b>adresse MAC<\/b>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p><strong>2.3.<\/strong> Que connectent les routeurs ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Des <b>réseaux (segments) différents entre eux<\/b> ; ils choisissent le chemin des paquets (couche 3). Les switchs et les hubs, eux, connectent les hôtes d&#39;un même segment.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p><strong>2.4.<\/strong> À quoi sert un répéteur ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>À <b>régénérer / amplifier le signal<\/b> affaibli pour augmenter la distance de transmission. Couche 1 (physique).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><p><strong>2.5.<\/strong> Numéro permettant d&#39;identifier de manière unique un ordinateur sur un réseau local ou sur Internet (ce numéro est modifiable) :<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>L&#39;<b>adresse IP<\/b>. Elle est logique et configurable. L&#39;adresse MAC identifie la carte, mais elle est en principe fixe : le mot « modifiable » oriente vers l&#39;IP.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"7\"><div class=\"ex-q\"><p><strong>2.6.<\/strong> Quel est le protocole réseau utilisé par Internet ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><b>TCP/IP<\/b> (la pile de protocoles TCP/IP ; au niveau réseau, IP).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"8\"><div class=\"ex-q\"><p><strong>2.7.<\/strong> Lequel des services suivants permet de traduire une adresse Web en adresse IP ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Le <b>DNS<\/b> (Domain Name System), port 53.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"9\"><div class=\"ex-q\"><p><strong>2.8.<\/strong> Lesquels de ces protocoles interviennent au niveau de la couche application du modèle OSI ? (deux réponses) IP, TCP, UDP, http, DNS, Ethernet<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><b>http et DNS<\/b>.<br>TCP et UDP → transport ; IP → réseau ; Ethernet → liaison/physique.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"10\"><div class=\"ex-q\"><p><strong>2.9.<\/strong> Lors du transfert des données, quelles sont les deux principales responsabilités de l&#39;hôte récepteur ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><b>L&#39;accusé de réception<\/b> (confirmer la bonne réception) et <b>le réassemblage<\/b> des segments dans l&#39;ordre pour reconstituer les données.<br>(C&#39;est la réponse attendue dans le cursus Cisco ; certitude élevée.)<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"11\"><div class=\"ex-q\"><p><strong>2.10.<\/strong> Vous vous connectez à un système UNIX distant à partir de votre PC grâce au protocole TELNET. À quelle couche ce protocole appartient-il ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>À la couche <b>Application<\/b> (couche 7 OSI ; couche 4 TCP/IP). Il utilise TCP, port 23.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Exercice 3 · Tableau OSI / TCP-IP<\/h3><div class=\"ex\" data-x=\"12\"><div class=\"ex-q\"><p><strong>3.<\/strong> Remplir le tableau : N° OSI, nom de couche OSI, N° TCP/IP, nom de couche TCP/IP, unités d&#39;encapsulation, protocoles TCP/IP.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>7 couches OSI contre 4 couches TCP/IP. Chez le prof, la numérotation TCP/IP part du bas (1 = Accès réseau).<\/p>\n<\/div><div class=\"ex-c\" hidden><p>7 Application · 6 Présentation · 5 Session → <b>4 Application<\/b> · PDU : <b>Données<\/b> · HTTP, DNS, FTP, SMTP, POP3, Telnet, DHCP<br>4 Transport → <b>3 Transport<\/b> · <b>Segment<\/b> · TCP, UDP<br>3 Réseau → <b>2 Internet<\/b> · <b>Paquet<\/b> · IP, ICMP, IGMP, IPsec<br>2 Liaison de données → <b>1 Accès réseau<\/b> · <b>Trame<\/b> · Ethernet, Wi-Fi, PPP, ARP<br>1 Physique → <b>1 Accès réseau<\/b> · <b>Bits<\/b> · (supports : UTP, STP, fibre)<br><br>Voir le tableau complet dans Cours, section 9.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Exercice 4 · Salle informatique (schéma : 5 PC + imprimante sur un switch 2960)<\/h3><div class=\"ex\" data-x=\"13\"><div class=\"ex-q\"><p><strong>4.1a.<\/strong> Une salle informatique : 5 ordinateurs et une imprimante partagée. Quel type de réseau ? Quelle topologie ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Un <b>LAN<\/b> (réseau local). Topologie physique <b>en étoile<\/b> : tous les équipements sont reliés au switch central (2960-24TT).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"14\"><div class=\"ex-q\"><p><strong>4.1b.<\/strong> Quels sont les équipements matériels utilisés dans ce réseau ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><b>5 PC<\/b> (hôtes), <b>1 imprimante<\/b> réseau, <b>1 commutateur (switch)<\/b> Cisco 2960, les <b>cartes réseau<\/b> de chaque équipement et les <b>câbles<\/b> avec connecteurs RJ45.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"15\"><div class=\"ex-q\"><p><strong>4.1c.<\/strong> Quel type de câble est utilisé ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Du câble en <b>paires torsadées (UTP)<\/b> avec connecteurs <b>RJ45<\/b>, en <b>câble droit<\/b>, car on relie des équipements différents (PC ↔ switch). Longueur max 100 m.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"16\"><div class=\"ex-q\"><p><strong>4.1d.<\/strong> L&#39;utilisateur du poste 1 peut-il utiliser l&#39;imprimante ? Justifier.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><b>Oui.<\/b> L&#39;imprimante est connectée au switch, donc elle est dans le même LAN (même segment) que le PC1. Le switch transmet les données entre les deux sans routeur. (Il faut bien sûr que l&#39;imprimante soit partagée et que les adresses IP soient dans le même réseau.)<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"17\"><div class=\"ex-q\"><p><strong>4.2a.<\/strong> Dans chaque établissement scolaire, les équipements de la salle sont en réseau. Quel type de réseau dans chaque salle ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Un <b>LAN<\/b>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"18\"><div class=\"ex-q\"><p><strong>4.2b.<\/strong> Peut-on relier les réseaux des salles des établissements d&#39;une ville ? Si oui, comment s&#39;appelle ce réseau ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><b>Oui<\/b> : c&#39;est un <b>MAN<\/b> (réseau métropolitain), qui interconnecte des LAN proches, à l&#39;échelle d&#39;une ville.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"19\"><div class=\"ex-q\"><p><strong>4.2c.<\/strong> Peut-on faire la même chose au niveau de tout le pays ? Si oui, comment s&#39;appelle ce réseau ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><b>Oui<\/b> : c&#39;est un <b>WAN<\/b> (réseau étendu).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"20\"><div class=\"ex-q\"><p><strong>4.2d.<\/strong> Quels supports de transmission peut-on utiliser dans ces deux derniers cas ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>MAN : surtout la <b>fibre optique<\/b> (haut débit), éventuellement des <b>liaisons sans fil<\/b> (faisceaux hertziens, WiMAX).<br>WAN : <b>fibre optique<\/b>, <b>câbles cuivre<\/b> / lignes louées des opérateurs, <b>faisceaux hertziens<\/b>, <b>satellite<\/b>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Exercice 5 · Segmentation et MTU<\/h3><div class=\"ex\" data-x=\"21\"><div class=\"ex-q\"><p><strong>5.<\/strong> Un utilisateur transfère 6400 octets de données vers une machine du même réseau local, de MTU 1800 octets ; les en-têtes font 20 octets. 1) Taille des données utilisateur ? 2) Nombre de segments ? 3) Taille de chaque segment ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Chaque segment transporte au plus MTU − en-têtes octets de données. Arrondis le nombre de segments au-dessus.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>1)<\/b> Données utilisateur = <b>6400 octets<\/b>.<br><br><b>Lecture A (20 octets d&#39;en-têtes au total, la plus probable vu l&#39;énoncé)<\/b><br>Données max par segment = 1800 − 20 = 1780 o<br><b>2)<\/b> 6400 / 1780 = 3,6 → <b>4 segments<\/b><br><b>3)<\/b> 3 segments de 1800 o (1780 données + 20) et 1 dernier de <b>1080 o<\/b> (1060 données + 20)<br>Vérification : 3 × 1780 + 1060 = 6400 ✓<br><br><b>Lecture B (20 o IP + 20 o TCP = 40 o, comme MSS = MTU − 40 dans le Ch. 2)<\/b><br>1800 − 40 = 1760 o → toujours 4 segments : 3 × 1800 o et 1 de 1160 o (1120 données + 40).<br><br>⚠ L&#39;énoncé est ambigu. Demande au prof en TD quelle lecture il attend, puis utilise /insiste pour que je l&#39;enregistre.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Exercice 6 · Internet, Web et messagerie<\/h3><div class=\"ex\" data-x=\"22\"><div class=\"ex-q\"><p><strong>6.1.<\/strong> Donner la définition et le rôle de WWW, HTML et HTTP.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><b>WWW<\/b> (World Wide Web) : service d&#39;Internet, un ensemble de pages et de ressources reliées par des liens hypertextes, consultées avec un navigateur.<br><b>HTML<\/b> (HyperText Markup Language) : langage de balisage qui décrit la structure et le contenu des pages Web ; le navigateur l&#39;interprète pour afficher la page.<br><b>HTTP<\/b> (HyperText Transfer Protocol) : protocole de la couche application, de type requête/réponse (GET, POST, PUT), qui transfère les pages du serveur Web vers le client. Il s&#39;appuie sur TCP (port 80 ; HTTPS = 443, chiffré par TLS).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"23\"><div class=\"ex-q\"><p><strong>6.2.<\/strong> URL <a href=\"http://www.microsoft.com/products/pc.htm\">http://www.microsoft.com/products/pc.htm<\/a> : a) définition et rôle d&#39;une URL ; b) décomposer l&#39;URL en donnant le rôle de chaque partie.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><b>a)<\/b> URL (Uniform Resource Locator) : adresse unique d&#39;une ressource sur le Web. Elle indique au navigateur quel protocole utiliser, quel serveur contacter et quelle ressource demander.<br><b>b)<\/b><br>• <b>http<\/b> : protocole utilisé<br>• <b><a href=\"http://www.microsoft.com\">www.microsoft.com<\/a><\/b> : nom du serveur (domaine), traduit en IP par le DNS ; « www » = serveur Web, « microsoft » = domaine, « .com » = domaine de premier niveau<br>• <b>/products/<\/b> : chemin (répertoire) sur le serveur<br>• <b>pc.htm<\/b> : fichier demandé (page HTML)<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"24\"><div class=\"ex-q\"><p><strong>6.3.<\/strong> Par quel moyen fait-on la correspondance entre l&#39;adresse IP d&#39;un serveur et son nom sur Internet ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Par le <b>DNS<\/b> (Domain Name System) : une base de données distribuée et hiérarchique qui associe les noms de domaine aux adresses IP (port 53).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"25\"><div class=\"ex-q\"><p><strong>6.4.<\/strong> Définition et rôle de SMTP.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><b>SMTP<\/b> (Simple Mail Transfer Protocol) : protocole application qui assure l&#39;<b>envoi<\/b> du courrier, du client expéditeur vers son serveur de messagerie, puis entre serveurs de messagerie (MTA). Port TCP 25.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"26\"><div class=\"ex-q\"><p><strong>6.5.<\/strong> Définition et rôle de POP.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><b>POP3<\/b> (Post Office Protocol v3) : protocole application qui permet au client de <b>récupérer<\/b> (télécharger) son courrier depuis le serveur de messagerie. Port TCP 110. (IMAP fait la même chose en laissant les messages sur le serveur.)<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"27\"><div class=\"ex-q\"><p><strong>6.6.<\/strong> Syntaxe générale d&#39;une adresse e-mail.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><b>nom_utilisateur@nom_de_domaine<\/b>, par exemple <a href=\"mailto:etudiant@fpbm.ma\">etudiant@fpbm.ma<\/a>. La partie avant le @ désigne la boîte aux lettres ; la partie après le @ désigne le domaine du serveur de messagerie.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"28\"><div class=\"ex-q\"><p><strong>6.7.<\/strong> Citer 4 possibilités d&#39;accès à un fournisseur d&#39;accès Internet.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Au choix : <b>ADSL<\/b> (ligne téléphonique) ; <b>fibre optique<\/b> ; <b>réseau mobile 3G/4G/5G<\/b> ; <b>RNIS<\/b> (cité dans l&#39;énoncé) ; modem RTC (bas débit) ; <b>satellite<\/b> ; câble ; liaison louée / spécialisée ; WiMAX.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"29\"><div class=\"ex-q\"><p><strong>6.8.<\/strong> Compléter le schéma entre le client et le serveur de courrier : « Réception du courrier par … » / « Envoi du courrier par … ».<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><b>Envoi<\/b> du courrier par <b>SMTP<\/b> (client → serveur).<br><b>Réception<\/b> du courrier par <b>POP3<\/b> (ou IMAP) (serveur → client).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Exercice 7 · Couches, encapsulation et ports<\/h3><div class=\"ex\" data-x=\"30\"><div class=\"ex-q\"><p><strong>7.1.<\/strong> Un utilisateur accède à un site Web en tapant une URL. Quelles couches OSI sont impliquées et quelles sont leurs fonctions dans ce scénario ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><b>Toutes les 7 couches<\/b> côté client et côté serveur :<br>7 Application : HTTP (requête GET), DNS (résolution du nom)<br>6 Présentation : codage des données (HTML, images), chiffrement TLS si HTTPS<br>5 Session : ouverture, maintien et fermeture du dialogue avec le serveur<br>4 Transport : TCP, port 80/443, connexion en 3 temps, segmentation, fiabilité<br>3 Réseau : IP source et destination, routage à travers Internet<br>2 Liaison : trames Ethernet/Wi-Fi, adresses MAC, contrôle d&#39;erreurs (FCS)<br>1 Physique : transmission des bits sur le câble ou les ondes.<br>Les routeurs intermédiaires n&#39;utilisent que les couches 1 à 3.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"31\"><div class=\"ex-q\"><p><strong>7.2.<\/strong> Lors d&#39;une capture réseau, vous observez : TCP SYN, HTTP GET, IP packet, TCP ACK, Ethernet frame. Classez-les dans l&#39;ordre de l&#39;encapsulation complète.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Deux idées : la chronologie (la connexion TCP s&#39;établit avant la requête) et l&#39;imbrication des couches.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>Chronologie de l&#39;échange : <b>TCP SYN → (SYN-ACK du serveur) → TCP ACK → HTTP GET<\/b>. La connexion TCP en 3 temps précède la requête HTTP.<br>Encapsulation de la requête, de haut en bas : <b>HTTP GET (données) → segment TCP → IP packet → Ethernet frame<\/b>.<br>Donc : TCP SYN, TCP ACK, HTTP GET, IP packet, Ethernet frame.<br>(L&#39;énoncé mélange chronologie et couches ; certitude moyenne sur l&#39;ordre exact attendu. Si le prof ne veut que l&#39;encapsulation : HTTP GET → TCP → IP → Ethernet.)<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"32\"><div class=\"ex-q\"><p><strong>7.3.<\/strong> Pour chaque port, donner le service et le protocole de transport : 20/21, 22, 25, 53, 80, 443, 110.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>20/21 → <b>FTP<\/b> (20 données, 21 contrôle) · TCP<br>22 → <b>SSH<\/b> · TCP<br>25 → <b>SMTP<\/b> · TCP<br>53 → <b>DNS<\/b> · UDP (et TCP)<br>80 → <b>HTTP<\/b> · TCP<br>443 → <b>HTTPS<\/b> · TCP<br>110 → <b>POP3<\/b> · TCP<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"33\"><div class=\"ex-q\"><p><strong>7.4.<\/strong> Un utilisateur ouvre sa boîte mail via un navigateur (ex. Gmail). Expliquez les protocoles utilisés à la couche Application.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>• <b>DNS<\/b> : traduit mail.google.com en adresse IP.<br>• <b>HTTPS<\/b> (HTTP + TLS) : entre le navigateur et le serveur Gmail, pour afficher la boîte, lire et envoyer les messages (webmail).<br>• Côté serveurs : <b>SMTP<\/b> pour acheminer les messages envoyés vers les autres serveurs de messagerie. POP3/IMAP ne servent que si on utilise un client lourd (Outlook) ; avec un webmail, le navigateur passe par HTTPS.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"34\"><div class=\"ex-q\"><p><strong>7.5.<\/strong> Un utilisateur entre <a href=\"https://www.fpbm.ma\">https://www.fpbm.ma<\/a> dans son navigateur. Expliquez le rôle de la couche Application dans ce processus.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><ol>\n<li>Le navigateur (client) interprète l&#39;URL : protocole <b>HTTPS<\/b>, serveur <b><a href=\"http://www.fpbm.ma\">www.fpbm.ma<\/a><\/b>, fichier par défaut (index).<br>2. <b>DNS<\/b> : résolution de <a href=\"http://www.fpbm.ma\">www.fpbm.ma<\/a> en adresse IP.<br>3. <b>HTTPS<\/b> : la requête GET part, chiffrée par SSL/TLS, vers le port 443 du serveur Web.<br>4. Le serveur répond (200 OK + code HTML) ; le navigateur interprète le HTML et affiche la page.<br>La couche Application sert d&#39;interface entre l&#39;utilisateur et le réseau : elle fournit les services (DNS, HTTP) et définit le format des échanges.<\/li>\n<\/ol>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Exercice 1 · Communication, messagerie, modes de connexion<\/h3><div class=\"ex\" data-x=\"35\"><div class=\"ex-q\"><p><strong>T2.1.1.<\/strong> Organisez ces termes par ordre chronologique : segmentation / multiplexage / étiquetage / émission / réception / encodage / décodage / assemblage.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Sépare d&#39;abord ce que fait l&#39;émetteur de ce que fait le récepteur.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>1 Segmentation → 2 Multiplexage → 3 Étiquetage → 4 Encodage → 5 Émission → 6 Réception → 7 Décodage → 8 Assemblage<\/b><br>Émetteur : on découpe le message, on entremêle les conversations sur le même canal, on ajoute les étiquettes de remise, on encode les bits en signaux puis on les envoie. Récepteur : il reçoit, décode les signaux en bits et réassemble les segments dans l&#39;ordre grâce aux étiquettes.<br>⚠ La correction manuscrite du TD place le multiplexage après l&#39;émission (segmentation, étiquetage, encodage, émission, multiplexage, réception, décodage, assemblage). Je n&#39;ai pas le corrigé officiel : l&#39;ordre ci-dessus est l&#39;ordre logique du cours (certitude moyenne à élevée). Demande au prof l&#39;ordre qu&#39;il note.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"36\"><div class=\"ex-q\"><p><strong>T2.1.2.<\/strong> Expliquez par un schéma comment on envoie un message de la boîte <a href=\"mailto:zzz@yahoo.fr\">zzz@yahoo.fr<\/a> vers la boîte <a href=\"mailto:yyy@gmail.com\">yyy@gmail.com<\/a>. À chaque étape, donnez les agents et les protocoles en jeu.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Quatre agents : MUA, MTA, MTA, MDA. Pense à SMTP pour pousser et à POP3 ou IMAP pour récupérer.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b><a href=\"mailto:zzz@yahoo.fr\">zzz@yahoo.fr<\/a> (MUA)<\/b> ──SMTP──▶ <b>MTA yahoo.fr<\/b> ──SMTP──▶ <b>MTA gmail.com<\/b> ──▶ <b>MDA<\/b> (dépôt dans la boîte) ──POP3 ou IMAP──▶ <b>MUA de <a href=\"mailto:yyy@gmail.com\">yyy@gmail.com<\/a><\/b><br>1) Envoi : le MUA (client de messagerie) remet le message à son serveur par <b>SMTP<\/b> (TCP 25).<br>2) Transfert : le MTA de yahoo.fr cherche le serveur de gmail.com dans le <b>DNS<\/b> (enregistrement MX) et lui transmet le message par <b>SMTP<\/b>.<br>3) Remise : le <b>MDA<\/b> de gmail.com dépose le message dans la boîte de yyy.<br>4) Lecture : yyy le récupère avec son MUA par <b>POP3<\/b> (110) ou <b>IMAP<\/b> (143), ou par HTTP en webmail.<br>À noter : le schéma manuscrit du corrigé a inversé les adresses (il fait partir <a href=\"mailto:333@gmail.com\">333@gmail.com<\/a> vers <a href=\"mailto:yyy@yahoo.fr\">yyy@yahoo.fr<\/a>), mais les agents et les protocoles sont les mêmes ; suis le sens de l&#39;énoncé.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"37\"><div class=\"ex-q\"><p><strong>T2.1.3.<\/strong> Indiquez les différences majeures entre POP3 et IMAP (flux, stockage côté serveur, gestion des dossiers, accès multiple).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Un tableau à 4 lignes : une pour chaque critère de l&#39;énoncé.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Flux<\/b> : POP3 télécharge les messages vers la machine locale (souvent en les supprimant du serveur) ; IMAP consulte les messages directement sur le serveur et ne synchronise que les actions (lecture, suppression).<br><b>Stockage serveur<\/b> : POP3 minimal ; IMAP conserve tout sur le serveur, accessible depuis plusieurs appareils.<br><b>Dossiers<\/b> : POP3 gère une seule boîte de réception ; IMAP gère plusieurs dossiers (brouillons, envoyés, archives, spam).<br><b>Accès multiple<\/b> : POP3 convient à un seul appareil, sans synchronisation d&#39;état ; IMAP synchronise lecture, suppression et déplacements sur tous les clients.<br>En résumé : POP3 = usage simple et local ; IMAP = usage connecté et multi-appareils (ports 110 et 143).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"38\"><div class=\"ex-q\"><p><strong>T2.1.4.<\/strong> Expliquez par deux schémas comment on peut se connecter à un autre périphérique du réseau.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Qui joue le rôle de serveur dans chaque cas ?<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>1) Mode client-serveur<\/b><br>   Client 1 ─┐<br>   Client 2 ─┼── Serveur   (chaque client exécute une application cliente et envoie ses requêtes au serveur dédié)<br>   Client 3 ─┘<br><b>2) Mode pair à pair (P2P)<\/b><br>   Pair A ──── switch ──── Pair B   (chaque machine est à la fois client et serveur, sans serveur central)<br>Client-serveur : administration et sécurité centralisées, mais le serveur est un point unique de panne. P2P : simple et sans serveur dédié, mais peu sécurisé et difficile à administrer à grande échelle.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><section class=\"exo\"><h3>Exercice 2 · Décoder une trame Ethernet et un segment TCP<\/h3><div class=\"ex\" data-x=\"39\"><div class=\"ex-q\"><p><strong>T2.2.1.<\/strong> Trame Ethernet : aa aa aa aa aa aa aa ab 00 40 07 03 04 2b 02 60 8c e8 02 91 08 00 45 00 00 2c 14 ee 00 00 3c 06 85 7a 93 d2 5e 63 93 d2 5e 5c 10 a4 09 e7 42 0c 56 01 00 00 00 00 60 02 40 00 c1 29 00 00 02 04 05 b4 02 80 9a b2 5c 48. a) Que représentent les 8 octets de début ? b) Donnez les adresses MAC du destinataire et de l&#39;émetteur. c) Quel protocole est encapsulé ? d) Que représentent les 4 octets de la fin ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"e
