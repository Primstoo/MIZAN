lass=\"opt\" data-o=\"3\">Le trafic passe par le bus</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Le FDDI est…</div><button class=\"opt\" data-o=\"0\">Un anneau simple</button><button class=\"opt\" data-o=\"1\">Un double anneau qui assure la tolérance aux pannes</button><button class=\"opt\" data-o=\"2\">Une étoile étendue</button><button class=\"opt\" data-o=\"3\">Un protocole WAN</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Selon le cours, la topologie la plus couramment utilisée est…</div><button class=\"opt\" data-o=\"0\">Bus</button><button class=\"opt\" data-o=\"1\">Anneau</button><button class=\"opt\" data-o=\"2\">Étoile étendue</button><button class=\"opt\" data-o=\"3\">Maillée</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Les 3 couches du modèle hiérarchique de Cisco sont…</div><button class=\"opt\" data-o=\"0\">Physique, liaison, réseau</button><button class=\"opt\" data-o=\"1\">Cœur, distribution, accès</button><button class=\"opt\" data-o=\"2\">Client, serveur, routeur</button><button class=\"opt\" data-o=\"3\">Accès, transport, application</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Dans un anneau Token Ring, les données circulent…</div><button class=\"opt\" data-o=\"0\">Dans les deux sens simultanément</button><button class=\"opt\" data-o=\"1\">Dans un sens unique, grâce à un jeton</button><button class=\"opt\" data-o=\"2\">Par diffusion à tous les hôtes</button><button class=\"opt\" data-o=\"3\">Via un hub central</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Combien de liaisons pour un maillage complet de 8 terminaux ?</div><button class=\"opt\" data-o=\"0\">56</button><button class=\"opt\" data-o=\"1\">28</button><button class=\"opt\" data-o=\"2\">64</button><button class=\"opt\" data-o=\"3\">16</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Un maillage complet compte 66 liaisons. Combien de terminaux ?</div><button class=\"opt\" data-o=\"0\">11</button><button class=\"opt\" data-o=\"1\">12</button><button class=\"opt\" data-o=\"2\">33</button><button class=\"opt\" data-o=\"3\">13</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">La topologie maillée est surtout utilisée…</div><button class=\"opt\" data-o=\"0\">Dans les petits bureaux pour réduire les coûts</button><button class=\"opt\" data-o=\"1\">Là où aucune rupture de communication n&#39;est tolérée</button><button class=\"opt\" data-o=\"2\">Pour les réseaux personnels</button><button class=\"opt\" data-o=\"3\">Uniquement en Wi-Fi</button><div class=\"qq-e\" hidden></div></div></section>","ex":[],"qcm":[{"n":"n14","q":"Le schéma d&#39;adressage IP apparaît sur la topologie…","o":["Physique","Logique","En bus","Hiérarchique"],"a":1,"e":"Topologie logique : périphériques, ports et adressage IP. Topologie physique : emplacements et câbles."},{"n":"n15","q":"Dans une topologie en bus, si le câble commun se rompt…","o":["Seule la machine voisine est touchée","Tout le réseau tombe en panne","Le jeton est régénéré","Le second anneau prend le relais"],"a":1,"e":"C&#39;est la faiblesse principale du bus."},{"n":"n15","q":"Dans une topologie en étoile, si le nœud central tombe…","o":["Rien ne se passe","Seul un hôte est isolé","Tout le réseau devient inutilisable","Le trafic passe par le bus"],"a":2,"e":"Inconvénient principal de l&#39;étoile. En revanche, un nœud périphérique en panne n&#39;affecte pas le reste."},{"n":"n15","q":"Le FDDI est…","o":["Un anneau simple","Un double anneau qui assure la tolérance aux pannes","Une étoile étendue","Un protocole WAN"],"a":1,"e":"FDDI : paire d&#39;anneaux ; le second permet la tolérance de panne du premier."},{"n":"n15","q":"Selon le cours, la topologie la plus couramment utilisée est…","o":["Bus","Anneau","Étoile étendue","Maillée"],"a":2,"e":"Diapo 41 : l&#39;étoile étendue est la plus couramment utilisée."},{"n":"n15","q":"Les 3 couches du modèle hiérarchique de Cisco sont…","o":["Physique, liaison, réseau","Cœur, distribution, accès","Client, serveur, routeur","Accès, transport, application"],"a":1,"e":"Cœur, distribution, accès."},{"n":"n15","q":"Dans un anneau Token Ring, les données circulent…","o":["Dans les deux sens simultanément","Dans un sens unique, grâce à un jeton","Par diffusion à tous les hôtes","Via un hub central"],"a":1,"e":"Chaque hôte passe les données à son voisin dans un sens unique ; un jeton circule."},{"n":"n16","q":"Combien de liaisons pour un maillage complet de 8 terminaux ?","o":["56","28","64","16"],"a":1,"e":"8 × 7 / 2 = 28. Le piège : 56 = N(N−1), sans diviser par 2."},{"n":"n16","q":"Un maillage complet compte 66 liaisons. Combien de terminaux ?","o":["11","12","33","13"],"a":1,"e":"N(N−1)/2 = 66 donne N(N−1) = 132 = 12 × 11, donc N = 12."},{"n":"n16","q":"La topologie maillée est surtout utilisée…","o":["Dans les petits bureaux pour réduire les coûts","Là où aucune rupture de communication n&#39;est tolérée","Pour les réseaux personnels","Uniquement en Wi-Fi"],"a":1,"e":"Exemples du cours : centrales nucléaires, routeurs qui assurent la connexion Internet."}]},{"id":"s6","t":"Architecture et transfert","seance":"Chapitre 1","imp":5,"html":"<p><b>Les 4 caractéristiques d'une architecture réseau :</b> tolérance aux pannes, évolutivité, qualité de service (QoS), sécurité.</p>\n  <div class=\"table-wrap\"><table><thead><tr><th>Commutation de circuits</th><th>Commutation de paquets</th></tr></thead><tbody>\n  <tr><td>Circuit dédié</td><td>Circuit partagé</td></tr>\n  <tr><td>Service garanti (bande passante), QoS</td><td>Messages divisés en paquets</td></tr>\n  <tr><td>Utilisation inefficace du support</td><td>Utilisation efficace du support</td></tr>\n  <tr><td>Chemin unique, pas de redondance</td><td>Redondance, plusieurs chemins possibles</td></tr></tbody></table></div><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 3 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Laquelle n&#39;est PAS une des 4 caractéristiques d&#39;une architecture réseau ?</div><button class=\"opt\" data-o=\"0\">Tolérance aux pannes</button><button class=\"opt\" data-o=\"1\">Évolutivité</button><button class=\"opt\" data-o=\"2\">QoS</button><button class=\"opt\" data-o=\"3\">Topologie en bus</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">La commutation de circuits…</div><button class=\"opt\" data-o=\"0\">Partage le circuit entre plusieurs utilisateurs</button><button class=\"opt\" data-o=\"1\">Garantit la bande passante grâce à un circuit dédié</button><button class=\"opt\" data-o=\"2\">Utilise efficacement le support</button><button class=\"opt\" data-o=\"3\">Offre plusieurs chemins</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">La commutation de paquets…</div><button class=\"opt\" data-o=\"0\">Utilise un chemin unique sans redondance</button><button class=\"opt\" data-o=\"1\">Divise les messages en paquets et utilise efficacement le support</button><button class=\"opt\" data-o=\"2\">Réserve un circuit dédié</button><button class=\"opt\" data-o=\"3\">Garantit toujours la QoS</button><div class=\"qq-e\" hidden></div></div></section>","ex":[],"qcm":[{"n":"n17","q":"Laquelle n&#39;est PAS une des 4 caractéristiques d&#39;une architecture réseau ?","o":["Tolérance aux pannes","Évolutivité","QoS","Topologie en bus"],"a":3,"e":"Les 4 : tolérance aux pannes, évolutivité, QoS, sécurité."},{"n":"n18","q":"La commutation de circuits…","o":["Partage le circuit entre plusieurs utilisateurs","Garantit la bande passante grâce à un circuit dédié","Utilise efficacement le support","Offre plusieurs chemins"],"a":1,"e":"Circuits : circuit dédié, service garanti (QoS), support mal utilisé, chemin unique."},{"n":"n18","q":"La commutation de paquets…","o":["Utilise un chemin unique sans redondance","Divise les messages en paquets et utilise efficacement le support","Réserve un circuit dédié","Garantit toujours la QoS"],"a":1,"e":"Paquets : circuit partagé, messages en paquets, utilisation efficace, plusieurs chemins possibles."}]},{"id":"s7","t":"Le réseau Internet","seance":"Chapitre 1","imp":2,"html":"<p>Réseau mondial des réseaux qui interconnecte des réseaux internationaux, régionaux et locaux, tous basés sur la pile <b>TCP/IP</b>. C'est un enchevêtrement de réseaux, de protocoles (TCP, IP, HTTP, FTP, SMTP), d'applications et de services.</p>\n  <p><b>4 types d'applications et de services :</b> messagerie (individuelle, collective, forums) ; traitement informatique (connexion à distance comme le VPN, transfert de fichiers FTP) ; publication et information (Web) ; communication directe (chat, visio, peer-to-peer). Ces applications, longtemps distinctes, sont aujourd'hui fusionnées sur le Web.</p><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 2 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Internet repose sur la pile de protocoles…</div><button class=\"opt\" data-o=\"0\">OSI uniquement</button><button class=\"opt\" data-o=\"1\">TCP/IP</button><button class=\"opt\" data-o=\"2\">IPX/SPX</button><button class=\"opt\" data-o=\"3\">Token Ring</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Un VPN entre dans la catégorie des services…</div><button class=\"opt\" data-o=\"0\">De messagerie</button><button class=\"opt\" data-o=\"1\">De traitement informatique (connexion à distance)</button><button class=\"opt\" data-o=\"2\">De publication (Web)</button><button class=\"opt\" data-o=\"3\">De communication directe</button><div class=\"qq-e\" hidden></div></div></section>","ex":[],"qcm":[{"n":"n19","q":"Internet repose sur la pile de protocoles…","o":["OSI uniquement","TCP/IP","IPX/SPX","Token Ring"],"a":1,"e":"Réseau des réseaux, tous basés sur TCP/IP."},{"n":"n19","q":"Un VPN entre dans la catégorie des services…","o":["De messagerie","De traitement informatique (connexion à distance)","De publication (Web)","De communication directe"],"a":1,"e":"Traitement informatique : connexion à distance (VPN), transfert de fichiers (FTP)."}]},{"id":"s8","t":"Bande passante, débit, temps","seance":"Chapitre 1","imp":5,"html":"<div class=\"def\"><b>Bande passante (débit nominal)</b>Capacité du réseau : la quantité de données qui peut circuler par unité de temps, en bits par seconde. Elle est limitée, elle a un coût, c'est une mesure clé de la conception et des performances, et la demande augmente sans cesse.</div>\n  <div class=\"table-wrap\"><table><thead><tr><th>Unité</th><th>Équivalence (décimal)</th></tr></thead><tbody>\n  <tr><td>kbit/s</td><td class=\"num\">1 000 bit/s = 10³</td></tr><tr><td>Mbit/s</td><td class=\"num\">1 000 000 bit/s = 10⁶</td></tr><tr><td>Gbit/s</td><td class=\"num\">1 000 000 000 bit/s = 10⁹</td></tr></tbody></table></div>\n  <p><b>Débit :</b> la bande passante réelle, mesurée à un instant précis, souvent inférieure à la bande passante. Il dépend de la machine du client, du serveur, des autres utilisateurs, de la topologie, du nombre d'utilisateurs, des nœuds et de leur charge, du type de données et des pannes.</p>\n  <ul><li><b>Débit physique (effectif) :</b> bits émis par seconde sur le support. Il dépend du médium, du codage et de la fréquence. Ethernet : 10 / 100 / 1000 Mbit/s, 10 Gbit/s.</li>\n  <li><b>Débit applicatif (utile) :</b> bits de données utiles par seconde au niveau des applications, une fois retirées les informations ajoutées par les couches 2, 3, 4.</li></ul>\n  <div class=\"exam\"><b>À retenir</b>Débit physique &gt; débit applicatif, car le physique est le maximum que l'applicatif peut atteindre.</div>\n  <h3>Temps de téléchargement</h3>\n  <div class=\"formula\">T théorique = taille du fichier (bits) / bande passante (bits/s)\nT réel      = taille du fichier (bits) / débit réel au moment du transfert (bits/s)</div>\n  <div class=\"formula\">Exemple du cours : 1 Go à 3 Mbit/s\n  Taille = 1 × 1024 × 1024 × 1024 × 8 = 8 589 934 592 bits\n  BP     = 3 × 1000 × 1000          = 3 000 000 bits/s\n  T      = 8 589 934 592 / 3 000 000 ≈ 2 863 s = 47 min 43 s\n\nExemple du cours : 1 Go avec un débit réel de 512 kbit/s\n  T = 8 589 934 592 / 512 000 ≈ 16 777 s = 4 h 39 min 37 s</div>\n  <div class=\"trap\"><b>Pièges</b>① La TAILLE est en binaire (×1024), les DÉBITS sont en décimal (×1000) : c'est la convention du prof, applique-la à l'examen. ② Octet (o, B) = 8 bits (b) : oublier le ×8 est l'erreur n°1. ③ La diapo 54 écrit « 512 Mbit/s », mais le calcul utilise bien 512 <b>k</b>bit/s : c'est une coquille. ④ Convertis toujours les secondes en h/min/s à la fin. ⑤ Si l'énoncé donne la taille en « millions d'octets » (TD, ex. 1), c'est du décimal : 4 millions d'octets = 4 000 000 o, sans 1024.</div><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 9 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Le débit (réel) est généralement…</div><button class=\"opt\" data-o=\"0\">Supérieur à la bande passante</button><button class=\"opt\" data-o=\"1\">Égal à la bande passante</button><button class=\"opt\" data-o=\"2\">Inférieur à la bande passante</button><button class=\"opt\" data-o=\"3\">Sans lien avec la bande passante</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Pourquoi le débit applicatif est-il inférieur au débit physique ?</div><button class=\"opt\" data-o=\"0\">Parce que les câbles s&#39;usent</button><button class=\"opt\" data-o=\"1\">Parce que les couches 2, 3, 4… ajoutent des informations (en-têtes) aux données</button><button class=\"opt\" data-o=\"2\">Parce que l&#39;application compresse les données</button><button class=\"opt\" data-o=\"3\">Ce n&#39;est pas le cas</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">1 Mbit/s vaut, selon le cours…</div><button class=\"opt\" data-o=\"0\">1 048 576 bit/s</button><button class=\"opt\" data-o=\"1\">1 000 000 bit/s</button><button class=\"opt\" data-o=\"2\">8 000 000 bit/s</button><button class=\"opt\" data-o=\"3\">1 024 000 bit/s</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Lequel n&#39;influence PAS le débit selon le cours ?</div><button class=\"opt\" data-o=\"0\">Le nombre d&#39;utilisateurs</button><button class=\"opt\" data-o=\"1\">La topologie</button><button class=\"opt\" data-o=\"2\">Le type de données transmises</button><button class=\"opt\" data-o=\"3\">La couleur de la carte réseau</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">1 Go en bits (convention du prof) =</div><button class=\"opt\" data-o=\"0\">8 000 000 000</button><button class=\"opt\" data-o=\"1\">8 589 934 592</button><button class=\"opt\" data-o=\"2\">1 073 741 824</button><button class=\"opt\" data-o=\"3\">1 000 000 000</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Temps théorique pour 500 Mo à 8 Mbit/s ?</div><button class=\"opt\" data-o=\"0\">62,5 s</button><button class=\"opt\" data-o=\"1\">524,3 s ≈ 8 min 44 s</button><button class=\"opt\" data-o=\"2\">500 s</button><button class=\"opt\" data-o=\"3\">4 194 s</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Temps réel pour 2 Go à un débit réel de 20 Mbit/s ?</div><button class=\"opt\" data-o=\"0\">≈ 859 s ≈ 14 min 19 s</button><button class=\"opt\" data-o=\"1\">800 s</button><button class=\"opt\" data-o=\"2\">≈ 107 s</button><button class=\"opt\" data-o=\"3\">≈ 1 718 s</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Pour le TEMPS RÉEL, on divise la taille par…</div><button class=\"opt\" data-o=\"0\">La bande passante</button><button class=\"opt\" data-o=\"1\">Le débit réel au moment du transfert</button><button class=\"opt\" data-o=\"2\">Le débit physique Ethernet</button><button class=\"opt\" data-o=\"3\">La taille du segment</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">(TD) Fichier de 4 millions d&#39;octets, lien de 500 kbps. Durée du transfert ?</div><button class=\"opt\" data-o=\"0\">8 s</button><button class=\"opt\" data-o=\"1\">64 s</button><button class=\"opt\" data-o=\"2\">62,5 s</button><button class=\"opt\" data-o=\"3\">512 s</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">(TD) 2 Go avec une bande passante de 5 Mbit/s : temps théorique ?</div><button class=\"opt\" data-o=\"0\">3 200 s</button><button class=\"opt\" data-o=\"1\">≈ 3 436 s ≈ 57 min 16 s</button><button class=\"opt\" data-o=\"2\">≈ 429 s</button><button class=\"opt\" data-o=\"3\">≈ 27 488 s</button><div class=\"qq-e\" hidden></div></div></section>","ex":[],"qcm":[{"n":"n20","q":"Le débit (réel) est généralement…","o":["Supérieur à la bande passante","Égal à la bande passante","Inférieur à la bande passante","Sans lien avec la bande passante"],"a":2,"e":"La bande passante est le maximum du média ; le débit mesuré est généralement plus faible."},{"n":"n20","q":"Pourquoi le débit applicatif est-il inférieur au débit physique ?","o":["Parce que les câbles s&#39;usent","Parce que les couches 2, 3, 4… ajoutent des informations (en-têtes) aux données","Parce que l&#39;application compresse les données","Ce n&#39;est pas le cas"],"a":1,"e":"Le débit physique est le maximum ; les en-têtes des couches et la charge réduisent le débit utile."},{"n":"n20","q":"1 Mbit/s vaut, selon le cours…","o":["1 048 576 bit/s","1 000 000 bit/s","8 000 000 bit/s","1 024 000 bit/s"],"a":1,"e":"Débits en décimal : 1 Mbit/s = 10⁶ bit/s."},{"n":"n20","q":"Lequel n&#39;influence PAS le débit selon le cours ?","o":["Le nombre d&#39;utilisateurs","La topologie","Le type de données transmises","La couleur de la carte réseau"],"a":3,"e":"Le cours cite la machine du client, le serveur, les autres utilisateurs, la topologie, les nœuds et leur charge, le type de données et les pannes."},{"n":"n21","q":"1 Go en bits (convention du prof) =","o":["8 000 000 000","8 589 934 592","1 073 741 824","1 000 000 000"],"a":1,"e":"1 Go = 1024³ octets × 8 = 8 589 934 592 bits. Le piège : 1 073 741 824 correspond aux octets, pas aux bits."},{"n":"n21","q":"Temps théorique pour 500 Mo à 8 Mbit/s ?","o":["62,5 s","524,3 s ≈ 8 min 44 s","500 s","4 194 s"],"a":1,"e":"500 × 1024² × 8 = 4 194 304 000 bits ; ÷ 8 000 000 = 524,3 s."},{"n":"n21","q":"Temps réel pour 2 Go à un débit réel de 20 Mbit/s ?","o":["≈ 859 s ≈ 14 min 19 s","800 s","≈ 107 s","≈ 1 718 s"],"a":0,"e":"2 × 8 589 934 592 = 17 179 869 184 bits ; ÷ 20 000 000 = 859 s, soit 14 min 19 s."},{"n":"n21","q":"Pour le TEMPS RÉEL, on divise la taille par…","o":["La bande passante","Le débit réel au moment du transfert","Le débit physique Ethernet","La taille du segment"],"a":1,"e":"Temps théorique : bande passante. Temps réel : débit réel mesuré."},{"n":"n21","q":"(TD) Fichier de 4 millions d&#39;octets, lien de 500 kbps. Durée du transfert ?","o":["8 s","64 s","62,5 s","512 s"],"a":1,"e":"4 000 000 × 8 = 32 000 000 bits ; ÷ 500 000 = 64 s. Ici la taille est donnée en millions d&#39;octets (décimal), donc pas de 1024."},{"n":"n21","q":"(TD) 2 Go avec une bande passante de 5 Mbit/s : temps théorique ?","o":["3 200 s","≈ 3 436 s ≈ 57 min 16 s","≈ 429 s","≈ 27 488 s"],"a":1,"e":"2 × 8 589 934 592 = 17 179 869 184 bits ; ÷ 5 000 000 ≈ 3 436 s."}]},{"id":"s9","t":"Ch2 · Modèles OSI et TCP/IP","seance":"Chapitre 2","imp":5,"html":"<p>On découpe la communication en couches pour standardiser, faciliter la conception et la maintenance, diagnostiquer par couche et assurer l'interopérabilité. À l'émission, les données descendent de la couche Application à la couche Physique ; à la réception, elles remontent. Chaque couche ne dialogue qu'avec son équivalente sur l'autre système.</p>\n  <div class=\"table-wrap\"><table><thead><tr><th>N° OSI</th><th>Couche OSI</th><th>Rôle (cours)</th><th>N° TCP/IP</th><th>Couche TCP/IP</th><th>PDU</th><th>Protocoles</th></tr></thead><tbody>\n  <tr><td class=\"num\">7</td><td>Application</td><td>Communication avec les logiciels</td><td class=\"num\" rowspan=\"3\">4</td><td rowspan=\"3\">Application</td><td rowspan=\"3\">Données</td><td rowspan=\"3\">HTTP/HTTPS, DNS, FTP, SMTP, POP3, Telnet, SSH, DHCP, SNMP</td></tr>\n  <tr><td class=\"num\">6</td><td>Présentation</td><td>Gestion de la syntaxe (codage, compression, chiffrement)</td></tr>\n  <tr><td class=\"num\">5</td><td>Session</td><td>Contrôle du dialogue</td></tr>\n  <tr><td class=\"num\">4</td><td>Transport</td><td>Qualité de la transmission</td><td class=\"num\">3</td><td>Transport</td><td>Segment</td><td>TCP, UDP</td></tr>\n  <tr><td class=\"num\">3</td><td>Réseau</td><td>Sélection du chemin</td><td class=\"num\">2</td><td>Internet</td><td>Paquet</td><td>IP, ICMP, IPsec, IGMP</td></tr>\n  <tr><td class=\"num\">2</td><td>Liaison de données</td><td>Préparation de l'envoi sur le média</td><td class=\"num\" rowspan=\"2\">1</td><td rowspan=\"2\">Accès réseau</td><td>Trame</td><td rowspan=\"2\">Ethernet, Wi-Fi, PPP, ARP (+ câbles UTP/STP, fibre)</td></tr>\n  <tr><td class=\"num\">1</td><td>Physique</td><td>Envoi sur le média physique</td><td>Bits</td></tr></tbody></table></div>\n  <div class=\"exam\"><b>Ce qui tombe (TD ex. 3)</b>Remplir exactement ce tableau. Note la numérotation TCP/IP du prof : 1 = Accès réseau, en bas ; 4 = Application, en haut.</div>\n  <div class=\"formula\">Encapsulation (émission, on descend)       Désencapsulation (réception, on remonte)\nDonnées  ──►  [TCP | Données] = Segment\n              [IP | Segment]  = Paquet\n              [Eth | Paquet | FCS] = Trame\n              0110101…  = Bits</div>\n  <p><b>OSI</b> est développé par l'ISO : c'est un modèle de référence théorique, qui n'est pas implémenté physiquement. <b>TCP/IP</b> vient d'ARPANET (années 1970) et devient le standard d'Internet en 1983 : c'est le modèle opérationnel. Points communs : tous deux sont en couches, ont une couche application, des couches transport et réseau comparables, et utilisent la commutation de paquets.</p>\n  <div class=\"trap\"><b>Pièges</b>① Session et Présentation n'existent pas séparément dans TCP/IP : elles sont dans sa couche Application. ② La couche 2 est la seule qui ajoute aussi une <i>queue</i>. ③ Ne confonds pas la couche n°2 TCP/IP (Internet) avec la couche n°2 OSI (Liaison).</div><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 10 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">La couche OSI qui assure la « sélection du chemin » est la couche…</div><button class=\"opt\" data-o=\"0\">Transport (4)</button><button class=\"opt\" data-o=\"1\">Réseau (3)</button><button class=\"opt\" data-o=\"2\">Liaison (2)</button><button class=\"opt\" data-o=\"3\">Session (5)</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Chiffrement, compression et codage des données relèvent de la couche…</div><button class=\"opt\" data-o=\"0\">Session</button><button class=\"opt\" data-o=\"1\">Présentation</button><button class=\"opt\" data-o=\"2\">Application</button><button class=\"opt\" data-o=\"3\">Transport</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Le modèle OSI a été développé par…</div><button class=\"opt\" data-o=\"0\">IETF</button><button class=\"opt\" data-o=\"1\">IEEE</button><button class=\"opt\" data-o=\"2\">ISO</button><button class=\"opt\" data-o=\"3\">ARPANET</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">(TD) Telnet appartient à la couche…</div><button class=\"opt\" data-o=\"0\">Transport</button><button class=\"opt\" data-o=\"1\">Session</button><button class=\"opt\" data-o=\"2\">Application</button><button class=\"opt\" data-o=\"3\">Réseau</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Un répéteur travaille à la couche…</div><button class=\"opt\" data-o=\"0\">1 Physique</button><button class=\"opt\" data-o=\"1\">2 Liaison</button><button class=\"opt\" data-o=\"2\">3 Réseau</button><button class=\"opt\" data-o=\"3\">4 Transport</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Dans le modèle TCP/IP du prof, la couche n°2 est…</div><button class=\"opt\" data-o=\"0\">Transport</button><button class=\"opt\" data-o=\"1\">Internet</button><button class=\"opt\" data-o=\"2\">Accès réseau</button><button class=\"opt\" data-o=\"3\">Application</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">La couche Application TCP/IP regroupe les couches OSI…</div><button class=\"opt\" data-o=\"0\">5, 6, 7</button><button class=\"opt\" data-o=\"1\">6, 7</button><button class=\"opt\" data-o=\"2\">4, 5, 6, 7</button><button class=\"opt\" data-o=\"3\">7 seulement</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">(TD) Le protocole réseau utilisé par Internet est…</div><button class=\"opt\" data-o=\"0\">IPX/SPX</button><button class=\"opt\" data-o=\"1\">TCP/IP</button><button class=\"opt\" data-o=\"2\">NetBEUI</button><button class=\"opt\" data-o=\"3\">X.25</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">La PDU de la couche Transport est…</div><button class=\"opt\" data-o=\"0\">La trame</button><button class=\"opt\" data-o=\"1\">Le paquet</button><button class=\"opt\" data-o=\"2\">Le segment</button><button class=\"opt\" data-o=\"3\">Le bit</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Quelle couche ajoute un en-tête ET une queue (FCS/CRC) ?</div><button class=\"opt\" data-o=\"0\">Transport</button><button class=\"opt\" data-o=\"1\">Réseau</button><button class=\"opt\" data-o=\"2\">Liaison de données</button><button class=\"opt\" data-o=\"3\">Application</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"10\"><div class=\"qq-q\">(TD) Ordre d&#39;encapsulation complet, du haut vers le bas ?</div><button class=\"opt\" data-o=\"0\">Ethernet frame → IP packet → TCP → HTTP</button><button class=\"opt\" data-o=\"1\">HTTP GET → segment TCP → paquet IP → trame Ethernet</button><button class=\"opt\" data-o=\"2\">IP → TCP → HTTP → Ethernet</button><button class=\"opt\" data-o=\"3\">TCP → HTTP → IP → Ethernet</button><div class=\"qq-e\" hidden></div></div></section>","ex":[],"qcm":[{"n":"n22","q":"La couche OSI qui assure la « sélection du chemin » est la couche…","o":["Transport (4)","Réseau (3)","Liaison (2)","Session (5)"],"a":1,"e":"Couche 3 Réseau : routage, adressage IP."},{"n":"n22","q":"Chiffrement, compression et codage des données relèvent de la couche…","o":["Session","Présentation","Application","Transport"],"a":1,"e":"Couche 6 Présentation : codage/conversion, compression, chiffrement."},{"n":"n22","q":"Le modèle OSI a été développé par…","o":["IETF","IEEE","ISO","ARPANET"],"a":2,"e":"ISO = International Organization for Standardization."},{"n":"n22","q":"(TD) Telnet appartient à la couche…","o":["Transport","Session","Application","Réseau"],"a":2,"e":"Telnet est un protocole de la couche Application (port TCP 23)."},{"n":"n22","q":"Un répéteur travaille à la couche…","o":["1 Physique","2 Liaison","3 Réseau","4 Transport"],"a":0,"e":"Il régénère le signal : couche physique."},{"n":"n23","q":"Dans le modèle TCP/IP du prof, la couche n°2 est…","o":["Transport","Internet","Accès réseau","Application"],"a":1,"e":"Numérotation du prof : 1 Accès réseau, 2 Internet, 3 Transport, 4 Application."},{"n":"n23","q":"La couche Application TCP/IP regroupe les couches OSI…","o":["5, 6, 7","6, 7","4, 5, 6, 7","7 seulement"],"a":0,"e":"Application TCP/IP = Session + Présentation + Application OSI."},{"n":"n23","q":"(TD) Le protocole réseau utilisé par Internet est…","o":["IPX/SPX","TCP/IP","NetBEUI","X.25"],"a":1,"e":"Internet repose sur la pile TCP/IP."},{"n":"n24","q":"La PDU de la couche Transport est…","o":["La trame","Le paquet","Le segment","Le bit"],"a":2,"e":"4 Segment · 3 Paquet · 2 Trame · 1 Bits."},{"n":"n24","q":"Quelle couche ajoute un en-tête ET une queue (FCS/CRC) ?","o":["Transport","Réseau","Liaison de données","Application"],"a":2,"e":"La trame = en-tête + paquet + queue de bande (contrôle d&#39;erreurs)."},{"n":"n24","q":"(TD) Ordre d&#39;encapsulation complet, du haut vers le bas ?","o":["Ethernet frame → IP packet → TCP → HTTP","HTTP GET → segment TCP → paquet IP → trame Ethernet","IP → TCP → HTTP → Ethernet","TCP → HTTP → IP → Ethernet"],"a":1,"e":"Données (HTTP) → Segment (TCP) → Paquet (IP) → Trame (Ethernet) → bits."}]},{"id":"s10","t":"Ch2 · Protocoles, ports, MTU","seance":"Chapitre 2","imp":5,"html":"<div class=\"table-wrap\"><table><thead><tr><th>Protocole</th><th>Rôle</th><th>Transport · port</th></tr></thead><tbody>\n  <tr><td>FTP</td><td>Transfert de fichiers (get/put). Port 21 = contrôle (login, commandes) ; port 20 = données</td><td class=\"num\">TCP 20/21</td></tr>\n  <tr><td>SSH</td><td>Accès distant sécurisé (chiffré)</td><td class=\"num\">TCP 22</td></tr>\n  <tr><td>Telnet</td><td>Accès distant en ligne de commande (session VTY), en clair</td><td class=\"num\">TCP 23</td></tr>\n  <tr><td>SMTP</td><td>Envoi du courrier (client → serveur, serveur → serveur)</td><td class=\"num\">TCP 25</td></tr>\n  <tr><td>DNS</td><td>Nom de domaine → adresse IP</td><td class=\"num\">UDP/TCP 53</td></tr>\n  <tr><td>DHCP</td><td>Attribution automatique d'IP, masque, passerelle, DNS (bail)</td><td class=\"num\">UDP 67</td></tr>\n  <tr><td>HTTP</td><td>Transfert des pages Web (requête/réponse : GET, POST, PUT)</td><td class=\"num\">TCP 80</td></tr>\n  <tr><td>POP3</td><td>Récupération du courrier</td><td class=\"num\">TCP 110</td></tr>\n  <tr><td>HTTPS</td><td>HTTP chiffré par SSL/TLS</td><td class=\"num\">TCP 443</td></tr></tbody></table></div>\n  <p><b>Ports réservés :</b> 0 à 1023. Le numéro de port permet d'identifier la conversation, c'est-à-dire l'application à qui sont destinées les données.</p>\n  <p><b>WWW</b> : ensemble des pages reliées par hyperliens. <b>HTML</b> : langage de description des pages. <b>HTTP</b> : protocole qui les transporte. <b>URL</b> : adresse d'une ressource Web ; <code>http://www.fpbm.ma/web-server.htm</code> = protocole + nom du serveur + fichier demandé.</p>\n  <p><b>Messagerie :</b> le MUA est le client (Outlook) ; le MTA transfère entre serveurs ; le MDA dépose le message dans la boîte. Syntaxe d'une adresse e-mail : <code>utilisateur@domaine</code> (ex. nom@fpbm.ma).</p>\n  <div class=\"table-wrap\"><table><thead><tr><th>TCP</th><th>UDP</th></tr></thead><tbody>\n  <tr><td>Fiable, orienté connexion (SYN, SYN-ACK, ACK)</td><td>Non fiable, sans connexion</td></tr>\n  <tr><td>Contrôle d'erreurs, de flux, de congestion ; remise dans l'ordre ; accusés de réception</td><td>Aucun de ces contrôles, mais rapide et léger</td></tr>\n  <tr><td>En-tête de 20 octets · HTTP, SMTP, FTP, Telnet</td><td>DNS (couramment), SNMP, VoIP, DHCP</td></tr></tbody></table></div>\n  <h3>MTU, MSS et segmentation</h3>\n  <div class=\"formula\">MTU (Maximum Transmission Unit) = taille max d'un paquet sur l'interface (Ethernet : 1500 o)\nMSS (Maximum Segment Size)       = MTU − 40   (20 o en-tête IP + 20 o en-tête TCP) → 1460 o\n\nNb de segments = ⌈ données / (MTU − en-têtes) ⌉\nDernier segment = données restantes + en-têtes</div>\n  <div class=\"trap\"><b>Piège (TD ex. 5)</b>Repère bien ce que l'énoncé compte comme « en-têtes » : 20 octets au total, ou 20 par en-tête (IP + TCP = 40, comme dans le cours pour le MSS). Écris ton hypothèse sur ta copie.</div>\n  <p><b>Équipements :</b> la <b>carte réseau</b> relie l'hôte au support et porte l'adresse MAC ; le <b>répéteur</b> régénère le signal (couche 1) ; le <b>switch</b> relie les hôtes d'un même réseau (couche 2) ; le <b>routeur</b> relie des réseaux différents (couche 3). L'<b>adresse IP</b> est logique et modifiable ; l'adresse <b>MAC</b> est physique et en principe fixe.</p>\n  <h3>Transport, compléments</h3>\n  <p>Fonctions : segmentation et réassemblage, contrôle de flux, contrôle d'erreurs, multiplexage et démultiplexage, fiabilité, identification des conversations (ports). La <b>taille de fenêtre</b> est le nombre d'octets envoyés avant d'attendre un accusé de réception ; le <b>numéro d'ACK</b> est le numéro du prochain octet attendu. En cas d'encombrement, le destinataire acquitte le dernier segment reçu dans l'ordre et réduit la fenêtre. La <b>fermeture</b> se fait en 4 temps : FIN → ACK → FIN → ACK.</p>\n  <p><b>HTTP :</b> requêtes GET (obtenir), POST (envoyer des données dans le message), PUT (téléverser une ressource). Codes : 200 OK · 301 déplacé définitivement · 400 syntaxe erronée · 404 non trouvé · 505 version non gérée. Un serveur Web stocke les objets adressés par URL (Apache, IIS).</p>\n  <h3>Messagerie : le chemin d'un e-mail (TD 2, ex. 1)</h3>\n  <div class=\"formula\">zzz@yahoo.fr ──(SMTP)──▶ MTA yahoo.fr ──(SMTP)──▶ MTA gmail.com ──(MDA)──▶ boîte de yyy@gmail.com\n  MUA                      │  DNS : enregistrement MX de gmail.com                     │\n                                                                          MUA ◀──(POP3 ou IMAP)──┘</div>\n  <ul>\n    <li><b>MUA</b> (client : Outlook, Thunderbird, webmail) envoie par <b>SMTP</b> à son serveur. Le <b>MTA</b> de l'expéditeur interroge le <b>DNS</b> (enregistrement MX du domaine du destinataire) puis transfère par SMTP au MTA du destinataire. Le <b>MDA</b> dépose le message dans la boîte. Le destinataire le lit avec son MUA par <b>POP3</b> ou <b>IMAP</b> (ou en webmail, par HTTP).</li>\n    <li>SMTP <b>pousse</b> le courrier (client → serveur et serveur → serveur) ; POP3 et IMAP le <b>récupèrent</b> (serveur → client).</li>\n  </ul>\n  <div class=\"table-wrap\"><table><thead><tr><th>Critère</th><th>POP3 (TCP 110)</th><th>IMAP (TCP 143)</th></tr></thead><tbody><tr><td>Flux</td><td>le client télécharge les messages vers sa machine, souvent en les supprimant du serveur</td><td>le client consulte les messages sur le serveur ; seules les actions (lecture, suppression) se synchronisent</td></tr><tr><td>Stockage côté serveur</td><td>minimal</td><td>tout reste sur le serveur</td></tr><tr><td>Dossiers</td><td>une seule boîte de réception</td><td>plusieurs dossiers (brouillons, envoyés, archives, spam)</td></tr><tr><td>Accès multiple</td><td>un seul appareil, pas de synchronisation</td><td>plusieurs appareils synchronisés</td></tr></tbody></table></div>\n  <p>En une phrase : POP3 pour un usage simple sur un seul poste ; IMAP pour un usage connecté et multi-appareils. Ports standards : 110 (POP3), 143 (IMAP), 25 (SMTP).</p>\n  <h3>TCP : numéros de séquence, acquittements et fenêtres (TD 2, ex. 3 à 5)</h3>\n  <div class=\"formula\">Seq     = numéro du premier octet de données du segment\nProchain Seq = Seq + longueur utile (payload)\nACK     = numéro du prochain octet attendu = dernier octet reçu EN ORDRE + 1\nExemple : Seq initial 2001, segments de 1000, 1000, 500 octets\n  segment 1 : Seq 2001  (octets 2001 à 3000)  → ACK attendu 3001\n  segment 2 : Seq 3001  (octets 3001 à 4000)  → ACK attendu 4001\n  segment 3 : Seq 4001  (octets 4001 à 4500)  → ACK attendu 4501</div>\n  <ul>\n    <li><b>ACK cumulatif</b> : « ACK = n » confirme tous les octets jusqu'à n − 1. Le serveur peut donc n'envoyer qu'un seul ACK (4501) après les trois segments.</li>\n    <li>SYN et FIN consomment chacun un numéro de séquence. Un ACK pur (sans données) n'en consomme pas.</li>\n    <li><b>rwnd</b> (fenêtre de réception) : annoncée par le récepteur, c'est la place libre dans son tampon (contrôle de <b>flux</b>). <b>cwnd</b> (fenêtre de congestion) : fixée par l'émetteur pour ne pas saturer le réseau (contrôle de <b>congestion</b>).</li>\n    <li><b>Fenêtre effective</b> W = min(cwnd, rwnd) : nombre maximal d'octets envoyés sans accusé de réception. Il reste à envoyer W − (octets déjà envoyés et non acquittés).</li>\n  </ul>\n  <div class=\"def\"><b>Exemple (TD 2, ex. 4)</b>cwnd = 3000, rwnd = 2500, MSS = 1000 : W = min(3000, 2500) = 2500 octets, soit 1000 + 1000 + 500 (trois segments, dont le dernier est partiel). Si rwnd tombe à 1200, W = 1200 : après 1000 octets en vol, il ne reste que 200 octets à envoyer avant d'attendre un ACK. Dans la pratique, TCP peut attendre d'avoir de quoi remplir un segment complet, mais le TD compte le segment partiel.</div>\n  <div class=\"def\"><b>Perte de segments (TD 2, ex. 5)</b>Si les octets à partir du n° 501 sont perdus, le récepteur renvoie ACK = 501 (il redemande l'octet 501) et l'émetteur retransmet à partir de Seq = 501, après un délai d'attente ou plusieurs ACK identiques. Tout cela se joue à la couche <b>transport</b>. Si le récepteur réduit sa fenêtre à 500, ses ACK annoncent « fenêtre = 500 » et l'émetteur n'a plus le droit d'avoir plus de 500 octets en vol.</div><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 24 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">(TD) Quel service traduit une adresse Web en adresse IP ?</div><button class=\"opt\" data-o=\"0\">DHCP</button><button class=\"opt\" data-o=\"1\">DNS</button><button class=\"opt\" data-o=\"2\">HTTP</button><button class=\"opt\" data-o=\"3\">SMTP</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">(TD) Parmi IP, TCP, UDP, http, DNS, Ethernet, les deux protocoles de la couche application sont…</div><button class=\"opt\" data-o=\"0\">TCP et UDP</button><button class=\"opt\" data-o=\"1\">http et DNS</button><button class=\"opt\" data-o=\"2\">IP et Ethernet</button><button class=\"opt\" data-o=\"3\">DNS et UDP</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Le protocole utilisé pour ENVOYER un courriel est…</div><button class=\"opt\" data-o=\"0\">POP3</button><button class=\"opt\" data-o=\"1\">IMAP</button><button class=\"opt\" data-o=\"2\">SMTP</button><button class=\"opt\" data-o=\"3\">HTTP</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">(TD) Quelle partie d&#39;un réseau fournit des applications et des données aux hôtes ?</div><button class=\"opt\" data-o=\"0\">Le switch</button><button class=\"opt\" data-o=\"1\">Le serveur</button><button class=\"opt\" data-o=\"2\">Le câble</button><button class=\"opt\" data-o=\"3\">Le répéteur</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Dans <a href=\"http://www.microsoft.com/products/pc.htm\">http://www.microsoft.com/products/pc.htm</a>, « /products/pc.htm » est…</div><button class=\"opt\" data-o=\"0\">Le protocole</button><button class=\"opt\" data-o=\"1\">Le nom du serveur</button><button class=\"opt\" data-o=\"2\">Le chemin et le fichier demandé</button><button class=\"opt\" data-o=\"3\">Le port</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Le port 110 correspond à…</div><button class=\"opt\" data-o=\"0\">SMTP</button><button class=\"opt\" data-o=\"1\">POP3</button><button class=\"opt\" data-o=\"2\">IMAP</button><button class=\"opt\" data-o=\"3\">FTP</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Le port 22 correspond à…</div><button class=\"opt\" data-o=\"0\">Telnet</button><button class=\"opt\" data-o=\"1\">SSH</button><button class=\"opt\" data-o=\"2\">FTP données</button><button class=\"opt\" data-o=\"3\">DNS</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Quel protocole de transport le DNS utilise-t-il couramment ?</div><button class=\"opt\" data-o=\"0\">TCP uniquement</button><button class=\"opt\" data-o=\"1\">UDP (et TCP dans certains cas)</button><button class=\"opt\" data-o=\"2\">ICMP</button><button class=\"opt\" data-o=\"3\">Aucun</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Lequel n&#39;est PAS une caractéristique de TCP ?</div><button class=\"opt\" data-o=\"0\">Orienté connexion</button><button class=\"opt\" data-o=\"1\">Remise dans l&#39;ordre</button><button class=\"opt\" data-o=\"2\">Contrôle de flux</button><button class=\"opt\" data-o=\"3\">Pas d&#39;accusé de réception</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">(TD) Lors d&#39;un transfert, les 2 responsabilités principales de l&#39;hôte récepteur sont…</div><button class=\"opt\" data-o=\"0\">Routage et adressage</button><button class=\"opt\" data-o=\"1\">Accusé de réception et réassemblage</button><button class=\"opt\" data-o=\"2\">Chiffrement et compression</button><button class=\"opt\" data-o=\"3\">Segmentation et routage</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"10\"><div class=\"qq-q\">MTU Ethernet par défaut et MSS TCP correspondant ?</div><button class=\"opt\" data-o=\"0\">1500 / 1460</button><button class=\"opt\" data-o=\"1\">1460 / 1500</button><button class=\"opt\" data-o=\"2\">1500 / 1480</button><button class=\"opt\" data-o=\"3\">1518 / 1500</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"11\"><div class=\"qq-q\">(TD) Une carte réseau sert à…</div><button class=\"opt\" data-o=\"0\">Choisir le chemin entre réseaux</button><button class=\"opt\" data-o=\"1\">Connecter physiquement l&#39;hôte au réseau</button><button class=\"opt\" data-o=\"2\">Traduire les noms</button><button class=\"opt\" data-o=\"3\">Amplifier le signal</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"12\"><div class=\"qq-q\">(TD) Numéro identifiant un ordinateur sur un LAN ou Internet, et modifiable :</div><button class=\"opt\" data-o=\"0\">Adresse MAC</button><button class=\"opt\" data-o=\"1\">Adresse IP</button><button class=\"opt\" data-o=\"2\">Numéro de port</button><button class=\"opt\" data-o=\"3\">Numéro de série</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"13\"><div class=\"qq-q\">Un segment TCP porte ACK = 3001. Cela signifie que…</div><button class=\"opt\" data-o=\"0\">le récepteur a reçu 3001 segments</button><button class=\"opt\" data-o=\"1\">les octets jusqu&#39;au n° 3000 sont reçus et le n° 3001 est attendu</button><button class=\"opt\" data-o=\"2\">l&#39;émetteur doit envoyer 3001 octets</button><button class=\"opt\" data-o=\"3\">la fenêtre vaut 3001 octets</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"14\"><div class=\"qq-q\">cwnd = 4000 octets et rwnd = 2500 octets : quelle est la fenêtre effective de l&#39;émetteur ?</div><button class=\"opt\" data-o=\"0\">4000 octets</button><button class=\"opt\" data-o=\"1\">2500 octets</button><button class=\"opt\" data-o=\"2\">6500 octets</button><button class=\"opt\" data-o=\"3\">1500 octets</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"15\"><div class=\"qq-q\">Qui annonce la valeur de rwnd ?</div><button class=\"opt\" data-o=\"0\">L&#39;émetteur</button><button class=\"opt\" data-o=\"1\">Le récepteur</button><button class=\"opt\" data-o=\"2\">Le routeur</button><button class=\"opt\" data-o=\"3\">Le serveur DNS</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"16\"><div class=\"qq-q\">Seq initial 2001, un segment de 1000 octets. Quel est le Seq du segment suivant ?</div><button class=\"opt\" data-o=\"0\">2002</button><button class=\"opt\" data-o=\"1\">3000</button><button class=\"opt\" data-o=\"2\">3001</button><button class=\"opt\" data-o=\"3\">1000</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"17\"><div class=\"qq-q\">Quel protocole laisse le courrier sur le serveur et le synchronise entre plusieurs appareils ?</div><button class=\"opt\" data-o=\"0\">POP3</button><button class=\"opt\" data-o=\"1\">IMAP</button><button class=\"opt\" data-o=\"2\">SMTP</button><button class=\"opt\" data-o=\"3\">FTP</button><div class=\"qq-e\" hidden></div></div></section>","ex":[],"qcm":[{"n":"n25","q":"(TD) Quel service traduit une adresse Web en adresse IP ?","o":["DHCP","DNS","HTTP","SMTP"],"a":1,"e":"DNS : résolution de noms (port 53)."},{"n":"n25","q":"(TD) Parmi IP, TCP, UDP, http, DNS, Ethernet, les deux protocoles de la couche application sont…","o":["TCP et UDP","http et DNS","IP et Ethernet","DNS et UDP"],"a":1,"e":"http et DNS sont des protocoles application ; TCP/UDP = transport, IP = réseau, Ethernet = liaison."},{"n":"n25","q":"Le protocole utilisé pour ENVOYER un courriel est…","o":["POP3","IMAP","SMTP","HTTP"],"a":2,"e":"SMTP envoie ; POP3 et IMAP récupèrent."},{"n":"n25","q":"(TD) Quelle partie d&#39;un réseau fournit des applications et des données aux hôtes ?","o":["Le switch","Le serveur","Le câble","Le répéteur"],"a":1,"e":"Un serveur fournit des données et des services aux clients."},{"n":"n25","q":"Dans <a href=\"http://www.microsoft.com/products/pc.htm\">http://www.microsoft.com/products/pc.htm</a>, « /products/pc.htm » est…","o":["Le protocole","Le nom du serveur","Le chemin et le fichier demandé","Le port"],"a":2,"e":"http = protocole · <a href=\"http://www.microsoft.com\">www.microsoft.com</a> = serveur · /products/pc.htm = chemin vers le fichier."},{"n":"n26","q":"Le port 110 correspond à…","o":["SMTP","POP3","IMAP","FTP"],"a":1,"e":"POP3 = 110 (TCP)."},{"n":"n26","q":"Le port 22 correspond à…","o":["Telnet","SSH","FTP données","DNS"],"a":1,"e":"SSH = 22 ; Telnet = 23."},{"n":"n26","q":"Quel protocole de transport le DNS utilise-t-il couramment ?","o":["TCP uniquement","UDP (et TCP dans certains cas)","ICMP","Aucun"],"a":1,"e":"Le cours : DNS sur TCP/UDP 53, UDP couramment."},{"n":"n26","q":"Lequel n&#39;est PAS une caractéristique de TCP ?","o":["Orienté connexion","Remise dans l&#39;ordre","Contrôle de flux","Pas d&#39;accusé de réception"],"a":3,"e":"TCP utilise des accusés de réception ; c&#39;est UDP qui n&#39;en a pas."},{"n":"n26","q":"(TD) Lors d&#39;un transfert, les 2 responsabilités principales de l&#39;hôte récepteur sont…","o":["Routage et adressage","Accusé de réception et réassemblage","Chiffrement et compression","Segmentation et routage"],"a":1,"e":"Le récepteur accuse réception des données et les réassemble dans l&#39;ordre."},{"n":"n27","q":"MTU Ethernet par défaut et MSS TCP correspondant ?","o":["1500 / 1460","1460 / 1500","1500 / 1480","1518 / 1500"],"a":0,"e":"MSS = MTU − 40 (20 IP + 20 TCP) = 1460."},{"n":"n28","q":"(TD) Une carte réseau sert à…","o":["Choisir le chemin entre réseaux","Connecter physiquement l&#39;hôte au réseau","Traduire les noms","Amplifier le signal"],"a":1,"e":"C&#39;est l&#39;interface entre l&#39;ordinateur et le support ; elle porte l&#39;adresse MAC."},{"n":"n28","q":"(TD) Numéro identifiant un ordinateur sur un LAN ou Internet, et modifiable :","o":["Adresse MAC","Adresse IP","Numéro de port","Numéro de série"],"a":1,"e":"L&#39;adresse IP est logique et configurable ; la MAC est en principe fixe."},{"n":"n42","q":"Un segment TCP porte ACK = 3001. Cela signifie que…","o":["le récepteur a reçu 3001 segments","les octets jusqu&#39;au n° 3000 sont reçus et le n° 3001 est attendu","l&#39;émetteur doit envoyer 3001 octets","la fenêtre vaut 3001 octets"],"a":1,"e":"ACK = numéro du prochain octet attendu, donc tous les octets précédents sont reçus (ACK cumulatif)."},{"n":"n42","q":"cwnd = 4000 octets et rwnd = 2500 octets : quelle est la fenêtre effective de l&#39;émetteur ?","o":["4000 octets","2500 octets","6500 octets","1500 octets"],"a":1,"e":"W = min(cwnd, rwnd) = min(4000, 2500) = 2500 octets."},{"n":"n42","q":"Qui annonce la valeur de rwnd ?","o":["L&#39;émetteur","Le récepteur","Le routeur","Le serveur DNS"],"a":1,"e":"rwnd est annoncée par le récepteur dans le champ Fenêtre de ses en-têtes TCP (contrôle de flux). cwnd est gérée par l&#39;émetteur."},{"n":"n42","q":"Seq initial 2001, un segment de 1000 octets. Quel est le Seq du segment suivant ?","o":["2002","3000","3001","1000"],"a":2,"e":"Seq suivant = 2001 + 1000 = 3001 (les octets 2001 à 3000 sont dans le premier segment)."},{"n":"n25","q":"Quel protocole laisse le courrier sur le serveur et le synchronise entre plusieurs appareils ?","o":["POP3","IMAP","SMTP","FTP"],"a":1,"e":"IMAP (port 143). POP3 télécharge le courrier, souvent en le supprimant du serveur."}]},{"id":"s11","t":"Ch2 · Couche liaison et contrôle d'erreurs","seance":"Chapitre 2","imp":5,"html":"<p><b>Rôle :</b> assurer une transmission fiable entre deux machines directement connectées. Elle encapsule le paquet dans une <b>trame</b> : en-tête (adressage MAC) + paquet + queue (FCS/CRC). <b>Services :</b> délimitation des trames, contrôle d'erreurs, contrôle de flux, contrôle d'accès au support (MAC). Technologies : Ethernet, Wi-Fi, PPP, switchs.</p>\n  <p><b>Sous-couches :</b> <b>LLC</b> (en haut : vers la couche réseau, indique le protocole de couche 3) et <b>MAC</b> (en bas : vers la couche physique, adressage, début et fin de trame). <b>Accès au support partagé :</b> contrôlé (chacun son tour, déterministe) ou basé sur le conflit (aléatoire : CSMA/CD, CSMA/CA).</p>\n  <p><b>Contrôle de flux :</b> <i>Send and Wait</i> (une trame, un sens, acquittement) ou <i>fenêtre d'anticipation</i> (plusieurs trames, deux sens, numéros de séquence).</p>\n  <h3>Délimitation des trames</h3>\n  <div class=\"formula\">Fanion = 01111110   (HDLC, PPP)\nBit de transparence : insérer un 0 après chaque suite de cinq 1 (le récepteur le retire)\nEx. 0111111011111100  →  011111[0]1011111[0]100</div>\n  <h3>Parité (VRC, LRC)</h3>\n  <div class=\"formula\">Parité paire   : nombre total de 1 (bit de parité compris) PAIR\nParité impaire : nombre total de 1 IMPAIR\nExemple du cours : 0011010 (trois 1)  → paire 0011010<b>1</b>   impaire 0011010<b>0</b></div>\n  <p><b>VRC</b> (parité par caractère) : simple, mais ne détecte que les erreurs portant sur un nombre <b>impair</b> de bits. <b>LRC</b> (parité sur tout le bloc, position par position) : combinée à la VRC, elle <b>localise et corrige</b> une erreur simple, à l'intersection de la ligne et de la colonne fautives.</p>\n  <div class=\"trap\"><b>Écart dans le cours</b>La diapo 96 parle de « LRC » pour la parité par caractère, alors que les diapos 98-99 appellent cela VRC et réservent LRC au bloc. Utilise la version des diapos 98-99 : VRC = par caractère, LRC = par bloc.</div>\n  <h3>CRC</h3>\n  <div class=\"formula\">Émission : r = degré de G(x)\n  1. M(x) suivi de r zéros\n  2. Division modulo 2 (XOR, sans retenue) par G(x) → reste R(x) sur r bits\n  3. Trame émise T = M suivi de R\nRéception : T'(x) / G(x) → reste 0 : pas d'erreur ; reste ≠ 0 : erreur → retransmission\n\nExemple vérifié : M = 1101011011, G = 10011 (x⁴ + x + 1)\n  → R = 1110, T = 11010110111110</div>\n  <div class=\"trap\"><b>Pièges</b>① On ajoute autant de zéros que le DEGRÉ de G (le nombre de bits de G moins 1), pas le nombre de bits de G. ② En modulo 2, soustraction = addition = XOR. ③ Le reste fait toujours r bits : garde les zéros de tête (ex. 0110).</div>\n  <p class=\"small muted\">Les diapos 101 à 104 (algorithme CRC détaillé) sont des images que je n'ai pas pu lire. J'ai appliqué la méthode standard, qui est cohérente avec la diapo 105. Si ton prof note le calcul autrement, envoie-moi une photo.</p>\n  <h3>Code de Hamming</h3>\n  <div class=\"formula\">C(n,k) : n = 2^r − 1, r = n − k      (7,4) : r = 3 ; (15,11) : r = 4\nDisposition (cours) :  pos 1  2  3  4  5  6  7\n                           C0 C1 U0 C2 U1 U2 U3\nC0 = U0 + U1 + U3      C1 = U0 + U2 + U3      C2 = U1 + U2 + U3     (mod 2)\n\nExemple du cours : m = 1010 → C0 = 1, C1 = 0, C2 = 1 → émis 1011010\nRéception 1011000 : C'0 ok ; C'1 faux (+2) ; C'2 faux (+4) → bit n° 6 erroné</div>\n  <div class=\"exam\"><b>Ce qui tombe</b>Calculer un bit de parité, un CRC, un mot de Hamming, puis localiser une erreur de Hamming. Entraîne-toi dans l'onglet Calculs : les exercices sont générés et vérifiés automatiquement.</div>\n  <h3>La trame Ethernet (TD 2, ex. 2)</h3>\n  <div class=\"table-wrap\"><table><thead><tr><th>Champ</th><th>Taille</th><th>Rôle</th></tr></thead><tbody><tr><td>Préambule</td><td>7 octets</td><td>aa aa aa aa aa aa aa (10101010) : synchronisation de l'horloge du récepteur</td></tr><tr><td>SFD</td><td>1 octet</td><td>ab (10101011) : annonce le début de la trame</td></tr><tr><td>MAC destination</td><td>6 octets</td><td>adresse physique du destinataire</td></tr><tr><td>MAC source</td><td>6 octets</td><td>adresse physique de l'émetteur</td></tr><tr><td>EtherType</td><td>2 octets</td><td>protocole encapsulé : 0800 = IPv4, 0806 = ARP, 86DD = IPv6</td></tr><tr><td>Données</td><td>46 à 1500 octets</td><td>le paquet ; complété par du bourrage (padding) s'il fait moins de 46 octets</td></tr><tr><td>FCS</td><td>4 octets</td><td>séquence de contrôle (CRC-32) : le récepteur la recalcule et rejette la trame si elle diffère</td></tr></tbody></table></div>\n  <p>Hors préambule et SFD, une trame fait <b>64 à 1518 octets</b> (14 d'en-tête + 46 à 1500 de données + 4 de FCS). Une adresse MAC s'écrit en 6 octets hexadécimaux : les 3 premiers sont l'OUI du fabricant.</p>\n  <div class=\"def\"><b>Méthode de décodage</b>Découpe la suite d'octets dans l'ordre : 8 octets de début (préambule + SFD), 6 (destination), 6 (source), 2 (EtherType), puis les données, et les 4 derniers octets (FCS). Si l'EtherType vaut 0800, les données commencent par un en-tête IPv4 (octet 45 = version 4, longueur d'en-tête 5 × 4 = 20 octets) ; le champ Protocole de cet en-tête (06 = TCP, 11 = UDP, 01 = ICMP) dit ce qui suit.</div><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 22 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Le fanion utilisé par HDLC et PPP est…</div><button class=\"opt\" data-o=\"0\">11111111</button><button class=\"opt\" data-o=\"1\">01111110</button><button class=\"opt\" data-o=\"2\">10101010</button><button class=\"opt\" data-o=\"3\">00000000</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Après bit de transparence, que devient 0111111 (sept bits) ?</div><button class=\"opt\" data-o=\"0\">01111110</button><button class=\"opt\" data-o=\"1\">01111101</button><button class=\"opt\" data-o=\"2\">0111111</button><button class=\"opt\" data-o=\"3\">00111111</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">La sous-couche qui indique quel protocole de couche 3 est dans la trame est…</div><button class=\"opt\" data-o=\"0\">MAC</button><button class=\"opt\" data-o=\"1\">LLC</button><button class=\"opt\" data-o=\"2\">PHY</button><button class=\"opt\" data-o=\"3\">IP</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">L&#39;accès « chacun son tour » au support est appelé…</div><button class=\"opt\" data-o=\"0\">Accès aléatoire</button><button class=\"opt\" data-o=\"1\">Accès contrôlé (déterministe)</button><button class=\"opt\" data-o=\"2\">CSMA/CD</button><button class=\"opt\" data-o=\"3\">Accès par conflit</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Dans le protocole « Send and Wait »…</div><button class=\"opt\" data-o=\"0\">Plusieurs trames partent à la fois</button><button class=\"opt\" data-o=\"1\">Une seule trame est envoyée, puis on attend l&#39;acquittement</button><button class=\"opt\" data-o=\"2\">Les données circulent dans les deux sens</button><button class=\"opt\" data-o=\"3\">Il n&#39;y a pas d&#39;acquittement</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Bit de parité PAIRE pour 1101001 ?</div><button class=\"opt\" data-o=\"0\">0</button><button class=\"opt\" data-o=\"1\">1</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">La parité simple (VRC) ne détecte pas…</div><button class=\"opt\" data-o=\"0\">Une erreur sur 1 bit</button><button class=\"opt\" data-o=\"1\">Une erreur sur 3 bits</button><button class=\"opt\" data-o=\"2\">Une erreur sur 2 bits</button><button class=\"opt\" data-o=\"3\">Aucune erreur</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">VRC + LRC (parité croisée) permet…</div><button class=\"opt\" data-o=\"0\">Seulement de détecter</button><button class=\"opt\" data-o=\"1\">De détecter et de corriger une erreur simple</button><button class=\"opt\" data-o=\"2\">De corriger toutes les erreurs</button><button class=\"opt\" data-o=\"3\">De compresser</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">En CRC avec G(x) de degré 4, combien de zéros ajoute-t-on à M avant la division ?</div><button class=\"opt\" data-o=\"0\">3</button><button class=\"opt\" data-o=\"1\">4</button><button class=\"opt\" data-o=\"2\">5</button><button class=\"opt\" data-o=\"3\">8</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">À la réception, le reste de T&#39;(x) / G(x) vaut 0. Conclusion ?</div><button class=\"opt\" data-o=\"0\">Erreur détectée</button><button class=\"opt\" data-o=\"1\">Pas d&#39;erreur détectée</button><button class=\"opt\" data-o=\"2\">Il faut corriger le bit 0</button><button class=\"opt\" data-o=\"3\">G est faux</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"10\"><div class=\"qq-q\">M = 1101011011, G = 10011. Le reste R vaut…</div><button class=\"opt\" data-o=\"0\">1110</button><button class=\"opt\" data-o=\"1\">0111</button><button class=\"opt\" data-o=\"2\">1011</button><button class=\"opt\" data-o=\"3\">0000</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"11\"><div class=\"qq-q\">Pour un code de Hamming avec r = 4, n vaut…</div><button class=\"opt\" data-o=\"0\">7</button><button class=\"opt\" data-o=\"1\">15</button><button class=\"opt\" data-o=\"2\">16</button><button class=\"opt\" data-o=\"3\">11</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"12\"><div class=\"qq-q\">Code de Hamming (convention du cours) de 1010 ?</div><button class=\"opt\" data-o=\"0\">1011010</button><button class=\"opt\" data-o=\"1\">1010101</button><button class=\"opt\" data-o=\"2\">0110010</button><button class=\"opt\" data-o=\"3\">1011001</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"13\"><div class=\"qq-q\">On envoie 1011010 et on reçoit 1011000. Le bit erroné est le n°…</div><button class=\"opt\" data-o=\"0\">3</button><button class=\"opt\" data-o=\"1\">5</button><button class=\"opt\" data-o=\"2\">6</button><button class=\"opt\" data-o=\"3\">7</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"14\"><div class=\"qq-q\">Quel champ d&#39;une trame Ethernet indique le protocole encapsulé ?</div><button class=\"opt\" data-o=\"0\">FCS</button><button class=\"opt\" data-o=\"1\">EtherType</button><button class=\"opt\" data-o=\"2\">Préambule</button><button class=\"opt\" data-o=\"3\">MAC source</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"15\"><div class=\"qq-q\">Quelle est la taille minimale d&#39;une trame Ethernet, hors préambule ?</div><button class=\"opt\" data-o=\"0\">46 octets</button><button class=\"opt\" data-o=\"1\">64 octets</button><button class=\"opt\" data-o=\"2\">1500 octets</button><button class=\"opt\" data-o=\"3\">1518 octets</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"16\"><div class=\"qq-q\">Dans une trame Ethernet, que représentent les 4 derniers octets ?</div><button class=\"opt\" data-o=\"0\">L&#39;adresse IP de destination</button><button class=\"opt\" data-o=\"1\">Le FCS (contrôle d&#39;erreur CRC)</button><button class=\"opt\" data-o=\"2\">Le numéro de séquence</button><button class=\"opt\" data-o=\"3\">Le SFD</button><div class=\"qq-e\" hidden></div></div></section>","ex":[],"qcm":[{"n":"n36","q":"Le fanion utilisé par HDLC et PPP est…","o":["11111111","01111110","10101010","00000000"],"a":1,"e":"Fanion = 01111110. Pour qu&#39;il ne réapparaisse jamais dans les données, on insère un 0 après cinq 1."},{"n":"n36","q":"Après bit de transparence, que devient 0111111 (sept bits) ?","o":["01111110","01111101","0111111","00111111"],"a":1,"e":"Après cinq 1 consécutifs, on insère un 0 : 0 11111 [0] 1 → 01111101."},{"n":"n37","q":"La sous-couche qui indique quel protocole de couche 3 est dans la trame est…","o":["MAC","LLC","PHY","IP"],"a":1,"e":"LLC (Logical Link Control) est la sous-couche supérieure, tournée vers la couche réseau."},{"n":"n37","q":"L&#39;accès « chacun son tour » au support est appelé…","o":["Accès aléatoire","Accès contrôlé (déterministe)","CSMA/CD","Accès par conflit"],"a":1,"e":"Accès contrôlé = programmé, déterministe. L&#39;accès basé sur le conflit est aléatoire."},{"n":"n37","q":"Dans le protocole « Send and Wait »…","o":["Plusieurs trames partent à la fois","Une seule trame est envoyée, puis on attend l&#39;acquittement","Les données circulent dans les deux sens","Il n&#39;y a pas d&#39;acquittement"],"a":1,"e":"Send and Wait : une trame à la fois, dans un sens, avec acquittement. La fenêtre d&#39;anticipation envoie plusieurs trames."},{"n":"n29","q":"Bit de parité PAIRE pour 1101001 ?","o":["0","1"],"a":0,"e":"1101001 contient quatre 1 (nombre pair), donc le bit de parité paire vaut 0."},{"n":"n29","q":"La parité simple (VRC) ne détecte pas…","o":["Une erreur sur 1 bit","Une erreur sur 3 bits","Une erreur sur 2 bits","Aucune erreur"],"a":2,"e":"Deux bits faux laissent la parité inchangée : seules les erreurs portant sur un nombre impair de bits sont détectées."},{"n":"n29","q":"VRC + LRC (parité croisée) permet…","o":["Seulement de détecter","De détecter et de corriger une erreur simple","De corriger toutes les erreurs","De compresser"],"a":1,"e":"L&#39;intersection de la ligne et de la colonne fautives localise le bit, qu&#39;on peut donc corriger."},{"n":"n30","q":"En CRC avec G(x) de degré 4, combien de zéros ajoute-t-on à M avant la division ?","o":["3","4","5","8"],"a":1,"e":"On ajoute r = degré de G zéros : ici 4. Le reste fait 4 bits."},{"n":"n30","q":"À la réception, le reste de T&#39;(x) / G(x) vaut 0. Conclusion ?","o":["Erreur détectée","Pas d&#39;erreur détectée","Il faut corriger le bit 0","G est faux"],"a":1,"e":"R&#39;(x) = 0 : le mot reçu est un mot de code valide."},{"n":"n30","q":"M = 1101011011, G = 10011. Le reste R vaut…","o":["1110","0111","1011","0000"],"a":0,"e":"Vérifié par calcul : on ajoute 0000, puis on divise modulo 2 par 10011 → R = 1110, donc T = 11010110111110."},{"n":"n31","q":"Pour un code de Hamming avec r = 4, n vaut…","o":["7","15","16","11"],"a":1,"e":"n = 2^r − 1 = 15 (et k = 11)."},{"n":"n31","q":"Code de Hamming (convention du cours) de 1010 ?","o":["1011010","1010101","0110010","1011001"],"a":0,"e":"C0 = 1+0+0 = 1, C1 = 1+1+0 = 0, C2 = 0+1+0 = 1. Ordre C0 C1 U0 C2 U1 U2 U3 → 1011010."},{"n":"n31","q":"On envoie 1011010 et on reçoit 1011000. Le bit erroné est le n°…","o":["3","5","6","7"],"a":2,"e":"C&#39;0 correct ; C&#39;1 faux (+2) ; C&#39;2 faux (+4) → C = 6."},{"n":"n41","q":"Quel champ d&#39;une trame Ethernet indique le protocole encapsulé ?","o":["FCS","EtherType","Préambule","MAC source"],"a":1,"e":"L&#39;EtherType (2 octets) : 0800 = IPv4, 0806 = ARP, 86DD = IPv6."},{"n":"n41","q":"Quelle est la taille minimale d&#39;une trame Ethernet, hors préambule ?","o":["46 octets","64 octets","1500 octets","1518 octets"],"a":1,"e":"64 octets : 14 d&#39;en-tête + 46 de données au minimum + 4 de FCS. En dessous de 46 octets de données, on ajoute du bourrage."},{"n":"n41","q":"Dans une trame Ethernet, que représentent les 4 derniers octets ?","o":["L&#39;adresse IP de destination","Le FCS (contrôle d&#39;erreur CRC)","Le numéro de séquence","Le SFD"],"a":1,"e":"Le FCS, calculé par l&#39;émetteur et recalculé par le récepteur pour détecter une erreur."}]},{"id":"s12","t":"Ch2 · Couche physique","seance":"Chapitre 2","imp":5,"html":"<p><b>3 fonctions :</b> codage des données, signalisation, composants physiques. Elle génère les signaux qui représentent les bits. Chaque bit occupe le support pendant une <b>durée du bit</b> ; la synchronisation se fait par horloge. On représente un bit en modifiant l'<b>amplitude</b>, la <b>fréquence</b> ou la <b>phase</b> du signal.</p>\n  <h3>Méthodes de signalisation (exemple : 01001101)</h3>\n  <div class=\"flow\"><p style=\"margin:10px 0 2px\"><b>Tout ou rien</b> · <span class=\"small muted\">0 → 0 V, 1 → +V</span></p><svg viewBox=\"0 0 298 82\" style=\"max-width:417.2px;width:100%\" role=\"img\" aria-label=\"Chronogramme Tout ou rien de 01001101\"><text class=\"tx\" x=\"0\" y=\"16\">+V</text><text class=\"tx\" x=\"6\" y=\"38\">0</text><text class=\"tx\" x=\"0\" y=\"60\">−V</text><line class=\"axis\" x1=\"34\" y1=\"34\" x2=\"294\" y2=\"34\"/><line class=\"grid\" x1=\"34\" y1=\"4\" x2=\"34\" y2=\"64\"/><text class=\"tx\" x=\"47\" y=\"76\">0</te "Chronogramme Manchester de 01001101\"><text class=\"tx\" x=\"0\" y=\"16\">+V</text><text class=\"tx\" x=\"6\" y=\"38\">0</text><text class=\"tx\" x=\"0\" y=\"60\">−V</text><line class=\"axis\" x1=\"34\" y1=\"34\" x2=\"294\" y2=\"34\"/><line class=\"grid\" x1=\"34\" y1=\"4\" x2=\"34\" y2=\"64\"/><text class=\"tx\" x=\"47\" y=\"76\">0</text><line class=\"grid\" x1=\"66\" y1=\"4\" x2=\"66\" y2=\"64\"/><text class=\"tx\" x=\"79\" y=\"76\">1</text><line class=\"grid\" x1=\"98\" y1=\"4\" x2=\"98\" y2=\"64\"/><text class=\"tx\" x=\"111\" y=\"76\">0</text><line class=\"grid\" x1=\"130\" y1=\"4\" x2=\"130\" y2=\"64\"/><text class=\"tx\" x=\"143\" y=\"76\">0</text><line class=\"grid\" x1=\"162\" y1=\"4\" x2=\"162\" y2=\"64\"/><text class=\"tx\" x=\"175\" y=\"76\">1</text><line class=\"grid\" x1=\"194\" y1=\"4\" x2=\"194\" y2=\"64\"/><text class=\"tx\" x=\"207\" y=\"76\">1</text><line class=\"grid\" x1=\"226\" y1=\"4\" x2=\"226\" y2=\"64\"/><text class=\"tx\" x=\"239\" y=\"76\">0</text><line class=\"grid\" x1=\"258\" y1=\"4\" x2=\"258\" y2=\"64\"/><text class=\"tx\" x=\"271\" y=\"76\">1</text><line class=\"grid\" x1=\"290\" y1=\"4\" x2=\"290\" y2=\"64\"/><path class=\"sig\" d=\"M34 56 L50 56 L50 12 L66 12 L82 12 L82 56 L98 56 L114 56 L114 12 L130 12 L130 56 L146 56 L146 12 L162 12 L178 12 L178 56 L194 56 L194 12 L210 12 L210 56 L226 56 L242 56 L242 12 L258 12 L274 12 L274 56 L290 56\"/></svg><p style=\"margin:10px 0 2px\"><b>Miller</b> · <span class=\"small muted\">1 → transition au milieu ; 0 → transition en fin de bit seulement si le bit suivant est 0</span></p><svg viewBox=\"0 0 298 82\" style=\"max-width:417.2px;width:100%\" role=\"img\" aria-label=\"Chronogramme Miller de 01001101\"><text class=\"tx\" x=\"0\" y=\"16\">+V</text><text class=\"tx\" x=\"6\" y=\"38\">0</text><text class=\"tx\" x=\"0\" y=\"60\">−V</text><line class=\"axis\" x1=\"34\" y1=\"34\" x2=\"294\" y2=\"34\"/><line class=\"grid\" x1=\"34\" y1=\"4\" x2=\"34\" y2=\"64\"/><text class=\"tx\" x=\"47\" y=\"76\">0</text><line class=\"grid\" x1=\"66\" y1=\"4\" x2=\"66\" y2=\"64\"/><text class=\"tx\" x=\"79\" y=\"76\">1</text><line class=\"grid\" x1=\"98\" y1=\"4\" x2=\"98\" y2=\"64\"/><text class=\"tx\" x=\"111\" y=\"76\">0</text><line class=\"grid\" x1=\"130\" y1=\"4\" x2=\"130\" y2=\"64\"/><text class=\"tx\" x=\"143\" y=\"76\">0</text><line class=\"grid\" x1=\"162\" y1=\"4\" x2=\"162\" y2=\"64\"/><text class=\"tx\" x=\"175\" y=\"76\">1</text><line class=\"grid\" x1=\"194\" y1=\"4\" x2=\"194\" y2=\"64\"/><text class=\"tx\" x=\"207\" y=\"76\">1</text><line class=\"grid\" x1=\"226\" y1=\"4\" x2=\"226\" y2=\"64\"/><text class=\"tx\" x=\"239\" y=\"76\">0</text><line class=\"grid\" x1=\"258\" y1=\"4\" x2=\"258\" y2=\"64\"/><text class=\"tx\" x=\"271\" y=\"76\">1</text><line class=\"grid\" x1=\"290\" y1=\"4\" x2=\"290\" y2=\"64\"/><path class=\"sig\" d=\"M34 12 L50 12 L66 12 L82 12 L82 56 L98 56 L114 56 L130 56 L130 12 L146 12 L162 12 L178 12 L178 56 L194 56 L210 56 L210 12 L226 12 L242 12 L258 12 L274 12 L274 56 L290 56\"/></svg></div>\n  <div class=\"trap\"><b>Piège Manchester</b>Ton cours : 0 = bas → haut, 1 = haut → bas. La norme IEEE 802.3 utilise la convention inverse. À l'examen, applique celle du cours. Pour Miller, le niveau de départ est une convention (ici +V) : seules les transitions comptent.</div>\n  <h3>Modes de transmission</h3>\n  <ul><li><b>Simplex</b> : un seul sens (télévision). <b>Half duplex</b> : deux sens, un seul émetteur à la fois (radio de police). <b>Full duplex</b> : deux sens simultanés (téléphone).</li>\n  <li><b>Série</b> : bits transmis un par un. <b>Parallèle</b> : plusieurs bits en même temps.</li></ul>\n  <h3>Supports et câbles</h3>\n  <p>Cuivre, fibre optique, sans fil. <b>STP</b> (paires torsadées blindées) : 10 à 10 000 Mbit/s, 100 m max, RJ45, moyennement cher. <b>RJ45</b> : en 10/100 Mbit/s on utilise les broches 1-2 et 3-6 ; en 1 Gbit/s, les 8 broches. Les normes <b>T568A</b> et <b>T568B</b> n'inversent que les paires 2 (orange) et 3 (vert) ; la plupart des câbles sont en T568B.</p>\n  <div class=\"table-wrap\"><table><thead><tr><th>Câble</th><th>Usage</th></tr></thead><tbody>\n  <tr><td><b>Droit</b></td><td>Équipements différents : PC ↔ switch, switch ↔ routeur</td></tr>\n  <tr><td><b>Croisé</b></td><td>Équipements de même type : PC ↔ PC, switch ↔ switch, routeur ↔ routeur, et aussi PC ↔ routeur</td></tr>\n  <tr><td><b>Console (inversé)</b></td><td>PC ↔ port console, pour configurer un routeur ou un switch</td></tr></tbody></table></div>\n  <p class=\"small muted\">Les schémas de câblage droit/croisé des diapos 127-129 sont des images. Le tableau ci-dessus suit la règle Cisco classique (certitude élevée).</p>\n  <h3>Normes sans fil</h3>\n  <p><b>802.15</b> Bluetooth (PAN, 1 à 100 m) · <b>802.11</b> Wi-Fi (WLAN, CSMA/CA) · <b>802.16</b> WiMAX (point-à-multipoint, accès large bande) · <b>GSM/GPRS</b> (données sur réseau mobile).</p><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 10 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Dans le codage NRZ du cours, le bit 0 est représenté par…</div><button class=\"opt\" data-o=\"0\">0 V</button><button class=\"opt\" data-o=\"1\">−V</button><button class=\"opt\" data-o=\"2\">+V</button><button class=\"opt\" data-o=\"3\">Une transition</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Manchester (convention du cours) : le bit 1 est…</div><button class=\"opt\" data-o=\"0\">Une transition du bas vers le haut au milieu</button><button class=\"opt\" data-o=\"1\">Une transition du haut vers le bas au milieu</button><button class=\"opt\" data-o=\"2\">+V sur tout le bit</button><button class=\"opt\" data-o=\"3\">Pas de transition</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Le codage bipolaire représente les 1 par…</div><button class=\"opt\" data-o=\"0\">Toujours +V</button><button class=\"opt\" data-o=\"1\">Alternativement +V et −V</button><button class=\"opt\" data-o=\"2\">0 V</button><button class=\"opt\" data-o=\"3\">Une transition au milieu</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">La radio de police est un exemple de transmission…</div><button class=\"opt\" data-o=\"0\">Simplex</button><button class=\"opt\" data-o=\"1\">Half duplex</button><button class=\"opt\" data-o=\"2\">Full duplex</button><button class=\"opt\" data-o=\"3\">Parallèle</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Pour relier deux PC directement, on utilise un câble…</div><button class=\"opt\" data-o=\"0\">Droit</button><button class=\"opt\" data-o=\"1\">Croisé</button><button class=\"opt\" data-o=\"2\">Console</button><button class=\"opt\" data-o=\"3\">Coaxial obligatoirement</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Pour configurer un routeur neuf depuis un PC, on utilise un câble…</div><button class=\"opt\" data-o=\"0\">Droit</button><button class=\"opt\" data-o=\"1\">Croisé</button><button class=\"opt\" data-o=\"2\">Console (inversé)</button><button class=\"opt\" data-o=\"3\">Fibre</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">La norme IEEE de Bluetooth est…</div><button class=\"opt\" data-o=\"0\">802.3</button><button class=\"opt\" data-o=\"1\">802.11</button><button class=\"opt\" data-o=\"2\">802.15</button><button class=\"opt\" data-o=\"3\">802.16</button><div class=\"qq-e\" hidden></div></div></section>","ex":[],"qcm":[{"n":"n32","q":"Dans le codage NRZ du cours, le bit 0 est représenté par…","o":["0 V","−V","+V","Une transition"],"a":1,"e":"NRZ : 0 → −V, 1 → +V. En « tout ou rien », 0 → 0 V."},{"n":"n32","q":"Manchester (convention du cours) : le bit 1 est…","o":["Une transition du bas vers le haut au milieu","Une transition du haut vers le bas au milieu","+V sur tout le bit","Pas de transition"],"a":1,"e":"Selon ton prof : 0 = bas → haut, 1 = haut → bas. Attention, la norme IEEE 802.3 utilise la convention inverse : à l&#39;examen, suis le cours."},{"n":"n32","q":"Le codage bipolaire représente les 1 par…","o":["Toujours +V","Alternativement +V et −V","0 V","Une transition au milieu"],"a":1,"e":"Bipolaire : 0 → 0 ; les 1 alternent +V et −V."},{"n":"n33","q":"La radio de police est un exemple de transmission…","o":["Simplex","Half duplex","Full duplex","Parallèle"],"a":1,"e":"Deux sens, mais un seul émetteur à la fois : half duplex (à l&#39;alternat)."},{"n":"n33","q":"Pour relier deux PC directement, on utilise un câble…","o":["Droit","Croisé","Console","Coaxial obligatoirement"],"a":1,"e":"Équipements de même type → câble croisé."},{"n":"n33","q":"Pour configurer un routeur neuf depuis un PC, on utilise un câble…","o":["Droit","Croisé","Console (inversé)","Fibre"],"a":2,"e":"Le câble console (inversé) relie le PC au port console du routeur."},{"n":"n33","q":"La norme IEEE de Bluetooth est…","o":["802.3","802.11","802.15","802.16"],"a":2,"e":"802.15 Bluetooth (PAN) ; 802.11 Wi-Fi ; 802.16 WiMAX ; 802.3 Ethernet."}]},{"id":"s13","t":"Ch2 · Couche réseau et ICMP","seance":"Chapitre 2","imp":4,"html":"<p><b>Rôle :</b> acheminer les paquets d'un réseau à un autre, de la source à la destination. <b>Fonctions :</b> adressage IP (IPv4, IPv6), routage (meilleur chemin), fragmentation selon la MTU, détection des erreurs d'acheminement (ICMP). <b>Protocoles :</b> IP, ICMP, RIP, OSPF, BGP. <b>Équipements :</b> routeurs, pare-feux L3.</p>\n  <p><b>IPv4 :</b> sans connexion · au mieux (peu fiable) · indépendant des médias. Chaque routeur examine l'adresse IP de destination ; chaque tronçon jusqu'au périphérique suivant est un <b>saut</b>.</p>\n  <p><b>Domaine de diffusion :</b> zone où chaque machine peut joindre directement toutes les autres sans passer par un routeur. <b>Passerelle par défaut :</b> l'interface du routeur connectée au LAN, qui sert de sortie ; tous les hôtes d'un même réseau ont la même. Sans elle, un hôte ne communique que dans son réseau local. (Linux : <code>netstat -rn</code>.)</p>\n  <h3>ICMP (RFC 792)</h3>\n  <div class=\"table-wrap\"><table><thead><tr><th>Type</th><th>Message</th><th>Usage</th></tr></thead><tbody>\n  <tr><td class=\"num\">0</td><td>Echo Reply</td><td>Réponse au ping</td></tr>\n  <tr><td class=\"num\">3</td><td>Destination Unreachable</td><td>Code 0 réseau, 1 hôte, 3 port injoignable</td></tr>\n  <tr><td class=\"num\">5</td><td>Redirect</td><td>Redirection vers un autre routeur</td></tr>\n  <tr><td class=\"num\">8</td><td>Echo Request</td><td>Requête ping</td></tr>\n  <tr><td class=\"num\">11</td><td>Time Exceeded</td><td>TTL expiré (utilisé par traceroute)</td></tr></tbody></table></div>\n  <p>En-tête ICMP de 8 octets (type, code, checksum, reste) ; il est encapsulé dans IP (protocole n° 1). Une erreur sur un message ICMP ne génère jamais d'autre message ICMP. <b>Sécurité :</b> Ping Flood, Ping of Death, tunneling ICMP ; parades : filtrage au pare-feu, rate limiting.</p>\n  <h3>ARP : retrouver une adresse MAC à partir d'une IP (TD 2, ex. 7)</h3>\n  <ul>\n    <li>Pour envoyer à une IP du <b>même réseau</b>, l'hôte cherche d'abord la MAC dans sa table ARP. S'il ne la connaît pas, il <b>diffuse</b> une requête ARP (« qui a cette IP ? ») avec la MAC de destination FF:FF:FF:FF:FF:FF. Seule la machine concernée répond, en envoyant directement sa MAC.</li>\n    <li>La requête se propage dans tout le <b>domaine de diffusion</b> (le réseau local : tous les ports du switch). Un routeur branché sur ce même switch la reçoit aussi, puisqu'il est dans le LAN, mais il ne la retransmet pas vers un autre réseau.</li>\n    <li>Pour une IP d'un <b>autre réseau</b>, l'hôte fait l'ARP de sa <b>passerelle par défaut</b>, pas celui de la destination.</li>\n  </ul>\n  <h3>ICMP : compléments du TD 2</h3>\n  <ul>\n    <li><b>ping</b> : une réponse (Echo Reply, type 0) prouve que la machine est joignable et que sa pile IP fonctionne. Un silence ne prouve pas toujours une panne : un pare-feu peut bloquer l'ICMP.</li>\n    <li><b>Destination inconnue</b> : un routeur qui n'a pas de route détruit le paquet et renvoie un <b>Destination Unreachable</b> (type 3). Le message contient l'<b>en-tête IP du paquet fautif et les 8 premiers octets de ses données</b>, pour que l'émetteur sache quelle communication a échoué.</li>\n    <li><b>Lire la sortie de traceroute</b> : chaque ligne donne le saut, l'adresse du routeur et <b>trois temps</b> : les <b>temps aller-retour (RTT)</b> de 3 sondes vers ce saut, pas des durées cumulées d'un saut au suivant. Le temps total jusqu'à la destination est celui de la dernière ligne (environ la moyenne de ses trois mesures). « <b>* * *</b> » : aucune réponse avant la fin du délai (routeur qui filtre l'ICMP, ou paquets perdus) ; la route n'est pas forcément coupée, car les sauts suivants peuvent répondre.</li>\n  </ul><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 12 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">IPv4 est dit « au mieux » car…</div><button class=\"opt\" data-o=\"0\">Il garantit la livraison</button><button class=\"opt\" data-o=\"1\">Il n&#39;utilise aucune surcharge pour garantir la transmission</button><button class=\"opt\" data-o=\"2\">Il chiffre les paquets</button><button class=\"opt\" data-o=\"3\">Il établit une connexion</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Un ping envoie un ICMP de type…</div><button class=\"opt\" data-o=\"0\">0</button><button class=\"opt\" data-o=\"1\">3</button><button class=\"opt\" data-o=\"2\">8</button><button class=\"opt\" data-o=\"3\">11</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\">
