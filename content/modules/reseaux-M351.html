ccessible). Le routeur détruit le paquet.<br><b>b)</b> Il contient le type, le code et le checksum ICMP, puis <b>l&#39;en-tête IP du paquet qui a échoué et les 8 premiers octets de ses données</b> (de quoi retrouver les ports TCP/UDP), pour que l&#39;émetteur sache quelle communication a échoué.<br>(Corrigé rédigé ici, certitude élevée.)</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"52\"><div class=\"ex-q\"><p><strong>T2.7.5.</strong> On exécute traceroute <a href=\"http://www.google.com\">www.google.com</a> et on obtient : 1) 192.168.1.1  1.123 / 1.034 / 1.110 ms · 2) 10.0.0.1  10.234 / 9.987 / 10.012 ms · 3) * * * · 4) 172.16.5.1  25.234 / 25.876 / 25.540 ms · 5) 8.8.8.8  30.123 / 30.010 / 30.222 ms. a) Rôle de traceroute ? b) Que représentent les trois colonnes de temps ? c) Que signifient les étoiles ? d) Quel est le temps total aller-retour approximatif jusqu&#39;à la destination ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Pense au champ TTL, qui baisse de 1 à chaque routeur.</p>\n</div><div class=\"ex-c\" hidden><p><b>a)</b> Il <b>découvre la route</b> : il envoie des paquets avec un TTL de 1, 2, 3… Le routeur qui fait tomber le TTL à 0 détruit le paquet et renvoie un message ICMP <b>Time Exceeded</b> (type 11) : l&#39;émetteur apprend ainsi l&#39;adresse de chaque saut. Le dernier saut est la destination, qui répond directement.<br><b>b)</b> Les <b>temps aller-retour (RTT)</b> de 3 sondes envoyées vers ce saut, en millisecondes. Ce ne sont pas des temps cumulés d&#39;un saut au suivant : chacun mesure le trajet complet jusqu&#39;à ce routeur et retour.<br><b>c)</b> <b>* * *</b> : aucune réponse avant la fin du délai. Ce routeur ne renvoie pas d&#39;ICMP (filtre ou limitation) ou les paquets ont été perdus. La route n&#39;est pas coupée, puisque les sauts 4 et 5 répondent.<br><b>d)</b> Environ <b>30 ms</b> : la moyenne des trois mesures du dernier saut (8.8.8.8) vaut (30,123 + 30,010 + 30,222) / 3 ≈ 30,12 ms.<br>(Corrigé rédigé ici, certitude élevée.)</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><section class=\"exo\"><h3>TD 3 · Exercice 1 · Délimitation des trames</h3><div class=\"ex\" data-x=\"53\"><div class=\"ex-q\"><p><strong>T3.1.1.</strong> On émet le texte « La couche liaison est la couche numéro 2. ». La délimitation des trames se fait par comptage de caractères, avec des blocs de 4 caractères. Donner la chaîne réellement émise.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Découpe le texte en blocs de 4 caractères : les espaces et le point comptent. Devant chaque bloc, on écrit sa longueur, en comptant aussi le caractère de comptage lui-même.</p>\n</div><div class=\"ex-c\" hidden><p>Le texte fait <b>41 caractères</b> (espaces et point compris) : 10 blocs de 4, puis 1 bloc de 1.<br>Blocs : [La c] [ouch] [e li] [aiso] [n es] [t la] [ cou] [che ] [numé] [ro 2] [.]<br>Devant chaque bloc, le compteur indique la taille de la trame, compteur compris : 4 + 1 = <b>5</b>, et 1 + 1 = <b>2</b> pour le dernier bloc.<br><b>Chaîne émise : 5La c5ouch5e li5aiso5n es5t la5 cou5che 5numé5ro 22.</b><br>Si en classe le compteur ne compte que les données, on écrit 4 au lieu de 5 et 1 au lieu de 2 : 4La c4ouch4e li… 4ro 21.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"54\"><div class=\"ex-q\"><p><strong>T3.1.2.</strong> Données à émettre : 0011 0111 0111 1110 0001 0001 1011 1110 (377E11BE en hexadécimal). La délimitation utilise la transparence binaire (bit stuffing). Rappeler brièvement son principe.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Quelle suite de bits sert de fanion ? Comment éviter qu&#39;elle apparaisse dans les données ?</p>\n</div><div class=\"ex-c\" hidden><p>Chaque trame commence et finit par un <b>fanion 01111110</b>. Pour que ce motif n&#39;apparaisse jamais dans les données, l&#39;émetteur <b>insère un 0 après chaque suite de cinq 1 consécutifs</b>. Le récepteur fait l&#39;inverse : il supprime le 0 qui suit cinq 1. Six 1 d&#39;affilée ne peuvent donc venir que d&#39;un fanion.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"55\"><div class=\"ex-q\"><p><strong>T3.1.3.</strong> Quelles données observerait-on alors sur la voie physique ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Repère les suites de cinq 1 consécutifs (il y en a deux), insère un 0 après chacune, puis ajoute les fanions.</p>\n</div><div class=\"ex-c\" hidden><p>Données : 0011 0111 0111 1110 0001 0001 1011 1110<br>1re suite : « 0111 1110 » contient six 1 → on insère un 0 après le cinquième : 0111 11<b>0</b>1 0<br>2e suite : « 1011 1110 » contient cinq 1 → 0 inséré : 1011 111<b>0</b>1 0<br>Après insertion (34 bits) : 0011 0111 0111 11<b>0</b>10 0001 0001 1011 111<b>0</b>10<br><b>Sur la voie physique, avec les fanions :</b><br><b>01111110</b> 0011011101111101000010001101111100 <b>01111110</b></p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><section class=\"exo\"><h3>TD 3 · Exercice 2 · Bit de parité impaire</h3><div class=\"ex\" data-x=\"56\"><div class=\"ex-q\"><p><strong>T3.2.1.</strong> Message « NET » ; chaque caractère est protégé par un bit de parité impaire. Codes ASCII 7 bits donnés : N = 1001110, E = 1001001, T = 1010100. Donner la représentation binaire du message transmis.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Parité impaire : le nombre TOTAL de 1 (données + bit de parité) doit être impair. Compte les 1 de chaque code, puis ajoute le bit à droite.</p>\n</div><div class=\"ex-c\" hidden><p>N = 1001110 : quatre 1 (pair) → bit de parité <b>1</b> → <b>10011101</b> (cinq 1)<br>E = 1001001 : trois 1 (impair) → bit <b>0</b> → <b>10010010</b> (trois 1)<br>T = 1010100 : trois 1 (impair) → bit <b>0</b> → <b>10101000</b> (trois 1)<br><b>Message transmis : 10011101 10010010 10101000</b> (24 bits)<br>Remarque : le code donné pour E (1001001) est en réalité celui de « I ». Le vrai code de E est 1000101 ; il contient aussi trois 1, donc le bit de parité reste 0 (E → 10001010).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><section class=\"exo\"><h3>TD 3 · Exercice 3 · VRC et LRC (« Bonjour »)</h3><div class=\"ex\" data-x=\"57\"><div class=\"ex-q\"><p><strong>T3.3.1.</strong> Message M = « Bonjour » (ASCII 7 bits : B 42, j 6A, n 6E, o 6F, r 72, u 75). Quel est le message transmis avec un VRC pair ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Convertis chaque code hexadécimal en 7 bits, puis ajoute à chaque caractère un bit qui rend le nombre de 1 pair.</p>\n</div><div class=\"ex-c\" hidden><p>B 42 = 1000010 → 2 uns → <b>10000100</b><br>o 6F = 1101111 → 6 uns → <b>11011110</b><br>n 6E = 1101110 → 5 uns → <b>11011101</b><br>j 6A = 1101010 → 4 uns → <b>11010100</b><br>o 6F = 1101111 → <b>11011110</b><br>u 75 = 1110101 → 5 uns → <b>11101011</b><br>r 72 = 1110010 → 4 uns → <b>11100100</b><br>Message : 10000100 11011110 11011101 11010100 11011110 11101011 11100100</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"58\"><div class=\"ex-q\"><p><strong>T3.3.2.</strong> Quel est le message transmis avec un LRC impair ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Écris les 7 caractères les uns sous les autres. Pour chaque colonne de bits, ajoute un bit qui rend le nombre de 1 de la colonne impair : on obtient un caractère de contrôle envoyé à la fin.</p>\n</div><div class=\"ex-c\" hidden><p>Tableau (7 bits par ligne) :<br>B 1000010<br>o 1101111<br>n 1101110<br>j 1101010<br>o 1101111<br>u 1110101<br>r 1110010<br>Nombre de 1 par colonne : 7, 6, 2, 4, 4, 6, 3<br>LRC impair (rendre chaque colonne impaire) : <b>0111110</b> (0x3E)<br><b>Message : les 7 caractères (1000010 1101111 1101110 1101010 1101111 1110101 1110010) suivis de 0111110</b></p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"59\"><div class=\"ex-q\"><p><strong>T3.3.3.</strong> Quel est le message transmis avec un VRC pair + LRC pair ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Combine les deux : chaque ligne reçoit son bit de parité paire (question 1), puis on calcule la parité paire de chaque colonne, y compris la colonne des bits de parité.</p>\n</div><div class=\"ex-c\" hidden><p>Lignes avec VRC pair (question 1) :<br>10000100 · 11011110 · 11011101 · 11010100 · 11011110 · 11101011 · 11100100<br>LRC pair sur les 8 colonnes : <b>10000010</b><br>(les 7 premiers bits 1000001 sont l&#39;inverse du LRC impair ; le 8e bit, 0, est la parité de la colonne des VRC, et il rend aussi la ligne LRC paire)<br><b>Message : les 7 caractères avec VRC, suivis de 10000010</b></p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><section class=\"exo\"><h3>TD 3 · Exercice 4 · CRC avec G(x) = x⁴ + x² + x</h3><div class=\"ex\" data-x=\"60\"><div class=\"ex-q\"><p><strong>T3.4.1.</strong> Polynôme générateur G(x) = x⁴ + x² + x. On veut transmettre 1111011101 : quel CRC faut-il ajouter ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>G(x) = 1·x⁴ + 0·x³ + 1·x² + 1·x + 0 → 10110 (degré 4). Ajoute 4 zéros au message, puis fais la division par XOR.</p>\n</div><div class=\"ex-c\" hidden><p>G = <b>10110</b> (degré 4) → on ajoute 4 zéros : 11110111010000<br>Division (XOR) :<br><span style=\"font-family:var(--mono)\">11110111010000<br>10110<br>-----<br> 1000111010000<br> 10110<br> -----<br>   11111010000<br>   10110<br>   -----<br>    1001010000<br>    10110<br>    -----<br>      10010000<br>      10110<br>      -----<br>        100000<br>        10110<br>        -----<br>          1100</span><br><b>CRC = 1100</b> → message transmis : <b>11110111011100</b></p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"61\"><div class=\"ex-q\"><p><strong>T3.4.2.</strong> Même question avec le mot 1100010101.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Même méthode : 1100010101 suivi de 0000, divisé par 10110.</p>\n</div><div class=\"ex-c\" hidden><p>1100010101 + 0000 = 11000101010000<br>Division (XOR) :<br><span style=\"font-family:var(--mono)\">11000101010000<br>10110<br>-----<br> 1110101010000<br> 10110<br> -----<br>  101101010000<br>  10110<br>  -----<br>       1010000<br>       10110<br>       -----<br>          1000</span><br><b>CRC = 1000</b> → message transmis : <b>11000101011000</b></p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"62\"><div class=\"ex-q\"><p><strong>T3.4.3.</strong> À la réception, on a : a. 1111000101010 ; b. 11000101010110. Sont-ils corrects ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>À la réception on divise le message reçu ENTIER (sans ajouter de zéros) par G. Reste nul = pas d&#39;erreur détectée.</p>\n</div><div class=\"ex-c\" hidden><p>a. 1111000101010 ÷ 10110 → reste <b>0000</b> → <b>correct</b> (aucune erreur détectée)<br>b. 11000101010110 ÷ 10110 → reste <b>1110</b> ≠ 0 → <b>incorrect</b> (erreur détectée)<br>Remarque : b fait 14 bits au lieu de 10 + 4 = 14 ; c&#39;est bien la bonne longueur, mais le reste n&#39;est pas nul.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><section class=\"exo\"><h3>TD 3 · Exercice 5 · Code de Hamming (7,4)</h3><div class=\"ex\" data-x=\"63\"><div class=\"ex-q\"><p><strong>T3.5.1.</strong> On veut envoyer le message 1010. Compléter le mot de Hamming correspondant.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Convention du cours : C0 C1 U0 C2 U1 U2 U3 (bits de contrôle aux positions 1, 2 et 4). C0 = U0⊕U1⊕U3, C1 = U0⊕U2⊕U3, C2 = U1⊕U2⊕U3.</p>\n</div><div class=\"ex-c\" hidden><p>U0 U1 U2 U3 = 1 0 1 0<br>C0 = U0⊕U1⊕U3 = 1⊕0⊕0 = <b>1</b><br>C1 = U0⊕U2⊕U3 = 1⊕1⊕0 = <b>0</b><br>C2 = U1⊕U2⊕U3 = 0⊕1⊕0 = <b>1</b><br>Mot (C0 C1 U0 C2 U1 U2 U3) = <b>1011010</b></p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"64\"><div class=\"ex-q\"><p><strong>T3.5.2.</strong> Y a-t-il une erreur dans le mot suivant : 1010110 ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Recalcule les trois contrôles sur les positions (1,3,5,7), (2,3,6,7) et (4,5,6,7). Le numéro de la position fausse = somme des poids des contrôles faux (1, 2, 4).</p>\n</div><div class=\"ex-c\" hidden><p>Positions : 1:1  2:0  3:1  4:0  5:1  6:1  7:0<br>Contrôle 1 (positions 1,3,5,7) : 1⊕1⊕1⊕0 = <b>1</b> → faux (poids 1)<br>Contrôle 2 (positions 2,3,6,7) : 0⊕1⊕1⊕0 = 0 → juste<br>Contrôle 4 (positions 4,5,6,7) : 0⊕1⊕1⊕0 = 0 → juste<br><b>Oui, il y a une erreur, en position 1</b> (le bit de contrôle C0).<br>Mot corrigé : <b>0010110</b> ; les données U0 U1 U2 U3 = <b>1110</b> ne sont pas touchées.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section>","ex":[{"n":"n21","rep":null,"tol":null},{"n":"n21","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n28","rep":null,"tol":null},{"n":"n9","rep":null,"tol":null},{"n":"n28","rep":null,"tol":null},{"n":"n28","rep":null,"tol":null},{"n":"n23","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n26","rep":null,"tol":null},{"n":"n22","rep":null,"tol":null},{"n":"n24","rep":null,"tol":null},{"n":"n15","rep":null,"tol":null},{"n":"n7","rep":null,"tol":null},{"n":"n10","rep":null,"tol":null},{"n":"n8","rep":null,"tol":null},{"n":"n13","rep":null,"tol":null},{"n":"n13","rep":null,"tol":null},{"n":"n13","rep":null,"tol":null},{"n":"n10","rep":null,"tol":null},{"n":"n27","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n13","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n22","rep":null,"tol":null},{"n":"n24","rep":null,"tol":null},{"n":"n26","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n5","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n8","rep":null,"tol":null},{"n":"n41","rep":null,"tol":null},{"n":"n39","rep":null,"tol":null},{"n":"n42","rep":null,"tol":null},{"n":"n42","rep":null,"tol":null},{"n":"n42","rep":null,"tol":null},{"n":"n39","rep":null,"tol":null},{"n":"n42","rep":null,"tol":null},{"n":"n42","rep":null,"tol":null},{"n":"n43","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n36","rep":null,"tol":null},{"n":"n36","rep":null,"tol":null},{"n":"n36","rep":null,"tol":null},{"n":"n29","rep":null,"tol":null},{"n":"n29","rep":null,"tol":null},{"n":"n29","rep":null,"tol":null},{"n":"n29","rep":null,"tol":null},{"n":"n30","rep":null,"tol":null},{"n":"n30","rep":null,"tol":null},{"n":"n30","rep":null,"tol":null},{"n":"n31","rep":null,"tol":null},{"n":"n31","rep":null,"tol":null}],"qcm":[]},{"id":"tp1","t":"TP 1 · ping, tracert, DNS, HTTP (Wireshark)","seance":"Travaux dirigés et pratiques","imp":4,"html":"<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p>Cherche d&#39;abord seul, ouvre l&#39;indice si tu bloques, puis compare avec le corrigé et note-toi honnêtement : ta réponse compte dans la maîtrise de la notion.</p>\n</aside><section class=\"exo\"><h3>VII.2-3 · Commande ping (capture : ping -n 10 <a href=\"http://www.google.fr\">www.google.fr</a>)</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p><strong>7a1.</strong> a1) Quels sont les protocoles indiqués dans la colonne Protocol ? (Les paquets ICMP sont-ils précédés de DNS ?)</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Colonne « Protocol » de la liste. Filtre utile : icmp || dns</p>\n</div><div class=\"ex-c\" hidden><p>Tu dois voir surtout <b>DNS</b> puis <b>ICMP</b>. Avant de pinguer, le PC demande l&#39;adresse IP de <a href=\"http://www.google.fr\">www.google.fr</a> au DNS (requête puis réponse), et c&#39;est seulement ensuite qu&#39;il envoie les pings. D&#39;autres protocoles de fond peuvent apparaître (ARP, TLS, TCP, UDP, QUIC, MDNS, SSDP) : c&#39;est le trafic normal de ta machine.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p><strong>7a2.</strong> a2) Relever l&#39;adresse IP renvoyée avec la réponse DNS.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Filtre : dns.flags.response == 1. Dans le détail : Domain Name System (response) → Answers → <a href=\"http://www.google.fr\">www.google.fr</a>: type A, addr …</p>\n</div><div class=\"ex-c\" hidden><p>C&#39;est l&#39;enregistrement de <b>type A</b> dans « Answers » (une adresse IPv4 de Google, du type 142.250.x.x ou 216.58.x.x). Vérification : c&#39;est la même que celle que la console affiche entre crochets [ ] au début du ping.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p><strong>7b1.</strong> b1) Premier Echo Request : adresse IP destination ? Valeur du champ Protocol Type ? Valeur du champ Time To Live ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Filtre : icmp.type == 8, premier paquet. Développe « Internet Protocol Version 4 ».</p>\n</div><div class=\"ex-c\" hidden><p><b>Destination</b> = l&#39;IP de Google relevée en a2.<br><b>Protocol</b> = <b>1 (ICMP)</b> : c&#39;est ce champ de l&#39;en-tête IP qui dit que la charge est de l&#39;ICMP (6 = TCP, 17 = UDP).<br><b>TTL = 128</b> si tu es sous Windows (64 sous Linux ou macOS) : c&#39;est la valeur de départ choisie par ton système.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p><strong>7b2.</strong> b2) Type de message ICMP ? Identificateur ? Numéro de séquence ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Développe « Internet Control Message Protocol ».</p>\n</div><div class=\"ex-c\" hidden><p><b>Type 8 (Echo request), code 0</b>.<br><b>Identifier</b> : un numéro fixe pour toute la commande ping (sous Windows, souvent 0x0001). Wireshark l&#39;affiche en BE et en LE, deux ordres de lecture des octets.<br><b>Sequence number</b> : il augmente de 1 à chaque ping (10 valeurs pour -n 10).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p><strong>7b3.</strong> b3) Sélectionner les octets de données de la requête et les comparer avec l&#39;affichage brut.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Clique sur « Data » dans l&#39;ICMP : les octets se surlignent dans la zone du bas (hexa + ASCII).</p>\n</div><div class=\"ex-c\" hidden><p>Sous Windows, ping envoie <b>32 octets</b> de remplissage : abcdefghijklmnopqrstuvwabcdefghi. En hexa : 61 62 63 64… (le code ASCII de a, b, c, d…). C&#39;est la démonstration du TP : la zone du milieu (champs décodés) et la zone du bas (octets bruts) montrent la même chose, sous deux formes.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p><strong>7c1.</strong> c1) Premier Echo Reply : adresses IP source et destination ? Champ Protocol Type ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Filtre : icmp.type == 0. Le premier paquet.</p>\n</div><div class=\"ex-c\" hidden><p>Elles sont <b>inversées</b> par rapport à la requête : <b>source = Google</b>, <b>destination = ton PC</b>. Protocol = <b>1 (ICMP)</b>.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><p><strong>7c2.</strong> c2) Valeur du champ Time To Live de la réponse ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Internet Protocol → Time to Live, dans l&#39;Echo Reply.</p>\n</div><div class=\"ex-c\" hidden><p>Elle est <b>plus petite qu&#39;une valeur ronde</b> (ex. 117 ou 118). Le serveur l&#39;a envoyée avec un TTL de départ (souvent 128 ou 64), et chaque routeur traversé a retiré 1. Estimation du nombre de sauts = la valeur de départ juste au-dessus − le TTL reçu (ex. 128 − 117 = 11 routeurs).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"7\"><div class=\"ex-q\"><p><strong>7c3.</strong> c3) Type de message ICMP de la réponse ? Comparer l&#39;identificateur et le numéro de séquence avec ceux de la requête.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>ICMP de l&#39;Echo Reply. Wireshark ajoute un lien « [Request frame: …] ».</p>\n</div><div class=\"ex-c\" hidden><p><b>Type 0 (Echo reply), code 0</b>. L&#39;identifiant et le numéro de séquence sont <b>identiques</b> à ceux de la requête correspondante : c&#39;est comme ça que ping associe chaque réponse à sa requête et calcule le temps aller-retour.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"8\"><div class=\"ex-q\"><p><strong>7c4.</strong> c4) Comparer les données de la réponse avec celles de la requête.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Clique sur « Data » de l&#39;Echo Reply.</p>\n</div><div class=\"ex-c\" hidden><p>Les données sont <b>exactement les mêmes</b> (abcdef…). L&#39;Echo Reply renvoie à l&#39;identique ce qu&#39;il a reçu, d&#39;où le nom « écho ».</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><section class=\"exo\"><h3>VII.4-5 · Commande tracert (capture : tracert <a href=\"http://www.google.fr\">www.google.fr</a>)</h3><div class=\"ex\" data-x=\"9\"><div class=\"ex-q\"><p><strong>75a1.</strong> a1) Quels sont les protocoles indiqués dans la colonne Protocol ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Filtre : icmp || dns</p>\n</div><div class=\"ex-c\" hidden><p><b>DNS</b> (au début, pour l&#39;IP de Google, puis des requêtes « PTR » pour retrouver le nom de chaque routeur) et <b>ICMP</b> : des <b>Echo Request</b> envoyés par ton PC, et des <b>Time-to-live exceeded (type 11)</b> renvoyés par chaque routeur, puis des Echo Reply du serveur final.<br>⚠ Sous Windows, tu ne verras pas d&#39;UDP : tracert utilise ICMP. C&#39;est traceroute, sous Linux, qui envoie de l&#39;UDP (ports 33434 et plus), et c&#39;est de lui que parle l&#39;énoncé.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"10\"><div class=\"ex-q\"><p><strong>75b1.</strong> b1) Premier paquet envoyé par tracert : adresse IP destination ? Champ Protocol Type ? Time To Live ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Filtre : icmp.type == 8 (Windows) ou udp (Linux). Le premier paquet.</p>\n</div><div class=\"ex-c\" hidden><p><b>Destination</b> = l&#39;IP de Google. <b>Protocol</b> = 1 (ICMP) sous Windows, 17 (UDP) sous Linux. <b>TTL = 1</b> : c&#39;est toute l&#39;astuce. Le 1er routeur met le TTL à 0, détruit le paquet et répond par un ICMP Time Exceeded, ce qui révèle son adresse. Puis tracert recommence avec TTL = 2, 3… (3 paquets par valeur de TTL).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"11\"><div class=\"ex-q\"><p><strong>75b2.</strong> b2) Comparer l&#39;IP destination relevée avec celle de la réponse DNS. Noter les valeurs caractéristiques de l&#39;en-tête IP.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Internet Protocol du 1er paquet tracert.</p>\n</div><div class=\"ex-c\" hidden><p>C&#39;est <b>la même IP</b> que celle donnée par le DNS : tracert vise bien le serveur final. Seul le TTL varie d&#39;un envoi à l&#39;autre. Valeurs à noter : Version 4, Header length 20 octets, Protocol 1 (ou 17), TTL 1, 2, 3…, l&#39;IP source (ton PC) et l&#39;IP destination (Google).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"12\"><div class=\"ex-q\"><p><strong>75b3.</strong> b3) Combien d&#39;octets de données sont présents dans ce message de requête ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Clique sur « Data » : sa longueur est indiquée entre crochets [Length: …].</p>\n</div><div class=\"ex-c\" hidden><p>Lis la valeur dans ta capture. Sous Windows, tracert envoie en général <b>64 octets</b> de données (certitude moyenne), contre 32 pour ping. Sous Linux, traceroute UDP envoie 32 octets. Vérifie avec le calcul : longueur totale IP − 20 (en-tête IP) − 8 (en-tête ICMP ou UDP) = données.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><section class=\"exo\"><h3>VIII.3-a/b · Navigation Web : trame, IP et UDP du 1er message DNS</h3><div class=\"ex\" data-x=\"13\"><div class=\"ex-q\"><p><strong>8a1.</strong> a1) Protocoles de la capture : confirmer la présence de DNS, TCP et HTTP.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Filtre : dns || tcp || http || tls. Statistics → Protocol Hierarchy.</p>\n</div><div class=\"ex-c\" hidden><p>Tu dois voir <b>DNS</b> (résolution de <a href=\"http://www.fpbm.ma\">www.fpbm.ma</a>), <b>TCP</b> (connexion en 3 temps) et <b>HTTP</b>. ⚠ Comme le site passe en HTTPS, tu verras surtout du <b>TLS</b>, et au mieux un seul échange HTTP : la redirection 301. Écris-le dans ton compte-rendu, puis refais la capture avec <a href=\"http://neverssl.com\">http://neverssl.com</a> pour avoir du vrai HTTP.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"14\"><div class=\"ex-q\"><p><strong>8b1.</strong> b1) 1er message DNS du client : adresses MAC (Ethernet) et IP du client ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Filtre : dns.flags.response == 0, premier paquet. Développe « Ethernet II » (Src) et « Internet Protocol » (Src). Vérifie avec ipconfig /all.</p>\n</div><div class=\"ex-c\" hidden><p><b>MAC source</b> = l&#39;adresse physique de TA carte réseau (6 octets, ex. a4:5e:60:…). <b>IP source</b> = ton adresse locale (ex. 192.168.1.x ou 10.x.x.x). Elles doivent correspondre à « Adresse physique » et « Adresse IPv4 » dans ipconfig /all.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"15\"><div class=\"ex-q\"><p><strong>8b2.</strong> b2) Contenu du champ Type de la trame Ethernet ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Ethernet II → Type.</p>\n</div><div class=\"ex-c\" hidden><p><b>0x0800 = IPv4</b>. Ce champ dit à la couche 2 quel protocole de couche 3 est transporté (0x0806 = ARP, 0x86DD = IPv6). C&#39;est le rôle de la sous-couche LLC vu en cours.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"16\"><div class=\"ex-q\"><p><strong>8b3.</strong> b3) Adresses MAC et IP de destination ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Ethernet II → Dst ; Internet Protocol → Dst.</p>\n</div><div class=\"ex-c\" hidden><p><b>MAC destination</b> = la MAC de ta <b>passerelle</b> (la box ou le routeur), pas celle du serveur DNS. <b>IP destination</b> = celle du <b>serveur DNS</b> (souvent l&#39;IP de la passerelle elle-même, ou un DNS public comme 8.8.8.8, ou celui de la fac). Vérifie dans ipconfig /all, ligne « Serveurs DNS ».</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"17\"><div class=\"ex-q\"><p><strong>8b4.</strong> b4) À quelles machines correspondent ces adresses ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Compare avec ipconfig /all (passerelle par défaut et serveurs DNS).</p>\n</div><div class=\"ex-c\" hidden><p>La <b>MAC</b> désigne le <b>prochain saut</b> local, la passerelle, parce que la couche 2 ne livre qu&#39;au voisin direct. L&#39;<b>IP</b> désigne la <b>destination finale</b>, le serveur DNS. C&#39;est la différence couche 2 / couche 3 du cours : la MAC change à chaque saut, l&#39;IP reste la même de bout en bout.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"18\"><div class=\"ex-q\"><p><strong>8b5.</strong> IP b1) Taille de l&#39;en-tête IP ? Longueur totale du paquet ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Internet Protocol → Header Length et Total Length.</p>\n</div><div class=\"ex-c\" hidden><p><b>En-tête = 20 octets</b> (sans options). La <b>longueur totale</b> dépend du nom demandé (en général 50 à 80 octets) : c&#39;est en-tête IP (20) + en-tête UDP (8) + message DNS.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"19\"><div class=\"ex-q\"><p><strong>8b6.</strong> IP b2) Champ Protocol de l&#39;en-tête : numéro et type du protocole transporté ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Internet Protocol → Protocol.</p>\n</div><div class=\"ex-c\" hidden><p><b>17 = UDP</b>. Le DNS passe par UDP, parce que c&#39;est rapide et qu&#39;une petite question-réponse n&#39;a pas besoin de la connexion TCP.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"20\"><div class=\"ex-q\"><p><strong>8b7.</strong> UDP b1) Ports du client et du serveur ? Particularités ? Protocole applicatif ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>User Datagram Protocol → Source Port, Destination Port.</p>\n</div><div class=\"ex-c\" hidden><p><b>Port destination = 53</b> : port réservé (bien connu, entre 0 et 1023) du DNS. <b>Port source</b> = un grand numéro choisi au hasard par le système (port éphémère, au-dessus de 1023, ex. 5xxxx ou 6xxxx). Il sert à reconnaître la conversation au retour. Protocole applicatif : <b>DNS</b>.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"21\"><div class=\"ex-q\"><p><strong>8b8.</strong> UDP b2) Valeur du champ longueur de l&#39;en-tête UDP ? Correspond-elle à l&#39;en-tête IP ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>UDP → Length, à comparer avec IP → Total Length.</p>\n</div><div class=\"ex-c\" hidden><p><b>Longueur UDP = longueur totale IP − 20</b> (l&#39;en-tête IP). Elle inclut les 8 octets d&#39;en-tête UDP et les données DNS. Exemple : IP 62 → UDP 42 → DNS 34 octets. Cela montre l&#39;encapsulation : chaque couche contient la précédente.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><section class=\"exo\"><h3>VIII.3-c · Service DNS (requête puis réponse)</h3><div class=\"ex\" data-x=\"22\"><div class=\"ex-q\"><p><strong>8c1.</strong> Requête c1) Quel champ indique s&#39;il s&#39;agit d&#39;une requête ou d&#39;une réponse ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Domain Name System → Flags → Response.</p>\n</div><div class=\"ex-c\" hidden><p>Le bit <b>QR (Response)</b> dans les Flags : <b>0 = requête (query)</b>, 1 = réponse. Pour une requête standard, les flags valent 0x0100.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"23\"><div class=\"ex-q\"><p><strong>8c2.</strong> Requête c2) Information transportée dans le corps de la requête ? Type et classe ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>DNS → Queries.</p>\n</div><div class=\"ex-c\" hidden><p>Le <b>nom demandé</b> : <a href=\"http://www.fpbm.ma\">www.fpbm.ma</a>. <b>Type A</b> (adresse IPv4 ; tu peux aussi voir une requête AAAA pour IPv6) et <b>classe IN</b> (Internet, 0x0001).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"24\"><div class=\"ex-q\"><p><strong>8c3.</strong> Requête c3) Identificateur de transaction ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>DNS → Transaction ID.</p>\n</div><div class=\"ex-c\" hidden><p>Un nombre sur 16 bits, en hexadécimal (ex. 0x3f2a), choisi par le client. Note ta valeur : tu en auras besoin pour la réponse.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"25\"><div class=\"ex-q\"><p><strong>8c4.</strong> Réponse c1) Adresses MAC et IP attendues pour la réponse ? Vérifier.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Filtre : dns.flags.response == 1, la réponse correspondante.</p>\n</div><div class=\"ex-c\" hidden><p>Tout est <b>inversé</b> : <b>MAC source = la passerelle</b>, <b>MAC destination = ton PC</b> ; <b>IP source = le serveur DNS</b>, <b>IP destination = ton PC</b>. Les ports aussi sont inversés : 53 vers ton port éphémère.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"26\"><div class=\"ex-q\"><p><strong>8c5.</strong> Réponse c2) Taille du paquet IP et du message UDP ? Est-elle plus grande que celle de la requête ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>IP → Total Length et UDP → Length de la réponse.</p>\n</div><div class=\"ex-c\" hidden><p><b>Oui, elle est plus grande</b>. La réponse recopie la question, puis ajoute une ou plusieurs <b>réponses</b> (Answers : CNAME, adresse A…), parfois des serveurs d&#39;autorité. Plus de contenu, donc des longueurs IP et UDP plus grandes.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"27\"><div class=\"ex-q\"><p><strong>8c6.</strong> Réponse c3) Identificateur de transaction de la réponse ? Correspond-il à la requête ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>DNS → Transaction ID de la réponse.</p>\n</div><div class=\"ex-c\" hidden><p><b>Identique</b> à celui de la requête. C&#39;est ce qui permet au client d&#39;associer chaque réponse à sa question, surtout quand plusieurs requêtes partent en même temps. UDP ne le fait pas pour lui, puisqu&#39;il est sans connexion.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><section class=\"exo\"><h3>VIII.3-d · Requête HTTP GET (refais la capture avec <a href=\"http://neverssl.com\">http://neverssl.com</a>)</h3><div class=\"ex\" data-x=\"28\"><div class=\"ex-q\"><p><strong>8d1.</strong> d1) Numéros de séquence et d&#39;acquittement de l&#39;en-tête TCP du GET ? Vérifier qu&#39;ils correspondent aux valeurs attendues.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Filtre : http.request.method == &quot;GET&quot;. TCP → Sequence Number (relative) et Acknowledgment Number. Pour comprendre, regarde les 3 paquets avant : filtre tcp.stream == N (clic droit → Conversation Filter → TCP).</p>\n</div><div class=\"ex-c\" hidden><p>En numérotation relative (celle de Wireshark par défaut) : <b>Seq = 1, Ack = 1</b>. Pourquoi : la poignée de main est SYN (Seq 0) → SYN-ACK (Seq 0, Ack 1) → ACK (Seq 1, Ack 1). Le SYN « consomme » 1 numéro, donc le premier octet de données du client porte le numéro 1, et le client attend l&#39;octet 1 du serveur. En valeur brute (raw), ce sont de grands nombres aléatoires, les ISN, mais la logique reste la même.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"29\"><div class=\"ex-q\"><p><strong>8d2.</strong> d2) Indicateurs d&#39;état (flags) actifs de l&#39;en-tête TCP ? Pourquoi ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>TCP → Flags.</p>\n</div><div class=\"ex-c\" hidden><p><b>PSH et ACK</b> (0x018). <b>ACK</b> : le segment acquitte ce que le serveur a envoyé, ce qui est toujours le cas après la poignée de main. <b>PSH</b> : « pousse » les données vers l&#39;application sans attendre, puisque le segment contient la requête complète.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"30\"><div class=\"ex-q\"><p><strong>8d3.</strong> d3) Longueur de l&#39;en-tête TCP et de la « charge » du message ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>TCP → Header Length et [TCP Segment Len].</p>\n</div><div class=\"ex-c\" hidden><p><b>En-tête TCP = 20 octets</b> (32 si des options sont présentes). <b>Charge</b> = TCP Segment Len = la taille du texte de la requête GET (en général quelques centaines d&#39;octets). Vérifie : Total Length IP − 20 (IP) − en-tête TCP = charge.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><section class=\"exo\"><h3>VIII.3-e · Réponse HTTP</h3><div class=\"ex\" data-x=\"31\"><div class=\"ex-q\"><p><strong>8e1.</strong> e1) Temps écoulé entre le GET et la réponse correspondante ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Différence des valeurs de la colonne Time, ou dans la réponse : HTTP → [Time since request].</p>\n</div><div class=\"ex-c\" hidden><p>Lis-le dans ta capture : en général quelques dizaines à quelques centaines de millisecondes. Ce délai comprend l&#39;aller-retour sur le réseau et le temps de traitement du serveur.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"32\"><div class=\"ex-q\"><p><strong>8e2.</strong> e2) Le serveur répond-il avec un message HTTP ou avec un segment TCP ACK ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Regarde le paquet du serveur juste après le GET.</p>\n</div><div class=\"ex-c\" hidden><p>Souvent, le serveur envoie <b>d&#39;abord un ACK TCP seul</b> (sans données) pour accuser réception du GET, <b>puis</b> la réponse HTTP (200 OK). Parfois les deux sont combinés : la réponse HTTP porte elle-même le flag ACK. Dis lequel des deux cas tu observes.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"33\"><div class=\"ex-q\"><p><strong>8e3.</strong> e3) Numéro de séquence émis par le serveur ? Correspond-il à la valeur attendue ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>TCP du premier segment du serveur après le GET.</p>\n</div><div class=\"ex-c\" hidden><p><b>Seq = 1</b> (relatif) : c&#39;est exactement la valeur de l&#39;Ack envoyé par le client dans le GET (« j&#39;attends ton octet 1 »). Et l&#39;<b>Ack du serveur = 1 + longueur du GET</b> : il confirme avoir reçu tous les octets de la requête. C&#39;est la règle du cours : ACK = numéro du prochain octet attendu.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"34\"><div class=\"ex-q\"><p><strong>8e4.</strong> Réponse e1) Longueur de la « charge » dans l&#39;en-tête TCP de la réponse HTTP ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>TCP → [TCP Segment Len] du 200 OK. Si la page est grande : [Reassembled TCP Segments].</p>\n</div><div class=\"ex-c\" hidden><p>C&#39;est la taille de l&#39;en-tête HTTP plus le début de la page. Si la page dépasse le <b>MSS (1460 octets)</b>, elle est découpée en <b>plusieurs segments</b> que Wireshark réassemble. C&#39;est la segmentation de ton cours, vue en vrai.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"35\"><div class=\"ex-q\"><p><strong>8e5.</strong> Réponse e2) Flags actifs de l&#39;en-tête TCP de la réponse ? Pourquoi ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>TCP → Flags du 200 OK.</p>\n</div><div class=\"ex-c\" hidden><p><b>PSH, ACK</b> (parfois <b>FIN, PSH, ACK</b> si le serveur ferme la connexion juste après). ACK : il acquitte la requête. PSH : il livre les données tout de suite. FIN : il ouvre la fermeture en 4 temps.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"36\"><div class=\"ex-q\"><p><strong>8e6.</strong> Réponse e3) Prochain numéro de séquence attendu dans le message suivant émis par le client ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Calcule avec les valeurs relatives de ta capture, puis vérifie sur le paquet suivant du client.</p>\n</div><div class=\"ex-c\" hidden><p>Le client continue sa propre numérotation : <b>Seq suivant du client = 1 + longueur du GET</b>, puisqu&#39;il a déjà « consommé » ces octets. Son <b>Ack</b> vaudra <b>Seq du serveur + longueur de la réponse</b> : le prochain octet qu&#39;il attend. Exemple : GET de 400 octets, réponse de 1200 octets → le client envoie Seq = 401, Ack = 1201.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section>","ex":[{"n":"n34","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n24","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n24","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n24","rep":null,"tol":null},{"n":"n24","rep":null,"tol":null},{"n":"n28","rep":null,"tol":null},{"n":"n24","rep":null,"tol":null},{"n":"n28","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n24","rep":null,"tol":null},{"n":"n24","rep":null,"tol":null},{"n":"n26","rep":null,"tol":null},{"n":"n24","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n28","rep":null,"tol":null},{"n":"n24","rep":null,"tol":null},{"n":"n25","rep":null,"tol":null},{"n":"n26","rep":null,"tol":null},{"n":"n26","rep":null,"tol":null},{"n":"n26","rep":null,"tol":null},{"n":"n35","rep":null,"tol":null},{"n":"n26","rep":null,"tol":null},{"n":"n35","rep":null,"tol":null},{"n":"n26","rep":null,"tol":null},{"n":"n26","rep":null,"tol":null},{"n":"n35","rep":null,"tol":null}],"qcm":[]},{"id":"tp2","t":"TP 2 · Packet Tracer","seance":"Travaux dirigés et pratiques","imp":4,"html":"<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p>Cherche d&#39;abord seul, ouvre l&#39;indice si tu bloques, puis compare avec le corrigé et note-toi honnêtement : ta réponse compte dans la maîtrise de la notion.</p>\n</aside><section class=\"exo\"><h3>Partie 1 · Hub et switch (2 maquettes sous Packet Tracer)</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p><strong>p1a.</strong> 1-2) Réaliser et configurer les deux maquettes.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Packet Tracer : End Devices → PC ; Network Devices → Hubs → Hub-PT, puis Switches → un switch 2950 ou 2960. Câbles : Connections → Copper Straight-Through. Sur chaque PC : Desktop → IP Configuration (ou onglet Config).</p>\n</div><div class=\"ex-c\" hidden><p><b>Maquette 1</b> : Hub0 relié à PC0, PC1 et PC2 par des câbles droits.<br>PC0 10.0.0.1 · PC1 10.0.0.2 · PC2 10.0.0.3, masque 255.0.0.0.<br><b>Maquette 2</b> : Switch1 relié à PC3, PC4 et PC5.<br>PC3 11.0.0.1 · PC4 11.0.0.2 · PC5 11.0.0.3, masque 255.0.0.0.<br>Aucune passerelle : le sujet n&#39;en donne pas. Attends que les points de liaison soient verts (sur un switch, ils passent par l&#39;orange pendant quelques secondes).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p><strong>p1b.</strong> 3) Ping entre PC0 et PC2. Que remarquez-vous ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>PC0 → Desktop → Command Prompt → ping 10.0.0.3. Pour voir le chemin des trames : bascule en mode « Simulation » (en bas à droite), envoie un ping et avance pas à pas.</p>\n</div><div class=\"ex-c\" hidden><p><b>Le ping réussit</b> : PC0 (10.0.0.1) et PC2 (10.0.0.3) sont dans le même réseau 10.0.0.0/8.<br>En mode Simulation, on voit que le <b>hub recopie la trame sur tous ses autres ports</b> : PC1 la reçoit aussi, même s&#39;il n&#39;est pas concerné (sa carte l&#39;ignore, ce n&#39;est pas sa MAC). Le hub ne lit aucune adresse.<br><b>Le 1er paquet est souvent perdu</b> (« Request timed out ») : PC0 ne connaît pas encore la MAC de PC2 et doit d&#39;abord la demander par un ARP en diffusion. Les suivants passent. C&#39;est normal.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p><strong>p1c.</strong> 4) Ping entre PC3 et PC4. Que remarquez-vous ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Même méthode : ping 11.0.0.2 depuis PC3, en mode Simulation. Puis ouvre la table du switch : clique sur Switch1 → CLI → show mac address-table.</p>\n</div><div class=\"ex-c\" hidden><p><b>Le ping réussit aussi</b> (réseau 11.0.0.0/8). La différence est dans le trajet : après le premier échange, le <b>switch envoie la trame uniquement vers le port de PC4</b>. PC5 ne reçoit plus rien.<br>Pourquoi : à chaque trame reçue, le switch lit la <b>MAC source</b> et la range dans sa table (MAC → port). Pour livrer, il lit la <b>MAC destination</b> et cherche le bon port. Seule la diffusion (l&#39;ARP du tout début) ou une MAC inconnue est envoyée sur tous les ports.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p><strong>p1d.</strong> 5) Pourquoi le switch est-il « intelligent » par rapport au hub ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Question de cours : compare les deux équipements couche par couche (modèle OSI).</p>\n</div><div class=\"ex-c\" hidden><p><b>Hub</b> (concentrateur) : couche 1, un simple répéteur. Il recopie chaque signal sur tous les ports et ne lit aucune adresse. Tout le monde partage la même bande passante et les mêmes collisions (un seul domaine de collision, half-duplex).<br><b>Switch</b> (commutateur) : couche 2. Il lit les adresses MAC, apprend où se trouve chaque machine (table MAC) et n&#39;envoie la trame qu&#39;au port concerné. Résultat : pas de collisions entre ports, chaque port dispose de toute la bande passante (full-duplex possible), et les autres machines ne voient pas les trames qui ne leur sont pas destinées (plus sûr).<br>En une phrase : le hub diffuse, le switch commute.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p><strong>p1e.</strong> 6) Connecter les deux maquettes par un câble RJ45.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Connections → Copper Cross-Over. Relie un port libre de Hub0 à un port libre de Switch1.</p>\n</div><div class=\"ex-c\" hidden><p>On relie <b>Hub0 à Switch1</b> avec un <b>câble croisé</b> : hub et switch sont deux équipements intermédiaires de même nature, et la règle du cours est que deux équipements de même nature se relient en croisé (PC–switch = droit, switch–switch = croisé). Les deux maquettes ne forment alors plus qu&#39;un seul segment physique : 6 PC, un hub et un switch.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p><strong>p1f.</strong> 7) Ping entre PC0 et PC4. Pourquoi les deux machines ne peuvent-elles pas communiquer ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Compare les adresses de PC0 et PC4 avec le masque : on garde la partie réseau (les octets à 255) et on compare.</p>\n</div><div class=\"ex-c\" hidden><p><b>Le ping échoue</b> (« Destination host unreachable » ou « Request timed out »).<br>Le câble ne suffit pas : <b>les deux PC sont dans deux réseaux IP différents</b>.<br>PC0 : 10.0.0.1 ET 255.0.0.0 = <b>10</b>.0.0.0. PC4 : 11.0.0.2 ET 255.0.0.0 = <b>11</b>.0.0.0. Les réseaux sont différents (10 ≠ 11), donc PC0 considère PC4 comme « hors de mon réseau » et doit passer par une <b>passerelle</b> (un routeur) : il n&#39;y en a pas.<br>Hub et switch ne routent pas : ils travaillent aux couches 1 et 2 et ne regardent jamais l&#39;adresse IP.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><p><strong>p1g.</strong> 8) Proposer une solution physique pour résoudre ce problème.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Quel équipement relie des réseaux différents ? (cours : le routeur, couche 3)</p>\n</div><div class=\"ex-c\" hidden><p>Insérer un <b>routeur</b> entre les deux maquettes : on débranche la liaison hub–switch, puis Hub0 va sur une interface du routeur (ex. 10.0.0.254, masque 255.0.0.0) et Switch1 sur une autre (ex. 11.0.0.254, masque 255.0.0.0). Chaque PC reçoit la passerelle de son réseau : 10.0.0.254 pour PC0, PC1, PC2 ; 11.0.0.254 pour PC3, PC4, PC5. Le routeur relie des réseaux différents (couche 3), le hub et le switch relient des machines d&#39;un même réseau.<br><i>Variante sans matériel en plus :</i> mettre tous les PC dans le même réseau (même adresse réseau, par exemple 10.0.0.x partout).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><section class=\"exo\"><h3>Partie 2 · I-II : topologie R1 – S1 – PC-A et configuration de base</h3><div class=\"ex\" data-x=\"7\"><div class=\"ex-q\"><p><strong>p2a.</strong> I. Câblage et initialisation du routeur et du commutateur.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Packet Tracer : un routeur (1941 ou 2911, qui possède un port G0/1), un switch 2960 et un PC. Câbles droits : R1 G0/1 ↔ S1 F0/5 et S1 F0/6 ↔ PC-A (FastEthernet0).</p>\n</div><div class=\"ex-c\" hidden><p>Câblage : <b>R1 G0/1 — S1 F0/5</b> et <b>S1 F0/6 — PC-A</b> (câbles droits : routeur–switch et switch–PC sont des équipements de natures différentes).<br>Initialisation (utile surtout sur du vrai matériel : un équipement neuf de Packet Tracer est déjà vierge) :<br>Router&gt;enable<br>Router#erase startup-config      (confirmer)<br>Router#reload      (répondre « no » si on propose d&#39;enregistrer)<br>Switch&gt;enable<br>Switch#erase startup-config<br>Switch#delete vlan.dat      (si le fichier existe)<br>Switch#reload</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"8\"><div class=\"ex-q\"><p><strong>p2b.</strong> II.1a) Configurer l&#39;adresse IPv4, le masque et la passerelle par défaut de PC-A.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>PC-A → Desktop → IP Configuration → Static.</p>\n</div><div class=\"ex-c\" hidden><p>IP address : <b>192.168.1.3</b><br>Subnet mask : <b>255.255.255.0</b><br>Default gateway : <b>192.168.1.1</b> (l&#39;adresse de G0/1 sur R1)<br>La passerelle est l&#39;adresse du routeur sur ce réseau : c&#39;est par elle que PC-A sortira de son réseau.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"9\"><div class=\"ex-q\"><p><strong>p2c.</strong> II.1b) Les pings vers la passerelle 192.168.1.1 ont-ils abouti ? Justifiez.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>PC-A → Command Prompt → ping 192.168.1.1, AVANT d&#39;avoir configuré le routeur.</p>\n</div><div class=\"ex-c\" hidden><p><b>Non</b> (« Request timed out » ou « Destination host unreachable »).<br>Pourquoi : PC-A est bien configuré, mais <b>le routeur ne l&#39;est pas encore</b>. Une interface de routeur est <b>désactivée par défaut</b> (shutdown) et n&#39;a pas d&#39;adresse IP : personne ne répond à 192.168.1.1. Le câblage correct ne suffit donc pas, il faut aussi configurer et activer l&#39;interface.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"10\"><div class=\"ex-q\"><p><strong>p2d.</strong> II.2) Configurer le routeur : accès console, nom d&#39;hôte R1, no ip domain-lookup, interface G0/1.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Clique sur R1 → onglet CLI (ou PC-A → Desktop → Terminal, avec un câble Console vers R1). Réponds « no » à l&#39;assistant de configuration initiale.</p>\n</div><div class=\"ex-c\" hidden><p>Router&gt;enable<br>Router#configure terminal<br>Router(config)#hostname R1<br>R1(config)#no ip domain-lookup<br>R1(config)#interface g0/1<br>R1(config-if)#ip address 192.168.1.1 255.255.255.0<br>R1(config-if)#no shutdown<br>R1(config-if)#end<br>R1#copy running-config startup-config<br>R1#show ip interface brief<br><br><b>hostname</b> : donne le nom prévu par la table d&#39;adressage. <b>no ip domain-lookup</b> : empêche IOS de prendre une commande mal tapée pour un nom à résoudre par DNS (sinon il attend environ une minute). <b>no shutdown</b> : allume l&#39;interface. Dans show ip interface brief, G0/1 doit afficher « up / up ».</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"11\"><div class=\"ex-q\"><p><strong>p2e.</strong> II.3a) Ping de PC-A vers la passerelle R1 : les requêtes ont-elles abouti ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Même commande qu&#39;avant : ping 192.168.1.1 depuis PC-A, une fois G0/1 « up / up ».</p>\n</div><div class=\"ex-c\" hidden><p><b>Oui</b> : « Reply from 192.168.1.1 », sans perte (le tout premier paquet peut être perdu à cause de l&#39;ARP).<br>La liaison est maintenant complète : PC-A et G0/1 sont dans le même réseau 192.168.1.0/24, l&#39;interface est active, et PC-A et R1 se sont appris leurs adresses MAC par ARP (voir la partie III).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><section class=\"exo\"><h3>Partie 2 · III : adresses MAC Ethernet</h3><div class=\"ex\" data-x=\"12\"><div class=\"ex-q\"><p><strong>p3a.</strong> III.1a) Exemple du sujet (carte Realtek, C8-0A-A9-FA-DE-0D) : partie OUI ? Partie numéro de série ? Fournisseur ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Une MAC fait 48 bits = 6 octets. Les 3 premiers = OUI ; les 3 derniers = numéro de série de la carte. Cherche l&#39;OUI dans la base de l&#39;IEEE ou sur un site « MAC address lookup ».</p>\n</div><div class=\"ex-c\" hidden><p><b>OUI</b> = <b>C8-0A-A9</b> (3 octets attribués par l&#39;IEEE au fabricant).<br><b>Numéro de série</b> = <b>FA-DE-0D</b> (3 octets choisis par le fabricant).<br><b>Fournisseur</b> : l&#39;OUI C8:0A:A9 est enregistré au nom de <b>Quanta Computer Inc.</b> (vérifié dans une base de recherche d&#39;OUI).<br>⚠ « Realtek PCIe GBE Family Controller » est le nom de la <b>puce</b> réseau (ligne Description), pas le fabricant donné par l&#39;OUI : ce sont deux informations différentes.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"13\"><div class=\"ex-q\"><p><strong>p3b.</strong> III.1b) Sur TON PC-A (ipconfig /all) : partie OUI, numéro de série, fournisseur ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>PC-A → Desktop → Command Prompt → ipconfig /all, ligne « Physical Address ». Puis recherche de l&#39;OUI sur un site « MAC address lookup ».</p>\n</div><div class=\"ex-c\" hidden><p>Recopie ta ligne <b>Physical Address</b>. Les 6 premiers chiffres hexadécimaux sont l&#39;<b>OUI</b>, les 6 derniers le <b>numéro de série</b>. Exemple inventé pour illustrer : 0001.C7A3.D2B1 → OUI 0001.C7, série A3.D2B1.<br>Pour le fournisseur, cherche ton OUI dans une base. Sous <b>Packet Tracer</b>, les PC sont simulés : leurs adresses commencent souvent par 0001, 0002… et ces préfixes sont des préfixes <b>Cisco</b> (à vérifier avec ton propre OUI).<br>Sur un vrai PC, le fournisseur est celui de la carte réseau (Intel, Realtek, Quanta…).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"14\"><div class=\"ex-q\"><p><strong>p3c.</strong> III.2a) Routeur R1 (exemple 30f7.0da3.1821) : adresse MAC de G0/1, numéro de série, OUI, fournisseur ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>R1 → CLI → show interfaces g0/1, ligne « Hardware is … address is ».</p>\n</div><div class=\"ex-c\" hidden><p><b>Adresse MAC de G0/1</b> : <b>30f7.0da3.1821</b> (soit 30:F7:0D:A3:18:21).<br><b>OUI</b> : <b>30:F7:0D</b>. <b>Numéro de série</b> : <b>A3:18:21</b> (a3.1821).<br><b>Fournisseur</b> : <b>Cisco Systems, Inc.</b> (préfixe 30:F7:0D vérifié).<br>Sur ton routeur Packet Tracer les valeurs seront différentes : relève les tiennes après « address is ».</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"15\"><div class=\"ex-q\"><p><strong>p3d.</strong> Que représente « bia » ? Pourquoi le résultat affiche-t-il la même adresse MAC deux fois ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Dans show interfaces g0/1 : « address is … (bia …) ».</p>\n</div><div class=\"ex-c\" hidden><p><b>bia</b> = <b>burned-in address</b> : l&#39;adresse MAC <b>gravée en usine</b> dans la carte (UAA, adresse administrée universellement). Elle ne change pas.<br>« address is » = l&#39;adresse MAC <b>actuellement utilisée</b> par l&#39;interface. Par défaut, c&#39;est la même que la bia, d&#39;où deux fois la même valeur. Elles ne seraient différentes que si un administrateur avait imposé une autre MAC avec la commande mac-address (adresse administrée localement).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"16\"><div class=\"ex-q\"><p><strong>p3e.</strong> III.2b) show arp : quelles adresses de couche 2 et de couche 3 s&#39;affichent sur R1 ? Pourquoi aucune information sur le commutateur ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>R1 → CLI → show arp (après un ping depuis PC-A, sinon l&#39;entrée de PC-A n&#39;existe pas encore).</p>\n</div><div class=\"ex-c\" hidden><p><b>Couche 2 (MAC)</b> : 30f7.0da3.1821 (R1 lui-même, âge « - ») et c80a.a9fa.de0d (PC-A).<br><b>Couche 3 (IP)</b> : 192.168.1.1 (R1) et 192.168.1.3 (PC-A).<br>La table ARP <b>associe chaque IP à sa MAC</b>.<br><b>Pas de switch :</b> S1 n&#39;a pas d&#39;adresse IP configurée et il est transparent : il ne fait que faire passer les trames. R1 ne communique jamais avec lui au niveau IP, donc aucune entrée ARP n&#39;est créée pour lui.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"17\"><div class=\"ex-q\"><p><strong>p3f.</strong> III.3a) Switch : adresse MAC de F0/5 et de F0/6 ? Les OUI sont-ils les mêmes que sur le routeur ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>S1 → CLI → show interfaces f0/5, puis show interfaces f0/6 (ligne « address is »).</p>\n</div><div class=\"ex-c\" hidden><p>Dans l&#39;exemple du sujet, <b>F0/5 = 0cd9.96e8.7285</b>. Pour F0/6, relève ta valeur : sur un switch Cisco les ports reçoivent des adresses MAC <b>consécutives</b> (F0/6 = …7286, à confirmer sur ta sortie).<br><b>OUI</b> du switch : 0C:D9:96. <b>OUI</b> du routeur : 30:F7:0D. <b>Ils sont différents</b>, mais les deux appartiennent à <b>Cisco Systems</b> : un fabricant possède souvent plusieurs OUI (les deux préfixes sont vérifiés).<br>Le switch retient les MAC de R1 et de PC-A (couche 2), jamais leurs adresses IP.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"18\"><div class=\"ex-q\"><p><strong>p3g.</strong> III.3b) show mac address-table : le switch affiche-t-il la MAC de PC-A ? de R1 ? sur quels ports ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>S1 → CLI → show mac address-table (fais d&#39;abord un ping PC-A → R1 pour que le switch apprenne les adresses).</p>\n</div><div class=\"ex-c\" hidden><p><b>PC-A</b> : oui, c80a.a9fa.de0d, type DYNAMIC, port <b>Fa0/6</b>.<br><b>R1</b> : oui, 30f7.0da3.1821, type DYNAMIC, port <b>Fa0/5</b>.<br>Cela colle à la topologie : R1 est sur F0/5 et PC-A sur F0/6. Ces deux lignes sont <b>DYNAMIC</b> : le switch les a apprises en lisant la MAC source des trames reçues (elles disparaissent après un certain temps sans trafic).<br>Les 20 autres lignes sur 22 sont <b>STATIC / CPU</b> : adresses réservées au switch lui-même (0100.0ccc.cccc…, 0180.c200.00xx pour des protocoles de contrôle comme le spanning tree) et ffff.ffff.ffff, l&#39;adresse de diffusion.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"19\"><div class=\"ex-q\"><p><strong>p3h.</strong> Remarques générales 1) Les diffusions sont-elles possibles au niveau de la couche 2 ? Si oui, quelle serait l&#39;adresse MAC ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Regarde la dernière ligne STATIC de la table MAC.</p>\n</div><div class=\"ex-c\" hidden><p><b>Oui</b>. La diffusion (broadcast) existe en couche 2 : l&#39;adresse MAC de destination est <b>FF-FF-FF-FF-FF-FF</b> (48 bits à 1, notée ffff.ffff.ffff). Le switch envoie alors la trame sur <b>tous</b> ses ports. C&#39;est ce que fait un ARP Request (« qui a l&#39;adresse IP 192.168.1.1 ? »).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"20\"><div class=\"ex-q\"><p><strong>p3i.</strong> Remarques générales 2) Pourquoi devez-vous connaître l&#39;adresse MAC d&#39;un périphérique ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Pense à la livraison d&#39;une trame dans un réseau local.</p>\n</div><div class=\"ex-c\" hidden><p>① <b>Livrer les trames</b> : sur un réseau local, une trame est adressée à une MAC, pas à une IP. Pour écrire à une IP, on demande d&#39;abord sa MAC (ARP).<br>② <b>Le switch s&#39;en sert</b> pour construire sa table MAC et choisir le bon port.<br>③ <b>Identifier et contrôler</b> : l&#39;OUI donne le fabricant ; on peut filtrer ou autoriser des appareils par leur MAC (sécurité des ports, DHCP) et dépanner (qui est branché où ?).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><section class=\"exo\"><h3>Partie 3 · Quatre réseaux sur deux switchs</h3><div class=\"ex\" data-x=\"21\"><div class=\"ex-q\"><p><strong>p4a.</strong> 1) Réaliser la maquette.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Deux switchs reliés entre eux, deux PC sur chacun. Masque 255.255.255.0 partout, aucune passerelle.</p>\n</div><div class=\"ex-c\" hidden><p>Switch du haut : PC <b>192.168.20.1</b> et PC <b>192.168.16.2</b>. Switch du bas : PC <b>192.168.22.4</b> et PC <b>192.168.18.3</b>.<br>Les deux switchs sont reliés par un câble <b>croisé</b> (équipements de même nature, comme en partie 1). Masque <b>255.255.255.0</b> sur les 4 PC, aucune passerelle.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"22\"><div class=\"ex-q\"><p><strong>p4b.</strong> 2-3) Ping entre les différentes machines. Pourquoi aucune communication n&#39;est-elle possible ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Calcule l&#39;adresse réseau de chaque PC avec le masque /24 : ce sont les 3 premiers octets.</p>\n</div><div class=\"ex-c\" hidden><p><b>Tous les pings échouent</b>, quelle que soit la paire.<br>Chaque PC est dans un réseau différent : 192.168.<b>20</b>.0/24, 192.168.<b>16</b>.0/24, 192.168.<b>22</b>.0/24 et 192.168.<b>18</b>.0/24. Avec le masque 255.255.255.0, il faut que les 3 premiers octets soient identiques pour être « chez soi ». Ici, le troisième octet diffère (20, 16, 22, 18).<br>Un PC envoie donc tout ce qui vise un autre réseau à sa <b>passerelle</b>, qui n&#39;est pas configurée, et les switchs, de couche 2, ne routent pas. Les PC sont reliés physiquement, mais pas logiquement.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"23\"><div class=\"ex-q\"><p><strong>p4c.</strong> 4) Proposer deux solutions pratiques pour résoudre ce problème.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Deux pistes : mettre les PC dans le même réseau, ou ajouter un équipement qui relie les réseaux.</p>\n</div><div class=\"ex-c\" hidden><p><b>Solution 1 : un seul réseau.</b> Changer le masque en <b>255.255.248.0</b> (/21) sur les 4 PC, sans changer leurs adresses. Le réseau devient 192.168.16.0/21 : il couvre 192.168.16.0 à 192.168.23.255, donc 16, 18, 20 et 22 en font partie (en binaire, le 3e octet commence par 00010 pour les quatre). Variante : donner aux 4 PC des adresses du même /24 (ex. 192.168.20.1 à .4).<br><b>Solution 2 : un routeur.</b> Un routeur relie les 4 réseaux ; chaque PC reçoit pour passerelle l&#39;adresse du routeur dans son réseau (ex. 192.168.20.254 pour le PC 192.168.20.1). Comme tous les PC sont sur les mêmes switchs, on sépare d&#39;abord les réseaux par des VLAN, puis on utilise une interface (ou sous-interface) du routeur par réseau.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section>","ex":[{"n":"n9","rep":null,"tol":null},{"n":"n9","rep":null,"tol":null},{"n":"n9","rep":null,"tol":null},{"n":"n9","rep":null,"tol":null},{"n":"n9","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n9","rep":null,"tol":null},{"n":"n28","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n34","rep":null,"tol":null},{"n":"n28","rep":null,"tol":null},{"n":"n28","rep":null,"tol":null},
