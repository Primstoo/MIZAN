<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><p>Dans <code>public void setX(double x) { x = x; }<\/code>, pourquoi l&#39;attribut n&#39;est-il pas modifié ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Parce que <code>x<\/code> désigne les deux fois le paramètre : il s&#39;affecte à lui-même. Il faut écrire <code>this.x = x;<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 11 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quel nom porte un constructeur ?<\/div><button class=\"opt\" data-o=\"0\">init<\/button><button class=\"opt\" data-o=\"1\">Le même nom que sa classe<\/button><button class=\"opt\" data-o=\"2\">constructor<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Quel est le type de retour d&#39;un constructeur ?<\/div><button class=\"opt\" data-o=\"0\">void<\/button><button class=\"opt\" data-o=\"1\">Le type de la classe<\/button><button class=\"opt\" data-o=\"2\">Aucun, même pas void<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Quel est le rôle du constructeur ?<\/div><button class=\"opt\" data-o=\"0\">Créer les objets et initialiser les attributs<\/button><button class=\"opt\" data-o=\"1\">Détruire les objets inutilisés<\/button><button class=\"opt\" data-o=\"2\">Afficher l&#39;état de l&#39;objet<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Une classe peut-elle avoir plusieurs constructeurs ?<\/div><button class=\"opt\" data-o=\"0\">Non, un seul<\/button><button class=\"opt\" data-o=\"1\">Oui, s&#39;ils ont des paramètres différents<\/button><button class=\"opt\" data-o=\"2\">Oui, mais seulement deux<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Si on n&#39;écrit aucun constructeur dans une classe :<\/div><button class=\"opt\" data-o=\"0\">on ne peut pas créer d&#39;objet<\/button><button class=\"opt\" data-o=\"1\">le compilateur crée un constructeur par défaut sans paramètres<\/button><button class=\"opt\" data-o=\"2\">la classe ne compile pas<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">La classe Point a un seul constructeur : <code>Point(double x, double y)<\/code>. Que donne <code>new Point()<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">Un point (0, 0)<\/button><button class=\"opt\" data-o=\"1\">Une erreur de compilation<\/button><button class=\"opt\" data-o=\"2\">Un point aux coordonnées aléatoires<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Que désigne <code>this<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">La classe courante<\/button><button class=\"opt\" data-o=\"1\">L&#39;objet courant<\/button><button class=\"opt\" data-o=\"2\">La méthode main<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Dans <code>public Point(double x, double y) { this.x = x; }<\/code>, que désigne <code>this.x<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">L&#39;attribut x de l&#39;objet<\/button><button class=\"opt\" data-o=\"1\">Le paramètre x<\/button><button class=\"opt\" data-o=\"2\">Une variable locale<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Un setter sert à :<\/div><button class=\"opt\" data-o=\"0\">renvoyer la valeur d&#39;un attribut<\/button><button class=\"opt\" data-o=\"1\">modifier la valeur d&#39;un attribut<\/button><button class=\"opt\" data-o=\"2\">créer un nouvel objet<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Pourquoi préférer un setter à un attribut public ?<\/div><button class=\"opt\" data-o=\"0\">Le setter est plus rapide<\/button><button class=\"opt\" data-o=\"1\">Le setter peut vérifier la valeur avant de la ranger<\/button><button class=\"opt\" data-o=\"2\">Un attribut public ne peut pas être modifié<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"10\"><div class=\"qq-q\">Quand le constructeur est-il appelé ?<\/div><button class=\"opt\" data-o=\"0\">À chaque appel de méthode<\/button><button class=\"opt\" data-o=\"1\">Au moment du <code>new<\/code><\/button><button class=\"opt\" data-o=\"2\">À la fin du programme<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"constructeurs-this","rep":null,"tol":null},{"n":"constructeurs-this","rep":null,"tol":null},{"n":"constructeurs-this","rep":null,"tol":null},{"n":"constructeurs-this","rep":null,"tol":null},{"n":"constructeurs-this","rep":null,"tol":null},{"n":"constructeurs-this","rep":null,"tol":null},{"n":"constructeurs-this","rep":null,"tol":null}],"qcm":[{"n":"constructeurs-this","q":"Quel nom porte un constructeur ?","o":["init","Le même nom que sa classe","constructor"],"a":1,"e":"C&#39;est ainsi que Java le reconnaît."},{"n":"constructeurs-this","q":"Quel est le type de retour d&#39;un constructeur ?","o":["void","Le type de la classe","Aucun, même pas void"],"a":2,"e":"Avec <code>void<\/code>, ce serait une méthode ordinaire."},{"n":"constructeurs-this","q":"Quel est le rôle du constructeur ?","o":["Créer les objets et initialiser les attributs","Détruire les objets inutilisés","Afficher l&#39;état de l&#39;objet"],"a":0,"e":"Il s&#39;exécute au moment du <code>new<\/code>."},{"n":"constructeurs-this","q":"Une classe peut-elle avoir plusieurs constructeurs ?","o":["Non, un seul","Oui, s&#39;ils ont des paramètres différents","Oui, mais seulement deux"],"a":1,"e":"Le constructeur peut être surchargé."},{"n":"constructeurs-this","q":"Si on n&#39;écrit aucun constructeur dans une classe :","o":["on ne peut pas créer d&#39;objet","le compilateur crée un constructeur par défaut sans paramètres","la classe ne compile pas"],"a":1,"e":"C&#39;est ce qui se passe pour la classe Complexe du TD 3."},{"n":"constructeurs-this","q":"La classe Point a un seul constructeur : <code>Point(double x, double y)<\/code>. Que donne <code>new Point()<\/code> ?","o":["Un point (0, 0)","Une erreur de compilation","Un point aux coordonnées aléatoires"],"a":1,"e":"Le constructeur par défaut n&#39;existe plus dès qu&#39;on en écrit un."},{"n":"constructeurs-this","q":"Que désigne <code>this<\/code> ?","o":["La classe courante","L&#39;objet courant","La méthode main"],"a":1,"e":"C&#39;est une référence sur l&#39;objet sur lequel la méthode s&#39;exécute."},{"n":"constructeurs-this","q":"Dans <code>public Point(double x, double y) { this.x = x; }<\/code>, que désigne <code>this.x<\/code> ?","o":["L&#39;attribut x de l&#39;objet","Le paramètre x","Une variable locale"],"a":0,"e":"<code>x<\/code> seul désigne le paramètre."},{"n":"constructeurs-this","q":"Un setter sert à :","o":["renvoyer la valeur d&#39;un attribut","modifier la valeur d&#39;un attribut","créer un nouvel objet"],"a":1,"e":"Le getter, lui, renvoie la valeur."},{"n":"constructeurs-this","q":"Pourquoi préférer un setter à un attribut public ?","o":["Le setter est plus rapide","Le setter peut vérifier la valeur avant de la ranger","Un attribut public ne peut pas être modifié"],"a":1,"e":"C&#39;est tout l&#39;intérêt de l&#39;encapsulation."},{"n":"constructeurs-this","q":"Quand le constructeur est-il appelé ?","o":["À chaque appel de méthode","Au moment du <code>new<\/code>","À la fin du programme"],"a":1,"e":"Une fois par objet créé."}]},{"id":"static-objets-membres","t":"Paramètre objet, static et objets membres","seance":"Séance 5","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu dois savoir écrire un constructeur et utiliser <code>this<\/code> (chapitre 7).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Dans une méthode de la classe Point, que désigne <code>this.x<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>L&#39;attribut <code>x<\/code> de <strong>l&#39;objet courant<\/strong>, celui sur lequel la méthode a été appelée. Dans ce chapitre, une méthode va manipuler <strong>deux<\/strong> points à la fois : <code>this<\/code> sert à ne pas les confondre.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Demande-toi toujours « à qui appartient cette donnée ? ».<\/strong> À <strong>cet objet<\/strong> (attribut normal), à <strong>l&#39;autre objet<\/strong> passé en paramètre, ou à <strong>la classe entière<\/strong> (attribut <code>static<\/code>) ? Les trois idées du chapitre sont les trois réponses.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Croire que tout est statique parce que <code>main<\/code> l&#39;est. Les notes sont claires : « <strong>Toutes les méthodes de Java sont statiques<\/strong> » est <strong>faux<\/strong>.<\/p>\n<\/aside><p>À la fin, tu sais écrire une méthode qui reçoit un objet, utiliser <code>static<\/code> à bon escient, et construire une classe dont un attribut est lui-même un objet.<\/p>\n<h2>Idée 1 · Une méthode peut recevoir un objet en paramètre<\/h2>\n<pre class=\"\"><code>class Point {\n    private double x, y;\n\n    public Point(double x, double y) { this.x = x; this.y = y; }\n\n    public double distance(Point pt) {\n        return Math.sqrt(Math.pow(pt.x - this.x, 2) + Math.pow(pt.y - this.y, 2));\n    }\n\n    public void deplacer(double d) { this.x += d; this.y += d; }\n\n    public void afficher() { System.out.println(&quot;[&quot; + this.x + &quot;, &quot; + this.y + &quot;]&quot;); }\n}<\/code><\/pre><pre class=\"\"><code>Point p1 = new Point(0, 0), p3 = new Point(3, 4);\nSystem.out.println(p1.distance(p3));\nSystem.out.println(p3.distance(p1));<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>5.0\n5.0<\/code><\/pre><svg viewBox=\"0 0 360 130\" style=\"width:100%;max-width:460px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Dans p1.distance(p3), this désigne p1 et pt désigne p3 ; la distance vaut 5\">\n<g font-family=\"sans-serif\" font-size=\"11\" fill=\"currentColor\">\n<line x1=\"40\" y1=\"110\" x2=\"330\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line x1=\"40\" y1=\"110\" x2=\"40\" y2=\"10\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n<circle cx=\"40\" cy=\"110\" r=\"5\" fill=\"#D9824F\"/><text x=\"50\" y=\"126\" fill=\"#D9824F\" font-weight=\"700\">this = p1 (0, 0)<\/text>\n<circle cx=\"220\" cy=\"30\" r=\"5\" fill=\"currentColor\"/><text x=\"230\" y=\"26\">pt = p3 (3, 4)<\/text>\n<text x=\"112\" y=\"62\" fill=\"#D9824F\" font-weight=\"700\">distance = 5<\/text>\n<text x=\"130\" y=\"104\" font-size=\"10\">3<\/text><text x=\"226\" y=\"74\" font-size=\"10\">4<\/text>\n<\/g>\n<line x1=\"40\" y1=\"110\" x2=\"220\" y2=\"30\" stroke=\"#D9824F\" stroke-width=\"3\"/>\n<path d=\"M220 110V30\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/>\n<\/svg><p>Dans <code>p1.distance(p3)<\/code> : <strong><code>this<\/code><\/strong> est <code>p1<\/code> (l&#39;objet courant), <strong><code>pt<\/code><\/strong> est <code>p3<\/code> (l&#39;autre objet). <code>this<\/code> est important ici car il permet de <strong>distinguer l&#39;objet courant (<code>this.x<\/code>) de l&#39;autre objet (<code>pt.x<\/code>)<\/strong>.<\/p>\n<p>Deux remarques :<\/p>\n<ul>\n<li><code>p1.distance(p3)<\/code> et <code>p3.distance(p1)<\/code> donnent <strong>le même résultat<\/strong>.<\/li>\n<li>La méthode lit <code>pt.x<\/code> alors que <code>x<\/code> est <code>private<\/code>. C&#39;est permis : <code>private<\/code> protège la <strong>classe<\/strong>, pas l&#39;objet. Une méthode de Point a accès aux attributs privés de <strong>tout<\/strong> objet Point.<\/li>\n<\/ul>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Dans les notes, la formule est d&#39;abord écrite <code>pt.Coord_X - this.Coord_Y<\/code>, puis <strong>barrée et corrigée<\/strong>. Il faut soustraire <strong>X avec X<\/strong> et <strong>Y avec Y<\/strong> : <code>(pt.x - this.x)<\/code> et <code>(pt.y - this.y)<\/code>. Avec la version barrée, la distance entre (0, 0) et (3, 4) ne donnerait pas 5.<\/p>\n<\/aside><h2>Idée 2 · static : un seul exemplaire pour toute la classe<\/h2>\n<p><strong><code>static<\/code><\/strong> permet de définir des <strong>attributs statiques<\/strong>, qui n&#39;existent qu&#39;en <strong>un seul exemplaire pour tous les objets<\/strong> de la classe.<\/p>\n<svg viewBox=\"0 0 360 150\" style=\"width:100%;max-width:460px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Sans static, chaque objet a son n et son w. Avec static, n est partagé par tous les objets.\">\n<g font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\">\n<text x=\"90\" y=\"16\" font-weight=\"700\">sans static<\/text>\n<rect x=\"14\" y=\"26\" width=\"68\" height=\"46\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"48\" y=\"44\">a1 : n<\/text><text x=\"48\" y=\"62\">a1 : w<\/text>\n<rect x=\"98\" y=\"26\" width=\"68\" height=\"46\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"132\" y=\"44\">a2 : n<\/text><text x=\"132\" y=\"62\">a2 : w<\/text>\n<text x=\"270\" y=\"16\" font-weight=\"700\" fill=\"#D9824F\">avec static int n<\/text>\n<rect x=\"236\" y=\"26\" width=\"68\" height=\"26\" rx=\"6\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/><text x=\"270\" y=\"44\" fill=\"#D9824F\" font-weight=\"700\">n (partagé)<\/text>\n<rect x=\"194\" y=\"90\" width=\"68\" height=\"28\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"228\" y=\"109\">a1 : w<\/text>\n<rect x=\"278\" y=\"90\" width=\"68\" height=\"28\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"312\" y=\"109\">a2 : w<\/text>\n<text x=\"90\" y=\"96\" font-size=\"10\">4 cases mémoire<\/text><text x=\"270\" y=\"140\" font-size=\"10\">3 cases mémoire<\/text>\n<\/g>\n<path d=\"M228 90L262 54M312 90L278 54\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/>\n<\/svg><table>\n<thead>\n<tr>\n<th>Déclaration<\/th>\n<th>Avec <code>A a1 = new A(), a2 = new A();<\/code><\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>private int n; private int w;<\/code><\/td>\n<td>a1 a son <code>n<\/code> et son <code>w<\/code> ; a2 a son <code>n<\/code> et son <code>w<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>private static int n; private int w;<\/code><\/td>\n<td><strong>un seul <code>n<\/code><\/strong> partagé ; a1 et a2 ont chacun leur <code>w<\/code><\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Un exemple classique : compter les objets créés.<\/p>\n<pre class=\"\"><code>class Etudiant {\n    private static int compteur = 0;     // un seul pour toute la classe\n    private String nom;                  // un par objet\n\n    public Etudiant(String nom) { this.nom = nom; compteur++; }\n\n    public static int getCompteur() { return compteur; }\n}<\/code><\/pre><pre class=\"\"><code>System.out.println(Etudiant.getCompteur());\nEtudiant e1 = new Etudiant(&quot;Amine&quot;), e2 = new Etudiant(&quot;Sara&quot;), e3 = new Etudiant(&quot;Youssef&quot;);\nSystem.out.println(Etudiant.getCompteur());<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>0\n3<\/code><\/pre><p>Chaque <code>new<\/code> exécute le constructeur, qui incrémente <strong>le même<\/strong> <code>compteur<\/code>.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>La classe <code>Etudiant<\/code> avec son compteur est un exemple ajouté par ToumaiLearn. Les notes utilisent une classe <code>A<\/code> avec les attributs <code>n<\/code> et <code>w<\/code>, sans programme complet.<\/p>\n<\/aside><h2>Idée 3 · Les méthodes statiques<\/h2>\n<p><code>static<\/code> permet aussi de définir des <strong>méthodes statiques<\/strong>, qui agissent <strong>seulement sur des attributs statiques<\/strong>.<\/p>\n<pre class=\"\"><code>public class A {\n    private static int n;\n    private int w;\n\n    public static void f() {\n        // on peut accéder seulement à l'attribut n, car il est statique\n    }\n}<\/code><\/pre><p><strong>Appel d&#39;une méthode statique<\/strong> : avec le <strong>nom de la classe<\/strong>, sans créer d&#39;objet.<\/p>\n<pre class=\"\"><code>A.f();<\/code><\/pre><figure class=\"etapes\" data-i=\"0\"><figcaption>Pourquoi f() ne peut pas toucher à w<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · f() appartient à la classe<\/div><p>On l&#39;appelle par <code>A.f()<\/code>. Aucun objet n&#39;est en jeu.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · w appartient à un objet<\/div><p>Chaque objet A a son propre <code>w<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Donc, quel w ?<\/div><p>Dans <code>A.f()<\/code>, il n&#39;y a pas d&#39;objet courant, pas de <code>this<\/code>. Java ne saurait pas de quel <code>w<\/code> on parle : il refuse de compiler.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · n, lui, est unique<\/div><p>Il n&#39;y a qu&#39;un seul <code>n<\/code> pour toute la classe : aucune ambiguïté.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Attribut ou méthode d&#39;instance<\/th>\n<th>Attribut ou méthode <code>static<\/code><\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Appartient à<\/td>\n<td>chaque objet<\/td>\n<td>la classe<\/td>\n<\/tr>\n<tr>\n<td>Nombre d&#39;exemplaires<\/td>\n<td>un par objet<\/td>\n<td>un seul<\/td>\n<\/tr>\n<tr>\n<td>Appel<\/td>\n<td><code>objet.methode()<\/code><\/td>\n<td><code>Classe.methode()<\/code><\/td>\n<\/tr>\n<tr>\n<td>Accès à <code>this<\/code><\/td>\n<td>oui<\/td>\n<td>non<\/td>\n<\/tr>\n<\/tbody><\/table>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>C&#39;est pour cela que <code>main<\/code> est <code>static<\/code> : Java l&#39;appelle <strong>avant<\/strong> qu&#39;aucun objet n&#39;existe. Mais <strong>toutes les méthodes ne sont pas statiques<\/strong> : <code>afficher()<\/code>, <code>distance()<\/code>, <code>deplacer()<\/code> ont besoin d&#39;un objet.<\/p>\n<\/aside><h2>Idée 4 · L&#39;objet membre : un attribut qui est un objet<\/h2>\n<p>On peut avoir des <strong>attributs objets<\/strong>. On parle alors d&#39;<strong>objet membre<\/strong>.<\/p>\n<pre class=\"\"><code>class Cercle {\n    private double rayon;\n    private Point centre;                       // objet membre\n\n    public Cercle(double r, double x, double y) {\n        this.centre = new Point(x, y);          // le cercle crée son centre\n        this.rayon = r;\n    }\n\n    public void afficher() {\n        System.out.println(&quot;Cercle de rayon &quot; + this.rayon);\n        System.out.print(&quot; et de centre &quot;);\n        this.centre.afficher();                 // on délègue au Point\n    }\n\n    public void changerPosition(double d) {\n        this.centre.deplacer(d);                // on délègue au Point\n    }\n}<\/code><\/pre><pre class=\"\"><code>Cercle c = new Cercle(2.5, 1, 1);\nc.afficher();\nc.changerPosition(4);\nc.afficher();<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Cercle de rayon 2.5\n et de centre [1.0, 1.0]\nCercle de rayon 2.5\n et de centre [5.0, 5.0]<\/code><\/pre><figure class=\"flux\"><figcaption>Le cercle délègue le travail à son centre<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">c.changerPosition(4)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">this.centre.deplacer(4)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">le Point modifie ses x et y<\/div><\/div><\/figure><p>Le Cercle ne touche jamais directement aux coordonnées : il <strong>envoie un message<\/strong> à son centre. C&#39;est la relation « <strong>a un<\/strong> » du chapitre 3. Comme le centre est créé <strong>par<\/strong> le cercle et <strong>dans<\/strong> le cercle, c&#39;est une <strong>composition<\/strong>.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Dans les notes, le constructeur est écrit <code>Cercle(double r, double x, double y)<\/code> et l&#39;attribut <code>private float Rayon<\/code>. Affecter un <code>double<\/code> à un <code>float<\/code> <strong>ne compile pas<\/strong> en Java (« possible lossy conversion from double to float »). Ici, <code>rayon<\/code> est déclaré <code>double<\/code> pour que le programme compile. Les noms ont aussi été mis en minuscules (<code>rayon<\/code>, <code>centre<\/code>), selon l&#39;usage en Java.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Paramètre objet, static, objet membre<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Dans <code>p1.distance(p3)<\/code>, que désignent <code>this<\/code> et <code>pt<\/code> à l&#39;intérieur de la méthode ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>this<\/code> désigne <code>p1<\/code> (l&#39;objet courant), <code>pt<\/code> désigne <code>p3<\/code> (l&#39;objet passé en paramètre).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p><code>a = new Point(1, 1)<\/code> et <code>b = new Point(4, 5)<\/code>. Que renvoie <code>a.distance(b)<\/code> ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>Racine de (4 − 1)² + (5 − 1)².<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 5<\/b><\/p><p>Racine de 9 + 16 = racine de 25 = 5.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Une classe a un attribut <code>private static int n<\/code> et on crée 10 objets. Combien d&#39;exemplaires de <code>n<\/code> existent en mémoire ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1<\/b><\/p><p>Un seul : un attribut statique n&#39;existe qu&#39;en un seul exemplaire pour tous les objets.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Comment appelle-t-on une méthode statique <code>f()<\/code> de la classe <code>A<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>A.f();<\/code> : avec le nom de la classe.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>Vrai ou faux : « Toutes les méthodes de Java sont statiques. »<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><strong>Faux.<\/strong> Seules celles déclarées avec <code>static<\/code> le sont.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><p>Qu&#39;est-ce qu&#39;un objet membre ? Donne l&#39;exemple du cours.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Un attribut qui est lui-même un objet. Exemple : dans la classe Cercle, l&#39;attribut <code>centre<\/code> est de type Point.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"7\"><div class=\"ex-q\"><p>Dans <code>Cercle<\/code>, pourquoi écrit-on <code>this.centre.deplacer(d)<\/code> plutôt que de modifier x et y directement ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Parce que x et y sont des attributs privés de Point : le Cercle n&#39;y a pas accès. Il envoie un message à son centre, qui se déplace lui-même.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 12 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Dans <code>p1.distance(p3)<\/code>, à l&#39;intérieur de la méthode, <code>this<\/code> désigne :<\/div><button class=\"opt\" data-o=\"0\">p1<\/button><button class=\"opt\" data-o=\"1\">p3<\/button><button class=\"opt\" data-o=\"2\">la classe Point<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Que renvoie <code>new Point(0, 0).distance(new Point(3, 4))<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">7.0<\/button><button class=\"opt\" data-o=\"1\">5.0<\/button><button class=\"opt\" data-o=\"2\">25.0<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\"><code>p1.distance(p3)<\/code> et <code>p3.distance(p1)<\/code> :<\/div><button class=\"opt\" data-o=\"0\">donnent le même résultat<\/button><button class=\"opt\" data-o=\"1\">donnent des résultats opposés<\/button><button class=\"opt\" data-o=\"2\">provoquent une erreur pour le second<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Un attribut <code>static<\/code> existe :<\/div><button class=\"opt\" data-o=\"0\">en un exemplaire par objet<\/button><button class=\"opt\" data-o=\"1\">en un seul exemplaire pour tous les objets<\/button><button class=\"opt\" data-o=\"2\">seulement pendant l&#39;exécution du constructeur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Classe A avec <code>private static int n; private int w;<\/code>. On crée 3 objets. Combien de <code>w<\/code> et de <code>n<\/code> en mémoire ?<\/div><button class=\"opt\" data-o=\"0\">3 w et 3 n<\/button><button class=\"opt\" data-o=\"1\">3 w et 1 n<\/button><button class=\"opt\" data-o=\"2\">1 w et 3 n<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Comment appelle-t-on la méthode statique <code>f()<\/code> de la classe <code>A<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">new A.f();<\/button><button class=\"opt\" data-o=\"1\">A.f();<\/button><button class=\"opt\" data-o=\"2\">this.f();<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Une méthode statique peut accéder directement :<\/div><button class=\"opt\" data-o=\"0\">seulement aux attributs statiques<\/button><button class=\"opt\" data-o=\"1\">à tous les attributs<\/button><button class=\"opt\" data-o=\"2\">seulement aux attributs privés non statiques<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">« Toutes les méthodes de Java sont statiques. »<\/div><button class=\"opt\" data-o=\"0\">Vrai<\/button><button class=\"opt\" data-o=\"1\">Faux<\/button><button class=\"opt\" data-o=\"2\">Vrai seulement pour les classes publiques<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Qu&#39;est-ce qu&#39;un objet membre ?<\/div><button class=\"opt\" data-o=\"0\">Un objet créé dans main<\/button><button class=\"opt\" data-o=\"1\">Un attribut qui est lui-même un objet<\/button><button class=\"opt\" data-o=\"2\">Un objet déclaré static<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Dans la classe Cercle, où l&#39;objet <code>centre<\/code> est-il créé ?<\/div><button class=\"opt\" data-o=\"0\">Dans la méthode afficher<\/button><button class=\"opt\" data-o=\"1\">Dans la classe Point<\/button><button class=\"opt\" data-o=\"2\">Dans le constructeur de Cercle<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"10\"><div class=\"qq-q\">Après <code>Cercle c = new Cercle(2.5, 1, 1); c.changerPosition(4);<\/code>, quel est le centre ?<\/div><button class=\"opt\" data-o=\"0\">[1.0, 1.0]<\/button><button class=\"opt\" data-o=\"1\">[5.0, 5.0]<\/button><button class=\"opt\" data-o=\"2\">[4.0, 4.0]<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"11\"><div class=\"qq-q\">Dans les notes, pourquoi la formule <code>pt.Coord_X - this.Coord_Y<\/code> a-t-elle été barrée ?<\/div><button class=\"opt\" data-o=\"0\">Parce que <code>this<\/code> est interdit dans une méthode<\/button><button class=\"opt\" data-o=\"1\">Parce qu&#39;il faut soustraire X avec X et Y avec Y<\/button><button class=\"opt\" data-o=\"2\">Parce que <code>pt<\/code> est privé<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"static-objets-membres","rep":null,"tol":null},{"n":"static-objets-membres","rep":null,"tol":null},{"n":"static-objets-membres","rep":["5"],"tol":null},{"n":"static-objets-membres","rep":["1"],"tol":null},{"n":"static-objets-membres","rep":null,"tol":null},{"n":"static-objets-membres","rep":null,"tol":null},{"n":"static-objets-membres","rep":null,"tol":null},{"n":"static-objets-membres","rep":null,"tol":null}],"qcm":[{"n":"static-objets-membres","q":"Dans <code>p1.distance(p3)<\/code>, à l&#39;intérieur de la méthode, <code>this<\/code> désigne :","o":["p1","p3","la classe Point"],"a":0,"e":"<code>this<\/code> est l&#39;objet sur lequel la méthode est appelée."},{"n":"static-objets-membres","q":"Que renvoie <code>new Point(0, 0).distance(new Point(3, 4))<\/code> ?","o":["7.0","5.0","25.0"],"a":1,"e":"Racine de 3² + 4² = racine de 25 = 5."},{"n":"static-objets-membres","q":"<code>p1.distance(p3)<\/code> et <code>p3.distance(p1)<\/code> :","o":["donnent le même résultat","donnent des résultats opposés","provoquent une erreur pour le second"],"a":0,"e":"La distance est symétrique."},{"n":"static-objets-membres","q":"Un attribut <code>static<\/code> existe :","o":["en un exemplaire par objet","en un seul exemplaire pour tous les objets","seulement pendant l&#39;exécution du constructeur"],"a":1,"e":"C&#39;est la définition du cours."},{"n":"static-objets-membres","q":"Classe A avec <code>private static int n; private int w;<\/code>. On crée 3 objets. Combien de <code>w<\/code> et de <code>n<\/code> en mémoire ?","o":["3 w et 3 n","3 w et 1 n","1 w et 3 n"],"a":1,"e":"Un <code>w<\/code> par objet, un seul <code>n<\/code> pour la classe."},{"n":"static-objets-membres","q":"Comment appelle-t-on la méthode statique <code>f()<\/code> de la classe <code>A<\/code> ?","o":["new A.f();","A.f();","this.f();"],"a":1,"e":"Par le nom de la classe, sans créer d&#39;objet."},{"n":"static-objets-membres","q":"Une méthode statique peut accéder directement :","o":["seulement aux attributs statiques","à tous les attributs","seulement aux attributs privés non statiques"],"a":0,"e":"Sans objet courant, elle ne peut pas savoir de quel attribut d&#39;instance il s&#39;agit."},{"n":"static-objets-membres","q":"« Toutes les méthodes de Java sont statiques. »","o":["Vrai","Faux","Vrai seulement pour les classes publiques"],"a":1,"e":"<code>afficher()<\/code> ou <code>deplacer()<\/code> s&#39;appliquent à un objet : elles ne sont pas statiques."},{"n":"static-objets-membres","q":"Qu&#39;est-ce qu&#39;un objet membre ?","o":["Un objet créé dans main","Un attribut qui est lui-même un objet","Un objet déclaré static"],"a":1,"e":"Exemple : le centre (Point) d&#39;un Cercle."},{"n":"static-objets-membres","q":"Dans la classe Cercle, où l&#39;objet <code>centre<\/code> est-il créé ?","o":["Dans la méthode afficher","Dans la classe Point","Dans le constructeur de Cercle"],"a":2,"e":"<code>this.centre = new Point(x, y);<\/code>"},{"n":"static-objets-membres","q":"Après <code>Cercle c = new Cercle(2.5, 1, 1); c.changerPosition(4);<\/code>, quel est le centre ?","o":["[1.0, 1.0]","[5.0, 5.0]","[4.0, 4.0]"],"a":1,"e":"<code>deplacer(4)<\/code> ajoute 4 à x et à y : (1 + 4, 1 + 4)."},{"n":"static-objets-membres","q":"Dans les notes, pourquoi la formule <code>pt.Coord_X - this.Coord_Y<\/code> a-t-elle été barrée ?","o":["Parce que <code>this<\/code> est interdit dans une méthode","Parce qu&#39;il faut soustraire X avec X et Y avec Y","Parce que <code>pt<\/code> est privé"],"a":1,"e":"La bonne formule : (pt.x − this.x)² + (pt.y − this.y)²."}]},{"id":"td-corriges","t":"TD 2 et TD 3 corrigés, exécutés et commentés","seance":"TD 2 (bases de Java) · TD 3 (classes et objets)","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu dois avoir vu les bases de Java (chapitre 4) pour le TD 2, et les classes, constructeurs et <code>this<\/code> (chapitres 6 et 7) pour le TD 3. Le TD 1 (questions de cours) est corrigé dans les chapitres 1, 2 et 3.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Que vaut <code>3 / 2<\/code> en Java, et que vaut <code>3 / 2.0<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>3 / 2<\/code> vaut <strong>1<\/strong> (division entière). <code>3 / 2.0<\/code> vaut <strong>1.5<\/strong>. Cette différence explique l&#39;un des bugs du corrigé de l&#39;exercice 3 ci-dessous.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Cherche d&#39;abord, lis ensuite.<\/strong> Pour chaque exercice : lis l&#39;énoncé, écris ta solution sur papier, puis compare. Un corrigé lu sans avoir cherché s&#39;oublie en deux jours.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Un corrigé qui <strong>compile<\/strong> n&#39;est pas forcément un corrigé <strong>juste<\/strong>. Tous les programmes ci-dessous ont été exécutés : deux d&#39;entre eux donnent un résultat qui ne correspond pas à l&#39;énoncé. Ils sont signalés.<\/p>\n<\/aside><p>À la fin, tu sais refaire les six exercices du TD 2 et les deux classes du TD 3, et tu connais leurs pièges.<\/p>\n<h2>Idée 1 · TD 2, exercices 1 et 2 : factorielle et facture<\/h2>\n<p><strong>Exercice 1 · Factorielle.<\/strong> Le corrigé est donné au chapitre 4 (idée 5). Avec la saisie 5, il affiche <code>Factorielle de n =120<\/code>. Rappel : avec un <code>int<\/code>, le résultat est faux à partir de 13.<\/p>\n<p><strong>Exercice 2, question 1 · Facture d&#39;électricité.<\/strong> Données : taxe de 10 % (constante), prix unitaire, ancien et nouvel index.<\/p>\n<pre class=\"\"><code>import java.util.Scanner;\n\npublic class Facture {\n    public static void main(String[] args) {\n        final double TAXE = 0.1;\n        double prix;\n        double AIndex, NIndex;\n\n        Scanner sc = new Scanner(System.in);\n        System.out.print(&quot;Prix unitaire : &quot;);\n        prix = sc.nextDouble();\n        System.out.print(&quot;Nouvel index : &quot;);\n        NIndex = sc.nextDouble();\n        System.out.print(&quot;Ancien index : &quot;);\n        AIndex = sc.nextDouble();\n\n        double consomation = NIndex - AIndex;\n        double prix_HT = consomation * prix;\n        double TVA = prix_HT * TAXE;\n        double prix_TTC = prix_HT + TVA;\n\n        System.out.println(&quot;Le prix total est: &quot; + prix_TTC + &quot; dh&quot;);\n    }\n}<\/code><\/pre><p>Avec prix = 0,6, nouvel index = 200, ancien index = 100 :<\/p>\n<pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Le prix total est: 66.0 dh<\/code><\/pre><figure class=\"etapes\" data-i=\"0\"><figcaption>Le calcul, à la main<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Consommation<\/div><p>200 − 100 = 100 kWh.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Prix hors taxe<\/div><p>100 × 0,6 = 60 DH.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Taxe<\/div><p>60 × 0,1 = 6 DH.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Total<\/div><p>60 + 6 = 66 DH. L&#39;énoncé annonce « 66 dh » : le programme affiche <code>66.0<\/code> parce que le résultat est un <code>double<\/code>.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p><strong>Exercice 2, question 2 · Facture par tranches.<\/strong> Énoncé : la première tranche, inférieure à 100 kWh, est facturée 0,6 DH l&#39;unité ; la deuxième, entre 100 et 150 kWh, 0,9 DH ; au-delà, 1,1 DH.<\/p>\n<p>Le corrigé fourni choisit <strong>un seul prix<\/strong> selon la consommation totale :<\/p>\n<pre class=\"\"><code>double consomation = NIndex - AIndex;\nif (consomation &lt; 100) {\n    prix = 0.6;\n}\nelse if (consomation &lt; 150) {\n    prix = 0.9;\n}\nelse {\n    prix = 1.1;\n}\ndouble prix_HT = consomation * prix;<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p><strong>Ce corrigé applique le tarif de la tranche atteinte à TOUTE la consommation.<\/strong> Or une facturation « par tranches » facture chaque kWh au prix de <strong>sa<\/strong> tranche : les 100 premiers à 0,6, les 50 suivants à 0,9, le reste à 1,1. Les deux lectures donnent des résultats très différents. Demande au prof laquelle il attend. Voici la version par tranches, écrite par ToumaiLearn et exécutée :<\/p>\n<\/aside><pre class=\"\"><code>double prix_HT;\nif (consomation &lt;= 100)\n    prix_HT = consomation * 0.6;\nelse if (consomation &lt;= 150)\n    prix_HT = 100 * 0.6 + (consomation - 100) * 0.9;\nelse\n    prix_HT = 100 * 0.6 + 50 * 0.9 + (consomation - 150) * 1.1;<\/code><\/pre><figure class=\"grille\"><figcaption>Total TTC selon la version (résultats d'exécution, arrondis)<\/figcaption><table><tr><th>Consommation<\/th><th>Fourni<\/th><th>Tranches<\/th><\/tr><tr><td>80 kWh<\/td><td>52.8<\/td><td>52.8<\/td><\/tr><tr><td>120 kWh<\/td><td class=\"h1\">118.8<\/td><td class=\"h2\">85.8<\/td><\/tr><tr><td>200 kWh<\/td><td class=\"h1\">242.0<\/td><td class=\"h2\">176.0<\/td><\/tr><\/table><\/figure><p>Avec le corrigé fourni, passer de 99 à 100 kWh fait bondir la facture : c&#39;est le signe que le calcul n&#39;est pas « par tranches ».<\/p>\n<h2>Idée 2 · TD 2, exercice 3 : le calcul de l&#39;impôt<\/h2>\n<p><strong>Énoncé, remis au propre.<\/strong> Un contribuable n&#39;a que son salaire annuel S à déclarer.<\/p>\n<ol>\n<li>Nombre de parts : <code>nbEnfants/2 + 2<\/code> s&#39;il est <strong>marié<\/strong>, <code>nbEnfants/2 + 1<\/code> sinon. S&#39;il a <strong>au moins trois enfants<\/strong>, il a <strong>une demi-part de plus<\/strong>.<\/li>\n<li>Revenu imposable : R = 0,72 × S.<\/li>\n<li>Coefficient familial : QF = R / nbParts.<\/li>\n<li>On cherche dans le tableau la <strong>première ligne<\/strong> où QF ≤ champ1. L&#39;impôt vaut alors <code>champ2 × R − champ3 × nbParts<\/code>. Si aucune ligne ne convient, on prend la dernière : <code>0.65 × R − 49062 × nbParts<\/code>.<\/li>\n<\/ol>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>L&#39;énoncé imprimé contient une phrase incohérente : « +1 s&#39;il est <strong>pas divorcé<\/strong>, +2 s&#39;il est marié ». Il faut lire « +1 s&#39;il <strong>n&#39;est pas marié<\/strong> ». C&#39;est ce que fait le corrigé.<\/p>\n<\/aside><p>Le cœur du corrigé fourni :<\/p>\n<pre class=\"\"><code>if (Etat_Civil == 1)\n    nbParts = (nbEnfants/2) + 2;\nelse\n    nbParts = (nbEnfants/2) + 1;\n\nif (nbEnfants &gt;= 3)\n    nbParts += 0.5 * nbParts;\n\ndouble RevenuImposable = 0.72 * S;\ndouble Coef_Familial = RevenuImposable / nbParts;\n\ndouble[] champ1 = {12620.0,13190,15640,24740,31810,39970,48360,55790,92970,127860,151250,172040,195000,0};\ndouble[] champ2 = {0,0.05,0.1,0.15,0.2,0.25,0.3,0.35,0.4,0.45,0.50,0.55,0.60,0.65};\ndouble[] champ3 = {0,631,1290.5,2072.5,3309.5,4900,6898.5,9316.5,12106,16754.5,23147.5,30710,39312,49062};\n\ndouble Impot = 0.0;\nboolean b = false;\nfor (int i = 0; i &lt; champ1.length; i++) {\n    if (Coef_Familial &lt;= champ1[i]) {\n        Impot = champ2[i]*RevenuImposable - champ3[i]*nbParts;\n        b = true;\n        break;\n    }\n}\nif (b == false) {\n    Impot = 0.65*RevenuImposable - 49062*nbParts;\n}<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p><strong>Deux bugs dans ce corrigé<\/strong>, vérifiés par exécution :<\/p>\n<ol>\n<li><strong><code>nbEnfants/2<\/code> est une division entière<\/strong> (les deux sont des <code>int<\/code>). Pour 3 enfants, on obtient 1 au lieu de 1,5. Il faut écrire <code>nbEnfants / 2.0<\/code>.<\/li>\n<li><strong><code>nbParts += 0.5 * nbParts<\/code><\/strong> ajoute la <strong>moitié du nombre de parts<\/strong>, pas « une demi-part ». Il faut écrire <code>nbParts += 0.5;<\/code>.<\/li>\n<\/ol>\n<\/aside><figure class=\"etapes\" data-i=\"0\"><figcaption>Marié, 3 enfants, salaire 200 000 : les deux calculs<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/6 · Selon l&#39;énoncé<\/div><p>nbParts = 3/2 + 2 = 3,5, puis + 0,5 (trois enfants) = <strong>4<\/strong>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/6 · Selon le corrigé fourni<\/div><p><code>3/2<\/code> vaut 1 (division entière), donc 1 + 2 = 3, puis <code>3 + 0.5 × 3<\/code> = <strong>4,5<\/strong>. Résultat différent.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/6 · Suite, avec nbParts = 4<\/div><p>R = 0,72 × 200 000 = 144 000. QF = 144 000 / 4 = 36 000.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/6 · Recherche de la ligne<\/div><p>La première ligne où 36 000 ≤ champ1 est <code>39970  0.25  4900<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/6 · Impôt<\/div><p>0,25 × 144 000 − 4 900 × 4 = 36 000 − 19 600 = <strong>16 400<\/strong>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">6/6 · Avec le corrigé fourni<\/div><p>nbParts = 4,5 donne QF = 32 000, même ligne, impôt = 36 000 − 22 050 = <strong>13 950<\/strong>. L&#39;écart vient uniquement des deux bugs.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p>La version corrigée du calcul des parts (testée : elle donne bien 4,0 parts et 16 400 d&#39;impôt) :<\/p>\n<pre class=\"\"><code>if (Etat_Civil == 1)\n    nbParts = nbEnfants / 2.0 + 2;\nelse\n    nbParts = nbEnfants / 2.0 + 1;\n\nif (nbEnfants &gt;= 3)\n    nbParts += 0.5;<\/code><\/pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>La technique de l&#39;exercice : <strong>trois tableaux parallèles<\/strong> (<code>champ1<\/code>, <code>champ2<\/code>, <code>champ3<\/code>) parcourus avec le même indice, un <strong><code>break<\/code><\/strong> dès que la ligne est trouvée, et un <strong>booléen<\/strong> pour savoir si on a trouvé.<\/p>\n<\/aside><h2>Idée 3 · TD 2, exercices 4 à 6 : les suites<\/h2>\n<p><strong>Exercice 4 · Suite de « Fibonacci »<\/strong> avec U0 = 7, U1 = 4, Un = Un-1 + Un-2.<\/p>\n<pre class=\"\"><code>int a = 7, b = 4, c = 0, n;\nScanner sc = new Scanner(System.in);\nSystem.out.println(&quot;Entrer une valeur de n&gt;=2: &quot;);\nn = sc.nextInt();\nif (n &gt;= 2) {\n    for (int i = 2; i &lt;= n; i++) {\n        c = a + b;\n        a = b;\n        b = c;\n    }\n    System.out.println(&quot;Valeur Fibonacci U&quot; + n + &quot;: &quot; + c);\n}\nelse\n    System.out.println(&quot;Impossible! Entrer une valeur de n&gt;=2! &quot;);<\/code><\/pre><figure class=\"grille\"><figcaption>Les premiers termes (vérifiés par exécution)<\/figcaption><table><tr><th>U0<\/th><th>U1<\/th><th>U2<\/th><th>U3<\/th><th>U4<\/th><th>U5<\/th><\/tr><tr><td>7<\/td><td>4<\/td><td class=\"h1\">11<\/td><td class=\"h1\">15<\/td><td class=\"h1\">26<\/td><td class=\"h1\">41<\/td><\/tr><\/table><\/figure><figure class=\"etapes\" data-i=\"0\"><figcaption>Le glissement des trois variables, pour n = 3<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Départ<\/div><p>a = 7 (U0), b = 4 (U1).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Tour i = 2<\/div><p>c = a + b = 11 (U2). Puis on décale : a = 4, b = 11.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Tour i = 3<\/div><p>c = a + b = 15 (U3). Puis on décale : a = 11, b = 15.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Fin<\/div><p>On affiche c : <code>Valeur Fibonacci U3: 15<\/code>.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le programme refuse n = 0 et n = 1, alors que U0 = 7 et U1 = 4 sont connus. Une version complète afficherait 7 pour n = 0 et 4 pour n = 1.<\/p>\n<\/aside><p><strong>Exercice 5 · Suites Un et Vn.<\/strong> Sur le support fourni, les formules des deux suites sont une <strong>image qui n&#39;a pas pu être lue<\/strong>. D&#39;après le corrigé, les suites calculées sont : U0 = 1, V0 = 0, puis U(n) = V(n−1) + 1 et V(n) = 2 × U(n).<\/p>\n<pre class=\"\"><code>int U = 1, V = 0, n;\nn = sc.nextInt();\nif (n &gt;= 1)\n    for (int i = 0; i &lt;= n; i++) {\n        System.out.println(&quot;U(&quot; + i + &quot;) = &quot; + U);\n        System.out.println(&quot;V(&quot; + i + &quot;) = &quot; + V);\n        U = V + 1;\n        V = 2 * U;\n    }<\/code><\/pre><figure class=\"grille\"><figcaption>Termes affichés pour n = 3 (vérifiés par exécution)<\/figcaption><table><tr><th>n<\/th><th>0<\/th><th>1<\/th><th>2<\/th><th>3<\/th><\/tr><tr><td>U(n)<\/td><td>1<\/td><td>1<\/td><td>3<\/td><td>7<\/td><\/tr><tr><td>V(n)<\/td><td>0<\/td><td>2<\/td><td>6<\/td><td>14<\/td><\/tr><\/table><\/figure><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Vérifie ces formules avec ton énoncé papier : elles sont <strong>déduites du corrigé<\/strong>, pas lues dans l&#39;énoncé.<\/p>\n<\/aside><p><strong>Exercice 6 · Suite de Syracuse.<\/strong> U0 = P. Si Un-1 est pair, Un = Un-1 / 2 ; sinon Un = 3 × Un-1 + 1. On cherche le plus petit n tel que Un = 1, et on affiche tous les termes.<\/p>\n<pre class=\"\"><code>int U, P;\nP = sc.nextInt();\nU = P;\nint i = 0;\nwhile (U != 1) {\n    System.out.println(&quot;U(&quot; + i + &quot;) = &quot; + U);\n    if (U % 2 == 0)\n        U = U / 2;\n    else\n        U = 3 * U + 1;\n    i++;\n}\nSystem.out.println(&quot;U(&quot; + i + &quot;) = &quot; + U);<\/code><\/pre><figure class=\"grille\"><figcaption>Syracuse pour P = 6 : on atteint 1 à n = 8 (vérifié)<\/figcaption><table><tr><th>U0→U4<\/th><td>6<\/td><td>3<\/td><td>10<\/td><td>5<\/td><td>16<\/td><\/tr><tr><th>U5→U8<\/th><td>8<\/td><td>4<\/td><td>2<\/td><td class=\"h1\">1<\/td><td class=\"h0\"><\/td><\/tr><\/table><\/figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Quand on <strong>ne connaît pas à l&#39;avance<\/strong> le nombre de tours, on utilise <code>while<\/code> (Syracuse). Quand on le connaît, <code>for<\/code> (factorielle, Fibonacci). Le test de parité s&#39;écrit <code>U % 2 == 0<\/code>.<\/p>\n<\/aside><h2>Idée 4 · TD 3, exercice 1 : la classe Complexe<\/h2>\n<p>Un complexe a une partie réelle et une partie imaginaire. La classe offre somme, soustraction, multiplication et division. Les getters et setters sont au chapitre 7.<\/p>\n<pre class=\"\"><code>public class Complexe {\n    private double Img, Reel;\n    // getReel, getImg, setReel, setImg : voir chapitre 7\n\n    public Complexe Somme(Complexe W) {\n        Complexe res = new Complexe();\n        res.Reel = this.Reel + W.Reel;\n        res.Img = this.Img + W.Img;\n        return res;\n    }\n\n    public Complexe Sous(Complexe W) {\n        Complexe res = new Complexe();\n        res.Reel = this.Reel - W.Reel;\n        res.Img = this.Img - W.Img;\n        return res;\n    }\n\n    // (a + ib)(c + id) = (ac - bd) + i(ad + bc)\n    public Complexe Multiplication(Complexe W) {\n        Complexe res = new Complexe();\n        res.Reel = this.Reel * W.Reel - this.Img * W.Img;\n        res.Img = this.Reel * W.Img + this.Img * W.Reel;\n        return res;\n    }\n\n    // (a + ib)/(c + id) = ((ac + bd) + i(bc - ad)) / (c*c + d*d)\n    public Complexe Division(Complexe W) {\n        Complexe res = new Complexe();\n        double Mod = W.Reel * W.Reel + W.Img * W.Img;\n        if (Mod != 0) {\n            res.Reel = (this.Reel * W.Reel + this.Img * W.Img) / Mod;\n            res.Img = (this.Img * W.Reel - this.Reel * W.Img) / Mod;\n        }\n        else\n            System.out.println(&quot;Erreur: Division par 0!!! &quot;);\n        return res;\n    }\n}<\/code><\/pre><p>Le programme de test, avec z1 = 3 + 2i et z2 = 1 − 4i :<\/p>\n<pre class=\"\"><code>Complexe z1 = new Complexe();\nz1.setReel(3);\nz1.setImg(2);\nComplexe z2 = new Complexe();\nz2.setReel(1);\nz2.setImg(-4);\n\nComplexe s = z1.Somme(z2);\nSystem.out.println(&quot;Somme : &quot; + s.getReel() + &quot; + i(&quot; + s.getImg() + &quot;)&quot;);\n// même affichage pour Sous, Multiplication et Division<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Somme : 4.0 + i(-2.0)\nSoustraction : 2.0 + i(6.0)\nMultiplication : 11.0 + i(-10.0)\nDivision : -0.29411764705882354 + i(0.8235294117647058)<\/code><\/pre><figure class=\"etapes\" data-i=\"0\"><figcaption>Vérifier la multiplication à la main : (3 + 2i)(1 − 4i)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · On identifie<\/div><p>a = 3, b = 2, c = 1, d = −4.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Partie réelle : ac − bd<\/div><p>3 × 1 − 2 × (−4) = 3 + 8 = <strong>11<\/strong>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Partie imaginaire : ad + bc<\/div><p>3 × (−4) + 2 × 1 = −12 + 2 = <strong>−10<\/strong>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Résultat<\/div><p>11 − 10i, comme l&#39;affiche le programme.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p>Les trois idées de cet exercice :<\/p>\n<table>\n<thead>\n<tr>\n<th>Idée<\/th>\n<th>Où la voir<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Une méthode <strong>reçoit un objet<\/strong> et <strong>renvoie un nouvel objet<\/strong><\/td>\n<td><code>public Complexe Somme(Complexe W)<\/code><\/td>\n<\/tr>\n<tr>\n<td>On crée le résultat avec <code>new<\/code>, on le remplit, on le renvoie<\/td>\n<td><code>Complexe res = new Complexe(); ... return res;<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>this<\/code> est l&#39;objet de gauche, <code>W<\/code> celui de droite<\/td>\n<td><code>z1.Somme(z2)<\/code> : <code>this<\/code> = z1, <code>W<\/code> = z2<\/td>\n<\/tr>\n<\/tbody><\/table>\n<aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>Le corrigé note en commentaire : « si on avait un constructeur, on pourrait écrire <code>return new Complexe(this.Reel + W.Reel, this.Img + W.Img);<\/code> ». Sache écrire les deux versions.<\/p>\n<\/aside><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>En cas de division par zéro, <code>Division<\/code> affiche un message <strong>puis renvoie quand même<\/strong> un complexe 0 + 0i. Le programme appelant ne peut pas savoir que le résultat est invalide. C&#39;est une faiblesse de robustesse (chapitre 1), pas une erreur de calcul.<\/p>\n<\/aside><h2>Idée 5 · TD 3, exercice 2 : la classe Rationnel<\/h2>\n<pre class=\"\"><code>public class Rationnel {\n    private int num, denom;\n\n    public Rationnel(int x, int y) {\n        if (y != 0) {\n            this.num = x;\n            this.denom = y;\n        } else {\n            System.out.println(&quot;Erreur&quot;);\n        }\n    }\n\n    public void Affiche() {\n        System.out.println(&quot;(&quot; + this.num + &quot; / &quot; + this.denom + &quot;)&quot;);\n    }\n\n    public Rationnel Addition(Rationnel r) {\n        Rationnel res = new Rationnel(0, 1);\n        res.num = this.num * r.denom + this.denom * r.num;\n        res.denom = this.denom * r.denom;\n        return res;\n    }\n\n    public Rationnel Multiplication(Rationnel a) {\n        Rationnel res = new Rationnel(0, 1);\n        res.num = this.num * a.num;\n        res.denom = this.denom * a.denom;\n        return res;\n    }\n\n    // (a/b) / (c/d) = ad / bc\n    public Rationnel Division(Rationnel d) {\n        return new Rationnel(this.num * d.denom, this.denom * d.num);\n    }\n}<\/code><\/pre><p>Test avec r1 = 1/2, r2 = 3/4, r3 = 5/6 :<\/p>\n<pre class=\"\"><code>System.out.print(&quot;r1 + r2 = &quot;);\nr1.Addition(r2).Affiche();\nSystem.out.print(&quot;r2 * r3 = &quot;);\nr2.Multiplication(r3).Affiche();\nSystem.out.print(&quot;r1 / r3 = &quot;);\nr1.Division(r3).Affiche();<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>r1 + r2 = (10 / 8)\nr2 * r3 = (15 / 24)\nr1 / r3 = (6 / 10)<\/code><\/pre><figure class=\"etapes\" data-i=\"0\"><figcaption>Vérifier l'addition à la main : 1/2 + 3/4<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · La formule<\/div><p>a/b + c/d = (ad + bc) / (bd).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Numérateur<\/div><p>1 × 4 + 2 × 3 = 4 + 6 = <strong>10<\/strong>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Dénominateur<\/div><p>2 × 4 = <strong>8<\/strong>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Résultat<\/div><p>10/8, comme l&#39;affiche le programme. La fraction n&#39;est <strong>pas simplifiée<\/strong> (elle vaut 5/4).<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p>Deux points à remarquer :<\/p>\n<ul>\n<li><code>r1.Addition(r2).Affiche()<\/code> <strong>enchaîne<\/strong> deux appels : <code>Addition<\/code> renvoie un Rationnel, sur lequel on appelle aussitôt <code>Affiche<\/code>.<\/li>\n<li><code>new Rationnel(0, 1)<\/code> crée un rationnel « neutre » que l&#39;on remplit ensuite. Il faut des arguments, car la classe n&#39;a <strong>pas de constructeur sans paramètre<\/strong>.<\/li>\n<\/ul>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Trois limites du corrigé, vérifiées par exécution :<\/p>\n<ol>\n<li><strong>Dénominateur nul<\/strong> : <code>new Rationnel(1, 0)<\/code> affiche « Erreur », mais l&#39;objet est créé quand même, avec <code>num = 0<\/code> et <code>denom = 0<\/code>. <code>Affiche()<\/code> donne <code>(0 / 0)<\/code>.<\/li>\n<li><strong>Division par un rationnel nul<\/strong> : le commentaire dit « c doit être non nul », mais rien ne le vérifie.<\/li>\n<li><strong>Pas de simplification<\/strong> : 10/8 reste 10/8.<\/li>\n<\/ol>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>À refaire sans regarder<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Facture, question 1 : prix unitaire 0,8 DH, ancien index 150, nouvel index 250. Quel est le prix total ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 88<\/b><\/p><p>Consommation : 100 kWh. Hors taxe : 100 × 0,8 = 80. Taxe : 8. Total : 88 DH.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Suite de l&#39;exercice 4 (U0 = 7, U1 = 4). Que vaut U4 ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 26<\/b><\/p><p>U2 = 11, U3 = 15, U4 = 11 + 15 = 26.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Syracuse avec P = 5 : quel est le plus petit n tel que Un = 1 ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><\/div><div class=\"ex-h\" hidden><p>Écris les termes un par un.<\/p>\n<\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 5<\/b><\/p><p>5, 16, 8, 4, 2, 1 : U5 = 1, donc n = 5.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Quel est le produit (1 + 2i)(3 + i) ? Donne la partie réelle.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1<\/b><\/p><p>ac − bd = 1 × 3 − 2 × 1 = 1. Partie imaginaire : ad + bc = 1 + 6 = 7. Résultat : 1 + 7i.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>Avec la classe Rationnel du TD, qu&#39;affiche <code>new Rationnel(1, 3).Addition(new Rationnel(1, 6)).Affiche();<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>(9 / 18)<\/code>. Numérateur : 1 × 6 + 3 × 1 = 9. Dénominateur : 3 × 6 = 18. La fraction n&#39;est pas simplifiée.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><p>Dans l&#39;exercice de l&#39;impôt, pourquoi <code>nbEnfants/2<\/code> donne-t-il un résultat faux pour 3 enfants ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Parce que <code>nbEnfants<\/code> et <code>2<\/code> sont des entiers : la division est entière et donne 1 au lieu de 1,5. Il faut écrire <code>nbEnfants / 2.0<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"7\"><div class=\"ex-q\"><p>Marié, 2 enfants, salaire annuel 200 000. Calcule l&#39;impôt en suivant l&#39;énoncé.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>nbParts = 2/2 + 2 = 3. Puis R, QF, et la bonne ligne du tableau.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>nbParts = 3. R = 144 000. QF = 48 000. Première ligne où QF ≤ champ1 : <code>48360  0.3  6898.5<\/code>. Impôt = 0,3 × 144 000 − 6 898,5 × 3 = 43 200 − 20 695,5 = <strong>22 504,5<\/strong>. (Vérifié par exécution.)<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 12 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Facture : prix unitaire 0,6 DH, ancien index 100, nouvel index 200, taxe 10 %. Total à payer ?<\/div><button class=\"opt\" data-o=\"0\">60 DH<\/button><button class=\"opt\" data-o=\"1\">66 DH<\/button><button class=\"opt\" data-o=\"2\">72 DH<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Dans le corrigé de l&#39;impôt, que vaut <code>nbEnfants/2<\/code> pour 3 enfants (variables <code>int<\/code>) ?<\/div><button class=\"opt\" data-o=\"0\">1<\/button><button class=\"opt\" data-o=\"1\">1.5<\/button><button class=\"opt\" data-o=\"2\">2<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Que fait <code>nbParts += 0.5 * nbParts;<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">Ajoute une demi-part<\/button><button class=\"opt\" data-o=\"1\">Ajoute la moitié du nombre de parts actuel<\/button><button class=\"opt\" data-o=\"2\">Divise le nombre de parts par deux<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Suite avec U0 = 7, U1 = 4, Un = Un-1 + Un-2. Que vaut U3 ?<\/div><button class=\"opt\" data-o=\"0\">11<\/button><button class=\"opt\" data-o=\"1\">15<\/button><button class=\"opt\" data-o=\"2\">26<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Pourquoi la suite de Syracuse est-elle programmée avec un <code>while<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">Parce que <code>for<\/code> n&#39;existe pas en Java<\/button><button class=\"opt\" data-o=\"1\">Parce qu&#39;on ne connaît pas à l&#39;avance le nombre de tours<\/button><button class=\"opt\" data-o=\"2\">Parce que <code>while<\/code> est plus rapide<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Syracuse pour P = 6 : pour quel n obtient-on Un = 1 ?<\/div><button class=\"opt\" data-o=\"0\">6<\/button><button class=\"opt\" data-o=\"1\">8<\/button><button class=\"opt\" data-o=\"2\">10<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Dans <code>z1.Somme(z2)<\/code>, à l&#39;intérieur de la méthode, <code>this<\/code> désigne :<\/div><button class=\"opt\" data-o=\"0\">z1<\/button><button class=\"opt\" data-o=\"1\">z2<\/button><button class=\"opt\" data-o=\"2\">le résultat<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Que renvoie la méthode <code>Somme<\/code> de la classe Complexe ?<\/div><button class=\"opt\" data-o=\"0\">Rien (void)<\/button><button class=\"opt\" data-o=\"1\">Un double<\/button><button class=\"opt\" data-o=\"2\">Un nouvel objet Complexe<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">(3 + 2i)(1 − 4i) vaut :<\/div><button class=\"opt\" data-o=\"0\">3 − 8i<\/button><button class=\"opt\" data-o=\"1\">11 − 10i<\/button><button class=\"opt\" data-o=\"2\">−5 − 10i<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Avec la classe Rationnel du TD, 1/2 + 3/4 s&#39;affiche :<\/div><button class=\"opt\" data-o=\"0\">(5 / 4)<\/button><button class=\"opt\" data-o=\"1\">(10 / 8)<\/button><button class=\"opt\" data-o=\"2\">(4 / 6)<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"10\"><div class=\"qq-q\">Avec la classe Rationnel du TD, que se passe-t-il pour <code>new Rationnel(1, 0)<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">Le programme s&#39;arrête<\/button><button class=\"opt\" data-o=\"1\">« Erreur » est affiché, mais l&#39;objet est créé avec 0 / 0<\/button><button class=\"opt\" data-o=\"2\">L&#39;objet vaut 1 / 1<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"11\"><div class=\"qq-q\">Pourquoi écrit-on <code>new Rationnel(0, 1)<\/code> et pas <code>new Rationnel()<\/code> dans <code>Addition<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">Par habitude<\/button><button class=\"opt\" data-o=\"1\">Parce que la classe n&#39;a pas de constructeur sans paramètre<\/button><button class=\"opt\" data-o=\"2\">Parce que 0/1 est le résultat attendu<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"td-corriges","rep":null,"tol":null},{"n":"td-corriges","rep":["88"],"tol":null},{"n":"td-corriges","rep":["26"],"tol":null},{"n":"td-corriges","rep":["5"],"tol":null},{"n":"td-corriges","rep":["1"],"tol":null},{"n":"td-corriges","rep":null,"tol":null},{"n":"td-corriges","rep":null,"tol":null},{"n":"td-corriges","rep":null,"tol":null}],"qcm":[{"n":"td-corriges","q":"Facture : prix unitaire 0,6 DH, ancien index 100, nouvel index 200, taxe 10 %. Total à payer ?","o":["60 DH","66 DH","72 DH"],"a":1,"e":"100 kWh × 0,6 = 60 DH, plus 10 % = 66 DH."},{"n":"td-corriges","q":"Dans le corrigé de l&#39;impôt, que vaut <code>nbEnfants/2<\/code> pour 3 enfants (variables <code>int<\/code>) ?","o":["1","1.5","2"],"a":0,"e":"Division entière. C&#39;est le premier bug du corrigé."},{"n":"td-corriges","q":"Que fait <code>nbParts += 0.5 * nbParts;<\/code> ?","o":["Ajoute une demi-part","Ajoute la moitié du nombre de parts actuel","Divise le nombre de parts par deux"],"a":1,"e":"L&#39;énoncé demande une demi-part de plus : il fallait <code>nbParts += 0.5;<\/code>."},{"n":"td-corriges","q":"Suite avec U0 = 7, U1 = 4, Un = Un-1 + Un-2. Que vaut U3 ?","o":["11","15","26"],"a":1,"e":"U2 = 11, U3 = 4 + 11 = 15."},{"n":"td-corriges","q":"Pourquoi la suite de Syracuse est-elle programmée avec un <code>while<\/code> ?","o":["Parce que <code>for<\/code> n&#39;existe pas en Java","Parce qu&#39;on ne connaît pas à l&#39;avance le nombre de tours","Parce que <code>while<\/code> est plus rapide"],"a":1,"e":"On s&#39;arrête quand U vaut 1, sans savoir quand cela arrivera."},{"n":"td-corriges","q":"Syracuse pour P = 6 : pour quel n obtient-on Un = 1 ?","o":["6","8","10"],"a":1,"e":"6, 3, 10, 5, 16, 8, 4, 2, 1 : c&#39;est U8."},{"n":"td-corriges","q":"Dans <code>z1.Somme(z2)<\/code>, à l&#39;intérieur de la méthode, <code>this<\/code> désigne :","o":["z1","z2","le résultat"],"a":0,"e":"Le paramètre W désigne z2."},{"n":"td-corriges","q":"Que renvoie la méthode <code>Somme<\/code> de la classe Complexe ?","o":["Rien (void)","Un double","Un nouvel objet Complexe"],"a":2,"e":"Elle crée <code>res<\/code> avec <code>new<\/code>, le remplit et le renvoie."},{"n":"td-corriges","q":"(3 + 2i)(1 − 4i) vaut :","o":["3 − 8i","11 − 10i","−5 − 10i"],"a":1,"e":"Réel : 3 × 1 − 2 × (−4) = 11. Imaginaire : 3 × (−4) + 2 × 1 = −10."},{"n":"td-corriges","q":"Avec la classe Rationnel du TD, 1/2 + 3/4 s&#39;affiche :","o":["(5 / 4)","(10 / 8)","(4 / 6)"],"a":1,"e":"(1 × 4 + 2 × 3) / (2 × 4). La classe ne simplifie pas les fractions."},{"n":"td-corriges","q":"Avec la classe Rationnel du TD, que se passe-t-il pour <code>new Rationnel(1, 0)<\/code> ?","o":["Le programme s&#39;arrête","« Erreur » est affiché, mais l&#39;objet est créé avec 0 / 0","L&#39;objet vaut 1 / 1"],"a":1,"e":"Le constructeur affiche le message sans empêcher la création de l&#39;objet."},{"n":"td-corriges","q":"Pourquoi écrit-on <code>new Rationnel(0, 1)<\/code> et pas <code>new Rationnel()<\/code> dans <code>Addition<\/code> ?","o":["Par habitude","Parce que la classe n&#39;a pas de constructeur sans paramètre","Parce que 0/1 est le résultat attendu"],"a":1,"e":"Dès qu&#39;un constructeur est écrit, le constructeur par défaut n&#39;existe plus."}]},{"id":"revision-java","t":"Révision express et examen blanc","seance":"Avant l'examen","imp":3,"html":"<h2>Avant de commencer<\/h2>\n<p>Ce chapitre rassemble tout le module. Fais-le quand tu as terminé les neuf chapitres précédents.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Sans regarder : donne la formule d&#39;un objet, et la différence entre une classe et un objet.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><strong>Objet = État + Comportement.<\/strong> La classe est le modèle ; l&#39;objet est une instance de la classe. Si tu as hésité, repasse par le chapitre 2 avant l&#39;examen blanc.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Deux épreuves en une.<\/strong> L&#39;examen de POO mélange des <strong>questions de cours<\/strong> (définitions, comme au TD 1) et de la <strong>lecture ou écriture de code<\/strong> (comme aux TD 2 et 3). Révise les deux séparément : les flashcards pour le cours, le papier et le stylo pour le code.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Réviser le code en le relisant. Lire <code>this.x = x;<\/code> semble évident ; l&#39;écrire de mémoire dans un constructeur, sans oublier <code>this<\/code>, l&#39;est beaucoup moins. <strong>Écris.<\/strong><\/p>\n<\/aside><p>À la fin, tu sais où tu en es sur chaque partie du module.<\/p>\n<h2>Idée 1 · Le cours sur une page<\/h2>\n<table>\n<thead>\n<tr>\n<th>Thème<\/th>\n<th>L&#39;essentiel<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>Paradigme<\/strong><\/td>\n<td>Manière de programmer basée sur un ensemble de principes : procédural (C), objet (Java), descriptif (HTML)<\/td>\n<\/tr>\n<tr>\n<td><strong>Cycle de vie<\/strong><\/td>\n<td>Besoins, analyse, conception, implémentation, tests, validation, maintenance<\/td>\n<\/tr>\n<tr>\n<td><strong>Qualités<\/strong><\/td>\n<td>Exactitude, robustesse, extensibilité, réutilisabilité, portabilité, efficience<\/td>\n<\/tr>\n<tr>\n<td><strong>Wirth<\/strong><\/td>\n<td>Algorithmes + Structures de données = Programmes<\/td>\n<\/tr>\n<tr>\n<td><strong>Objet<\/strong><\/td>\n<td>État (valeurs des attributs) + comportement (méthodes)<\/td>\n<\/tr>\n<tr>\n<td><strong>Classe<\/strong><\/td>\n<td>Modèle d&#39;objets ; l&#39;objet en est une instance<\/td>\n<\/tr>\n<tr>\n<td><strong>Encapsulation<\/strong><\/td>\n<td>Attributs cachés (<code>private<\/code>), accès par les méthodes (<code>public<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><strong>Héritage<\/strong><\/td>\n<td>Nouvelle classe à partir d&#39;une existante : <code>class Fille extends Mere<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong>Polymorphisme<\/strong><\/td>\n<td>« Plusieurs formes » : de méthodes (surcharge, redéfinition) et d&#39;objets<\/td>\n<\/tr>\n<tr>\n<td><strong>Relations<\/strong><\/td>\n<td>Association (« utilise un »), agrégation et composition (« a un »), héritage (« est un »)<\/td>\n<\/tr>\n<tr>\n<td><strong>Tableau<\/strong><\/td>\n<td>Objet ; <code>int[] t = new int[5];<\/code> ; <code>t.length<\/code> ; indices de 0 à taille − 1<\/td>\n<\/tr>\n<tr>\n<td><strong>Référence<\/strong><\/td>\n<td><code>new<\/code> crée l&#39;objet ; <code>=<\/code> copie la référence ; <code>==<\/code> compare les références<\/td>\n<\/tr>\n<tr>\n<td><strong>Constructeur<\/strong><\/td>\n<td>Même nom que la classe, pas de type de retour, surchargeable<\/td>\n<\/tr>\n<tr>\n<td><strong>this<\/strong><\/td>\n<td>Référence sur l&#39;objet courant<\/td>\n<\/tr>\n<tr>\n<td><strong>static<\/strong><\/td>\n<td>Un seul exemplaire pour toute la classe ; appel par <code>Classe.methode()<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong>Objet membre<\/strong><\/td>\n<td>Attribut qui est lui-même un objet (le centre d&#39;un Cercle)<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h2>Idée 2 · Les paires à ne jamais confondre<\/h2>\n<table>\n<thead>\n<tr>\n<th>Ne confonds pas…<\/th>\n<th>…avec<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>Classe<\/strong> (le modèle)<\/td>\n<td><strong>Objet<\/strong> (une instance)<\/td>\n<\/tr>\n<tr>\n<td><strong>Exactitude<\/strong> (cas normal)<\/td>\n<td><strong>Robustesse<\/strong> (cas anormal)<\/td>\n<\/tr>\n<tr>\n<td><strong>Agrégation<\/strong> (la partie survit)<\/td>\n<td><strong>Composition<\/strong> (la partie dépend du tout)<\/td>\n<\/tr>\n<tr>\n<td><strong>Surcharge<\/strong> (même classe, paramètres différents)<\/td>\n<td><strong>Redéfinition<\/strong> (classe fille, mêmes paramètres)<\/td>\n<\/tr>\n<tr>\n<td><strong>Spécialisation<\/strong> (mère vers fille)<\/td>\n<td><strong>Généralisation<\/strong> (fille vers mère)<\/td>\n<\/tr>\n<tr>\n<td><strong><code>=<\/code><\/strong> (copie la référence)<\/td>\n<td><strong><code>==<\/code><\/strong> (compare les références)<\/td>\n<\/tr>\n<tr>\n<td><strong><code>this.x<\/code><\/strong> (l&#39;attribut)<\/td>\n<td><strong><code>x<\/code><\/strong> (le paramètre)<\/td>\n<\/tr>\n<tr>\n<td><strong>Attribut d&#39;instance<\/strong> (un par objet)<\/td>\n<td><strong>Attribut <code>static<\/code><\/strong> (un pour la classe)<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h2>Idée 3 · La classe modèle à savoir écrire les yeux fermés<\/h2>\n<pre class=\"\"><code>public class Point {\n    private double x, y;                          // 1. attributs privés\n\n    public Point(double x, double y) {            // 2. constructeur\n        this.x = x;\n        this.y = y;\n    }\n\n    public double getX() { return x; }            // 3. getter\n    public void setX(double x) { this.x = x; }    //    setter\n\n    public double distance(Point pt) {            // 4. méthode avec paramètre objet\n        return Math.sqrt(Math.pow(pt.x - this.x, 2) + Math.pow(pt.y - this.y, 2));\n    }\n\n    public void afficher() {                      // 5. affichage\n        System.out.println(&quot;[&quot; + this.x + &quot;, &quot; + this.y + &quot;]&quot;);\n    }\n}<\/code><\/pre><figure class=\"etapes\" data-i=\"0\"><figcaption>La check-list d'une classe, dans l'ordre<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/6 · 1. Les attributs<\/div><p><code>private<\/code>, avec leur type.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/6 · 2. Le constructeur<\/div><p>Même nom que la classe, pas de <code>void<\/code>, <code>this.attribut = parametre;<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/6 · 3. Les accesseurs<\/div><p><code>getX()<\/code> renvoie, <code>setX(...)<\/code> modifie.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/6 · 4. Les méthodes métier<\/div><p>Elles utilisent <code>this<\/code> pour l&#39;objet courant, et le paramètre pour l&#39;autre objet.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/6 · 5. L&#39;affichage<\/div><p>Une méthode <code>afficher()<\/code> avec <code>System.out.println<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">6/6 · 6. La classe de test<\/div><p>Une autre classe avec <code>public static void main(String[] args)<\/code>, qui fait les <code>new<\/code> et appelle les méthodes.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Aucune annale ni barème d&#39;examen de ce module n&#39;a été fourni : le format réel de l&#39;épreuve n&#39;est pas connu. L&#39;examen blanc ci-dessous est construit par ToumaiLearn à partir des séances 1 à 5 et des TD 1 à 3. La suite du programme (héritage en Java, classes abstraites, interfaces, exceptions) n&#39;est pas encore couverte.<\/p>\n<\/aside><figure class=\"flux\"><figcaption>Ton plan des trois derniers jours<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">J-3 : QCM des chapitres 1 à 3 + flashcards<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">J-2 : QCM des chapitres 4 à 8, refaire les TD 2 et 3 sur papier<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">J-1 : examen blanc sans rien regarder<\/div><\/div><\/figure><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Comme à l&#39;écrit<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Définis l&#39;encapsulation et dis comment Java la met en œuvre.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>L&#39;encapsulation consiste à regrouper les données et les méthodes dans une classe en cachant l&#39;état interne : on n&#39;accède aux données que par les méthodes. En Java, on déclare les attributs <code>private<\/code> et on fournit des méthodes <code>public<\/code> (getters, setters).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Quelle est la différence entre surcharge et redéfinition ? Donne un exemple de chacune.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><strong>Surcharge<\/strong> : même nom, paramètres différents, dans la même classe (<code>afficher(int)<\/code> et <code>afficher(String)<\/code>). <strong>Redéfinition<\/strong> : même nom, mêmes paramètres, dans la classe fille, pour remplacer la méthode héritée (<code>salut()<\/code> dans A et dans B).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Écris une classe <code>Rectangle<\/code> avec deux attributs privés <code>largeur<\/code> et <code>hauteur<\/code>, un constructeur et une méthode <code>surface()<\/code>.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>public class Rectangle { private double largeur, hauteur; public Rectangle(double largeur, double hauteur) { this.largeur = largeur; this.hauteur = hauteur; } public double surface() { return largeur * hauteur; } }<\/code><\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Combien d&#39;objets et combien de références ? <code>Point a = new Point(1, 2); Point b = a; Point c = new Point(1, 2);<\/code> Et que valent <code>a == b<\/code> et <code>a == c<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Deux objets (deux <code>new<\/code>), trois références. <code>a == b<\/code> vaut <code>true<\/code> (même objet). <code>a == c<\/code> vaut <code>false<\/code> (deux objets distincts, même contenu).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>Qu&#39;affiche <code>System.out.println(&q
