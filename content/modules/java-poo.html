<script>
const MODULE={"slug":"java-poo","titre":"Programmation orientée objet en Java","cle":"java_poo_scores","cleEtat":"java_poo_scores_etat","format":"score10","intro":"<p>Ce module suit l&#39;ordre des séances : d&#39;abord <strong>les idées<\/strong> de la programmation orientée objet (sans code), puis <strong>Java<\/strong> lui-même.<\/p>\n<p><strong>Chaque chapitre a trois temps<\/strong><\/p>\n<ol>\n<li><strong>Avant de commencer<\/strong> : ce qu&#39;il faut déjà savoir, avec une question pour vérifier.<\/li>\n<li><strong>Comment l&#39;aborder<\/strong> : l&#39;état d&#39;esprit qui rend le chapitre simple, et le piège classique.<\/li>\n<li><strong>Les idées, illustrées<\/strong> : un schéma, une phrase, un exemple.<\/li>\n<\/ol>\n<p>Termine par le QCM : <strong>8/10 = chapitre maîtrisé<\/strong>.<\/p>\n<p>Tous les programmes de ce module ont été <strong>compilés et exécutés<\/strong> : les sorties affichées sont les vraies. Le module est rédigé à partir de notes de séances et des TD 1 à 3, pas d&#39;un polycopié officiel : en cas de différence avec ce que dit ton prof, c&#39;est ton prof qui a raison.<\/p>\n<p>Le conseil qui change tout : <strong>tape les programmes toi-même<\/strong>. Lire du Java ne suffit pas, il faut le faire compiler.<\/p>\n","annexes":[],"cartes":null,"maths":false};
const CHAPS=[{"id":"paradigmes","t":"Paradigmes, cycle de vie et qualités d'un logiciel","seance":"Séance 1 · Chapitre 1 · TD 1 (exercices 1 et 2)","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu dois avoir déjà écrit un programme en C : des variables, des fonctions, un <code>main<\/code>. C&#39;est ce qu&#39;on appelle la programmation procédurale.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>En C, tu as une fonction <code>moyenne(int tab[], int n)<\/code>. Où sont rangées les données, et où est rangé le traitement ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Les <strong>données<\/strong> sont dans le tableau, déclaré ailleurs. Le <strong>traitement<\/strong> est dans la fonction. Les deux sont <strong>séparés<\/strong> : c&#39;est le point de départ de tout le chapitre.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « histoire d&#39;un problème ».<\/strong> Les programmes sont devenus trop gros. On a essayé de réutiliser du code, et ça cassait. La programmation orientée objet (POO) est la réponse. Chaque définition du chapitre est une étape de cette histoire.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Ce chapitre n&#39;a aucun code, alors beaucoup le survolent. Pourtant le <strong>TD 1 est fait uniquement de questions de cours<\/strong> : définitions, listes, comparaisons. Ce sont des points faciles à l&#39;examen, à condition de connaître les mots exacts.<\/p>\n<\/aside><p>À la fin, tu sais définir un paradigme, citer le cycle de vie en 7 étapes, les qualités d&#39;un logiciel, et expliquer pourquoi on est passé à la POO.<\/p>\n<h2>Idée 1 · Un paradigme est une manière de programmer<\/h2>\n<p><strong>Définition.<\/strong> Un paradigme est une <strong>manière de programmer un ordinateur, basée sur un ensemble de principes ou une théorie<\/strong>.<\/p>\n<svg viewBox=\"0 0 360 120\" style=\"width:100%;max-width:460px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Trois paradigmes : procédural avec C, orienté objet avec Java, descriptif avec HTML\">\n<g font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"6\" y=\"14\" width=\"108\" height=\"92\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"60\" y=\"36\" font-weight=\"700\">Procédural<\/text><text x=\"60\" y=\"56\" font-size=\"10\">appel de procédures<\/text><text x=\"60\" y=\"70\" font-size=\"10\">et de fonctions<\/text><text x=\"60\" y=\"94\">C<\/text>\n<rect x=\"126\" y=\"14\" width=\"108\" height=\"92\" rx=\"8\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/><text x=\"180\" y=\"36\" font-weight=\"700\" fill=\"#D9824F\">Orienté objet<\/text><text x=\"180\" y=\"56\" font-size=\"10\">assemblage de briques<\/text><text x=\"180\" y=\"70\" font-size=\"10\">appelées objets<\/text><text x=\"180\" y=\"94\">Java, C++<\/text>\n<rect x=\"246\" y=\"14\" width=\"108\" height=\"92\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"300\" y=\"36\" font-weight=\"700\">Descriptif<\/text><text x=\"300\" y=\"56\" font-size=\"10\">décrire des structures<\/text><text x=\"300\" y=\"70\" font-size=\"10\">de données<\/text><text x=\"300\" y=\"94\">HTML, XML<\/text>\n<\/g>\n<\/svg><table>\n<thead>\n<tr>\n<th>Paradigme<\/th>\n<th>Principe<\/th>\n<th>Exemple<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>Programmation procédurale<\/strong><\/td>\n<td>Se fonde sur le concept d&#39;<strong>appel procédural<\/strong> : le programme tourne autour de procédures ou de fonctions<\/td>\n<td>C<\/td>\n<\/tr>\n<tr>\n<td><strong>Programmation orientée objet<\/strong><\/td>\n<td>Consiste en la définition et l&#39;assemblage de <strong>briques logicielles appelées objets<\/strong><\/td>\n<td>Java, C++<\/td>\n<\/tr>\n<tr>\n<td><strong>Programmation descriptive<\/strong><\/td>\n<td>Permet de <strong>décrire des structures de données<\/strong><\/td>\n<td>HTML, XML<\/td>\n<\/tr>\n<\/tbody><\/table>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Procédural : on pense <strong>actions<\/strong> (fonctions). Objet : on pense <strong>choses<\/strong> (objets). Descriptif : on <strong>décrit<\/strong>, on ne calcule pas.<\/p>\n<\/aside><h2>Idée 2 · Le cycle de vie d&#39;un logiciel en 7 étapes<\/h2>\n<p>Construire un logiciel devient complexe parce qu&#39;il demande <strong>plusieurs ressources humaines, matérielles et technologiques<\/strong>. On découpe donc le travail en étapes.<\/p>\n<figure class=\"flux\"><figcaption>Le cycle de vie, dans l'ordre<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">1. Expression des besoins<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">2. Analyse<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">3. Conception<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">4. Implémentation<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">5. Tests<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">6. Validation<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">7. Maintenance et évolution<\/div><\/div><\/figure><figure class=\"etapes\" data-i=\"0\"><figcaption>Les 7 étapes, une par une<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/7 · 1. L&#39;expression des besoins<\/div><p>Le client dit ce qu&#39;il veut.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/7 · 2. L&#39;analyse<\/div><p>On comprend et on précise le problème.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/7 · 3. La conception<\/div><p>On dessine la solution (classes, relations) avant de coder.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/7 · 4. L&#39;implémentation<\/div><p>On écrit le code.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/7 · 5. Les tests<\/div><p>On vérifie que le code fonctionne.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">6/7 · 6. La validation<\/div><p>On vérifie que le logiciel répond bien au besoin du client.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">7/7 · 7. La maintenance et l&#39;évolution<\/div><p>Pendant la <strong>phase d&#39;exploitation<\/strong>, on corrige et on fait évoluer.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Les notes donnent seulement les <strong>noms<\/strong> des sept étapes. La phrase d&#39;explication de chaque étape ci-dessus est ajoutée par ToumaiLearn. En examen, ce sont les noms et leur ordre qui comptent.<\/p>\n<\/aside><aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Pour l&#39;ordre : « <strong>B<\/strong>eaucoup d&#39;<strong>A<\/strong>mis <strong>C<\/strong>odent, <strong>I<\/strong>ls <strong>T<\/strong>estent, <strong>V<\/strong>alident et <strong>M<\/strong>aintiennent » : Besoins, Analyse, Conception, Implémentation, Tests, Validation, Maintenance.<\/p>\n<\/aside><h2>Idée 3 · Les six qualités d&#39;un logiciel<\/h2>\n<table>\n<thead>\n<tr>\n<th>Qualité<\/th>\n<th>Définition<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>Exactitude<\/strong><\/td>\n<td>Le programme donne le résultat que l&#39;on veut ; il répond aux spécifications<\/td>\n<\/tr>\n<tr>\n<td><strong>Robustesse<\/strong><\/td>\n<td>Le programme sait bien réagir quand on s&#39;écarte des conditions normales d&#39;utilisation<\/td>\n<\/tr>\n<tr>\n<td><strong>Extensibilité<\/strong><\/td>\n<td>Le programme peut être adapté pour répondre à l&#39;évolution des spécifications<\/td>\n<\/tr>\n<tr>\n<td><strong>Réutilisabilité<\/strong><\/td>\n<td>On peut utiliser certaines parties du logiciel pour résoudre un autre problème<\/td>\n<\/tr>\n<tr>\n<td><strong>Portabilité<\/strong><\/td>\n<td>On peut exploiter le même logiciel sur d&#39;autres machines ou implémentations<\/td>\n<\/tr>\n<tr>\n<td><strong>Efficience<\/strong><\/td>\n<td>Temps d&#39;exécution et taille mémoire<\/td>\n<\/tr>\n<\/tbody><\/table>\n<svg viewBox=\"0 0 360 86\" style=\"width:100%;max-width:460px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Exactitude : conditions normales. Robustesse : conditions anormales.\">\n<g font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"10\" y=\"12\" width=\"160\" height=\"62\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"90\" y=\"34\" font-weight=\"700\">Exactitude<\/text><text x=\"90\" y=\"52\" font-size=\"10\">utilisation normale<\/text><text x=\"90\" y=\"66\" font-size=\"10\">le bon résultat<\/text>\n<rect x=\"190\" y=\"12\" width=\"160\" height=\"62\" rx=\"8\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/><text x=\"270\" y=\"34\" font-weight=\"700\" fill=\"#D9824F\">Robustesse<\/text><text x=\"270\" y=\"52\" font-size=\"10\">utilisation anormale<\/text><text x=\"270\" y=\"66\" font-size=\"10\">une bonne réaction<\/text>\n<\/g>\n<\/svg><p>Exemple : un programme de division. <strong>Exact<\/strong> : 10 / 2 affiche 5. <strong>Robuste<\/strong> : 10 / 0 affiche « division impossible » au lieu de planter.<\/p>\n<aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Exactitude et robustesse se confondent facilement. L&#39;exactitude concerne le cas <strong>normal<\/strong>, la robustesse le cas <strong>anormal<\/strong>.<\/p>\n<\/aside><h2>Idée 4 · De la programmation structurée à la POO<\/h2>\n<p>L&#39;équation de <strong>Wirth<\/strong> résume la programmation structurée :<\/p>\n<figure class=\"flux\"><figcaption>L'équation de Wirth<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">Algorithmes + Structures de données = Programmes<\/div><\/div><\/figure><p>Le problème : la programmation structurée <strong>ne suffit plus pour les grands systèmes logiciels<\/strong>. En pratique, pour <strong>étendre et réutiliser<\/strong> un logiciel, il fallait souvent <strong>« casser » le module intéressant<\/strong>, parce qu&#39;il était nécessaire de remettre en cause une structure de données.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Pourquoi on est passé à la POO<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Le point de départ<\/div><p>En procédural, les données et les fonctions sont séparées (équation de Wirth).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · Le besoin<\/div><p>On veut réutiliser un module dans un autre projet, avec des données un peu différentes.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · Le blocage<\/div><p>Pour l&#39;adapter, il faut modifier la structure de données, donc « casser » le module.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · La réponse de la POO<\/div><p>Des composants autonomes, les objets, qui regroupent données et traitements. Et l&#39;<strong>héritage<\/strong> : on crée une nouvelle classe à partir d&#39;une existante, sans la casser.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · La conclusion à écrire<\/div><p>La <strong>réutilisation<\/strong> et la <strong>modularité<\/strong> sont les deux objectifs qui ont fait évoluer les paradigmes, jusqu&#39;à la POO qui les réalise le mieux.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p>En POO, le logiciel est fait de <strong>composants autonomes<\/strong>, les « objets », qui disposent de ressources et de moyens d&#39;interaction entre eux.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>TD 1 · exercices 1 et 2<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Définis un paradigme de programmation.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Un paradigme est une manière de programmer un ordinateur, basée sur un ensemble de principes ou une théorie.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Donne trois exemples de paradigmes avec leur principe et un langage.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><strong>Procédural<\/strong> : fondé sur l&#39;appel procédural (C). <strong>Orienté objet<\/strong> : définition et assemblage de briques logicielles appelées objets (Java). <strong>Descriptif<\/strong> : permet de décrire des structures de données (HTML, XML).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Pourquoi la construction d&#39;un logiciel devient-elle complexe ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Parce qu&#39;elle nécessite plusieurs ressources humaines, matérielles et technologiques.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Cite les étapes du cycle de vie d&#39;un logiciel.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><ol>\n<li>L&#39;expression des besoins. 2) L&#39;analyse. 3) La conception. 4) L&#39;implémentation. 5) Les tests. 6) La validation. 7) La maintenance et l&#39;évolution pendant la phase d&#39;exploitation.<\/li>\n<\/ol>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>Donne deux qualités d&#39;un logiciel et définis-les.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><strong>Exactitude<\/strong> : aptitude d&#39;un programme à fournir le résultat voulu et à répondre aux spécifications. <strong>Robustesse<\/strong> : aptitude à bien réagir lorsque l&#39;on s&#39;écarte des conditions normales d&#39;utilisation.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><p>Écris l&#39;équation de Wirth.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Algorithmes + Structures de données = Programmes.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"7\"><div class=\"ex-q\"><p>Quel est le problème de la programmation procédurale, et quelle solution apporte la POO ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>La programmation structurée ne suffit plus pour les grands systèmes : réutiliser un logiciel conduisait souvent à « casser » le module intéressant. La POO apporte une solution grâce au concept d&#39;héritage entre classes.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 15 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Qu&#39;est-ce qu&#39;un paradigme de programmation ?<\/div><button class=\"opt\" data-o=\"0\">Un langage de programmation particulier<\/button><button class=\"opt\" data-o=\"1\">Une manière de programmer basée sur un ensemble de principes ou une théorie<\/button><button class=\"opt\" data-o=\"2\">Un logiciel qui traduit le code en binaire<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Quel langage illustre la programmation procédurale dans le cours ?<\/div><button class=\"opt\" data-o=\"0\">C<\/button><button class=\"opt\" data-o=\"1\">Java<\/button><button class=\"opt\" data-o=\"2\">HTML<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">HTML et XML relèvent de la programmation :<\/div><button class=\"opt\" data-o=\"0\">procédurale<\/button><button class=\"opt\" data-o=\"1\">orientée objet<\/button><button class=\"opt\" data-o=\"2\">descriptive<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Quelle est la première étape du cycle de vie d&#39;un logiciel ?<\/div><button class=\"opt\" data-o=\"0\">L&#39;analyse<\/button><button class=\"opt\" data-o=\"1\">L&#39;expression des besoins<\/button><button class=\"opt\" data-o=\"2\">La conception<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Dans le cycle de vie, quelle étape vient juste après l&#39;implémentation ?<\/div><button class=\"opt\" data-o=\"0\">La validation<\/button><button class=\"opt\" data-o=\"1\">La conception<\/button><button class=\"opt\" data-o=\"2\">Les tests<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Un programme qui affiche un message clair au lieu de planter quand on saisit une lettre à la place d&#39;un nombre est :<\/div><button class=\"opt\" data-o=\"0\">extensible<\/button><button class=\"opt\" data-o=\"1\">robuste<\/button><button class=\"opt\" data-o=\"2\">portable<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Le même logiciel fonctionne sur Windows et sur Linux. Quelle qualité est en jeu ?<\/div><button class=\"opt\" data-o=\"0\">La réutilisabilité<\/button><button class=\"opt\" data-o=\"1\">L&#39;efficience<\/button><button class=\"opt\" data-o=\"2\">La portabilité<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">L&#39;efficience d&#39;un logiciel concerne :<\/div><button class=\"opt\" data-o=\"0\">le temps d&#39;exécution et la taille mémoire<\/button><button class=\"opt\" data-o=\"1\">le nombre de développeurs<\/button><button class=\"opt\" data-o=\"2\">la beauté de l&#39;interface<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Complète l&#39;équation de Wirth : Algorithmes + … = Programmes.<\/div><button class=\"opt\" data-o=\"0\">Objets<\/button><button class=\"opt\" data-o=\"1\">Structures de données<\/button><button class=\"opt\" data-o=\"2\">Fonctions<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Pourquoi la programmation structurée ne suffit-elle plus pour les grands systèmes ?<\/div><button class=\"opt\" data-o=\"0\">Elle est trop lente à l&#39;exécution<\/button><button class=\"opt\" data-o=\"1\">Réutiliser un module obligeait souvent à le « casser »<\/button><button class=\"opt\" data-o=\"2\">Elle ne permet pas d&#39;écrire des fonctions<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"10\"><div class=\"qq-q\">Quels sont les deux objectifs qui ont fait évoluer les paradigmes jusqu&#39;à la POO ?<\/div><button class=\"opt\" data-o=\"0\">La vitesse et la sécurité<\/button><button class=\"opt\" data-o=\"1\">La réutilisation et la modularité<\/button><button class=\"opt\" data-o=\"2\">La portabilité et l&#39;efficience<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"paradigmes","rep":null,"tol":null},{"n":"paradigmes","rep":null,"tol":null},{"n":"paradigmes","rep":null,"tol":null},{"n":"paradigmes","rep":null,"tol":null},{"n":"paradigmes","rep":null,"tol":null},{"n":"paradigmes","rep":null,"tol":null},{"n":"paradigmes","rep":null,"tol":null},{"n":"paradigmes","rep":null,"tol":null}],"qcm":[{"n":"paradigmes","q":"Qu&#39;est-ce qu&#39;un paradigme de programmation ?","o":["Un langage de programmation particulier","Une manière de programmer basée sur un ensemble de principes ou une théorie","Un logiciel qui traduit le code en binaire"],"a":1,"e":"C, Java ou HTML sont des langages ; le paradigme est la façon de penser le programme."},{"n":"paradigmes","q":"Quel langage illustre la programmation procédurale dans le cours ?","o":["C","Java","HTML"],"a":0,"e":"Java illustre l&#39;orienté objet, HTML le descriptif."},{"n":"paradigmes","q":"HTML et XML relèvent de la programmation :","o":["procédurale","orientée objet","descriptive"],"a":2,"e":"Ils décrivent des structures de données, ils ne calculent pas."},{"n":"paradigmes","q":"Quelle est la première étape du cycle de vie d&#39;un logiciel ?","o":["L&#39;analyse","L&#39;expression des besoins","La conception"],"a":1,"e":"On commence par savoir ce que veut le client."},{"n":"paradigmes","q":"Dans le cycle de vie, quelle étape vient juste après l&#39;implémentation ?","o":["La validation","La conception","Les tests"],"a":2,"e":"Ordre : besoins, analyse, conception, implémentation, tests, validation, maintenance."},{"n":"paradigmes","q":"Un programme qui affiche un message clair au lieu de planter quand on saisit une lettre à la place d&#39;un nombre est :","o":["extensible","robuste","portable"],"a":1,"e":"La robustesse, c&#39;est bien réagir hors des conditions normales d&#39;utilisation."},{"n":"paradigmes","q":"Le même logiciel fonctionne sur Windows et sur Linux. Quelle qualité est en jeu ?","o":["La réutilisabilité","L&#39;efficience","La portabilité"],"a":2,"e":"Portabilité : exploiter le même logiciel sur d&#39;autres machines ou implémentations."},{"n":"paradigmes","q":"L&#39;efficience d&#39;un logiciel concerne :","o":["le temps d&#39;exécution et la taille mémoire","le nombre de développeurs","la beauté de l&#39;interface"],"a":0,"e":"C&#39;est la définition donnée dans le cours."},{"n":"paradigmes","q":"Complète l&#39;équation de Wirth : Algorithmes + … = Programmes.","o":["Objets","Structures de données","Fonctions"],"a":1,"e":"C&#39;est le résumé de la programmation structurée."},{"n":"paradigmes","q":"Pourquoi la programmation structurée ne suffit-elle plus pour les grands systèmes ?","o":["Elle est trop lente à l&#39;exécution","Réutiliser un module obligeait souvent à le « casser »","Elle ne permet pas d&#39;écrire des fonctions"],"a":1,"e":"Il fallait remettre en cause une structure de données pour étendre ou réutiliser."},{"n":"paradigmes","q":"Quels sont les deux objectifs qui ont fait évoluer les paradigmes jusqu&#39;à la POO ?","o":["La vitesse et la sécurité","La réutilisation et la modularité","La portabilité et l&#39;efficience"],"a":1,"e":"La POO est le paradigme qui les réalise le mieux."}]},{"id":"concepts-poo","t":"Objet, classe et les trois piliers de la POO","seance":"Séance 1 · TD 1 (exercices 3 et 4)","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu dois savoir pourquoi on est passé du procédural à la POO : pour mieux <strong>réutiliser<\/strong> et <strong>modulariser<\/strong> (chapitre 1).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>En programmation procédurale, les données et les fonctions sont-elles regroupées ou séparées ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><strong>Séparées<\/strong> (Algorithmes + Structures de données). La POO fait l&#39;inverse : elle les <strong>regroupe<\/strong> dans un objet. Garde cette opposition en tête pour tout le chapitre.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « moule et gâteaux ».<\/strong> La classe est le moule : elle décrit la forme. Les objets sont les gâteaux : chacun est concret, avec son propre contenu. Un seul moule, autant de gâteaux que tu veux.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Le cours pose la question : « L&#39;objet arrive avant la classe ? » <strong>Non.<\/strong> Il faut le moule avant le gâteau : on définit la classe, puis on crée des objets à partir d&#39;elle.<\/p>\n<\/aside><p>À la fin, tu sais définir objet, classe, instance, attribut, méthode, et expliquer encapsulation, héritage et polymorphisme.<\/p>\n<h2>Idée 1 · Un objet, c&#39;est un état plus un comportement<\/h2>\n<svg viewBox=\"0 0 360 120\" style=\"width:100%;max-width:460px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Un objet regroupe un état, ses données, et un comportement, ses méthodes\">\n<g font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"90\" y=\"8\" width=\"180\" height=\"104\" rx=\"10\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/><text x=\"180\" y=\"26\" font-weight=\"700\" fill=\"#D9824F\">Objet « Bob »<\/text>\n<rect x=\"102\" y=\"36\" width=\"72\" height=\"64\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"138\" y=\"54\" font-weight=\"700\">État<\/text><text x=\"138\" y=\"70\" font-size=\"10\">nom = Bob<\/text><text x=\"138\" y=\"84\" font-size=\"10\">poste = directeur<\/text>\n<rect x=\"186\" y=\"36\" width=\"72\" height=\"64\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"222\" y=\"54\" font-weight=\"700\">Comportement<\/text><text x=\"222\" y=\"70\" font-size=\"10\">travailler()<\/text><text x=\"222\" y=\"84\" font-size=\"10\">sePresenter()<\/text>\n<text x=\"40\" y=\"64\" font-size=\"10\">message<\/text>\n<\/g>\n<path d=\"M8 72h78\" stroke=\"currentColor\" stroke-width=\"2\"/><path d=\"M80 67l6 5-6 5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<\/svg><p><strong>Objet = État + Comportement.<\/strong> C&#39;est une <strong>entité autonome<\/strong> qui regroupe un état et les opérations permettant de manipuler cet état.<\/p>\n<table>\n<thead>\n<tr>\n<th>Mot<\/th>\n<th>Définition<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>État<\/strong><\/td>\n<td>Les <strong>valeurs des attributs<\/strong> de l&#39;objet (ses données)<\/td>\n<\/tr>\n<tr>\n<td><strong>Comportement<\/strong><\/td>\n<td>Les <strong>opérations possibles<\/strong> sur l&#39;objet, déclenchées par des <strong>stimulations externes<\/strong> (appels de méthodes, ou « messages »)<\/td>\n<\/tr>\n<tr>\n<td><strong>Message<\/strong><\/td>\n<td>On « envoie un message » à un objet quand on <strong>appelle une de ses méthodes<\/strong><\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Exemple du cours : l&#39;objet <strong>Bob<\/strong>, dont l&#39;état contient « directeur ».<\/p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>« L&#39;appel d&#39;une méthode est en fait l&#39;envoi d&#39;un <strong>message<\/strong> à l&#39;objet. »<\/p>\n<\/aside><h2>Idée 2 · La classe est le modèle, l&#39;objet est l&#39;instance<\/h2>\n<svg viewBox=\"0 0 360 150\" style=\"width:100%;max-width:460px;display:block;margin:10px auto\" role=\"img\" aria-label=\"La classe Point, en trois cases, et son instance PremierPoint avec les valeurs de ses attributs\">\n<g font-family=\"sans-serif\" font-size=\"11\" fill=\"currentColor\">\n<rect x=\"20\" y=\"10\" width=\"120\" height=\"96\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"20\" y1=\"36\" x2=\"140\" y2=\"36\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"20\" y1=\"70\" x2=\"140\" y2=\"70\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<text x=\"80\" y=\"27\" text-anchor=\"middle\" font-weight=\"700\">Point<\/text><text x=\"28\" y=\"50\">coordX<\/text><text x=\"28\" y=\"63\">coordY<\/text><text x=\"28\" y=\"86\">deplacer()<\/text><text x=\"28\" y=\"99\">afficher()<\/text>\n<text x=\"80\" y=\"124\" text-anchor=\"middle\" font-size=\"10\">la classe (le modèle)<\/text>\n<rect x=\"220\" y=\"26\" width=\"124\" height=\"66\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/><line x1=\"220\" y1=\"50\" x2=\"344\" y2=\"50\" stroke=\"#D9824F\" stroke-width=\"2\"/>\n<text x=\"282\" y=\"42\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#D9824F\">premierPoint<\/text><text x=\"228\" y=\"66\">coordX = 12.45<\/text><text x=\"228\" y=\"81\">coordY = 13.45<\/text>\n<text x=\"282\" y=\"110\" text-anchor=\"middle\" font-size=\"10\">l'objet (une instance)<\/text>\n<text x=\"180\" y=\"50\" text-anchor=\"middle\" font-size=\"10\">« instance of »<\/text>\n<\/g>\n<path d=\"M218 58H146\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><path d=\"M152 53l-6 5 6 5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<\/svg><p><strong>Classe.<\/strong> Un <strong>modèle<\/strong> (une description) d&#39;un ensemble d&#39;objets qui ont la <strong>même structure de données<\/strong> et les <strong>mêmes méthodes<\/strong>, mais des <strong>valeurs différentes<\/strong> pour chaque objet.<\/p>\n<p><strong>Objet.<\/strong> Une <strong>instance<\/strong> de la classe : un objet concret, créé à partir de cette classe. Créer un objet à partir d&#39;une classe s&#39;appelle l&#39;<strong>instanciation<\/strong>.<\/p>\n<p>Une classe a deux composantes :<\/p>\n<table>\n<thead>\n<tr>\n<th>Composante<\/th>\n<th>Nom en POO<\/th>\n<th>Rôle<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Données<\/td>\n<td><strong>Attributs<\/strong><\/td>\n<td>Variables qui décrivent l&#39;état<\/td>\n<\/tr>\n<tr>\n<td>Comportements, traitements<\/td>\n<td><strong>Méthodes<\/strong><\/td>\n<td>Fonctions que l&#39;objet peut exécuter<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>On dessine une classe en <strong>trois cases<\/strong> : le nom de la classe, les attributs, les méthodes.<\/p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Chaque objet de la classe Point possède <strong>son propre état<\/strong>. Deux points ont les mêmes attributs (coordX, coordY) mais pas les mêmes valeurs.<\/p>\n<\/aside><p>Trois faits sur les objets :<\/p>\n<ul>\n<li>les valeurs des attributs caractérisent l&#39;<strong>état<\/strong> de l&#39;objet ;<\/li>\n<li>l&#39;objet peut faire appel à <strong>n&#39;importe quelle méthode<\/strong> de sa classe ;<\/li>\n<li>tout objet est identifié et manipulé par sa <strong>référence<\/strong>.<\/li>\n<\/ul>\n<h2>Idée 3 · L&#39;encapsulation : cacher l&#39;état, passer par les méthodes<\/h2>\n<svg viewBox=\"0 0 360 110\" style=\"width:100%;max-width:460px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Les attributs sont cachés à l'intérieur, les méthodes forment l'interface autour\">\n<g font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"110\" y=\"8\" width=\"140\" height=\"94\" rx=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"180\" y=\"24\">méthodes (public)<\/text>\n<rect x=\"134\" y=\"34\" width=\"92\" height=\"52\" rx=\"8\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/><text x=\"180\" y=\"56\" fill=\"#D9824F\" font-weight=\"700\">attributs<\/text><text x=\"180\" y=\"72\" font-size=\"10\">(private)<\/text>\n<text x=\"42\" y=\"44\">extérieur<\/text><text x=\"318\" y=\"62\" font-size=\"10\">accès direct<\/text><text x=\"318\" y=\"76\" font-size=\"10\">interdit<\/text>\n<\/g>\n<path d=\"M14 58h92\" stroke=\"currentColor\" stroke-width=\"2\"/><path d=\"M100 53l6 5-6 5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<path d=\"M290 40L232 54\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"4 3\"/><path d=\"M252 40l14 16M266 40l-14 16\" stroke=\"#D9824F\" stroke-width=\"2.5\"/>\n<\/svg><p><strong>Encapsulation.<\/strong> C&#39;est <strong>regrouper les données et les méthodes<\/strong> dans une classe, tout en <strong>cachant l&#39;état interne<\/strong> : on y accède <strong>uniquement via des méthodes<\/strong>, qui jouent le rôle d&#39;<strong>interface<\/strong>.<\/p>\n<p>Elle repose sur deux niveaux de visibilité :<\/p>\n<table>\n<thead>\n<tr>\n<th>Mot<\/th>\n<th>Symbole dans un diagramme<\/th>\n<th>Visibilité<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>public<\/strong><\/td>\n<td><code>+<\/code><\/td>\n<td>À l&#39;intérieur <strong>et<\/strong> à l&#39;extérieur de la classe : accessible par tous<\/td>\n<\/tr>\n<tr>\n<td><strong>private<\/strong><\/td>\n<td><code>-<\/code><\/td>\n<td>Limitée à l&#39;<strong>intérieur<\/strong> de la classe : accessible seulement par les méthodes de la classe<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>À quoi ça sert : la <strong>sécurité<\/strong>. On protège les données contre les modifications, grâce aux privilèges d&#39;accès.<\/p>\n<aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p><strong>Rendre les attributs publics casse l&#39;encapsulation<\/strong> (TD 1, exercice 4). N&#39;importe qui pourrait alors mettre une valeur absurde dans l&#39;objet, sans contrôle.<\/p>\n<\/aside><h2>Idée 4 · Héritage et polymorphisme, en une phrase chacun<\/h2>\n<svg viewBox=\"0 0 360 130\" style=\"width:100%;max-width:460px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Forme est la classe mère de Rectangle et Cercle ; Carré hérite de Rectangle\">\n<g font-family=\"sans-serif\" font-size=\"12\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"140\" y=\"6\" width=\"80\" height=\"26\" rx=\"4\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/><text x=\"180\" y=\"24\" fill=\"#D9824F\" font-weight=\"700\">Forme<\/text>\n<rect x=\"60\" y=\"54\" width=\"90\" height=\"26\" rx=\"4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"105\" y=\"72\">Rectangle<\/text>\n<rect x=\"210\" y=\"54\" width=\"90\" height=\"26\" rx=\"4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"255\" y=\"72\">Cercle<\/text>\n<rect x=\"60\" y=\"100\" width=\"90\" height=\"26\" rx=\"4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"105\" y=\"118\">Carré<\/text>\n<\/g>\n<path d=\"M105 54L170 34M255 54L190 34M105 100V82\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<path d=\"M162 40l8-6-1 10M198 40l-8-6 1 10M100 89l5-7 5 7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<\/svg><p><strong>Héritage.<\/strong> C&#39;est le fait de <strong>définir une nouvelle classe à partir d&#39;une classe existante<\/strong>, en lui ajoutant de nouvelles méthodes et de nouvelles données. Il permet de <strong>réutiliser<\/strong> ce qui existe déjà pour créer une classe plus spécialisée. Exemple du cours : Forme, puis Rectangle et Cercle, puis Carré.<\/p>\n<p><strong>Polymorphisme.<\/strong> Le mot veut dire <strong>« plusieurs formes »<\/strong>. Il permet de <strong>manipuler des objets sans connaître précisément leur type<\/strong>. Il existe sous deux formes :<\/p>\n<ul>\n<li>le <strong>polymorphisme de méthodes<\/strong> (surcharge et redéfinition) ;<\/li>\n<li>le <strong>polymorphisme d&#39;objets<\/strong>.<\/li>\n<\/ul>\n<p><strong>Le lien entre les deux<\/strong> (TD 1) : le polymorphisme <strong>complète<\/strong> l&#39;héritage. L&#39;héritage crée la hiérarchie de classes, et le polymorphisme l&#39;exploite : il permet de manipuler les objets des classes dérivées sans connaître leur type exact.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Les trois piliers en trois questions<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · Encapsulation : qui a le droit de toucher ?<\/div><p>Seules les méthodes de la classe touchent aux attributs. Le reste du programme passe par elles.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · Héritage : d&#39;où vient cette classe ?<\/div><p>D&#39;une classe existante, qu&#39;on enrichit. Un Carré est un Rectangle particulier.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · Polymorphisme : à qui je parle ?<\/div><p>À une Forme, sans savoir si c&#39;est un Cercle ou un Carré. Chacun répond à sa façon.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Les relations entre classes (association, agrégation, composition) et le détail surcharge / redéfinition sont dans le chapitre suivant. Le code Java de l&#39;héritage n&#39;a pas encore été vu en séance.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>TD 1 · exercices 3 et 4<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Qu&#39;est-ce qu&#39;un objet ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Objet = État + Comportement. C&#39;est une entité autonome regroupant un état et les opérations permettant de manipuler cet état.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Définis l&#39;état et le comportement d&#39;un objet.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><strong>État<\/strong> : les valeurs des attributs de l&#39;objet. <strong>Comportement<\/strong> : les opérations possibles sur l&#39;objet, déclenchées par des stimulations externes.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Quelle est la différence entre une classe et un objet ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>La classe est un modèle (une description) d&#39;un ensemble d&#39;objets ayant une structure de données commune et disposant des mêmes méthodes. L&#39;objet est une instance de la classe.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Qu&#39;est-ce que l&#39;encapsulation ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Elle consiste à cacher les attributs d&#39;une classe et à n&#39;autoriser l&#39;accès aux données que par les méthodes de l&#39;objet, qui jouent le rôle d&#39;interface.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>Quelles sont les composantes principales d&#39;une classe ? Distingue-les.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Les <strong>attributs<\/strong> (données : variables décrivant l&#39;état) et les <strong>méthodes<\/strong> (fonctions que l&#39;objet peut exécuter).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><p>Comment appelle-t-on le processus de création d&#39;un objet à partir d&#39;une classe ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>L&#39;<strong>instanciation<\/strong>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"7\"><div class=\"ex-q\"><p>Que signifient les symboles + et - dans un diagramme de classe ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>+<\/code> : public (accessible par tous). <code>-<\/code> : private (accessible seulement par les méthodes de la classe).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"8\"><div class=\"ex-q\"><p>Une classe doit-elle obligatoirement avoir des attributs ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Non, ce n&#39;est pas obligatoire.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"9\"><div class=\"ex-q\"><p>Que signifie « envoyer un message » à un objet ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Faire appel à une de ses méthodes.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 16 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quelle formule résume un objet ?<\/div><button class=\"opt\" data-o=\"0\">Objet = Classe + Instance<\/button><button class=\"opt\" data-o=\"1\">Objet = État + Comportement<\/button><button class=\"opt\" data-o=\"2\">Objet = Algorithme + Données<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">L&#39;état d&#39;un objet correspond :<\/div><button class=\"opt\" data-o=\"0\">au nom de sa classe<\/button><button class=\"opt\" data-o=\"1\">à la liste de ses méthodes<\/button><button class=\"opt\" data-o=\"2\">aux valeurs de ses attributs<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Une classe est :<\/div><button class=\"opt\" data-o=\"0\">un modèle d&#39;objets ayant la même structure et les mêmes méthodes<\/button><button class=\"opt\" data-o=\"1\">un objet particulier<\/button><button class=\"opt\" data-o=\"2\">une variable globale<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Comment appelle-t-on la création d&#39;un objet à partir d&#39;une classe ?<\/div><button class=\"opt\" data-o=\"0\">L&#39;encapsulation<\/button><button class=\"opt\" data-o=\"1\">La compilation<\/button><button class=\"opt\" data-o=\"2\">L&#39;instanciation<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Dans un diagramme de classe, le symbole <code>-<\/code> devant un attribut signifie :<\/div><button class=\"opt\" data-o=\"0\">public<\/button><button class=\"opt\" data-o=\"1\">private<\/button><button class=\"opt\" data-o=\"2\">supprimé<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Un attribut <code>private<\/code> est accessible :<\/div><button class=\"opt\" data-o=\"0\">par tout le programme<\/button><button class=\"opt\" data-o=\"1\">seulement par les méthodes de sa classe<\/button><button class=\"opt\" data-o=\"2\">seulement par la méthode main<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Qu&#39;est-ce qui casse l&#39;encapsulation ?<\/div><button class=\"opt\" data-o=\"0\">Rendre les attributs publics<\/button><button class=\"opt\" data-o=\"1\">Ajouter une méthode à la classe<\/button><button class=\"opt\" data-o=\"2\">Créer plusieurs objets<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">L&#39;héritage consiste à :<\/div><button class=\"opt\" data-o=\"0\">copier-coller le code d&#39;une classe dans une autre<\/button><button class=\"opt\" data-o=\"1\">définir une nouvelle classe à partir d&#39;une classe existante<\/button><button class=\"opt\" data-o=\"2\">cacher les attributs d&#39;une classe<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Que signifie « polymorphisme » ?<\/div><button class=\"opt\" data-o=\"0\">Une seule forme<\/button><button class=\"opt\" data-o=\"1\">Plusieurs formes<\/button><button class=\"opt\" data-o=\"2\">Sans forme<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">« Envoyer un message à un objet » signifie :<\/div><button class=\"opt\" data-o=\"0\">afficher un texte à l&#39;écran<\/button><button class=\"opt\" data-o=\"1\">appeler une de ses méthodes<\/button><button class=\"opt\" data-o=\"2\">le supprimer de la mémoire<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"10\"><div class=\"qq-q\">Dans l&#39;exemple du cours (Forme, Rectangle, Cercle, Carré), de quelle classe Carré hérite-t-elle directement ?<\/div><button class=\"opt\" data-o=\"0\">Forme<\/button><button class=\"opt\" data-o=\"1\">Rectangle<\/button><button class=\"opt\" data-o=\"2\">Cercle<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"concepts-poo","rep":null,"tol":null},{"n":"concepts-poo","rep":null,"tol":null},{"n":"concepts-poo","rep":null,"tol":null},{"n":"concepts-poo","rep":null,"tol":null},{"n":"concepts-poo","rep":null,"tol":null},{"n":"concepts-poo","rep":null,"tol":null},{"n":"concepts-poo","rep":null,"tol":null},{"n":"concepts-poo","rep":null,"tol":null},{"n":"concepts-poo","rep":null,"tol":null},{"n":"concepts-poo","rep":null,"tol":null}],"qcm":[{"n":"concepts-poo","q":"Quelle formule résume un objet ?","o":["Objet = Classe + Instance","Objet = État + Comportement","Objet = Algorithme + Données"],"a":1,"e":"L&#39;état, ce sont les valeurs des attributs ; le comportement, les opérations possibles."},{"n":"concepts-poo","q":"L&#39;état d&#39;un objet correspond :","o":["au nom de sa classe","à la liste de ses méthodes","aux valeurs de ses attributs"],"a":2,"e":"Deux objets de la même classe ont les mêmes attributs mais des états différents."},{"n":"concepts-poo","q":"Une classe est :","o":["un modèle d&#39;objets ayant la même structure et les mêmes méthodes","un objet particulier","une variable globale"],"a":0,"e":"La classe décrit ; l&#39;objet existe."},{"n":"concepts-poo","q":"Comment appelle-t-on la création d&#39;un objet à partir d&#39;une classe ?","o":["L&#39;encapsulation","La compilation","L&#39;instanciation"],"a":2,"e":"L&#39;objet créé est une instance de la classe."},{"n":"concepts-poo","q":"Dans un diagramme de classe, le symbole <code>-<\/code> devant un attribut signifie :","o":["public","private","supprimé"],"a":1,"e":"<code>+<\/code> = public, <code>-<\/code> = private."},{"n":"concepts-poo","q":"Un attribut <code>private<\/code> est accessible :","o":["par tout le programme","seulement par les méthodes de sa classe","seulement par la méthode main"],"a":1,"e":"C&#39;est le principe de l&#39;encapsulation."},{"n":"concepts-poo","q":"Qu&#39;est-ce qui casse l&#39;encapsulation ?","o":["Rendre les attributs publics","Ajouter une méthode à la classe","Créer plusieurs objets"],"a":0,"e":"L&#39;état interne ne serait plus protégé."},{"n":"concepts-poo","q":"L&#39;héritage consiste à :","o":["copier-coller le code d&#39;une classe dans une autre","définir une nouvelle classe à partir d&#39;une classe existante","cacher les attributs d&#39;une classe"],"a":1,"e":"On ajoute de nouvelles méthodes et de nouvelles données à ce qui existe."},{"n":"concepts-poo","q":"Que signifie « polymorphisme » ?","o":["Une seule forme","Plusieurs formes","Sans forme"],"a":1,"e":"Il permet de manipuler des objets sans connaître précisément leur type."},{"n":"concepts-poo","q":"« Envoyer un message à un objet » signifie :","o":["afficher un texte à l&#39;écran","appeler une de ses méthodes","le supprimer de la mémoire"],"a":1,"e":"L&#39;appel de méthode est une stimulation externe qui déclenche un comportement."},{"n":"concepts-poo","q":"Dans l&#39;exemple du cours (Forme, Rectangle, Cercle, Carré), de quelle classe Carré hérite-t-elle directement ?","o":["Forme","Rectangle","Cercle"],"a":1,"e":"Carré est sous Rectangle, lui-même sous Forme."}]},{"id":"relations-classes","t":"Relations entre classes, surcharge et redéfinition","seance":"Séance 1 · TD 1 (exercices 5 et 6)","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu dois savoir ce qu&#39;est une classe, un objet et l&#39;héritage (chapitre 2).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Complète : « L&#39;héritage permet de définir une nouvelle classe à partir de… »<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>« …d&#39;une <strong>classe existante<\/strong>, en ajoutant de nouvelles méthodes et de nouvelles données. » Si c&#39;est acquis, tu connais déjà l&#39;une des trois relations du chapitre.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Trois petites phrases suffisent.<\/strong> « <strong>utilise<\/strong> un » = association. « <strong>a<\/strong> un » = agrégation ou composition. « <strong>est<\/strong> un » = héritage. Face à deux classes, dis les trois phrases à voix haute : une seule sonne juste.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p><strong>Surcharge et redéfinition<\/strong> se ressemblent et s&#39;échangent tout le temps dans les copies. Surcharge : <strong>même classe<\/strong>, paramètres <strong>différents<\/strong>. Redéfinition : classe <strong>fille<\/strong>, <strong>mêmes<\/strong> paramètres.<\/p>\n<\/aside><p>À la fin, tu sais classer une relation entre deux classes, distinguer agrégation et composition, et ne plus confondre surcharge et redéfinition.<\/p>\n<h2>Idée 1 · Trois familles de relations<\/h2>\n<p>Une application objet, ce sont des objets qui <strong>travaillent ensemble<\/strong>. Comme chaque objet vient d&#39;une classe, les classes sont liées entre elles. Il y a trois types de relations.<\/p>\n<svg viewBox=\"0 0 360 130\" style=\"width:100%;max-width:460px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Association : utilise un. Agrégation et composition : a un. Héritage : est un.\">\n<g font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"6\" y=\"8\" width=\"108\" height=\"114\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"60\" y=\"28\" font-weight=\"700\">Association<\/text><text x=\"60\" y=\"48\" fill=\"#D9824F\" font-weight=\"700\">« utilise un »<\/text><text x=\"60\" y=\"70\" font-size=\"10\">lien simple<\/text><text x=\"60\" y=\"84\" font-size=\"10\">et temporaire<\/text><text x=\"60\" y=\"108\" font-size=\"10\">Personne — Entreprise<\/text>\n<rect x=\"126\" y=\"8\" width=\"108\" height=\"114\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"180\" y=\"24\" font-weight=\"700\" font-size=\"10\">Agrégation<\/text><text x=\"180\" y=\"36\" font-weight=\"700\" font-size=\"10\">Composition<\/text><text x=\"180\" y=\"52\" fill=\"#D9824F\" font-weight=\"700\">« a un »<\/text><text x=\"180\" y=\"70\" font-size=\"10\">une classe en<\/text><text x=\"180\" y=\"84\" font-size=\"10\">contient une autre<\/text><text x=\"180\" y=\"108\" font-size=\"10\">Homme — Tête<\/text>\n<rect x=\"246\" y=\"8\" width=\"108\" height=\"114\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"300\" y=\"28\" font-weight=\"700\">Héritage<\/text><text x=\"300\" y=\"48\" fill=\"#D9824F\" font-weight=\"700\">« est un »<\/text><text x=\"300\" y=\"70\" font-size=\"10\">reprend attributs<\/text><text x=\"300\" y=\"84\" font-size=\"10\">et méthodes<\/text><text x=\"300\" y=\"108\" font-size=\"10\">Étudiant — Personne<\/text>\n<\/g>\n<\/svg><table>\n<thead>\n<tr>\n<th>Relation<\/th>\n<th>Définition<\/th>\n<th>Lien<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>Association<\/strong><\/td>\n<td>Une classe <strong>utilise<\/strong> une autre, sans la posséder<\/td>\n<td>Simple et temporaire<\/td>\n<\/tr>\n<tr>\n<td><strong>Agrégation / Composition<\/strong><\/td>\n<td>Une classe <strong>contient<\/strong> (est composée de) une autre<\/td>\n<td>« a un »<\/td>\n<\/tr>\n<tr>\n<td><strong>Héritage<\/strong><\/td>\n<td>Une classe <strong>reprend<\/strong> les attributs et les méthodes d&#39;une autre<\/td>\n<td>« est un »<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Exemple d&#39;association du cours : une <strong>Personne<\/strong> travaille dans une <strong>Entreprise<\/strong>. Exemple du TD : un <strong>Médecin<\/strong> soigne un <strong>Patient<\/strong>.<\/p>\n<h2>Idée 2 · Agrégation ou composition : la partie survit-elle au tout ?<\/h2>\n<svg viewBox=\"0 0 360 120\" style=\"width:100%;max-width:460px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Losange vide : agrégation, la partie peut exister sans le tout. Losange plein : composition, la partie dépend du tout.\">\n<g font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"8\" y=\"14\" width=\"96\" height=\"28\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"56\" y=\"33\">Bibliothèque<\/text>\n<rect x=\"252\" y=\"14\" width=\"96\" height=\"28\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"300\" y=\"33\">Livre<\/text>\n<text x=\"180\" y=\"18\" font-size=\"10\">agrégation (losange vide)<\/text>\n<rect x=\"8\" y=\"76\" width=\"96\" height=\"28\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"56\" y=\"95\">Voiture<\/text>\n<rect x=\"252\" y=\"76\" width=\"96\" height=\"28\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"300\" y=\"95\">Moteur<\/text>\n<text x=\"180\" y=\"80\" font-size=\"10\" fill=\"#D9824F\" font-weight=\"700\">composition (losange plein)<\/text>\n<\/g>\n<path d=\"M124 28H252\" stroke=\"currentColor\" stroke-width=\"2\"/><path d=\"M104 28l10-6 10 6-10 6z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<path d=\"M124 90H252\" stroke=\"#D9824F\" stroke-width=\"2\"/><path d=\"M104 90l10-6 10 6-10 6z\" fill=\"#D9824F\" stroke=\"#D9824F\" stroke-width=\"2\"/>\n<\/svg><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Agrégation<\/th>\n<th>Composition<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Symbole<\/td>\n<td>Losange <strong>vide<\/strong><\/td>\n<td>Losange <strong>plein<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Force du lien<\/td>\n<td>Composante, mais <strong>pas obligatoire<\/strong><\/td>\n<td><strong>Indispensable<\/strong>, obligatoire<\/td>\n<\/tr>\n<tr>\n<td>La partie…<\/td>\n<td><strong>peut exister sans<\/strong> le tout<\/td>\n<td><strong>dépend<\/strong> du tout<\/td>\n<\/tr>\n<tr>\n<td>Exemple du TD<\/td>\n<td>Une Bibliothèque contient des Livres<\/td>\n<td>Une Voiture a un Moteur<\/td>\n<\/tr>\n<tr>\n<td>Exemple du cours<\/td>\n<td>Homme et Bras<\/td>\n<td>Homme et Tête<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>La composition est une <strong>agrégation forte<\/strong>.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Le test en deux questions<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/2 · Question 1 : A contient-il B ?<\/div><p>Si non, ce n&#39;est ni une agrégation ni une composition (regarde du côté de l&#39;association ou de l&#39;héritage).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/2 · Question 2 : si je détruis A, B a-t-il encore un sens ?<\/div><p><strong>Oui<\/strong> : agrégation. On ferme la bibliothèque, les livres existent toujours. <strong>Non<\/strong> : composition. Dans le modèle, le moteur n&#39;existe que dans sa voiture.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p><strong>La multiplicité<\/strong> se note au bout du lien. <code>1..*<\/code> veut dire <strong>« un ou plusieurs »<\/strong>.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>L&#39;exemple « Homme et Bras » en agrégation vient des notes de séance. On peut en discuter (un bras sans homme ?), mais c&#39;est l&#39;exemple du cours : en examen, reprends plutôt <strong>Bibliothèque / Livres<\/strong> et <strong>Voiture / Moteur<\/strong>, qui sont les réponses du TD.<\/p>\n<\/aside><h2>Idée 3 · L&#39;héritage : trois intérêts, deux sens de lecture<\/h2>\n<p>Les trois intérêts de l&#39;héritage :<\/p>\n<table>\n<thead>\n<tr>\n<th>Intérêt<\/th>\n<th>En un mot<\/th>\n<th>Explication<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>Réutilisation<\/strong><\/td>\n<td>Reprendre<\/td>\n<td>On ne réécrit pas le code : il est déjà fait<\/td>\n<\/tr>\n<tr>\n<td><strong>Spécialisation / enrichissement<\/strong><\/td>\n<td>Ajouter<\/td>\n<td>On ajoute des éléments propres à la classe fille<\/td>\n<\/tr>\n<tr>\n<td><strong>Redéfinition<\/strong><\/td>\n<td>Modifier<\/td>\n<td>On change le comportement d&#39;une méthode héritée<\/td>\n<\/tr>\n<\/tbody><\/table>\n<svg viewBox=\"0 0 360 120\" style=\"width:100%;max-width:460px;display:block;margin:10px auto\" role=\"img\" aria-label=\"De Étudiant vers Personne : généralisation. De Personne vers Étudiant : spécialisation.\">\n<g font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"130\" y=\"10\" width=\"100\" height=\"28\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/><text x=\"180\" y=\"29\" fill=\"#D9824F\" font-weight=\"700\">Personne<\/text><text x=\"76\" y=\"29\" font-size=\"10\">classe mère<\/text>\n<rect x=\"130\" y=\"82\" width=\"100\" height=\"28\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"180\" y=\"101\">Étudiant<\/text><text x=\"76\" y=\"101\" font-size=\"10\">sous-classe<\/text>\n<text x=\"290\" y=\"48\" font-size=\"10\">généralisation<\/text><text x=\"290\" y=\"60\" font-size=\"10\">(abstraction) ↑<\/text><text x=\"290\" y=\"82\" font-size=\"10\">spécialisation<\/text><text x=\"290\" y=\"94\" font-size=\"10\">(raffinement) ↓<\/text>\n<\/g>\n<path d=\"M180 82V42\" stroke=\"currentColor\" stroke-width=\"2\"/><path d=\"M173 50l7-10 7 10z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<\/svg><ul>\n<li><strong>Spécialisation<\/strong> : on va de la classe mère vers la classe fille (Personne vers Étudiant). On raffine.<\/li>\n<li><strong>Généralisation<\/strong> : on va de la classe fille vers la classe mère (Étudiant vers Personne). On abstrait.<\/li>\n<\/ul>\n<p>Syntaxe en Java (TD 1) :<\/p>\n<pre class=\"\"><code>class ClasseFille extends ClasseMere {\n    // attributs et méthodes\n}<\/code><\/pre><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p><strong>En Java, il n&#39;y a pas d&#39;héritage multiple de classes<\/strong> : une classe a <strong>une seule<\/strong> classe mère.<\/p>\n<\/aside><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p><strong>Polymorphisme d&#39;objets<\/strong> : un objet d&#39;une classe fille <strong>est aussi<\/strong> un objet de la classe mère. C&#39;est le sens de « est un ».<\/p>\n<\/aside><h2>Idée 4 · Surcharge contre redéfinition<\/h2>\n<figure class=\"grille\"><figcaption>Surcharge et redéfinition, face à face<\/figcaption><table><tr><th>Critère<\/th><th>Surcharge<\/th><th>Redéfinition<\/th><\/tr><tr><td>Nom anglais<\/td><td class=\"h1\">overloading<\/td><td class=\"h2\">overriding<\/td><\/tr><tr><td>Où ?<\/td><td class=\"h1\">même classe<\/td><td class=\"h2\">classe fille<\/td><\/tr><tr><td>Nom de la méthode<\/td><td class=\"h1\">identique<\/td><td class=\"h2\">identique<\/td><\/tr><tr><td>Paramètres<\/td><td class=\"h1\">différents<\/td><td class=\"h2\">identiques<\/td><\/tr><\/table><\/figure><p><strong>Surcharge (overloading).<\/strong> Une méthode peut prendre <strong>plusieurs formes dans la même classe<\/strong> : même nom, <strong>paramètres différents<\/strong>. Exemple du cours : <code>afficher(int)<\/code> et <code>afficher(String)<\/code>.<\/p>\n<p><strong>Redéfinition (overriding).<\/strong> On change, <strong>dans la classe fille<\/strong>, la définition d&#39;une méthode <strong>héritée<\/strong> de la classe mère : même nom, <strong>mêmes paramètres<\/strong>, pour remplacer la version du parent. Exemple du cours : <code>salut()<\/code> dans A, <code>salut()<\/code> dans B.<\/p>\n<p>Les deux forment le <strong>polymorphisme des méthodes<\/strong>.<\/p>\n<p>Voici les deux mécanismes en Java. Ce programme a été compilé et exécuté :<\/p>\n<pre class=\"\"><code>class Personne {\n    protected String nom;\n    public Personne(String nom) { this.nom = nom; }\n\n    public void salut() { System.out.println(&quot;Bonjour, je suis &quot; + nom); }\n\n    // Surcharge : même nom, paramètres différents, même classe\n    public void afficher(int n)    { System.out.println(&quot;Entier : &quot; + n); }\n    public void afficher(String s) { System.out.println(&quot;Chaine : &quot; + s); }\n}\n\nclass Etudiant extends Personne {\n    private String filiere;\n    public Etudiant(String nom, String filiere) { super(nom); this.filiere = filiere; }\n\n    // Redéfinition : même nom, mêmes paramètres, dans la classe fille\n    @Override\n    public void salut() {\n        System.out.println(&quot;Salut, je suis &quot; + nom + &quot;, etudiant en &quot; + filiere);\n    }\n}\n\npublic class TestH {\n    public static void main(String[] args) {\n        Personne p = new Personne(&quot;Karim&quot;);\n        Etudiant e = new Etudiant(&quot;Sara&quot;, &quot;MIACSD&quot;);\n        p.salut();\n        e.salut();\n        e.afficher(5);\n        e.afficher(&quot;cinq&quot;);\n        Personne q = new Etudiant(&quot;Amine&quot;, &quot;MIACSD&quot;);   // polymorphisme d'objets\n        q.salut();\n        System.out.println(e instanceof Personne);\n        System.out.println(p instanceof Etudiant);\n    }\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Bonjour, je suis Karim\nSalut, je suis Sara, etudiant en MIACSD\nEntier : 5\nChaine : cinq\nSalut, je suis Amine, etudiant en MIACSD\ntrue\nfalse<\/code><\/pre><p>Lis les deux dernières lignes : une Étudiante <strong>est une<\/strong> Personne (<code>true<\/code>), mais une Personne n&#39;est pas forcément un Étudiant (<code>false<\/code>). L&#39;opérateur <code>instanceof<\/code> teste si un objet a été créé à partir d&#39;une classe.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Ce programme est un <strong>ajout de ToumaiLearn<\/strong> pour montrer les deux mécanismes en vrai. Le cours n&#39;a donné que la syntaxe <code>extends<\/code> et les définitions. Les mots <code>super<\/code>, <code>protected<\/code> et <code>@Override<\/code> n&#39;ont pas encore été expliqués en séance : ne t&#39;y attarde pas pour l&#39;instant.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>TD 1 · exercices 5 et 6<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Quelles sont les trois grandes catégories de relations entre classes ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Association, agrégation (et composition), héritage.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Quelle est la différence entre association et agrégation ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><strong>Association<\/strong> : relation simple entre deux classes. <strong>Agrégation<\/strong> : une classe A fait partie de la classe B.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Quelle est la différence entre agrégation et composition ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><strong>Agrégation<\/strong> : la partie peut exister sans le tout. <strong>Composition<\/strong> : c&#39;est une agrégation forte, la partie dépend du tout.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Donne un exemple d&#39;association, un d&#39;agrégation et un de composition.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Association : un Médecin soigne un Patient. Agrégation : une Bibliothèque contient des Livres. Composition : une Voiture a un Moteur.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>Que signifie la multiplicité <code>1..*<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Un ou plusieurs.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><p>Donne la syntaxe de l&#39;héritage en Java.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>class ClasseFille extends ClasseMere { // attributs et méthodes }<\/code><\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"7\"><div class=\"ex-q\"><p>Quelle est la différence entre spécialisation et généralisation ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Spécialisation : de la classe mère vers la classe fille. Généralisation : de la classe fille vers la classe mère.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"8\"><div class=\"ex-q\"><p>Entre Véhicule et Voiture, laquelle est la classe mère ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><strong>Véhicule<\/strong> est la classe mère, <strong>Voiture<\/strong> la classe fille : une voiture « est un » véhicule.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"9\"><div class=\"ex-q\"><p>Quelle est la différence entre surcharge et redéfinition ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><strong>Surcharge<\/strong> : une méthode peut prendre plusieurs formes dans la même classe. <strong>Redéfinition<\/strong> : on change, dans la classe fille, la définition d&#39;une méthode héritée de la classe mère.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"10\"><div class=\"ex-q\"><p>Que signifie la relation « est-un » ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Un objet de la classe dérivée est aussi un objet de la classe de base.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"11\"><div class=\"ex-q\"><p>Quel est l&#39;avantage principal de l&#39;héritage ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>La réutilisation du code : la classe fille réutilise les méthodes et les attributs de la classe mère.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 15 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">« Un Médecin soigne un Patient » est un exemple :<\/div><button class=\"opt\" data-o=\"0\">d&#39;association<\/button><button class=\"opt\" data-o=\"1\">de composition<\/button><button class=\"opt\" data-o=\"2\">d&#39;héritage<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Quelle relation correspond à la phrase « est un » ?<\/div><button class=\"opt\" data-o=\"0\">L&#39;association<\/button><button class=\"opt\" data-o=\"1\">L&#39;agrégation<\/button><button class=\"opt\" data-o=\"2\">L&#39;héritage<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Dans une composition :<\/div><button class=\"opt\" data-o=\"0\">la partie peut exister sans le tout<\/button><button class=\"opt\" data-o=\"1\">la partie dépend du tout<\/button><button class=\"opt\" data-o=\"2\">il n&#39;y a aucun lien entre les classes<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Quel symbole représente l&#39;agrégation ?<\/div><button class=\"opt\" data-o=\"0\">Un losange vide<\/button><button class=\"opt\" data-o=\"1\">Un losange plein<\/button><button class=\"opt\" data-o=\"2\">Une flèche à triangle<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">« Une Bibliothèque contient des Livres » est, d&#39;après le TD :<\/div><button class=\"opt\" data-o=\"0\">une composition<\/button><button class=\"opt\" data-o=\"1\">une agrégation<\/button><button class=\"opt\" data-o=\"2\">un héritage<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Que signifie la multiplicité <code>1..*<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">Exactement un<\/button><button class=\"opt\" data-o=\"1\">Zéro ou un<\/button><button class=\"opt\" data-o=\"2\">Un ou plusieurs<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Quel mot-clé Java exprime l&#39;héritage ?<\/div><button class=\"opt\" data-o=\"0\">inherits<\/button><button class=\"opt\" data-o=\"1\">extends<\/button><button class=\"opt\" data-o=\"2\">implements<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">En Java, une classe peut hériter :<\/div><button class=\"opt\" data-o=\"0\">d&#39;une seule classe mère<\/button><button class=\"opt\" data-o=\"1\">de deux classes mères au maximum<\/button><button class=\"opt\" data-o=\"2\">d&#39;autant de classes mères qu&#39;on veut<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Deux méthodes <code>afficher(int)<\/code> et <code>afficher(String)<\/code> dans la même classe, c&#39;est :<\/div><button class=\"opt\" data-o=\"0\">une redéfinition<\/button><button class=\"opt\" data-o=\"1\">une surcharge<\/button><button class=\"opt\" data-o=\"2\">une erreur de compilation<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">La redéfinition (overriding) se fait :<\/div><button class=\"opt\" data-o=\"0\">dans la même classe, avec des paramètres différents<\/button><button class=\"opt\" data-o=\"1\">dans la classe fille, avec le même nom et les mêmes paramètres<\/button><button class=\"opt\" data-o=\"2\">uniquement dans la méthode main<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"10\"><div class=\"qq-q\">Aller de la classe Étudiant vers la classe Personne s&#39;appelle :<\/div><button class=\"opt\" data-o=\"0\">la spécialisation<\/button><button class=\"opt\" data-o=\"1\">la généralisation<\/button><button class=\"opt\" data-o=\"2\">l&#39;instanciation<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"11\"><div class=\"qq-q\">Lequel de ces intérêts n&#39;est PAS un intérêt de l&#39;héritage cité dans le cours ?<\/div><button class=\"opt\" data-o=\"0\">La réutilisation<\/button><button class=\"opt\" data-o=\"1\">La redéfinition<\/button><button class=\"opt\" data-o=\"2\">L&#39;accélération de la compilation<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"relations-classes","rep":null,"tol":null},{"n":"relations-classes","rep":null,"tol":null},{"n":"relations-classes","rep":null,"tol":null},{"n":"relations-classes","rep":null,"tol":null},{"n":"relations-classes","rep":null,"tol":null},{"n":"relations-classes","rep":null,"tol":null},{"n":"relations-classes","rep":null,"tol":null},{"n":"relations-classes","rep":null,"tol":null},{"n":"relations-classes","rep":null,"tol":null},{"n":"relations-classes","rep":null,"tol":null},{"n":"relations-classes","rep":null,"tol":null},{"n":"relations-classes","rep":null,"tol":null}],"qcm":[{"n":"relations-classes","q":"« Un Médecin soigne un Patient » est un exemple :","o":["d&#39;association","de composition","d&#39;héritage"],"a":0,"e":"Le médecin utilise la relation avec le patient sans le posséder : lien simple."},{"n":"relations-classes","q":"Quelle relation correspond à la phrase « est un » ?","o":["L&#39;association","L&#39;agrégation","L&#39;héritage"],"a":2,"e":"« a un » correspond à l&#39;agrégation et à la composition."},{"n":"relations-classes","q":"Dans une composition :","o":["la partie peut exister sans le tout","la partie dépend du tout","il n&#39;y a aucun lien entre les classes"],"a":1,"e":"C&#39;est une agrégation forte, représentée par un losange plein."},{"n":"relations-classes","q":"Quel symbole représente l&#39;agrégation ?","o":["Un losange vide","Un losange plein","Une flèche à triangle"],"a":0,"e":"Le losange plein est réservé à la composition."},{"n":"relations-classes","q":"« Une Bibliothèque contient des Livres » est, d&#39;après le TD :","o":["une composition","une agrégation","un héritage"],"a":1,"e":"Les livres peuvent exister sans la bibliothèque."},{"n":"relations-classes","q":"Que signifie la multiplicité <code>1..*<\/code> ?","o":["Exactement un","Zéro ou un","Un ou plusieurs"],"a":2,"e":"Le <code>*<\/code> signifie « plusieurs », le <code>1<\/code> fixe le minimum."},{"n":"relations-classes","q":"Quel mot-clé Java exprime l&#39;héritage ?","o":["inherits","extends","implements"],"a":1,"e":"<code>class ClasseFille extends ClasseMere<\/code>."},{"n":"relations-classes","q":"En Java, une classe peut hériter :","o":["d&#39;une seule classe mère","de deux classes mères au maximum","d&#39;autant de classes mères qu&#39;on veut"],"a":0,"e":"Il n&#39;y a pas d&#39;héritage multiple de classes en Java."},{"n":"relations-classes","q":"Deux méthodes <code>afficher(int)<\/code> et <code>afficher(String)<\/code> dans la même classe, c&#39;est :","o":["une redéfinition","une surcharge","une erreur de compilation"],"a":1,"e":"Même nom, paramètres différents, même classe : surcharge (overloading)."},{"n":"relations-classes","q":"La redéfinition (overriding) se fait :","o":["dans la même classe, avec des paramètres différents","dans la classe fille, avec le même nom et les mêmes paramètres","uniquement dans la méthode main"],"a":1,"e":"Elle remplace la version héritée du parent."},{"n":"relations-classes","q":"Aller de la classe Étudiant vers la classe Personne s&#39;appelle :","o":["la spécialisation","la généralisation","l&#39;instanciation"],"a":1,"e":"La spécialisation va dans l&#39;autre sens : de la mère vers la fille."},{"n":"relations-classes","q":"Lequel de ces intérêts n&#39;est PAS un intérêt de l&#39;héritage cité dans le cours ?","o":["La réutilisation","La redéfinition","L&#39;accélération de la compilation"],"a":2,"e":"Les trois intérêts : réutilisation, spécialisation ou enrichissement, redéfinition."}]},{"id":"bases-java
