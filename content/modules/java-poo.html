","t":"Les bases de Java · variables, conditions, boucles, opérateurs","seance":"Séance 3 · TD 2","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu dois connaître la syntaxe du C : <code>int<\/code>, <code>if<\/code>, <code>for<\/code>, <code>while<\/code>, <code>switch<\/code>. Java la reprend presque à l&#39;identique.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>En C, que vaut <code>7 / 2<\/code> quand les deux nombres sont des entiers ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 3<\/b><\/p><p><strong>3<\/strong>, et pas 3,5 : la division de deux entiers est une division entière. C&#39;est pareil en Java, et c&#39;est la source d&#39;un bug dans le corrigé du TD 2 (chapitre 9).<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « du C dans une classe ».<\/strong> Les conditions et les boucles s&#39;écrivent comme en C. La seule vraie nouveauté : en Java, <strong>tout est fait en classe<\/strong>. Même le plus petit programme vit dans une classe.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Le signe <code>+<\/code> fait deux métiers. Entre deux nombres, il <strong>additionne<\/strong>. Dès qu&#39;une chaîne de caractères est en jeu, il <strong>concatène<\/strong>. <code>&quot;Somme : &quot; + 2 + 3<\/code> affiche <code>Somme : 23<\/code>, pas <code>Somme : 5<\/code>.<\/p>\n<\/aside><p>À la fin, tu sais écrire un programme Java complet avec saisie au clavier, conditions, boucles et calculs, sans tomber dans les trois pièges du chapitre.<\/p>\n<h2>Idée 1 · Tout programme Java vit dans une classe<\/h2>\n<p>Java est un <strong>langage orienté objet<\/strong> : tout est fait en classe. Un fichier source porte l&#39;extension <strong><code>.java<\/code><\/strong>.<\/p>\n<pre class=\"\"><code>public class PremierProgramme {\n    public static void main(String[] args) {\n        System.out.print(&quot;Bonjour&quot;);\n    }\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Bonjour<\/code><\/pre><svg viewBox=\"0 0 360 120\" style=\"width:100%;max-width:460px;display:block;margin:10px auto\" role=\"img\" aria-label=\"La classe contient la méthode main, qui contient les instructions\">\n<g font-family=\"sans-serif\" font-size=\"11\" fill=\"currentColor\">\n<rect x=\"10\" y=\"8\" width=\"340\" height=\"104\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"20\" y=\"26\" font-weight=\"700\">public class PremierProgramme — le nom du programme<\/text>\n<rect x=\"28\" y=\"36\" width=\"304\" height=\"66\" rx=\"8\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/><text x=\"38\" y=\"54\" fill=\"#D9824F\" font-weight=\"700\">public static void main(String[] args) — le point d'entrée<\/text>\n<rect x=\"46\" y=\"64\" width=\"268\" height=\"28\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"56\" y=\"82\">System.out.print(\"Bonjour\"); — l'instruction<\/text>\n<\/g>\n<\/svg><table>\n<thead>\n<tr>\n<th>Ligne<\/th>\n<th>Rôle (TD 2)<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>public class PremierProgramme<\/code><\/td>\n<td>Le nom du programme<\/td>\n<\/tr>\n<tr>\n<td><code>public static void main(String args[])<\/code><\/td>\n<td>Le prototype de la méthode principale<\/td>\n<\/tr>\n<tr>\n<td><code>System.out.print(&quot;Bonjour&quot;);<\/code><\/td>\n<td>L&#39;instruction d&#39;affichage<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>L&#39;affichage dans trois langages :<\/p>\n<table>\n<thead>\n<tr>\n<th>Java<\/th>\n<th>C<\/th>\n<th>Python<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>System.out.println()<\/code><\/td>\n<td><code>printf()<\/code><\/td>\n<td><code>print()<\/code><\/td>\n<\/tr>\n<\/tbody><\/table>\n<p><code>println<\/code> va à la ligne après l&#39;affichage ; <code>print<\/code> reste sur la même ligne.<\/p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Le nom du fichier doit être celui de la classe publique : la classe <code>PremierProgramme<\/code> va dans <code>PremierProgramme.java<\/code>.<\/p>\n<\/aside><h2>Idée 2 · Variables et constantes<\/h2>\n<p>Une variable peut recevoir une valeur <strong>à la déclaration<\/strong>, ou plus tard :<\/p>\n<pre class=\"\"><code>int n = 1;             // déclaration + initialisation\nboolean b = true;\n\nint m;                 // déclaration seule\nm = 1;                 // affectation ensuite<\/code><\/pre><p>Une <strong>constante<\/strong> est une variable dont la valeur ne peut être affectée <strong>qu&#39;une seule fois<\/strong>. On la déclare avec le mot <strong><code>final<\/code><\/strong>.<\/p>\n<pre class=\"\"><code>final int n = 5;\nfinal int t;\nt = 8;        // autorisé : première et unique affectation\nn = 10;       // ERREUR de compilation : n est déclaré final<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Dans les notes, on lit <code>boolean b = True;<\/code>. En Java, les booléens s&#39;écrivent <strong>en minuscules<\/strong> : <code>true<\/code> et <code>false<\/code>. <code>True<\/code> (comme en Python) ne compile pas.<\/p>\n<\/aside><h2>Idée 3 · Conditions, boucles et switch<\/h2>\n<p><strong>La condition<\/strong> : <code>if (condition) {...} else {...}<\/code><\/p>\n<pre class=\"\"><code>int h = 14;\nif (h &lt;= 18) System.out.println(&quot;Bonjour !&quot;);\nelse System.out.println(&quot;Bonsoir !&quot;);<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Bonjour !<\/code><\/pre><p><strong>Les trois boucles<\/strong> :<\/p>\n<table>\n<thead>\n<tr>\n<th>Boucle<\/th>\n<th>Syntaxe<\/th>\n<th>Le test se fait…<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>for<\/code><\/td>\n<td><code>for (initialisation; condition; modification) {...}<\/code><\/td>\n<td>avant chaque tour<\/td>\n<\/tr>\n<tr>\n<td><code>while<\/code><\/td>\n<td><code>while (condition) {...}<\/code><\/td>\n<td>avant chaque tour<\/td>\n<\/tr>\n<tr>\n<td><code>do while<\/code><\/td>\n<td><code>do {...} while (condition);<\/code><\/td>\n<td><strong>après<\/strong> chaque tour<\/td>\n<\/tr>\n<\/tbody><\/table>\n<pre class=\"\"><code>for (int i = 0; i &lt; 3; i++) System.out.print(i + &quot; &quot;);\nSystem.out.println();\n\nint k = 3;\nwhile (k &gt; 0) { System.out.print(k + &quot; &quot;); k--; }\nSystem.out.println();\n\nint j = 10;\ndo { System.out.println(&quot;j vaut &quot; + j); j++; } while (j &lt; 5);<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>0 1 2\n3 2 1\nj vaut 10<\/code><\/pre><p>Regarde la dernière ligne : <code>j<\/code> vaut 10, la condition <code>j &lt; 5<\/code> est fausse dès le départ, et pourtant le corps s&#39;exécute <strong>une fois<\/strong>.<\/p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p><code>do while<\/code> exécute son corps <strong>au moins une fois<\/strong>. <code>while<\/code> peut ne jamais l&#39;exécuter.<\/p>\n<\/aside><p><strong>Le switch<\/strong> : le mot <strong><code>break<\/code><\/strong> permet de <strong>sortir du bloc switch<\/strong>.<\/p>\n<pre class=\"\"><code>int jour = 2;\nswitch (jour) {\n    case 1: System.out.println(&quot;Lundi&quot;); break;\n    case 2: System.out.println(&quot;Mardi&quot;); break;\n    default: System.out.println(&quot;Autre jour&quot;);\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Mardi<\/code><\/pre><p>Et sans les <code>break<\/code> :<\/p>\n<pre class=\"\"><code>switch (jour) {\n    case 1: System.out.println(&quot;Lundi&quot;);\n    case 2: System.out.println(&quot;Mardi&quot;);\n    case 3: System.out.println(&quot;Mercredi&quot;);\n    default: System.out.println(&quot;Autre jour&quot;);\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Mardi\nMercredi\nAutre jour<\/code><\/pre><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Sans <code>break<\/code>, l&#39;exécution <strong>continue dans les cas suivants<\/strong>. Ici, on entre au <code>case 2<\/code> et on traverse tout jusqu&#39;à la fin.<\/p>\n<\/aside><h2>Idée 4 · Les opérateurs, et le double jeu du +<\/h2>\n<table>\n<thead>\n<tr>\n<th>Famille<\/th>\n<th>Opérateurs<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Arithmétiques<\/td>\n<td><code>+<\/code> <code>-<\/code> <code>/<\/code> <code>*<\/code> <code>%<\/code><\/td>\n<\/tr>\n<tr>\n<td>Incrémentation, décrémentation<\/td>\n<td><code>++<\/code> <code>--<\/code><\/td>\n<\/tr>\n<tr>\n<td>Affectation élargie<\/td>\n<td><code>+=<\/code> <code>-=<\/code> <code>/=<\/code> <code>*=<\/code><\/td>\n<\/tr>\n<tr>\n<td>Comparaison<\/td>\n<td><code>==<\/code> <code>!=<\/code> <code>&gt;<\/code> <code>&lt;<\/code> <code>&lt;=<\/code> <code>&gt;=<\/code><\/td>\n<\/tr>\n<tr>\n<td>Logiques<\/td>\n<td><strong>ET<\/strong> : <code>&amp;&amp;<\/code> · <strong>OU<\/strong> : <code>||<\/code><\/td>\n<\/tr>\n<\/tbody><\/table>\n<pre class=\"\"><code>System.out.println(7 / 2);      // division entière\nSystem.out.println(7 % 2);      // reste\nSystem.out.println(7 / 2.0);    // division réelle\n\nint x = 5;\nx += 3;      // x = 8\nx *= 2;      // x = 16\nx++;         // x = 17\nSystem.out.println(x);\n\nint h = 14;\nSystem.out.println((h &gt; 10) &amp;&amp; (h &lt; 12));\nSystem.out.println((h &gt; 10) || (h &lt; 12));<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>3\n1\n3.5\n17\nfalse\ntrue<\/code><\/pre><p><strong>Le rôle de <code>+<\/code> en Java est aussi la concaténation<\/strong>, dès qu&#39;on le combine avec une chaîne de caractères :<\/p>\n<pre class=\"\"><code>int m = 2, p = 3;\nSystem.out.println(&quot;La somme est: &quot; + m + p);\nSystem.out.println(&quot;La somme est: &quot; + (m + p));\nSystem.out.println(m + p + &quot; est la somme&quot;);<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>La somme est: 23\nLa somme est: 5\n5 est la somme<\/code><\/pre><figure class=\"etapes\" data-i=\"0\"><figcaption>Pourquoi « 23 » ? Java lit de gauche à droite<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Première opération<\/div><p><code>&quot;La somme est: &quot; + m<\/code> : une chaîne et un entier. C&#39;est une concaténation. Résultat : <code>&quot;La somme est: 2&quot;<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Deuxième opération<\/div><p><code>&quot;La somme est: 2&quot; + p<\/code> : encore une chaîne et un entier. Concaténation. Résultat : <code>&quot;La somme est: 23&quot;<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Avec les parenthèses<\/div><p><code>(m + p)<\/code> est calculé d&#39;abord : deux entiers, donc une addition, 5. Puis on concatène.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Troisième ligne<\/div><p><code>m + p<\/code> vient en premier : deux entiers, addition, 5. Puis <code>5 + &quot; est la somme&quot;<\/code> : concaténation.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Pour afficher un calcul dans une phrase, <strong>mets le calcul entre parenthèses<\/strong>.<\/p>\n<\/aside><p><strong>Affectation et comparaison.<\/strong><\/p>\n<ul>\n<li><code>A = B;<\/code> : A prend la valeur de B. Ce sont deux variables différentes et <strong>indépendantes<\/strong> : toute modification de A <strong>n&#39;affecte pas<\/strong> B.<\/li>\n<li><code>A == B<\/code> : retourne <code>true<\/code> si A et B sont identiques.<\/li>\n<\/ul>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Les notes écrivent « toute modification sur A affecte pas B » : c&#39;est vrai pour les <strong>types primitifs<\/strong> (<code>int<\/code>, <code>double<\/code>, <code>boolean<\/code>). Pour les <strong>tableaux<\/strong> et les <strong>objets<\/strong>, c&#39;est différent : <code>A = B<\/code> copie seulement la référence (chapitres 5 et 6).<\/p>\n<\/aside><p><strong>Comparer des chaînes.<\/strong> Précision de ToumaiLearn, testée :<\/p>\n<pre class=\"\"><code>String s1 = new String(&quot;FSABM&quot;), s2 = new String(&quot;FSABM&quot;);\nSystem.out.println(s1 == s2);            // compare les références\nSystem.out.println(s1.equals(s2));       // compare le contenu\nSystem.out.println(&quot;abc&quot;.compareTo(&quot;abd&quot;));   // ordre lexical<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>false\ntrue\n-1<\/code><\/pre><p>Pour les chaînes, on compare le <strong>contenu<\/strong> avec <code>equals<\/code>, et l&#39;<strong>ordre lexical<\/strong> (l&#39;ordre du dictionnaire) avec <code>compareTo<\/code>. Le <code>==<\/code> compare les <strong>références<\/strong>, pas le texte.<\/p>\n<h2>Idée 5 · Lire au clavier avec Scanner<\/h2>\n<p>Tous les corrigés du TD 2 lisent des valeurs au clavier de la même façon :<\/p>\n<pre class=\"\"><code>import java.util.Scanner;\n\npublic class Factorielle {\n    public static void main(String[] args) {\n        Scanner clavier = new Scanner(System.in);\n        System.out.println(&quot;Entrer un entier : &quot;);\n        int n = clavier.nextInt();\n\n        int factoriel = 1;\n        for (int i = 1; i &lt;= n; i++)\n            factoriel *= i;\n\n        System.out.println(&quot;Factorielle de n =&quot; + factoriel);\n    }\n}<\/code><\/pre><p>Avec la saisie <code>5<\/code>, le programme affiche :<\/p>\n<pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Factorielle de n =120<\/code><\/pre><table>\n<thead>\n<tr>\n<th>Étape<\/th>\n<th>Code<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1. Importer la classe<\/td>\n<td><code>import java.util.Scanner;<\/code> (tout en haut du fichier)<\/td>\n<\/tr>\n<tr>\n<td>2. Créer le lecteur<\/td>\n<td><code>Scanner clavier = new Scanner(System.in);<\/code><\/td>\n<\/tr>\n<tr>\n<td>3. Lire un entier<\/td>\n<td><code>clavier.nextInt()<\/code><\/td>\n<\/tr>\n<tr>\n<td>3 bis. Lire un réel<\/td>\n<td><code>clavier.nextDouble()<\/code><\/td>\n<\/tr>\n<\/tbody><\/table>\n<aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Avec un <code>int<\/code>, la factorielle <strong>déborde<\/strong> à partir de 13 : le programme affiche <code>1932053504<\/code> pour 13!, alors que la vraie valeur est <code>6227020800<\/code>. Aucun message d&#39;erreur. Avec un <code>long<\/code>, le résultat est juste (vérifié par exécution).<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Prédire la sortie<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Qu&#39;affiche <code>System.out.println(&quot;Total : &quot; + 4 + 6);<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Lecture de gauche à droite : chaîne + 4 donne <code>&quot;Total : 4&quot;<\/code>, puis + 6 donne <code>&quot;Total : 46&quot;<\/code>. Pour obtenir 10, il faut écrire <code>&quot;Total : &quot; + (4 + 6)<\/code>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Que vaut <code>17 % 5<\/code> ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 2<\/b><\/p><p>17 = 3 × 5 + 2. Le reste est 2.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Que vaut <code>9 / 2<\/code> en Java (deux entiers) ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 4<\/b><\/p><p>Division entière : 4. Pour obtenir 4.5, il faut au moins un réel : <code>9 / 2.0<\/code>.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Combien de fois le corps de cette boucle s&#39;exécute-t-il ? <code>int i = 20; do { i++; } while (i &lt; 10);<\/code><\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1<\/b><\/p><p>Une fois. Le <code>do while<\/code> exécute le corps avant de tester la condition.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>Écris la déclaration d&#39;une constante <code>TAXE<\/code> de type double valant 0.1, comme dans le TD 2.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>final double TAXE = 0.1;<\/code><\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><p>Dans un <code>switch<\/code>, à quoi sert <code>break<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>À sortir du bloc switch. Sans lui, l&#39;exécution continue dans les cas suivants.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 17 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quelle est l&#39;extension d&#39;un fichier source Java ?<\/div><button class=\"opt\" data-o=\"0\">.class<\/button><button class=\"opt\" data-o=\"1\">.java<\/button><button class=\"opt\" data-o=\"2\">.jar<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Quel est le prototype correct de la méthode principale ?<\/div><button class=\"opt\" data-o=\"0\">void main()<\/button><button class=\"opt\" data-o=\"1\">public void main(String args)<\/button><button class=\"opt\" data-o=\"2\">public static void main(String[] args)<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Quel mot-clé déclare une constante ?<\/div><button class=\"opt\" data-o=\"0\">const<\/button><button class=\"opt\" data-o=\"1\">final<\/button><button class=\"opt\" data-o=\"2\">static<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Qu&#39;affiche <code>System.out.println(&quot;Resultat: &quot; + 1 + 2);<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">Resultat: 3<\/button><button class=\"opt\" data-o=\"1\">Resultat: 12<\/button><button class=\"opt\" data-o=\"2\">Une erreur de compilation<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Qu&#39;affiche <code>System.out.println(1 + 2 + &quot; est le resultat&quot;);<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">3 est le resultat<\/button><button class=\"opt\" data-o=\"1\">12 est le resultat<\/button><button class=\"opt\" data-o=\"2\">1 + 2 est le resultat<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Que vaut <code>7 / 2<\/code> en Java ?<\/div><button class=\"opt\" data-o=\"0\">3.5<\/button><button class=\"opt\" data-o=\"1\">3<\/button><button class=\"opt\" data-o=\"2\">4<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Quelle boucle exécute son corps au moins une fois ?<\/div><button class=\"opt\" data-o=\"0\">for<\/button><button class=\"opt\" data-o=\"1\">while<\/button><button class=\"opt\" data-o=\"2\">do while<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Dans un <code>switch<\/code> sans aucun <code>break<\/code>, si on entre au <code>case 2<\/code> :<\/div><button class=\"opt\" data-o=\"0\">seul le <code>case 2<\/code> s&#39;exécute<\/button><button class=\"opt\" data-o=\"1\">le <code>case 2<\/code> et tous les cas suivants s&#39;exécutent<\/button><button class=\"opt\" data-o=\"2\">rien ne s&#39;exécute<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Quel est l&#39;opérateur du ET logique ?<\/div><button class=\"opt\" data-o=\"0\">&amp;<\/button><button class=\"opt\" data-o=\"1\">and<\/button><button class=\"opt\" data-o=\"2\">&amp;&amp;<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Quelle instruction lit un entier au clavier avec un Scanner nommé <code>sc<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">sc.readInt()<\/button><button class=\"opt\" data-o=\"1\">sc.nextInt()<\/button><button class=\"opt\" data-o=\"2\">sc.getInt()<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"10\"><div class=\"qq-q\">Après <code>int x = 5; x += 3; x++;<\/code>, que vaut x ?<\/div><button class=\"opt\" data-o=\"0\">8<\/button><button class=\"opt\" data-o=\"1\">9<\/button><button class=\"opt\" data-o=\"2\">10<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"11\"><div class=\"qq-q\">Laquelle de ces déclarations est correcte en Java ?<\/div><button class=\"opt\" data-o=\"0\">boolean b = True;<\/button><button class=\"opt\" data-o=\"1\">boolean b = true;<\/button><button class=\"opt\" data-o=\"2\">bool b = 1;<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"bases-java","rep":["3"],"tol":null},{"n":"bases-java","rep":null,"tol":null},{"n":"bases-java","rep":["2"],"tol":null},{"n":"bases-java","rep":["4"],"tol":null},{"n":"bases-java","rep":["1"],"tol":null},{"n":"bases-java","rep":null,"tol":null},{"n":"bases-java","rep":null,"tol":null}],"qcm":[{"n":"bases-java","q":"Quelle est l&#39;extension d&#39;un fichier source Java ?","o":[".class",".java",".jar"],"a":1,"e":"Le compilateur produit ensuite un fichier .class."},{"n":"bases-java","q":"Quel est le prototype correct de la méthode principale ?","o":["void main()","public void main(String args)","public static void main(String[] args)"],"a":2,"e":"C&#39;est le point d&#39;entrée de tout programme Java."},{"n":"bases-java","q":"Quel mot-clé déclare une constante ?","o":["const","final","static"],"a":1,"e":"Une variable <code>final<\/code> ne peut recevoir une valeur qu&#39;une seule fois."},{"n":"bases-java","q":"Qu&#39;affiche <code>System.out.println(&quot;Resultat: &quot; + 1 + 2);<\/code> ?","o":["Resultat: 3","Resultat: 12","Une erreur de compilation"],"a":1,"e":"Concaténation de gauche à droite : &quot;Resultat: 1&quot; puis &quot;Resultat: 12&quot;."},{"n":"bases-java","q":"Qu&#39;affiche <code>System.out.println(1 + 2 + &quot; est le resultat&quot;);<\/code> ?","o":["3 est le resultat","12 est le resultat","1 + 2 est le resultat"],"a":0,"e":"<code>1 + 2<\/code> est calculé d&#39;abord (deux entiers), puis concaténé."},{"n":"bases-java","q":"Que vaut <code>7 / 2<\/code> en Java ?","o":["3.5","3","4"],"a":1,"e":"Division entière. Pour 3.5, il faut écrire <code>7 / 2.0<\/code>."},{"n":"bases-java","q":"Quelle boucle exécute son corps au moins une fois ?","o":["for","while","do while"],"a":2,"e":"La condition est testée après le corps."},{"n":"bases-java","q":"Dans un <code>switch<\/code> sans aucun <code>break<\/code>, si on entre au <code>case 2<\/code> :","o":["seul le <code>case 2<\/code> s&#39;exécute","le <code>case 2<\/code> et tous les cas suivants s&#39;exécutent","rien ne s&#39;exécute"],"a":1,"e":"Le <code>break<\/code> sert justement à sortir du bloc."},{"n":"bases-java","q":"Quel est l&#39;opérateur du ET logique ?","o":["&amp;","and","&amp;&amp;"],"a":2,"e":"Et <code>||<\/code> pour le OU logique."},{"n":"bases-java","q":"Quelle instruction lit un entier au clavier avec un Scanner nommé <code>sc<\/code> ?","o":["sc.readInt()","sc.nextInt()","sc.getInt()"],"a":1,"e":"Et <code>sc.nextDouble()<\/code> pour un réel."},{"n":"bases-java","q":"Après <code>int x = 5; x += 3; x++;<\/code>, que vaut x ?","o":["8","9","10"],"a":1,"e":"5 + 3 = 8, puis 8 + 1 = 9."},{"n":"bases-java","q":"Laquelle de ces déclarations est correcte en Java ?","o":["boolean b = True;","boolean b = true;","bool b = 1;"],"a":1,"e":"Les booléens s&#39;écrivent en minuscules, et le type s&#39;appelle <code>boolean<\/code>."}]},{"id":"tableaux","t":"Les tableaux en Java","seance":"Séance 3","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu dois savoir écrire une boucle <code>for<\/code> en Java et connaître les tableaux du C (chapitre 4).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Un tableau a 5 cases. Quel est l&#39;indice de la première case, et celui de la dernière ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>La première est à l&#39;indice <strong>0<\/strong>, la dernière à l&#39;indice <strong>4<\/strong> (taille − 1). Comme en C, les indices commencent à 0.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « télécommande et télévision ».<\/strong> La variable tableau n&#39;est pas le tableau : c&#39;est une télécommande (une <strong>référence<\/strong>) qui pointe vers lui. Déclarer, c&#39;est fabriquer la télécommande. <code>new<\/code>, c&#39;est acheter la télévision.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>En C, on écrit <code>int tab[10];<\/code>. En Java, <strong>c&#39;est une erreur<\/strong> : on ne précise jamais la taille à la déclaration. La taille se donne plus tard, avec <code>new<\/code>.<\/p>\n<\/aside><p>À la fin, tu sais créer un tableau en trois temps, le parcourir avec <code>length<\/code>, et prévoir ce qui se passe quand on écrit <code>B = A<\/code>.<\/p>\n<h2>Idée 1 · Un tableau est un objet<\/h2>\n<p>En Java, les tableaux sont <strong>considérés comme des objets<\/strong>. Un tableau est une <strong>collection ordonnée de variables du même type<\/strong>. Ses éléments peuvent être :<\/p>\n<ul>\n<li>de type <strong>primitif<\/strong> (<code>int<\/code>, <code>double<\/code>, <code>boolean<\/code>…) ;<\/li>\n<li>des <strong>objets<\/strong>.<\/li>\n<\/ul>\n<p>Créer un tableau se fait en <strong>trois temps<\/strong> :<\/p>\n<figure class=\"flux\"><figcaption>Les trois temps d'un tableau<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">Déclaration (préciser son type)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Dimensionnement (préciser sa taille)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Initialisation (remplir chaque case)<\/div><\/div><\/figure><h2>Idée 2 · Déclarer : le type seulement, jamais la taille<\/h2>\n<pre class=\"\"><code>int[] tab;       // correct : tab vaut null\nint tab2[];      // correct aussi : tab2 vaut null\nint tab3[10];    // ERREUR : on ne précise pas la dimension à la déclaration<\/code><\/pre><svg viewBox=\"0 0 360 80\" style=\"width:100%;max-width:460px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Après la déclaration, la variable tab ne pointe vers rien : elle vaut null\">\n<g font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"30\" y=\"24\" width=\"80\" height=\"32\" rx=\"6\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/><text x=\"70\" y=\"45\" fill=\"#D9824F\" font-weight=\"700\">tab<\/text>\n<text x=\"250\" y=\"45\">null (aucun tableau)<\/text>\n<\/g>\n<path d=\"M112 40h60\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><path d=\"M166 34l10 12M176 34l-10 12\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<\/svg><p>Après la déclaration, la variable vaut <strong><code>null<\/code><\/strong> : la télécommande existe, mais elle ne pointe vers aucune télévision.<\/p>\n<h2>Idée 3 · Dimensionner avec new, parcourir avec length<\/h2>\n<p>Le tableau est créé et dimensionné à l&#39;aide de <strong><code>new<\/code><\/strong> :<\/p>\n<pre class=\"\"><code>tab = new int[5];     // 5 est la taille du tableau<\/code><\/pre><p><code>new<\/code> fait deux choses :<\/p>\n<ol>\n<li>il <strong>alloue la mémoire<\/strong>, en respectant le type du tableau et sa dimension ;<\/li>\n<li>il <strong>initialise les cases à 0<\/strong> dans le cas d&#39;un type simple.<\/li>\n<\/ol>\n<p>La longueur d&#39;un tableau s&#39;obtient avec <strong><code>tab.length<\/code><\/strong>.<\/p>\n<pre class=\"\"><code>public class Tab1 {\n    public static void main(String[] args) {\n        int T[] = new int[5];\n        for (int i = 0; i &lt; T.length; i++)\n            System.out.println(T[i]);\n    }\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>0\n0\n0\n0\n0<\/code><\/pre><figure class=\"grille\"><figcaption>Le tableau T juste après new int[5]<\/figcaption><table><tr><th>T[0]<\/th><th>T[1]<\/th><th>T[2]<\/th><th>T[3]<\/th><th>T[4]<\/th><\/tr><tr><td class=\"h1\">0<\/td><td class=\"h1\">0<\/td><td class=\"h1\">0<\/td><td class=\"h1\">0<\/td><td class=\"h1\">0<\/td><\/tr><\/table><\/figure><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p><code>length<\/code> s&#39;écrit <strong>sans parenthèses<\/strong> pour un tableau : <code>T.length<\/code>, pas <code>T.length()<\/code>.<\/p>\n<\/aside><h2>Idée 4 · Initialiser et accéder<\/h2>\n<ul>\n<li>Comme en C, les indices commencent par <strong>0<\/strong>.<\/li>\n<li>On accède à un élément par <code>T[i]<\/code>, où l&#39;indice varie entre <strong>0 et taille − 1<\/strong>.<\/li>\n<li>On peut tout faire en une ligne : <code>int[] T = {10, 14, 7};<\/code><\/li>\n<\/ul>\n<p>Les deux écritures suivantes sont <strong>équivalentes<\/strong> :<\/p>\n<table>\n<thead>\n<tr>\n<th>En une ligne<\/th>\n<th>En trois temps<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>int[] T = {10, 14, 7};<\/code><\/td>\n<td><code>int[] T;<\/code> puis <code>T = new int[3];<\/code> puis <code>T[0] = 10; T[1] = 14; T[2] = 7;<\/code><\/td>\n<\/tr>\n<\/tbody><\/table>\n<pre class=\"\"><code>int[] notes = {10, 14, 7};\nSystem.out.println(notes.length);\nSystem.out.println(notes[0] + notes[2]);\n\nint somme = 0;\nfor (int i = 0; i &lt; notes.length; i++) somme += notes[i];\nSystem.out.println(&quot;Somme = &quot; + somme);<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>3\n17\nSomme = 31<\/code><\/pre><figure class=\"grille\"><figcaption>Le tableau notes<\/figcaption><table><tr><th>notes[0]<\/th><th>notes[1]<\/th><th>notes[2]<\/th><\/tr><tr><td class=\"h1\">10<\/td><td>14<\/td><td class=\"h1\">7<\/td><\/tr><\/table><\/figure><p>Deux erreurs à l&#39;exécution, toutes deux testées :<\/p>\n<table>\n<thead>\n<tr>\n<th>Code<\/th>\n<th>Ce qui se passe<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>notes[3]<\/code> sur un tableau de taille 3<\/td>\n<td><code>ArrayIndexOutOfBoundsException : Index 3 out of bounds for length 3<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>int[] vide = null; vide.length<\/code><\/td>\n<td><code>NullPointerException<\/code> : on utilise une référence qui ne pointe vers rien<\/td>\n<\/tr>\n<\/tbody><\/table>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Les noms de ces deux exceptions sont un ajout de ToumaiLearn (les notes ne les citent pas). Tu les verras forcément en TP : autant les reconnaître.<\/p>\n<\/aside><h2>Idée 5 · B = A ne copie pas le tableau<\/h2>\n<pre class=\"\"><code>int[] A = {1, 2, 3};\nint[] B = A;          // B et A désignent LE MÊME tableau\nB[0] = 99;\nSystem.out.println(A[0]);\n\nint[] C = {1, 2, 3};\nint[] D = {1, 2, 3};\nSystem.out.println(C == D);\nSystem.out.println(A == B);<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>99\nfalse\ntrue<\/code><\/pre><svg viewBox=\"0 0 360 120\" style=\"width:100%;max-width:460px;display:block;margin:10px auto\" role=\"img\" aria-label=\"A et B pointent vers le même tableau ; C et D pointent vers deux tableaux distincts de même contenu\">\n<g font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"14\" y=\"10\" width=\"36\" height=\"24\" rx=\"5\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/><text x=\"32\" y=\"27\" fill=\"#D9824F\" font-weight=\"700\">A<\/text>\n<rect x=\"14\" y=\"44\" width=\"36\" height=\"24\" rx=\"5\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/><text x=\"32\" y=\"61\" fill=\"#D9824F\" font-weight=\"700\">B<\/text>\n<rect x=\"110\" y=\"26\" width=\"34\" height=\"26\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"127\" y=\"44\">99<\/text><rect x=\"144\" y=\"26\" width=\"34\" height=\"26\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"161\" y=\"44\">2<\/text><rect x=\"178\" y=\"26\" width=\"34\" height=\"26\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"195\" y=\"44\">3<\/text>\n<text x=\"290\" y=\"44\" font-size=\"10\">un seul tableau<\/text>\n<rect x=\"14\" y=\"84\" width=\"36\" height=\"24\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"32\" y=\"101\">C<\/text>\n<rect x=\"76\" y=\"84\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"88\" y=\"101\">1<\/text><rect x=\"100\" y=\"84\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"112\" y=\"101\">2<\/text><rect x=\"124\" y=\"84\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"136\" y=\"101\">3<\/text>\n<rect x=\"190\" y=\"84\" width=\"36\" height=\"24\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"208\" y=\"101\">D<\/text>\n<rect x=\"252\" y=\"84\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"264\" y=\"101\">1<\/text><rect x=\"276\" y=\"84\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"288\" y=\"101\">2<\/text><rect x=\"300\" y=\"84\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"312\" y=\"101\">3<\/text>\n<\/g>\n<path d=\"M52 22L106 36M52 56L106 44M52 96h20M228 96h20\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<\/svg><figure class=\"etapes\" data-i=\"0\"><figcaption>Lire le programme ligne par ligne<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · int[] B = A;<\/div><p>On copie la <strong>référence<\/strong>, pas les cases. A et B sont deux télécommandes pour la même télévision.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · B[0] = 99;<\/div><p>On modifie le tableau via B. Comme c&#39;est le même tableau, A le voit aussi : <code>A[0]<\/code> vaut 99.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · C == D<\/div><p>C et D ont le même contenu, mais ce sont <strong>deux tableaux distincts<\/strong>. <code>==<\/code> compare les références : <code>false<\/code>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · A == B<\/div><p>Même référence : <code>true<\/code>.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>En Java, pour les tableaux et les objets, <code>=<\/code> copie la <strong>référence<\/strong> et <code>==<\/code> compare les <strong>références<\/strong>, pas le contenu.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Tableaux<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Laquelle de ces déclarations est refusée par le compilateur : <code>int[] t;<\/code>, <code>int t[];<\/code>, <code>int t[10];<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>int t[10];<\/code>. On ne précise pas la dimension du tableau à la déclaration.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Après <code>double[] t = new double[4];<\/code>, que contient chaque case, et que vaut <code>t.length<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Chaque case contient 0 (ici <code>0.0<\/code>), car <code>new<\/code> initialise les cases à 0 pour un type simple. <code>t.length<\/code> vaut 4.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Quel est l&#39;indice de la dernière case d&#39;un tableau de 8 éléments ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 7<\/b><\/p><p>Les indices vont de 0 à taille − 1, donc de 0 à 7.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Soit <code>int[] a = {5, 6}; int[] b = a; b[1] = 0;<\/code>. Que vaut <code>a[1]<\/code> ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0<\/b><\/p><p><code>b = a<\/code> copie la référence : a et b désignent le même tableau. Modifier <code>b[1]<\/code> modifie donc <code>a[1]<\/code>.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>Écris une boucle qui affiche tous les éléments d&#39;un tableau <code>T<\/code>.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>for (int i = 0; i &lt; T.length; i++) System.out.println(T[i]);<\/code><\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 10 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">En Java, un tableau est considéré comme :<\/div><button class=\"opt\" data-o=\"0\">un type primitif<\/button><button class=\"opt\" data-o=\"1\">un objet<\/button><button class=\"opt\" data-o=\"2\">une fonction<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Laquelle de ces déclarations est incorrecte en Java ?<\/div><button class=\"opt\" data-o=\"0\">int[] tab;<\/button><button class=\"opt\" data-o=\"1\">int tab[];<\/button><button class=\"opt\" data-o=\"2\">int tab[10];<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Que vaut une variable tableau juste après <code>int[] tab;<\/code> (sans <code>new<\/code>) ?<\/div><button class=\"opt\" data-o=\"0\">Un tableau vide de taille 0<\/button><button class=\"opt\" data-o=\"1\">null<\/button><button class=\"opt\" data-o=\"2\">Un tableau de 10 zéros<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Quel mot-clé crée et dimensionne le tableau ?<\/div><button class=\"opt\" data-o=\"0\">new<\/button><button class=\"opt\" data-o=\"1\">malloc<\/button><button class=\"opt\" data-o=\"2\">create<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Que contient <code>new int[3]<\/code> juste après sa création ?<\/div><button class=\"opt\" data-o=\"0\">Des valeurs aléatoires<\/button><button class=\"opt\" data-o=\"1\">Trois zéros<\/button><button class=\"opt\" data-o=\"2\">Trois null<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Comment obtient-on la taille d&#39;un tableau <code>T<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">T.size()<\/button><button class=\"opt\" data-o=\"1\">T.length()<\/button><button class=\"opt\" data-o=\"2\">T.length<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Dans un tableau de taille 5, quel est le dernier indice valide ?<\/div><button class=\"opt\" data-o=\"0\">4<\/button><button class=\"opt\" data-o=\"1\">5<\/button><button class=\"opt\" data-o=\"2\">6<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Soit <code>int[] A = {1, 2, 3}; int[] B = A; B[0] = 99;<\/code>. Que vaut <code>A[0]<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">1<\/button><button class=\"opt\" data-o=\"1\">99<\/button><button class=\"opt\" data-o=\"2\">0<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Soit <code>int[] C = {1, 2, 3}; int[] D = {1, 2, 3};<\/code>. Que vaut <code>C == D<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">true<\/button><button class=\"opt\" data-o=\"1\">false<\/button><button class=\"opt\" data-o=\"2\">Erreur de compilation<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Les éléments d&#39;un tableau peuvent être :<\/div><button class=\"opt\" data-o=\"0\">seulement des entiers<\/button><button class=\"opt\" data-o=\"1\">seulement des types primitifs<\/button><button class=\"opt\" data-o=\"2\">des types primitifs ou des objets<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"10\"><div class=\"qq-q\"><code>int[] T = {10, 14, 7};<\/code> : que vaut <code>T[1]<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">10<\/button><button class=\"opt\" data-o=\"1\">14<\/button><button class=\"opt\" data-o=\"2\">7<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"tableaux","rep":null,"tol":null},{"n":"tableaux","rep":null,"tol":null},{"n":"tableaux","rep":null,"tol":null},{"n":"tableaux","rep":["7"],"tol":null},{"n":"tableaux","rep":["0"],"tol":null},{"n":"tableaux","rep":null,"tol":null}],"qcm":[{"n":"tableaux","q":"En Java, un tableau est considéré comme :","o":["un type primitif","un objet","une fonction"],"a":1,"e":"C&#39;est une collection ordonnée de variables du même type."},{"n":"tableaux","q":"Laquelle de ces déclarations est incorrecte en Java ?","o":["int[] tab;","int tab[];","int tab[10];"],"a":2,"e":"On ne précise pas la dimension à la déclaration."},{"n":"tableaux","q":"Que vaut une variable tableau juste après <code>int[] tab;<\/code> (sans <code>new<\/code>) ?","o":["Un tableau vide de taille 0","null","Un tableau de 10 zéros"],"a":1,"e":"La référence existe, mais elle ne désigne aucun tableau."},{"n":"tableaux","q":"Quel mot-clé crée et dimensionne le tableau ?","o":["new","malloc","create"],"a":0,"e":"<code>tab = new int[5];<\/code>"},{"n":"tableaux","q":"Que contient <code>new int[3]<\/code> juste après sa création ?","o":["Des valeurs aléatoires","Trois zéros","Trois null"],"a":1,"e":"<code>new<\/code> initialise les cases à 0 pour un type simple."},{"n":"tableaux","q":"Comment obtient-on la taille d&#39;un tableau <code>T<\/code> ?","o":["T.size()","T.length()","T.length"],"a":2,"e":"Sans parenthèses pour un tableau."},{"n":"tableaux","q":"Dans un tableau de taille 5, quel est le dernier indice valide ?","o":["4","5","6"],"a":0,"e":"Les indices vont de 0 à taille − 1."},{"n":"tableaux","q":"Soit <code>int[] A = {1, 2, 3}; int[] B = A; B[0] = 99;<\/code>. Que vaut <code>A[0]<\/code> ?","o":["1","99","0"],"a":1,"e":"A et B désignent le même tableau."},{"n":"tableaux","q":"Soit <code>int[] C = {1, 2, 3}; int[] D = {1, 2, 3};<\/code>. Que vaut <code>C == D<\/code> ?","o":["true","false","Erreur de compilation"],"a":1,"e":"Deux tableaux distincts : <code>==<\/code> compare les références."},{"n":"tableaux","q":"Les éléments d&#39;un tableau peuvent être :","o":["seulement des entiers","seulement des types primitifs","des types primitifs ou des objets"],"a":2,"e":"Tous du même type, mais ce type peut être une classe."},{"n":"tableaux","q":"<code>int[] T = {10, 14, 7};<\/code> : que vaut <code>T[1]<\/code> ?","o":["10","14","7"],"a":1,"e":"L&#39;indice 1 désigne la deuxième case."}]},{"id":"classes-objets","t":"Classes et objets en Java · new, références, private","seance":"Séances 2 et 4","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu dois connaître les mots classe, objet, attribut, méthode, encapsulation (chapitre 2), et savoir que <code>B = A<\/code> copie une référence pour un tableau (chapitre 5).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Soit <code>int[] a = {1, 2}; int[] b = a;<\/code>. Combien de tableaux existent en mémoire ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1<\/b><\/p><p><strong>Un seul.<\/strong> <code>a<\/code> et <code>b<\/code> sont deux références vers le même tableau. Les objets se comportent exactement de la même façon : c&#39;est l&#39;idée centrale de ce chapitre.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Compte les <code>new<\/code>.<\/strong> Chaque <code>new<\/code> fabrique un objet, et rien d&#39;autre n&#39;en fabrique. Pour savoir combien d&#39;objets existent dans un programme, compte les <code>new<\/code>. Les variables, elles, ne sont que des références.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Déclarer <code>Point p2;<\/code> <strong>ne crée pas d&#39;objet<\/strong>. Tant qu&#39;il n&#39;y a pas eu de <code>new<\/code> (ou d&#39;affectation), appeler <code>p2.initialiser(3, 4)<\/code> est une erreur.<\/p>\n<\/aside><p>À la fin, tu sais écrire une classe avec attributs privés et méthodes publiques, créer des objets, et prédire l&#39;effet de <code>p2 = p1<\/code>.<\/p>\n<h2>Idée 1 · Écrire une classe : attributs privés, méthodes publiques<\/h2>\n<svg viewBox=\"0 0 360 130\" style=\"width:100%;max-width:460px;display:block;margin:10px auto\" role=\"img\" aria-label=\"La classe Point : attributs x et y privés, méthodes initialiser, deplacer et afficher publiques\">\n<g font-family=\"sans-serif\" font-size=\"11\" fill=\"currentColor\">\n<rect x=\"100\" y=\"8\" width=\"160\" height=\"114\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"100\" y1=\"34\" x2=\"260\" y2=\"34\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"100\" y1=\"70\" x2=\"260\" y2=\"70\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<text x=\"180\" y=\"26\" text-anchor=\"middle\" font-weight=\"700\">Point<\/text>\n<text x=\"110\" y=\"50\" fill=\"#D9824F\" font-weight=\"700\">- x : double<\/text><text x=\"110\" y=\"64\" fill=\"#D9824F\" font-weight=\"700\">- y : double<\/text>\n<text x=\"110\" y=\"86\">+ initialiser(a, b)<\/text><text x=\"110\" y=\"100\">+ deplacer(dx, dy)<\/text><text x=\"110\" y=\"114\">+ afficher()<\/text>\n<text x=\"50\" y=\"56\" text-anchor=\"middle\" font-size=\"10\">private<\/text><text x=\"310\" y=\"96\" text-anchor=\"middle\" font-size=\"10\">public<\/text>\n<\/g>\n<\/svg><pre class=\"\"><code>class Point {\n    private double x, y;                       // attributs : l'état\n\n    public void initialiser(double a, double b) { x = a; y = b; }\n    public void deplacer(double dx, double dy)  { x += dx; y += dy; }\n    public void afficher() { System.out.println(&quot;[&quot; + x + &quot;, &quot; + y + &quot;]&quot;); }\n}<\/code><\/pre><table>\n<thead>\n<tr>\n<th>Mot<\/th>\n<th>Règle<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong><code>private<\/code><\/strong><\/td>\n<td>Visibilité limitée à <strong>l&#39;intérieur<\/strong> de la classe. C&#39;est la règle qui <strong>assure l&#39;encapsulation<\/strong> : elle donne l&#39;accès aux attributs seulement aux méthodes de la classe.<\/td>\n<\/tr>\n<tr>\n<td><strong><code>public<\/code><\/strong><\/td>\n<td>Visibilité à l&#39;intérieur <strong>et<\/strong> à l&#39;extérieur de la classe.<\/td>\n<\/tr>\n<\/tbody><\/table>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Les notes disent : « si on n&#39;a pas spécifié la règle (public, private…), la règle par défaut est <strong>public<\/strong> ». <strong>C&#39;est inexact en Java.<\/strong> Sans mot-clé, la visibilité est celle du <strong>paquetage<\/strong> (« package-private ») : l&#39;attribut est accessible depuis les classes du <strong>même paquetage<\/strong> seulement, pas de partout. Comme, en TP, toutes tes classes sont dans le même dossier, tout se passe « comme si » c&#39;était public, d&#39;où la confusion. Si la question tombe à l&#39;examen, demande au prof quelle réponse il attend.<\/p>\n<\/aside><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>La bonne habitude : <strong>attributs <code>private<\/code>, méthodes <code>public<\/code><\/strong>.<\/p>\n<\/aside><h2>Idée 2 · new fabrique l&#39;objet, la variable n&#39;est qu&#39;une référence<\/h2>\n<pre class=\"\"><code>public class TestPoint {\n    public static void main(String[] args) {\n        Point p1, p2;            // deux références, zéro objet\n        p1 = new Point();        // un objet est créé\n        p1.initialiser(1, 2);\n        p1.afficher();\n    }\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>[1.0, 2.0]<\/code><\/pre><figure class=\"etapes\" data-i=\"0\"><figcaption>Ce qui se passe en mémoire<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Point p1, p2;<\/div><p>Deux variables sont créées. Aucune ne désigne un objet. <strong>Zéro objet<\/strong> en mémoire.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · p1 = new Point();<\/div><p><code>new<\/code> fabrique un objet Point. <code>p1<\/code> reçoit sa référence (son adresse). <strong>Un objet<\/strong>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · p1.initialiser(1, 2);<\/div><p>On envoie le message <code>initialiser<\/code> à l&#39;objet désigné par p1. Son état devient x = 1, y = 2.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · p1.afficher();<\/div><p>L&#39;objet affiche son état : <code>[1.0, 2.0]<\/code>.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p>Trois règles des notes :<\/p>\n<ul>\n<li><strong>Le nombre de <code>new<\/code> = le nombre d&#39;objets.<\/strong><\/li>\n<li><strong>Tout objet est identifié et manipulé par sa référence.<\/strong><\/li>\n<li><strong>On ne peut pas appliquer une méthode sur un objet non instancié.<\/strong><\/li>\n<\/ul>\n<pre class=\"\"><code>Point p1, p2;\np1 = new Point();\np1.initialiser(1, 2);    // correct\np2.initialiser(3, 4);    // ERREUR : p2 ne désigne aucun objet<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Précision de ToumaiLearn, testée : pour une variable locale jamais affectée, le compilateur refuse (« variable p2 might not have been initialized »). Si la référence vaut <code>null<\/code>, le programme compile mais plante à l&#39;exécution avec une <code>NullPointerException<\/code>.<\/p>\n<\/aside><h2>Idée 3 · p2 = p1 crée un alias, pas une copie<\/h2>\n<pre class=\"\"><code>Point p1, p2;\np1 = new Point();\np1.initialiser(1, 2);\np2 = p1;                  // p2 est un alias de p1\np2.deplacer(10, 0);\np1.afficher();\nSystem.out.println(p1 == p2);<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>[11.0, 2.0]\ntrue<\/code><\/pre><svg viewBox=\"0 0 360 96\" style=\"width:100%;max-width:460px;display:block;margin:10px auto\" role=\"img\" aria-label=\"p1 et p2 désignent le même objet Point\">\n<g font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\">\n<rect x=\"20\" y=\"10\" width=\"50\" height=\"26\" rx=\"5\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/><text x=\"45\" y=\"28\" fill=\"#D9824F\" font-weight=\"700\">p1<\/text>\n<rect x=\"20\" y=\"60\" width=\"50\" height=\"26\" rx=\"5\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/><text x=\"45\" y=\"78\" fill=\"#D9824F\" font-weight=\"700\">p2<\/text>\n<rect x=\"200\" y=\"20\" width=\"130\" height=\"56\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"265\" y=\"40\" font-weight=\"700\">objet Point<\/text><text x=\"265\" y=\"58\">x = 11.0   y = 2.0<\/text>\n<\/g>\n<path d=\"M72 24L196 42M72 72L196 54\" stroke=\"currentColor\" stroke-width=\"2\"/><path d=\"M188 36l8 6-9 4M187 50l9 4-8 6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<\/svg><p>On a déplacé <strong>p2<\/strong>, et c&#39;est <strong>p1<\/strong> qui affiche 11. Normal : il n&#39;y a qu&#39;<strong>un seul <code>new<\/code><\/strong>, donc un seul objet. <code>p2<\/code> est <strong>comme un alias<\/strong> pour l&#39;objet de <code>p1<\/code> : ils référencent le même objet.<\/p>\n<h2>Idée 4 · == compare les adresses, pas les valeurs<\/h2>\n<pre class=\"\"><code>Point p3 = new Point();\np3.initialiser(11, 2);\np3.afficher();\nSystem.out.println(p1 == p3);<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>[11.0, 2.0]\nfalse<\/code><\/pre><p><code>p1<\/code> et <code>p3<\/code> ont <strong>les mêmes coordonnées<\/strong>, et pourtant <code>p1 == p3<\/code> vaut <code>false<\/code>.<\/p>\n<figure class=\"grille\"><figcaption>Deux objets identiques, deux adresses différentes<\/figcaption><table><tr><th>Variable<\/th><th>Objet<\/th><th>x<\/th><th>y<\/th><th>p1==…<\/th><\/tr><tr><td>p1<\/td><td class=\"h1\">objet n°1<\/td><td>11.0<\/td><td>2.0<\/td><td>—<\/td><\/tr><tr><td>p2<\/td><td class=\"h1\">objet n°1<\/td><td>11.0<\/td><td>2.0<\/td><td>true<\/td><\/tr><tr><td>p3<\/td><td class=\"h2\">objet n°2<\/td><td>11.0<\/td><td>2.0<\/td><td>false<\/td><\/tr><\/table><\/figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Même si deux objets ont les mêmes coordonnées, ils <strong>ne sont pas égaux<\/strong> pour <code>==<\/code>, car ils ont <strong>deux adresses différentes<\/strong>. En Java, <code>==<\/code> compare <strong>les références<\/strong>, pas les valeurs.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Une référence désigne un objet, mais <strong>une référence n&#39;est pas un objet<\/strong>. Plusieurs références peuvent désigner le même objet (alias), et une référence peut ne désigner aucun objet (<code>null<\/code>).<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Compter et prédire<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Combien d&#39;objets sont créés ? <code>Point a = new Point(); Point b = new Point(); Point c = a; Point d;<\/code><\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 2<\/b><\/p><p>Deux <code>new<\/code>, donc deux objets. <code>c<\/code> est un alias de <code>a<\/code>, et <code>d<\/code> ne désigne rien.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Avec le code précédent, que vaut <code>a == c<\/code> ? Et <code>a == b<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>a == c<\/code> vaut <code>true<\/code> (même objet). <code>a == b<\/code> vaut <code>false<\/code> (deux objets distincts, même s&#39;ils ont le même état).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Soit <code>Point p = new Point(); p.initialiser(2, 3); Point q = p; q.deplacer(1, 1);<\/code>. Qu&#39;affiche <code>p.afficher();<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>[3.0, 4.0]<\/code>. <code>q<\/code> est un alias de <code>p<\/code> : le déplacement s&#39;applique à l&#39;unique objet.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Pourquoi déclare-t-on les attributs <code>private<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Pour assurer l&#39;encapsulation : seules les méthodes de la classe peuvent accéder aux attributs, ce qui protège l&#39;état de l&#39;objet.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>Quelle est la visibilité d&#39;un attribut déclaré <code>private<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Limitée à l&#39;intérieur de la classe.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 12 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quelle est la visibilité d&#39;un attribut <code>private<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">Tout le programme<\/button><button class=\"opt\" data-o=\"1\">L&#39;intérieur de la classe seulement<\/button><button class=\"opt\" data-o=\"2\">Le paquetage seulement<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Quelle règle assure l&#39;encapsulation ?<\/div><button class=\"opt\" data-o=\"0\">private<\/button><button class=\"opt\" data-o=\"1\">public<\/button><button class=\"opt\" data-o=\"2\">static<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Combien d&#39;objets ce code crée-t-il ? <code>Point a = new Point(); Point b = a; Point c = b;<\/code><\/div><button class=\"opt\" data-o=\"0\">1<\/button><button class=\"opt\" data-o=\"1\">2<\/button><button class=\"opt\" data-o=\"2\">3<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Que crée l&#39;instruction <code>Point p;<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">Un objet Point initialisé à zéro<\/button><button class=\"opt\" data-o=\"1\">Une référence, sans objet<\/button><button class=\"opt\" data-o=\"2\">Une classe Point<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Après <code>p2 = p1;<\/code>, modifier l&#39;objet via p2 :<\/div><button class=\"opt\" data-o=\"0\">ne change rien pour p1<\/button><button class=\"opt\" data-o=\"1\">modifie aussi ce que voit p1, car c&#39;est le même objet<\/button><button class=\"opt\" data-o=\"2\">provoque une erreur de compilation<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Deux objets Point distincts ont les mêmes coordonnées. Que vaut <code>p1 == p3<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">true<\/button><button class=\"opt\" data-o=\"1\">false<\/button><button class=\"opt\" data-o=\"2\">Cela dépend des coordonnées<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Quel opérateur crée un objet ?<\/div><button class=\"opt\" data-o=\"0\">class<\/button><button class=\"opt\" data-o=\"1\">this<\/button><button class=\"opt\" data-o=\"2\">new<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Que se passe-t-il si on appelle une méthode sur une référence qui vaut <code>null<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">La méthode s&#39;exécute avec des valeurs à zéro<\/button><button class=\"opt\" data-o=\"1\">Une NullPointerException à l&#39;exécution<\/button><button class=\"opt\" data-o=\"2\">Rien du tout<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">En Java, un attribut déclaré sans aucun mot-clé de visibilité est :<\/div><button class=\"opt\" data-o=\"0\">public<\/button><button class=\"opt\" data-o=\"1\">private<\/button><button class=\"opt\" data-o=\"2\">accessible dans son paquetage (package-private)<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Dans la classe Point, <code>x += dx;<\/code> écrit dans la méthode <code>deplacer<\/code> est autorisé parce que :<\/div><button class=\"opt\" data-o=\"0\">x est une variable globale<\/button><button class=\"opt\" data-o=\"1\">deplacer est une méthode de la classe, donc elle accède aux attributs privés<\/button><button class=\"opt\" data-o=\"2\">dx est public<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"10\"><div class=\"qq-q\">Combien de références et d&#39;objets ? <code>Point a = new Point(), b = new Point(), c = a;<\/code><\/div><button class=\"opt\" data-o=\"0\">2 références, 3 objets<\/button><button class=\"opt\" data-o=\"1\">3 références, 3 objets<\/button><button class=\"opt\" data-o=\"2\">3 références, 2 objets<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"classes-objets","rep":["1"],"tol":null},{"n":"classes-objets","rep":["2"],"tol":null},{"n":"classes-objets","rep":null,"tol":null},{"n":"classes-objets","rep":null,"tol":null},{"n":"classes-objets","rep":null,"tol":null},{"n":"classes-objets","rep":null,"tol":null}],"qcm":[{"n":"classes-objets","q":"Quelle est la visibilité d&#39;un attribut <code>private<\/code> ?","o":["Tout le programme","L&#39;intérieur de la classe seulement","Le paquetage seulement"],"a":1,"e":"Seules les méthodes de la classe y accèdent."},{"n":"classes-objets","q":"Quelle règle assure l&#39;encapsulation ?","o":["private","public","static"],"a":0,"e":"Elle réserve l&#39;accès aux attributs aux méthodes de la classe."},{"n":"classes-objets","q":"Combien d&#39;objets ce code crée-t-il ? <code>Point a = new Point(); Point b = a; Point c = b;<\/code>","o":["1","2","3"],"a":0,"e":"Un seul <code>new<\/code>, donc un seul objet. b et c sont des alias."},{"n":"classes-objets","q":"Que crée l&#39;instruction <code>Point p;<\/code> ?","o":["Un objet Point initialisé à zéro","Une référence, sans objet","Une classe Point"],"a":1,"e":"L&#39;objet n&#39;existe qu&#39;après un <code>new<\/code>."},{"n":"classes-objets","q":"Après <code>p2 = p1;<\/code>, modifier l&#39;objet via p2 :","o":["ne change rien pour p1","modifie aussi ce que voit p1, car c&#39;est le même objet","provoque une erreur de compilation"],"a":1,"e":"p2 est un alias de p1."},{"n":"classes-objets","q":"Deux objets Point distincts ont les mêmes coordonnées. Que vaut <code>p1 == p3<\/code> ?","o":["true","false","Cela dépend des coordonnées"],"a":1,"e":"<code>==<\/code> compare les adresses, et elles sont différentes."},{"n":"classes-objets","q":"Quel opérateur crée un objet ?","o":["class","this","new"],"a":2,"e":"Le nombre de <code>new<\/code> est le nombre d&#39;objets."},{"n":"classes-objets","q":"Que se passe-t-il si on appelle une méthode sur une référence qui vaut <code>null<\/code> ?","o":["La méthode s&#39;exécute avec des valeurs à zéro","Une NullPointerException à l&#39;exécution","Rien du tout"],"a":1,"e":"On ne peut pas appliquer une méthode sur un objet non instancié."},{"n":"classes-objets","q":"En Java, un attribut déclaré sans aucun mot-clé de visibilité est :","o":["public","private","accessible dans son paquetage (package-private)"],"a":2,"e":"Les notes disent « public » : c&#39;est une simplification inexacte."},{"n":"classes-objets","q":"Dans la classe Point, <code>x += dx;<\/code> écrit dans la méthode <code>deplacer<\/code> est autorisé parce que :","o":["x est une variable globale","deplacer est une méthode de la classe, donc elle accède aux attributs privés","dx est public"],"a":1,"e":"Les méthodes de la classe ont accès à ses attributs privés."},{"n":"classes-objets","q":"Combien de références et d&#39;objets ? <code>Point a = new Point(), b = new Point(), c = a;<\/code>","o":["2 références, 3 objets","3 références, 3 objets","3 références, 2 objets"],"a":2,"e":"Trois variables, mais seulement deux <code>new<\/code>."}]},{"id":"constructeurs-this","t":"Constructeurs, this, getters et setters","seance":"Séance 4 · TD 3","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu dois savoir créer un objet avec <code>new<\/code> et pourquoi les attributs sont <code>private<\/code> (chapitre 6).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Dans le chapitre 6, il fallait deux lignes pour obtenir un point utilisable : <code>p = new Point();<\/code> puis <code>p.initialiser(1, 2);<\/code>. Quel risque y a-t-il à séparer les deux ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>On peut <strong>oublier<\/strong> la seconde ligne : l&#39;objet existe alors avec un état non voulu. Le constructeur règle ce problème : il crée <strong>et<\/strong> initialise en une seule instruction.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « acte de naissance ».<\/strong> Le constructeur est la méthode qui s&#39;exécute à la naissance de l&#39;objet, une seule fois, au moment du <code>new<\/code>. Son rôle : que l&#39;objet naisse déjà dans un état correct.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Écrire <code>void<\/code> devant un constructeur. Un constructeur n&#39;a <strong>aucun type de retour, même pas <code>void<\/code><\/strong>. Avec <code>void<\/code>, Java y voit une méthode ordinaire qui porte le nom de la classe, et ton « constructeur » n&#39;est jamais appelé.<\/p>\n<\/aside><p>À la fin, tu sais écrire un ou plusieurs constructeurs, utiliser <code>this<\/code>, et protéger tes attributs avec des getters et des setters.<\/p>\n<h2>Idée 1 · Le constructeur : même nom que la classe, pas de type de retour<\/h2>\n<p><strong>Constructeur.<\/strong> Une méthode qui porte le <strong>même nom que sa classe<\/strong>, <strong>sans type de retour, même pas <code>void<\/code><\/strong>. Il <strong>crée les objets et initialise les attributs<\/strong>.<\/p>\n<pre class=\"\"><code>class Point {\n    private double x, y;\n\n    public Point(double x, double y) {\n        this.x = x;\n        this.y = y;\n        System.out.println(&quot;Je suis le constructeur avec parametres&quot;);\n    }\n\n    public void afficher() { System.out.println(&quot;[&quot; + this.x + &quot;, &quot; + this.y + &quot;]&quot;); }\n}\n\npublic class TestC {\n    public static void main(String[] args) {\n        Point a = new Point(3, 4);\n        a.afficher();\n    }\n}<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Je suis le constructeur avec parametres\n[3.0, 4.0]<\/code><\/pre><figure class=\"etapes\" data-i=\"0\"><figcaption>Ce que fait new Point(3, 4)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · 1. Allocation<\/div><p><code>new<\/code> réserve la mémoire pour un objet Point.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · 2. Appel du constructeur<\/div><p>Java cherche un constructeur qui accepte deux <code>double<\/code>, et l&#39;exécute avec x = 3 et y = 4.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · 3. Initialisation<\/div><p><code>this.x = x; this.y = y;<\/code> range 3 et 4 dans les attributs de l&#39;objet.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · 4. Référence<\/div><p><code>new<\/code> renvoie la référence de l&#39;objet, qui est rangée dans <code>a<\/code>.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><table>\n<thead>\n<tr>\n<th>Règle<\/th>\n<th>Détail<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Nom<\/td>\n<td>Le même que la classe<\/td>\n<\/tr>\n<tr>\n<td>Type de retour<\/td>\n<td>Aucun, même pas <code>void<\/code><\/td>\n<\/tr>\n<tr>\n<td>Rôle<\/td>\n<td>Créer l&#39;objet et initialiser ses attributs<\/td>\n<\/tr>\n<tr>\n<td>Surcharge<\/td>\n<td>Possible : dans la même classe, on peut définir <strong>plusieurs<\/strong> constructeurs<\/td>\n<\/tr>\n<tr>\n<td>Aucun constructeur écrit ?<\/td>\n<td>Le compilateur crée un <strong>constructeur par défaut<\/strong>, sans paramètres<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h2>Idée 2 · this : la référence sur l&#39;objet courant<\/h2>\n<p><strong><code>this<\/code><\/strong> est une <strong>référence sur l&#39;objet courant<\/strong> : celui sur lequel la méthode est en train de s&#39;exécuter.<\/p>\n<svg viewBox=\"0 0 360 100\" style=\"width:100%;max-width:460px;display:block;margin:10px auto\" role=\"img\" aria-label=\"this.x désigne l'attribut de l'objet, x seul désigne le paramètre\">\n<g font-family=\"monospace\" font-size=\"13\" fill=\"currentColor\">\n<text x=\"96\" y=\"50\">this.x  =  x ;<\/text>\n<\/g>\n<g font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\">\n<text x=\"110\" y=\"20\" fill=\"#D9824F\" font-weight=\"700\">l'attribut de l'objet<\/text>\n<text x=\"230\" y=\"86\">le paramètre reçu<\/text>\n<\/g>\n<path d=\"M118 26v10\" stroke=\"#D9824F\" stroke-width=\"2.5\"/><path d=\"M192 56v16\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<\/svg><p>Quand le paramètre porte <strong>le même nom<\/strong> que l&#39;attribut, <code>this<\/code> est indispensable pour les distinguer. Sans lui :<\/p>\n<pre class=\"\"><code>class Q {\n    private double x;\n    public void setX(double x) { x = x; }      // le paramètre s'affecte à lui-même !\n    public double getX() { return x; }\n}<\/code><\/pre><p>Après <code>q.setX(5)<\/code>, <code>q.getX()<\/code> renvoie :<\/p>\n<pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>0.0<\/code><\/pre><p>L&#39;attribut n&#39;a <strong>jamais été modifié<\/strong> : <code>x = x<\/code> recopie le paramètre dans lui-même. Aucune erreur, aucun avertissement, juste un résultat faux.<\/p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p><code>this.x<\/code> = l&#39;attribut de <strong>l&#39;objet courant<\/strong>. <code>x<\/code> seul = le <strong>paramètre<\/strong> (s&#39;il existe un paramètre de ce nom).<\/p>\n<\/aside><h2>Idée 3 · Plusieurs constructeurs, et le constructeur par défaut<\/h2>\n<p>Un constructeur <strong>peut être surchargé<\/strong> : même nom, paramètres différents.<\/p>\n<pre class=\"\"><code>class Point {\n    private double x, y;\n\n    public Point() {                     // sans paramètre\n        this(0, 0);                      // appelle l'autre constructeur\n        System.out.println(&quot;Constructeur sans parametre&quot;);\n    }\n\n    public Point(double x, double y) {   // avec paramètres\n        this.x = x;\n        this.y = y;\n        System.out.println(&quot;Je suis le constructeur avec parametres&quot;);\n    }\n\n    public void afficher() { System.out.println(&quot;[&quot; + this.x + &quot;, &quot; + this.y + &quot;]&quot;); }\n}<\/code><\/pre><p><code>Point o = new Point(); o.afficher();<\/code> affiche :<\/p>\n<pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Je suis le constructeur avec parametres\nConstructeur sans parametre\n[0.0, 0.0]<\/code><\/pre><p>Java choisit le constructeur d&#39;après les arguments du <code>new<\/code>.<\/p>\n<figure class=\"grille\"><figcaption>Quel constructeur est appelé ?<\/figcaption><table><tr><th>Instruction<\/th><th>Constructeur<\/th><\/tr><tr><td>new Point()<\/td><td class=\"h1\">Point()<\/td><\/tr><tr><td>new Point(3, 4)<\/td><td class=\"h2\">Point(double, double)<\/td><\/tr><\/table><\/figure><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Le constructeur par défaut n&#39;existe <strong>que si tu n&#39;as écrit aucun constructeur<\/strong>. Dès que tu écris <code>Point(double x, double y)<\/code>, l&#39;instruction <code>new Point()<\/code> ne compile plus (« constructor Point cannot be applied to given types »), sauf si tu écris aussi un constructeur sans paramètre. Testé.<\/p>\n<\/aside><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p><code>this(0, 0)<\/code> (un constructeur qui en appelle un autre) est un ajout de ToumaiLearn : les notes disent seulement que le constructeur peut être surchargé.<\/p>\n<\/aside><h2>Idée 4 · Getters et setters : la porte d&#39;entrée des attributs privés<\/h2>\n<p>Les attributs sont <code>private<\/code>. Pour les lire et les modifier de l&#39;extérieur, on passe par des méthodes publiques :<\/p>\n<table>\n<thead>\n<tr>\n<th>Méthode<\/th>\n<th>Nom<\/th>\n<th>Rôle<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>Getter<\/strong><\/td>\n<td><code>getReel()<\/code><\/td>\n<td><strong>Renvoie<\/strong> la valeur de l&#39;attribut<\/td>\n<\/tr>\n<tr>\n<td><strong>Setter<\/strong><\/td>\n<td><code>setReel(double reel)<\/code><\/td>\n<td><strong>Modifie<\/strong> la valeur de l&#39;attribut<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Extrait de la classe <code>Complexe<\/code> du TD 3 :<\/p>\n<pre class=\"\"><code>public class Complexe {\n    private double Img, Reel;\n\n    public double getReel() { return Reel; }\n    public double getImg()  { return Img; }\n\n    public void setReel(double reel) { this.Reel = reel; }\n    public void setImg(double img)   { this.Img = img; }\n}<\/code><\/pre><p>L&#39;intérêt : le setter peut <strong>contrôler<\/strong> la valeur avant de l&#39;accepter.<\/p>\n<pre class=\"\"><code>class Compte {\n    private double solde;\n    public double getSolde() { return solde; }\n    public void setSolde(double s) {\n        if (s &gt;= 0) this.solde = s;\n        else System.out.println(&quot;Solde refuse : &quot; + s);\n    }\n}<\/code><\/pre><p><code>c.setSolde(1500); c.setSolde(-200); System.out.println(c.getSolde());<\/code> affiche :<\/p>\n<pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Solde refuse : -200.0\n1500.0<\/code><\/pre><p>Le solde négatif est refusé : l&#39;objet reste dans un état correct. Avec un attribut <code>public<\/code>, rien n&#39;aurait empêché <code>c.solde = -200<\/code>.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>La classe <code>Compte<\/code> est un exemple ajouté par ToumaiLearn pour montrer l&#39;intérêt d&#39;un setter. Les getters et setters de <code>Complexe<\/code> viennent du corrigé du TD 3.<\/p>\n<\/aside><aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>Dans le TD 3, la classe <code>Complexe<\/code> n&#39;a <strong>pas de constructeur<\/strong> : on crée l&#39;objet avec <code>new Complexe()<\/code> (constructeur par défaut), puis on le remplit avec les setters. La classe <code>Rationnel<\/code>, elle, a un constructeur à deux paramètres. Les deux styles sont à connaître.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Constructeurs et this<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Donne les deux particularités d&#39;écriture d&#39;un constructeur.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Il porte le même nom que sa classe, et il n&#39;a pas de type de retour (même pas <code>void<\/code>).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Une classe ne contient aucun constructeur. Peut-on écrire <code>new MaClasse()<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Oui. Le compilateur crée un constructeur par défaut, sans paramètres.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Une classe <code>Rationnel<\/code> a un seul constructeur : <code>Rationnel(int x, int y)<\/code>. L&#39;instruction <code>new Rationnel()<\/code> compile-t-elle ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Non. Comme un constructeur a été écrit, le constructeur par défaut n&#39;est plus créé. Il faut passer deux entiers, ou ajouter un constructeur sans paramètre.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Écris un constructeur pour la classe <code>Complexe<\/code> (attributs <code>Reel<\/code> et <code>Img<\/code>) qui reçoit la partie réelle et la partie imaginaire.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><code>public Complexe(double reel, double img) { this.Reel = reel; this.Img = img; }<\/code><\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>Qu&#39;est-ce que <code>this<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Une référence sur l&#39;objet courant.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste
