ptible</b>. Équivalent d’une instruction : affectation, accès à un attribut, création d’objet ou de lien, calcul simple, émission ou réception d’un signal. <span class=\"src\">diapo 165</span></td></tr>\n    <tr><td><b>Transition</b></td><td>Flèche pleine entre deux activités. Déclenchée dès que l’activité source est terminée ; franchie de manière atomique, sans durée. <span class=\"src\">diapo 162</span></td></tr>\n  </tbody></table></div>\n  <p>Trois familles de nœuds d’activité <span class=\"src\">diapo 161</span> : les nœuds d’<b>exécution</b> (actions), les nœuds <b>objets</b> (un objet qui circule, par exemple <code>Facture [émise]</code>), les nœuds de <b>contrôle</b>.</p>\n  </div>\n  <figure class=\"dgw\" data-d=\"a_nodes\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"9 -6 737 100\" width=\"737\" data-w=\"737\" style=\"max-width: 100%; height: auto;\"><g><g></g><g></g><g><circle cx=\"40\" cy=\"30\" r=\"9\" class=\"dg-fill\"></circle><text x=\"40\" y=\"64\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">initial</text><circle cx=\"130\" cy=\"30\" r=\"11\" class=\"dg-box\"></circle><circle cx=\"130\" cy=\"30\" r=\"6.5\" class=\"dg-fill\"></circle><text x=\"130\" y=\"64\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">fin d’activité</text><circle cx=\"230\" cy=\"30\" r=\"10\" class=\"dg-box\"></circle><path d=\"M222.93 22.93 L237.07 37.07 M237.07 22.93 L222.93 37.07\" class=\"dg-l\"></path><text x=\"230\" y=\"64\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">fin de flot</text><polygon points=\"330,15 345,30 330,45 315,30\" class=\"dg-box\"></polygon><text x=\"330\" y=\"64\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">décision / fusion</text><rect x=\"405\" y=\"27\" width=\"90\" height=\"6\" class=\"dg-fill\"></rect><text x=\"450\" y=\"64\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">fork / join</text><rect x=\"556.5\" y=\"13.5\" width=\"67\" height=\"33\" rx=\"14\" class=\"dg-box\"></rect><text x=\"590\" y=\"30\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">Action</text><text x=\"590\" y=\"64\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">action</text><rect x=\"667.5\" y=\"8\" width=\"65\" height=\"44\" class=\"dg-box\"></rect><text x=\"700\" y=\"22.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">Facture</text><text x=\"700\" y=\"37.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">[émise]</text><text x=\"700\" y=\"72\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">nœud objet</text></g></g></svg></div><figcaption>Les symboles à connaître.</figcaption></figure>\n  <div class=\"prose\">\n  <h2>4. Les nœuds de contrôle <span class=\"src\">diapos 170–174</span></h2>\n  <div class=\"tw\"><table>\n    <tbody><tr><th>Nœud</th><th>Symbole</th><th>Règle</th></tr>\n    <tr><td>Initial</td><td>disque plein</td><td>un arc sortant, aucun entrant. Une activité peut en avoir plusieurs.</td></tr>\n    <tr><td>Fin d’activité</td><td>disque plein cerclé</td><td>un ou plusieurs arcs entrants, aucun sortant. <b>Arrête toute l’activité.</b></td></tr>\n    <tr><td>Fin de flot</td><td>cercle barré d’une croix</td><td>termine <b>ce flot seulement</b>, sans effet sur les autres flots actifs.</td></tr>\n    <tr><td>Décision</td><td>losange, 1 entrée, n sorties</td><td>choix entre plusieurs flots selon des <b>gardes</b> entre crochets.</td></tr>\n    <tr><td>Fusion (merge)</td><td>losange, n entrées, 1 sortie</td><td>rassemble des flots <b>alternatifs</b> ; n’attend pas, accepte un flot parmi plusieurs.</td></tr>\n    <tr><td>Bifurcation (fork)</td><td>barre épaisse, 1 entrée, n sorties</td><td>sépare un flot en flots <b>concurrents</b>.</td></tr>\n    <tr><td>Union (join)</td><td>barre épaisse, n entrées, 1 sortie</td><td><b>synchronise</b> : attend que tous les flots entrants soient arrivés.</td></tr>\n  </tbody></table></div>\n  <div class=\"box retenir\"><span class=\"tag\">Gardes</span>\n    <p>Les conditions s’écrivent entre crochets sur les transitions qui sortent d’une décision. La clause <code>[else]</code> est vraie si et seulement si toutes les autres gardes sont fausses. Les gardes doivent couvrir tous les cas et ne pas se chevaucher. <span class=\"src\">diapo 163</span></p>\n  </div>\n  </div>\n  <figure class=\"dgw\" data-d=\"a_cond\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"-16 -3 462 433\" width=\"462\" data-w=\"462\" style=\"max-width: 100%; height: auto;\"><g><g></g><g><polyline points=\"200,29 200,58.5\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"206,47.5 200,58.5 194,47.5\" class=\"dg-l\"></polyline><polyline points=\"200,91.5 200,125\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"206,114 200,125 194,114\" class=\"dg-l\"></polyline><polyline points=\"185,140 60,140 60,193.5\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"66,182.5 60,193.5 54,182.5\" class=\"dg-l\"></polyline><text x=\"110\" y=\"132\" text-anchor=\"middle\" class=\"dg-t dg-halo \" font-size=\"12\"><tspan x=\"110\" dy=\"4\">[disponible]</tspan></text><polyline points=\"215,140 340,140 340,193.5\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"346,182.5 340,193.5 334,182.5\" class=\"dg-l\"></polyline><text x=\"300\" y=\"132\" text-anchor=\"middle\" class=\"dg-t dg-halo \" font-size=\"12\"><tspan x=\"300\" dy=\"4\">[else]</tspan></text><polyline points=\"60,226.5 60,280 185,280\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"174,274 185,280 174,286\" class=\"dg-l\"></polyline><polyline points=\"340,226.5 340,280 215,280\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"226,286 215,280 226,274\" class=\"dg-l\"></polyline><polyline points=\"200,295 200,328.5\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"206,317.5 200,328.5 194,317.5\" class=\"dg-l\"></polyline><polyline points=\"200,361.5 200,394\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"206,383 200,394 194,383\" class=\"dg-l\"></polyline></g><g><circle cx=\"200\" cy=\"20\" r=\"9\" class=\"dg-fill\"></circle><rect x=\"140.5\" y=\"58.5\" width=\"119\" height=\"33\" rx=\"14\" class=\"dg-box\"></rect><text x=\"200\" y=\"75\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">Vérifier le stock</text><polygon points=\"200,125 215,140 200,155 185,140\" class=\"dg-box\"></polygon><rect x=\"-1.5\" y=\"193.5\" width=\"123\" height=\"33\" rx=\"14\" class=\"dg-box\"></rect><text x=\"60\" y=\"210\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">Préparer le colis</text><rect x=\"247.5\" y=\"193.5\" width=\"185\" height=\"33\" rx=\"14\" class=\"dg-box\"></rect><text x=\"340\" y=\"210\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">Commander au fournisseur</text><polygon points=\"200,265 215,280 200,295 185,280\" class=\"dg-box\"></polygon><rect x=\"160.5\" y=\"328.5\" width=\"79\" height=\"33\" rx=\"14\" class=\"dg-box\"></rect><text x=\"200\" y=\"345\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">Expédier</text><circle cx=\"200\" cy=\"405\" r=\"11\" class=\"dg-box\"></circle><circle cx=\"200\" cy=\"405\" r=\"6.5\" class=\"dg-fill\"></circle><text x=\"250\" y=\"168\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t dg-cons\" font-size=\"12.5\" font-weight=\"400\" font-style=\"italic\">décision</text><text x=\"245\" y=\"306\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t dg-cons\" font-size=\"12.5\" font-weight=\"400\" font-style=\"italic\">fusion</text></g></g></svg></div><figcaption>Décision puis fusion : un seul des deux chemins est pris, la fusion ne fait que les rejoindre.</figcaption></figure>\n  <div class=\"box piege\"><span class=\"tag\">Le piège n°1 du chapitre : fusion ou union ?</span>\n    <p>Après une <b>décision</b> (losange), on referme avec une <b>fusion</b> (losange) : un seul chemin arrive. Après une <b>bifurcation</b> (barre), on referme avec une <b>union</b> (barre) : tous les chemins doivent arriver. Refermer un losange par une barre bloque le processus pour toujours, puisque le second flot n’arrivera jamais.</p>\n  </div>\n\n  <div class=\"prose\">\n  <h2>5. Les types d’actions <span class=\"src\">diapos 166–169</span></h2>\n  <div class=\"tw\"><table>\n    <tbody><tr><th>Action</th><th>Rôle</th></tr>\n    <tr><td>call operation</td><td>invoque une opération sur un objet (synchrone ou asynchrone)</td></tr>\n    <tr><td>call behavior</td><td>variante qui invoque directement une activité</td></tr>\n    <tr><td>send</td><td>crée un message et le transmet à un objet cible ; <b>asynchrone</b>, ne bloque pas l’appelant</td></tr>\n    <tr><td>accept event</td><td>bloque l’exécution jusqu’à réception d’un événement ; pour les signaux asynchrones</td></tr>\n    <tr><td>accept call</td><td>variante d’accept event pour les appels synchrones</td></tr>\n    <tr><td>reply</td><td>transmet une réponse à un accept call</td></tr>\n    <tr><td>create / destroy</td><td>instancie ou détruit un objet</td></tr>\n    <tr><td>raise exception</td><td>lève explicitement une exception</td></tr>\n  </tbody></table></div>\n  <p>Les actions de communication gèrent le passage et le retour de paramètres et les appels synchrones ou asynchrones (exemple du cours : « appui bouton lumière » en accept event, « éclairer affichage » en send signal, « attendre 2 secondes » en accept time event, « éteindre affichage »).</p>\n  <p>Cas particulier : si une action correspond à un <b>cas d’utilisation interne</b> (relié par include ou extend), on la dessine avec un petit symbole de <b>deux cercles reliés par un trait</b> dans le coin. <span class=\"src\">diapo 169</span></p>\n\n  <h2>6. Les partitions (couloirs, swimlanes) <span class=\"src\">diapos 175–178</span></h2>\n  <p>Quand plusieurs acteurs ou classes participent, on découpe le diagramme en <b>couloirs</b> : chaque action est placée dans le couloir de celui qui la réalise. Une partition peut être découpée en sous-partitions.</p>\n  <ul>\n    <li><b>Partitions explicites</b> : on écrit le responsable dans l’action, entre parenthèses (« (Client) Régler facture »). Moins encombrant, mais montre moins bien les groupes.</li>\n    <li><b>Partitions multidimensionnelles</b> : couloirs croisés, par exemple par service et par lieu (Rabat, Béni Mellal).</li>\n  </ul>\n  </div>\n  <figure class=\"dgw\" data-d=\"a_simple\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"-14 -14 688 628\" width=\"688\" data-w=\"688\" style=\"max-width: 100%; height: auto;\"><g><g><rect x=\"0\" y=\"0\" width=\"220\" height=\"600\" class=\"dg-lane\"></rect><line x1=\"0\" y1=\"30\" x2=\"220\" y2=\"30\" class=\"dg-l\"></line><text x=\"110\" y=\"15\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13\" font-weight=\"700\">Client</text><rect x=\"220\" y=\"0\" width=\"220\" height=\"600\" class=\"dg-lane\"></rect><line x1=\"220\" y1=\"30\" x2=\"440\" y2=\"30\" class=\"dg-l\"></line><text x=\"330\" y=\"15\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13\" font-weight=\"700\">Commercial</text><rect x=\"440\" y=\"0\" width=\"220\" height=\"600\" class=\"dg-lane\"></rect><line x1=\"440\" y1=\"30\" x2=\"660\" y2=\"30\" class=\"dg-l\"></line><text x=\"550\" y=\"15\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13\" font-weight=\"700\">Magasinier</text></g><g><polyline points=\"110,69 110,98.5\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"116,87.5 110,98.5 104,87.5\" class=\"dg-l\"></polyline><polyline points=\"110,131.5 110,172\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"116,161 110,172 104,161\" class=\"dg-l\"></polyline><polyline points=\"110,178 110,223.5\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"116,212.5 110,223.5 104,212.5\" class=\"dg-l\"></polyline><polyline points=\"330,178 330,223.5\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"336,212.5 330,223.5 324,212.5\" class=\"dg-l\"></polyline><polyline points=\"330,256.5 330,300 476.5,300\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"465.5,294 476.5,300 465.5,306\" class=\"dg-l\"></polyline><polyline points=\"110,256.5 110,362\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"116,351 110,362 104,351\" class=\"dg-l\"></polyline><polyline points=\"550,316.5 550,362\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"556,351 550,362 544,351\" class=\"dg-l\"></polyline><polyline points=\"550,368 550,408.5\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"556,397.5 550,408.5 544,397.5\" class=\"dg-l\"></polyline><polyline points=\"550,441.5 550,490 188,490\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"199,496 188,490 199,484\" class=\"dg-l\"></polyline><polyline points=\"110,506.5 110,544\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"116,533 110,544 104,533\" class=\"dg-l\"></polyline></g><g><circle cx=\"110\" cy=\"60\" r=\"9\" class=\"dg-fill\"></circle><rect x=\"42\" y=\"98.5\" width=\"136\" height=\"33\" rx=\"14\" class=\"dg-box\"></rect><text x=\"110\" y=\"115\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">Passer commande</text><rect x=\"70\" y=\"172\" width=\"300\" height=\"6\" class=\"dg-fill\"></rect><rect x=\"79\" y=\"223.5\" width=\"62\" height=\"33\" rx=\"14\" class=\"dg-box\"></rect><text x=\"110\" y=\"240\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">Payer</text><rect x=\"250.5\" y=\"223.5\" width=\"159\" height=\"33\" rx=\"14\" class=\"dg-box\"></rect><text x=\"330\" y=\"240\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">Enregistrer commande</text><rect x=\"476.5\" y=\"283.5\" width=\"147\" height=\"33\" rx=\"14\" class=\"dg-box\"></rect><text x=\"550\" y=\"300\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">Exécuter commande</text><rect x=\"90\" y=\"362\" width=\"480\" height=\"6\" class=\"dg-fill\"></rect><rect x=\"485\" y=\"408.5\" width=\"130\" height=\"33\" rx=\"14\" class=\"dg-box\"></rect><text x=\"550\" y=\"425\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">Livrer commande</text><rect x=\"32\" y=\"473.5\" width=\"156\" height=\"33\" rx=\"14\" class=\"dg-box\"></rect><text x=\"110\" y=\"490\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">Récupérer commande</text><circle cx=\"110\" cy=\"555\" r=\"11\" class=\"dg-box\"></circle><circle cx=\"110\" cy=\"555\" r=\"6.5\" class=\"dg-fill\"></circle></g></g></svg></div><figcaption>Exemple du cours (diapo 158) : après la commande, le paiement et l’enregistrement se font en parallèle ; la livraison attend les deux.</figcaption></figure>\n  <div class=\"prose\">\n  <h2>7. Méthode</h2>\n  <ol>\n    <li>Repère les responsables : un couloir par acteur ou service.</li>\n    <li>Liste les actions (verbes à l’infinitif) dans l’ordre du texte, chacune dans son couloir.</li>\n    <li>Repère les mots « si », « sinon », « en cas de » : décision avec gardes, puis fusion.</li>\n    <li>Repère « en même temps », « simultanément », « en parallèle » : fork, puis join.</li>\n    <li>Repère les retours en arrière (« peut alors saisir un montant inférieur ») : boucle vers une fusion placée avant l’action à répéter.</li>\n    <li>Un seul nœud initial ; un nœud final à chaque fin possible.</li>\n  </ol>\n  <div class=\"box piege\"><span class=\"tag\">Pièges</span>\n    <ul>\n      <li>Fusion et union confondues (voir plus haut).</li>\n      <li>Deux flèches qui entrent directement dans une action : en UML 2 c’est une union implicite (l’action attend les deux). Passe par une fusion si un seul flot doit arriver.</li>\n      <li>Gardes non exhaustives : la correction du GAB dans les diapos utilise <code>[montant &gt; solde]</code> et <code>[montant &lt; solde]</code>, ce qui oublie <code>montant = solde</code>. Écris <code>[montant ≤ solde]</code>.</li>\n      <li>Fork sans join correspondant.</li>\n      <li>Action dans le mauvais couloir (le client n’« encaisse » pas, le caissier si).</li>\n      <li>Fin d’activité au lieu d’une fin de flot dans une branche parallèle : tu arrêtes tout le processus.</li>\n    </ul>\n  </div>\n  <p>L’exercice d’application du cours (GAB, diapos 179–180) est corrigé dans <a href=\"#exos\">Exercices du cours</a>.</p>\n  </div>\n  <h2>Quiz du chapitre 7</h2>\n  \n  <div class=\"row\"><a class=\"btn ghost\" href=\"#exos\">Faire le GAB</a></div><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 6 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Un losange qui reçoit plusieurs flots alternatifs et n’en laisse sortir qu’un est un nœud…</div><button class=\"opt\" data-o=\"0\">de décision</button><button class=\"opt\" data-o=\"1\">de fusion</button><button class=\"opt\" data-o=\"2\">d’union</button><button class=\"opt\" data-o=\"3\">de bifurcation</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Une barre épaisse avec plusieurs entrées et une sortie…</div><button class=\"opt\" data-o=\"0\">bifurcation (fork)</button><button class=\"opt\" data-o=\"1\">union (join) : attend tous les flots</button><button class=\"opt\" data-o=\"2\">fusion</button><button class=\"opt\" data-o=\"3\">décision</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Après un nœud de décision, on referme les branches avec…</div><button class=\"opt\" data-o=\"0\">un join</button><button class=\"opt\" data-o=\"1\">une fusion</button><button class=\"opt\" data-o=\"2\">un fork</button><button class=\"opt\" data-o=\"3\">un nœud final</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Le nœud de fin de flot (cercle barré)…</div><button class=\"opt\" data-o=\"0\">arrête toute l’activité</button><button class=\"opt\" data-o=\"1\">termine seulement le flot qui l’atteint</button><button class=\"opt\" data-o=\"2\">démarre un flot</button><button class=\"opt\" data-o=\"3\">synchronise</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">La clause [else] est vraie quand…</div><button class=\"opt\" data-o=\"0\">toujours</button><button class=\"opt\" data-o=\"1\">toutes les autres gardes de la même décision sont fausses</button><button class=\"opt\" data-o=\"2\">la première garde est vraie</button><button class=\"opt\" data-o=\"3\">il n’y a pas de décision</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">L’action, en UML, est…</div><button class=\"opt\" data-o=\"0\">un processus métier complet</button><button class=\"opt\" data-o=\"1\">le plus petit traitement, atomique et non interruptible</button><button class=\"opt\" data-o=\"2\">un acteur</button><button class=\"opt\" data-o=\"3\">une transition</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Quelle action envoie un message de façon asynchrone ?</div><button class=\"opt\" data-o=\"0\">call operation</button><button class=\"opt\" data-o=\"1\">send</button><button class=\"opt\" data-o=\"2\">accept call</button><button class=\"opt\" data-o=\"3\">reply</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Qu’est-ce qui manque dans ce diagramme ?</div><button class=\"opt\" data-o=\"0\">Un nœud de décision</button><button class=\"opt\" data-o=\"1\">Un join avant « Clôturer »</button><button class=\"opt\" data-o=\"2\">Un deuxième nœud initial</button><button class=\"opt\" data-o=\"3\">Rien</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Les couloirs (swimlanes) servent à…</div><button class=\"opt\" data-o=\"0\">montrer qui réalise chaque action</button><button class=\"opt\" data-o=\"1\">numéroter les actions</button><button class=\"opt\" data-o=\"2\">représenter les classes</button><button class=\"opt\" data-o=\"3\">remplacer les gardes</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Le diagramme d’activités est une variante du diagramme…</div><button class=\"opt\" data-o=\"0\">de classes</button><button class=\"opt\" data-o=\"1\">de séquence</button><button class=\"opt\" data-o=\"2\">d’états-transitions</button><button class=\"opt\" data-o=\"3\">de déploiement</button><div class=\"qq-e\" hidden></div></div></section>","ex":[],"qcm":[{"n":"ch7","q":"Un losange qui reçoit plusieurs flots alternatifs et n’en laisse sortir qu’un est un nœud…","o":["de décision","de fusion","d’union","de bifurcation"],"a":1,"e":"Merge : n entrées, 1 sortie, sans attente."},{"n":"ch7","q":"Une barre épaisse avec plusieurs entrées et une sortie…","o":["bifurcation (fork)","union (join) : attend tous les flots","fusion","décision"],"a":1,"e":"Le join synchronise."},{"n":"ch7","q":"Après un nœud de décision, on referme les branches avec…","o":["un join","une fusion","un fork","un nœud final"],"a":1,"e":"Décision ↔ fusion ; fork ↔ join."},{"n":"ch7","q":"Le nœud de fin de flot (cercle barré)…","o":["arrête toute l’activité","termine seulement le flot qui l’atteint","démarre un flot","synchronise"],"a":1,"e":"Diapo 171."},{"n":"ch7","q":"La clause [else] est vraie quand…","o":["toujours","toutes les autres gardes de la même décision sont fausses","la première garde est vraie","il n’y a pas de décision"],"a":1,"e":"Diapo 163."},{"n":"ch7","q":"L’action, en UML, est…","o":["un processus métier complet","le plus petit traitement, atomique et non interruptible","un acteur","une transition"],"a":1,"e":"Équivalent d’une instruction élémentaire (diapo 165)."},{"n":"ch7","q":"Quelle action envoie un message de façon asynchrone ?","o":["call operation","send","accept call","reply"],"a":1,"e":"send ne bloque pas l’appelant (diapo 166)."},{"n":"ch7","q":"Qu’est-ce qui manque dans ce diagramme ?","o":["Un nœud de décision","Un join avant « Clôturer »","Un deuxième nœud initial","Rien"],"a":1,"e":"Les flots du fork doivent être synchronisés par un join avant de continuer."},{"n":"ch7","q":"Les couloirs (swimlanes) servent à…","o":["montrer qui réalise chaque action","numéroter les actions","représenter les classes","remplacer les gardes"],"a":0,"e":"Partitions : chaque action dans le couloir de son responsable."},{"n":"ch7","q":"Le diagramme d’activités est une variante du diagramme…","o":["de classes","de séquence","d’états-transitions","de déploiement"],"a":2,"e":"Diapo 155."}]},{"id":"exos","t":"Exercices du cours","seance":"Exercices et TD","imp":3,"html":"<p class=\"lede\">Les deux exercices d’application que le prof a mis dans ses diapos. Ce sont les modèles les plus proches de ce qu’il attend : sa propre correction est reprise, puis améliorée quand elle a une faiblesse.</p>\n\n  <h2>Exercice 1 · La figure géométrique <span class=\"src\">diapos 88–89</span></h2>\n  <div class=\"enonce\">\n    <p>Une figure contient : un triangle T1 qui contient un carré C1 (contenant un cercle plein R3), un cercle R1, et un triangle plein T2 (contenant un carré C2 et un cercle R2).</p>\n    <ol><li>Représenter le diagramme de classes correspondant.</li><li>Représenter le diagramme d’objets correspondant.</li></ol>\n  </div>\n  <details class=\"corr\"><summary>Voir la correction <span class=\"hint\">essaie d’abord 15 minutes</span></summary><div class=\"in\">\n    <h3>Raisonnement</h3>\n    <ol class=\"steps\">\n      <li>Toutes les formes partagent une propriété : elles sont pleines ou vides. On crée une classe générale <b>Figure</b> avec <code>pleine : boolean = false</code>.</li>\n      <li>Cercle et Polygone sont des sortes de figures ; Triangle et Carré des sortes de polygones : <b>héritage</b> sur deux niveaux.</li>\n      <li>Une figure peut en contenir d’autres, et une figure contenue disparaît avec son contenant : <b>composition réflexive</b> sur Figure (0..1 contenant, * contenues).</li>\n    </ol>\n    <figure class=\"dgw\" data-d=\"o_fig_dcl\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"91 -44 498 383\" width=\"498\" data-w=\"498\" style=\"max-width: 100%; height: auto;\"><g><g></g><g><polyline points=\"377,45 440,45 440,-30 300,-30 300,23\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"377,45 387,51 397,45 387,39\" class=\"dg-fill\"></polygon><polyline points=\"306,12 300,23 294,12\" class=\"dg-l\"></polyline><text x=\"403\" y=\"64\" text-anchor=\"start\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"403\" dy=\"4\">0..1</tspan></text><text x=\"293\" y=\"12\" text-anchor=\"end\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"293\" dy=\"4\">*</tspan></text><text x=\"307\" y=\"12\" text-anchor=\"start\" class=\"dg-t dg-halo \" font-size=\"11\" font-style=\"italic\"><tspan x=\"307\" dy=\"4\">contient</tspan></text><polyline points=\"140,175.5 140,125 300,125\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"460,175.5 460,125 300,125\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"300,125 300,77\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"291,92 300,77 309,92\" class=\"dg-hollow\"></polygon><polyline points=\"380,295.5 380,255 460,255\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"540,295.5 540,255 460,255\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"460,255 460,204.5\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"451,219.5 460,204.5 469,219.5\" class=\"dg-hollow\"></polygon></g><g><rect x=\"223\" y=\"23\" width=\"154\" height=\"54\" class=\"dg-box\"></rect><text x=\"300\" y=\"39\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\" font-style=\"italic\">Figure</text><line x1=\"223\" y1=\"52\" x2=\"377\" y2=\"52\" class=\"dg-l\"></line><text x=\"232\" y=\"65.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">pleine : boolean = false</text><rect x=\"105\" y=\"175.5\" width=\"70\" height=\"29\" class=\"dg-box\"></rect><text x=\"140\" y=\"191.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Cercle</text><rect x=\"418\" y=\"175.5\" width=\"84\" height=\"29\" class=\"dg-box\"></rect><text x=\"460\" y=\"191.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\" font-style=\"italic\">Polygone</text><rect x=\"341.5\" y=\"295.5\" width=\"77\" height=\"29\" class=\"dg-box\"></rect><text x=\"380\" y=\"311.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Triangle</text><rect x=\"505\" y=\"295.5\" width=\"70\" height=\"29\" class=\"dg-box\"></rect><text x=\"540\" y=\"311.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Carré</text></g></g></svg></div><figcaption>Diagramme de classes (correction du prof, avec les multiplicités ajoutées). Figure et Polygone sont abstraites : on ne dessine jamais une « figure » qui ne serait ni cercle ni polygone.</figcaption></figure>\n    <figure class=\"dgw\" data-d=\"o_fig_do\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"59 11 631 320\" width=\"631\" data-w=\"631\" style=\"max-width: 100%; height: auto;\"><g><g></g><g><polyline points=\"304.625,54.5 145.375,145.5\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"304.625,54.5 292.9657349486144,54.25193053082158 287.2601371575108,64.42277876713668 298.91940220889643,64.6708482363151\" class=\"dg-fill\"></polygon><polyline points=\"157.90250819351007,145.2519305308216 145.375,145.5 151.94884093322804,134.83301282532807\" class=\"dg-l\"></polyline><polyline points=\"330,54.5 330,145.5\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"330,54.5 324,64.5 330,74.5 336,64.5\" class=\"dg-fill\"></polygon><polyline points=\"336,134.5 330,145.5 324,134.5\" class=\"dg-l\"></polyline><polyline points=\"355.375,54.5 492.75,133\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"355.375,54.5 361.08059779110357,64.6708482363151 372.7398628424892,64.42277876713668 367.0342650513856,54.25193053082158\" class=\"dg-fill\"></polygon><polyline points=\"486.17615906677196,122.33301282532808 492.75,133 480.2224918064899,132.7519305308216\" class=\"dg-l\"></polyline><polyline points=\"120,174.5 120,263\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"120,174.5 114,184.5 120,194.5 126,184.5\" class=\"dg-fill\"></polygon><polyline points=\"126,252 120,263 114,252\" class=\"dg-l\"></polyline><polyline points=\"522.6428571428571,187 459.32142857142856,285.5\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"522.6428571428571,187 512.1882103774627,192.16723920588456 511.8277053165871,203.82356950753106 522.2823520819815,198.65633030164653\" class=\"dg-fill\"></polygon><polyline points=\"470.31683292813636,279.4915823187389 459.32142857142856,285.5 460.22269122361774,273.0024912229769\" class=\"dg-l\"></polyline><polyline points=\"557.3571428571429,187 620.6785714285714,285.5\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"557.3571428571429,187 557.7176479180185,198.65633030164653 568.1722946834128,203.82356950753106 567.8117896225373,192.16723920588456\" class=\"dg-fill\"></polygon><polyline points=\"619.7773087763824,273.0024912229769 620.6785714285714,285.5 609.6831670718636,279.4915823187389\" class=\"dg-l\"></polyline></g><g><rect x=\"278.5\" y=\"25.5\" width=\"103\" height=\"29\" class=\"dg-box\"></rect><text x=\"330\" y=\"41.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\" text-decoration=\"underline\">T1 : Triangle</text><rect x=\"77.5\" y=\"145.5\" width=\"85\" height=\"29\" class=\"dg-box\"></rect><text x=\"120\" y=\"161.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\" text-decoration=\"underline\">C1 : Carré</text><rect x=\"284.5\" y=\"145.5\" width=\"91\" height=\"29\" class=\"dg-box\"></rect><text x=\"330\" y=\"161.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\" text-decoration=\"underline\">R1 : Cercle</text><rect x=\"487.5\" y=\"133\" width=\"105\" height=\"54\" class=\"dg-box\"></rect><text x=\"540\" y=\"149\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\" text-decoration=\"underline\">T2 : Triangle</text><line x1=\"487.5\" y1=\"162\" x2=\"592.5\" y2=\"162\" class=\"dg-l\"></line><text x=\"496.5\" y=\"175.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">pleine = true</text><rect x=\"73.5\" y=\"263\" width=\"93\" height=\"54\" class=\"dg-box\"></rect><text x=\"120\" y=\"279\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\" text-decoration=\"underline\">R3 : Cercle</text><line x1=\"73.5\" y1=\"292\" x2=\"166.5\" y2=\"292\" class=\"dg-l\"></line><text x=\"82.5\" y=\"305.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">pleine = true</text><rect x=\"406.5\" y=\"285.5\" width=\"87\" height=\"29\" class=\"dg-box\"></rect><text x=\"450\" y=\"301.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\" text-decoration=\"underline\">C2 : Carré</text><rect x=\"583.5\" y=\"285.5\" width=\"93\" height=\"29\" class=\"dg-box\"></rect><text x=\"630\" y=\"301.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\" text-decoration=\"underline\">R2 : Cercle</text></g></g></svg></div><figcaption>Diagramme d’objets. Seules les figures pleines affichent <code>pleine = true</code> ; les autres gardent la valeur par défaut.</figcaption></figure>\n    <div class=\"box plus\"><span class=\"tag\">Ce qui fait la différence</span>\n      <p>Ajouter les multiplicités sur la composition réflexive (le prof les omet) et dire pourquoi c’est une composition : un objet contenu n’a qu’un contenant, et il disparaît s’il est effacé avec lui.</p>\n    </div>\n  </div></details>\n\n  <h2>Exercice 2 · Le guichet automatique (GAB) <span class=\"src\">diapos 179–180</span></h2>\n  <div class=\"enonce\">\n    <p>Le client introduit sa carte dont la validité est immédiatement vérifiée. Il est ensuite invité à saisir le code de la carte. Après trois tentatives infructueuses, la carte est avalée. Sinon, le client peut indiquer le montant qu’il désire retirer ; le solde de son compte est alors consulté pour s’assurer que le retrait est possible. En cas de solde insuffisant, le client en est informé et peut alors saisir un montant inférieur. Si le solde est suffisant, le distributeur restitue la carte et délivre alors les billets accompagnés d’un reçu.</p>\n    <p><b>Décrire le fonctionnement de ce GAB par un diagramme d’activités.</b></p>\n  </div>\n  <details class=\"corr\"><summary>Voir la correction <span class=\"hint\">essaie d’abord 20 minutes</span></summary><div class=\"in\">\n    <h3>Raisonnement</h3>\n    <ol class=\"steps\">\n      <li>Deux responsables : le <b>Client</b> et le <b>Distributeur</b>, donc deux couloirs.</li>\n      <li>« dont la validité est immédiatement vérifiée » : action puis décision <code>[valide]</code> / <code>[invalide]</code>.</li>\n      <li>« Après trois tentatives » : une boucle qui revient avant « Demander le code », avec un compteur. On place une <b>fusion</b> avant « Demander le code » pour accueillir le retour.</li>\n      <li>« peut alors saisir un montant inférieur » : deuxième boucle, retour vers une fusion avant « Demander le montant ».</li>\n      <li>« restitue la carte et délivre <b>alors</b> les billets accompagnés d’un reçu » : la carte d’abord, puis billets et reçu en parallèle (fork / join).</li>\n    </ol>\n    <figure class=\"dgw\" data-d=\"a_gab\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"-14 -14 878 1088\" width=\"878\" data-w=\"878\" style=\"max-width: 100%; height: auto;\"><g><g><rect x=\"0\" y=\"0\" width=\"260\" height=\"1060\" class=\"dg-lane\"></rect><line x1=\"0\" y1=\"30\" x2=\"260\" y2=\"30\" class=\"dg-l\"></line><text x=\"130\" y=\"15\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13\" font-weight=\"700\">Client</text><rect x=\"260\" y=\"0\" width=\"590\" height=\"1060\" class=\"dg-lane\"></rect><line x1=\"260\" y1=\"30\" x2=\"850\" y2=\"30\" class=\"dg-l\"></line><text x=\"555\" y=\"15\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13\" font-weight=\"700\">Distributeur</text></g><g><polyline points=\"130,64 130,93.5\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"136,82.5 130,93.5 124,82.5\" class=\"dg-l\"></polylin ints=\"420,225 435,240 420,255 405,240\" class=\"dg-box\"></polygon><rect x=\"352.5\" y=\"283.5\" width=\"135\" height=\"33\" rx=\"14\" class=\"dg-box\"></rect><text x=\"420\" y=\"300\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">Demander le code</text><rect x=\"75.5\" y=\"283.5\" width=\"109\" height=\"33\" rx=\"14\" class=\"dg-box\"></rect><text x=\"130\" y=\"300\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">Saisir le code</text><rect x=\"361.5\" y=\"353.5\" width=\"117\" height=\"33\" rx=\"14\" class=\"dg-box\"></rect><text x=\"420\" y=\"370\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">Vérifier le code</text><polygon points=\"420,425 435,440 420,455 405,440\" class=\"dg-box\"></polygon><rect x=\"557\" y=\"416\" width=\"106\" height=\"48\" rx=\"14\" class=\"dg-box\"></rect><text x=\"610\" y=\"432.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">Incrémenter</text><text x=\"610\" y=\"447.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">les tentatives</text><polygon points=\"610,355 625,370 610,385 595,370\" class=\"dg-box\"></polygon><polygon points=\"770,225 785,240 770,255 755,240\" class=\"dg-box\"></polygon><rect x=\"714\" y=\"288.5\" width=\"112\" height=\"33\" rx=\"14\" class=\"dg-box\"></rect><text x=\"770\" y=\"305\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">Avaler la carte</text><circle cx=\"770\" cy=\"370\" r=\"11\" class=\"dg-box\"></circle><circle cx=\"770\" cy=\"370\" r=\"6.5\" class=\"dg-fill\"></circle><polygon points=\"420,500 435,515 420,530 405,515\" class=\"dg-box\"></polygon><rect x=\"343\" y=\"558.5\" width=\"154\" height=\"33\" rx=\"14\" class=\"dg-box\"></rect><text x=\"420\" y=\"575\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">Demander le montant</text><rect x=\"66\" y=\"558.5\" width=\"128\" height=\"33\" rx=\"14\" class=\"dg-box\"></rect><text x=\"130\" y=\"575\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">Saisir le montant</text><rect x=\"354\" y=\"628.5\" width=\"132\" height=\"33\" rx=\"14\" class=\"dg-box\"></rect><text x=\"420\" y=\"645\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">Consulter le solde</text><polygon points=\"420,700 435,715 420,730 405,715\" class=\"dg-box\"></polygon><rect x=\"584.5\" y=\"691\" width=\"111\" height=\"48\" rx=\"14\" class=\"dg-box\"></rect><text x=\"640\" y=\"707.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">Signaler solde</text><text x=\"640\" y=\"722.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">insuffisant</text><rect x=\"361.5\" y=\"773.5\" width=\"117\" height=\"33\" rx=\"14\" class=\"dg-box\"></rect><text x=\"420\" y=\"790\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">Rendre la carte</text><rect x=\"350\" y=\"847\" width=\"340\" height=\"6\" class=\"dg-fill\"></rect><rect x=\"354\" y=\"898.5\" width=\"132\" height=\"33\" rx=\"14\" class=\"dg-box\"></rect><text x=\"420\" y=\"915\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">Délivrer les billets</text><rect x=\"567\" y=\"898.5\" width=\"126\" height=\"33\" rx=\"14\" class=\"dg-box\"></rect><text x=\"630\" y=\"915\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">Imprimer le reçu</text><rect x=\"350\" y=\"972\" width=\"340\" height=\"6\" class=\"dg-fill\"></rect><circle cx=\"520\" cy=\"1030\" r=\"11\" class=\"dg-box\"></circle><circle cx=\"520\" cy=\"1030\" r=\"6.5\" class=\"dg-fill\"></circle></g></g></svg></div><figcaption>Correction améliorée. Les deux chemins vers « Avaler la carte » passent par une fusion.</figcaption></figure>\n    <h3>Ce que cette correction corrige par rapport aux diapos</h3>\n    <ul>\n      <li>Les diapos utilisent <code>[montant &gt; solde]</code> et <code>[montant &lt; solde]</code> : le cas <code>montant = solde</code> n’est couvert par aucune garde. Ici : <code>[montant ≤ solde]</code>.</li>\n      <li>Dans les diapos, deux flèches entrent directement dans « Avaler carte » et dans « Demander code ». En UML 2, plusieurs flots qui entrent dans une action forment une union implicite : l’action attendrait les deux. On ajoute des <b>nœuds de fusion</b>.</li>\n      <li>Le compteur de tentatives est rendu visible par une action « Incrémenter les tentatives ».</li>\n      <li>Le texte dit « restitue la carte et délivre <b>alors</b> les billets » : la carte avant les billets. Les diapos mettent les trois en parallèle ; les deux versions sont défendables, l’essentiel est de justifier ton choix par le texte.</li>\n    </ul>\n  </div></details>","ex":[],"qcm":[]},{"id":"td1","t":"TD1 · statiques","seance":"Exercices et TD","imp":3,"html":"<p class=\"lede\">Trois exercices du plus guidé au plus ouvert. Fais-les sur papier, 20 à 25 minutes chacun, avant d’ouvrir la correction.</p>\n\n  <h2>Exercice 1 · La figure géométrique</h2>\n  <div class=\"enonce\">\n    <p>Un rectangle R1 contient un rectangle R2, un disque D1 (grisé) et un carré C1. Le carré C1 contient un triangle T1, un losange L1 et un disque D2 (grisé). Le triangle T1 contient un carré C2 et un losange L2.</p>\n    <ol>\n      <li>Donner le diagramme de classes correspondant (juste les noms des classes), sachant qu’à part les disques, un polygone peut être un carré, rectangle, triangle ou losange.</li>\n      <li>Proposer un diagramme d’objets associé.</li>\n    </ol>\n  </div>\n  <details class=\"corr\"><summary>Voir la correction <span class=\"hint\">20 min</span></summary><div class=\"in\">\n    <p>C’est la même structure que l’exercice des diapos 88–89, avec des formes différentes. Les disques grisés sont <b>pleins</b> : il faut l’attribut <code>pleine</code> pour pouvoir le montrer dans le diagramme d’objets, même si l’énoncé dit « juste les noms ».</p>\n    <figure class=\"dgw\" data-d=\"td1_e1_dcl\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"101 -49 633 408\" width=\"633\" data-w=\"633\" style=\"max-width: 100%; height: auto;\"><g><g></g><g><polyline points=\"407,45 480,45 480,-35 330,-35 330,23\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"407,45 417,51 427,45 417,39\" class=\"dg-fill\"></polygon><text x=\"433\" y=\"64\" text-anchor=\"start\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"433\" dy=\"4\">0..1</tspan></text><text x=\"433\" y=\"20\" text-anchor=\"start\" class=\"dg-t dg-halo \" font-size=\"11\" font-style=\"italic\"><tspan x=\"433\" dy=\"4\">contenant</tspan></text><text x=\"323\" y=\"12\" text-anchor=\"end\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"323\" dy=\"4\">*</tspan></text><text x=\"337\" y=\"12\" text-anchor=\"start\" class=\"dg-t dg-halo \" font-size=\"11\" font-style=\"italic\"><tspan x=\"337\" dy=\"4\">contenu</tspan></text><polyline points=\"150,180.5 150,125 330,125\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"500,180.5 500,125 330,125\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"330,125 330,77\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"321,92 330,77 339,92\" class=\"dg-hollow\"></polygon><polyline points=\"330,315.5 330,265 500,265\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"440,315.5 440,265 500,265\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"560,315.5 560,265 500,265\" class=\"dg-l dg-nofill\"></polyline><polyline "dg-t \" font-size=\"13.5\" font-weight=\"700\" text-decoration=\"underline\">C2 : Carré</text><rect x=\"487\" y=\"385.5\" width=\"106\" height=\"29\" class=\"dg-box\"></rect><text x=\"540\" y=\"401.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\" text-decoration=\"underline\">L2 : Losange</text></g></g></svg></div><figcaption>Diagramme d’objets fidèle à la figure. Les disques grisés ont <code>pleine = true</code>.</figcaption></figure>\n    <div class=\"box plus\"><span class=\"tag\">Pour aller plus loin (et impressionner)</span>\n      <p>Mathématiquement, un carré est à la fois un rectangle et un losange. On pourrait donc faire hériter Carré de Rectangle et de Losange (<b>héritage multiple</b>). L’énoncé les présente comme quatre sortes de polygones au même niveau : c’est la réponse attendue. Tu peux mentionner l’alternative en une phrase.</p>\n    </div>\n    <div class=\"box piege\"><span class=\"tag\">Erreurs fréquentes</span>\n      <ul><li>Créer une classe par objet (une classe R1, une classe R2…) : R1 et R2 sont deux <b>objets</b> de la classe Rectangle.</li><li>Dessiner l’héritage dans le diagramme d’objets.</li><li>Oublier que les liens de contenance viennent d’une association (ici la composition réflexive).</li></ul>\n    </div>\n  </div></details>\n\n  <h2>Exercice 2 · L’établissement universitaire</h2>\n  <div class=\"enonce\">\n    <p>Un établissement universitaire public est constitué par des salles de cours, bureaux, laboratoires et départements. Un département a un nom et possède plusieurs bureaux. Une personne travaillant dans cet établissement a un ID unique et peut être un professeur ou un employé. Un professeur est soit permanent soit vacataire. Un permanent appartient à un seul département mais peut être membre de plusieurs laboratoires. Tandis qu’un vacataire travaille pour plusieurs départements. Les professeurs et employés ont, chacun, un bureau. Les bureaux et salles de cours ont des ID et chaque salle possède des sièges et un vidéoprojecteur.</p>\n    <ul><li>Construire le diagramme de classes correspondant.</li><li>Proposer un diagramme d’objets issu du diagramme de classes.</li></ul>\n  </div>\n  <details class=\"corr\"><summary>Voir la correction <span class=\"hint\">25 min</span></summary><div class=\"in\">\n    <h3>Analyse phrase par phrase</h3>\n    <div class=\"tw\"><table>\n      <tbody><tr><th>Phrase</th><th>Décision de modélisation</th></tr>\n      <tr><td>« constitué par des salles, bureaux, laboratoires et départements »</td><td>Composition depuis Établissement : ces éléments n’existent pas sans lui.</td></tr>\n      <tr><td>« Les bureaux et salles de cours ont des ID »</td><td>Attribut commun : on factorise dans une classe abstraite <b>Local</b> (<code>id</code>) dont héritent Bureau et SalleDeCours. Une seule composition Établissement → Local suffit alors.</td></tr>\n      <tr><td>« Un département a un nom et possède plusieurs bureaux »</td><td>Attribut <code>nom</code> ; association « possède », <code>1..*</code> côté Bureau.</td></tr>\n      <tr><td>« une personne… a un ID unique et peut être un professeur ou un employé »</td><td>Classe abstraite Personne (<code>id {unique}</code>) ; héritage vers Professeur et Employé.</td></tr>\n      <tr><td>« Un professeur est soit permanent soit vacataire »</td><td>Professeur abstraite ; héritage vers Permanent et Vacataire.</td></tr>\n      <tr><td>« Un permanent appartient à un seul département »</td><td>Permanent <code>*</code> — <code>1</code> Département.</td></tr>\n      <tr><td>« peut être membre de plusieurs laboratoires »</td><td>Permanent <code>*</code> — <code>*</code> Laboratoire (« peut » : 0 accepté).</td></tr>\n      <tr><td>« un vacataire travaille pour plusieurs départements »</td><td>Vacataire <code>*</code> — <code>1..*</code> Département.</td></tr>\n      <tr><td>« Les professeurs et employés ont, chacun, un bureau »</td><td>L’association se met sur <b>Personne</b> (les deux sous-classes en héritent) : <code>*</code> — <code>1</code> Bureau.</td></tr>\n      <tr><td>« chaque salle possède des sièges et un vidéoprojecteur »</td><td>Composition SalleDeCours → Siège (<code>1..*</code>) ; agrégation vers Vidéoprojecteur (<code>1</code>), car il peut être déplacé.</td></tr>\n    </tbody></table></div>\n    <figure class=\"dgw\" data-d=\"td1_e2\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"-74 -1 1032 745\" width=\"1032\" data-w=\"1032\" style=\"max-width: 100%; height: auto;\"><g><g></g><g><polyline points=\"434,67 596,148\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"434,67 440.2609903369994,76.83869910099908 451.8885438199983,75.94427190999916 445.6275534829989,66.1055728090001\" class=\"dg-fill\"></polygon><text x=\"457.2551069659978\" y=\"71.6275534829989\" text-anchor=\"start\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"457.2551069659978\" dy=\"4\">1</tspan></text><text x=\"589.7390096630006\" y=\"137.8695048315003\" text-anchor=\"end\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"589.7390096630006\" dy=\"4\">1..*</tspan></text><polyline points=\"318,30 -10,30 -10,650 80.5,650\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"318,30 308,24 298,30 308,36\" class=\"dg-fill\"></polygon><text x=\"292\" y=\"49\" text-anchor=\"end\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"292\" dy=\"4\">1</tspan></text><text x=\"73.5\" y=\"643\" text-anchor=\"end\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"73.5\" dy=\"4\">*</tspan></text><polyline points=\"318,50 -60,50 -60,730 380,730 380,677\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"318,50 308,44 298,50 308,56\" class=\"dg-fill\"></polygon><text x=\"292\" y=\"43\" text-anchor=\"end\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"292\" dy=\"4\">1</tspan></text><text x=\"387\" y=\"696\" text-anchor=\"start\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\">< ></td></tr>\n      <tr><td>« plusieurs barrettes (RAM, ROM, cache) »</td><td>classe abstraite BarretteMémoire + héritage, <code>1..*</code></td></tr>\n      <tr><td>« des supports (disquette, disque dur…) » avec « … »</td><td>classe abstraite + héritage ; les points de suspension disent que la liste est <b>incomplète</b></td></tr>\n      <tr><td>« châssis métallique »</td><td>l’adjectif devient une valeur d’attribut : <code>matière = \"métal\"</code></td></tr>\n      <tr><td>« toujours au moins un lecteur de disquette ou un disque dur »</td><td>une <b>contrainte</b> entre accolades dans une note</td></tr>\n    </tbody></table></div>\n    <figure class=\"dgw\" data-d=\"td1_e3\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"-14 11 1286 627\" width=\"1286\" data-w=\"1286\" style=\"max-width: 100%; height: auto;\"><g><g></g><g><polyline points=\"523.1923076923077,54.5 266.8076923076923,155.5\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"523.1923076923077,54.5 511.6890766538419,52.58279482692236 504.5841398359659,61.83049036764981 516.0873708744317,63.747695540727456\" class=\"dg-fill\"></polygon><text x=\"499.0016894790634\" y=\"57.02963747794476\" text-anchor=\"end\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"499.0016894790634\" dy=\"4\">1</tspan></text><text x=\"273.320551057412\" y=\"145.93432837132258\" text-anchor=\"start\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"273.320551057412\" dy=\"4\">1..*</tspan></text><polyline points=\"560,54.5 560,155.5\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"560,54.5 554,64.5 560,74.5 566,64.5\" class=\"dg-fill\"></polygon><text x=\"567\" y=\"88.5\" text-anchor=\"start\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"567\" dy=\"4\">1</tspan></text><text x=\"553\" y=\"144.5\" text-anchor=\"end\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"553\" dy=\"4\">1</tspan></text><polyline points=\"590.1153846153846,54.5 799.88461 " font-size=\"13.5\" font-weight=\"700\" font-style=\"italic\">CartePériphérique</text><rect x=\"275\" y=\"455.5\" width=\"70\" height=\"29\" class=\"dg-box\"></rect><text x=\"310\" y=\"471.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">RAM</text><rect x=\"365\" y=\"455.5\" width=\"70\" height=\"29\" class=\"dg-box\"></rect><text x=\"400\" y=\"471.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">ROM</text><rect x=\"455\" y=\"455.5\" width=\"70\" height=\"29\" class=\"dg-box\"></rect><text x=\"490\" y=\"471.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Cache</text><rect x=\"542\" y=\"455.5\" width=\"136\" height=\"29\" class=\"dg-box\"></rect><text x=\"610\" y=\"471.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">LecteurDisquette</text><rect x=\"704\" y=\"455.5\" width=\"92\" height=\"29\" class=\"dg-box\"></rect><text x=\"750\" y=\"471.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">DisqueDur</text><rect x=\"820\" y=\"455.5\" width=\"80\" height=\"29\" class=\"dg-box\"></rect><text x=\"860\" y=\"471.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">CD-ROM</text><rect x=\"925\" y=\"455.5\" width=\"90\" height=\"29\" class=\"dg-box\"></rect><text x=\"970\" y=\"471.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">DVD-ROM</text><rect x=\"918\" y=\"595.5\" width=\"84\" height=\"29\" class=\"dg-box\"></rect><text x=\"960\" y=\"611.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">CarteSon</text><rect x=\"1016.5\" y=\"595.5\" width=\"107\" height=\"29\" class=\"dg-box\"></rect><text x=\"1070\" y=\"611.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">CarteRéseau</text><rect x=\"1132\" y=\"595.5\" width=\"126\" height=\"29\" class=\"dg-box\"></rect><text x=\"1195\" y=\"611.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">CarteGraphique</text><path d=\"M562 578 H788 L798 588 V622 H562 Z\" class=\"dg-note\"></path><path d=\"M788 578 V588 H798\" class=\"dg-l\"></path><text x=\"574\" y=\"592\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12\" font-weight=\"400\">{ chaque boîtier possède au moins</text><text x=\"574\" y=\"607\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12\" font-weight=\"400\">  un LecteurDisquette ou un DisqueDur }</text></g></g></svg></div><figcaption>Toutes les relations de contenance sont des compositions : un composant matériel appartient à un seul boîtier à la fois.</figcaption></figure>\n    <div class=\"box plus\"><span class=\"tag\">Discussion attendue</span>\n      <p>On peut défendre l’<b>agrégation</b> pour les éléments démontables (souris, moniteur, cartes), car ils survivent à la destruction de l’ordinateur et peuvent être réutilisés ailleurs. Ce qui compte : être cohérent et le dire. Le TP1 exercice 4 pose exactement cette question.</p>\n      <p>La contrainte n’est pas un <code>{ou}</code> : <code>{ou}</code> veut dire « exactement l’un des deux », alors qu’ici l’ordinateur peut avoir les deux. D’où la contrainte en langage naturel.</p>\n    </div>\n  </div></details>","ex":[],"qcm":[]},{"id":"td2","t":"TD2 · dynamiques","seance":"Exercices et TD","imp":3,"html":"<p class=\"lede\">Quatre exercices qui couvrent les quatre diagrammes dynamiques. L’exercice 4 (vidéo club) ressemble le plus à un sujet d’examen complet.</p>\n\n  <h2>Exercice 1 · Bibliothèque</h2>\n  <div class=\"enonce\">\n    <p>Créez un diagramme de cas d’utilisation complet pour un système de gestion de bibliothèque. Le système doit gérer : inscription des membres, recherche de livres, emprunt de livres, retour de livres, renouvellement de prêts, réservation de livres, gestion des amendes, ajout de nouveaux livres au catalogue, génération de rapports statistiques.</p>\n  </div>\n  <details class=\"corr\"><summary>Voir la correction <span class=\"hint\">20 min</span></summary><div class=\"in\">\n    <h3>Raisonnement</h3>\n    <ol class=\"steps\">\n      <li><b>Qui utilise le système ?</b> Un visiteur peut chercher un livre. Un membre peut en plus réserver et renouveler. Le bibliothécaire inscrit, enregistre emprunts et retours, gère amendes et catalogue. Un responsable produit les statistiques.</li>\n      <li><b>Généralisations d’acteurs</b> : un Membre est un Visiteur (il peut aussi rechercher) ; un Responsable est un Bibliothécaire.</li>\n      <li><b>Include</b> : réserver et renouveler exigent toujours l’authentification ; enregistrer un emprunt exige toujours de vérifier l’éligibilité du membre (quota, amendes impayées).</li>\n      <li><b>Extend</b> : une amende ne s’applique que si le retour est en retard, d’où « Appliquer une amende » qui étend « Enregistrer un retour » sous condition.</li>\n    </ol>\n    <figure class=\"dgw\" data-d=\"td2_e1\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"11 -14 856 818\" width=\"856\" data-w=\"856\" style=\"max-width: 100%; height: auto;\"><g><g><rect x=\"160\" y=\"0\" width=\"540\" height=\"790\" class=\"dg-sys\"></rect><text x=\"430\" y=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Système de gestion de bibliothèque</text></g><g><polyline points=\"50,213 50,128\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"41,143 50,128 59,143\" class=\"dg-hollow\"></polygon><polyline points=\"810,663 810,513\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"801,528 810,513 819,528\" class=\"dg-hollow\"></polygon><polyline points=\"77,87.1 202.09290734396842,81.83139776366733\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"78.5,243.7375 239.8753978245581,190.66393817982558\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"78.5,255.01875 209.13777334728002,263.2614811122733\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"354.1851435893136,186.55332584607646 483.012561072926,209.74226099312668\" class=\"dg-l dg-nofill dg-dash\"></polyline><polyline points=\"473.249462499107,201.88847806781658 483.012561072926,209.74226099312668 471.12362651932375,213.69867795550093\" class=\"dg-l\"></polyline><text x=\"420.54753531258774\" y=\"185.3217768558909\" text-anchor=\"middle\" class=\"dg-t dg-halo \" font-size=\"12\"><tspan x=\"420.54753531258774\" dy=\"4\">«include»</tspan></text><polyline points=\"355.71095272433917,256.85780945513216 484.6157326495731,231.07685347008538\" class=\"dg-l dg-nofill dg-dash\"></polyline><polyline points=\"472.65264840614384,227.35064690245989 484.6157326495731,231.07685347008538 475.0060420278021,239.11761501075094\" class=\"dg-l\"></polyline><text x=\"422.32062017347613\" y=\"252.7537188952089\" text-anchor=\"middle\" class=\"dg-t dg-halo \" font-size=\"12\"><tspan x=\"422.32062017347613\" dy=\"4\">«include»</tspan></text><polyline points=\"765,449.06 596.0833652096669,358.7633499090268\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"765,463.46 631.8698657368467,434.3739731473693\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"765,481.46 642.3792940745806,503.52414118508386\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"765,498.56 592.670546814137,596.0510828478006\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"765,511.15999999999997 583.4034476144407,664.8730350515809\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"769,708.6105263157895 529.474789570937,740.602333088417\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"459.2,420 384.3,420\" class=\"dg-l dg-nofill dg-dash\"></polyline><polyline points=\"395.3,426 384.3,420 395.3,414\" class=\"dg-l\"></polyline><text x=\"421.75\" y=\"407\" text-anchor=\"middle\" class=\"dg-t dg-halo \" font-size=\"12\"><tspan x=\"421.75\" dy=\"4\">«include»</tspan></text><polyline points=\"380.0535666163489,547.6840666744079 474.2174464081755,533.1973159372038\" class=\"dg-l dg-nofill dg-dash\"></polyline><polyline points=\"462.4330146284951,528.9397147780935 474.2174464081755,533.1973159372038 464.25770083954234,540.800175149901\" class=\"dg-l\"></polyline><text x=\"445\" y=\"578\" text-anchor=\"middle\" class=\"dg-t dg-halo \" font-size=\"12\"><tspan x=\"445\" dy=\"-3.5\">«extend»</tspan><tspan x=\"445\" dy=\"15\">[retour en retard]</tspan></text></g><g><circle cx=\"50\" cy=\"59\" r=\"8\" class=\"dg-box\"></circle><path d=\"M50 67 V87 M37 74 H63 M50 87 L39 103 M50 87 L61 103\" class=\"dg-l\"></path><text x=\"50\" y=\"117\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"700\">Visiteur</text><circle cx=\"50\" cy=\"224\" r=\"8\" class=\"dg-box\"></circle><path d=\"M50 232 V252 M37 239 H63 M50 252 L39 268 M50 252 L61 268\" class=\"dg-l\"></path><text x=\"50\" y=\"282\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"700\">Membre</text><circle cx=\"810\" cy=\"444\" r=\"8\" class=\"dg-box\"></circle><path d=\"M810 452 V472 M797 459 H823 M810 472 L799 488 M810 472 L821 488\" class=\"dg-l\"></path><text x=\"810\" y=\"502\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"700\">Bibliothécaire</text><circle cx=\"810\" cy=\"674\" r=\"8\" class=\"dg-box\"></circle><path d=\"M810 682 V702 M797 689 H823 M810 702 L799 718 M810 702 L821 718\" class=\"dg-l\"></path><text x=\"810\" y=\"732\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"700\">Responsable</text><ellipse cx=\"290\" cy=\"80\" rx=\"88.26\" ry=\"20.5\" class=\"dg-box\"></ellipse><text x=\"290\" y=\"80\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">Rechercher un livre</text><ellipse cx=\"290\" cy=\"175\" rx=\"77.7\" ry=\"20.5\" class=\"dg-box\"></ellipse><text x=\"290\" y=\"175\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">Réserver un livre</text><ellipse cx=\"290\" cy=\"270\" rx=\"85.62\" ry=\"20.5\" class=\"dg-box\"></ellipse><text x=\"290\" y=\"270\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">Renouveler un prêt</text><ellipse cx=\"540\" cy=\"220\" rx=\"65.82\" ry=\"20.5\" class=\"dg-box\"></ellipse><text x=\"540\" y=\"220\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">S’authentifier</text><ellipse cx=\"560\" cy=\"340\" rx=\"89.58\" ry=\"20.5\" class=\"dg-box\"></ellipse><text x=\"560\" y=\"340\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">Inscrire un membre</text><ellipse cx=\"560\" cy=\"420\" rx=\"100.8\" ry=\"20.5\" class=\"dg-box\"></ellipse><text x=\"560\" y=\"420\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">Enregistrer un emprunt</text><ellipse cx=\"300\" cy=\"420\" rx=\"84.3\" ry=\"28\" class=\"dg-box\"></ellipse><text x=\"300\" y=\"412.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">Vérifier l’éligibilité</text><text x=\"300\" y=\"427.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">du membre</text><ellipse cx=\"560\" cy=\"520\" rx=\"91.56\" ry=\"37.75\" class=\"dg-box\"></ellipse><text x=\"560\" y=\"505\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"700\">Enregistrer un retour</text><line x1=\"483.0896\" y1=\"514\" x2=\"636.9104\" y2=\"514\" class=\"dg-l\"></line><text x=\"560\" y=\"522\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"10.5\" font-weight=\"400\" font-style=\"italic\">points d’extension :</text><text x=\"560\" y=\"535\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"11\" font-weight=\"400\">contrôle des dates</text><ellipse cx=\"300\" cy=\"560\" rx=\"100.14\" ry=\"20.5\" class=\"dg-box\"></ellipse><text x=\"300\" y=\"560\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">Appliquer une amende</text><ellipse cx=\"560\" cy=\"615\" rx=\"85.62\" ry=\"20.5\" class=\"dg-box\"></ellipse><text x=\"560\" y=\"615\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">Gérer les amendes</text><ellipse cx=\"560\" cy=\"685\" rx=\"123.24000000000001\" ry=\"20.5\" class=\"dg-box\"></ellipse><text x=\"560\" y=\"685\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">Ajouter un livre au catalogue</text><ellipse cx=\"430\" cy=\"755\" rx=\"139.74\" ry=\"20.5\" class=\"dg-box\"></ellipse><text x=\"430\" y=\"755\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">Générer des rapports statistiques</text></g></g></svg></div><figcaption>Les 9 fonctionnalités demandées sont toutes présentes ; deux cas internes (S’authentifier, Vérifier l’éligibilité) et une extension structurent le diagramme.</figcaption></figure>\n    <div class=\"box plus\"><span class=\"tag\">Choix défendables</span>\n      <ul>\n        <li>Emprunt réalisé par le <b>bibliothécaire</b> : c’est le choix du prof dans sa diapo 120 (« Réaliser un emprunt » est relié à l’Employé). Si le système est en libre-service, l’emprunt peut être relié au Membre.</li>\n        <li>« Renouveler un prêt » peut aussi être relié au Bibliothécaire.</li>\n        <li>Les cas du bibliothécaire nécessitent aussi une authentification ; on peut l’ajouter, ou le préciser dans une note pour garder le diagramme lisible.</li>\n      </ul>\n    </div>\n  </div></details>\n\n  <h2>Exercice 2 · Magasin de fleurs</h2>\n  <div class=\"enonce\">\n    <ul>\n      <li>Le client demande au vendeur des renseignements sur les compositions florales.</li>\n      <li>Le vendeur lui fournit toutes les informations nécessaires.</li>\n      <li>Le client commande alors la composition de son choix et le vendeur émet le bon de fabrication qu’il transmet à son ouvrier fleuriste.</li>\n      <li>Le vendeur édite ensuite la facture correspondante.</li>\n      <li>L’ouvrier fleuriste crée la composition puis archive le bon de fabrication.</li>\n      <li>Il remet alors la composition au vendeur.</li>\n      <li>La facture est remise au client pour règlement une fois le bouquet réalisé.</li>\n      <li>Une fois la facture réglée, le client récupère sa composition et quitte le magasin.</li>\n    </ul>\n    <ol><li>Modéliser cette situation par un diagramme de séquence.</li><li>Dresser un diagramme de collaboration qui reflète ce scénario.</li></ol>\n  </div>\n  <details class=\"corr\"><summary>Voir la correction <span class=\"hint\">30 min</span></summary><div class=\"in\">\n    <h3>Les participants</h3>\n    <p>Le client est un acteur externe. Le vendeur et l’ouvrier fleuriste sont des objets du magasin. Le bon de fabrication, la facture et la composition sont <b>créés pendant le scénario</b> : leurs têtes apparaissent plus bas, au moment de leur création.</p>\n    <figure class=\"dgw\" data-d=\"td2_e2_seq\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"28 6 895 650\" width=\"895\" data-w=\"895\" style=\"max-width: 100%; height: auto;\"><g><line x1=\"60\" y1=\"92\" x2=\"60\" y2=\"642\" class=\"dg-l dg-life\"></l </code> montre ce qui circule entre la facturation et le paiement. L’expédition attend à la fois le paiement encaissé et les articles sortis (join).</figcaption></figure>\n    <div class=\"box plus\"><span class=\"tag\">Pourquoi ce fork</span>\n      <p>Rien n’oblige le magasinier à attendre le paiement pour sortir les articles : les deux se font en parallèle. En revanche on n’expédie qu’une commande payée et prête, d’où le join avant « Expédier ». Une version purement séquentielle est acceptée si elle est cohérente.</p>\n    </div>\n  </div></details>\n\n  <h2>Exercice 4 · Le vidéo club</h2>\n  <div class=\"enonce\">\n    <p>Un vidéo club est un centre de distribution qui assure essentiellement la location de films. Les éditeurs procurent les cassettes aux exploitants soit en location soit en vente. Les exploitants peuvent passer avec les éditeurs des contrats de location d’une durée moyenne de 6 mois ou passer des commandes via des catalogues fournis par les éditeurs. Un vidéo club entretient des relations avec une trentaine d’éditeurs. Lorsque les exploitants constatent une usure des cassettes qui leur appartiennent, ils peuvent les vendre à des grossistes qui pratiquent des ventes avec remises.</p>\n    <p>Un seul statut est proposé aux clients, celui d’adhérent. On attribue à chaque adhérent une carte d’adhésion qui contient un code adhérent. Il peut choisir entre plusieurs types d’abonnement ; les tarifs varient selon le mode choisi (quatre tarifs de location). On peut louer des cassettes à des clients non abonnés sans leur faire profiter des avantages tarifaires.</p>\n    <ol><li>Donner le diagramme de cas d’utilisation (penser à la généralisation d’acteurs).</li><li>Décrire le scénario « Location cassettes » par un diagramme de séquence.</li><li>En déduire le diagramme de collaboration.</li></ol>\n  </div>\n  <details class=\"corr\"><summary>Voir la correction <span class=\"hint\">45 min</span></summary><div class=\"in\">\n    <h3>1. Cas d’utilisation</h3>\n    <ol class=\"steps\">\n      <li><b>Acteurs</b> : Client (tout client, abonné ou non), Adhérent (un client avec carte : <b>généralisation</b> Adhérent → Client), Exploitant (gère le club), Éditeur et Grossiste (partenaires externes : acteurs secondaires).</li>\n      <li>« On peut louer à des clients non abonnés <b>sans</b> leur faire profiter des avantages » : la location est commune à tous, l’avantage abonné est un comportement <b>optionnel sous condition</b>, donc un <b>extend</b> avec la condition <code>[client adhérent]</code>.</li>\n      <li>L’adhésion s’accompagne toujours du choix d’un type d’abonnement : <b>include</b>.</li>\n    </ol>\n    <figure class=\"dgw\" data-d=\"td2_e4_uc\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"5 -14 862 748\" width=\"862\" data-w=\"862\" style=\"max-width: 100%; height: auto;\"><g><g><rect x=\"160\" y=\"0\" width=\"540\" height=\"720\" class=\"dg-sys\"></rect><text x=\"430\" y=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Système du vidéo club</text></g><g><polyline points=\"50,293 50,193\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"41,208 50,193 59,208\" class=\"dg-hollow\"></polygon><polyline points=\"72,146.8230769230769 234.11723448504026,100.4299753309507\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"72,156.13076923076923 232.3663750991394,178.0563653998676\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"72,163.74615384615385 274.09146418284934,262.04573209142467\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"80.5,335.2127450980392 489.02561207128616,364.4333813389244\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"495.1828365097008,109.62925384155213 394.28542853245114,93.48566856519219\" class=\"dg-l dg-nofill dg-dash\"></polyline><polyline points=\"404.1993324768948,101.14820786886582 394.28542853245114,93.48566856519219 406.09521849017494,89.29892028586536\" cla s messages ; l’auto-message 3 passe par un lien de l’objet vers lui-même.</figcaption></figure>\n    <div class=\"box piege\"><span class=\"tag\">Erreurs fréquentes</span>\n      <ul>\n        <li>Oublier la généralisation Adhérent → Client alors que l’énoncé la demande explicitement.</li>\n        <li>Mettre Éditeur ou Grossiste comme acteurs principaux de la location.</li>\n        <li>Deux cas « Louer (adhérent) » et « Louer (non abonné) » sans relation : c’est une duplication ; l’extend ou la généralisation de cas règle le problème.</li>\n      </ul>\n    </div>\n  </div></details>","ex":[],"qcm":[]},{"id":"tp1","t":"TP1 · analyse","seance":"Exercices et TD","imp":3,"html":"<p class=\"lede\">Le TP1 se fait sur un AGL (StarUML, Modelio ou Visual Paradigm). Les corrections ci-dessous sont celles que tu dois reproduire dans l’outil, puis exporter en PDF.</p>\n  <div class=\"box retenir\"><span class=\"tag\">Livrable demandé</span><p>Un seul PDF contenant les captures des diagrammes exportés et les réponses écrites de l’exercice 4.</p></div>\n\n  <h2>Exercice 1 · Cas d’utilisation : EcoTrajet</h2>\n  <div class=\"enonce\">\n    <ol>\n      <li>Les utilisateurs non inscrits peuvent uniquement rechercher un trajet.</li>\n      <li>Pour réserver ou proposer, l’utilisateur doit s’inscrire pour devenir Membre.</li>\n      <li>Un Membre peut jouer deux rôles : Conducteur (propose un trajet) et Passager (réserve une place).</li>\n      <li>Quand un Conducteur publie un trajet, le système doit obligatoirement vérifier la validité de son permis via un service externe.</li>\n      <li>Quand un Passager réserve, il peut s’il le souhaite souscrire une assurance annulation (uniquement si le prix dépasse 50 DH).</li>\n      <li>Toute réservation ou publication nécessite que le membre s’authentifie.</li>\n      <li>Un Administrateur gère les utilisateurs (validation, bannissement) et modère les commentaires.</li>\n    </ol>\n    <p>Travail : identifier les acteurs principaux et secondaires ; faire le DCU avec généralisation d’acteurs, «include» pour l’authentification et «extend» pour l’assurance.</p>\n  </div>\n  <details class=\"corr\"><summary>Voir la correction <span class=\"hint\">20 min</span></summary><div class=\"in\">\n    <div class=\"tw\"><table>\n      <tbody><tr><th>Acteurs principaux</th><th>Acteur secondaire</th></tr>\n      <tr><td>Utilisateur, Membre, Conducteur, Passager, Administrateur</td><td>Service externe de vérification des permis (système externe sollicité pour une information)</td></tr>\n    </tbody></table></div>\n    <figure class=\"dgw\" data-d=\"tp1_e1\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"-29 -14 1041 808\" width=\"1041\" data-w=\"1041\" style=\"max-width: 100%; height: auto;\"><g><g><rect x=\"260\" y=\"0\" width=\"540\" height=\"780\" class=\"dg-sys\"></rect><text x=\"530\" y=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Application EcoTrajet</text></g><g><polyline points=\"90,233 90,143\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"81,158 90,143 99,158\" class=\"dg-hollow\"></polygon><polyline points=\"35.30054644808743,413 74.18079096045197,313\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"60.35685985768259,323.7190917929592 74.18079096045197,313 77.13343378823038,330.2418647579538\" class=\"dg-hollow\"></polygon><polyline points=\"153.59315589353614,493 101.67315175097276,313\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"97.18288275411096,329.90672896617855 101.67315175097276,313 114.47778601672478,324.91810980484445\" class=\"dg-hollow\"></polygon><polyline points=\"124.5,99.98125 323.55160505457394,81.75378085511142\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"124.5,109.684375 364.7382667011132,155.80621042366363\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"58,441.0153846153846 360.17255190945156,345.3315224893995\" class=\"dg-l dg-nofill\"></ Atlas Resort</h2>\n  <div class=\"enonce\">\n    <ul>\n      <li>Un Hôtel possède un nom, une adresse et une catégorie (nombre d’étoiles).</li>\n      <li>L’hôtel est composé de plusieurs Chambres. S’il ferme définitivement, les chambres cessent d’exister.</li>\n      <li>Une Chambre a un numéro, un étage et un prix par nuit.</li>\n      <li>L’hôtel emploie du Personnel (nom, prénom, matricule) : Réceptionnistes (qui utilisent un logiciel de booking) et Agents d’entretien.</li>\n      <li>Un Client (nom, email) peut effectuer une réservation. Une Réservation lie un Client à une Chambre et porte date_début, date_fin et acompte_versé.</li>\n      <li>Une réservation peut inclure plusieurs Services (petit-déjeuner, parking, spa).</li>\n    </ul>\n    <p>Consignes : attributs typés, au moins une méthode par classe, composition Hôtel–Chambre, héritage pour le Personnel, Réservation en classe-association, toutes les multiplicités.</p>\n  </div>\n  <details class=\"corr\"><summary>Voir la correction <span class=\"hint\">30 min</span></summary><div class=\"in\">\n    <figure class=\"dgw\" data-d=\"tp1_e2\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"-94 -9 1274 831\" width=\"1274\" data-w=\"1274\" style=\"max-width: 100%; height: auto;\"><g><g></g><g><polyline points=\"430,135 430,273.5\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"430,135 424,145 430,155 436,145\" class=\"dg-fill\"></polygon><text x=\"441\" y=\"208.25\" text-anchor=\"start\" class=\"dg-t dg-halo \" font-size=\"12\"><tspan x=\"441\" dy=\"4\">contient</tspan></text><text x=\"437\" y=\"169\" text-anchor=\"start\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"437\" dy=\"4\">1</tspan></text><text x=\"437\" y=\"262.5\" text-anchor=\"start\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"437\" dy=\"4\">1..*</tspan></text><polyline points=\"594,70 835,70\" class=\"dg-l dg-nofill\"></polyline><text x=\"714.5\" y=\"57\" text-anchor=\"middle\" clas
