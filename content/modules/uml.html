.opt:hover:not(:disabled){border-color:var(--acc)}.opt:disabled{cursor:default}.opt.bon{background:var(--okb);border-color:var(--ok)}.opt.faux{background:var(--kob);border-color:var(--ko)}

:root{--panel:var(--card);--muted:var(--mute);--soft:var(--acc2);--blue:var(--h2);--orange:var(--acc);--green:var(--ok);--bad:var(--ko);--badbg:var(--kob);--good:var(--ok);--goodbg:var(--okb);--warnbg:var(--acc2);--warn:var(--acc);--mono:ui-monospace,Menlo,Consolas,monospace;--body:system-ui,sans-serif;--display:system-ui,sans-serif}
main svg{max-width:100%;height:auto}
.def,.trap,.exam{padding:10px 16px;border-radius:10px;border-left:5px solid;margin:16px 0}.def{background:var(--h2b);border-color:var(--h2)}.trap{background:var(--kob);border-color:var(--ko)}.exam{background:var(--acc2);border-color:var(--acc)}
.formula{white-space:pre-line;font-family:var(--mono);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;margin:12px 0}

.cartes-info{font-size:14px;color:var(--mute)}

main{--paper:#ffffff;--ink-2:#4a5872;--grid:#e6eaf1;--accent:#2346a0;--accent-soft:#e3e9f8;--red:#b4232c;--red-soft:#fbe9ea;--green-soft:#e3f3ea;--note:#fff3b0;--note-line:#d8c25a;--hl:#e9eefc;--f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;--f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;--f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;--r:10px}
@media (prefers-color-scheme:dark){main{--paper:#151c2a;--ink-2:#9aa7bf;--grid:#1b2333;--accent:#8fa9f2;--accent-soft:#1d2847;--red:#ff8a8f;--red-soft:#3a1b20;--green-soft:#163126;--note:#3d3618;--note-line:#8f7d2c;--hl:#1c2642}}
main .xpl{margin:14px 0 20px;padding-bottom:12px;border-bottom:2px dashed var(--line)}

main /* Concept : cahier de modélisation — papier calque bleuté,main encre marine,main stylo rouge du correcteur,main notes UML jaunes.
   Mise en page : rail de navigation à gauche (chapitres → TD/TP → examen),main colonne de lecture ~68ch,main diagrammes plus larges. */
:root{--bg: #eef1f5;
  --paper: #ffffff;
  --ink: #17233a;
  --ink-2: #4a5872;
  --line: #d3d9e4;
  --grid: #e6eaf1;
  --accent: #2346a0;
  --accent-soft: #e3e9f8;
  --red: #b4232c;
  --red-soft: #fbe9ea;
  --green: #1d7a4a;
  --green-soft: #e3f3ea;
  --note: #fff3b0;
  --note-line: #d8c25a;
  --hl: #e9eefc;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r: 10px;}
main .prose{max-width: 70ch;}
main .lede{font-size: 1.08rem; color: var(--ink-2); max-width: 64ch;}
main .src{font-family: var(--f-mono); font-size: .74rem; color: var(--ink-2); background: none; border: 1px solid var(--line); border-radius: 99px; padding: 1px 8px; white-space: nowrap;}
main /* ---------- encadrés ---------- */
.box{border-radius: var(--r); padding: 12px 16px; margin: 16px 0; max-width: 74ch; border: 1px solid var(--line); background: var(--paper);}
main .box > :first-child{margin-top: 0;}
main .box > :last-child{margin-bottom: 0;}
main .box .tag{font-family: var(--f-display); font-weight: 700; font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; display: block; margin-bottom: 4px;}
main .box.retenir{background: var(--accent-soft); border-color: transparent;}
main .box.retenir .tag{color: var(--accent);}
main .box.piege{background: var(--red-soft); border-color: transparent;}
main .box.piege .tag{color: var(--red);}
main .box.prof{background: var(--note); border: 1px solid var(--note-line);}
main .box.prof .tag{color: var(--ink);}
main .box.plus{background: var(--green-soft); border-color: transparent;}
main .box.plus .tag{color: var(--green);}
main .tw{overflow-x: auto; margin: 14px 0; max-width: 100%;}
main /* ---------- diagrammes ---------- */
figure.dgw{margin: 18px 0 22px;}
main .dgscroll{overflow-x: auto; background-color: var(--paper); border: 1px solid var(--line); border-radius: var(--r);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 22px 22px; padding: 10px;}
main figure.dgw figcaption{font-size: .86rem; color: var(--ink-2); margin-top: 6px; max-width: 74ch;}
main svg.dg{display: block; margin: 0 auto; overflow: visible;}
main .dg-t{fill: var(--ink); font-family: var(--f-body);}
main .dg-halo{paint-order: stroke; stroke: var(--paper); stroke-width: 4px; stroke-linejoin: round;}
main .dg-l{stroke: var(--ink); stroke-width: 1.4; fill: none;}
main .dg-nofill{fill: none;}
main .dg-thick{stroke-width: 2.4;}
main .dg-dash{stroke-dasharray: 6 4;}
main .dg-dot{stroke-dasharray: 2 3;}
main .dg-box{fill: var(--paper); stroke: var(--ink); stroke-width: 1.4;}
main .dg-hl{fill: var(--hl);}
main .dg-fill{fill: var(--ink); stroke: var(--ink); stroke-width: 1;}
main .dg-hollow{fill: var(--paper); stroke: var(--ink); stroke-width: 1.4;}
main .dg-note{fill: var(--note); stroke: var(--note-line); stroke-width: 1.3;}
main .dg-lane{fill: transparent; stroke: var(--ink-2); stroke-width: 1.2;}
main .dg-sys{fill: var(--paper); fill-opacity: .55; stroke: var(--ink); stroke-width: 1.6;}
main .dg-frame{fill: none; stroke: var(--ink-2); stroke-width: 1.3;}
main .dg-act{fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.2;}
main .dg-life{stroke-dasharray: 5 4; stroke: var(--ink-2);}
main .dg-mult{fill: var(--accent); font-weight: 700;}
main .dg-cons,main .dg-guard,main .dg-tag{fill: var(--red);}
main .dg-msg{stroke-width: 1.5;}
main .dg-msgt{fill: var(--accent);}
main .dg-ret{fill: var(--ink-2);}
main /* ---------- exercices ---------- */
.enonce{background: var(--paper); border: 1px solid var(--line); border-left: 4px solid var(--ink); border-radius: var(--r); padding: 12px 18px; margin: 14px 0; max-width: 78ch;}
main .enonce > :first-child{margin-top: 0;}
main .enonce > :last-child{margin-bottom: 0;}
main details.corr{border: 1px solid var(--line); border-radius: var(--r); background: var(--paper); margin: 14px 0 26px;}
main details.corr > summary{cursor: pointer; padding: 12px 16px; font-family: var(--f-display); font-weight: 700; list-style: none; display: flex; align-items: center; gap: 10px;}
main details.corr > summary::-webkit-details-marker{display: none;}
main details.corr > summary::before{content: "▸"; color: var(--red); transition: transform .2s;}
main details.corr[open] > summary::before{transform: rotate(90deg);}
main details.corr > summary .hint{font-family: var(--f-body); font-weight: 400; color: var(--ink-2); font-size: .88rem;}
main details.corr > .in{padding: 0 18px 16px; border-top: 1px dashed var(--line);}
main ol.steps > li{margin: 4px 0;}
main .btn{border: 1.5px solid var(--accent); background: var(--accent); color: var(--paper); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 700;}
main .btn.ghost{background: transparent; color: var(--accent);}
main .row{display: flex; gap: 10px; flex-wrap: wrap; align-items: center;}
main /* ---------- grille examen ---------- */
.grade{display: grid; gap: 6px; max-width: 80ch;}
main .grade label{display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: start; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; cursor: pointer;}
main .grade label .pts{font-family: var(--f-mono); font-size: .82rem; color: var(--accent); white-space: nowrap;}
main .timer{font-family: var(--f-mono); font-size: 1.6rem; font-variant-numeric: tabular-nums;}

@media (max-width:860px){.wrap{grid-template-columns:1fr}nav{display:none;position:fixed;inset:54px 0 0 0;height:auto;background:var(--bg);z-index:4;border:0}nav.open{display:block}#menu{display:inline-block}main{padding:16px 16px 90px}h1.t{font-size:23px}}
</style>

<header><button class="b" id="menu" aria-label="Chapitres">☰</button><h1>UML<small>S5 · FSABM</small></h1><span class="pct" id="pct"></span></header>
<div class="wrap"><nav id="nav"></nav><main id="main"></main></div>
<script>
const MODULE={"slug":"uml","titre":"UML","cle":"umlp_scores","cleEtat":"umlp_etat","format":"score10","intro":"  <p class=\"lede\">Tout le module, reconstruit à partir des 180 diapositives du cours, des notes manuscrites, des TD 1–2 et des TP 1–2. Chaque notion part de zéro, chaque exercice est corrigé, et chaque correction explique pourquoi. Tu peux commencer même si tu n’as jamais ouvert le cours.</p>\n\n  <div class=\"box retenir\"><span class=\"tag\">Comment travailler ici</span>\n    <ol>\n      <li><b>Lis un chapitre en entier</b>, diagrammes compris. Recopie à la main chaque diagramme une fois : l’examen se fait sur papier.</li>\n      <li><b>Fais le quiz de fin de chapitre.</b> Moins de 8/10 : relis les encadrés rouges « Piège » avant d’avancer.</li>\n      <li><b>Fais les exercices du TD correspondant sans regarder la correction</b>, chronomètre lancé. Puis compare ligne par ligne.</li>\n      <li><b>Termine par l’examen blanc</b> (2 h, sur papier), puis corrige-toi avec la grille.</li>\n      <li><b>Révise avec les cartes</b> à J+1, J+3, J+7 et J+14 : c’est ce qui fait tenir la mémoire jusqu’au jour J.</li>\n    </ol>\n  </div>\n\n  <h2>Carte du module</h2>\n  <p>L’importance pour l’examen est mon estimation, faite à partir du poids des chapitres dans les diapos et de ce que demandent les TD et TP (aucune annale n’était fournie). Certitude : moyenne.</p>\n  <div class=\"map\" id=\"map\"><a class=\"card\" href=\"#ch1\"><span class=\"k\">Chapitre 1 · diapos 1–36 + notes</span><b>Introduction et approche objet</b><span class=\"meta\"><span class=\"pill imp3\">importance 3/5</span><span class=\"pill\">≈ 60 min</span></span></a><a class=\"card\" href=\"#ch2\"><span class=\"k\">Chapitre 2 · diapos 37–78</span><b>Diagramme de classes</b><span class=\"meta\"><span class=\"pill imp5\">importance 5/5</span><span class=\"pill\">≈ 150 min</span></span></a><a class=\"card\" href=\"#ch3\"><span class=\"k\">Chapitre 3 · diapos 79–89</span><b>Diagramme d’objets</b><span class=\"meta\"><span class=\"pill imp4\">importance 4/5</span><span class=\"pill\">≈ 45 min</span></span></a><a class=\"card\" href=\"#ch4\"><span class=\"k\">Chapitre 4 · diapos 90–125</span><b>Cas d’utilisation</b><span class=\"meta\"><span class=\"pill imp5\">importance 5/5</span><span class=\"pill\">≈ 90 min</span></span></a><a class=\"card\" href=\"#ch5\"><span class=\"k\">Chapitre 5 · diapos 122–128 + compléments</span><b>Diagramme de séquence</b><span class=\"meta\"><span class=\"pill imp5\">importance 5/5</span><span class=\"pill\">≈ 75 min</span></span></a><a class=\"card\" href=\"#ch6\"><span class=\"k\">Chapitre 6 · diapos 129–152</span><b>Diagramme de collaboration</b><span class=\"meta\"><span class=\"pill imp4\">importance 4/5</span><span class=\"pill\">≈ 60 min</span></span></a><a class=\"card\" href=\"#ch7\"><span class=\"k\">Chapitre 7 · diapos 153–180</span><b>Diagramme d’activités</b><span class=\"meta\"><span class=\"pill imp4\">importance 4/5</span><span class=\"pill\">≈ 75 min</span></span></a></div>\n\n  <h2>Ta progression</h2>\n  <div id=\"progress-detail\" class=\"prose\"><p>Chapitres terminés : <b>0/7</b>. Quiz faits : <b>0/7</b>. Examen blanc : <b>pas encore corrigé</b>.</p><p class=\"src\" style=\"display:inline-block\">Ta progression reste dans ce navigateur uniquement.</p></div>\n\n  <h2>Plan sur 12 jours</h2>\n  <p>Une séance par jour, 60 à 90 minutes. Si l’examen est plus proche, fais deux jours par jour en gardant l’ordre.</p>\n  <ol class=\"plan\">\n    <li><div><b>Introduction + approche objet</b> (chapitre 1) et quiz. Lis aussi les notes manuscrites : une question y est signalée « peut être posée à l’examen ».</div></li>\n    <li><div><b>Classes, partie 1</b> : classe, attributs, opérations, associations, multiplicités, classe-association. Recopie les diagrammes.</div></li>\n    <li><div><b>Classes, partie 2</b> : agrégation, composition, héritage, contraintes, démarche. Quiz du chapitre 2.</div></li>\n    <li><div><b>Objets</b> (chapitre 3) + exercice « figure » du cours + TD1 exercice 1.</div></li>\n    <li><div><b>TD1 exercices 2 et 3</b> en conditions d’examen (25 min chacun), puis TP1 exercices 2, 3 et 4.</div></li>\n    <li><div><b>Cas d’utilisation</b> (chapitre 4) + TP1 exercice 1 + TD2 exercice 1.</div></li>\n    <li><div><b>Séquence</b> (chapitre 5) + TP2 exercices 1 et 4.</div></li>\n    <li><div><b>Collaboration</b> (chapitre 6) + TP2 exercice 2 + TD2 exercice 2.</div></li>\n    <li><div><b>Activités</b> (chapitre 7) + GAB du cours + TD2 exercice 3 + TP2 exercice 3.</div></li>\n    <li><div><b>TD2 exercice 4</b> (vidéo club : cas d’utilisation, séquence, collaboration) en 45 min.</div></li>\n    <li><div><b>Examen blanc</b> en 2 h sur papier, puis correction avec la grille.</div></li>\n    <li><div><b>Méthode + pièges + cartes</b>. Refais les 3 exercices où tu as perdu le plus de points.</div></li>\n  </ol>\n\n  <h2>Ce que contient ce parcours</h2>\n  <div class=\"tw\"><table>\n    <tbody><tr><th>Source</th><th>Ce qui en a été tiré</th></tr>\n    <tr><td>Diapositives « Falih_UML_MIP_S3 » (180 diapos)</td><td>Les 7 chapitres, avec le numéro des diapos pour retrouver l’original.</td></tr>\n    <tr><td>Notes manuscrites (7 pages)</td><td>Les notions dites à l’oral : SI, ERP, CRM, étapes d’un projet IT, MOA/MOE (chapitre 1).</td></tr>\n    <tr><td>TD1, TD2, TP1, TP2</td><td>16 exercices corrigés, avec méthode et variantes acceptables.</td></tr>\n    <tr><td>Exercices des diapos</td><td>Figure géométrique (diapo 88) et guichet automatique (diapo 179), corrigés et commentés.</td></tr>\n  </tbody></table></div>\n  <div class=\"box plus\"><span class=\"tag\">Compléments hors diapos</span>\n    <p>Les TP utilisent des notations que les diapos ne détaillent pas : fragments <code>alt</code>/<code>loop</code>, message <code>create</code>, visibilités <code>+ - #</code>. Elles sont expliquées ici et signalées par l’étiquette « Complément ». Elles viennent de la norme UML 2.5 (certitude élevée).</p>\n  </div>\n  <div class=\"box piege\"><span class=\"tag\">Attention</span>\n    <p>Ton module s’appelle « Programmation Objet UML ». Si une partie programmation (Java ou C++) est enseignée par un autre enseignant, elle n’était pas dans l’archive : ce parcours couvre la partie UML. Le chapitre 2 donne quand même la traduction UML → code pour faire le pont.</p>\n  </div>\n\n\n<p>Le cours chapitre par chapitre, avec <strong>QCM</strong>, <strong>flashcards</strong> (révision espacée) et <strong>TD corrigés</strong>.</p>\n<ul>\n<li><strong>Tableau de bord</strong> : tes notions à consolider, les plus importantes d&#39;abord.</li>\n<li><strong>Flashcards</strong> : quelques minutes par jour ; une carte réussie revient après 1, 3, 7, 14 puis 30 jours.</li>\n<li><strong>TD</strong> : cherche, ouvre l&#39;indice si besoin, compare avec le corrigé et note-toi.</li>\n<li><strong>Outils interactifs</strong> (en bas du menu) : flashcards d&#39;origine, grille d&#39;auto-correction de l&#39;examen.</li>\n</ul>\n<p>Ta progression d&#39;avant la nouvelle version est conservée.</p>\n","annexes":[{"fichier":"uml-outils.html","titre":"Outils interactifs (flashcards d'origine, grille d'auto-correction de l'examen)"}],"cartes":null,"maths":false};
const CHAPS=[{"id":"ch1","t":"Introduction et approche objet","seance":"Cours · diapos 1–36 + notes","imp":3,"html":"<p class=\"lede\">Avant de dessiner le moindre diagramme, il faut comprendre ce qu’est un modèle, qui le fait, et pourquoi UML est devenu le standard. Ce chapitre tombe surtout en questions de cours.</p>\n<section class=\"xpl\"><p class=\"xlab\">Comprendre, en clair · fil rouge : la bibliothèque de la fac</p><div class=\"xana\"><b>L'analogie</b> On ne construit pas un immeuble sans plans. L'architecte fait un plan de façade pour le client, un plan électrique pour l'électricien, un plan de plomberie pour le plombier : <b>plusieurs vues du même bâtiment</b>. UML, c'est l'ensemble des plans normalisés d'un logiciel. Le client (la <b>MOA</b>) valide ce qu'il veut, l'équipe technique (la <b>MOE</b>) construit.</div><div class=\"xfig\"><svg viewBox=\"0 0 640 290\" role=\"img\" aria-label=\"familles de diagrammes UML\" style=\"width:100%;min-width:520px;color:var(--ink)\" font-family=\"var(--f-body),system-ui,sans-serif\" font-size=\"12\"><defs>\n<marker id=\"uTri1\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0 L12 6 L0 12 Z\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></path></marker>\n<marker id=\"uArr1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 Z\" fill=\"currentColor\"></path></marker>\n<marker id=\"uOpen1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10\" fill=\"none\" stroke=\"currentColor\"></path></marker>\n<marker id=\"uDiaO1\" viewBox=\"0 0 16 10\" refX=\"1\" refY=\"5\" markerWidth=\"16\" markerHeight=\"10\" orient=\"auto\"><path d=\"M0 5 L8 0 L16 5 L8 10 Z\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></path></marker>\n<marker id=\"uDiaF1\" viewBox=\"0 0 16 10\" refX=\"1\" refY=\"5\" markerWidth=\"16\" markerHeight=\"10\" orient=\"auto\"><path d=\"M0 5 L8 0 L16 5 L8 10 Z\" fill=\"currentColor\"></path></marker>\n</defs><rect x=\"250\" y=\"10\" width=\"140\" height=\"36\" rx=\"6\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\"></rect><text x=\"320\" y=\"33\" text-anchor=\"middle\" font-weight=\"700\">Le logiciel</text><rect x=\"20\" y=\"90\" width=\"280\" height=\"190\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-dasharray=\"5 4\"></rect><text x=\"160\" y=\"110\" text-anchor=\"middle\" font-weight=\"700\">Structure (statique) : « de quoi c'est fait »</text><rect x=\"340\" y=\"90\" width=\"280\" height=\"190\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-dasharray=\"5 4\"></rect><text x=\"480\" y=\"110\" text-anchor=\"middle\" font-weight=\"700\">Comportement (dynamique) : « comment ça bouge »</text><rect x=\"40\" y=\"125\" width=\"240\" height=\"26\" rx=\"4\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></rect><text x=\"160\" y=\"142\" text-anchor=\"middle\">Diagramme de classes (ch. 2)</text><rect x=\"40\" y=\"161\" width=\"240\" height=\"26\" rx=\"4\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></rect><text x=\"160\" y=\"178\" text-anchor=\"middle\">Diagramme d'objets (ch. 3)</text><rect x=\"40\" y=\"197\" width=\"240\" height=\"26\" rx=\"4\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></rect><text x=\"160\" y=\"214\" text-anchor=\"middle\">Composants, déploiement…</text><rect x=\"40\" y=\"233\" width=\"240\" height=\"26\" rx=\"4\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></rect><text x=\"160\" y=\"250\" text-anchor=\"middle\">Paquetages…</text><rect x=\"360\" y=\"125\" width=\"240\" height=\"26\" rx=\"4\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></rect><text x=\"480\" y=\"142\" text-anchor=\"middle\">Cas d'utilisation (ch. 4)</text><rect x=\"360\" y=\"161\" width=\"240\" height=\"26\" rx=\"4\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></rect><text x=\"480\" y=\"178\" text-anchor=\"middle\">Séquence (ch. 5)</text><rect x=\"360\" y=\"197\" width=\"240\" height=\"26\" rx=\"4\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></rect><text x=\"480\" y=\"214\" text-anchor=\"middle\">Collaboration (ch. 6)</text><rect x=\"360\" y=\"233\" width=\"240\" height=\"26\" rx=\"4\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></rect><text x=\"480\" y=\"250\" text-anchor=\"middle\">Activités (ch. 7), états…</text><path d=\"M280 46 L160 88\" stroke=\"currentColor\" marker-end=\"url(#uArr1)\"></path><path d=\"M360 46 L480 88\" stroke=\"currentColor\" marker-end=\"url(#uArr1)\"></path></svg></div><div class=\"xkey\"><b>Les trois idées du chapitre</b> : 1) un logiciel échoue surtout parce qu'on a mal compris le besoin, d'où la modélisation ; 2) UML est un <b>langage</b> (des notations), pas une <b>méthode</b> (il ne dit pas dans quel ordre travailler) ; 3) il réunit les méthodes objet des années 1990 (Booch, OMT de Rumbaugh, OOSE de Jacobson), normalisé par l'OMG.</div><div class=\"xtrap\"><b>Piège</b> « UML est une méthode » est <b>faux</b>, c'est la question piège classique. Et MERISE sépare données et traitements, alors que l'objet les réunit dans la même classe.</div><details class=\"xchk\"><summary>À toi : 3 questions éclair</summary><ol><li>Qui est la MOA dans un projet de site pour la fac ? <i>Réponse : la fac (le client qui exprime le besoin) ; la MOE est l'équipe qui le réalise.</i></li><li>Le diagramme de séquence est-il structurel ou comportemental ? <i>Réponse : comportemental.</i></li><li>Quel organisme normalise UML ? <i>Réponse : l'OMG (Object Management Group).</i></li></ol></details></section><p class=\"fichelab\">Le cours du prof (à retenir)</p>\n\n  <div class=\"prose\">\n  <h2>1. Le problème : le logiciel coûte cher et échoue souvent</h2>\n  <p>Un système informatique, c’est environ <b>80 % de logiciel et 20 % de matériel</b>. Le matériel est fabriqué par peu d’acteurs, il est fiable et standardisé. Les problèmes de l’informatique sont donc surtout des problèmes de logiciel. <span class=\"src\">diapo 3</span></p>\n  <p>C’est ce qu’on appelle la <b>crise du logiciel</b>. Une étude du Standish Group sur <b>8 380 projets</b> donne : <b>16 % de succès</b>, <b>53 % de projets problématiques</b> (budget ou délais dépassés, fonctionnalités manquantes) et <b>31 % d’échecs</b> (projet abandonné). Plus le projet et l’entreprise sont grands, plus le taux de succès baisse. <span class=\"src\">diapo 4</span></p>\n\n  <h3>Les critères de qualité d’un logiciel <span class=\"src\">diapo 5</span></h3>\n  <div class=\"tw\"><table>\n    <tbody><tr><th>Critère</th><th>Ce que ça veut dire</th></tr>\n    <tr><td>Utilité</td><td>Le logiciel répond aux besoins des utilisateurs.</td></tr>\n    <tr><td>Utilisabilité</td><td>Il est facile à prendre en main.</td></tr>\n    <tr><td>Fiabilité</td><td>Il fonctionne sans pannes ni erreurs.</td></tr>\n    <tr><td>Interopérabilité</td><td>Il sait échanger avec d’autres logiciels.</td></tr>\n    <tr><td>Performance</td><td>Il répond vite et consomme peu de ressources.</td></tr>\n    <tr><td>Portabilité</td><td>Il tourne sur différents environnements.</td></tr>\n    <tr><td>Réutilisabilité</td><td>Ses composants servent dans d’autres projets.</td></tr>\n    <tr><td>Facilité de maintenance</td><td>On peut le corriger et le faire évoluer. La maintenance absorbe une très grosse partie de l’effort total.</td></tr>\n  </tbody></table></div>\n\n  <h3>Les étapes du développement <span class=\"src\">diapo 6</span></h3>\n  <ol>\n    <li><b>Spécification des besoins</b> : déterminer ce que le logiciel doit faire.</li>\n    <li><b>Conception / modélisation</b> : déterminer comment il le fera.</li>\n    <li><b>Codage</b>.</li>\n    <li><b>Clôture</b> : tests, paramétrage, maintenance.</li>\n  </ol>\n  <p>Les systèmes sont devenus trop complexes pour être compris par une seule personne. Le <b>génie logiciel</b> est la méthodologie qui couvre toutes les étapes du développement, modélisation comprise. À la fin de chaque étape de modélisation, on produit des <b>modèles</b>. <span class=\"src\">diapo 7</span></p>\n\n  <h2>2. Qu’est-ce qu’un modèle ?</h2>\n  <div class=\"box retenir\"><span class=\"tag\">Définition à savoir par cœur</span>\n    <p>Un <b>modèle</b> est une représentation abstraite de la réalité qui exclut certains détails du monde réel. Il réduit la complexité d’un phénomène en éliminant les détails qui n’influencent pas son comportement de manière significative. <span class=\"src\">diapo 9</span></p>\n  </div>\n  <p>Un modèle reflète ce que le concepteur juge important pour comprendre et prévoir le phénomène ; ses limites dépendent de ses objectifs. Il se présente sous forme de <b>schéma (diagramme)</b> qui contient des <b>éléments graphiques</b> (symboles dont le sens est fixé par le formalisme) et du <b>texte</b> (qui précise la portée des symboles). <span class=\"src\">diapo 10</span></p>\n  <p>Exemple concret : un plan de métro est un modèle. Il ignore les distances réelles et les rues, parce que pour choisir un trajet seules les stations et les correspondances comptent.</p>\n\n  <h3>Qui modélise ? MOA et MOE <span class=\"src\">diapos 13–14</span></h3>\n  <p>La modélisation n’est pas un métier en soi : c’est une compétence que peut acquérir un ingénieur, un gestionnaire, un analyste ou un technicien.</p>\n  <div class=\"tw\"><table>\n    <tbody><tr><th></th><th>Maîtrise d’ouvrage (MOA)</th><th>Maîtrise d’œuvre (MOE)</th></tr>\n    <tr><td>Qui</td><td>Le client, le métier (l’entreprise qui commande)</td><td>Le prestataire informatique qui réalise</td></tr>\n    <tr><td>Rôle</td><td>Dispose de toutes les informations et procédures du métier ; définit les attentes</td><td>Étudie la faisabilité, traduit techniquement les besoins, modélise si la MOA n’en a pas les compétences, développe</td></tr>\n  </tbody></table></div>\n  <p>Une forte coordination MOA–MOE est indispensable. Leur relation est un <b>contrat</b> qui fixe leurs engagements mutuels.</p>\n\n  <h3>Pourquoi modéliser ? <span class=\"src\">diapo 15</span></h3>\n  <p>Modéliser un système avant de le réaliser permet de :</p>\n  <ul>\n    <li>mieux comprendre son fonctionnement ;</li>\n    <li>maîtriser sa complexité et assurer sa cohérence ;</li>\n    <li>faciliter la communication entre les intervenants ;</li>\n    <li>mieux répartir les tâches ;</li>\n    <li>assurer une qualité élevée et une meilleure maintenabilité ;</li>\n    <li>réduire les coûts et les délais.</li>\n  </ul>\n  <p>Conclusion du prof : <b>la création d’un modèle est indispensable</b>.</p>\n\n  <h2>3. Les langages de modélisation</h2>\n  <p>La création du modèle se fait selon une <b>méthode</b>. Depuis les années 80, les recherches se sont multipliées : plus de 50 méthodes au début des années 90. <span class=\"src\">diapo 16</span></p>\n  <p>Un langage de modélisation doit définir trois choses <span class=\"src\">diapo 17</span> :</p>\n  <ol>\n    <li>la <b>sémantique</b> des concepts (ce qu’ils veulent dire) ;</li>\n    <li>une <b>notation</b> pour les représenter (les symboles) ;</li>\n    <li>des <b>règles</b> de construction et d’utilisation.</li>\n  </ol>\n  <div class=\"tw\"><table>\n    <tbody><tr><th>Type</th><th>Exemples</th><th>Caractéristiques</th></tr>\n    <tr><td>Formels</td><td>Z, B, VDM</td><td>Mathématiques, grand pouvoir d’expression, permettent des preuves formelles</td></tr>\n    <tr><td>Semi-formels</td><td>MERISE, UML</td><td>Graphiques, moins expressifs mais plus faciles à utiliser</td></tr>\n  </tbody></table></div>\n  <p>Les langages sont aussi adaptés à un type de système <span class=\"src\">diapo 18</span> : procéduraux (MERISE), temps réel (ROOM, SADT), à objets (OMT, Booch, UML). Les <b>AGL</b> (Ateliers de Génie Logiciel, par exemple StarUML, Modelio, Visual Paradigm) jouent un rôle primordial pour utiliser ces langages en pratique.</p>\n\n  <h2>4. Comment est né UML</h2>\n  <div class=\"tw\"><table>\n    <tbody><tr><th>Année</th><th>Événement</th></tr>\n    <tr><td>1991</td><td><b>OMT</b> (Object Modeling Technique) de <b>James Rumbaugh</b> : trois diagrammes (objet, dynamique avec états et transitions, fonctionnel proche des flux de données).</td></tr>\n    <tr><td>1992</td><td><b>OOSE</b> (Object-Oriented Software Engineering) d’<b>Ivar Jacobson</b>, à l’origine des cas d’utilisation.</td></tr>\n    <tr><td>1993</td><td><b>OOD</b> (Object-Oriented Design) de <b>Grady Booch</b>.</td></tr>\n    <tr><td>Oct. 1994</td><td>Booch et Rumbaugh se réunissent chez <b>Rational</b> pour une méthode commune.</td></tr>\n    <tr><td>1995</td><td>Conférence OOPSLA’95 : présentation de <b>Unified Method 0.8</b>.</td></tr>\n    <tr><td>1996</td><td>Jacobson rejoint l’équipe. OOPSLA’96 : <b>naissance d’UML</b>.</td></tr>\n  </tbody></table></div>\n  <p class=\"src\" style=\"display:inline-block\">diapos 19–24</p>\n  <p>Le problème de départ : chaque méthode avait sa propre notation et sa terminologie, d’où incompatibilités et redondances. On cherchait un langage <b>unique</b>, utilisable avec toute méthode objet, à toutes les étapes du cycle de vie, et compatible avec les méthodes existantes. <span class=\"src\">diapo 22</span></p>\n  <div class=\"box plus\"><span class=\"tag\">Complément (certitude élevée)</span>\n    <p>UML a été adopté comme standard par l’<b>OMG</b> (Object Management Group) en 1997 (UML 1.1). La version actuelle est UML 2.5.1 (2017). Booch, Rumbaugh et Jacobson sont surnommés « les trois amigos ».</p>\n  </div>\n\n  <h2>5. UML est un langage, pas une méthode</h2>\n  <div class=\"box retenir\"><span class=\"tag\">La phrase qui rapporte des points</span>\n    <p><b>UML est un langage de modélisation et non une méthode.</b> C’est un langage graphique qui permet de représenter et de communiquer les différents aspects d’un système d’information. Il couvre toutes les étapes du développement. <span class=\"src\">diapo 25</span></p>\n  </div>\n  <p>La différence : une <b>méthode</b> dit dans quel ordre faire les choses (une démarche). Un <b>langage</b> donne seulement le vocabulaire et la grammaire pour décrire. UML ne dit pas « commence par ceci » : il fournit les diagrammes.</p>\n\n  <h2>6. L’approche objet en 7 mots</h2>\n  <p>Le but de la modélisation objet est de décrire des objets. <span class=\"src\">diapos 26–29</span></p>\n  <div class=\"tw\"><table>\n    <tbody><tr><th>Concept</th><th>Définition</th><th>Exemple</th></tr>\n    <tr><td><b>Objet</b></td><td>Représentation abstraite d’une entité du monde réel ou abstrait, avec des limites claires et un sens précis. Il a un <b>état</b> (valeurs de ses attributs), un <b>comportement</b> (ses méthodes, déclenchées par des messages) et une <b>identité</b>.</td><td>La voiture Renault 2008 diesel de Ali</td></tr>\n    <tr><td><b>Classe</b></td><td>Décrit un groupe d’objets ayant la même structure et le même comportement.</td><td>Voiture</td></tr>\n    <tr><td><b>Encapsulation</b></td><td>On n’accède aux données d’un objet que par ses méthodes.</td><td><code>getSolde()</code> au lieu de lire <code>solde</code> directement</td></tr>\n    <tr><td><b>Association</b></td><td>Relation entre plusieurs classes.</td><td>Un client loue une voiture</td></tr>\n    <tr><td><b>Héritage</b></td><td>Transmission des attributs et méthodes d’une classe vers une sous-classe. Permet la généralisation et la spécialisation.</td><td>Lion hérite de Carnivore qui hérite d’Animal</td></tr>\n    <tr><td><b>Agrégation</b></td><td>Décrit un objet composite par les objets qui le constituent.</td><td>Une voiture et ses roues</td></tr>\n    <tr><td><b>Polymorphisme</b></td><td>Une même opération s’exécute différemment selon la classe de l’objet.</td><td><code>calculerSalaire()</code> différent pour un cadre et un non-cadre</td></tr>\n  </tbody></table></div>\n\n  <h2>7. MERISE et UML</h2>\n  <p><b>MERISE</b> est une méthode française de conception des SI de gestion ; elle sépare la modélisation des <b>données</b> et celle des <b>traitements</b>. <b>UML</b> couvre l’analyse objet, la conception objet et l’implémentation, et ne sépare pas données et traitements : l’objet porte les deux. <span class=\"src\">diapo 30</span></p>\n  <h3>Correspondance des concepts <span class=\"src\">diapo 32</span></h3>\n  <div class=\"tw\"><table>\n    <tbody><tr><th>MERISE</th><th>UML</th></tr>\n    <tr><td>Entité (ou objet)</td><td>Classe</td></tr>\n    <tr><td>Propriété</td><td>Attribut</td></tr>\n    <tr><td>Occurrences</td><td>Instances</td></tr>\n    <tr><td>Cardinalités</td><td>Multiplicités</td></tr>\n    <tr><td>Sous-type</td><td>Sous-classe</td></tr>\n    <tr><td>Généralisation-spécialisation</td><td>Généralisation / héritage</td></tr>\n    <tr><td>Relation (association)</td><td>Association</td></tr>\n    <tr><td>Contraintes</td><td>Contrainte</td></tr>\n    <tr><td>Cycle de vie des objets</td><td>État-transition</td></tr>\n    <tr><td>Acteur</td><td>Acteur</td></tr>\n    <tr><td>Flux</td><td>Flux-message</td></tr>\n    <tr><td>Diagramme de flux</td><td>Modèle d’activité</td></tr>\n  </tbody></table></div>\n  <div class=\"box piege\"><span class=\"tag\">Piège : cardinalités ≠ multiplicités</span>\n    <p>En MERISE, la cardinalité <code>0,N</code> s’écrit <b>du côté de l’entité qui participe</b>. En UML, la multiplicité s’écrit <b>de l’autre côté</b>. Exemple de la diapo 31 : MERISE met <code>0,N</code> à côté de Professeur ; UML met <code>1</code> à côté de Professeur et <code>*</code> à côté de UF. Ne mélange jamais les deux conventions.</p>\n  </div>\n  <h3>Correspondance des modèles selon le prof <span class=\"src\">diapo 33</span></h3>\n  <div class=\"tw\"><table>\n    <tbody><tr><th>MERISE</th><th>UML</th></tr>\n    <tr><td>MCD</td><td>Diagramme des cas d’utilisation</td></tr>\n    <tr><td>MOD</td><td>Diagramme de classes</td></tr>\n    <tr><td>MLD (relationnel)</td><td>Diagramme d’objets</td></tr>\n    <tr><td>MCT</td><td>Diagramme d’état-transition</td></tr>\n    <tr><td>MOT</td><td>Diagramme d’activités</td></tr>\n    <tr><td>(rien)</td><td>Séquence, collaboration, composants, déploiement</td></tr>\n  </tbody></table></div>\n  <div class=\"box prof\"><span class=\"tag\">Signal du prof</span>\n    <p>Si on te demande ce tableau, reproduis-le tel quel. Sache quand même que, sur le fond, c’est le MCD (entités et associations) qui ressemble le plus au diagramme de classes. Si on te demande de justifier, c’est l’argument à donner.</p>\n  </div>\n\n  <h2>8. Les diagrammes d’UML</h2>\n  <p>Un diagramme est une représentation graphique qui s’intéresse à un aspect précis du modèle : c’est une <b>perspective</b>. Une <b>vue</b> est constituée d’un ou plusieurs diagrammes. <span class=\"src\">diapo 34</span></p>\n  <div class=\"tw\"><table>\n    <tbody><tr><th>Vues statiques (structure)</th><th>Vues dynamiques (fonctionnement)</th></tr>\n    <tr><td>Diagramme de classes (DCL)<br>Diagramme d’objets (DOB)<br>Diagramme de composants (DCP)<br>Diagramme de déploiement (DDP)</td>\n        <td>Diagramme de cas d’utilisation (DCU)<br>Diagramme de séquence (DSE)<br>Diagramme d’activités (DAC)<br>Diagramme d’état-transition (DET)<br>Diagramme de collaboration (DCO)</td></tr>\n  </tbody></table></div>\n  <p>Ce module en étudie six : <b>classes, objets, cas d’utilisation, séquence, collaboration, activités</b> <span class=\"src\">diapo 90</span>.</p>\n  <div class=\"box plus\"><span class=\"tag\">Complément</span>\n    <p>Depuis UML 2, le diagramme de collaboration s’appelle officiellement <b>diagramme de communication</b>. Le prof garde l’ancien nom : utilise « collaboration » à l’examen. UML 2.5 compte 14 diagrammes au total.</p>\n  </div>\n  <p>Le principe de base : <b>symboles + syntaxe = sens</b>. Une classe s’instancie en objet ; une relation entre classes s’instancie en <b>lien</b> entre objets. Diagramme de classes et diagramme d’objets sont liés par cette instanciation. <span class=\"src\">diapos 36–38</span></p>\n\n  <h2>9. Ce qui a été dit à l’oral (notes manuscrites)</h2>\n  <p>Ces notions ne sont pas sur les diapos mais ont été dictées en cours. Elles peuvent tomber en question de cours.</p>\n  <div class=\"tw\"><table>\n    <tbody><tr><th>Terme</th><th>Définition</th></tr>\n    <tr><td>Intranet</td><td>Solution logicielle qui fait circuler l’information <b>strictement à l’intérieur</b> de l’entreprise (actualités, tarifs, nominations, carnet d’adresses), sur un réseau local fermé (LAN).</td></tr>\n    <tr><td>Extranet</td><td>Solution développée par l’entreprise et accessible à des <b>acteurs externes</b> (clients, prestataires, actionnaires, partenaires) via des droits d’accès.</td></tr>\n    <tr><td>ERP (Enterprise Resource Planning)</td><td>Progiciel de gestion intégré : plusieurs modules pour les différents processus (RH, finance, vente, achats, service client, tableaux de bord).</td></tr>\n    <tr><td>CRM (Customer Relationship Management)</td><td>Gestion de la relation client : enregistrement, traitement et traçabilité des requêtes clients (demandes, réclamations). Très utilisé dans les centres d’appels.</td></tr>\n    <tr><td>SI (système d’information)</td><td>Sur le plan pratique, tout logiciel de l’entreprise : ERP, intranet, extranet, CRM, plateformes, applications. Exemples : SI-RH, SI-Finance, SI-Juridique, SI-Commercial.</td></tr>\n    <tr><td>Entreprise (vue systémique)</td><td>Système socio-technique, dynamique, complexe, organisé selon des processus qui consomment des ressources en vue d’une finalité.</td></tr>\n    <tr><td>Processus</td><td>Ensemble d’activités organisées de manière séquentielle ou simultanée pour atteindre un objectif.</td></tr>\n  </tbody></table></div>\n  <p>Les processus d’une entreprise se rangent en <b>3 catégories</b> (c’est la « cartographie des processus », reprise en diapos 153–154) :</p>\n  <ol>\n    <li><b>Processus de management (pilotage)</b> : direction, finance, audit, contrôle de gestion, tableaux de bord.</li>\n    <li><b>Processus métier (réalisation)</b> : facturation, vente, service client, marketing.</li>\n    <li><b>Processus support</b> : GRH, gestion des SI, achats, approvisionnement, gestion des stocks.</li>\n  </ol>\n  <p>La <b>transformation digitale</b> consiste à digitaliser chacun de ces processus avec les technologies numériques.</p>\n  <h3>Les étapes d’un projet IT (notes)</h3>\n  <ol>\n    <li><b>Analyse et spécification</b> : rédaction du cahier des charges (besoins, objectifs, contraintes). La MOA définit les attentes métier ; la MOE (prestataire) étudie la faisabilité et traduit techniquement les besoins.</li>\n    <li><b>Modélisation UML</b> : transformation du cahier des charges en diagrammes ; compréhension commune entre MOA et prestataires.</li>\n    <li><b>Réalisation technique</b> : la MOE développe, configure et intègre.</li>\n    <li><b>Résultat</b> : livraison conforme au cahier des charges, validation par la MOA, mise en production.</li>\n  </ol>\n  <p>Vocabulaire noté : <b>instanciation</b> = donner des valeurs aux attributs (créer un objet à partir d’une classe) ; <b>instance</b> = objet.</p>\n  <div class=\"box prof\"><span class=\"tag\">⚠ Marqué « peut être posée à l’examen » dans les notes</span>\n    <p><b>Comment ajouter une infobulle explicative au survol d’un lien ?</b> Avec l’attribut HTML <code>title</code> :</p>\n    <p><code>&lt;a href=\"#\" title=\"Visitez html.net pour apprendre HTML\"&gt;HTML.net&lt;/a&gt;</code></p>\n    <p>Les mêmes notes rappellent : en CSS, un <b>id</b> est unique (sélecteur <code>#</code>) et une <b>class</b> est réutilisable sur plusieurs éléments (sélecteur <code>.</code>). Les <b>pseudo-classes</b> ciblent un élément selon son état (<code>:hover</code>, <code>:active</code>, <code>:focus</code>, <code>:visited</code>), sa position (<code>:first-child</code>, <code>:last-child</code>, <code>:nth-child()</code>), un formulaire (<code>:checked</code>, <code>:disabled</code>, <code>:enabled</code>, <code>:required</code>) ou la structure (<code>:root</code>, <code>:empty</code>, <code>:not()</code>).</p>\n  </div>\n\n  <h2>Pièges du chapitre</h2>\n  <div class=\"box piege\"><span class=\"tag\">Piège</span>\n    <ul>\n      <li>Dire « UML est une méthode » : c’est faux, c’est un langage.</li>\n      <li>Confondre MOA (le client, le métier) et MOE (le réalisateur).</li>\n      <li>Oublier un des trois éléments d’un langage : sémantique, notation, règles.</li>\n      <li>Ranger le diagramme de cas d’utilisation dans les vues statiques : pour ce prof, il est dans les vues dynamiques.</li>\n    </ul>\n  </div>\n  </div>\n  <h2>Quiz du chapitre 1</h2>\n  \n  <div class=\"row\"></div><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 7 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">UML est…</div><button class=\"opt\" data-o=\"0\">une méthode de développement</button><button class=\"opt\" data-o=\"1\">un langage de modélisation</button><button class=\"opt\" data-o=\"2\">un langage de programmation</button><button class=\"opt\" data-o=\"3\">un atelier de génie logiciel</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Dans l’étude du Standish Group sur 8 380 projets, quel est le taux de succès ?</div><button class=\"opt\" data-o=\"0\">16 %</button><button class=\"opt\" data-o=\"1\">31 %</button><button class=\"opt\" data-o=\"2\">53 %</button><button class=\"opt\" data-o=\"3\">80 %</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Qu’est-ce qu’un modèle ?</div><button class=\"opt\" data-o=\"0\">Une copie fidèle et complète de la réalité</button><button class=\"opt\" data-o=\"1\">Une représentation abstraite qui exclut certains détails du réel</button><button class=\"opt\" data-o=\"2\">Le code source d’un logiciel</button><button class=\"opt\" data-o=\"3\">Une maquette d’interface</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Qui dispose des informations et procédures du métier ?</div><button class=\"opt\" data-o=\"0\">La MOE</button><button class=\"opt\" data-o=\"1\">La MOA</button><button class=\"opt\" data-o=\"2\">Le testeur</button><button class=\"opt\" data-o=\"3\">L’AGL</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Un langage de modélisation doit définir…</div><button class=\"opt\" data-o=\"0\">syntaxe, compilateur, bibliothèques</button><button class=\"opt\" data-o=\"1\">sémantique, notation, règles de construction</button><button class=\"opt\" data-o=\"2\">classes, objets, messages</button><button class=\"opt\" data-o=\"3\">besoins, conception, tests</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">MERISE et UML sont des langages…</div><button class=\"opt\" data-o=\"0\">formels</button><button class=\"opt\" data-o=\"1\">semi-formels</button><button class=\"opt\" data-o=\"2\">de programmation</button><button class=\"opt\" data-o=\"3\">temps réel</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Qui a créé OOSE, la méthode à l’origine des cas d’utilisation ?</div><button class=\"opt\" data-o=\"0\">Grady Booch</button><button class=\"opt\" data-o=\"1\">James Rumbaugh</button><button class=\"opt\" data-o=\"2\">Ivar Jacobson</button><button class=\"opt\" data-o=\"3\">Bertrand Meyer</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Le polymorphisme, c’est…</div><button class=\"opt\" data-o=\"0\">l’accès aux données uniquement par les méthodes</button><button class=\"opt\" data-o=\"1\">une même opération qui s’exécute différemment selon la classe</button><button class=\"opt\" data-o=\"2\">la transmission des attributs à une sous-classe</button><button class=\"opt\" data-o=\"3\">un objet composé d’autres objets</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Selon le prof, dans quelle catégorie est le diagramme de cas d’utilisation ?</div><button class=\"opt\" data-o=\"0\">Vues statiques</button><button class=\"opt\" data-o=\"1\">Vues dynamiques</button><button class=\"opt\" data-o=\"2\">Vues de déploiement</button><button class=\"opt\" data-o=\"3\">Aucune</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Comment afficher une infobulle au survol d’un lien HTML (question signalée dans les notes) ?</div><button class=\"opt\" data-o=\"0\">Attribut alt</button><button class=\"opt\" data-o=\"1\">Attribut title</button><button class=\"opt\" data-o=\"2\">Pseudo-classe :hover seule</button><button class=\"opt\" data-o=\"3\">Balise <tooltip></button><div class=\"qq-e\" hidden></div></div></section>","ex":[],"qcm":[{"n":"ch1","q":"UML est…","o":["une méthode de développement","un langage de modélisation","un langage de programmation","un atelier de génie logiciel"],"a":1,"e":"UML est un langage de modélisation, pas une méthode : il ne fixe pas de démarche (diapo 25)."},{"n":"ch1","q":"Dans l’étude du Standish Group sur 8 380 projets, quel est le taux de succès ?","o":["16 %","31 %","53 %","80 %"],"a":0,"e":"16 % de succès, 53 % problématiques, 31 % d’échecs (diapo 4)."},{"n":"ch1","q":"Qu’est-ce qu’un modèle ?","o":["Une copie fidèle et complète de la réalité","Une représentation abstraite qui exclut certains détails du réel","Le code source d’un logiciel","Une maquette d’interface"],"a":1,"e":"Le modèle réduit la complexité en éliminant les détails qui n’influencent pas le comportement de manière significative (diapo 9)."},{"n":"ch1","q":"Qui dispose des informations et procédures du métier ?","o":["La MOE","La MOA","Le testeur","L’AGL"],"a":1,"e":"La maîtrise d’ouvrage (le client, le métier). La MOE est le réalisateur (diapo 14)."},{"n":"ch1","q":"Un langage de modélisation doit définir…","o":["syntaxe, compilateur, bibliothèques","sémantique, notation, règles de construction","classes, objets, messages","besoins, conception, tests"],"a":1,"e":"Sémantique des concepts, notation, règles de construction et d’utilisation (diapo 17)."},{"n":"ch1","q":"MERISE et UML sont des langages…","o":["formels","semi-formels","de programmation","temps réel"],"a":1,"e":"Semi-formels : graphiques, moins expressifs que Z, B ou VDM mais plus faciles d’emploi."},{"n":"ch1","q":"Qui a créé OOSE, la méthode à l’origine des cas d’utilisation ?","o":["Grady Booch","James Rumbaugh","Ivar Jacobson","Bertrand Meyer"],"a":2,"e":"OOSE (1992) d’Ivar Jacobson. OMT est de Rumbaugh, OOD de Booch."},{"n":"ch1","q":"Le polymorphisme, c’est…","o":["l’accès aux données uniquement par les méthodes","une même opération qui s’exécute différemment selon la classe","la transmission des attributs à une sous-classe","un objet composé d’autres objets"],"a":1,"e":"Exemple du cours : calcul du salaire différent pour les cadres et les non-cadres. Le premier choix est l’encapsulation."},{"n":"ch1","q":"Selon le prof, dans quelle catégorie est le diagramme de cas d’utilisation ?","o":["Vues statiques","Vues dynamiques","Vues de déploiement","Aucune"],"a":1,"e":"Diapo 34 : DCU, DSE, DAC, DET et DCO sont dans les vues dynamiques."},{"n":"ch1","q":"Comment afficher une infobulle au survol d’un lien HTML (question signalée dans les notes) ?","o":["Attribut alt","Attribut title","Pseudo-classe :hover seule","Balise <tooltip>"],"a":1,"e":"<a href=\"#\" title=\"texte de l’infobulle\">…</a>."}]},{"id":"ch2","t":"Diagramme de classes","seance":"Cours · diapos 37–78","imp":5,"html":"<p class=\"lede\">C’est le diagramme le plus important du module : il décrit la structure statique du système, sous forme de classes et de relations. Il tombe presque à coup sûr à l’examen.</p>\n<section class=\"xpl\"><p class=\"xlab\">Comprendre, en clair · fil rouge : la bibliothèque de la fac</p><div class=\"xana\"><b>L'analogie</b> Une <b>classe</b>, c'est le moule ; un <b>objet</b>, c'est le gâteau sorti du moule. La classe Livre décrit ce que tout livre possède (un titre, un ISBN) et sait faire ; « Le Petit Prince, ISBN 978… » est un objet. Le diagramme de classes, c'est le plan de tous les moules et de leurs liens.</div><div class=\"xfig\"><svg viewBox=\"0 0 640 345\" role=\"img\" aria-label=\"diagramme de classes de la bibliothèque\" style=\"width:100%;min-width:520px;color:var(--ink)\" font-family=\"var(--f-body),system-ui,sans-serif\" font-size=\"12\"><defs>\n<marker id=\"uTri3\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0 L12 6 L0 12 Z\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></path></marker>\n<marker id=\"uArr3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 Z\" fill=\"currentColor\"></path></marker>\n<marker id=\"uOpen3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10\" fill=\"none\" stroke=\"currentColor\"></path></marker>\n<marker id=\"uDiaO3\" viewBox=\"0 0 16 10\" refX=\"1\" refY=\"5\" markerWidth=\"16\" markerHeight=\"10\" orient=\"auto\"><path d=\"M0 5 L8 0 L16 5 L8 10 Z\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></path></marker>\n<marker id=\"uDiaF3\" viewBox=\"0 0 16 10\" refX=\"1\" refY=\"5\" markerWidth=\"16\" markerHeight=\"10\" orient=\"auto\"><path d=\"M0 5 L8 0 L16 5 L8 10 Z\" fill=\"currentColor\"></path></marker>\n</defs><g><rect x=\"20\" y=\"20\" width=\"150\" height=\"87\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></rect><text x=\"95.0\" y=\"38\" text-anchor=\"middle\" font-weight=\"700\">Adherent</text><line x1=\"20\" y1=\"46\" x2=\"170\" y2=\"46\" stroke=\"currentColor\"></line><text x=\"26\" y=\"61\" font-size=\"11\">- nom : String</text><text x=\"26\" y=\"76\" font-size=\"11\">- numCarte : int</text><line x1=\"20\" y1=\"84\" x2=\"170\" y2=\"84\" stroke=\"currentColor\"></line><text x=\"26\" y=\"99\" font-size=\"11\">+ emprunter()</text></g><g><rect x=\"20\" y=\"200\" width=\"110\" height=\"59\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></rect><text x=\"75.0\" y=\"218\" text-anchor=\"middle\" font-weight=\"700\">Etudiant</text><line x1=\"20\" y1=\"226\" x2=\"130\" y2=\"226\" stroke=\"currentColor\"></line><text x=\"26\" y=\"241\" font-size=\"11\">- filiere : String</text><line x1=\"20\" y1=\"249\" x2=\"130\" y2=\"249\" stroke=\"currentColor\"></line></g><g><rect x=\"150\" y=\"200\" width=\"110\" height=\"59\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></rect><text x=\"205.0\" y=\"218\" text-anchor=\"middle\" font-weight=\"700\">Enseignant</text><line x1=\"150\" y1=\"226\" x2=\"260\" y2=\"226\" stroke=\"currentColor\"></line><text x=\"156\" y=\"241\" font-size=\"11\">- grade : String</text><line x1=\"150\" y1=\"249\" x2=\"260\" y2=\"249\" stroke=\"currentColor\"></line></g><g><rect x=\"330\" y=\"20\" width=\"150\" height=\"87\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></rect><text x=\"405.0\" y=\"38\" text-anchor=\"middle\" font-weight=\"700\">Livre</text><line x1=\"330\" y1=\"46\" x2=\"480\" y2=\"46\" stroke=\"currentColor\"></line><text x=\"336\" y=\"61\" font-size=\"11\">- titre : String</text><text x=\"336\" y=\"76\" font-size=\"11\">- isbn : String</text><line x1=\"330\" y1=\"84\" x2=\"480\" y2=\"84\" stroke=\"currentColor\"></line><text x=\"336\" y=\"99\" font-size=\"11\">+ estDispo() : bool</text></g><g><rect x=\"330\" y=\"200\" width=\"150\" height=\"59\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></rect><text x=\"405.0\" y=\"218\" text-anchor=\"middle\" font-weight=\"700\">Exemplaire</text><line x1=\"330\" y1=\"226\" x2=\"480\" y2=\"226\" stroke=\"currentColor\"></line><text x=\"336\" y=\"241\" font-size=\"11\">- etat : String</text><line x1=\"330\" y1=\"249\" x2=\"480\" y2=\"249\" stroke=\"currentColor\"></line></g><g><rect x=\"530\" y=\"20\" width=\"100\" height=\"59\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></rect><text x=\"580.0\" y=\"38\" text-anchor=\"middle\" font-weight=\"700\">Rayon</text><line x1=\"530\" y1=\"46\" x2=\"630\" y2=\"46\" stroke=\"currentColor\"></line><text x=\"536\" y=\"61\" font-size=\"11\">- code : String</text><line x1=\"530\" y1=\"69\" x2=\"630\" y2=\"69\" stroke=\"currentColor\"></line></g><g><rect x=\"530\" y=\"200\" width=\"100\" height=\"59\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></rect><text x=\"580.0\" y=\"218\" text-anchor=\"middle\" font-weight=\"700\">Bibliotheque</text><line x1=\"530\" y1=\"226\" x2=\"630\" y2=\"226\" stroke=\"currentColor\"></line><text x=\"536\" y=\"241\" font-size=\"11\">- nom : String</text><line x1=\"530\" y1=\"249\" x2=\"630\" y2=\"249\" stroke=\"currentColor\"></line></g><path d=\"M75 200 L75 175 L95 175 L95 112\" fill=\"none\" stroke=\"currentColor\" marker-end=\"url(#uTri3)\"></path><path d=\"M205 200 L205 175 L95 175\" fill=\"none\" stroke=\"currentColor\"></path><path d=\"M170 60 L292 60 L292 250 L330 250\" fill=\"none\" stroke=\"currentColor\"></path><text x=\"176\" y=\"54\" font-size=\"11\">0..1</text><text x=\"304\" y=\"244\" font-size=\"11\">0..3</text><text x=\"230\" y=\"150\" font-size=\"11\" font-style=\"italic\">emprunte</text><line x1=\"405\" y1=\"200\" x2=\"405\" y2=\"112\" stroke=\"currentColor\"></line><text x=\"410\" y=\"125\" font-size=\"11\">1</text><text x=\"410\" y=\"195\" font-size=\"11\">1..*</text><text x=\"412\" y=\"160\" font-size=\"11\" font-style=\"italic\">a pour copies</text><path d=\"M530 60 L480 60\" stroke=\"currentColor\" marker-start=\"url(#uDiaO3)\"></path><text x=\"488\" y=\"54\" font-size=\"11\">*</text><text x=\"520\" y=\"54\" font-size=\"11\">1</text><path d=\"M580 200 L580 102\" stroke=\"currentColor\" marker-start=\"url(#uDiaF3)\"></path><text x=\"585\" y=\"120\" font-size=\"11\">*</text><text x=\"585\" y=\"194\" font-size=\"11\">1</text><rect x=\"200\" y=\"292\" width=\"140\" height=\"44\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></rect><text x=\"270\" y=\"308\" text-anchor=\"middle\" font-weight=\"700\">Emprunt</text><line x1=\"200\" y1=\"314\" x2=\"340\" y2=\"314\" stroke=\"currentColor\"></line><text x=\"206\" y=\"329\" font-size=\"11\">- dateRetour : Date</text><line x1=\"270\" y1=\"292\" x2=\"292\" y2=\"232\" stroke=\"currentColor\" stroke-dasharray=\"4 3\"></line></svg></div><p class=\"xcap\">Lis-le à voix haute : un Étudiant <b>est un</b> Adhérent (héritage) ; un adhérent emprunte <b>de 0 à 3</b> exemplaires, chaque exemplaire est emprunté par <b>au plus un</b> adhérent ; l'emprunt porte sa date de retour (classe-association) ; un livre a 1 ou plusieurs exemplaires ; un rayon <b>regroupe</b> des livres (agrégation) ; la bibliothèque <b>est composée</b> de rayons (composition).</p><div class=\"xfig\"><svg viewBox=\"0 0 640 185\" role=\"img\" aria-label=\"légende des relations\" style=\"width:100%;min-width:520px;color:var(--ink)\" font-family=\"var(--f-body),system-ui,sans-serif\" font-size=\"12\"><defs>\n<marker id=\"uTri2\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0 L12 6 L0 12 Z\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></path></marker>\n<marker id=\"uArr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 Z\" fill=\"currentColor\"></path></marker>\n<marker id=\"uOpen2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10\" fill=\"none\" stroke=\"currentColor\"></path></marker>\n<marker id=\"uDiaO2\" viewBox=\"0 0 16 10\" refX=\"1\" refY=\"5\" markerWidth=\"16\" markerHeight=\"10\" orient=\"auto\"><path d=\"M0 5 L8 0 L16 5 L8 10 Z\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></path></marker>\n<marker id=\"uDiaF2\" viewBox=\"0 0 16 10\" refX=\"1\" refY=\"5\" markerWidth=\"16\" markerHeight=\"10\" orient=\"auto\"><path d=\"M0 5 L8 0 L16 5 L8 10 Z\" fill=\"currentColor\"></path></marker>\n</defs><line x1=\"20\" y1=\"25\" x2=\"120\" y2=\"25\" stroke=\"currentColor\"></line><text x=\"140\" y=\"29\">association (relation durable, avec multiplicités)</text><line x1=\"20\" y1=\"60\" x2=\"120\" y2=\"60\" stroke=\"currentColor\" marker-start=\"url(#uDiaO2)\"></line><text x=\"140\" y=\"64\">agrégation ◇ côté « tout » : la partie peut vivre seule (un livre sans rayon)</text><line x1=\"20\" y1=\"95\" x2=\"120\" y2=\"95\" stroke=\"currentColor\" marker-start=\"url(#uDiaF2)\"></line><text x=\"140\" y=\"99\">composition ◆ côté « tout » : la partie meurt avec le tout (rayon détruit avec la bibliothèque)</text><line x1=\"20\" y1=\"130\" x2=\"120\" y2=\"130\" stroke=\"currentColor\" marker-end=\"url(#uTri2)\"></line><text x=\"140\" y=\"134\">héritage : la flèche triangle vide pointe vers la classe mère</text><line x1=\"20\" y1=\"165\" x2=\"120\" y2=\"165\" stroke=\"currentColor\" stroke-dasharray=\"5 4\" marker-end=\"url(#uOpen2)\"></line><text x=\"140\" y=\"169\">dépendance (lien faible, temporaire)</text></svg></div><div class=\"xtrap\"><b>Piège</b> Les multiplicités se lisent <b>à l'autre bout</b> : le « 0..3 » écrit à côté de Exemplaire dit combien d'exemplaires <b>un</b> adhérent peut avoir. Et le losange se place toujours côté <b>tout</b>, jamais côté partie.</div><details class=\"xchk\"><summary>À toi : 3 questions éclair</summary><ol><li>Un exemplaire peut-il exister sans livre ? <i>Réponse : non dans ce modèle : multiplicité 1 côté Livre.</i></li><li>Pourquoi Emprunt est-il une classe-association ? <i>Réponse : la date de retour n'appartient ni à l'adhérent ni à l'exemplaire, mais à leur lien.</i></li><li>Que signifient « - » et « + » devant un attribut ? <i>Réponse : privé et public (visibilité).</i></li></ol></details></section><p class=\"fichelab\">Le cours du prof (à retenir)</p>\n\n  <div class=\"prose\">\n  <h2>1. Objet et classe</h2>\n  <p>Un <b>objet</b> est obtenu par <b>instanciation</b> d’une classe. Il est caractérisé par <span class=\"src\">diapo 41</span> :</p>\n  <ul>\n    <li>un <b>état</b> : sa structure, c’est-à-dire les valeurs de ses attributs ;</li>\n    <li>des <b>comportements</b> : ses méthodes ;</li>\n    <li>une <b>identité</b> : une référence qui le distingue de tout autre objet, même avec les mêmes valeurs.</li>\n  </ul>\n  <p>Une <b>classe</b> est un regroupement d’objets similaires. Elle représente une vue statique du système. Son nom commence par une <b>majuscule</b> et se met au singulier (<code>Client</code>, pas <code>clients</code>). <span class=\"src\">diapo 42</span></p>\n  <p>Deux sortes de classes ne peuvent pas avoir d’instance :</p>\n  <ul>\n    <li>la <b>classe abstraite</b> : elle contient des méthodes abstraites (déclarées mais non définies) ;</li>\n    <li>l’<b>interface</b> : elle ne contient pas d’attributs (seulement des constantes éventuelles) et toutes ses méthodes sont abstraites.</li>\n  </ul>\n\n  <h2>2. Dessiner une classe</h2>\n  <p>Une classe est un rectangle en <b>trois compartiments</b> : le nom, les attributs, les opérations. Les compartiments peuvent être omis s’ils ne sont pas pertinents dans le diagramme. <span class=\"src\">diapo 43</span></p>\n  </div>\n  <figure class=\"dgw\" data-d=\"c_anatomy\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"71 4 582 277\" width=\"582\" data-w=\"582\" style=\"max-width: 100%; height: auto;\"><g><g></g><g><polyline points=\"438,46.527363184079604 118,72\" class=\"dg-l dg-nofill dg-dot\"></polyline><polyline points=\"419,117.05 300,123\" class=\"dg-l dg-nofill dg-dot\"></polyline><polyline points=\"428,169.0909090909091 300,140\" class=\"dg-l dg-nofill dg-dot\"></polyline><polyline points=\"428,193.76363636363635 300,199\" class=\"dg-l dg-nofill dg-dot\"></polyline><polyline points=\"478.57142857142856,237.5 320,182\" class=\"dg-l dg-nofill dg-dot\"></polyline></g><g><rect x=\"85.5\" y=\"29.5\" width=\"229\" height=\"181\" class=\"dg-box\"></rect><text x=\"200\" y=\"45.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Personne</text><line x1=\"85.5\" y1=\"58.5\" x2=\"314.5\" y2=\"58.5\" class=\"dg-l\"></line><text x=\"94.5\" y=\"72\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">- nom : String</text><text x=\"94.5\" y=\"89\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">- prénom : String</text><text x=\"94.5\" y=\"106\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">- dateNaissance : Date</text><text x=\"94.5\" y=\"123\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">/ âge : int</text><text x=\"94.5\" y=\"140\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\" text-decoration=\"underline\">- nbPersonnes : int = 0</text><line x1=\"85.5\" y1=\"151.5\" x2=\"314.5\" y2=\"151.5\" class=\"dg-l\"></line><text x=\"94.5\" y=\"165\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">+ getNom() : String</text><text x=\"94.5\" y=\"182\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">+ changerAdresse(adr : String) : void</text><text x=\"94.5\" y=\"199\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\" text-decoration=\"underline\">+ getNbPersonnes() : int</text><path d=\"M438 18 H592 L602 28 V62 H438 Z\" class=\"dg-note\"></path><path d=\"M592 18 V28 H602\" class=\"dg-l\"></path><text x=\"450\" y=\"32\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12\" font-weight=\"400\">Visibilité : + public, - privé,</text><text x=\"450\" y=\"47\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12\" font-weight=\"400\"># protégé, ~ paquetage</text><path d=\"M419 90 H611 L621 100 V134 H419 Z\" class=\"dg-note\"></path><path d=\"M611 90 V100 H621\" class=\"dg-l\"></path><text x=\"431\" y=\"104\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12\" font-weight=\"400\">Attribut dérivé « / » :</text><text x=\"431\" y=\"119\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12\" font-weight=\"400\">calculé à partir de dateNaissance</text><path d=\"M428 168 H602 L612 178 V212 H428 Z\" class=\"dg-note\"></path><path d=\"M602 168 V178 H612\" class=\"dg-l\"></path><text x=\"440\" y=\"182\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12\" font-weight=\"400\">Souligné = membre de classe</text><text x=\"440\" y=\"197\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12\" font-weight=\"400\">(static), partagé par tous</text><path d=\"M401 237.5 H629 L639 247.5 V266.5 H401 Z\" class=\"dg-note\"></path><path d=\"M629 237.5 V247.5 H639\" class=\"dg-l\"></path><text x=\"413\" y=\"251.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12\" font-weight=\"400\">nomOpération(paramètres) : typeRetour</text></g></g></svg></div><figcaption>Anatomie d’une classe. Les visibilités (+, -, #, ~) sont un complément : les diapos ne les présentent pas mais le TP1 attend des « types appropriés » et le prof les utilise dans ses exemples.</figcaption></figure>\n  <div class=\"prose\">\n  <h3>Les attributs <span class=\"src\">diapo 44</span></h3>\n  <p>Un attribut est une propriété élémentaire de la classe ; il prend une valeur pour chaque objet. Syntaxe :</p>\n  <p><code>visibilité nomAttribut : Type = valeurInitiale</code></p>\n  <ul>\n    <li>Les noms d’attributs d’une classe sont <b>uniques</b>.</li>\n    <li>Le type (entier, texte…) dépend des types du langage d’implémentation. À l’examen, <code>int</code>, <code>float</code>, <code>String</code>, <code>boolean</code>, <code>Date</code> sont toujours acceptés.</li>\n    <li>Un attribut <b>dérivé</b>, calculable à partir d’autres attributs, se note avec une barre oblique : <code>/âge</code> (calculé depuis <code>dateNaissance</code>), <code>/ancienneté</code>.</li>\n    <li>Un attribut <b>de classe</b> (statique, partagé par tous les objets) est <u>souligné</u>.</li>\n  </ul>\n  <h3>Les opérations <span class=\"src\">diapo 46</span></h3>\n  <p><code>visibilité nomOpération(param1 : Type, param2 : Type) : TypeRetour</code></p>\n  <ul>\n    <li>Une opération (même nom et mêmes types de paramètres) doit être <b>unique</b>.</li>\n    <li>Même nom avec des paramètres différents : l’opération est <b>surchargée</b>.</li>\n    <li>Opération <b>abstraite</b> (non implémentée) : en <i>italique</i>.</li>\n    <li>Opération <b>de classe</b> (statique) : <u>soulignée</u>.</li>\n  </ul>\n  <div class=\"box plus\"><span class=\"tag\">Complément : visibilités</span>\n    <div class=\"tw\"><table>\n      <tbody><tr><th>Symbole</th><th>Visibilité</th><th>Qui y a accès</th></tr>\n      <tr><td><code>+</code></td><td>public</td><td>tout le monde</td></tr>\n      <tr><td><code>-</code></td><td>privé</td><td>la classe seule</td></tr>\n      <tr><td><code>#</code></td><td>protégé</td><td>la classe et ses sous-classes</td></tr>\n      <tr><td><code>~</code></td><td>paquetage</td><td>les classes du même paquetage</td></tr>\n    </tbody></table></div>\n    <p>Bonne pratique (encapsulation) : attributs <code>-</code>, opérations <code>+</code>.</p>\n  </div>\n  </div>\n  <figure class=\"dgw\" data-d=\"c_abstract\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"76 -14 590 316\" width=\"590\" data-w=\"590\" style=\"max-width: 100%; height: auto;\"><g><g></g><g><polyline points=\"252.66666666666666,192 187.33333333333334,108\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"189.4382725796702,125.36574878227918 187.33333333333334,108 203.64661249244406,114.3148177390106\" class=\"dg-hollow\"></polygon><text x=\"228.6828743911396\" y=\"141.24665325133589\" text-anchor=\"middle\" class=\"dg-t dg-halo \" font-size=\"12\"><tspan x=\"228.6828743911396\" dy=\"4\">hérite de</tspan></text><polyline points=\"327.3333333333333,192 396.94444444444446,102.5\" class=\"dg-l dg-nofill dg-dash\"></polyline><polygon points=\"380.6311652853337,108.8148177390106 396.94444444444446,102.5 394.8395051981076,119.86574878227918\" class=\"dg-hollow\"></polygon><text x=\"353.4560144977493\" y=\"138.49665325133589\" text-anchor=\"middle\" class=\"dg-t dg-halo \" font-size=\"12\"><tspan x=\"353.4560144977493\" dy=\"4\">réalise</tspan></text><polyline points=\"560,190.5 560,0 180,0 180,30\" class=\"dg-l dg-nofill dg-dot\"></polyline></g><g><rect x=\"90\" y=\"12\" width=\"120\" height=\"96\" class=\"dg-box\"></rect><text x=\"150\" y=\"28\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\" font-style=\"italic\">Forme</text><line x1=\"90\" y1=\"41\" x2=\"210\" y2=\"41\" class=\"dg-l\"></line><text x=\"99\" y=\"54.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\"># couleur : String</text><line x1=\"90\" y1=\"66\" x2=\"210\" y2=\"66\" class=\"dg-l\"></line><text x=\"99\" y=\"79.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\" font-style=\"italic\">+ aire() : float</text><text x=\"99\" y=\"96.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">+ afficher() : void</text><rect x=\"364\" y=\"17.5\" width=\"132\" height=\"85\" class=\"dg-box\"></rect><text x=\"430\" y=\"33.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"11\" font-weight=\"400\">«interface»</text><text x=\"430\" y=\"50.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Dessinable</text><line x1=\"364\" y1=\"63.5\" x2=\"496\" y2=\"63.5\" class=\"dg-l\"></line><line x1=\"364\" y1=\"77.5\" x2=\"496\" y2=\"77.5\" class=\"dg-l\"></line><text x=\"373\" y=\"91\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\" font-style=\"italic\">+ dessiner() : void</text><rect x=\"228.5\" y=\"192\" width=\"123\" height=\"96\" class=\"dg-box\"></rect><text x=\"290\" y=\"208\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Cercle</text><line x1=\"228.5\" y1=\"221\" x2=\"351.5\" y2=\"221\" class=\"dg-l\"></line><text x=\"237.5\" y=\"234.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">- rayon : float</text><line x1=\"228.5\" y1=\"246\" x2=\"351.5\" y2=\"246\" class=\"dg-l\"></line><text x=\"237.5\" y=\"259.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">+ aire() : float</text><text x=\"237.5\" y=\"276.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">+ dessiner() : void</text><path d=\"M468.5 190.5 H641.5 L651.5 200.5 V249.5 H468.5 Z\" class=\"dg-note\"></path><path d=\"M641.5 190.5 V200.5 H651.5\" class=\"dg-l\"></path><text x=\"480.5\" y=\"204.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12\" font-weight=\"400\">Nom et opérations abstraites</text><text x=\"480.5\" y=\"219.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12\" font-weight=\"400\">en italique. Une classe</text><text x=\"480.5\" y=\"234.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12\" font-weight=\"400\">abstraite n’a pas d’instance.</text></g></g></svg></div><figcaption>Classe abstraite (nom et opération abstraite en italique), interface (stéréotype «interface»), héritage (trait plein, triangle vide) et réalisation d’interface (trait pointillé, triangle vide).</figcaption></figure>\n\n  <div class=\"prose\">\n  <h2>3. Les relations entre classes</h2>\n  <p>Une relation est un modèle (« template ») pour une connexion entre des instances. Le prof les range ainsi <span class=\"src\">diapo 48</span> :</p>\n  <ul>\n    <li><b>Dépendance</b> : relation d’exécution entre classes (une classe en utilise une autre de façon ponctuelle) ;</li>\n    <li><b>Association</b> : relation durable et cohérente ;</li>\n    <li><b>Agrégation</b> et <b>composition</b> : relations de tout et partie, cas particuliers de l’association ;</li>\n    <li>et à part, la <b>généralisation</b> (héritage).</li>\n  </ul>\n  </div>\n  <figure class=\"dgw\" data-d=\"c_dep\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"-53 -1 537 82\" width=\"537\" data-w=\"537\" style=\"max-width: 100%; height: auto;\"><g><g></g><g><polyline points=\"158.5,40 370,40\" class=\"dg-l dg-nofill dg-dash\"></polyline><polyline points=\"359,34 370,40 359,46\" class=\"dg-l\"></polyline><text x=\"264.25\" y=\"27\" text-anchor=\"middle\" class=\"dg-t dg-halo \" font-size=\"12\"><tspan x=\"264.25\" dy=\"4\">«utilise»</tspan></text></g><g><rect x=\"-38.5\" y=\"13\" width=\"197\" height=\"54\" class=\"dg-box\"></rect><text x=\"60\" y=\"29\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Facture</text><line x1=\"-38.5\" y1=\"42\" x2=\"158.5\" y2=\"42\" class=\"dg-l\"></line><text x=\"-29.5\" y=\"55.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">imprimer(i : Imprimante) : void</text><rect x=\"370\" y=\"25.5\" width=\"100\" height=\"29\" class=\"dg-box\"></rect><text x=\"420\" y=\"41.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Imprimante</text></g></g></svg></div><figcaption>Dépendance : flèche pointillée ouverte. Facture n’a pas d’imprimante en attribut ; elle en reçoit une en paramètre.</figcaption></figure>\n\n  <div class=\"prose\">\n  <h2>4. L’association</h2>\n  <p>Une association est une relation entre deux classes (<b>binaire</b>) ou plus (<b>n-aire</b>) au même niveau hiérarchique. Elle indique qu’il peut exister des <b>liens</b> entre les objets de ces classes. <span class=\"src\">diapo 49</span></p>\n  <p>Elle peut porter :</p>\n  <ul>\n    <li>un <b>nom</b> (souvent un verbe), éventuellement vide, avec un <b>sens de lecture</b> ▸ ;</li>\n    <li>des <b>rôles</b> à chaque extrémité (le rôle que joue la classe dans l’association) ;</li>\n    <li>des <b>multiplicités</b> à chaque extrémité.</li>\n  </ul>\n  </div>\n  <figure class=\"dgw\" data-d=\"c_assoc\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"23 26 516 70\" width=\"516\" data-w=\"516\" style=\"max-width: 100%; height: auto;\"><g><g></g><g><polyline points=\"122.5,60 435,60\" class=\"dg-l dg-nofill\"></polyline><text x=\"278.75\" y=\"47\" text-anchor=\"middle\" class=\"dg-t dg-halo \" font-size=\"12\"><tspan x=\"278.75\" dy=\"4\">travaille pour ▸</tspan></text><text x=\"129.5\" y=\"53\" text-anchor=\"start\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"129.5\" dy=\"4\">1..*</tspan></text><text x=\"129.5\" y=\"75\" text-anchor=\"start\" class=\"dg-t dg-halo \" font-size=\"11\" font-style=\"italic\"><tspan x=\"129.5\" dy=\"4\">employé</tspan></text><text x=\"428\" y=\"53\" text-anchor=\"end\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"428\" dy=\"4\">0..1</tspan></text><text x=\"428\" y=\"75\" text-anchor=\"end\" class=\"dg-t dg-halo \" font-size=\"11\" font-style=\"italic\"><tspan x=\"428\" dy=\"4\">employeur</tspan></text></g><g><rect x=\"37.5\" y=\"45.5\" width=\"85\" height=\"29\" class=\"dg-box\"></rect><text x=\"80\" y=\"61.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Personne</text><rect x=\"435\" y=\"45.5\" width=\"90\" height=\"29\" class=\"dg-box\"></rect><text x=\"480\" y=\"61.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Entreprise</text></g></g></svg></div><figcaption>Association binaire nommée, avec rôles et multiplicités.</figcaption></figure>\n  <div class=\"prose\">\n  <h3>Les multiplicités <span class=\"src\">diapo 50</span></h3>\n  <div class=\"tw\"><table>\n    <tbody><tr><th>Notation</th><th>Signification</th></tr>\n    <tr><td><code>1</code> ou <code>1..1</code></td><td>un et un seul</td></tr>\n    <tr><td><code>0..1</code></td><td>zéro ou un</td></tr>\n    <tr><td><code>M..N</code></td><td>de M à N (entiers naturels)</td></tr>\n    <tr><td><code>*</code> ou <code>0..*</code></td><td>de zéro à plusieurs</td></tr>\n    <tr><td><code>1..*</code></td><td>de un à plusieurs</td></tr>\n    <tr><td><code>N</code></td><td>exactement N</td></tr>\n  </tbody></table></div>\n  <div class=\"box retenir\"><span class=\"tag\">La règle de lecture qui évite 80 % des erreurs</span>\n    <p>La multiplicité écrite à côté d’une classe dit <b>combien d’objets de cette classe</b> sont liés à <b>un</b> objet de l’autre classe. On lit donc en partant de la classe d’en face :</p>\n    <p>« <b>Une</b> Personne travaille pour <b>0..1</b> Entreprise » (on lit le <code>0..1</code> côté Entreprise).<br>« <b>Une</b> Entreprise emploie <b>1..*</b> Personnes » (on lit le <code>1..*</code> côté Personne).</p>\n    <p>Méthode d’examen : pour chaque association, écris ces deux phrases au brouillon. Si l’une d’elles est fausse par rapport à l’énoncé, ta multiplicité est mal placée.</p>\n  </div>\n  <h3>Association réflexive</h3>\n  <p>Une classe peut être associée à elle-même. Les rôles deviennent alors indispensables pour savoir qui est qui.</p>\n  </div>\n  <figure class=\"dgw\" data-d=\"c_reflex\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"61 -44 348 165\" width=\"348\" data-w=\"348\" style=\"max-width: 100%; height: auto;\"><g><g></g><g><polyline points=\"167,72 300,72 300,-30 120,-30 120,53\" class=\"dg-l dg-nofill\"></polyline><text x=\"356\" y=\"24\" text-anchor=\"middle\" class=\"dg-t dg-halo \" font-size=\"12\"><tspan x=\"356\" dy=\"4\">est parent de ▸</tspan></text><text x=\"174\" y=\"65\" text-anchor=\"start\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"174\" dy=\"4\">0..2</tspan></text><text x=\"174\" y=\"87\" text-anchor=\"start\" class=\"dg-t dg-halo \" font-size=\"11\" font-style=\"italic\"><tspan x=\"174\" dy=\"4\">parent</tspan></text><text x=\"127\" y=\"42\" text-anchor=\"start\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"127\" dy=\"4\">*</tspan></text><text x=\"113\" y=\"42\" text-anchor=\"end\" class=\"dg-t dg-halo \" font-size=\"11\" font-style=\"italic\"><tspan x=\"113\" dy=\"4\">enfant</tspan></text></g><g><rect x=\"75\" y=\"53\" width=\"90\" height=\"54\" class=\"dg-box\"></rect><text x=\"120\" y=\"69\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Personne</text><line x1=\"75\" y1=\"82\" x2=\"165\" y2=\"82\" class=\"dg-l\"></line><text x=\"84\" y=\"95.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">nom : String</text></g></g></svg></div><figcaption>Une personne a 0 à 2 parents (rôle parent) et un nombre quelconque d’enfants.</figcaption></figure>\n  <div class=\"prose\">\n  <h3>Association n-aire <span class=\"src\">diapos 52–53</span></h3>\n  <p>Une association entre trois classes ou plus se dessine avec un <b>losange</b> relié à chaque classe. Exemple du cours : une séance réunit un groupe, un enseignant et une salle.</p>\n  </div>\n  <figure class=\"dgw\" data-d=\"c_nary\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"10 2 472 227\" width=\"472\" data-w=\"472\" style=\"max-width: 100%; height: auto;\"><g><g></g><g><polyline points=\"225,60 95.5,60\" class=\"dg-l dg-nofill\"></polyline><text x=\"102.5\" y=\"53\" text-anchor=\"start\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"102.5\" dy=\"4\">*</tspan></text><polyline points=\"255,60 372,60\" class=\"dg-l dg-nofill\"></polyline><text x=\"365\" y=\"53\" text-anchor=\"end\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"365\" dy=\"4\">*</tspan></text><polyline points=\"240,75 240,185.5\" class=\"dg-l dg-nofill\"></polyline><text x=\"247\" y=\"174.5\" text-anchor=\"start\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"247\" dy=\"4\">*</tspan></text></g><g><rect x=\"24.5\" y=\"45.5\" width=\"71\" height=\"29\" class=\"dg-box\"></rect><text x=\"60\" y=\"61.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Groupe</text><rect x=\"372\" y=\"45.5\" width=\"96\" height=\"29\" class=\"dg-box\"></rect><text x=\"420\" y=\"61.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Enseignant</text><rect x=\"205\" y=\"185.5\" width=\"70\" height=\"29\" class=\"dg-box\"></rect><text x=\"240\" y=\"201.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Salle</text><polygon points=\"240,45 255,60 240,75 225,60\" class=\"dg-box\"></polygon><text x=\"240\" y=\"25\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\" font-style=\"italic\">Séance</text></g></g></svg></div><figcaption>Association ternaire. La diapo 53 montre qu’on peut la remplacer par une classe Séance reliée aux trois classes avec la multiplicité 1 de chaque côté.</figcaption></figure>\n  <div class=\"box piege\"><span class=\"tag\">Piège</span><p>Pour une n-aire, la multiplicité d’une extrémité se l
