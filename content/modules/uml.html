"34\" r=\"8\" class=\"dg-box\"></circle><path d=\"M700 42 V62 M687 49 H713 M700 62 L689 78 M700 62 L711 78\" class=\"dg-l\"></path><text x=\"700\" y=\"92\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"700\">Banque</text><text x=\"700\" y=\"18\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"10.5\" font-weight=\"400\">«secondaire»</text><ellipse cx=\"255\" cy=\"70\" rx=\"82.32000000000001\" ry=\"20.5\" class=\"dg-box\"></ellipse><text x=\"255\" y=\"70\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">Retirer de l’argent</text><ellipse cx=\"255\" cy=\"170\" rx=\"98.82000000000001\" ry=\"20.5\" class=\"dg-box\"></ellipse><text x=\"255\" y=\"170\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">Consulter les comptes</text><ellipse cx=\"255\" cy=\"280\" rx=\"96.18\" ry=\"37.75\" class=\"dg-box\"></ellipse><text x=\"255\" y=\"265\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"700\">Effectuer un virement</text><line x1=\"174.2088\" y1=\"274\" x2=\"335.7912\" y2=\"274\" class=\"dg-l\"></line><text x=\"255\" y=\"282\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"10.5\" font-weight=\"400\" font-style=\"italic\">points d’extension :</text><text x=\"255\" y=\"295\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"11\" font-weight=\"400\">vérification solde</text><ellipse cx=\"500\" cy=\"150\" rx=\"65.82\" ry=\"20.5\" class=\"dg-box\"></ellipse><text x=\"500\" y=\"150\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">S’authentifier</text><ellipse cx=\"500\" cy=\"310\" rx=\"73.74000000000001\" ry=\"20.5\" class=\"dg-box\"></ellipse><text x=\"500\" y=\"310\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">Vérifier le solde</text></g></g></svg></div><figcaption>Les éléments du diagramme réunis (inspiré des diapos 105 et 114) : système, acteur principal, acteur secondaire, association, include, extend avec condition et point d’extension.</figcaption></figure>\n\n  <div class=\"prose\">\n  <h2>4. Les relations entre cas d’utilisation</h2>\n  <h3>«include» : inclusion obligatoire <span class=\"src\">diapos 106–107</span></h3>\n  <p>Un cas d’utilisation est <b>nécessairement</b> une partie d’un autre. Sert à :</p>\n  <ul><li>décomposer un cas complexe en sous-cas plus simples ;</li><li>factoriser un comportement commun à plusieurs cas.</li></ul>\n  <p>Flèche pointillée <b>du cas de base vers le cas inclus</b>. Exemple : « Emprunt » et « Réservation » incluent tous deux « Identification abonné ».</p>\n  <h3>«extend» : extension optionnelle <span class=\"src\">diapos 108, 110</span></h3>\n  <p>Un cas d’utilisation <b>peut augmenter</b> le comportement d’un autre, sous une <b>condition</b>. L’endroit où l’extension s’insère s’appelle un <b>point d’extension</b>, écrit dans l’ellipse du cas de base.</p>\n  <p>Flèche pointillée <b>de l’extension vers le cas de base</b>. Exemple du cours : « Regarder la liste des livres » étend « Réservation », avant le choix du livre, si l’utilisateur le demande.</p>\n  <h3>Généralisation entre cas <span class=\"src\">diapos 109, 113</span></h3>\n  <p>Relation « est un » : « Vérification par carte » et « Vérification par mot de passe » sont des spécialisations de « Identification abonné ». Flèche à triangle vide vers le cas général.</p>\n  </div>\n  <figure class=\"dgw\" data-d=\"u_gens\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"0 -8 615 372\" width=\"615\" data-w=\"615\" style=\"max-width: 100%; height: auto;\"><g><g></g><g><polyline points=\"60,138 60,83\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"51,98 60,83 69,98\" class=\"dg-hollow\"></polygon><polyline points=\"60,273 60,218\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"51,233 60,218 69,233\" class=\"dg-hollow\"></polygon><polyline points=\"481.18432004559514,175.48483371300745 360.7756342357497,99.43724267521033\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"368.65203085872247,115.0565376733088 360.7756342357497,99.43724267521033 378.2639047037061,99.8377374187513\" class=\"dg-hollow\"></polygon><polyline points=\"296.18739282422564,232.1567322909845 325.44947671993225,100.47735476030499\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"313.4098363109968,113.16778654269638 325.44947671993225,100.47735476030499 330.981203394308,117.07253478343219\" class=\"dg-hollow\"></polygon></g><g><circle cx=\"60\" cy=\"14\" r=\"8\" class=\"dg-box\"></circle><path d=\"M60 22 V42 M47 29 H73 M60 42 L49 58 M60 42 L71 58\" class=\"dg-l\"></path><text x=\"60\" y=\"72\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"700\">Abonné</text><circle cx=\"60\" cy=\"149\" r=\"8\" class=\"dg-box\"></circle><path d=\"M60 157 V177 M47 164 H73 M60 177 L49 193 M60 177 L71 193\" class=\"dg-l\"></path><text x=\"60\" y=\"207\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"700\">Bibliothécaire</text><circle cx=\"60\" cy=\"284\" r=\"8\" class=\"dg-box\"></circle><path d=\"M60 292 V312 M47 299 H73 M60 312 L49 328 M60 312 L71 328\" class=\"dg-l\"></path><text x=\"60\" y=\"342\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"700\">Administrateur</text><ellipse cx=\"330\" cy=\"80\" rx=\"96.84\" ry=\"20.5\" class=\"dg-box\"></ellipse><text x=\"330\" y=\"80\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">Identification abonné</text><ellipse cx=\"520\" cy=\"200\" rx=\"80.34\" ry=\"28\" class=\"dg-box\"></ellipse><text x=\"520\" y=\"192.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">Vérification</text><text x=\"520\" y=\"207.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">par mot de passe</text><ellipse cx=\"290\" cy=\"260\" rx=\"58.56\" ry=\"28\" class=\"dg-box\"></ellipse><text x=\"290\" y=\"252.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">Vérification</text><text x=\"290\" y=\"267.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">par carte</text></g></g></svg></div><figcaption>Généralisation d’acteurs (un bibliothécaire est un abonné, un administrateur est un bibliothécaire) et de cas d’utilisation.</figcaption></figure>\n  <div class=\"tw\"><table>\n    <tbody><tr><th>Relation</th><th>Sens de la flèche</th><th>Caractère</th><th>Mot-clé à retenir</th></tr>\n    <tr><td><code>«include»</code></td><td>base → inclus</td><td>obligatoire, à chaque exécution</td><td>« a besoin de »</td></tr>\n    <tr><td><code>«extend»</code></td><td>extension → base</td><td>optionnel, sous condition</td><td>« peut ajouter »</td></tr>\n    <tr><td>généralisation</td><td>spécialisé → général (triangle)</td><td>« est une sorte de »</td><td>héritage</td></tr>\n    <tr><td>association acteur–cas</td><td>trait plein, sans flèche</td><td>l’acteur participe</td><td>—</td></tr>\n  </tbody></table></div>\n  <div class=\"box retenir\"><span class=\"tag\">Moyen mnémotechnique</span>\n    <p>La flèche part toujours du cas qui « sait » qu’il y a une relation. Le cas de base sait qu’il <b>inclut</b> l’authentification : la flèche part de lui. Le cas de base ne sait pas qu’on peut l’étendre : c’est l’<b>extension</b> qui le sait, donc la flèche part d’elle.</p>\n  </div>\n  <div class=\"prose\">\n  <h2>5. Les autres éléments</h2>\n  <ul>\n    <li><b>Note</b> : rectangle au coin replié, reliée par un pointillé ; commentaire, corps de méthode ou contrainte. <span class=\"src\">diapo 111</span></li>\n    <li><b>Classeur</b> : rectangle à compartiments qui précise les caractéristiques d’un élément. Les acteurs et les cas d’utilisation sont des classeurs. <span class=\"src\">diapo 112</span></li>\n    <li><b>Multiplicité</b> sur l’association acteur–cas : <code>*</code> plusieurs, <code>n</code> exactement n, <code>n..m</code> entre n et m. <span class=\"src\">diapo 115</span></li>\n  </ul>\n\n  <h2>6. La démarche <span class=\"src\">diapos 116–119</span></h2>\n  <ol>\n    <li>Définir le périmètre du système (le rectangle).</li>\n    <li>Identifier les acteurs : extérieurs au système, ils interagissent directement avec lui (saisie, réception d’informations) ; le nom indique le rôle.</li>\n    <li>Organiser les acteurs par héritage.</li>\n    <li>Pour chaque acteur, chercher ses cas d’utilisation, surtout ceux qui <b>modifient l’état du système</b> ou qui <b>attendent une réponse</b>.</li>\n    <li>Ne pas oublier les variantes (cas d’erreur, cas interdits).</li>\n    <li>Organiser par héritage, inclusion (utilisation) et extension.</li>\n    <li>Documenter les cas complexes (description textuelle).</li>\n  </ol>\n\n  <h2>7. La description textuelle d’un cas <span class=\"src\">diapos 122–125</span></h2>\n  <p>Chaque cas se décrit par des <b>scénarios</b> : la suite logique des interactions, en texte compréhensible par les gens du métier. On précise ce que fait l’acteur et ce que fait le système.</p>\n  <div class=\"tw\"><table>\n    <tbody><tr><th colspan=\"2\">Cas « Réservation d’un livre » (exemple du cours)</th></tr>\n    <tr><td>Préconditions</td><td>Le client est inscrit ; il n’a pas atteint le maximum de réservations ; un exemplaire du livre est enregistré.</td></tr>\n    <tr><td>Scénario nominal</td><td>1. Le système affiche un message d’accueil. 2. Le client choisit l’opération réservation. 3. Le système demande de s’authentifier. 4. Le client donne son identification. 5. Le système demande le titre du livre. 6. Le client précise le livre. 7. Le système confirme qu’un exemplaire est réservé.</td></tr>\n    <tr><td>Variantes</td><td>En (4) client non reconnu : nouvelle demande d’authentification. En (4) mot de passe incorrect : 5 essais, puis interdiction pendant 1 heure. En (4) le client n’a plus le droit de réserver. En (7) le livre n’est pas libre.</td></tr>\n    <tr><td>Postconditions</td><td>Le client a une réservation de plus ; le nombre d’exemplaires disponibles diminue de 1.</td></tr>\n  </tbody></table></div>\n\n  <h2>Pièges du chapitre</h2>\n  <div class=\"box piege\"><span class=\"tag\">Les erreurs qui coûtent des points</span>\n    <ul>\n      <li>Acteur dessiné <b>dans</b> le rectangle du système.</li>\n      <li>Cas d’utilisation trop fins : « Cliquer sur valider », « Saisir le mot de passe » sont des étapes, pas des cas.</li>\n      <li>Sens de l’include ou de l’extend inversé.</li>\n      <li>Include utilisé pour une suite temporelle (« d’abord A, puis B ») : un cas d’utilisation n’est pas un organigramme.</li>\n      <li>Extend sans condition ni point d’extension, alors que l’énoncé donne une condition (« uniquement si le prix dépasse 50 DH »).</li>\n      <li>Flèches entre acteurs et cas : l’association est un trait simple.</li>\n      <li>Oublier le système externe comme acteur secondaire (service de vérification, banque).</li>\n      <li>Oublier la généralisation d’acteurs quand l’énoncé dit « un X peut devenir Y » ou « un Y est un X qui… ».</li>\n    </ul>\n  </div>\n  </div>\n  <h2>Quiz du chapitre 4</h2>\n  \n  <div class=\"row\"><a class=\"btn ghost\" href=\"#tp1\">Faire le TP1 exercice 1</a></div><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 5 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Le diagramme de cas d’utilisation décrit…</div><button class=\"opt\" data-o=\"0\">comment le système fonctionne en interne</button><button class=\"opt\" data-o=\"1\">ce que le système doit faire, sans dire comment</button><button class=\"opt\" data-o=\"2\">l’ordre des messages</button><button class=\"opt\" data-o=\"3\">la structure des données</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Où place-t-on les acteurs ?</div><button class=\"opt\" data-o=\"0\">Dans le rectangle du système</button><button class=\"opt\" data-o=\"1\">Hors du rectangle du système</button><button class=\"opt\" data-o=\"2\">Indifféremment</button><button class=\"opt\" data-o=\"3\">Uniquement à droite</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Sens de la flèche «include» ?</div><button class=\"opt\" data-o=\"0\">Du cas inclus vers le cas de base</button><button class=\"opt\" data-o=\"1\">Du cas de base vers le cas inclus</button><button class=\"opt\" data-o=\"2\">De l’acteur vers le cas</button><button class=\"opt\" data-o=\"3\">Pas de flèche</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Sens de la flèche «extend» ?</div><button class=\"opt\" data-o=\"0\">De l’extension vers le cas de base</button><button class=\"opt\" data-o=\"1\">Du cas de base vers l’extension</button><button class=\"opt\" data-o=\"2\">Double sens</button><button class=\"opt\" data-o=\"3\">Vers l’acteur</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">« Le passager peut, s’il le souhaite, souscrire une assurance si le prix dépasse 50 DH ». Relation ?</div><button class=\"opt\" data-o=\"0\">include</button><button class=\"opt\" data-o=\"1\">extend avec condition</button><button class=\"opt\" data-o=\"2\">généralisation</button><button class=\"opt\" data-o=\"3\">association simple</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\ étape d’interface, pas une fonctionnalité qui apporte un résultat à l’acteur."},{"n":"ch4","q":"Que contient une description textuelle complète d’un cas ?","o":["Classes et attributs","Préconditions, scénario nominal, variantes, postconditions","Seulement le nom de l’acteur","Le code source"],"a":1,"e":"Exemple « Réservation d’un livre », diapos 123–125."}]},{"id":"ch5","t":"Diagramme de séquence","seance":"Cours · diapos 122–128 + compléments","imp":5,"html":"<p class=\"lede\">Il raconte un scénario dans le temps : qui envoie quel message à qui, et dans quel ordre. Le temps s’écoule de haut en bas.</p>\n<section class=\"xpl\"><p class=\"xlab\">Comprendre, en clair · fil rouge : la bibliothèque de la fac</p><div class=\"xana\"><b>L'analogie</b> Un diagramme de séquence, c'est la <b>bande dessinée</b> d'un cas d'utilisation : chaque personnage a sa colonne (ligne de vie), le temps descend, et chaque bulle de dialogue est un message, numéroté dans l'ordre.</div><div class=\"xfig\"><svg viewBox=\"0 0 640 295\" role=\"img\" aria-label=\"diagramme de séquence\" style=\"width:100%;min-width:520px;color:var(--ink)\" font-family=\"var(--f-body),system-ui,sans-serif\" font-size=\"12\"><defs>\n<marker id=\"uTri6\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0 L12 6 L0 12 Z\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></path></marker>\n<marker id=\"uArr6\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 Z\" fill=\"currentColor\"></path></marker>\n<marker id=\"uOpen6\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10\" fill=\"none\" stroke=\"currentColor\"></path></marker>\n<marker id=\"uDiaO6\" viewBox=\"0 0 16 10\" refX=\"1\" refY=\"5\" markerWidth=\"16\" markerHeight=\"10\" orient=\"auto\"><path d=\"M0 5 L8 0 L16 5 L8 10 Z\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></path></marker>\n<marker id=\"uDiaF6\" viewBox=\"0 0 16 10\" refX=\"1\" refY=\"5\" markerWidth=\"16\" markerHeight=\"10\" orient=\"auto\"><path d=\"M0 5 L8 0 L16 5 L8 10 Z\" fill=\"currentColor\"></path></marker>\n</defs><circle cx=\"50\" cy=\"6\" r=\"9\" fill=\"none\" stroke=\"currentColor\"></circle><line x1=\"50\" y1=\"15\" x2=\"50\" y2=\"40\" stroke=\"currentColor\"></line><line x1=\"36\" y1=\"24\" x2=\"64\" y2=\"24\" stroke=\"currentColor\"></line><line x1=\"50\" y1=\"40\" x2=\"38\" y2=\"58\" stroke=\"currentColor\"></line><line x1=\"50\" y1=\"40\" x2=\"62\" y2=\"58\" stroke=\"currentColor\"></line><text x=\"50\" y=\"74\" text-anchor=\"middle\"></text><text x=\"50\" y=\"80\" text-anchor=\"middle\">Adhérent</text><line x1=\"50\" y1=\"84\" x2=\"50\" y2=\"290\" stroke=\"currentColor\" stroke-dasharray=\"4 4\"></line><rect x=\"140\" y=\"10\" width=\"120\" height=\"28\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></rect><text x=\"200\" y=\"29\" text-anchor=\"middle\" text-decoration=\"underline\">: Borne</text><line x1=\"200\" y1=\"38\" x2=\"200\" y2=\"290\" stroke=\"currentColor\" stroke-dasharray=\"4 4\"></line><rect x=\"310\" y=\"10\" width=\"120\" height=\"28\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></rect><text x=\"370\" y=\"29\" text-anchor=\"middle\" text-decoration=\"underline\">: Catalogue</text><line x1=\"370\" y1=\"38\" x2=\"370\" y2=\"290\" stroke=\"currentColor\" stroke-dasharray=\"4 4\"></line><rect x=\"480\" y=\"10\" width=\"120\" height=\"28\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></rect><text x=\"540\" y=\"29\" text-anchor=\"middle\" text-decoration=\"underline\">e : Emprunt</text><line x1=\"540\" y1=\"38\" x2=\"540\" y2=\"290\" stroke=\"currentColor\" stroke-dasharray=\"4 4\"></line><rect x=\"194\" y=\"100\" width=\"12\" height=\"160\" fill=\"var(--accent-soft)\" stroke=\"currentColor\"></rect><rect x=\"364\" y=\"125\" width=\"12\" height=\"40\" fill=\"var(--accent-soft)\" stroke=\"currentColor\"></rect><line x1=\"50\" y1=\"105\" x2=\"192\" y2=\"105\" stroke=\"currentColor\" marker-end=\"url(#uArr6)\"></line><text x=\"60\" y=\"99\" font-size=\"11\">1 : emprunter(isbn)</text><line x1=\"206\" y1=\"130\" x2=\"362\" y2=\"130\" stroke=\"currentColor\" marker-end=\"url(#uArr6)\"></line><text x=\"214\" y=\"124\" font-size=\"11\">2 : estDispo(isbn)</text><line x1=\"362\" y1=\"160\" x2=\"206\" y2=\"160\" stroke=\"currentColor\" stroke-dasharray=\"5 4\" marker-end=\"url(#uOpen6)\"></line><text x=\"250\" y=\"155\" font-size=\"11\">vrai</text><rect x=\"120\" y=\"175\" width=\"500\" height=\"80\" fill=\"none\" stroke=\"currentColor\"></rect><path d=\"M120 175 L170 175 L170 188 L160 195 L120 195 Z\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></path><text x=\"128\" y=\"189\" font-size=\"10\" font-weight=\"700\">alt</text><text x=\"178\" y=\"190\" font-size=\"10\">[disponible]</text><line x1=\"206\" y1=\"210\" x2=\"478\" y2=\"210\" stroke=\"currentColor\" marker-end=\"url(#uArr6)\"></line><text x=\"300\" y=\"204\" font-size=\"11\">3 : «create»</text><rect x=\"534\" y=\"205\" width=\"12\" height=\"20\" fill=\"var(--accent-soft)\" stroke=\"currentColor\"></rect><line x1=\"120\" y1=\"230\" x2=\"620\" y2=\"230\" stroke=\"currentColor\" stroke-dasharray=\"6 3\"></line><text x=\"570\" y=\"245\" font-size=\"10\">[sinon]</text><line x1=\"194\" y1=\"248\" x2=\"54\" y2=\"248\" stroke=\"currentColor\" stroke-dasharray=\"5 4\" marker-end=\"url(#uOpen6)\"></line><text x=\"80\" y=\"243\" font-size=\"11\">indisponible</text></svg></div><div class=\"xkey\"><b>Ce qui rapporte des points</b> : message synchrone = flèche à <b>pointe pleine</b> ; retour = <b>pointillés</b> ; rectangle d'activation pendant que l'objet travaille ; fragment <b>alt</b> pour un si/sinon, <b>loop</b> pour une boucle, <b>opt</b> pour un « si » sans sinon ; «create» pour un objet créé en cours de route (sa tête arrive plus bas).</div><div class=\"xtrap\"><b>Piège</b> Cohérence avec le diagramme de classes : chaque message reçu par un objet doit être une <b>opération de sa classe</b> (estDispo() doit exister dans Livre ou Catalogue). Le correcteur vérifie souvent ça.</div><details class=\"xchk\"><summary>À toi : 3 questions éclair</summary><ol><li>Quel fragment pour « répéter pour chaque livre du panier » ? <i>Réponse : loop.</i></li><li>Comment représenter le retour d'un message ? <i>Réponse : une flèche en pointillés vers l'appelant.</i></li><li>Où apparaît un objet créé pendant le scénario ? <i>Réponse : sa tête est placée au niveau du message «create», plus bas que les autres.</i></li></ol></details></section><p class=\"fichelab\">Le cours du prof (à retenir)</p>\n  <div class=\"prose\">\n  <h2>1. D’où il vient</h2>\n  <p>Un cas d’utilisation se décrit par des <b>scénarios</b> textuels (chapitre 4). Le diagramme de séquence est la version graphique d’un scénario. Il permet <span class=\"src\">diapo 126</span> :</p>\n  <ul>\n    <li>de visualiser l’<b>aspect temporel</b> des interactions ;</li>\n    <li>de connaître le <b>sens</b> des interactions (de l’acteur vers le système ou l’inverse).</li>\n  </ul>\n  <h2>2. Les éléments de base</h2>\n  <div class=\"tw\"><table>\n    <tbody><tr><th>Élément</th><th>Notation</th></tr>\n    <tr><td>Acteur</td><td>bonhomme en haut, avec sa ligne de vie</td></tr>\n    <tr><td>Objet (participant)</td><td>rectangle avec le nom <u>souligné</u> : <code>:Système</code>, <code>cmd : Commande</code></td></tr>\n    <tr><td>Ligne de vie</td><td>trait pointillé vertical sous chaque participant</td></tr>\n    <tr><td>Message</td><td>flèche horizontale d’une ligne de vie à une autre, avec le nom du message</td></tr>\n    <tr><td>Axe du temps</td><td>vertical, du haut vers le bas (implicite)</td></tr>\n  </tbody></table></div>\n  <p>Voici le diagramme du cours pour « Réserver un livre » <span class=\"src\">diapo 127</span>, au niveau « système boîte noire » : on ne voit que l’acteur et le système.</p>\n  </div>\n  <figure class=\"dgw\" data-d=\"s_resa\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"28 6 304 398\" width=\"304\" data-w=\"304\" style=\"max-width: 100%; height: auto;\"><g><line x1=\"60\" y1=\"92\" x2=\"60\" y2=\"390\" class=\"dg-l dg-life\"></line><line x1=\"254.00000000000003\" y1=\"54\" x2=\"254.00000000000003\" y2=\"390\" class=\"dg-l dg-life\"></line><circle cx=\"60\" cy=\"28\" r=\"8\" class=\"dg-box\"></circle><path d=\"M60 36 V56 M47 43 H73 M60 56 L49 72 M60 56 L71 72\" class=\"dg-l\"></path><text x=\"60\" y=\"86\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"700\">Client</text><rect x=\"190.00000000000003\" y=\"21\" width=\"128\" height=\"32\" class=\"dg-box\"></rect><text x=\"254.00000000000003\" y=\"37\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13\" font-weight=\"700\" text-decoration=\"underline\">:SystèmeDePrêts</text><rect x=\"249.00000000000003\" y=\"308\" width=\"10\" height=\"36\" class=\"dg-act\"></rect><rect x=\"249.00000000000003\" y=\"236\" width=\"10\" height=\"138\" class=\"dg-act\"></rect><rect x=\"249.00000000000003\" y=\"164\" width=\"10\" height=\"210\" class=\"dg-act\"></rect><rect x=\"249.00000000000003\" y=\"120\" width=\"10\" height=\"254\" class=\"dg-act\"></rect><line x1=\"254.00000000000003\" y1=\"128\" x2=\"60\" y2=\"128\" class=\"dg-l\"></line><polyline points=\"71,134 60,128 71,122\" class=\"dg-l\"></polyline><text x=\"157\" y=\"121\" text-anchor=\"middle\" class=\"dg-t dg-halo \" font-size=\"12\"><tspan x=\"157\" dy=\"0\">afficherAccueil()</tspan></text><line x1=\"60\" y1=\"164\" x2=\"249.00000000000003\" y2=\"164\" class=\"dg-l\"></line><polygon points=\"238.00000000000003,159 249.00000000000003,164 238.00000000000003,169\" class=\"dg-fill\"></polygon><text x=\"154.5\" y=\"157\" text-anchor=\"middle\" class=\"dg-t dg-halo \" font-size=\"12\"><tspan x=\"154.5\" dy=\"0\">choisirRéservation()</tspan></text><line x1=\"249.00000000000003\" y1=\"200\" x2=\"60\" y2=\"200\" class=\"dg-l\"></line><polyline points=\"71,206 60,200 71,194\" class=\"dg-l\"></polyline><text x=\"154.5\" y=\"193\" text-anchor=\"middle\" class=\"dg-t dg-halo \" font-size=\"12\"><tspan x=\"154.5\" dy=\"0\">demanderIdentification()</tspan></text><line x1=\"60\" y1=\"236\" x2=\"249.00000000000003\" y2=\"236\" class=\"dg-l\"></line><polygon points=\"238.00000000000003,231 249.00000000000003,236 238.00000000000003,241\" class=\"dg-fill\"></polygon><text x=\"154.5\" y=\"229\" text-anchor=\"middle\" class=\"dg-t dg-halo \" font-size=\"12\"><tspan x=\"154.5\" dy=\"0\">sIdentifier(nom, motDePasse)</tspan></text><line x1=\"249.00000000000003\" y1=\"272\" x2=\"60\" y2=\"272\" class=\"dg-l\"></line><polyline points=\"71,278 60,272 71,266\" class=\"dg-l\"></polyline><text x=\"154.5\" y=\"265\" text-anchor=\"middle\" class=\"dg-t dg-halo \" font-size=\"12\"><tspan x=\"154.5\" dy=\"0\">demanderLivre()</tspan></text><line x1=\"60\" y1=\"308\" x2=\"249.00000000000003\" y2=\"308\" class=\"dg-l\"></line><polygon points=\"238.00000000000003,303 249.00000000000003,308 238.00000000000003,313\" class=\"dg-fill\"></polygon><text x=\"154.5\" y=\"301\" text-anchor=\"middle\" class=\"dg-t dg-halo \" font-size=\"12\"><tspan x=\"154.5\" dy=\"0\">choisirLivre(titre)</tspan></text><line x1=\"249.00000000000003\" y1=\"344\" x2=\"60\" y2=\"344\" class=\"dg-l dg-dash\"></line><polyline points=\"71,350 60,344 71,338\" class=\"dg-l\"></polyline><text x=\"154.5\" y=\"337\" text-anchor=\"middle\" class=\"dg-t dg-halo dg-ret\" font-size=\"12\"><tspan x=\"154.5\" dy=\"0\">« le livre est réservé »</tspan></text></g></svg></div><figcaption>Chaque ligne du scénario textuel devient un message. Une variante (diapo 128) remplace le dernier message par « refus : trop de livres réservés ».</figcaption></figure>\n\n  <div class=\"prose\">\n  <h2>3. Compléments indispensables pour les TP</h2>\n  <div class=\"box plus\"><span class=\"tag\">Complément hors diapos</span>\n    <p>Les diapos s’arrêtent à la forme simple. Le TP2 exige des <b>fragments alt</b>, des <b>messages synchrones</b>, un message <b>create</b> et une <b>note</b>. Voici la notation UML 2 (certitude élevée).</p>\n  </div>\n  <h3>Les types de messages</h3>\n  <div class=\"tw\"><table>\n    <tbody><tr><th>Message</th><th>Dessin</th><th>Sens</th></tr>\n    <tr><td>Synchrone (appel)</td><td>trait plein, <b>pointe pleine</b> ▶</td><td>l’émetteur attend la réponse</td></tr>\n    <tr><td>Asynchrone (signal)</td><td>trait plein, pointe ouverte →</td><td>l’émetteur continue sans attendre</td></tr>\n    <tr><td>Retour</td><td>trait <b>pointillé</b>, pointe ouverte</td><td>la réponse à un appel synchrone</td></tr>\n    <tr><td>Création</td><td>pointillé vers la <b>tête</b> du nouvel objet, «create»</td><td>l’objet apparaît plus bas que les autres</td></tr>\n    <tr><td>Destruction</td><td>grande <b>croix X</b> en bas de la ligne de vie</td><td>l’objet cesse d’exister</td></tr>\n    <tr><td>Auto-message</td><td>flèche qui revient sur la même ligne de vie</td><td>l’objet s’appelle lui-même</td></tr>\n  </tbody></table></div>\n  <p>La <b>barre d’activation</b> (rectangle étroit sur la ligne de vie) montre la période pendant laquelle l’objet travaille.</p>\n  <p>Syntaxe d’un message : <code>[garde] variable := nomMessage(arguments)</code>. Exemple : <code>total := calculerTotal()</code>.</p>\n  </div>\n  <figure class=\"dgw\" data-d=\"s_notation\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"28 6 611 492\" width=\"611\" data-w=\"611\" style=\"max-width: 100%; height: auto;\"><g><line x1=\"60\" y1=\"92\" x2=\"60\" y2=\"484\" class=\"dg-l dg-life\"></line><line x1=\"253.99999999999997\" y1=\"54\" x2=\"253.99999999999997\" y2=\"444\" class=\"dg-l dg-life\"></line><path d=\"M244.99999999999997 435 L263 453 M263 435 L244.99999999999997 453\" class=\"dg-l dg-thick\"></path><line x1=\"433\" y1=\"233\" x2=\"433\" y2=\"484\" class=\"dg-l dg-life\"></line><l messages dans un seul scénario : synchrone, auto-message, création, retour, asynchrone, destruction.</figcaption></figure>\n  <div class=\"prose\">\n  <h3>Les fragments combinés</h3>\n  <p>Un fragment est un cadre avec un opérateur en haut à gauche et une <b>garde</b> entre crochets.</p>\n  <div class=\"tw\"><table>\n    <tbody><tr><th>Opérateur</th><th>Sens</th><th>Équivalent en code</th></tr>\n    <tr><td><code>alt</code></td><td>alternative : un seul des opérandes s’exécute (séparés par un pointillé)</td><td><code>if … else</code></td></tr>\n    <tr><td><code>opt</code></td><td>optionnel : s’exécute seulement si la garde est vraie</td><td><code>if</code> sans <code>else</code></td></tr>\n    <tr><td><code>loop</code></td><td>répétition tant que la garde est vraie</td><td><code>while</code> / <code>for</code></td></tr>\n    <tr><td><code>par</code></td><td>opérandes exécutés en parallèle</td><td>threads</td></tr>\n    <tr><td><code>ref</code></td><td>renvoie à un autre diagramme de séquence</td><td>appel de fonction</td></tr>\n    <tr><td><code>break</code></td><td>si la garde est vraie, on exécute le fragment et on quitte le scénario englobant</td><td><code>break</code> / <code>return</code></td></tr>\n  </tbody></table></div>\n  </div>\n  <figure class=\"dgw\" data-d=\"s_frag\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"2 6 411 658\" width=\"411\" data-w=\"411\" style=\"max-width: 100%; height: auto;\"><g><line x1=\"60\" y1=\"92\" x2=\"60\" y2=\"650\" class=\"dg-l dg-life\"></line><line x1=\"210\" y1=\"54\" x2=\"210\" y2=\"650\" class=\"dg-l dg-life\"></line><line x1=\"360\" y1=\"54\" x2=\"360\" y2=\"650\" class=\"dg-l dg-life\"></line><rect x=\"16\" y=\"154\" width=\"383\" height=\"188\" class=\"dg-frame\"></rect><rect x=\"16\" y=\"356\" width=\"383\" height=\"260\" class=\"dg-frame\"></rect><line x1=\"16\" y1=\"544\" x2=\"399\" y2=\"544\" class=\"dg-l dg-dash\"></line><rect x=\"159\" y=\"432\" width=\"232\" height=\"96\" class=\"dg-frame\"></rect><circle cx=\"60\" cy=\"28\" r=\"8\" class=\"dg-box\"></circle><path d=\"M60 36 V56 M47 43 H73 M60 56 L49 72 M60 56 L71 72\" class=\"dg-l\"></path><text x=\"60\" y=\"86\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"700\">Client</text><rect x=\"183.5\" y=\"21\" width=\"53\" height=\"32\" class=\"dg-box\"></rect><text x=\"210\" y=\"37\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13\" font-weight=\"700\" text-decoration=\"underline\">:GAB</text><rect x=\"324.5\" y=\"21\" width=\"71\" height=\"32\" class=\"dg-box\"></rect><text x=\"360\" y=\"37\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13\" font-weight=\"700\" text-decoration=\"underline\">:Banque</text><rect x=\"355\" y=\"276\" width=\"10\" height=\"36\" class=\"dg-act\"></rect><rect x=\"214\" y=\"498\" width=\"10\" height=\"24\" class=\"dg-act\"></rect><rect x=\"205\" y=\"240\" width=\"10\" height=\"394\" class=\"dg-act\"></rect><rect x=\"205\" y=\"128\" width=\"10\" height=\"506\" class=\"dg-act\"></rect><line x1=\"60\" y1=\"128\" x2=\"205\" y2=\"128\" class=\"dg-l\"></line><polygon points=\"194,123 205,128 194,133\" class=\"dg-fill\"></polygon><text x=\"132.5\" y=\"121\" text-anchor=\"middle\" class=\"dg-t dg-halo \" font-size=\"12\"><tspan x=\"132.5\" dy=\"0\">insérerCarte()</tspan></text><line x1=\"205\" y1=\"204\" x2=\"60\" y2=\"204\" class=\"dg-l\"></line><polyline points=\"71,210 60,204 71,198\" class=\"dg-l\"></polyline><text x=\"132.5\" y=\"197\" text-anchor=\"middle\" class=\"dg-t dg-halo \" font-size=\"12\"><tspan x=\"132.5\" dy=\"0\">demanderCode()</tspan></text><line x1=\"60\" y1=\"240\" x2=\"205\" y2=\"240\" class=\"dg-l\"></line><polygon points=\"194,235 205,240 194,245\" class=\"dg-fill\"></polygon><text x=\"132.5\" y=\"233\" text-anchor=\"middle\" class=\"dg-t dg-halo \" font-size=\"12\"><tspan x=\"132.5\" dy=\"0\">saisirCode(code)</tspan></text><line x1=\"215\" y1=\"276\" x2=\"355\" y2=\"276\" class=\"dg-l\"></line><polygon points=\"344,271 355,276 344,281\" class=\"dg-fill\"></polygon><text x=\"285\" y=\"269\" text-anchor=\"middle\" class=\"dg-t dg-halo \" font-size=\"12\"><tspan x=\"285\" dy=\"0\">vérifierCode(code)</tspan></text><line x1=\"355\" y1=\"312\" x2=\"215\" y2=\"312\" class=\"dg-l dg-dash\"></line><polyline points=\"226,318 215,312 226,306\" class=\"dg-l\"></polyline><text x=\"285\" y=\"305\" text-anchor=\"middle\" class=\"dg-t dg-halo dg-ret\" font-size=\"12\"><tspan x=\"285\" dy=\"0\">valide</tspan></text><line x1=\"205\" y1=\"406\" x2=\"60\" y2=\"406\" class=\"dg-l\"></line><polyline points=\"71,412 60,406 71,400\" class=\"dg-l\"></polyline><text x=\"132.5\" y=\"399\" text-anchor=\"middle\" class=\"dg-t dg-halo \" font-size=\"12\"><tspan x=\"132.5\" dy=\"0\">demanderMontant()</tspan></text><polyline points=\"215,482 251,482 251,506 224,506\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"235,511 224,506 235,501\" class=\"dg-fill\"></polygon><text x=\"259\" y=\"492\" text-anchor=\"start\" class=\"dg-t dg-halo \" font-size=\"12\"><tspan x=\"259\" dy=\"0\">imprimerReçu()</tspan></text><line x1=\"205\" y1=\"586\" x2=\"60\" y2=\"586\" class=\"dg-l\"></line><polyline points=\"71,592 60,586 71,580\" class=\"dg-l\"></polyline><text x=\"132.5\" y=\"579\" text-anchor=\"middle\" class=\"dg-t dg-halo \" font-size=\"12\"><tspan x=\"132.5\" dy=\"0\">avalerCarte()</tspan></text><rect x=\"16\" y=\"154\" width=\"48\" height=\"20\" class=\"dg-box\" style=\"stroke:none\"></rect><path d=\"M16 174 H57 L64 167 V154\" class=\"dg-l dg-nofill\"></path><text x=\"23\" y=\"164.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12\" font-weight=\"700\">loop</text><text x=\"71\" y=\"169\" text-anchor=\"start\" class=\"dg-t dg-halo dg-guard\" font-size=\"12\"><tspan x=\"71\" dy=\"4\">[tentatives &lt; 3 et code invalide]</tspan></text><rect x=\"16\" y=\"356\" width=\"39\" height=\"20\" class=\"dg-box\" style=\"stroke:none\"></rect><path d=\"M16 376 H48 L55 369 V356\" class=\"dg-l dg-nofill\"></path><text x=\"23\" y=\"366.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12\" font-weight=\"700\">alt</text><text x=\"62\" y=\"371\" text-anchor=\"start\" class=\"dg-t dg-halo dg-guard\" font-size=\"12\"><tspan x=\"62\" dy=\"4\">[code valide]</tspan></text><text x=\"26\" y=\"559\" text-anchor=\"start\" class=\"dg-t dg-halo dg-guard\" font-size=\"12\"><tspan x=\"26\" dy=\"4\">[else]</tspan></text><rect x=\"159\" y=\"432\" width=\"42\" height=\"20\" class=\"dg-box\" style=\"stroke:none\"></rect><path d=\"M159 452 H194 L201 445 V432\" class=\"dg-l dg-nofill\"></path><text x=\"166\" y=\"442.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12\" font-weight=\"700\">opt</text><text x=\"208\" y=\"447\" text-anchor=\"start\" class=\"dg-t dg-halo dg-guard\" font-size=\"12\"><tspan x=\"208\" dy=\"4\">[reçu demandé]</tspan></text></g></svg></div><figcaption>loop pour les tentatives, alt pour la décision, opt imbriqué pour le reçu.</figcaption></figure>\n  <div class=\"prose\">\n  <h2>4. Cohérence avec le diagramme de classes</h2>\n  <div class=\"box retenir\"><span class=\"tag\">Règle de cohérence (exigée au TP2 exercice 4)</span>\n    <p>Tout message reçu par un objet doit correspondre à une <b>opération de la classe de cet objet</b>. Si <code>:Chambre</code> reçoit <code>estDisponible(d, f)</code>, la classe Chambre doit avoir <code>+ estDisponible(d : Date, f : Date) : boolean</code>. Vérifie-le en relisant ton diagramme de classes.</p>\n  </div>\n  <h2>5. Méthode pour en construire un</h2>\n  <ol>\n    <li>Écris le scénario en phrases numérotées (« Le client… », « Le système… »).</li>\n    <li>Liste les participants : l’acteur à gauche, puis les objets dans l’ordre où ils interviennent.</li>\n    <li>Transforme chaque phrase en message : émetteur → récepteur, avec un verbe à l’infinitif.</li>\n    <li>Ajoute les retours des appels synchrones qui rendent une valeur.</li>\n    <li>Encadre les conditions (<code>alt</code>, <code>opt</code>) et les répétitions (<code>loop</code>) avec leurs gardes.</li>\n    <li>Vérifie la cohérence avec les opérations des classes.</li>\n  </ol>\n  <div class=\"box piege\"><span class=\"tag\">Pièges</span>\n    <ul>\n      <li>Noms d’objets non soulignés, ou sans les deux-points (<code>Système</code> au lieu de <code>:Système</code>).</li>\n      <li>Message envoyé à un objet absent des participants.</li>\n      <li><code>alt</code> sans gardes, ou gardes qui ne couvrent pas tous les cas.</li>\n      <li>Un retour dessiné en trait plein.</li>\n      <li>Ordre chronologique incohérent avec l’énoncé (par exemple payer avant que la facture existe).</li>\n      <li>Objet créé dessiné en haut avec les autres alors qu’il est créé pendant le scénario.</li>\n    </ul>\n  </div>\n  </div>\n  <h2>Quiz du chapitre 5</h2>\n  \n  <div class=\"row\"><a class=\"btn ghost\" href=\"#tp2\">Faire le TP2 exercice 1</a></div><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Dans un diagramme de séquence, le temps s’écoule…</div><button class=\"opt\" data-o=\"0\">de gauche à droite</button><button class=\"opt\" data-o=\"1\">de haut en bas</button><button class=\"opt\" data-o=\"2\">de bas en haut</button><button class=\"opt\" data-o=\"3\">selon les numéros seulement</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Un message synchrone se dessine avec…</div><button class=\"opt\" data-o=\"0\">une pointe pleine</button><button class=\"opt\" data-o=\"1\">une pointe ouverte en pointillé</button><button class=\"opt\" data-o=\"2\">une croix</button><button class=\"opt\" data-o=\"3\">un losange</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Le message de retour est…</div><button class=\"opt\" data-o=\"0\">en trait plein</button><button class=\"opt\" data-o=\"1\">en pointillé</button><button class=\"opt\" data-o=\"2\">en gras</button><button class=\"opt\" data-o=\"3\">absent</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Quel fragment pour un « si… sinon… » ?</div><button class=\"opt\" data-o=\"0\">loop</button><button class=\"opt\" data-o=\"1\">opt</button><button class=\"opt\" data-o=\"2\">alt</button><button class=\"opt\" data-o=\"3\">par</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Quel fragment pour une répétition ?</div><button class=\"opt\" data-o=\"0\">loop</button><button class=\"opt\" data-o=\"1\">alt</button><button class=\"opt\" data-o=\"2\">ref</button><button class=\"opt\" data-o=\"3\">break</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Un objet créé pendant le scénario se dessine…</div><button class=\"opt\" data-o=\"0\">en haut avec les autres</button><button class=\"opt\" data-o=\"1\">à la hauteur du message «create»</button><button class=\"opt\" data-o=\"2\">en bas</button><button class=\"opt\" data-o=\"3\">en pointillé</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">La croix X en bas d’une ligne de vie signifie…</div><button class=\"opt\" data-o=\"0\">une erreur</button><button class=\"opt\" data-o=\"1\">la destruction de l’objet</button><button class=\"opt\" data-o=\"2\">un message perdu</button><button class=\"opt\" data-o=\"3\">la fin du diagramme</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Si :Chambre reçoit estDisponible(d, f), alors…</div><button class=\"opt\" data-o=\"0\">la classe Chambre doit avoir l’opération estDisponible</button><button class=\"opt\" data-o=\"1\">la classe Hôtel doit l’avoir</button><button class=\"opt\" data-o=\"2\">il faut un acteur Chambre</button><button class=\"opt\" data-o=\"3\">rien n’est imposé</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Le diagramme de séquence permet surtout de visualiser…</div><button class=\"opt\" data-o=\"0\">la structure statique</button><button class=\"opt\" data-o=\"1\">l’aspect temporel et le sens des interactions</button><button class=\"opt\" data-o=\"2\">les couloirs d’activité</button><button class=\"opt\" data-o=\"3\">les multiplicités</button><div class=\"qq-e\" hidden></div></div></section>","ex":[],"qcm":[{"n":"ch5","q":"Dans un diagramme de séquence, le temps s’écoule…","o":["de gauche à droite","de haut en bas","de bas en haut","selon les numéros seulement"],"a":1,"e":"Axe vertical."},{"n":"ch5","q":"Un message synchrone se dessine avec…","o":["une pointe pleine","une pointe ouverte en pointillé","une croix","un losange"],"a":0,"e":"L’émetteur attend la réponse ; le retour est en pointillé."},{"n":"ch5","q":"Le message de retour est…","o":["en trait plein","en pointillé","en gras","absent"],"a":1,"e":"Trait pointillé, pointe ouverte."},{"n":"ch5","q":"Quel fragment pour un « si… sinon… » ?","o":["loop","opt","alt","par"],"a":2,"e":"alt avec deux opérandes séparés par un pointillé, chacun avec sa garde."},{"n":"ch5","q":"Quel fragment pour une répétition ?","o":["loop","alt","ref","break"],"a":0,"e":"loop [condition]."},{"n":"ch5","q":"Un objet créé pendant le scénario se dessine…","o":["en haut avec les autres","à la hauteur du message «create»","en bas","en pointillé"],"a":1,"e":"Sa tête apparaît au moment de sa création."},{"n":"ch5","q":"La croix X en bas d’une ligne de vie signifie…","o":["une erreur","la destruction de l’objet","un message perdu","la fin du diagramme"],"a":1,"e":"L’objet cesse d’exister."},{"n":"ch5","q":"Si :Chambre reçoit estDisponible(d, f), alors…","o":["la classe Chambre doit avoir l’opération estDisponible","la classe Hôtel doit l’avoir","il faut un acteur Chambre","rien n’est imposé"],"a":0,"e":"Cohérence séquence / classes (TP2 exercice 4)."},{"n":"ch5","q":"Le diagramme de séquence permet surtout de visualiser…","o":["la structure statique","l’aspect temporel et le sens des interactions","les couloirs d’activité","les multiplicités"],"a":1,"e":"Diapo 126."}]},{"id":"ch6","t":"Diagramme de collaboration","seance":"Cours · diapos 129–152","imp":4,"html":"<p class=\"lede\">Les mêmes interactions que le diagramme de séquence, mais organisées dans l’espace : on voit qui est relié à qui, et l’ordre des messages est donné par leur numéro.</p>\n<section class=\"xpl\"><p class=\"xlab\">Comprendre, en clair · fil rouge : la bibliothèque de la fac</p><div class=\"xana\"><b>L'analogie</b> Si la séquence est une bande dessinée (on lit le <b>temps</b>), la collaboration est un <b>plan de table</b> : on voit <b>qui est relié à qui</b>, et l'ordre des échanges se lit uniquement grâce aux numéros. Même scénario, autre point de vue.</div><div class=\"xfig\"><svg viewBox=\"0 0 640 240\" role=\"img\" aria-label=\"diagramme de collaboration\" style=\"width:100%;min-width:520px;color:var(--ink)\" font-family=\"var(--f-body),system-ui,sans-serif\" font-size=\"12\"><defs>\n<marker id=\"uTri7\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0 L12 6 L0 12 Z\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></path></marker>\n<marker id=\"uArr7\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 Z\" fill=\"currentColor\"></path></marker>\n<marker id=\"uOpen7\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10\" fill=\"none\" stroke=\"currentColor\"></path></marker>\n<marker id=\"uDiaO7\" viewBox=\"0 0 16 10\" refX=\"1\" refY=\"5\" markerWidth=\"16\" markerHeight=\"10\" orient=\"auto\"><path d=\"M0 5 L8 0 L16 5 L8 10 Z\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></path></marker>\n<marker id=\"uDiaF7\" viewBox=\"0 0 16 10\" refX=\"1\" refY=\"5\" markerWidth=\"16\" markerHeight=\"10\" orient=\"auto\"><path d=\"M0 5 L8 0 L16 5 L8 10 Z\" fill=\"currentColor\"></path></marker>\n</defs><circle cx=\"60\" cy=\"30\" r=\"9\" fill=\"none\" stroke=\"currentColor\"></circle><line x1=\"60\" y1=\"39\" x2=\"60\" y2=\"64\" stroke=\"currentColor\"></line><line x1=\"46\" y1=\"48\" x2=\"74\" y2=\"48\" stroke=\"currentColor\"></line><line x1=\"60\" y1=\"64\" x2=\"48\" y2=\"82\" stroke=\"currentColor\"></line><line x1=\"60\" y1=\"64\" x2=\"72\" y2=\"82\" stroke=\"currentColor\"></line><text x=\"60\" y=\"98\" text-anchor=\"middle\">Adhérent</text><rect x=\"230\" y=\"40\" width=\"130\" height=\"34\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></rect><text x=\"295\" y=\"62\" text-anchor=\"middle\" text-decoration=\"underline\">: Borne</text><rect x=\"480\" y=\"40\" width=\"140\" height=\"34\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></rect><text x=\"550\" y=\"62\" text-anchor=\"middle\" text-decoration=\"underline\">: Catalogue</text><rect x=\"230\" y=\"190\" width=\"130\" height=\"34\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></rect><text x=\"295\" y=\"212\" text-anchor=\"middle\" text-decoration=\"underline\">e : Emprunt</text><line x1=\"80\" y1=\"57\" x2=\"230\" y2=\"57\" stroke=\"currentColor\"></line><line x1=\"360\" y1=\"57\" x2=\"480\" y2=\"57\" stroke=\"currentColor\"></line><line x1=\"295\" y1=\"74\" x2=\"295\" y2=\"190\" stroke=\"currentColor\"></line><text x=\"95\" y=\"45\" font-size=\"11\">1 : emprunter(isbn) →</text><text x=\"370\" y=\"45\" font-size=\"11\">1.1 : estDispo(isbn) →</text><text x=\"302\" y=\"135\" font-size=\"11\">1.2 [dispo] : «create» ↓</text></svg></div><div class=\"xkey\"><b>La numérotation imbriquée</b> : 1.1 et 1.2 sont des messages envoyés <b>pendant</b> le traitement du message 1. Syntaxe complète d'un message : <code>numéro [condition] : retour := nom(arguments)</code>, par exemple <code>1.2 [dispo] : e := créer(isbn)</code>.</div><div class=\"xtrap\"><b>Piège</b> Pour passer de la séquence à la collaboration : un lien entre deux objets dès qu'ils échangent au moins un message, puis on reporte les messages <b>avec leurs numéros</b>. Oublier la hiérarchie (1, 1.1, 1.2) fait perdre l'ordre.</div><details class=\"xchk\"><summary>À toi : 3 questions éclair</summary><ol><li>Que signifie le numéro 2.1 ? <i>Réponse : le premier message envoyé pendant le traitement du message 2.</i></li><li>Quelle information la collaboration montre-t-elle mieux que la séquence ? <i>Réponse : les liens (la structure) entre les objets.</i></li><li>Où écrit-on une condition ? <i>Réponse : entre crochets après le numéro : 1.2 [dispo].</i></li></ol></details></section><p class=\"fichelab\">Le cours du prof (à retenir)</p>\n  <div class=\"prose\">\n  <h2>1. La notion de collaboration <span class=\"src\">diapo 129</span></h2>\n  <p>Principe objet : les objets sont indépendants, chacun est responsable de certaines activités, et pour réaliser une activité il faut le concours de plusieurs objets qui collaborent par des interactions. Pas de hiérarchie : le système est basé sur l’objet. Une <b>collaboration</b> modélise une activité réalisée par un ensemble d’objets ; elle peut représenter un scénario d’un cas d’utilisation.</p>\n  <h2>2. Définition <span class=\"src\">diapos 130–132</span></h2>\n  <div class=\"box retenir\"><span class=\"tag\">À savoir</span>\n    <ul>\n      <li>Il représente les interactions entre instances en mettant <b>moins en évidence l’aspect temporel</b> que le diagramme de séquence.</li>\n      <li>L’aspect temporel n’est pas caché : <b>chaque message est numéroté</b>.</li>\n      <li>Il s’intéresse à la <b>structure</b> de la collaboration entre objets (séquencement, itération, concurrence).</li>\n      <li>Il peut montrer le <b>contexte</b> : l’état des objets qui interagissent.</li>\n      <li>Un objet doit avoir une méthode pour traiter chaque message qu’il reçoit.</li>\n      <li>Le passage séquence ↔ collaboration est simple : ce sont deux diagrammes d’<b>interaction</b>.</li>\n    </ul>\n  </div>\n  <p>En analyse, il sert à préciser le contexte de chaque objet et à mettre en évidence les <b>dépendances</b> entre les objets impliqués dans un processus ou un cas d’utilisation. <span class=\"src\">diapo 133</span></p>\n\n  <h2>3. Les quatre composants <span class=\"src\">diapos 134–137</span></h2>\n  <div class=\"tw\"><table>\n    <tbody><tr><th>Composant</th><th>Notation et règles</th></tr>\n    <tr><td>Objets</td><td>rectangle, <code>nomObjet : Classe</code> souligné. Un objet est <b>persistant</b> (il survit au processus qui l’a créé) ou <b>transitoire</b> (il disparaît à la fin du processus).</td></tr>\n    <tr><td>Liens</td><td>trait plein entre deux objets ou entre un objet et un acteur. Un lien est souvent une instance d’association du diagramme de classes. Les messages ne circulent que sur des liens.</td></tr>\n    <tr><td>Messages (interactions)</td><td>une petite <b>flèche parallèle au lien</b> avec le texte du message.</td></tr>\n    <tr><td>Acteurs</td><td>mêmes définition et notation que dans les cas d’utilisation.</td></tr>\n  </tbody></table></div>\n  </div>\n  <figure class=\"dgw\" data-d=\"k_devis\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"8 11 690 247\" width=\"690\" data-w=\"690\" style=\"max-width: 100%; height: auto;\"><g><g></g><g><polyline points=\"62,132.77241379310345 278,130\" class=\"dg-l dg-nofill\"></polyline><line x1=\"152.83455565292508\" y1=\"118.6054588602483\" x2=\"186.83175535741287\" y2=\"118.16909633530564\" class=\"dg-l dg-msg\"></line><polygon points=\"177.7747427485119,113.78497468984355 186.83175535741287,118.16909633530564 177.89025047570263,122.78423343514913\" class=\"dg-fill\"></polygon><text x=\"169.67914520224804\" y=\"105.38826593736951\" text-anchor=\"middle\" class=\"dg-t dg-halo dg-msgt\" font-size=\"11.5\"><tspan x=\"169.67914520224804\" dy=\"0\">1 : demandeDevis(produit, qté)</tspan></text><line x1=\"187.16544434707492\" y1=\"144.16695493285516\" x2=\"153.16824464258713\" y2=\"144.6033174577978\" class=\"dg-l dg-msg\"></line><polygon points=\"162.2252572514881,148.9874391032599 153.16824464258713,144.6033174577978 162.10974952429737,139.9881803579543\" class=\"dg-fill\"></polygon><text x=\"170.32085479775196\" y=\"165.38414785573394\" text-anchor=\"middle\" class=\"dg-t dg-halo dg-msgt\" font-size=\"11.5\"><tspan x=\"170.32085479775196\" dy=\"0\">4 : devis</tspan></text><polyline points=\"376.72222222222223,115.5 583,51.48275862068965\" class=\"dg-l dg-nofill\"></polyline><line x1=\"459.77183099197816\" y1=\"76.11433218463044\" x2=\"492.24401164356027\" y2=\"66.03675887896704\" class=\"dg-l dg-msg\"></line><polygon points=\"482.31463794533306,64.40656319716854 492.24401164356027,66.03675887896704 484.9822308791852,73.00214042846969\" class=\"dg-fill\"></polygon><text x=\"472.4511307392998\" y=\"58.614775890063896\" text-anchor=\"middle\" class=\"dg-t dg-halo dg-msgt\" font-size=\"11.5\"><tspan x=\"472.4511307392998\" dy=\"0\">2 : prix := calculPrix(qté)</tspan></text><polyline points=\"372.05,144.5 577.95,215.5\" class=\"dg-l dg-nofill\"></polyline><line x1=\"454.69078042920114\" y1=\"186.74800714471166\" x2=\"486.8334618044944\" y2=\"197.83169037757142\" class=\"dg-l dg-msg\"></line><polygon points=\"479.79206304479527,190.64359581037854 486.8334618044944,197.83169037757142 476.8581468949206,199.151952645015\" class=\"dg-fill\"></polygon><text x=\"466.8502329170149\" y=\"212.63432454065682\" text-anchor=\"middle\" class=\"dg-t dg-halo dg-msgt\" font-size=\"11.5\"><tspan x=\"466.8502329170149\" dy=\"0\">3 : taux := calculRistourne()</tspan></text></g><g><circle cx=\"40\" cy=\"104\" r=\"8\" class=\"dg-box\"></circle><path d=\"M40 112 V132 M27 119 H53 M40 132 L29 148 M40 132 L51 148\" class=\"dg-l\"></path><text x=\"40\" y=\"162\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"700\">Client</text><rect x=\"278\" y=\"115.5\" width=\"104\" height=\"29\" class=\"dg-box\"></rect><text x=\"330\" y=\"131.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\" text-decoration=\"underline\">:Commercial</text><rect x=\"583\" y=\"25.5\" width=\"74\" height=\"29\" class=\"dg-box\"></rect><text x=\"620\" y=\"41.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\" text-decoration=\"underline\">:Produit</text><rect x=\"556\" y=\"215.5\" width=\"128\" height=\"29\" class=\"dg-box\"></rect><text x=\"620\" y=\"231.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\" text-decoration=\"underline\">:CatégorieClient</text></g></g></svg></div><figcaption>Exemple du cours (diapo 139) : le client demande un devis ; le commercial calcule le prix puis la ristourne avant de répondre.</figcaption></figure>\n  <p class=\"prose\">Le même scénario en diagramme de séquence. Compare : les numéros remplacent l’axe vertical.</p>\n  <figure class=\"dgw\" data-d=\"s_devis\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"28 6 601 362\" width=\"601\" data-w=\"601\" style=\"max-width: 100%; height: auto;\"><g><line x1=\"60\" y1=\"92\" x2=\"60\" y2=\"354\" class=\"dg-l dg-life\"></line><line x1=\"253.99999999999997\" y1=\"54\" x2=\"253.99999999999997\" y2=\"354\" class=\"dg-l dg-life\"></line><line x1=\"404\" y1=\"54\" x2=\"404\" y2=\"354\" class=\"dg-l dg-life\"></line><line x1=\"554\" y1=\"54\" x2=\"554\" y2=\"354\" class=\"dg-l dg-life\"></line><circle cx=\"60\" cy=\"28\" r=\"8\" class=\"dg-box\"></circle><path d=\"M60 36 V56 M47 43 H73 M60 56 L49 72 M60 56 L71 72\" class=\"dg-l\"></path><text x=\"60\" y=\"86\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"700\">Client</text><rect x=\"203.49999999999997\" y=\"21\" width=\"101\" height=\"32\" class=\"dg-box\"></rect><text x=\"253.99999999999997\" y=\"37\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13\" font-weight=\"700\" text-decoration=\"underline\">:Commercial</text><rect x=\"368.5\" y=\"21\" width=\"71\" height=\"32\" class=\"dg-box\"></rect><text x=\"404\" y=\"37\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13\" font-weight=\"700\" text-decoration=\"underline\">:Produit</text><rect x=\"493\" y=\"21\" width=\"122\" height=\"32\" class=\"dg-box\"></rect><text x=\"554\" y=\"37\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13\" font-weight=\"700\" text-decoration=\"underline\">:CatégorieClient</text><rect x=\"399\" y=\"164\" width=\"10\" height=\"36\" class=\"dg-act\"></rect><rect x=\"549\" y=\"236\" width=\"10\" height=\"36\" class=\"dg-act\"></rect><rect x=\"248.99999999999997\" y=\"128\" width=\"10\" height=\"180\" class=\"dg-act\"></rect><line x1=\"60\" y1=\"128\" x2=\"248.99999999999997\" y2=\"128\" class=\"dg-l\"></line><polygon points=\"237.99999999999997,123 248.99999999999997,128 237.99999999999997,133\" class=\"dg-fill\"></polygon><text x=\"154.5\" y=\"121\" text-anchor=\"middle\" class=\"dg-t dg-halo \" font-size=\"12\"><tspan x=\"154.5\" dy=\"0\">1 : demandeDevis(produit, qté)</tspan></text><line x1=\"259\" y1=\"164\" x2=\"399\" y2=\"164\" class=\"dg-l\"></line><polygon points=\"388,159 399,164 388,169\" class=\"dg-fill\"></polygon><text x=\"329\" y=\"157\" text-anchor=\"middle\" class=\"dg-t dg-halo \" font-size=\"12\"><tspan x=\"329\" dy=\"0\">2 : calculPrix(qté)</tspan></text><line x1=\"399\" y1=\"200\" x2=\"259\" y2=\"200\" class=\"dg-l dg-dash\"></line><polyline points=\"270,206 259,200 270,194\" class=\"dg-l\"></polyline><text x=\"329\" y=\"193\" text-anchor=\"middle\" class=\"dg-t dg-halo dg-ret\" font-size=\"12\"><tspan x=\"329\" dy=\"0\">prix</tspan></text><line x1=\"259\" y1=\"236\" x2=\"549\" y2=\"236\" class=\"dg-l\"></line><polygon points=\"538,231 549,236 538,241\" class=\"dg-fill\"></polygon><text x=\"404\" y=\"229\" text-anchor=\"middle\" class=\"dg-t dg-halo \" font-size=\"12\"><tspan x=\"404\" dy=\"0\">3 : calculRistourne()</tspan></text><line x1=\"549\" y1=\"272\" x2=\"259\" y2=\"272\" class=\"dg-l dg-dash\"></line><polyline points=\"270,278 259,272 270,266\" class=\"dg-l\"></polyline><text x=\"404\" y=\"265\" text-anchor=\"middle\" class=\"dg-t dg-halo dg-ret\" font-size=\"12\"><tspan x=\"404\" dy=\"0\">taux</tspan></text><line x1=\"248.99999999999997\" y1=\"308\" x2=\"60\" y2=\"308\" class=\"dg-l dg-dash\"></line><polyline points=\"71,314 60,308 71,302\" class=\"dg-l\"></polyline><text x=\"154.5\" y=\"301\" text-anchor=\"middle\" class=\"dg-t dg-halo dg-ret\" font-size=\"12\"><tspan x=\"154.5\" dy=\"0\">4 : devis</tspan></text></g></svg></div><figcaption>Séquence équivalente.</figcaption></figure>\n\n  <div class=\"prose\">\n  <h2>4. La syntaxe complète d’un message</h2>\n  <p>Un message est décrit par son émetteur et son récepteur, et peut être complété par un nom, un numéro, des arguments, un résultat attendu, une synchronisation et une condition. <span class=\"src\">diapo 139</span></p>\n  <p><code>prédécesseurs / [condition] numéro récurrence : résultat := nomMessage(arguments)</code></p>\n  <div class=\"tw\"><table>\n    <tbody><tr><th>Élément</th><th>Exemple</th><th>Sens</th></tr>\n    <tr><td>Numéro d’ordre</td><td><code>1.3.5</code></td><td>suit immédiatement <code>1.3.4</code> ; tous deux font partie du flot <code>1.3</code></td></tr>\n    <tr><td>Messages simultanés</td><td><code>1.3.a</code> et <code>1.3.b</code></td><td>envoyés en même temps</td></tr>\n    <tr><td>Condition</td><td><code>[poids &gt; 300] 2 : sonner()</code></td><td>envoyé seulement si la condition est vraie</td></tr>\n    <tr><td>Prédécesseurs</td><td><code>1, 2, 4 / 3 : …</code></td><td>le message 3 attend que 1, 2 et 4 soient passés</td></tr>\n    <tr><td>Heure</td><td><code>[heure = midi] 1 : manger()</code></td><td>contrainte de temps</td></tr>\n    <tr><td>Récurrence séquentielle</td><td><code>1.3.6 * : ouvrir()</code></td><td>envoyé plusieurs fois, l’un après l’autre</td></tr>\n    <tr><td>Récurrence parallèle</td><td><code>3 / *||[i := 1..5] : fermer()</code></td><td>5 envois en parallèle, après le message 3</td></tr>\n    <tr><td>Itération sur une collection</td><td><code>*[tous] : debout()</code></td><td>envoyé à chaque élève de la collection</td></tr>\n    <tr><td>Résultat</td><td><code>2 : prix := calculPrix(qté)</code></td><td>le résultat revient immédiatement</td></tr>\n    <tr><td>Objet créé / détruit</td><td><code>{nouveau}</code>, <code>{détruit}</code></td><td>objet ou lien créé ou détruit pendant l’interaction</td></tr>\n    <tr><td>Créé et détruit</td><td><code>{transitoire}</code></td><td>créé puis détruit pendant la même interaction</td></tr>\n  </tbody></table></div>\n  <p class=\"src\" style=\"display:inline-block\">diapos 140–149</p>\n  <p>Un résultat se modélise de deux façons <span class=\"src\">diapo 140</span> : un message de demande puis un message de réponse, ou le résultat écrit sur le premier message (<code>valeurStock := calculerStock()</code>) quand la réponse est immédiate.</p>\n  </div>\n  <figure class=\"dgw\" data-d=\"k_syntax\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"-23 -11 501 358\" width=\"501\" data-w=\"501\" style=\"max-width: 100%; height: auto;\"><g><g></g><g><polyline points=\"128.5,40 385,40\" class=\"dg-l dg-nofill\"></polyline><line x1=\"239.75\" y1=\"27\" x2=\"273.75\" y2=\"27\" class=\"dg-l dg-msg\"></line><polygon points=\"264.75,22.5 273.75,27 264.75,31.5\" class=\"dg-fill\"></polygon><text x=\"256.75\" y=\"14\" text-anchor=\"middle\" class=\"dg-t dg-halo dg-msgt\" font-size=\"11.5\"><tspan x=\"256.75\" dy=\"0\">1 *||[tous] : seLever()</tspan></text><polyline points=\"96,170 383,170\" class=\"dg-l dg-nofill\"></polyline><line x1=\"222.5\" y1=\"157\" x2=\"256.5\" y2=\"157\" class=\"dg-l dg-msg\"></line><polygon points=\"247.5,152.5 256.5,157 247.5,161.5\" class=\"dg-fill\"></polygon><text x=\"239.5\" y=\"144\" text-anchor=\"middle\" class=\"dg-t dg-halo dg-msgt\" font-size=\"11.5\"><tspan x=\"239.5\" dy=\"0\">[poids &gt; 300] 2 : sonner()</tspan></text><polyline points=\"121,300 375.5,300\" class=\"dg-l dg-nofill\"></polyline><line x1=\"231.25\" y1=\"287\" x2=\"265.25\" y2=\"287\" class=\"dg-l dg-msg\"></line><polygon points=\"256.25,282.5 265.25,287 256.25,291.5\" class=\"dg-fill\"></polygon><text x=\"248.25\" y=\"274\" text-anchor=\"middle\" class=\"dg-t dg-halo dg-msgt\" font-size=\"11.5\"><tspan x=\"248.25\" dy=\"0\">3 : «create» créer(montant)</tspan></text></g><g><rect x=\"-8.5\" y=\"25.5\" width=\"137\" height=\"29\" class=\"dg-box\"></rect><text x=\"60\" y=\"41.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\" text-decoration=\"underline\">instit : Instituteur</text><rect x=\"385\" y=\"25.5\" width=\"70\" height=\"29\" class=\"dg-box\"></rect><text x=\"420\" y=\"41.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\" text-decoration=\"underline\">:Élève</text><rect x=\"24\" y=\"155.5\" width=\"72\" height=\"29\" class=\"dg-box\"></rect><text x=\"60\" y=\"171.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\" text-decoration=\"underline\">:Cabine</text><rect x=\"383\" y=\"155.5\" width=\"74\" height=\"29\" class=\"dg-box\"></rect><text x=\"420\" y=\"171.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\" text-decoration=\"underline\">:Alarme</text><rect x=\"-1\" y=\"285.5\" width=\"122\" height=\"29\" class=\"dg-box\"></rect><text x=\"60\" y=\"301.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\" text-decoration=\"underline\">o1 : Commande</text><rect x=\"375.5\" y=\"285.5\" width=\"89\" height=\"29\" class=\"dg-box\"></rect><text x=\"420\" y=\"301.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\" text-decoration=\"underline\">f : Facture</text><text x=\"420\" y=\"326.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t dg-tag\" font-size=\"11.5\" font-weight=\"400\" font-style=\"italic\">{nouveau}</text></g></g></svg></div><figcaption>Itération parallèle sur une collection, condition, objet créé pendant l’interaction.</figcaption></figure>\n  <div class=\"prose\">\n  <div class=\"box retenir\"><span class=\"tag\">Comprendre la numérotation hiérarchique</span>\n    <p><code>2.1</code> veut dire « premier message envoyé <b>pendant le traitement</b> du message 2, par l’objet qui a reçu le message 2 ». <code>2.2</code> est le suivant au même niveau. <code>2.2.1</code> est envoyé pendant le traitement de <code>2.2</code>. Les numéros racine (1, 2, 3) sont les messages envoyés par l’acteur ou l’objet qui lance le scénario.</p>\n    <p>C’est exactement l’imbrication des barres d’activation dans le diagramme de séquence.</p>\n  </div>\n  <p>L’exemple du distributeur de boisson du cours <span class=\"src\">diapo 150</span> l’illustre : <code>1 : introduire</code> (utilisateur → pièce), <code>1.1 : comptabiliser(valeur)</code> (pièce → gestionnaire de pièces), <code>1.1.1 : afficher</code> (somme versée), puis <code>2 : boisson := choisir</code>, <code>2.1 : réponse := vérifierPrix(prix)</code>, <code>2.2 : réponse := disponibilité</code>, <code>2.2.1 : gobelet</code>, <code>2.3 : finOpération</code>.</p>\n\n  <h2>5. Passer de la séquence à la collaboration</h2>\n  <ol>\n    <li>Recopie chaque participant comme un objet (ou un acteur), placé librement.</li>\n    <li>Pour chaque paire de participants qui échangent au moins un message, trace <b>un</b> lien.</li>\n    <li>Numérote les messages dans l’ordre chronologique du diagramme de séquence (en hiérarchique si demandé).</li>\n    <li>Pose chaque message sur le lien correspondant, avec une flèche parallèle dans le bon sens.</li>\n    <li>Reporte les conditions entre crochets, les itérations avec <code>*</code>, et marque les objets créés <code>{nouveau}</code>.</li>\n  </ol>\n  <div class=\"tw\"><table>\n    <tbody><tr><th></th><th>Diagramme de séquence</th><th>Diagramme de collaboration</th></tr>\n    <tr><td>Met en avant</td><td>l’ordre <b>temporel</b></td><td>l’organisation <b>spatiale</b> (structure des liens)</td></tr>\n    <tr><td>Ordre des messages</td><td>position verticale</td><td>numéros</td></tr>\n    <tr><td>Liens entre objets</td><td>implicites</td><td>dessinés explicitement</td></tr>\n    <tr><td>Lisibilité</td><td>meilleure pour des scénarios longs</td><td>meilleure pour voir qui dépend de qui</td></tr>\n    <tr><td>Ligne de vie, activation</td><td>oui</td><td>non</td></tr>\n  </tbody></table></div>\n  <div class=\"box piege\"><span class=\"tag\">Pièges</span>\n    <ul>\n      <li>Message sans numéro : l’ordre est perdu.</li>\n      <li>Message posé entre deux objets qui n’ont pas de lien.</li>\n      <li>Flèche dessinée sur le lien au lieu d’une petite flèche parallèle.</li>\n      <li>Numérotation hiérarchique mal utilisée : <code>1.1</code> doit être envoyé par le <b>récepteur</b> du message 1.</li>\n      <li>Condition écrite après le nom du message au lieu d’entre crochets avant.</li>\n    </ul>\n  </div>\n  </div>\n  <h2>Quiz du chapitre 6</h2>\n  \n  <div class=\"row\"><a class=\"btn ghost\" href=\"#tp2\">Faire le TP2 exercice 2</a></div><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 5 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Comment l’ordre des messages est-il indiqué dans un diagramme de collaboration ?</div><button class=\"opt\" data-o=\"0\">Par leur position verticale</button><button class=\"opt\" data-o=\"1\">Par leur numéro</button><button class=\"opt\" data-o=\"2\">Par leur couleur</button><button class=\"opt\" data-o=\"3\">Il n’est pas indiqué</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Un message 1.3.a et un message 1.3.b sont…</div><button class=\"opt\" data-o=\"0\">successifs</button><button class=\"opt\" data-o=\"1\">simultanés</button><button class=\"opt\" data-o=\"2\">conditionnels</button><button class=\"opt\" data-o=\"3\">des retours</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Que signifie « 1, 2, 4 / 3 : msg() » ?</div><button class=\"opt\" data-o=\"0\">Le message 3 est envoyé 1, 2 et 4 fois</button><button class=\"opt\" data-o=\"1\">Le message 3 attend que 1, 2 et 4 aient été échangés</button><button class=\"opt\" data-o=\"2\">Les messages 1, 2, 4 sont annulés</button><button class=\"opt\" data-o=\"3\">Le message 3 est parallèle</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Que signifie « 3 / *||[i := 1..5] : fermer() » ?</div><button class=\"opt\" data-o=\"0\">5 envois séquentiels avant 3</button><button class=\"opt\" data-o=\"1\">5 envois en parallèle après le message 3</button><button class=\"opt\" data-o=\"2\">Un envoi si i vaut 5</button><button class=\"opt\" data-o=\"3\">Une erreur de syntaxe</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Un objet créé puis détruit dans la même interaction porte…</div><button class=\"opt\" data-o=\"0\">{nouveau}</button><button class=\"opt\" data-o=\"1\">{détruit}</button><button class=\"opt\" data-o=\"2\">{transitoire}</button><button class=\"opt\" data-o=\"3\">{persistant}</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Le message 2.1 est envoyé…</div><button class=\"opt\" data-o=\"0\">par l’acteur, après le message 2</button><button class=\"opt\" data-o=\"1\">par le récepteur du message 2, pendant son traitement</button><button class=\"opt\" data-o=\"2\">en même temps que 2</button><button class=\"opt\" data-o=\"3\">avant 2</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Différence visuelle principale avec la séquence ?</div><button class=\"opt\" data-o=\"0\">Il n’y a pas d’objets</button><button class=\"opt\" data-o=\"1\">Organisation spatiale avec liens explicites, ordre par numéros</button><button class=\"opt\" data-o=\"2\">Les messages sont en pointillé</button><button class=\"opt\" data-o=\"3\">Il y a des couloirs</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Où écrit-on la condition d’envoi ?</div><button class=\"opt\" data-o=\"0\">[poids &gt; 300] 2 : sonner()</button><button class=\"opt\" data-o=\"1\">2 : sonner() if poids &gt; 300</button><button class=\"opt\" data-o=\"2\">{poids &gt; 300}</button><button class=\"opt\" data-o=\"3\">dans une note</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Un objet persistant…</div><button class=\"opt\" data-o=\"0\">disparaît à la fin du processus qui l’a créé</button><button class=\"opt\" data-o=\"1\">continue d’exister après la fin du processus qui l’a créé</button><button class=\"opt\" data-o=\"2\">est toujours un acteur</button><button class=\"opt\" data-o=\"3\">n’a pas de lien</button><div class=\"qq-e\" hidden></div></div></section>","ex":[],"qcm":[{"n":"ch6","q":"Comment l’ordre des messages est-il indiqué dans un diagramme de collaboration ?","o":["Par leur position verticale","Par leur numéro","Par leur couleur","Il n’est pas indiqué"],"a":1,"e":"Chaque message est numéroté (diapo 130)."},{"n":"ch6","q":"Un message 1.3.a et un message 1.3.b sont…","o":["successifs","simultanés","conditionnels","des retours"],"a":1,"e":"Les lettres indiquent l’envoi simultané (diapo 141)."},{"n":"ch6","q":"Que signifie « 1, 2, 4 / 3 : msg() » ?","o":["Le message 3 est envoyé 1, 2 et 4 fois","Le message 3 attend que 1, 2 et 4 aient été échangés","Les messages 1, 2, 4 sont annulés","Le message 3 est parallèle"],"a":1,"e":"Liste des prédécesseurs suivie de / (diapo 142)."},{"n":"ch6","q":"Que signifie « 3 / *||[i := 1..5] : fermer() » ?","o":["5 envois séquentiels avant 3","5 envois en parallèle après le message 3","Un envoi si i vaut 5","Une erreur de syntaxe"],"a":1,"e":"*|| = récurrence parallèle (diapo 143)."},{"n":"ch6","q":"Un objet créé puis détruit dans la même interaction porte…","o":["{nouveau}","{détruit}","{transitoire}","{persistant}"],"a":2,"e":"Diapo 149."},{"n":"ch6","q":"Le message 2.1 est envoyé…","o":["par l’acteur, après le message 2","par le récepteur du message 2, pendant son traitement","en même temps que 2","avant 2"],"a":1,"e":"Numérotation hiérarchique : imbrication des traitements."},{"n":"ch6","q":"Différence visuelle principale avec la séquence ?","o":["Il n’y a pas d’objets","Organisation spatiale avec liens explicites, ordre par numéros","Les messages sont en pointillé","Il y a des couloirs"],"a":1,"e":"Réponse attendue au TP2 exercice 2."},{"n":"ch6","q":"Où écrit-on la condition d’envoi ?","o":["[poids &gt; 300] 2 : sonner()","2 : sonner() if poids &gt; 300","{poids &gt; 300}","dans une note"],"a":0,"e":"Entre crochets, devant le message (diapo 146)."},{"n":"ch6","q":"Un objet persistant…","o":["disparaît à la fin du processus qui l’a créé","continue d’exister après la fin du processus qui l’a créé","est toujours un acteur","n’a pas de lien"],"a":1,"e":"Diapo 135."}]},{"id":"ch7","t":"Diagramme d’activités","seance":"Cours · diapos 153–180","imp":4,"html":"<p class=\"lede\">Un organigramme amélioré : il décrit le déroulement d’un traitement, ses choix et ses actions en parallèle, et qui fait quoi grâce aux couloirs.</p>\n<section class=\"xpl\"><p class=\"xlab\">Comprendre, en clair · fil rouge : la bibliothèque de la fac</p><div class=\"xana\"><b>L'analogie</b> Le diagramme d'activités, c'est une <b>recette de cuisine</b> en organigramme : les étapes (actions), les choix (« si la pâte colle, ajouter de la farine »), les étapes qu'on fait <b>en même temps</b> (préchauffer le four pendant qu'on pétrit) et qui s'en occupe (les couloirs).</div><div class=\"xfig\"><svg viewBox=\"0 0 640 315\" role=\"img\" aria-label=\"diagramme d'activités avec couloirs\" style=\"width:100%;min-width:520px;color:var(--ink)\" font-family=\"var(--f-body),system-ui,sans-serif\" font-size=\"12\"><defs>\n<marker id=\"uTri8\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0 L12 6 L0 12 Z\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></path></marker>\n<marker id=\"uArr8\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 Z\" fill=\"currentColor\"></path></marker>\n<marker id=\"uOpen8\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10\" fill=\"none\" stroke=\"currentColor\"></path></marker>\n<marker id=\"uDiaO8\" viewBox=\"0 0 16 10\" refX=\"1\" refY=\"5\" markerWidth=\"16\" markerHeight=\"10\" orient=\"auto\"><path d=\"M0 5 L8 0 L16 5 L8 10 Z\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></path></marker>\n<marker id=\"uDiaF8\" viewBox=\"0 0 16 10\" refX=\"1\" refY=\"5\" markerWidth=\"16\" markerHeight=\"10\" orient=\"auto\"><path d=\"M0 5 L8 0 L16 5 L8 10 Z\" fill=\"currentColor\"></path></marker>\n</defs><rect x=\"10\" y=\"10\" width=\"300\" height=\"300\" fill=\"none\" stroke=\"currentColor\"></rect><rect x=\"310\" y=\"10\" width=\"320\" height=\"300\" fill=\"none\" stroke=\"currentColor\"></rect><text x=\"160\" y=\"28\" text-anchor=\"middle\" font-weight=\"700\">Adhérent</text><text x=\"470\" y=\"28\" text-anchor=\"middle\" font-weight=\"700\">Bibliothécaire</text><line x1=\"10\" y1=\"36\" x2=\"630\" y2=\"36\" stroke=\"currentColor\"></line><circle cx=\"160\" cy=\"55\" r=\"8\" fill=\"currentColor\"></circle><rect x=\"95\" y=\"75\" width=\"130\" height=\"28\" rx=\"12\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></rect><text x=\"160\" y=\"93\" text-anchor=\"middle\" font-size=\"11\">Présenter sa carte</text><rect x=\"400\" y=\"75\" width=\"140\" height=\"28\" rx=\"12\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></rect><text x=\"470\" y=\"93\" text-anchor=\"middle\" font-size=\"11\">Vérifier les retards</text><path d=\"M470 120 L485 135 L470 150 L455 135 Z\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></path><text x=\"490\" y=\"128\" font-size=\"10\">[retard]</text><text x=\"380\" y=\"165\" font-size=\"10\">[à jour]</text><rect x=\"535\" y=\"150\" width=\"90\" height=\"28\" rx=\"12\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></rect><text x=\"580\" y=\"168\" text-anchor=\"middle\" font-size=\"11\">Refuser le prêt</text><rect x=\"330\" y=\"180\" width=\"190\" height=\"5\" fill=\"currentColor\"></rect><rect x=\"320\" y=\"205\" width=\"110\" height=\"28\" rx=\"12\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></rect><text x=\"375\" y=\"223\" text-anchor=\"middle\" font-size=\"11\">Scanner le livre</text><rect x=\"440\" y=\"205\" width=\"110\" height=\"28\" rx=\"12\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></rect><text x=\"495\" y=\"223\" text-anchor=\"middle\" font-size=\"11\">Imprimer le ticket</text><rect x=\"330\" y=\"248\" width=\"190\" height=\"5\" fill=\"currentColor\"></rect><rect x=\"95\" y=\"255\" width=\"130\" height=\"28\" rx=\"12\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></rect><text x=\"160\" y=\"273\" text-anchor=\"middle\" font-size=\"11\">Prendre le livre</text><circle cx=\"160\" cy=\"298\" r=\"9\" fill=\"none\" stroke=\"currentColor\"></circle><circle cx=\"160\" cy=\"298\" r=\"5\" fill=\"currentColor\"></circle><path d=\"M160 63 L160 75\" stroke=\"currentColor\" marker-end=\"url(#uOpen8)\"></path><path d=\"M225 89 L400 89\" stroke=\"currentColor\" marker-end=\"url(#uOpen8)\"></path><path d=\"M470 103 L470 120\" stroke=\"currentColor\" marker-end=\"url(#uOpen8)\"></path><path d=\"M485 135 L580 135 L580 150\" fill=\"none\" stroke=\"currentColor\" marker-end=\"url(#uOpen8)\"></path><path d=\"M455 135 L430 135 L430 180\" fill=\"none\" stroke=\"currentColor\" marker-end=\"url(#uOpen8)\"></path><path d=\"M375 185 L375 205\" stroke=\"currentColor\" marker-end=\"url(#uOpen8)\"></path><path d=\"M495 185 L495 205\" stroke=\"currentColor\" marker-end=\"url(#uOpen8)\"></path><path d=\"M375 233 L375 248\" stroke=\"currentColor\" marker-end=\"url(#uOpen8)\"></path><path d=\"M495 233 L495 248\" stroke=\"currentColor\" marker-end=\"url(#uOpen8)\"></path><path d=\"M330 252 L160 252 L160 255\" fill=\"none\" stroke=\"currentColor\" marker-end=\"url(#uOpen8)\"></path><path d=\"M160 283 L160 289\" stroke=\"currentColor\" marker-end=\"url(#uOpen8)\"></path></svg></div><div class=\"xkey\"><b>Les nœuds à reconnaître</b> : ● début ; ◉ fin ; ◇ décision (sorties avec des <b>gardes</b> entre crochets) puis fusion ; barre épaisse = <b>fork</b> (on se sépare en parallèle) puis <b>join</b> (on attend que tout soit fini). Les <b>couloirs</b> (swimlanes) disent qui fait quoi.</div><div class=\"xtrap\"><b>Piège</b> Décision ≠ parallélisme. Après un losange, <b>une seule</b> branche est suivie ; après une barre de fork, <b>toutes</b> les branches s'exécutent et la barre de join attend la dernière.</div><details class=\"xchk\"><summary>À toi : 3 questions éclair</summary><ol><li>Quel nœud pour « scanner le livre et imprimer le ticket en même temps » ? <i>Réponse : un fork (barre épaisse), puis un join.</i></li><li>Comment écrit-on la condition d'une sortie de décision ? <i>Réponse : une garde entre crochets, par exemple [retard].</i></li><li>À quoi servent les couloirs ? <i>Réponse : à montrer quel acteur ou service réalise chaque action.</i></li></ol></details></section><p class=\"fichelab\">Le cours du prof (à retenir)</p>\n  <div class=\"prose\">\n  <h2>1. Point de départ : les processus de l’entreprise <span class=\"src\">diapos 153–154</span></h2>\n  <p>Le prof introduit le chapitre par la cartographie des processus : processus de <b>pilotage</b> (direction, finance, management des SI), processus <b>métier</b> (commercialisation, facturation, service après-vente, satisfaction client), processus <b>support</b> (gestion des SI, réseaux, RH, achats). Le diagramme d’activités sert justement à modéliser ces processus.</p>\n  <h2>2. Définition <span class=\"src\">diapos 155–157</span></h2>\n  <ul>\n    <li>Il offre un graphe d’activités qui modélise le comportement interne d’une <b>méthode</b>, d’un <b>cas d’utilisation</b> ou d’un <b>processus métier</b>.</li>\n    <li>Il décrit le déroulement d’étapes regroupées séquentiellement dans des branches parallèles de flots de contrôle.</li>\n    <li>Il <b>ne représente ni la collaboration ni le comportement des objets</b>.</li>\n    <li>C’est une <b>variante du diagramme d’états-transitions</b>.</li>\n    <li>Il met l’accent sur les <b>traitements</b> : flots de contrôle et flots de données.</li>\n  </ul>\n  <p>Domaines d’application : processus métier, cas d’utilisation (famille de scénarios), logique complexe d’une opération.</p>\n\n  <h2>3. Activité, action, transition</h2>\n  <div class=\"tw\"><table>\n    <tbody><tr><th>Élément</th><th>Définition</th></tr>\n    <tr><td><b>Activité</b></td><td>Comportement décrit par un séquencement organisé d’actions ; le flot reste dans l’activité jusqu’à la fin des traitements. Une activité peut avoir des paramètres. <span class=\"src\">diapo 160</span></td></tr>\n    <tr><td><b>Action</b></td><td>Le plus petit traitement modélisé en UML, <b>atomique et non interru
