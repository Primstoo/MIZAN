it en fixant un objet de chacune des <b>autres</b> classes. C’est délicat : quand c’est possible, préfère transformer l’association en classe (Séance) reliée par des associations binaires. Les deux solutions sont acceptées dans le cours.</p></div>\n\n  <div class=\"prose\">\n  <h2>5. La classe-association</h2>\n  <p>Parfois, une association doit porter de l’information. Ces propriétés n’appartiennent à aucune des classes reliées, et une simple association ne peut pas les porter. D’où la <b>classe-association</b> : une classe reliée par un <b>trait pointillé</b> au milieu de l’association. <span class=\"src\">diapos 55–57</span></p>\n  </div>\n  <figure class=\"dgw\" data-d=\"c_aclass\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"9 26 527 226\" width=\"527\" data-w=\"527\" style=\"max-width: 100%; height: auto;\"><g><g></g><g><polyline points=\"96.5,60 437.5,60\" class=\"dg-l dg-nofill\"></polyline><text x=\"267\" y=\"47\" text-anchor=\"middle\" class=\"dg-t dg-halo \" font-size=\"12\"><tspan x=\"267\" dy=\"4\">emploie ▸</tspan></text><text x=\"103.5\" y=\"53\" text-anchor=\"start\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"103.5\" dy=\"4\">*</tspan></text><text x=\"430.5\" y=\"53\" text-anchor=\"end\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"430.5\" dy=\"4\">*</tspan></text><polyline points=\"270,142 270,60\" class=\"dg-l dg-nofill dg-dash\"></polyline></g><g><rect x=\"23.5\" y=\"45.5\" width=\"73\" height=\"29\" class=\"dg-box\"></rect><text x=\"60\" y=\"61.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Société</text><rect x=\"437.5\" y=\"45.5\" width=\"85\" height=\"29\" class=\"dg-box\"></rect><text x=\"480\" y=\"61.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Personne</text><rect x=\"178\" y=\"142\" width=\"184\" height=\"96\" class=\"dg-box dg-hl\"></rect><text x=\"270\" y=\"158\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Emploi</text><line x1=\"178\" y1=\"171\" x2=\"362\" y2=\"171\" class=\"dg-l\"></line><text x=\"187\" y=\"184.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">dateEmbauche : Date</text><text x=\"187\" y=\"201.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">salaire : float</text><line x1=\"178\" y1=\"213\" x2=\"362\" y2=\"213\" class=\"dg-l\"></line><text x=\"187\" y=\"226.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">augmenter(taux : float) : void</text></g></g></svg></div><figcaption>La date d’embauche et le salaire n’appartiennent ni à la Société (elle a plusieurs employés) ni à la Personne (elle peut avoir plusieurs emplois) : ils appartiennent au couple (Société, Personne).</figcaption></figure>\n  <div class=\"prose\">\n  <div class=\"box retenir\"><span class=\"tag\">Test pour savoir s’il faut une classe-association</span>\n    <p>Pose la question : « cette information dépend-elle des <b>deux</b> objets à la fois ? ». Le salaire dépend de la personne <b>et</b> de la société qui l’emploie : classe-association. La date de naissance ne dépend que de la personne : attribut de Personne.</p>\n  </div>\n  <p>Variantes vues en cours :</p>\n  <ul>\n    <li><b>Classe-association réflexive</b> : Emploi peut avoir une association « supérieure de » vers lui-même (diapo 58) ; un Poste_travail peut être client ou serveur d’un autre (diapo 59).</li>\n    <li>Une classe-association peut <b>participer à d’autres associations</b> (diapo 60) : elle est une vraie classe.</li>\n    <li>Une classe-association peut porter une association <b>n-aire</b> (diapo 61 : Séance avec NbHeure et Date).</li>\n  </ul>\n  <div class=\"box piege\"><span class=\"tag\">Piège qui distingue un 16 d’un 12</span>\n    <p>Une classe-association a <b>une seule instance par couple d’objets</b>. Si le même client peut réserver deux fois la même chambre à des dates différentes, une classe-association Réservation ne suffit plus en toute rigueur : il faut une classe Réservation ordinaire reliée à Client et à Chambre. Quand l’énoncé impose la classe-association (TP1), fais-la, et ajoute cette remarque : c’est le genre de détail qui montre que tu as compris.</p>\n  </div>\n\n  <h2>6. L’agrégation</h2>\n  <p>L’agrégation est une association <b>non symétrique</b> qui représente un lien de type <b>ensemble / élément</b> (« se compose de », « tout et partie »). Une extrémité joue un rôle prédominant. Notation : <b>losange vide du côté du tout</b> (l’agrégat). <span class=\"src\">diapos 62–64</span></p>\n  <p>On l’utilise quand une classe fait partie d’une autre, quand une action sur l’une implique une action sur l’autre, ou quand les objets d’une classe sont subordonnés à ceux d’une autre.</p>\n  </div>\n  <figure class=\"dgw\" data-d=\"c_agg\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"4 10 585 99\" width=\"585\" data-w=\"585\" style=\"max-width: 100%; height: auto;\"><g><g></g><g><polyline points=\"102,60 265,60\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"102,60 112,66 122,60 112,54\" class=\"dg-hollow\"></polygon><text x=\"128\" y=\"53\" text-anchor=\"start\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"128\" dy=\"4\">*</tspan></text><text x=\"258\" y=\"53\" text-anchor=\"end\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"258\" dy=\"4\">3..*</tspan></text><polyline points=\"505,60 335,60\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"505,60 495,54 485,60 495,66\" class=\"dg-hollow\"></polygon><text x=\"420\" y=\"47\" text-anchor=\"middle\" class=\"dg-t dg-halo \" font-size=\"12\"><tspan x=\"420\" dy=\"4\">centre</tspan></text><text x=\"479\" y=\"53\" text-anchor=\"end\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"479\" dy=\"4\">*</tspan></text><text x=\"342\" y=\"53\" text-anchor=\"start\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"342\" dy=\"4\">1</tspan></text></g><g><rect x=\"18\" y=\"45.5\" width=\"84\" height=\"29\" class=\"dg-box\"></rect><text x=\"60\" y=\"61.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Polygone</text><rect x=\"265\" y=\"24.5\" width=\"70\" height=\"71\" class=\"dg-box\"></rect><text x=\"300\" y=\"40.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Point</text><line x1=\"265\" y1=\"53.5\" x2=\"335\" y2=\"53.5\" class=\"dg-l\"></line><text x=\"274\" y=\"67\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">x : float</text><text x=\"274\" y=\"84\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">y : float</text><rect x=\"505\" y=\"45.5\" width=\"70\" height=\"29\" class=\"dg-box\"></rect><text x=\"540\" y=\"61.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Cercle</text></g></g></svg></div><figcaption>Un même point peut appartenir à plusieurs polygones et être le centre de plusieurs cercles : la partie est <b>partageable</b>, c’est une agrégation.</figcaption></figure>\n\n  <div class=\"prose\">\n  <h2>7. La composition</h2>\n  <p>La composition est une agrégation <b>forte</b>, avec une contrainte de durée de vie entre le composant et le composite. Notation : <b>losange plein du côté du composite</b>. <span class=\"src\">diapos 65–69</span></p>\n  <div class=\"box retenir\"><span class=\"tag\">Les trois contraintes de la composition (diapo 66)</span>\n    <ol>\n      <li>Un composant ne peut être que dans <b>un seul</b> composite.</li>\n      <li>Un composant n’existe pas sans son composite.</li>\n      <li>Si le composite est détruit, ses composants le sont aussi.</li>\n    </ol>\n    <p>Conséquence : la multiplicité côté composite est <b>1</b> (ou <code>0..1</code>), jamais plus.</p>\n  </div>\n  </div>\n  <figure class=\"dgw\" data-d=\"c_comp\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"-2 31 572 187\" width=\"572\" data-w=\"572\" style=\"max-width: 100%; height: auto;\"><g><g></g><g><polyline points=\"95,60 250.5,60\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"95,60 105,66 115,60 105,54\" class=\"dg-fill\"></polygon><text x=\"121\" y=\"53\" text-anchor=\"start\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"121\" dy=\"4\">1</tspan></text><text x=\"243.5\" y=\"53\" text-anchor=\"end\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"243.5\" dy=\"4\">1..*</tspan></text><polyline points=\"329.5,60 483.5,60\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"329.5,60 339.5,66 349.5,60 339.5,54\" class=\"dg-fill\"></polygon><text x=\"355.5\" y=\"53\" text-anchor=\"start\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"355.5\" dy=\"4\">1</tspan></text><text x=\"476.5\" y=\"53\" text-anchor=\"end\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"476.5\" dy=\"4\">1..*</tspan></text><polyline points=\"60,74.5 60,175.5\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"60,74.5 54,84.5 60,94.5 66,84.5\" class=\"dg-hollow\"></polygon><text x=\"53\" y=\"108.5\" text-anchor=\"end\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"53\" dy=\"4\">1</tspan></text><text x=\"53\" y=\"164.5\" text-anchor=\"end\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"53\" dy=\"4\">0..1</tspan></text></g><g><rect x=\"25\" y=\"45.5\" width=\"70\" height=\"29\" class=\"dg-box\"></rect><text x=\"60\" y=\"61.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Livre</text><rect x=\"250.5\" y=\"45.5\" width=\"79\" height=\"29\" class=\"dg-box\"></rect><text x=\"290\" y=\"61.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Chapitre</text><rect x=\"483.5\" y=\"45.5\" width=\"73\" height=\"29\" class=\"dg-box\"></rect><text x=\"520\" y=\"61.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Section</text><rect x=\"12.5\" y=\"175.5\" width=\"95\" height=\"29\" class=\"dg-box\"></rect><text x=\"60\" y=\"191.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Couverture</text></g></g></svg></div><figcaption>Un livre est composé de chapitres, eux-mêmes composés de sections (composition). La couverture est une agrégation dans l’exemple du prof (diapo 68) : le livre <i>peut</i> avoir une couverture.</figcaption></figure>\n  <div class=\"tw\"><table>\n    <tbody><tr><th></th><th>Association simple</th><th>Agrégation ◇</th><th>Composition ◆</th></tr>\n    <tr><td>Sens</td><td>« est en relation avec »</td><td>« contient / se compose de » (faible)</td><td>« est fait de » (fort)</td></tr>\n    <tr><td>Partage de la partie</td><td>—</td><td>possible</td><td>interdit</td></tr>\n    <tr><td>Destruction du tout</td><td>sans effet</td><td>la partie survit</td><td>la partie est détruite</td></tr>\n    <tr><td>Multiplicité côté tout</td><td>libre</td><td>libre</td><td>1 ou 0..1</td></tr>\n    <tr><td>Exemple</td><td>Client — Voiture (louer)</td><td>Équipe ◇— Joueur</td><td>Hôtel ◆— Chambre</td></tr>\n  </tbody></table></div>\n  <div class=\"box piege\"><span class=\"tag\">Pièges</span>\n    <ul>\n      <li>Le losange est <b>toujours du côté du tout</b>, jamais du côté de la partie.</li>\n      <li>Composition avec <code>1..*</code> côté composite : contradiction avec la contrainte 1.</li>\n      <li>Test rapide : « si je supprime le tout, la partie disparaît-elle ? ». Oui : composition. Non : agrégation ou association.</li>\n    </ul>\n  </div>\n\n  <div class=\"prose\">\n  <h2>8. Généralisation, spécialisation, héritage</h2>\n  <ul>\n    <li>La <b>généralisation</b> crée une super-classe à partir de classes existantes (on remonte ce qu’elles ont en commun).</li>\n    <li>La <b>spécialisation</b> crée des sous-classes à partir d’une classe (on descend vers le particulier).</li>\n    <li>Les attributs et opérations de la super-classe sont transmis aux sous-classes par <b>héritage</b>.</li>\n    <li>Héritage simple : chaque sous-classe a une seule classe parente.</li>\n  </ul>\n  <p>Notation : trait plein terminé par un <b>triangle vide pointant vers la classe générale</b>. Plusieurs sous-classes peuvent partager le même triangle. <span class=\"src\">diapos 70–72</span></p>\n  </div>\n  <figure class=\"dgw\" data-d=\"c_gen\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"-12 -19 624 351\" width=\"624\" data-w=\"624\" style=\"max-width: 100%; height: auto;\"><g><g></g><g><polyline points=\"70,222 70,185 300,185\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"300,230.5 300,185\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"530,230.5 530,185 300,185\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"300,185 300,125\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"291,140 300,125 309,140\" class=\"dg-hollow\"></polygon></g><g><rect x=\"228\" y=\"-5\" width=\"144\" height=\"130\" class=\"dg-box\"></rect><text x=\"300\" y=\"11\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\" font-style=\"italic\">Employé</text><line x1=\"228\" y1=\"24\" x2=\"372\" y2=\"24\" class=\"dg-l\"></line><text x=\"237\" y=\"37.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">nom : String</text><text x=\"237\" y=\"54.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">prénom : String</text><text x=\"237\" y=\"71.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">dateNaissance : Date</text><line x1=\"228\" y1=\"83\" x2=\"372\" y2=\"83\" class=\"dg-l\"></line><text x=\"237\" y=\"96.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">calculerÂge() : int</text><text x=\"237\" y=\"113.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\" font-style=\"italic\">calculerPaie() : float</text><rect x=\"2.5\" y=\"222\" width=\"135\" height=\"96\" class=\"dg-box\"></rect><text x=\"70\" y=\"238\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">EmployéHoraire</text><line x1=\"2.5\" y1=\"251\" x2=\"137.5\" y2=\"251\" class=\"dg-l\"></line><text x=\"11.5\" y=\"264.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">tauxHoraire : float</text><text x=\"11.5\" y=\"281.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">heuresSup : int</text><line x1=\"2.5\" y1=\"293\" x2=\"137.5\" y2=\"293\" class=\"dg-l\"></line><text x=\"11.5\" y=\"306.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">calculerPaie() : float</text><rect x=\"218\" y=\"230.5\" width=\"164\" height=\"79\" class=\"dg-box\"></rect><text x=\"300\" y=\"246.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">EmployéSalarié</text><line x1=\"218\" y1=\"259.5\" x2=\"382\" y2=\"259.5\" class=\"dg-l\"></line><text x=\"227\" y=\"273\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">tauxHebdomadaire : float</text><line x1=\"218\" y1=\"284.5\" x2=\"382\" y2=\"284.5\" class=\"dg-l\"></line><text x=\"227\" y=\"298\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">calculerPaie() : float</text><rect x=\"461.5\" y=\"230.5\" width=\"137\" height=\"79\" class=\"dg-box\"></rect><text x=\"530\" y=\"246.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Vacataire</text><line x1=\"461.5\" y1=\"259.5\" x2=\"598.5\" y2=\"259.5\" class=\"dg-l\"></line><text x=\"470.5\" y=\"273\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">tauxJournalier : float</text><line x1=\"461.5\" y1=\"284.5\" x2=\"598.5\" y2=\"284.5\" class=\"dg-l\"></line><text x=\"470.5\" y=\"298\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">calculerPaie() : float</text></g></g></svg></div><figcaption>Employé factorise ce qui est commun. Chaque sous-classe ajoute ses attributs et redéfinit <code>calculerPaie()</code> : c’est le polymorphisme. Employé est ici abstraite (italique).</figcaption></figure>\n  <div class=\"box retenir\"><span class=\"tag\">Test « est un » contre « a un »</span>\n    <p>« Un vacataire <b>est un</b> employé » : héritage. « Un employé <b>a un</b> bureau » : association. Si la phrase « est un » sonne faux, ce n’est pas un héritage.</p>\n  </div>\n  <div class=\"prose\">\n  <h3>Héritage multiple <span class=\"src\">diapo 73</span></h3>\n  <p>Une classe hérite de deux classes parentes distinctes.</p>\n  </div>\n  <figure class=\"dgw\" data-d=\"c_multi\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"-17 0 509 249\" width=\"509\" data-w=\"509\" style=\"max-width: 100%; height: auto;\"><g><g></g><g><polyline points=\"203.58333333333334,164.5 111.41666666666666,85.5\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"116.94839334104239,102.09518002312718 111.41666666666666,85.5 128.66263806324983,88.42856118055185\" class=\"dg-hollow\"></polygon><polyline points=\"286.4166666666667,164.5 378.5833333333333,85.5\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"361.33736193675014,88.42856118055187 378.5833333333333,85.5 373.0516066589576,102.0951800231272\" class=\"dg-hollow\"></polygon></g><g><rect x=\"-2.5\" y=\"14.5\" width=\"145\" height=\"71\" class=\"dg-box\"></rect><text x=\"70\" y=\"30.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Stagiaire</text><line x1=\"-2.5\" y1=\"43.5\" x2=\"142.5\" y2=\"43.5\" class=\"dg-l\"></line><text x=\"6.5\" y=\"57\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">numStag : int</text><text x=\"6.5\" y=\"74\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">dateInscription : Date</text><rect x=\"361.5\" y=\"14.5\" width=\"117\" height=\"71\" class=\"dg-box\"></rect><text x=\"420\" y=\"30.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Pilote</text><line x1=\"361.5\" y1=\"43.5\" x2=\"478.5\" y2=\"43.5\" class=\"dg-l\"></line><text x=\"370.5\" y=\"57\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">numPil : int</text><text x=\"370.5\" y=\"74\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">nbHeuresVol : int</text><rect x=\"181\" y=\"164.5\" width=\"128\" height=\"71\" class=\"dg-box\"></rect><text x=\"245\" y=\"180.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">ElèvePilote</text><line x1=\"181\" y1=\"193.5\" x2=\"309\" y2=\"193.5\" class=\"dg-l\"></line><text x=\"190\" y=\"207\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">dateExamen : Date</text><text x=\"190\" y=\"224\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">note : float</text></g></g></svg></div><figcaption>Un élève pilote est à la fois stagiaire et pilote.</figcaption></figure>\n  <div class=\"prose\">\n  <h3>Contraintes sur l’héritage <span class=\"src\">diapos 74–75</span></h3>\n  <div class=\"tw\"><table>\n    <tbody><tr><th>Contrainte</th><th>Sens</th></tr>\n    <tr><td><code>{disjoint}</code></td><td>un objet ne peut pas appartenir à deux sous-classes à la fois</td></tr>\n    <tr><td><code>{chevauchement}</code></td><td>un objet peut appartenir à plusieurs sous-classes (une personne étudiante et employée)</td></tr>\n    <tr><td><code>{complète}</code></td><td>toutes les sous-classes sont listées ; on ne peut pas en ajouter</td></tr>\n    <tr><td><code>{incomplète}</code></td><td>d’autres sous-classes peuvent être ajoutées</td></tr>\n  </tbody></table></div>\n  </div>\n  <figure class=\"dgw\" data-d=\"c_overlap\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"63 11 463 317\" width=\"463\" data-w=\"463\" style=\"max-width: 100%; height: auto;\"><g><g></g><g><polyline points=\"140,285.5 140,184.5\" class=\"dg-l dg-nofill\"></polyline><text x=\"129\" y=\"239\" text-anchor=\"end\" class=\"dg-t dg-halo \" font-size=\"12\"><tspan x=\"129\" dy=\"4\">est inscrit</tspan></text><text x=\"147\" y=\"274.5\" text-anchor=\"start\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"147\" dy=\"4\">1</tspan></text><text x=\"147\" y=\"203.5\" text-anchor=\"start\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"147\" dy=\"4\">1..*</tspan></text><polyline points=\"460,285.5 460,184.5\" class=\"dg-l dg-nofill\"></polyline><text x=\"471\" y=\"239\" text-anchor=\"start\" class=\"dg-t dg-halo \" font-size=\"12\"><tspan x=\"471\" dy=\"4\">travaille</tspan></text><text x=\"467\" y=\"274.5\" text-anchor=\"start\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"467\" dy=\"4\">1</tspan></text><text x=\"467\" y=\"203.5\" text-anchor=\"start\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"467\" dy=\"4\">1..*</tspan></text><polyline points=\"140,155.5 140,100 300,100\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"460,155.5 460,100 300,100\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"300,100 300,54.5\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"291,69.5 300,54.5 309,69.5\" class=\"dg-hollow\"></polygon></g><g><rect x=\"257.5\" y=\"25.5\" width=\"85\" height=\"29\" class=\"dg-box\"></rect><text x=\"300\" y=\"41.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Personne</text><rect x=\"101\" y=\"155.5\" width=\"78\" height=\"29\" class=\"dg-box\"></rect><text x=\"140\" y=\"171.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Étudiant</text><rect x=\"420.5\" y=\"155.5\" width=\"79\" height=\"29\" class=\"dg-box\"></rect><text x=\"460\" y=\"171.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Employé</text><rect x=\"95.5\" y=\"285.5\" width=\"89\" height=\"29\" class=\"dg-box\"></rect><text x=\"140\" y=\"301.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Université</text><rect x=\"415\" y=\"285.5\" width=\"90\" height=\"29\" class=\"dg-box\"></rect><text x=\"460\" y=\"301.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Entreprise</text><text x=\"300\" y=\"122\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t dg-cons\" font-size=\"12.5\" font-weight=\"400\" font-style=\"italic\">{chevauchement, incomplète}</text></g></g></svg></div><figcaption>Une même personne peut être étudiante dans une université et employée dans une entreprise.</figcaption></figure>\n\n  <div class=\"prose\">\n  <h2>9. Contraintes sur les associations</h2>\n  <p>Une <b>contrainte</b> est une relation sémantique qui fixe des conditions à respecter. Elle s’écrit en langage naturel <b>entre accolades</b>. <span class=\"src\">diapos 76–77</span></p>\n  </div>\n  <figure class=\"dgw\" data-d=\"c_ou\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"22 11 374 277\" width=\"374\" data-w=\"374\" style=\"max-width: 100%; height: auto;\"><g><g></g><g><polyline points=\"150,54 90,54 90,246 150,246\" class=\"dg-l dg-nofill\"></polyline><text x=\"79\" y=\"154\" text-anchor=\"end\" class=\"dg-t dg-halo \" font-size=\"12\"><tspan x=\"79\" dy=\"4\">étudiant</tspan></text><text x=\"143\" y=\"47\" text-anchor=\"end\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"143\" dy=\"4\">0..n</tspan></text><text x=\"143\" y=\"239\" text-anchor=\"end\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"143\" dy=\"4\">1..n</tspan></text><polyline points=\"250,54 310,54 310,246 250,246\" class=\"dg-l dg-nofill\"></polyline><text x=\"352\" y=\"154\" text-anchor=\"middle\" class=\"dg-t dg-halo \" font-size=\"12\"><tspan x=\"352\" dy=\"4\">enseignant</tspan></text><text x=\"257\" y=\"47\" text-anchor=\"start\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"257\" dy=\"4\">0..n</tspan></text><text x=\"257\" y=\"239\" text-anchor=\"start\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"257\" dy=\"4\">1..n</tspan></text><polyline points=\"90,150 182,150\" class=\"dg-l dg-nofill dg-dash\"></polyline><polyline points=\"218,150 310,150\" class=\"dg-l dg-nofill dg-dash\"></polyline></g><g><rect x=\"155.5\" y=\"25.5\" width=\"89\" height=\"29\" class=\"dg-box\"></rect><text x=\"200\" y=\"41.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Université</text><rect x=\"157.5\" y=\"245.5\" width=\"85\" height=\"29\" class=\"dg-box\"></rect><text x=\"200\" y=\"261.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Personne</text><text x=\"200\" y=\"150\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t dg-cons\" font-size=\"14\" font-weight=\"400\" font-style=\"italic\">{ou}</text></g></g></svg></div><figcaption><code>{ou}</code> (ou exclusif) : pour une université donnée, une personne est soit étudiante, soit enseignante, pas les deux.</figcaption></figure>\n  <p class=\"prose\">Autre exemple du cours : <code>{ordonnée}</code> sur l’association Compositeur — Œuvre indique que l’ordre de création des œuvres compte.</p>\n\n  <div class=\"prose\">\n  <h2>10. La démarche pour construire un diagramme de classes</h2>\n  <p>Les 6 étapes du cours <span class=\"src\">diapo 78</span> :</p>\n  <ol>\n    <li><b>Trouver les classes</b> du domaine : souvent les <b>noms communs</b> (substantifs) de l’énoncé.</li>\n    <li><b>Trouver les associations</b> : souvent les <b>verbes</b> qui relient plusieurs classes.</li>\n    <li><b>Trouver les attributs</b> : des substantifs plus fins que les classes ; les <b>adjectifs</b> et valeurs deviennent souvent des valeurs d’attributs.</li>\n    <li><b>Organiser et simplifier</b> avec l’héritage.</li>\n    <li><b>Tester les chemins d’accès</b> aux classes (peut-on retrouver toute information en suivant les associations ?).</li>\n    <li><b>Itérer et raffiner</b>.</li>\n  </ol>\n  <h3>Démarche appliquée sur une phrase</h3>\n  <p><i>« Un <u>département</u> a un <u>nom</u> et <b>possède</b> plusieurs <u>bureaux</u>. »</i></p>\n  <div class=\"tw\"><table>\n    <tbody><tr><th>Mot</th><th>Nature</th><th>Devient</th></tr>\n    <tr><td>département</td><td>nom avec des propriétés</td><td>classe <code>Département</code></td></tr>\n    <tr><td>nom</td><td>propriété simple</td><td>attribut <code>nom : String</code></td></tr>\n    <tr><td>possède</td><td>verbe reliant deux classes</td><td>association « possède »</td></tr>\n    <tr><td>plusieurs bureaux</td><td>quantité</td><td>multiplicité <code>1..*</code> côté Bureau</td></tr>\n  </tbody></table></div>\n  <div class=\"box retenir\"><span class=\"tag\">Attribut ou classe ?</span>\n    <p>Si la chose n’a qu’une valeur simple (un nom, une date, un prix) : attribut. Si elle a ses propres propriétés, ou si plusieurs objets la partagent, ou si elle est reliée à autre chose : classe. Un « vidéoprojecteur » avec une référence et un état : classe. Un « nombre de sièges » : attribut.</p>\n  </div>\n\n  <h2>11. Pont vers la programmation (complément)</h2>\n  <p>Ton module s’appelle « Programmation Objet UML » : savoir traduire un diagramme en code est un vrai plus.</p>\n  <div class=\"tw\"><table>\n    <tbody><tr><th>UML</th><th>Java</th><th>C++</th></tr>\n    <tr><td>classe <code>Client</code></td><td><code>class Client { }</code></td><td><code>class Client { };</code></td></tr>\n    <tr><td><code>- nom : String</code></td><td><code>private String nom;</code></td><td><code>private: std::string nom;</code></td></tr>\n    <tr><td><code>+ getNom() : String</code></td><td><code>public String getNom()</code></td><td><code>public: std::string getNom();</code></td></tr>\n    <tr><td>attribut ou opération soulignés</td><td><code>static</code></td><td><code>static</code></td></tr>\n    <tr><td>classe ou opération en italique</td><td><code>abstract</code></td><td>méthode virtuelle pure <code>= 0</code></td></tr>\n    <tr><td>héritage ▷</td><td><code>extends</code></td><td><code>: public Parent</code></td></tr>\n    <tr><td>réalisation d’interface</td><td><code>implements</code></td><td>héritage d’une classe abstraite</td></tr>\n    <tr><td>association vers <code>1</code></td><td>un attribut référence <code>Entreprise employeur;</code></td><td>pointeur ou référence</td></tr>\n    <tr><td>association vers <code>*</code></td><td><code>List&lt;Personne&gt; employes;</code></td><td><code>std::vector&lt;Personne*&gt;</code></td></tr>\n    <tr><td>composition</td><td>le composite crée ses parties (dans le constructeur) et ne les expose pas</td><td>membres par valeur, détruits avec l’objet</td></tr>\n  </tbody></table></div>\n\n  <h2>Pièges du chapitre</h2>\n  <div class=\"box piege\"><span class=\"tag\">Les erreurs qui coûtent des points</span>\n    <ul>\n      <li>Multiplicités placées du mauvais côté (refais les deux phrases de lecture).</li>\n      <li>Losange du côté de la partie au lieu du tout.</li>\n      <li>Triangle d’héritage pointant vers la sous-classe : il pointe vers le <b>parent</b>.</li>\n      <li>Mettre en attribut une référence à une autre classe (<code>client : Client</code>) <b>et</b> dessiner l’association : c’est une redondance. L’association suffit.</li>\n      <li>Oublier les multiplicités : en TP1 elles sont explicitement exigées.</li>\n      <li>Héritage là où la phrase « est un » est fausse.</li>\n      <li>Classe au pluriel ou en minuscule.</li>\n      <li>Attribut porté par la mauvaise classe alors qu’il dépend de deux classes (il fallait une classe-association).</li>\n    </ul>\n  </div>\n  </div>\n  <h2>Quiz du chapitre 2</h2>\n  \n  <div class=\"row\"><a class=\"btn ghost\" href=\"#td1\">Passer au TD1</a></div><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 13 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Le losange plein d’une composition se place…</div><button class=\"opt\" data-o=\"0\">du côté de la partie</button><button class=\"opt\" data-o=\"1\">du côté du tout (composite)</button><button class=\"opt\" data-o=\"2\">au milieu de l’association</button><button class=\"opt\" data-o=\"3\">indifféremment</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Le triangle vide de l’héritage pointe vers…</div><button class=\"opt\" data-o=\"0\">la sous-classe</button><button class=\"opt\" data-o=\"1\">la super-classe</button><button class=\"opt\" data-o=\"2\">la classe la plus utilisée</button><button class=\"opt\" data-o=\"3\">l’interface uniquement</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">« Une personne travaille pour 0..1 entreprise ; une entreprise emploie 1..* personnes ». Où écrit-on 1..* ?</div><button class=\"opt\" data-o=\"0\">À côté de Entreprise</button><button class=\"opt\" data-o=\"1\">À côté de Personne</button><button class=\"opt\" data-o=\"2\">Au milieu</button><button class=\"opt\" data-o=\"3\">Les deux côtés</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Quelle multiplicité est interdite côté composite dans une composition ?</div><button class=\"opt\" data-o=\"0\">1</button><button class=\"opt\" data-o=\"1\">0..1</button><button class=\"opt\" data-o=\"2\">1..*</button><button class=\"opt\" data-o=\"3\">Aucune</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Comment note-t-on un attribut dérivé ?</div><button class=\"opt\" data-o=\"0\">En italique</button><button class=\"opt\" data-o=\"1\">Souligné</button><button class=\"opt\" data-o=\"2\">Précédé de /</button><button class=\"opt\" data-o=\"3\">Entre accolades</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Une opération statique (de classe) est…</div><button class=\"opt\" data-o=\"0\">en italique</button><button class=\"opt\" data-o=\"1\">soulignée</button><button class=\"opt\" data-o=\"2\">en gras</button><button class=\"opt\" data-o=\"3\">précédée de #</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Le salaire d’un employé dépend de la personne ET de la société. On le modélise par…</div><button class=\"opt\" data-o=\"0\">un attribut de Personne</button><button class=\"opt\" data-o=\"1\">un attribut de Société</button><button class=\"opt\" data-o=\"2\">une classe-association Emploi</button><button class=\"opt\" data-o=\"3\">une classe héritant des deux</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Quelle contrainte indique qu’un objet peut appartenir à deux sous-classes à la fois ?</div><button class=\"opt\" data-o=\"0\">{disjoint}</button><button class=\"opt\" data-o=\"1\">{chevauchement}</button><button class=\"opt\" data-o=\"2\">{complète}</button><button class=\"opt\" data-o=\"3\">{ordonnée}</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Polygone ◇— Point : un même point peut appartenir à plusieurs polygones. Pourquoi est-ce une agrégation et pas une composition ?</div><button class=\"opt\" data-o=\"0\">Parce que le point a des attributs</button><button class=\"opt\" data-o=\"1\">Parce que la partie est partageable et survit au tout</button><button class=\"opt\" data-o=\"2\">Parce que la multiplicité est 3..*</button><button class=\"opt\" data-o=\"3\">Parce que Point est abstraite</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Qu’est-ce qui ne va pas dans ce diagramme ?</div><button class=\"opt\" data-o=\"0\">Le losange devrait être vide</button><button class=\"opt\" data-o=\"1\">La multiplicité 1..* côté Commande (composite) est impossible</button><button class=\"opt\" data-o=\"2\">Il manque un nom d’association</button><button class=\"opt\" data-o=\"3\">Rien</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"10\"><div class=\"qq-q\">Dans la démarche du cours, les verbes de l’énoncé deviennent souvent…</div><button class=\"opt\" data-o=\"0\">des classes</button><button class=\"opt\" data-o=\"1\">des attributs</button><button class=\"opt\" data-o=\"2\">des associations</button><button class=\"opt\" data-o=\"3\">des contraintes</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"11\"><div class=\"qq-q\">Une interface…</div><button class=\"opt\" data-o=\"0\">peut avoir des attributs et des méthodes concrètes</button><button class=\"opt\" data-o=\"1\">n’a pas d’attributs (sauf constantes) et toutes ses méthodes sont abstraites</button><button class=\"opt\" data-o=\"2\">peut être instanciée</button><button class=\"opt\" data-o=\"3\">est une classe soulignée</button><div class=\"qq-e\" hidden></div></div></section>","ex":[],"qcm":[{"n":"ch2","q":"Le losange plein d’une composition se place…","o":["du côté de la partie","du côté du tout (composite)","au milieu de l’association","indifféremment"],"a":1,"e":"Toujours du côté du composite, comme pour l’agrégation (losange vide)."},{"n":"ch2","q":"Le triangle vide de l’héritage pointe vers…","o":["la sous-classe","la super-classe","la classe la plus utilisée","l’interface uniquement"],"a":1,"e":"Vers la classe générale (le parent)."},{"n":"ch2","q":"« Une personne travaille pour 0..1 entreprise ; une entreprise emploie 1..* personnes ». Où écrit-on 1..* ?","o":["À côté de Entreprise","À côté de Personne","Au milieu","Les deux côtés"],"a":1,"e":"La multiplicité à côté d’une classe dit combien d’objets de CETTE classe sont liés à un objet de l’autre : 1..* personnes, donc à côté de Personne."},{"n":"ch2","q":"Quelle multiplicité est interdite côté composite dans une composition ?","o":["1","0..1","1..*","Aucune"],"a":2,"e":"Un composant ne peut appartenir qu’à un seul composite : côté composite, au plus 1."},{"n":"ch2","q":"Comment note-t-on un attribut dérivé ?","o":["En italique","Souligné","Précédé de /","Entre accolades"],"a":2,"e":"/âge, /ancienneté : calculés à partir d’autres attributs (diapo 44)."},{"n":"ch2","q":"Une opération statique (de classe) est…","o":["en italique","soulignée","en gras","précédée de #"],"a":1,"e":"Souligné = de classe ; italique = abstrait (diapo 46)."},{"n":"ch2","q":"Le salaire d’un employé dépend de la personne ET de la société. On le modélise par…","o":["un attribut de Personne","un attribut de Société","une classe-association Emploi","une classe héritant des deux"],"a":2,"e":"Information portée par le couple : classe-association (diapo 56)."},{"n":"ch2","q":"Quelle contrainte indique qu’un objet peut appartenir à deux sous-classes à la fois ?","o":["{disjoint}","{chevauchement}","{complète}","{ordonnée}"],"a":1,"e":"Exemple du cours : une personne à la fois étudiante et employée (diapo 75)."},{"n":"ch2","q":"Polygone ◇— Point : un même point peut appartenir à plusieurs polygones. Pourquoi est-ce une agrégation et pas une composition ?","o":["Parce que le point a des attributs","Parce que la partie est partageable et survit au tout","Parce que la multiplicité est 3..*","Parce que Point est abstraite"],"a":1,"e":"En composition, une partie n’a qu’un seul tout et disparaît avec lui."},{"n":"ch2","q":"Qu’est-ce qui ne va pas dans ce diagramme ?","o":["Le losange devrait être vide","La multiplicité 1..* côté Commande (composite) est impossible","Il manque un nom d’association","Rien"],"a":1,"e":"Une ligne appartient à une seule commande : côté composite on écrit 1."},{"n":"ch2","q":"Dans la démarche du cours, les verbes de l’énoncé deviennent souvent…","o":["des classes","des attributs","des associations","des contraintes"],"a":2,"e":"Noms → classes, verbes → associations, adjectifs → valeurs d’attributs (diapo 78)."},{"n":"ch2","q":"Une interface…","o":["peut avoir des attributs et des méthodes concrètes","n’a pas d’attributs (sauf constantes) et toutes ses méthodes sont abstraites","peut être instanciée","est une classe soulignée"],"a":1,"e":"Diapo 42."}]},{"id":"ch3","t":"Diagramme d’objets","seance":"Cours · diapos 79–89","imp":4,"html":"<p class=\"lede\">Une photo du système à un instant précis. Le diagramme de classes donne les règles ; le diagramme d’objets montre des faits qui respectent ces règles.</p>\n<section class=\"xpl\"><p class=\"xlab\">Comprendre, en clair · fil rouge : la bibliothèque de la fac</p><div class=\"xana\"><b>L'analogie</b> Le diagramme de classes est le <b>règlement</b> de la bibliothèque ; le diagramme d'objets est une <b>photo</b> prise un mardi à 10 h : Awa a emprunté l'exemplaire n° 12 du livre « Réseaux ». Il sert à vérifier, sur un cas concret, que le diagramme de classes tient la route.</div><div class=\"xfig\"><svg viewBox=\"0 0 640 140\" role=\"img\" aria-label=\"diagramme d'objets\" style=\"width:100%;min-width:520px;color:var(--ink)\" font-family=\"var(--f-body),system-ui,sans-serif\" font-size=\"12\"><defs>\n<marker id=\"uTri4\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0 L12 6 L0 12 Z\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></path></marker>\n<marker id=\"uArr4\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 Z\" fill=\"currentColor\"></path></marker>\n<marker id=\"uOpen4\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10\" fill=\"none\" stroke=\"currentColor\"></path></marker>\n<marker id=\"uDiaO4\" viewBox=\"0 0 16 10\" refX=\"1\" refY=\"5\" markerWidth=\"16\" markerHeight=\"10\" orient=\"auto\"><path d=\"M0 5 L8 0 L16 5 L8 10 Z\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></path></marker>\n<marker id=\"uDiaF4\" viewBox=\"0 0 16 10\" refX=\"1\" refY=\"5\" markerWidth=\"16\" markerHeight=\"10\" orient=\"auto\"><path d=\"M0 5 L8 0 L16 5 L8 10 Z\" fill=\"currentColor\"></path></marker>\n</defs><rect x=\"20\" y=\"30\" width=\"190\" height=\"62\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></rect><text x=\"115\" y=\"50\" text-anchor=\"middle\" font-weight=\"700\" text-decoration=\"underline\">awa : Etudiant</text><line x1=\"20\" y1=\"58\" x2=\"210\" y2=\"58\" stroke=\"currentColor\"></line><text x=\"28\" y=\"74\" font-size=\"11\">nom = \"Awa\"</text><text x=\"28\" y=\"88\" font-size=\"11\">filiere = \"MIACSD\"</text><rect x=\"250\" y=\"30\" width=\"170\" height=\"48\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></rect><text x=\"335\" y=\"50\" text-anchor=\"middle\" font-weight=\"700\" text-decoration=\"underline\">ex12 : Exemplaire</text><line x1=\"250\" y1=\"58\" x2=\"420\" y2=\"58\" stroke=\"currentColor\"></line><text x=\"258\" y=\"72\" font-size=\"11\">etat = \"bon\"</text><rect x=\"460\" y=\"30\" width=\"170\" height=\"48\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></rect><text x=\"545\" y=\"50\" text-anchor=\"middle\" font-weight=\"700\" text-decoration=\"underline\">: Livre</text><line x1=\"460\" y1=\"58\" x2=\"630\" y2=\"58\" stroke=\"currentColor\"></line><text x=\"468\" y=\"72\" font-size=\"11\">titre = \"Réseaux\"</text><line x1=\"210\" y1=\"55\" x2=\"250\" y2=\"55\" stroke=\"currentColor\"></line><line x1=\"420\" y1=\"55\" x2=\"460\" y2=\"55\" stroke=\"currentColor\"></line><text x=\"20\" y=\"125\" font-size=\"11\">Pas de multiplicités : un lien relie </text></svg><b>un</b> objet à <b>un</b> objet, à un instant donné.</div><div class=\"xkey\"><b>Les 3 règles de notation</b> : nom <b>souligné</b> sous la forme <code>nom : Classe</code> (ou <code>: Classe</code> pour un objet anonyme) ; attributs avec leurs <b>valeurs</b> ; pas d'opérations ni de multiplicités.</div><div class=\"xtrap\"><b>Piège</b> Chaque lien entre objets doit correspondre à une association du diagramme de classes, et respecter ses multiplicités : 4 exemplaires reliés à Awa, c'est une erreur (maximum 3).</div><details class=\"xchk\"><summary>À toi : 3 questions éclair</summary><ol><li>Comment noter un objet anonyme de la classe Livre ? <i>Réponse : « : Livre », souligné.</i></li><li>Met-on les opérations dans un diagramme d'objets ? <i>Réponse : non.</i></li><li>À quoi sert-il surtout ? <i>Réponse : à illustrer et vérifier un diagramme de classes sur un exemple concret.</i></li></ol></details></section><p class=\"fichelab\">Le cours du prof (à retenir)</p>\n  <div class=\"prose\">\n  <h2>1. À quoi il sert</h2>\n  <p>Cinq objectifs <span class=\"src\">diapo 79</span> :</p>\n  <ol>\n    <li>illustrer le modèle de classes par un exemple concret ;</li>\n    <li>faciliter la validation d’un diagramme de classes complexe en l’instanciant ;</li>\n    <li>préciser des aspects imperceptibles dans le diagramme de classes ;</li>\n    <li>exprimer une exception (cas particulier non généralisable) ;</li>\n    <li>prendre une image du système à un moment donné.</li>\n  </ol>\n  <h2>2. Définition</h2>\n  <div class=\"box retenir\"><span class=\"tag\">À savoir</span>\n    <ul>\n      <li>Un diagramme d’objets est une <b>instance</b> d’un diagramme de classes : des objets et les liens qui les unissent.</li>\n      <li>C’est un graphe d’instances liées <b>statiquement</b>.</li>\n      <li>Il est <b>conforme</b> au diagramme de classes qu’il illustre : il respecte ses contraintes (multiplicités comprises).</li>\n      <li>Il <b>ne montre pas les interactions</b> entre objets (pas de messages).</li>\n      <li>« Le diagramme de classes modélise les <b>règles</b>, le diagramme d’objets modélise des <b>faits</b>. »</li>\n    </ul>\n    <p class=\"src\" style=\"display:inline-block\">diapo 80</p>\n  </div>\n  <h2>3. Notation</h2>\n  <p>Un objet est un rectangle à deux compartiments : le <b>nom de l’objet, souligné</b>, puis la liste des <b>attributs valorisés</b> (<code>nom = valeur</code>). Pas de compartiment d’opérations. <span class=\"src\">diapo 81</span></p>\n  </div>\n  <figure class=\"dgw\" data-d=\"o_formats\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"11 1 449 95\" width=\"449\" data-w=\"449\" style=\"max-width: 100%; height: auto;\"><g><g></g><g></g><g><rect x=\"25\" y=\"15.5\" width=\"70\" height=\"29\" class=\"dg-box\"></rect><text x=\"60\" y=\"31.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\" text-decoration=\"underline\">p1</text><rect x=\"165\" y=\"15.5\" width=\"110\" height=\"29\" class=\"dg-box\"></rect><text x=\"220\" y=\"31.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\" text-decoration=\"underline\">p1 : Personne</text><rect x=\"354\" y=\"15.5\" width=\"92\" height=\"29\" class=\"dg-box\"></rect><text x=\"400\" y=\"31.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\" text-decoration=\"underline\">: Personne</text><text x=\"60\" y=\"75\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\" font-style=\"italic\">nom seul</text><text x=\"220\" y=\"75\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\" font-style=\"italic\">nom + classe</text><text x=\"400\" y=\"75\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\" font-style=\"italic\">objet anonyme</text></g></g></svg></div><figcaption>Les trois formats du nom d’objet, du plus précis au plus anonyme (diapo 82). Toujours souligné.</figcaption></figure>\n  <div class=\"prose\">\n  <p>Règles sur les liens <span class=\"src\">diapo 83</span> :</p>\n  <ul>\n    <li>les relations du diagramme de classes deviennent des <b>liens</b> ;</li>\n    <li>la <b>généralisation n’a pas d’instance</b> : elle n’apparaît jamais dans un diagramme d’objets. Un objet de la sous-classe a directement tous les attributs hérités ;</li>\n    <li>un lien se dessine comme une relation ; s’il a un nom, ce nom est <b>souligné</b> ;</li>\n    <li>on ne représente <b>pas les multiplicités</b>.</li>\n  </ul>\n  </div>\n  <figure class=\"dgw\" data-d=\"o_basic\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"-8 10 527 239\" width=\"527\" data-w=\"527\" style=\"max-width: 100%; height: auto;\"><g><g></g><g><polyline points=\"154,74.38888888888889 375.5,117.45833333333333\" class=\"dg-l dg-nofill\"></polyline><text x=\"266.84956625012444\" y=\"83.12584182475672\" text-anchor=\"middle\" class=\"dg-t dg-halo \" font-size=\"12\" text-decoration=\"underline\"><tspan x=\"266.84956625012444\" dy=\"4\">emploie</tspan></text><polyline points=\"140,188.33333333333334 375.5,142.54166666666666\" class=\"dg-l dg-nofill\"></polyline><text x=\"259.84956625012444\" y=\"174.2352692863544\" text-anchor=\"middle\" class=\"dg-t dg-halo \" font-size=\"12\" text-decoration=\"underline\"><tspan x=\"259.84956625012444\" dy=\"4\">emploie</tspan></text></g><g><rect x=\"6\" y=\"24.5\" width=\"148\" height=\"71\" class=\"dg-box\"></rect><text x=\"80\" y=\"40.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\" text-decoration=\"underline\">philippe : Personne</text><line x1=\"6\" y1=\"53.5\" x2=\"154\" y2=\"53.5\" class=\"dg-l\"></line><text x=\"15\" y=\"67\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">nom = \"Dupont\"</text><text x=\"15\" y=\"84\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">prénom = \"Philippe\"</text><rect x=\"20\" y=\"164.5\" width=\"120\" height=\"71\" class=\"dg-box\"></rect><text x=\"80\" y=\"180.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\" text-decoration=\"underline\">eric : Personne</text><line x1=\"20\" y1=\"193.5\" x2=\"140\" y2=\"193.5\" class=\"dg-l\"></line><text x=\"29\" y=\"207\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">nom = \"Durand\"</text><text x=\"29\" y=\"224\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">prénom = \"Eric\"</text><rect x=\"375.5\" y=\"94.5\" width=\"129\" height=\"71\" class=\"dg-box\"></rect><text x=\"440\" y=\"110.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\" text-decoration=\"underline\">nagora : Société</text><line x1=\"375.5\" y1=\"123.5\" x2=\"504.5\" y2=\"123.5\" class=\"dg-l\"></line><text x=\"384.5\" y=\"137\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">nom = \"Nagora\"</text><text x=\"384.5\" y=\"154\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">activité = \"SSII\"</text></g></g></svg></div><figcaption>Exemple du cours (diapo 84) : deux personnes salariées de la même société.</figcaption></figure>\n  <div class=\"prose\">\n  <h2>4. L’objet composite <span class=\"src\">diapos 85–86</span></h2>\n  <p>Un objet composé de sous-objets est un <b>composite</b>. Il vient de classes liées par une composition. Ses attributs sont eux-mêmes des objets ; on peut les dessiner graphiquement (rectangles imbriqués) ou textuellement (liste soulignée).</p>\n  </div>\n  <figure class=\"dgw\" data-d=\"o_composite\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"21 6 502 214\" width=\"502\" data-w=\"502\" style=\"max-width: 100%; height: auto;\"><g><g></g><g><polyline points=\"124.5,40 325,40\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"124.5,40 134.5,46 144.5,40 134.5,34\" class=\"dg-fill\"></polygon><text x=\"224.75\" y=\"27\" text-anchor=\"middle\" class=\"dg-t dg-halo \" font-size=\"12\"><tspan x=\"224.75\" dy=\"4\">possède</tspan></text><text x=\"150.5\" y=\"33\" text-anchor=\"start\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"150.5\" dy=\"4\">1</tspan></text><text x=\"318\" y=\"33\" text-anchor=\"end\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"318\" dy=\"4\">1..*</tspan></text></g><g><rect x=\"35.5\" y=\"25.5\" width=\"89\" height=\"29\" class=\"dg-box\"></rect><text x=\"80\" y=\"41.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Université</text><rect x=\"325\" y=\"25.5\" width=\"70\" height=\"29\" class=\"dg-box\"></rect><text x=\"360\" y=\"41.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Salle</text><rect x=\"152.5\" y=\"134.5\" width=\"135\" height=\"71\" class=\"dg-box\"></rect><text x=\"220\" y=\"150.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\" text-decoration=\"underline\">orsay : Université</text><line x1=\"152.5\" y1=\"163.5\" x2=\"287.5\" y2=\"163.5\" class=\"dg-l\"></line><text x=\"161.5\" y=\"177\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\" text-decoration=\"underline\">salleH123 : Salle</text><text x=\"161.5\" y=\"194\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\" text-decoration=\"underline\">salleG246 : Salle</text><text x=\"450\" y=\"155\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\" font-style=\"italic\">Les sous-objets sont</text><text x=\"450\" y=\"170\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\" font-style=\"italic\">des attributs de</text><text x=\"450\" y=\"185\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\" font-style=\"italic\">l’objet composite</text></g></g></svg></div><figcaption>Forme textuelle de l’objet composite : les salles sont écrites comme des objets soulignés à l’intérieur de l’université.</figcaption></figure>\n  <div class=\"prose\">\n  <h2>5. Recommandations du prof <span class=\"src\">diapo 87</span></h2>\n  <ul>\n    <li>Ne l’utiliser que pour clarifier des structures complexes du diagramme de classes.</li>\n    <li>Tous les objets possibles n’ont pas à y figurer.</li>\n    <li>Ne pas mélanger classes et objets dans un même diagramme.</li>\n    <li>Il peut servir de base à un diagramme d’interaction (séquence ou collaboration).</li>\n  </ul>\n  <h2>6. Méthode pour en construire un à l’examen</h2>\n  <ol>\n    <li>Pars du diagramme de classes (ou construis-le d’abord).</li>\n    <li>Pour chaque élément du scénario, crée un objet <code>nom : Classe</code> d’une classe <b>concrète</b> (jamais une classe abstraite).</li>\n    <li>Remplis les attributs avec des valeurs plausibles, y compris les attributs hérités.</li>\n    <li>Trace un lien pour chaque instance d’association. Garde le losange si c’est une composition, comme le prof le fait (diapo 89).</li>\n    <li>Vérifie les multiplicités : si une classe exige <code>1</code> lien, chaque objet doit l’avoir.</li>\n  </ol>\n  <div class=\"box piege\"><span class=\"tag\">Pièges</span>\n    <ul>\n      <li>Nom d’objet non souligné.</li>\n      <li>Triangle d’héritage dans un diagramme d’objets.</li>\n      <li>Multiplicités écrites sur les liens.</li>\n      <li>Objet d’une classe abstraite (<code>p : Personne</code> si Personne est abstraite).</li>\n      <li>Objet sans un lien obligatoire (multiplicité 1 non respectée) : le diagramme n’est plus conforme.</li>\n      <li>Compartiment d’opérations ajouté : un objet n’en a pas.</li>\n    </ul>\n  </div>\n  <p>L’exemple d’application du cours (figure géométrique, diapos 88–89) est corrigé dans <a href=\"#exos\">Exercices du cours</a>, et une variante dans <a href=\"#td1\">TD1 exercice 1</a>.</p>\n  </div>\n  <h2>Quiz du chapitre 3</h2>\n  \n  <div class=\"row\"></div><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 3 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Dans un diagramme d’objets, le nom d’un objet est…</div><button class=\"opt\" data-o=\"0\">en italique</button><button class=\"opt\" data-o=\"1\">souligné</button><button class=\"opt\" data-o=\"2\">en majuscules</button><button class=\"opt\" data-o=\"3\">entre guillemets</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Quel format de nom désigne un objet anonyme ?</div><button class=\"opt\" data-o=\"0\">p1</button><button class=\"opt\" data-o=\"1\">p1 : Personne</button><button class=\"opt\" data-o=\"2\">: Personne</button><button class=\"opt\" data-o=\"3\">Personne</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Peut-on représenter une généralisation dans un diagramme d’objets ?</div><button class=\"opt\" data-o=\"0\">Oui, avec un triangle</button><button class=\"opt\" data-o=\"1\">Non, elle n’a pas d’instance</button><button class=\"opt\" data-o=\"2\">Oui, en pointillé</button><button class=\"opt\" data-o=\"3\">Seulement pour les classes abstraites</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Les multiplicités dans un diagramme d’objets…</div><button class=\"opt\" data-o=\"0\">sont obligatoires</button><button class=\"opt\" data-o=\"1\">ne sont pas représentées</button><button class=\"opt\" data-o=\"2\">remplacent les noms de liens</button><button class=\"opt\" data-o=\"3\">sont soulignées</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">« Le diagramme de classes modélise les … et le diagramme d’objets modélise des … »</div><button class=\"opt\" data-o=\"0\">faits / règles</button><button class=\"opt\" data-o=\"1\">règles / faits</button><button class=\"opt\" data-o=\"2\">classes / méthodes</button><button class=\"opt\" data-o=\"3\">besoins / solutions</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Un diagramme d’objets montre-t-il les messages entre objets ?</div><button class=\"opt\" data-o=\"0\">Oui</button><button class=\"opt\" data-o=\"1\">Non</button><button class=\"opt\" data-o=\"2\">Seulement les messages synchrones</button><button class=\"opt\" data-o=\"3\">Seulement s’ils sont numérotés</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Si Personne est abstraite, peut-on dessiner l’objet p : Personne ?</div><button class=\"opt\" data-o=\"0\">Oui</button><button class=\"opt\" data-o=\"1\">Non, on instancie une sous-classe concrète</button><button class=\"opt\" data-o=\"2\">Oui si on l’écrit en italique</button><button class=\"opt\" data-o=\"3\">Oui sans attributs</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Un objet composite vient de classes liées par…</div><button class=\"opt\" data-o=\"0\">une dépendance</button><button class=\"opt\" data-o=\"1\">une généralisation</button><button class=\"opt\" data-o=\"2\">une composition</button><button class=\"opt\" data-o=\"3\">une interface</button><div class=\"qq-e\" hidden></div></div></section>","ex":[],"qcm":[{"n":"ch3","q":"Dans un diagramme d’objets, le nom d’un objet est…","o":["en italique","souligné","en majuscules","entre guillemets"],"a":1,"e":"Toujours souligné : nomObjet : Classe."},{"n":"ch3","q":"Quel format de nom désigne un objet anonyme ?","o":["p1","p1 : Personne",": Personne","Personne"],"a":2,"e":"Classe connue, nom inconnu (diapo 82)."},{"n":"ch3","q":"Peut-on représenter une généralisation dans un diagramme d’objets ?","o":["Oui, avec un triangle","Non, elle n’a pas d’instance","Oui, en pointillé","Seulement pour les classes abstraites"],"a":1,"e":"La généralisation n’a pas d’instance (diapo 83)."},{"n":"ch3","q":"Les multiplicités dans un diagramme d’objets…","o":["sont obligatoires","ne sont pas représentées","remplacent les noms de liens","sont soulignées"],"a":1,"e":"Un lien relie deux objets précis : pas de multiplicité."},{"n":"ch3","q":"« Le diagramme de classes modélise les … et le diagramme d’objets modélise des … »","o":["faits / règles","règles / faits","classes / méthodes","besoins / solutions"],"a":1,"e":"Diapo 80."},{"n":"ch3","q":"Un diagramme d’objets montre-t-il les messages entre objets ?","o":["Oui","Non","Seulement les messages synchrones","Seulement s’ils sont numérotés"],"a":1,"e":"Il ne montre pas les interactions : c’est le rôle de la séquence et de la collaboration."},{"n":"ch3","q":"Si Personne est abstraite, peut-on dessiner l’objet p : Personne ?","o":["Oui","Non, on instancie une sous-classe concrète","Oui si on l’écrit en italique","Oui sans attributs"],"a":1,"e":"Une classe abstraite n’a pas d’instance."},{"n":"ch3","q":"Un objet composite vient de classes liées par…","o":["une dépendance","une généralisation","une composition","une interface"],"a":2,"e":"Diapo 85."}]},{"id":"ch4","t":"Cas d’utilisation","seance":"Cours · diapos 90–125","imp":5,"html":"<p class=\"lede\">Il décrit ce que le système doit faire pour ses utilisateurs, sans dire comment. C’est la première étape de l’analyse : la capture des besoins. Inventé par Ivar Jacobson.</p>\n<section class=\"xpl\"><p class=\"xlab\">Comprendre, en clair · fil rouge : la bibliothèque de la fac</p><div class=\"xana\"><b>L'analogie</b> Le diagramme de cas d'utilisation, c'est le <b>menu du restaurant</b> vu par les clients : il dit <b>ce qu'on peut demander</b> au système, pas comment la cuisine le prépare. Les acteurs sont les clients (personnes ou autres systèmes), les cas sont les plats.</div><div class=\"xfig\"><svg viewBox=\"0 0 640 290\" role=\"img\" aria-label=\"diagramme de cas d'utilisation\" style=\"width:100%;min-width:520px;color:var(--ink)\" font-family=\"var(--f-body),system-ui,sans-serif\" font-size=\"12\"><defs>\n<marker id=\"uTri5\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0 L12 6 L0 12 Z\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></path></marker>\n<marker id=\"uArr5\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 Z\" fill=\"currentColor\"></path></marker>\n<marker id=\"uOpen5\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10\" fill=\"none\" stroke=\"currentColor\"></path></marker>\n<marker id=\"uDiaO5\" viewBox=\"0 0 16 10\" refX=\"1\" refY=\"5\" markerWidth=\"16\" markerHeight=\"10\" orient=\"auto\"><path d=\"M0 5 L8 0 L16 5 L8 10 Z\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></path></marker>\n<marker id=\"uDiaF5\" viewBox=\"0 0 16 10\" refX=\"1\" refY=\"5\" markerWidth=\"16\" markerHeight=\"10\" orient=\"auto\"><path d=\"M0 5 L8 0 L16 5 L8 10 Z\" fill=\"currentColor\"></path></marker>\n</defs><rect x=\"140\" y=\"10\" width=\"370\" height=\"270\" rx=\"6\" fill=\"none\" stroke=\"currentColor\"></rect><text x=\"325\" y=\"28\" text-anchor=\"middle\" font-weight=\"700\">Système de gestion de la bibliothèque</text><circle cx=\"60\" cy=\"60\" r=\"9\" fill=\"none\" stroke=\"currentColor\"></circle><line x1=\"60\" y1=\"69\" x2=\"60\" y2=\"94\" stroke=\"currentColor\"></line><line x1=\"46\" y1=\"78\" x2=\"74\" y2=\"78\" stroke=\"currentColor\"></line><line x1=\"60\" y1=\"94\" x2=\"48\" y2=\"112\" stroke=\"currentColor\"></line><line x1=\"60\" y1=\"94\" x2=\"72\" y2=\"112\" stroke=\"currentColor\"></line><text x=\"60\" y=\"128\" text-anchor=\"middle\">Adhérent</text><circle cx=\"580\" cy=\"60\" r=\"9\" fill=\"none\" stroke=\"currentColor\"></circle><line x1=\"580\" y1=\"69\" x2=\"580\" y2=\"94\" stroke=\"currentColor\"></line><line x1=\"566\" y1=\"78\" x2=\"594\" y2=\"78\" stroke=\"currentColor\"></line><line x1=\"580\" y1=\"94\" x2=\"568\" y2=\"112\" stroke=\"currentColor\"></line><line x1=\"580\" y1=\"94\" x2=\"592\" y2=\"112\" stroke=\"currentColor\"></line><text x=\"580\" y=\"128\" text-anchor=\"middle\">Bibliothécaire</text><circle cx=\"60\" cy=\"190\" r=\"9\" fill=\"none\" stroke=\"currentColor\"></circle><line x1=\"60\" y1=\"199\" x2=\"60\" y2=\"224\" stroke=\"currentColor\"></line><line x1=\"46\" y1=\"208\" x2=\"74\" y2=\"208\" stroke=\"currentColor\"></line><line x1=\"60\" y1=\"224\" x2=\"48\" y2=\"242\" stroke=\"currentColor\"></line><line x1=\"60\" y1=\"224\" x2=\"72\" y2=\"242\" stroke=\"currentColor\"></line><text x=\"60\" y=\"258\" text-anchor=\"middle\">Étudiant</text><path d=\"M60 182 L60 135\" stroke=\"currentColor\" marker-end=\"url(#uTri5)\"></path><ellipse cx=\"250\" cy=\"70\" rx=\"70.0\" ry=\"20\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></ellipse><text x=\"250\" y=\"74\" text-anchor=\"middle\" font-size=\"11\">Emprunter un livre</text><ellipse cx=\"250\" cy=\"150\" rx=\"70.0\" ry=\"20\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></ellipse><text x=\"250\" y=\"154\" text-anchor=\"middle\" font-size=\"11\">Rechercher un livre</text><ellipse cx=\"420\" cy=\"220\" rx=\"70.0\" ry=\"20\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></ellipse><text x=\"420\" y=\"224\" text-anchor=\"middle\" font-size=\"11\">S'authentifier</text><ellipse cx=\"420\" cy=\"110\" rx=\"70.0\" ry=\"20\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></ellipse><text x=\"420\" y=\"114\" text-anchor=\"middle\" font-size=\"11\">Payer une amende</text><ellipse cx=\"420\" cy=\"60\" rx=\"65.0\" ry=\"20\" fill=\"var(--paper,#fff)\" stroke=\"currentColor\"></ellipse><text x=\"420\" y=\"64\" text-anchor=\"middle\" font-size=\"11\">Gérer le catalogue</text><line x1=\"75\" y1=\"80\" x2=\"180\" y2=\"72\" stroke=\"currentColor\"></line><line x1=\"75\" y1=\"88\" x2=\"180\" y2=\"148\" stroke=\"currentColor\"></line><line x1=\"565\" y1=\"80\" x2=\"485\" y2=\"62\" stroke=\"currentColor\"></line><path d=\"M300 86 L380 204\" stroke=\"currentColor\" stroke-dasharray=\"5 4\" marker-end=\"url(#uOpen5)\"></path><text x=\"350\" y=\"160\" font-size=\"10\">«include»</text><path d=\"M370 100 L320 78\" stroke=\"currentColor\" stroke-dasharray=\"5 4\" marker-end=\"url(#uOpen5)\"></path><text x=\"300\" y=\"112\" font-size=\"10\">«extend»</text></svg></div><div class=\"xkey\"><b>include ou extend ?</b> <b>«include»</b> : obligatoire, toujours exécuté (emprunter <b>inclut</b> toujours s'authentifier) ; la flèche part du cas de base. <b>«extend»</b> : optionnel, sous condition (payer une amende <b>étend</b> l'emprunt seulement s'il y a un retard) ; la flèche part de l'extension vers le cas de base.</div><div class=\"xtrap\"><b>Piège</b> Un cas d'utilisation est une <b>fonction vue de l'extérieur</b> (verbe + complément : « Emprunter un livre »), pas une étape technique (« Mettre à jour la base »). Et l'acteur est <b>hors</b> du rectangle du système.</div><details class=\"xchk\"><summary>À toi : 3 questions éclair</summary><ol><li>Le serveur de paiement de la banque peut-il être un acteur ? <i>Réponse : oui, un acteur peut être un autre système externe.</i></li><li>Dans quel sens va la flèche «extend» ? <i>Réponse : de l'extension (Payer une amende) vers le cas de base (Emprunter).</i></li><li>Que signifie la flèche triangle entre Étudiant et Adhérent ? <i>Réponse : une généralisation : un étudiant est un adhérent et hérite de ses cas.</i></li></ol></details></section><p class=\"fichelab\">Le cours du prof (à retenir)</p>\n  <div class=\"prose\">\n  <h2>1. Rôle et objectifs</h2>\n  <div class=\"box retenir\"><span class=\"tag\">La phrase du prof</span><p>Le diagramme de cas d’utilisation montre <b>ce que doit faire le système, sans spécifier comment il le fait</b>. <span class=\"src\">diapo 91</span></p></div>\n  <p>Les cas d’utilisation <span class=\"src\">diapos 93–95</span> :</p>\n  <ul>\n    <li>structurent les besoins des utilisateurs et les objectifs du système ;</li>\n    <li>centrent l’expression des exigences sur les <b>utilisateurs</b> ;</li>\n    <li>se limitent aux préoccupations réelles des utilisateurs : ils ne présentent <b>pas de solution d’implémentation</b> et ne sont <b>pas un inventaire fonctionnel</b> ;</li>\n    <li>identifient les utilisateurs (acteurs) et leurs interactions avec le système ;</li>\n    <li>définissent les <b>frontières</b> du système ;</li>\n    <li>servent d’instruments de validation et de test pendant et après la construction.</li>\n  </ul>\n  <p>Un <b>modèle</b> de cas d’utilisation comprend : les diagrammes de cas d’utilisation, une <b>description textuelle</b> des scénarios, et la description de ces scénarios par des diagrammes de <b>séquence</b> ou de <b>collaboration</b>. <span class=\"src\">diapo 96</span></p>\n\n  <h2>2. Les acteurs</h2>\n  <p>Un <b>acteur</b> est l’archétype d’un utilisateur (personne, processus externe…) qui interagit avec le système. Il représente un <b>rôle</b>, pas une personne précise : la même personne peut jouer plusieurs rôles. Il peut être un élément de l’entreprise (direction, service, poste de travail), un <b>périphérique externe</b> ou un <b>système externe</b>. <span class=\"src\">diapos 97–98</span></p>\n  <p>Notation : un bonhomme avec son nom dessous, ou un rectangle stéréotypé <code>«acteur»</code>.</p>\n  <div class=\"tw\"><table>\n    <tbody><tr><th>Acteur principal</th><th>Acteur secondaire</th></tr>\n    <tr><td>Directement concerné par le cas ; sollicite le système pour obtenir un résultat perceptible. C’est le rôle par défaut.</td>\n        <td>Sollicité pour des informations complémentaires nécessaires au cas. Si son seul rôle est de consommer des informations sans modifier l’état du système, il est secondaire.</td></tr>\n    <tr><td>Exemple : le client qui retire de l’argent</td><td>Exemple : la banque interrogée, un service externe de vérification</td></tr>\n  </tbody></table></div>\n  <p>Quand un cas introduit au moins un acteur secondaire, on peut stéréotyper les associations <code>«principal»</code> et <code>«secondaire»</code>. Par convention, on place les acteurs principaux à gauche et les secondaires à droite. <span class=\"src\">diapos 100, 105</span></p>\n  <p><b>Généralisation entre acteurs</b> : un acteur spécialisé hérite de tous les cas de l’acteur général. Flèche à triangle vide vers l’acteur général. <span class=\"src\">diapo 99</span></p>\n\n  <h2>3. Les cas d’utilisation</h2>\n  <p>Un cas d’utilisation représente une manière d’utiliser le système. Il exprime une suite d’interactions entre un acteur et l’application, et définit une <b>fonctionnalité utilisable par un acteur</b>. Notation : une <b>ellipse</b>. <span class=\"src\">diapos 101–103</span></p>\n  <p>Nomme-le avec un <b>verbe à l’infinitif + complément</b> : « Réserver un livre », « Retirer de l’argent ».</p>\n  <p>Un cas qui n’est relié directement à aucun acteur est un <b>cas d’utilisation interne</b> (par exemple « S’authentifier », atteint uniquement par des include).</p>\n  <p>Le <b>système</b> est un rectangle (la frontière) qui contient les cas d’utilisation, <b>jamais les acteurs</b>. <span class=\"src\">diapo 117</span></p>\n  </div>\n  <figure class=\"dgw\" data-d=\"u_atm\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"8 -14 739 378\" width=\"739\" data-w=\"739\" style=\"max-width: 100%; height: auto;\"><g><g><rect x=\"130\" y=\"0\" width=\"470\" height=\"350\" class=\"dg-sys\"></rect><text x=\"365\" y=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Borne interactive d’une banque</text></g><g><polyline points=\"62,162.46046511627907 216.14385946994565,88.07262350235085\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"62,183.94883720930233 196.45802487240002,250.0482917951814\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"62,172.69302325581396 156.18,170\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"673.5,63.41685393258427 336.9868683794508,68.15759846338312\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"304.9202867322444,86.30050179012062 454.5706591118477,135.16592950590945\" class=\"dg-l dg-nofill dg-dash\"></polyline><polyline points=\"445.97640978071496,126.04787716813883 454.5706591118477,135.16592950590945 442.25158840017883,137.455142646
