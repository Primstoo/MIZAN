e x1=\"835\" y1=\"101.5\" x2=\"1005\" y2=\"101.5\" class=\"dg-l\"></line><text x=\"844\" y=\"115\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\" font-style=\"italic\">+ calculerSalaire() : float</text><rect x=\"698.5\" y=\"282\" width=\"203\" height=\"96\" class=\"dg-box\"></rect><text x=\"800\" y=\"298\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Réceptionniste</text><line x1=\"698.5\" y1=\"311\" x2=\"901.5\" y2=\"311\" class=\"dg-l\"></line><text x=\"707.5\" y=\"324.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">- logicielBooking : String</text><line x1=\"698.5\" y1=\"336\" x2=\"901.5\" y2=\"336\" class=\"dg-l\"></line><text x=\"707.5\" y=\"349.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">+ enregistrerRéservation() : void</text><text x=\"707.5\" y=\"366.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">+ calculerSalaire() : float</text><rect x=\"974.5\" y=\"282\" width=\"191\" height=\"96\" class=\"dg-box\"></rect><text x=\"1070\" y=\"298\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">AgentEntretien</text><line x1=\"974.5\" y1=\"311\" x2=\"1165.5\" y2=\"311\" class=\"dg-l\"></line><text x=\"983.5\" y=\"324.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">- zone : String</text><line x1=\"974.5\" y1=\"336\" x2=\"1165.5\" y2=\"336\" class=\"dg-l\"></line><text x=\"983.5\" y=\"349.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">+ nettoyer(c : Chambre) : void</text><text x=\"983.5\" y=\"366.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">+ calculerSalaire() : float</text></g></g></svg></div><figcaption>Personnel est abstraite : <code>calculerSalaire()</code> est redéfinie dans chaque sous-classe. <code>/nbNuits</code> est un attribut dérivé (dateFin − dateDébut). Les méthodes <code>chercherChambreLibre</code> et <code>estDisponible</code> serviront au TP2 exercice 4.</figcaption></figure>\n    <div class=\"box plus\"><span class=\"tag\">La remarque qui montre que tu as compris</span>\n      <p>Une classe-association n’admet qu’une seule instance par couple (Client, Chambre). M. Alami ne pourrait donc pas réserver deux fois la chambre 101 à deux périodes différentes. Dans un vrai système, Réservation serait une classe ordinaire reliée à Client (<code>1</code>) et à Chambre (<code>1</code>). On respecte ici la consigne du TP, en signalant la limite.</p>\n    </div>\n  </div></details>\n\n  <h2>Exercice 3 · Diagramme d’objets</h2>\n  <div class=\"enonce\">\n    <p>À un instant T : l’hôtel « Atlas Resort » (5 étoiles) contient la chambre 101 (1er étage, 800 DH). Le client « M. Alami » a une réservation en cours pour cette chambre, du 12/05/2026 au 15/05/2026, qui inclut le service « Petit-déjeuner ». Respecter la notation <code>objet : Classe</code> soulignée.</p>\n  </div>\n  <details class=\"corr\"><summary>Voir la correction <span class=\"hint\">10 min</span></summary><div class=\"in\">\n    <figure class=\"dgw\" data-d=\"tp1_e3\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"-29 0 531 601\" width=\"531\" data-w=\"531\" style=\"max-width: 100%; height: auto;\"><g><g></g><g><polyline points=\"420,85.5 420,176\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"420,85.5 414,95.5 420,105.5 426,95.5\" class=\"dg-fill\"></polygon><polyline points=\"94.5,220 355.5,220\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"230,346 230,220\" class=\"dg-l dg-nofill dg-dash\"></polyline><polyline points=\"230,434 230,533\" class=\"dg-l dg-nofill\"></poly \"235.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">nom = \"Alami\"</text><rect x=\"148.5\" y=\"346\" width=\"163\" height=\"88\" class=\"dg-box\"></rect><text x=\"230\" y=\"362\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\" text-decoration=\"underline\">r1 : Réservation</text><line x1=\"148.5\" y1=\"375\" x2=\"311.5\" y2=\"375\" class=\"dg-l\"></line><text x=\"157.5\" y=\"388.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">dateDébut = 12/05/2026</text><text x=\"157.5\" y=\"405.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">dateFin = 15/05/2026</text><text x=\"157.5\" y=\"422.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">nbNuits = 3</text><rect x=\"150.5\" y=\"533\" width=\"159\" height=\"54\" class=\"dg-box\"></rect><text x=\"230\" y=\"549\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\" text-decoration=\"underline\">pdj : Service</text><line x1=\"150.5\" y1=\"562\" x2=\"309.5\" y2=\"562\" class=\"dg-l\"></line><text x=\"159.5\" y=\"575.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"400\">libellé = \"Petit-déjeuner\"</text></g></g></svg></div><figcaption>L’objet <code>r1 : Réservation</code> est l’instance de la classe-association : il se rattache par un pointillé au lien entre alami et ch101. <code>nbNuits = 3</code> est cohérent avec les dates.</figcaption></figure>\n    <p>On n’invente pas de valeurs absentes du scénario (adresse, email, acompte) : on les omet.</p>\n  </div></details>\n\n  <h2>Exercice 4 · Réflexion (rétro-ingénierie)</h2>\n  <figure class=\"dgw\" data-d=\"tp1_e4\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"-1 6 530 203\" width=\"530\" data-w=\"530\" style=\"max-width: 100%; height: auto;\"><g><g></g><g><polyline points=\"107,40 346.5,40\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"107,40 117,46 127,40 117,34\" class=\"dg-hollow\"></polygon><text x=\"226.75\" y=\"27\" text-anchor=\"middle\" class=\"dg-t dg-halo \" font-size=\"12\"><tspan x=\"226.75\" dy=\"4\">possède</tspan></text><text x=\"133\" y=\"33\" text-anchor=\"start\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"133\" dy=\"4\">1</tspan></text><text x=\"339.5\" y=\"33\" text-anchor=\"end\" class=\"dg-t dg-halo dg-mult\" font-size=\"12\"><tspan x=\"339.5\" dy=\"4\">0..*</tspan></text><polyline points=\"320,165.5 320,115 400,115\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"480,165.5 480,115 400,115\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"400,115 400,54.5\" class=\"dg-l dg-nofill\"></polyline><polygon points=\"391,69.5 400,54.5 409,69.5\" class=\"dg-hollow\"></polygon></g><g><rect x=\"13\" y=\"25.5\" width=\"94\" height=\"29\" class=\"dg-box\"></rect><text x=\"60\" y=\"41.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Ordinateur</text><rect x=\"346.5\" y=\"25.5\" width=\"107\" height=\"29\" class=\"dg-box\"></rect><text x=\"400\" y=\"41.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\" font-style=\"italic\">Périphérique</text><rect x=\"285\" y=\"165.5\" width=\"70\" height=\"29\" class=\"dg-box\"></rect><text x=\"320\" y=\"181.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Clavier</text><rect x=\"445\" y=\"165.5\" width=\"70\" height=\"29\" class=\"dg-box\"></rect><text x=\"480\" y=\"181.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Souris</text></g></g></svg></div><figcaption>Le diagramme partiel de l’énoncé.</figcaption></figure>\n  <div class=\"enonce\">\n    <ol>\n      <li>Si l’on remplace le losange vide (agrégation) par un losange plein (composition), qu’est-ce que cela change pour la durée de vie de l’objet Clavier si l’objet Ordinateur est détruit ?</li>\n      <li>Traduire ce diagramme en 2 ou 3 phrases en langage naturel.</li>\n    </ol>\n  </div>\n  <details class=\"corr\"><summary>Voir la correction <span class=\"hint\">5 min</span></summary><div class=\"in\">\n    <p><b>1.</b> Avec l’agrégation, si l’ordinateur est détruit, le clavier continue d’exister : on peut le brancher sur un autre ordinateur. Avec la composition, la durée de vie du clavier dépend de celle de l’ordinateur : la destruction de l’ordinateur entraîne celle du clavier. De plus, le clavier ne peut alors appartenir qu’à un seul ordinateur.</p>\n    <p><b>2.</b> Un ordinateur possède zéro, un ou plusieurs périphériques. Chaque périphérique appartient à exactement un ordinateur. Un périphérique est soit un clavier, soit une souris (Clavier et Souris sont des spécialisations de Périphérique).</p>\n  </div></details>","ex":[],"qcm":[]},{"id":"tp2","t":"TP2 · dynamiques","seance":"Exercices et TD","imp":3,"html":"<p class=\"lede\">Le TP2 exige la cohérence entre les messages des diagrammes dynamiques et les méthodes du diagramme de classes du TP1.</p>\n\n  <h2>Exercice 1 · Séquence : parking intelligent</h2>\n  <div class=\"enonce\">\n    <ol>\n      <li>Le Conducteur appuie sur le bouton de la Borne d’entrée.</li>\n      <li>La Borne demande au Système Central de vérifier la disponibilité des places.</li>\n      <li>Le Système Central interroge ses données internes (ou un capteur) pour connaître le nombre de places libres.</li>\n      <li>Alternative : <b>[Complet]</b> places = 0 : le Système renvoie un signal négatif, la Borne affiche « Parking Complet », le scénario s’arrête. <b>[Disponible]</b> : le Système enregistre une nouvelle entrée (décrémente les places), ordonne à la Borne d’imprimer un ticket, le conducteur prend le ticket, la Borne envoie le signal « Ouvrir » à la Barrière, la Barrière se lève.</li>\n    </ol>\n    <p>Travail : distinguer l’acteur des objets matériels et logiciels, respecter la chronologie, utiliser un fragment <code>alt</code>, ajouter une note indiquant que la communication Borne–Système est synchrone.</p>\n  </div>\n  <details class=\"corr\"><summary>Voir la correction <span class=\"hint\">20 min</span></summary><div class=\"in\">\n    <p>Lignes de vie : <b>Conducteur</b> (acteur humain), <b>:Borne</b> et <b>:Barrière</b> (objets matériels), <b>:SystèmeCentral</b> (objet logiciel).</p>\n    <figure class=\"dgw\" data-d=\"tp2_e1\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"2 6 796 738\" width=\"796\" data-w=\"796\" style=\"max-width: 100%; height: auto;\"><g><line x1=\"60\" y1=\"92\" x2=\"60\" y2=\"730\" class=\"dg-l dg-life\"></line><line x1=\"240\" y1=\"54\" x2=\"240\" y2=\"730\" class=\"dg-l dg-life\"></line><line x1=\"410\" y1=\"54\" x2=\"410\" y2=\"730\" class=\"dg-l dg-life\"></line><line x1=\"643\" y1=\"54\" x2=\"643\" y2=\"730\" class=\"dg-l dg-life\"></line><rect x=\"16\" y=\"298\" width=\"768\" height=\"398\" class=\"dg-frame\"></rect><line x1=\"16\" y1=\"412\" x2=\"784\" y2=\"412\" class=\"dg-l dg-dash\"></line><circle cx=\"60\" cy=\"28\" r=\"8\" class=\"dg-box\"></circle><path d=\"M60 36 V56 M47 43 H73 M60 56 L49 72 M60 56 L71 72\" class=\"dg-l\"></path><text x=\"60\" y=\"86\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12.5\" font-weight=\"700\">Conducteur</text><rect x=\"209.5\" y=\"21\" width=\"61\" height=\"32\" class=\"dg-box\"></rect><text x=\"240\" y=\"37\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13\" font-weight=\"700\" text-decoration=\"underline\">:Borne</text><rect x=\"348\" y=\"21\" width=\"124\" height=\"32\" class=\"dg-box\"></rect><text x=\"410\" y=\"37\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13\" font-weight=\"700\" text-decoration=\"underline\">:SystèmeCentral</text><rect x=\"605.5\" y=\"21\" width=\"75\" height=\"32\" class=\"dg-box\"></rect><text x=\"643\" y=\"37\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13\" font-weight=\"700\" text-decoration=\"underline\">:Barrière</text><rect x=\"414\" y=\"272\" width=\"10\" height=\"24\" class=\"dg-act\"></rect><rect x=\"405\" y=\"220\" width=\"10\" height=\"128\" class=\"dg-act\"></rect><rect x=\"414\" y=\"470\" width=\"10\" height=\"24\" class=\"dg-act\"></rect><rect x=\"405\" y=\"412\" width=\"10\" height=\"94\" class=\"dg-act\"></rect><rect x=\"647\" y=\"666\" width=\"10\" height=\"24\" class=\"dg-act\"></rect><rect x=\"235\" y=\"184\" width=\"10\" height=\"530\" class=\"dg-act\"></rect><rect x=\"638\" y=\"614\" width=\"10\" height=\"100\" class=\"dg-act\"></rect><path d=\"M187.455078125 122 H452.544921875 L462.544921875 132 V166 H187.455078125 Z\" class=\"dg-note\"></path><path d=\"M452.544921875 122 V132 H462.544921875\" class=\"dg-l\"></path><text x=\"199.455078125\" y=\"136\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12\" font-weight=\"400\">Communication Borne ↔ Système : synchrone</text><text x=\"199.455078125\" y=\"151\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12\" font-weight=\"400\">(la Borne attend la réponse)</text><line x1=\"60\" y1=\"184\" x2=\"235\" y2=\"184\" class=\"dg-l\"></line><polygon points=\"224,179 235,184 224,189\" class=\"dg-fill\"></polygon><text x=\"147.5\" y=\"177\" text-anchor=\"middle\" class=\"dg-t dg-halo \" font-size=\"12\"><tspan x=\"147.5\" dy=\"0\">appuyerBouton()</tspan></text><line x1=\"245\" y1=\"220\" x2=\"405\" y2=\"220\" class=\"dg-l\"></line><polygon points=\"394,215 405,220 394,225\" class=\"dg-fill\"></polygon><text x=\"325\" y=\"213\" text-anchor=\"middle\" class=\"dg-t dg-halo \" fo  crée un nouvel objet BonDeCommande et y ajoute une ligne.</li>\n    </ul>\n    <p>Travail : diagramme de collaboration avec numérotation hiérarchique (1, 1.1, 1.2, 2…) ; question : quelle est la différence visuelle principale avec le diagramme de séquence ?</p>\n  </div>\n  <details class=\"corr\"><summary>Voir la correction <span class=\"hint\">15 min</span></summary><div class=\"in\">\n    <figure class=\"dgw\" data-d=\"tp2_e2\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"-8 11 865 465\" width=\"865\" data-w=\"865\" style=\"max-width: 100%; height: auto;\"><g><g></g><g><polyline points=\"77,158.5264705882353 342.0769230769231,54.5\" class=\"dg-l dg-nofill\"></polyline><line x1=\"188.96433924708234\" y1=\"100.62209856684903\" x2=\"220.61439408959305\" y2=\"88.20138890652514\" class=\"dg-l dg-msg\"></line><polygon points=\"210.5925209409444,87.30024596980799 220.61439408959305,88.20138890652514 213.88035585103015,95.67820166341376\" class=\"dg-fill\"></polygon><text x=\"200.40558678822336\" y=\"82.24113614521272\" text-anchor=\"middle\" class=\"dg-t dg-halo dg-msgt\" font-size=\"11.5\"><tspan x=\"200.40558678822336\" dy=\"0\">1 : qte := scanner()</tspan></text><polyline points=\"77,182.46764705882353 325.22222222222223,245.5\" class=\"dg-l dg-nofill\"></polyline><line x1=\"181.43444956679377\" y1=\"222.399819636254\" x2=\"214.38855579351798\" y2=\"230.76802630182925\" class=\"dg-l dg-msg\"></line><polygon points=\"206.77296679218182,224.19133988975761 214.38855579351798,230.76802630182925 204.55785326305897,232.9144856556552\" class=\"dg-fill\"></polygon><text x=\"194.95801797465873\" y=\"247.2147839902384\" text-anchor=\"middle\" class=\"dg-t dg-halo dg-msgt\" font-size=\"11.5\"><tspan x=\"194.95801797465873\" dy=\"0\">[qte &lt; seuil] 2 : demanderRéappro(p)</tspan></text><polyline points=\"453.5,260 677,260\" class=\"dg-l dg-nofill\"></polyline><line x1=\"548.25\" y1=\"247\" x2=\"582.25\" y2=\"247\" class=\"dg-l dg-msg\"></line> =\"dg-l\"></polyline><text x=\"158.5\" y=\"589\" text-anchor=\"middle\" class=\"dg-t dg-halo dg-ret\" font-size=\"12\"><tspan x=\"158.5\" dy=\"0\">indisponible</tspan></text><rect x=\"403\" y=\"190\" width=\"48\" height=\"20\" class=\"dg-box\" style=\"stroke:none\"></rect><path d=\"M403 210 H444 L451 203 V190\" class=\"dg-l dg-nofill\"></path><text x=\"410\" y=\"200.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12\" font-weight=\"700\">loop</text><text x=\"458\" y=\"205\" text-anchor=\"start\" class=\"dg-t dg-halo dg-guard\" font-size=\"12\"><tspan x=\"458\" dy=\"4\">[pour chaque chambre, tant que non trouvée]</tspan></text><rect x=\"16\" y=\"356\" width=\"39\" height=\"20\" class=\"dg-box\" style=\"stroke:none\"></rect><path d=\"M16 376 H48 L55 369 V356\" class=\"dg-l dg-nofill\"></path><text x=\"23\" y=\"366.5\" text-anchor=\"start\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"12\" font-weight=\"700\">alt</text><text x=\"62\" y=\"371\" text-anchor=\"start\" class=\"dg-t dg-halo dg-guard\" font-size=\"12\"><tspan x=\"62\" dy=\"4\">[chambre ≠ null]</tspan></text><text x=\"26\" y=\"569\" text-anchor=\"start\" class=\"dg-t dg-halo dg-guard\" font-size=\"12\"><tspan x=\"26\" dy=\"4\">[aucune chambre libre]</tspan></text></g></svg></div><figcaption>Chaque message reçu correspond à une opération du diagramme de classes du TP1 : <code>Hôtel.chercherChambreLibre(d, f)</code>, <code>Chambre.estDisponible(d, f)</code>, <code>Réservation.calculerFacture()</code>.</figcaption></figure>\n    <div class=\"box retenir\"><span class=\"tag\">Vérification de cohérence à écrire dans le rendu</span>\n      <div class=\"tw\"><table>\n        <tbody><tr><th>Message</th><th>Reçu par</th><th>Opération du TP1</th></tr>\n        <tr><td><code>chercherChambreLibre(d, f)</code></td><td>:Hôtel</td><td><code>+ chercherChambreLibre(d : Date, f : Date) : Chambre</code></td></tr>\n        <tr><td><code>estDisponible(d, f)</code></td><td>:Chambre</td><td><code>+ estDisponible(d : Date, f : Date) : boolean</code></td></tr>\n        <tr><td><code>«create»</code></td><td>r : Réservation</td><td>constructeur</td></tr>\n        <tr><td><code>calculerFacture()</code></td><td>r : Réservation</td><td><code>+ calculerFacture() : float</code></td></tr>\n      </tbody></table></div>\n    </div>\n  </div></details>","ex":[],"qcm":[]},{"id":"methode","t":"Méthode et synthèse","seance":"Préparer l'examen","imp":3,"html":"<p class=\"lede\">Ce qu’il faut avoir en tête le jour J : une recette par diagramme, la fiche des notations, les questions de cours probables avec leur réponse modèle, et la liste de relecture.</p>\n\n  <h2>1. Une recette par diagramme</h2>\n  <div class=\"tw\"><table>\n    <tbody><tr><th>Diagramme</th><th>Recette en 5 temps</th></tr>\n    <tr><td><b>Classes</b></td><td>1. Souligne les noms communs (classes) et les verbes (associations). 2. Place les classes, attributs typés. 3. Trace les associations ; pour chacune, choisis : simple, agrégation (◇ côté tout), composition (◆ côté tout), héritage (▷ vers le parent). 4. Écris les multiplicités en vérifiant les deux phrases de lecture. 5. Ajoute classes-associations, contraintes, une méthode par classe.</td></tr>\n    <tr><td><b>Objets</b></td><td>1. Un objet <u>nom : Classe</u> par élément du scénario. 2. Classes concrètes seulement. 3. Attributs valorisés (hérités compris). 4. Liens sans multiplicités, noms soulignés. 5. Vérifie les multiplicités obligatoires.</td></tr>\n    <tr><td><b>Cas d’utilisation</b></td><td>1. Rectangle système + nom. 2. Acteurs dehors : principaux à gauche, secondaires à droite. 3. Généralisations d’acteurs. 4. Cas = verbe + complément, reliés par un trait. 5. include (obligatoire, base → inclus), extend (optionnel avec condition, extension → base).</td></tr>\n    <tr><td><b>Séquence</b></td><td>1. Écris le scénario numéroté. 2. Acteur à gauche, objets soulignés. 3. Un message par phrase (pointe pleine = synchrone, pointillé = retour). 4. Création avec «create», destruction X. 5. alt / opt / loop avec gardes.</td></tr>\n    <tr><td><b>Collaboration</b></td><td>1. Mêmes objets que la séquence. 2. Un lien par paire qui communique. 3. Numérote dans l’ordre (hiérarchique si demandé). 4. Petite flèche parallèle au lien. 5. Conditions <code>[…]</code>, itérations <code>*</code>, <code>{nouveau}</code>.</td></tr>\n    <tr><td><b>Activités</b></td><td>1. Un couloir par responsable. 2. Initial, actions à l’infinitif dans le bon couloir. 3. « si » → décision avec gardes exhaustives, refermée par une fusion. 4. « en même temps » → fork, refermé par un join. 5. Final à chaque fin ; fin de flot si une seule branche s’arrête.</td></tr>\n  </tbody></table></div>\n\n  <h2>2. Fiche des notations</h2>\n  <div class=\"tw\"><table>\n    <tbody><tr><th>Symbole</th><th>Sens</th><th>Diagramme</th></tr>\n    <tr><td>Trait plein</td><td>association / lien / acteur–cas</td><td>classes, objets, cas, collaboration</td></tr>\n    <tr><td>◇ losange vide côté tout</td><td>agrégation (partie partageable)</td><td>classes</td></tr>\n    <tr><td>◆ losange plein côté tout</td><td>composition (partie détruite avec le tout)</td><td>classes, objets</td></tr>\n    <tr><td>▷ triangle vide vers le parent, trait plein</td><td>héritage / généralisation</td><td>classes, cas (acteurs et cas)</td></tr>\n    <tr><td>▷ triangle vide, trait pointillé</td><td>réalisation d’interface</td><td>classes</td></tr>\n    <tr><td>Pointillé + flèche ouverte</td><td>dépendance, «include», «extend», retour</td><td>classes, cas, séquence</td></tr>\n    <tr><td>Pointillé vers une classe au milieu d’une association</td><td>classe-association</td><td>classes, objets</td></tr>\n    <tr><td><i>Italique</i></td><td>abstrait (classe ou opération)</td><td>classes</td></tr>\n    <tr><td><u>Souligné</u></td><td>statique (classe) ou objet / instance</td><td>classes, objets, séquence, collaboration</td></tr>\n    <tr><td><code>/attribut</code></td><td>attribut dérivé</td><td>classes</td></tr>\n    <tr><td><code>{…}</code></td><td>contrainte</td><td>tous</td></tr>\n    <tr><td>Flèche pointe pleine ▶</td><td>message synchrone</td><td>séquence</td></tr>\n    <tr><td>Flèche pointe ouverte →</td><td>message asynchrone / flot</td><td>séquence, activités</td></tr>\n    <tr><td>Losange (activités)</td><td>décision (1 → n) ou fusion (n → 1)</td><td>activités</td></tr>\n    <tr><td>Barre épaisse</td><td>fork (1 → n) ou join (n → 1)</td><td>activités</td></tr>\n    <tr><td>● / ◉ / ⊗</td><td>initial / fin d’activité / fin de flot</td><td>activités</td></tr>\n  </tbody></table></div>\n\n  <h2>3. Questions de cours probables, avec réponse modèle</h2>\n  <p>Clique sur une question pour voir la réponse. Entraîne-toi à la dire à voix haute avant de l’ouvrir.</p>\n  <div id=\"qcours\"><details class=\"corr\"><summary>Définissez UML. Est-ce une méthode ?</summary><div class=\"in\"><p>UML (Unified Modeling Language) est un langage de modélisation graphique et semi-formel qui permet de représenter et de communiquer les différents aspects d’un système. Ce n’est pas une méthode : il fournit la sémantique, la notation et les règles, mais pas de démarche. Il couvre toutes les étapes du développement.</p></div></details><details class=\"corr\"><summary>Pourquoi modéliser avant de développer ?</summary><div class=\"in\"><p>Pour mieux comprendre le système, maîtriser sa complexité et assurer sa cohérence, faciliter la communication et la répartition des tâches, assurer la qualité et la maintenabilité, et réduire coûts et délais.</p></div></details><details class=\"corr\"><summary>Qu’est-ce qu’un modèle ?</summary><div class=\"in\"><p>Une représentation abstraite de la réalité qui exclut les détails n’influençant pas le comportement de manière significative ; il se présente sous forme de diagramme (symboles + texte).</p></div></details><details class=\"corr\"><summary>Différence MOA / MOE ?</summary><div class=\"in\"><p>La MOA (maîtrise d’ouvrage) est le client, le métier : elle définit les besoins. La MOE (maîtrise d’œuvre) est le réalisateur : elle étudie la faisabilité, traduit techniquement, modélise et développe. Elles sont liées par un contrat.</p></div></details><details class=\"corr\"><summary>Citez les diagrammes statiques et dynamiques étudiés.</summary><div class=\"in\"><p>Statiques : classes, objets (et composants, déploiement). Dynamiques : cas d’utilisation, séquence, collaboration, activités (et états-transitions).</p></div></details><details class=\"corr\"><summary>Agrégation et composition : différences ?</summary><div class=\"in\"><p>Toutes deux modélisent un lien tout/partie, losange côté tout. Agrégation (vide) : la partie peut être partagée et survit au tout. Composition (plein) : la partie appartient à un seul composite, n’existe pas sans lui et est détruite avec lui ; multiplicité côté composite ≤ 1.</p></div></details><details class=\"corr\"><summary>Classe abstraite et interface ?</summary><div class=\"in\"><p>Aucune ne s’instancie. Une classe abstraite contient au moins une méthode abstraite et peut avoir des attributs et des méthodes concrètes. Une interface n’a pas d’attributs (sauf constantes) et toutes ses méthodes sont abstraites.</p></div></details><details class=\"corr\"><summary>Qu’est-ce qu’une classe-association et quand l’utiliser ?</summary><div class=\"in\"><p>Une classe rattachée par un pointillé à une association, utilisée quand l’association porte des propriétés qui n’appartiennent à aucune des classes reliées (ex. dateEmbauche et salaire entre Société et Personne).</p></div></details><details class=\"corr\"><summary>Diagramme de classes / diagramme d’objets ?</summary><div class=\"in\"><p>Le diagramme de classes modélise les règles (structure générale) ; le diagramme d’objets en est une instance à un instant donné : objets soulignés, attributs valorisés, liens sans multiplicités, pas de généralisation.</p></div></details><details class=\"corr\"><summary>Acteur principal / secondaire ?</summary><div class=\"in\"><p>Principal : directement concerné, il sollicite le système pour obtenir un résultat. Secondaire : sollicité pour fournir des informations complémentaires ; s’il ne fait que consommer des informations sans modifier l’état du système, il est secondaire.</p></div></details><details class=\"corr\"><summary>«include» / «extend» ?</summary><div class=\"in\"><p>include : comportement obligatoire, factorisation ou décomposition, flèche du cas de base vers le cas inclus. extend : comportement optionnel sous condition, à un point d’extension, flèche de l’extension vers le cas de base.</p></div></details><details class=\"corr\"><summary>Séquence / collaboration ?</summary><div class=\"in\"><p>Deux diagrammes d’interaction équivalents. La séquence met l’accent sur l’ordre temporel (axe vertical, lignes de vie). La collaboration met l’accent sur l’organisation spatiale des objets et leurs liens ; l’ordre est donné par la numérotation des messages.</p></div></details><details class=\"corr\"><summary>Fusion / union dans un diagramme d’activités ?</summary><div class=\"in\"><p>Fusion (losange) : rassemble des flots alternatifs, laisse passer un flot sans attendre. Union ou join (barre) : synchronise des flots concurrents, attend qu’ils soient tous arrivés.</p></div></details><details class=\"corr\"><summary>Fin d’activité / fin de flot ?</summary><div class=\"in\"><p>La fin d’activité arrête toute l’activité. La fin de flot termine uniquement le flot qui l’atteint, sans effet sur les autres flots actifs.</p></div></details><details class=\"corr\"><summary>Qu’est-ce que le polymorphisme ? Exemple.</summary><div class=\"in\"><p>La capacité d’une même opération à s’exécuter différemment selon la classe de l’objet. Exemple : calculerPaie() redéfinie dans EmployéHoraire, EmployéSalarié et Vacataire.</p></div></details><details class=\"corr\"><summary>Comment construire un diagramme de classes à partir d’un texte ?</summary><div class=\"in\"><p>1) Noms → classes ; 2) verbes → associations ; 3) substantifs fins et adjectifs → attributs et valeurs ; 4) héritage pour factoriser ; 5) tester les chemins d’accès ; 6) itérer et raffiner (diapo 78).</p></div></details></div>\n\n  <h2>4. Liste de relecture (2 minutes par diagramme)</h2>\n  <div class=\"grade\" id=\"checklist\"><label for=\"ck0\"><input type=\"checkbox\" id=\"ck0\"><span>Classes : nom au singulier avec majuscule, attributs typés</span><span></span></label><label for=\"ck1\"><input type=\"checkbox\" id=\"ck1\"><span>Chaque association a ses deux multiplicités, vérifiées par les deux phrases de lecture</span><span></span></label><label for=\"ck2\"><input type=\"checkbox\" id=\"ck2\"><span>Losanges du côté du tout ; composition avec 1 côté composite</span><span></span></label><label for=\"ck3\"><input type=\"checkbox\" id=\"ck3\"><span>Triangles d’héritage vers le parent ; classes abstraites en italique</span><span></span></label><label for=\"ck4\"><input type=\"checkbox\" id=\"ck4\"><span>Objets : noms soulignés nom : Classe, pas de multiplicités ni d’héritage</span><span></span></label><label for=\"ck5\"><input type=\"checkbox\" id=\"ck5\"><span>Cas d’utilisation : acteurs hors du système, cas = verbe + complément</span><span></span></label><label for=\"ck6\"><input type=\"checkbox\" id=\"ck6\"><span>include du cas de base vers l’inclus ; extend de l’extension vers la base, avec condition</span><span></span></label><label for=\"ck7\"><input type=\"checkbox\" id=\"ck7\"><span>Séquence : objets soulignés, synchrone pointe pleine, retours en pointillé, gardes sur alt/loop</span><span></span></label><label for=\"ck8\"><input type=\"checkbox\" id=\"ck8\"><span>Collaboration : tous les messages numérotés, sur des liens existants</span><span></span></label><label for=\"ck9\"><input type=\"checkbox\" id=\"ck9\"><span>Activités : un initial, décision refermée par fusion, fork refermé par join, gardes exhaustives</span><span></span></label><label for=\"ck10\"><input type=\"checkbox\" id=\"ck10\"><span>Une phrase de justification sous chaque choix discutable</span><span></span></label></div>\n\n  <h2>5. Gestion du temps</h2>\n  <ul class=\"prose\">\n    <li>Lis tout le sujet d’abord (5 min) et souligne les mots-clés : « composé de », « peut », « obligatoirement », « si », « en même temps ».</li>\n    <li>Commence par les questions de cours : points rapides et sûrs.</li>\n    <li>Fais un brouillon rapide de chaque diagramme avant de le recopier proprement : un diagramme raturé se lit mal.</li>\n    <li>Garde 10 minutes pour la relecture avec la liste ci-dessus.</li>\n    <li>Si tu fais un choix discutable (agrégation ou composition, qui fait l’emprunt), écris une phrase de justification sous le diagramme.</li>\n  </ul>","ex":[],"qcm":[]},{"id":"examen","t":"Examen blanc","seance":"Préparer l'examen","imp":3,"html":"<p class=\"lede\">Sujet construit sur le modèle des TD et TP : questions de cours puis étude de cas. Le format exact de ton examen n’est pas connu (aucune annale fournie) : celui-ci couvre tous les diagrammes du module.</p>\n  <div class=\"row\" style=\"margin:12px 0\">\n    <span class=\"timer\" id=\"timer\">2:00:00</span>\n    <button class=\"btn\" id=\"tstart\">Démarrer</button>\n    <button class=\"btn ghost\" id=\"treset\">Remettre à zéro</button>\n  </div>\n\n  <h2>Partie 1 · Questions de cours (4 points)</h2>\n  <div class=\"enonce\">\n    <ol>\n      <li>UML est-il une méthode ? Justifiez. (1 pt)</li>\n      <li>Donnez les trois contraintes d’une composition et un exemple. (1 pt)</li>\n      <li>Différence entre «include» et «extend» : sens des flèches et caractère. (1 pt)</li>\n      <li>Différence entre nœud de fusion et nœud d’union dans un diagramme d’activités. (1 pt)</li>\n    </ol>\n  </div>\n\n  <h2>Partie 2 · Étude de cas (16 points)</h2>\n  <div class=\"enonce\">\n    <p><b>AutoAtlas</b> est une agence de location de véhicules à Béni Mellal.</p>\n    <p>Les clients (CIN, nom) peuvent consulter les véhicules disponibles sans compte. Pour réserver en ligne, ils doivent s’authentifier ; toute réservation inclut le paiement en ligne, validé par la banque. À l’agence, un agent établit le contrat et enregistre le retour du véhicule ; si un dommage est constaté au retour, l’agent facture les dommages.</p>\n    <p>Chaque véhicule (immatriculation, kilométrage) est soit une voiture (nombre de places), soit un camion (charge maximale) ; le tarif journalier se calcule différemment selon le type. Une agence (ville) gère plusieurs véhicules, qui peuvent être transférés vers une autre agence. Elle possède un ou plusieurs parkings (capacité), qui disparaissent si l’agence ferme. Un contrat lie un client à un véhicule pour une période (date de début, date de fin) ; son montant se calcule à partir du tarif et de la durée.</p>\n    <p><b>Retour d’un véhicule</b> : le client rend le véhicule ; l’agent l’inspecte ; s’il y a un dommage, il le facture ; ensuite, en parallèle, le client paie le solde et l’agent met à jour le kilométrage. Fin.</p>\n    <p><b>Réservation en ligne</b> : le client demande une réservation pour des dates ; le système vérifie la disponibilité du véhicule, crée le contrat, calcule le montant et demande à la banque de débiter le client. Si la banque accepte, le client reçoit la confirmation ; sinon le contrat est annulé et détruit, et le client est informé du refus.</p>\n  </div>\n  <div class=\"enonce\">\n    <ol>\n      <li>Diagramme de cas d’utilisation. (4 pts)</li>\n      <li>Diagramme de classes avec attributs, une opération par classe et multiplicités. (5 pts)</li>\n      <li>Diagramme de séquence de la réservation en ligne. (3 pts)</li>\n      <li>Diagramme de collaboration déduit de la question 3. (1 pt)</li>\n      <li>Diagramme d’activités du retour d’un véhicule, avec couloirs. (3 pts)</li>\n    </ol>\n  </div>\n\n  <details class=\"corr\"><summary>Correction de la partie 1</summary><div class=\"in\">\n    <ol>\n      <li>Non. UML est un <b>langage</b> de modélisation graphique : il fournit une sémantique, une notation et des règles, mais pas de démarche (ordre des étapes). Il peut s’utiliser avec n’importe quelle méthode objet et couvre toutes les étapes du développement.</li>\n      <li>Un composant n’appartient qu’à un seul composite ; il n’existe pas sans lui ; la destruction du composite entraîne la sienne. Exemple : Hôtel ◆— Chambre.</li>\n      <li>«include» : obligatoire, flèche du cas de base vers le cas inclus (factorisation, décomposition). «extend» : optionnel sous condition, flèche de l’extension vers le cas de base, au niveau d’un point d’extension.</li>\n      <li>La fusion (losange) rassemble des flots <b>alternatifs</b> et laisse passer le premier arrivé. L’union (barre) <b>synchronise</b> des flots concurrents : elle attend qu’ils soient tous arrivés.</li>\n    </ol>\n  </div></details>\n  <details class=\"corr\"><summary>Correction Q1 · cas d’utilisation</summary><div class=\"in\">\n    <figure class=\"dgw\" data-d=\"ex_uc\"><div class=\"dgscroll\" data-ok=\"1\"><svg class=\"dg\" role=\"img\" viewBox=\"18 -14 789 498\" width=\"789\" data-w=\"789\" style=\"max-width: 100%; height: auto;\"><g><g><rect x=\"160\" y=\"0\" width=\"480\" height=\"470\" class=\"dg-sys\"></rect><text x=\"400\" y=\"17\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"dg-t \" font-size=\"13.5\" font-weight=\"700\">Système de location</text></g><g><polyline points=\"72,109.51666666666667 207.38007643049542,87.04873885388608\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"72,119.14166666666667 233.8091415888432,163.61099963007928\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"71.5,330.93958333333336 216.48091509964323,316.1265904083631\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"71.5,340.79375 243.430215550612,402.5363308314795\" class=\"dg-l dg-nofill\"></polyline><polyline points=\"350.1685570697359,164.3038546774602 469.54127218359054,133.16314638688942\" class=\"dg-l dg span></label><label for=\"gr1\"><input type=\"checkbox\" id=\"gr1\"><span>Q cours 2 : trois contraintes + exemple</span><span class=\"pts\">1 pt</span></label><label for=\"gr2\"><input type=\"checkbox\" id=\"gr2\"><span>Q cours 3 : sens et caractère d’include et d’extend</span><span class=\"pts\">1 pt</span></label><label for=\"gr3\"><input type=\"checkbox\" id=\"gr3\"><span>Q cours 4 : fusion (alternatifs) / union (synchronisation)</span><span class=\"pts\">1 pt</span></label><label for=\"gr4\"><input type=\"checkbox\" id=\"gr4\"><span>DCU : système, Client, Agent, Banque secondaire à droite</span><span class=\"pts\">1 pt</span></label><label for=\"gr5\"><input type=\"checkbox\" id=\"gr5\"><span>DCU : Réserver «include» S’authentifier et Payer en ligne</span><span class=\"pts\">1,5 pt</span></label><label for=\"gr6\"><input type=\"checkbox\" id=\"gr6\"><span>DCU : Facturer les dommages «extend» Enregistrer le retour, avec condition</span><span class=\"pts\">1 pt</span></label><label for=\"gr7\"><input type=\"checkbox\" id=\"gr7\"><span>DCU : Consulter sans authentification</span><span class=\"pts\">0,5 pt</span></label><label for=\"gr8\"><input type=\"checkbox\" id=\"gr8\"><span>DCL : Véhicule abstrait, Voiture et Camion avec héritage, tarifJour() redéfinie</span><span class=\"pts\">1,5 pt</span></label><label for=\"gr9\"><input type=\"checkbox\" id=\"gr9\"><span>DCL : Agence ◇ Véhicule (agrégation) et Agence ◆ Parking (composition)</span><span class=\"pts\">1 pt</span></label><label for=\"gr10\"><input type=\"checkbox\" id=\"gr10\"><span>DCL : Contrat en classe-association (ou classe ordinaire justifiée) avec dates</span><span class=\"pts\">1 pt</span></label><label for=\"gr11\"><input type=\"checkbox\" id=\"gr11\"><span>DCL : multiplicités correctes partout</span><span class=\"pts\">1 pt</span></label><label for=\"gr12\"><input type=\"checkbox\" id=\"gr12\"><span>DCL : attributs typés et une opération par classe</span><span class=\"pts\">0,5 pt</span></label><label for=\"gr13\"><input type=\"checkbox\" id=\"gr13\"><span>Séquence : participants corrects, création du contrat avec «create»</span><span class=\"pts\">1 pt</span></label><label for=\"gr14\"><input type=\"checkbox\" id=\"gr14\"><span>Séquence : appel à la banque et retour en pointillé</span><span class=\"pts\">1 pt</span></label><label for=\"gr15\"><input type=\"checkbox\" id=\"gr15\"><span>Séquence : alt [accord] / [else] avec annulation et destruction</span><span class=\"pts\">1 pt</span></label><label for=\"gr16\"><input type=\"checkbox\" id=\"gr16\"><span>Collaboration : liens, numéros cohérents avec la séquence, {nouveau}</span><span class=\"pts\">1 pt</span></label><label for=\"gr17\"><input type=\"checkbox\" id=\"gr17\"><span>Activités : deux couloirs, initial et final</span><span class=\"pts\">1 pt</span></label><label for=\"gr18\"><input type=\"checkbox\" id=\"gr18\"><span>Activités : décision [dommage]/[else] refermée par une fusion</span><span class=\"pts\">1 pt</span></label><label for=\"gr19\"><input type=\"checkbox\" id=\"gr19\"><span>Activités : fork puis join pour paiement et kilométrage</span><span class=\"pts\">1 pt</span></label></div>","ex":[],"qcm":[]},{"id":"qcours","t":"Questions de cours (rédaction)","seance":"Travaux dirigés et pratiques","imp":4,"html":"<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p>Cherche d&#39;abord seul, ouvre l&#39;indice si tu bloques, puis compare avec le corrigé et note-toi honnêtement : ta réponse compte dans la maîtrise de la notion.</p>\n</aside><section class=\"exo\"><h3>Questions de cours type examen</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p><strong>Q1.</strong> Définissez UML. Est-ce une méthode ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>UML (Unified Modeling Language) est un langage de modélisation graphique et semi-formel qui permet de représenter et de communiquer les différents aspects d’un système. Ce n’est pas une méthode : il fournit la sémantique, la notation et les règles, mais pas de démarche. Il couvre toutes les étapes du développement.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p><strong>Q2.</strong> Pourquoi modéliser avant de développer ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Pour mieux comprendre le système, maîtriser sa complexité et assurer sa cohérence, faciliter la communication et la répartition des tâches, assurer la qualité et la maintenabilité, et réduire coûts et délais.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p><strong>Q3.</strong> Qu’est-ce qu’un modèle ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Une représentation abstraite de la réalité qui exclut les détails n’influençant pas le comportement de manière significative ; il se présente sous forme de diagramme (symboles + texte).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p><strong>Q4.</strong> Différence MOA / MOE ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>La MOA (maîtrise d’ouvrage) est le client, le métier : elle définit les besoins. La MOE (maîtrise d’œuvre) est le réalisateur : elle étudie la faisabilité, traduit techniquement, modélise et développe. Elles sont liées par un contrat.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p><strong>Q5.</strong> Citez les diagrammes statiques et dynamiques étudiés.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Statiques : classes, objets (et composants, déploiement). Dynamiques : cas d’utilisation, séquence, collaboration, activités (et états-transitions).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p><strong>Q6.</strong> Agrégation et composition : différences ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Toutes deux modélisent un lien tout/partie, losange côté tout. Agrégation (vide) : la partie peut être partagée et survit au tout. Composition (plein) : la partie appartient à un seul composite, n’existe pas sans lui et est détruite avec lui ; multiplicité côté composite ≤ 1.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><p><strong>Q7.</strong> Classe abstraite et interface ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Aucune ne s’instancie. Une classe abstraite contient au moins une méthode abstraite et peut avoir des attributs et des méthodes concrètes. Une interface n’a pas d’attributs (sauf constantes) et toutes ses méthodes sont abstraites.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"7\"><div class=\"ex-q\"><p><strong>Q8.</strong> Qu’est-ce qu’une classe-association et quand l’utiliser ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Une classe rattachée par un pointillé à une association, utilisée quand l’association porte des propriétés qui n’appartiennent à aucune des classes reliées (ex. dateEmbauche et salaire entre Société et Personne).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"8\"><div class=\"ex-q\"><p><strong>Q9.</strong> Diagramme de classes / diagramme d’objets ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Le diagramme de classes modélise les règles (structure générale) ; le diagramme d’objets en est une instance à un instant donné : objets soulignés, attributs valorisés, liens sans multiplicités, pas de généralisation.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"9\"><div class=\"ex-q\"><p><strong>Q10.</strong> Acteur principal / secondaire ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Principal : directement concerné, il sollicite le système pour obtenir un résultat. Secondaire : sollicité pour fournir des informations complémentaires ; s’il ne fait que consommer des informations sans modifier l’état du système, il est secondaire.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"10\"><div class=\"ex-q\"><p><strong>Q11.</strong> «include» / «extend» ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>include : comportement obligatoire, factorisation ou décomposition, flèche du cas de base vers le cas inclus. extend : comportement optionnel sous condition, à un point d’extension, flèche de l’extension vers le cas de base.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"11\"><div class=\"ex-q\"><p><strong>Q12.</strong> Séquence / collaboration ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Deux diagrammes d’interaction équivalents. La séquence met l’accent sur l’ordre temporel (axe vertical, lignes de vie). La collaboration met l’accent sur l’organisation spatiale des objets et leurs liens ; l’ordre est donné par la numérotation des messages.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"12\"><div class=\"ex-q\"><p><strong>Q13.</strong> Fusion / union dans un diagramme d’activités ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Fusion (losange) : rassemble des flots alternatifs, laisse passer un flot sans attendre. Union ou join (barre) : synchronise des flots concurrents, attend qu’ils soient tous arrivés.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"13\"><div class=\"ex-q\"><p><strong>Q14.</strong> Fin d’activité / fin de flot ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>La fin d’activité arrête toute l’activité. La fin de flot termine uniquement le flot qui l’atteint, sans effet sur les autres flots actifs.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"14\"><div class=\"ex-q\"><p><strong>Q15.</strong> Qu’est-ce que le polymorphisme ? Exemple.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>La capacité d’une même opération à s’exécuter différemment selon la classe de l’objet. Exemple : calculerPaie() redéfinie dans EmployéHoraire, EmployéSalarié et Vacataire.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"15\"><div class=\"ex-q\"><p><strong>Q16.</strong> Comment construire un diagramme de classes à partir d’un texte ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><ol>\n<li>Noms → classes ; 2) verbes → associations ; 3) substantifs fins et adjectifs → attributs et valeurs ; 4) héritage pour factoriser ; 5) tester les chemins d’accès ; 6) itérer et raffiner (diapo 78).</li>\n</ol>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section>","ex":[{"n":"qcours","rep":null,"tol":null},{"n":"qcours","rep":null,"tol":null},{"n":"qcours","rep":null,"tol":null},{"n":"qcours","rep":null,"tol":null},{"n":"qcours","rep":null,"tol":null},{"n":"qcours","rep":null,"tol":null},{"n":"qcours","rep":null,"tol":null},{"n":"qcours","rep":null,"tol":null},{"n":"qcours","rep":null,"tol":null},{"n":"qcours","rep":null,"tol":null},{"n":"qcours","rep":null,"tol":null},{"n":"qcours","rep":null,"tol":null},{"n":"qcours","rep":null,"tol":null},{"n":"qcours","rep":null,"tol":null},{"n":"qcours","rep":null,"tol":null},{"n":"qcours","rep":null,"tol":null}],"qcm":[]}];

:13,"ch":"ch2","q":"<p>Les 3 contraintes de la composition</p>\n","r":"<p>Un seul composite ; n’existe pas sans lui ; détruit avec lui.</p>\n"},{"n":"ch2","k":14,"ch":"ch2","q":"<p>Agrégation vs composition</p>\n","r":"<p>Agrégation ◇ : partie partageable, survit. Composition ◆ : partie exclusive, meurt avec le tout.</p>\n"},{"n":"ch2","k":15,"ch":"ch2","q":"<p>Quand une classe-association ?</p>\n","r":"<p>Quand une propriété dépend du couple d’objets (salaire entre Société et Personne).</p>\n"},{"n":"ch2","k":16,"ch":"ch2","q":"<p>{disjoint} / {chevauchement}</p>\n","r":"<p>Disjoint : un objet dans une seule sous-classe. Chevauchement : il peut être dans plusieurs.</p>\n"},{"n":"ch2","k":17,"ch":"ch2","q":"<p>{complète} / {incomplète}</p>\n","r":"<p>Complète : on ne peut pas ajouter de sous-classe. Incomplète : on peut.</p>\n"},{"n":"ch2","k":18,"ch":"ch2","q":"<p>Contrainte {ou}</p>\n","r":"<p>Ou exclusif entre deux associations : l’une ou l’autre, pas les deux.</p>\n"},{"n":"ch2","k":19,"ch":"ch2","q":"<p>Les 6 étapes du DCL (diapo 78)</p>\n","r":"<p>Classes, associations, attributs, héritage, tester les chemins d’accès, itérer.</p>\n"},{"n":"ch3","k":20,"ch":"ch3","q":"<p>Notation d’un objet</p>\n","r":"<p>nomObjet : Classe souligné, attributs valorisés, pas d’opérations.</p>\n"},{"n":"ch3","k":21,"ch":"ch3","q":"<p>Ce qui n’apparaît jamais dans un DO</p>\n","r":"<p>La généralisation et les multiplicités.</p>\n"},{"n":"ch3","k":22,"ch":"ch3","q":"<p>Règles vs faits</p>\n","r":"<p>DCL = règles ; DO = faits (une instance conforme).</p>\n"},{"n":"ch4","k":23,"ch":"ch4","q":"<p>Définition d’un acteur</p>\n","r":"<p>Rôle joué par quelqu’un ou quelque chose d’extérieur qui interagit avec le système (humain, système externe, périphérique).</p>\n"},{"n":"ch4","k":24,"ch":"ch4","q":"<p>Sens de la flèche include</p>\n","r":"<p>Du cas de base vers le cas inclus.</p>\n"},{"n":"ch4","k":25,"ch":"ch4","q":"<p>Sens de la flèche extend</p>\n","r":"<p>De l’extension vers le cas de base (avec condition, point d’extension).</p>\n"},{"n":"ch4","k":26,"ch":"ch4","q":"<p>Cas d’utilisation interne</p>\n","r":"<p>Cas non relié directement à un acteur.</p>\n"},{"n":"ch4","k":27,"ch":"ch4","q":"<p>Contenu d’une description textuelle</p>\n","r":"<p>Préconditions, scénario nominal, variantes, postconditions.</p>\n"},{"n":"ch5","k":28,"ch":"ch5","q":"<p>Synchrone / asynchrone / retour</p>\n","r":"<p>Pointe pleine ; pointe ouverte ; pointillé.</p>\n"},{"n":"ch5","k":29,"ch":"ch5","q":"<p>alt / opt / loop</p>\n","r":"<p>Si-sinon ; si ; répétition. Toujours avec une garde [ ].</p>\n"},{"n":"ch5","k":30,"ch":"ch5","q":"<p>Création et destruction d’objet</p>\n","r":"<p>Message «create» vers la tête placée plus bas ; croix X en fin de ligne de vie.</p>\n"},{"n":"ch5","k":31,"ch":"ch5","q":"<p>Cohérence séquence / classes</p>\n","r":"<p>Chaque message reçu = une opération de la classe du récepteur.</p>\n"},{"n":"ch6","k":32,"ch":"ch6","q":"<p>Syntaxe complète d’un message</p>\n","r":"<p>prédécesseurs / [condition] numéro récurrence : résultat := message(args)</p>\n"},{"n":"ch6","k":33,"ch":"ch6","q":"<p>1.3.a et 1.3.b</p>\n","r":"<p>Messages simultanés.</p>\n"},{"n":"ch6","k":34,"ch":"ch6","q":"<p>* et *||</p>\n","r":"<p>Récurrence séquentielle ; récurrence parallèle.</p>\n"},{"n":"ch6","k":35,"ch":"ch6","q":"<p>{nouveau} {détruit} {transitoire}</p>\n","r":"<p>Créé ; détruit ; créé et détruit dans la même interaction.</p>\n"},{"n":"ch6","k":36,"ch":"ch6","q":"<p>Les 4 composants d’un diagramme de collaboration</p>\n","r":"<p>Objets, liens, messages (interactions), acteurs.</p>\n"},{"n":"ch7","k":37,"ch":"ch7","q":"<p>Décision / fusion</p>\n","r":"<p>Losange 1→n avec gardes ; losange n→1 sans attente.</p>\n"},{"n":"ch7","k":38,"ch":"ch7","q":"<p>Fork / join</p>\n","r":"<p>Barre 1→n (parallélisme) ; barre n→1 (synchronisation).</p>\n"},{"n":"ch7","k":39,"ch":"ch7","q":"<p>Fin d’activité / fin de flot</p>\n","r":"<p>Arrête tout ; arrête un seul flot.</p>\n"},{"n":"ch7","k":40,"ch":"ch7","q":"<p>Les 3 familles de nœuds</p>\n","r":"<p>Exécution (actions), objets, contrôle.</p>\n"},{"n":"ch7","k":41,"ch":"ch7","q":"<p>Partitions explicites</p>\n","r":"<p>Le responsable est écrit dans l’action : (Client) Régler facture.</p>\n"},{"n":"ch7","k":42,"ch":"ch7","q":"<p>Symbole d’une action = CU interne</p>\n","r":"<p>Deux petits cercles reliés par un trait dans le coin de l’action.</p>\n"}];

// ---------- Sauvegarde ----------
// Format « essais » : un objet partagé avec l'ancien module (attempts par notion, cards par indice) ; on ne touche qu'à ces deux champs.
// Format « score10 » : scores des chapitres dans MODULE.cle, essais et cartes dans MODULE.cleEtat.
const lireJ = (k) => { try { return JSON.parse(localStorage.getItem(k) || "{}") || {}; } catch (e) { return {}; } };
const ecrireJ = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const etat = () => { const S = lireJ(MODULE.cleEtat); S.attempts = S.attempts || {}; S.cards = S.cards || {}; return S; };
function noter(n, ok) { const S = etat(); (S.attempts[n] = S.attempts[n] || []).push(ok ? 1 : 0); if (S.attempts[n].length > 30) S.attempts[n].shift(); ecrireJ(MODULE.cleEtat, S); }
// Maîtrisé = au moins 3 essais et 80 % de réussite sur les 5 derniers (règle commune à la plateforme).
function statut(n) {
  if (MODULE.format === "score10") { const v = lireJ(MODULE.cle)[n]; if (v !== undefined) return [v >= 8 ? "ok" : "fragile", v / 10]; }
  if (MODULE.format === "best") { const v = (lireJ(MODULE.cle).notions || {})[n]; return v && v.best != null ? [v.best >= 0.8 ? "ok" : "fragile", v.best] : ["jamais", null]; }
  if (MODULE.format === "pc") { const v = lireJ(MODULE.cle)[n]; return v && v.pc !== undefined ? [v.pc >= 80 ? "ok" : "fragile", v.pc / 100] : ["jamais", null]; } const a = (etat().attempts[n] || []).slice(-5); if (!a.length) return ["jamais", null]; const r = a.reduce((x, y) => x + y, 0) / a.length; return [(etat().attempts[n].length >= 3 && r >= 0.8) ? "ok" : "fragile", r]; }
const NCH = {}; NOTIONS.forEach((n) => (NCH[n.ch] = NCH[n.ch] || []).push(n));
function scoreChap(c) {
  if (MODULE.format === "score10") return lireJ(MODULE.cle)[c.id];
  if (MODULE.format === "pc") { const v = lireJ(MODULE.cle)[c.id]; return v && v.pc !== undefined ? Math.round(v.pc / 10) : undefined; }
  if (MODULE.format === "best") { const v = (lireJ(MODULE.cle).notions || {})[c.id]; return v && v.best != null ? Math.round(v.best * 10) : undefined; }
  const l = NCH[c.id] || []; if (!l.length || !l.some((n) => statut(n.id)[0] !== "jamais")) return undefined;
  return Math.round((10 * l.filter((n) => statut(n.id)[0] === "ok").length) / l.length);
}

  $('#mztChips').innerHTML = CHIPS.map((c) => `<button type="button" data-chip="${esc(c)}">${esc(c)}</button>`).join('');

  function view(v) {
    $('#mztChat').hidden = v !== 'chat'; $('#mztHist').hidden = v !== 'hist'; $('#mztMem').hidden = v !== 'mem';
    $('#mztTabH').textContent = v === 'hist' ? 'Retour' : 'Historique'; $('#mztTabM').textContent = v === 'mem' ? 'Retour' : 'Mémoire';
    if (v === 'hist') renderList(); if (v === 'mem') renderMem();
  }
  function note() {
    $('#mztNote').textContent = !ready ? 'Connexion au tuteur…' : sample
      ? 'Mode rapide (économe) par défaut. « Approfondi » ou « Approfondir cette réponse » utilise un modèle supérieur. Pense à chercher dans l\'Historique avant de reposer une question.'
      : 'Le tuteur n\'est pas disponible ici (il faut ouvrir la page dans Claude et accepter la demande d\'autorisation). L\'historique reste consultable.';
  }
  function refreshCtx() {
    const c = context(); $('#mztCtx').textContent = '· ' + c.label; $('#mztPrev').textContent = c.text.slice(0, 2500) + (c.text.length > 2500 ? '\n…' : '');
    return c;
  }
  function openPanel(ctx) {
    forced = ctx && ctx.text ? ctx : null;
    $('#mztPan').hidden = false; $('#mztBtn').hidden = true; view('chat');
    const c = refreshCtx();
    if (!cur || cur.sec !== c.label) { const ts = ST.threads.filter((t) => t.sec === c.label); cur = forced ? null : ts[ts.length - 1] || null; }
    renderLog(); note(); setTimeout(() => $('#mztIn').focus(), 30);
  }
  function closePanel() { $('#mztPan').hidden = true; $('#mztBtn').hidden = false; forced = null; }

  function renderLog() {
    const log = $('#mztLog'); log.innerHTML = '';
    if (!cur || !cur.msgs.length) {
      log.innerHTML = `<div class="mzt-m a">Pose ta question sur « ${esc(context().label)} » : une phrase que tu ne comprends pas, un calcul à vérifier, un exemple en plus… Tu peux joindre une photo de ton brouillon.</div>`; return;
    }
    cur.msgs.forEach((m, i) => {
      const d = document.createElement('div'); d.className = 'mzt-m ' + (m.r === 'u' ? 'u' : 'a');
      if (m.d) d.innerHTML = '<span class="mzt-tag">Réponse approfondie</span>';
      if (m.r === 'u') d.appendChild(document.createTextNode(m.t)); else d.insertAdjacentHTML('beforeend', md(m.t)); log.appendChild(d);
      if (m.r === 'a' && i === cur.msgs.length - 1 && !m.d && !busy) {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'mzt-deepbtn'; b.textContent = 'Approfondir cette réponse';
        b.onclick = () => ask('Approfondis ta réponse précédente : explique plus en détail, avec un exemple complet et les pièges.', true); log.appendChild(b);
      }
    });
    log.scrollTop = 1e9;
  }
  function renderList() {
    const q = norm($('#mztQ').value || ''); const ts = [...ST.threads].reverse().filter((t) => !q || norm(t.msgs.map((m) => m.t).join(' ')).includes(q));
    $('#mztList').innerHTML = ts.length ? ts.map((t) => `<details class="mzt-item"><summary>${esc(t.title)}</summary><div class="mzt-meta">${esc(t.sec)} · ${esc(t.date)}</div>${t.msgs.map((m) => `<div class="mzt-m ${m.r === 'u' ? 'u' : 'a'}" style="margin:6px 0">${m.r === 'u' ? esc(m.t) : md(m.t)}</div>`).join('')}<button type="button" data-cont="${esc(t.id)}">Continuer cette discussion</button></details>`).join('')
      : `<p class="mzt-note">${ST.threads.length ? 'Aucune discussion ne contient ce mot.' : 'Aucune discussion pour l\'instant.'}</p>`;
  }
  function renderMem() {
    $('#mztMemL').innerHTML = ST.memos.length ? ST.memos.map((m, i) => `<div class="mzt-item"><div class="mzt-meta">${esc(m.date)}</div>${esc(m.text)}<div><button type="button" data-memdel="${i}" style="margin-top:4px">Effacer</button></div></div>`).join('')
      : '<p class="mzt-note">Aucune note pour l\'instant. Elles apparaîtront au fil de tes questions.</p>';
  }

  // ---------- stockage compte ----------
  async function saveThread(t) {
    saveLocal(); if (!db) return;
    try { await db.collection(base + '/threads').doc(t.id).set({ sec: t.sec, date: t.date, title: t.title, msgs: t.msgs.slice(-40) }); } catch (e) {}
  }
  async function saveMemos() { saveLocal(); if (!db) return; try { await db.doc(base).set({ memos: ST.memos.slice(-30), updated: Date.now() }); } catch (e) {} }

  // ---------- appel au tuteur ----------
  const ERR = { not_granted: 'Tu n\'as pas autorisé la page à utiliser Claude. Recharge-la et accepte la demande, ou change-le dans le menu Autorisations de l\'artifact.', rate_limited: 'Trop de questions d\'un coup, ou limite d\'usage atteinte. Réessaie dans un moment.', prompt_too_large: 'L\'extrait est trop long : ouvre une partie plus précise du cours.', image_rejected: 'Cette photo n\'est pas acceptée. Essaie un JPEG ou un PNG plus léger.', refused: 'Claude n\'a pas pu répondre à cette demande. Reformule ta question.' };
  const visible = (t) => {
    const L = String(t).split('\n');
    for (let i = L.length - 1; i >= Math.max(0, L.length - 3); i--) if (/^\s*M[ÉE]MO\s*:/i.test(L[i])) return L.slice(0, i).join('\n').trim();
    return String(t).trim();
  };
  // rendu léger : on échappe le HTML d'abord, puis gras, italique, code, titres, puces et blocs de code
  const inl = (s) => {
    const p = s.split('`'); if (p.length % 2 === 0) { const last = p.pop(); p[p.length - 1] += '`' + last; }
    return p.map((x, i) => i % 2 ? '<code>' + esc(x) + '</code>' : esc(x).replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*\w])\*([^*\n]+)\*(?![*\w])/g, '$1<em>$2</em>')).join('');
  };
  const md = (t) => {
    const out = []; let list = null, code = null;
    const flush = () => { if (list) { out.push('</' + list + '>'); list = null; } };
    String(t).split('\n').forEach((raw) => {
      if (/^\s*```/.test(raw)) { if (code === null) { flush(); code = []; } else { out.push('<pre>' + esc(code.join('\n')) + '</pre>'); code = null; } return; }
      if (code !== null) { code.push(raw); return; }
      let m;
      if ((m = raw.match(/^\s*#{1,6}\s+(.*)$/))) { flush(); out.push('<p><strong>' + inl(m[1]) + '</strong></p>'); }
      else if ((m = raw.match(/^\s*[-*•]\s+(.*)$/))) { if (list !== 'ul') { flush(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + inl(m[1]) + '</li>'); }
      else if ((m = raw.match(/^\s*\d+[.)]\s+(.*)$/))) { if (list !== 'ol') { flush(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + inl(m[1]) + '</li>'); }
      else if (!raw.trim()) flush();
      else { flush(); out.push('<p>' + inl(raw) + '</p>'); }
    });
    if (code !== null) out.push('<pre>' + esc(code.join('\n')) + '</pre>');
    flush(); return out.join('');
  };
  async function ask(q, deep) {
    q = (q || '').trim(); deep = deep || $('#mztDeep').checked;
    if (busy || !q) return; if (!sample) { note(); return; }
    const c = refreshCtx();
    if (!cur || (cur.sec !== c.label && !forced)) { cur = { id: 't' + Date.now().toString(36), sec: c.label, date: today(), title: q.slice(0, 80), msgs: [] }; ST.threads.push(cur); }
    else if (!ST.threads.includes(cur)) ST.threads.push(cur);
    cur.msgs.push({ r: 'u', t: q }); busy = true; renderLog();
    const out = document.createElement('div'); out.className = 'mzt-m a'; out.textContent = deep ? 'Réflexion approfondie…' : 'Réflexion…'; $('#mztLog').appendChild(out);
    $('#mztSend').disabled = true; $('#mztStop').hidden = false;
    const style = deep
      ? 'Réponse APPROFONDIE (400 à 700 mots) : 1) l\'intuition avec une analogie, 2) l\'explication détaillée pas à pas, 3) pourquoi ça marche, 4) un exemple complet chiffré, 5) les pièges fréquents et ce qui tombe à l\'examen, 6) une question pour vérifier la compréhension.'
      : 'Réponse EXPLICATIVE (150 à 250 mots) : 1) l\'idée en une phrase, 2) l\'explication pas à pas, 3) un petit exemple chiffré ou concret, 4) une courte question pour vérifier la compréhension.';
    const mem = [];
    if (ST.memos.length) mem.push('DIFFICULTÉS DÉJÀ REPÉRÉES :\n' + ST.memos.slice(-12).map((m) => `- ${m.date} : ${m.text}`).join('\n'));
    const lastQ = ST.threads.flatMap((t) => t.msgs.filter((m) => m.r === 'u').map((m) => `[${t.sec}] ${m.t.slice(0, 100)}`)).slice(-6);
    if (lastQ.length) mem.push('SES DERNIÈRES QUESTIONS :\n' + lastQ.map((x) => '- ' + x).join('\n'));
    const rules = `Tu es le tuteur de ${C.student}, pour le module ${C.module}${C.prof ? ' du ' + C.prof : ''}. Il apprend souvent la notion pour la première fois.
Règles : réponds en français simple, en Markdown léger (**gras** pour les termes clés, tirets, étapes numérotées, formules et calculs entre accents graves ; pas de tableaux). ${style} Appuie-toi d'abord sur l'EXTRAIT ci-dessous et sur les conventions du prof ; si une source générale diffère du cours, signale l'écart et dis quelle version utiliser à l'examen (celle du prof). Pour un calcul, pose chaque étape et vérifie-la. S'il envoie une réponse ou une photo de brouillon, corrige étape par étape et nomme précisément l'erreur. Si tu n'es pas sûr, dis-le. S'il demande un mini-exercice, donne l'exercice sans la solution.
Utilise sa mémoire pour faire des liens avec ses confusions passées, sans la réciter.
Termine TOUJOURS par une dernière ligne séparée au format exact « MÉMO: … » qui résume en 15 mots maximum la difficulté révélée par sa question (ou « MÉMO: rien »). Cette ligne lui est cachée.
${C.conventions ? 'CONVENTIONS DU PROF : ' + C.conventions + '\n' : ''}MÉMOIRE DE L'ÉLÈVE :
${mem.join('\n\n') || '(rien pour l\'instant)'}
EXTRAIT (${c.label}) :
${c.text.slice(0, deep ? 9000 : 3500)}`;
    const recent = cur.msgs.slice(deep ? -9 : -5, -1).map((m) => ({ role: m.r === 'u' ? 'user' : 'assistant', content: m.t }));
    while (recent.length && recent[0].role !== 'user') recent.shift();
    const msgs = [...recent.filter((m) => m.content && m.content.trim()), { role: 'user', content: q }]; while (msgs.length > 1 && msgs[0].role !== 'user') msgs.shift(); msgs[0] = { role: 'user', content: rules + '\n\n---\nQuestion : ' + msgs[0].content };
    ctl = new AbortController();
    const opts = { modelTier: deep ? 'complex' : 'quick', cache: false, signal: ctl.signal, onText: ({ text }) => { out.innerHTML = md(visible(text)); $('#mztLog').scrollTop = 1e9; } };
    if (img) opts.images = [img];
    try {
      const r = await sample(msgs, opts);
      const mm = r.text.match(/(?:^|\n)\s*M[ÉE]MO\s*:\s*(.+)\s*$/i);
      cur.msgs.push({ r: 'a', t: visible(r.text) + (r.truncated ? '\n\n(Réponse coupée : pose une question plus ciblée.)' : ''), d: !!deep });
      if (mm && !/^\s*rien/i.test(mm[1])) { ST.memos.push({ date: today(), text: mm[1].trim().slice(0, 160) }); if (ST.memos.length > 30) ST.memos.shift(); saveMemos(); }
      await saveThread(cur);
    } catch (e) {
      const kept = e && e.text ? visible(e.text) : '';
      if (e && e.code === 'cancelled') { if (kept) cur.msgs.push({ r: 'a', t: kept + '\n(Arrêté.)' }); else cur.msgs.pop(); }
      else { cur.msgs.pop(); out.textContent = (kept ? kept + '\n\n' : '') + (ERR[e && e.code] || 'Le tuteur n\'a pas pu répondre. Réessaie dans un instant.'); }
      if (!cur.msgs.length) ST.threads = ST.threads.filter((t) => t !== cur);
      saveLocal();
      if (!(e && e.code === 'cancelled')) { busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImgN').textContent = ''; return; }
    }
    busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImg').value = ''; $('#mztImgN').textContent = ''; renderLog();
  }

  // ---------- événements ----------
  $('#mztBtn').onclick = () => openPanel(null);
  $('#mztX').onclick = closePanel;
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#mztPan').hidden) closePanel(); });
  $('#mztTabH').onclick = () => view($('#mztHist').hidden ? 'hist' : 'chat');
  $('#mztTabM').onclick = () => view($('#mztMem').hidden ? 'mem' : 'chat');
  $('#mztQ').oninput = renderList;
  $('#mztList').onclick = (e) => { const id = e.target.dataset && e.target.dataset.cont; if (!id) return; cur = ST.threads.find((t) => t.id === id); view('chat'); $('#mztCtx').textContent = '· ' + cur.sec; renderLog(); };
  $('#mztMemL').onclick = (e) => { const i = e.target.dataset && e.target.dataset.memdel; if (i == null) return; ST.memos.splice(+i, 1); saveMemos(); renderMem(); };
  $('#mztChips').onclick = (e) => { const b = e.target.closest('[data-chip]'); if (!b) return; const t = $('#mztIn'); t.value = b.dataset.chip + (t.value ? ' : ' + t.value : ''); t.focus(); };
  $('#mztNew').onclick = () => { cur = null; renderLog(); };
  $('#mztStop').onclick = () => { if (ctl) ctl.abort(); };
  $('#mztImg').onchange = (e) => { img = e.target.files[0] || null; $('#mztImgN').textContent = img ? 'Photo : ' + img.name : ''; };
  $('#mztF').onsubmit = (e) => { e.preventDefault(); const v = $('#mztIn').value; $('#mztIn').value = ''; ask(v); };
  $('#mztIn').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#mztF').requestSubmit(); } });

  // ---------- capacités (facultatives) ----------
  const W = window.claude;
  if (W && W.use) {
    W.use('sample').then((s) => { sample = s; ready = true; note();
      if (s && s.limits) s.limits().then((l) => { if (l && l.images) { imgOK = true; $('#mztImgL').hidden = false; if (l.images.mediaTypes) $('#mztImg').accept = l.images.mediaTypes.join(','); } }).catch(() => {});
    }).catch(() => { ready = true; note(); });
    Promise.all([W.use('db'), W.use('user')]).then(async ([d, u]) => {
      if (!d || !u) return; const id = await u.id(); if (!id) return; db = d; base = 'data/users/' + id + '/mzt_' + C.id;
      try {
        const m = await db.doc(base).get(); if (m.exists) { const v = m.data() || {}; if (Array.isArray(v.memos)) ST.memos = JSON.parse(JSON.stringify(v.memos)); }
        const q = await db.collection(base + '/threads').get(); const remote = q.docs.map((x) => Object.assign({ id: x.id }, JSON.parse(JSON.stringify(x.data() || {}))));
        const map = {}; [...ST.threads, ...remote].forEach((t) => { if (!map[t.id] || (t.msgs || []).length > (map[t.id].msgs || []).length) map[t.id] = t; });
        ST.threads = Object.values(map).sort((a, b) => parseInt(a.id.slice(1), 36) - parseInt(b.id.slice(1), 36)); saveLocal();
      } catch (e) {}
    }).catch(() => {});
  } else { ready = true; note(); }

  window.MZT = { open: openPanel, close: closePanel };
})();

</script>
</body>
</html>
