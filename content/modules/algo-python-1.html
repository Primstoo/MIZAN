<script>
const MODULE={"slug":"algo-python-1","titre":"Algorithmique et programmation Python 1","cle":"algo-python-1_scores","cleEtat":"algo-python-1_scores_etat","format":"score10","intro":"<p>Ce module suit <strong>les 9 séances du Pr Y. Madani</strong> (octobre–novembre 2024) : quatre séances d&#39;algorithmique en pseudo-langage, puis cinq séances de Python.</p>\n<p><strong>Comment l&#39;utiliser</strong></p>\n<ol>\n<li>Lis un chapitre dans l&#39;ordre : <em>Avant de commencer</em>, <em>Comment aborder</em>, puis les idées une par une.</li>\n<li>Recopie et exécute les exemples Python (VS Code, IDLE ou Google Colab). Toutes les sorties affichées ont été vérifiées en exécutant le code.</li>\n<li>Fais le QCM du chapitre. <strong>8/10 = chapitre maîtrisé.</strong></li>\n<li>Termine par le chapitre « TD corrigés » puis l&#39;examen blanc.</li>\n</ol>\n<p><strong>Ce qui est sûr</strong> : le plan, les notations et les exemples viennent des diapositives et des fiches de TD 1 à 6.\n<strong>À vérifier</strong> : les TD n&#39;ont pas de corrigé officiel (corrigés ToumaiLearn) et aucune annale n&#39;était fournie : l&#39;examen blanc est construit à partir des TD. Demande au prof le format de l&#39;examen.</p>\n","annexes":[],"cartes":null,"maths":false};
const CHAPS=[{"id":"intro-algorithmique","t":"Introduction à l'algorithmique et instructions élémentaires","seance":"Séance 1 · 7 octobre 2024","imp":4,"html":"<h2>Avant de commencer</h2>\n<p>Aucun prérequis en informatique. Il faut juste savoir faire une division euclidienne : quotient et reste.</p>\n<section class=\"exo\"><h3>Vérifie ton prérequis</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Dans la division de 17 par 5, quel est le reste ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button></div><div class=\"ex-h\" hidden><p>5 × 3 = 15. Combien manque-t-il pour arriver à 17 ?</p>\n</div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 2</b></p><p>17 = 5 × 3 + 2. Le quotient est 3, le reste est <strong>2</strong>. En algorithmique, ce reste s&#39;obtient avec l&#39;opérateur modulo : 17 % 5 vaut 2.</p>\n</div></div></section><h2>Comment aborder ce chapitre</h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p>Un algorithme, c&#39;est une recette : des ingrédients (entrées), des étapes précises (traitement), un plat (sortie). Avant d&#39;écrire une ligne, demande-toi toujours : <strong>qu&#39;est-ce que je reçois, qu&#39;est-ce que je dois rendre ?</strong></p>\n</aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>Confondre la flèche d&#39;affectation <code>←</code> et le signe <code>=</code>. En pseudo-code, <code>age ← 18</code> <strong>range</strong> 18 dans <code>age</code>. Le signe <code>=</code> sert à <strong>comparer</strong> : <code>a = b</code> vaut vrai ou faux.</p>\n</aside><p>À la fin, tu sais écrire un algorithme complet en pseudo-langage (en-tête + corps) avec variables, constantes, opérateurs et entrées/sorties.</p>\n<h2>Idée 1 · Un algorithme transforme des entrées en sorties</h2>\n<figure class=\"flux\"><figcaption>Ce que fait tout algorithme</figcaption><div class=\"flux-l\"><div class=\"flux-b\">Entrées (données lues)</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Traitement (instructions pas à pas)</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Sorties (résultats affichés)</div></div></figure><p>Un <strong>algorithme</strong> est une suite finie d&#39;instructions claires qui résout un problème. Un <strong>programme</strong> est la traduction de cet algorithme dans un langage (ici Python, à partir de la séance 5).</p>\n<p>Le prof cite plusieurs familles d&#39;algorithmes : force brute (on essaie tout), récursif, recherche, tri, diviser pour régner, hachage.</p>\n<p>Les qualités attendues d&#39;un algorithme :</p>\n<table>\n<thead>\n<tr>\n<th>Qualité</th>\n<th>Ce que ça veut dire</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Entrée / Sortie</td>\n<td>il reçoit des valeurs et produit au moins un résultat</td>\n</tr>\n<tr>\n<td>Sans ambiguïté</td>\n<td>chaque instruction a un seul sens</td>\n</tr>\n<tr>\n<td>Finitude</td>\n<td>il s&#39;arrête après un nombre fini d&#39;étapes</td>\n</tr>\n<tr>\n<td>Déterminisme</td>\n<td>même entrée → même résultat</td>\n</tr>\n<tr>\n<td>Généricité</td>\n<td>il marche pour toute une famille de cas</td>\n</tr>\n<tr>\n<td>Lisibilité, efficacité</td>\n<td>clair, sans étapes inutiles</td>\n</tr>\n<tr>\n<td>Indépendance du langage</td>\n<td>traduisible en C, Python, Java…</td>\n</tr>\n</tbody></table>\n<aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend</div><p>Le prof insiste sur la <strong>finitude</strong> : un algorithme qui tourne en boucle infinie n&#39;est pas un algorithme.</p>\n</aside><h2>Idée 2 · La structure d&#39;un algorithme : en-tête + corps</h2>\n<svg viewBox=\"0 0 460 230\" style=\"width:100%;max-width:520px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Un algorithme se compose d'un en-tête (nom, rôle, entrées, sorties, déclarations) puis d'un corps entre Début et Fin\">\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\">\n<rect x=\"20\" y=\"10\" width=\"420\" height=\"92\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<text x=\"34\" y=\"32\" font-weight=\"700\">En-tête</text>\n<text x=\"34\" y=\"52\">Algorithme Cercle · Rôle : surface d'un cercle</text>\n<text x=\"34\" y=\"70\">ENTRÉES : r   ·   SORTIES : surface</text>\n<text x=\"34\" y=\"88\">Constante PI : 3.1415927   Variables r, surface : réels</text>\n<rect x=\"20\" y=\"114\" width=\"420\" height=\"104\" rx=\"8\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/>\n<text x=\"34\" y=\"136\" font-weight=\"700\" fill=\"#D9824F\">Corps</text>\n<text x=\"34\" y=\"156\">Début</text>\n<text x=\"58\" y=\"174\">r ← 2.3</text>\n<text x=\"58\" y=\"192\">surface ← PI * r * r</text>\n<text x=\"34\" y=\"210\">Fin</text>\n</g></svg><p>L&#39;<strong>en-tête</strong> donne le nom, le rôle, les entrées, les sorties et les déclarations. Le <strong>corps</strong> est la suite d&#39;instructions indentées entre <code>Début</code> et <code>Fin</code>. Les commentaires s&#39;écrivent <code>/* ... */</code> : la machine les ignore.</p>\n<pre class=\"\"><code>Algorithme Surface_cercle\n/* ENTRÉES : r   SORTIES : surface, perimetre */\nConstante PI : 3.1415927\nVariables r, surface, perimetre : réels\nDébut\n    r ← 2.3\n    surface ← PI * r * r\n    perimetre ← 2 * PI * r\nFin</code></pre><p>Le prof décrit 4 étapes pour construire un algorithme :</p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Construire un algorithme</figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Comprendre le problème</div><p>Quelles entrées, quelles sorties, quels cas particuliers ?</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Préparer</div><p>Lister les données nécessaires et les déclarer (variables, constantes).</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Traiter</div><p>Écrire la résolution pas à pas, en découpant en sous-problèmes si besoin.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Éditer les résultats</div><p>Afficher à l&#39;écran (Ecrire) ou écrire dans un fichier.</p>\n</div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><h2>Idée 3 · Variables, types, constantes, affectation</h2>\n<p>Une <strong>variable</strong> est un emplacement mémoire nommé, avec un <strong>type</strong>. Sa valeur peut changer. Une <strong>constante</strong> (<code>Constante Pi : 3.14159265359</code>) ne change jamais.</p>\n<table>\n<thead>\n<tr>\n<th>Type</th>\n<th>Exemples</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Entier</td>\n<td>-3, 0, 42</td>\n</tr>\n<tr>\n<td>Réel</td>\n<td>3.14, -0.5</td>\n</tr>\n<tr>\n<td>Caractère</td>\n<td>&#39;A&#39;, &#39;5&#39;, &#39;@&#39;</td>\n</tr>\n<tr>\n<td>Chaîne de caractères</td>\n<td>&quot;Bonjour&quot;, &quot;12345&quot;</td>\n</tr>\n<tr>\n<td>Booléen</td>\n<td>Vrai, Faux</td>\n</tr>\n</tbody></table>\n<p>L&#39;affectation <code>age ← age + 2</code> se lit <strong>de droite à gauche</strong> : on calcule <code>age + 2</code> avec l&#39;ancienne valeur, puis on range le résultat dans <code>age</code>.</p>\n<figure class=\"grille\"><figcaption>Trace de l'algorithme du prof (age)</figcaption><table><tr><th>instruction</th><th>age</th></tr><tr><td>age ← 18</td><td class=\"h1\">18</td></tr><tr><td>age ← age + 2</td><td class=\"h1\">20</td></tr></table></figure><p>Voici la même chose en Python (tu le verras en détail à la séance 5 : <code>=</code> remplace <code>←</code>) :</p>\n<pre class=\"\"><code>age = 18\nage = age + 2\nprint(age)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>20</code></pre><h2>Idée 4 · Opérateurs arithmétiques, logiques, de comparaison</h2>\n<p><strong>Arithmétiques</strong> : <code>+</code>, <code>-</code>, <code>*</code>, <code>/</code>, et <code>%</code> (modulo = reste de la division entière). Exemple du prof : 15 divisé par 2 donne 7, il reste 1, donc 15 % 2 vaut 1.</p>\n<p><strong>Comparaison</strong> : <code>=</code>, <code>!=</code> (ou <code>&lt;&gt;</code>), <code>&lt;</code>, <code>&gt;</code>, <code>&lt;=</code>, <code>&gt;=</code>. Le résultat est un booléen.</p>\n<p><strong>Logiques</strong> : ET, OU, NON.</p>\n<figure class=\"grille\"><figcaption>Tables de vérité</figcaption><table><tr><th>A</th><th>B</th><th>A ET B</th><th>A OU B</th><th>NON A</th></tr><tr><td>vrai</td><td>vrai</td><td class=\"h1\">vrai</td><td class=\"h1\">vrai</td><td>faux</td></tr><tr><td>vrai</td><td>faux</td><td>faux</td><td class=\"h1\">vrai</td><td>faux</td></tr><tr><td>faux</td><td>vrai</td><td>faux</td><td class=\"h1\">vrai</td><td class=\"h1\">vrai</td></tr><tr><td>faux</td><td>faux</td><td>faux</td><td>faux</td><td class=\"h1\">vrai</td></tr></table></figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p><strong>ET</strong> n&#39;est vrai que si <strong>les deux</strong> sont vraies. <strong>OU</strong> n&#39;est faux que si <strong>les deux</strong> sont fausses.</p>\n</aside><p>L&#39;exemple de comparaison du prof (a ← 5, b ← 5, c ← 10), traduit en Python :</p>\n<pre class=\"\"><code>a, b, c = 5, 5, 10\nprint(a &lt; c, a &lt;= b, c &gt; b, c &gt;= c, not (c &lt;= b), c &gt; a)\nprint(15 % 2, 18 % 5)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>True True True True True True\n1 3</code></pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>Sur la diapositive « Algorithm 7 », la ligne <code>S ORTIES</code> est écrite « Comprarer » : simple faute de frappe, il faut lire « Comparer ».</p>\n</aside><h2>Idée 5 · Lire et Écrire</h2>\n<ul>\n<li><code>Ecrire(&quot;message&quot;, variable)</code> affiche à l&#39;écran (sortie).</li>\n<li><code>Lire(variable)</code> attend une saisie au clavier et la range dans la variable (entrée).</li>\n</ul>\n<pre class=\"\"><code>Variables nom : chaîne de caractères\n          age : Entier\nDébut\n    Ecrire(&quot;Entrez votre nom : &quot;)\n    Lire(nom)\n    Ecrire(&quot;Entrez votre âge : &quot;)\n    Lire(age)\n    Ecrire(&quot;Bonjour, &quot;, nom)\n    Ecrire(&quot;Vous avez &quot;, age, &quot; ans.&quot;)\nFin</code></pre><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>Toujours un <code>Ecrire</code> <strong>avant</strong> chaque <code>Lire</code> : sinon l&#39;utilisateur voit un écran vide et ne sait pas quoi taper.</p>\n</aside><h2>S&#39;exercer</h2>\n<section class=\"exo\"><h3>Exercices du TD 1</h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>(TD 1, ex. 1) Écris un algorithme qui lit deux nombres a et b et affiche leur somme, différence, produit, division et modulo.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Deux Lire, puis cinq Ecrire. Attention à la division par zéro.</p>\n</div><div class=\"ex-c\" hidden><p>Variables a, b : entiers\nDébut\n  Ecrire(&quot;a = &quot;) ; Lire(a)\n  Ecrire(&quot;b = &quot;) ; Lire(b)\n  Ecrire(&quot;somme : &quot;, a + b)\n  Ecrire(&quot;différence : &quot;, a - b)\n  Ecrire(&quot;produit : &quot;, a * b)\n  Ecrire(&quot;division : &quot;, a / b)\n  Ecrire(&quot;modulo : &quot;, a % b)\nFin\n(Pour a = 17, b = 5 : 22, 12, 85, 3.4, 2.) La division et le modulo supposent b ≠ 0 : on le vérifiera avec un Si au chapitre suivant.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>(TD 1, ex. 2) Calcule l&#39;aire S = Pi × R² d&#39;un cercle de rayon R lu au clavier (Pi = 3.14159).</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Constante Pi : 3.14159\nVariables R, S : réels\nDébut\n  Ecrire(&quot;Rayon : &quot;) ; Lire(R)\n  S ← Pi * R * R\n  Ecrire(&quot;Aire : &quot;, S)\nFin</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>(TD 1, ex. 6) Échange les valeurs de deux variables A et B.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Il faut une troisième variable.</p>\n</div><div class=\"ex-c\" hidden><p>Variables A, B, temp : entiers\nDébut\n  Lire(A) ; Lire(B)\n  temp ← A\n  A ← B\n  B ← temp\n  Ecrire(&quot;A = &quot;, A, &quot; B = &quot;, B)\nFin\nSans temp, A ← B écrase l&#39;ancienne valeur de A, qui est perdue.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quelle qualité impose qu&#39;un algorithme s&#39;arrête après un nombre fini d&#39;étapes ?</div><button class=\"opt\" data-o=\"0\">Le déterminisme</button><button class=\"opt\" data-o=\"1\">La finitude</button><button class=\"opt\" data-o=\"2\">La généricité</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Un algorithme est déterministe si…</div><button class=\"opt\" data-o=\"0\">il est écrit dans un seul langage</button><button class=\"opt\" data-o=\"1\">la même entrée donne toujours le même résultat</button><button class=\"opt\" data-o=\"2\">il utilise des nombres aléatoires</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Que vaut 18 % 5 ?</div><button class=\"opt\" data-o=\"0\">3.6</button><button class=\"opt\" data-o=\"1\">3</button><button class=\"opt\" data-o=\"2\">1</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Après <code>x ← 4</code> puis <code>x ← x * 3</code>, que vaut x ?</div><button class=\"opt\" data-o=\"0\">4</button><button class=\"opt\" data-o=\"1\">7</button><button class=\"opt\" data-o=\"2\">12</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">En pseudo-langage, <code>a = b</code>…</div><button class=\"opt\" data-o=\"0\">compare a et b et vaut vrai ou faux</button><button class=\"opt\" data-o=\"1\">range b dans a</button><button class=\"opt\" data-o=\"2\">range a dans b</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">« vrai OU faux » vaut :</div><button class=\"opt\" data-o=\"0\">vrai</button><button class=\"opt\" data-o=\"1\">faux</button><button class=\"opt\" data-o=\"2\">impossible à dire</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">« NON(vrai) ET vrai » vaut :</div><button class=\"opt\" data-o=\"0\">vrai</button><button class=\"opt\" data-o=\"1\">faux</button><button class=\"opt\" data-o=\"2\">vrai OU faux</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Où déclare-t-on les variables et les constantes ?</div><button class=\"opt\" data-o=\"0\">Dans l&#39;en-tête, avant Début</button><button class=\"opt\" data-o=\"1\">Après Fin</button><button class=\"opt\" data-o=\"2\">N&#39;importe où dans le corps</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Quel type pour stocker &quot;12345&quot; ?</div><button class=\"opt\" data-o=\"0\">Entier</button><button class=\"opt\" data-o=\"1\">Réel</button><button class=\"opt\" data-o=\"2\">Chaîne de caractères</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Que fait <code>Lire(x)</code> ?</div><button class=\"opt\" data-o=\"0\">Affiche x à l&#39;écran</button><button class=\"opt\" data-o=\"1\">Attend une saisie au clavier et la range dans x</button><button class=\"opt\" data-o=\"2\">Efface x</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"intro-algorithmique","rep":["2"],"tol":null},{"n":"intro-algorithmique","rep":null,"tol":null},{"n":"intro-algorithmique","rep":null,"tol":null},{"n":"intro-algorithmique","rep":null,"tol":null}],"qcm":[{"n":"intro-algorithmique","q":"Quelle qualité impose qu&#39;un algorithme s&#39;arrête après un nombre fini d&#39;étapes ?","o":["Le déterminisme","La finitude","La généricité"],"a":1,"e":"La finitude interdit la boucle infinie."},{"n":"intro-algorithmique","q":"Un algorithme est déterministe si…","o":["il est écrit dans un seul langage","la même entrée donne toujours le même résultat","il utilise des nombres aléatoires"],"a":1,"e":"Un algorithme non déterministe peut donner des résultats différents pour la même entrée."},{"n":"intro-algorithmique","q":"Que vaut 18 % 5 ?","o":["3.6","3","1"],"a":1,"e":"18 = 5 × 3 + 3 : le reste est 3."},{"n":"intro-algorithmique","q":"Après <code>x ← 4</code> puis <code>x ← x * 3</code>, que vaut x ?","o":["4","7","12"],"a":2,"e":"On calcule 4 × 3 avec l&#39;ancienne valeur puis on range 12 dans x."},{"n":"intro-algorithmique","q":"En pseudo-langage, <code>a = b</code>…","o":["compare a et b et vaut vrai ou faux","range b dans a","range a dans b"],"a":0,"e":"L&#39;affectation s&#39;écrit <code>←</code>. Le <code>=</code> est une comparaison."},{"n":"intro-algorithmique","q":"« vrai OU faux » vaut :","o":["vrai","faux","impossible à dire"],"a":0,"e":"OU est vrai dès qu&#39;une des deux conditions est vraie."},{"n":"intro-algorithmique","q":"« NON(vrai) ET vrai » vaut :","o":["vrai","faux","vrai OU faux"],"a":1,"e":"NON(vrai) = faux, et faux ET vrai = faux."},{"n":"intro-algorithmique","q":"Où déclare-t-on les variables et les constantes ?","o":["Dans l&#39;en-tête, avant Début","Après Fin","N&#39;importe où dans le corps"],"a":0,"e":"Les déclarations font partie de l&#39;en-tête."},{"n":"intro-algorithmique","q":"Quel type pour stocker &quot;12345&quot; ?","o":["Entier","Réel","Chaîne de caractères"],"a":2,"e":"Les guillemets en font un texte, pas un nombre."},{"n":"intro-algorithmique","q":"Que fait <code>Lire(x)</code> ?","o":["Affiche x à l&#39;écran","Attend une saisie au clavier et la range dans x","Efface x"],"a":1,"e":"Lire est l&#39;instruction d&#39;entrée ; Ecrire est l&#39;instruction de sortie."}]},{"id":"structures-controle","t":"Structures de contrôle · conditions et boucles (pseudo-code)","seance":"Séance 2 · octobre 2024","imp":5,"html":"<h2>Avant de commencer</h2>\n<p>Tu dois savoir écrire une affectation (<code>x ← x + 1</code>) et une condition simple (<code>x &gt; 10</code>) qui vaut vrai ou faux.</p>\n<section class=\"exo\"><h3>Vérifie ton prérequis</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Avec x ← 7, que vaut la condition « x &gt; 5 ET x % 2 = 0 » ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button></div><div class=\"ex-h\" hidden><p>Évalue chaque morceau séparément.</p>\n</div><div class=\"ex-c\" hidden><p><b>Réponse attendue : faux</b></p><p>x &gt; 5 est vrai, mais 7 % 2 = 1, donc x % 2 = 0 est faux. vrai ET faux = <strong>faux</strong>.</p>\n</div></div></section><h2>Comment aborder ce chapitre</h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p>Pour chaque boucle, pose-toi trois questions : <strong>où j&#39;initialise ? quelle est la condition ? qu&#39;est-ce qui change à chaque tour ?</strong> Si rien ne change, la boucle ne s&#39;arrête jamais.</p>\n</aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>La boucle <strong>Répéter … jusqu&#39;à</strong> s&#39;arrête quand la condition devient <strong>vraie</strong> ; la boucle <strong>TantQue</strong> continue tant que la condition est <strong>vraie</strong>. Les deux conditions sont donc contraires.</p>\n</aside><p>À la fin, tu sais choisir entre Si, Si-Sinon, Sinon Si, Selon, et entre les boucles Pour, TantQue et Répéter, puis faire la trace d&#39;une boucle à la main.</p>\n<h2>Idée 1 · Si … alors … sinon : choisir un chemin</h2>\n<svg viewBox=\"0 0 440 210\" style=\"width:100%;max-width:500px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Organigramme : la condition est testée ; si elle est vraie on exécute le bloc 1, sinon le bloc 2, puis on reprend après finsi\">\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\">\n<polygon points=\"220,10 300,50 220,90 140,50\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/>\n<text x=\"220\" y=\"55\">condition ?</text>\n<line x1=\"140\" y1=\"50\" x2=\"80\" y2=\"50\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"80\" y1=\"50\" x2=\"80\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<line x1=\"300\" y1=\"50\" x2=\"360\" y2=\"50\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"360\" y1=\"50\" x2=\"360\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<text x=\"105\" y=\"42\">vrai</text><text x=\"335\" y=\"42\">faux</text>\n<rect x=\"20\" y=\"110\" width=\"120\" height=\"36\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"80\" y=\"133\">instructions 1</text>\n<rect x=\"300\" y=\"110\" width=\"120\" height=\"36\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"360\" y=\"133\">instructions 2</text>\n<line x1=\"80\" y1=\"146\" x2=\"80\" y2=\"180\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"360\" y1=\"146\" x2=\"360\" y2=\"180\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<line x1=\"80\" y1=\"180\" x2=\"360\" y2=\"180\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<text x=\"220\" y=\"200\">suite après finsi</text>\n</g></svg><p>Une <strong>condition</strong> est une expression qui vaut vrai ou faux. Trois formes :</p>\n<pre class=\"\"><code>si x &gt; 10 alors                     si note &gt;= 10 alors\n    Ecrire(&quot;x &gt; 10&quot;)                    Ecrire(&quot;Validé&quot;)\nsinon si x &lt; 10 alors               sinon si note &lt; 10 ET note &gt;= 5 alors\n    Ecrire(&quot;x &lt; 10&quot;)                    Ecrire(&quot;Rattrapage&quot;)\nsinon                               sinon\n    Ecrire(&quot;x = 10&quot;)                    Ecrire(&quot;Non Validé&quot;)\nfinsi                               finsi</code></pre><ul>\n<li><code>si … alors … finsi</code> : on agit seulement si c&#39;est vrai.</li>\n<li><code>si … sinon … finsi</code> : exactement une des deux branches s&#39;exécute.</li>\n<li><code>sinon si</code> : on teste les conditions <strong>dans l&#39;ordre</strong> ; la première vraie gagne, <code>sinon</code> attrape le reste.</li>\n</ul>\n<p>Le test de parité du prof utilise le modulo : <code>si nombre % 2 = 0 alors</code> pair <code>sinon</code> impair.</p>\n<p>Les <strong>conditions composées</strong> relient plusieurs conditions par ET, OU, NON. « x dans ]10, 20[ » s&#39;écrit <code>x &gt; 10 ET x &lt; 20</code>.</p>\n<p>La <strong>structure à choix multiples</strong> (Selon) compare une variable à plusieurs valeurs possibles ; elle remplace une longue cascade de <code>sinon si</code>. Elle est traduite en Python par <code>match-case</code> (chapitre 7).</p>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p>Dans l&#39;exemple de la note, <code>note &lt; 10</code> est déjà acquis quand on arrive au <code>sinon si</code> (sinon la première branche aurait été prise). On peut donc écrire simplement <code>sinon si note &gt;= 5</code>.</p>\n</aside><h2>Idée 2 · Les trois boucles</h2>\n<table>\n<thead>\n<tr>\n<th>Boucle</th>\n<th>Quand l&#39;utiliser</th>\n<th>Exécutions minimum</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>pour i ← a jusqu&#39;à b faire</code></td>\n<td>nombre de tours <strong>connu</strong></td>\n<td>0</td>\n</tr>\n<tr>\n<td><code>tantque condition faire</code></td>\n<td>nombre de tours inconnu</td>\n<td>0</td>\n</tr>\n<tr>\n<td><code>répéter … jusqu&#39;à condition</code></td>\n<td>inconnu, mais au moins une fois</td>\n<td><strong>1</strong></td>\n</tr>\n</tbody></table>\n<pre class=\"\"><code>S ← 0                       S ← 0                     S ← 0 ; i ← 1\npour i ← 1 jusqu'à 10 faire i ← 1                     répéter\n    S ← S + i               tantque i &lt;= 10 faire        S ← S + i\nfin pour                        S ← S + i                i ← i + 1\n                                i ← i + 1             jusqu'à i &gt; 10\n                            fin tantque</code></pre><p>Les trois calculent la somme 1 + 2 + … + 10. Avec <code>Pas</code>, le compteur avance d&#39;autre chose que 1 : <code>pour i ← 0 jusqu&#39;à N Pas 2</code> parcourt les pairs.</p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p>La condition d&#39;arrêt de <strong>Répéter</strong> est l&#39;<strong>inverse</strong> de la condition de continuation de <strong>TantQue</strong> : <code>tantque i &lt;= 10</code> ↔ <code>jusqu&#39;à i &gt; 10</code>.</p>\n</aside><aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>Sur la diapo de l&#39;algorithme 10 (somme des nombres pairs), le titre de l&#39;algorithme est resté « somme des dix premiers nombres entiers » : c&#39;est un copier-coller, il calcule bien la somme des <strong>pairs</strong> de 0 à N.</p>\n</aside><h2>Idée 3 · Faire la trace d&#39;une boucle</h2>\n<p>Faire la trace, c&#39;est noter la valeur de chaque variable à chaque tour. C&#39;est <strong>la</strong> compétence demandée à l&#39;examen.</p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Trace de « somme des pairs » avec N = 6</figcaption><div class=\"etape\"><div class=\"et-t\">1/6 · Initialisation</div><p>S ← 0. La boucle va de i = 0 à 6 avec un pas de 2.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/6 · Tour 1</div><p>i = 0 → S ← 0 + 0 = 0</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/6 · Tour 2</div><p>i = 2 → S ← 0 + 2 = 2</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">4/6 · Tour 3</div><p>i = 4 → S ← 2 + 4 = 6</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">5/6 · Tour 4</div><p>i = 6 → S ← 6 + 6 = 12</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">6/6 · Fin</div><p>i passerait à 8 &gt; 6 : on sort. On affiche S = 12.</p>\n</div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><p>Même chose en Python pour vérifier (Python arrive à la séance 5 ; <code>range(0, N+1, 2)</code> = de 0 à N avec un pas de 2) :</p>\n<pre class=\"\"><code>N = 6\nS = 0\nfor i in range(0, N + 1, 2):\n    S = S + i\n    print(&quot;i =&quot;, i, &quot;S =&quot;, S)\nprint(&quot;La somme des nombres pairs est :&quot;, S)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>i = 0 S = 0\ni = 2 S = 2\ni = 4 S = 6\ni = 6 S = 12\nLa somme des nombres pairs est : 12</code></pre><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>La <strong>boucle infinie</strong> de la diapo : <code>i ← 1 ; tantque i &lt;= 7 faire Ecrire(&quot;Hello MIP&quot;) fin tantque</code>. <code>i</code> ne change jamais, la condition reste vraie pour toujours. Il manque <code>i ← i + 1</code>.</p>\n</aside><h2>Idée 4 · L&#39;indentation et les commentaires</h2>\n<p>Le prof insiste : le contenu de chaque <code>si</code>, <code>pour</code>, <code>tantque</code> est <strong>décalé vers la droite</strong>. On voit d&#39;un coup d&#39;œil où commence et où finit chaque bloc. En Python, ce décalage devient <strong>obligatoire</strong>.</p>\n<aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend</div><p>« Toutes vos instructions doivent être commentées » : un code commenté est plus facile à modifier plus tard.</p>\n</aside><h2>S&#39;exercer</h2>\n<section class=\"exo\"><h3>Exercices du TD 2</h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>(TD 2, ex. 1) Somme des entiers de 0 jusqu&#39;à N (N saisi) avec les trois boucles.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Pour : S ← 0 ; pour i ← 0 jusqu&#39;à N faire S ← S + i fin pour\nTantQue : S ← 0 ; i ← 0 ; tantque i &lt;= N faire S ← S + i ; i ← i + 1 fin tantque\nRépéter : S ← 0 ; i ← 0 ; répéter S ← S + i ; i ← i + 1 jusqu&#39;à i &gt; N\nPour N = 4, les trois donnent 10.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>(TD 2, ex. 2) Calculer X puissance n (n ≥ 0).</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Multiplie n fois par X en partant de 1.</p>\n</div><div class=\"ex-c\" hidden><p>P ← 1\npour i ← 1 jusqu&#39;à n faire\n  P ← P * X\nfin pour\nEcrire(P)\nPour n = 0 la boucle ne tourne pas et P = 1, ce qui est juste (X⁰ = 1).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>(TD 2, ex. 3) Factorielle N! en redemandant N tant qu&#39;il est négatif.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Une boucle Répéter pour la saisie, une boucle Pour pour le calcul.</p>\n</div><div class=\"ex-c\" hidden><p>répéter\n  Ecrire(&quot;N = &quot;) ; Lire(N)\njusqu&#39;à N &gt;= 0\nF ← 1\npour i ← 1 jusqu&#39;à N faire F ← F * i fin pour\nEcrire(N, &quot;! = &quot;, F)\n0! = 1 car la boucle ne tourne pas. 5! = 120.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>(TD 2, ex. 5) Somme S = 1 + 1/2 + … + 1/N. Que vaut S pour N = 4 (arrondi à 2 décimales) ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 2.08</b></p><p>S ← 0 ; pour i ← 1 jusqu&#39;à N faire S ← S + 1/i fin pour. Pour N = 4 : 1 + 0.5 + 0.333 + 0.25 ≈ <strong>2.08</strong>.</p>\n</div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quelle boucle s&#39;exécute toujours au moins une fois ?</div><button class=\"opt\" data-o=\"0\">Pour</button><button class=\"opt\" data-o=\"1\">TantQue</button><button class=\"opt\" data-o=\"2\">Répéter … jusqu&#39;à</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\"><code>i ← 1 ; tantque i &lt;= 5 faire Ecrire(i) ; i ← i + 1 fin tantque</code>. Combien de valeurs sont affichées ?</div><button class=\"opt\" data-o=\"0\">4</button><button class=\"opt\" data-o=\"1\">5</button><button class=\"opt\" data-o=\"2\">6</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Que vaut i à la sortie de la boucle précédente ?</div><button class=\"opt\" data-o=\"0\">5</button><button class=\"opt\" data-o=\"1\">6</button><button class=\"opt\" data-o=\"2\">1</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Une boucle TantQue équivalente à <code>répéter … jusqu&#39;à i &gt; N</code> s&#39;écrit :</div><button class=\"opt\" data-o=\"0\">tantque i &lt;= N</button><button class=\"opt\" data-o=\"1\">tantque i &gt; N</button><button class=\"opt\" data-o=\"2\">tantque i &gt;= N</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\"><code>pour i ← 10 jusqu&#39;à 1 Pas -3</code> donne les valeurs :</div><button class=\"opt\" data-o=\"0\">10, 7, 4, 1, -2</button><button class=\"opt\" data-o=\"1\">10, 7, 4, 1</button><button class=\"opt\" data-o=\"2\">10, 9, 8 … 1</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Avec note ← 7, l&#39;algorithme (≥ 10 : Validé ; ≥ 5 : Rattrapage ; sinon Non Validé) affiche :</div><button class=\"opt\" data-o=\"0\">Validé</button><button class=\"opt\" data-o=\"1\">Rattrapage</button><button class=\"opt\" data-o=\"2\">Non Validé</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Avec A ← 4 et B ← 4, l&#39;algorithme du maximum du prof affiche :</div><button class=\"opt\" data-o=\"0\">Le maximum est 4</button><button class=\"opt\" data-o=\"1\">égalité</button><button class=\"opt\" data-o=\"2\">rien</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Pourquoi <code>i ← 1 ; tantque i &lt;= 7 faire Ecrire(&quot;Hello MIP&quot;) fin tantque</code> ne s&#39;arrête-t-il pas ?</div><button class=\"opt\" data-o=\"0\">La condition est fausse dès le départ</button><button class=\"opt\" data-o=\"1\">i n&#39;est jamais modifié dans la boucle</button><button class=\"opt\" data-o=\"2\">Ecrire bloque la boucle</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Quelle structure remplace une longue cascade de « sinon si » sur les valeurs d&#39;une variable ?</div><button class=\"opt\" data-o=\"0\">Répéter</button><button class=\"opt\" data-o=\"1\">La structure à choix multiples (Selon)</button><button class=\"opt\" data-o=\"2\">La boucle Pour</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\"><code>S ← 0 ; pour i ← 1 jusqu&#39;à 4 faire S ← S + i fin pour</code>. S vaut :</div><button class=\"opt\" data-o=\"0\">4</button><button class=\"opt\" data-o=\"1\">10</button><button class=\"opt\" data-o=\"2\">15</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"structures-controle","rep":["faux"],"tol":null},{"n":"structures-controle","rep":null,"tol":null},{"n":"structures-controle","rep":null,"tol":null},{"n":"structures-controle","rep":null,"tol":null},{"n":"structures-controle","rep":["2.08"],"tol":0.01}],"qcm":[{"n":"structures-controle","q":"Quelle boucle s&#39;exécute toujours au moins une fois ?","o":["Pour","TantQue","Répéter … jusqu&#39;à"],"a":2,"e":"La condition de Répéter est testée à la fin du tour."},{"n":"structures-controle","q":"<code>i ← 1 ; tantque i &lt;= 5 faire Ecrire(i) ; i ← i + 1 fin tantque</code>. Combien de valeurs sont affichées ?","o":["4","5","6"],"a":1,"e":"i vaut 1, 2, 3, 4, 5 ; à 6 la condition est fausse."},{"n":"structures-controle","q":"Que vaut i à la sortie de la boucle précédente ?","o":["5","6","1"],"a":1,"e":"C&#39;est la valeur 6 qui rend <code>i &lt;= 5</code> faux."},{"n":"structures-controle","q":"Une boucle TantQue équivalente à <code>répéter … jusqu&#39;à i &gt; N</code> s&#39;écrit :","o":["tantque i &lt;= N","tantque i &gt; N","tantque i &gt;= N"],"a":0,"e":"On continue tant que la condition d&#39;arrêt est fausse : NON(i &gt; N) = i &lt;= N."},{"n":"structures-controle","q":"<code>pour i ← 10 jusqu&#39;à 1 Pas -3</code> donne les valeurs :","o":["10, 7, 4, 1, -2","10, 7, 4, 1","10, 9, 8 … 1"],"a":1,"e":"On descend de 3 en 3 tant qu&#39;on ne dépasse pas 1."},{"n":"structures-controle","q":"Avec note ← 7, l&#39;algorithme (≥ 10 : Validé ; ≥ 5 : Rattrapage ; sinon Non Validé) affiche :","o":["Validé","Rattrapage","Non Validé"],"a":1,"e":"7 n&#39;est pas ≥ 10 mais est ≥ 5."},{"n":"structures-controle","q":"Avec A ← 4 et B ← 4, l&#39;algorithme du maximum du prof affiche :","o":["Le maximum est 4","égalité","rien"],"a":1,"e":"Ni A &gt; B ni A &lt; B : on tombe dans le sinon."},{"n":"structures-controle","q":"Pourquoi <code>i ← 1 ; tantque i &lt;= 7 faire Ecrire(&quot;Hello MIP&quot;) fin tantque</code> ne s&#39;arrête-t-il pas ?","o":["La condition est fausse dès le départ","i n&#39;est jamais modifié dans la boucle","Ecrire bloque la boucle"],"a":1,"e":"Sans <code>i ← i + 1</code>, la condition reste vraie pour toujours."},{"n":"structures-controle","q":"Quelle structure remplace une longue cascade de « sinon si » sur les valeurs d&#39;une variable ?","o":["Répéter","La structure à choix multiples (Selon)","La boucle Pour"],"a":1,"e":"Selon compare une variable à une liste de valeurs."},{"n":"structures-controle","q":"<code>S ← 0 ; pour i ← 1 jusqu&#39;à 4 faire S ← S + i fin pour</code>. S vaut :","o":["4","10","15"],"a":1,"e":"1 + 2 + 3 + 4 = 10."}]},{"id":"tableaux","t":"Les tableaux (pseudo-code)","seance":"Séance 3 · 14 octobre 2024","imp":5,"html":"<h2>Avant de commencer</h2>\n<p>Il faut maîtriser la boucle <code>pour i ← 0 jusqu&#39;à N − 1 faire</code> (chapitre 2).</p>\n<section class=\"exo\"><h3>Vérifie ton prérequis</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Combien de tours fait <code>pour i ← 0 jusqu&#39;à 4 faire</code> ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 5</b></p><p>i vaut 0, 1, 2, 3, 4 : <strong>5</strong> tours.</p>\n</div></div></section><h2>Comment aborder ce chapitre</h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p>Un tableau, c&#39;est une rangée de cases numérotées. Presque tous les exercices se résolvent avec <strong>une boucle Pour qui visite chaque case</strong>.</p>\n</aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>Les indices commencent à <strong>0</strong>. Un tableau de taille 5 a les cases 0 à <strong>4</strong>. Écrire <code>T[5]</code> sort du tableau.</p>\n</aside><p>À la fin, tu sais déclarer, remplir, afficher un tableau et y calculer somme, moyenne, minimum et nombre d&#39;occurrences.</p>\n<h2>Idée 1 · Un tableau = plusieurs valeurs du même type sous un seul nom</h2>\n<p>Stocker 100 notes avec 100 variables N1…N100 serait absurde. On déclare plutôt <code>Tableau Note[100] : Réel</code>.</p>\n<figure class=\"grille\"><figcaption>Tableau Note[5] ← {15, 12.5, 8, 7, 20}</figcaption><table><tr><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th></tr><tr><td>15</td><td>12.5</td><td class=\"h1\">8</td><td>7</td><td>20</td></tr></table></figure><ul>\n<li>Déclaration : <code>Tableau Nom[taille] : type</code>.</li>\n<li>Accès : <code>Note[2]</code> est la <strong>troisième</strong> case (ici 8). <code>Note[2] ← 16</code> la remplace.</li>\n<li>Toutes les cases ont le même type.</li>\n</ul>\n<h2>Idée 2 · Le schéma universel : parcourir avec Pour</h2>\n<pre class=\"\"><code>Constante taille : 5\nTableau Note[taille] : Réel\nVariable i : Entier\nDébut\n    pour i ← 0 jusqu'à taille − 1 faire\n        Ecrire(&quot;Entrer l'élément &quot;, i+1, &quot; : &quot;)\n        Lire(Note[i])\n    fin pour\n    pour i ← 0 jusqu'à taille − 1 faire\n        Ecrire(Note[i])\n    fin pour\nFin</code></pre><figure class=\"etapes\" data-i=\"0\"><figcaption>Les 3 calculs types du prof</figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Somme</div><p>som ← 0, puis pour chaque i : som ← som + tab[i].</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Moyenne</div><p>La somme divisée par la taille : moyenne ← moyenne / nbProduits.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Minimum</div><p>min ← tab[0], puis pour i de 1 à taille − 1 : si tab[i] &lt; min alors min ← tab[i].</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Occurrences de X</div><p>nbOcc ← 0, puis si tab[i] = X alors nbOcc ← nbOcc + 1.</p>\n</div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><p>Vérification en Python avec les prix d&#39;un exemple :</p>\n<pre class=\"\"><code>prix = [12.0, 8.5, 20.0, 4.5, 5.0]\nsom = 0\nmini = prix[0]\nfor i in range(len(prix)):\n    som = som + prix[i]\n    if prix[i] &lt; mini:\n        mini = prix[i]\nprint(&quot;somme :&quot;, som, &quot;moyenne :&quot;, som / len(prix), &quot;min :&quot;, mini)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>somme : 50.0 moyenne : 10.0 min : 4.5</code></pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p>Pour le minimum, on initialise avec <strong>tab[0]</strong>, jamais avec 0 : si toutes les valeurs sont positives, 0 serait faux.</p>\n</aside><h2>S&#39;exercer</h2>\n<section class=\"exo\"><h3>Exercices du TD 3</h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>(TD 3, ex. 1) Compter les positions où A[i] = B[i] (deux tableaux de taille N). Pour A = {1, 4, 7, 2} et B = {1, 5, 7, 2} ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 3</b></p><p>nb ← 0 ; pour i ← 0 jusqu&#39;à N − 1 faire si A[i] = B[i] alors nb ← nb + 1 finsi fin pour. Positions 0, 2, 3 : <strong>3</strong>.</p>\n</div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>(TD 3, ex. 3) Produit scalaire de A = {1, 2, 3} et B = {4, 5, 6}.</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 32</b></p><p>ps ← 0 ; pour i : ps ← ps + A[i] * B[i]. 4 + 10 + 18 = <strong>32</strong>.</p>\n</div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>(TD 3, ex. 4) Inverser l&#39;ordre d&#39;un tableau.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Échange la case i avec la case N − 1 − i, mais seulement jusqu&#39;au milieu.</p>\n</div><div class=\"ex-c\" hidden><p>pour i ← 0 jusqu&#39;à N div 2 − 1 faire\n  temp ← T[i] ; T[i] ← T[N−1−i] ; T[N−1−i] ← temp\nfin pour\nSi on va jusqu&#39;à N − 1, on ré-échange tout et le tableau revient à l&#39;état initial.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 6 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Tableau Note[5] ← {15, 12.5, 8, 7, 20}. Que vaut Note[1] ?</div><button class=\"opt\" data-o=\"0\">15</button><button class=\"opt\" data-o=\"1\">12.5</button><button class=\"opt\" data-o=\"2\">8</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Quel est le dernier indice valide de Tableau T[7] ?</div><button class=\"opt\" data-o=\"0\">7</button><button class=\"opt\" data-o=\"1\">6</button><button class=\"opt\" data-o=\"2\">8</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Pour parcourir T[taille], la boucle correcte est :</div><button class=\"opt\" data-o=\"0\">pour i ← 0 jusqu&#39;à taille − 1</button><button class=\"opt\" data-o=\"1\">pour i ← 1 jusqu&#39;à taille</button><button class=\"opt\" data-o=\"2\">pour i ← 0 jusqu&#39;à taille</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Les éléments d&#39;un tableau en algorithmique sont :</div><button class=\"opt\" data-o=\"0\">tous du même type</button><button class=\"opt\" data-o=\"1\">de types quelconques</button><button class=\"opt\" data-o=\"2\">obligatoirement des entiers</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Pour calculer une somme, on initialise <code>som</code> à :</div><button class=\"opt\" data-o=\"0\">0</button><button class=\"opt\" data-o=\"1\">1</button><button class=\"opt\" data-o=\"2\">tab[0] puis on recommence à 0</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Après <code>Note[2] ← 16</code> sur {15, 12.5, 8, 7, 20}, le tableau devient :</div><button class=\"opt\" data-o=\"0\">{15, 16, 8, 7, 20}</button><button class=\"opt\" data-o=\"1\">{15, 12.5, 16, 7, 20}</button><button class=\"opt\" data-o=\"2\">{16, 12.5, 8, 7, 20}</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Pour chercher le minimum, pourquoi ne pas initialiser min ← 0 ?</div><button class=\"opt\" data-o=\"0\">Si toutes les valeurs sont positives, le résultat serait 0, qui n&#39;est pas dans le tableau</button><button class=\"opt\" data-o=\"1\">Parce que 0 est interdit dans un tableau</button><button class=\"opt\" data-o=\"2\">Ça ne change rien</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Le nombre d&#39;occurrences de 7 dans {7, 2, 7, 7, 1} est :</div><button class=\"opt\" data-o=\"0\">1</button><button class=\"opt\" data-o=\"1\">2</button><button class=\"opt\" data-o=\"2\">3</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">La taille d&#39;un tableau correspond à :</div><button class=\"opt\" data-o=\"0\">son nombre de cases</button><button class=\"opt\" data-o=\"1\">son dernier indice</button><button class=\"opt\" data-o=\"2\">la plus grande valeur stockée</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Le produit scalaire de {1, 0, 2} et {3, 5, 4} vaut :</div><button class=\"opt\" data-o=\"0\">8</button><button class=\"opt\" data-o=\"1\">11</button><button class=\"opt\" data-o=\"2\">15</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"tableaux","rep":["5"],"tol":null},{"n":"tableaux","rep":["3"],"tol":null},{"n":"tableaux","rep":["32"],"tol":null},{"n":"tableaux","rep":null,"tol":null}],"qcm":[{"n":"tableaux","q":"Tableau Note[5] ← {15, 12.5, 8, 7, 20}. Que vaut Note[1] ?","o":["15","12.5","8"],"a":1,"e":"Les indices commencent à 0 : Note[1] est la deuxième case."},{"n":"tableaux","q":"Quel est le dernier indice valide de Tableau T[7] ?","o":["7","6","8"],"a":1,"e":"Taille 7 : indices 0 à 6."},{"n":"tableaux","q":"Pour parcourir T[taille], la boucle correcte est :","o":["pour i ← 0 jusqu&#39;à taille − 1","pour i ← 1 jusqu&#39;à taille","pour i ← 0 jusqu&#39;à taille"],"a":0,"e":"On s&#39;arrête à taille − 1, dernière case."},{"n":"tableaux","q":"Les éléments d&#39;un tableau en algorithmique sont :","o":["tous du même type","de types quelconques","obligatoirement des entiers"],"a":0,"e":"On parle de tableau d&#39;entiers, de réels, de chaînes…"},{"n":"tableaux","q":"Pour calculer une somme, on initialise <code>som</code> à :","o":["0","1","tab[0] puis on recommence à 0"],"a":0,"e":"0 est neutre pour l&#39;addition (1 pour un produit)."},{"n":"tableaux","q":"Après <code>Note[2] ← 16</code> sur {15, 12.5, 8, 7, 20}, le tableau devient :","o":["{15, 16, 8, 7, 20}","{15, 12.5, 16, 7, 20}","{16, 12.5, 8, 7, 20}"],"a":1,"e":"Note[2] est la troisième case."},{"n":"tableaux","q":"Pour chercher le minimum, pourquoi ne pas initialiser min ← 0 ?","o":["Si toutes les valeurs sont positives, le résultat serait 0, qui n&#39;est pas dans le tableau","Parce que 0 est interdit dans un tableau","Ça ne change rien"],"a":0,"e":"On part d&#39;une vraie valeur du tableau : tab[0]."},{"n":"tableaux","q":"Le nombre d&#39;occurrences de 7 dans {7, 2, 7, 7, 1} est :","o":["1","2","3"],"a":2,"e":"Trois cases valent 7."},{"n":"tableaux","q":"La taille d&#39;un tableau correspond à :","o":["son nombre de cases","son dernier indice","la plus grande valeur stockée"],"a":0,"e":"Taille N : N cases, indices 0 à N − 1."},{"n":"tableaux","q":"Le produit scalaire de {1, 0, 2} et {3, 5, 4} vaut :","o":["8","11","15"],"a":1,"e":"3 + 0 + 8 = 11."}]},{"id":"tri-recherche","t":"Tri et recherche dans les tableaux","seance":"Séance 4 · 17 octobre 2024","imp":5,"html":"<h2>Avant de commencer</h2>\n<p>Il faut savoir parcourir un tableau et <strong>permuter</strong> deux variables avec une variable <code>temp</code>.</p>\n<section class=\"exo\"><h3>Vérifie ton prérequis</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>a ← 25, b ← 13. On exécute temp ← a ; a ← b ; b ← temp. Que vaut b ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 25</b></p><p>temp garde 25, a reçoit 13, puis b reçoit temp = <strong>25</strong>.</p>\n</div></div></section><h2>Comment aborder ce chapitre</h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p>Ne mémorise pas le code : mémorise <strong>l&#39;idée</strong> de chaque tri en une phrase, puis déroule-la à la main sur 5 nombres. Le code se reconstruit tout seul.</p>\n</aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>La recherche dichotomique ne marche <strong>que sur un tableau trié</strong>. Sur un tableau en désordre, elle peut répondre « introuvable » alors que la valeur est là.</p>\n</aside><p>À la fin, tu sais dérouler et écrire le tri par sélection, le tri à bulles (2 versions), le tri par insertion, la recherche séquentielle et la recherche dichotomique.</p>\n<h2>Idée 1 · Permuter deux variables</h2>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>Sur la diapo « Permutation », la troisième ligne est <code>b ← a</code>. C&#39;est une <strong>erreur</strong> : a vaut déjà 13 à ce moment, donc b reste 13 et l&#39;ancienne valeur 25 est perdue. Il faut écrire <strong><code>b ← temp</code></strong>.</p>\n</aside><pre class=\"\"><code>a, b = 25, 13\ntemp = a\na = b\nb = temp\nprint(&quot;Après la permutation a =&quot;, a, &quot;et b =&quot;, b)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>Après la permutation a = 13 et b = 25</code></pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>Dans plusieurs algorithmes de la séance, le tableau est déclaré <code>tab</code> mais rempli par <code>Note ← [...]</code>. Il faut lire <code>tab ← [...]</code>.</p>\n</aside><h2>Idée 2 · Tri par sélection : chercher le plus petit et le mettre devant</h2>\n<p>À chaque passe i, on cherche l&#39;indice <code>min</code> du plus petit élément entre i et la fin, puis on l&#39;échange avec la case i. N éléments → N − 1 passes.</p>\n<figure class=\"grille\"><figcaption>Tri par sélection de [23, 78, 45, 8, 32, 46] (orange = case fixée)</figcaption><table><tr><th>départ</th><td>23</td><td>78</td><td>45</td><td>8</td><td>32</td><td>46</td></tr><tr><th>passe 0</th><td class=\"h1\">8</td><td>78</td><td>45</td><td>23</td><td>32</td><td>46</td></tr><tr><th>passe 1</th><td class=\"h1\">8</td><td class=\"h1\">23</td><td>45</td><td>78</td><td>32</td><td>46</td></tr><tr><th>passe 2</th><td class=\"h1\">8</td><td class=\"h1\">23</td><td class=\"h1\">32</td><td>78</td><td>45</td><td>46</td></tr><tr><th>passe 3</th><td class=\"h1\">8</td><td class=\"h1\">23</td><td class=\"h1\">32</td><td class=\"h1\">45</td><td>78</td><td>46</td></tr><tr><th>passe 4</th><td class=\"h1\">8</td><td class=\"h1\">23</td><td class=\"h1\">32</td><td class=\"h1\">45</td><td class=\"h1\">46</td><td class=\"h1\">78</td></tr></table></figure><pre class=\"\"><code>tab = [23, 78, 45, 8, 32, 46]\nn = len(tab)\nfor i in range(n - 1):\n    mini = i\n    for j in range(i + 1, n):\n        if tab[j] &lt; tab[mini]:\n            mini = j\n    if mini != i:\n        tab[i], tab[mini] = tab[mini], tab[i]\nprint(tab)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>[8, 23, 32, 45, 46, 78]</code></pre><h2>Idée 3 · Tri à bulles : les grands remontent à la fin</h2>\n<p>On compare chaque élément à son <strong>voisin</strong> et on échange s&#39;ils sont mal rangés. À la fin de chaque passe, le plus grand est au bout.</p>\n<p>La <strong>version 2</strong> du prof ajoute un booléen <code>inversion</code> : si une passe entière se fait sans échange, le tableau est trié et on s&#39;arrête.</p>\n<pre class=\"\"><code>tab = [12, 45, 8, 5, 16]\nL = len(tab)\ninversion = True\npasse = 0\nwhile inversion:\n    inversion = False\n    for i in range(L - 1):\n        if tab[i + 1] &lt; tab[i]:\n            inversion = True\n            tab[i], tab[i + 1] = tab[i + 1], tab[i]\n    L = L - 1\n    passe += 1\n    print(&quot;passe&quot;, passe, &quot;:&quot;, tab)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>passe 1 : [12, 8, 5, 16, 45]\npasse 2 : [8, 5, 12, 16, 45]\npasse 3 : [5, 8, 12, 16, 45]\npasse 4 : [5, 8, 12, 16, 45]</code></pre><p>La passe 4 ne fait aucun échange : <code>inversion</code> reste faux, on sort.</p>\n<h2>Idée 4 · Tri par insertion : comme des cartes en main</h2>\n<p>On prend chaque élément (<code>courant</code>) et on décale vers la droite les éléments triés plus grands que lui, puis on l&#39;insère dans le trou.</p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Insertion sur [5, 2, 9, 1, 6] (exemple du prof)</figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Départ</div><p>[5] est considéré trié.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · On prend 2</div><p>2 &lt; 5, on décale 5 : [2, 5, 9, 1, 6]</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · On prend 9</div><p>9 &gt; 5, rien ne bouge : [2, 5, 9, 1, 6]</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · On prend 1</div><p>on décale 9, 5, 2 : [1, 2, 5, 9, 6]</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · On prend 6</div><p>on décale 9 : [1, 2, 5, 6, 9]</p>\n</div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><pre class=\"\"><code>tab = [23, 1, 10, 5, 2]\nfor i in range(1, len(tab)):\n    courant = tab[i]\n    j = i\n    while j &gt; 0 and tab[j - 1] &gt; courant:\n        tab[j] = tab[j - 1]\n        j = j - 1\n    tab[j] = courant\nprint(tab)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>[1, 2, 5, 10, 23]</code></pre><h2>Idée 5 · Recherche séquentielle et dichotomique</h2>\n<p><strong>Séquentielle</strong> : on compare la valeur cherchée à chaque case, de 0 à la fin. <code>pos ← -1</code> signifie « pas trouvé ».</p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>La version du diapo ne s&#39;arrête pas quand elle trouve : avec des doublons, <code>pos</code> contient la <strong>dernière</strong> position. Pour la première, on sort dès qu&#39;on trouve (boucle TantQue ou <code>break</code>).</p>\n</aside><p><strong>Dichotomique</strong> (tableau trié) : on regarde le milieu ; si la valeur est plus petite on garde la moitié gauche, sinon la droite. Chaque tour divise la zone par 2.</p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Chercher 20 dans [-2, 0, 4, 9, 11, 15, 20, 25, 30, 45]</figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Tour 1</div><p>id_min = 0, id_max = 9, milieu = 4 → tab[4] = 11 &lt; 20 → id_min = 5</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Tour 2</div><p>id_min = 5, id_max = 9, milieu = 7 → tab[7] = 25 &gt; 20 → id_max = 6</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Tour 3</div><p>id_min = 5, id_max = 6, milieu = 5 → tab[5] = 15 &lt; 20 → id_min = 6</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Tour 4</div><p>milieu = 6 → tab[6] = 20 : trouvé à la position 6, en 4 comparaisons au lieu de 7.</p>\n</div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><pre class=\"\"><code>tab = [-2, 0, 4, 9, 11, 15, 20, 25, 30, 45]\nrech = 20\nid_min, id_max = 0, len(tab) - 1\npos = -1\nwhile id_min &lt;= id_max and pos == -1:\n    id_moy = (id_min + id_max) // 2\n    if tab[id_moy] == rech:\n        pos = id_moy\n    elif rech &lt; tab[id_moy]:\n        id_max = id_moy - 1\n    else:\n        id_min = id_moy + 1\nprint(&quot;La valeur&quot;, rech, &quot;est trouvée à la position&quot;, pos)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>La valeur 20 est trouvée à la position 6</code></pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>Sur la diapo, la ligne <code>arret = vrai</code> utilise <code>=</code> au lieu de <code>←</code>, et <code>arret=false</code> mélange français et anglais : lire <code>arret ← vrai</code> et <code>arret = faux</code>. Et <code>(id_min + id_max)/2</code> doit être une division <strong>entière</strong>.</p>\n</aside><h2>S&#39;exercer</h2>\n<section class=\"exo\"><h3>Exercices du TD 3</h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>(TD 3, ex. 5) Comment modifier le tri par sélection pour trier en ordre <strong>décroissant</strong> ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>On cherche le <strong>maximum</strong> au lieu du minimum : si tab[j] &gt; tab[max] alors max ← j. Pour les bulles et l&#39;insertion, on inverse aussi la comparaison (&gt; devient &lt;).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>(TD 3, ex. 6) Combien de comparaisons au maximum pour une recherche dichotomique dans 1000 éléments triés ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button></div><div class=\"ex-h\" hidden><p>Combien de fois peut-on diviser 1000 par 2 avant d&#39;arriver à 1 ?</p>\n</div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 10</b></p><p>2¹⁰ = 1024 ≥ 1000 : environ <strong>10</strong> comparaisons, contre 1000 en séquentiel.</p>\n</div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Déroule le tri à bulles (version 1) sur [4, 3, 1] : donne le tableau après la première passe.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Compare 4 et 3 → [3, 4, 1] ; compare 4 et 1 → [3, 1, 4]. Après la passe 1 : [3, 1, 4], le 4 est à sa place.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Après la passe 0 du tri par sélection sur [23, 78, 45, 8, 32, 46], le tableau est :</div><button class=\"opt\" data-o=\"0\">[8, 78, 45, 23, 32, 46]</button><button class=\"opt\" data-o=\"1\">[8, 23, 32, 45, 46, 78]</button><button class=\"opt\" data-o=\"2\">[23, 45, 8, 32, 46, 78]</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Après une passe de tri à bulles, où est le plus grand élément ?</div><button class=\"opt\" data-o=\"0\">Au début</button><button class=\"opt\" data-o=\"1\">À la fin</button><button class=\"opt\" data-o=\"2\">Au milieu</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Quelle recherche exige un tableau trié ?</div><button class=\"opt\" data-o=\"0\">Séquentielle</button><button class=\"opt\" data-o=\"1\">Dichotomique</button><button class=\"opt\" data-o=\"2\">Les deux</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Dans la permutation correcte, la dernière instruction est :</div><button class=\"opt\" data-o=\"0\">b ← a</button><button class=\"opt\" data-o=\"1\">b ← temp</button><button class=\"opt\" data-o=\"2\">temp ← b</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Le tri par insertion ressemble à :</div><button class=\"opt\" data-o=\"0\">trier des cartes dans sa main</button><button class=\"opt\" data-o=\"1\">chercher un mot dans le dictionnaire</button><button class=\"opt\" data-o=\"2\">faire remonter des bulles</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Recherche dichotomique dans [1, 3, 5, 7, 9] de la valeur 7 : premier indice du milieu ?</div><button class=\"opt\" data-o=\"0\">1</button><button class=\"opt\" data-o=\"1\">2</button><button class=\"opt\" data-o=\"2\">3</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">À quoi sert le booléen <code>inversion</code> ?</div><button class=\"opt\" data-o=\"0\">À arrêter le tri dès qu&#39;une passe ne fait aucun échange</button><button class=\"opt\" data-o=\"1\">À trier en ordre décroissant</button><button class=\"opt\" data-o=\"2\">À compter les échanges</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">La recherche séquentielle du diapo, sur [7, 2, 7], cherchant 7, renvoie pos =</div><button class=\"opt\" data-o=\"0\">0</button><button class=\"opt\" data-o=\"1\">2</button><button class=\"opt\" data-o=\"2\">-1</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Combien de passes fait le tri par sélection sur 6 éléments ?</div><button class=\"opt\" data-o=\"0\">6</button><button class=\"opt\" data-o=\"1\">5</button><button class=\"opt\" data-o=\"2\">3</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Pour trier en ordre décroissant par sélection, on cherche à chaque passe :</div><button class=\"opt\" data-o=\"0\">le minimum</button><button class=\"opt\" data-o=\"1\">le maximum</button><button class=\"opt\" data-o=\"2\">le milieu</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"tri-recherche","rep":["25"],"tol":null},{"n":"tri-recherche","rep":null,"tol":null},{"n":"tri-recherche","rep":["10"],"tol":null},{"n":"tri-recherche","rep":null,"tol":null}],"qcm":[{"n":"tri-recherche","q":"Après la passe 0 du tri par sélection sur [23, 78, 45, 8, 32, 46], le tableau est :","o":["[8, 78, 45, 23, 32, 46]","[8, 23, 32, 45, 46, 78]","[23, 45, 8, 32, 46, 78]"],"a":0,"e":"Le minimum 8 est échangé avec la case 0."},{"n":"tri-recherche","q":"Après une passe de tri à bulles, où est le plus grand élément ?","o":["Au début","À la fin","Au milieu"],"a":1,"e":"Il « remonte » de voisin en voisin jusqu&#39;au bout."},{"n":"tri-recherche","q":"Quelle recherche exige un tableau trié ?","o":["Séquentielle","Dichotomique","Les deux"],"a":1,"e":"La dichotomie élimine une moitié en comparant au milieu : ça n&#39;a de sens que si c&#39;est trié."},{"n":"tri-recherche","q":"Dans la permutation correcte, la dernière instruction est :","o":["b ← a","b ← temp","temp ← b"],"a":1,"e":"temp a sauvegardé l&#39;ancienne valeur de a."},{"n":"tri-recherche","q":"Le tri par insertion ressemble à :","o":["trier des cartes dans sa main","chercher un mot dans le dictionnaire","faire remonter des bulles"],"a":0,"e":"On insère chaque carte à sa place parmi celles déjà triées."},{"n":"tri-recherche","q":"Recherche dichotomique dans [1, 3, 5, 7, 9] de la valeur 7 : premier indice du milieu ?","o":["1","2","3"],"a":1,"e":"(0 + 4) // 2 = 2, tab[2] = 5 &lt; 7, on part à droite."},{"n":"tri-recherche","q":"À quoi sert le booléen <code>inversion</code> ?","o":["À arrêter le tri dès qu&#39;une passe ne fait aucun échange","À trier en ordre décroissant","À compter les échanges"],"a":0,"e":"Pas d&#39;échange = tableau trié."},{"n":"tri-recherche","q":"La recherche séquentielle du diapo, sur [7, 2, 7], cherchant 7, renvoie pos =","o":["0","2","-1"],"a":1,"e":"La boucle ne s&#39;arrête pas : la dernière position trouvée écrase la première."},{"n":"tri-recherche","q":"Combien de passes fait le tri par sélection sur 6 éléments ?","o":["6","5","3"],"a":1,"e":"N − 1 passes : le dernier élément est automatiquement à sa place."},{"n":"tri-recherche","q":"Pour trier en ordre décroissant par sélection, on cherche à chaque passe :","o":["le minimum","le maximum","le milieu"],"a":1,"e":"On place le plus grand en tête."}]},{"id":"intro-python","t":"Introduction à Python · variables, types, conversions","seance":"Séance 5 · octobre 2024","imp":4,"html":"<h2>Avant de commencer</h2>\n<p>Tu connais les variables et les types en pseudo-code (chapitre 1). Python fait la même chose, avec moins de cérémonie.</p>\n<section class=\"exo\"><h3>Vérifie ton prérequis</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>En pseudo-code, quel type a la valeur 3.14 ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : réel</b></p><p>C&#39;est un nombre avec partie décimale : un <strong>réel</strong> (float en Python).</p>\n</div></div></section><h2>Comment aborder ce chapitre</h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p>Installe Python + VS Code (ou ouvre Google Colab) <strong>maintenant</strong> et tape chaque exemple. Python s&#39;apprend avec les doigts.</p>\n</aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p><code>print(&quot;MIP&quot; + 2023)</code> plante : on ne colle pas une chaîne et un nombre avec <code>+</code>. Utilise une virgule : <code>print(&quot;MIP&quot;, 2023)</code>.</p>\n</aside><p>À la fin, tu sais écrire et exécuter un fichier <code>.py</code>, créer des variables, connaître leur type avec <code>type()</code> et les convertir.</p>\n<h2>Idée 1 · Python est un langage interprété</h2>\n<figure class=\"flux\"><figcaption>Compilé ou interprété</figcaption><div class=\"flux-l\"><div class=\"flux-b\">Langage compilé (C, C++) : source</div><div class=\"flux-f\">→</div><div class=\"flux-b\">compilateur</div><div class=\"flux-f\">→</div><div class=\"flux-b\">exécutable binaire</div><div class=\"flux-f\">→</div><div class=\"flux-b\">exécution rapide</div></div></figure><figure class=\"flux\"><div class=\"flux-l\"><div class=\"flux-b\">Langage interprété (Python) : source .py</div><div class=\"flux-f\">→</div><div class=\"flux-b\">interpréteur lit et exécute ligne par ligne</div><div class=\"flux-f\">→</div><div class=\"flux-b\">résultat</div></div></figure><p>Python est de <strong>haut niveau</strong>, interprété, et typé <strong>dynamiquement</strong>. Outils cités par le prof : IDLE, VS Code (extension Python), PyCharm, Spyder, Jupyter, Anaconda. Le premier programme du cours : un fichier <code>mip.py</code> exécuté par <code>python mip.py</code>.</p>\n<h2>Idée 2 · Syntaxe : indentation et commentaires</h2>\n<ul>\n<li>Les blocs sont délimités par l&#39;<strong>indentation</strong> (4 espaces conseillés), pas par des accolades. Une indentation oubliée = erreur.</li>\n<li><code>#</code> commence un commentaire. Un texte entre triples guillemets non affecté sert de commentaire multiligne (docstring).</li>\n</ul>\n<pre class=\"\"><code>a = 10\nif a &gt; 5:\n    print(&quot;a is greater than 5&quot;)  # bloc indenté\n# print(&quot;MIP S1&quot;)  ← ligne désactivée</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>a is greater than 5</code></pre><h2>Idée 3 · Variables : on affecte, Python devine le type</h2>\n<p>Pas de déclaration : la variable naît à sa première affectation (<code>=</code>), et son type peut changer.</p>\n<pre class=\"\"><code>a = 10\nprint(type(a))\na = &quot;Béni Mellal&quot;\nprint(type(a))\nfil1, fil2, fil3 = &quot;MIP&quot;, &quot;PC&quot;, &quot;BCG&quot;\nx = y = &quot;MIP&quot;\nprint(fil1, fil2, fil3, x, y)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>&lt;class 'int'&gt;\n&lt;class 'str'&gt;\nMIP PC BCG MIP MIP</code></pre><p>Règles de nom : lettres, chiffres, <code>_</code> ; ne commence pas par un chiffre ; pas d&#39;espace ni de tiret ; sensible à la casse (<code>age</code>, <code>Age</code>, <code>AGE</code> sont trois variables). Conventions : <code>anneeDeNaissance</code> (camelCase), <code>AnneeDeNaissance</code> (PascalCase), <code>annee_de_naissance</code> (snake_case).</p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>Dans le texte extrait de la diapo, l&#39;exemple « message 1 » a perdu son tiret bas : il faut lire <code>message_1</code> (valide) et <code>1_message</code> (invalide).</p>\n</aside><h2>Idée 4 · Les types de base</h2>\n<figure class=\"grille\"><figcaption>Les types vus en séance 5</figcaption><table><tr><th>type</th><th>exemple</th><th>particularité</th></tr><tr><td>int</td><td>25</td><td>entier sans limite de taille</td></tr><tr><td>float</td><td>98.6</td><td>nombre à virgule</td></tr><tr><td>str</td><td>&quot;MIP&quot;</td><td>texte entre ' ou &quot;</td></tr><tr><td>bool</td><td>True</td><td>True ou False</td></tr><tr><td>list</td><td>[25, &quot;MIP&quot;]</td><td>ordonnée, modifiable</td></tr><tr><td>tuple</td><td>(13, 'BCG')</td><td>ordonnée, non modifiable</td></tr><tr><td>dict</td><td>{&quot;age&quot;: 30}</td><td>paires clé : valeur</td></tr><tr><td>set</td><td>{25, 45}</td><td>pas de doublons, pas d'ordre</td></tr><tr><td>NoneType</td><td>None</td><td>absence de valeur</td></tr><tr><td>complex</td><td>1 + 2j</td><td>partie réelle et imaginaire</td></tr></table></figure><h2>Idée 5 · Conversions de type (casting)</h2>\n<pre class=\"\"><code>print(int(&quot;42&quot;), int(2.8), float(1), str(3.0))\nprint(bool(5), bool(0))\nprint(list(&quot;hello&quot;))\nprint(ord('A'), chr(65))\nprint(set([1, 2, 3, 2, 1]))</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>42 2 1.0 3.0\nTrue False\n['h', 'e', 'l', 'l', 'o']\n65 A\n{1, 2, 3}</code></pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p><code>int(2.8)</code> vaut <strong>2</strong> : <code>int()</code> <strong>tronque</strong>, il n&#39;arrondit pas. <code>int(&quot;3.5&quot;)</code> plante : la chaîne doit représenter un entier.</p>\n</aside><h2>S&#39;exercer</h2>\n<section class=\"exo\"><h3>Petits exercices</h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Que vaut int(7.99) ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 7</b></p><p>int() supprime la partie décimale : <strong>7</strong>.</p>\n</div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Quels noms sont invalides : <code>note_1</code>, <code>1note</code>, <code>ma-note</code>, <code>Note</code> ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p><code>1note</code> (commence par un chiffre) et <code>ma-note</code> (tiret interdit).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Corrige <code>print(&quot;Année : &quot; + 2024)</code>.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p><code>print(&quot;Année :&quot;, 2024)</code> ou <code>print(&quot;Année : &quot; + str(2024))</code>.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quel opérateur affecte une valeur en Python ?</div><button class=\"opt\" data-o=\"0\">←</button><button class=\"opt\" data-o=\"1\">=</button><button class=\"opt\" data-o=\"2\">==</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\"><code>type(3.0)</code> renvoie :</div><button class=\"opt\" data-o=\"0\">&lt;class &#39;int&#39;&gt;</button><button class=\"opt\" data-o=\"1\">&lt;class &#39;float&#39;&gt;</button><button class=\"opt\" data-o=\"2\">&lt;class &#39;str&#39;&gt;</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Quel nom de variable est valide ?</div><button class=\"opt\" data-o=\"0\">2myname</button><button class=\"opt\" data-o=\"1\">my-name</button><button class=\"opt\" data-o=\"2\">my_name</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\"><code>bool(0)</code> vaut :</div><button class=\"opt\" data-o=\"0\">False</button><button class=\"opt\" data-o=\"1\">True</button><button class=\"opt\" data-o=\"2\">0</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\"><code>print(&quot;MIP&quot; + 2023)</code> :</div><button class=\"opt\" data-o=\"0\">affiche MIP2023</button><button class=\"opt\" data-o=\"1\">provoque une erreur TypeError</button><button class=\"opt\" data-o=\"2\">affiche MIP 2023</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Quel type est non modifiable ?</div><button class=\"opt\" data-o=\"0\">list</button><button class=\"opt\" data-o=\"1\">tuple</button><button class=\"opt\" data-o=\"2\">dict</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\"><code>float(&quot;3.14&quot;)</code> renvoie :</div><button class=\"opt\" data-o=\"0\">3.14</button><button class=\"opt\" data-o=\"1\">&quot;3.14&quot;</button><button class=\"opt\" data-o=\"2\">3</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Que donne <code>a, b = 1, 2, 3</code> ?</div><button class=\"opt\" data-o=\"0\">a = 1, b = 2</button><button class=\"opt\" data-o=\"1\">une erreur</button><button class=\"opt\" data-o=\"2\">a = 1, b = (2, 3)</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\"><code>Age</code> et <code>age</code> sont :</div><button class=\"opt\" data-o=\"0\">la même variable</button><button class=\"opt\" data-o=\"1\">deux variables différentes</button><button class=\"opt\" data-o=\"2\">une erreur</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Avec z = 1 + 2j, <code>z.imag</code> vaut :</div><button class=\"opt\" data-o=\"0\">1.0</button><button class=\"opt\" data-o=\"1\">2.0</button><button class=\"opt\" data-o=\"2\">2j</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"intro-python","rep":["réel"],"tol":null},{"n":"intro-python","rep":["7"],"tol":null},{"n":"intro-python","rep":null,"tol":null},{"n":"intro-python","rep":null,"tol":null}],"qcm":[{"n":"intro-python","q":"Quel opérateur affecte une valeur en Python ?","o":["←","=","=="],"a":1,"e":"<code>=</code> affecte, <code>==</code> compare."},{"n":"intro-python","q":"<code>type(3.0)</code> renvoie :","o":["&lt;class &#39;int&#39;&gt;","&lt;class &#39;float&#39;&gt;","&lt;class &#39;str&#39;&gt;"],"a":1,"e":"3.0 a une partie décimale (même nulle)."},{"n":"intro-python","q":"Quel nom de variable est valide ?","o":["2myname","my-name","my_name"],"a":2,"e":"Le tiret bas est autorisé, pas le tiret ni le chiffre initial."},{"n":"intro-python","q":"<code>bool(0)</code> vaut :","o":["False","True","0"],"a":0,"e":"0 est « faux » ; tout autre nombre est vrai."},{"n":"intro-python","q":"<code>print(&quot;MIP&quot; + 2023)</code> :","o":["affiche MIP2023","provoque une erreur TypeError","affiche MIP 2023"],"a":1,"e":"On ne concatène pas str et int."},{"n":"intro-python","q":"Quel type est non modifiable ?","o":["list","tuple","dict"],"a":1,"e":"Le tuple est immuable."},{"n":"intro-python","q":"<code>float(&quot;3.14&quot;)</code> renvoie :","o":["3.14","&quot;3.14&quot;","3"],"a":0,"e":"La chaîne est convertie en nombre à virgule."},{"n":"intro-python","q":"Que donne <code>a, b = 1, 2, 3</code> ?","o":["a = 1, b = 2","une erreur","a = 1, b = (2, 3)"],"a":1,"e":"Le nombre de variables doit égaler le nombre de valeurs."},{"n":"intro-python","q":"<code>Age</code> et <code>age</code> sont :","o":["la même variable","deux variables différentes","une erreur"],"a":1,"e":"Python est sensible à la casse."},{"n":"intro-python","q":"Avec z = 1 + 2j, <code>z.imag</code> vaut :","o":["1.0","2.0","2j"],"a":1,"e":"imag renvoie la partie imaginaire sous forme de float."}]},{"id":"chaines-operateurs","t":"Nombr
