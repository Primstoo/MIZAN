es, chaînes, opérateurs, input et print","seance":"Séance 6 · 28 octobre 2024","imp":5,"html":"<h2>Avant de commencer</h2>\n<p>Tu connais les types int, float, str et la conversion <code>int()</code> (chapitre 5).</p>\n<section class=\"exo\"><h3>Vérifie ton prérequis</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Quel est le type de la valeur renvoyée par <code>input()</code> ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : str</b></p><p><code>input()</code> renvoie toujours une <strong>chaîne</strong> (str), même si l&#39;utilisateur tape un nombre.</p>\n</div></div></section><h2>Comment aborder ce chapitre</h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p>Pour le découpage <code>[début:fin]</code>, pense aux indices comme des <strong>barrières entre les lettres</strong> : on garde ce qui est entre deux barrières, fin exclue.</p>\n</aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p><code>age = input(&quot;Âge : &quot;)</code> puis <code>age + 1</code> plante : <code>age</code> est une chaîne. Il faut <code>int(input(...))</code>.</p>\n</aside><p>À la fin, tu sais indexer et découper une chaîne, utiliser ses méthodes, formater avec <code>format()</code> et les f-strings, et prévoir le résultat de tout opérateur.</p>\n<h2>Idée 1 · Une chaîne est une suite de caractères indexés</h2>\n<figure class=\"grille\"><figcaption>fil = &quot;FPBM MIP S1&quot; (indices positifs en haut, négatifs en bas)</figcaption><table><tr><th>F</th><th>P</th><th>B</th><th>M</th><th>␣</th><th>M</th><th>I</th><th>P</th><th>␣</th><th>S</th><th>1</th></tr><tr><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td><td class=\"h1\">5</td><td class=\"h1\">6</td><td class=\"h1\">7</td><td class=\"h1\">8</td><td class=\"h1\">9</td><td>10</td></tr><tr><td>-11</td><td>-10</td><td>-9</td><td>-8</td><td>-7</td><td class=\"h1\">-6</td><td class=\"h1\">-5</td><td class=\"h1\">-4</td><td class=\"h1\">-3</td><td class=\"h1\">-2</td><td>-1</td></tr></table></figure><pre class=\"\"><code>fil = &quot;FPBM MIP S1&quot;\nprint(fil[2], len(fil))\nprint(fil[:7])\nprint(fil[2:])\nprint(fil[-6:-1])\nprint(repr(fil[2:9:2]))</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>B 11\nFPBM MI\nBM MIP S1\nMIP S\n'B I '</code></pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>La diapo annonce <code>fil[2:9:2]</code> → « B I ». En réalité le résultat est <code>&#39;B I &#39;</code> avec un <strong>espace final</strong> (indices 2, 4, 6, 8 : B, espace, I, espace). On le voit avec <code>repr()</code>.</p>\n</aside><h2>Idée 2 · Méthodes des chaînes et formatage</h2>\n<pre class=\"\"><code>fil = &quot;fpbm mip s1&quot;\nprint(fil.upper())\nprint(&quot;  FPBM MIP &quot;.strip())\nprint(&quot;FPBM MIP&quot;.replace(&quot;FPBM&quot;, &quot;FSTBM&quot;))\nprint(&quot;fpbm,mip,s1&quot;.split(&quot;,&quot;))\nproduit, prix, version = &quot;Smartphone&quot;, 3000, 100\nprint(&quot;Nom : {} , prix : {} , version : {}.&quot;.format(produit, prix, version))\nprint(f&quot;Nom : {produit}, prix : {prix} DH&quot;)\npi = 3.14159265\nprint(f&quot;La valeur de pi est d'environ {pi:.2f}&quot;)\nprint(&quot;Filière \\&quot;MIP\\&quot; de la FPBM.&quot;)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>FPBM MIP S1\nFPBM MIP\nFSTBM MIP\n['fpbm', 'mip', 's1']\nNom : Smartphone , prix : 3000 , version : 100.\nNom : Smartphone, prix : 3000 DH\nLa valeur de pi est d'environ 3.14\nFilière &quot;MIP&quot; de la FPBM.</code></pre><p><code>format()</code> accepte aussi des positions <code>{2}</code> et des noms <code>{name}</code>. Les chaînes sont <strong>immuables</strong> : <code>upper()</code> renvoie une nouvelle chaîne, l&#39;originale ne change pas.</p>\n<h2>Idée 3 · Opérateurs</h2>\n<pre class=\"\"><code>a, b = 10, 3\nprint(a + b, a - b, a * b, a / b, a % b, a // b, a ** b)\nx = 10\nx //= 3\nx **= 2\nprint(x)\nprint(5 &amp; 3, 5 | 3, 5 ^ 3, 5 &lt;&lt; 2, 5 &gt;&gt; 2)\nprint(15 + 3 * 2, (8 + 2) * (7 + 3), 5 + 4 - 7 + 3)\nprint(bool(&quot;&quot;), bool(&quot;MIP&quot;), bool(None), bool([]))</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>13 7 30 3.3333333333333335 1 3 1000\n9\n1 7 6 20 1\n21 100 5\nFalse True False False</code></pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p><code>/</code> donne <strong>toujours</strong> un float (10 / 2 = 5.0). <code>//</code> donne le quotient entier, <code>%</code> le reste, <code>**</code> la puissance.</p>\n</aside><p>Priorités : <code>**</code> puis <code>* / // %</code> puis <code>+ -</code>, puis comparaisons, puis <code>not</code>, <code>and</code>, <code>or</code>. À priorité égale, de gauche à droite.</p>\n<h2>Idée 4 · input() et print()</h2>\n<pre class=\"\"><code>age = int(input(&quot;Veuillez entrer votre age : &quot;))\nprint(&quot;Votre age est :&quot;, age)</code></pre><pre class=\"\"><code>print(&quot;MIP&quot;, end='@')\nprint(&quot;usms.ac.ma&quot;)\nprint('27', '10', '2023', sep='-')</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>MIP@usms.ac.ma\n27-10-2023</code></pre><p><code>sep</code> remplace l&#39;espace entre les valeurs, <code>end</code> remplace le retour à la ligne final.</p>\n<h2>S&#39;exercer</h2>\n<section class=\"exo\"><h3>Exercices types</h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Que vaut &quot;FSABM&quot;[1:4] ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : SAB</b></p><p>Indices 1, 2, 3 (4 exclu) : <strong>SAB</strong>.</p>\n</div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Que vaut 17 // 5 + 17 % 5 ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 5</b></p><p>3 + 2 = <strong>5</strong>.</p>\n</div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>(TD 5, ex. 2) Compter les chiffres et les lettres d&#39;une chaîne.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>s = &quot;MIP2024 S1&quot; ; c = l = 0\nfor car in s : si car.isdigit() alors c += 1, sinon si car.isalpha() alors l += 1.\nRésultat : 5 chiffres (2, 0, 2, 4, 1) et 4 lettres (M, I, P, S).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\"><code>&quot;MIP S1&quot;[2]</code> vaut :</div><button class=\"opt\" data-o=\"0\">I</button><button class=\"opt\" data-o=\"1\">P</button><button class=\"opt\" data-o=\"2\">M</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\"><code>len(&quot;MIP S1&quot;)</code> vaut :</div><button class=\"opt\" data-o=\"0\">5</button><button class=\"opt\" data-o=\"1\">6</button><button class=\"opt\" data-o=\"2\">4</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\"><code>10 / 2</code> vaut :</div><button class=\"opt\" data-o=\"0\">5</button><button class=\"opt\" data-o=\"1\">5.0</button><button class=\"opt\" data-o=\"2\">2</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\"><code>2 ** 3 ** 2</code> vaut :</div><button class=\"opt\" data-o=\"0\">64</button><button class=\"opt\" data-o=\"1\">512</button><button class=\"opt\" data-o=\"2\">36</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\"><code>&quot;abc&quot;.upper()</code> modifie-t-il la chaîne d&#39;origine ?</div><button class=\"opt\" data-o=\"0\">Oui</button><button class=\"opt\" data-o=\"1\">Non, il renvoie une nouvelle chaîne</button><button class=\"opt\" data-o=\"2\">Seulement si on écrit <code>upper(True)</code></button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\"><code>print(&quot;a&quot;, &quot;b&quot;, sep=&quot;&quot;)</code> affiche :</div><button class=\"opt\" data-o=\"0\">ab</button><button class=\"opt\" data-o=\"1\">a b</button><button class=\"opt\" data-o=\"2\">a,b</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\"><code>bool(&quot;&quot;)</code> vaut :</div><button class=\"opt\" data-o=\"0\">False</button><button class=\"opt\" data-o=\"1\">True</button><button class=\"opt\" data-o=\"2\">None</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\"><code>5 &lt;&lt; 2</code> vaut :</div><button class=\"opt\" data-o=\"0\">7</button><button class=\"opt\" data-o=\"1\">20</button><button class=\"opt\" data-o=\"2\">1</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Pour lire un entier au clavier :</div><button class=\"opt\" data-o=\"0\"><code>input(int(&quot;...&quot;))</code></button><button class=\"opt\" data-o=\"1\"><code>int(input(&quot;...&quot;))</code></button><button class=\"opt\" data-o=\"2\"><code>input(&quot;...&quot;)</code></button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\"><code>f&quot;{2/3:.2f}&quot;</code> donne :</div><button class=\"opt\" data-o=\"0\">&#39;0.67&#39;</button><button class=\"opt\" data-o=\"1\">&#39;0.66&#39;</button><button class=\"opt\" data-o=\"2\">&#39;0.6666&#39;</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"chaines-operateurs","rep":["str"],"tol":null},{"n":"chaines-operateurs","rep":["SAB"],"tol":null},{"n":"chaines-operateurs","rep":["5"],"tol":null},{"n":"chaines-operateurs","rep":null,"tol":null}],"qcm":[{"n":"chaines-operateurs","q":"<code>&quot;MIP S1&quot;[2]</code> vaut :","o":["I","P","M"],"a":1,"e":"Indices : M=0, I=1, P=2."},{"n":"chaines-operateurs","q":"<code>len(&quot;MIP S1&quot;)</code> vaut :","o":["5","6","4"],"a":1,"e":"L&#39;espace compte."},{"n":"chaines-operateurs","q":"<code>10 / 2</code> vaut :","o":["5","5.0","2"],"a":1,"e":"<code>/</code> donne toujours un float."},{"n":"chaines-operateurs","q":"<code>2 ** 3 ** 2</code> vaut :","o":["64","512","36"],"a":1,"e":"<code>**</code> s&#39;évalue de droite à gauche : 3 ** 2 = 9, puis 2 ** 9."},{"n":"chaines-operateurs","q":"<code>&quot;abc&quot;.upper()</code> modifie-t-il la chaîne d&#39;origine ?","o":["Oui","Non, il renvoie une nouvelle chaîne","Seulement si on écrit <code>upper(True)</code>"],"a":1,"e":"Les chaînes sont immuables."},{"n":"chaines-operateurs","q":"<code>print(&quot;a&quot;, &quot;b&quot;, sep=&quot;&quot;)</code> affiche :","o":["ab","a b","a,b"],"a":0,"e":"sep vide : rien entre les valeurs."},{"n":"chaines-operateurs","q":"<code>bool(&quot;&quot;)</code> vaut :","o":["False","True","None"],"a":0,"e":"Une chaîne vide est « fausse »."},{"n":"chaines-operateurs","q":"<code>5 &lt;&lt; 2</code> vaut :","o":["7","20","1"],"a":1,"e":"Décaler de 2 bits à gauche = multiplier par 4."},{"n":"chaines-operateurs","q":"Pour lire un entier au clavier :","o":["<code>input(int(&quot;...&quot;))</code>","<code>int(input(&quot;...&quot;))</code>","<code>input(&quot;...&quot;)</code>"],"a":1,"e":"On convertit la chaîne renvoyée par input."},{"n":"chaines-operateurs","q":"<code>f&quot;{2/3:.2f}&quot;</code> donne :","o":["&#39;0.67&#39;","&#39;0.66&#39;","&#39;0.6666&#39;"],"a":0,"e":"Arrondi à deux décimales."}]},{"id":"conditions-boucles-python","t":"Conditions et boucles en Python","seance":"Séance 7 · 4 novembre 2024","imp":5,"html":"<h2>Avant de commencer</h2>\n<p>Tu connais Si/Sinon, TantQue et Pour en pseudo-code (chapitre 2). Ici, on les traduit en Python.</p>\n<section class=\"exo\"><h3>Vérifie ton prérequis</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Quelle boucle de pseudo-code utilise-t-on quand le nombre de tours est connu ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : pour</b></p><p>La boucle <strong>Pour</strong>. En Python, elle devient <code>for i in range(...)</code>.</p>\n</div></div></section><h2>Comment aborder ce chapitre</h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p>Traduis mot à mot : <code>si</code> → <code>if</code>, <code>sinon si</code> → <code>elif</code>, <code>sinon</code> → <code>else</code>, <code>tantque</code> → <code>while</code>, <code>pour i ← a jusqu&#39;à b</code> → <code>for i in range(a, b + 1)</code>. Et n&#39;oublie jamais les <strong>deux-points</strong> <code>:</code>.</p>\n</aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p><code>range(1, 10)</code> s&#39;arrête à <strong>9</strong>. La borne de fin est exclue : pour aller jusqu&#39;à 10, écris <code>range(1, 11)</code>.</p>\n</aside><p>À la fin, tu sais écrire if/elif/else, le ternaire, match-case, while et for avec range, break, continue, else et pass.</p>\n<h2>Idée 1 · if / elif / else</h2>\n<pre class=\"\"><code>grade = 85\nif grade &gt;= 90:\n    print(&quot;A&quot;)\nelif grade &gt;= 80:\n    print(&quot;B&quot;)\nelif grade &gt;= 70:\n    print(&quot;C&quot;)\nelse:\n    print(&quot;D&quot;)\nx, y = 10, 20\nresult = x if x &gt; y else y\nprint(result)\na = b = 15\nprint(&quot;A&quot;) if a &gt; b else print(&quot;égalité&quot;) if a == b else print(&quot;B&quot;)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>B\n20\négalité</code></pre><p><code>and</code>, <code>or</code>, <code>not</code> combinent les conditions. <code>pass</code> remplit un bloc vide (un <code>if</code> ne peut pas être vide).</p>\n<h2>Idée 2 · match-case (Python 3.10+)</h2>\n<p>C&#39;est le « Selon » du pseudo-code. <code>case _</code> attrape tout le reste ; <code>|</code> regroupe plusieurs valeurs.</p>\n<pre class=\"\"><code>def operation(a, b, op):\n    match op:\n        case &quot;+&quot;:\n            return a + b\n        case &quot;-&quot;:\n            return a - b\n        case &quot;*&quot; | &quot;x&quot;:\n            return a * b\n        case _:\n            return &quot;opération inconnue&quot;\n\nprint(operation(6, 3, &quot;+&quot;), operation(6, 3, &quot;x&quot;), operation(6, 3, &quot;?&quot;))</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>9 18 opération inconnue</code></pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>Les exemples match-case de la diapo sont des images non lisibles dans le support texte ; cet exemple est une rédaction ToumaiLearn (il prépare le TD 4, ex. 6).</p>\n</aside><h2>Idée 3 · while, break, continue, else</h2>\n<figure class=\"flux\"><figcaption>Une itération de while</figcaption><div class=\"flux-l\"><div class=\"flux-b\">tester la condition</div><div class=\"flux-f\">→</div><div class=\"flux-b\">si vraie : exécuter le bloc</div><div class=\"flux-f\">→</div><div class=\"flux-b\">revenir tester</div><div class=\"flux-f\">→</div><div class=\"flux-b\">si fausse : bloc else puis suite</div></div></figure><pre class=\"\"><code>i = 0\nwhile i &lt; 5:\n    i += 1\n    if i == 3:\n        continue\n    print(i, end=&quot; &quot;)\nprint()\ni = 1\nwhile i &lt; 6:\n    i += 1\nelse:\n    print(&quot;i n'est plus inférieure à 6 :&quot;, i)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>1 2 4 5 \ni n'est plus inférieure à 6 : 6</code></pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p><code>break</code> sort de la boucle (et le <code>else</code> de la boucle est <strong>sauté</strong>). <code>continue</code> passe directement au tour suivant.</p>\n</aside><h2>Idée 4 · for et range()</h2>\n<figure class=\"grille\"><figcaption>range(start, stop, step) : stop est exclu</figcaption><table><tr><th>appel</th><th>valeurs</th></tr><tr><td>range(5)</td><td>0 1 2 3 4</td></tr><tr><td>range(2, 6)</td><td>2 3 4 5</td></tr><tr><td>range(0, 11, 2)</td><td>0 2 4 6 8 10</td></tr><tr><td>range(5, 0, -1)</td><td>5 4 3 2 1</td></tr></table></figure><aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>Sur la diapo, le commentaire de <code>range(2,6)</code> dit « start=2 et stop=5 ». Il faut lire <strong>stop=6</strong> : c&#39;est la valeur 6 qui est exclue, la dernière valeur produite est 5.</p>\n</aside><pre class=\"\"><code>for fil in [&quot;MIP&quot;, &quot;BCG&quot;, &quot;PC&quot;]:\n    print(fil, end=&quot; &quot;)\nprint()\nfor x in range(6):\n    if x == 3:\n        break\n    print(x, end=&quot; &quot;)\nelse:\n    print(&quot;La boucle est terminée&quot;)\nprint()\nn = 3\nfor i in range(n):\n    for j in range(n):\n        print(&quot;*&quot;, end=&quot; &quot;)\n    print()</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>MIP BCG PC \n0 1 2 \n* * * \n* * * \n* * * </code></pre><p>Le <code>else</code> n&#39;a pas été affiché : la boucle a été cassée par <code>break</code>.</p>\n<h2>S&#39;exercer</h2>\n<section class=\"exo\"><h3>Exercices du TD 4 et 5</h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>(TD 4, ex. 3) IMC = poids / taille². Pour 70 kg et 1,75 m, quelle catégorie (seuils 18,5 ; 25 ; 30) ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>imc = 70 / 1.75 ** 2 ≈ 22.86. if imc &lt; 18.5 : sous-poids ; elif imc &lt; 25 : normal ; elif imc &lt; 30 : surpoids ; else : obésité. Ici : <strong>poids normal</strong>.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>(TD 5, ex. 1) Table de multiplication de n.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>for i in range(1, 11): print(n, &quot;x&quot;, i, &quot;=&quot;, n * i)\nAttention à range(1, 11) pour aller jusqu&#39;à 10.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Combien de lignes affiche <code>for i in range(2, 20, 5): print(i)</code> ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 4</b></p><p>Valeurs 2, 7, 12, 17 : <strong>4</strong> lignes.</p>\n</div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Que manque-t-il à <code>if x &gt; 0 print(x)</code> ?</div><button class=\"opt\" data-o=\"0\">Des parenthèses</button><button class=\"opt\" data-o=\"1\">Les deux-points et l&#39;indentation</button><button class=\"opt\" data-o=\"2\">Le mot then</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\"><code>list(range(1, 5))</code> vaut :</div><button class=\"opt\" data-o=\"0\">[1, 2, 3, 4, 5]</button><button class=\"opt\" data-o=\"1\">[1, 2, 3, 4]</button><button class=\"opt\" data-o=\"2\">[0, 1, 2, 3, 4]</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Combien de fois s&#39;exécute <code>while False:</code> ?</div><button class=\"opt\" data-o=\"0\">0</button><button class=\"opt\" data-o=\"1\">1</button><button class=\"opt\" data-o=\"2\">infini</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\"><code>for i in range(5): if i == 3: break</code> ; quelles valeurs de i voit-on avant la sortie ?</div><button class=\"opt\" data-o=\"0\">0, 1, 2, 3</button><button class=\"opt\" data-o=\"1\">0, 1, 2</button><button class=\"opt\" data-o=\"2\">0 à 4</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Le <code>else</code> d&#39;un <code>for</code> s&#39;exécute :</div><button class=\"opt\" data-o=\"0\">toujours</button><button class=\"opt\" data-o=\"1\">si la boucle n&#39;a pas été interrompue par break</button><button class=\"opt\" data-o=\"2\">seulement si la boucle est vide</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\"><code>res = 6 if 62 &gt; 45 else 10</code> donne :</div><button class=\"opt\" data-o=\"0\">6</button><button class=\"opt\" data-o=\"1\">10</button><button class=\"opt\" data-o=\"2\">True</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Dans match-case, <code>case _:</code> correspond à :</div><button class=\"opt\" data-o=\"0\">la valeur <code>_</code></button><button class=\"opt\" data-o=\"1\">tous les cas non traités avant</button><button class=\"opt\" data-o=\"2\">une erreur</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Quelle version de Python introduit match-case ?</div><button class=\"opt\" data-o=\"0\">3.6</button><button class=\"opt\" data-o=\"1\">3.10</button><button class=\"opt\" data-o=\"2\">2.7</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Deux boucles imbriquées de 4 tours chacune exécutent le bloc interne :</div><button class=\"opt\" data-o=\"0\">8 fois</button><button class=\"opt\" data-o=\"1\">16 fois</button><button class=\"opt\" data-o=\"2\">4 fois</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\"><code>range(10, 0, -3)</code> donne :</div><button class=\"opt\" data-o=\"0\">10, 7, 4, 1</button><button class=\"opt\" data-o=\"1\">10, 7, 4, 1, -2</button><button class=\"opt\" data-o=\"2\">10, 7, 4</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"conditions-boucles-python","rep":["pour"],"tol":null},{"n":"conditions-boucles-python","rep":null,"tol":null},{"n":"conditions-boucles-python","rep":null,"tol":null},{"n":"conditions-boucles-python","rep":["4"],"tol":null}],"qcm":[{"n":"conditions-boucles-python","q":"Que manque-t-il à <code>if x &gt; 0 print(x)</code> ?","o":["Des parenthèses","Les deux-points et l&#39;indentation","Le mot then"],"a":1,"e":"Syntaxe : <code>if x &gt; 0:</code> puis bloc indenté."},{"n":"conditions-boucles-python","q":"<code>list(range(1, 5))</code> vaut :","o":["[1, 2, 3, 4, 5]","[1, 2, 3, 4]","[0, 1, 2, 3, 4]"],"a":1,"e":"La fin est exclue."},{"n":"conditions-boucles-python","q":"Combien de fois s&#39;exécute <code>while False:</code> ?","o":["0","1","infini"],"a":0,"e":"La condition est testée avant le premier tour."},{"n":"conditions-boucles-python","q":"<code>for i in range(5): if i == 3: break</code> ; quelles valeurs de i voit-on avant la sortie ?","o":["0, 1, 2, 3","0, 1, 2","0 à 4"],"a":0,"e":"À i = 3, on entre dans le tour puis on sort par break."},{"n":"conditions-boucles-python","q":"Le <code>else</code> d&#39;un <code>for</code> s&#39;exécute :","o":["toujours","si la boucle n&#39;a pas été interrompue par break","seulement si la boucle est vide"],"a":1,"e":"break saute le else."},{"n":"conditions-boucles-python","q":"<code>res = 6 if 62 &gt; 45 else 10</code> donne :","o":["6","10","True"],"a":0,"e":"La condition est vraie."},{"n":"conditions-boucles-python","q":"Dans match-case, <code>case _:</code> correspond à :","o":["la valeur <code>_</code>","tous les cas non traités avant","une erreur"],"a":1,"e":"C&#39;est le cas par défaut."},{"n":"conditions-boucles-python","q":"Quelle version de Python introduit match-case ?","o":["3.6","3.10","2.7"],"a":1,"e":"Python 3.10."},{"n":"conditions-boucles-python","q":"Deux boucles imbriquées de 4 tours chacune exécutent le bloc interne :","o":["8 fois","16 fois","4 fois"],"a":1,"e":"4 × 4."},{"n":"conditions-boucles-python","q":"<code>range(10, 0, -3)</code> donne :","o":["10, 7, 4, 1","10, 7, 4, 1, -2","10, 7, 4"],"a":0,"e":"On descend de 3, 0 exclu."}]},{"id":"modules-array","t":"Modules Python et tableaux (module array)","seance":"Séance 8 · 10 novembre 2024","imp":4,"html":"<h2>Avant de commencer</h2>\n<p>Tu sais parcourir un tableau en pseudo-code (chapitre 3) et écrire une boucle <code>for i in range(n)</code> (chapitre 7).</p>\n<section class=\"exo\"><h3>Vérifie ton prérequis</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Quelles valeurs prend i dans <code>for i in range(len(T))</code> si T a 4 éléments ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>0, 1, 2, 3 : exactement les indices valides du tableau.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Comment aborder ce chapitre</h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p>Le module <code>array</code> est la traduction directe du <code>Tableau T[n] : Entier</code> du pseudo-code : <strong>un seul type</strong> par tableau, fixé par un code (<code>&#39;i&#39;</code> entier, <code>&#39;d&#39;</code> réel).</p>\n</aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p><code>Age.remove(9)</code> enlève la <strong>valeur</strong> 9 (première occurrence) ; <code>Age.pop(1)</code> enlève l&#39;élément à l&#39;<strong>indice</strong> 1. Ne les confonds pas.</p>\n</aside><p>À la fin, tu sais importer un module, utiliser <code>math</code>, créer un tableau <code>array</code> et le manipuler (accès, découpage, ajout, suppression, recherche, tri).</p>\n<h2>Idée 1 · Importer un module</h2>\n<p>Un <strong>module</strong> est un fichier de fonctions prêtes à l&#39;emploi. Trois façons d&#39;importer :</p>\n<pre class=\"\"><code>import math\nimport array as ar\nfrom array import *\nprint(math.sqrt(16), round(math.pi, 4), math.radians(180) == math.pi)\nprint(round(math.sin(math.radians(30)), 2))</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>4.0 3.1416 True\n0.5</code></pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p>Les fonctions trigonométriques de <code>math</code> travaillent en <strong>radians</strong> : convertis avec <code>math.radians()</code>. La diapo montre <code>sin(30°)</code> = 0.49999999999999994 : c&#39;est une approximation des flottants, d&#39;où le <code>round</code>.</p>\n</aside><h2>Idée 2 · Liste ou tableau array ?</h2>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>list</th>\n<th>array</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Types des éléments</td>\n<td>mélangés</td>\n<td>un seul (code <code>&#39;i&#39;</code>, <code>&#39;d&#39;</code>…)</td>\n</tr>\n<tr>\n<td>Import</td>\n<td>aucun</td>\n<td><code>import array</code></td>\n</tr>\n<tr>\n<td>Usage</td>\n<td>général</td>\n<td>données numériques homogènes</td>\n</tr>\n</tbody></table>\n<figure class=\"grille\"><figcaption>Age = ar.array('i', [15, 9, 7, 23, 7, 11])</figcaption><table><tr><th></th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><th>valeur</th><td>15</td><td>9</td><td class=\"h1\">7</td><td>23</td><td class=\"h1\">7</td><td>11</td></tr></table></figure><pre class=\"\"><code>import array as ar\nAge = ar.array('i', [15, 9, 7, 23, 7, 11])\nprint(len(Age), Age[0], Age[-1], Age.index(7), Age.count(7))\nprint(Age[1:3])\nAge[1] = 31\nfor v in Age:\n    print(v, end=&quot; &quot;)\nprint()</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>6 15 11 2 2\narray('i', [9, 7])\n15 31 7 23 7 11 </code></pre><p><code>Age[6]</code> provoquerait <code>IndexError: array index out of range</code>. <code>index(7)</code> donne la <strong>première</strong> position.</p>\n<h2>Idée 3 · Ajouter, supprimer, inverser</h2>\n<pre class=\"\"><code>import array as ar\nAge = ar.array('i', [15, 9, 7, 11])\nAge.append(35)\nAge.extend([31, 22])\nAge.insert(0, 45)\nprint(Age)\nAge.remove(9)\nAge.pop(1)\nprint(Age)\nAge.reverse()\nprint(&quot;Tableau inversé :&quot;, *Age)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>array('i', [45, 15, 9, 7, 11, 35, 31, 22])\narray('i', [45, 7, 11, 35, 31, 22])\nTableau inversé : 22 31 35 11 7 45</code></pre><p><code>*Age</code> dans <code>print</code> « déballe » le tableau : les valeurs s&#39;affichent séparées par des espaces.</p>\n<h2>Idée 4 · Remplir au clavier, puis trier</h2>\n<p>Le schéma du prof : un tableau vide <code>ar.array(&#39;i&#39;)</code>, puis <code>append</code> dans une boucle.</p>\n<pre class=\"\"><code>import array as ar\ntab = ar.array('i')\nn = int(input(&quot;entrer la taille du tableau : &quot;))\nfor i in range(n):\n    x = int(input(f&quot;entrer l'élément {i} : &quot;))\n    tab.append(x)</code></pre><p>Puis on applique les tris du chapitre 4. Ici le tri par sélection sur un tableau déjà rempli :</p>\n<pre class=\"\"><code>import array as ar\ntab = ar.array('i', [12, 45, 8, 5, 16])\nn = len(tab)\nfor i in range(n - 1):\n    m = i\n    for j in range(i + 1, n):\n        if tab[j] &lt; tab[m]:\n            m = j\n    tab[i], tab[m] = tab[m], tab[i]\nprint(*tab)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>5 8 12 16 45</code></pre><h2>S&#39;exercer</h2>\n<section class=\"exo\"><h3>Exercices types</h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Que contient ar.array(&#39;i&#39;, [4, 4, 2]) après remove(4) ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>array(&#39;i&#39;, [4, 2]) : seule la première occurrence est retirée.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Écris l&#39;appel qui crée un tableau de réels [1.5, 2.0].</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>ar.array(&#39;d&#39;, [1.5, 2.0])</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Avec T = ar.array(&#39;i&#39;, [3, 8, 1]), que vaut T.index(1) ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 2</b></p><p>La valeur 1 est à l&#39;indice <strong>2</strong>.</p>\n</div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Comment importer le module array sous le nom ar ?</div><button class=\"opt\" data-o=\"0\">import array as ar</button><button class=\"opt\" data-o=\"1\">from ar import array</button><button class=\"opt\" data-o=\"2\">include array</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\"><code>ar.array(&#39;i&#39;, [1, 2.5])</code> :</div><button class=\"opt\" data-o=\"0\">crée [1, 2]</button><button class=\"opt\" data-o=\"1\">provoque une erreur (TypeError)</button><button class=\"opt\" data-o=\"2\">crée [1, 2.5]</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\"><code>A = ar.array(&#39;i&#39;, [5, 6, 7])</code>, <code>A.pop(0)</code> ; A devient :</div><button class=\"opt\" data-o=\"0\">[6, 7]</button><button class=\"opt\" data-o=\"1\">[5, 6]</button><button class=\"opt\" data-o=\"2\">[5, 7]</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\"><code>A.count(7)</code> pour [7, 1, 7, 7] vaut :</div><button class=\"opt\" data-o=\"0\">1</button><button class=\"opt\" data-o=\"1\">3</button><button class=\"opt\" data-o=\"2\">0</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\"><code>math.sqrt(25)</code> renvoie :</div><button class=\"opt\" data-o=\"0\">5</button><button class=\"opt\" data-o=\"1\">5.0</button><button class=\"opt\" data-o=\"2\">25</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\"><code>A[-1]</code> désigne :</div><button class=\"opt\" data-o=\"0\">le dernier élément</button><button class=\"opt\" data-o=\"1\">le premier élément</button><button class=\"opt\" data-o=\"2\">une erreur</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\"><code>A = ar.array(&#39;i&#39;, [1, 2])</code> puis <code>A.extend([3, 4])</code> ; len(A) vaut :</div><button class=\"opt\" data-o=\"0\">3</button><button class=\"opt\" data-o=\"1\">4</button><button class=\"opt\" data-o=\"2\">2</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\"><code>A.insert(2, 9)</code> sur [1, 2, 3] donne :</div><button class=\"opt\" data-o=\"0\">[1, 2, 9, 3]</button><button class=\"opt\" data-o=\"1\">[1, 9, 2, 3]</button><button class=\"opt\" data-o=\"2\">[9, 1, 2, 3]</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\"><code>math.radians(180)</code> vaut environ :</div><button class=\"opt\" data-o=\"0\">180</button><button class=\"opt\" data-o=\"1\">3.14159</button><button class=\"opt\" data-o=\"2\">0.5</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\"><code>A[1:3]</code> sur [10, 20, 30, 40] renvoie :</div><button class=\"opt\" data-o=\"0\">[10, 20, 30]</button><button class=\"opt\" data-o=\"1\">[20, 30]</button><button class=\"opt\" data-o=\"2\">[20, 30, 40]</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"modules-array","rep":null,"tol":null},{"n":"modules-array","rep":null,"tol":null},{"n":"modules-array","rep":null,"tol":null},{"n":"modules-array","rep":["2"],"tol":null}],"qcm":[{"n":"modules-array","q":"Comment importer le module array sous le nom ar ?","o":["import array as ar","from ar import array","include array"],"a":0,"e":"<code>as</code> donne un alias."},{"n":"modules-array","q":"<code>ar.array(&#39;i&#39;, [1, 2.5])</code> :","o":["crée [1, 2]","provoque une erreur (TypeError)","crée [1, 2.5]"],"a":1,"e":"Le code &#39;i&#39; n&#39;accepte que des entiers."},{"n":"modules-array","q":"<code>A = ar.array(&#39;i&#39;, [5, 6, 7])</code>, <code>A.pop(0)</code> ; A devient :","o":["[6, 7]","[5, 6]","[5, 7]"],"a":0,"e":"pop(0) retire l&#39;élément d&#39;indice 0."},{"n":"modules-array","q":"<code>A.count(7)</code> pour [7, 1, 7, 7] vaut :","o":["1","3","0"],"a":1,"e":"Trois 7."},{"n":"modules-array","q":"<code>math.sqrt(25)</code> renvoie :","o":["5","5.0","25"],"a":1,"e":"sqrt renvoie un float."},{"n":"modules-array","q":"<code>A[-1]</code> désigne :","o":["le dernier élément","le premier élément","une erreur"],"a":0,"e":"Indexation négative depuis la fin."},{"n":"modules-array","q":"<code>A = ar.array(&#39;i&#39;, [1, 2])</code> puis <code>A.extend([3, 4])</code> ; len(A) vaut :","o":["3","4","2"],"a":1,"e":"extend ajoute chaque élément."},{"n":"modules-array","q":"<code>A.insert(2, 9)</code> sur [1, 2, 3] donne :","o":["[1, 2, 9, 3]","[1, 9, 2, 3]","[9, 1, 2, 3]"],"a":0,"e":"9 prend la place d&#39;indice 2."},{"n":"modules-array","q":"<code>math.radians(180)</code> vaut environ :","o":["180","3.14159","0.5"],"a":1,"e":"180° = π radians."},{"n":"modules-array","q":"<code>A[1:3]</code> sur [10, 20, 30, 40] renvoie :","o":["[10, 20, 30]","[20, 30]","[20, 30, 40]"],"a":1,"e":"Indices 1 et 2, 3 exclu."}]},{"id":"collections","t":"Listes, tuples, ensembles et dictionnaires","seance":"Séance 9 · novembre 2024","imp":5,"html":"<h2>Avant de commencer</h2>\n<p>Tu sais indexer et découper une chaîne ou un tableau (chapitres 6 et 8) : les listes s&#39;utilisent pareil.</p>\n<section class=\"exo\"><h3>Vérifie ton prérequis</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Que vaut &quot;MIPBCG&quot;[::-1] ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : GCBPIM</b></p><p>Un pas de -1 parcourt à l&#39;envers : <strong>GCBPIM</strong>.</p>\n</div></div></section><h2>Comment aborder ce chapitre</h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p>Choisis la collection selon deux questions : <strong>ordonnée ?</strong> et <strong>modifiable ?</strong> Puis : <strong>doublons autorisés ?</strong> Le tableau de l&#39;idée 1 répond à tout.</p>\n</aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p><code>L2 = L1</code> ne copie <strong>pas</strong> la liste : les deux noms pointent vers la même liste. Pour une vraie copie : <code>L1.copy()</code> ou <code>L1[:]</code>.</p>\n</aside><p>À la fin, tu sais créer et manipuler les quatre collections, écrire une liste en compréhension et parcourir un dictionnaire.</p>\n<h2>Idée 1 · Quatre collections, quatre comportements</h2>\n<figure class=\"grille\"><figcaption>Les collections Python</figcaption><table><tr><th>collection</th><th>syntaxe</th><th>ordonnée</th><th>modifiable</th><th>doublons</th></tr><tr><td>list</td><td>[ ]</td><td class=\"h1\">oui</td><td class=\"h1\">oui</td><td class=\"h1\">oui</td></tr><tr><td>tuple</td><td>( )</td><td class=\"h1\">oui</td><td class=\"h0\">non</td><td class=\"h1\">oui</td></tr><tr><td>set</td><td>{ }</td><td class=\"h0\">non</td><td class=\"h1\">oui (ajout/retrait)</td><td class=\"h0\">non</td></tr><tr><td>dict</td><td>{clé: valeur}</td><td class=\"h1\">oui (Python 3.7+)</td><td class=\"h1\">oui</td><td class=\"h0\">clés uniques</td></tr></table></figure><h2>Idée 2 · Les listes</h2>\n<pre class=\"\"><code>fil = [&quot;MIP&quot;, &quot;BCG&quot;, &quot;PC&quot;, &quot;BCG&quot;, &quot;MIPC&quot;, &quot;DPF&quot;, &quot;SEG&quot;]\nprint(fil[1], fil[-1], fil[2:5], fil[::2])\nprint(&quot;PC&quot; in fil, fil.count(&quot;BCG&quot;))\nfil[0] = &quot;MI&quot;\nfil.append(&quot;SMA&quot;)\nfil.insert(1, &quot;SVT&quot;)\nfil.remove(&quot;BCG&quot;)\nprint(fil)\nL1 = [14, 2, -5, 8, 9]\nL1.sort()\nprint(L1, sorted(L1, reverse=True))</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>BCG SEG ['PC', 'BCG', 'MIPC'] ['MIP', 'PC', 'MIPC', 'SEG']\nTrue 2\n['MI', 'SVT', 'PC', 'BCG', 'MIPC', 'DPF', 'SEG', 'SMA']\n[-5, 2, 8, 9, 14] [14, 9, 8, 2, -5]</code></pre><p><code>sort()</code> trie <strong>sur place</strong> (renvoie None) ; <code>sorted()</code> renvoie une <strong>nouvelle</strong> liste.</p>\n<p><strong>Liste en compréhension</strong> : <code>[expression for x in séquence if condition]</code> (condition facultative).</p>\n<pre class=\"\"><code>carres_pairs = [x ** 2 for x in range(10) if x % 2 == 0]\nprint(carres_pairs)\nL1 = [&quot;MIP&quot;, &quot;BCG&quot;]\nL2 = L1\nL3 = L1.copy()\nL1.append(&quot;PC&quot;)\nprint(L2, L3)\nprint([14, -5] + [25], end=&quot; &quot;)\na = [1, 2]\na.extend([3, 4])\nprint(a)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>[0, 4, 16, 36, 64]\n['MIP', 'BCG', 'PC'] ['MIP', 'BCG']\n[14, -5, 25] [1, 2, 3, 4]</code></pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p>Copier une liste : boucle d&#39;<code>append</code>, tranche complète <code>L[:]</code>, <code>L.copy()</code> ou <code>copy.copy(L)</code>. Pour une liste qui contient d&#39;autres listes : <code>copy.deepcopy(L)</code>.</p>\n</aside><h2>Idée 3 · Tuples et ensembles</h2>\n<p>Un <strong>tuple</strong> ne se modifie pas. Astuce du prof pour le « modifier » : le convertir en liste, changer, reconvertir.</p>\n<pre class=\"\"><code>mon_tuple = (&quot;MIP&quot;, 45, &quot;BCG&quot;, &quot;PC&quot;, 23)\nL = list(mon_tuple)\nL[1] = 50\nmon_tuple = tuple(L)\nfil, nb, *reste = mon_tuple\nprint(mon_tuple, fil, nb, reste)\nA = {&quot;MIP&quot;, &quot;BCG&quot;, &quot;PC&quot;}\nB = {&quot;PC&quot;, &quot;SMA&quot;}\nprint(sorted(A | B), A &amp; B, sorted(A - B))</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>('MIP', 50, 'BCG', 'PC', 23) MIP 50 ['BCG', 'PC', 23]\n['BCG', 'MIP', 'PC', 'SMA'] {'PC'} ['BCG', 'MIP']</code></pre><p>Un ensemble n&#39;a pas d&#39;ordre : on ne peut pas faire <code>A[0]</code>. Méthodes vues : <code>add</code>, <code>update</code>, <code>remove</code>, <code>discard</code>, <code>clear</code>, <code>union</code> (<code>|</code>), <code>intersection</code> (<code>&amp;</code>). On trie ici avec <code>sorted</code> uniquement pour avoir un affichage stable.</p>\n<h2>Idée 4 · Les dictionnaires</h2>\n<svg viewBox=\"0 0 420 150\" style=\"width:100%;max-width:480px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Un dictionnaire associe chaque clé unique à une valeur : Nom vers Souad, Age vers 28, CIN vers KK587\">\n<g font-family=\"sans-serif\" font-size=\"14\" fill=\"currentColor\">\n<text x=\"60\" y=\"22\" font-weight=\"700\" text-anchor=\"middle\">clés</text><text x=\"320\" y=\"22\" font-weight=\"700\" text-anchor=\"middle\">valeurs</text>\n<rect x=\"20\" y=\"34\" width=\"80\" height=\"28\" rx=\"5\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"60\" y=\"53\" text-anchor=\"middle\">\"Nom\"</text>\n<rect x=\"20\" y=\"72\" width=\"80\" height=\"28\" rx=\"5\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"60\" y=\"91\" text-anchor=\"middle\">\"Age\"</text>\n<rect x=\"20\" y=\"110\" width=\"80\" height=\"28\" rx=\"5\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"60\" y=\"129\" text-anchor=\"middle\">\"CIN\"</text>\n<rect x=\"270\" y=\"34\" width=\"100\" height=\"28\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"320\" y=\"53\" text-anchor=\"middle\">\"Souad\"</text>\n<rect x=\"270\" y=\"72\" width=\"100\" height=\"28\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"320\" y=\"91\" text-anchor=\"middle\">28</text>\n<rect x=\"270\" y=\"110\" width=\"100\" height=\"28\" rx=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"320\" y=\"129\" text-anchor=\"middle\">\"KK587\"</text>\n<g stroke=\"currentColor\" stroke-width=\"2\"><line x1=\"100\" y1=\"48\" x2=\"270\" y2=\"48\"/><line x1=\"100\" y1=\"86\" x2=\"270\" y2=\"86\"/><line x1=\"100\" y1=\"124\" x2=\"270\" y2=\"124\"/></g>\n</g></svg><pre class=\"\"><code>etudiant = {&quot;Nom&quot;: &quot;Souad&quot;, &quot;Age&quot;: 28, &quot;CIN&quot;: &quot;KK587&quot;}\nprint(etudiant[&quot;Nom&quot;], etudiant.get(&quot;Apogee&quot;, &quot;absent&quot;), &quot;CIN&quot; in etudiant)\netudiant[&quot;Age&quot;] = 29\netudiant[&quot;Apogee&quot;] = 55847\ndel etudiant[&quot;CIN&quot;]\nfor cle, valeur in etudiant.items():\n    print(cle, &quot;:&quot;, valeur)\nlongueurs = {mot: len(mot) for mot in (&quot;MIP&quot;, &quot;BCG&quot;, &quot;SMPC&quot;)}\nprint(longueurs)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>Souad absent True\nNom : Souad\nAge : 29\nApogee : 55847\n{'MIP': 3, 'BCG': 3, 'SMPC': 4}</code></pre><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p><code>etudiant[&quot;Apogee&quot;]</code> sur une clé absente lève <code>KeyError</code>. <code>get(cle, défaut)</code> évite l&#39;erreur.</p>\n</aside><h2>S&#39;exercer</h2>\n<section class=\"exo\"><h3>Exercices du TD 6</h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>(TD 6, ex. 1) list_ex1 vide ; ajouter 2 à 7 avec une boucle ; ajouter 8 et 9 en une instruction ; insérer 1 au début ; supprimer l&#39;élément 3 ; afficher.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>list_ex1 = [] ; for i in range(2, 8): list_ex1.append(i) ; list_ex1.extend([8, 9]) ; list_ex1.insert(0, 1) ; list_ex1.remove(3) ; print(list_ex1) → [1, 2, 4, 5, 6, 7, 8, 9].\n« L&#39;élément 3 » est ambigu : si c&#39;est l&#39;indice 3, on écrit list_ex1.pop(3) et on obtient [1, 2, 3, 5, 6, 7, 8, 9].</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>(TD 6, ex. 3) Séparer pairs et impairs d&#39;une liste nombres.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>pairs = [x for x in nombres if x % 2 == 0] ; impairs = [x for x in nombres if x % 2 != 0]</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>(TD 6, ex. 6) Pour la phrase &quot;Les sacs sont lourds&quot;, combien de « s » pour le mot &quot;sacs&quot; ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 2</b></p><p>d = {mot: mot.count(&quot;s&quot;) for mot in phrase.lower().split()} → {&#39;les&#39;: 1, &#39;sacs&#39;: 2, &#39;sont&#39;: 1, &#39;lourds&#39;: 1}.</p>\n</div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\"><code>[1, 2, 3][-2]</code> vaut :</div><button class=\"opt\" data-o=\"0\">1</button><button class=\"opt\" data-o=\"1\">2</button><button class=\"opt\" data-o=\"2\">3</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Quelle instruction provoque une erreur ?</div><button class=\"opt\" data-o=\"0\"><code>L = [1, 2]; L[0] = 5</code></button><button class=\"opt\" data-o=\"1\"><code>T = (1, 2); T[0] = 5</code></button><button class=\"opt\" data-o=\"2\"><code>D = {&quot;a&quot;: 1}; D[&quot;a&quot;] = 5</code></button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\"><code>len({1, 2, 2, 3})</code> vaut :</div><button class=\"opt\" data-o=\"0\">3</button><button class=\"opt\" data-o=\"1\">4</button><button class=\"opt\" data-o=\"2\">2</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\"><code>x = [3, 1, 2].sort()</code> ; x vaut :</div><button class=\"opt\" data-o=\"0\">[1, 2, 3]</button><button class=\"opt\" data-o=\"1\">None</button><button class=\"opt\" data-o=\"2\">[3, 1, 2]</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\"><code>[x * 2 for x in range(3)]</code> vaut :</div><button class=\"opt\" data-o=\"0\">[0, 2, 4]</button><button class=\"opt\" data-o=\"1\">[2, 4, 6]</button><button class=\"opt\" data-o=\"2\">[0, 1, 2]</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\"><code>d = {&quot;a&quot;: 1}</code> ; <code>d[&quot;b&quot;]</code> :</div><button class=\"opt\" data-o=\"0\">renvoie None</button><button class=\"opt\" data-o=\"1\">lève KeyError</button><button class=\"opt\" data-o=\"2\">renvoie 0</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\"><code>L1 = [1]; L2 = L1; L2.append(2)</code> ; L1 vaut :</div><button class=\"opt\" data-o=\"0\">[1]</button><button class=\"opt\" data-o=\"1\">[1, 2]</button><button class=\"opt\" data-o=\"2\">[2]</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\"><code>{1, 2} | {2, 3}</code> vaut :</div><button class=\"opt\" data-o=\"0\">{1, 2, 3}</button><button class=\"opt\" data-o=\"1\">{2}</button><button class=\"opt\" data-o=\"2\">{1, 3}</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Pour ajouter un élément à un ensemble :</div><button class=\"opt\" data-o=\"0\">append</button><button class=\"opt\" data-o=\"1\">add</button><button class=\"opt\" data-o=\"2\">insert</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\"><code>a, *b = (1, 2, 3)</code> ; b vaut :</div><button class=\"opt\" data-o=\"0\">(2, 3)</button><button class=\"opt\" data-o=\"1\">[2, 3]</button><button class=\"opt\" data-o=\"2\">2</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"collections","rep":["GCBPIM"],"tol":null},{"n":"collections","rep":null,"tol":null},{"n":"collections","rep":null,"tol":null},{"n":"collections","rep":["2"],"tol":null}],"qcm":[{"n":"collections","q":"<code>[1, 2, 3][-2]</code> vaut :","o":["1","2","3"],"a":1,"e":"-1 est le dernier, -2 l&#39;avant-dernier."},{"n":"collections","q":"Quelle instruction provoque une erreur ?","o":["<code>L = [1, 2]; L[0] = 5</code>","<code>T = (1, 2); T[0] = 5</code>","<code>D = {&quot;a&quot;: 1}; D[&quot;a&quot;] = 5</code>"],"a":1,"e":"Un tuple est immuable."},{"n":"collections","q":"<code>len({1, 2, 2, 3})</code> vaut :","o":["3","4","2"],"a":0,"e":"Les doublons disparaissent."},{"n":"collections","q":"<code>x = [3, 1, 2].sort()</code> ; x vaut :","o":["[1, 2, 3]","None","[3, 1, 2]"],"a":1,"e":"sort() trie sur place et renvoie None."},{"n":"collections","q":"<code>[x * 2 for x in range(3)]</code> vaut :","o":["[0, 2, 4]","[2, 4, 6]","[0, 1, 2]"],"a":0,"e":"range(3) donne 0, 1, 2."},{"n":"collections","q":"<code>d = {&quot;a&quot;: 1}</code> ; <code>d[&quot;b&quot;]</code> :","o":["renvoie None","lève KeyError","renvoie 0"],"a":1,"e":"Clé absente. Utilise get."},{"n":"collections","q":"<code>L1 = [1]; L2 = L1; L2.append(2)</code> ; L1 vaut :","o":["[1]","[1, 2]","[2]"],"a":1,"e":"L1 et L2 désignent la même liste."},{"n":"collections","q":"<code>{1, 2} | {2, 3}</code> vaut :","o":["{1, 2, 3}","{2}","{1, 3}"],"a":0,"e":"| est l&#39;union."},{"n":"collections","q":"Pour ajouter un élément à un ensemble :","o":["append","add","insert"],"a":1,"e":"Les ensembles n&#39;ont pas d&#39;append (pas d&#39;ordre)."},{"n":"collections","q":"<code>a, *b = (1, 2, 3)</code> ; b vaut :","o":["(2, 3)","[2, 3]","2"],"a":1,"e":"L&#39;étoile récupère le reste dans une liste."}]},{"id":"td-corriges","t":"TD 1 à 6 corrigés","seance":"TD · 2024-2025","imp":5,"html":"<p>Les fiches de TD 1 à 6 du Pr Madani n&#39;ont pas de corrigé officiel. Les corrigés ci-dessous sont rédigés par ToumaiLearn, en Python. Les saisies <code>input()</code> sont remplacées par des valeurs fixes pour que chaque sortie soit vérifiée ; à l&#39;examen, remets les <code>input()</code>.</p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>Corrigés non officiels. Ils suivent les méthodes du cours (boucles, tableaux, tris) plutôt que les raccourcis Python (<code>max</code>, <code>sum</code>, <code>sort</code>), car l&#39;examen d&#39;algorithmique attend souvent la méthode.</p>\n</aside><h2>TD 1 · Instructions élémentaires</h2>\n<pre class=\"\"><code># Ex. 4 et 5 : signe d'un nombre, signe d'un produit sans multiplier\ndef signe(n):\n    if n &lt; 0:\n        return &quot;valeur négative&quot;\n    elif n &gt; 0:\n        return &quot;valeur positive&quot;\n    return &quot;valeur nulle&quot;\n\ndef signe_produit(a, b):\n    if a == 0 or b == 0:\n        return &quot;nul&quot;\n    if (a &gt; 0) == (b &gt; 0):\n        return &quot;positif&quot;\n    return &quot;négatif&quot;\n\nprint(signe(-4), &quot;|&quot;, signe(0))\nprint(signe_produit(-3, 5), signe_produit(-3, -5), signe_produit(0, 7))\n\n# Ex. 7 : maximum de 3 valeurs ; Ex. 8 : ax + b = 0\na, b, c = 12, 45, 7\nm = a\nif b &gt; m: m = b\nif c &gt; m: m = c\nprint(&quot;max =&quot;, m)\nfor a, b in [(2, -6), (0, 3), (0, 0)]:\n    if a != 0:\n        print(&quot;x =&quot;, -b / a)\n    elif b == 0:\n        print(&quot;tout réel est solution&quot;)\n    else:\n        print(&quot;pas de solution&quot;)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>valeur négative | valeur nulle\nnégatif positif nul\nmax = 45\nx = 3.0\npas de solution\ntout réel est solution</code></pre><h2>TD 2 · Boucles</h2>\n<pre class=\"\"><code># Ex. 4 : nombre premier\ndef est_premier(n):\n    if n &lt; 2:\n        return False\n    d = 2\n    while d * d &lt;= n:\n        if n % d == 0:\n            return False\n        d += 1\n    return True\n\nprint([n for n in range(2, 20) if est_premier(n)])\n\n# Ex. 6 : racine carrée par U(n+1) = 1/2 (Un + a/Un), U0 = 1, arrêt si écart &lt; 0.001\na = 2\nu = 1\nwhile True:\n    v = 0.5 * (u + a / u)\n    if abs(v - u) &lt; 0.001:\n        break\n    u = v\nprint(round(v, 4))</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>[2, 3, 5, 7, 11, 13, 17, 19]\n1.4142</code></pre><aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p>Tester les diviseurs jusqu&#39;à √n suffit : si n = d × e avec d ≤ e, alors d ≤ √n.</p>\n</aside><h2>TD 3 · Tableaux</h2>\n<pre class=\"\"><code>T = [12, -5, 1, 2, 55, 100]\n# Ex. 2 : max et min\nmx = mn = T[0]\nfor i in range(1, len(T)):\n    if T[i] &gt; mx: mx = T[i]\n    if T[i] &lt; mn: mn = T[i]\nprint(&quot;max&quot;, mx, &quot;min&quot;, mn)\n# Ex. 4 : inverser sur place\nfor i in range(len(T) // 2):\n    T[i], T[len(T) - 1 - i] = T[len(T) - 1 - i], T[i]\nprint(T)\n# Ex. 5b : tri à bulles décroissant\nfor i in range(len(T) - 1, 0, -1):\n    for j in range(1, i + 1):\n        if T[j] &gt; T[j - 1]:\n            T[j], T[j - 1] = T[j - 1], T[j]\nprint(T)\n# Ex. 6a : recherche séquentielle (s'arrête à la première occurrence)\nVAL, POS, i = 55, -1, 0\nwhile i &lt; len(T) and POS == -1:\n    if T[i] == VAL:\n        POS = i\n    i += 1\nprint(&quot;POS =&quot;, POS)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>max 100 min -5\n[100, 55, 2, 1, -5, 12]\n[100, 55, 12, 2, 1, -5]\nPOS = 1</code></pre><p>La version 6b (dichotomique) est celle du chapitre 4, sur le tableau trié par ordre croissant.</p>\n<h2>TD 4 · Conditions en Python</h2>\n<pre class=\"\"><code># Ex. 4 : palindrome\nfor mot in [&quot;radar&quot;, &quot;level&quot;, &quot;mardi&quot;]:\n    print(mot, mot == mot[::-1])\n\n# Ex. 5 : second degré (racines réelles ou complexes)\nimport math\ndef second_degre(a, b, c):\n    delta = b * b - 4 * a * c\n    if delta &gt; 0:\n        return ((-b - math.sqrt(delta)) / (2 * a), (-b + math.sqrt(delta)) / (2 * a))\n    if delta == 0:\n        return (-b / (2 * a),)\n    r, im = -b / (2 * a), math.sqrt(-delta) / (2 * a)\n    return (complex(r, -im), complex(r, im))\n\nprint(second_degre(1, -3, 2), second_degre(1, 2, 1), second_degre(1, 2, 5))\n\n# Ex. 2 : promotion -10 %\nprix, promo = 250, True\nprint(prix * 0.9 if promo else prix)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>radar True\nlevel True\nmardi False\n(1.0, 2.0) (-1.0,) ((-1-2j), (-1+2j))\n225.0</code></pre><p>La calculatrice de l&#39;ex. 6 avec <code>match-case</code> est au chapitre 7. L&#39;échange de l&#39;ex. 7 s&#39;écrit en Python <code>A, B = B, A</code>.</p>\n<h2>TD 5 · Boucles en Python</h2>\n<pre class=\"\"><code># Ex. 4 : nombre d'Armstrong\ndef armstrong(n):\n    ch = str(n)\n    return n == sum(int(c) ** len(ch) for c in ch)\n\nprint(armstrong(153), armstrong(1634), armstrong(154))\n\n# Ex. 6 : triangle isocèle d'étoiles, hauteur 4\nh = 4\nfor i in range(1, h + 1):\n    print(&quot; &quot; * (h - i) + &quot;* &quot; * i)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>True True False\n   * \n  * * \n * * * \n* * * * </code></pre><h2>TD 6 · Listes et dictionnaires</h2>\n<pre class=\"\"><code># Ex. 2\nliste1, liste2 = [1, 2, 3], [10, 20, 30]\nliste_concatenee = liste1 + liste2\ndouble = [x * 2 for x in liste1]\nliste_somme = [liste1[i] + liste2[i] for i in range(len(liste1))]\nprint(liste_concatenee, double, liste_somme)\n\n# Ex. 4 : dictionnaire livre\nlivre = {&quot;titre&quot;: &quot;L'Alchimiste&quot;, &quot;auteur&quot;: &quot;Paulo Coelho&quot;, &quot;année de publication&quot;: 1988}\nlivre[&quot;éditeur&quot;] = &quot;Anne Carrière&quot;\nlivre[&quot;année de publication&quot;] = 1994\ndel livre[&quot;auteur&quot;]\nprint(livre)\n\n# Ex. 5 : tuple -&gt; dictionnaire en compréhension, noms alphabétiques seulement\nT = (&quot;Amine&quot;, &quot;Souad&quot;, &quot;R2D2&quot;, &quot;Youssef&quot;)\nd = {nom: len(nom) for nom in T if nom.isalpha()}\nprint(d)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>[1, 2, 3, 10, 20, 30] [2, 4, 6] [11, 22, 33]\n{'titre': &quot;L'Alchimiste&quot;, 'année de publication': 1994, 'éditeur': 'Anne Carrière'}\n{'Amine': 5, 'Souad': 5, 'Youssef': 7}</code></pre><h2>S&#39;exercer</h2>\n<section class=\"exo\"><h3>À refaire seul</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>(TD 2, ex. 5) Somme harmonique pour N = 10, arrondie à 2 décimales ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 2.93</b></p><p>S = Σ 1/i pour i de 1 à 10 ≈ <strong>2.93</strong>.</p>\n</div></div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>(TD 5, ex. 3) Calculer 2 puissance 10 avec une boucle.</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1024</b></p><p>p = 1 ; for i in range(10): p *= 2 → <strong>1024</strong>.</p>\n</div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>(TD 3, ex. 1) Compter les A[i] == B[i] pour A = [1, 2, 3, 4], B = [1, 0, 3, 0].</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 2</b></p><p>Indices 0 et 2 : <strong>2</strong>.</p>\n</div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 6 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">1634 est un nombre d&#39;Armstrong car :</div><button class=\"opt\" data-o=\"0\">1⁴ + 6⁴ + 3⁴ + 4⁴ = 1634</button><button class=\"opt\" data-o=\"1\">1 + 6 + 3 + 4 = 14</button><button class=\"opt\" data-o=\"2\">1634 est premier</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Pour ax + b = 0 avec a = 0 et b ≠ 0 :</div><button class=\"opt\" data-o=\"0\">x = 0</button><button class=\"opt\" data-o=\"1\">pas de solution</button><button class=\"opt\" data-o=\"2\">tout réel est solution</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Jusqu&#39;où tester les diviseurs pour savoir si 97 est premier ?</div><button class=\"opt\" data-o=\"0\">96</button><button class=\"opt\" data-o=\"1\">48</button><button class=\"opt\" data-o=\"2\">9 (car 10² &gt; 97)</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Le signe de a × b sans multiplier, avec a = -2 et b = -7 :</div><button class=\"opt\" data-o=\"0\">positif</button><button class=\"opt\" data-o=\"1\">négatif</button><button class=\"opt\" data-o=\"2\">nul</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\"><code>&quot;level&quot;[::-1] == &quot;level&quot;</code> vaut :</div><button class=\"opt\" data-o=\"0\">True</button><button class=\"opt\" data-o=\"1\">False</button><button class=\"opt\" data-o=\"2\">Erreur</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Pour un tableau de 6 éléments, combien d&#39;échanges pour l&#39;inverser ?</div><button class=\"opt\" data-o=\"0\">6</button><button class=\"opt\" data-o=\"1\">3</button><button class=\"opt\" data-o=\"2\">5</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Δ = b² − 4ac pour x² + 2x + 5 vaut :</div><button class=\"opt\" data-o=\"0\">24</button><button class=\"opt\" data-o=\"1\">-16</button><button class=\"opt\" data-o=\"2\">16</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">La méthode de Héron (TD 2, ex. 6) s&#39;arrête quand :</div><button class=\"opt\" data-o=\"0\">|U(n+1) − Un| &lt; 0.001</button><button class=\"opt\" data-o=\"1\">Un = 0</button><button class=\"opt\" data-o=\"2\">n = 1000</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Un prix de 250 DH avec −10 % devient :</div><button class=\"opt\" data-o=\"0\">240</button><button class=\"opt\" data-o=\"1\">225</button><button class=\"opt\" data-o=\"2\">25</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\"><code>{n: len(n) for n in (&quot;ab&quot;, &quot;cde&quot;)}</code> vaut :</div><button class=\"opt\" data-o=\"0\">{&#39;ab&#39;: 2, &#39;cde&#39;: 3}</button><button class=\"opt\" data-o=\"1\">[2, 3]</button><button class=\"opt\" data-o=\"2\">{2: &#39;ab&#39;, 3: &#39;cde&#39;}</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"td-corriges","rep":["2.93"],"tol":0.01},{"n":"td-corriges","rep":["1024"],"tol":null},{"n":"td-corriges","rep":["2"],"tol":null}],"qcm":[{"n":"td-corriges","q":"1634 est un nombre d&#39;Armstrong car :","o":["1⁴ + 6⁴ + 3⁴ + 4⁴ = 1634","1 + 6 + 3 + 4 = 14","1634 est premier"],"a":0,"e":"4 chiffres, donc puissance 4."},{"n":"td-corriges","q":"Pour ax + b = 0 avec a = 0 et b ≠ 0 :","o":["x = 0","pas de solution","tout réel est solution"],"a":1,"e":"0·x = -b ≠ 0 est impossible."},{"n":"td-corriges","q":"Jusqu&#39;où tester les diviseurs pour savoir si 97 est premier ?","o":["96","48","9 (car 10² &gt; 97)"],"a":2,"e":"Il suffit d&#39;aller jusqu&#39;à √97 ≈ 9,8."},{"n":"td-corriges","q":"Le signe de a × b sans multiplier, avec a = -2 et b = -7 :","o":["positif","négatif","nul"],"a":0,"e":"Même signe → positif."},{"n":"td-corriges","q":"<code>&quot;level&quot;[::-1] == &quot;level&quot;</code> vaut :","o":["True","False","Erreur"],"a":0,"e":"level est un palindrome."},{"n":"td-corriges","q":"Pour un tableau de 6 éléments, combien d&#39;échanges pour l&#39;inverser ?","o":["6","3","5"],"a":1,"e":"On échange jusqu&#39;au milieu : 6 // 2 = 3."},{"n":"td-corriges","q":"Δ = b² − 4ac pour x² + 2x + 5 vaut :","o":["24","-16","16"],"a":1,"e":"4 − 20 = −16 : racines complexes −1 ± 2i."},{"n":"td-corriges","q":"La méthode de Héron (TD 2, ex. 6) s&#39;arrête quand :","o":["|U(n+1) − Un| &lt; 0.001","Un = 0","n = 1000"],"a":0,"e":"Critère d&#39;arrêt de l&#39;énoncé."},{"n":"td-corriges","q":"Un prix de 250 DH avec −10 % devient :","o":["240","225","25"],"a":1,"e":"250 × 0,9."},{"n":"td-corriges","q":"<code>{n: len(n) for n in (&quot;ab&quot;, &quot;cde&quot;)}</code> vaut :","o":["{&#39;ab&#39;: 2, &#39;cde&#39;: 3}","[2, 3]","{2: &#39;ab&#39;, 3: &#39;cde&#39;}"],"a":0,"e":"Clé = le nom, valeur = sa longueur."}]},{"id":"revision-examen","t":"Révision et examen blanc","seance":"Révision · fin de semestre","imp":5,"html":"<aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>Aucune annale n&#39;était fournie. Cet examen blanc est construit à partir des TD 1 à 6 et des exemples du cours, au format habituel d&#39;un examen d&#39;algorithmique de S1 (questions de cours, traces, algorithmes à écrire). Demande au prof le format réel.</p>\n</aside><h2>Fiche de révision en une page</h2>\n<figure class=\"flux\"><figcaption>Le fil du semestre</figcaption><div class=\"flux-l\"><div class=\"flux-b\">Variables et opérateurs</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Si / Selon</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Pour, TantQue, Répéter</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Tableaux</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Tris et recherches</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Python : types, chaînes</div><div class=\"flux-f\">→</div><div class=\"flux-b\">if, match, while, for</div><div class=\"flux-f\">→</div><div class=\"flux-b\">array</div><div class=\"flux-f\">→</div><div class=\"flux-b\">listes, tuples, sets, dicts</div></div></figure><table>\n<thead>\n<tr>\n<th>Pseudo-code</th>\n<th>Python</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>x ← 5</code></td>\n<td><code>x = 5</code></td>\n</tr>\n<tr>\n<td><code>Ecrire(&quot;a =&quot;, a)</code> / <code>Lire(a)</code></td>\n<td><code>print(&quot;a =&quot;, a)</code> / <code>a = int(input())</code></td>\n</tr>\n<tr>\n<td><code>si … alors … sinon si … sinon … finsi</code></td>\n<td><code>if … : … elif … : … else: …</code></td>\n</tr>\n<tr>\n<td><code>pour i ← 0 jusqu&#39;à n − 1 faire</code></td>\n<td><code>for i in range(n):</code></td>\n</tr>\n<tr>\n<td><code>tantque c faire</code></td>\n<td><code>while c:</code></td>\n</tr>\n<tr>\n<td><code>répéter … jusqu&#39;à c</code></td>\n<td><code>while True: … if c: break</code></td>\n</tr>\n<tr>\n<td><code>Tableau T[5] : Entier</code></td>\n<td><code>T = ar.array(&#39;i&#39;, [0]*5)</code> ou une liste</td>\n</tr>\n<tr>\n<td><code>a % b</code>, ET, OU, NON</td>\n<td><code>a % b</code>, <code>and</code>, <code>or</code>, <code>not</code></td>\n</tr>\n</tbody></table>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p>Les 5 algorithmes à savoir écrire les yeux fermés : <strong>somme/moyenne</strong>, <strong>minimum/maximum</strong>, <strong>recherche séquentielle</strong>, <strong>recherche dichotomique</strong>, <strong>un tri</strong> (sélection, bulles ou insertion).</p>\n</aside><h2>Examen blanc (2 h, sans document)</h2>\n<section class=\"exo\"><h3>Partie 1 · Questions de cours (4 pts)</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Cite quatre caractéristiques d&#39;un algorithme.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Entrée/sortie, absence d&#39;ambiguïté, finitude, déterminisme (aussi : généricité, lisibilité, efficacité, indépendance du langage).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Différence entre TantQue et Répéter … jusqu&#39;à ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Répéter s&#39;exécute au moins une fois et s&#39;arrête quand la condition devient vraie ; TantQue teste avant chaque tour et peut ne jamais s&#39;exécuter.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Différence entre une liste et un tuple en Python ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>La liste est modifiable, le tuple ne l&#39;est pas. Les deux sont ordonnés et acceptent les doublons.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><section class=\"exo\"><h3>Partie 2 · Traces (5 pts)</h3><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Que vaut S à la fin de : S ← 0 ; i ← 1 ; tantque i &lt; 10 faire S ← S + i ; i ← i + 3 fin tantque ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 12</b></p><p>i prend 1, 4, 7 (10 n&#39;est pas &lt; 10). S = 1 + 4 + 7 = <strong>12</strong>.</p>\n</div></div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Qu&#39;affiche <code>print(&quot;FSABM S1&quot;[1:5], 17 // 4, 17 % 4)</code> ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>SABM 4 1</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><p>Tableau après la 2e passe du tri par sélection sur [9, 4, 7, 1] ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Passe 0 : [1, 4, 7, 9] (échange 9 et 1). Passe 1 : 4 est déjà le minimum du reste → <strong>[1, 4, 7, 9]</strong>.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><p>Combien de tours fait la recherche dichotomique de 4 dans [-2, 0, 4, 9, 11, 15, 20, 25, 30, 45] ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 3</b></p><p>milieu 4 (11) → gauche ; milieu 1 (0) → droite ; milieu 2 (4) → trouvé : <strong>3</strong> tours.</p>\n</div></div></section><section class=\"exo\"><h3>Partie 3 · Algorithmes et programmes (11 pts)</h3><div class=\"ex\" data-x=\"7\"><div class=\"ex-q\"><p>(3 pts) Écris en pseudo-code un algorithme qui lit N notes dans un tableau puis affiche la moyenne et le nombre de notes ≥ 10.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Lire(N) ; pour i ← 0 jusqu&#39;à N − 1 faire Lire(T[i]) fin pour\ns ← 0 ; nb ← 0\npour i ← 0 jusqu&#39;à N − 1 faire\n  s ← s + T[i]\n  si T[i] &gt;= 10 alors nb ← nb + 1 finsi\nfin pour\nEcrire(&quot;moyenne : &quot;, s / N, &quot; validées : &quot;, nb)</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"8\"><div class=\"ex-q\"><p>(4 pts) Programme Python : lire un entier n ≥ 2 et dire s&#39;il est premier (TD 5, ex. 5).</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>n = int(input(&quot;n = &quot;))\npremier = True\nfor d in range(2, int(n ** 0.5) + 1):\n    if n % d == 0:\n        premier = False\n        break\nprint(n, &quot;est premier&quot; if premier else &quot;n&#39;est pas premier&quot;)</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"9\"><div class=\"ex-q\"><p>(4 pts) Programme Python : à partir d&#39;une phrase, construire un dictionnaire mot → nombre de « s » (TD 6, ex. 6), puis afficher le mot qui en contient le plus.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>phrase = input(&quot;Phrase : &quot;)\nd = {mot: mot.count(&quot;s&quot;) for mot in phrase.lower().split()}\nmeilleur = None\nfor mot, nb in d.items():\n    if meilleur is None or nb &gt; d[meilleur]:\n        meilleur = mot\nprint(d, meilleur)</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><p>Vérification du code de la partie 3 avec des valeurs fixes :</p>\n<pre class=\"\"><code>notes = [12, 8, 15, 9.5, 10]\ns = 0\nnb = 0\nfor x in notes:\n    s += x\n    if x &gt;= 10:\n        nb += 1\nprint(&quot;moyenne :&quot;, s / len(notes), &quot;validées :&quot;, nb)\nphrase = &quot;Les sacs des Etudiants sont lourds&quot;\nd = {mot: mot.count(&quot;s&quot;) for mot in phrase.lower().split()}\nmeilleur = None\nfor mot, n in d.items():\n    if meilleur is None or n &gt; d[meilleur]:\n        meilleur = mot\nprint(meilleur, d[meilleur])</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>moyenne : 10.9 validées : 3\nsacs 2</code></pre><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 6 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\"><code>for i in range(3): print(i, end=&quot;&quot;)</code> affiche :</div><button class=\"opt\" data-o=\"0\">012</button><button class=\"opt\" data-o=\"1\">123</button><button class=\"opt\" data-o=\"2\">0 1 2</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Quelle structure garantit au moins une exécution ?</div><button class=\"opt\" data-o=\"0\">Pour</button><button class=\"opt\" data-o=\"1\">TantQue</button><button class=\"opt\" data-o=\"2\">Répéter … jusqu&#39;à</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\"><code>int(&quot;12&quot;) + 3</code> vaut :</div><button class=\"opt\" data-o=\"0\">15</button><button class=\"opt\" data-o=\"1\">&quot;123&quot;</button><button class=\"opt\" data-o=\"2\">Erreur</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Dans un tableau trié de 16 éléments, la dichotomie fait au plus environ :</div><button class=\"opt\" data-o=\"0\">16 comparaisons</button><button class=\"opt\" data-o=\"1\">5 comparaisons</button><button class=\"opt\" data-o=\"2\">8 comparaisons</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\"><code>len([1, [2, 3], 4])</code> vaut :</div><button class=\"opt\" data-o=\"0\">3</button><button class=\"opt\" data-o=\"1\">4</button><button class=\"opt\" data-o=\"2\">2</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\"><code>&quot;BM&quot;.lower() * 2</code> vaut :</div><button class=\"opt\" data-o=\"0\">&#39;bmbm&#39;</button><button class=\"opt\" data-o=\"1\">&#39;BMBM&#39;</button><button class=\"opt\" data-o=\"2\">Erreur</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Après <code>T = [5, 1]</code> puis <code>T[0], T[1] = T[1], T[0]</code>, T vaut :</div><button class=\"opt\" data-o=\"0\">[1, 5]</button><button class=\"opt\" data-o=\"1\">[5, 1]</button><button class=\"opt\" data-o=\"2\">[1, 1]</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\"><code>not (3 &gt; 2 and 2 &gt; 3)</code> vaut :</div><button class=\"opt\" data-o=\"0\">True</button><button class=\"opt\" data-o=\"1\">False</button><button class=\"opt\" data-o=\"2\">Erreur</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Le tri qui place à chaque passe le minimum en tête est :</div><button class=\"opt\" data-o=\"0\">le tri par sélection</button><button class=\"opt\" data-o=\"1\">le tri à bulles</button><button class=\"opt\" data-o=\"2\">le tri par insertion</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\"><code>{&quot;a&quot;: 1, &quot;a&quot;: 2}</code> donne :</div><button class=\"opt\" data-o=\"0\">{&#39;a&#39;: 2}</button><button class=\"opt\" data-o=\"1\">{&#39;a&#39;: 1}</button><button class=\"opt\" data-o=\"2\">une erreur</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"revision-examen","rep":null,"tol":null},{"n":"revision-examen","rep":null,"tol":null},{"n":"revision-examen","rep":null,"tol":null},{"n":"revision-examen","rep":["12"],"tol":null},{"n":"revision-examen","rep":null,"tol":null},{"n":"revision-examen","rep":null,"tol":null},{"n":"revision-examen","rep":["3"],"tol":null},{"n":"revision-examen","rep":null,"tol":null},{"n":"revision-examen","rep":null,"tol":null},{"n":"revision-examen","rep":null,"tol":null}],"qcm":[{"n":"revision-examen","q":"<code>for i in range(3): print(i, end=&quot;&quot;)</code> affiche :","o":["012","123","0 1 2"],"a":0,"e":"end=&quot;&quot; colle les valeurs."},{"n":"revision-examen","q":"Quelle structure garantit au moins une exécution ?","o":["Pour","TantQue","Répéter … jusqu&#39;à"],"a":2,"e":"Le test est en fin de tour."},{"n":"revision-examen","q":"<code>int(&quot;12&quot;) + 3</code> vaut :","o":["15","&quot;123&quot;","Erreur"],"a":0,"e":"La chaîne est d&#39;abord convertie."},{"n":"revision-examen","q":"Dans un tableau trié de 16 éléments, la dichotomie fait au plus environ :","o":["16 comparaisons","5 comparaisons","8 comparaisons"],"a":1,"e":"16 → 8 → 4 → 2 → 1 : log₂16 + 1."},{"n":"revision-examen","q":"<code>len([1, [2, 3], 4])</code> vaut :","o":["3","4","2"],"a":0,"e":"La sous-liste compte pour un élément."},{"n":"revision-examen","q":"<code>&quot;BM&quot;.lower() * 2</code> vaut :","o":["&#39;bmbm&#39;","&#39;BMBM&#39;","Erreur"],"a":0,"e":"* répète une chaîne."},{"n":"revision-examen","q":"Après <code>T = [5, 1]</code> puis <code>T[0], T[1] = T[1], T[0]</code>, T vaut :","o":["[1, 5]","[5, 1]","[1, 1]"],"a":0,"e":"Échange simultané."},{"n":"revision-examen","q":"<code>not (3 &gt; 2 and 2 &gt; 3)</code> vaut :","o":["True","False","Erreur"],"a":0,"e":"True and False = False, not False = True."},{"n":"revision-examen","q":"Le tri qui place à chaque passe le minimum en tête est :","o":["le tri par sélection","le tri à bulles","le tri par insertion"],"a":0,"e":"Sélection du minimum."},{"n":"revision-examen","q":"<code>{&quot;a&quot;: 1, &quot;a&quot;: 2}</code> donne :","o":["{&#39;a&#39;: 2}","{&#39;a&#39;: 1}","une erreur"],"a":0,"e":"Les clés sont uniques : la dernière valeur l&#39;emporte."}]}];
