fie une vue existante sans la supprimer ?","o":["ALTER VIEW nom_vue AS SELECT …","UPDATE VIEW nom_vue AS SELECT …","CREATE OR REPLACE VIEW nom_vue AS SELECT …","MODIFY VIEW nom_vue AS SELECT …"],"a":2,"e":"Réponse attendue à l&#39;examen 2025. (ALTER VIEW existe aussi en MySQL, mais le cours utilise CREATE OR REPLACE.)"},{"n":"index-vues-utilisateurs","q":"Quelle commande permet de voir tous les privilèges d&#39;un utilisateur ?","o":["DESCRIBE GRANTS FOR &#39;u&#39;@&#39;hôte&#39;;","LIST GRANTS FOR &#39;u&#39;@&#39;hôte&#39;;","SHOW GRANTS FOR &#39;u&#39;@&#39;hôte&#39;;","DISPLAY GRANTS FOR &#39;u&#39;@&#39;hôte&#39;;"],"a":2,"e":"Examen 2025."},{"n":"index-vues-utilisateurs","q":"Comment attribuer tous les privilèges à &#39;youness&#39; sur db_priv ?","o":["GRANT ALL PRIVILEGES ON db_priv.* TO &#39;youness&#39;@&#39;localhost&#39;;","GRANT ALL TO &#39;youness&#39; ON db_priv;","GRANT ALL ON db_priv FOR &#39;youness&#39;;","SET PRIVILEGES * ON db_priv TO &#39;youness&#39;;"],"a":0,"e":"Examen 2025."},{"n":"index-vues-utilisateurs","q":"Un index accélère surtout :","o":["les recherches (WHERE, JOIN, ORDER BY)","les insertions","les suppressions"],"a":0,"e":"Les écritures sont au contraire ralenties."},{"n":"index-vues-utilisateurs","q":"Une vue simple :","o":["stocke une copie figée des données","relit les tables à chaque utilisation","ne peut pas contenir de sous-requête"],"a":1,"e":"C&#39;est une table virtuelle."},{"n":"index-vues-utilisateurs","q":"GRANT UPDATE (note) ON Inscription :","o":["autorise la modification de la seule colonne note","autorise la modification de toutes les colonnes","autorise la lecture de note"],"a":0,"e":"Privilège au niveau colonne (TP4)."},{"n":"index-vues-utilisateurs","q":"Quelle contrainte crée automatiquement un index ?","o":["CHECK","DEFAULT","UNIQUE","NOT NULL"],"a":2,"e":"PRIMARY KEY et UNIQUE s&#39;appuient sur un index."},{"n":"index-vues-utilisateurs","q":"Pour supprimer un index en MySQL :","o":["DROP INDEX idx_nom ON Etudiant;","DELETE INDEX idx_nom;","ALTER INDEX idx_nom DROP;"],"a":0,"e":"En SQLite, on omet ON table."},{"n":"index-vues-utilisateurs","q":"<code>EXPLAIN SELECT …<\/code> en MySQL sert à :","o":["exécuter la requête deux fois","afficher le plan d&#39;exécution (scan complet ou utilisation d&#39;un index)","expliquer une erreur de syntaxe"],"a":1,"e":"On compare le plan avant et après la création d&#39;un index."}]},{"id":"td-tp-corriges","t":"TD et TP corrigés (TD2, TD3, TD4, TP1 à TP4)","seance":"TD 1 à 4 · TP 1 à 4","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Ce chapitre suppose les chapitres 3 à 8. Les TD2 (algèbre) et TD4 (SQL) posent <strong>les mêmes 11 questions<\/strong> sur la même base : compare les deux écritures, c&#39;est le meilleur entraînement pour l&#39;examen.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Quel opérateur de l&#39;algèbre correspond à « tous les livres de Gallimard » ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>La division ÷.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Fais chaque question <strong>toi-même<\/strong> avant de lire la correction, puis exécute la requête (MySQL Workbench, ou n&#39;importe quel SQLite en ligne) et compare avec la sortie affichée ici.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Dans les questions « par auteur » (Q8 à Q10), utiliser <code>JOIN<\/code> au lieu de <code>LEFT JOIN<\/code> fait disparaître les auteurs sans livre (Lopez a 1 livre, mais Youssfi en a 0).<\/p>\n<\/aside><p>À la fin, tu sais résoudre les 11 questions types en algèbre et en SQL, et écrire le script LDD/LMD complet du TD3.<\/p>\n<h2>TD2 et TD4 · la base bibliographique<\/h2>\n<pre class=\"\"><code>CREATE TABLE AUTEUR (IdAuteur VARCHAR(5) PRIMARY KEY, Nom VARCHAR(30), Prenom VARCHAR(30), Nationalite VARCHAR(30));\nCREATE TABLE LIVRE (ISBN VARCHAR(5) PRIMARY KEY, Titre VARCHAR(50), AnneeParution INT, Editeur VARCHAR(30));\nCREATE TABLE REDIGE (IdAuteur VARCHAR(5) REFERENCES AUTEUR(IdAuteur), ISBN VARCHAR(5) REFERENCES LIVRE(ISBN),\n  Role VARCHAR(30), PRIMARY KEY (IdAuteur, ISBN));\nINSERT INTO AUTEUR VALUES ('A1','Benali','Samir','Marocaine'), ('A2','Dupont','Marie','Française'),\n ('A3','Lopez','Carlos','Espagnole'), ('A4','Fadel','Ahmed','Marocaine'), ('A5','Youssfi','Youssef','Belge');\nINSERT INTO LIVRE VALUES ('L1','Apprendre SQL',2020,'Elsevier'), ('L2','Bases de données',2015,'Gallimard'),\n ('L3','Algèbre relationnelle',2022,'Gallimard'), ('L4','Introduction à Python',2019,'Springer');\nINSERT INTO REDIGE VALUES ('A1','L1','Auteur principal'), ('A1','L2','Co-auteur'), ('A2','L2','Auteur principal'),\n ('A3','L4','Auteur principal'), ('A1','L3','Auteur principal'), ('A4','L3','Co-auteur');<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Dans l&#39;énoncé, la ligne A5 est écrite avec des apostrophes typographiques (‘A5’, ‘belge’) et une minuscule : MySQL rejette ‘…’. On écrit &#39;Belge&#39; avec des apostrophes droites.<\/p>\n<\/aside><p><strong>Q1–Q3 · sélections simples<\/strong><\/p>\n<ul>\n<li>Q1 : σ Nationalite=&#39;Marocaine&#39; (AUTEUR)<\/li>\n<li>Q2 : π Titre (σ AnneeParution&gt;2018 (LIVRE))<\/li>\n<li>Q3 : π ISBN, Titre (σ IdAuteur=&#39;A1&#39; (LIVRE ⋈ REDIGE))<\/li>\n<\/ul>\n<pre class=\"\"><code>SELECT IdAuteur, Nom FROM AUTEUR WHERE Nationalite = 'Marocaine';\nSELECT Titre FROM LIVRE WHERE AnneeParution &gt; 2018;\nSELECT L.ISBN, L.Titre FROM LIVRE L JOIN REDIGE R ON L.ISBN = R.ISBN WHERE R.IdAuteur = 'A1';<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>IdAuteur | Nom\nA1 | Benali\nA4 | Fadel\nTitre\nApprendre SQL\nAlgèbre relationnelle\nIntroduction à Python\nISBN | Titre\nL1 | Apprendre SQL\nL2 | Bases de données\nL3 | Algèbre relationnelle<\/code><\/pre><p><strong>Q4–Q6 · jointures à trois tables<\/strong><\/p>\n<ul>\n<li>Q4 : π Nom, Prenom, Titre ((AUTEUR ⋈ REDIGE) ⋈ LIVRE)<\/li>\n<li>Q5 : π Nom, Prenom (σ Editeur=&#39;Gallimard&#39; (LIVRE) ⋈ (AUTEUR ⋈ REDIGE))<\/li>\n<li>Q6 : π Nom, Prenom, Titre (σ AnneeParution&gt;2015 (LIVRE) ⋈ (AUTEUR ⋈ REDIGE))<\/li>\n<\/ul>\n<pre class=\"\"><code>SELECT DISTINCT A.Nom, A.Prenom FROM AUTEUR A\n  JOIN REDIGE R ON A.IdAuteur = R.IdAuteur JOIN LIVRE L ON L.ISBN = R.ISBN\nWHERE L.Editeur = 'Gallimard' ORDER BY A.Nom;\nSELECT A.Nom, L.Titre, L.AnneeParution FROM AUTEUR A\n  JOIN REDIGE R ON A.IdAuteur = R.IdAuteur JOIN LIVRE L ON L.ISBN = R.ISBN\nWHERE L.AnneeParution &gt; 2015 ORDER BY L.AnneeParution;<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Nom | Prenom\nBenali | Samir\nDupont | Marie\nFadel | Ahmed\nNom | Titre | AnneeParution\nLopez | Introduction à Python | 2019\nBenali | Apprendre SQL | 2020\nBenali | Algèbre relationnelle | 2022\nFadel | Algèbre relationnelle | 2022<\/code><\/pre><p><code>DISTINCT<\/code> en Q5 : Benali a deux livres chez Gallimard, il ne doit apparaître qu&#39;une fois (comme avec π).<\/p>\n<p><strong>Q7 · jointure externe gauche<\/strong><\/p>\n<p>AUTEUR ⟕ REDIGE (puis ⟕ LIVRE pour le titre).<\/p>\n<pre class=\"\"><code>SELECT A.Nom, L.Titre FROM AUTEUR A\n  LEFT JOIN REDIGE R ON A.IdAuteur = R.IdAuteur LEFT JOIN LIVRE L ON L.ISBN = R.ISBN\nORDER BY A.IdAuteur, L.ISBN;<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Nom | Titre\nBenali | Apprendre SQL\nBenali | Bases de données\nBenali | Algèbre relationnelle\nDupont | Bases de données\nLopez | Introduction à Python\nFadel | Algèbre relationnelle\nYoussfi | NULL<\/code><\/pre><p><strong>Q8–Q10 · regroupement, tri, filtre de groupe<\/strong><\/p>\n<ul>\n<li>Q8 : γ IdAuteur ; COMPTE(ISBN) → NbLivres (AUTEUR ⟕ REDIGE)<\/li>\n<li>Q9 : τ NbLivres DESC (Q8)<\/li>\n<li>Q10 : σ NbLivres&gt;1 (Q8), puis ⋈ AUTEUR pour le nom<\/li>\n<\/ul>\n<pre class=\"\"><code>SELECT A.Nom, COUNT(R.ISBN) AS NbLivres\nFROM AUTEUR A LEFT JOIN REDIGE R ON A.IdAuteur = R.IdAuteur\nGROUP BY A.IdAuteur, A.Nom\nORDER BY NbLivres DESC, A.Nom;\nSELECT A.Nom, COUNT(R.ISBN) AS NbLivres\nFROM AUTEUR A JOIN REDIGE R ON A.IdAuteur = R.IdAuteur\nGROUP BY A.IdAuteur, A.Nom HAVING COUNT(R.ISBN) &gt; 1;<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Nom | NbLivres\nBenali | 3\nDupont | 1\nFadel | 1\nLopez | 1\nYoussfi | 0\nNom | NbLivres\nBenali | 3<\/code><\/pre><p><code>COUNT(R.ISBN)<\/code> et non <code>COUNT(*)<\/code> : pour Youssfi, la ligne existe (avec NULL), <code>COUNT(*)<\/code> donnerait 1 au lieu de 0.<\/p>\n<p><strong>Q11 · division<\/strong><\/p>\n<p>π IdAuteur, ISBN (REDIGE) ÷ π ISBN (σ Editeur=&#39;Gallimard&#39; (LIVRE))<\/p>\n<pre class=\"\"><code>SELECT A.Nom, A.Prenom FROM AUTEUR A\nWHERE NOT EXISTS (\n  SELECT ISBN FROM LIVRE WHERE Editeur = 'Gallimard'\n  EXCEPT\n  SELECT R.ISBN FROM REDIGE R WHERE R.IdAuteur = A.IdAuteur);<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Nom | Prenom\nBenali | Samir<\/code><\/pre><p>C&#39;est la correction du prof : « il n&#39;existe aucun livre Gallimard que l&#39;auteur n&#39;a pas rédigé ». La version <code>NOT EXISTS … NOT EXISTS<\/code> du chapitre 4 marche aussi sur les MySQL antérieurs à 8.0.31 (sans EXCEPT).<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Dans la correction manuscrite du TD2, la version « avec nom et prénom » de Q11 joint AUTEUR au <strong>diviseur<\/strong> : π Nom, Prenom [π ISBN, IdAuteur (REDIGE) ÷ (π ISBN (σ …(LIVRE)) ⋈ AUTEUR)]. C&#39;est incorrect (le diviseur doit rester π ISBN(…)). Écris plutôt : π Nom, Prenom ((π IdAuteur, ISBN (REDIGE) ÷ π ISBN (σ Editeur=&#39;Gallimard&#39; (LIVRE))) ⋈ AUTEUR).<\/p>\n<\/aside><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>La correction du TD4 groupe par <code>A.IdAuteur<\/code> en affichant <code>A.Nom, A.Prenom<\/code>. MySQL l&#39;accepte (IdAuteur est la clé primaire, donc Nom en dépend), mais grouper sur toutes les colonnes affichées est plus sûr.<\/p>\n<\/aside><h2>TD3 · LDD et LMD complet (BiblioDB)<\/h2>\n<p>La correction du TD3 est un scan peu lisible ; voici le script reconstitué. Version MySQL du prof pour les questions 1, 2, 7 et 10 :<\/p>\n<pre class=\"\"><code>CREATE DATABASE IF NOT EXISTS BiblioDB;\nUSE BiblioDB;\nALTER TABLE Livre MODIFY genre VARCHAR(50);                       -- Q7\nALTER TABLE Auteur MODIFY nationalite VARCHAR(30) NOT NULL;       -- Q10<\/code><\/pre><p>Le reste, exécuté sous SQLite :<\/p>\n<pre class=\"\"><code>-- On repart d'une base vide (SQLite ignore la casse : Auteur = AUTEUR)\nDROP TABLE REDIGE; DROP TABLE LIVRE; DROP TABLE AUTEUR;\nPRAGMA foreign_keys = ON;\nCREATE TABLE Auteur (id_auteur INT PRIMARY KEY, nom VARCHAR(30) NOT NULL, prenom VARCHAR(30) NOT NULL, nationalite VARCHAR(30));\nCREATE TABLE Livre (id_livre INT PRIMARY KEY, titre VARCHAR(30) NOT NULL,\n  annee_parution INT CHECK (annee_parution &gt;= 1900), genre VARCHAR(30));\nCREATE TABLE Rediger (id_auteur INT, id_livre INT, PRIMARY KEY (id_auteur, id_livre),\n  FOREIGN KEY (id_auteur) REFERENCES Auteur(id_auteur) ON DELETE CASCADE,\n  FOREIGN KEY (id_livre) REFERENCES Livre(id_livre) ON DELETE CASCADE);\nALTER TABLE Auteur ADD COLUMN date_naissance DATE;\nALTER TABLE Livre DROP COLUMN genre;\nCREATE UNIQUE INDEX unq_titre ON Livre (titre);\nINSERT INTO Auteur VALUES (1,'Samir','Sami','Française','1954-11-07'), (2,'Youssef','Saad','Marocaine','1945-06-21'),\n (3,'Youness','Rami','Anglaise','1965-06-25'), (4,'Siham','Hanane','Anglaise','1963-06-25');\nINSERT INTO Livre VALUES (101,'Introduction à Python',1992), (102,'Apprendre Java',1999), (103,'Maîtriser SQL',2001);\nINSERT INTO Rediger VALUES (1,101), (1,103), (2,102), (3,101), (4,102), (4,103);\nUPDATE Livre SET annee_parution = 1995 WHERE titre = 'Introduction à Python';\nUPDATE Auteur SET prenom = 'Souad' WHERE id_auteur = 4;\nDELETE FROM Rediger WHERE id_auteur = 2 AND id_livre = 102;\nDELETE FROM Livre WHERE titre = 'Introduction à Python';\nSELECT * FROM Livre;\nSELECT * FROM Rediger;<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>id_livre | titre | annee_parution\n102 | Apprendre Java | 1999\n103 | Maîtriser SQL | 2001\nid_auteur | id_livre\n1 | 103\n4 | 102\n4 | 103<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Différences avec MySQL : (1) Q9 se fait en MySQL par <code>ALTER TABLE Livre ADD CONSTRAINT unq_titre UNIQUE (titre);<\/code> (SQLite n&#39;ajoute pas de contrainte à une table existante, d&#39;où l&#39;index unique) ; (2) Q8 en MySQL : <code>ALTER TABLE Livre DROP genre;<\/code>. Q17 réussit grâce à <code>ON DELETE CASCADE<\/code> : les lignes (1,101) et (3,101) de Rediger disparaissent avec le livre.<\/p>\n<\/aside><h2>TP1 à TP4 · l&#39;essentiel<\/h2>\n<table>\n<thead>\n<tr>\n<th>TP<\/th>\n<th>Thème<\/th>\n<th>Ce qu&#39;il faut savoir refaire<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>TP1<\/td>\n<td>LDD avec MySQL Workbench<\/td>\n<td>CREATE/USE, CHECK <code>niveau IN (&#39;DEUG&#39;,&#39;Licence&#39;,&#39;Master&#39;)<\/code>, ALTER ADD/MODIFY/DROP, contrainte nommée <code>chk_naissance<\/code><\/td>\n<\/tr>\n<tr>\n<td>TP2<\/td>\n<td>LMD + SELECT<\/td>\n<td>INSERT multiple, UPDATE/DELETE ciblés, GROUP BY + HAVING, LIMIT (chapitre 7)<\/td>\n<\/tr>\n<tr>\n<td>TP3<\/td>\n<td>Jointures, sous-requêtes<\/td>\n<td>LEFT JOIN + IS NULL, COUNT par cours, NOT IN, meilleure note par cours (chapitre 8)<\/td>\n<\/tr>\n<tr>\n<td>TP4<\/td>\n<td>Utilisateurs, vues, index<\/td>\n<td>CREATE USER, GRANT colonne, SHOW GRANTS, vue, EXPLAIN avant/après index (chapitre 9)<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Questions de TP<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>(TP1) Ajoute à Etudiant une contrainte nommée chk_naissance : date de naissance avant le 1er janvier 2010 (MySQL).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>ALTER TABLE Etudiant ADD CONSTRAINT chk_naissance CHECK (date_naissance &lt; &#39;2010-01-01&#39;);<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>(TP3 Q10) Liste tous les cours avec leur nombre d&#39;étudiants inscrits (y compris 0).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>SELECT C.nom_cours, COUNT(I.id_etudiant) AS nb FROM Cours C LEFT JOIN Inscription I ON C.id_cours = I.id_cours GROUP BY C.id_cours, C.nom_cours;<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>(TP3 Q13) Noms des étudiants inscrits à au moins deux cours.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>SELECT E.nom FROM Etudiant E JOIN Inscription I ON E.id_etudiant = I.id_etudiant GROUP BY E.id_etudiant, E.nom HAVING COUNT(*) &gt;= 2;<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Combien d&#39;auteurs a renvoyé la requête Q10 (plus d&#39;un livre) sur la base du TD4 ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1<\/b><\/p><p>Seul Benali (3 livres). Fadel, Dupont et Lopez en ont un, Youssfi aucun.<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 6 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Sur la base du TD4, combien de livres a rédigés Benali (A1) ?<\/div><button class=\"opt\" data-o=\"0\">1<\/button><button class=\"opt\" data-o=\"1\">2<\/button><button class=\"opt\" data-o=\"2\">3<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Quels auteurs ont rédigé tous les livres Gallimard (L2, L3) ?<\/div><button class=\"opt\" data-o=\"0\">Benali seulement<\/button><button class=\"opt\" data-o=\"1\">Benali et Fadel<\/button><button class=\"opt\" data-o=\"2\">Benali et Dupont<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Pour Q7 (« tous les auteurs, même sans livre »), il faut :<\/div><button class=\"opt\" data-o=\"0\">INNER JOIN<\/button><button class=\"opt\" data-o=\"1\">LEFT JOIN depuis AUTEUR<\/button><button class=\"opt\" data-o=\"2\">RIGHT JOIN depuis AUTEUR<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">En Q8, Youssfi (aucun livre) avec COUNT(R.ISBN) obtient :<\/div><button class=\"opt\" data-o=\"0\">0<\/button><button class=\"opt\" data-o=\"1\">1<\/button><button class=\"opt\" data-o=\"2\">NULL<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Q10 s&#39;écrit avec :<\/div><button class=\"opt\" data-o=\"0\">WHERE COUNT(ISBN) &gt; 1<\/button><button class=\"opt\" data-o=\"1\">HAVING COUNT(ISBN) &gt; 1<\/button><button class=\"opt\" data-o=\"2\">ORDER BY COUNT(ISBN) &gt; 1<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Dans le TD3, la contrainte annee_parution ≥ 1900 s&#39;écrit :<\/div><button class=\"opt\" data-o=\"0\">CHECK (annee_parution &gt;= 1900)<\/button><button class=\"opt\" data-o=\"1\">UNIQUE (annee_parution)<\/button><button class=\"opt\" data-o=\"2\">DEFAULT 1900<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Q16 du TD3 « supprimez l&#39;association entre Youssef Saad et son livre » vise la table :<\/div><button class=\"opt\" data-o=\"0\">Auteur<\/button><button class=\"opt\" data-o=\"1\">Livre<\/button><button class=\"opt\" data-o=\"2\">Rediger<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Pourquoi « DELETE FROM Livre WHERE id_livre = 101 » réussit-il dans le TD3 corrigé ?<\/div><button class=\"opt\" data-o=\"0\">Les clés étrangères de Rediger sont en ON DELETE CASCADE<\/button><button class=\"opt\" data-o=\"1\">Le livre n&#39;est référencé par personne<\/button><button class=\"opt\" data-o=\"2\">MySQL ignore les clés étrangères<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">π ISBN, Titre (σ IdAuteur=&#39;A1&#39; (LIVRE ⋈ REDIGE)) donne combien de lignes ?<\/div><button class=\"opt\" data-o=\"0\">1<\/button><button class=\"opt\" data-o=\"1\">2<\/button><button class=\"opt\" data-o=\"2\">3<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Dans la Q5 en algèbre, l&#39;équivalent du DISTINCT SQL est assuré par :<\/div><button class=\"opt\" data-o=\"0\">la projection π, qui élimine les doublons<\/button><button class=\"opt\" data-o=\"1\">la sélection σ<\/button><button class=\"opt\" data-o=\"2\">la jointure ⋈<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"td-tp-corriges","rep":null,"tol":null},{"n":"td-tp-corriges","rep":null,"tol":null},{"n":"td-tp-corriges","rep":null,"tol":null},{"n":"td-tp-corriges","rep":null,"tol":null},{"n":"td-tp-corriges","rep":["1"],"tol":null}],"qcm":[{"n":"td-tp-corriges","q":"Sur la base du TD4, combien de livres a rédigés Benali (A1) ?","o":["1","2","3"],"a":2,"e":"L1, L2 et L3."},{"n":"td-tp-corriges","q":"Quels auteurs ont rédigé tous les livres Gallimard (L2, L3) ?","o":["Benali seulement","Benali et Fadel","Benali et Dupont"],"a":0,"e":"Fadel n&#39;a que L3, Dupont que L2."},{"n":"td-tp-corriges","q":"Pour Q7 (« tous les auteurs, même sans livre »), il faut :","o":["INNER JOIN","LEFT JOIN depuis AUTEUR","RIGHT JOIN depuis AUTEUR"],"a":1,"e":"AUTEUR est à gauche et doit être conservé."},{"n":"td-tp-corriges","q":"En Q8, Youssfi (aucun livre) avec COUNT(R.ISBN) obtient :","o":["0","1","NULL"],"a":0,"e":"COUNT(col) ignore le NULL produit par le LEFT JOIN."},{"n":"td-tp-corriges","q":"Q10 s&#39;écrit avec :","o":["WHERE COUNT(ISBN) &gt; 1","HAVING COUNT(ISBN) &gt; 1","ORDER BY COUNT(ISBN) &gt; 1"],"a":1,"e":"Filtre sur un groupe."},{"n":"td-tp-corriges","q":"Dans le TD3, la contrainte annee_parution ≥ 1900 s&#39;écrit :","o":["CHECK (annee_parution &gt;= 1900)","UNIQUE (annee_parution)","DEFAULT 1900"],"a":0,"e":"CHECK impose une condition."},{"n":"td-tp-corriges","q":"Q16 du TD3 « supprimez l&#39;association entre Youssef Saad et son livre » vise la table :","o":["Auteur","Livre","Rediger"],"a":2,"e":"On supprime le lien, pas l&#39;auteur ni le livre."},{"n":"td-tp-corriges","q":"Pourquoi « DELETE FROM Livre WHERE id_livre = 101 » réussit-il dans le TD3 corrigé ?","o":["Les clés étrangères de Rediger sont en ON DELETE CASCADE","Le livre n&#39;est référencé par personne","MySQL ignore les clés étrangères"],"a":0,"e":"Les lignes liées de Rediger sont supprimées automatiquement."},{"n":"td-tp-corriges","q":"π ISBN, Titre (σ IdAuteur=&#39;A1&#39; (LIVRE ⋈ REDIGE)) donne combien de lignes ?","o":["1","2","3"],"a":2,"e":"L1, L2, L3."},{"n":"td-tp-corriges","q":"Dans la Q5 en algèbre, l&#39;équivalent du DISTINCT SQL est assuré par :","o":["la projection π, qui élimine les doublons","la sélection σ","la jointure ⋈"],"a":0,"e":"π travaille sur des ensembles."}]},{"id":"revision-examen","t":"Fiche de révision et examen blanc","seance":"Avant l'examen","imp":3,"html":"<h2>Avant de commencer<\/h2>\n<p>L&#39;examen final 2024-2025 (session ordinaire, 1 h 30) était un <strong>QCM de 30 questions<\/strong> couvrant tout le cours : dépendances fonctionnelles et MCD (≈ 3 questions), normalisation (1), algèbre relationnelle (≈ 7), MySQL et LDD (≈ 10), jointures SQL (2), index, vues, utilisateurs (4), LMD (≈ 3).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Sans regarder : écris le symbole et le rôle de σ, π, ρ, γ, τ, ÷.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>σ sélection (lignes) ; π projection (colonnes) ; ρ renommage ; γ regroupement + agrégats ; τ tri ; ÷ division (« associé à tous »).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Beaucoup de questions portent sur des détails MySQL<\/strong> (port 3306, InnoDB, DROP INDEX pour un UNIQUE, SET, REPLACE, TIMESTAMP). Ce sont des points faciles si tu as relu le chapitre 5 et le chapitre 6.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Les options de l&#39;examen se ressemblent (σ / π / ρ / τ avec la même condition ; ADD COLUMN / INSERT COLUMN). Lis <strong>chaque mot-clé<\/strong> avant de cocher.<\/p>\n<\/aside><p>À la fin, tu as révisé les tableaux clés et passé un examen blanc chronométré dans les conditions de l&#39;annale.<\/p>\n<h2>Idée 1 · Tableaux de survie<\/h2>\n<table>\n<thead>\n<tr>\n<th>Algèbre<\/th>\n<th>SQL<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>σ condition (R)<\/td>\n<td><code>SELECT * FROM R WHERE condition<\/code><\/td>\n<\/tr>\n<tr>\n<td>π a, b (R)<\/td>\n<td><code>SELECT DISTINCT a, b FROM R<\/code><\/td>\n<\/tr>\n<tr>\n<td>ρ S (R)<\/td>\n<td><code>FROM R AS S<\/code><\/td>\n<\/tr>\n<tr>\n<td>R ∪ S / R ∩ S / R − S<\/td>\n<td><code>UNION<\/code> / <code>INTERSECT<\/code> / <code>EXCEPT<\/code><\/td>\n<\/tr>\n<tr>\n<td>R × S<\/td>\n<td><code>FROM R, S<\/code> ou <code>CROSS JOIN<\/code><\/td>\n<\/tr>\n<tr>\n<td>R ⋈ S<\/td>\n<td><code>NATURAL JOIN<\/code> ou <code>JOIN … USING (col)<\/code><\/td>\n<\/tr>\n<tr>\n<td>R ⋈θ S<\/td>\n<td><code>JOIN … ON θ<\/code><\/td>\n<\/tr>\n<tr>\n<td>R ⟕ S / ⟖ / ⟗<\/td>\n<td><code>LEFT JOIN<\/code> / <code>RIGHT JOIN<\/code> / (MySQL) LEFT <code>UNION<\/code> RIGHT<\/td>\n<\/tr>\n<tr>\n<td>R ÷ S<\/td>\n<td>double <code>NOT EXISTS<\/code><\/td>\n<\/tr>\n<tr>\n<td>γ a ; COUNT(b) → n (R)<\/td>\n<td><code>SELECT a, COUNT(b) AS n FROM R GROUP BY a<\/code><\/td>\n<\/tr>\n<tr>\n<td>τ a DESC (R)<\/td>\n<td><code>ORDER BY a DESC<\/code><\/td>\n<\/tr>\n<\/tbody><\/table>\n<figure class=\"grille\"><figcaption>Les familles SQL (examen : « quelle catégorie contient… »)<\/figcaption><table><tr><th>LDD<\/th><th>LMD<\/th><th>LID<\/th><th>LCD<\/th><th>TCL<\/th><\/tr><tr><td>CREATE<\/td><td>INSERT<\/td><td>SELECT<\/td><td class=\"h1\">GRANT<\/td><td>COMMIT<\/td><\/tr><tr><td>ALTER<\/td><td>UPDATE<\/td><td>·<\/td><td class=\"h1\">REVOKE<\/td><td>ROLLBACK<\/td><\/tr><tr><td>DROP, TRUNCATE<\/td><td>DELETE, REPLACE<\/td><td>·<\/td><td>·<\/td><td>·<\/td><\/tr><\/table><\/figure><p><strong>MySQL en 8 réponses<\/strong> : port <strong>3306<\/strong> · moteur <strong>InnoDB<\/strong> · index <strong>B-Tree<\/strong> · DATE <strong>YYYY-MM-DD<\/strong> · CHAR fixe / VARCHAR variable · <code>DROP INDEX<\/code> pour supprimer un UNIQUE · <code>SHOW GRANTS FOR &#39;u&#39;@&#39;h&#39;<\/code> · <code>CREATE OR REPLACE VIEW<\/code>.<\/p>\n<h2>Idée 2 · Les 10 pièges qui coûtent des points<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Revois-les un par un<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/10 · Cardinalités<\/div><p>Elles se lisent du côté de l&#39;entité concernée.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/10 · Clé étrangère au MLD<\/div><p>Côté 1,1 ; N–N → nouvelle table.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/10 · 2NF vs 3NF<\/div><p>2NF = pas de dépendance partielle ; 3NF = pas de dépendance transitive.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/10 · σ vs π<\/div><p>σ filtre des lignes, π garde des colonnes (et supprime les doublons).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/10 · SELECT vs π<\/div><p>SELECT garde les doublons : il faut DISTINCT.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">6/10 · Jointure interne<\/div><p>Une ligne sans correspondance disparaît ; pour la garder, jointure externe.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">7/10 · WHERE vs HAVING<\/div><p>Agrégat → HAVING.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">8/10 · NULL<\/div><p>IS NULL, jamais = NULL ; COUNT(col) ignore les NULL.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">9/10 · UPDATE/DELETE sans WHERE<\/div><p>Toute la table est touchée.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">10/10 · TIMESTAMP DEFAULT CURRENT_TIMESTAMP<\/div><p>Insérer NULL ou rien donne la date/heure du serveur, pas une erreur.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Problème de synthèse (style TD)<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Base : CLIENT(id_client, nom, ville) et COMMANDE(id_cmd, date_cmd, montant, id_client#). Écris en algèbre puis en SQL : les noms des clients de Béni Mellal ayant passé une commande de plus de 1000 DH.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Algèbre : π nom (σ ville=&#39;Béni Mellal&#39; ∧ montant&gt;1000 (CLIENT ⋈ COMMANDE)). SQL : SELECT DISTINCT C.nom FROM CLIENT C JOIN COMMANDE M ON C.id_client = M.id_client WHERE C.ville = &#39;Béni Mellal&#39; AND M.montant &gt; 1000;<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Même base : le chiffre d&#39;affaires total par ville, seulement pour les villes dépassant 5000 DH, du plus grand au plus petit.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>SELECT C.ville, SUM(M.montant) AS ca FROM CLIENT C JOIN COMMANDE M ON C.id_client = M.id_client GROUP BY C.ville HAVING SUM(M.montant) &gt; 5000 ORDER BY ca DESC;<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Même base : les clients n&#39;ayant jamais commandé (deux méthodes).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><ol>\n<li>SELECT C.nom FROM CLIENT C LEFT JOIN COMMANDE M ON C.id_client = M.id_client WHERE M.id_cmd IS NULL; 2) SELECT nom FROM CLIENT WHERE id_client NOT IN (SELECT id_client FROM COMMANDE); En algèbre : π nom ((π id_client (CLIENT) − π id_client (COMMANDE)) ⋈ CLIENT).<\/li>\n<\/ol>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Donne le MLD de : CLIENT 0,N — passe — 1,1 COMMANDE et COMMANDE 1,N — contient (quantité) — 0,N PRODUIT.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>CLIENT(id_client, nom, ville) ; COMMANDE(id_cmd, date_cmd, id_client#) ; PRODUIT(id_produit, libelle, prix) ; CONTIENT(id_cmd#, id_produit#, quantite).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Examen blanc 1/20 · Une relation R(A, B, C, D) a pour clé (A, B) et on a A → C. R est :<\/div><button class=\"opt\" data-o=\"0\">en 3NF<\/button><button class=\"opt\" data-o=\"1\">en 1NF mais pas en 2NF<\/button><button class=\"opt\" data-o=\"2\">en BCNF<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">2/20 · Association Employé 0,1 — affecté — 0,N Projet, sans données. MLD le plus courant :<\/div><button class=\"opt\" data-o=\"0\">Employé(num_emp, …, code_projet#)<\/button><button class=\"opt\" data-o=\"1\">Projet(code_projet, …, num_emp#)<\/button><button class=\"opt\" data-o=\"2\">Obligatoirement Affectation(num_emp#, code_projet#)<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">3/20 · π nom (ÉTUDIANT) sur 3 étudiants dont deux s&#39;appellent Ali renvoie :<\/div><button class=\"opt\" data-o=\"0\">3 lignes<\/button><button class=\"opt\" data-o=\"1\">2 lignes<\/button><button class=\"opt\" data-o=\"2\">1 ligne<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">4/20 · |R| = 4, |S| = 6. Le nombre maximal de lignes de R ⋈ S est :<\/div><button class=\"opt\" data-o=\"0\">10<\/button><button class=\"opt\" data-o=\"1\">24<\/button><button class=\"opt\" data-o=\"2\">6<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">5/20 · R − S = S − R est :<\/div><button class=\"opt\" data-o=\"0\">toujours vrai<\/button><button class=\"opt\" data-o=\"1\">faux en général<\/button><button class=\"opt\" data-o=\"2\">vrai si R et S ont le même schéma<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">6/20 · Quelle requête compte les étudiants par ville ?<\/div><button class=\"opt\" data-o=\"0\">SELECT ville, COUNT(*) FROM etudiant;<\/button><button class=\"opt\" data-o=\"1\">SELECT ville, COUNT(*) FROM etudiant GROUP BY ville;<\/button><button class=\"opt\" data-o=\"2\">SELECT COUNT(ville) FROM etudiant GROUP BY COUNT(*);<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">7/20 · CREATE TABLE Log (id INT PRIMARY KEY AUTO_INCREMENT, horodatage TIMESTAMP DEFAULT CURRENT_TIMESTAMP); INSERT INTO Log (id) VALUES (NULL); SELECT horodatage FROM Log; renvoie :<\/div><button class=\"opt\" data-o=\"0\">NULL<\/button><button class=\"opt\" data-o=\"1\">la date/heure du serveur au moment de l&#39;insertion<\/button><button class=\"opt\" data-o=\"2\">0000-00-00 00:00:00<\/button><button class=\"opt\" data-o=\"3\">une erreur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">8/20 · <code>DELETE FROM Etudiant;<\/code> :<\/div><button class=\"opt\" data-o=\"0\">supprime toutes les lignes mais garde la table<\/button><button class=\"opt\" data-o=\"1\">supprime la table<\/button><button class=\"opt\" data-o=\"2\">ne fait rien sans WHERE<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">9/20 · Pour vérifier qu&#39;une valeur n&#39;existe pas dans une autre table, on peut utiliser :<\/div><button class=\"opt\" data-o=\"0\">IN<\/button><button class=\"opt\" data-o=\"1\">NOT EXISTS<\/button><button class=\"opt\" data-o=\"2\">HAVING<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">10/20 · GRANT SELECT ON ecole.* TO &#39;ali&#39;@&#39;%&#39;; donne à Ali :<\/div><button class=\"opt\" data-o=\"0\">la lecture de toutes les tables de ecole, depuis n&#39;importe quel hôte<\/button><button class=\"opt\" data-o=\"1\">tous les droits sur ecole<\/button><button class=\"opt\" data-o=\"2\">la lecture d&#39;une table nommée *<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"10\"><div class=\"qq-q\">11/20 · Le niveau Merise indépendant de toute technologie est :<\/div><button class=\"opt\" data-o=\"0\">le MCD<\/button><button class=\"opt\" data-o=\"1\">le MLD<\/button><button class=\"opt\" data-o=\"2\">le MPD<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"11\"><div class=\"qq-q\">12/20 · Quel type pour un prix exact en DH ?<\/div><button class=\"opt\" data-o=\"0\">FLOAT<\/button><button class=\"opt\" data-o=\"1\">DECIMAL(10,2)<\/button><button class=\"opt\" data-o=\"2\">VARCHAR(10)<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"12\"><div class=\"qq-q\">13/20 · <code>SELECT nom FROM etudiant WHERE nom LIKE &#39;%a&#39;;<\/code> renvoie les noms :<\/div><button class=\"opt\" data-o=\"0\">commençant par a<\/button><button class=\"opt\" data-o=\"1\">finissant par a<\/button><button class=\"opt\" data-o=\"2\">contenant exactement un a<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"13\"><div class=\"qq-q\">14/20 · Une vue créée avec une condition WHERE prix &gt; (SELECT AVG(prix) …) :<\/div><button class=\"opt\" data-o=\"0\">se recalcule à chaque lecture<\/button><button class=\"opt\" data-o=\"1\">garde la moyenne du jour de sa création<\/button><button class=\"opt\" data-o=\"2\">est interdite (sous-requête)<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"14\"><div class=\"qq-q\">15/20 · Quel opérateur SQL garde les doublons ?<\/div><button class=\"opt\" data-o=\"0\">UNION<\/button><button class=\"opt\" data-o=\"1\">UNION ALL<\/button><button class=\"opt\" data-o=\"2\">INTERSECT<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"15\"><div class=\"qq-q\">16/20 · Dans un MLD, <code>Cours(code_cours, intitulé, num_ens#)<\/code> : num_ens# est :<\/div><button class=\"opt\" data-o=\"0\">la clé primaire de Cours<\/button><button class=\"opt\" data-o=\"1\">une clé étrangère vers Enseignant<\/button><button class=\"opt\" data-o=\"2\">un attribut calculé<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"16\"><div class=\"qq-q\">17/20 · Une table est en BCNF si :<\/div><button class=\"opt\" data-o=\"0\">pour toute DF X → Y, X est une super-clé<\/button><button class=\"opt\" data-o=\"1\">elle n&#39;a pas de clé composée<\/button><button class=\"opt\" data-o=\"2\">elle est en 2NF<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"17\"><div class=\"qq-q\">18/20 · <code>SELECT * FROM A LEFT JOIN B ON A.k = B.k WHERE B.k IS NULL<\/code> renvoie :<\/div><button class=\"opt\" data-o=\"0\">les lignes de A sans correspondance dans B<\/button><button class=\"opt\" data-o=\"1\">les lignes communes<\/button><button class=\"opt\" data-o=\"2\">les lignes de B sans correspondance dans A<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"18\"><div class=\"qq-q\">19/20 · Quelle instruction supprime une base MySQL si elle existe ?<\/div><button class=\"opt\" data-o=\"0\">DELETE DATABASE IF EXISTS b;<\/button><button class=\"opt\" data-o=\"1\">DROP DATABASE IF EXISTS b;<\/button><button class=\"opt\" data-o=\"2\">TRUNCATE DATABASE b;<\/button><div class=\"qq-e\" hidden><\/div><\     const RX = /\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$(?=[^\s$\d])([^$\n]*?[^\s$\\])\$(?!\d)/g;
    // le code (blocs ``` et `…`) n'est jamais lu comme une formule
    return String(t).split(/(```[\s\S]*?(?:```|$))/).map((bloc, i) => i % 2 ? bloc
      : bloc.split(/(`[^`\n]*`)/).map((x, j) => j % 2 ? x : x.replace(RX, (_, a, b, c, d) => a != null ? garde(a, 1) : b != null ? garde(b, 1) : c != null ? garde(c, 0) : garde(d, 0))).join('')).join('');
  };
  const rendreMaths = (h) => h.replace(/\u0000(\d+)\u0000/g, (_, n) => { const m = MATHS[+n]; return m ? `<span class="mzt-tex${m.d ? ' d' : ''}" data-d="${m.d}">${esc(m.tex)}</span>` : ''; });
  const inl = (s) => {
    const p = s.split('`'); if (p.length % 2 === 0) { const last = p.pop(); p[p.length - 1] += '`' + last; }
    return p.map((x, i) => i % 2 ? '<code>' + esc(x) + '</code>' : esc(x).replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*\w])\*([^*\n]+)\*(?![*\w])/g, '$1<em>$2</em>')).join('');
  };
  const cellules = (l) => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim());
  const md = (t) => {
    const out = []; let list = null, code = null, tab = null;
    const flushTab = () => {
      if (!tab) return;
      if (tab.length >= 2 && /^[\s|:-]+$/.test(tab[1]) && tab[1].includes('-')) {
        const [tete, , ...corps] = tab;
        out.push('<div class="mzt-tab"><table><thead><tr>' + cellules(tete).map((c) => '<th>' + inl(c) + '</th>').join('') + '</tr></thead><tbody>'
          + corps.map((r) => '<tr>' + cellules(r).map((c) => '<td>' + inl(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>');
      } else tab.forEach((r) => out.push('<p>' + inl(r) + '</p>'));
      tab = null;
    };
    const flush = () => { flushTab(); if (list) { out.push('</' + list + '>'); list = null; } };
    protegerMaths(t).split('\n').forEach((raw) => {
      if (/^\s*```/.test(raw)) { if (code === null) { flush(); code = []; } else { out.push('<pre>' + esc(code.join('\n')) + '</pre>'); code = null; } return; }
      if (code !== null) { code.push(raw); return; }
      let m;
      if (/^\s*\|.*\|\s*$/.test(raw)) { if (list) { out.push('</' + list + '>'); list = null; } (tab = tab || []).push(raw); return; }
      flushTab();
      if ((m = raw.match(/^\s*#{1,6}\s+(.*)$/))) { flush(); out.push('<p><strong>' + inl(m[1]) + '</strong></p>'); }
      else if ((m = raw.match(/^\s*[-*•]\s+(.*)$/))) { if (list !== 'ul') { flush(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + inl(m[1]) + '</li>'); }
      else if ((m = raw.match(/^\s*\d+[.)]\s+(.*)$/))) { if (list !== 'ol') { flush(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + inl(m[1]) + '</li>'); }
      else if (!raw.trim()) flush();
      else { flush(); out.push('<p>' + inl(raw) + '</p>'); }
    });
    if (code !== null) out.push('<pre>' + esc(code.join('\n')) + '</pre>');
    flush(); return rendreMaths(out.join(''));
  };

  // ---------- MathJax : celui de la page s'il existe, sinon chargé à la première formule ----------
  let mjPret = null;
  const mathjax = () => mjPret || (mjPret = new Promise((ok, ko) => {
    if (!window.MathJax) {
      window.MathJax = { svg: { fontCache: 'global' }, startup: { typeset: false } };
      const s = document.createElement('script'); s.async = true; s.src = 'https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js';
      s.onerror = () => ko(new Error('MathJax')); document.head.appendChild(s);
    }
    let n = 0; const t = setInterval(() => {
      if (window.MathJax && MathJax.tex2svgPromise && MathJax.startup && MathJax.startup.promise) { clearInterval(t); MathJax.startup.promise.then(ok, ko); }
      else if (++n > 150) { clearInterval(t); ko(new Error('MathJax')); }
    }, 100);
  })).catch((e) => { mjPret = null; throw e; });
  const svgCache = new Map(); let file = Promise.resolve();
  function dessinerMaths(racine) {
    const spans = [...racine.querySelectorAll('.mzt-tex:not([data-ok])')]; if (!spans.length) return;
    mathjax().then(() => spans.forEach((sp) => {
      const cle = sp.dataset.d + '|' + sp.textContent;
      const poser = (n) => { if (!sp.isConnected || sp.dataset.ok) return; sp.textContent = ''; sp.appendChild(n.cloneNode(true)); sp.dataset.ok = '1'; };
      if (svgCache.has(cle)) return poser(svgCache.get(cle));
      file = file.then(() => MathJax.tex2svgPromise(sp.textContent, { display: sp.dataset.d === '1' }).then((n) => { svgCache.set(cle, n); poser(n); })).catch(() => {});
    })).catch(() => {});
  }
  async function ask(q, deep) {
    q = (q || '').trim(); deep = deep || $('#mztDeep').checked;
    if (busy || !q) return; if (!sample) { note(); return; }
    const c = refreshCtx();
    if (!cur || (cur.sec !== c.label && !forced)) { cur = { id: 't' + Date.now().toString(36), sec: c.label, date: today(), title: q.slice(0, 80), msgs: [] }; ST.threads.push(cur); }
    else if (!ST.threads.includes(cur)) ST.threads.push(cur);
    cur.msgs.push({ r: 'u', t: q }); busy = true; renderLog();
    const out = document.createElement('div'); out.className = 'mzt-m a'; out.textContent = deep ? 'Réflexion approfondie…' : 'Réflexion…'; $('#mztLog').appendChild(out);
    $('#mztSend').disabled = true; $('#mztStop').hidden = false;
    const style = deep
      ? 'Réponse APPROFONDIE (400 à 700 mots) : 1) l\'intuition avec une analogie, 2) l\'explication détaillée pas à pas, 3) pourquoi ça marche, 4) un exemple complet chiffré, 5) les pièges fréquents et ce qui tombe à l\'examen, 6) une question pour vérifier la compréhension.'
      : 'Réponse EXPLICATIVE (150 à 250 mots) : 1) l\'idée en une phrase, 2) l\'explication pas à pas, 3) un petit exemple chiffré ou concret, 4) une courte question pour vérifier la compréhension.';
    const mem = [];
    if (ST.memos.length) mem.push('DIFFICULTÉS DÉJÀ REPÉRÉES :\n' + ST.memos.slice(-12).map((m) => `- ${m.date} : ${m.text}`).join('\n'));
    const lastQ = ST.threads.flatMap((t) => t.msgs.filter((m) => m.r === 'u').map((m) => `[${t.sec}] ${m.t.slice(0, 100)}`)).slice(-6);
    if (lastQ.length) mem.push('SES DERNIÈRES QUESTIONS :\n' + lastQ.map((x) => '- ' + x).join('\n'));
    const rules = `Tu es le tuteur de ${C.student}, pour le module ${C.module}${C.prof ? ' du ' + C.prof : ''}. Il apprend souvent la notion pour la première fois.
Règles : réponds en français simple, en Markdown léger (**gras** pour les termes clés, tirets, étapes numérotées). Toute formule ou tout calcul s'écrit en LaTeX : $…$ dans la phrase, $$…$$ seul sur sa ligne pour une formule importante (ex. $\\hat y_i$, $$\\text{MSE}=\\frac{1}{n}\\sum_{i=1}^{n}(y_i-\\hat y_i)^2$$) ; jamais d'accents graves pour une formule, ils sont réservés au code et aux noms de fonctions. Un petit tableau Markdown est permis s'il clarifie (3 colonnes maximum, l'écran est étroit). ${style} Appuie-toi d'abord sur l'EXTRAIT ci-dessous et sur les conventions du prof ; si une source générale diffère du cours, signale l'écart et dis quelle version utiliser à l'examen (celle du prof). Pour un calcul, pose chaque étape et vérifie-la. S'il envoie une réponse ou une photo de brouillon, corrige étape par étape et nomme précisément l'erreur. Si tu n'es pas sûr, dis-le. S'il demande un mini-exercice, donne l'exercice sans la solution.
Utilise sa mémoire pour faire des liens avec ses confusions passées, sans la réciter.
Termine TOUJOURS par une dernière ligne séparée au format exact « MÉMO: … » qui résume en 15 mots maximum la difficulté révélée par sa question (ou « MÉMO: rien »). Cette ligne lui est cachée.
${C.conventions ? 'CONVENTIONS DU PROF : ' + C.conventions + '\n' : ''}MÉMOIRE DE L'ÉLÈVE :
${mem.join('\n\n') || '(rien pour l\'instant)'}
EXTRAIT (${c.label}) :
${c.text.slice(0, deep ? 9000 : 3500)}`;
    const recent = cur.msgs.slice(deep ? -9 : -5, -1).map((m) => ({ role: m.r === 'u' ? 'user' : 'assistant', content: m.t }));
    while (recent.length && recent[0].role !== 'user') recent.shift();
    const msgs = [...recent.filter((m) => m.content && m.content.trim()), { role: 'user', content: q }]; while (msgs.length > 1 && msgs[0].role !== 'user') msgs.shift(); msgs[0] = { role: 'user', content: rules + '\n\n---\nQuestion : ' + msgs[0].content };
    ctl = new AbortController();
    const opts = { modelTier: deep ? 'complex' : 'quick', cache: false, signal: ctl.signal, onText: ({ text }) => { out.innerHTML = md(visible(text)); dessinerMaths(out); $('#mztLog').scrollTop = 1e9; } };
    if (img) opts.images = [img];
    try {
      const r = await sample(msgs, opts);
      const mm = r.text.match(/(?:^|\n)\s*M[ÉE]MO\s*:\s*(.+)\s*$/i);
      cur.msgs.push({ r: 'a', t: visible(r.text) + (r.truncated ? '\n\n(Réponse coupée : pose une question plus ciblée.)' : ''), d: !!deep });
      if (mm && !/^\s*rien/i.test(mm[1])) { ST.memos.push({ date: today(), text: mm[1].trim().slice(0, 160) }); if (ST.memos.length > 30) ST.memos.shift(); saveMemos(); }
      await saveThread(cur);
    } catch (e) {
      const kept = e && e.text ? visible(e.text) : '';
      if (e && e.code === 'cancelled') { if (kept) cur.msgs.push({ r: 'a', t: kept + '\n(Arrêté.)' }); else cur.msgs.pop(); }
      else { cur.msgs.pop(); compacter(!!cur.msgs.length); out.textContent = (kept ? kept + '\n\n' : '') + (ERR[e && e.code] || 'Le tuteur n\'a pas pu répondre. Réessaie dans un instant.'); }
      if (!cur.msgs.length) ST.threads = ST.threads.filter((t) => t !== cur);
      saveLocal();
      if (!(e && e.code === 'cancelled')) { busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImgN').textContent = ''; return; }
    }
    busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImg').value = ''; $('#mztImgN').textContent = ''; renderLog();
  }

  // ---------- événements ----------
  $('#mztBtn').onclick = () => openPanel(null);
  $('#mztX').onclick = closePanel;
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#mztPan').hidden) closePanel(); });
  $('#mztTabH').onclick = () => view($('#mztHist').hidden ? 'hist' : 'chat');
  $('#mztTabM').onclick = () => view($('#mztMem').hidden ? 'mem' : 'chat');
  $('#mztQ').oninput = renderList;
  $('#mztList').onclick = (e) => { const id = e.target.dataset && e.target.dataset.cont; if (!id) return; cur = ST.threads.find((t) => t.id === id); view('chat'); $('#mztCtx').textContent = '· ' + cur.sec; renderLog(); };
  $('#mztMemL').onclick = (e) => { const i = e.target.dataset && e.target.dataset.memdel; if (i == null) return; ST.memos.splice(+i, 1); saveMemos(); renderMem(); };
  $('#mztChips').onclick = (e) => { const b = e.target.closest('[data-chip]'); if (!b) return; const t = $('#mztIn'); t.value = b.dataset.chip + (t.value ? ' : ' + t.value : ''); t.focus(); };
  $('#mztNew').onclick = () => { cur = null; renderLog(); };
  $('#mztStop').onclick = () => { if (ctl) ctl.abort(); };
  $('#mztImg').onchange = (e) => { img = e.target.files[0] || null; $('#mztImgN').textContent = img ? 'Photo : ' + img.name : ''; };
  $('#mztF').onsubmit = (e) => { e.preventDefault(); const v = $('#mztIn').value; $('#mztIn').value = ''; ask(v); };
  $('#mztIn').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#mztF').requestSubmit(); } });

  // ---------- capacités (facultatives) ----------
  const W = window.claude;
  if (W && W.use) {
    W.use('sample').then((s) => { sample = s; ready = true; note();
      if (s && s.limits) s.limits().then((l) => { if (l && l.images) { imgOK = true; $('#mztImgL').hidden = false; if (l.images.mediaTypes) $('#mztImg').accept = l.images.mediaTypes.join(','); } }).catch(() => {});
    }).catch(() => { ready = true; note(); });
    Promise.all([W.use('db'), W.use('user')]).then(async ([d, u]) => {
      if (!d || !u) return; const id = await u.id(); if (!id) return; db = d; base = 'data/users/' + id + '/mzt_' + C.id;
      try {
        const m = await db.doc(base).get(); if (m.exists) { const v = m.data() || {}; if (Array.isArray(v.memos)) ST.memos = JSON.parse(JSON.stringify(v.memos)); }
        const q = await db.collection(base + '/threads').get(); const remote = q.docs.map((x) => Object.assign({ id: x.id }, JSON.parse(JSON.stringify(x.data() || {}))));
        const map = {}; [...ST.threads, ...remote].forEach((t) => { if (!map[t.id] || (t.msgs || []).length > (map[t.id].msgs || []).length) map[t.id] = t; });
        ST.threads = Object.values(map).sort((a, b) => parseInt(a.id.slice(1), 36) - parseInt(b.id.slice(1), 36)); saveLocal();
      } catch (e) {}
    }).catch(() => {});
  } else { ready = true; note(); }

  window.MZT = { open: openPanel, close: closePanel };
})();

</script>

if(window.top===window&&location.protocol==="file:"){a.hidden=true;return}
a.href=p.indexOf("/decouvrir")===0||location.pathname.indexOf("/decouvrir")===0?"/decouvrir":"/app/modules";})();</script>
