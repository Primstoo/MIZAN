ENT_TIMESTAMP<\/code>, ni <code>ENGINE<\/code>. On simule ENUM par <code>CHECK (genre IN (&#39;Homme&#39;,&#39;Femme&#39;))<\/code>.<\/p>\n<\/aside><aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p><strong>SET<\/strong> trie et dédoublonne : insérer <code>&#39;A,C,C,B&#39;<\/code> dans <code>SET(&#39;A&#39;,&#39;B&#39;,&#39;C&#39;)<\/code> donne <code>&#39;A,B,C&#39;<\/code>. <code>ON UPDATE CURRENT_TIMESTAMP<\/code> remet le champ à l&#39;heure <strong>à chaque modification<\/strong> de la ligne (questions de l&#39;examen 2025).<\/p>\n<\/aside><h2>Idée 4 · Les contraintes<\/h2>\n<pre class=\"\"><code>PRAGMA foreign_keys = ON;\nCREATE TABLE Formation (\n  code_formation CHAR(5) PRIMARY KEY,\n  nom VARCHAR(50) NOT NULL,\n  niveau VARCHAR(10) CHECK (niveau IN ('DEUG', 'Licence', 'Master'))\n);\nCREATE TABLE Etudiant (\n  code_etud INTEGER PRIMARY KEY,\n  nom VARCHAR(50) NOT NULL,\n  email VARCHAR(100),\n  date_naissance DATE,\n  code_formation CHAR(5),\n  CONSTRAINT un_email UNIQUE (email),\n  CONSTRAINT chk_naissance CHECK (date_naissance &lt; '2010-01-01'),\n  CONSTRAINT fk_formation FOREIGN KEY (code_formation) REFERENCES Formation(code_formation)\n    ON DELETE SET NULL\n);\nINSERT INTO Formation VALUES ('MIA', 'Maths-Info', 'Licence');\nINSERT INTO Etudiant (nom, email, date_naissance, code_formation) VALUES ('Sara', 'sara@usms.ma', '2004-05-02', 'MIA');\nSELECT code_etud, nom, code_formation FROM Etudiant;<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>code_etud | nom | code_formation\n1 | Sara | MIA<\/code><\/pre><table>\n<thead>\n<tr>\n<th>Contrainte<\/th>\n<th>Garantit<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>PRIMARY KEY<\/td>\n<td>unicité + non NULL<\/td>\n<\/tr>\n<tr>\n<td>NOT NULL<\/td>\n<td>valeur obligatoire<\/td>\n<\/tr>\n<tr>\n<td><strong>UNIQUE<\/strong><\/td>\n<td>pas de doublon dans la colonne<\/td>\n<\/tr>\n<tr>\n<td>CHECK<\/td>\n<td>condition sur la valeur<\/td>\n<\/tr>\n<tr>\n<td>DEFAULT<\/td>\n<td>valeur si rien n&#39;est fourni<\/td>\n<\/tr>\n<tr>\n<td>FOREIGN KEY<\/td>\n<td>la valeur existe dans la table référencée (ON DELETE CASCADE / SET NULL / RESTRICT)<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Nommer une contrainte (<code>CONSTRAINT nom …<\/code>) permet de la supprimer plus tard.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>SQLite n&#39;applique les clés étrangères qu&#39;après <code>PRAGMA foreign_keys = ON;<\/code>. En MySQL/InnoDB, elles sont actives par défaut. Le prof utilise <code>AUTO_INCREMENT<\/code> ; en SQLite, <code>INTEGER PRIMARY KEY<\/code> suffit.<\/p>\n<\/aside><h2>Idée 5 · Modifier la structure : ALTER TABLE<\/h2>\n<pre class=\"\"><code>ALTER TABLE Etudiant ADD COLUMN ville VARCHAR(50);\nALTER TABLE Etudiant RENAME COLUMN ville TO ville_naissance;\nALTER TABLE Etudiant DROP COLUMN ville_naissance;\nALTER TABLE Etudiant RENAME TO Apprenant;\nSELECT name FROM sqlite_master WHERE type = 'table' ORDER BY name;<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>name\nApprenant\nFormation<\/code><\/pre><p>Commandes propres à MySQL (non exécutables sous SQLite) :<\/p>\n<pre class=\"\"><code>ALTER TABLE Etudiant ADD ville VARCHAR(50) AFTER prenom;         -- position de la colonne\nALTER TABLE Etudiant MODIFY nom VARCHAR(100) NOT NULL;           -- changer le type\nALTER TABLE Etudiant CHANGE nom nom_complet VARCHAR(100);        -- renommer + retyper\nALTER TABLE Livre ADD CONSTRAINT unq_titre UNIQUE (titre);\nALTER TABLE Livre DROP INDEX unq_titre;                          -- supprimer un UNIQUE\nALTER TABLE Etudiant DROP FOREIGN KEY fk_formation;\nALTER TABLE etudiant AUTO_INCREMENT = 100;\nDESCRIBE Etudiant;\nSHOW CREATE TABLE Etudiant;\nTRUNCATE TABLE Etudiant;   -- vide la table<\/code><\/pre><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>En MySQL, une contrainte UNIQUE est un <strong>index<\/strong> : on la supprime avec <code>ALTER TABLE t DROP INDEX nom_contrainte;<\/code> (question de l&#39;examen 2025).<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices types (TD3, TP1, examen)<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>(TD3 Q4) Crée la table Livre : id_livre clé primaire, titre obligatoire, annee_parution ≥ 1900, genre optionnel.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>CREATE TABLE Livre (id_livre INT PRIMARY KEY, titre VARCHAR(100) NOT NULL, annee_parution INT CHECK (annee_parution &gt;= 1900), genre VARCHAR(30));<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>(TD3 Q7 et Q10) Passe genre à 50 caractères et rends nationalite obligatoire dans Auteur (MySQL).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>ALTER TABLE Livre MODIFY genre VARCHAR(50); puis ALTER TABLE Auteur MODIFY nationalite VARCHAR(30) NOT NULL; (MODIFY redéfinit toute la colonne : type + contraintes).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Différence entre CHAR(10) et VARCHAR(10) pour la valeur &#39;Ali&#39; ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>CHAR(10) stocke toujours 10 caractères (complété par des espaces) ; VARCHAR(10) ne stocke que les 3 caractères utiles (+ la longueur).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 9 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quelle catégorie SQL contient GRANT et REVOKE ?<\/div><button class=\"opt\" data-o=\"0\">DDL<\/button><button class=\"opt\" data-o=\"1\">DML<\/button><button class=\"opt\" data-o=\"2\">TCL<\/button><button class=\"opt\" data-o=\"3\">DCL<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">En MySQL, différence principale entre CHAR(n) et VARCHAR(n) ?<\/div><button class=\"opt\" data-o=\"0\">CHAR pour les nombres, VARCHAR pour le texte<\/button><button class=\"opt\" data-o=\"1\">CHAR a une taille fixe complétée par des espaces, VARCHAR une taille variable<\/button><button class=\"opt\" data-o=\"2\">CHAR accepte les caractères spéciaux, VARCHAR non<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Quelle contrainte garantit qu&#39;une colonne n&#39;a pas de doublons ?<\/div><button class=\"opt\" data-o=\"0\">NOT NULL<\/button><button class=\"opt\" data-o=\"1\">UNIQUE<\/button><button class=\"opt\" data-o=\"2\">NULL<\/button><button class=\"opt\" data-o=\"3\">CHECK<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Comment ajouter une colonne à une table existante ?<\/div><button class=\"opt\" data-o=\"0\">ALTER TABLE nomTable ADD COLUMN nomColonne type;<\/button><button class=\"opt\" data-o=\"1\">ALTER TABLE nomTable INSERT COLUMN nomColonne type;<\/button><button class=\"opt\" data-o=\"2\">UPDATE TABLE nomTable ADD nomColonne type;<\/button><button class=\"opt\" data-o=\"3\">MODIFY TABLE nomTable NEW COLUMN nomColonne type;<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Comment supprimer une contrainte UNIQUE en MySQL ?<\/div><button class=\"opt\" data-o=\"0\">ALTER TABLE t DROP CONSTRAINT nom;<\/button><button class=\"opt\" data-o=\"1\">ALTER TABLE t DROP UNIQUE nom;<\/button><button class=\"opt\" data-o=\"2\">ALTER TABLE t DROP INDEX nom;<\/button><button class=\"opt\" data-o=\"3\">ALTER TABLE t REMOVE UNIQUE nom;<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Port par défaut de MySQL ?<\/div><button class=\"opt\" data-o=\"0\">3000<\/button><button class=\"opt\" data-o=\"1\">8080<\/button><button class=\"opt\" data-o=\"2\">5432<\/button><button class=\"opt\" data-o=\"3\">3306<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Moteur de stockage par défaut de MySQL (versions récentes) ?<\/div><button class=\"opt\" data-o=\"0\">MyISAM<\/button><button class=\"opt\" data-o=\"1\">MEMORY<\/button><button class=\"opt\" data-o=\"2\">InnoDB<\/button><button class=\"opt\" data-o=\"3\">CSV<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Format par défaut du type DATE en MySQL ?<\/div><button class=\"opt\" data-o=\"0\">DD-MM-YYYY<\/button><button class=\"opt\" data-o=\"1\">MM/DD/YYYY<\/button><button class=\"opt\" data-o=\"2\">YYYY-MM-DD<\/button><button class=\"opt\" data-o=\"3\">DD/MM/YY<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Que signifie ON UPDATE CURRENT_TIMESTAMP ?<\/div><button class=\"opt\" data-o=\"0\">Le champ est initialisé à l&#39;insertion seulement<\/button><button class=\"opt\" data-o=\"1\">Le champ est mis à jour à chaque modification de la ligne<\/button><button class=\"opt\" data-o=\"2\">Le champ est supprimé lors des updates<\/button><button class=\"opt\" data-o=\"3\">Le champ devient NULL à chaque update<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">CREATE TABLE Test (valeur SET(&#39;A&#39;,&#39;B&#39;,&#39;C&#39;)); INSERT INTO Test VALUES (&#39;A,C,C,B&#39;); SELECT valeur FROM Test; donne :<\/div><button class=\"opt\" data-o=\"0\">&#39;A,B,C&#39;<\/button><button class=\"opt\" data-o=\"1\">&#39;A,C,C,B&#39;<\/button><button class=\"opt\" data-o=\"2\">&#39;A,C,B&#39;<\/button><button class=\"opt\" data-o=\"3\">Erreur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"10\"><div class=\"qq-q\">DECIMAL(4,2) peut stocker au maximum :<\/div><button class=\"opt\" data-o=\"0\">9999.99<\/button><button class=\"opt\" data-o=\"1\">99.99<\/button><button class=\"opt\" data-o=\"2\">4.2<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"sql-ldd","rep":null,"tol":null},{"n":"sql-ldd","rep":null,"tol":null},{"n":"sql-ldd","rep":null,"tol":null},{"n":"sql-ldd","rep":null,"tol":null}],"qcm":[{"n":"sql-ldd","q":"Quelle catégorie SQL contient GRANT et REVOKE ?","o":["DDL","DML","TCL","DCL"],"a":3,"e":"Examen 2025."},{"n":"sql-ldd","q":"En MySQL, différence principale entre CHAR(n) et VARCHAR(n) ?","o":["CHAR pour les nombres, VARCHAR pour le texte","CHAR a une taille fixe complétée par des espaces, VARCHAR une taille variable","CHAR accepte les caractères spéciaux, VARCHAR non"],"a":1,"e":"Examen 2025."},{"n":"sql-ldd","q":"Quelle contrainte garantit qu&#39;une colonne n&#39;a pas de doublons ?","o":["NOT NULL","UNIQUE","NULL","CHECK"],"a":1,"e":"Examen 2025."},{"n":"sql-ldd","q":"Comment ajouter une colonne à une table existante ?","o":["ALTER TABLE nomTable ADD COLUMN nomColonne type;","ALTER TABLE nomTable INSERT COLUMN nomColonne type;","UPDATE TABLE nomTable ADD nomColonne type;","MODIFY TABLE nomTable NEW COLUMN nomColonne type;"],"a":0,"e":"Examen 2025."},{"n":"sql-ldd","q":"Comment supprimer une contrainte UNIQUE en MySQL ?","o":["ALTER TABLE t DROP CONSTRAINT nom;","ALTER TABLE t DROP UNIQUE nom;","ALTER TABLE t DROP INDEX nom;","ALTER TABLE t REMOVE UNIQUE nom;"],"a":2,"e":"Examen 2025 : UNIQUE est implémenté par un index."},{"n":"sql-ldd","q":"Port par défaut de MySQL ?","o":["3000","8080","5432","3306"],"a":3,"e":"5432 est PostgreSQL, 8080 un port web."},{"n":"sql-ldd","q":"Moteur de stockage par défaut de MySQL (versions récentes) ?","o":["MyISAM","MEMORY","InnoDB","CSV"],"a":2,"e":"Examen 2025."},{"n":"sql-ldd","q":"Format par défaut du type DATE en MySQL ?","o":["DD-MM-YYYY","MM/DD/YYYY","YYYY-MM-DD","DD/MM/YY"],"a":2,"e":"Examen 2025."},{"n":"sql-ldd","q":"Que signifie ON UPDATE CURRENT_TIMESTAMP ?","o":["Le champ est initialisé à l&#39;insertion seulement","Le champ est mis à jour à chaque modification de la ligne","Le champ est supprimé lors des updates","Le champ devient NULL à chaque update"],"a":1,"e":"Examen 2025."},{"n":"sql-ldd","q":"CREATE TABLE Test (valeur SET(&#39;A&#39;,&#39;B&#39;,&#39;C&#39;)); INSERT INTO Test VALUES (&#39;A,C,C,B&#39;); SELECT valeur FROM Test; donne :","o":["&#39;A,B,C&#39;","&#39;A,C,C,B&#39;","&#39;A,C,B&#39;","Erreur"],"a":0,"e":"Examen 2025 : SET range les valeurs dans l&#39;ordre de la définition et supprime les doublons."},{"n":"sql-ldd","q":"DECIMAL(4,2) peut stocker au maximum :","o":["9999.99","99.99","4.2"],"a":1,"e":"4 chiffres en tout, dont 2 après la virgule."}]},{"id":"sql-lmd","t":"SQL · manipuler les données (INSERT, UPDATE, DELETE, REPLACE)","seance":"Séance 8 · 14 avril 2026","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir créer une table avec ses contraintes (chapitre 5) : ce sont elles qui font accepter ou refuser une insertion.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Une table a <code>cne CHAR(10) PRIMARY KEY<\/code>. Que se passe-t-il si on insère deux fois le même CNE ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Erreur de clé dupliquée : la clé primaire impose l&#39;unicité.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Avant chaque UPDATE ou DELETE, écris d&#39;abord le SELECT avec le même WHERE.<\/strong> Tu vois exactement quelles lignes seront touchées.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Oublier le <code>WHERE<\/code> : <code>UPDATE Etudiant SET ville = &#39;Rabat&#39;;<\/code> modifie <strong>toutes<\/strong> les lignes, <code>DELETE FROM Etudiant;<\/code> les supprime <strong>toutes<\/strong>.<\/p>\n<\/aside><p>À la fin, tu sais insérer (une ou plusieurs lignes, depuis un SELECT), gérer les doublons (IGNORE, ON DUPLICATE KEY, REPLACE), modifier et supprimer en respectant les clés étrangères.<\/p>\n<h2>Idée 1 · INSERT sous toutes ses formes<\/h2>\n<pre class=\"\"><code>CREATE TABLE Filiere (id INTEGER PRIMARY KEY, nom VARCHAR(50) UNIQUE NOT NULL);\nCREATE TABLE Etudiant (\n  cne CHAR(10) PRIMARY KEY, nom VARCHAR(50) NOT NULL, prenom VARCHAR(50),\n  age INT DEFAULT 18, ville VARCHAR(50), idFiliere INT REFERENCES Filiere(id));\nINSERT INTO Filiere (nom) VALUES ('Informatique'), ('Mathématiques');\nINSERT INTO Etudiant VALUES ('CNE1234567', 'Sara', 'Souad', 21, 'Agadir', 1);\nINSERT INTO Etudiant (cne, nom, prenom, ville, idFiliere) VALUES ('CNE2233445', 'Omar', 'Hassan', 'Rabat', 1);\nINSERT INTO Etudiant (cne, nom, prenom, age, idFiliere) VALUES ('CNE3344556', 'Youssef', 'Youness', 20, 2),\n                                                              ('CNE4455667', 'Fahd', 'Mouna', 22, 2);\nSELECT * FROM Etudiant;<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>cne | nom | prenom | age | ville | idFiliere\nCNE1234567 | Sara | Souad | 21 | Agadir | 1\nCNE2233445 | Omar | Hassan | 18 | Rabat | 1\nCNE3344556 | Youssef | Youness | 20 | NULL | 2\nCNE4455667 | Fahd | Mouna | 22 | NULL | 2<\/code><\/pre><ul>\n<li>Sans liste de colonnes : il faut <strong>toutes<\/strong> les valeurs, dans l&#39;ordre de la table.<\/li>\n<li>Colonne omise : elle prend sa valeur <strong>DEFAULT<\/strong> (Omar → 18) ou <strong>NULL<\/strong> (ville de Youssef).<\/li>\n<li>Plusieurs lignes en une instruction : <code>VALUES (...), (...)<\/code>.<\/li>\n<\/ul>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le prof écrit aussi <code>VALUES (&#39;CNE2233445&#39;, &#39;Omar&#39;, &#39;Hassan&#39;, DEFAULT, &#39;Rabat&#39;)<\/code> : le mot-clé <strong>DEFAULT dans VALUES<\/strong> marche en MySQL, pas en SQLite (on omet la colonne à la place).<\/p>\n<\/aside><h2>Idée 2 · Les doublons : IGNORE, ON DUPLICATE KEY UPDATE, REPLACE<\/h2>\n<figure class=\"flux\"><figcaption>Clé déjà présente ?<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">INSERT<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">erreur<\/div><\/div><div class=\"flux-l\"><div class=\"flux-b\">INSERT IGNORE<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">ligne ignorée, pas d&#39;erreur<\/div><\/div><div class=\"flux-l\"><div class=\"flux-b\">ON DUPLICATE KEY UPDATE<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">la ligne existante est modifiée<\/div><\/div><div class=\"flux-l\"><div class=\"flux-b\">REPLACE<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">l&#39;ancienne ligne est supprimée puis la nouvelle insérée<\/div><\/div><\/figure><pre class=\"\"><code>INSERT IGNORE INTO Etudiant (cne, nom) VALUES ('CNE1234567', 'Doublon');      -- MySQL\nINSERT INTO Produit (ref, stock) VALUES ('P001', 10)\n  ON DUPLICATE KEY UPDATE stock = stock + 10;                                  -- MySQL<\/code><\/pre><p>Équivalents SQLite, exécutés :<\/p>\n<pre class=\"\"><code>INSERT OR IGNORE INTO Etudiant (cne, nom) VALUES ('CNE1234567', 'Doublon');\nCREATE TABLE Produit (ref TEXT PRIMARY KEY, stock INT);\nINSERT INTO Produit VALUES ('P001', 10);\nINSERT INTO Produit VALUES ('P001', 10) ON CONFLICT(ref) DO UPDATE SET stock = stock + 10;\nREPLACE INTO Etudiant VALUES ('CNE2233445', 'Omar', 'Hassan', 23, 'Fès', 1);\nSELECT nom, age, ville FROM Etudiant WHERE cne IN ('CNE1234567', 'CNE2233445');\nSELECT * FROM Produit;<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>nom | age | ville\nSara | 21 | Agadir\nOmar | 23 | Fès\nref | stock\nP001 | 20<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>MySQL écrit <code>INSERT IGNORE<\/code> et <code>ON DUPLICATE KEY UPDATE<\/code> ; SQLite écrit <code>INSERT OR IGNORE<\/code> et <code>ON CONFLICT(col) DO UPDATE<\/code>. <code>REPLACE INTO<\/code> existe dans les deux, avec le même sens (supprimer puis insérer).<\/p>\n<\/aside><aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p><code>REPLACE<\/code> met à jour l&#39;étudiant s&#39;il existe (en réalité : suppression + insertion) ou l&#39;insère sinon. Les colonnes non fournies reprennent leur DEFAULT, pas l&#39;ancienne valeur ! <code>INSERT DELAYED<\/code> n&#39;est plus supporté par InnoDB (MySQL ≥ 8).<\/p>\n<\/aside><h2>Idée 3 · INSERT … SELECT<\/h2>\n<p>On copie des lignes d&#39;une table vers une autre, avec un filtre :<\/p>\n<pre class=\"\"><code>CREATE TABLE Etudiant_Agadir (cne CHAR(10), nom VARCHAR(50));\nINSERT INTO Etudiant_Agadir (cne, nom)\n  SELECT cne, nom FROM Etudiant WHERE ville IS NOT NULL AND ville = 'Agadir';\nSELECT * FROM Etudiant_Agadir;<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>cne | nom\nCNE1234567 | Sara<\/code><\/pre><p>Pas de mot-clé <code>VALUES<\/code> dans ce cas ; le nombre et les types des colonnes doivent correspondre.<\/p>\n<h2>Idée 4 · UPDATE et DELETE<\/h2>\n<pre class=\"\"><code>UPDATE Etudiant SET age = age + 1, ville = 'Béni Mellal' WHERE cne = 'CNE3344556';\nDELETE FROM Etudiant WHERE age &gt; 22;\nSELECT cne, nom, age, ville FROM Etudiant;<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>cne | nom | age | ville\nCNE1234567 | Sara | 21 | Agadir\nCNE3344556 | Youssef | 21 | Béni Mellal\nCNE4455667 | Fahd | 22 | NULL<\/code><\/pre><figure class=\"etapes\" data-i=\"0\"><figcaption>Une modification sûre<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · Écrire le SELECT<\/div><p>SELECT * FROM Etudiant WHERE cne = &#39;CNE3344556&#39;; → 1 ligne visée.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · Remplacer SELECT * FROM par UPDATE … SET<\/div><p>Garder exactement le même WHERE.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · Vérifier<\/div><p>Relancer le SELECT pour contrôler la nouvelle valeur.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><table>\n<thead>\n<tr>\n<th>Commande<\/th>\n<th>Supprime<\/th>\n<th>WHERE<\/th>\n<th>Remet AUTO_INCREMENT à 1<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>DELETE FROM t WHERE …<\/code><\/td>\n<td>les lignes choisies<\/td>\n<td>oui<\/td>\n<td>non<\/td>\n<\/tr>\n<tr>\n<td><code>TRUNCATE TABLE t<\/code><\/td>\n<td>toutes les lignes<\/td>\n<td>non<\/td>\n<td><strong>oui<\/strong><\/td>\n<\/tr>\n<tr>\n<td><code>DROP TABLE t<\/code><\/td>\n<td>la table entière<\/td>\n<td>non<\/td>\n<td>(table disparue)<\/td>\n<\/tr>\n<\/tbody><\/table>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Avec une clé étrangère, on ne peut pas supprimer une ligne <strong>parente<\/strong> encore référencée (ex. une filière qui a des étudiants), sauf si la clé a été déclarée <code>ON DELETE CASCADE<\/code> ou <code>SET NULL<\/code>. C&#39;est la question 17 du TD3 : « supprimez le livre si c&#39;est possible ».<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices types (TD3, TP2)<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>(TD3 Q14) Corrige l&#39;année de parution de « Introduction à Python » à 1995.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>UPDATE Livre SET annee_parution = 1995 WHERE titre = &#39;Introduction à Python&#39;;<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>(TD3 Q16) Supprime l&#39;association entre l&#39;auteur Youssef Saad (id 2) et son livre.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>DELETE FROM Rediger WHERE id_auteur = 2; (on supprime la ligne de la table associative, pas l&#39;auteur).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>(TD3 Q17) Peut-on supprimer le livre 101 alors qu&#39;il est référencé dans Rediger ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Oui seulement si la clé étrangère de Rediger vers Livre est en ON DELETE CASCADE (c&#39;est le cas dans la correction du TD3) : les lignes de Rediger sont supprimées avec lui. Sinon, MySQL refuse (erreur de contrainte de clé étrangère).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 7 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Que fait REPLACE INTO Etudiant VALUES (5, &#39;Karim&#39;, NULL, DEFAULT, 15.5); ?<\/div><button class=\"opt\" data-o=\"0\">Insère toujours un nouvel étudiant<\/button><button class=\"opt\" data-o=\"1\">Supprime l&#39;étudiant 5<\/button><button class=\"opt\" data-o=\"2\">Génère une erreur à cause de NULL<\/button><button class=\"opt\" data-o=\"3\">Met à jour (supprime puis réinsère) l&#39;étudiant 5 s&#39;il existe, sinon l&#39;insère<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Une colonne omise dans un INSERT avec liste de colonnes prend :<\/div><button class=\"opt\" data-o=\"0\">sa valeur DEFAULT, ou NULL s&#39;il n&#39;y en a pas<\/button><button class=\"opt\" data-o=\"1\">toujours 0<\/button><button class=\"opt\" data-o=\"2\">la valeur de la ligne précédente<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\"><code>UPDATE Etudiant SET ville = &#39;Rabat&#39;;<\/code> :<\/div><button class=\"opt\" data-o=\"0\">ne modifie rien sans WHERE<\/button><button class=\"opt\" data-o=\"1\">modifie toutes les lignes<\/button><button class=\"opt\" data-o=\"2\">provoque une erreur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Quelle commande vide une table et remet l&#39;auto-incrément à zéro ?<\/div><button class=\"opt\" data-o=\"0\">DELETE FROM t;<\/button><button class=\"opt\" data-o=\"1\">TRUNCATE TABLE t;<\/button><button class=\"opt\" data-o=\"2\">DROP TABLE t;<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Équivalent SQLite de INSERT IGNORE :<\/div><button class=\"opt\" data-o=\"0\">INSERT OR IGNORE<\/button><button class=\"opt\" data-o=\"1\">INSERT SKIP<\/button><button class=\"opt\" data-o=\"2\">IGNORE INSERT<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">INSERT INTO Produit VALUES (&#39;P001&#39;, 10) ON DUPLICATE KEY UPDATE stock = stock + 10; alors que P001 a un stock de 10 :<\/div><button class=\"opt\" data-o=\"0\">stock = 10<\/button><button class=\"opt\" data-o=\"1\">stock = 20<\/button><button class=\"opt\" data-o=\"2\">erreur de doublon<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Pour INSERT … SELECT :<\/div><button class=\"opt\" data-o=\"0\">on écrit VALUES (SELECT …)<\/button><button class=\"opt\" data-o=\"1\">on écrit le SELECT directement après la liste de colonnes<\/button><button class=\"opt\" data-o=\"2\">le SELECT doit renvoyer une seule ligne<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Supprimer une filière référencée par des étudiants (clé étrangère sans option) :<\/div><button class=\"opt\" data-o=\"0\">est refusé<\/button><button class=\"opt\" data-o=\"1\">supprime aussi les étudiants<\/button><button class=\"opt\" data-o=\"2\">met les étudiants à NULL<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">INSERT DELAYED en MySQL 8 avec InnoDB :<\/div><button class=\"opt\" data-o=\"0\">est le mode par défaut<\/button><button class=\"opt\" data-o=\"1\">n&#39;est plus supporté<\/button><button class=\"opt\" data-o=\"2\">accélère toujours les insertions<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Plusieurs lignes en un seul INSERT s&#39;écrivent :<\/div><button class=\"opt\" data-o=\"0\">VALUES (…), (…), (…)<\/button><button class=\"opt\" data-o=\"1\">VALUES (…); VALUES (…)<\/button><button class=\"opt\" data-o=\"2\">INSERT MULTI<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"sql-lmd","rep":null,"tol":null},{"n":"sql-lmd","rep":null,"tol":null},{"n":"sql-lmd","rep":null,"tol":null},{"n":"sql-lmd","rep":null,"tol":null}],"qcm":[{"n":"sql-lmd","q":"Que fait REPLACE INTO Etudiant VALUES (5, &#39;Karim&#39;, NULL, DEFAULT, 15.5); ?","o":["Insère toujours un nouvel étudiant","Supprime l&#39;étudiant 5","Génère une erreur à cause de NULL","Met à jour (supprime puis réinsère) l&#39;étudiant 5 s&#39;il existe, sinon l&#39;insère"],"a":3,"e":"Examen 2025."},{"n":"sql-lmd","q":"Une colonne omise dans un INSERT avec liste de colonnes prend :","o":["sa valeur DEFAULT, ou NULL s&#39;il n&#39;y en a pas","toujours 0","la valeur de la ligne précédente"],"a":0,"e":"Si elle est NOT NULL sans DEFAULT, MySQL strict refuse l&#39;insertion."},{"n":"sql-lmd","q":"<code>UPDATE Etudiant SET ville = &#39;Rabat&#39;;<\/code> :","o":["ne modifie rien sans WHERE","modifie toutes les lignes","provoque une erreur"],"a":1,"e":"Le WHERE est facultatif : c&#39;est le piège classique."},{"n":"sql-lmd","q":"Quelle commande vide une table et remet l&#39;auto-incrément à zéro ?","o":["DELETE FROM t;","TRUNCATE TABLE t;","DROP TABLE t;"],"a":1,"e":"DROP supprime aussi la structure."},{"n":"sql-lmd","q":"Équivalent SQLite de INSERT IGNORE :","o":["INSERT OR IGNORE","INSERT SKIP","IGNORE INSERT"],"a":0,"e":"Même effet, autre syntaxe."},{"n":"sql-lmd","q":"INSERT INTO Produit VALUES (&#39;P001&#39;, 10) ON DUPLICATE KEY UPDATE stock = stock + 10; alors que P001 a un stock de 10 :","o":["stock = 10","stock = 20","erreur de doublon"],"a":1,"e":"La ligne existante est mise à jour."},{"n":"sql-lmd","q":"Pour INSERT … SELECT :","o":["on écrit VALUES (SELECT …)","on écrit le SELECT directement après la liste de colonnes","le SELECT doit renvoyer une seule ligne"],"a":1,"e":"Le SELECT peut renvoyer plusieurs lignes."},{"n":"sql-lmd","q":"Supprimer une filière référencée par des étudiants (clé étrangère sans option) :","o":["est refusé","supprime aussi les étudiants","met les étudiants à NULL"],"a":0,"e":"Le comportement par défaut est RESTRICT / NO ACTION."},{"n":"sql-lmd","q":"INSERT DELAYED en MySQL 8 avec InnoDB :","o":["est le mode par défaut","n&#39;est plus supporté","accélère toujours les insertions"],"a":1,"e":"Remarque de la séance 8."},{"n":"sql-lmd","q":"Plusieurs lignes en un seul INSERT s&#39;écrivent :","o":["VALUES (…), (…), (…)","VALUES (…); VALUES (…)","INSERT MULTI"],"a":0,"e":"Syntaxe standard."}]},{"id":"sql-select","t":"SQL · interroger une table (SELECT, WHERE, GROUP BY, HAVING)","seance":"Séance 9 · 20 avril 2026","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut connaître σ, π et γ (chapitres 3 et 4) : SELECT n&#39;en est que la version SQL.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Traduis π nom (σ ville=&#39;Rabat&#39; (ETUDIANT)) en SQL.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>SELECT DISTINCT nom FROM Etudiant WHERE ville = &#39;Rabat&#39;; (WHERE = σ, liste de colonnes = π, DISTINCT pour l&#39;élimination des doublons).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Lis une requête dans l&#39;ordre où le SGBD l&#39;exécute<\/strong> : FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT. Ça explique presque toutes les erreurs.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Mettre une fonction d&#39;agrégation dans le WHERE (<code>WHERE AVG(moyenne) &gt; 12<\/code>). Le WHERE filtre les <strong>lignes avant<\/strong> le regroupement ; pour filtrer des <strong>groupes<\/strong>, c&#39;est <strong>HAVING<\/strong>.<\/p>\n<\/aside><p>À la fin, tu sais filtrer, trier, limiter, regrouper et filtrer des groupes en SQL.<\/p>\n<h2>Idée 1 · La base de travail (TP2)<\/h2>\n<pre class=\"\"><code>CREATE TABLE filiere (id_filiere INTEGER PRIMARY KEY, nom_filiere VARCHAR(100) UNIQUE NOT NULL, departement VARCHAR(100) NOT NULL);\nCREATE TABLE etudiant (id_etudiant INTEGER PRIMARY KEY, nom VARCHAR(50) NOT NULL, prenom VARCHAR(50) NOT NULL,\n  niveau VARCHAR(10) NOT NULL, moyenne DECIMAL(4,2), ville VARCHAR(50), id_filiere INT REFERENCES filiere(id_filiere));\nINSERT INTO filiere (nom_filiere, departement) VALUES ('Informatique','Sciences'), ('Mathématiques','Sciences'),\n ('Physique','Sciences'), ('Génie Civil','Technologie'), ('Électronique','Technologie'),\n ('Biologie','Sciences de la Vie'), ('Chimie','Sciences de la Vie');\nINSERT INTO etudiant (nom, prenom, niveau, moyenne, ville, id_filiere) VALUES\n ('Sara','Sara','L1',15.50,'Casablanca',1), ('Youssef','Youssef','L2',13.20,'Rabat',2),\n ('Kamal','Hind','L3',12.80,'Béni Mellal',1), ('Sami','Omar','M1',17.00,'Marrakech',3),\n ('Said','Amal','M2',11.50,'Agadir',4), ('Rami','Hamza','L1',14.00,'Tanger',5),\n ('Souad','Mouna','L2',16.20,'Meknès',1), ('Hanane','Imane','M1',NULL,'Tétouan',6),\n ('Saad','Anas','M2',18.30,NULL,7), ('Salma','Rania','L3',12.50,'Khouribga',2);\nSELECT COUNT(*) AS nb_etudiants FROM etudiant;<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>nb_etudiants\n10<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Dans le script d&#39;insertion du TP2, deux apostrophes sont fautives : <code>(&#39;Youssef, &#39;Youssef&#39;, …)<\/code> (guillemet fermant manquant) et des apostrophes typographiques ‘…’ autour de &#39;Sara&#39; et &#39;Béni Mellal&#39;. MySQL refuse ces lignes : on les a corrigées ici.<\/p>\n<\/aside><h2>Idée 2 · Colonnes, alias, DISTINCT<\/h2>\n<pre class=\"\"><code>SELECT DISTINCT niveau FROM etudiant ORDER BY niveau;\nSELECT nom AS lastName, moyenne * 1.1 AS moyenne_bonus FROM etudiant WHERE id_etudiant &lt;= 2;<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>niveau\nL1\nL2\nL3\nM1\nM2\nlastName | moyenne_bonus\nSara | 17.05\nYoussef | 14.52<\/code><\/pre><p><code>AS<\/code> est facultatif (<code>SELECT nom lastName<\/code>). Alias de table : <code>FROM etudiant AS e<\/code> puis <code>e.nom<\/code>.<\/p>\n<h2>Idée 3 · WHERE : les opérateurs<\/h2>\n<table>\n<thead>\n<tr>\n<th>Opérateur<\/th>\n<th>Exemple<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>=, &lt;&gt;, &lt;, &gt;, &lt;=, &gt;=<\/td>\n<td><code>age &lt;&gt; 20<\/code><\/td>\n<\/tr>\n<tr>\n<td>AND, OR, NOT<\/td>\n<td><code>ville = &#39;Tanger&#39; AND (moyenne &gt; 13 OR moyenne IS NULL)<\/code><\/td>\n<\/tr>\n<tr>\n<td>BETWEEN a AND b (<strong>bornes incluses<\/strong>)<\/td>\n<td><code>moyenne BETWEEN 12 AND 15<\/code><\/td>\n<\/tr>\n<tr>\n<td>IN (liste)<\/td>\n<td><code>ville IN (&#39;Agadir&#39;, &#39;Rabat&#39;)<\/code><\/td>\n<\/tr>\n<tr>\n<td>LIKE motif<\/td>\n<td><code>%<\/code> = n&#39;importe quelle suite, <code>_<\/code> = <strong>un<\/strong> caractère<\/td>\n<\/tr>\n<tr>\n<td>IS NULL / IS NOT NULL<\/td>\n<td>jamais <code>= NULL<\/code><\/td>\n<\/tr>\n<\/tbody><\/table>\n<pre class=\"\"><code>SELECT nom, moyenne FROM etudiant WHERE moyenne BETWEEN 12 AND 15 ORDER BY moyenne;\nSELECT nom FROM etudiant WHERE nom LIKE 'S_a%';\nSELECT nom FROM etudiant WHERE moyenne IS NULL OR ville IS NULL;<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>nom | moyenne\nSalma | 12.5\nKamal | 12.8\nYoussef | 13.2\nRami | 14\nnom\nSaad\nnom\nHanane\nSaad<\/code><\/pre><p><code>&#39;S_a%&#39;<\/code> : un S, <strong>exactement un<\/strong> caractère quelconque, un a, puis n&#39;importe quoi. Saad (S-a-<strong>a<\/strong>-d) passe ; Said (S-a-<strong>i<\/strong>) et Sara (S-a-<strong>r<\/strong>) non. LIKE n&#39;est sensible à la casse ni en MySQL (collation par défaut) ni en SQLite pour les lettres ASCII.<\/p>\n<aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p><code>WHERE moyenne = NULL<\/code> ne renvoie <strong>jamais<\/strong> rien : toute comparaison avec NULL donne « inconnu ». Utilise <code>IS NULL<\/code>.<\/p>\n<\/aside><h2>Idée 4 · ORDER BY et LIMIT<\/h2>\n<pre class=\"\"><code>SELECT nom, moyenne FROM etudiant WHERE moyenne IS NOT NULL ORDER BY moyenne DESC LIMIT 3;\nSELECT nom FROM etudiant ORDER BY id_etudiant LIMIT 2, 3;<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>nom | moyenne\nSaad | 18.3\nSami | 17\nSouad | 16.2\nnom\nKamal\nSami\nSaid<\/code><\/pre><ul>\n<li><code>ORDER BY col1 ASC, col2 DESC<\/code> : tri sur plusieurs critères (ASC par défaut).<\/li>\n<li><code>LIMIT n<\/code> : les n premières lignes ; <code>LIMIT début, n<\/code> : saute <code>début<\/code> lignes puis en prend n (ici les 3e, 4e, 5e).<\/li>\n<\/ul>\n<h2>Idée 5 · Agrégats, GROUP BY, HAVING<\/h2>\n<pre class=\"\"><code>SELECT niveau, COUNT(*) AS nb, COUNT(moyenne) AS nb_notes, ROUND(AVG(moyenne), 2) AS moy\nFROM etudiant GROUP BY niveau ORDER BY niveau;<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>niveau | nb | nb_notes | moy\nL1 | 2 | 2 | 14.75\nL2 | 2 | 2 | 14.7\nL3 | 2 | 2 | 12.65\nM1 | 2 | 1 | 17.0\nM2 | 2 | 2 | 14.9<\/code><\/pre><p><code>COUNT(*)<\/code> compte les lignes, <code>COUNT(moyenne)<\/code> ignore les NULL (M1 : 2 étudiants, 1 note). AVG, SUM, MIN, MAX ignorent aussi les NULL.<\/p>\n<pre class=\"\"><code>SELECT f.nom_filiere, COUNT(*) AS nb\nFROM etudiant e JOIN filiere f ON e.id_filiere = f.id_filiere\nGROUP BY f.nom_filiere\nHAVING COUNT(*) &gt;= 2\nORDER BY nb DESC;<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>nom_filiere | nb\nInformatique | 3\nMathématiques | 2<\/code><\/pre><figure class=\"etapes\" data-i=\"0\"><figcaption>Ordre d'exécution d'un SELECT complet<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/6 · FROM / JOIN<\/div><p>On construit la table de départ.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/6 · WHERE<\/div><p>On filtre les lignes (pas d&#39;agrégat ici).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/6 · GROUP BY<\/div><p>On forme les groupes.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/6 · HAVING<\/div><p>On filtre les groupes (agrégats permis).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/6 · SELECT<\/div><p>On calcule les colonnes et les alias.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">6/6 · ORDER BY puis LIMIT<\/div><p>On trie, puis on coupe.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Toute colonne du SELECT qui n&#39;est pas dans une fonction d&#39;agrégation doit figurer dans le GROUP BY (MySQL l&#39;impose avec le mode ONLY_FULL_GROUP_BY, actif par défaut depuis 5.7).<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices types (TP2, examen)<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Que fait <code>SELECT * FROM utilisateur WHERE email LIKE &#39;_.%@gmail.com&#39;;<\/code> ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Elle sélectionne les emails qui commencent par un caractère, puis un point, puis n&#39;importe quoi, et finissent par @gmail.com (ex. <a href=\"mailto:a.benali@gmail.com\">a.benali@gmail.com<\/a>). Question de l&#39;examen 2025.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>(TP2) Moyenne générale des étudiants par filière, seulement pour les filières dont la moyenne dépasse 14.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>SELECT id_filiere, AVG(moyenne) AS moy FROM etudiant GROUP BY id_filiere HAVING AVG(moyenne) &gt; 14;<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>(TP2) Les 3 meilleurs étudiants.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>SELECT nom, prenom, moyenne FROM etudiant ORDER BY moyenne DESC LIMIT 3; → Saad (18.3), Sami (17), Souad (16.2).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Que sélectionne <code>WHERE email LIKE &#39;_.%@gmail.com&#39;<\/code> ?<\/div><button class=\"opt\" data-o=\"0\">Tous les emails Gmail<\/button><button class=\"opt\" data-o=\"1\">Les emails avec un seul caractère avant le @<\/button><button class=\"opt\" data-o=\"2\">Les emails avec un caractère, un point, puis n&#39;importe quoi avant @gmail.com<\/button><button class=\"opt\" data-o=\"3\">Les emails finissant par .gmail.com<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Pour garder les filières ayant plus de 2 étudiants :<\/div><button class=\"opt\" data-o=\"0\">WHERE COUNT(*) &gt; 2<\/button><button class=\"opt\" data-o=\"1\">HAVING COUNT(*) &gt; 2<\/button><button class=\"opt\" data-o=\"2\">ORDER BY COUNT(*) &gt; 2<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\"><code>moyenne BETWEEN 12 AND 15<\/code> inclut-il 12 et 15 ?<\/div><button class=\"opt\" data-o=\"0\">Oui, les deux bornes<\/button><button class=\"opt\" data-o=\"1\">Non, aucune<\/button><button class=\"opt\" data-o=\"2\">Seulement 12<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Quelle requête trouve les étudiants sans moyenne ?<\/div><button class=\"opt\" data-o=\"0\">WHERE moyenne = NULL<\/button><button class=\"opt\" data-o=\"1\">WHERE moyenne IS NULL<\/button><button class=\"opt\" data-o=\"2\">WHERE moyenne = 0<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Sur 10 étudiants dont un sans moyenne, COUNT(moyenne) vaut :<\/div><button class=\"opt\" data-o=\"0\">10<\/button><button class=\"opt\" data-o=\"1\">9<\/button><button class=\"opt\" data-o=\"2\">NULL<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\"><code>ORDER BY note DESC LIMIT 3<\/code> renvoie :<\/div><button class=\"opt\" data-o=\"0\">les 3 meilleures notes<\/button><button class=\"opt\" data-o=\"1\">les 3 plus faibles<\/button><button class=\"opt\" data-o=\"2\">les lignes 3 et suivantes<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Quelle clause s&#39;exécute en premier ?<\/div><button class=\"opt\" data-o=\"0\">FROM<\/button><button class=\"opt\" data-o=\"1\">SELECT<\/button><button class=\"opt\" data-o=\"2\">WHERE<\/button><button class=\"opt\" data-o=\"3\">ORDER BY<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\"><code>SELECT nom lastName FROM etudiant;<\/code> :<\/div><button class=\"opt\" data-o=\"0\">provoque une erreur<\/button><button class=\"opt\" data-o=\"1\">affiche la colonne nom sous l&#39;alias lastName<\/button><button class=\"opt\" data-o=\"2\">sélectionne deux colonnes<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Le mot-clé qui supprime les doublons d&#39;un résultat :<\/div><button class=\"opt\" data-o=\"0\">UNIQUE<\/button><button class=\"opt\" data-o=\"1\">DISTINCT<\/button><button class=\"opt\" data-o=\"2\">ONLY<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\"><code>WHERE ville IN (&#39;Agadir&#39;, &#39;Rabat&#39;)<\/code> équivaut à :<\/div><button class=\"opt\" data-o=\"0\">ville = &#39;Agadir&#39; OR ville = &#39;Rabat&#39;<\/button><button class=\"opt\" data-o=\"1\">ville = &#39;Agadir&#39; AND ville = &#39;Rabat&#39;<\/button><button class=\"opt\" data-o=\"2\">ville BETWEEN &#39;Agadir&#39; AND &#39;Rabat&#39;<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"sql-select","rep":null,"tol":null},{"n":"sql-select","rep":null,"tol":null},{"n":"sql-select","rep":null,"tol":null},{"n":"sql-select","rep":null,"tol":null}],"qcm":[{"n":"sql-select","q":"Que sélectionne <code>WHERE email LIKE &#39;_.%@gmail.com&#39;<\/code> ?","o":["Tous les emails Gmail","Les emails avec un seul caractère avant le @","Les emails avec un caractère, un point, puis n&#39;importe quoi avant @gmail.com","Les emails finissant par .gmail.com"],"a":2,"e":"Examen 2025."},{"n":"sql-select","q":"Pour garder les filières ayant plus de 2 étudiants :","o":["WHERE COUNT(*) &gt; 2","HAVING COUNT(*) &gt; 2","ORDER BY COUNT(*) &gt; 2"],"a":1,"e":"Filtre sur un groupe → HAVING."},{"n":"sql-select","q":"<code>moyenne BETWEEN 12 AND 15<\/code> inclut-il 12 et 15 ?","o":["Oui, les deux bornes","Non, aucune","Seulement 12"],"a":0,"e":"BETWEEN est inclusif."},{"n":"sql-select","q":"Quelle requête trouve les étudiants sans moyenne ?","o":["WHERE moyenne = NULL","WHERE moyenne IS NULL","WHERE moyenne = 0"],"a":1,"e":"= NULL n&#39;est jamais vrai."},{"n":"sql-select","q":"Sur 10 étudiants dont un sans moyenne, COUNT(moyenne) vaut :","o":["10","9","NULL"],"a":1,"e":"COUNT(col) ignore les NULL."},{"n":"sql-select","q":"<code>ORDER BY note DESC LIMIT 3<\/code> renvoie :","o":["les 3 meilleures notes","les 3 plus faibles","les lignes 3 et suivantes"],"a":0,"e":"DESC = décroissant."},{"n":"sql-select","q":"Quelle clause s&#39;exécute en premier ?","o":["FROM","SELECT","WHERE","ORDER BY"],"a":0,"e":"On ne peut filtrer que ce qui a été lu."},{"n":"sql-select","q":"<code>SELECT nom lastName FROM etudiant;<\/code> :","o":["provoque une erreur","affiche la colonne nom sous l&#39;alias lastName","sélectionne deux colonnes"],"a":1,"e":"AS est facultatif."},{"n":"sql-select","q":"Le mot-clé qui supprime les doublons d&#39;un résultat :","o":["UNIQUE","DISTINCT","ONLY"],"a":1,"e":"UNIQUE est une contrainte de table."},{"n":"sql-select","q":"<code>WHERE ville IN (&#39;Agadir&#39;, &#39;Rabat&#39;)<\/code> équivaut à :","o":["ville = &#39;Agadir&#39; OR ville = &#39;Rabat&#39;","ville = &#39;Agadir&#39; AND ville = &#39;Rabat&#39;","ville BETWEEN &#39;Agadir&#39; AND &#39;Rabat&#39;"],"a":0,"e":"IN est un raccourci pour une suite de OR."}]},{"id":"sql-jointures","t":"SQL · opérateurs ensemblistes, jointures et sous-requêtes","seance":"Séance 10 · 28 avril 2026","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut connaître les jointures de l&#39;algèbre (chapitre 4) et le SELECT simple (chapitre 7).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Quelle jointure de l&#39;algèbre garde toutes les lignes de la relation de gauche, même sans correspondance ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>La jointure externe gauche ⟕ (LEFT OUTER JOIN), qui complète par NULL.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Une question = un réflexe.<\/strong> « avec leurs… » → JOIN ; « même ceux qui n&#39;ont pas… » → LEFT JOIN ; « qui n&#39;ont aucun… » → LEFT JOIN + IS NULL ou NOT IN / NOT EXISTS ; « le plus grand… » → sous-requête avec MAX.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Oublier la condition de jointure : <code>FROM ETUDIANT, FORMATION<\/code> sans WHERE fait un <strong>produit cartésien<\/strong> (25 lignes au lieu de 4).<\/p>\n<\/aside><p>À la fin, tu sais utiliser UNION / INTERSECT / EXCEPT, toutes les jointures SQL et les sous-requêtes (IN, EXISTS, ANY, ALL, dans le FROM).<\/p>\n<h2>Idée 1 · Les données de la séance<\/h2>\n<pre class=\"\"><code>CREATE TABLE FORMATION (ID_Formation INT PRIMARY KEY, Nom_Formation VARCHAR(100), Etablissement VARCHAR(100), Diplome VARCHAR(50));\nCREATE TABLE ETUDIANT (CNE CHAR(10) PRIMARY KEY, Nom VARCHAR(50), Prenom VARCHAR(50), Ville VARCHAR(50),\n  ID_Formation INT);\nINSERT INTO FORMATION VALUES (1,'Ingénierie Informatique','ENSIAS - Rabat','Master'),\n (2,'Intelligence Artificielle','FST - Settat','Master'), (3,'Big Data &amp; Cloud Computing','FP - Béni Mellal','Master'),\n (4,'Management des Entreprises','FSJES - Casablanca','Licence'), (6,'Cybersécurité','EMI - Rabat','Master');\nINSERT INTO ETUDIANT VALUES ('2020456789','YOU','Youssef','Casablanca',1), ('2021123456','SAL','Salma','Rabat',2),\n ('2019987654','MEH','Mehdi','Marrakech',3), ('2020789123','FAT','Fatima','Béni Mellal',4),\n ('2019674321','OMA','Omar','Agadir',5);\nCREATE TABLE NOTE (CNE CHAR(10), Module VARCHAR(30), Note DECIMAL(4,2));\nINSERT INTO NOTE VALUES ('2020456789','SQL',15), ('2020456789','Java',9), ('2021123456','SQL',17),\n ('2019987654','SQL',12), ('2020789123','SQL',8), ('2020789123','Java',14);<\/code><\/pre><h2>Idée 2 · UNION, INTERSECT, EXCEPT<\/h2>\n<p>Conditions : <strong>même nombre de colonnes<\/strong>, types compatibles ; les colonnes sont appariées <strong>par position<\/strong> (les noms ne comptent pas, le résultat prend ceux de la 1re requête).<\/p>\n<pre class=\"\"><code>SELECT Ville FROM ETUDIANT UNION SELECT 'Rabat' ORDER BY Ville;\nSELECT CNE FROM NOTE WHERE Module = 'SQL' INTERSECT SELECT CNE FROM NOTE WHERE Module = 'Java';\nSELECT CNE FROM ETUDIANT EXCEPT SELECT CNE FROM NOTE;<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Ville\nAgadir\nBéni Mellal\nCasablanca\nMarrakech\nRabat\nCNE\n2020456789\n2020789123\nCNE\n2019674321<\/code><\/pre><ul>\n<li><code>UNION<\/code> supprime les doublons, <strong><code>UNION ALL<\/code><\/strong> les garde (plus rapide).<\/li>\n<li>INTERSECT : étudiants qui ont SQL <strong>et<\/strong> Java. EXCEPT : étudiants <strong>sans<\/strong> note (Omar).<\/li>\n<\/ul>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>MySQL n&#39;accepte INTERSECT et EXCEPT que depuis la version <strong>8.0.31<\/strong> (le cours montre aussi la forme <code>TABLE etudiants INTERSECT TABLE anciens_etudiants<\/code>). Sur une version plus ancienne, on écrit <code>WHERE CNE IN (…)<\/code> / <code>NOT IN (…)<\/code>.<\/p>\n<\/aside><h2>Idée 3 · Les jointures SQL<\/h2>\n<table>\n<thead>\n<tr>\n<th>SQL<\/th>\n<th>Algèbre<\/th>\n<th>Garde<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>FROM A, B WHERE A.k = B.k<\/code><\/td>\n<td>équi-jointure (forme « ancienne »)<\/td>\n<td>correspondances<\/td>\n<\/tr>\n<tr>\n<td><code>A INNER JOIN B ON A.k = B.k<\/code><\/td>\n<td>équi-jointure<\/td>\n<td>correspondances<\/td>\n<\/tr>\n<tr>\n<td><code>A NATURAL JOIN B<\/code><\/td>\n<td>jointure naturelle<\/td>\n<td>correspondances, colonne commune une fois<\/td>\n<\/tr>\n<tr>\n<td><code>A JOIN B USING (k)<\/code><\/td>\n<td>≈ naturelle sur k seulement<\/td>\n<td>correspondances<\/td>\n<\/tr>\n<tr>\n<td><code>A LEFT JOIN B ON …<\/code><\/td>\n<td>⟕<\/td>\n<td>tout A<\/td>\n<\/tr>\n<tr>\n<td><code>A RIGHT JOIN B ON …<\/code><\/td>\n<td>⟖<\/td>\n<td>tout B<\/td>\n<\/tr>\n<tr>\n<td><code>A CROSS JOIN B<\/code><\/td>\n<td>×<\/td>\n<td>toutes les paires<\/td>\n<\/tr>\n<\/tbody><\/table>\n<pre class=\"\"><code>SELECT E.Prenom, F.Nom_Formation\nFROM ETUDIANT AS E LEFT JOIN FORMATION AS F ON E.ID_Formation = F.ID_Formation;\nSELECT F.Nom_Formation FROM FORMATION F LEFT JOIN ETUDIANT E USING (ID_Formation) WHERE E.CNE IS NULL;<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Prenom | Nom_Formation\nYoussef | Ingénierie Informatique\nSalma | Intelligence Artificielle\nMehdi | Big Data &amp; Cloud Computing\nFatima | Management des Entreprises\nOmar | NULL\nNom_Formation\nCybersécurité<\/code><\/pre><p>La deuxième requête est le <strong>motif « anti-jointure »<\/strong> du TP3 Q7 : LEFT JOIN puis <code>IS NULL<\/code> pour trouver ce qui n&#39;a <strong>aucune<\/strong> correspondance.<\/p>\n<p><strong>FULL OUTER JOIN en MySQL<\/strong> (non supporté) : on réunit une jointure gauche et une jointure droite.<\/p>\n<pre class=\"\"><code>SELECT E.Prenom, F.Nom_Formation FROM ETUDIANT E LEFT JOIN FORMATION F ON E.ID_Formation = F.ID_Formation\nUNION\nSELECT E.Prenom, F.Nom_Formation FROM ETUDIANT E RIGHT JOIN FORMATION F ON E.ID_Formation = F.ID_Formation;<\/code><\/pre><h2>Idée 4 · Les sous-requêtes<\/h2>\n<p>Une sous-requête est un SELECT entre parenthèses, utilisé dans WHERE, HAVING, FROM ou SELECT.<\/p>\n<pre class=\"\"><code>SELECT Prenom FROM ETUDIANT\nWHERE CNE IN (SELECT CNE FROM NOTE WHERE Note &gt;= 15);\nSELECT Prenom FROM ETUDIANT E\nWHERE EXISTS (SELECT 1 FROM NOTE N WHERE N.CNE = E.CNE AND N.Note &lt; 10);\nSELECT CNE, Note FROM NOTE WHERE Module = 'SQL'\n  AND Note = (SELECT MAX(Note) FROM NOTE WHERE Module = 'SQL');<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Prenom\nYoussef\nSalma\nPrenom\nYoussef\nFatima\nCNE | Note\n2021123456 | 17<\/code><\/pre><ul>\n<li><strong>IN<\/strong> : la valeur est dans la liste renvoyée.<\/li>\n<li><strong>EXISTS<\/strong> : vrai si la sous-requête renvoie au moins une ligne. Elle est <strong>corrélée<\/strong> : elle utilise <code>E.CNE<\/code> de la requête externe et est réévaluée pour chaque étudiant.<\/li>\n<li>Comparaison avec <code>=<\/code>, <code>&gt;<\/code>… : la sous-requête doit renvoyer <strong>une seule valeur<\/strong>.<\/li>\n<\/ul>\n<pre class=\"\"><code>-- ANY / ALL : non supportés par SQLite, valides en MySQL\nSELECT CNE FROM NOTE WHERE Note &gt; ANY (SELECT Note FROM NOTE WHERE Module = 'Java');  -- &gt; au moins une (&gt; 9)\nSELECT CNE FROM NOTE WHERE Note &gt; ALL (SELECT Note FROM NOTE WHERE Module = 'Java');  -- &gt; toutes (&gt; 14)<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>SQLite ne connaît pas <code>ANY<\/code> / <code>ALL<\/code>. Équivalents exécutables : <code>&gt; ANY (…)<\/code> ⇔ <code>&gt; (SELECT MIN(…))<\/code> et <code>&gt; ALL (…)<\/code> ⇔ <code>&gt; (SELECT MAX(…))<\/code> (quand la sous-requête n&#39;est pas vide).<\/p>\n<\/aside><pre class=\"\"><code>SELECT CNE, Note FROM NOTE WHERE Note &gt; (SELECT MAX(Note) FROM NOTE WHERE Module = 'Java');\nSELECT Module, ROUND(AVG(Note), 2) AS moyenne\nFROM (SELECT * FROM NOTE WHERE Note &gt;= 10) AS reussites GROUP BY Module;<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>CNE | Note\n2020456789 | 15\n2021123456 | 17\nModule | moyenne\nJava | 14.0\nSQL | 14.67<\/code><\/pre><p>Sous-requête dans le FROM : elle forme une table temporaire, qui <strong>doit avoir un alias<\/strong> en MySQL.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices types (TD4, TP3)<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>(TD4 Q7) Lister tous les auteurs même s&#39;ils n&#39;ont rédigé aucun livre.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>SELECT A.Nom, A.Prenom, R.ISBN FROM AUTEUR A LEFT JOIN REDIGE R ON A.IdAuteur = R.IdAuteur; (Youssfi apparaît avec ISBN NULL).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>(TP3 Q12) Les étudiants qui n&#39;ont pas suivi le cours « Réseaux Informatiques ».<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>SELECT nom, prenom FROM Etudiant WHERE id_etudiant NOT IN (SELECT I.id_etudiant FROM Inscription I JOIN Cours C ON I.id_cours = C.id_cours WHERE C.nom_cours = &#39;Réseaux Informatiques&#39;);<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>(TP3 Q15) Les étudiants ayant la meilleure note dans chaque cours.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>SELECT E.nom, I.id_cours, I.note FROM Inscription I JOIN Etudiant E ON E.id_etudiant = I.id_etudiant WHERE I.note = (SELECT MAX(I2.note) FROM Inscription I2 WHERE I2.id_cours = I.id_cours); (sous-requête corrélée par cours).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Quelle syntaxe est équivalente à NATURAL JOIN ?<\/div><button class=\"opt\" data-o=\"0\">JOIN … ON table1.col = table2.col<\/button><button class=\"opt\" data-o=\"1\">LEFT JOIN … ON table1.col = table2.col<\/button><button class=\"opt\" data-o=\"2\">WHERE table1.col = table2.col<\/button><button class=\"opt\" data-o=\"3\">JOIN … USING (col)<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Quelle jointure retourne uniquement les lignes avec des correspondances dans les deux tables ?<\/div><button class=\"opt\" data-o=\"0\">LEFT JOIN<\/button><button class=\"opt\" data-o=\"1\">FULL OUTER JOIN<\/button><button class=\"opt\" data-o=\"2\">INNER JOIN<\/button><button class=\"opt\" data-o=\"3\">CROSS JOIN<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\"><code>FROM ETUDIANT, FORMATION<\/code> sans condition produit :<\/div><button class=\"opt\" data-o=\"0\">un produit cartésien<\/button><button class=\"opt\" data-o=\"1\">une jointure naturelle<\/button><button class=\"opt\" data-o=\"2\">une erreur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">UNION exige :<\/div><button class=\"opt\" data-o=\"0\">le même nombre de colonnes et des types compatibles<\/button><button class=\"opt\" data-o=\"1\">les mêmes noms de colonnes<\/button><button class=\"opt\" data-o=\"2\">une clé primaire commune<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Pour lister les formations sans aucun étudiant :<\/div><button class=\"opt\" data-o=\"0\">FORMATION INNER JOIN ETUDIANT<\/button><button class=\"opt\" data-o=\"1\">FORMATION LEFT JOIN ETUDIANT … WHERE ETUDIANT.CNE IS NULL<\/button><button class=\"opt\" data-o=\"2\">FORMATION CROSS JOIN ETUDIANT<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\"><code>Note &gt; ALL (SELECT Note FROM NOTE WHERE Module=&#39;Java&#39;)<\/code> avec Java = {9, 14} garde les notes :<\/div><button class=\"opt\" data-o=\"0\">&gt; 9<\/button><button class=\"opt\" data-o=\"1\">&gt; 14<\/button><button class=\"opt\" data-o=\"2\">= 14<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">EXISTS (sous-requête) est vrai quand :<\/div><button class=\"opt\" data-o=\"0\">la sous-requête renvoie au moins une ligne<\/button><button class=\"opt\" data-o=\"1\">la sous-requête renvoie exactement une ligne<\/button><button class=\"opt\" data-o=\"2\">la sous-requête renvoie NULL<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">MySQL supporte-t-il FULL OUTER JOIN ?<\/div><button class=\"opt\" data-o=\"0\">Oui, depuis toujours<\/button><button class=\"opt\" data-o=\"1\">Non : on combine LEFT JOIN et RIGHT JOIN avec UNION<\/button><button class=\"opt\" data-o=\"2\">Oui, avec le mot-clé FULL<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\"><code>WHERE Note = (SELECT Note FROM NOTE)<\/code> provoque une erreur si :<\/div><button class=\"opt\" data-o=\"0\">la sous-requête renvoie plusieurs lignes<\/button><button class=\"opt\" data-o=\"1\">la sous-requête renvoie une seule ligne<\/button><button class=\"opt\" data-o=\"2\">la table est indexée<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Une sous-requête dans le FROM, en MySQL :<\/div><button class=\"opt\" data-o=\"0\">est interdite<\/button><button class=\"opt\" data-o=\"1\">doit recevoir un alias<\/button><button class=\"opt\" data-o=\"2\">ne peut pas contenir de WHERE<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"sql-jointures","rep":null,"tol":null},{"n":"sql-jointures","rep":null,"tol":null},{"n":"sql-jointures","rep":null,"tol":null},{"n":"sql-jointures","rep":null,"tol":null}],"qcm":[{"n":"sql-jointures","q":"Quelle syntaxe est équivalente à NATURAL JOIN ?","o":["JOIN … ON table1.col = table2.col","LEFT JOIN … ON table1.col = table2.col","WHERE table1.col = table2.col","JOIN … USING (col)"],"a":3,"e":"Examen 2025 : USING fusionne la colonne commune comme la jointure naturelle."},{"n":"sql-jointures","q":"Quelle jointure retourne uniquement les lignes avec des correspondances dans les deux tables ?","o":["LEFT JOIN","FULL OUTER JOIN","INNER JOIN","CROSS JOIN"],"a":2,"e":"Examen 2025."},{"n":"sql-jointures","q":"<code>FROM ETUDIANT, FORMATION<\/code> sans condition produit :","o":["un produit cartésien","une jointure naturelle","une erreur"],"a":0,"e":"Toutes les paires de lignes."},{"n":"sql-jointures","q":"UNION exige :","o":["le même nombre de colonnes et des types compatibles","les mêmes noms de colonnes","une clé primaire commune"],"a":0,"e":"Les noms ne sont pas pris en compte."},{"n":"sql-jointures","q":"Pour lister les formations sans aucun étudiant :","o":["FORMATION INNER JOIN ETUDIANT","FORMATION LEFT JOIN ETUDIANT … WHERE ETUDIANT.CNE IS NULL","FORMATION CROSS JOIN ETUDIANT"],"a":1,"e":"Anti-jointure (TP3 Q7)."},{"n":"sql-jointures","q":"<code>Note &gt; ALL (SELECT Note FROM NOTE WHERE Module=&#39;Java&#39;)<\/code> avec Java = {9, 14} garde les notes :","o":["&gt; 9","&gt; 14","= 14"],"a":1,"e":"Il faut dépasser toutes les valeurs."},{"n":"sql-jointures","q":"EXISTS (sous-requête) est vrai quand :","o":["la sous-requête renvoie au moins une ligne","la sous-requête renvoie exactement une ligne","la sous-requête renvoie NULL"],"a":0,"e":"Le contenu des colonnes n&#39;importe pas."},{"n":"sql-jointures","q":"MySQL supporte-t-il FULL OUTER JOIN ?","o":["Oui, depuis toujours","Non : on combine LEFT JOIN et RIGHT JOIN avec UNION","Oui, avec le mot-clé FULL"],"a":1,"e":"SQLite 3.39+ et PostgreSQL le supportent, pas MySQL."},{"n":"sql-jointures","q":"<code>WHERE Note = (SELECT Note FROM NOTE)<\/code> provoque une erreur si :","o":["la sous-requête renvoie plusieurs lignes","la sous-requête renvoie une seule ligne","la table est indexée"],"a":0,"e":"Avec =, la sous-requête doit être scalaire ; sinon on utilise IN."},{"n":"sql-jointures","q":"Une sous-requête dans le FROM, en MySQL :","o":["est interdite","doit recevoir un alias","ne peut pas contenir de WHERE"],"a":1,"e":"Every derived table must have its own alias."}]},{"id":"index-vues-utilisateurs","t":"Index, vues et gestion des utilisateurs MySQL","seance":"Séance 11 · 12 mai 2026","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir écrire un SELECT avec WHERE et sous-requête (chapitres 7 et 8) : une vue n&#39;est qu&#39;un SELECT enregistré.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Écris la requête qui liste les produits plus chers que le prix moyen (table Products(ProductName, Price)).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>SELECT ProductName, Price FROM Products WHERE Price &gt; (SELECT AVG(Price) FROM Products);<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Trois outils, trois buts.<\/strong> Index → aller <strong>plus vite<\/strong>. Vue → <strong>simplifier<\/strong> ou <strong>masquer<\/strong>. Utilisateurs et privilèges → <strong>sécuriser<\/strong>.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Croire qu&#39;une vue stocke une copie des données. Une vue (simple) est une <strong>requête enregistrée<\/strong> : à chaque lecture, elle relit les tables. Si la table change, la vue change.<\/p>\n<\/aside><p>À la fin, tu sais créer et supprimer un index, créer / remplacer / supprimer une vue, créer un utilisateur MySQL et lui donner ou retirer des droits.<\/p>\n<h2>Idée 1 · L&#39;index, une table des matières<\/h2>\n<p>Sans index, <code>SELECT * FROM etudiant WHERE nom = &#39;Salma&#39;<\/code> parcourt <strong>toutes<\/strong> les lignes (full table scan). Un index est une structure auxiliaire <strong>triée<\/strong>, par défaut un <strong>arbre B-Tree<\/strong> (balancé) avec InnoDB.<\/p>\n<svg viewBox=\"0 0 560 170\" style=\"width:100%;max-width:560px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Arbre B-Tree : la racine M oriente vers les feuilles A à L ou M à Z, en trois lectures au lieu de toute la table\">\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\">\n<rect x=\"230\" y=\"10\" width=\"100\" height=\"32\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"280\" y=\"31\" fill=\"#D9824F\" font-weight=\"700\">M<\/text>\n<rect x=\"80\" y=\"75\" width=\"140\" height=\"32\" fill=\"none\" stroke=\"currentColor\"/><text x=\"150\" y=\"96\">E · I<\/text>\n<rect x=\"340\" y=\"75\" width=\"140\" height=\"32\" fill=\"none\" stroke=\"currentColor\"/><text x=\"410\" y=\"96\">R · S<\/text>\n<line x1=\"260\" y1=\"42\" x2=\"150\" y2=\"75\" stroke=\"currentColor\"/><line x1=\"300\" y1=\"42\" x2=\"410\" y2=\"75\" stroke=\"currentColor\"/>\n<rect x=\"20\" y=\"135\" width=\"120\" height=\"28\" fill=\"none\" stroke=\"currentColor\"/><text x=\"80\" y=\"154\">Ali … Hind<\/text>\n<rect x=\"160\" y=\"135\" width=\"120\" height=\"28\" fill=\"none\" stroke=\"currentColor\"/><text x=\"220\" y=\"154\">Imane … Lina<\/text>\n<rect x=\"300\" y=\"135\" width=\"120\" height=\"28\" fill=\"none\" stroke=\"currentColor\"/><text x=\"360\" y=\"154\">Mehdi … Rami<\/text>\n<rect x=\"440\" y=\"135\" width=\"110\" height=\"28\" fill=\"#D9824F\" fill-opacity=\".3\" stroke=\"#D9824F\" stroke-width=\"2\"/><text x=\"495\" y=\"154\">Salma …<\/text>\n<line x1=\"120\" y1=\"107\" x2=\"80\" y2=\"135\" stroke=\"currentColor\"/><line x1=\"180\" y1=\"107\" x2=\"220\" y2=\"135\" stroke=\"currentColor\"/>\n<line x1=\"380\" y1=\"107\" x2=\"360\" y2=\"135\" stroke=\"currentColor\"/><line x1=\"440\" y1=\"107\" x2=\"495\" y2=\"135\" stroke=\"#D9824F\" stroke-width=\"2\"/>\n<\/g><\/svg><p>Pour trouver « Salma » : racine → nœud → feuille, <strong>3 lectures<\/strong> au lieu de toute la table.<\/p>\n<pre class=\"\"><code>CREATE TABLE Produit (id INTEGER PRIMARY KEY, nom VARCHAR(50), categorie VARCHAR(30), prix DECIMAL(8,2));\nINSERT INTO Produit (nom, categorie, prix) VALUES ('Clavier','Informatique',150), ('Souris','Informatique',80),\n ('Chaise','Mobilier',600), ('Bureau','Mobilier',1200), ('Écran','Informatique',1500);\nCREATE INDEX idx_categorie ON Produit (categorie);\nCREATE UNIQUE INDEX idx_nom ON Produit (nom);\nCREATE INDEX idx_cat_prix ON Produit (categorie, prix);\nSELECT name FROM sqlite_master WHERE type = 'index' ORDER BY name;<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>name\nidx_cat_prix\nidx_categorie\nidx_nom<\/code><\/pre><pre class=\"\"><code>-- MySQL\nCREATE TABLE Etudiant (id INT PRIMARY KEY, Nom VARCHAR(50), INDEX idx_nom (Nom));   -- index à la création\nCREATE FULLTEXT INDEX idx_desc ON Livre (Description);                             -- recherche de texte\nSHOW INDEX FROM Etudiant;\nEXPLAIN SELECT * FROM Produit WHERE categorie = 'Informatique';   -- type ALL (scan) avant l'index, ref après\nDROP INDEX idx_nom ON Etudiant;<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>SQLite n&#39;a ni FULLTEXT dans <code>CREATE INDEX<\/code>, ni <code>SHOW INDEX<\/code> ; son <code>EXPLAIN QUERY PLAN<\/code> remplace <code>EXPLAIN<\/code>. Syntaxe de suppression : <code>DROP INDEX idx_nom;<\/code> (sans <code>ON table<\/code>).<\/p>\n<\/aside><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Un index accélère les lectures (WHERE, JOIN, ORDER BY) mais <strong>ralentit les écritures<\/strong> (INSERT, UPDATE, DELETE doivent mettre l&#39;index à jour) et prend de la place. On indexe les colonnes souvent filtrées, pas toutes. Clé primaire et UNIQUE créent un index automatiquement.<\/p>\n<\/aside><h2>Idée 2 · Les vues<\/h2>\n<pre class=\"\"><code>CREATE VIEW Produits_Chers AS\n  SELECT nom, prix FROM Produit WHERE prix &gt; (SELECT AVG(prix) FROM Produit);\nSELECT * FROM Produits_Chers;\nINSERT INTO Produit (nom, categorie, prix) VALUES ('Imprimante','Informatique',2500);\nSELECT * FROM Produits_Chers;<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>nom | prix\nBureau | 1200\nÉcran | 1500\nnom | prix\nBureau | 1200\nÉcran | 1500\nImprimante | 2500<\/code><\/pre><p>La moyenne passe de 706 à 1005 DH : Bureau et Écran restent au-dessus, et l&#39;Imprimante apparaît. La vue a <strong>suivi<\/strong> la table sans être recréée.<\/p>\n<pre class=\"\"><code>CREATE OR REPLACE VIEW Morocco_Customers_vw AS\n  SELECT CustomerName, ContactName, Country FROM `International Customers` WHERE Country = 'Morocco';\nDROP VIEW IF EXISTS Morocco_Customers_vw;<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p><code>CREATE OR REPLACE VIEW<\/code> est du MySQL ; SQLite impose <code>DROP VIEW<\/code> puis <code>CREATE VIEW<\/code>. Les noms entre accents graves (<code>`International Customers`<\/code>) sont propres à MySQL.<\/p>\n<\/aside><p>Intérêts d&#39;une vue : <strong>simplifier<\/strong> une requête complexe, <strong>masquer<\/strong> des colonnes sensibles (on donne le droit sur la vue, pas sur la table), présenter les données autrement.<\/p>\n<h2>Idée 3 · Utilisateurs et privilèges (MySQL)<\/h2>\n<p>Un compte MySQL = <strong>&#39;nom&#39;@&#39;hôte&#39;<\/strong>. <code>&#39;youness&#39;@&#39;localhost&#39;<\/code> ne peut se connecter <strong>que depuis la machine du serveur<\/strong> ; <code>&#39;youness&#39;@&#39;%&#39;<\/code> depuis n&#39;importe où.<\/p>\n<pre class=\"\"><code>CREATE USER 'enseignant'@'localhost' IDENTIFIED BY 'pass123';\nGRANT SELECT ON tp_gestion_universite.Etudiant TO 'enseignant'@'localhost';\nGRANT INSERT ON tp_gestion_universite.Inscription TO 'enseignant'@'localhost';\nGRANT UPDATE (note) ON tp_gestion_universite.Inscription TO 'enseignant'@'localhost';\nGRANT ALL PRIVILEGES ON db_priv.* TO 'youness'@'localhost';\nSHOW GRANTS FOR 'enseignant'@'localhost';\nREVOKE INSERT ON tp_gestion_universite.Inscription FROM 'enseignant'@'localhost';\nALTER USER 'enseignant'@'localhost' IDENTIFIED BY 'NouveauMdp!2026';\nDROP USER 'enseignant'@'localhost';<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>SQLite n&#39;a <strong>aucune<\/strong> gestion d&#39;utilisateurs (la sécurité passe par les droits du fichier). Tout ce bloc est du MySQL, non exécuté ici.<\/p>\n<\/aside><figure class=\"etapes\" data-i=\"0\"><figcaption>Lire un GRANT<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Quoi<\/div><p>le privilège (SELECT, INSERT, UPDATE(note), ALL PRIVILEGES…).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Sur quoi<\/div><p>base.table, base.* (toute la base) ou <em>.<\/em> (tout le serveur).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · À qui<\/div><p>&#39;utilisateur&#39;@&#39;hôte&#39;.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Vérifier<\/div><p>SHOW GRANTS FOR &#39;utilisateur&#39;@&#39;hôte&#39;;<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p><code>UPDATE(note)<\/code> ne permet de modifier <strong>que<\/strong> la colonne note ; <code>UPDATE<\/code> tout court, toutes les colonnes (question du TP4).<\/p>\n<aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>Bonne pratique de sécurité : principe du <strong>moindre privilège<\/strong>, ne jamais travailler en root dans une application, des mots de passe forts.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices types (TP4, examen)<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>(Examen 2025) Comment attribuer tous les privilèges à &#39;youness&#39; sur la base db_priv ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>GRANT ALL PRIVILEGES ON db_priv.* TO &#39;youness&#39;@&#39;localhost&#39;;<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>(TP4) L&#39;utilisateur &#39;enseignant&#39;@&#39;localhost&#39; peut-il se connecter depuis un autre PC ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Non : l&#39;hôte localhost limite la connexion à la machine du serveur. Il faudrait un compte &#39;enseignant&#39;@&#39;%&#39; (ou une IP précise).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Crée une vue Etudiants_Admis(nom, moyenne) pour les étudiants ayant au moins 10, puis remplace-la pour ajouter la ville (MySQL).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>CREATE VIEW Etudiants_Admis AS SELECT nom, moyenne FROM etudiant WHERE moyenne &gt;= 10; puis CREATE OR REPLACE VIEW Etudiants_Admis AS SELECT nom, moyenne, ville FROM etudiant WHERE moyenne &gt;= 10;<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Structure de données par défaut des index MySQL (InnoDB) ?<\/div><button class=\"opt\" data-o=\"0\">Hash Table<\/button><button class=\"opt\" data-o=\"1\">Arbre binaire<\/button><button class=\"opt\" data-o=\"2\">Liste chaînée<\/button><button class=\"opt\" data-o=\"3\">B-Tree (Balanced Tree)<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Quelle commande modifie une vue existante sans la supprimer ?<\/div><button class=\"opt\" data-o=\"0\">ALTER VIEW nom_vue AS SELECT …<\/button><button class=\"opt\" data-o=\"1\">UPDATE VIEW nom_vue AS SELECT …<\/button><button class=\"opt\" data-o=\"2\">CREATE OR REPLACE VIEW nom_vue AS SELECT …<\/button><button class=\"opt\" data-o=\"3\">MODIFY VIEW nom_vue AS SELECT …<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Quelle commande permet de voir tous les privilèges d&#39;un utilisateur ?<\/div><button class=\"opt\" data-o=\"0\">DESCRIBE GRANTS FOR &#39;u&#39;@&#39;hôte&#39;;<\/button><button class=\"opt\" data-o=\"1\">LIST GRANTS FOR &#39;u&#39;@&#39;hôte&#39;;<\/button><button class=\"opt\" data-o=\"2\">SHOW GRANTS FOR &#39;u&#39;@&#39;hôte&#39;;<\/button><button class=\"opt\" data-o=\"3\">DISPLAY GRANTS FOR &#39;u&#39;@&#39;hôte&#39;;<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Comment attribuer tous les privilèges à &#39;youness&#39; sur db_priv ?<\/div><button class=\"opt\" data-o=\"0\">GRANT ALL PRIVILEGES ON db_priv.* TO &#39;youness&#39;@&#39;localhost&#39;;<\/button><button class=\"opt\" data-o=\"1\">GRANT ALL TO &#39;youness&#39; ON db_priv;<\/button><button class=\"opt\" data-o=\"2\">GRANT ALL ON db_priv FOR &#39;youness&#39;;<\/button><button class=\"opt\" data-o=\"3\">SET PRIVILEGES * ON db_priv TO &#39;youness&#39;;<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Un index accélère surtout :<\/div><button class=\"opt\" data-o=\"0\">les recherches (WHERE, JOIN, ORDER BY)<\/button><button class=\"opt\" data-o=\"1\">les insertions<\/button><button class=\"opt\" data-o=\"2\">les suppressions<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Une vue simple :<\/div><button class=\"opt\" data-o=\"0\">stocke une copie figée des données<\/button><button class=\"opt\" data-o=\"1\">relit les tables à chaque utilisation<\/button><button class=\"opt\" data-o=\"2\">ne peut pas contenir de sous-requête<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">GRANT UPDATE (note) ON Inscription :<\/div><button class=\"opt\" data-o=\"0\">autorise la modification de la seule colonne note<\/button><button class=\"opt\" data-o=\"1\">autorise la modification de toutes les colonnes<\/button><button class=\"opt\" data-o=\"2\">autorise la lecture de note<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Quelle contrainte crée automatiquement un index ?<\/div><button class=\"opt\" data-o=\"0\">CHECK<\/button><button class=\"opt\" data-o=\"1\">DEFAULT<\/button><button class=\"opt\" data-o=\"2\">UNIQUE<\/button><button class=\"opt\" data-o=\"3\">NOT NULL<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Pour supprimer un index en MySQL :<\/div><button class=\"opt\" data-o=\"0\">DROP INDEX idx_nom ON Etudiant;<\/button><button class=\"opt\" data-o=\"1\">DELETE INDEX idx_nom;<\/button><button class=\"opt\" data-o=\"2\">ALTER INDEX idx_nom DROP;<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\"><code>EXPLAIN SELECT …<\/code> en MySQL sert à :<\/div><button class=\"opt\" data-o=\"0\">exécuter la requête deux fois<\/button><button class=\"opt\" data-o=\"1\">afficher le plan d&#39;exécution (scan complet ou utilisation d&#39;un index)<\/button><button class=\"opt\" data-o=\"2\">expliquer une erreur de syntaxe<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"index-vues-utilisateurs","rep":null,"tol":null},{"n":"index-vues-utilisateurs","rep":null,"tol":null},{"n":"index-vues-utilisateurs","rep":null,"tol":null},{"n":"index-vues-utilisateurs","rep":null,"tol":null}],"qcm":[{"n":"index-vues-utilisateurs","q":"Structure de données par défaut des index MySQL (InnoDB) ?","o":["Hash Table","Arbre binaire","Liste chaînée","B-Tree (Balanced Tree)"],"a":3,"e":"Examen 2025."},{"n":"index-vues-utilisateurs","q":"Quelle commande modi
