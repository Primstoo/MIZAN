const MODULE={"slug":"bdd-sql","titre":"Bases de données : algèbre relationnelle et SQL","cle":"bdd-sql_scores","cleEtat":"bdd-sql_scores_etat","format":"score10","intro":"<p>Ce module suit <strong>les 11 séances du Pr Y. Madani<\/strong> (mars–mai 2026) : conception avec Merise, algèbre relationnelle, puis SQL sous MySQL. Il corrige les TD2, TD3, TD4 et reprend les TP.<\/p>\n<p><strong>Comment l&#39;utiliser<\/strong><\/p>\n<ol>\n<li>Lis un chapitre, puis recopie et exécute les requêtes (MySQL Workbench, ou un SQLite en ligne).<\/li>\n<li>Fais le QCM du chapitre. <strong>8/10 = chapitre maîtrisé.<\/strong> En dessous, relis les encadrés « Piège ».<\/li>\n<li>Termine par l&#39;examen blanc : l&#39;annale 2025 était un QCM de 30 questions en 1 h 30.<\/li>\n<\/ol>\n<p><strong>Ce qui est sûr<\/strong> : le contenu vient des diapositives, des TD/TP et de l&#39;annale 2025 ; toutes les requêtes SQL ont été exécutées (SQLite) et les sorties affichées sont réelles.\n<strong>À savoir<\/strong> : le cours utilise <strong>MySQL<\/strong>. Quand la syntaxe diffère de SQLite, un encadré « Attention » le signale ; à l&#39;examen, écris la version MySQL.<\/p>\n","annexes":[],"cartes":null,"maths":false};
const CHAPS=[{"id":"bdd-merise-mcd","t":"Bases de données, SGBD et MCD Merise","seance":"Séances 1 et 2 · 9 et 17 mars 2026","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Aucun prérequis technique : il faut juste savoir lire un tableau (lignes, colonnes) et une phrase de règle métier (« un étudiant s&#39;inscrit à une seule formation »).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Dans un tableau « Clients » avec les colonnes ID, Nom, Email, que représente une ligne ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Un client précis (un enregistrement). Les colonnes sont ses caractéristiques (attributs). C&#39;est exactement le vocabulaire d&#39;une table relationnelle.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « règles de gestion » avant de dessiner.<\/strong> Un MCD n&#39;est que la traduction graphique de phrases métier. Si les phrases sont claires, les cardinalités tombent toutes seules.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Lire les cardinalités du mauvais côté. En Merise, la cardinalité écrite <strong>près d&#39;une entité<\/strong> dit combien de fois <strong>une occurrence de cette entité<\/strong> participe à l&#39;association. « Étudiant 1,1 — Inscrit — 0,N Formation » : un étudiant a exactement une formation.<\/p>\n<\/aside><p>À la fin, tu sais définir BDD / SGBD / SGBDR, construire un dictionnaire des données, écrire des dépendances fonctionnelles et dessiner un MCD avec ses cardinalités.<\/p>\n<h2>Idée 1 · BDD, SGBD, SGBDR : trois mots à ne pas mélanger<\/h2>\n<figure class=\"flux\"><figcaption>De la donnée à l'utilisateur<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">Données (tables)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">SGBD (MySQL, Oracle…)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Requêtes SQL<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Utilisateur / application<\/div><\/div><\/figure><ul>\n<li><strong>BDD<\/strong> : ensemble <strong>structuré<\/strong> et <strong>organisé<\/strong> d&#39;informations stockées électroniquement (le prof abrège « BDD »).<\/li>\n<li><strong>SGBD<\/strong> : le <strong>logiciel<\/strong> qui crée, gère et manipule la base (intégrité, sécurité, accès concurrents, performances).<\/li>\n<li><strong>SGBDR<\/strong> : SGBD fondé sur le <strong>modèle relationnel<\/strong> : tables (relations), lignes (enregistrements, tuples), colonnes (attributs), reliées par des <strong>clés<\/strong>.<\/li>\n<\/ul>\n<p>Exemples cités par le prof : MySQL (racheté par Oracle ; alternative libre <strong>MariaDB<\/strong>), Oracle Database (grandes entreprises), PostgreSQL, SQL Server (Microsoft), <strong>SQLite<\/strong> (léger, sans serveur, un seul fichier : c&#39;est lui qui exécute les exemples de ce module).<\/p>\n<aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>Les bases de données ont été créées pour corriger les défauts des fichiers : perte de données, accès difficile, <strong>redondance et incohérence<\/strong>, manque de sécurité.<\/p>\n<\/aside><h2>Idée 2 · Merise : trois niveaux, du papier au serveur<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Les trois niveaux de Merise<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · Conceptuel (MCD)<\/div><p>Entités, associations, cardinalités. Indépendant de toute technologie.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · Logique (MLD)<\/div><p>Relations avec clés primaires et clés étrangères, prêtes pour un SGBD relationnel.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · Physique (MPD)<\/div><p>Les scripts SQL réels (CREATE TABLE…) pour un SGBD précis, plus l&#39;optimisation (index…).<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p>Merise (années 1970, Hubert Tardieu, popularisée dans les années 1980) sépare <strong>données<\/strong> et <strong>traitements<\/strong>. Un <strong>système d&#39;information<\/strong> (SI) a quatre fonctions : collecter, mémoriser, traiter, diffuser l&#39;information. Un SI peut exister sans informatique (registres papier).<\/p>\n<h2>Idée 3 · Règles de gestion et dictionnaire des données<\/h2>\n<p>Étapes pour construire un MCD : règles de gestion → dictionnaire des données → dépendances fonctionnelles → entités → associations → cardinalités.<\/p>\n<p>Le <strong>dictionnaire des données<\/strong> liste chaque donnée avec : code mnémonique, désignation, type (<strong>A<\/strong> alphabétique, <strong>N<\/strong> numérique, <strong>AN<\/strong> alphanumérique, Date, Booléen), taille, remarques.<\/p>\n<table>\n<thead>\n<tr>\n<th>Code<\/th>\n<th>Désignation<\/th>\n<th>Type<\/th>\n<th>Taille<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>id_etudiant<\/td>\n<td>Identifiant de l&#39;étudiant<\/td>\n<td>N<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>nom_etudiant<\/td>\n<td>Nom de l&#39;étudiant<\/td>\n<td>A<\/td>\n<td>30<\/td>\n<\/tr>\n<tr>\n<td>tel_etudiant<\/td>\n<td>Téléphone<\/td>\n<td><strong>AN<\/strong><\/td>\n<td>15<\/td>\n<\/tr>\n<tr>\n<td>date_naissance<\/td>\n<td>Date de naissance<\/td>\n<td>Date<\/td>\n<td>10<\/td>\n<\/tr>\n<\/tbody><\/table>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Les données doivent être <strong>élémentaires<\/strong> : pas de donnée calculée (l&#39;âge se calcule depuis la date de naissance), pas de donnée composée. Un numéro qui ne sert jamais à calculer (téléphone, CIN) est de type <strong>AN<\/strong>, pas N.<\/p>\n<\/aside><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Une diapo écrit le format de date « AAAA-JJ-MM ». Le bon format (MySQL, et le reste du cours) est <strong>AAAA-MM-JJ<\/strong> : 10 caractères dans les deux cas.<\/p>\n<\/aside><h2>Idée 4 · Les dépendances fonctionnelles (DF)<\/h2>\n<p>P1 → P2 : une valeur de P1 détermine <strong>une seule<\/strong> valeur de P2. P1 est la <strong>source<\/strong>, P2 la <strong>cible<\/strong> (ou but).<\/p>\n<p>Exemple du cours : <code>id_etudiant → nom, prénom, date_naissance<\/code> ; <code>id_etudiant, id_cours → date_inscription, statut, note<\/code>.<\/p>\n<ul>\n<li><strong>Élémentaire<\/strong> : toute la source est nécessaire. Si P1 → P3, alors {P1, P2} → P3 n&#39;est pas élémentaire.<\/li>\n<li><strong>Directe<\/strong> : pas obtenue par transitivité. Si P1 → P2 et P2 → P3, alors P1 → P3 est transitive (non directe).<\/li>\n<\/ul>\n<h2>Idée 5 · Entités, associations, cardinalités<\/h2>\n<svg viewBox=\"0 0 600 150\" style=\"width:100%;max-width:600px;display:block;margin:10px auto\" role=\"img\" aria-label=\"MCD : l'entité Étudiant (1,1) est reliée par l'association Inscrit à l'entité Formation (0,N)\">\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\">\n<rect x=\"20\" y=\"30\" width=\"150\" height=\"95\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<line x1=\"20\" y1=\"55\" x2=\"170\" y2=\"55\" stroke=\"currentColor\"/>\n<text x=\"95\" y=\"48\" text-anchor=\"middle\" font-weight=\"700\">ÉTUDIANT<\/text>\n<text x=\"30\" y=\"75\" text-decoration=\"underline\">num_etu<\/text><text x=\"30\" y=\"93\">nom, prénom<\/text><text x=\"30\" y=\"111\">email<\/text>\n<rect x=\"430\" y=\"30\" width=\"150\" height=\"75\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<line x1=\"430\" y1=\"55\" x2=\"580\" y2=\"55\" stroke=\"currentColor\"/>\n<text x=\"505\" y=\"48\" text-anchor=\"middle\" font-weight=\"700\">FORMATION<\/text>\n<text x=\"440\" y=\"75\" text-decoration=\"underline\">code_formation<\/text><text x=\"440\" y=\"93\">intitulé<\/text>\n<ellipse cx=\"300\" cy=\"65\" rx=\"60\" ry=\"26\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"2\"/>\n<text x=\"300\" y=\"70\" text-anchor=\"middle\" fill=\"#D9824F\" font-weight=\"700\">Inscrit<\/text>\n<line x1=\"170\" y1=\"65\" x2=\"240\" y2=\"65\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"360\" y1=\"65\" x2=\"430\" y2=\"65\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<text x=\"205\" y=\"55\" text-anchor=\"middle\" fill=\"#D9824F\" font-weight=\"700\">1,1<\/text><text x=\"395\" y=\"55\" text-anchor=\"middle\" fill=\"#D9824F\" font-weight=\"700\">0,N<\/text>\n<\/g><\/svg><ul>\n<li><strong>Entité<\/strong> : objet du monde réel, avec un <strong>identifiant<\/strong> unique (souligné) source des DF vers tous ses attributs.<\/li>\n<li><strong>Association<\/strong> : lien sémantique, nommé par un verbe (Inscrit, Enseigne). Elle peut <strong>porter des données<\/strong> (date d&#39;inscription, statut) ; elle est alors identifiée par la concaténation des identifiants des entités liées.<\/li>\n<li><strong>Cardinalité<\/strong> (min, max) : 0,1 · 1,1 · 0,N · 1,N.<\/li>\n<\/ul>\n<p>Lecture du schéma : un étudiant est inscrit dans <strong>une et une seule<\/strong> formation (1,1) ; une formation regroupe <strong>zéro ou plusieurs<\/strong> étudiants (0,N).<\/p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Un MCD n&#39;est valide que si <strong>toute entité est reliée à au moins une association<\/strong>.<\/p>\n<\/aside><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Deux incohérences dans les diapos de la séance 2 :<\/p>\n<ol>\n<li>« Association Enseigner entre Enseignant <strong>et Enseignant<\/strong> … (1,1) côté Matière » alors que la règle dit qu&#39;une matière peut être enseignée par <strong>un ou plusieurs<\/strong> enseignants. Correction : Enseigner relie Enseignant et Matière, avec <strong>1,N des deux côtés<\/strong>.<\/li>\n<li>Les règles disent « chaque cours appartient à une seule formation », mais le MCD final met (1,N – 1,N) entre Formation et Cours. Dans ce module on suit le <strong>MCD final<\/strong> (un cours peut être dans plusieurs formations), comme le MLD de la séance 3.<\/li>\n<\/ol>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices types (TD1 et examen)<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>(TD1, bibliothèque) Donne les cardinalités de « Auteur rédige Livre » sachant qu&#39;un auteur rédige un ou plusieurs livres et qu&#39;un livre peut être rédigé par un ou plusieurs auteurs.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Auteur (1,N) — rédige — (1,N) Livre. Les deux côtés ont un maximum N : c&#39;est une association « plusieurs à plusieurs », qui deviendra une table au MLD.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>(TD1) « Un exemplaire est directement associé à un livre ; un livre peut avoir plusieurs exemplaires. » Cardinalités de Livre — possède — Exemplaire ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Exemplaire (1,1) : un exemplaire correspond à exactement un livre. Livre (1,N) (ou 0,N si on accepte un livre sans exemplaire, choix à justifier).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Dans Commande(num_cmd, client_id, produit_id, quantite), quelle DF détermine la quantité ? Est-elle élémentaire ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>{num_cmd, produit_id} → quantite (une commande peut contenir plusieurs produits). Elle est élémentaire si ni num_cmd seul ni produit_id seul ne détermine la quantité.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Que signifie la notation P1 → P2 ?<\/div><button class=\"opt\" data-o=\"0\">P2 détermine P1 de manière unique<\/button><button class=\"opt\" data-o=\"1\">P1 détermine P2 de manière unique<\/button><button class=\"opt\" data-o=\"2\">P1 et P2 sont indépendants<\/button><button class=\"opt\" data-o=\"3\">P1 et P2 sont équivalents<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Une dépendance fonctionnelle est élémentaire quand :<\/div><button class=\"opt\" data-o=\"0\">elle ne contient qu&#39;un seul attribut source<\/button><button class=\"opt\" data-o=\"1\">l&#39;intégralité de la source est nécessaire pour déterminer le but<\/button><button class=\"opt\" data-o=\"2\">elle est obtenue par transitivité<\/button><button class=\"opt\" data-o=\"3\">elle contient plusieurs attributs buts<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Pour qu&#39;un MCD soit valide :<\/div><button class=\"opt\" data-o=\"0\">chaque entité doit avoir au moins 5 attributs<\/button><button class=\"opt\" data-o=\"1\">toute entité doit être reliée à au moins une association<\/button><button class=\"opt\" data-o=\"2\">chaque association relie exactement 2 entités<\/button><button class=\"opt\" data-o=\"3\">toutes les cardinalités valent (1,1)<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Quel logiciel est un SGBD léger, sans serveur, stocké dans un seul fichier ?<\/div><button class=\"opt\" data-o=\"0\">Oracle Database<\/button><button class=\"opt\" data-o=\"1\">SQL Server<\/button><button class=\"opt\" data-o=\"2\">SQLite<\/button><button class=\"opt\" data-o=\"3\">MySQL<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Quel type donner à un numéro de CIN dans le dictionnaire des données ?<\/div><button class=\"opt\" data-o=\"0\">N<\/button><button class=\"opt\" data-o=\"1\">A<\/button><button class=\"opt\" data-o=\"2\">AN<\/button><button class=\"opt\" data-o=\"3\">Booléen<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Pourquoi ne stocke-t-on pas l&#39;âge d&#39;un étudiant ?<\/div><button class=\"opt\" data-o=\"0\">C&#39;est une donnée confidentielle<\/button><button class=\"opt\" data-o=\"1\">C&#39;est une donnée calculée à partir de la date de naissance<\/button><button class=\"opt\" data-o=\"2\">MySQL ne connaît pas les entiers<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">« Étudiant 1,1 — Inscrit — 0,N Formation » signifie :<\/div><button class=\"opt\" data-o=\"0\">un étudiant est inscrit dans exactement une formation<\/button><button class=\"opt\" data-o=\"1\">une formation a exactement un étudiant<\/button><button class=\"opt\" data-o=\"2\">un étudiant peut n&#39;avoir aucune formation<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Si P1 → P2 et P2 → P3, alors P1 → P3 est :<\/div><button class=\"opt\" data-o=\"0\">élémentaire<\/button><button class=\"opt\" data-o=\"1\">transitive (non directe)<\/button><button class=\"opt\" data-o=\"2\">impossible<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Le niveau qui contient les scripts CREATE TABLE est :<\/div><button class=\"opt\" data-o=\"0\">le MCD<\/button><button class=\"opt\" data-o=\"1\">le MLD<\/button><button class=\"opt\" data-o=\"2\">le MPD<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Une association porteuse de données Inscrit(Étudiant, Cours) est identifiée par :<\/div><button class=\"opt\" data-o=\"0\">la date d&#39;inscription<\/button><button class=\"opt\" data-o=\"1\">le couple (id_cours, id_etudiant)<\/button><button class=\"opt\" data-o=\"2\">l&#39;identifiant du cours seul<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"bdd-merise-mcd","rep":null,"tol":null},{"n":"bdd-merise-mcd","rep":null,"tol":null},{"n":"bdd-merise-mcd","rep":null,"tol":null},{"n":"bdd-merise-mcd","rep":null,"tol":null}],"qcm":[{"n":"bdd-merise-mcd","q":"Que signifie la notation P1 → P2 ?","o":["P2 détermine P1 de manière unique","P1 détermine P2 de manière unique","P1 et P2 sont indépendants","P1 et P2 sont équivalents"],"a":1,"e":"Question tombée à l&#39;examen 2025. La flèche va de la source (déterminant) vers la cible."},{"n":"bdd-merise-mcd","q":"Une dépendance fonctionnelle est élémentaire quand :","o":["elle ne contient qu&#39;un seul attribut source","l&#39;intégralité de la source est nécessaire pour déterminer le but","elle est obtenue par transitivité","elle contient plusieurs attributs buts"],"a":1,"e":"Question d&#39;examen 2025. Une source composée peut être élémentaire si aucune partie seule ne suffit."},{"n":"bdd-merise-mcd","q":"Pour qu&#39;un MCD soit valide :","o":["chaque entité doit avoir au moins 5 attributs","toute entité doit être reliée à au moins une association","chaque association relie exactement 2 entités","toutes les cardinalités valent (1,1)"],"a":1,"e":"Règle de la séance 2, reprise à l&#39;examen 2025."},{"n":"bdd-merise-mcd","q":"Quel logiciel est un SGBD léger, sans serveur, stocké dans un seul fichier ?","o":["Oracle Database","SQL Server","SQLite","MySQL"],"a":2,"e":"SQLite est embarqué (applis mobiles, logiciels de bureau)."},{"n":"bdd-merise-mcd","q":"Quel type donner à un numéro de CIN dans le dictionnaire des données ?","o":["N","A","AN","Booléen"],"a":2,"e":"Il contient lettres et chiffres et on ne calcule pas dessus."},{"n":"bdd-merise-mcd","q":"Pourquoi ne stocke-t-on pas l&#39;âge d&#39;un étudiant ?","o":["C&#39;est une donnée confidentielle","C&#39;est une donnée calculée à partir de la date de naissance","MySQL ne connaît pas les entiers"],"a":1,"e":"Les données du MCD doivent être élémentaires, non calculées."},{"n":"bdd-merise-mcd","q":"« Étudiant 1,1 — Inscrit — 0,N Formation » signifie :","o":["un étudiant est inscrit dans exactement une formation","une formation a exactement un étudiant","un étudiant peut n&#39;avoir aucune formation"],"a":0,"e":"La cardinalité près d&#39;Étudiant décrit la participation d&#39;un étudiant."},{"n":"bdd-merise-mcd","q":"Si P1 → P2 et P2 → P3, alors P1 → P3 est :","o":["élémentaire","transitive (non directe)","impossible"],"a":1,"e":"C&#39;est la définition d&#39;une DF non directe."},{"n":"bdd-merise-mcd","q":"Le niveau qui contient les scripts CREATE TABLE est :","o":["le MCD","le MLD","le MPD"],"a":2,"e":"Le niveau physique dépend du SGBD choisi."},{"n":"bdd-merise-mcd","q":"Une association porteuse de données Inscrit(Étudiant, Cours) est identifiée par :","o":["la date d&#39;inscription","le couple (id_cours, id_etudiant)","l&#39;identifiant du cours seul"],"a":1,"e":"Concaténation des identifiants des entités reliées."}]},{"id":"mld-normalisation","t":"Du MCD au MLD, puis normalisation (1NF à BCNF)","seance":"Séance 3 · 21 mars 2026","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir lire une cardinalité (1,1 ; 0,N…) et une dépendance fonctionnelle (chapitre 1).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>« Enseignant 0,N — Enseigne — 1,1 Cours ». Combien d&#39;enseignants a un cours ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Exactement un (la cardinalité 1,1 est du côté Cours). Un enseignant, lui, peut avoir 0 ou plusieurs cours.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Regarde les maximums.<\/strong> Toute la conversion MCD → MLD dépend d&#39;une seule question : y a-t-il un « 1 » en maximum d&#39;un côté ? Si oui, clé étrangère. Si les deux maximums valent N, nouvelle table.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Mettre la clé étrangère du mauvais côté. Elle va <strong>dans la relation de l&#39;entité qui a la cardinalité 1,1<\/strong> (celle qui « pointe » vers une seule occurrence de l&#39;autre).<\/p>\n<\/aside><p>À la fin, tu sais transformer un MCD en MLD, l&#39;écrire en CREATE TABLE et vérifier les formes normales 1NF, 2NF, 3NF et BCNF.<\/p>\n<h2>Idée 1 · Le vocabulaire du MLD<\/h2>\n<p>Une <strong>relation<\/strong> a un nom, des attributs, <strong>une seule clé primaire<\/strong> (soulignée) et zéro, une ou plusieurs <strong>clés étrangères<\/strong> (notées <code>#<\/code>).<\/p>\n<p><code>Enseignant (num_ens, nom, prénom, spécialité)<\/code> · <code>Cours (code_cours, intitulé, num_ens#)<\/code><\/p>\n<ul>\n<li><strong>Cardinalité d&#39;une relation<\/strong> = nombre de lignes. <strong>Degré<\/strong> = nombre d&#39;attributs.<\/li>\n<li>Termes rigoureux : <strong>clé candidate<\/strong> (ensemble minimal identifiant) et <strong>contrainte d&#39;inclusion<\/strong> (= clé étrangère).<\/li>\n<li>Une clé étrangère a <strong>le même type<\/strong> que la clé primaire qu&#39;elle référence.<\/li>\n<\/ul>\n<h2>Idée 2 · Les quatre règles de conversion<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Convertir un MCD en MLD<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Règle 1 · Entité<\/div><p>Chaque entité devient une relation ; son identifiant devient la clé primaire.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · Règle 2 · Association (0/1,N)–(0/1,N)<\/div><p>Nouvelle relation (associative). Clé = concaténation des identifiants, qui sont aussi clés étrangères. Les données portées deviennent des attributs. Ex. ENSEIGNE(num_ens#, code_cours#, date_attribution).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · Règle 3 · Une cardinalité 1,1<\/div><p>Clé étrangère dans la relation du côté 1,1, vers l&#39;autre entité. L&#39;association doit être binaire et sans données propres. Ex. Etudiant(…, code_formation#).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · Règle 4 · Une cardinalité 0,1<\/div><p>Clé étrangère côté 0,1 (association sans données), ou relation associative (permet des employés sans projet et d&#39;ajouter une date d&#39;affectation).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · Cas mixtes<\/div><p>0,1 – 1,1 : clé étrangère côté 1,1. 0,1 – 0,1 : au choix (cas rare, vérifier la réalité).<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><figure class=\"grille\"><figcaption>MCD de la séance 2 → MLD<\/figcaption><table><tr><th>Relation<\/th><th>Clé primaire<\/th><th>Clés étrangères<\/th><\/tr><tr><td>Enseignant<\/td><td class=\"h1\">num_ens<\/td><td>·<\/td><\/tr><tr><td>Formation<\/td><td class=\"h1\">code_formation<\/td><td>·<\/td><\/tr><tr><td>Cours<\/td><td class=\"h1\">code_cours<\/td><td class=\"h2\">num_ens#<\/td><\/tr><tr><td>Etudiant<\/td><td class=\"h1\">num_etu<\/td><td class=\"h2\">code_formation#<\/td><\/tr><tr><td>SUIVRE<\/td><td class=\"h1\">num_etu, code_cours<\/td><td class=\"h2\">num_etu#, code_cours#<\/td><\/tr><tr><td>CONTIENT<\/td><td class=\"h1\">code_formation, code_cours<\/td><td class=\"h2\">code_formation#, code_cours#<\/td><\/tr><\/table><\/figure><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Une diapo de la règle 3 écrit <code>Client (…, num_commande#)<\/code> et <code>Commande (num_commande, …)<\/code>. Si un client passe <strong>plusieurs<\/strong> commandes (cas normal, Commande 1,1 — Client 1,N), la clé étrangère doit aller dans <strong>Commande<\/strong> : <code>Commande (num_commande, date, montant, num_client#)<\/code>. La version des diapos ne marche que si un client n&#39;a qu&#39;une commande.<\/p>\n<\/aside><h2>Idée 3 · Passage au SQL (MPD)<\/h2>\n<p>Chaque relation → <code>CREATE TABLE<\/code> ; clé primaire → <code>PRIMARY KEY<\/code> ; clé étrangère → <code>FOREIGN KEY … REFERENCES<\/code>. Voici le MLD du cours, exécuté sous SQLite :<\/p>\n<pre class=\"\"><code>CREATE TABLE Enseignant (num_ens INTEGER PRIMARY KEY, nom VARCHAR(50) NOT NULL, specialite VARCHAR(100));\nCREATE TABLE Formation (code_formation INTEGER PRIMARY KEY, intitule VARCHAR(100) NOT NULL);\nCREATE TABLE Etudiant (\n  num_etu INTEGER PRIMARY KEY,\n  nom VARCHAR(50) NOT NULL,\n  email VARCHAR(100) UNIQUE NOT NULL,\n  code_formation INT NOT NULL,\n  FOREIGN KEY (code_formation) REFERENCES Formation(code_formation)\n);\nCREATE TABLE Cours (code_cours INTEGER PRIMARY KEY, intitule VARCHAR(100) NOT NULL, num_ens INT NOT NULL,\n  FOREIGN KEY (num_ens) REFERENCES Enseignant(num_ens));\nCREATE TABLE SUIVRE (\n  num_etu INT NOT NULL, code_cours INT NOT NULL,\n  PRIMARY KEY (num_etu, code_cours),\n  FOREIGN KEY (num_etu) REFERENCES Etudiant(num_etu) ON DELETE CASCADE,\n  FOREIGN KEY (code_cours) REFERENCES Cours(code_cours) ON DELETE CASCADE\n);\nSELECT name FROM sqlite_master WHERE type = 'table' ORDER BY name;<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>name\nCours\nEnseignant\nEtudiant\nFormation\nSUIVRE<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le prof écrit <code>num_ens INT AUTO_INCREMENT PRIMARY KEY<\/code> (MySQL). Sous SQLite, l&#39;équivalent est <code>INTEGER PRIMARY KEY<\/code> (auto-incrémenté d&#39;office). À l&#39;examen, écris la syntaxe <strong>MySQL<\/strong>.<\/p>\n<\/aside><p><code>ON DELETE CASCADE<\/code> : supprimer un étudiant supprime automatiquement ses lignes dans SUIVRE (table enfant).<\/p>\n<h2>Idée 4 · Les formes normales<\/h2>\n<figure class=\"flux\"><figcaption>Chaque forme inclut la précédente<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">1NF<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">2NF<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">3NF<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">BCNF<\/div><\/div><\/figure><table>\n<thead>\n<tr>\n<th>Forme<\/th>\n<th>Condition (en plus de la précédente)<\/th>\n<th>Violation typique<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>1NF<\/strong><\/td>\n<td>valeurs <strong>atomiques<\/strong>, pas de groupe répétitif<\/td>\n<td>colonne cours = « SQL, Java »<\/td>\n<\/tr>\n<tr>\n<td><strong>2NF<\/strong><\/td>\n<td>aucun attribut non-clé ne dépend d&#39;une <strong>partie<\/strong> de la clé<\/td>\n<td>(num_etu, code_cours) → nom_etudiant<\/td>\n<\/tr>\n<tr>\n<td><strong>3NF<\/strong><\/td>\n<td>pas de dépendance <strong>transitive<\/strong> (non-clé → non-clé)<\/td>\n<td>num_etu → code_formation → intitule_formation<\/td>\n<\/tr>\n<tr>\n<td><strong>BCNF<\/strong><\/td>\n<td>pour toute DF X → Y, X est une <strong>super-clé<\/strong><\/td>\n<td>un non-clé qui détermine une partie de la clé<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p><strong>Exemple chiffré.<\/strong> <code>Inscription(num_etu, code_cours, nom_etu, note)<\/code> : clé (num_etu, code_cours). Or num_etu → nom_etu : dépendance partielle, donc <strong>pas en 2NF<\/strong>. Correction : <code>Etudiant(num_etu, nom_etu)<\/code> et <code>Inscription(num_etu#, code_cours#, note)<\/code>.<\/p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>2NF = « toute la clé », 3NF = « rien que la clé », BCNF = « seules les (super-)clés déterminent ».<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>MLD et normalisation (TD1, examen)<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>(TD1) Donne le MLD de : Livre (ISBN) 1,N — possède — 1,1 Exemplaire (num_exemplaire, état).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Livre(ISBN, titre, …) et Exemplaire(num_exemplaire, etat, ISBN#). La clé étrangère va côté 1,1 (Exemplaire).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>(TD1) Auteur 1,N — rédige — 1,N Livre. MLD ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Relation associative : Rediger(id_auteur#, ISBN#). Sa clé primaire est le couple, chaque partie est aussi clé étrangère.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>La table Etudiant(num_etu, nom, code_formation, intitule_formation) est-elle en 3NF ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Non : num_etu → code_formation → intitule_formation est transitive. On sort Formation(code_formation, intitule_formation) et on garde code_formation# dans Etudiant.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 9 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Une table est en 2NF si :<\/div><button class=\"opt\" data-o=\"0\">elle est en 1NF et tous les attributs non-clés dépendent entièrement de la clé primaire<\/button><button class=\"opt\" data-o=\"1\">elle est en 1NF et n&#39;a pas de dépendance transitive<\/button><button class=\"opt\" data-o=\"2\">tous les attributs sont atomiques<\/button><button class=\"opt\" data-o=\"3\">elle respecte la forme de Boyce-Codd<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Combien de clés primaires possède une relation ?<\/div><button class=\"opt\" data-o=\"0\">Zéro ou plus<\/button><button class=\"opt\" data-o=\"1\">Exactement une (éventuellement composée)<\/button><button class=\"opt\" data-o=\"2\">Autant que de clés étrangères<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Association Étudiant 0,N — Suivre — 0,N Cours. Au MLD :<\/div><button class=\"opt\" data-o=\"0\">clé étrangère dans Étudiant<\/button><button class=\"opt\" data-o=\"1\">clé étrangère dans Cours<\/button><button class=\"opt\" data-o=\"2\">nouvelle relation SUIVRE(num_etu#, code_cours#)<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Étudiant 1,1 — Inscrit — 0,N Formation. Où va la clé étrangère ?<\/div><button class=\"opt\" data-o=\"0\">Dans Étudiant<\/button><button class=\"opt\" data-o=\"1\">Dans Formation<\/button><button class=\"opt\" data-o=\"2\">Dans une nouvelle relation obligatoirement<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Le degré d&#39;une relation est :<\/div><button class=\"opt\" data-o=\"0\">son nombre de lignes<\/button><button class=\"opt\" data-o=\"1\">son nombre d&#39;attributs<\/button><button class=\"opt\" data-o=\"2\">son nombre de clés étrangères<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Une colonne « telephones » contenant « 0611…, 0522… » viole :<\/div><button class=\"opt\" data-o=\"0\">la 1NF<\/button><button class=\"opt\" data-o=\"1\">la 2NF<\/button><button class=\"opt\" data-o=\"2\">la 3NF<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Dans R(A, B, C) de clé A, avec B → C : R n&#39;est pas en<\/div><button class=\"opt\" data-o=\"0\">1NF<\/button><button class=\"opt\" data-o=\"1\">2NF<\/button><button class=\"opt\" data-o=\"2\">3NF<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">La règle 3 (cardinalité 1,1) exige que l&#39;association soit :<\/div><button class=\"opt\" data-o=\"0\">binaire et sans données propres<\/button><button class=\"opt\" data-o=\"1\">ternaire<\/button><button class=\"opt\" data-o=\"2\">porteuse de données<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Que fait ON DELETE CASCADE ?<\/div><button class=\"opt\" data-o=\"0\">Il interdit la suppression du parent<\/button><button class=\"opt\" data-o=\"1\">Il supprime automatiquement les lignes enfants<\/button><button class=\"opt\" data-o=\"2\">Il met les clés étrangères à NULL<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Une super-clé est :<\/div><button class=\"opt\" data-o=\"0\">un ensemble d&#39;attributs qui identifie une ligne, éventuellement avec des attributs en trop<\/button><button class=\"opt\" data-o=\"1\">une clé étrangère composée<\/button><button class=\"opt\" data-o=\"2\">la plus petite clé possible<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"mld-normalisation","rep":null,"tol":null},{"n":"mld-normalisation","rep":null,"tol":null},{"n":"mld-normalisation","rep":null,"tol":null},{"n":"mld-normalisation","rep":null,"tol":null}],"qcm":[{"n":"mld-normalisation","q":"Une table est en 2NF si :","o":["elle est en 1NF et tous les attributs non-clés dépendent entièrement de la clé primaire","elle est en 1NF et n&#39;a pas de dépendance transitive","tous les attributs sont atomiques","elle respecte la forme de Boyce-Codd"],"a":0,"e":"Question de l&#39;examen 2025. « Pas de dépendance transitive », c&#39;est la 3NF."},{"n":"mld-normalisation","q":"Combien de clés primaires possède une relation ?","o":["Zéro ou plus","Exactement une (éventuellement composée)","Autant que de clés étrangères"],"a":1,"e":"Une seule clé primaire, qui peut contenir plusieurs attributs."},{"n":"mld-normalisation","q":"Association Étudiant 0,N — Suivre — 0,N Cours. Au MLD :","o":["clé étrangère dans Étudiant","clé étrangère dans Cours","nouvelle relation SUIVRE(num_etu#, code_cours#)"],"a":2,"e":"Deux maximums N : relation associative."},{"n":"mld-normalisation","q":"Étudiant 1,1 — Inscrit — 0,N Formation. Où va la clé étrangère ?","o":["Dans Étudiant","Dans Formation","Dans une nouvelle relation obligatoirement"],"a":0,"e":"Côté 1,1 : Etudiant(…, code_formation#)."},{"n":"mld-normalisation","q":"Le degré d&#39;une relation est :","o":["son nombre de lignes","son nombre d&#39;attributs","son nombre de clés étrangères"],"a":1,"e":"Le nombre de lignes s&#39;appelle la cardinalité de la relation."},{"n":"mld-normalisation","q":"Une colonne « telephones » contenant « 0611…, 0522… » viole :","o":["la 1NF","la 2NF","la 3NF"],"a":0,"e":"Valeur non atomique."},{"n":"mld-normalisation","q":"Dans R(A, B, C) de clé A, avec B → C : R n&#39;est pas en","o":["1NF","2NF","3NF"],"a":2,"e":"A → B → C : dépendance transitive."},{"n":"mld-normalisation","q":"La règle 3 (cardinalité 1,1) exige que l&#39;association soit :","o":["binaire et sans données propres","ternaire","porteuse de données"],"a":0,"e":"Sinon on crée une relation associative."},{"n":"mld-normalisation","q":"Que fait ON DELETE CASCADE ?","o":["Il interdit la suppression du parent","Il supprime automatiquement les lignes enfants","Il met les clés étrangères à NULL"],"a":1,"e":"Mettre à NULL, c&#39;est ON DELETE SET NULL."},{"n":"mld-normalisation","q":"Une super-clé est :","o":["un ensemble d&#39;attributs qui identifie une ligne, éventuellement avec des attributs en trop","une clé étrangère composée","la plus petite clé possible"],"a":0,"e":"La clé candidate est minimale ; la super-clé peut contenir du superflu."}]},{"id":"algebre-base","t":"Algèbre relationnelle (1) · sélection, projection, renommage, opérations ensemblistes","seance":"Séance 4 · 30 mars 2026","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut connaître les opérations sur les ensembles : union, intersection, différence, et le produit cartésien de deux ensembles.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>A = {1, 2, 3} et B = {2, 3, 4}. Calcule A ∪ B, A ∩ B, A − B et le nombre de couples de A × B.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>A ∪ B = {1, 2, 3, 4} ; A ∩ B = {2, 3} ; A − B = {1} ; A × B contient 3 × 3 = 9 couples.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Lignes ou colonnes ?<\/strong> σ (sélection) coupe des <strong>lignes<\/strong>, π (projection) garde des <strong>colonnes<\/strong>. Avant d&#39;écrire un symbole, demande-toi lequel des deux tu veux réduire.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Confondre σ et π à l&#39;examen : « sélectionner les étudiants dont le nom est Hassan » s&#39;écrit avec <strong>σ<\/strong> (filtre de lignes), même si le mot « sélectionner » fait penser à SELECT… qui, en SQL, correspond plutôt à π !<\/p>\n<\/aside><p>À la fin, tu sais écrire et évaluer à la main σ, π, ρ, ∪, ∩, − et ×, et les traduire en SQL.<\/p>\n<h2>Idée 1 · Une relation, un schéma, une extension<\/h2>\n<p>L&#39;algèbre relationnelle est un langage <strong>formel<\/strong> et <strong>procédural<\/strong> : elle dit <em>comment<\/em> obtenir le résultat. Ses opérateurs sont <strong>fermés<\/strong> : le résultat est encore une relation, on peut donc les enchaîner.<\/p>\n<ul>\n<li><strong>Schéma<\/strong> (intension) : <code>ÉTUDIANT(num_etu, nom, prénom, code_formation)<\/code> (statique).<\/li>\n<li><strong>Extension<\/strong> (instance) : les lignes à un instant donné (dynamique).<\/li>\n<li><strong>Tuple<\/strong> = ligne ; <strong>attribut<\/strong> = colonne ; <strong>domaine<\/strong> = valeurs possibles d&#39;un attribut.<\/li>\n<\/ul>\n<p>On crée l&#39;exemple du cours dans SQLite pour vérifier chaque opération :<\/p>\n<pre class=\"\"><code>CREATE TABLE ETUDIANT (num_etu INT PRIMARY KEY, nom TEXT, prenom TEXT, code_formation TEXT);\nINSERT INTO ETUDIANT VALUES (101,'Ali','Karim','Python'), (102,'Hassan','Laila','JavaScript'), (103,'Saad','Nadia','Python');\nCREATE TABLE ETUDIANTS_INFO (num_etu INT, nom TEXT, prenom TEXT);\nCREATE TABLE ETUDIANTS_MATH (num_etu INT, nom TEXT, prenom TEXT);\nINSERT INTO ETUDIANTS_INFO VALUES (101,'Ali','Karim'), (102,'Hassan','Laila'), (103,'Omar','Yassine');\nINSERT INTO ETUDIANTS_MATH VALUES (201,'Nadia','Samira'), (102,'Hassan','Laila'), (202,'Karim','Anas');<\/code><\/pre><h2>Idée 2 · Sélection σ : filtrer des lignes<\/h2>\n<figure class=\"grille\"><figcaption>σ code_formation='Python' (ÉTUDIANT)<\/figcaption><table><tr><th>num_etu<\/th><th>nom<\/th><th>prénom<\/th><th>code_formation<\/th><\/tr><tr><td class=\"h1\">101<\/td><td class=\"h1\">Ali<\/td><td class=\"h1\">Karim<\/td><td class=\"h1\">Python<\/td><\/tr><tr><td class=\"h0\">102<\/td><td class=\"h0\">Hassan<\/td><td class=\"h0\">Laila<\/td><td class=\"h0\">JavaScript<\/td><\/tr><tr><td class=\"h1\">103<\/td><td class=\"h1\">Saad<\/td><td class=\"h1\">Nadia<\/td><td class=\"h1\">Python<\/td><\/tr><\/table><\/figure><p>Notation : <strong>σ condition (R)<\/strong>. Opérateurs : =, ≠, &lt;, &gt;, ≤, ≥, ∧ (ET), ∨ (OU), ¬ (NON).<\/p>\n<pre class=\"\"><code>SELECT * FROM ETUDIANT WHERE nom = 'Hassan' AND code_formation = 'JavaScript';<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>num_etu | nom | prenom | code_formation\n102 | Hassan | Laila | JavaScript<\/code><\/pre><p>C&#39;est σ nom=&#39;Hassan&#39; ∧ code_formation=&#39;JavaScript&#39; (ÉTUDIANT).<\/p>\n<h2>Idée 3 · Projection π : garder des colonnes<\/h2>\n<p><strong>π attributs (R)<\/strong> garde les colonnes demandées et <strong>élimine les doublons<\/strong> (le résultat est un ensemble).<\/p>\n<pre class=\"\"><code>SELECT DISTINCT nom FROM ETUDIANT WHERE code_formation = 'Python';<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>nom\nAli\nSaad<\/code><\/pre><p>C&#39;est π nom (σ code_formation=&#39;Python&#39; (ÉTUDIANT)) : on lit de <strong>l&#39;intérieur vers l&#39;extérieur<\/strong>.<\/p>\n<aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>En SQL, <code>SELECT<\/code> <strong>garde les doublons<\/strong> par défaut. Pour obtenir exactement la projection, il faut <code>SELECT DISTINCT<\/code>.<\/p>\n<\/aside><h2>Idée 4 · Renommage ρ<\/h2>\n<ul>\n<li>Relation : ρ APPRENANT (ÉTUDIANT).<\/li>\n<li>Attributs : ρ APPRENANT(id_apprenant, nom, prénom, id_formation) (ÉTUDIANT).<\/li>\n<li>Pour renommer <strong>un seul<\/strong> attribut, on recopie <strong>toute<\/strong> la liste : ρ ÉTUDIANT(num_etu, nom_etudiant, prénom, code_formation) (ÉTUDIANT).<\/li>\n<\/ul>\n<p>En SQL, c&#39;est l&#39;alias <code>AS<\/code> (chapitre 7).<\/p>\n<h2>Idée 5 · Union, intersection, différence<\/h2>\n<p>Condition commune : les deux relations sont <strong>compatibles<\/strong> (même nombre d&#39;attributs, types correspondants, même ordre).<\/p>\n<figure class=\"grille\"><figcaption>INFO et MATH : orange = dans les deux<\/figcaption><table><tr><th>num_etu<\/th><th>INFO<\/th><th>MATH<\/th><\/tr><tr><td>101<\/td><td>oui<\/td><td class=\"h0\">non<\/td><\/tr><tr><td class=\"h1\">102<\/td><td class=\"h1\">oui<\/td><td class=\"h1\">oui<\/td><\/tr><tr><td>103<\/td><td>oui<\/td><td class=\"h0\">non<\/td><\/tr><tr><td>201<\/td><td class=\"h0\">non<\/td><td>oui<\/td><\/tr><tr><td>202<\/td><td class=\"h0\">non<\/td><td>oui<\/td><\/tr><\/table><\/figure><pre class=\"\"><code>SELECT * FROM ETUDIANTS_INFO UNION SELECT * FROM ETUDIANTS_MATH ORDER BY num_etu;\nSELECT * FROM ETUDIANTS_INFO INTERSECT SELECT * FROM ETUDIANTS_MATH;\nSELECT * FROM ETUDIANTS_INFO EXCEPT SELECT * FROM ETUDIANTS_MATH;<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>num_etu | nom | prenom\n101 | Ali | Karim\n102 | Hassan | Laila\n103 | Omar | Yassine\n201 | Nadia | Samira\n202 | Karim | Anas\nnum_etu | nom | prenom\n102 | Hassan | Laila\nnum_etu | nom | prenom\n101 | Ali | Karim\n103 | Omar | Yassine<\/code><\/pre><ul>\n<li>R ∪ S : 5 tuples (102 n&#39;apparaît qu&#39;une fois).<\/li>\n<li>R ∩ S : seulement 102.<\/li>\n<li>R − S : 101 et 103. <strong>Pas commutatif<\/strong> : S − R donne 201 et 202.<\/li>\n<\/ul>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Dans les diapos, la relation INFO change entre l&#39;exemple de l&#39;union (101, 102, 103) et ceux de l&#39;intersection et de la différence (où 202 Karim Anas apparaît en plus dans INFO, d&#39;où le résultat 102 et 202). Le tableau de l&#39;intersection est aussi titré « Résultat de l&#39;union » par erreur. Ici, on garde une seule version des données (celle de l&#39;union).<\/p>\n<\/aside><aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Projeter <strong>avant<\/strong> l&#39;union (π(R) ∪ π(S)) donne le même résultat que projeter après, mais traite moins de données.<\/p>\n<\/aside><h2>Idée 6 · Produit cartésien ×<\/h2>\n<p>R × S associe <strong>chaque<\/strong> tuple de R à <strong>chaque<\/strong> tuple de S : |R × S| = |R| × |S| lignes et (m + n) attributs.<\/p>\n<pre class=\"\"><code>CREATE TABLE COURS (id_cours INT, nom_cours TEXT);\nINSERT INTO COURS VALUES (101,'Mathématiques'), (102,'Informatique');\nSELECT E.num_etu, E.nom, C.nom_cours FROM ETUDIANT E, COURS C WHERE E.num_etu &lt; 103;<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>num_etu | nom | nom_cours\n101 | Ali | Mathématiques\n101 | Ali | Informatique\n102 | Hassan | Mathématiques\n102 | Hassan | Informatique<\/code><\/pre><p>2 étudiants × 2 cours = 4 lignes. Avec 1000 et 2000 tuples : 2 000 000 lignes ! D&#39;où le conseil du prof : utiliser une <strong>jointure<\/strong> plutôt qu&#39;un produit cartésien suivi d&#39;une sélection.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Évaluer une expression imbriquée : π nom (σ code_formation='Python' (ÉTUDIANT))<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Repérer la relation de départ<\/div><p>ÉTUDIANT, 3 tuples.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Appliquer l&#39;opérateur le plus intérieur<\/div><p>σ garde 101 Ali et 103 Saad.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Appliquer l&#39;opérateur suivant<\/div><p>π nom garde la colonne nom : Ali, Saad.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Éliminer les doublons<\/div><p>Aucun ici. Résultat : 2 tuples.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices types (TD2, examen)<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>(TD2 Q1) Écris en algèbre relationnelle : « tous les auteurs marocains » avec AUTEUR(IdAuteur, Nom, Prenom, Nationalite).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>σ Nationalite=&#39;Marocaine&#39; (AUTEUR). Résultat : A1 Benali et A4 Fadel.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>(TD2 Q2) « Les titres des livres publiés après 2018 » avec LIVRE(ISBN, Titre, AnneeParution, Editeur).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>π Titre (σ AnneeParution&gt;2018 (LIVRE)) : Apprendre SQL (2020), Algèbre relationnelle (2022), Introduction à Python (2019).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>R contient 5 tuples, S en contient 3. Combien de tuples dans R × S ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 15<\/b><\/p><p>5 × 3 = 15 (question de l&#39;examen 2025).<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Lequel de ces éléments représente une ligne dans une relation ?<\/div><button class=\"opt\" data-o=\"0\">Un attribut<\/button><button class=\"opt\" data-o=\"1\">Un domaine<\/button><button class=\"opt\" data-o=\"2\">Un tuple<\/button><button class=\"opt\" data-o=\"3\">Un schéma<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Pour sélectionner les étudiants nommés Hassan ET en JavaScript, on écrit :<\/div><button class=\"opt\" data-o=\"0\">σ nom=&#39;Hassan&#39; ∨ code_formation=&#39;JavaScript&#39; (ÉTUDIANT)<\/button><button class=\"opt\" data-o=\"1\">π nom=&#39;Hassan&#39; ∧ code_formation=&#39;JavaScript&#39; (ÉTUDIANT)<\/button><button class=\"opt\" data-o=\"2\">ρ nom=&#39;Hassan&#39; ∧ code_formation=&#39;JavaScript&#39; (ÉTUDIANT)<\/button><button class=\"opt\" data-o=\"3\">σ nom=&#39;Hassan&#39; ∧ code_formation=&#39;JavaScript&#39; (ÉTUDIANT)<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">R a 5 tuples, S en a 3. Combien de tuples dans R × S ?<\/div><button class=\"opt\" data-o=\"0\">8<\/button><button class=\"opt\" data-o=\"1\">2<\/button><button class=\"opt\" data-o=\"2\">5<\/button><button class=\"opt\" data-o=\"3\">15<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">La projection π :<\/div><button class=\"opt\" data-o=\"0\">élimine les doublons<\/button><button class=\"opt\" data-o=\"1\">garde toujours les doublons<\/button><button class=\"opt\" data-o=\"2\">filtre les lignes<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Quel opérateur SQL correspond à la différence − ?<\/div><button class=\"opt\" data-o=\"0\">UNION<\/button><button class=\"opt\" data-o=\"1\">INTERSECT<\/button><button class=\"opt\" data-o=\"2\">EXCEPT<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">R(A,B,C) × S(X,Y) a combien d&#39;attributs ?<\/div><button class=\"opt\" data-o=\"0\">3<\/button><button class=\"opt\" data-o=\"1\">5<\/button><button class=\"opt\" data-o=\"2\">6<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">L&#39;algèbre relationnelle est un langage :<\/div><button class=\"opt\" data-o=\"0\">formel et procédural<\/button><button class=\"opt\" data-o=\"1\">déclaratif et graphique<\/button><button class=\"opt\" data-o=\"2\">de programmation objet<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Pour renommer un seul attribut avec ρ :<\/div><button class=\"opt\" data-o=\"0\">on écrit seulement le nouveau nom<\/button><button class=\"opt\" data-o=\"1\">on recopie toute la liste des attributs<\/button><button class=\"opt\" data-o=\"2\">c&#39;est impossible<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">INFO = {101, 102, 103}, MATH = {201, 102, 202}. INFO ∩ MATH contient :<\/div><button class=\"opt\" data-o=\"0\">102<\/button><button class=\"opt\" data-o=\"1\">101, 103<\/button><button class=\"opt\" data-o=\"2\">102, 202<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Opérateurs « fermés » signifie :<\/div><button class=\"opt\" data-o=\"0\">ils ne marchent que sur une table<\/button><button class=\"opt\" data-o=\"1\">leur résultat est une relation, donc on peut les combiner<\/button><button class=\"opt\" data-o=\"2\">ils ne renvoient jamais de doublons<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"algebre-base","rep":null,"tol":null},{"n":"algebre-base","rep":null,"tol":null},{"n":"algebre-base","rep":null,"tol":null},{"n":"algebre-base","rep":["15"],"tol":null}],"qcm":[{"n":"algebre-base","q":"Lequel de ces éléments représente une ligne dans une relation ?","o":["Un attribut","Un domaine","Un tuple","Un schéma"],"a":2,"e":"Examen 2025."},{"n":"algebre-base","q":"Pour sélectionner les étudiants nommés Hassan ET en JavaScript, on écrit :","o":["σ nom=&#39;Hassan&#39; ∨ code_formation=&#39;JavaScript&#39; (ÉTUDIANT)","π nom=&#39;Hassan&#39; ∧ code_formation=&#39;JavaScript&#39; (ÉTUDIANT)","ρ nom=&#39;Hassan&#39; ∧ code_formation=&#39;JavaScript&#39; (ÉTUDIANT)","σ nom=&#39;Hassan&#39; ∧ code_formation=&#39;JavaScript&#39; (ÉTUDIANT)"],"a":3,"e":"Examen 2025 : filtre de lignes (σ) avec un ET (∧)."},{"n":"algebre-base","q":"R a 5 tuples, S en a 3. Combien de tuples dans R × S ?","o":["8","2","5","15"],"a":3,"e":"Examen 2025 : produit des cardinalités."},{"n":"algebre-base","q":"La projection π :","o":["élimine les doublons","garde toujours les doublons","filtre les lignes"],"a":0,"e":"C&#39;est une opération ensembliste."},{"n":"algebre-base","q":"Quel opérateur SQL correspond à la différence − ?","o":["UNION","INTERSECT","EXCEPT"],"a":2,"e":"MySQL 8.0.31+ l&#39;accepte aussi ; avant, on utilisait NOT IN."},{"n":"algebre-base","q":"R(A,B,C) × S(X,Y) a combien d&#39;attributs ?","o":["3","5","6"],"a":1,"e":"m + n = 3 + 2."},{"n":"algebre-base","q":"L&#39;algèbre relationnelle est un langage :","o":["formel et procédural","déclaratif et graphique","de programmation objet"],"a":0,"e":"Elle décrit les opérations à effectuer."},{"n":"algebre-base","q":"Pour renommer un seul attribut avec ρ :","o":["on écrit seulement le nouveau nom","on recopie toute la liste des attributs","c&#39;est impossible"],"a":1,"e":"Il n&#39;existe pas de notation pour un seul attribut."},{"n":"algebre-base","q":"INFO = {101, 102, 103}, MATH = {201, 102, 202}. INFO ∩ MATH contient :","o":["102","101, 103","102, 202"],"a":0,"e":"Seul 102 est dans les deux."},{"n":"algebre-base","q":"Opérateurs « fermés » signifie :","o":["ils ne marchent que sur une table","leur résultat est une relation, donc on peut les combiner","ils ne renvoient jamais de doublons"],"a":1,"e":"C&#39;est ce qui permet les expressions imbriquées."}]},{"id":"algebre-jointures","t":"Algèbre relationnelle (2) · jointures, division, agrégation et tri","seance":"Séance 5 · 30 mars 2026","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut maîtriser σ, π et le produit cartésien × (chapitre 3) : toutes les jointures en sont des combinaisons.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>ÉTUDIANT a 5 lignes, FORMATION en a 5. Combien de lignes dans ÉTUDIANT × FORMATION ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 25<\/b><\/p><p>5 × 5 = 25. Une jointure va en garder seulement une partie.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Une jointure = × puis σ.<\/strong> Retiens cette formule et tu peux retrouver n&#39;importe quelle jointure interne : R ⋈θ S = σθ (R × S).<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Croire qu&#39;une jointure interne garde tout le monde. Une ligne <strong>sans correspondance disparaît<\/strong>. Pour la garder, il faut une jointure <strong>externe<\/strong> (gauche, droite ou complète).<\/p>\n<\/aside><p>À la fin, tu sais distinguer jointure naturelle, thêta, équi-jointure et jointures externes, écrire une division et un regroupement γ.<\/p>\n<h2>Idée 1 · Les données du prof<\/h2>\n<pre class=\"\"><code>CREATE TABLE FORMATION (ID_Formation INT PRIMARY KEY, Nom_Formation TEXT, Etablissement TEXT, Diplome TEXT);\nCREATE TABLE ETUDIANT (CNE TEXT PRIMARY KEY, Nom TEXT, Prenom TEXT, Ville TEXT, ID_Formation INT);\nINSERT INTO FORMATION VALUES\n (1,'Ingénierie Informatique','ENSIAS - Rabat','Master'),\n (2,'Intelligence Artificielle','FST - Settat','Master'),\n (3,'Big Data &amp; Cloud Computing','FP - Béni Mellal','Master'),\n (4,'Management des Entreprises','FSJES - Casablanca','Licence'),\n (6,'Cybersécurité','EMI - Rabat','Master');\nINSERT INTO ETUDIANT VALUES\n ('2020456789','YOU','Youssef','Casablanca',1),\n ('2021123456','SAL','Salma','Rabat',2),\n ('2019987654','MEH','Mehdi','Marrakech',3),\n ('2020789123','FAT','Fatima','Béni Mellal',4),\n ('2019674321','OMA','Omar','Agadir',5);<\/code><\/pre><p>Omar a la formation 5 qui <strong>n&#39;existe pas<\/strong> dans FORMATION ; la formation 6 (Cybersécurité) n&#39;a <strong>aucun<\/strong> étudiant. Ces deux lignes « orphelines » vont révéler la différence entre les jointures.<\/p>\n<h2>Idée 2 · Les jointures internes<\/h2>\n<table>\n<thead>\n<tr>\n<th>Jointure<\/th>\n<th>Notation<\/th>\n<th>Condition<\/th>\n<th>Colonnes communes<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Naturelle<\/td>\n<td>R ⋈ S<\/td>\n<td>égalité sur <strong>tous<\/strong> les attributs de même nom<\/td>\n<td><strong>une seule fois<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Thêta<\/td>\n<td>R ⋈θ S<\/td>\n<td>condition quelconque (&lt;, &gt;, ≠, =…)<\/td>\n<td>toutes gardées<\/td>\n<\/tr>\n<tr>\n<td>Équi-jointure<\/td>\n<td>R ⋈ R.A=S.B S<\/td>\n<td>égalité seulement<\/td>\n<td><strong>en double<\/strong><\/td>\n<\/tr>\n<\/tbody><\/table>\n<pre class=\"\"><code>SELECT E.Prenom, F.Nom_Formation FROM ETUDIANT E NATURAL JOIN FORMATION F;<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Prenom | Nom_Formation\nYoussef | Ingénierie Informatique\nSalma | Intelligence Artificielle\nMehdi | Big Data &amp; Cloud Computing\nFatima | Management des Entreprises<\/code><\/pre><p>Omar disparaît (pas de formation 5) et Cybersécurité aussi (pas d&#39;étudiant).<\/p>\n<p>Jointure thêta du cours : chaque étudiant avec chaque formation d&#39;ID <strong>strictement supérieur<\/strong>, et Master seulement :<\/p>\n<pre class=\"\"><code>SELECT E.Prenom, E.ID_Formation AS E_ID, F.ID_Formation AS F_ID\nFROM ETUDIANT E JOIN FORMATION F\n  ON E.ID_Formation &lt; F.ID_Formation AND F.Diplome = 'Master'\nORDER BY E_ID, F_ID;<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Prenom | E_ID | F_ID\nYoussef | 1 | 2\nYoussef | 1 | 3\nYoussef | 1 | 6\nSalma | 2 | 3\nSalma | 2 | 6\nMehdi | 3 | 6\nFatima | 4 | 6\nOmar | 5 | 6<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Les diapos (formations 1 à 5, avec Génie Civil en 5) donnent 7 lignes pour cet exemple. Ici on utilise les données de la jointure externe (formation 6 à la place de 5) : le résultat change, la méthode est la même.<\/p>\n<\/aside><h2>Idée 3 · Les jointures externes<\/h2>\n<svg viewBox=\"0 0 600 130\" style=\"width:100%;max-width:600px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Trois diagrammes : jointure gauche garde tout ÉTUDIANT, droite garde tout FORMATION, complète garde les deux\">\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\">\n<g><circle cx=\"70\" cy=\"55\" r=\"38\" fill=\"#D9824F\" fill-opacity=\".45\" stroke=\"currentColor\"/><circle cx=\"120\" cy=\"55\" r=\"38\" fill=\"none\" stroke=\"currentColor\"/><text x=\"95\" y=\"118\">⟕ gauche<\/text><\/g>\n<g><circle cx=\"270\" cy=\"55\" r=\"38\" fill=\"none\" stroke=\"currentColor\"/><circle cx=\"320\" cy=\"55\" r=\"38\" fill=\"#D9824F\" fill-opacity=\".45\" stroke=\"currentColor\"/><text x=\"295\" y=\"118\">⟖ droite<\/text><\/g>\n<g><circle cx=\"470\" cy=\"55\" r=\"38\" fill=\"#D9824F\" fill-opacity=\".45\" stroke=\"currentColor\"/><circle cx=\"520\" cy=\"55\" r=\"38\" fill=\"#D9824F\" fill-opacity=\".45\" stroke=\"currentColor\"/><text x=\"495\" y=\"118\">⟗ complète<\/text><\/g>\n<text x=\"70\" y=\"60\" font-size=\"11\">ÉTU<\/text><text x=\"120\" y=\"60\" font-size=\"11\">FORM<\/text>\n<\/g><\/svg><p>Les lignes sans correspondance sont gardées et complétées par <strong>NULL<\/strong>.<\/p>\n<pre class=\"\"><code>SELECT E.Prenom, F.ID_Formation, F.Nom_Formation\nFROM ETUDIANT E FULL OUTER JOIN FORMATION F ON E.ID_Formation = F.ID_Formation;<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Prenom | ID_Formation | Nom_Formation\nYoussef | 1 | Ingénierie Informatique\nSalma | 2 | Intelligence Artificielle\nMehdi | 3 | Big Data &amp; Cloud Computing\nFatima | 4 | Management des Entreprises\nOmar | NULL | NULL\nNULL | 6 | Cybersécurité<\/code><\/pre><ul>\n<li><strong>Gauche<\/strong> (ÉTUDIANT ⟕ FORMATION) : les 5 étudiants, Omar avec NULL.<\/li>\n<li><strong>Droite<\/strong> (⟖) : les 5 formations, Cybersécurité avec des NULL côté étudiant.<\/li>\n<li><strong>Complète<\/strong> (⟗) : les deux orphelins.<\/li>\n<\/ul>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>SQLite gère RIGHT et FULL OUTER JOIN depuis la version 3.39. <strong>MySQL ne connaît pas FULL OUTER JOIN<\/strong> : on l&#39;obtient par <code>LEFT JOIN … UNION … RIGHT JOIN<\/code> (chapitre 8).<\/p>\n<\/aside><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Dans la diapo de la jointure complète, les noms passent en anglais (« Computer Engineering », « Bachelor »…). Ce sont les mêmes formations que dans les exemples précédents.<\/p>\n<\/aside><h2>Idée 4 · La division ÷ : « associé à TOUS »<\/h2>\n<p>R ÷ S donne les tuples de R associés à <strong>tous<\/strong> les tuples de S. Condition : le schéma de S est <strong>strictement inclus<\/strong> dans celui de R.<\/p>\n<figure class=\"grille\"><figcaption>Etudiant_Formation ÷ Formation_Examen(1, Examen 1), (1, Examen 2)<\/figcaption><table><tr><th>Prénom<\/th><th>ID<\/th><th>Examen<\/th><\/tr><tr><td class=\"h1\">Youssef<\/td><td class=\"h1\">1<\/td><td class=\"h1\">Examen 1<\/td><\/tr><tr><td class=\"h1\">Youssef<\/td><td class=\"h1\">1<\/td><td class=\"h1\">Examen 2<\/td><\/tr><tr><td>Salma<\/td><td>2<\/td><td>Examen 1<\/td><\/tr><tr><td>Mehdi<\/td><td>3<\/td><td>Examen 2<\/td><\/tr><\/table><\/figure><p>Seul Youssef a <strong>les deux<\/strong> examens de la formation 1.<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>La diapo n&#39;affiche qu&#39;une ligne dans Formation_Examen, (1, Examen 1), alors que le texte parle des « deux examens liés à la formation 1 ». On complète S avec (1, Examen 2), ce qui correspond à l&#39;explication : seul Youssef est associé aux deux.<\/p>\n<\/aside><p>En SQL il n&#39;y a pas d&#39;opérateur division : on écrit une <strong>double négation<\/strong> (« il n&#39;existe pas d&#39;examen de S que l&#39;étudiant n&#39;a pas passé ») :<\/p>\n<pre class=\"\"><code>CREATE TABLE EF (CNE TEXT, Prenom TEXT, ID_Formation INT, Examen TEXT);\nINSERT INTO EF VALUES ('2020456789','Youssef',1,'Examen 1'), ('2020456789','Youssef',1,'Examen 2'),\n ('2021123456','Salma',2,'Examen 1'), ('2019987654','Mehdi',3,'Examen 2');\nCREATE TABLE FE (ID_Formation INT, Examen TEXT);\nINSERT INTO FE VALUES (1,'Examen 1'), (1,'Examen 2');\nSELECT DISTINCT a.CNE, a.Prenom FROM EF a\nWHERE NOT EXISTS (\n  SELECT * FROM FE s WHERE NOT EXISTS (\n    SELECT * FROM EF b WHERE b.CNE = a.CNE AND b.ID_Formation = s.ID_Formation AND b.Examen = s.Examen));<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>CNE | Prenom\n2020456789 | Youssef<\/code><\/pre><h2>Idée 5 · Agrégation γ et tri τ<\/h2>\n<p><strong>γ attributs_de_regroupement ; FONCTION(A) → nom (R)<\/strong> : COMPTE (COUNT), SOMME (SUM), MOYENNE (AVG), MIN, MAX.<\/p>\n<pre class=\"\"><code>CREATE TABLE ETU (Matricule TEXT, Nom TEXT, ID_Formation TEXT, Age INT);\nINSERT INTO ETU VALUES ('E001','Ali','F1',21), ('E002','Salma','F2',22), ('E003','Yassir','F1',20),\n ('E004','Fatima','F1',23), ('E005','Mehdi','F2',24);\nSELECT ID_Formation, COUNT(Matricule) AS Nombre_Etudiants, ROUND(AVG(Age), 2) AS Age_Moyen\nFROM ETU GROUP BY ID_Formation;<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>ID_Formation | Nombre_Etudiants | Age_Moyen\nF1 | 3 | 21.33\nF2 | 2 | 23.0<\/code><\/pre><p>C&#39;est γ ID_Formation ; COMPTE(Matricule) → Nombre_Etudiants, MOYENNE(Age) → Age_Moyen (ETU).<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Deux erreurs dans les diapos d&#39;agrégation : (1) l&#39;exemple 1 (F1 : 4 étudiants, F2 : 2) n&#39;affiche que la ligne F1 ; il manque <strong>F2 | 2<\/strong> ; (2) l&#39;exemple 4 compte COMPTE(CNE) alors que la relation n&#39;a pas d&#39;attribut CNE mais <strong>Matricule<\/strong>.<\/p>\n<\/aside><p>Le <strong>tri τ<\/strong> (tau) est une extension, pas un opérateur de l&#39;algèbre classique (les relations sont des ensembles non ordonnés). Exemple : τ Age DESC (ETU), équivalent de <code>ORDER BY Age DESC<\/code>.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices types (TD2, examen)<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>(TD2 Q4) Noms, prénoms des auteurs et titres des livres qu&#39;ils ont rédigés (AUTEUR, LIVRE, REDIGE).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>π Nom, Prenom, Titre (AUTEUR ⋈ REDIGE ⋈ LIVRE). Les jointures naturelles se font sur IdAuteur puis ISBN.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>(TD2 Q8) Nombre de livres rédigés par chaque auteur.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>γ IdAuteur ; COMPTE(ISBN) → NbLivres (REDIGE). Pour avoir le nom : γ IdAuteur, Nom ; COMPTE(ISBN) → NbLivres (AUTEUR ⋈ REDIGE).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>(TD2 Q11) Auteurs ayant rédigé tous les livres publiés par Gallimard.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>π IdAuteur, ISBN (REDIGE) ÷ π ISBN (σ Editeur=&#39;Gallimard&#39; (LIVRE)). Gallimard = {L2, L3} ; A1 a écrit L2 et L3 → résultat A1.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Dans une jointure thêta, R ⋈θ S signifie :<\/div><button class=\"opt\" data-o=\"0\">R × S puis σθ (R × S)<\/button><button class=\"opt\" data-o=\"1\">σθ(R) × S<\/button><button class=\"opt\" data-o=\"2\">R ∪ S avec la condition θ<\/button><button class=\"opt\" data-o=\"3\">πθ (R × S)<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Pour la division R ÷ S, il faut :<\/div><button class=\"opt\" data-o=\"0\">que R et S aient le même nombre d&#39;attributs<\/button><button class=\"opt\" data-o=\"1\">que le schéma de S soit strictement inclus dans celui de R<\/button><button class=\"opt\" data-o=\"2\">que R et S soient disjoints<\/button><button class=\"opt\" data-o=\"3\">que S ait plus d&#39;attributs que R<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Notation correcte pour compter les étudiants par formation :<\/div><button class=\"opt\" data-o=\"0\">σ ID_Formation ; COUNT(CNE) (Etudiant)<\/button><button class=\"opt\" data-o=\"1\">π ID_Formation ; COUNT(CNE) (Etudiant)<\/button><button class=\"opt\" data-o=\"2\">γ ID_Formation ; COUNT(CNE) → Nombre_Etudiants (Etudiant)<\/button><button class=\"opt\" data-o=\"3\">τ ID_Formation ; COUNT(CNE) (Etudiant)<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">La jointure naturelle :<\/div><button class=\"opt\" data-o=\"0\">combine deux relations sans condition<\/button><button class=\"opt\" data-o=\"1\">fusionne automatiquement les relations en utilisant toutes les colonnes communes<\/button><button class=\"opt\" data-o=\"2\">sélectionne uniquement les lignes identiques<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Quelle jointure retourne uniquement les lignes avec correspondance dans les deux tables ?<\/div><button class=\"opt\" data-o=\"0\">LEFT JOIN<\/button><button class=\"opt\" data-o=\"1\">FULL OUTER JOIN<\/button><button class=\"opt\" data-o=\"2\">INNER JOIN<\/button><button class=\"opt\" data-o=\"3\">CROSS JOIN<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Dans ÉTUDIANT ⟕ FORMATION, Omar (formation 5 inexistante) :<\/div><button class=\"opt\" data-o=\"0\">apparaît, avec NULL dans les colonnes de FORMATION<\/button><button class=\"opt\" data-o=\"1\">disparaît<\/button><button class=\"opt\" data-o=\"2\">provoque une erreur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">L&#39;équi-jointure, par rapport à la jointure naturelle :<\/div><button class=\"opt\" data-o=\"0\">supprime les colonnes communes<\/button><button class=\"opt\" data-o=\"1\">conserve les colonnes de jointure en double<\/button><button class=\"opt\" data-o=\"2\">accepte la condition &lt;<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Quelle question appelle une division ?<\/div><button class=\"opt\" data-o=\"0\">Les auteurs ayant écrit au moins un livre<\/button><button class=\"opt\" data-o=\"1\">Les auteurs ayant écrit tous les livres de Gallimard<\/button><button class=\"opt\" data-o=\"2\">Le nombre de livres par auteur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">AVG(Age) pour F1 = {21, 20, 23} vaut :<\/div><button class=\"opt\" data-o=\"0\">21.33<\/button><button class=\"opt\" data-o=\"1\">21<\/button><button class=\"opt\" data-o=\"2\">64<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Le tri τ en algèbre relationnelle :<\/div><button class=\"opt\" data-o=\"0\">est une opération fondamentale<\/button><button class=\"opt\" data-o=\"1\">est une extension, car une relation est un ensemble non ordonné<\/button><button class=\"opt\" data-o=\"2\">n&#39;existe pas en SQL<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"algebre-jointures","rep":["25"],"tol":null},{"n":"algebre-jointures","rep":null,"tol":null},{"n":"algebre-jointures","rep":null,"tol":null},{"n":"algebre-jointures","rep":null,"tol":null}],"qcm":[{"n":"algebre-jointures","q":"Dans une jointure thêta, R ⋈θ S signifie :","o":["R × S puis σθ (R × S)","σθ(R) × S","R ∪ S avec la condition θ","πθ (R × S)"],"a":0,"e":"Examen 2025."},{"n":"algebre-jointures","q":"Pour la division R ÷ S, il faut :","o":["que R et S aient le même nombre d&#39;attributs","que le schéma de S soit strictement inclus dans celui de R","que R et S soient disjoints","que S ait plus d&#39;attributs que R"],"a":1,"e":"Examen 2025."},{"n":"algebre-jointures","q":"Notation correcte pour compter les étudiants par formation :","o":["σ ID_Formation ; COUNT(CNE) (Etudiant)","π ID_Formation ; COUNT(CNE) (Etudiant)","γ ID_Formation ; COUNT(CNE) → Nombre_Etudiants (Etudiant)","τ ID_Formation ; COUNT(CNE) (Etudiant)"],"a":2,"e":"Examen 2025 : γ = regroupement."},{"n":"algebre-jointures","q":"La jointure naturelle :","o":["combine deux relations sans condition","fusionne automatiquement les relations en utilisant toutes les colonnes communes","sélectionne uniquement les lignes identiques"],"a":1,"e":"Examen 2025."},{"n":"algebre-jointures","q":"Quelle jointure retourne uniquement les lignes avec correspondance dans les deux tables ?","o":["LEFT JOIN","FULL OUTER JOIN","INNER JOIN","CROSS JOIN"],"a":2,"e":"Examen 2025."},{"n":"algebre-jointures","q":"Dans ÉTUDIANT ⟕ FORMATION, Omar (formation 5 inexistante) :","o":["apparaît, avec NULL dans les colonnes de FORMATION","disparaît","provoque une erreur"],"a":0,"e":"C&#39;est le rôle de la jointure externe gauche."},{"n":"algebre-jointures","q":"L&#39;équi-jointure, par rapport à la jointure naturelle :","o":["supprime les colonnes communes","conserve les colonnes de jointure en double","accepte la condition &lt;"],"a":1,"e":"Seule la naturelle fusionne les colonnes communes."},{"n":"algebre-jointures","q":"Quelle question appelle une division ?","o":["Les auteurs ayant écrit au moins un livre","Les auteurs ayant écrit tous les livres de Gallimard","Le nombre de livres par auteur"],"a":1,"e":"Le mot « tous » signale la division."},{"n":"algebre-jointures","q":"AVG(Age) pour F1 = {21, 20, 23} vaut :","o":["21.33","21","64"],"a":0,"e":"64 / 3 ≈ 21,33."},{"n":"algebre-jointures","q":"Le tri τ en algèbre relationnelle :","o":["est une opération fondamentale","est une extension, car une relation est un ensemble non ordonné","n&#39;existe pas en SQL"],"a":1,"e":"C&#39;est le « bonus » de la séance 5."}]},{"id":"sql-ldd","t":"SQL et MySQL · définir les données (LDD)","seance":"Séances 6 et 7 · 3 et 7 avril 2026","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir lire un MLD (chapitre 2) : chaque relation devient une table, chaque clé une contrainte.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Traduis en phrase la relation Cours(code_cours, intitulé, num_ens#).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Une table Cours, de clé primaire code_cours, avec une colonne num_ens qui référence la clé primaire de la table Enseignant.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Classe chaque commande dans sa famille.<\/strong> CREATE / ALTER / DROP = structure (LDD). INSERT / UPDATE / DELETE = contenu (LMD). Une question d&#39;examen sur deux se résout en reconnaissant la famille.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Confondre <code>DROP TABLE<\/code> (supprime la table <strong>et<\/strong> sa structure), <code>TRUNCATE<\/code> (vide toutes les lignes, garde la structure) et <code>DELETE<\/code> (supprime des lignes choisies).<\/p>\n<\/aside><p>À la fin, tu sais créer une base et des tables MySQL avec leurs types et contraintes, et modifier leur structure avec ALTER TABLE.<\/p>\n<h2>Idée 1 · SQL et ses familles de commandes<\/h2>\n<p>SQL (Structured Query Language) vient du modèle relationnel d&#39;<strong>Edgar F. Codd<\/strong> (IBM, 1970). C&#39;est un langage <strong>normalisé<\/strong>, utilisé par MySQL, PostgreSQL, Oracle, SQL Server, SQLite…<\/p>\n<figure class=\"grille\"><figcaption>Les cinq familles<\/figcaption><table><tr><th>Famille<\/th><th>Rôle<\/th><th>Commandes<\/th><\/tr><tr><td class=\"h1\">LDD (DDL)<\/td><td>structure<\/td><td>CREATE, ALTER, DROP, TRUNCATE, RENAME<\/td><\/tr><tr><td class=\"h1\">LMD (DML)<\/td><td>contenu<\/td><td>INSERT, UPDATE, DELETE, REPLACE<\/td><\/tr><tr><td class=\"h1\">LID (DQL)<\/td><td>interrogation<\/td><td>SELECT<\/td><\/tr><tr><td class=\"h1\">LCD (DCL)<\/td><td>droits<\/td><td>GRANT, REVOKE<\/td><\/tr><tr><td class=\"h1\">TCL<\/td><td>transactions<\/td><td>COMMIT, ROLLBACK<\/td><\/tr><\/table><\/figure><p><strong>MySQL<\/strong> en pratique (TP avec MySQL Workbench) : serveur sur le <strong>port 3306<\/strong>, moteur de stockage par défaut <strong>InnoDB<\/strong> (transactions, clés étrangères), autres moteurs : MyISAM, MEMORY, CSV.<\/p>\n<h2>Idée 2 · Créer une base et une table<\/h2>\n<pre class=\"\"><code>CREATE DATABASE IF NOT EXISTS Universite\n  DEFAULT CHARACTER SET utf8mb4 DEFAULT COLLATE utf8mb4_general_ci;\nUSE Universite;\nDROP DATABASE IF EXISTS Universite;   -- DATABASE et SCHEMA sont synonymes en MySQL<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Ces commandes sont propres au serveur MySQL : SQLite (un fichier = une base) ne connaît ni <code>CREATE DATABASE<\/code> ni <code>USE<\/code>. Bloc non exécuté ici.<\/p>\n<\/aside><p><code>IF NOT EXISTS<\/code> / <code>IF EXISTS<\/code> évitent une erreur si l&#39;objet existe (ou pas).<\/p>\n<h2>Idée 3 · Types de données MySQL<\/h2>\n<table>\n<thead>\n<tr>\n<th>Catégorie<\/th>\n<th>Types<\/th>\n<th>À retenir<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Entiers<\/td>\n<td>TINYINT, SMALLINT, INT, BIGINT<\/td>\n<td><code>INT AUTO_INCREMENT<\/code> pour les clés<\/td>\n<\/tr>\n<tr>\n<td>Réels<\/td>\n<td>FLOAT, DOUBLE (approchés), <strong>DECIMAL(p, s)<\/strong> (exact)<\/td>\n<td>DECIMAL(4,2) : 4 chiffres dont 2 après la virgule → 99.99 max<\/td>\n<\/tr>\n<tr>\n<td>Texte<\/td>\n<td><strong>CHAR(n)<\/strong> taille fixe complétée par des espaces, <strong>VARCHAR(n)<\/strong> taille variable, TEXT<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Dates<\/td>\n<td>DATE <code>&#39;YYYY-MM-DD&#39;<\/code>, DATETIME, <strong>TIMESTAMP<\/strong> (1970 → 2038), TIME, YEAR<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Listes<\/td>\n<td><strong>ENUM<\/strong> (une valeur parmi une liste), <strong>SET<\/strong> (zéro ou plusieurs valeurs)<\/td>\n<td>spécifiques à MySQL<\/td>\n<\/tr>\n<\/tbody><\/table>\n<pre class=\"\"><code>CREATE TABLE Etudiant (\n  id_etudiant INT AUTO_INCREMENT PRIMARY KEY,\n  genre ENUM('Homme', 'Femme') DEFAULT 'Femme',\n  langues SET('Français', 'Anglais', 'Espagnol'),\n  date_inscription DATETIME DEFAULT CURRENT_TIMESTAMP,\n  dernier_login TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP\n) ENGINE = InnoDB;<\/code><\/pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>SQLite n&#39;a ni ENUM, ni SET, ni <code>ON UPDATE CURR
