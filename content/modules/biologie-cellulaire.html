const MODULE={"slug":"biologie-cellulaire","titre":"Biologie cellulaire","cle":"biologie-cellulaire_scores","cleEtat":"biologie-cellulaire_scores_etat","format":"score10","intro":"<p>Ce module suit <strong>le programme BioCell de la FST Béni Mellal<\/strong> (filière BCG, S2) : 8 chapitres de cours, puis les <strong>examens corrigés<\/strong> (2019-2020 et 2020).<\/p>\n<p><strong>Comment l&#39;utiliser<\/strong><\/p>\n<ol>\n<li>Lis un chapitre en entier, schémas compris : à l&#39;examen, on te demande souvent d&#39;« expliquer par un schéma ».<\/li>\n<li>Redessine chaque schéma de mémoire sur une feuille.<\/li>\n<li>Fais le QCM du chapitre. <strong>8/10 = chapitre maîtrisé.<\/strong><\/li>\n<\/ol>\n<p><strong>Ce qui est sûr<\/strong> : le plan et les sujets viennent des supports de la FST. <strong>À vérifier<\/strong> : le cours est rédigé par nous à partir de ces supports ; les chiffres (tailles, masses) sont les valeurs classiques des manuels.<\/p>\n","annexes":[],"cartes":null,"maths":false};
const CHAPS=[{"id":"organisation-cellulaire","t":"Organisation cellulaire","seance":"Chapitre 1 · Théorie cellulaire, procaryotes et eucaryotes","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Il te faut une seule notion : les ordres de grandeur. 1 mm = 1000 µm, 1 µm = 1000 nm.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Une bactérie mesure 2 µm. Combien de nanomètres ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 2000<\/b><\/p><p>2 µm = 2 × 1000 nm = 2000 nm.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense en compartiments.<\/strong> Toute la biologie cellulaire tient dans une question : « qu&#39;est-ce qui est séparé de quoi, et par quelle membrane ? »<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Beaucoup écrivent que la bactérie « n&#39;a pas d&#39;ADN » parce qu&#39;elle n&#39;a pas de noyau. Elle a de l&#39;ADN, mais libre dans le cytoplasme (le nucléoïde).<\/p>\n<\/aside><p>À la fin, tu sais distinguer en un coup d&#39;œil procaryote, cellule animale et cellule végétale.<\/p>\n<h2>Idée 1 · La théorie cellulaire<\/h2>\n<p>Trois énoncés, à connaître par cœur :<\/p>\n<ol>\n<li>Tout être vivant est fait d&#39;une ou plusieurs cellules.<\/li>\n<li>La cellule est la plus petite unité vivante.<\/li>\n<li>Toute cellule provient d&#39;une autre cellule (division).<\/li>\n<\/ol>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Schleiden (plantes, 1838), Schwann (animaux, 1839), Virchow (« omnis cellula e cellula », 1855).<\/p>\n<\/aside><h2>Idée 2 · Procaryote ou eucaryote<\/h2>\n<svg viewBox=\"0 0 320 120\" role=\"img\" aria-label=\"Procaryote sans noyau à gauche, eucaryote avec noyau et organites à droite\" style=\"max-width:420px;width:100%\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\n<rect x=\"10\" y=\"35\" width=\"110\" height=\"50\" rx=\"25\"/>\n<path d=\"M40 60c10-15 20 15 30 0s20 15 30 0\" stroke=\"#D9824F\"/>\n<ellipse cx=\"230\" cy=\"60\" rx=\"80\" ry=\"52\"/>\n<circle cx=\"220\" cy=\"58\" r=\"20\" fill=\"#D9824F\" fill-opacity=\".25\" stroke=\"#D9824F\"/>\n<ellipse cx=\"275\" cy=\"80\" rx=\"12\" ry=\"6\"/><ellipse cx=\"180\" cy=\"90\" rx=\"10\" ry=\"5\"/>\n<\/g>\n<g fill=\"currentColor\" font-size=\"11\"><text x=\"20\" y=\"105\">Procaryote : nucléoïde<\/text><text x=\"180\" y=\"122\">Eucaryote : noyau<\/text><\/g>\n<\/svg><figure class=\"grille\"><figcaption>Comparaison<\/figcaption><table><tr><th>Critère,<\/th><th>Procaryote,<\/th><th>Eucaryote<\/th><\/tr><tr><td class=\"h1\">Noyau,<\/td><td>absent<\/td><td>(nucléoïde),<\/td><td>présent<\/td><td>(enveloppe<\/td><td>nucléaire)<\/td><\/tr><tr><td class=\"h1\">Taille,<\/td><td>1<\/td><td>à<\/td><td>10<\/td><td>µm,<\/td><td>10<\/td><td>à<\/td><td>100<\/td><td>µm<\/td><\/tr><tr><td class=\"h1\">Organites<\/td><td>membranaires,<\/td><td>aucun,<\/td><td>mitochondries<\/td><td>RE<\/td><td>Golgi…<\/td><\/tr><tr><td class=\"h1\">Ribosomes,<\/td><td>70S,<\/td><td>80S<\/td><td>(70S<\/td><td>dans<\/td><td>mitochondries<\/td><td>et<\/td><td>chloroplastes)<\/td><\/tr><tr><td class=\"h1\">Exemples,<\/td><td>bactéries,<\/td><td>animaux<\/td><td>plantes<\/td><td>champignons<\/td><\/tr><\/table><\/figure><h2>Idée 3 · Cellule animale ou végétale<\/h2>\n<figure class=\"grille\"><figcaption>Ce qui les distingue<\/figcaption><table><tr><th>Structure,<\/th><th>Animale,<\/th><th>Végétale<\/th><\/tr><tr><td class=\"h1\">Paroi<\/td><td>pectocellulosique,<\/td><td>non,<\/td><td>oui<\/td><\/tr><tr><td class=\"h1\">Chloroplastes,<\/td><td>non,<\/td><td>oui<\/td><\/tr><tr><td class=\"h1\">Grande<\/td><td>vacuole,<\/td><td>non,<\/td><td>oui<\/td><\/tr><tr><td class=\"h1\">Centrioles,<\/td><td>oui,<\/td><td>non<\/td><td>(plantes<\/td><td>supérieures)<\/td><\/tr><tr><td class=\"h1\">Réserve,<\/td><td>glycogène,<\/td><td>amidon<\/td><\/tr><\/table><\/figure><aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>En TP, on observe un procaryote dans un frottis de yaourt, puis des cellules animales et végétales (épiderme d&#39;oignon).<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Application<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Une cellule a une paroi, des ribosomes 70S et pas de noyau. Qu&#39;est-ce ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Une bactérie (procaryote). Attention : une paroi n&#39;est pas une preuve de cellule végétale.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Cite deux structures présentes chez la cellule végétale et absentes chez la cellule animale.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Paroi pectocellulosique, chloroplastes, grande vacuole (deux suffisent).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Le noyau est absent chez :<\/div><button class=\"opt\" data-o=\"0\">les bactéries<\/button><button class=\"opt\" data-o=\"1\">les levures<\/button><button class=\"opt\" data-o=\"2\">les cellules végétales<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">« Omnis cellula e cellula » est attribué à :<\/div><button class=\"opt\" data-o=\"0\">Schwann<\/button><button class=\"opt\" data-o=\"1\">Virchow<\/button><button class=\"opt\" data-o=\"2\">Hooke<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Les ribosomes des eucaryotes sont :<\/div><button class=\"opt\" data-o=\"0\">70S<\/button><button class=\"opt\" data-o=\"1\">80S<\/button><button class=\"opt\" data-o=\"2\">60S<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Une cellule de 50 µm est probablement :<\/div><button class=\"opt\" data-o=\"0\">une bactérie<\/button><button class=\"opt\" data-o=\"1\">une cellule eucaryote<\/button><button class=\"opt\" data-o=\"2\">un virus<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Les centrioles sont présents chez :<\/div><button class=\"opt\" data-o=\"0\">la cellule animale<\/button><button class=\"opt\" data-o=\"1\">la cellule des plantes supérieures<\/button><button class=\"opt\" data-o=\"2\">la bactérie<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">La paroi végétale est surtout faite de :<\/div><button class=\"opt\" data-o=\"0\">chitine<\/button><button class=\"opt\" data-o=\"1\">cellulose et pectines<\/button><button class=\"opt\" data-o=\"2\">peptidoglycane<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Réserve glucidique végétale :<\/div><button class=\"opt\" data-o=\"0\">glycogène<\/button><button class=\"opt\" data-o=\"1\">amidon<\/button><button class=\"opt\" data-o=\"2\">glucose libre<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Les mitochondries sont absentes chez :<\/div><button class=\"opt\" data-o=\"0\">les bactéries<\/button><button class=\"opt\" data-o=\"1\">les cellules animales<\/button><button class=\"opt\" data-o=\"2\">les cellules végétales<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">1 µm vaut :<\/div><button class=\"opt\" data-o=\"0\">100 nm<\/button><button class=\"opt\" data-o=\"1\">1000 nm<\/button><button class=\"opt\" data-o=\"2\">10 nm<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">La grande vacuole centrale caractérise :<\/div><button class=\"opt\" data-o=\"0\">la cellule animale<\/button><button class=\"opt\" data-o=\"1\">la cellule végétale<\/button><button class=\"opt\" data-o=\"2\">la bactérie<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"organisation-cellulaire","rep":["2000"],"tol":null},{"n":"organisation-cellulaire","rep":null,"tol":null},{"n":"organisation-cellulaire","rep":null,"tol":null}],"qcm":[{"n":"organisation-cellulaire","q":"Le noyau est absent chez :","o":["les bactéries","les levures","les cellules végétales"],"a":0,"e":"Les levures sont des champignons, donc eucaryotes."},{"n":"organisation-cellulaire","q":"« Omnis cellula e cellula » est attribué à :","o":["Schwann","Virchow","Hooke"],"a":1,"e":"Virchow, 1855."},{"n":"organisation-cellulaire","q":"Les ribosomes des eucaryotes sont :","o":["70S","80S","60S"],"a":1,"e":"70S chez les procaryotes et dans les mitochondries."},{"n":"organisation-cellulaire","q":"Une cellule de 50 µm est probablement :","o":["une bactérie","une cellule eucaryote","un virus"],"a":1,"e":"Les bactéries font 1 à 10 µm."},{"n":"organisation-cellulaire","q":"Les centrioles sont présents chez :","o":["la cellule animale","la cellule des plantes supérieures","la bactérie"],"a":0,"e":"Les plantes supérieures n&#39;en ont pas."},{"n":"organisation-cellulaire","q":"La paroi végétale est surtout faite de :","o":["chitine","cellulose et pectines","peptidoglycane"],"a":1,"e":"Le peptidoglycane, c&#39;est la paroi bactérienne."},{"n":"organisation-cellulaire","q":"Réserve glucidique végétale :","o":["glycogène","amidon","glucose libre"],"a":1,"e":"Stocké dans les amyloplastes."},{"n":"organisation-cellulaire","q":"Les mitochondries sont absentes chez :","o":["les bactéries","les cellules animales","les cellules végétales"],"a":0,"e":"Pas d&#39;organites membranaires chez les procaryotes."},{"n":"organisation-cellulaire","q":"1 µm vaut :","o":["100 nm","1000 nm","10 nm"],"a":1,"e":"Facteur 1000."},{"n":"organisation-cellulaire","q":"La grande vacuole centrale caractérise :","o":["la cellule animale","la cellule végétale","la bactérie"],"a":1,"e":"Elle assure la turgescence."}]},{"id":"methodes-etude","t":"Méthodes d'étude de la cellule","seance":"TD 1 · Méthodes morphologiques et biochimiques","imp":3,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir ce qu&#39;est le pouvoir de résolution : la plus petite distance entre deux points que l&#39;œil ou l&#39;appareil distingue encore.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>L&#39;œil distingue 0,2 mm. Un objet de 20 µm est-il visible à l&#39;œil nu ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Non : 20 µm = 0,02 mm, dix fois plus petit que 0,2 mm.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « quelle question, quel outil ».<\/strong> Voir la forme : microscope. Connaître la composition : fractionner puis analyser.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Confondre grossissement et résolution. Agrandir une image floue ne montre pas plus de détails.<\/p>\n<\/aside><p>À la fin, tu sais choisir la bonne technique pour chaque question du TD 1.<\/p>\n<h2>Idée 1 · Les microscopes<\/h2>\n<figure class=\"grille\"><figcaption>Microscopes<\/figcaption><table><tr><th>Microscope,<\/th><th>Rayonnement,<\/th><th>Résolution,<\/th><th>Usage<\/th><\/tr><tr><td class=\"h1\">Optique<\/td><td>(photonique),<\/td><td>lumière<\/td><td>visible,<\/td><td>≈<\/td><td>0,2<\/td><td>µm,<\/td><td>cellules<\/td><td>entières<\/td><td>vivantes<\/td><td>ou<\/td><td>colorées<\/td><\/tr><tr><td class=\"h1\">Électronique<\/td><td>à<\/td><td>transmission<\/td><td>(MET),<\/td><td>électrons,<\/td><td>≈<\/td><td>0,2<\/td><td>nm,<\/td><td>coupes<\/td><td>ultrafines<\/td><td>:<\/td><td>organites,<\/td><td>membranes<\/td><\/tr><tr><td class=\"h1\">Électronique<\/td><td>à<\/td><td>balayage<\/td><td>(MEB),<\/td><td>électrons,<\/td><td>≈<\/td><td>10<\/td><td>nm,<\/td><td>relief<\/td><td>des<\/td><td>surfaces<\/td><\/tr><\/table><\/figure><figure class=\"etapes\" data-i=\"0\"><figcaption>Préparer un échantillon pour le MET<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · 1. Fixation (glutaraldéhyde, tétroxyde d&#39;osmium) : on fige les structures.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · 2. Déshydratation (alcools) puis inclusion dans une résine.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · 3. Coupes ultrafines (≈ 50 à 100 nm) à l&#39;ultramicrotome.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · 4. Contraste aux métaux lourds (acétate d&#39;uranyle, citrate de plomb).<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Idée 2 · Le fractionnement cellulaire<\/h2>\n<svg viewBox=\"0 0 320 110\" role=\"img\" aria-label=\"Centrifugation différentielle : vitesse croissante, culots successifs noyaux, mitochondries, microsomes\" style=\"max-width:420px;width:100%\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\n<path d=\"M20 15v70a12 12 0 0 0 24 0V15\"/><path d=\"M120 15v70a12 12 0 0 0 24 0V15\"/><path d=\"M220 15v70a12 12 0 0 0 24 0V15\"/>\n<path d=\"M60 50h40M160 50h40\" stroke=\"#D9824F\"/><\/g>\n<g fill=\"#D9824F\"><circle cx=\"32\" cy=\"92\" r=\"7\"/><circle cx=\"132\" cy=\"94\" r=\"5\"/><circle cx=\"232\" cy=\"95\" r=\"3\"/><\/g>\n<g fill=\"currentColor\" font-size=\"10\"><text x=\"8\" y=\"12\">1 000 g<\/text><text x=\"108\" y=\"12\">10 000 g<\/text><text x=\"206\" y=\"12\">100 000 g<\/text>\n<text x=\"10\" y=\"110\">noyaux<\/text><text x=\"100\" y=\"110\">mitochondries<\/text><text x=\"210\" y=\"110\">microsomes<\/text><\/g>\n<\/svg><p>On broie (homogénéisation), puis on centrifuge à vitesse croissante : les gros éléments tombent d&#39;abord.<\/p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Plus un élément est gros et dense, plus il sédimente tôt. Le surnageant de chaque étape est recentrifugé plus vite.<\/p>\n<\/aside><h2>Idée 3 · Autres méthodes<\/h2>\n<ul>\n<li><strong>Autoradiographie<\/strong> : un précurseur radioactif (ex. leucine tritiée) suit le trajet d&#39;une molécule. C&#39;est l&#39;expérience « pulse-chase » qui montre RE → Golgi → vésicules.<\/li>\n<li><strong>Cytochimie et immunocytochimie<\/strong> : un colorant ou un anticorps marqué révèle une molécule précise.<\/li>\n<li><strong>Culture cellulaire<\/strong> : cellules vivantes hors de l&#39;organisme.<\/li>\n<\/ul>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>TD 1<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Tu veux observer les crêtes d&#39;une mitochondrie. Quel microscope ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Le MET : les crêtes mesurent quelques dizaines de nm, sous la limite du microscope optique.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Dans quel culot récupères-tu les mitochondries ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Le culot de vitesse moyenne (≈ 10 000 g), après avoir retiré les noyaux à basse vitesse.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Pour voir le relief d&#39;une surface cellulaire :<\/div><button class=\"opt\" data-o=\"0\">MET<\/button><button class=\"opt\" data-o=\"1\">MEB<\/button><button class=\"opt\" data-o=\"2\">microscope optique<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">La limite de résolution du microscope optique est d&#39;environ :<\/div><button class=\"opt\" data-o=\"0\">0,2 µm<\/button><button class=\"opt\" data-o=\"1\">0,2 nm<\/button><button class=\"opt\" data-o=\"2\">2 mm<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Le premier culot de centrifugation contient :<\/div><button class=\"opt\" data-o=\"0\">les noyaux<\/button><button class=\"opt\" data-o=\"1\">les ribosomes<\/button><button class=\"opt\" data-o=\"2\">les microsomes<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Le tétroxyde d&#39;osmium sert à :<\/div><button class=\"opt\" data-o=\"0\">couper<\/button><button class=\"opt\" data-o=\"1\">fixer et contraster les lipides<\/button><button class=\"opt\" data-o=\"2\">broyer<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Les microsomes sont :<\/div><button class=\"opt\" data-o=\"0\">des petits noyaux<\/button><button class=\"opt\" data-o=\"1\">des fragments de RE refermés en vésicules<\/button><button class=\"opt\" data-o=\"2\">des bactéries<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">L&#39;autoradiographie utilise :<\/div><button class=\"opt\" data-o=\"0\">des anticorps<\/button><button class=\"opt\" data-o=\"1\">un précurseur radioactif<\/button><button class=\"opt\" data-o=\"2\">des électrons<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Une coupe pour le MET mesure environ :<\/div><button class=\"opt\" data-o=\"0\">10 µm<\/button><button class=\"opt\" data-o=\"1\">50 à 100 nm<\/button><button class=\"opt\" data-o=\"2\">1 mm<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Grossir une image sans améliorer la résolution :<\/div><button class=\"opt\" data-o=\"0\">montre plus de détails<\/button><button class=\"opt\" data-o=\"1\">ne montre pas plus de détails<\/button><button class=\"opt\" data-o=\"2\">augmente la résolution<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Pour localiser une protéine précise, on utilise :<\/div><button class=\"opt\" data-o=\"0\">le MEB<\/button><button class=\"opt\" data-o=\"1\">l&#39;immunocytochimie<\/button><button class=\"opt\" data-o=\"2\">la centrifugation seule<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">On observe des cellules vivantes :<\/div><button class=\"opt\" data-o=\"0\">au microscope optique<\/button><button class=\"opt\" data-o=\"1\">au MET<\/button><button class=\"opt\" data-o=\"2\">au MEB<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"methodes-etude","rep":null,"tol":null},{"n":"methodes-etude","rep":null,"tol":null},{"n":"methodes-etude","rep":null,"tol":null}],"qcm":[{"n":"methodes-etude","q":"Pour voir le relief d&#39;une surface cellulaire :","o":["MET","MEB","microscope optique"],"a":1,"e":"Balayage = surface."},{"n":"methodes-etude","q":"La limite de résolution du microscope optique est d&#39;environ :","o":["0,2 µm","0,2 nm","2 mm"],"a":0,"e":"Limitée par la longueur d&#39;onde de la lumière."},{"n":"methodes-etude","q":"Le premier culot de centrifugation contient :","o":["les noyaux","les ribosomes","les microsomes"],"a":0,"e":"Ce sont les plus gros éléments."},{"n":"methodes-etude","q":"Le tétroxyde d&#39;osmium sert à :","o":["couper","fixer et contraster les lipides","broyer"],"a":1,"e":"Il fixe et colore les membranes."},{"n":"methodes-etude","q":"Les microsomes sont :","o":["des petits noyaux","des fragments de RE refermés en vésicules","des bactéries"],"a":1,"e":"Ils apparaissent au broyage."},{"n":"methodes-etude","q":"L&#39;autoradiographie utilise :","o":["des anticorps","un précurseur radioactif","des électrons"],"a":1,"e":"Ex. leucine tritiée."},{"n":"methodes-etude","q":"Une coupe pour le MET mesure environ :","o":["10 µm","50 à 100 nm","1 mm"],"a":1,"e":"Coupe ultrafine."},{"n":"methodes-etude","q":"Grossir une image sans améliorer la résolution :","o":["montre plus de détails","ne montre pas plus de détails","augmente la résolution"],"a":1,"e":"Grossissement vide."},{"n":"methodes-etude","q":"Pour localiser une protéine précise, on utilise :","o":["le MEB","l&#39;immunocytochimie","la centrifugation seule"],"a":1,"e":"Un anticorps marqué reconnaît la protéine."},{"n":"methodes-etude","q":"On observe des cellules vivantes :","o":["au microscope optique","au MET","au MEB"],"a":0,"e":"Le MET demande fixation et vide."}]},{"id":"membrane-plasmique","t":"La membrane plasmique","seance":"Chapitre 2 · Organisation et composition des membranes","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir ce qu&#39;est une molécule amphiphile : une tête qui aime l&#39;eau (hydrophile), une queue qui la fuit (hydrophobe).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Dans l&#39;eau, où se placent les queues hydrophobes de phospholipides ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Elles se cachent ensemble, loin de l&#39;eau, et les têtes restent au contact de l&#39;eau : c&#39;est ce qui forme la bicouche.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « mer de lipides où flottent des protéines ».<\/strong> C&#39;est le modèle de la mosaïque fluide (Singer et Nicolson, 1972).<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Croire que la membrane est symétrique. Les deux feuillets n&#39;ont ni les mêmes lipides ni les mêmes protéines, et les glucides ne sont que sur la face externe.<\/p>\n<\/aside><p>À la fin, tu sais décrire la membrane au MET, sa composition et son architecture : c&#39;est le sujet I de l&#39;examen blanc.<\/p>\n<h2>Idée 1 · Au microscope électronique<\/h2>\n<svg viewBox=\"0 0 320 90\" role=\"img\" aria-label=\"Bicouche lipidique : deux feuillets sombres séparés par un feuillet clair, protéine transmembranaire et glycocalyx\" style=\"max-width:420px;width:100%\">\n<g stroke=\"currentColor\" stroke-width=\"2\" fill=\"none\">\n<path d=\"M10 30h300M10 60h300\" stroke-width=\"5\"/>\n<rect x=\"140\" y=\"20\" width=\"30\" height=\"50\" rx=\"8\" fill=\"#D9824F\" fill-opacity=\".35\" stroke=\"#D9824F\"/>\n<path d=\"M60 30v-12M64 18l6-6M200 30v-14M204 16l6-6\" stroke=\"#D9824F\"/><\/g>\n<g fill=\"currentColor\" font-size=\"10\"><text x=\"230\" y=\"12\">glycocalyx<\/text><text x=\"232\" y=\"48\">feuillet clair<\/text><text x=\"120\" y=\"88\">≈ 7,5 nm<\/text><\/g>\n<\/svg><p>Au MET, la membrane apparaît <strong>tristratifiée<\/strong> : sombre, claire, sombre, sur environ 7,5 nm. C&#39;est l&#39;« unité de membrane » de Robertson.<\/p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Pour étudier la membrane plasmique seule, on prend le <strong>globule rouge<\/strong> (hématie) de mammifère : il n&#39;a ni noyau ni organites, donc aucune autre membrane ne contamine la préparation. On obtient des « fantômes » par choc osmotique.<\/p>\n<\/aside><h2>Idée 2 · Composition chimique<\/h2>\n<figure class=\"grille\"><figcaption>Composition (ordre de grandeur, membrane d'hématie)<\/figcaption><table><tr><th>Constituant,<\/th><th>Part,<\/th><th>Exemples<\/th><\/tr><tr><td class=\"h1\">Protéines,<\/td><td>≈<\/td><td>50<\/td><td>%,<\/td><td>intrinsèques<\/td><td>(transmembranaires)<\/td><td>et<\/td><td>extrinsèques<\/td><\/tr><tr><td class=\"h1\">Lipides,<\/td><td>≈<\/td><td>40<\/td><td>%,<\/td><td>phospholipides<\/td><td>(les<\/td><td>plus<\/td><td>nombreux),<\/td><td>cholestérol,<\/td><td>glycolipides<\/td><\/tr><tr><td class=\"h1\">Glucides,<\/td><td>≈<\/td><td>10<\/td><td>%,<\/td><td>chaînes<\/td><td>liées<\/td><td>aux<\/td><td>protéines<\/td><td>et<\/td><td>lipides<\/td><td>:<\/td><td>le<\/td><td>glycocalyx<\/td><\/tr><\/table><\/figure><p>Les phospholipides sont les lipides <strong>les plus nombreux<\/strong>. Le cholestérol règle la fluidité.<\/p>\n<h2>Idée 3 · Architecture : la mosaïque fluide<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Décrire l'architecture en 4 phrases<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · 1. Une bicouche de phospholipides, têtes vers l&#39;eau, queues au centre.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · 2. Des protéines intrinsèques traversent la bicouche ; des extrinsèques sont posées sur une face.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · 3. Lipides et protéines bougent latéralement : la membrane est fluide. Le passage d&#39;un feuillet à l&#39;autre (flip-flop) est rare.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · 4. Les glucides forment le glycocalyx sur la face externe : asymétrie.<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Sujet I de l&#39;examen blanc<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Quelle cellule choisir pour étudier la MP, et pourquoi ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Le globule rouge de mammifère : pas de noyau ni d&#39;organites, donc la seule membrane est la membrane plasmique.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Comment se présente la MP au MET ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Une structure tristratifiée (sombre-clair-sombre) d&#39;environ 7,5 nm.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Le modèle actuel de la membrane est :<\/div><button class=\"opt\" data-o=\"0\">la mosaïque fluide<\/button><button class=\"opt\" data-o=\"1\">le sandwich rigide<\/button><button class=\"opt\" data-o=\"2\">la monocouche<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Au MET, la membrane est :<\/div><button class=\"opt\" data-o=\"0\">homogène<\/button><button class=\"opt\" data-o=\"1\">tristratifiée<\/button><button class=\"opt\" data-o=\"2\">invisible<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Les lipides les plus abondants :<\/div><button class=\"opt\" data-o=\"0\">phospholipides<\/button><button class=\"opt\" data-o=\"1\">cholestérol<\/button><button class=\"opt\" data-o=\"2\">triglycérides<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Les glucides membranaires sont :<\/div><button class=\"opt\" data-o=\"0\">sur les deux faces<\/button><button class=\"opt\" data-o=\"1\">sur la face externe<\/button><button class=\"opt\" data-o=\"2\">au centre de la bicouche<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Une protéine qui traverse la bicouche est :<\/div><button class=\"opt\" data-o=\"0\">intrinsèque<\/button><button class=\"opt\" data-o=\"1\">extrinsèque<\/button><button class=\"opt\" data-o=\"2\">un glycolipide<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Le flip-flop est :<\/div><button class=\"opt\" data-o=\"0\">fréquent<\/button><button class=\"opt\" data-o=\"1\">rare<\/button><button class=\"opt\" data-o=\"2\">impossible pour tous les lipides<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">On étudie la MP sur :<\/div><button class=\"opt\" data-o=\"0\">le globule rouge<\/button><button class=\"opt\" data-o=\"1\">la cellule hépatique<\/button><button class=\"opt\" data-o=\"2\">le neurone<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Le cholestérol :<\/div><button class=\"opt\" data-o=\"0\">rigidifie toujours<\/button><button class=\"opt\" data-o=\"1\">régule la fluidité<\/button><button class=\"opt\" data-o=\"2\">est absent des membranes animales<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">L&#39;épaisseur de la MP est d&#39;environ :<\/div><button class=\"opt\" data-o=\"0\">70 nm<\/button><button class=\"opt\" data-o=\"1\">7,5 nm<\/button><button class=\"opt\" data-o=\"2\">0,7 nm<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Le centre de la bicouche est :<\/div><button class=\"opt\" data-o=\"0\">hydrophile<\/button><button class=\"opt\" data-o=\"1\">hydrophobe<\/button><button class=\"opt\" data-o=\"2\">chargé positivement<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"membrane-plasmique","rep":null,"tol":null},{"n":"membrane-plasmique","rep":null,"tol":null},{"n":"membrane-plasmique","rep":null,"tol":null}],"qcm":[{"n":"membrane-plasmique","q":"Le modèle actuel de la membrane est :","o":["la mosaïque fluide","le sandwich rigide","la monocouche"],"a":0,"e":"Singer et Nicolson, 1972."},{"n":"membrane-plasmique","q":"Au MET, la membrane est :","o":["homogène","tristratifiée","invisible"],"a":1,"e":"Sombre, clair, sombre."},{"n":"membrane-plasmique","q":"Les lipides les plus abondants :","o":["phospholipides","cholestérol","triglycérides"],"a":0,"e":"Le cholestérol est minoritaire."},{"n":"membrane-plasmique","q":"Les glucides membranaires sont :","o":["sur les deux faces","sur la face externe","au centre de la bicouche"],"a":1,"e":"Asymétrie membranaire."},{"n":"membrane-plasmique","q":"Une protéine qui traverse la bicouche est :","o":["intrinsèque","extrinsèque","un glycolipide"],"a":0,"e":"Dite aussi transmembranaire."},{"n":"membrane-plasmique","q":"Le flip-flop est :","o":["fréquent","rare","impossible pour tous les lipides"],"a":1,"e":"Le passage d&#39;un feuillet à l&#39;autre coûte de l&#39;énergie."},{"n":"membrane-plasmique","q":"On étudie la MP sur :","o":["le globule rouge","la cellule hépatique","le neurone"],"a":0,"e":"Aucune membrane interne."},{"n":"membrane-plasmique","q":"Le cholestérol :","o":["rigidifie toujours","régule la fluidité","est absent des membranes animales"],"a":1,"e":"Il amortit les variations de fluidité."},{"n":"membrane-plasmique","q":"L&#39;épaisseur de la MP est d&#39;environ :","o":["70 nm","7,5 nm","0,7 nm"],"a":1,"e":"Ordre de grandeur à connaître."},{"n":"membrane-plasmique","q":"Le centre de la bicouche est :","o":["hydrophile","hydrophobe","chargé positivement"],"a":1,"e":"Les queues d&#39;acides gras."}]},{"id":"echanges-membranaires","t":"Les échanges membranaires","seance":"Chapitre 2 · Fonctions membranaires · TD 2","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir lire un gradient de concentration : une substance diffuse spontanément du côté le plus concentré vers le moins concentré.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Dehors : 140 mM de Na⁺. Dedans : 12 mM. Dans quel sens va la diffusion passive du Na⁺ ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>De l&#39;extérieur vers l&#39;intérieur, en suivant son gradient.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « dans le sens du gradient ou contre ? ».<\/strong> Dans le sens : gratuit (passif). Contre : il faut de l&#39;énergie (actif).<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Écrire que la diffusion facilitée consomme de l&#39;ATP. Elle utilise une protéine, mais reste passive.<\/p>\n<\/aside><p>À la fin, tu sais classer chaque transport et définir les cinq termes qui tombent à l&#39;examen.<\/p>\n<h2>Idée 1 · Classer les transports<\/h2>\n<figure class=\"grille\"><figcaption>Les transports à travers la membrane<\/figcaption><table><tr><th>Type,<\/th><th>Énergie,<\/th><th>Protéine,<\/th><th>Exemple<\/th><\/tr><tr><td class=\"h1\">Diffusion<\/td><td>simple,<\/td><td>non,<\/td><td>non,<\/td><td>O₂,<\/td><td>CO₂,<\/td><td>petites<\/td><td>molécules<\/td><td>liposolubles<\/td><\/tr><tr><td class=\"h1\">Diffusion<\/td><td>facilitée,<\/td><td>non,<\/td><td>oui<\/td><td>(canal<\/td><td>ou<\/td><td>transporteur),<\/td><td>glucose<\/td><td>par<\/td><td>GLUT,<\/td><td>eau<\/td><td>par<\/td><td>aquaporines<\/td><\/tr><tr><td class=\"h1\">Transport<\/td><td>actif<\/td><td>primaire,<\/td><td>ATP,<\/td><td>oui<\/td><td>(pompe),<\/td><td>pompe<\/td><td>Na⁺/K⁺<\/td><\/tr><tr><td class=\"h1\">Transport<\/td><td>actif<\/td><td>secondaire,<\/td><td>gradient<\/td><td>d'un<\/td><td>autre<\/td><td>ion,<\/td><td>oui<\/td><td>(cotransporteur),<\/td><td>glucose<\/td><td>avec<\/td><td>Na⁺<\/td><td>(SGLT)<\/td><\/tr><tr><td class=\"h1\">Endocytose<\/td><td>/<\/td><td>exocytose,<\/td><td>ATP,<\/td><td>vésicules,<\/td><td>phagocytose,<\/td><td>sécrétion<\/td><\/tr><\/table><\/figure><h2>Idée 2 · La pompe Na⁺/K⁺<\/h2>\n<svg viewBox=\"0 0 320 120\" role=\"img\" aria-label=\"Pompe sodium potassium : 3 Na+ sortent, 2 K+ entrent, 1 ATP consommé\" style=\"max-width:420px;width:100%\">\n<g stroke=\"currentColor\" stroke-width=\"2\" fill=\"none\">\n<path d=\"M10 40h300M10 80h300\" stroke-width=\"4\"/>\n<rect x=\"140\" y=\"30\" width=\"40\" height=\"60\" rx=\"10\" fill=\"#D9824F\" fill-opacity=\".3\" stroke=\"#D9824F\"/>\n<path d=\"M150 70V15M146 20l4-6 4 6M170 50v55M166 100l4 6 4-6\"/><\/g>\n<g fill=\"currentColor\" font-size=\"11\"><text x=\"60\" y=\"20\">extérieur<\/text><text x=\"60\" y=\"110\">intérieur<\/text>\n<text x=\"105\" y=\"14\">3 Na⁺<\/text><text x=\"180\" y=\"112\">2 K⁺<\/text><text x=\"200\" y=\"62\">ATP → ADP<\/text><\/g>\n<\/svg><p>Pour 1 ATP, elle fait sortir <strong>3 Na⁺<\/strong> et entrer <strong>2 K⁺<\/strong>. Elle maintient le gradient chimique (concentrations) <strong>et<\/strong> électrique (intérieur négatif) : c&#39;est vrai, la question oui/non de l&#39;examen 2020.<\/p>\n<h2>Idée 3 · Osmose et transport vésiculaire<\/h2>\n<p><strong>Osmose<\/strong> : passage de l&#39;eau à travers une membrane semi-perméable, du milieu le moins concentré en solutés vers le plus concentré.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Prévoir ce que devient une cellule végétale (TP 2)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · 1. Milieu hypotonique : l&#39;eau entre, la vacuole gonfle → turgescence.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · 2. Milieu isotonique : rien ne change.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · 3. Milieu hypertonique : l&#39;eau sort, la membrane se décolle de la paroi → plasmolyse.<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p><strong>Endocytose<\/strong> : la membrane s&#39;invagine et entoure une particule (phagocytose pour les grosses particules, pinocytose pour les liquides). <strong>Exocytose<\/strong> : une vésicule fusionne avec la membrane et libère son contenu dehors.<\/p>\n<aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>Organes spécialisés dans les échanges (examen blanc, sujet II) : l&#39;intestin et le rein. Leurs cellules portent des <strong>microvillosités<\/strong> (bordure en brosse) qui multiplient la surface d&#39;échange.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Définitions de l&#39;examen 2020<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Définis le transport actif secondaire.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Transport contre le gradient d&#39;une molécule, dont l&#39;énergie vient du gradient d&#39;un autre ion (souvent Na⁺) créé par une pompe. Ex. : le cotransport Na⁺/glucose.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>L&#39;O₂ et l&#39;eau traversent-ils la membrane de la même façon ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>O₂ : diffusion simple à travers la bicouche. Eau : un peu par diffusion simple, surtout par diffusion facilitée via les aquaporines.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">La membrane plasmique est perméable aux substances liposolubles :<\/div><button class=\"opt\" data-o=\"0\">oui<\/button><button class=\"opt\" data-o=\"1\">non<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">La pompe Na⁺/K⁺ fait entrer :<\/div><button class=\"opt\" data-o=\"0\">3 K⁺<\/button><button class=\"opt\" data-o=\"1\">2 K⁺<\/button><button class=\"opt\" data-o=\"2\">3 Na⁺<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">La diffusion facilitée :<\/div><button class=\"opt\" data-o=\"0\">consomme de l&#39;ATP<\/button><button class=\"opt\" data-o=\"1\">est passive<\/button><button class=\"opt\" data-o=\"2\">va contre le gradient<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">En milieu hypertonique, une cellule végétale subit :<\/div><button class=\"opt\" data-o=\"0\">la turgescence<\/button><button class=\"opt\" data-o=\"1\">la plasmolyse<\/button><button class=\"opt\" data-o=\"2\">la lyse<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Le cotransport Na⁺/glucose est un transport :<\/div><button class=\"opt\" data-o=\"0\">passif<\/button><button class=\"opt\" data-o=\"1\">actif primaire<\/button><button class=\"opt\" data-o=\"2\">actif secondaire<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">La phagocytose est une forme :<\/div><button class=\"opt\" data-o=\"0\">d&#39;endocytose<\/button><button class=\"opt\" data-o=\"1\">d&#39;exocytose<\/button><button class=\"opt\" data-o=\"2\">de diffusion<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Les aquaporines transportent :<\/div><button class=\"opt\" data-o=\"0\">le glucose<\/button><button class=\"opt\" data-o=\"1\">l&#39;eau<\/button><button class=\"opt\" data-o=\"2\">le Na⁺<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Les microvillosités servent à :<\/div><button class=\"opt\" data-o=\"0\">augmenter la surface d&#39;échange<\/button><button class=\"opt\" data-o=\"1\">protéger la cellule<\/button><button class=\"opt\" data-o=\"2\">se déplacer<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">L&#39;O₂ traverse la membrane par :<\/div><button class=\"opt\" data-o=\"0\">diffusion simple<\/button><button class=\"opt\" data-o=\"1\">transport actif<\/button><button class=\"opt\" data-o=\"2\">endocytose<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">L&#39;osmose est un déplacement :<\/div><button class=\"opt\" data-o=\"0\">de solutés<\/button><button class=\"opt\" data-o=\"1\">d&#39;eau<\/button><button class=\"opt\" data-o=\"2\">de protéines<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"echanges-membranaires","rep":null,"tol":null},{"n":"echanges-membranaires","rep":null,"tol":null},{"n":"echanges-membranaires","rep":null,"tol":null}],"qcm":[{"n":"echanges-membranaires","q":"La membrane plasmique est perméable aux substances liposolubles :","o":["oui","non"],"a":0,"e":"Elles traversent la bicouche par diffusion simple."},{"n":"echanges-membranaires","q":"La pompe Na⁺/K⁺ fait entrer :","o":["3 K⁺","2 K⁺","3 Na⁺"],"a":1,"e":"3 Na⁺ sortent, 2 K⁺ entrent."},{"n":"echanges-membranaires","q":"La diffusion facilitée :","o":["consomme de l&#39;ATP","est passive","va contre le gradient"],"a":1,"e":"Elle utilise seulement une protéine."},{"n":"echanges-membranaires","q":"En milieu hypertonique, une cellule végétale subit :","o":["la turgescence","la plasmolyse","la lyse"],"a":1,"e":"L&#39;eau sort."},{"n":"echanges-membranaires","q":"Le cotransport Na⁺/glucose est un transport :","o":["passif","actif primaire","actif secondaire"],"a":2,"e":"Il utilise le gradient de Na⁺."},{"n":"echanges-membranaires","q":"La phagocytose est une forme :","o":["d&#39;endocytose","d&#39;exocytose","de diffusion"],"a":0,"e":"Grosses particules englobées."},{"n":"echanges-membranaires","q":"Les aquaporines transportent :","o":["le glucose","l&#39;eau","le Na⁺"],"a":1,"e":"Canaux à eau."},{"n":"echanges-membranaires","q":"Les microvillosités servent à :","o":["augmenter la surface d&#39;échange","protéger la cellule","se déplacer"],"a":0,"e":"Intestin, rein."},{"n":"echanges-membranaires","q":"L&#39;O₂ traverse la membrane par :","o":["diffusion simple","transport actif","endocytose"],"a":0,"e":"Petite molécule apolaire."},{"n":"echanges-membranaires","q":"L&#39;osmose est un déplacement :","o":["de solutés","d&#39;eau","de protéines"],"a":1,"e":"À travers une membrane semi-perméable."}]},{"id":"systeme-endomembranaire","t":"Réticulum, Golgi, lysosomes","seance":"Chapitre 2 · Le système endomembranaire","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir qu&#39;une protéine est fabriquée par un ribosome à partir d&#39;un ARN messager.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Quel organite fabrique les protéines ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Le ribosome. S&#39;il est fixé sur le RE, la protéine entre dans le RE au fur et à mesure.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense chaîne de montage.<\/strong> RE rugueux (fabrication) → Golgi (finition, tri) → vésicules (expédition).<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Mélanger RE lisse et RE rugueux. Le rugueux porte des ribosomes et fait des protéines ; le lisse n&#39;en a pas et fait des lipides.<\/p>\n<\/aside><p>À la fin, tu sais suivre une protéine de sécrétion de sa synthèse jusqu&#39;à sa sortie de la cellule.<\/p>\n<h2>Idée 1 · Le réticulum endoplasmique<\/h2>\n<figure class=\"grille\"><figcaption>RE rugueux et RE lisse<\/figcaption><table><tr><th>,<\/th><th>RE<\/th><th>rugueux<\/th><th>(granulaire),<\/th><th>RE<\/th><th>lisse<\/th><\/tr><tr><td class=\"h1\">Aspect,<\/td><td>sacs<\/td><td>aplatis<\/td><td>couverts<\/td><td>de<\/td><td>ribosomes,<\/td><td>tubules<\/td><td>sans<\/td><td>ribosomes<\/td><\/tr><tr><td class=\"h1\">Fonction,<\/td><td>synthèse<\/td><td>et<\/td><td>modification<\/td><td>des<\/td><td>protéines,<\/td><td>synthèse<\/td><td>des<\/td><td>lipides<\/td><td>et<\/td><td>stéroïdes,<\/td><td>détoxication,<\/td><td>stockage<\/td><td>du<\/td><td>Ca²⁺<\/td><\/tr><tr><td class=\"h1\">Cellule<\/td><td>idéale<\/td><td>pour<\/td><td>l'étudier,<\/td><td>cellule<\/td><td>pancréatique<\/td><td>(acineuse)<\/td><td>ou<\/td><td>plasmocyte,<\/td><td>hépatocyte,<\/td><td>cellule<\/td><td>des<\/td><td>glandes<\/td><td>à<\/td><td>stéroïdes<\/td><\/tr><\/table><\/figure><p>Dans le RE rugueux, les protéines sont <strong>repliées<\/strong> (aide des chaperons), reçoivent des <strong>ponts disulfure<\/strong> et une première <strong>glycosylation<\/strong> (N-glycosylation).<\/p>\n<h2>Idée 2 · L&#39;appareil de Golgi<\/h2>\n<svg viewBox=\"0 0 320 110\" role=\"img\" aria-label=\"Golgi : face cis côté RE, saccules empilés, face trans qui libère des vésicules\" style=\"max-width:420px;width:100%\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\n<path d=\"M80 30q80-20 160 0M80 50q80-20 160 0M80 70q80-20 160 0\"/>\n<circle cx=\"60\" cy=\"40\" r=\"7\"/><circle cx=\"262\" cy=\"80\" r=\"7\" stroke=\"#D9824F\"/><circle cx=\"280\" cy=\"95\" r=\"7\" stroke=\"#D9824F\"/><\/g>\n<g fill=\"currentColor\" font-size=\"10\"><text x=\"10\" y=\"20\">vers le RE (cis)<\/text><text x=\"230\" y=\"20\">face trans<\/text><text x=\"210\" y=\"108\">vésicules<\/text><\/g>\n<\/svg><p>Le Golgi est une pile de saccules (dictyosome). Il reçoit les vésicules du RE par sa <strong>face cis<\/strong>, termine la glycosylation, trie et emballe, puis libère des vésicules par sa <strong>face trans<\/strong>.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Étapes terminales dans le Golgi (examen blanc)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · 1. Modification des glucides (glycosylation terminale).<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · 2. Sulfatation, phosphorylation (ex. mannose-6-phosphate qui adresse aux lysosomes).<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · 3. Tri selon la destination : membrane, lysosome ou sécrétion.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · 4. Concentration et emballage en vésicules de sécrétion.<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Idée 3 · Les lysosomes<\/h2>\n<p>Vésicules contenant des <strong>hydrolases acides<\/strong> (pH ≈ 5). Ils digèrent ce que la cellule a ingéré (hétérophagie) ou ses propres organites usés (autophagie).<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Sujet 3 de l&#39;examen blanc<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Fonctions principales du RE lisse ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Synthèse des lipides et des hormones stéroïdes, détoxication (foie), stockage du calcium (réticulum sarcoplasmique du muscle).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Trajet d&#39;une protéine de sécrétion ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Ribosome sur le RE rugueux → lumière du RE → vésicule → Golgi (cis → trans) → vésicule de sécrétion → exocytose.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Le RE rugueux est riche dans :<\/div><button class=\"opt\" data-o=\"0\">les cellules sécrétrices de protéines<\/button><button class=\"opt\" data-o=\"1\">les globules rouges<\/button><button class=\"opt\" data-o=\"2\">les cellules adipeuses uniquement<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Le RE lisse synthétise :<\/div><button class=\"opt\" data-o=\"0\">les protéines<\/button><button class=\"opt\" data-o=\"1\">les lipides<\/button><button class=\"opt\" data-o=\"2\">l&#39;ADN<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Les protéines entrent dans le Golgi par :<\/div><button class=\"opt\" data-o=\"0\">la face cis<\/button><button class=\"opt\" data-o=\"1\">la face trans<\/button><button class=\"opt\" data-o=\"2\">le noyau<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Le mannose-6-phosphate adresse une protéine :<\/div><button class=\"opt\" data-o=\"0\">à la membrane<\/button><button class=\"opt\" data-o=\"1\">au lysosome<\/button><button class=\"opt\" data-o=\"2\">au noyau<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Le pH du lysosome est :<\/div><button class=\"opt\" data-o=\"0\">acide (≈ 5)<\/button><button class=\"opt\" data-o=\"1\">neutre<\/button><button class=\"opt\" data-o=\"2\">basique<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">La détoxication se fait dans :<\/div><button class=\"opt\" data-o=\"0\">le RE rugueux<\/button><button class=\"opt\" data-o=\"1\">le RE lisse<\/button><button class=\"opt\" data-o=\"2\">le Golgi<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">L&#39;autophagie digère :<\/div><button class=\"opt\" data-o=\"0\">les organites de la cellule elle-même<\/button><button class=\"opt\" data-o=\"1\">uniquement les bactéries<\/button><button class=\"opt\" data-o=\"2\">l&#39;ADN nucléaire<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Une pile de saccules golgiens s&#39;appelle :<\/div><button class=\"opt\" data-o=\"0\">un ribosome<\/button><button class=\"opt\" data-o=\"1\">un dictyosome<\/button><button class=\"opt\" data-o=\"2\">un nucléole<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">La N-glycosylation commence dans :<\/div><button class=\"opt\" data-o=\"0\">le RE rugueux<\/button><button class=\"opt\" data-o=\"1\">le lysosome<\/button><button class=\"opt\" data-o=\"2\">le cytosol<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Les vésicules de sécrétion fusionnent avec la membrane par :<\/div><button class=\"opt\" data-o=\"0\">endocytose<\/button><button class=\"opt\" data-o=\"1\">exocytose<\/button><button class=\"opt\" data-o=\"2\">phagocytose<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"systeme-endomembranaire","rep":null,"tol":null},{"n":"systeme-endomembranaire","rep":null,"tol":null},{"n":"systeme-endomembranaire","rep":null,"tol":null}],"qcm":[{"n":"systeme-endomembranaire","q":"Le RE rugueux est riche dans :","o":["les cellules sécrétrices de protéines","les globules rouges","les cellules adipeuses uniquement"],"a":0,"e":"Ex. cellules acineuses du pancréas."},{"n":"systeme-endomembranaire","q":"Le RE lisse synthétise :","o":["les protéines","les lipides","l&#39;ADN"],"a":1,"e":"Et les stéroïdes."},{"n":"systeme-endomembranaire","q":"Les protéines entrent dans le Golgi par :","o":["la face cis","la face trans","le noyau"],"a":0,"e":"Cis = côté RE."},{"n":"systeme-endomembranaire","q":"Le mannose-6-phosphate adresse une protéine :","o":["à la membrane","au lysosome","au noyau"],"a":1,"e":"Signal ajouté dans le Golgi."},{"n":"systeme-endomembranaire","q":"Le pH du lysosome est :","o":["acide (≈ 5)","neutre","basique"],"a":0,"e":"Ses hydrolases sont acides."},{"n":"systeme-endomembranaire","q":"La détoxication se fait dans :","o":["le RE rugueux","le RE lisse","le Golgi"],"a":1,"e":"Surtout dans l&#39;hépatocyte."},{"n":"systeme-endomembranaire","q":"L&#39;autophagie digère :","o":["les organites de la cellule elle-même","uniquement les bactéries","l&#39;ADN nucléaire"],"a":0,"e":"« Se manger soi-même »."},{"n":"systeme-endomembranaire","q":"Une pile de saccules golgiens s&#39;appelle :","o":["un ribosome","un dictyosome","un nucléole"],"a":1,"e":"Terme classique."},{"n":"systeme-endomembranaire","q":"La N-glycosylation commence dans :","o":["le RE rugueux","le lysosome","le cytosol"],"a":0,"e":"Elle se termine dans le Golgi."},{"n":"systeme-endomembranaire","q":"Les vésicules de sécrétion fusionnent avec la membrane par :","o":["endocytose","exocytose","phagocytose"],"a":1,"e":"Libération à l&#39;extérieur."}]},{"id":"mitochondrie-chloroplaste","t":"Mitochondrie, chloroplaste et autres organites","seance":"Chapitre 3 · Organites · TD 3","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut connaître l&#39;ATP : la « monnaie énergétique » de la cellule. La cellule le fabrique à partir d&#39;ADP et de phosphate.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Que donne l&#39;hydrolyse de l&#39;ATP ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>ADP + phosphate + énergie utilisable par la cellule.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « deux centrales, sens inverses ».<\/strong> Le chloroplaste fabrique du glucose avec la lumière et libère de l&#39;O₂. La mitochondrie brûle le glucose avec de l&#39;O₂ et fabrique de l&#39;ATP.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Croire que les plantes n&#39;ont pas de mitochondries. Elles ont les deux organites.<\/p>\n<\/aside><p>À la fin, tu sais comparer les deux membranes mitochondriales et dire ce que devient l&#39;O₂ que tu respires (question IV de l&#39;examen 2020).<\/p>\n<h2>Idée 1 · La mitochondrie<\/h2>\n<svg viewBox=\"0 0 320 120\" role=\"img\" aria-label=\"Mitochondrie : membrane externe lisse, membrane interne repliée en crêtes, matrice\" style=\"max-width:420px;width:100%\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\n<ellipse cx=\"160\" cy=\"60\" rx=\"140\" ry=\"48\"/>\n<path d=\"M30 60h30v-30h20v60h20v-60h20v60h20v-60h20v60h20v-60h20v60h20v-30h40\" stroke=\"#D9824F\"/><\/g>\n<g fill=\"currentColor\" font-size=\"10\"><text x=\"10\" y=\"12\">membrane externe<\/text><text x=\"215\" y=\"118\">crêtes (membrane interne)<\/text><text x=\"140\" y=\"64\">matrice<\/text><\/g>\n<\/svg><figure class=\"grille\"><figcaption>Les deux membranes<\/figcaption><table><tr><th>,<\/th><th>Membrane<\/th><th>externe,<\/th><th>Membrane<\/th><th>interne<\/th><\/tr><tr><td class=\"h1\">Forme,<\/td><td>lisse,<\/td><td>repliée<\/td><td>en<\/td><td>crêtes<\/td><\/tr><tr><td class=\"h1\">Perméabilité,<\/td><td>très<\/td><td>perméable<\/td><td>(porines,<\/td><td>jusqu'à<\/td><td>≈<\/td><td>5<\/td><td>kDa),<\/td><td>très<\/td><td>imperméable<\/td><td>(transporteurs<\/td><td>spécifiques)<\/td><\/tr><tr><td class=\"h1\">Composition,<\/td><td>proche<\/td><td>de<\/td><td>la<\/td><td>membrane<\/td><td>plasmique,<\/td><td>très<\/td><td>riche<\/td><td>en<\/td><td>protéines<\/td><td>(≈<\/td><td>75<\/td><td>%),<\/td><td>cardiolipide<\/td><\/tr><tr><td class=\"h1\">Rôle,<\/td><td>échanges<\/td><td>avec<\/td><td>le<\/td><td>cytosol,<\/td><td>chaîne<\/td><td>respiratoire<\/td><td>et<\/td><td>ATP<\/td><td>synthase<\/td><\/tr><\/table><\/figure><p>La matrice contient le cycle de Krebs, la <strong>β-oxydation<\/strong> des acides gras, de l&#39;ADN circulaire et des ribosomes 70S.<\/p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>L&#39;O₂ respiré est l&#39;<strong>accepteur final des électrons<\/strong> de la chaîne respiratoire. Il est réduit en eau : <strong>O₂ + 4 H⁺ + 4 e⁻ → 2 H₂O<\/strong>. Bilan global : C₆H₁₂O₆ + 6 O₂ → 6 CO₂ + 6 H₂O + énergie (ATP).<\/p>\n<\/aside><figure class=\"etapes\" data-i=\"0\"><figcaption>La chaîne respiratoire en 4 temps<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · 1. NADH et FADH₂ (venus de Krebs) donnent leurs électrons aux complexes I et II.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · 2. Les électrons passent par l&#39;ubiquinone, le complexe III, le cytochrome c, le complexe IV.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · 3. Les complexes I, III, IV pompent des H⁺ vers l&#39;espace intermembranaire.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · 4. Les H⁺ reviennent par l&#39;ATP synthase, qui fabrique l&#39;ATP.<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Idée 2 · Le chloroplaste<\/h2>\n<p>Double membrane plus un troisième système : les <strong>thylakoïdes<\/strong> (empilés en grana). Dans les thylakoïdes : phase claire (lumière → ATP, NADPH, libération d&#39;O₂). Dans le stroma : cycle de Calvin (CO₂ → glucides).<\/p>\n<h2>Idée 3 · Peroxysome, vacuole, cytosquelette<\/h2>\n<figure class=\"grille\"><figcaption>Autres constituants<\/figcaption><table><tr><th>Structure,<\/th><th>Rôle<\/th><th>clé<\/th><\/tr><tr><td class=\"h1\">Peroxysome,<\/td><td>oxydations<\/td><td>produisant<\/td><td>H₂O₂,<\/td><td>détruit<\/td><td>par<\/td><td>la<\/td><td>catalase<\/td><\/tr><tr><td class=\"h1\">Vacuole<\/td><td>(végétale),<\/td><td>réserve<\/td><td>d'eau<\/td><td>et<\/td><td>turgescence<\/td><\/tr><tr><td class=\"h1\">Microtubules<\/td><td>(tubuline,<\/td><td>25<\/td><td>nm),<\/td><td>fuseau<\/td><td>mitotique,<\/td><td>cils,<\/td><td>flagelles,<\/td><td>centrioles<\/td><\/tr><tr><td class=\"h1\">Microfilaments<\/td><td>(actine,<\/td><td>7<\/td><td>nm),<\/td><td>contraction,<\/td><td>forme,<\/td><td>mouvements<\/td><\/tr><tr><td class=\"h1\">Filaments<\/td><td>intermédiaires<\/td><td>(≈<\/td><td>10<\/td><td>nm),<\/td><td>résistance<\/td><td>mécanique<\/td><\/tr><\/table><\/figure><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>TD 3<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Compare la perméabilité des deux membranes mitochondriales.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>L&#39;externe laisse passer les petites molécules grâce aux porines ; l&#39;interne est presque imperméable et n&#39;échange que par transporteurs spécifiques (ex. ATP/ADP translocase).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Définis la β-oxydation.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Dégradation des acides gras dans la matrice mitochondriale, deux carbones par tour, en acétyl-CoA, avec production de NADH et FADH₂.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">La membrane mitochondriale externe est :<\/div><button class=\"opt\" data-o=\"0\">perméable (porines)<\/button><button class=\"opt\" data-o=\"1\">totalement imperméable<\/button><button class=\"opt\" data-o=\"2\">absente<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">La chaîne respiratoire est dans :<\/div><button class=\"opt\" data-o=\"0\">la membrane externe<\/button><button class=\"opt\" data-o=\"1\">la membrane interne<\/button><button class=\"opt\" data-o=\"2\">la matrice<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Le cycle de Krebs se déroule dans :<\/div><button class=\"opt\" data-o=\"0\">la matrice<\/button><button class=\"opt\" data-o=\"1\">l&#39;espace intermembranaire<\/button><button class=\"opt\" data-o=\"2\">le cytosol<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">L&#39;O₂ respiré devient :<\/div><button class=\"opt\" data-o=\"0\">du CO₂<\/button><button class=\"opt\" data-o=\"1\">de l&#39;eau<\/button><button class=\"opt\" data-o=\"2\">de l&#39;ATP<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Le cycle de Calvin a lieu dans :<\/div><button class=\"opt\" data-o=\"0\">les thylakoïdes<\/button><button class=\"opt\" data-o=\"1\">le stroma<\/button><button class=\"opt\" data-o=\"2\">la mitochondrie<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">La catalase est dans :<\/div><button class=\"opt\" data-o=\"0\">le lysosome<\/button><button class=\"opt\" data-o=\"1\">le peroxysome<\/button><button class=\"opt\" data-o=\"2\">le Golgi<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Le fuseau mitotique est fait de :<\/div><button class=\"opt\" data-o=\"0\">microtubules<\/button><button class=\"opt\" data-o=\"1\">microfilaments d&#39;actine<\/button><button class=\"opt\" data-o=\"2\">filaments intermédiaires<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Les mitochondries ont des ribosomes :<\/div><button class=\"opt\" data-o=\"0\">70S<\/button><button class=\"opt\" data-o=\"1\">80S<\/button><button class=\"opt\" data-o=\"2\">aucun<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">L&#39;ATP synthase est alimentée par :<\/div><button class=\"opt\" data-o=\"0\">un flux d&#39;électrons direct<\/button><button class=\"opt\" data-o=\"1\">le retour des H⁺ dans la matrice<\/button><button class=\"opt\" data-o=\"2\">la lumière<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Les cellules végétales possèdent :<\/div><button class=\"opt\" data-o=\"0\">seulement des chloroplastes<\/button><button class=\"opt\" data-o=\"1\">des chloroplastes et des mitochondries<\/button><button class=\"opt\" data-o=\"2\">seulement des mitochondries<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"mitochondrie-chloroplaste","rep":null,"tol":null},{"n":"mitochondrie-chloroplaste","rep":null,"tol":null},{"n":"mitochondrie-chloroplaste","rep":null,"tol":null}],"qcm":[{"n":"mitochondrie-chloroplaste","q":"La membrane mitochondriale externe est :","o":["perméable (porines)","totalement imperméable","absente"],"a":0,"e":"Réponse « oui » à la question de l&#39;examen 2020."},{"n":"mitochondrie-chloroplaste","q":"La chaîne respiratoire est dans :","o":["la membrane externe","la membrane interne","la matrice"],"a":1,"e":"Sur les crêtes."},{"n":"mitochondrie-chloroplaste","q":"Le cycle de Krebs se déroule dans :","o":["la matrice","l&#39;espace intermembranaire","le cytosol"],"a":0,"e":"Comme la β-oxydation."},{"n":"mitochondrie-chloroplaste","q":"L&#39;O₂ respiré devient :","o":["du CO₂","de l&#39;eau","de l&#39;ATP"],"a":1,"e":"Le CO₂ vient du carbone du glucose."},{"n":"mitochondrie-chloroplaste","q":"Le cycle de Calvin a lieu dans :","o":["les thylakoïdes","le stroma","la mitochondrie"],"a":1,"e":"Fixation du CO₂."},{"n":"mitochondrie-chloroplaste","q":"La catalase est dans :","o":["le lysosome","le peroxysome","le Golgi"],"a":1,"e":"Elle détruit H₂O₂."},{"n":"mitochondrie-chloroplaste","q":"Le fuseau mitotique est fait de :","o":["microtubules","microfilaments d&#39;actine","filaments intermédiaires"],"a":0,"e":"Tubuline."},{"n":"mitochondrie-chloroplaste","q":"Les mitochondries ont des ribosomes :","o":["70S","80S","aucun"],"a":0,"e":"Argument de leur origine bactérienne."},{"n":"mitochondrie-chloroplaste","q":"L&#39;ATP synthase est alimentée par :","o":["un flux d&#39;électrons direct","le retour des H⁺ dans la matrice","la lumière"],"a":1,"e":"Couplage chimio-osmotique."},{"n":"mitochondrie-chloroplaste","q":"Les cellules végétales possèdent :","o":["seulement des chloroplastes","des chloroplastes et des mitochondries","seulement des mitochondries"],"a":1,"e":"Elles respirent aussi."}]},{"id":"noyau-information-genetique","t":"Noyau et information génétique","seance":"Chapitres 3 et 4 · Noyau, réplication, transcription, traduction · TD 4","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut connaître la complémentarité des bases : A avec T (U dans l&#39;ARN), G avec C.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Brin complémentaire de 5&#39; ATGC 3&#39; ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>3&#39; TACG 5&#39;, qu&#39;on écrit dans le sens habituel 5&#39; GCAT 3&#39;.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « recopier, transcrire, traduire ».<\/strong> ADN → ADN (réplication), ADN → ARN (transcription), ARN → protéine (traduction).<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Oublier les extrémités 5&#39; et 3&#39;. Un brin sans orientation est une réponse fausse : les deux brins sont antiparallèles et toute synthèse se fait de 5&#39; vers 3&#39;.<\/p>\n<\/aside><p>À la fin, tu sais traiter l&#39;exercice de séquence du TD 4 : promoteur, RBS, codon start, codon stop, peptide, mutations.<\/p>\n<h2>Idée 1 · Le noyau<\/h2>\n<p>Enveloppe nucléaire (deux membranes) percée de <strong>pores<\/strong> ; nucléoplasme ; chromatine ; nucléole.<\/p>\n<figure class=\"grille\"><figcaption>Passage par les pores nucléaires<\/figcaption><table><tr><th>Taille,<\/th><th>Passage<\/th><\/tr><tr><td class=\"h1\">Moins<\/td><td>de<\/td><td>≈<\/td><td>40<\/td><td>kDa,<\/td><td>diffusion<\/td><td>libre<\/td><\/tr><tr><td class=\"h1\">Plus<\/td><td>de<\/td><td>≈<\/td><td>40<\/td><td>kDa,<\/td><td>transport<\/td><td>actif<\/td><td>avec<\/td><td>un<\/td><td>signal<\/td><td>(NLS)<\/td><td>et<\/td><td>de<\/td><td>l'énergie<\/td><\/tr><\/table><\/figure><p>Le <strong>nucléofilament<\/strong> (fibre de 10 nm, « collier de perles ») est fait d&#39;ADN <strong>et<\/strong> de protéines (histones) : il n&#39;est donc pas composé « uniquement d&#39;ADN ». Il se replie en fibre de 30 nm. Le <strong>nucléole<\/strong> fabrique les ARN ribosomiques à partir d&#39;un grand précurseur (ARN 45S chez les mammifères), découpé en ARNr 18S, 5,8S et 28S.<\/p>\n<h2>Idée 2 · Réplication et transcription<\/h2>\n<svg viewBox=\"0 0 320 90\" role=\"img\" aria-label=\"Deux brins antiparallèles 5 vers 3 et 3 vers 5, ARN synthétisé de 5 vers 3\" style=\"max-width:420px;width:100%\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M20 25h280M20 55h280\"/><path d=\"M290 20l10 5-10 5M30 50l-10 5 10 5\"/><path d=\"M80 72h120\" stroke=\"#D9824F\"/><path d=\"M190 67l10 5-10 5\" stroke=\"#D9824F\"/><\/g>\n<g fill=\"currentColor\" font-size=\"10\"><text x=\"4\" y=\"22\">5'<\/text><text x=\"304\" y=\"22\">3'<\/text><text x=\"4\" y=\"52\">3'<\/text><text x=\"304\" y=\"52\">5'<\/text><text x=\"90\" y=\"88\">ARN 5' → 3'<\/text><\/g>\n<\/svg><ul>\n<li><strong>Réplication<\/strong> : semi-conservative ; l&#39;ADN polymérase allonge de 5&#39; vers 3&#39; ; un brin continu, un brin discontinu (fragments d&#39;Okazaki).<\/li>\n<li><strong>Transcription<\/strong> : l&#39;ARN polymérase lit le <strong>brin transcrit<\/strong> (matrice) de 3&#39; vers 5&#39; et fabrique l&#39;ARN de 5&#39; vers 3&#39;. L&#39;ARNm a la même séquence que le <strong>brin codant<\/strong>, avec U au lieu de T.<\/li>\n<\/ul>\n<h2>Idée 3 · Traduction<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Lire un gène bactérien (TD 4)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · 1. Repère le promoteur : boîtes −35 (TTGACA) et −10 (TATAAT).<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · 2. Repère le RBS (Shine-Dalgarno, ex. GGAGG), qui s&#39;apparie à l&#39;extrémité 3&#39; de l&#39;ARNr 16S.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · 3. Le premier ATG après le RBS est le codon d&#39;initiation (Met).<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · 4. Lis par triplets jusqu&#39;au premier codon stop (TAA, TAG, TGA).<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>TD 4<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Exo 2 : vrai ou faux ? a) Un nucléotide = base + ribose. b) L&#39;ARN est plus stable que l&#39;ADN. c) L&#39;ARN a de l&#39;uracile à la place de la thymine.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>a) Faux : il faut aussi un ou plusieurs phosphates (base + sucre = nucléoside). b) Faux : l&#39;ADN est plus stable (pas de 2&#39;-OH, double brin). c) Vrai.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Exo 3 : brin transcrit CAA TCC CAG GAC ATG ACT, écrit de 3&#39; vers 5&#39;. ARNm ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>ARNm (5&#39; → 3&#39;) : GUU AGG GUC CUG UAC UGA. Si le brin était écrit 5&#39; → 3&#39;, il faudrait inverser l&#39;ordre : écris toujours ton hypothèse d&#39;orientation.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Exo 4 : dans la séquence du TD, RBS, codon start et peptide ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 8<\/b><\/p><p>Boîte −35 TTGACA, boîte −10 TATAAT, RBS <strong>GGAGG<\/strong>, start <strong>ATG<\/strong> (AAA GCG…), stop <strong>TAA<\/strong>. Peptide : Met-Lys-Ala-Asp-Ala-Gly-Ser-Arg, soit <strong>8 acides aminés<\/strong>.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Exo 4-5 : conséquences des mutations (positions comptées à partir du TATA).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>a) T → G en position 42 : le codon GAT (Asp) devient GAG (Glu), mutation faux-sens. b) A → C en position 49 : AGC (Ser) devient CGC (Arg), faux-sens aussi.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>L&#39;exercice 1 du TD (hybridation d&#39;un fragment) renvoie à un fragment dessiné qui n&#39;apparaît pas dans le texte fourni : il n&#39;est pas corrigé ici.<\/p>\n<\/aside><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Les pores nucléaires laissent passer librement une protéine de 100 kDa :<\/div><button class=\"opt\" data-o=\"0\">oui<\/button><button class=\"opt\" data-o=\"1\">non<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Les nucléofilaments sont composés :<\/div><button class=\"opt\" data-o=\"0\">uniquement d&#39;ADN<\/button><button class=\"opt\" data-o=\"1\">d&#39;ADN et d&#39;histones<\/button><button class=\"opt\" data-o=\"2\">d&#39;ARN<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Un nucléoside est :<\/div><button class=\"opt\" data-o=\"0\">base + sucre<\/button><button class=\"opt\" data-o=\"1\">base + sucre + phosphate<\/button><button class=\"opt\" data-o=\"2\">deux bases appariées<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">L&#39;ARN polymérase synthétise l&#39;ARN :<\/div><button class=\"opt\" data-o=\"0\">de 5&#39; vers 3&#39;<\/button><button class=\"opt\" data-o=\"1\">de 3&#39; vers 5&#39;<\/button><button class=\"opt\" data-o=\"2\">dans les deux sens<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">L&#39;ARNm a la même séquence que :<\/div><button class=\"opt\" data-o=\"0\">le brin transcrit<\/button><button class=\"opt\" data-o=\"1\">le brin codant (U à la place de T)<\/button><button class=\"opt\" data-o=\"2\">l&#39;ARNr<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Codon d&#39;initiation :<\/div><button class=\"opt\" data-o=\"0\">AUG<\/button><button class=\"opt\" data-o=\"1\">UAA<\/button><button class=\"opt\" data-o=\"2\">UGA<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Lequel est un codon stop ?<\/div><button class=\"opt\" data-o=\"0\">AUG<\/button><button class=\"opt\" data-o=\"1\">UAG<\/button><button class=\"opt\" data-o=\"2\">GGA<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">La réplication est :<\/div><button class=\"opt\" data-o=\"0\">conservative<\/button><button class=\"opt\" data-o=\"1\">semi-conservative<\/button><button class=\"opt\" data-o=\"2\">dispersive<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Les ARNr sont fabriqués dans :<\/div><button class=\"opt\" data-o=\"0\">le RE<\/button><button class=\"opt\" data-o=\"1\">le nucléole<\/button><button class=\"opt\" data-o=\"2\">la mitochondrie<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Remplacer GAT par GAG est une mutation :<\/div><button class=\"opt\" data-o=\"0\">non-sens<\/button><button class=\"opt\" data-o=\"1\">faux-sens<\/button><button class=\"opt\" data-o=\"2\">silencieuse<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"noyau-information-genetique","rep":null,"tol":null},{"n":"noyau-information-genetique","rep":null,"tol":null},{"n":"noyau-information-genetique","rep":null,"tol":null},{"n":"noyau-information-genetique","rep":["8"],"tol":null},{"n":"noyau-information-genetique","rep":null,"tol":null}],"qcm":[{"n":"noyau-information-genetique","q":"Les pores nucléaires laissent passer librement une protéine de 100 kDa :","o":["oui","non"],"a":1,"e":"Au-dessus de ≈ 40 kDa, transport actif."},{"n":"noyau-information-genetique","q":"Les nucléofilaments sont compos
