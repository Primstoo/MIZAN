és :","o":["uniquement d&#39;ADN","d&#39;ADN et d&#39;histones","d&#39;ARN"],"a":1,"e":"« Collier de perles » des nucléosomes."},{"n":"noyau-information-genetique","q":"Un nucléoside est :","o":["base + sucre","base + sucre + phosphate","deux bases appariées"],"a":0,"e":"Avec un phosphate, c&#39;est un nucléotide."},{"n":"noyau-information-genetique","q":"L&#39;ARN polymérase synthétise l&#39;ARN :","o":["de 5&#39; vers 3&#39;","de 3&#39; vers 5&#39;","dans les deux sens"],"a":0,"e":"Comme l&#39;ADN polymérase."},{"n":"noyau-information-genetique","q":"L&#39;ARNm a la même séquence que :","o":["le brin transcrit","le brin codant (U à la place de T)","l&#39;ARNr"],"a":1,"e":"Il est complémentaire du brin transcrit."},{"n":"noyau-information-genetique","q":"Codon d&#39;initiation :","o":["AUG","UAA","UGA"],"a":0,"e":"Il code la méthionine."},{"n":"noyau-information-genetique","q":"Lequel est un codon stop ?","o":["AUG","UAG","GGA"],"a":1,"e":"UAA, UAG, UGA."},{"n":"noyau-information-genetique","q":"La réplication est :","o":["conservative","semi-conservative","dispersive"],"a":1,"e":"Meselson et Stahl."},{"n":"noyau-information-genetique","q":"Les ARNr sont fabriqués dans :","o":["le RE","le nucléole","la mitochondrie"],"a":1,"e":"À partir d&#39;un précurseur découpé."},{"n":"noyau-information-genetique","q":"Remplacer GAT par GAG est une mutation :","o":["non-sens","faux-sens","silencieuse"],"a":1,"e":"Asp devient Glu."}]},{"id":"divisions-cellulaires","t":"Mitose et méiose","seance":"Chapitre 5 · Les divisions cellulaires","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir compter les chromosomes : 2n = nombre de chromosomes d&#39;une cellule diploïde (46 chez l&#39;humain), n = cellule haploïde (23).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Une cellule humaine diploïde contient combien de chromosomes ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 46<\/b><\/p><p>46 (2n = 46).<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « photocopie ou tirage au sort ».<\/strong> La mitose photocopie la cellule (2 cellules 2n identiques). La méiose divise le nombre de chromosomes et mélange (4 cellules n différentes).<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Confondre chromosome et chromatide. Après la phase S, un chromosome a deux chromatides, mais c&#39;est toujours <strong>un<\/strong> chromosome.<\/p>\n<\/aside><p>À la fin, tu reconnais chaque phase sur une photo de TP et tu sais compter chromosomes et quantité d&#39;ADN.<\/p>\n<h2>Idée 1 · Le cycle cellulaire<\/h2>\n<p>G1 (croissance) → S (réplication de l&#39;ADN) → G2 → M (mitose). G1 + S + G2 = interphase.<\/p>\n<h2>Idée 2 · La mitose<\/h2>\n<figure class=\"grille\"><figcaption>Les phases de la mitose<\/figcaption><table><tr><th>Phase,<\/th><th>Ce<\/th><th>qu'on<\/th><th>voit<\/th><\/tr><tr><td class=\"h1\">Prophase,<\/td><td>chromosomes<\/td><td>qui<\/td><td>se<\/td><td>condensent,<\/td><td>fuseau<\/td><td>qui<\/td><td>se<\/td><td>forme,<\/td><td>enveloppe<\/td><td>nucléaire<\/td><td>qui<\/td><td>disparaît<\/td><\/tr><tr><td class=\"h1\">Métaphase,<\/td><td>chromosomes<\/td><td>alignés<\/td><td>sur<\/td><td>la<\/td><td>plaque<\/td><td>équatoriale<\/td><\/tr><tr><td class=\"h1\">Anaphase,<\/td><td>chromatides<\/td><td>sœurs<\/td><td>séparées<\/td><td>vers<\/td><td>les<\/td><td>pôles<\/td><\/tr><tr><td class=\"h1\">Télophase,<\/td><td>deux<\/td><td>noyaux<\/td><td>reformés,<\/td><td>puis<\/td><td>cytodiérèse<\/td><\/tr><\/table><\/figure><svg viewBox=\"0 0 320 90\" role=\"img\" aria-label=\"Métaphase : chromosomes alignés au centre ; anaphase : chromatides qui migrent vers les pôles\" style=\"max-width:420px;width:100%\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><ellipse cx=\"80\" cy=\"45\" rx=\"65\" ry=\"38\"/><ellipse cx=\"240\" cy=\"45\" rx=\"65\" ry=\"38\"/>\n<path d=\"M80 20v50\" stroke-dasharray=\"3 3\"/><\/g>\n<g stroke=\"#D9824F\" stroke-width=\"4\"><path d=\"M75 28h10M75 45h10M75 62h10M190 30h8M190 45h8M190 60h8M282 30h8M282 45h8M282 60h8\"/><\/g>\n<g fill=\"currentColor\" font-size=\"10\"><text x=\"50\" y=\"98\">métaphase<\/text><text x=\"215\" y=\"98\">anaphase<\/text><\/g>\n<\/svg><h2>Idée 3 · La méiose<\/h2>\n<p>Deux divisions après une seule réplication.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Méiose<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · 1. Méiose I (réductionnelle) : les chromosomes homologues s&#39;apparient (bivalents) et échangent des segments (crossing-over) en prophase I, puis se séparent. 2n → n.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · 2. Méiose II (équationnelle) : comme une mitose, les chromatides sœurs se séparent.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · 3. Résultat : 4 cellules haploïdes génétiquement différentes.<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Deux sources de diversité : le crossing-over (prophase I) et la répartition au hasard des homologues (anaphase I).<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Application<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Quantité d&#39;ADN : une cellule a 2q en G1. Combien en G2, puis après la mitose ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>G2 : 4q (après la phase S). Après la mitose : chaque cellule fille revient à 2q.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Une cellule humaine en fin de méiose I contient combien de chromosomes ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 23<\/b><\/p><p>23 chromosomes (n), chacun encore à deux chromatides.<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">La réplication de l&#39;ADN a lieu en :<\/div><button class=\"opt\" data-o=\"0\">G1<\/button><button class=\"opt\" data-o=\"1\">phase S<\/button><button class=\"opt\" data-o=\"2\">métaphase<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Les chromatides sœurs se séparent en :<\/div><button class=\"opt\" data-o=\"0\">métaphase<\/button><button class=\"opt\" data-o=\"1\">anaphase<\/button><button class=\"opt\" data-o=\"2\">prophase<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">La mitose produit :<\/div><button class=\"opt\" data-o=\"0\">2 cellules 2n identiques<\/button><button class=\"opt\" data-o=\"1\">4 cellules n<\/button><button class=\"opt\" data-o=\"2\">2 cellules n<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">La méiose produit :<\/div><button class=\"opt\" data-o=\"0\">2 cellules 2n<\/button><button class=\"opt\" data-o=\"1\">4 cellules n<\/button><button class=\"opt\" data-o=\"2\">4 cellules 2n<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Le crossing-over se produit en :<\/div><button class=\"opt\" data-o=\"0\">prophase I<\/button><button class=\"opt\" data-o=\"1\">anaphase II<\/button><button class=\"opt\" data-o=\"2\">interphase<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">La méiose I est :<\/div><button class=\"opt\" data-o=\"0\">réductionnelle<\/button><button class=\"opt\" data-o=\"1\">équationnelle<\/button><button class=\"opt\" data-o=\"2\">identique à la mitose<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">La cytodiérèse est :<\/div><button class=\"opt\" data-o=\"0\">la division du noyau<\/button><button class=\"opt\" data-o=\"1\">la division du cytoplasme<\/button><button class=\"opt\" data-o=\"2\">la réplication<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">En prophase, l&#39;enveloppe nucléaire :<\/div><button class=\"opt\" data-o=\"0\">s&#39;épaissit<\/button><button class=\"opt\" data-o=\"1\">disparaît<\/button><button class=\"opt\" data-o=\"2\">se double<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Un chromosome à deux chromatides compte pour :<\/div><button class=\"opt\" data-o=\"0\">un chromosome<\/button><button class=\"opt\" data-o=\"1\">deux chromosomes<\/button><button class=\"opt\" data-o=\"2\">un demi-chromosome<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Chez l&#39;humain, n vaut :<\/div><button class=\"opt\" data-o=\"0\">46<\/button><button class=\"opt\" data-o=\"1\">23<\/button><button class=\"opt\" data-o=\"2\">92<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"divisions-cellulaires","rep":["46"],"tol":null},{"n":"divisions-cellulaires","rep":null,"tol":null},{"n":"divisions-cellulaires","rep":["23"],"tol":null}],"qcm":[{"n":"divisions-cellulaires","q":"La réplication de l&#39;ADN a lieu en :","o":["G1","phase S","métaphase"],"a":1,"e":"S = synthèse."},{"n":"divisions-cellulaires","q":"Les chromatides sœurs se séparent en :","o":["métaphase","anaphase","prophase"],"a":1,"e":"Elles migrent vers les pôles."},{"n":"divisions-cellulaires","q":"La mitose produit :","o":["2 cellules 2n identiques","4 cellules n","2 cellules n"],"a":0,"e":"Division conforme."},{"n":"divisions-cellulaires","q":"La méiose produit :","o":["2 cellules 2n","4 cellules n","4 cellules 2n"],"a":1,"e":"Deux divisions, une réplication."},{"n":"divisions-cellulaires","q":"Le crossing-over se produit en :","o":["prophase I","anaphase II","interphase"],"a":0,"e":"Entre homologues appariés."},{"n":"divisions-cellulaires","q":"La méiose I est :","o":["réductionnelle","équationnelle","identique à la mitose"],"a":0,"e":"Elle sépare les homologues."},{"n":"divisions-cellulaires","q":"La cytodiérèse est :","o":["la division du noyau","la division du cytoplasme","la réplication"],"a":1,"e":"Elle suit la télophase."},{"n":"divisions-cellulaires","q":"En prophase, l&#39;enveloppe nucléaire :","o":["s&#39;épaissit","disparaît","se double"],"a":1,"e":"Elle se reforme en télophase."},{"n":"divisions-cellulaires","q":"Un chromosome à deux chromatides compte pour :","o":["un chromosome","deux chromosomes","un demi-chromosome"],"a":0,"e":"On compte les centromères."},{"n":"divisions-cellulaires","q":"Chez l&#39;humain, n vaut :","o":["46","23","92"],"a":1,"e":"Cellules sexuelles."}]},{"id":"annales-corrigees","t":"Annales corrigées · examens 2020 et examen blanc","seance":"Partie ultrastructures cellulaires · FST Béni Mellal","imp":5,"payant":true,"html":"<p>Deux vrais sujets de la FST Béni Mellal : l&#39;examen du 18/09/2020 (45 minutes) et l&#39;examen blanc 2019-2020. Les réponses renvoient aux chapitres 3 à 7.<\/p>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Reprends chaque question avec son numéro, dans l&#39;ordre : c&#39;est une consigne du sujet.<\/p>\n<\/aside><h2>Examen du 18/09/2020 · définitions<\/h2>\n<section class=\"exo\"><h3>I. Définir<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Le gradient de concentration (chimique).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Différence de concentration d&#39;une substance entre deux compartiments ; elle détermine le sens de la diffusion passive (du plus concentré vers le moins concentré).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Le transport actif secondaire.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Transport d&#39;une molécule contre son gradient, alimenté par le gradient d&#39;un autre ion (souvent Na⁺) entretenu par une pompe. Ex. : cotransport Na⁺/glucose.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>L&#39;exocytose.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Fusion d&#39;une vésicule intracellulaire avec la membrane plasmique, qui libère son contenu à l&#39;extérieur (sécrétion).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>L&#39;osmose.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Passage de l&#39;eau à travers une membrane semi-perméable, du milieu le moins concentré en solutés vers le plus concentré.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>La bêta-oxydation.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Dégradation des acides gras dans la matrice mitochondriale par coupures successives de 2 carbones (acétyl-CoA), avec production de NADH et FADH₂.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Examen du 18/09/2020 · oui ou non<\/h2>\n<section class=\"exo\"><h3>II. Oui ou non<\/h3><div class=\"ex\" data-x=\"5\"><div class=\"ex-q\"><ol>\n<li>La MP est perméable aux substances liposolubles.<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><strong>Oui<\/strong> (diffusion simple à travers la bicouche).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"6\"><div class=\"ex-q\"><ol start=\"2\">\n<li>La membrane mitochondriale externe est perméable.<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><strong>Oui<\/strong> (porines).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"7\"><div class=\"ex-q\"><ol start=\"3\">\n<li>Les pores nucléaires sont perméables aux substances de plus de 40 kDa.<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><strong>Non<\/strong> : pas librement ; elles passent par transport actif avec un signal.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"8\"><div class=\"ex-q\"><ol start=\"4\">\n<li>La pompe Na⁺/K⁺ maintient le gradient chimique et électrique.<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><strong>Oui<\/strong> : 3 Na⁺ sortent pour 2 K⁺ qui entrent.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"9\"><div class=\"ex-q\"><ol start=\"5\">\n<li>Les nucléofilaments sont composés uniquement d&#39;ADN.<\/li>\n<\/ol>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p><strong>Non<\/strong> : ADN + histones.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Examen du 18/09/2020 · schémas et respiration<\/h2>\n<section class=\"exo\"><h3>III et IV<\/h3><div class=\"ex\" data-x=\"10\"><div class=\"ex-q\"><p>III-1) Synthèse des ARN ribosomiques à partir de l&#39;ADN nucléolaire (schéma à expliquer).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Dans le nucléole, l&#39;ADN ribosomique (gènes répétés en tandem) est transcrit par l&#39;ARN polymérase I en un grand précurseur (45S chez les mammifères). Ce précurseur est découpé en ARNr 18S, 5,8S et 28S. Le 18S entre dans la petite sous-unité ; 5,8S et 28S (avec le 5S fait hors du nucléole) dans la grande. Les sous-unités sortent par les pores.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"11\"><div class=\"ex-q\"><p>III-2) Le processus de phagocytose (schéma).<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><ol>\n<li>Adhésion de la particule à la membrane. 2) Émission de pseudopodes qui l&#39;entourent. 3) Fermeture : phagosome. 4) Fusion avec un lysosome : phagolysosome. 5) Digestion par les hydrolases acides, rejet des déchets par exocytose.<\/li>\n<\/ol>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"12\"><div class=\"ex-q\"><p>IV) À quoi sert l&#39;O₂ respiré au niveau mitochondrial ? Équation.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Il est l&#39;accepteur final des électrons de la chaîne respiratoire (complexe IV) et devient de l&#39;eau : O₂ + 4 H⁺ + 4 e⁻ → 2 H₂O. Sans lui, la chaîne s&#39;arrête et l&#39;ATP synthase ne produit plus d&#39;ATP.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Examen blanc 2019-2020<\/h2>\n<section class=\"exo\"><h3>Sujets I à IV<\/h3><div class=\"ex\" data-x=\"13\"><div class=\"ex-q\"><p>I) Composition chimique et architecture de la MP.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Protéines ≈ 50 %, lipides ≈ 40 % (phospholipides les plus nombreux, cholestérol), glucides ≈ 10 %. Architecture : mosaïque fluide (chapitre 3).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"14\"><div class=\"ex-q\"><p>II-1, 2) Deux organes d&#39;échanges et leur modification membranaire.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Intestin grêle et rein (tubule proximal) : microvillosités (bordure en brosse).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"15\"><div class=\"ex-q\"><p>II-3) Les transporteurs de glucose.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>GLUT : diffusion facilitée, dans le sens du gradient (ex. GLUT4 dans le muscle et le tissu adipeux, sensible à l&#39;insuline). SGLT : cotransport Na⁺/glucose, transport actif secondaire (intestin, rein).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"16\"><div class=\"ex-q\"><p>II-4) Transport de l&#39;eau, de l&#39;O₂, et des ribosomes à travers l&#39;enveloppe nucléaire.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>O₂ : diffusion simple. Eau : osmose, surtout par les aquaporines. Sous-unités ribosomiques : transport actif par les pores nucléaires.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"17\"><div class=\"ex-q\"><p>III) Cellule pour étudier le RE, fonctions du REL, modifications dans le REG, étapes golgiennes.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Voir chapitre 5 : cellule pancréatique (REG) ou hépatocyte (REL) ; REL : lipides, détox, Ca²⁺ ; REG : repliement, ponts disulfure, N-glycosylation ; Golgi : glycosylation terminale, tri, emballage.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"18\"><div class=\"ex-q\"><p>IV) Comparer les membranes mitochondriales et les complexes de la chaîne respiratoire.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Voir chapitre 6. Complexes : I (NADH déshydrogénase), II (succinate déshydrogénase), III (cytochromes b-c1), IV (cytochrome c oxydase), plus les transporteurs mobiles ubiquinone et cytochrome c, et l&#39;ATP synthase.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Le sujet de l&#39;examen blanc est coupé à la fin (sujet 4, question 2) dans le document fourni.<\/p>\n<\/aside><h2>QCM<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">En 45 minutes, l&#39;examen demande surtout :<\/div><button class=\"opt\" data-o=\"0\">des définitions, des oui/non et des schémas<\/button><button class=\"opt\" data-o=\"1\">de longs calculs<\/button><button class=\"opt\" data-o=\"2\">des dissertations<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Le précurseur des ARNr chez les mammifères est :<\/div><button class=\"opt\" data-o=\"0\">18S<\/button><button class=\"opt\" data-o=\"1\">45S<\/button><button class=\"opt\" data-o=\"2\">5S<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Le phagolysosome résulte de la fusion :<\/div><button class=\"opt\" data-o=\"0\">phagosome + lysosome<\/button><button class=\"opt\" data-o=\"1\">RE + Golgi<\/button><button class=\"opt\" data-o=\"2\">noyau + lysosome<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">GLUT4 :<\/div><button class=\"opt\" data-o=\"0\">dépend de l&#39;insuline<\/button><button class=\"opt\" data-o=\"1\">est un cotransporteur Na⁺<\/button><button class=\"opt\" data-o=\"2\">transporte l&#39;eau<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Le complexe IV est :<\/div><button class=\"opt\" data-o=\"0\">la NADH déshydrogénase<\/button><button class=\"opt\" data-o=\"1\">la cytochrome c oxydase<\/button><button class=\"opt\" data-o=\"2\">l&#39;ATP synthase<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">La bordure en brosse est faite de :<\/div><button class=\"opt\" data-o=\"0\">microvillosités<\/button><button class=\"opt\" data-o=\"1\">cils<\/button><button class=\"opt\" data-o=\"2\">flagelles<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">L&#39;ARN 5S est fabriqué :<\/div><button class=\"opt\" data-o=\"0\">dans le nucléole<\/button><button class=\"opt\" data-o=\"1\">hors du nucléole<\/button><button class=\"opt\" data-o=\"2\">dans le cytoplasme<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Une définition d&#39;examen doit être :<\/div><button class=\"opt\" data-o=\"0\">courte et précise, avec un exemple<\/button><button class=\"opt\" data-o=\"1\">la plus longue possible<\/button><button class=\"opt\" data-o=\"2\">un schéma seul<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">La pompe Na⁺/K⁺ e const lireJ = (k) => { try { return JSON.parse(localStorage.getItem(k) || "{}") || {}; } catch (e) { return {}; } };
const ecrireJ = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const etat = () => { const S = lireJ(MODULE.cleEtat); S.attempts = S.attempts || {}; S.cards = S.cards || {}; return S; };
function noter(n, ok) { const S = etat(); (S.attempts[n] = S.attempts[n] || []).push(ok ? 1 : 0); if (S.attempts[n].length > 30) S.attempts[n].shift(); ecrireJ(MODULE.cleEtat, S); }
// Maîtrisé = au moins 3 essais et 80 % de réussite sur les 5 derniers (règle commune à la plateforme).
function statut(n) {
  if (MODULE.format === "score10") { const v = lireJ(MODULE.cle)[n]; if (v !== undefined) return [v >= 8 ? "ok" : "fragile", v / 10]; }
  if (MODULE.format === "best") { const v = (lireJ(MODULE.cle).notions || {})[n]; return v && v.best != null ? [v.best >= 0.8 ? "ok" : "fragile", v.best] : ["jamais", null]; }
  if (MODULE.format === "pc") { const v = lireJ(MODULE.cle)[n]; return v && v.pc !== undefined ? [v.pc >= 80 ? "ok" : "fragile", v.pc / 100] : ["jamais", null]; } const a = (etat().attempts[n] || []).slice(-5); if (!a.length) return ["jamais", null]; const r = a.reduce((x, y) => x + y, 0) / a.length; return [(etat().attempts[n].length >= 3 && r >= 0.8) ? "ok" : "fragile", r]; }
const NCH = {}; NOTIONS.forEach((n) => (NCH[n.ch] = NCH[n.ch] || []).push(n));
function scoreChap(c) {
  if (MODULE.format === "score10") return lireJ(MODULE.cle)[c.id];
  if (MODULE.format === "pc") { const v = lireJ(MODULE.cle)[c.id]; return v && v.pc !== undefined ? Math.round(v.pc / 10) : undefined; }
  if (MODULE.format === "best") { const v = (lireJ(MODULE.cle).notions || {})[c.id]; return v && v.best != null ? Math.round(v.best * 10) : undefined; }
  const l = NCH[c.id] || []; if (!l.length || !l.some((n) => statut(n.id)[0] !== "jamais")) return undefined;
  return Math.round((10 * l.filter((n) => statut(n.id)[0] === "ok").length) / l.length);
}

      try {
        const m = await db.doc(base).get(); if (m.exists) { const v = m.data() || {}; if (Array.isArray(v.memos)) ST.memos = JSON.parse(JSON.stringify(v.memos)); }
        const q = await db.collection(base + '/threads').get(); const remote = q.docs.map((x) => Object.assign({ id: x.id }, JSON.parse(JSON.stringify(x.data() || {}))));
        const map = {}; [...ST.threads, ...remote].forEach((t) => { if (!map[t.id] || (t.msgs || []).length > (map[t.id].msgs || []).length) map[t.id] = t; });
        ST.threads = Object.values(map).sort((a, b) => parseInt(a.id.slice(1), 36) - parseInt(b.id.slice(1), 36)); saveLocal();
      } catch (e) {}
    }).catch(() => {});
  } else { ready = true; note(); }

  window.MZT = { open: openPanel, close: closePanel };
})();

</script>
