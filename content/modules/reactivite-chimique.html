const MODULE={"slug":"reactivite-chimique","titre":"Réactivité chimique","cle":"reactivite-chimique_scores","cleEtat":"reactivite-chimique_scores_etat","format":"score10","intro":"<p>Ce module suit <strong>le polycopié du Pr Hafid<\/strong> (BCG-C213) : acides et bases, précipitation, oxydoréduction, cinétique, puis <strong>le devoir 2 et les exercices de révision corrigés<\/strong>.<\/p>\n<p><strong>Comment l&#39;utiliser<\/strong><\/p>\n<ol>\n<li>Apprends le formulaire de pH du chapitre 1 : c&#39;est la moitié de l&#39;examen.<\/li>\n<li>Pour chaque calcul, écris l&#39;approximation que tu fais et vérifie-la à la fin.<\/li>\n<li>Fais le QCM du chapitre. <strong>8/10 = chapitre maîtrisé.<\/strong><\/li>\n<\/ol>\n<p><strong>À vérifier<\/strong> : les séries de TD 1 à 4 sont des scans non lus ; les exercices viennent du devoir 2 et des fiches de révision 2021.<\/p>\n","annexes":[],"cartes":null,"maths":true};
const CHAPS=[{"id":"ph-des-solutions","t":"Le pH des solutions","seance":"Chapitre I-2 · Réactions acido-basiques","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir manipuler les logarithmes décimaux : $\\log(10^{-3}) = -3$ et $\\log(ab) = \\log a + \\log b$.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>$[H_3O^+] = 10^{-3}$ mol/L. pH ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 3<\/b><\/p><p>pH = 3.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « fort ou faible, puis une formule ».<\/strong> Identifie l&#39;espèce (acide fort, acide faible, base faible, ampholyte), choisis la formule, puis vérifie l&#39;approximation.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Appliquer la formule de l&#39;acide fort à un acide faible. L&#39;acide acétique 0,1 M n&#39;a pas un pH de 1 mais d&#39;environ 2,85 : il est très peu dissocié.<\/p>\n<\/aside><p>À la fin, tu sais calculer le pH de n&#39;importe quelle solution simple et justifier ton approximation.<\/p>\n<h2>Idée 1 · Le formulaire<\/h2>\n<figure class=\"grille\"><figcaption>Formules du pH (25 °C)<\/figcaption><table><tr><th>Solution,<\/th><th>Formule,<\/th><th>Valable<\/th><th>si<\/th><\/tr><tr><td class=\"h1\">Acide<\/td><td>fort<\/td><td>C,<\/td><td>pH<\/td><td>=<\/td><td>−log<\/td><td>C,<\/td><td>C<\/td><td>&gt;<\/td><td>10⁻⁶<\/td><td>M<\/td><\/tr><tr><td class=\"h1\">Base<\/td><td>forte<\/td><td>C,<\/td><td>pH<\/td><td>=<\/td><td>14<\/td><td>+<\/td><td>log<\/td><td>C,<\/td><td>C<\/td><td>&gt;<\/td><td>10⁻⁶<\/td><td>M<\/td><\/tr><tr><td class=\"h1\">Acide<\/td><td>faible<\/td><td>C,<\/td><td>pH<\/td><td>=<\/td><td>½(pKa<\/td><td>−<\/td><td>log<\/td><td>C),<\/td><td>α<\/td><td>&lt;<\/td><td>5<\/td><td>%<\/td><td>(pH<\/td><td>&lt;<\/td><td>pKa<\/td><td>−<\/td><td>1)<\/td><\/tr><tr><td class=\"h1\">Base<\/td><td>faible<\/td><td>C,<\/td><td>pH<\/td><td>=<\/td><td>7<\/td><td>+<\/td><td>½(pKa<\/td><td>+<\/td><td>log<\/td><td>C),<\/td><td>pH<\/td><td>&gt;<\/td><td>pKa<\/td><td>+<\/td><td>1<\/td><\/tr><tr><td class=\"h1\">Ampholyte,<\/td><td>pH<\/td><td>=<\/td><td>½(pKa1<\/td><td>+<\/td><td>pKa2),<\/td><td>indépendant<\/td><td>de<\/td><td>C<\/td><\/tr><\/table><\/figure><h2>Idée 2 · Le coefficient de dissociation<\/h2>\n<p>$\\alpha = \\frac{[A^-]}{C}$. Pour un acide faible peu dissocié, $\\alpha \\approx \\sqrt{K_a / C}$.<\/p>\n<svg viewBox=\"0 0 320 70\" role=\"img\" aria-label=\"Axe des pH : en dessous de pKa l'acide domine, au-dessus la base\" style=\"max-width:380px;width:100%\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M10 35h300\"/><path d=\"M160 25v20\" stroke=\"#D9824F\"/><\/g>\n<g fill=\"currentColor\" font-size=\"11\"><text x=\"150\" y=\"18\">pKa<\/text><text x=\"40\" y=\"60\">HA majoritaire<\/text><text x=\"200\" y=\"60\">A⁻ majoritaire<\/text><\/g>\n<\/svg><figure class=\"etapes\" data-i=\"0\"><figcaption>Calcul type : acide acétique 0,1 M, Ka = 2·10⁻⁵<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · 1. Acide faible : on suppose α petit.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · 2. pH = ½(pKa − log C) = ½(4,70 + 1) ≈ 2,85.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · 3. α ≈ √(2·10⁻⁵ / 0,1) ≈ 1,4 % &lt; 5 % : approximation justifiée.<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Idée 3 · Les ampholytes<\/h2>\n<p>Une espèce à la fois acide et base (HCO₃⁻) : pH = ½(pKa1 + pKa2). Pour NaHCO₃ : ½(6,30 + 10,33) ≈ <strong>8,32<\/strong>, quelle que soit la concentration.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices de révision<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Ex. 3 : acide formique 10⁻² M, pH = 2,9. α et pKa ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 3.74<\/b><\/p><p>[H₃O⁺] = 10⁻²·⁹ ≈ 1,26·10⁻³ ; α ≈ 12,6 %. $K_a = \\frac{h^2}{C - h}$ donne <strong>pKa ≈ 3,74<\/strong> (pas d&#39;approximation, α &gt; 5 %).<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Ex. 4 : NaF 0,1 M (pKa HF/F⁻ = 3,18). pH ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 8.09<\/b><\/p><p>F⁻ est une base faible : pH = 7 + ½(3,18) + ½ log(0,1) ≈ <strong>8,09<\/strong>.<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">pH de HCl 10⁻² M :<\/div><button class=\"opt\" data-o=\"0\">2<\/button><button class=\"opt\" data-o=\"1\">12<\/button><button class=\"opt\" data-o=\"2\">7<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">pH de NaOH 10⁻³ M :<\/div><button class=\"opt\" data-o=\"0\">11<\/button><button class=\"opt\" data-o=\"1\">3<\/button><button class=\"opt\" data-o=\"2\">14<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Un acide plus dilué est :<\/div><button class=\"opt\" data-o=\"0\">plus dissocié<\/button><button class=\"opt\" data-o=\"1\">moins dissocié<\/button><button class=\"opt\" data-o=\"2\">pas plus dissocié<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">pH d&#39;un ampholyte :<\/div><button class=\"opt\" data-o=\"0\">ne dépend pas de C<\/button><button class=\"opt\" data-o=\"1\">dépend fortement de C<\/button><button class=\"opt\" data-o=\"2\">vaut toujours 7<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">À pH = pKa :<\/div><button class=\"opt\" data-o=\"0\">[HA] = [A⁻]<\/button><button class=\"opt\" data-o=\"1\">[HA] &gt; [A⁻]<\/button><button class=\"opt\" data-o=\"2\">il n&#39;y a plus d&#39;acide<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">NaF en solution est :<\/div><button class=\"opt\" data-o=\"0\">basique<\/button><button class=\"opt\" data-o=\"1\">acide<\/button><button class=\"opt\" data-o=\"2\">neutre<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">L&#39;approximation « acide faiblement dissocié » est valable si :<\/div><button class=\"opt\" data-o=\"0\">α &lt; 5 %<\/button><button class=\"opt\" data-o=\"1\">α &gt; 50 %<\/button><button class=\"opt\" data-o=\"2\">toujours<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Ke à 25 °C vaut :<\/div><button class=\"opt\" data-o=\"0\">10⁻¹⁴<\/button><button class=\"opt\" data-o=\"1\">10⁻⁷<\/button><button class=\"opt\" data-o=\"2\">14<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">pH d&#39;acide acétique 0,1 M (Ka = 2·10⁻⁵) :<\/div><button class=\"opt\" data-o=\"0\">≈ 2,85<\/button><button class=\"opt\" data-o=\"1\">1<\/button><button class=\"opt\" data-o=\"2\">4,7<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">HCO₃⁻ est :<\/div><button class=\"opt\" data-o=\"0\">un ampholyte<\/button><button class=\"opt\" data-o=\"1\">un acide fort<\/button><button class=\"opt\" data-o=\"2\">un ion indifférent<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"ph-des-solutions","rep":["3"],"tol":null},{"n":"ph-des-solutions","rep":["3.74"],"tol":null},{"n":"ph-des-solutions","rep":["8.09"],"tol":null}],"qcm":[{"n":"ph-des-solutions","q":"pH de HCl 10⁻² M :","o":["2","12","7"],"a":0,"e":"Acide fort."},{"n":"ph-des-solutions","q":"pH de NaOH 10⁻³ M :","o":["11","3","14"],"a":0,"e":"14 + log C."},{"n":"ph-des-solutions","q":"Un acide plus dilué est :","o":["plus dissocié","moins dissocié","pas plus dissocié"],"a":0,"e":"α ≈ √(Ka/C) augmente."},{"n":"ph-des-solutions","q":"pH d&#39;un ampholyte :","o":["ne dépend pas de C","dépend fortement de C","vaut toujours 7"],"a":0,"e":"½(pKa1 + pKa2)."},{"n":"ph-des-solutions","q":"À pH = pKa :","o":["[HA] = [A⁻]","[HA] &gt; [A⁻]","il n&#39;y a plus d&#39;acide"],"a":0,"e":"Demi-équivalence."},{"n":"ph-des-solutions","q":"NaF en solution est :","o":["basique","acide","neutre"],"a":0,"e":"F⁻ est une base faible."},{"n":"ph-des-solutions","q":"L&#39;approximation « acide faiblement dissocié » est valable si :","o":["α &lt; 5 %","α &gt; 50 %","toujours"],"a":0,"e":"Sinon on résout l&#39;équation du second degré."},{"n":"ph-des-solutions","q":"Ke à 25 °C vaut :","o":["10⁻¹⁴","10⁻⁷","14"],"a":0,"e":"pKe = 14."},{"n":"ph-des-solutions","q":"pH d&#39;acide acétique 0,1 M (Ka = 2·10⁻⁵) :","o":["≈ 2,85","1","4,7"],"a":0,"e":"Formule de l&#39;acide faible."},{"n":"ph-des-solutions","q":"HCO₃⁻ est :","o":["un ampholyte","un acide fort","un ion indifférent"],"a":0,"e":"Base de H₂CO₃, acide de CO₃²⁻."}]},{"id":"titrages-melanges","t":"Mélanges et titrages acido-basiques","seance":"Chapitre I-2 · Dosages","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir calculer une quantité de matière : n = C × V.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>20 mL de NaOH 0,25 M : combien de mmol ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 5<\/b><\/p><p>20 × 0,25 = 5 mmol.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « qui est en excès ? ».<\/strong> Dans un mélange acide + base, fais d&#39;abord la réaction totale, puis calcule le pH avec ce qui reste.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Oublier de diviser par le volume total. Après un mélange, toutes les concentrations se calculent sur la somme des volumes.<\/p>\n<\/aside><p>À la fin, tu sais tracer et exploiter la courbe de dosage d&#39;un acide faible par une base forte.<\/p>\n<h2>Idée 1 · Les mélanges<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Mélange acide fort + base forte<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · 1. Calcule les quantités : n(H₃O⁺) et n(OH⁻).<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · 2. Retranche : l&#39;espèce en excès fixe le pH.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · 3. Divise par le volume total.<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p><strong>Exemple (révision, ex. 5).<\/strong> 10 mL de HCl 0,1 M (1 mmol) + 20 mL de NaOH 0,25 M (5 mmol) : il reste 4 mmol de OH⁻ dans 30 mL, [OH⁻] = 0,133 M, <strong>pH ≈ 13,1<\/strong>.<\/p>\n<h2>Idée 2 · Le dosage d&#39;un acide faible par une base forte<\/h2>\n<svg viewBox=\"0 0 320 150\" role=\"img\" aria-label=\"Courbe de dosage acide faible base forte : demi-équivalence à pH = pKa, saut de pH à l'équivalence\" style=\"max-width:380px;width:100%\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M30 10v130h270\"/><path d=\"M30 110C60 95 70 92 100 90S150 82 160 70C166 40 175 30 200 25S270 20 295 18\" stroke=\"#D9824F\"/><path d=\"M95 90v50M30 90h65M165 50v90\" stroke-dasharray=\"3 4\"/><\/g>\n<g fill=\"currentColor\" font-size=\"10\"><text x=\"0\" y=\"94\">pKa<\/text><text x=\"85\" y=\"148\">Ve/2<\/text><text x=\"160\" y=\"148\">Ve<\/text><text x=\"250\" y=\"148\">V<\/text><text x=\"5\" y=\"14\">pH<\/text><\/g>\n<\/svg><figure class=\"grille\"><figcaption>Points remarquables (x = V/Ve)<\/figcaption><table><tr><th>Point,<\/th><th>pH<\/th><\/tr><tr><td class=\"h1\">x<\/td><td>=<\/td><td>0,<\/td><td>acide<\/td><td>faible<\/td><td>seul<\/td><td>:<\/td><td>½(pKa<\/td><td>−<\/td><td>log<\/td><td>Ca)<\/td><\/tr><tr><td class=\"h1\">0<\/td><td>&lt;<\/td><td>x<\/td><td>&lt;<\/td><td>1,<\/td><td>tampon<\/td><td>:<\/td><td>pKa<\/td><td>+<\/td><td>log(x<\/td><td>/<\/td><td>(1<\/td><td>−<\/td><td>x))<\/td><\/tr><tr><td class=\"h1\">x<\/td><td>=<\/td><td>0,5,<\/td><td>demi-équivalence<\/td><td>:<\/td><td>pH<\/td><td>=<\/td><td>pKa<\/td><\/tr><tr><td class=\"h1\">x<\/td><td>=<\/td><td>1,<\/td><td>base<\/td><td>faible<\/td><td>seule<\/td><td>:<\/td><td>7<\/td><td>+<\/td><td>½(pKa<\/td><td>+<\/td><td>log<\/td><td>C)<\/td><\/tr><tr><td class=\"h1\">x<\/td><td>&gt;<\/td><td>1,<\/td><td>base<\/td><td>forte<\/td><td>en<\/td><td>excès<\/td><td>:<\/td><td>14<\/td><td>+<\/td><td>log[OH⁻]<\/td><\/tr><\/table><\/figure><h2>Idée 3 · Les solutions tampons<\/h2>\n<p>Un mélange acide faible + base conjuguée en quantités proches : le pH varie peu par ajout d&#39;acide, de base ou par dilution. pH = pKa + log([A⁻]/[HA]).<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Révision, exercice 6<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>50 mL d&#39;acide formique 0,1 M dosés par NaOH 0,5 M. Ve ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 10<\/b><\/p><p>Ve = 50 × 0,1 / 0,5 = <strong>10 mL<\/strong>.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>pH à l&#39;équivalence (pKa = 3,8) ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 8.36<\/b><\/p><p>C(HCOO⁻) = 5 mmol / 60 mL ≈ 0,083 M ; pH = 7 + ½(3,8) + ½ log(0,083) ≈ <strong>8,36<\/strong>.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>pH pour x = 1,5 ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 12.6<\/b><\/p><p>V = 15 mL : excès de 2,5 mmol de OH⁻ dans 65 mL, [OH⁻] ≈ 0,0385 M, <strong>pH ≈ 12,6<\/strong>.<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">À la demi-équivalence :<\/div><button class=\"opt\" data-o=\"0\">pH = pKa<\/button><button class=\"opt\" data-o=\"1\">pH = 7<\/button><button class=\"opt\" data-o=\"2\">pH = 14<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Le pH à l&#39;équivalence d&#39;un acide faible dosé par une base forte est :<\/div><button class=\"opt\" data-o=\"0\">supérieur à 7<\/button><button class=\"opt\" data-o=\"1\">égal à 7<\/button><button class=\"opt\" data-o=\"2\">inférieur à 7<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Un tampon résiste à :<\/div><button class=\"opt\" data-o=\"0\">l&#39;ajout modéré d&#39;acide ou de base<\/button><button class=\"opt\" data-o=\"1\">toute réaction<\/button><button class=\"opt\" data-o=\"2\">la chaleur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Ve se calcule par :<\/div><button class=\"opt\" data-o=\"0\">Ca·Va = Cb·Ve<\/button><button class=\"opt\" data-o=\"1\">Ca + Cb<\/button><button class=\"opt\" data-o=\"2\">Va/Vb<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Après l&#39;équivalence, le pH est fixé par :<\/div><button class=\"opt\" data-o=\"0\">la base forte en excès<\/button><button class=\"opt\" data-o=\"1\">l&#39;acide faible<\/button><button class=\"opt\" data-o=\"2\">le pKa<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Dosage d&#39;un acide fort par une base forte : pH à l&#39;équivalence :<\/div><button class=\"opt\" data-o=\"0\">7<\/button><button class=\"opt\" data-o=\"1\">8,4<\/button><button class=\"opt\" data-o=\"2\">pKa<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Pour x = 0,25, pH =<\/div><button class=\"opt\" data-o=\"0\">pKa − log 3<\/button><button class=\"opt\" data-o=\"1\">pKa + log 3<\/button><button class=\"opt\" data-o=\"2\">pKa<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">1 mmol de HCl + 5 mmol de NaOH dans 30 mL :<\/div><button class=\"opt\" data-o=\"0\">basique<\/button><button class=\"opt\" data-o=\"1\">acide<\/button><button class=\"opt\" data-o=\"2\">neutre<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Le saut de pH sert à :<\/div><button class=\"opt\" data-o=\"0\">repérer l&#39;équivalence<\/button><button class=\"opt\" data-o=\"1\">mesurer le pKa<\/button><button class=\"opt\" data-o=\"2\">calculer la masse molaire<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Diluer un tampon :<\/div><button class=\"opt\" data-o=\"0\">change peu son pH<\/button><button class=\"opt\" data-o=\"1\">le rend neutre<\/button><button class=\"opt\" data-o=\"2\">double son pH<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"titrages-melanges","rep":["5"],"tol":null},{"n":"titrages-melanges","rep":["10"],"tol":null},{"n":"titrages-melanges","rep":["8.36"],"tol":null},{"n":"titrages-melanges","rep":["12.6"],"tol":null}],"qcm":[{"n":"titrages-melanges","q":"À la demi-équivalence :","o":["pH = pKa","pH = 7","pH = 14"],"a":0,"e":"Autant de HA que de A⁻."},{"n":"titrages-melanges","q":"Le pH à l&#39;équivalence d&#39;un acide faible dosé par une base forte est :","o":["supérieur à 7","égal à 7","inférieur à 7"],"a":0,"e":"Il reste la base conjuguée."},{"n":"titrages-melanges","q":"Un tampon résiste à :","o":["l&#39;ajout modéré d&#39;acide ou de base","toute réaction","la chaleur"],"a":0,"e":"pH quasi constant."},{"n":"titrages-melanges","q":"Ve se calcule par :","o":["Ca·Va = Cb·Ve","Ca + Cb","Va/Vb"],"a":0,"e":"Égalité des quantités."},{"n":"titrages-melanges","q":"Après l&#39;équivalence, le pH est fixé par :","o":["la base forte en excès","l&#39;acide faible","le pKa"],"a":0,"e":"OH⁻ en excès."},{"n":"titrages-melanges","q":"Dosage d&#39;un acide fort par une base forte : pH à l&#39;équivalence :","o":["7","8,4","pKa"],"a":0,"e":"Seuls des ions indifférents."},{"n":"titrages-melanges","q":"Pour x = 0,25, pH =","o":["pKa − log 3","pKa + log 3","pKa"],"a":0,"e":"log(0,25/0,75)."},{"n":"titrages-melanges","q":"1 mmol de HCl + 5 mmol de NaOH dans 30 mL :","o":["basique","acide","neutre"],"a":0,"e":"4 mmol de OH⁻ en excès."},{"n":"titrages-melanges","q":"Le saut de pH sert à :","o":["repérer l&#39;équivalence","mesurer le pKa","calculer la masse molaire"],"a":0,"e":"Indicateur coloré ou dérivée."},{"n":"titrages-melanges","q":"Diluer un tampon :","o":["change peu son pH","le rend neutre","double son pH"],"a":0,"e":"Le rapport [A⁻]/[HA] ne change pas."}]},{"id":"precipitation-complexation","t":"Précipitation et complexation","seance":"Chapitre I-3 · Solubilité, Ks, complexes","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir écrire une dissolution : $AgCl(s) \\rightleftharpoons Ag^+ + Cl^-$.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Combien d&#39;ions OH⁻ libère une unité de Cu(OH)₂ ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 2<\/b><\/p><p>Deux : $Cu(OH)_2 \\rightleftharpoons Cu^{2+} + 2OH^-$.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « tableau d&#39;avancement avec s ».<\/strong> Note s la solubilité, écris les concentrations en fonction de s, puis Ks.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Oublier les exposants. Pour Cu(OH)₂, $K_s = [Cu^{2+}][OH^-]^2 = s(2s)^2 = 4s^3$, pas $s^2$.<\/p>\n<\/aside><p>À la fin, tu sais relier Ks et solubilité, prévoir un précipité et l&#39;effet d&#39;un ion commun.<\/p>\n<h2>Idée 1 · Produit de solubilité<\/h2>\n<figure class=\"grille\"><figcaption>Ks en fonction de s<\/figcaption><table><tr><th>Sel,<\/th><th>Ks<\/th><\/tr><tr><td class=\"h1\">AB<\/td><td>(AgCl),<\/td><td>s²<\/td><\/tr><tr><td class=\"h1\">AB₂<\/td><td>ou<\/td><td>A₂B<\/td><td>(Cu(OH)₂,<\/td><td>Ag₂CrO₄),<\/td><td>4s³<\/td><\/tr><tr><td class=\"h1\">A₃B<\/td><td>ou<\/td><td>AB₃,<\/td><td>27s⁴<\/td><\/tr><\/table><\/figure><h2>Idée 2 · Prévoir la précipitation<\/h2>\n<svg viewBox=\"0 0 320 70\" role=\"img\" aria-label=\"Comparer le produit ionique Q à Ks : précipité si Q > Ks\" style=\"max-width:380px;width:100%\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M10 35h300\"/><path d=\"M160 25v20\" stroke=\"#D9824F\"/><\/g>\n<g fill=\"currentColor\" font-size=\"11\"><text x=\"152\" y=\"18\">Ks<\/text><text x=\"30\" y=\"60\">Q &lt; Ks : pas de précipité<\/text><text x=\"185\" y=\"60\">Q &gt; Ks : précipité<\/text><\/g>\n<\/svg><p><strong>Effet d&#39;ion commun<\/strong> : ajouter Cl⁻ à une solution de AgCl diminue sa solubilité. <strong>Effet du pH<\/strong> : un hydroxyde est moins soluble en milieu basique.<\/p>\n<h2>Idée 3 · Les complexes<\/h2>\n<p>Un complexe = un ion central + des ligands. Constante de formation $\\beta = \\frac{[ML_n]}{[M][L]^n}$. Former un complexe peut redissoudre un précipité (AgCl dans l&#39;ammoniac : $Ag(NH_3)_2^+$).<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Devoir 2, exercice 2<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Solution saturée de Cu(OH)₂ à pH = 7,4. Ks ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>[OH⁻] = 10⁻⁶·⁶ ≈ 2,5·10⁻⁷ M ; [Cu²⁺] = [OH⁻]/2 ≈ 1,26·10⁻⁷ M ; Ks = [Cu²⁺][OH⁻]² ≈ <strong>7,9·10⁻²¹<\/strong>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>AgCl, Ks = 1,8·10⁻¹⁰. Solubilité dans l&#39;eau pure ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>s = √Ks ≈ <strong>1,34·10⁻⁵<\/strong> mol/L.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>La valeur de Ks obtenue (≈ 8·10⁻²¹) est plus petite que la valeur des tables pour Cu(OH)₂ (≈ 2·10⁻²⁰) : la donnée pH = 7,4 du devoir est arrondie. Le raisonnement est ce qui est noté.<\/p>\n<\/aside><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Ks de AgCl en fonction de s :<\/div><button class=\"opt\" data-o=\"0\">s²<\/button><button class=\"opt\" data-o=\"1\">4s³<\/button><button class=\"opt\" data-o=\"2\">2s<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Ks de Cu(OH)₂ :<\/div><button class=\"opt\" data-o=\"0\">s²<\/button><button class=\"opt\" data-o=\"1\">4s³<\/button><button class=\"opt\" data-o=\"2\">27s⁴<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Un précipité se forme si :<\/div><button class=\"opt\" data-o=\"0\">Q &gt; Ks<\/button><button class=\"opt\" data-o=\"1\">Q &lt; Ks<\/button><button class=\"opt\" data-o=\"2\">Q = 0<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Ajouter NaCl à une solution de AgCl :<\/div><button class=\"opt\" data-o=\"0\">diminue la solubilité de AgCl<\/button><button class=\"opt\" data-o=\"1\">l&#39;augmente<\/button><button class=\"opt\" data-o=\"2\">ne change rien<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Un hydroxyde métallique est plus soluble :<\/div><button class=\"opt\" data-o=\"0\">en milieu acide<\/button><button class=\"opt\" data-o=\"1\">en milieu basique<\/button><button class=\"opt\" data-o=\"2\">jamais<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">AgCl se dissout dans l&#39;ammoniac grâce à :<\/div><button class=\"opt\" data-o=\"0\">la formation de Ag(NH₃)₂⁺<\/button><button class=\"opt\" data-o=\"1\">l&#39;oxydation<\/button><button class=\"opt\" data-o=\"2\">l&#39;ion commun<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Plus Ks est petit, le sel est :<\/div><button class=\"opt\" data-o=\"0\">moins soluble<\/button><button class=\"opt\" data-o=\"1\">plus soluble<\/button><button class=\"opt\" data-o=\"2\">toujours insoluble<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Un ligand est :<\/div><button class=\"opt\" data-o=\"0\">une espèce qui donne un doublet au métal<\/button><button class=\"opt\" data-o=\"1\">un cation<\/button><button class=\"opt\" data-o=\"2\">un précipité<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Solubilité de AgCl (Ks = 1,8·10⁻¹⁰) :<\/div><button class=\"opt\" data-o=\"0\">≈ 1,3·10⁻⁵ M<\/button><button class=\"opt\" data-o=\"1\">1,8·10⁻¹⁰ M<\/button><button class=\"opt\" data-o=\"2\">≈ 10⁻³ M<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">β est la constante :<\/div><button class=\"opt\" data-o=\"0\">de formation d&#39;un complexe<\/button><button class=\"opt\" data-o=\"1\">de solubilité<\/button><button class=\"opt\" data-o=\"2\">d&#39;acidité<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"precipitation-complexation","rep":["2"],"tol":null},{"n":"precipitation-complexation","rep":null,"tol":null},{"n":"precipitation-complexation","rep":null,"tol":null}],"qcm":[{"n":"precipitation-complexation","q":"Ks de AgCl en fonction de s :","o":["s²","4s³","2s"],"a":0,"e":"Sel 1:1."},{"n":"precipitation-complexation","q":"Ks de Cu(OH)₂ :","o":["s²","4s³","27s⁴"],"a":1,"e":"[OH⁻] = 2s."},{"n":"precipitation-complexation","q":"Un précipité se forme si :","o":["Q &gt; Ks","Q &lt; Ks","Q = 0"],"a":0,"e":"Solution sursaturée."},{"n":"precipitation-complexation","q":"Ajouter NaCl à une solution de AgCl :","o":["diminue la solubilité de AgCl","l&#39;augmente","ne change rien"],"a":0,"e":"Ion commun."},{"n":"precipitation-complexation","q":"Un hydroxyde métallique est plus soluble :","o":["en milieu acide","en milieu basique","jamais"],"a":0,"e":"H₃O⁺ consomme OH⁻."},{"n":"precipitation-complexation","q":"AgCl se dissout dans l&#39;ammoniac grâce à :","o":["la formation de Ag(NH₃)₂⁺","l&#39;oxydation","l&#39;ion commun"],"a":0,"e":"Complexation."},{"n":"precipitation-complexation","q":"Plus Ks est petit, le sel est :","o":["moins soluble","plus soluble","toujours insoluble"],"a":0,"e":"À formule comparable."},{"n":"precipitation-complexation","q":"Un ligand est :","o":["une espèce qui donne un doublet au métal","un cation","un précipité"],"a":0,"e":"Base de Lewis."},{"n":"precipitation-complexation","q":"Solubilité de AgCl (Ks = 1,8·10⁻¹⁰) :","o":["≈ 1,3·10⁻⁵ M","1,8·10⁻¹⁰ M","≈ 10⁻³ M"],"a":0,"e":"√Ks."},{"n":"precipitation-complexation","q":"β est la constante :","o":["de formation d&#39;un complexe","de solubilité","d&#39;acidité"],"a":0,"e":"Plus elle est grande, plus le complexe est stable."}]},{"id":"oxydoreduction-piles","t":"Oxydoréduction et piles","seance":"Chapitre I-4 · Réactions d'oxydoréduction","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir qu&#39;un oxydant capte des électrons et un réducteur en cède.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Dans $Ag^+ + e^- \\to Ag$, qui est l&#39;oxydant ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Ag⁺ : il capte un électron (il est réduit).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « le plus grand E est la cathode ».<\/strong> L&#39;électrode de plus haut potentiel est le pôle + où a lieu la réduction ; l&#39;autre est l&#39;anode où a lieu l&#39;oxydation.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Oublier de diviser 0,06 par n dans la loi de Nernst. Pour Cd²⁺/Cd, n = 2 : le facteur est 0,03.<\/p>\n<\/aside><p>À la fin, tu sais équilibrer une réaction, calculer des potentiels, une fem et une constante d&#39;équilibre.<\/p>\n<h2>Idée 1 · Équilibrer en milieu acide<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Méthode des demi-équations<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · 1. Équilibre l&#39;élément qui change d&#39;oxydation.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · 2. Équilibre O avec H₂O, puis H avec H⁺.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · 3. Équilibre les charges avec des électrons.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · 4. Multiplie pour avoir autant d&#39;électrons dans les deux demi-équations, puis additionne.<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p><strong>Exemple (révision, ex. 11a).<\/strong> $MnO_4^- + 8H^+ + 5e^- \\to Mn^{2+} + 4H_2O$ et $2Cl^- \\to Cl_2 + 2e^-$. Bilan : $2MnO_4^- + 16H^+ + 10Cl^- \\to 2Mn^{2+} + 5Cl_2 + 8H_2O$.<\/p>\n<h2>Idée 2 · La loi de Nernst<\/h2>\n<p>$$E = E° + \\frac{0{,}06}{n}\\log\\frac{[Ox]}{[Red]}$$<\/p>\n<svg viewBox=\"0 0 320 120\" role=\"img\" aria-label=\"Pile : anode à gauche, cathode à droite, électrons dans le fil de l'anode vers la cathode, pont salin\" style=\"max-width:380px;width:100%\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M30 50h70v60H30zM220 50h70v60h-70z\"/><path d=\"M60 50V20h200v30\"/><path d=\"M90 60q70-40 140 0\" stroke=\"#D9824F\"/><path d=\"M150 14l10 6-10 6\"/><\/g>\n<g fill=\"currentColor\" font-size=\"10\"><text x=\"30\" y=\"125\">anode (−) oxydation<\/text><text x=\"200\" y=\"125\">cathode (+) réduction<\/text><text x=\"120\" y=\"12\">électrons →<\/text><text x=\"130\" y=\"48\">pont salin<\/text><\/g>\n<\/svg><h2>Idée 3 · Fem et constante d&#39;équilibre<\/h2>\n<p>fem = E(cathode) − E(anode). Constante : $\\log K = \\frac{n\\,(E°_{cathode} - E°_{anode})}{0{,}06}$. À l&#39;équilibre (pile usée), les deux potentiels sont égaux.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Révision, exercice 12 : Cu/Cu²⁺ (0,1 M) // Fe²⁺ (0,1 M)/Fe<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Potentiels des électrodes ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.31<\/b><\/p><p>E(Cu) = 0,34 + 0,03 log 0,1 = <strong>0,31 V<\/strong> ; E(Fe) = −0,44 + 0,03 log 0,1 = <strong>−0,47 V<\/strong>.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Anode, cathode, fem ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.78<\/b><\/p><p>Cathode : cuivre ($Cu^{2+} + 2e^- \\to Cu$). Anode : fer ($Fe \\to Fe^{2+} + 2e^-$). fem = 0,31 − (−0,47) = <strong>0,78 V<\/strong>. Attention : la pile est écrite à l&#39;envers dans le sujet, le fer est bien l&#39;anode.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Constante de $Cu^{2+} + Fe \\to Cu + Fe^{2+}$ ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 26<\/b><\/p><p>log K = 2 × 0,78 / 0,06 = 26, <strong>K = 10²⁶<\/strong> : réaction totale.<\/p>\n<\/div><\/div><\/section><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Révision, exercice 13 : le sujet annonce Fe cathode d&#39;une pile Ni/Fe avec une fem de 0,21 V. Avec les vraies valeurs (E°(Ni²⁺/Ni) = −0,25 V, E°(Fe²⁺/Fe) = −0,44 V), c&#39;est le nickel qui serait la cathode. Les données conduisent à E°(Ni²⁺/Ni) ≈ −0,63 V, valeur fictive : signale-le sur ta copie.<\/p>\n<\/aside><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">À la cathode a lieu :<\/div><button class=\"opt\" data-o=\"0\">la réduction<\/button><button class=\"opt\" data-o=\"1\">l&#39;oxydation<\/button><button class=\"opt\" data-o=\"2\">rien<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Les électrons circulent dans le fil :<\/div><button class=\"opt\" data-o=\"0\">de l&#39;anode vers la cathode<\/button><button class=\"opt\" data-o=\"1\">de la cathode vers l&#39;anode<\/button><button class=\"opt\" data-o=\"2\">dans le pont salin<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Pour Cd²⁺/Cd, le facteur de Nernst est :<\/div><button class=\"opt\" data-o=\"0\">0,03<\/button><button class=\"opt\" data-o=\"1\">0,06<\/button><button class=\"opt\" data-o=\"2\">0,12<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Quand la pile est usée :<\/div><button class=\"opt\" data-o=\"0\">fem = 0<\/button><button class=\"opt\" data-o=\"1\">fem maximale<\/button><button class=\"opt\" data-o=\"2\">K = 0<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Dans MnO₄⁻ → Mn²⁺, le nombre d&#39;électrons est :<\/div><button class=\"opt\" data-o=\"0\">5<\/button><button class=\"opt\" data-o=\"1\">2<\/button><button class=\"opt\" data-o=\"2\">7<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">K = 10²⁶ signifie une réaction :<\/div><button class=\"opt\" data-o=\"0\">totale<\/button><button class=\"opt\" data-o=\"1\">impossible<\/button><button class=\"opt\" data-o=\"2\">équilibrée à 50 %<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">fem de Cd/Ag (0,20 M chacun) :<\/div><button class=\"opt\" data-o=\"0\">1,18 V<\/button><button class=\"opt\" data-o=\"1\">1,20 V<\/button><button class=\"opt\" data-o=\"2\">0,40 V<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Rôle du pont salin :<\/div><button class=\"opt\" data-o=\"0\">fermer le circuit et garder la neutralité<\/button><button class=\"opt\" data-o=\"1\">fournir des électrons<\/button><button class=\"opt\" data-o=\"2\">stocker l&#39;énergie<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Un réducteur :<\/div><button class=\"opt\" data-o=\"0\">cède des électrons<\/button><button class=\"opt\" data-o=\"1\">capte des électrons<\/button><button class=\"opt\" data-o=\"2\">capte des protons<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Augmenter [Ag⁺] fait :<\/div><button class=\"opt\" data-o=\"0\">monter E(Ag⁺/Ag)<\/button><button class=\"opt\" data-o=\"1\">baisser E(Ag⁺/Ag)<\/button><button class=\"opt\" data-o=\"2\">rien<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"oxydoreduction-piles","rep":null,"tol":null},{"n":"oxydoreduction-piles","rep":["0.31"],"tol":null},{"n":"oxydoreduction-piles","rep":["0.78"],"tol":null},{"n":"oxydoreduction-piles","rep":["26"],"tol":null}],"qcm":[{"n":"oxydoreduction-piles","q":"À la cathode a lieu :","o":["la réduction","l&#39;oxydation","rien"],"a":0,"e":"Gain d&#39;électrons."},{"n":"oxydoreduction-piles","q":"Les électrons circulent dans le fil :","o":["de l&#39;anode vers la cathode","de la cathode vers l&#39;anode","dans le pont salin"],"a":0,"e":"Les ions circulent dans le pont."},{"n":"oxydoreduction-piles","q":"Pour Cd²⁺/Cd, le facteur de Nernst est :","o":["0,03","0,06","0,12"],"a":0,"e":"0,06/2."},{"n":"oxydoreduction-piles","q":"Quand la pile est usée :","o":["fem = 0","fem maximale","K = 0"],"a":0,"e":"Équilibre atteint."},{"n":"oxydoreduction-piles","q":"Dans MnO₄⁻ → Mn²⁺, le nombre d&#39;électrons est :","o":["5","2","7"],"a":0,"e":"Mn passe de +7 à +2."},{"n":"oxydoreduction-piles","q":"K = 10²⁶ signifie une réaction :","o":["totale","impossible","équilibrée à 50 %"],"a":0,"e":"K très grand."},{"n":"oxydoreduction-piles","q":"fem de Cd/Ag (0,20 M chacun) :","o":["1,18 V","1,20 V","0,40 V"],"a":0,"e":"Devoir 2."},{"n":"oxydoreduction-piles","q":"Rôle du pont salin :","o":["fermer le circuit et garder la neutralité","fournir des électrons","stocker l&#39;énergie"],"a":0,"e":"Migration d&#39;ions."},{"n":"oxydoreduction-piles","q":"Un réducteur :","o":["cède des électrons","capte des électrons","capte des protons"],"a":0,"e":"Il s&#39;oxyde."},{"n":"oxydoreduction-piles","q":"Augmenter [Ag⁺] fait :","o":["monter E(Ag⁺/Ag)","baisser E(Ag⁺/Ag)","rien"],"a":0,"e":"Log croissant."}]},{"id":"cinetique","t":"Notions de cinétique chimique","seance":"Chapitre II · Vitesse, ordre, énergie d'activation","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir que $\\ln$ et $\\exp$ sont réciproques : $\\ln(e^{-kt}) = -kt$.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Résous $e^{-x} = 0{,}5$ (à 0,01 près).<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.69<\/b><\/p><p>$x = \\ln 2 \\approx 0{,}69$.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « quelle fonction est une droite ? ».<\/strong> Pour trouver l&#39;ordre, teste : [A] (ordre 0), ln[A] (ordre 1) ou 1/[A] (ordre 2) en fonction du temps. Celle qui donne un k constant est la bonne.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Croire que t½ dépend toujours de [A]₀. Pour l&#39;ordre 1, t½ = ln2/k ne dépend pas de la concentration initiale.<\/p>\n<\/aside><p>À la fin, tu sais trouver l&#39;ordre, k, t½ et l&#39;énergie d&#39;activation.<\/p>\n<h2>Idée 1 · Les lois de vitesse intégrées<\/h2>\n<figure class=\"grille\"><figcaption>Ordres 0, 1, 2<\/figcaption><table><tr><th>Ordre,<\/th><th>Loi<\/th><th>intégrée,<\/th><th>Droite,<\/th><th>t½,<\/th><th>Unité<\/th><th>de<\/th><th>k<\/th><\/tr><tr><td class=\"h1\">0,<\/td><td>[A]<\/td><td>=<\/td><td>[A]₀<\/td><td>−<\/td><td>kt,<\/td><td>[A]<\/td><td>=<\/td><td>f(t),<\/td><td>[A]₀/(2k),<\/td><td>mol·L⁻¹·s⁻¹<\/td><\/tr><tr><td class=\"h1\">1,<\/td><td>ln([A]₀/[A])<\/td><td>=<\/td><td>kt,<\/td><td>ln[A]<\/td><td>=<\/td><td>f(t),<\/td><td>ln2/k,<\/td><td>s⁻¹<\/td><\/tr><tr><td class=\"h1\">2,<\/td><td>1/[A]<\/td><td>−<\/td><td>1/[A]₀<\/td><td>=<\/td><td>kt,<\/td><td>1/[A]<\/td><td>=<\/td><td>f(t),<\/td><td>1/(k[A]₀),<\/td><td>L·mol⁻¹·s⁻¹<\/td><\/tr><\/table><\/figure><h2>Idée 2 · La loi d&#39;Arrhenius<\/h2>\n<p>$$k = A\\,e^{-E_a/RT} \\qquad \\ln\\frac{k_2}{k_1} = \\frac{E_a}{R}\\left(\\frac{1}{T_1} - \\frac{1}{T_2}\\right)$$<\/p>\n<svg viewBox=\"0 0 320 120\" role=\"img\" aria-label=\"Profil énergétique : barrière d'activation Ea entre réactifs et produits\" style=\"max-width:360px;width:100%\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M20 80h60Q140-10 200 95h100\" stroke=\"#D9824F\"/><path d=\"M140 30v50\" stroke-dasharray=\"3 4\"/><\/g>\n<g fill=\"currentColor\" font-size=\"10\"><text x=\"146\" y=\"60\">Ea<\/text><text x=\"20\" y=\"95\">réactifs<\/text><text x=\"250\" y=\"112\">produits<\/text><\/g>\n<\/svg><h2>Idée 3 · Méthode pour un tableau de mesures<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Révision, exercice 14<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · 1. Calcule k avec la loi d&#39;ordre 1 pour chaque point : $k = \\frac{1}{t}\\ln\\frac{[A]_0}{[A]}$.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · 2. On trouve 8,50·10⁻³ ; 8,51·10⁻³ ; 8,56·10⁻³ ; 8,51·10⁻³ ; 8,49·10⁻³ min⁻¹ : constant.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · 3. Ordre 1 confirmé ; k ≈ 8,5·10⁻³ min⁻¹.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · 4. t½ = ln2 / k ≈ 81,5 min.<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Application<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Avec la loi d&#39;ordre 2 sur le même tableau, k est-il constant ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Non : (1/[A] − 10)/t donne 0,097 puis 0,111, 0,135… en croissant. L&#39;ordre 2 est exclu.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>t½ pour k = 8,5·10⁻³ min⁻¹ (ordre 1) ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 81.5<\/b><\/p><p>ln2 / 8,5·10⁻³ ≈ <strong>81,5 min<\/strong>.<\/p>\n<\/div><\/div><\/section><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Exercice 14 c : le rapport des constantes entre 25 °C et 50 °C n&#39;apparaît pas dans le fichier. Méthode : $E_a = \\frac{R\\ln(k_2/k_1)}{1/T_1 - 1/T_2}$ avec T₁ = 298 K et T₂ = 323 K. Par exemple, un rapport de 5 donnerait Ea ≈ 51,5 kJ/mol.<\/p>\n<\/aside><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Pour l&#39;ordre 1, la droite est :<\/div><button class=\"opt\" data-o=\"0\">ln[A] = f(t)<\/button><button class=\"opt\" data-o=\"1\">[A] = f(t)<\/button><button class=\"opt\" data-o=\"2\">1/[A] = f(t)<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">t½ d&#39;ordre 1 :<\/div><button class=\"opt\" data-o=\"0\">ln2/k<\/button><button class=\"opt\" data-o=\"1\">1/(k[A]₀)<\/button><button class=\"opt\" data-o=\"2\">[A]₀/(2k)<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Unité de k pour l&#39;ordre 2 :<\/div><button class=\"opt\" data-o=\"0\">L·mol⁻¹·s⁻¹<\/button><button class=\"opt\" data-o=\"1\">s⁻¹<\/button><button class=\"opt\" data-o=\"2\">mol·L⁻¹·s⁻¹<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Quand T augmente, k :<\/div><button class=\"opt\" data-o=\"0\">augmente<\/button><button class=\"opt\" data-o=\"1\">diminue<\/button><button class=\"opt\" data-o=\"2\">ne change pas<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Ea est :<\/div><button class=\"opt\" data-o=\"0\">la barrière d&#39;énergie à franchir<\/button><button class=\"opt\" data-o=\"1\">l&#39;énergie libérée<\/button><button class=\"opt\" data-o=\"2\">la température de réaction<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Un catalyseur :<\/div><button class=\"opt\" data-o=\"0\">abaisse Ea<\/button><button class=\"opt\" data-o=\"1\">augmente Ea<\/button><button class=\"opt\" data-o=\"2\">change l&#39;état final<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Après 3 demi-vies (ordre 1), il reste :<\/div><button class=\"opt\" data-o=\"0\">12,5 %<\/button><button class=\"opt\" data-o=\"1\">33 %<\/button><button class=\"opt\" data-o=\"2\">0 %<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">L&#39;ordre de l&#39;exercice 14 est :<\/div><button class=\"opt\" data-o=\"0\">1<\/button><button class=\"opt\" data-o=\"1\">0<\/button><button class=\"opt\" data-o=\"2\">2<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Pour l&#39;ordre 0, [A] décroît :<\/div><button class=\"opt\" data-o=\"0\">linéairement<\/button><button class=\"opt\" data-o=\"1\">exponentiellement<\/button><button class=\"opt\" data-o=\"2\">en 1/t<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">R vaut :<\/div><button class=\"opt\" data-o=\"0\">8,3 J·mol⁻¹·K⁻¹<\/button><button class=\"opt\" data-o=\"1\">0,06 V<\/button><button class=\"opt\" data-o=\"2\">6,02·10²³<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"cinetique","rep":["0.69"],"tol":null},{"n":"cinetique","rep":null,"tol":null},{"n":"cinetique","rep":["81.5"],"tol":null}],"qcm":[{"n":"cinetique","q":"Pour l&#39;ordre 1, la droite est :","o":["ln[A] = f(t)","[A] = f(t)","1/[A] = f(t)"],"a":0,"e":"P \/p>\n<\/div><\/div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Ex. 2 : Ks de Cu(OH)₂, solution saturée à pH 7,4.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>[OH⁻] = 10⁻⁶·⁶ ; [Cu²⁺] = [OH⁻]/2 ; Ks ≈ <strong>7,9·10⁻²¹<\/strong>.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Ex. 3 : pile Cd | Cd²⁺ (0,20 M) || Ag⁺ (0,20 M) | Ag. Potentiels et fem.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1.18<\/b><\/p><p>E(Cd) = −0,40 + 0,03 log 0,2 ≈ <strong>−0,42 V<\/strong> ; E(Ag) = 0,80 + 0,06 log 0,2 ≈ <strong>0,76 V<\/strong> ; fem ≈ <strong>1,18 V<\/strong>. Cathode : argent. Réaction : $2Ag^+ + Cd \\to 2Ag + Cd^{2+}$.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Ex. 3 : constante d&#39;équilibre.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 40<\/b><\/p><p>log K = 2 × (0,80 + 0,40) / 0,06 = 40 : <strong>K = 10⁴⁰<\/strong>.<\/p>\n<\/div><\/div><\/section><h2>Exercices de révision (avril 2021)<\/h2>\n<section class=\"exo\"><h3>Révision<\/h3><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Ex. 1 : acide acétique 0,1 M, Ka = 2·10⁻⁵. pH et α.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><d ntration :<\/div><button class=\"opt\" data-o=\"0\">fortement<\/button><button class=\"opt\" data-o=\"1\">presque pas<\/button><button class=\"opt\" data-o=\"2\">linéairement<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Dans la pile Cd/Ag, la cathode est :<\/div><button class=\"opt\" data-o=\"0\">l&#39;argent<\/button><button class=\"opt\" data-o=\"1\">le cadmium<\/button><button class=\"opt\" data-o=\"2\">le pont salin<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">K = 10⁴⁰ :<\/div><button class=\"opt\" data-o=\"0\">réaction totale<\/button><button class=\"opt\" data-o=\"1\">réaction nulle<\/button><button class=\"opt\" data-o=\"2\">équilibre partagé<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Diluer 100 fois un acide fort fait monter le pH de :<\/div><button class=\"opt\" data-o=\"0\">2<\/button><button class=\"opt\" data-o=\"1\">100<\/button><button class=\"opt\" data-o=\"2\">1<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Dans le pont salin, K⁺ migre vers :<\/div><button class=\"opt\" data-o=\"0\">la cathode<\/button><button class=\"opt\" data-o=\"1\">l&#39;anode<\/button><button class=\"opt\" data-o=\"2\">nulle part<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Bilan de ClO₄⁻ + I⁻ : coefficient de I⁻ :<\/div><button class=\"opt\" data-o=\"0\">4<\/button><button class=\"opt\" data-o=\"1\">8<\/button><button class=\"opt\" data-o=\"2\">2<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">La concentration de Cl⁻ dans HCl égale :<\/div><button class=\"opt\" data-o=\"0\">celle de H₃O⁺<\/button><button class=\"opt\" data-o=\"1\">le double<\/button><button class=\"opt\" data-o=\"2\">zéro<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class= const lireJ = (k) => { try { return JSON.parse(localStorage.getItem(k) || "{}") || {}; } catch (e) { return {}; } };
const ecrireJ = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const etat = () => { const S = lireJ(MODULE.cleEtat); S.attempts = S.attempts || {}; S.cards = S.cards || {}; return S; };
function noter(n, ok) { const S = etat(); (S.attempts[n] = S.attempts[n] || []).push(ok ? 1 : 0); if (S.attempts[n].length > 30) S.attempts[n].shift(); ecrireJ(MODULE.cleEtat, S); }
// Maîtrisé = au moins 3 essais et 80 % de réussite sur les 5 derniers (règle commune à la plateforme).
function statut(n) {
  if (MODULE.format === "score10") { const v = lireJ(MODULE.cle)[n]; if (v !== undefined) return [v >= 8 ? "ok" : "fragile", v / 10]; }

.mzt-f textarea{width:100%;min-height:54px;max-height:140px;resize:vertical;font:16px system-ui,sans-serif;padding:7px;border:1px solid var(--l);border-radius:8px;background:var(--s);color:var(--i)}
.mzt-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mzt-row label{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--m);cursor:pointer}
.mzt-note{font-size:11.5px;color:var(--m);margin:0}
.mzt-pan details{padding:0 10px}.mzt-pan summary{cursor:pointer;font-size:12px;color:var(--a);font-weight:600;padding:4px 0}
.mzt-prev{max-height:140px;overflow:auto;font-size:12px;white-space:pre-wrap;background:var(--s);border-radius:6px;padding:6px;color:var(--m)}
.mzt-list{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.mzt-item{border:1px solid var(--l);border-radius:8px;padding:8px}
.mzt-item .mzt-meta{font-size:11px;color:var(--m)}
.mzt-pan input[type=search]{width:100%;font:16px system-ui,sans-serif;padding:7px;border:1px solid var(--l);border-radius:8px;background:var(--s);color:var(--i)}
.mzt-pan input[type=checkbox]{width:auto}
.mzt-pan[hidden],.mzt-btn[hidden],.mzt-pan [hidden]{display:none!important}
.mzt-h button{flex:0 0 auto;white-space:nowrap}
.mzt-pan #mztX{background:var(--bad);border-color:var(--bad);color:#fff}
.mzt-m.a{white-space:normal}.mzt-m.a p{margin:0 0 6px}.mzt-m.a p:last-child{margin-bottom:0}
.mzt-m.a ul,.mzt-m.a ol{margin:4px 0 6px;padding-left:20px}.mzt-m.a li{margin:2px 0}
.mzt-m code{font:12.5px ui-monospace,Menlo,Consolas,monospace;background:color-mix(in srgb,var(--i) 10%,transparent);padding:1px 4px;border-radius:4px;overflow-wrap:anywhere}
.mzt-m pre{margin:6px 0;padding:8px;overflow-x:auto;background:color-mix(in srgb,var(--i) 10%,transparent);border-radius:6px;font:12.5px ui-monospace,Menlo,Consolas,monospace;white-space:pre}
.mzt-m pre code{background:none;padding:0}
.mzt-tex{font:12.5px ui-monospace,Menlo,Consolas,monospace;color:var(--m)}.mzt-tex[data-ok]{font:inherit;color:inherit}
.mzt-tex.d{display:block;margin:6px 0;text-align:center}
.mzt-m mjx-container{max-width:100%;overflow-x:auto;overflow-y:hidden;vertical-align:middle}.mzt-m mjx-container[display]{margin:0!important}
.mzt-m mjx-container svg{max-width:none}
.mzt-tab{overflow-x:auto;margin:6px 0}.mzt-tab table{border-collapse:collapse;font-size:13px;min-width:60%}
.mzt-tab th,.mzt-tab td{border:1px solid var(--l);padding:4px 8px;text-align:left;vertical-align:top}.mzt-tab th{background:color-mix(in srgb,var(--a) 12%,transparent);font-weight:600}`;

  $('#mztTabM').onclick = () => view($('#mztMem').hidden ? 'mem' : 'chat');
  $('#mztQ').oninput = renderList;
  $('#mztList').onclick = (e) => { const id = e.target.dataset && e.target.dataset.cont; if (!id) return; cur = ST.threads.find((t) => t.id === id); view('chat'); $('#mztCtx').textContent = '· ' + cur.sec; renderLog(); };
  $('#mztMemL').onclick = (e) => { const i = e.target.dataset && e.target.dataset.memdel; if (i == null) return; ST.memos.splice(+i, 1); saveMemos(); renderMem(); };
  $('#mztChips').onclick = (e) => { const b = e.target.closest('[data-chip]'); if (!b) return; const t = $('#mztIn'); t.value = b.dataset.chip + (t.value ? ' : ' + t.value : ''); t.focus(); };
  $('#mztNew').onclick = () => { cur = null; renderLog(); };
  $('#mztStop').onclick = () => { if (ctl) ctl.abort(); };
  $('#mztImg').onchange = (e) => { img = e.target.files[0] || null; $('#mztImgN').textContent = img ? 'Photo : ' + img.name : ''; };
  $('#mztF').onsubmit = (e) => { e.preventDefault(); const v = $('#mztIn').value; $('#mztIn').value = ''; ask(v); };
  $('#mztIn').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#mztF').requestSubmit(); } });

  // ---------- capacités (facultatives) ----------
  const W = window.claude;
  if (W && W.use) {
    W.use('sample').then((s) => { sample = s; ready = true; note();
      if (s && s.limits) s.limits().then((l) => { if (l && l.images) { imgOK = true; $('#mztImgL').hidden = false; if (l.images.mediaTypes) $('#mztImg').accept = l.images.mediaTypes.join(','); } }).catch(() => {});
    }).catch(() => { ready = true; note(); });
    Promise.all([W.use('db'), W.use('user')]).then(async ([d, u]) => {
      if (!d || !u) return; const id = await u.id(); if (!id) return; db = d; base = 'data/users/' + id + '/mzt_' + C.id;
      try {
        const m = await db.doc(base).get(); if (m.exists) { const v = m.data() || {}; if (Array.isArray(v.memos)) ST.memos = JSON.parse(JSON.stringify(v.memos)); }
        const q = await db.collection(base + '/threads').get(); const remote = q.docs.map((x) => Object.assign({ id: x.id }, JSON.parse(JSON.stringify(x.data() || {}))));
        const map = {}; [...ST.threads, ...remote].forEach((t) => { if (!map[t.id] || (t.msgs || []).length > (map[t.id].msgs || []).length) map[t.id] = t; });
        ST.threads = Object.values(map).sort((a, b) => parseInt(a.id.slice(1), 36) - parseInt(b.id.slice(1), 36)); saveLocal();
      } catch (e) {}
    }).catch(() => {});
  } else { ready = true; note(); }

  window.MZT = { open: openPanel, close: closePanel };
})();

</script>

if(window.top===window&&location.protocol==="file:"){a.hidden=true;return}
a.href=p.indexOf("/decouvrir")===0||location.pathname.indexOf("/decouvrir")===0?"/decouvrir":"/app/modules";})();</script>
