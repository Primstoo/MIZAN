\/strong> : un cycle monotherme ne peut que recevoir du travail (W ≥ 0) et céder de la chaleur (Q ≤ 0). Pas de moteur monotherme.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Entropie<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>2 mol de gaz parfait se détendent de façon isotherme de 10 L à 30 L. Calcule ΔS.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 18.3<\/b><\/p><p>$\\Delta S = nR\\ln(V_f/V_i) = 2\\times8{,}314\\times\\ln3 \\approx 18{,}3$ J/K.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Même calcul si la détente est brusque (dans le vide) entre les mêmes états ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Même valeur, 18,3 J/K : S est une fonction d&#39;état. Seule l&#39;entropie <strong>créée<\/strong> change (ici Q = 0, tout est créé).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Pourquoi un moteur monotherme est-il impossible ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Bilan : W + Q = 0 et $\\Delta S_{source} = -Q/T_0 \\ge 0$, donc Q ≤ 0 et W ≥ 0 : le système reçoit du travail, il ne peut pas en fournir.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 10 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">L&#39;unité de l&#39;entropie est :<\/div><button class=\"opt\" data-o=\"0\">J<\/button><button class=\"opt\" data-o=\"1\">J/K<\/button><button class=\"opt\" data-o=\"2\">K/J<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Pour une adiabatique réversible :<\/div><button class=\"opt\" data-o=\"0\">$\\Delta S = 0$<\/button><button class=\"opt\" data-o=\"1\">$\\Delta S &gt; 0$<\/button><button class=\"opt\" data-o=\"2\">$\\Delta S &lt; 0$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Pour un système isolé siège de transformations irréversibles :<\/div><button class=\"opt\" data-o=\"0\">$\\Delta S = 0$<\/button><button class=\"opt\" data-o=\"1\">$\\Delta S &gt; 0$<\/button><button class=\"opt\" data-o=\"2\">$\\Delta S &lt; 0$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Pour calculer ΔS d&#39;une transformation irréversible, on :<\/div><button class=\"opt\" data-o=\"0\">intègre δQ/T le long du chemin réel<\/button><button class=\"opt\" data-o=\"1\">imagine un chemin réversible entre les mêmes états<\/button><button class=\"opt\" data-o=\"2\">prend ΔS = 0<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">ΔS d&#39;1 mol de gaz parfait dont le volume double à T constante :<\/div><button class=\"opt\" data-o=\"0\">0<\/button><button class=\"opt\" data-o=\"1\">$R\\ln 2$<\/button><button class=\"opt\" data-o=\"2\">$-R\\ln 2$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">$f(x) = x - 1 - \\ln x$ a pour minimum :<\/div><button class=\"opt\" data-o=\"0\">0 en x = 1<\/button><button class=\"opt\" data-o=\"1\">−1 en x = 0<\/button><button class=\"opt\" data-o=\"2\">1 en x = 1<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">L&#39;énoncé de Clausius dit :<\/div><button class=\"opt\" data-o=\"0\">l&#39;entropie d&#39;un cycle est nulle<\/button><button class=\"opt\" data-o=\"1\">la chaleur ne passe pas spontanément d&#39;un corps froid à un corps chaud<\/button><button class=\"opt\" data-o=\"2\">un moteur peut avoir un rendement de 1<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Selon Kelvin, un cycle monotherme :<\/div><button class=\"opt\" data-o=\"0\">peut fournir du travail<\/button><button class=\"opt\" data-o=\"1\">ne peut que recevoir du travail et céder de la chaleur<\/button><button class=\"opt\" data-o=\"2\">n&#39;échange rien<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">L&#39;inégalité de Clausius pour un cycle s&#39;écrit :<\/div><button class=\"opt\" data-o=\"0\">$\\sum Q_i/T_i \\le 0$<\/button><button class=\"opt\" data-o=\"1\">$\\sum Q_i/T_i \\ge 0$<\/button><button class=\"opt\" data-o=\"2\">$\\sum Q_i = 0$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">L&#39;entropie augmente quand :<\/div><button class=\"opt\" data-o=\"0\">un gaz se liquéfie<\/button><button class=\"opt\" data-o=\"1\">un solide fond<\/button><button class=\"opt\" data-o=\"2\">un liquide gèle<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"entropie-second-principe","rep":["0.693"],"tol":0.01},{"n":"entropie-second-principe","rep":["18.3"],"tol":0.1},{"n":"entropie-second-principe","rep":null,"tol":null},{"n":"entropie-second-principe","rep":null,"tol":null}],"qcm":[{"n":"entropie-second-principe","q":"L&#39;unité de l&#39;entropie est :","o":["J","J/K","K/J"],"a":1,"e":"$dS = \\delta Q/T$."},{"n":"entropie-second-principe","q":"Pour une adiabatique réversible :","o":["$\\Delta S = 0$","$\\Delta S &gt; 0$","$\\Delta S &lt; 0$"],"a":0,"e":"$\\delta Q_{rev} = 0$."},{"n":"entropie-second-principe","q":"Pour un système isolé siège de transformations irréversibles :","o":["$\\Delta S = 0$","$\\Delta S &gt; 0$","$\\Delta S &lt; 0$"],"a":1,"e":"Création d&#39;entropie."},{"n":"entropie-second-principe","q":"Pour calculer ΔS d&#39;une transformation irréversible, on :","o":["intègre δQ/T le long du chemin réel","imagine un chemin réversible entre les mêmes états","prend ΔS = 0"],"a":1,"e":"S est une fonction d&#39;état."},{"n":"entropie-second-principe","q":"ΔS d&#39;1 mol de gaz parfait dont le volume double à T constante :","o":["0","$R\\ln 2$","$-R\\ln 2$"],"a":1,"e":"$nR\\ln(V_f/V_i)$."},{"n":"entropie-second-principe","q":"$f(x) = x - 1 - \\ln x$ a pour minimum :","o":["0 en x = 1","−1 en x = 0","1 en x = 1"],"a":0,"e":"D&#39;où $\\Delta S_{univ} \\ge 0$."},{"n":"entropie-second-principe","q":"L&#39;énoncé de Clausius dit :","o":["l&#39;entropie d&#39;un cycle est nulle","la chaleur ne passe pas spontanément d&#39;un corps froid à un corps chaud","un moteur peut avoir un rendement de 1"],"a":1,"e":"Énoncé historique du second principe."},{"n":"entropie-second-principe","q":"Selon Kelvin, un cycle monotherme :","o":["peut fournir du travail","ne peut que recevoir du travail et céder de la chaleur","n&#39;échange rien"],"a":1,"e":"W ≥ 0 et Q ≤ 0."},{"n":"entropie-second-principe","q":"L&#39;inégalité de Clausius pour un cycle s&#39;écrit :","o":["$\\sum Q_i/T_i \\le 0$","$\\sum Q_i/T_i \\ge 0$","$\\sum Q_i = 0$"],"a":0,"e":"Égalité pour un cycle réversible."},{"n":"entropie-second-principe","q":"L&#39;entropie augmente quand :","o":["un gaz se liquéfie","un solide fond","un liquide gèle"],"a":1,"e":"Le désordre augmente."}]},{"id":"machines-thermiques","t":"Les machines thermiques, cycle de Beau de Rochas et cycle de Carnot","seance":"Chapitre 5 · Notions sur les machines thermiques","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir écrire le premier principe sur un cycle ($W + Q = 0$) et la loi de Laplace $TV^{\\gamma-1} = $ cte.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Une machine décrit un cycle : elle reçoit $Q_c = 1000$ J et cède $Q_f = -700$ J. Que vaut W ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : -300<\/b><\/p><p>$W + Q_c + Q_f = 0$, donc $W = -300$ J : la machine fournit 300 J.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Pour toute machine : <strong>rendement (ou efficacité) = ce qui est utile / ce qui coûte<\/strong>, puis deux bilans : énergie ($W + Q_c + Q_f = 0$) et entropie ($Q_c/T_c + Q_f/T_f \\le 0$).<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Oublier les signes. Avec la convention du prof, pour un moteur W &lt; 0, donc $\\rho = -W/Q_c$ (et non $W/Q_c$).<\/p>\n<\/aside><p>À la fin, tu sais calculer le rendement de Carnot, l&#39;efficacité d&#39;un frigo ou d&#39;une pompe à chaleur, et le rendement du cycle de Beau de Rochas.<\/p>\n<h2>Idée 1 · Les trois machines dithermes<\/h2>\n<figure class=\"grille\"><figcaption>Signes et performance<\/figcaption><table><tr><th><\/th><th>Machine<\/th><th>W<\/th><th>Q_c<\/th><th>Q_f<\/th><th>Performance<\/th><th>Réversible (Carnot)<\/th><\/tr><tr><th>Moteur<\/th><td>&lt; 0<\/td><td>&gt; 0<\/td><td>&lt; 0<\/td><td>$\\rho = -W/Q_c$<\/td><td class=\"h1\">$1 - T_f/T_c$<\/td><\/tr><tr><th>Réfrigérateur<\/th><td>&gt; 0<\/td><td>&lt; 0<\/td><td>&gt; 0<\/td><td>$e = Q_f/W$<\/td><td class=\"h1\">$T_f/(T_c - T_f)$<\/td><\/tr><tr><th>Pompe à chaleur<\/th><td>&gt; 0<\/td><td>&lt; 0<\/td><td>&gt; 0<\/td><td>$e = -Q_c/W$<\/td><td class=\"h1\">$T_c/(T_c - T_f)$<\/td><\/tr><\/table><\/figure><ul>\n<li>Bilan énergétique : $W = -(Q_c + Q_f)$.<\/li>\n<li>Bilan entropique : $\\frac{Q_c}{T_c} + \\frac{Q_f}{T_f} \\le 0$ (égalité si réversible).<\/li>\n<li>Monotherme : le second principe exclut les moteurs, mais autorise les récepteurs.<\/li>\n<\/ul>\n<p>Exemple : sources à 600 K et 300 K : $\\rho_{Carnot} = 1 - 300/600 = 50$ %. Frigo entre 5 °C (278 K) et 25 °C (298 K) : $e_{rev} = 278/20 = 13{,}9$.<\/p>\n<h2>Idée 2 · Le cycle de Carnot<\/h2>\n<svg viewBox=\"0 0 400 220\" style=\"width:100%;max-width:460px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Cycle de Carnot : deux isothermes Tc et Tf reliées par deux adiabatiques, points 1 2 3 4\">\n<line x1=\"40\" y1=\"200\" x2=\"380\" y2=\"200\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"40\" y1=\"200\" x2=\"40\" y2=\"10\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<path d=\"M90 30 Q150 70 230 90\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/>\n<path d=\"M230 90 Q270 140 340 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<path d=\"M340 160 Q230 150 160 130\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-dasharray=\"6 3\"/>\n<path d=\"M160 130 Q110 80 90 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\"><text x=\"78\" y=\"26\">2<\/text><text x=\"236\" y=\"86\">3<\/text><text x=\"346\" y=\"164\">4<\/text><text x=\"146\" y=\"146\">1<\/text><text x=\"160\" y=\"50\" fill=\"#D9824F\">T_c<\/text><text x=\"240\" y=\"170\">T_f<\/text><text x=\"370\" y=\"215\">V<\/text><text x=\"22\" y=\"18\">P<\/text><\/g>\n<\/svg><p>Deux isothermes ($T_c$ et $T_f$) et deux adiabatiques réversibles : c&#39;est le cycle de rendement <strong>maximal<\/strong>.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Rendement de Carnot (gaz parfait)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Isotherme chaude 2→3<\/div><p>$Q_c = nRT_c\\ln\\frac{P_2}{P_3} &gt; 0$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · Isotherme froide 4→1<\/div><p>$Q_f = nRT_f\\ln\\frac{P_4}{P_1} &lt; 0$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · Laplace sur les adiabatiques<\/div><p>$\\frac{P_2}{P_1} = \\frac{P_3}{P_4}$, donc $\\frac{P_4}{P_1} = \\frac{P_3}{P_2}$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · Égalité de Carnot-Clausius<\/div><p>$\\frac{Q_c}{T_c} + \\frac{Q_f}{T_f} = 0$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · Rendement<\/div><p>$\\rho = 1 + \\frac{Q_f}{Q_c} = 1 - \\frac{T_f}{T_c}$.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Aucun moteur réel fonctionnant entre les deux mêmes sources ne dépasse le rendement de Carnot.<\/p>\n<\/aside><h2>Idée 3 · Le moteur à explosion à 4 temps (Beau de Rochas)<\/h2>\n<figure class=\"flux\"><figcaption>Les 4 temps<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">Admission A&#39;→A<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Compression AB (adiabatique)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Explosion BC (isochore) + détente CD (adiabatique)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Échappement DA puis AA&#39;<\/div><\/div><\/figure><ul>\n<li>Chaleur reçue (explosion, isochore) : $Q_1 = mc_v(T_C - T_B) &gt; 0$.<\/li>\n<li>Chaleur cédée (DA, isochore) : $Q_2 = mc_v(T_A - T_D) &lt; 0$.<\/li>\n<li>$\\rho = \\frac{Q_1 + Q_2}{Q_1} = 1 - \\frac{T_D - T_A}{T_C - T_B}$.<\/li>\n<li>Laplace sur AB et CD avec $a = V_2/V_1$ : $\\frac{T_B}{T_A} = \\frac{T_C}{T_D} = a^{\\gamma-1}$, donc<\/li>\n<\/ul>\n<p>$$\\rho = 1 - a^{1-\\gamma}$$<\/p>\n<aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>Pour a ≈ 9 et γ = 1,4 : ρ ≈ 58,5 % en théorie, contre ≈ 35 % pour un moteur réel.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Machines<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Un moteur de Carnot fonctionne entre 500 K et 300 K et reçoit $Q_c = 2000$ J par cycle. Calcule W.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : -800<\/b><\/p><p>$\\rho = 1 - 300/500 = 0{,}4$, donc $-W = 0{,}4\\times2000 = 800$ J, soit $W = -800$ J.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Efficacité maximale d&#39;une pompe à chaleur entre 7 °C et 20 °C ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 22.5<\/b><\/p><p>$e = T_c/(T_c - T_f) = 293{,}15/13 \\approx 22{,}5$.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Rendement théorique de Beau de Rochas pour a = 8, γ = 1,4 ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.565<\/b><\/p><p>$\\rho = 1 - 8^{-0{,}4} \\approx 0{,}565$ (56,5 %).<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Pour un moteur thermique (convention du prof) :<\/div><button class=\"opt\" data-o=\"0\">W &lt; 0, $Q_c$ &gt; 0, $Q_f$ &lt; 0<\/button><button class=\"opt\" data-o=\"1\">W &gt; 0, $Q_c$ &lt; 0, $Q_f$ &gt; 0<\/button><button class=\"opt\" data-o=\"2\">W &lt; 0, $Q_c$ &lt; 0, $Q_f$ &gt; 0<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Le rendement de Carnot entre 600 K et 300 K vaut :<\/div><button class=\"opt\" data-o=\"0\">25 %<\/button><button class=\"opt\" data-o=\"1\">50 %<\/button><button class=\"opt\" data-o=\"2\">100 %<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">L&#39;efficacité d&#39;un réfrigérateur est définie par :<\/div><button class=\"opt\" data-o=\"0\">$Q_f/W$<\/button><button class=\"opt\" data-o=\"1\">$-Q_c/W$<\/button><button class=\"opt\" data-o=\"2\">$-W/Q_c$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">L&#39;efficacité d&#39;une pompe à chaleur réversible vaut :<\/div><button class=\"opt\" data-o=\"0\">$T_f/(T_c - T_f)$<\/button><button class=\"opt\" data-o=\"1\">$T_c/(T_c - T_f)$<\/button><button class=\"opt\" data-o=\"2\">$1 - T_f/T_c$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Le cycle de Carnot est formé de :<\/div><button class=\"opt\" data-o=\"0\">deux isobares et deux adiabatiques<\/button><button class=\"opt\" data-o=\"1\">deux isothermes et deux adiabatiques<\/button><button class=\"opt\" data-o=\"2\">deux isochores et deux adiabatiques<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Le rendement de Beau de Rochas dépend de :<\/div><button class=\"opt\" data-o=\"0\">$T_c$ et $T_f$ seulement<\/button><button class=\"opt\" data-o=\"1\">du rapport volumétrique a et de γ<\/button><button class=\"opt\" data-o=\"2\">de la masse de gaz<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Pour a = 9, γ = 1,4, le rendement théorique est environ :<\/div><button class=\"opt\" data-o=\"0\">35 %<\/button><button class=\"opt\" data-o=\"1\">58,5 %<\/button><button class=\"opt\" data-o=\"2\">90 %<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Pendant l&#39;explosion (BC) du moteur à essence, la transformation est :<\/div><button class=\"opt\" data-o=\"0\">isobare<\/button><button class=\"opt\" data-o=\"1\">isochore<\/button><button class=\"opt\" data-o=\"2\">isotherme<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Un moteur monotherme est :<\/div><button class=\"opt\" data-o=\"0\">possible si réversible<\/button><button class=\"opt\" data-o=\"1\">impossible (second principe)<\/button><button class=\"opt\" data-o=\"2\">possible avec un gaz parfait<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Bilan entropique d&#39;une machine ditherme réversible :<\/div><button class=\"opt\" data-o=\"0\">$Q_c/T_c + Q_f/T_f = 0$<\/button><button class=\"opt\" data-o=\"1\">$Q_c + Q_f = 0$<\/button><button class=\"opt\" data-o=\"2\">$Q_c/T_c = Q_f/T_f$<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"machines-thermiques","rep":["-300"],"tol":null},{"n":"machines-thermiques","rep":["-800"],"tol":null},{"n":"machines-thermiques","rep":["22.5"],"tol":0.1},{"n":"machines-thermiques","rep":["0.565"],"tol":0.002}],"qcm":[{"n":"machines-thermiques","q":"Pour un moteur thermique (convention du prof) :","o":["W &lt; 0, $Q_c$ &gt; 0, $Q_f$ &lt; 0","W &gt; 0, $Q_c$ &lt; 0, $Q_f$ &gt; 0","W &lt; 0, $Q_c$ &lt; 0, $Q_f$ &gt; 0"],"a":0,"e":"Il reçoit de la chaleur de la source chaude et fournit du travail."},{"n":"machines-thermiques","q":"Le rendement de Carnot entre 600 K et 300 K vaut :","o":["25 %","50 %","100 %"],"a":1,"e":"$1 - 300/600$."},{"n":"machines-thermiques","q":"L&#39;efficacité d&#39;un réfrigérateur est définie par :","o":["$Q_f/W$","$-Q_c/W$","$-W/Q_c$"],"a":0,"e":"L&#39;utile est la chaleur retirée à la source froide."},{"n":"machines-thermiques","q":"L&#39;efficacité d&#39;une pompe à chaleur réversible vaut :","o":["$T_f/(T_c - T_f)$","$T_c/(T_c - T_f)$","$1 - T_f/T_c$"],"a":1,"e":"L&#39;utile est la chaleur fournie au local."},{"n":"machines-thermiques","q":"Le cycle de Carnot est formé de :","o":["deux isobares et deux adiabatiques","deux isothermes et deux adiabatiques","deux isochores et deux adiabatiques"],"a":1,"e":"Les isochores, c&#39;est Beau de Rochas."},{"n":"machines-thermiques","q":"Le rendement de Beau de Rochas dépend de :","o":["$T_c$ et $T_f$ seulement","du rapport volumétrique a et de γ","de la masse de gaz"],"a":1,"e":"$\\rho = 1 - a^{1-\\gamma}$."},{"n":"machines-thermiques","q":"Pour a = 9, γ = 1,4, le rendement théorique est environ :","o":["35 %","58,5 %","90 %"],"a":1,"e":"35 % est la valeur réelle."},{"n":"machines-thermiques","q":"Pendant l&#39;explosion (BC) du moteur à essence, la transformation est :","o":["isobare","isochore","isotherme"],"a":1,"e":"$Q_1 = mc_v(T_C - T_B)$."},{"n":"machines-thermiques","q":"Un moteur monotherme est :","o":["possible si réversible","impossible (second principe)","possible avec un gaz parfait"],"a":1,"e":"Énoncé de Kelvin."},{"n":"machines-thermiques","q":"Bilan entropique d&#39;une machine ditherme réversible :","o":["$Q_c/T_c + Q_f/T_f = 0$","$Q_c + Q_f = 0$","$Q_c/T_c = Q_f/T_f$"],"a":0,"e":"Égalité de Clausius."}]},{"id":"td-corriges","t":"TD corrigés (séries 1 et 2)","seance":"Séries de TD 1 et 2 · 2023-2024","imp":5,"html":"<p>Les deux séries de TD du Pr Arroub, corrigées pas à pas. Les calculs numériques sont vérifiés en Python (tu peux les relancer).<\/p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>Ces corrigés sont une rédaction ToumaiLearn, pas le corrigé officiel du prof. Compare avec ta correction de TD.<\/p>\n<\/aside><h2>Avant de commencer<\/h2>\n<p>Revois le test de Schwarz (chapitre 1), $W = -\\int P_{ext}dV$ (chapitre 3) et la méthode du calorimètre (chapitre 4).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Dans un calorimètre adiabatique, que vaut la somme des chaleurs échangées ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0<\/b><\/p><p>Zéro : $\\sum Q_i = 0$.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Cherche d&#39;abord seul, 15 minutes par exercice. Ouvre ensuite le corrigé et compare <strong>la méthode<\/strong>, pas seulement le résultat.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>En TD 1 exercice 4, prendre $P_{ext} = P$ du gaz dans les cas « brusques ». Quand la pression extérieure saute brusquement, c&#39;est <strong>elle<\/strong> qui est constante, pas celle du gaz.<\/p>\n<\/aside><p>À la fin, tu as refait tous les types d&#39;exercices tombés en TD.<\/p>\n<h2>Idée 1 · Série 1 : formes différentielles<\/h2>\n<p><strong>Exercice 1.<\/strong> (a) $2y^2dx + 3x^2dy$ : $4y \\ne 6x$, <strong>non exacte<\/strong>. (b) $y\\,dx + x\\,dy$ : exacte, $u = xy + C$.\nII) Facteur intégrant de $(x^2 + y)dx - x\\,dy$ : $\\lambda = 1/x^2$, $f = x - y/x + C$.<\/p>\n<p><strong>Exercice 2.<\/strong> $\\delta Q = C_p(T)dT - \\frac{RT}{P}dP$ (1 mol).<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>δQ et δQ/T sont-elles exactes ?<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · δQ<\/div><p>$\\frac{\\partial C_p(T)}{\\partial P} = 0$ mais $\\frac{\\partial}{\\partial T}\\left(-\\frac{RT}{P}\\right) = -\\frac{R}{P} \\ne 0$ : <strong>non exacte<\/strong>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · δQ/T<\/div><p>$\\frac{C_p(T)}{T}dT - \\frac{R}{P}dP$ : les deux dérivées croisées valent 0 : <strong>exacte<\/strong>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · Interprétation<\/div><p>$1/T$ est un facteur intégrant ; $\\delta Q/T = dS$ avec $S = \\int\\frac{C_p}{T}dT - R\\ln P + $ cte.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p><strong>Exercice 3.<\/strong> $\\rho = m/V = 15/20 = 0{,}75$ g/cm³. Incertitudes : $\\frac{\\Delta\\rho}{\\rho} = \\frac{\\Delta m}{m} + \\frac{\\Delta V}{V} = \\frac{0{,}2}{15} + \\frac{1}{20} \\approx 0{,}0633$ (6,3 %), donc $\\Delta\\rho \\approx 0{,}0475$ g/cm³ ; $\\rho = 0{,}75 \\pm 0{,}05$ g/cm³.<\/p>\n<h2>Idée 2 · Série 1, exercice 4 : trois détentes isothermes<\/h2>\n<p>1 mol de gaz parfait, de $P_1 = 10$ atm à $P_2 = 3$ atm, T constante.<\/p>\n<figure class=\"grille\"><figcaption>Les trois cas<\/figcaption><table><tr><th><\/th><th>Cas<\/th><th>P_ext<\/th><th>Travail<\/th><\/tr><tr><th>1 réversible<\/th><td>= P du gaz<\/td><td>$W = -RT\\ln(P_1/P_2) = -1{,}204\\,RT$<\/td><\/tr><tr><th>2 brusque<\/th><td>P₂ constante<\/td><td>$W = -P_2(V_2 - V_1) = -RT(1 - P_2/P_1) = -0{,}7\\,RT$<\/td><\/tr><tr><th>3 deux étapes<\/th><td>2P₂ puis P₂<\/td><td>$W = -RT(1 - 2P_2/P_1) - RT(1 - 1/2) = -0{,}9\\,RT$<\/td><\/tr><\/table><\/figure><aside class=\"enc attention\"><div class=\"enc-t\">Attention<\/div><p>L&#39;énoncé ne donne pas T. On prend T = 300 K pour l&#39;application numérique.<\/p>\n<\/aside><pre class=\"\"><code>import math\nR, T = 8.314, 300\nP1, P2 = 10, 3\nW1 = -R*T*math.log(P1/P2)\nW2 = -R*T*(1 - P2/P1)\nW3 = -R*T*(1 - 2*P2/P1) - R*T*(1 - P2/(2*P2))\nfor nom, W in [(&quot;réversible&quot;, W1), (&quot;brusque&quot;, W2), (&quot;deux étapes&quot;, W3)]:\n    print(f&quot;{nom:12s} W = {W:.1f} J&quot;)<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>réversible   W = -3002.9 J\nbrusque      W = -1745.9 J\ndeux étapes  W = -2244.8 J<\/code><\/pre><p><strong>Conclusion<\/strong> : le travail <strong>fourni<\/strong> par le gaz ($-W$) est maximal pour la détente réversible. Plus on découpe en étapes, plus on s&#39;en rapproche.<\/p>\n<h2>Idée 3 · Série 2 : équations d&#39;état et Van der Waals<\/h2>\n<p><strong>Exercice 1.<\/strong> $\\beta = \\frac{1}{T}\\left(1 + \\frac{a}{PV^2}\\right)$, $\\chi_T = \\frac{V^2(V-b)^2}{RTV^3 - 2a(V-b)^2}$.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Retrouver l'équation d'état<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/6 · Remarque<\/div><p>$\\beta = \\frac{1}{P}\\left(\\frac{\\partial P}{\\partial T}\\right)_V$, donc $\\left(\\frac{\\partial P}{\\partial T}\\right)_V = \\frac{P + a/V^2}{T}$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/6 · Intuition<\/div><p>$P + a/V^2$ est proportionnel à T à V fixé : $P + \\frac{a}{V^2} = T\\,g(V)$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/6 · Utiliser χ_T<\/div><p>$\\left(\\frac{\\partial P}{\\partial V}\\right)_T = Tg'(V) + \\frac{2a}{V^3} = -\\frac{1}{V\\chi_T} = -\\frac{RT}{(V-b)^2} + \\frac{2a}{V^3}$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/6 · Identifier<\/div><p>$g'(V) = -\\frac{R}{(V-b)^2}$, donc $g(V) = \\frac{R}{V-b}$ (constante nulle pour retrouver le gaz parfait).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/6 · Conclure<\/div><p>$\\left(P + \\frac{a}{V^2}\\right)(V - b) = RT$ : équation de <strong>Van der Waals<\/strong>.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">6/6 · n moles<\/div><p>V → V/n (volume molaire) : $\\left(P + \\frac{n^2a}{V^2}\\right)(V - nb) = nRT$.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p><strong>Exercice 2.<\/strong> 1 mol de Van der Waals, isotherme réversible de $V_1$ à $V_2$, avec $\\ell = T\\left(\\frac{\\partial P}{\\partial T}\\right)_V = \\frac{RT}{V-b}$.<\/p>\n<ol>\n<li>$Q = \\int\\ell\\,dV = RT\\ln\\frac{V_2 - b}{V_1 - b}$.<\/li>\n<li>Adiabatique réversible : $C_V dT + \\frac{RT}{V-b}dV = 0$, donc $T(V-b)^{R/C_V} = $ cte.<\/li>\n<li>$W = -\\int P\\,dV = -RT\\ln\\frac{V_2 - b}{V_1 - b} + a\\left(\\frac{1}{V_1} - \\frac{1}{V_2}\\right)$.<\/li>\n<li>$\\Delta U = W + Q = a\\left(\\frac{1}{V_1} - \\frac{1}{V_2}\\right)$ : contrairement au gaz parfait, U varie à T constante.<\/li>\n<\/ol>\n<h2>Idée 4 · Série 2 : calorimétrie avec glace<\/h2>\n<p><strong>Exercice 3.<\/strong> Calorimètre C = 50,1 J/K, 300 g d&#39;eau à 15 °C, 50 g de glace à 0 °C.<\/p>\n<pre class=\"\"><code>C, M, ce, Lf = 50.1, 0.300, 4180, 334000\nm = 0.050\nQ1 = (C + M*ce)*15\nQ2 = m*Lf\nTf = (Q1 - Q2)/(C + M*ce + m*ce)\nprint(f&quot;Q1 = {Q1:.1f} J, Q2 = {Q2:.1f} J&quot;)\nprint(f&quot;Tf = {Tf:.3f} °C&quot;)\nprint(f&quot;glace totale = {Q1/Lf*1000:.1f} g, à ajouter = {(Q1/Lf - m)*1000:.1f} g&quot;)<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>Q1 = 19561.5 J, Q2 = 16700.0 J\nTf = 1.891 °C\nglace totale = 58.6 g, à ajouter = 8.6 g<\/code><\/pre><ul>\n<li>1-a) $Q_1 = 19\\,561{,}5$ J. 1-b) $Q_2 = 16\\,700$ J &lt; $Q_1$ : toute la glace fond, donc $T_f &gt; 0$ °C. 1-c) $T_f \\approx 1{,}891$ °C.<\/li>\n<li><ol start=\"2\">\n<li>Pour finir exactement à 0 °C avec seulement de l&#39;eau, il faut 58,6 g de glace au total, soit <strong>8,6 g de plus<\/strong>.<\/li>\n<\/ol>\n<\/li>\n<\/ul>\n<p><strong>Exercice 4.<\/strong> 200 g d&#39;eau à 50 °C, m&#39; de glace à −10 °C, c&#39; = c/2.<\/p>\n<pre class=\"\"><code>c, L = 4.18, 334\ncg = c/2\nQeau = 200*c*50\nfor mg in (100, 200):\n    besoin = mg*cg*10 + mg*L\n    if besoin &lt;= Qeau:\n        Tf = (Qeau - besoin)/((200 + mg)*c)\n        print(f&quot;m' = {mg} g : tout fond, Tf = {Tf:.2f} °C&quot;)\n    else:\n        fondu = (Qeau - mg*cg*10)/L\n        print(f&quot;m' = {mg} g : Tf = 0 °C, glace fondue = {fondu:.1f} g, reste {mg - fondu:.1f} g de glace&quot;)<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>m' = 100 g : tout fond, Tf = 5.03 °C\nm' = 200 g : Tf = 0 °C, glace fondue = 112.6 g, reste 87.4 g de glace<\/code><\/pre><figure class=\"etapes\" data-i=\"0\"><figcaption>Méthode générale (glace)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · Chaleur disponible<\/div><p>eau jusqu&#39;à 0 °C : $200\\times4{,}18\\times50 = 41\\,800$ J.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · Chaleur nécessaire<\/div><p>réchauffer la glace à 0 °C, puis la fondre.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · Comparer<\/div><p>si disponible &gt; nécessaire, tout fond et on calcule $T_f$ ; sinon $T_f = 0$ °C et on calcule la masse fondue.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Idée 5 · Série 2, exercice 5 : compression brusque<\/h2>\n<p>2 g de diazote (γ = 7/5), S = 0,01 m², $T_0 = 300$ K, $P_0 = 10^5$ Pa. On pose 100 kg sur le piston : $P_1 = P_0 + mg/S$. Transformation adiabatique <strong>irréversible<\/strong> à $P_{ext} = P_1$ constante.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Méthode<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · Bilan<\/div><p>$\\Delta U = W$ : $nC_{V,m}(T_1 - T_0) = -P_1(V_1 - V_0)$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · Remplacer V₁<\/div><p>$V_1 = nRT_1/P_1$ et $V_0 = nRT_0/P_0$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · Résoudre<\/div><p>$\\frac{7}{2}T_1 = \\frac{5}{2}T_0 + T_0\\frac{P_1}{P_0}$.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><pre class=\"\"><code>R, T0, P0 = 8.32, 300, 1e5\nn = 2/28\nV0 = n*R*T0/P0\nP1 = P0 + 100*9.81/0.01\nT1 = (2.5*T0 + T0*P1/P0)/3.5\nV1 = n*R*T1/P1\ndU = 2.5*n*R*(T1 - T0)\nprint(f&quot;V0 = {V0*1e3:.3f} L, P1 = {P1:.0f} Pa&quot;)\nprint(f&quot;T1 = {T1:.2f} K, V1 = {V1*1e3:.3f} L, dU = {dU:.1f} J&quot;)<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>V0 = 1.783 L, P1 = 198100 Pa\nT1 = 384.09 K, V1 = 1.152 L, dU = 124.9 J<\/code><\/pre><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Ici, pas de Laplace : la transformation est brusque. Laplace donnerait $T_1 \\approx 365$ K, ce qui est faux.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Refais seul<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Avec T = 300 K, calcule le travail de la détente brusque de 1 mol de 10 atm à 3 atm.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : -1746<\/b><\/p><p>$W = -RT(1 - P_2/P_1) = -8{,}314\\times300\\times0{,}7 \\approx -1746$ J.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>200 g d&#39;eau à 50 °C et 100 g de glace à −10 °C : $T_f$ ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 5.03<\/b><\/p><p>Tout fond, $T_f \\approx 5{,}03$ °C.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Variation d&#39;énergie interne du diazote dans l&#39;exercice 5 ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 124.9<\/b><\/p><p>$\\Delta U = \\frac{5}{2}nR(T_1 - T_0) \\approx 124{,}9$ J.<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">$\\delta Q = C_p(T)dT - \\frac{RT}{P}dP$ est :<\/div><button class=\"opt\" data-o=\"0\">exacte<\/button><button class=\"opt\" data-o=\"1\">non exacte, mais $\\delta Q/T$ est exacte<\/button><button class=\"opt\" data-o=\"2\">exacte, mais $\\delta Q/T$ ne l&#39;est pas<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Parmi les trois détentes du TD 1, celle qui fournit le plus de travail est :<\/div><button class=\"opt\" data-o=\"0\">la réversible<\/button><button class=\"opt\" data-o=\"1\">la brusque<\/button><button class=\"opt\" data-o=\"2\">celle en deux étapes<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">$\\rho = m/V$ avec m = 15 g, V = 20 cm³ :<\/div><button class=\"opt\" data-o=\"0\">1,33 g/cm³<\/button><button class=\"opt\" data-o=\"1\">0,75 g/cm³<\/button><button class=\"opt\" data-o=\"2\">300 g/cm³<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">L&#39;équation trouvée en série 2 ex. 1 est celle de :<\/div><button class=\"opt\" data-o=\"0\">gaz parfait<\/button><button class=\"opt\" data-o=\"1\">Van der Waals<\/button><button class=\"opt\" data-o=\"2\">Laplace<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Pour un gaz de Van der Waals en isotherme, $\\Delta U$ :<\/div><button class=\"opt\" data-o=\"0\">vaut toujours 0<\/button><button class=\"opt\" data-o=\"1\">vaut $a(1/V_1 - 1/V_2)$<\/button><button class=\"opt\" data-o=\"2\">vaut Q<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Dans l&#39;exercice 3 de la série 2, $Q_2 &lt; Q_1$ signifie :<\/div><button class=\"opt\" data-o=\"0\">toute la glace fond et $T_f &gt; 0$ °C<\/button><button class=\"opt\" data-o=\"1\">$T_f &lt; 0$ °C<\/button><button class=\"opt\" data-o=\"2\">il reste de la glace<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Avec 200 g de glace à −10 °C dans 200 g d&#39;eau à 50 °C :<\/div><button class=\"opt\" data-o=\"0\">tout fond<\/button><button class=\"opt\" data-o=\"1\">$T_f = 0$ °C, il reste environ 87 g de glace<\/button><button class=\"opt\" data-o=\"2\">toute l&#39;eau gèle<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Pour une compression adiabatique <strong>brusque<\/strong>, on utilise :<\/div><button class=\"opt\" data-o=\"0\">$PV^\\gamma = $ cte<\/button><button class=\"opt\" data-o=\"1\">$\\Delta U = -P_{ext}(V_f - V_i)$<\/button><button class=\"opt\" data-o=\"2\">$\\Delta U = 0$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">La pression après avoir posé 100 kg sur un piston de 0,01 m² (g = 9,81, $P_0 = 10^5$ Pa) :<\/div><button class=\"opt\" data-o=\"0\">$10^5$ Pa<\/button><button class=\"opt\" data-o=\"1\">$1{,}981\\times10^5$ Pa<\/button><button class=\"opt\" data-o=\"2\">$9{,}81\\times10^4$ Pa<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Le volume initial de 2 g de N₂ à 300 K et $10^5$ Pa vaut environ :<\/div><button class=\"opt\" data-o=\"0\">1,78 L<\/button><button class=\"opt\" data-o=\"1\">17,8 L<\/button><button class=\"opt\" data-o=\"2\">0,178 L<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"td-corriges","rep":["0"],"tol":null},{"n":"td-corriges","rep":["-1746"],"tol":2},{"n":"td-corriges","rep":["5.03"],"tol":0.05},{"n":"td-corriges","rep":["124.9"],"tol":0.5}],"qcm":[{"n":"td-corriges","q":"$\\delta Q = C_p(T)dT - \\frac{RT}{P}dP$ est :","o":["exacte","non exacte, mais $\\delta Q/T$ est exacte","exacte, mais $\\delta Q/T$ ne l&#39;est pas"],"a":1,"e":"Dérivées croisées : 0 et $-R/P$."},{"n":"td-corriges","q":"Parmi les trois détentes du TD 1, celle qui fournit le plus de travail est :","o":["la réversible","la brusque","celle en deux étapes"],"a":0,"e":"$|W| = 1{,}204\\,RT$ contre 0,7 et 0,9 RT."},{"n":"td-corriges","q":"$\\rho = m/V$ avec m = 15 g, V = 20 cm³ :","o":["1,33 g/cm³","0,75 g/cm³","300 g/cm³"],"a":1,"e":"15/20."},{"n":"td-corriges","q":"L&#39;équation trouvée en série 2 ex. 1 est celle de :","o":["gaz parfait","Van der Waals","Laplace"],"a":1,"e":"$(P + a/V^2)(V - b) = RT$."},{"n":"td-corriges","q":"Pour un gaz de Van der Waals en isotherme, $\\Delta U$ :","o":["vaut toujours 0","vaut $a(1/V_1 - 1/V_2)$","vaut Q"],"a":1,"e":"U dépend aussi de V."},{"n":"td-corriges","q":"Dans l&#39;exercice 3 de la série 2, $Q_2 &lt; Q_1$ signifie :","o":["toute la glace fond et $T_f &gt; 0$ °C","$T_f &lt; 0$ °C","il reste de la glace"],"a":0,"e":"L&#39;eau et le calorimètre ont plus de chaleur à céder qu&#39;il n&#39;en faut."},{"n":"td-corriges","q":"Avec 200 g de glace à −10 °C dans 200 g d&#39;eau à 50 °C :","o":["tout fond","$T_f = 0$ °C, il reste environ 87 g de glace","toute l&#39;eau gèle"],"a":1,"e":"41 800 J disponibles &lt; 70 980 J nécessaires."},{"n":"td-corriges","q":"Pour une compression adiabatique <strong>brusque<\/strong>, on utilise :","o":["$PV^\\gamma = $ cte","$\\Delta U = -P_{ext}(V_f - V_i)$","$\\Delta U = 0$"],"a":1,"e":"Laplace exige la réversibilité."},{"n":"td-corriges","q":"La pression après avoir posé 100 kg sur un piston de 0,01 m² (g = 9,81, $P_0 = 10^5$ Pa) :","o":["$10^5$ Pa","$1{,}981\\times10^5$ Pa","$9{,}81\\times10^4$ Pa"],"a":1,"e":"$P_0 + mg/S$."},{"n":"td-corriges","q":"Le volume initial de 2 g de N₂ à 300 K et $10^5$ Pa vaut environ :","o":["1,78 L","17,8 L","0,178 L"],"a":0,"e":"$nRT/P$ avec n = 2/28 mol."}]},{"id":"revision-examen-blanc","t":"Révision et examen blanc","seance":"Examen · session ordinaire 2022-2023 (1 h 30)","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Ce chapitre suppose que tu as fait les QCM des chapitres 1 à 7. L&#39;examen blanc reprend <strong>l&#39;examen de session ordinaire 2022-2023<\/strong> du Pr Arroub.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Pour un gaz parfait sur une isobare, que vaut Q ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$Q = \\Delta H = nC_{P,m}\\Delta T$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Fais l&#39;examen blanc en 1 h 30, sans le cours, puis corrige-toi. Note où tu as perdu du temps.<\/p>\n<\/aside><aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>Consigne de l&#39;examen : résultats numériques <strong>avec unités<\/strong> et <strong>trois chiffres significatifs après la virgule<\/strong>, copie propre.<\/p>\n<\/aside><p>À la fin, tu sais ce que tu maîtrises vraiment et ce qu&#39;il faut revoir.<\/p>\n<h2>Idée 1 · La fiche résumé<\/h2>\n<figure class=\"grille\"><figcaption>Les formules à savoir par cœur<\/figcaption><table><tr><th><\/th><th>Transformation (gaz parfait)<\/th><th>W<\/th><th>Q<\/th><th>ΔU<\/th><\/tr><tr><th>Isochore<\/th><td>0<\/td><td>$nC_{V,m}\\Delta T$<\/td><td class=\"h1\">$nC_{V,m}\\Delta T$<\/td><\/tr><tr><th>Isobare<\/th><td>$-P\\Delta V$<\/td><td>$nC_{P,m}\\Delta T$<\/td><td class=\"h1\">$nC_{V,m}\\Delta T$<\/td><\/tr><tr><th>Isotherme réversible<\/th><td>$nRT\\ln(P_2/P_1)$<\/td><td>$-W$<\/td><td class=\"h1\">0<\/td><\/tr><tr><th>Adiabatique réversible<\/th><td>$\\frac{P_2V_2 - P_1V_1}{\\gamma - 1}$<\/td><td>0<\/td><td class=\"h1\">$W$<\/td><\/tr><\/table><\/figure><figure class=\"flux\"><figcaption>Démarche type d'un problème<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">Identifier les transformations<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Écrire ΔU = nC_V ΔT pour chacune<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Calculer W ou Q<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Bilan sur le cycle (W + Q = 0)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Rendement ou ΔS<\/div><\/div><\/figure><h2>Idée 2 · Examen blanc, exercice 1<\/h2>\n<aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>C&#39;est <strong>exactement<\/strong> l&#39;exercice 2 du TD 1 : le prof reprend les exercices de TD à l&#39;examen.<\/p>\n<\/aside><p>$\\delta Q = C_p(T)dT - \\frac{RT}{P}dP$ : $\\delta Q$ non exacte, $\\delta Q/T$ exacte (voir chapitre TD).<\/p>\n<h2>Idée 3 · Examen blanc, exercice 2 : cycle de Brayton (Joule)<\/h2>\n<svg viewBox=\"0 0 400 220\" style=\"width:100%;max-width:460px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Cycle formé de deux isobares P1 et P2 et deux adiabatiques : A vers B adiabatique, B vers C isobare P2, C vers D adiabatique, D vers A isobare P1\">\n<line x1=\"40\" y1=\"200\" x2=\"380\" y2=\"200\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"40\" y1=\"200\" x2=\"40\" y2=\"10\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<line x1=\"110\" y1=\"50\" x2=\"200\" y2=\"50\" stroke=\"#D9824F\" stroke-width=\"3\"/>\n<path d=\"M200 50 Q240 140 340 160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<line x1=\"340\" y1=\"160\" x2=\"170\" y2=\"160\" stroke=\"currentColor\" stroke-width=\"3\"/>\n<path d=\"M170 160 Q120 120 110 50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\"><text x=\"100\" y=\"42\">B<\/text><text x=\"204\" y=\"42\">C<\/text><text x=\"346\" y=\"164\">D<\/text><text x=\"158\" y=\"178\">A<\/text><text x=\"8\" y=\"54\">P₂<\/text><text x=\"8\" y=\"164\">P₁<\/text><text x=\"370\" y=\"215\">V<\/text><\/g>\n<\/svg><p>Cycle réversible moteur, n moles de gaz parfait, AB et CD adiabatiques, BC et DA isobares, $a = P_2/P_1 = 8$, γ = 1,4.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Corrigé<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · 1. Chaleur totale<\/div><p>Seules les isobares échangent de la chaleur. $Q_{BC} = nC_{P,m}(T_C - T_B) = \\frac{\\gamma}{\\gamma-1}P_2(V_C - V_B)$ et $Q_{DA} = \\frac{\\gamma}{\\gamma-1}P_1(V_A - V_D)$. Donc $Q = \\frac{\\gamma}{\\gamma-1}\\left[P_2(V_C - V_B) + P_1(V_A - V_D)\\right]$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · 2. Travail<\/div><p>Sur un cycle, $W = -Q = -\\frac{\\gamma}{\\gamma-1}\\left[P_2(V_C - V_B) + P_1(V_A - V_D)\\right]$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · 3. Rendement<\/div><p>$\\rho = \\frac{-W}{Q_{BC}} = 1 + \\frac{P_1(V_A - V_D)}{P_2(V_C - V_B)}$. Laplace : $V_A = a^{1/\\gamma}V_B$ et $V_D = a^{1/\\gamma}V_C$, donc $\\rho = 1 - a^{(1-\\gamma)/\\gamma}$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · 4. Second principe<\/div><p>Cycle réversible : $\\oint\\frac{\\delta Q}{T} = nC_{P,m}\\ln\\frac{T_C}{T_B} + nC_{P,m}\\ln\\frac{T_A}{T_D} = 0$, donc $\\frac{T_C}{T_B} = \\frac{T_D}{T_A}$.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p>Application numérique (vérifiée) :<\/p>\n<pre class=\"\"><code>a, g = 8, 1.4\nrho = 1 - a**((1 - g)/g)\nprint(f&quot;rho = {rho:.3f}&quot;)<\/code><\/pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie<\/div><code>rho = 0.448<\/code><\/pre><p>Soit <strong>ρ ≈ 44,8 %<\/strong>.<\/p>\n<aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Ici $a = P_2/P_1$ est un rapport de <strong>pressions<\/strong> : l&#39;exposant est $(1-\\gamma)/\\gamma$. Avec un rapport de volumes (Beau de Rochas), c&#39;est $1 - \\gamma$.<\/p>\n<\/aside><h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Entraînement final<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Rendement du cycle de Brayton pour a = 10, γ = 1,4 ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.482<\/b><\/p><p>$1 - 10^{-0{,}4/1{,}4} \\approx 0{,}482$.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Pour le même cycle, montre que le rendement ne dépasse pas celui de Carnot entre $T_C$ et $T_A$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$\\rho = 1 - T_A/T_B$ (car $T_B/T_A = a^{(\\gamma-1)/\\gamma}$). Comme $T_B &lt; T_C$, $\\rho &lt; 1 - T_A/T_C = \\rho_{Carnot}$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>1 mol de gaz parfait diatomique chauffée à P constante de 300 K à 400 K : Q et ΔU ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$Q = \\frac{7}{2}R\\times100 \\approx 2910$ J ; $\\Delta U = \\frac{5}{2}R\\times100 \\approx 2079$ J.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 6 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Dans le cycle de Brayton, la chaleur est échangée pendant :<\/div><button class=\"opt\" data-o=\"0\">les adiabatiques<\/button><button class=\"opt\" data-o=\"1\">les isobares<\/button><button class=\"opt\" data-o=\"2\">tout le cycle<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Le rendement du cycle de Brayton pour a = 8, γ = 1,4 vaut :<\/div><button class=\"opt\" data-o=\"0\">56,5 %<\/button><button class=\"opt\" data-o=\"1\">44,8 %<\/button><button class=\"opt\" data-o=\"2\">87,5 %<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Sur une isobare d&#39;un gaz parfait, $Q$ vaut aussi :<\/div><button class=\"opt\" data-o=\"0\">$\\frac{\\gamma}{\\gamma - 1}P\\Delta V$<\/button><button class=\"opt\" data-o=\"1\">$P\\Delta V$<\/button><button class=\"opt\" data-o=\"2\">$\\frac{1}{\\gamma - 1}P\\Delta V$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Pour un gaz parfait, sur une adiabatique réversible :<\/div><button class=\"opt\" data-o=\"0\">W = 0<\/button><button class=\"opt\" data-o=\"1\">W = ΔU<\/button><button class=\"opt\" data-o=\"2\">ΔU = 0<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Le travail total d&#39;un cycle moteur est :<\/div><button class=\"opt\" data-o=\"0\">négatif<\/button><button class=\"opt\" data-o=\"1\">positif<\/button><button class=\"opt\" data-o=\"2\">nul<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Sur une isotherme d&#39;un gaz parfait :<\/div><button class=\"opt\" data-o=\"0\">$\\Delta U = Q$<\/button><button class=\"opt\" data-o=\"1\">$\\Delta U = 0$<\/button><button class=\"opt\" data-o=\"2\">$W = 0$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">La relation $T_C/T_B = T_D/T_A$ se démontre avec :<\/div><button class=\"opt\" data-o=\"0\">le premier principe seul<\/button><button class=\"opt\" data-o=\"1\">le second principe ($\\oint\\delta Q/T = 0$)<\/button><button class=\"opt\" data-o=\"2\">la loi de Joule<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Pour une isochore d&#39;un gaz parfait :<\/div><button class=\"opt\" data-o=\"0\">$Q = \\Delta U = nC_{V,m}\\Delta T$<\/button><button class=\"opt\" data-o=\"1\">$Q = \\Delta H$<\/button><button class=\"opt\" data-o=\"2\">$Q = 0$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Le rendement d&#39;un cycle réel entre deux sources est :<\/div><button class=\"opt\" data-o=\"0\">supérieur à celui de Carnot<\/button><button class=\"opt\" data-o=\"1\">inférieur ou égal à celui de Carnot<\/button><button class=\"opt\" data-o=\"2\">toujours égal à 50 %<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">L&#39;exercice 1 de l&#39;examen 2022-2023 est :<\/div><button class=\"opt\" data-o=\"0\">un exercice de la série de TD 1<\/button><button class=\"opt\" data-o=\"1\">un exercice inédit sur l&#39;entropie<\/button><button class=\"opt\" data-o=\"2\">un exercice sur Van der Waals<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"revision-examen-blanc","rep":null,"tol":null},{"n":"revision-examen-blanc","rep":["0.482"],"tol":0.002},{"n":"revision-examen-blanc","rep":null,"tol":null},{"n":"revision-examen-blanc","rep":null,"tol":null}],"qcm":[{"n":"revision-examen-blanc","q":"Dans le cycle de Brayton, la chaleur est échangée pendant :","o":["les adiabatiques","les isobares","tout le cycle"],"a":1,"e":"Q = 0 sur les adiabatiques."},{"n":"revision-examen-blanc","q":"Le rendement du cycle de Brayton pour a = 8, γ = 1,4 vaut :","o":["56,5 %","44,8 %","87,5 %"],"a":1,"e":"$1 - 8^{-0{,}2857}$. 56,5 % serait la formule avec un rapport de volumes."},{"n":"revision-examen-blanc","q":"Sur une isobare d&#39;un gaz parfait, $Q$ vaut aussi :","o":["$\\frac{\\gamma}{\\gamma - 1}P\\Delta V$","$P\\Delta V$","$\\frac{1}{\\gamma - 1}P\\Delta V$"],"a":0,"e":"$nC_{P,m}\\Delta T$ avec $nR\\Delta T = P\\Delta V$."},{"n":"revision-examen-blanc","q":"Pour un gaz parfait, sur une adiabatique réversible :","o":["W = 0","W = ΔU","ΔU = 0"],"a":1,"e":"Q = 0."},{"n":"revision-examen-blanc","q":"Le travail total d&#39;un cycle moteur est :","o":["négatif","positif","nul"],"a":0,"e":"Le moteur fournit du travail."},{"n":"revision-examen-blanc","q":"Sur une isotherme d&#39;un gaz parfait :","o":["$\\Delta U = Q$","$\\Delta U = 0$","$W = 0$"],"a":1,"e":"U = U(T)."},{"n":"revision-examen-blanc","q":"La relation $T_C/T_B = T_D/T_A$ se démontre avec :","o":["le premier principe seul","le second principe ($\\oint\\delta Q/T = 0$)","la loi de Joule"],"a":1,"e":"Demandé à la question 4."},{"n":"revision-examen-blanc","q":"Pour une isochore d&#39;un gaz parfait :","o":["$Q = \\Delta U = nC_{V,m}\\Delta T$","$Q = \\Delta H$","$Q = 0$"],"a":0,"e":"W = 0."},{"n":"revision-examen-blanc","q":"Le rendement d&#39;un cycle réel entre deux sources est :","o":["supérieur à celui de Carnot","inférieur ou égal à celui de Carnot","toujours égal à 50 %"],"a":1,"e":"Carnot est la borne maximale."},{"n":"revision-examen-blanc","q":"L&#39;exercice 1 de l&#39;examen 2022-2023 est :","o":["un exercice de la série de TD 1","un exercice inédit sur l&#39;entropie","un exercice sur Van der Waals"],"a":0,"e":"Revoir les TD est la meilleure préparation."}]}];

const lireJ = (k) => { try { return JSON.parse(localStorage.getItem(k) || "{}") || {}; } catch (e) { return {}; } };
const ecrireJ = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

function noter(n, ok) { const S = etat(); (S.attempts[n] = S.attempts[n] || []).push(ok ? 1 : 0); if (S.attempts[n].length > 30) S.attempts[n].shift(); ecrireJ(MODULE.cleEtat, S); }
// Maîtrisé = au moins 3 essais et 80 % de réussite sur les 5 derniers (règle commune à la plateforme).
function statut(n) {
  if (MODULE.format === "score10") { const v = lireJ(MODULE.cle)[n]; if (v !== undefined) return [v >= 8 ? "ok" : "fragile", v / 10]; }
  if (MODULE.format === "best") { const v = (lireJ(MODULE.cle).notions || {})[n]; return v && v.best != null ? [v.best >= 0.8 ? "ok" : "fragile", v.best] : ["jamais", null]; }
  if (MODULE.format === "pc") { const v = lireJ(MODULE.cle)[n]; return v && v.pc !== undefined ? [v.pc >= 80 ? "ok" : "fragile", v.pc / 100] : ["jamais", null]; } const a = (etat().attempts[n] || []).slice(-5); if (!a.length) return ["jamais", null]; const r = a.reduce((x, y) => x + y, 0) / a.length; return [(etat().attempts[n].length >= 3 && r >= 0.8) ? "ok" : "fragile", r]; }
const NCH = {}; NOTIONS.forEach((n) => (NCH[n.ch] = NCH[n.ch] || []).push(n));
function scoreChap(c) {
  if (MODULE.format === "score10") return lireJ(MODULE.cle)[c.id];
  if (MODULE.format === "pc") { const v = lireJ(MODULE.cle)[c.id]; return v && v.pc !== undefined ? Math.round(v.pc / 10) : undefined; }
  if (MODULE.format === "best") { const v = (lireJ(MODULE.cle).notions || {})[c.id]; return v && v.best != null ? Math.round(v.best * 10) : undefined; }
  const l = NCH[c.id] || []; if (!l.length || !l.some((n) => statut(n.id)[0] !== "jamais")) return undefined;
  return Math.round((10 * l.filter((n) => statut(n.id)[0] === "ok").length) / l.length);
}

  function note() {
    $('#mztNote').textContent = !ready ? 'Connexion au tuteur…' : sample
      ? 'Mode rapide (économe) par défaut. « Approfondi » ou « Approfondir cette réponse » utilise un modèle supérieur. Pense à chercher dans l\'Historique avant de reposer une question.'
      : 'Le tuteur n\'est pas disponible ici (il faut ouvrir la page dans Claude et accepter la demande d\'autorisation). L\'historique reste consultable.';
  }
  function refreshCtx() {
    const c = context(); $('#mztCtx').textContent = '· ' + c.label; $('#mztPrev').textContent = c.text.slice(0, 2500) + (c.text.length > 2500 ? '\n…' : '');
    return c;
  }
  function openPanel(ctx) {
    forced = ctx && ctx.text ? ctx : null;
    $('#mztPan').hidden = false; $('#mztBtn').hidden = true; view('chat');
    const c = refreshCtx();
    if (!cur || cur.sec !== c.label) { const ts = ST.threads.filter((t) => t.sec === c.label); cur = forced ? null : ts[ts.length - 1] || null; }
    renderLog(); note(); setTimeout(() => $('#mztIn').focus(), 30);
  }
  function closePanel() { $('#mztPan').hidden = true; $('#mztBtn').hidden = false; forced = null; }

  function renderLog() {
    const log = $('#mztLog'); log.innerHTML = '';
    if (!cur || !cur.msgs.length) {
      log.innerHTML = `<div class="mzt-m a">Pose ta question sur « ${esc(context().label)} » : une phrase que tu ne comprends pas, un calcul à vérifier, un exemple en plus… Tu peux joindre une photo de ton brouillon.</div>`; return;
    }
    cur.msgs.forEach((m, i) => {
      const d = document.createElement('div'); d.className = 'mzt-m ' + (m.r === 'u' ? 'u' : 'a');
      if (m.d) d.innerHTML = '<span class="mzt-tag">Réponse approfondie</span>';
      if (m.r === 'u') d.appendChild(document.createTextNode(m.t)); else d.insertAdjacentHTML('beforeend', md(m.t)); log.appendChild(d);
      if (m.r === 'a' && i === cur.msgs.length - 1 && !m.d && !busy) {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'mzt-deepbtn'; b.textContent = 'Approfondir cette réponse';
        b.onclick = () => ask('Approfondis ta réponse précédente : explique plus en détail, avec un exemple complet et les pièges.', true); log.appendChild(b);
      }
    });
    log.scrollTop = 1e9;
  }
  function renderList() {
    const q = norm($('#mztQ').value || ''); const ts = [...ST.threads].reverse().filter((t) => !q || norm(t.msgs.map((m) => m.t).join(' ')).includes(q));
    $('#mztList').innerHTML = ts.length ? ts.map((t) => `<details class="mzt-item"><summary>${esc(t.title)}</summary><div class="mzt-meta">${esc(t.sec)} · ${esc(t.date)}</div>${t.msgs.map((m) => `<div class="mzt-m ${m.r === 'u' ? 'u' : 'a'}" style="margin:6px 0">${m.r === 'u' ? esc(m.t) : md(m.t)}</div>`).join('')}<button type="button" data-cont="${esc(t.id)}">Continuer cette discussion</button></details>`).join('')
      : `<p class="mzt-note">${ST.threads.length ? 'Aucune discussion ne contient ce mot.' : 'Aucune discussion pour l\'instant.'}</p>`;
  }
  function renderMem() {
    $('#mztMemL').innerHTML = ST.memos.length ? ST.memos.map((m, i) => `<div class="mzt-item"><div class="mzt-meta">${esc(m.date)}</div>${esc(m.text)}<div><button type="button" data-memdel="${i}" style="margin-top:4px">Effacer</button></div></div>`).join('')
      : '<p class="mzt-note">Aucune note pour l\'instant. Elles apparaîtront au fil de tes questions.</p>';
  }

  // ---------- stockage compte ----------
  async function saveThread(t) {
    saveLocal(); if (!db) return;
    try { await db.collection(base + '/threads').doc(t.id).set({ sec: t.sec, date: t.date, title: t.title, msgs: t.msgs.slice(-40) }); } catch (e) {}
  }
  async function saveMemos() { saveLocal(); if (!db) return; try { await db.doc(base).set({ memos: ST.memos.slice(-30), updated: Date.now() }); } catch (e) {} }

  // ---------- appel au tuteur ----------
  const ERR = { not_granted: 'Tu n\'as pas autorisé la page à utiliser Claude. Recharge-la et accepte la demande, ou change-le dans le menu Autorisations de l\'artifact.', rate_limited: 'Trop de questions d\'un coup, ou limite d\'usage atteinte. Réessaie dans un moment.', prompt_too_large: 'L\'extrait est trop long : ouvre une partie plus précise du cours.', image_rejected: 'Cette photo n\'est pas acceptée. Essaie un JPEG ou un PNG plus léger.', refused: 'Claude n\'a pas pu répondre à cette demande. Reformule ta question.' };
  const visible = (t) => {
    const L = String(t).split('\n');
    for (let i = L.length - 1; i >= Math.max(0, L.length - 3); i--) if (/^\s*M[ÉE]MO\s*:/i.test(L[i])) return L.slice(0, i).join('\n').trim();
    return String(t).trim();
  };
  // rendu léger : on échappe le HTML d'abord, puis gras, italique, code, titres, puces et blocs de code
  const inl = (s) => {
    const p = s.split('`'); if (p.length % 2 === 0) { const last = p.pop(); p[p.length - 1] += '`' + last; }
    return p.map((x, i) => i % 2 ? '<code>' + esc(x) + '</code>' : esc(x).replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*\w])\*([^*\n]+)\*(?![*\w])/g, '$1<em>$2</em>')).join('');
  };
  const md = (t) => {
    const out = []; let list = null, code = null;
    const flush = () => { if (list) { out.push('</' + list + '>'); list = null; } };
    String(t).split('\n').forEach((raw) => {
      if (/^\s*```/.test(raw)) { if (code === null) { flush(); code = []; } else { out.push('<pre>' + esc(code.join('\n')) + '</pre>'); code = null; } return; }
      if (code !== null) { code.push(raw); return; }
      let m;
      if ((m = raw.match(/^\s*#{1,6}\s+(.*)$/))) { flush(); out.push('<p><strong>' + inl(m[1]) + '</strong></p>'); }
      else if ((m = raw.match(/^\s*[-*•]\s+(.*)$/))) { if (list !== 'ul') { flush(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + inl(m[1]) + '</li>'); }
      else if ((m = raw.match(/^\s*\d+[.)]\s+(.*)$/))) { if (list !== 'ol') { flush(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + inl(m[1]) + '</li>'); }
      else if (!raw.trim()) flush();
      else { flush(); out.push('<p>' + inl(raw) + '</p>'); }
    });
    if (code !== null) out.push('<pre>' + esc(code.join('\n')) + '</pre>');
    flush(); return out.join('');
  };
  async function ask(q, deep) {
    q = (q || '').trim(); deep = deep || $('#mztDeep').checked;
    if (busy || !q) return; if (!sample) { note(); return; }
    const c = refreshCtx();
    if (!cur || (cur.sec !== c.label && !forced)) { cur = { id: 't' + Date.now().toString(36), sec: c.label, date: today(), title: q.slice(0, 80), msgs: [] }; ST.threads.push(cur); }
    else if (!ST.threads.includes(cur)) ST.threads.push(cur);
    cur.msgs.push({ r: 'u', t: q }); busy = true; renderLog();
    const out = document.createElement('div'); out.className = 'mzt-m a'; out.textContent = deep ? 'Réflexion approfondie…' : 'Réflexion…'; $('#mztLog').appendChild(out);
    $('#mztSend').disabled = true; $('#mztStop').hidden = false;
    const style = deep
      ? 'Réponse APPROFONDIE (400 à 700 mots) : 1) l\'intuition avec une analogie, 2) l\'explication détaillée pas à pas, 3) pourquoi ça marche, 4) un exemple complet chiffré, 5) les pièges fréquents et ce qui tombe à l\'examen, 6) une question pour vérifier la compréhension.'
      : 'Réponse EXPLICATIVE (150 à 250 mots) : 1) l\'idée en une phrase, 2) l\'explication pas à pas, 3) un petit exemple chiffré ou concret, 4) une courte question pour vérifier la compréhension.';
    const mem = [];
    if (ST.memos.length) mem.push('DIFFICULTÉS DÉJÀ REPÉRÉES :\n' + ST.memos.slice(-12).map((m) => `- ${m.date} : ${m.text}`).join('\n'));
    const lastQ = ST.threads.flatMap((t) => t.msgs.filter((m) => m.r === 'u').map((m) => `[${t.sec}] ${m.t.slice(0, 100)}`)).slice(-6);
    if (lastQ.length) mem.push('SES DERNIÈRES QUESTIONS :\n' + lastQ.map((x) => '- ' + x).join('\n'));
    const rules = `Tu es le tuteur de ${C.student}, pour le module ${C.module}${C.prof ? ' du ' + C.prof : ''}. Il apprend souvent la notion pour la première fois.
Règles : réponds en français simple, en Markdown léger (**gras** pour les termes clés, tirets, étapes numérotées, formules et calculs entre accents graves ; pas de tableaux). ${style} Appuie-toi d'abord sur l'EXTRAIT ci-dessous et sur les conventions du prof ; si une source générale diffère du cours, signale l'écart et dis quelle version utiliser à l'examen (celle du prof). Pour un calcul, pose chaque étape et vérifie-la. S'il envoie une réponse ou une photo de brouillon, corrige étape par étape et nomme précisément l'erreur. Si tu n'es pas sûr, dis-le. S'il demande un mini-exercice, donne l'exercice sans la solution.
Utilise sa mémoire pour faire des liens avec ses confusions passées, sans la réciter.
Termine TOUJOURS par une dernière ligne séparée au format exact « MÉMO: … » qui résume en 15 mots maximum la difficulté révélée par sa question (ou « MÉMO: rien »). Cette ligne lui est cachée.
${C.conventions ? 'CONVENTIONS DU PROF : ' + C.conventions + '\n' : ''}MÉMOIRE DE L'ÉLÈVE :
${mem.join('\n\n') || '(rien pour l\'instant)'}
EXTRAIT (${c.label}) :
${c.text.slice(0, deep ? 9000 : 3500)}`;
    const recent = cur.msgs.slice(deep ? -9 : -5, -1).map((m) => ({ role: m.r === 'u' ? 'user' : 'assistant', content: m.t }));
    while (recent.length && recent[0].role !== 'user') recent.shift();
    const msgs = [...recent.filter((m) => m.content && m.content.trim()), { role: 'user', content: q }]; while (msgs.length > 1 && msgs[0].role !== 'user') msgs.shift(); msgs[0] = { role: 'user', content: rules + '\n\n---\nQuestion : ' + msgs[0].content };
    ctl = new AbortController();
    const opts = { modelTier: deep ? 'complex' : 'quick', cache: false, signal: ctl.signal, onText: ({ text }) => { out.innerHTML = md(visible(text)); $('#mztLog').scrollTop = 1e9; } };
    if (img) opts.images = [img];
    try {
      const r = await sample(msgs, opts);
      const mm = r.text.match(/(?:^|\n)\s*M[ÉE]MO\s*:\s*(.+)\s*$/i);
      cur.msgs.push({ r: 'a', t: visible(r.text) + (r.truncated ? '\n\n(Réponse coupée : pose une question plus ciblée.)' : ''), d: !!deep });
      if (mm && !/^\s*rien/i.test(mm[1])) { ST.memos.push({ date: today(), text: mm[1].trim().slice(0, 160) }); if (ST.memos.length > 30) ST.memos.shift(); saveMemos(); }
      await saveThread(cur);
    } catch (e) {
      const kept = e && e.text ? visible(e.text) : '';
      if (e && e.code === 'cancelled') { if (kept) cur.msgs.push({ r: 'a', t: kept + '\n(Arrêté.)' }); else cur.msgs.pop(); }
      else { cur.msgs.pop(); out.textContent = (kept ? kept + '\n\n' : '') + (ERR[e && e.code] || 'Le tuteur n\'a pas pu répondre. Réessaie dans un instant.'); }
      if (!cur.msgs.length) ST.threads = ST.threads.filter((t) => t !== cur);
      saveLocal();
      if (!(e && e.code === 'cancelled')) { busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImgN').textContent = ''; return; }
    }
    busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImg').value = ''; $('#mztImgN').textContent = ''; renderLog();
  }

  // ---------- événements ----------
  $('#mztBtn').onclick = () => openPanel(null);
  $('#mztX').onclick = closePanel;
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#mztPan').hidden) closePanel(); });
  $('#mztTabH').onclick = () => view($('#mztHist').hidden ? 'hist' : 'chat');
  $('#mztTabM').onclick = () => view($('#mztMem').hidden ? 'mem' : 'chat');
  $('#mztQ').oninput = renderList;
  $('#mztList').onclick = (e) => { const id = e.target.dataset && e.target.dataset.cont; if (!id) return; cur = ST.threads.find((t) => t.id === id); view('chat'); $('#mztCtx').textContent = '· ' + cur.sec; renderLog(); };
  $('#mztMemL').onclick = (e) => { const i = e.target.dataset && e.target.dataset.memdel; if (i == null) return; ST.memos.splice(+i, 1); saveMemos(); renderMem(); };
  $('#mztChips').onclick = (e) => { const b = e.target.closest('[data-chip]'); if (!b) return; const t = $('#mztIn'); t.value = b.dataset.chip + (t.value ? ' : ' + t.value : ''); t.focus(); };
  $('#mztNew').onclick = () => { cur = null; renderLog(); };
  $('#mztStop').onclick = () => { if (ctl) ctl.abort(); };
  $('#mztImg').onchange = (e) => { img = e.target.files[0] || null; $('#mztImgN').textContent = img ? 'Photo : ' + img.name : ''; };
  $('#mztF').onsubmit = (e) => { e.preventDefault(); const v = $('#mztIn').value; $('#mztIn').value = ''; ask(v); };
  $('#mztIn').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#mztF').requestSubmit(); } });

  // ---------- capacités (facultatives) ----------
  const W = window.claude;
  if (W && W.use) {
    W.use('sample').then((s) => { sample = s; ready = true; note();
      if (s && s.limits) s.limits().then((l) => { if (l && l.images) { imgOK = true; $('#mztImgL').hidden = false; if (l.images.mediaTypes) $('#mztImg').accept = l.images.mediaTypes.join(','); } }).catch(() => {});
    }).catch(() => { ready = true; note(); });
    Promise.all([W.use('db'), W.use('user')]).then(async ([d, u]) => {
      if (!d || !u) return; const id = await u.id(); if (!id) return; db = d; base = 'data/users/' + id + '/mzt_' + C.id;
      try {
        const m = await db.doc(base).get(); if (m.exists) { const v = m.data() || {}; if (Array.isArray(v.memos)) ST.memos = JSON.parse(JSON.stringify(v.memos)); }
        const q = await db.collection(base + '/threads').get(); const remote = q.docs.map((x) => Object.assign({ id: x.id }, JSON.parse(JSON.stringify(x.data() || {}))));
        const map = {}; [...ST.threads, ...remote].forEach((t) => { if (!map[t.id] || (t.msgs || []).length > (map[t.id].msgs || []).length) map[t.id] = t; });
        ST.threads = Object.values(map).sort((a, b) => parseInt(a.id.slice(1), 36) - parseInt(b.id.slice(1), 36)); saveLocal();
      } catch (e) {}
    }).catch(() => {});
  } else { ready = true; note(); }

  window.MZT = { open: openPanel, close: closePanel };
})();

</script>

if(window.top===window&&location.protocol==="file:"){a.hidden=true;return}
a.href=p.indexOf("/decouvrir")===0||location.pathname.indexOf("/decouvrir")===0?"/decouvrir":"/app/modules";})();</script>
