<script>
const MODULE={"slug":"thermodynamique","titre":"Thermodynamique","cle":"thermodynamique_scores","cleEtat":"thermodynamique_scores_etat","format":"score10","intro":"<p>Ce module suit <strong>les 5 chapitres du cours du Pr I. Arroub<\/strong> (Thermodynamique I, S1) et corrige <strong>les séries de TD 1 et 2<\/strong> et <strong>l&#39;examen de session ordinaire 2022-2023<\/strong>.<\/p>\n<p><strong>Comment l&#39;utiliser<\/strong><\/p>\n<ol>\n<li>Lis un chapitre : avant de commencer, comment l&#39;aborder, puis les idées une à une.<\/li>\n<li>Refais les exemples chiffrés à la main, calculatrice à côté.<\/li>\n<li>Fais le QCM : <strong>8/10 = chapitre maîtrisé<\/strong>.<\/li>\n<li>Termine par les TD corrigés et l&#39;examen blanc.<\/li>\n<\/ol>\n<p><strong>Convention à garder en tête<\/strong> : tout ce que le système <strong>reçoit<\/strong> est compté <strong>positif<\/strong>.<\/p>\n<p><strong>Ce qui est sûr<\/strong> : le contenu suit les diapositives du prof ; les calculs numériques des corrigés ont été vérifiés en Python.\n<strong>À vérifier<\/strong> : les corrigés des TD sont une rédaction ToumaiLearn (pas ceux du prof), et le format de l&#39;examen peut changer d&#39;une année à l&#39;autre.<\/p>\n","annexes":[],"cartes":null,"maths":true};
const CHAPS=[{"id":"systemes-formes-differentielles","t":"Systèmes, variables d'état et formes différentielles","seance":"Chapitre 1 (1re partie) · Généralités sur les systèmes","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il te faut une seule chose : savoir calculer une <strong>dérivée partielle<\/strong>. On dérive par rapport à une variable en traitant les autres comme des constantes.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Soit $f(x,y) = x\\sin y - x^2 y$. Calcule $\\left(\\frac{\\partial f}{\\partial x}\\right)_y$ et $\\left(\\frac{\\partial f}{\\partial y}\\right)_x$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Pour la première, y est une constante.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>$\\left(\\frac{\\partial f}{\\partial x}\\right)_y = \\sin y - 2xy$ et $\\left(\\frac{\\partial f}{\\partial y}\\right)_x = x\\cos y - x^2$. C&#39;est l&#39;exemple du prof.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « état » contre « chemin ».<\/strong> Une fonction d&#39;état (U, H, S…) ne dépend que de l&#39;état initial et de l&#39;état final. Le travail et la chaleur dépendent du chemin. Tout le chapitre sert à reconnaître mathématiquement la différence.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Écrire $dW$ ou $dQ$ comme si W et Q étaient des fonctions d&#39;état. Le prof écrit $\\delta W$ et $\\delta Q$ : ce sont des formes différentielles <strong>non exactes<\/strong>. On n&#39;écrit jamais $\\Delta W$.<\/p>\n<\/aside><p>À la fin, tu sais classer un système, tester si une forme différentielle est exacte (Schwarz) et trouver un facteur intégrant.<\/p>\n<h2>Idée 1 · Système, milieu extérieur, et ce qu&#39;ils échangent<\/h2>\n<figure class=\"grille\"><figcaption>Ce que chaque type de système peut échanger<\/figcaption><table><tr><th><\/th><th>Énergie<\/th><th>Matière<\/th><th>Exemple du cours<\/th><\/tr><tr><th>Isolé<\/th><td class=\"h0\">non<\/td><td class=\"h0\">non<\/td><td>L'univers<\/td><\/tr><tr><th>Fermé<\/th><td class=\"h1\">oui<\/td><td class=\"h0\">non<\/td><td>Gaz dans un cylindre fermé par un piston<\/td><\/tr><tr><th>Ouvert<\/th><td class=\"h1\">oui<\/td><td class=\"h1\">oui<\/td><td>Êtres vivants, compresseur<\/td><\/tr><\/table><\/figure><p>Le système est la partie de l&#39;univers délimitée par une surface fermée (réelle ou fictive). Tout le reste est le <strong>milieu extérieur<\/strong>.<\/p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p><strong>Convention de signe du prof<\/strong> : on compte <strong>positif<\/strong> ce qui est <strong>reçu<\/strong> par le système, <strong>négatif<\/strong> ce qui est <strong>cédé<\/strong>. Un gaz comprimé reçoit du travail : W &gt; 0.<\/p>\n<\/aside><h2>Idée 2 · Variables d&#39;état, équation d&#39;état, fonction d&#39;état<\/h2>\n<figure class=\"flux\"><figcaption>Du plus simple au plus construit<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">Variables d&#39;état (P, V, T, m…)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Équation d&#39;état f(P,V,T)=0<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">Fonctions d&#39;état (U, H, S)<\/div><\/div><\/figure><ul>\n<li><strong>Variables d&#39;état<\/strong> : masse, volume, pression, température, concentration… Elles décrivent l&#39;état à un instant.<\/li>\n<li><strong>Équation d&#39;état<\/strong> : relation entre elles. Gaz parfait : $PV = nRT$. Ressort : $F = kx$.<\/li>\n<li><strong>Fonction d&#39;état<\/strong> : fonction de variables d&#39;état indépendantes. Ex. $V = V(P,T)$, mais aussi l&#39;énergie, l&#39;enthalpie, l&#39;entropie.<\/li>\n<\/ul>\n<p>Exemple : pour 1 mol de gaz parfait à 300 K et $10^5$ Pa, $V = RT/P = 8{,}314 \\times 300 / 10^5 \\approx 0{,}0249\\ \\text{m}^3$, soit environ 24,9 L.<\/p>\n<h2>Idée 3 · Différentielle totale et théorème de Schwarz<\/h2>\n<p>Pour $f(x,y)$ :<\/p>\n<p>$$df = \\left(\\frac{\\partial f}{\\partial x}\\right)_y dx + \\left(\\frac{\\partial f}{\\partial y}\\right)_x dy$$<\/p>\n<p>Une <strong>forme différentielle<\/strong> $\\delta\\omega = P(x,y)\\,dx + Q(x,y)\\,dy$ est <strong>exacte<\/strong> s&#39;il existe $f$ avec $df = \\delta\\omega$. Schwarz (dérivées croisées égales) donne le test :<\/p>\n<p>$$\\delta\\omega \\text{ exacte} \\iff \\left(\\frac{\\partial P}{\\partial y}\\right)_x = \\left(\\frac{\\partial Q}{\\partial x}\\right)_y$$<\/p>\n<p>À 3 variables, $P\\,dx + Q\\,dy + R\\,dz$ : il faut $P'_y = Q'_x$, $Q'_z = R'_y$ et $P'_z = R'_x$.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Tester une forme et retrouver f<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Identifier P et Q<\/div><p>Pour $\\delta u = y\\,dx + x\\,dy$ : $P = y$, $Q = x$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · Dérivées croisées<\/div><p>$\\partial P/\\partial y = 1$ et $\\partial Q/\\partial x = 1$ : égales, donc exacte.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · Intégrer P en x<\/div><p>$u = xy + g(y)$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · Dériver en y et comparer à Q<\/div><p>$\\partial u/\\partial y = x + g'(y) = x$, donc $g' = 0$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · Conclure<\/div><p>$u(x,y) = xy + C$.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>L&#39;exemple du prof : pour un gaz parfait, $P = nRT/V$ et $dP = -\\frac{nRT}{V^2}dV + \\frac{nR}{V}dT$. Les dérivées croisées valent toutes deux $-nR/V^2$ : $dP$ est bien une différentielle totale exacte.<\/p>\n<\/aside><h2>Idée 4 · Le facteur intégrant<\/h2>\n<p>Une forme non exacte peut le devenir après multiplication par une fonction $\\lambda$ : c&#39;est un <strong>facteur intégrant<\/strong>, $\\lambda\\,\\delta\\omega = dF$.<\/p>\n<p>C&#39;est exactement ce qui se passe en thermo : $\\delta Q$ n&#39;est pas exacte, mais $\\delta Q/T$ l&#39;est (on le verra avec l&#39;entropie). Ici $\\lambda = 1/T$.<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Trouver λ(x) pour δf = (x² + y)dx − x dy (TD 1)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Écrire la condition<\/div><p>$\\frac{\\partial}{\\partial y}[\\lambda(x^2+y)] = \\frac{\\partial}{\\partial x}[-\\lambda x]$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Calculer<\/div><p>$\\lambda = -\\lambda - x\\lambda'$, donc $x\\lambda' = -2\\lambda$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Résoudre<\/div><p>$\\lambda'/\\lambda = -2/x$, donc $\\lambda = 1/x^2$ (à une constante près).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Vérifier<\/div><p>$\\left(1 + \\frac{y}{x^2}\\right)dx - \\frac{1}{x}dy = d\\!\\left(x - \\frac{y}{x}\\right)$.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Idée 5 · Les relations générales entre dérivées partielles<\/h2>\n<p>Si $f(x,y,z) = 0$, chaque variable est fonction des deux autres. On obtient :<\/p>\n<p>$$\\left(\\frac{\\partial x}{\\partial y}\\right)_z \\left(\\frac{\\partial y}{\\partial x}\\right)_z = 1 \\qquad \\left(\\frac{\\partial x}{\\partial y}\\right)_z \\left(\\frac{\\partial y}{\\partial z}\\right)_x \\left(\\frac{\\partial z}{\\partial x}\\right)_y = -1$$<\/p>\n<p>La seconde (le « $-1$ ») sert au chapitre suivant pour relier les coefficients thermoélastiques.<\/p>\n<p>Vérification avec $PV = nRT$ : $\\left(\\frac{\\partial P}{\\partial V}\\right)_T = -\\frac{P}{V}$, $\\left(\\frac{\\partial V}{\\partial T}\\right)_P = \\frac{V}{T}$, $\\left(\\frac{\\partial T}{\\partial P}\\right)_V = \\frac{T}{P}$. Produit : $-\\frac{P}{V}\\cdot\\frac{V}{T}\\cdot\\frac{T}{P} = -1$.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Exercices du TD 1<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>$\\delta u = 2y^2\\,dx + 3x^2\\,dy$ est-elle exacte ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Compare ∂P/∂y et ∂Q/∂x.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>$\\partial(2y^2)/\\partial y = 4y$ et $\\partial(3x^2)/\\partial x = 6x$. Différents : <strong>non exacte<\/strong>, pas de fonction $u$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>$\\delta u = y\\,dx + x\\,dy$ : exacte ? Si oui, donne $u$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Dérivées croisées égales à 1 : exacte, $u = xy + C$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Trouve le facteur intégrant $\\lambda(x)$ de $\\delta f = (x^2 + y)dx - x\\,dy$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$\\lambda = 1/x^2$, et alors $f = x - y/x + C$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Un gaz enfermé dans un cylindre fermé par un piston est un système :<\/div><button class=\"opt\" data-o=\"0\">isolé<\/button><button class=\"opt\" data-o=\"1\">fermé<\/button><button class=\"opt\" data-o=\"2\">ouvert<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Avec la convention du prof, un système qui cède 200 J de chaleur a :<\/div><button class=\"opt\" data-o=\"0\">$Q = +200$ J<\/button><button class=\"opt\" data-o=\"1\">$Q = -200$ J<\/button><button class=\"opt\" data-o=\"2\">$Q = 0$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Laquelle n&#39;est <strong>pas<\/strong> une fonction d&#39;état ?<\/div><button class=\"opt\" data-o=\"0\">l&#39;énergie interne U<\/button><button class=\"opt\" data-o=\"1\">l&#39;enthalpie H<\/button><button class=\"opt\" data-o=\"2\">le travail W<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">$\\delta\\omega = 2y^2dx + 3x^2dy$ est :<\/div><button class=\"opt\" data-o=\"0\">exacte<\/button><button class=\"opt\" data-o=\"1\">non exacte<\/button><button class=\"opt\" data-o=\"2\">exacte seulement si x = y<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">$y\\,dx + x\\,dy$ est la différentielle de :<\/div><button class=\"opt\" data-o=\"0\">$x + y$<\/button><button class=\"opt\" data-o=\"1\">$xy$<\/button><button class=\"opt\" data-o=\"2\">$x^2 + y^2$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Le théorème de Schwarz affirme, pour f de classe $C^2$ :<\/div><button class=\"opt\" data-o=\"0\">$\\frac{\\partial^2 f}{\\partial x\\partial y} = \\frac{\\partial^2 f}{\\partial y\\partial x}$<\/button><button class=\"opt\" data-o=\"1\">$\\frac{\\partial f}{\\partial x} = \\frac{\\partial f}{\\partial y}$<\/button><button class=\"opt\" data-o=\"2\">$\\frac{\\partial^2 f}{\\partial x^2} = 0$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Un facteur intégrant de $(x^2+y)dx - x\\,dy$ est :<\/div><button class=\"opt\" data-o=\"0\">$x^2$<\/button><button class=\"opt\" data-o=\"1\">$1/x^2$<\/button><button class=\"opt\" data-o=\"2\">$1/x$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Pour $PV = nRT$, le produit $(\\partial P/\\partial V)_T(\\partial V/\\partial T)_P(\\partial T/\\partial P)_V$ vaut :<\/div><button class=\"opt\" data-o=\"0\">$1$<\/button><button class=\"opt\" data-o=\"1\">$-1$<\/button><button class=\"opt\" data-o=\"2\">$0$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Une équation d&#39;état est :<\/div><button class=\"opt\" data-o=\"0\">une fonction qui dépend du chemin<\/button><button class=\"opt\" data-o=\"1\">une relation entre variables d&#39;état, du type $f(P,V,T) = 0$<\/button><button class=\"opt\" data-o=\"2\">une forme différentielle non exacte<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">$\\left(\\frac{\\partial f}{\\partial x}\\right)_y$ signifie :<\/div><button class=\"opt\" data-o=\"0\">dériver f par rapport à y<\/button><button class=\"opt\" data-o=\"1\">dériver f par rapport à x en gardant y constant<\/button><button class=\"opt\" data-o=\"2\">dériver x par rapport à f<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"systemes-formes-differentielles","rep":null,"tol":null},{"n":"systemes-formes-differentielles","rep":null,"tol":null},{"n":"systemes-formes-differentielles","rep":null,"tol":null},{"n":"systemes-formes-differentielles","rep":null,"tol":null}],"qcm":[{"n":"systemes-formes-differentielles","q":"Un gaz enfermé dans un cylindre fermé par un piston est un système :","o":["isolé","fermé","ouvert"],"a":1,"e":"Il peut échanger de l&#39;énergie (travail, chaleur) mais pas de matière."},{"n":"systemes-formes-differentielles","q":"Avec la convention du prof, un système qui cède 200 J de chaleur a :","o":["$Q = +200$ J","$Q = -200$ J","$Q = 0$"],"a":1,"e":"Ce qui est cédé est compté négativement."},{"n":"systemes-formes-differentielles","q":"Laquelle n&#39;est <strong>pas<\/strong> une fonction d&#39;état ?","o":["l&#39;énergie interne U","l&#39;enthalpie H","le travail W"],"a":2,"e":"Le travail dépend du chemin suivi : on écrit $\\delta W$, jamais $dW$."},{"n":"systemes-formes-differentielles","q":"$\\delta\\omega = 2y^2dx + 3x^2dy$ est :","o":["exacte","non exacte","exacte seulement si x = y"],"a":1,"e":"$4y \\ne 6x$ en général."},{"n":"systemes-formes-differentielles","q":"$y\\,dx + x\\,dy$ est la différentielle de :","o":["$x + y$","$xy$","$x^2 + y^2$"],"a":1,"e":"$d(xy) = y\\,dx + x\\,dy$."},{"n":"systemes-formes-differentielles","q":"Le théorème de Schwarz affirme, pour f de classe $C^2$ :","o":["$\\frac{\\partial^2 f}{\\partial x\\partial y} = \\frac{\\partial^2 f}{\\partial y\\partial x}$","$\\frac{\\partial f}{\\partial x} = \\frac{\\partial f}{\\partial y}$","$\\frac{\\partial^2 f}{\\partial x^2} = 0$"],"a":0,"e":"L&#39;ordre de dérivation n&#39;importe pas."},{"n":"systemes-formes-differentielles","q":"Un facteur intégrant de $(x^2+y)dx - x\\,dy$ est :","o":["$x^2$","$1/x^2$","$1/x$"],"a":1,"e":"Condition $x\\lambda' = -2\\lambda$, d&#39;où $\\lambda = 1/x^2$."},{"n":"systemes-formes-differentielles","q":"Pour $PV = nRT$, le produit $(\\partial P/\\partial V)_T(\\partial V/\\partial T)_P(\\partial T/\\partial P)_V$ vaut :","o":["$1$","$-1$","$0$"],"a":1,"e":"C&#39;est la relation générale « −1 »."},{"n":"systemes-formes-differentielles","q":"Une équation d&#39;état est :","o":["une fonction qui dépend du chemin","une relation entre variables d&#39;état, du type $f(P,V,T) = 0$","une forme différentielle non exacte"],"a":1,"e":"Ex. $PV = nRT$ pour le gaz parfait."},{"n":"systemes-formes-differentielles","q":"$\\left(\\frac{\\partial f}{\\partial x}\\right)_y$ signifie :","o":["dériver f par rapport à y","dériver f par rapport à x en gardant y constant","dériver x par rapport à f"],"a":1,"e":"L&#39;indice rappelle la variable maintenue constante."}]},{"id":"coefficients-transformations","t":"Coefficients thermoélastiques, équilibre et transformations","seance":"Chapitre 1 (2e partie) · Généralités sur les systèmes","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Tu dois savoir écrire une dérivée partielle « à variable constante » et utiliser $PV = nRT$.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Pour un gaz parfait, calcule $\\left(\\frac{\\partial V}{\\partial T}\\right)_P$.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$V = nRT/P$, donc $\\left(\\frac{\\partial V}{\\partial T}\\right)_P = \\frac{nR}{P} = \\frac{V}{T}$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Chaque coefficient répond à une question simple : « de combien varie V (ou P) quand je change T (ou P), le reste étant bloqué ? ». Lis l&#39;indice d&#39;abord.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Oublier le signe moins de $\\chi_T$. Le volume <strong>diminue<\/strong> quand la pression augmente : sans le « − », $\\chi_T$ serait négatif.<\/p>\n<\/aside><p>À la fin, tu sais calculer α, β, χ_T, démontrer $\\alpha = \\chi_T\\beta P$ et nommer chaque transformation.<\/p>\n<h2>Idée 1 · Les trois coefficients thermoélastiques<\/h2>\n<figure class=\"grille\"><figcaption>Les coefficients du cours<\/figcaption><table><tr><th><\/th><th>Nom<\/th><th>Définition<\/th><th>Unité<\/th><th>Gaz parfait<\/th><\/tr><tr><th>α<\/th><td>dilatation isobare<\/td><td>$\\frac{1}{V}\\left(\\frac{\\partial V}{\\partial T}\\right)_P$<\/td><td>K⁻¹<\/td><td class=\"h1\">1/T<\/td><\/tr><tr><th>β<\/th><td>augmentation de pression isochore<\/td><td>$\\frac{1}{P}\\left(\\frac{\\partial P}{\\partial T}\\right)_V$<\/td><td>K⁻¹<\/td><td class=\"h1\">1/T<\/td><\/tr><tr><th>χ_T<\/th><td>compressibilité isotherme<\/td><td>$-\\frac{1}{V}\\left(\\frac{\\partial V}{\\partial P}\\right)_T$<\/td><td>Pa⁻¹<\/td><td class=\"h1\">1/P<\/td><\/tr><\/table><\/figure><p>Exemple : un gaz parfait à 300 K a $\\alpha = 1/300 \\approx 3{,}33\\times10^{-3}\\ \\text{K}^{-1}$. À $10^5$ Pa, $\\chi_T = 10^{-5}\\ \\text{Pa}^{-1}$.<\/p>\n<p>Le prof définit aussi la compressibilité <strong>isentropique<\/strong> (adiabatique réversible) : $\\chi_S = -\\frac{1}{V}\\left(\\frac{\\partial V}{\\partial P}\\right)_S$.<\/p>\n<h2>Idée 2 · La relation α = χ_T β P<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Démonstration du prof<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Partir de la relation « −1 »<\/div><p>$\\left(\\frac{\\partial P}{\\partial V}\\right)_T\\left(\\frac{\\partial V}{\\partial T}\\right)_P\\left(\\frac{\\partial T}{\\partial P}\\right)_V = -1$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · Remplacer par les coefficients<\/div><p>$\\left(\\frac{\\partial V}{\\partial T}\\right)_P = \\alpha V$, $\\left(\\frac{\\partial P}{\\partial V}\\right)_T = -\\frac{1}{\\chi_T V}$, $\\left(\\frac{\\partial T}{\\partial P}\\right)_V = \\frac{1}{\\beta P}$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · Simplifier<\/div><p>$-\\frac{1}{\\chi_T V}\\cdot \\alpha V \\cdot \\frac{1}{\\beta P} = -1$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · Conclure<\/div><p>$\\alpha = \\chi_T\\,\\beta\\,P$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · Vérifier sur le gaz parfait<\/div><p>$\\frac{1}{P}\\cdot\\frac{1}{T}\\cdot P = \\frac{1}{T} = \\alpha$. ✓<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p>Deux coefficients suffisent pour retrouver l&#39;équation d&#39;état (c&#39;est l&#39;exercice 1 de la série 2).<\/p>\n<\/aside><h2>Idée 3 · Grandeurs extensives et intensives, équilibre<\/h2>\n<ul>\n<li><strong>Extensive<\/strong> : proportionnelle à la quantité de matière, additive (masse, volume, charge, U, H, S).<\/li>\n<li><strong>Intensive<\/strong> : indépendante de la quantité (T, P, masse volumique).<\/li>\n<\/ul>\n<p>Équilibre d&#39;un système homogène : immobile, variables constantes dans le temps, intensives uniformes. Équilibre <strong>thermique<\/strong> = même T partout ; <strong>mécanique<\/strong> = même P partout. L&#39;équilibre mécanique arrive en général plus vite.<\/p>\n<aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p><strong>Principe zéro<\/strong> : deux systèmes en équilibre thermique avec un même troisième sont en équilibre thermique entre eux. C&#39;est ce qui justifie le thermomètre.<\/p>\n<\/aside><h2>Idée 4 · Le vocabulaire des transformations<\/h2>\n<figure class=\"grille\"><figcaption>Ce qui reste constant<\/figcaption><table><tr><th><\/th><th>Transformation<\/th><th>Ce qui est fixé<\/th><\/tr><tr><th>1<\/th><td>adiabatique<\/td><td class=\"h1\">pas d'échange de chaleur (Q = 0)<\/td><\/tr><tr><th>2<\/th><td>isobare<\/td><td class=\"h1\">P constante<\/td><\/tr><tr><th>3<\/th><td>isotherme<\/td><td class=\"h1\">T constante<\/td><\/tr><tr><th>4<\/th><td>isochore<\/td><td class=\"h1\">V constant<\/td><\/tr><tr><th>5<\/th><td>monotherme<\/td><td class=\"h0\">contact avec une seule source (T_i = T_f seulement)<\/td><\/tr><tr><th>6<\/th><td>cyclique<\/td><td class=\"h1\">état final = état initial<\/td><\/tr><\/table><\/figure><ul>\n<li><strong>Quasi-statique<\/strong> : suite d&#39;états d&#39;équilibre infiniment proches ; les variables sont définies à chaque instant.<\/li>\n<li><strong>Réversible<\/strong> : quasi-statique <strong>et<\/strong> on peut repasser par les mêmes états en sens inverse.<\/li>\n<li>Toute transformation réelle est <strong>irréversible<\/strong> : frottements, effet Joule, réactions chimiques, transferts dus à des différences de T ou de concentration.<\/li>\n<\/ul>\n<aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Quasi-statique n&#39;implique pas réversible. Le prof donne l&#39;exemple du fil étiré au-delà de sa limite d&#39;élasticité : lent, mais irréversible.<\/p>\n<\/aside><p>Unités utiles : 1 bar = $10^5$ Pa ; 1 atm = 1,01325 × $10^5$ Pa = 760 mmHg ; 1 kWh = 3600 kJ ; 1 cal ≈ 4,18 J.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Coefficients<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Un gaz vérifie $\\alpha = 1/T$ et $\\chi_T = 1/P$. Quelle est son équation d&#39;état ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice<\/button><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-h\" hidden><p>Écris dV/V = α dT − χ_T dP.<\/p>\n<\/div><div class=\"ex-c\" hidden><p>$\\frac{dV}{V} = \\frac{dT}{T} - \\frac{dP}{P}$, donc $\\ln V = \\ln T - \\ln P + C$, soit $PV/T = $ constante : gaz parfait, $PV = nRT$.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Calcule $\\beta$ pour un gaz parfait à 400 K.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.0025<\/b><\/p><p>$\\beta = 1/T = 1/400 = 2{,}5\\times10^{-3}\\ \\text{K}^{-1}$.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Convertis 3 atm en Pa.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$3 \\times 1{,}01325\\times10^5 \\approx 3{,}04\\times10^5$ Pa.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Pour un gaz parfait, $\\chi_T$ vaut :<\/div><button class=\"opt\" data-o=\"0\">$1/T$<\/button><button class=\"opt\" data-o=\"1\">$1/P$<\/button><button class=\"opt\" data-o=\"2\">$P$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">La relation entre les coefficients thermoélastiques est :<\/div><button class=\"opt\" data-o=\"0\">$\\alpha = \\chi_T\\beta P$<\/button><button class=\"opt\" data-o=\"1\">$\\beta = \\alpha\\chi_T P$<\/button><button class=\"opt\" data-o=\"2\">$\\chi_T = \\alpha\\beta P$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Le signe « − » dans $\\chi_T$ sert à :<\/div><button class=\"opt\" data-o=\"0\">rendre $\\chi_T$ négatif<\/button><button class=\"opt\" data-o=\"1\">rendre $\\chi_T$ positif, car V diminue quand P augmente<\/button><button class=\"opt\" data-o=\"2\">respecter la convention de signe des échanges<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">La température est une grandeur :<\/div><button class=\"opt\" data-o=\"0\">extensive<\/button><button class=\"opt\" data-o=\"1\">intensive<\/button><button class=\"opt\" data-o=\"2\">additive<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Une transformation isochore se fait à :<\/div><button class=\"opt\" data-o=\"0\">pression constante<\/button><button class=\"opt\" data-o=\"1\">volume constant<\/button><button class=\"opt\" data-o=\"2\">température constante<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Une transformation monotherme :<\/div><button class=\"opt\" data-o=\"0\">se fait à T constante<\/button><button class=\"opt\" data-o=\"1\">met le système en contact avec une seule source de chaleur<\/button><button class=\"opt\" data-o=\"2\">est toujours réversible<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Quelle affirmation est vraie ?<\/div><button class=\"opt\" data-o=\"0\">toute transformation quasi-statique est réversible<\/button><button class=\"opt\" data-o=\"1\">toute transformation réversible est quasi-statique<\/button><button class=\"opt\" data-o=\"2\">les transformations réelles sont réversibles<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">1 atm vaut :<\/div><button class=\"opt\" data-o=\"0\">$10^5$ Pa<\/button><button class=\"opt\" data-o=\"1\">$1{,}01325\\times10^5$ Pa<\/button><button class=\"opt\" data-o=\"2\">1 bar exactement<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Le principe zéro concerne :<\/div><button class=\"opt\" data-o=\"0\">la conservation de l&#39;énergie<\/button><button class=\"opt\" data-o=\"1\">l&#39;équilibre thermique<\/button><button class=\"opt\" data-o=\"2\">l&#39;entropie<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Lequel n&#39;est <strong>pas<\/strong> une cause d&#39;irréversibilité citée par le prof ?<\/div><button class=\"opt\" data-o=\"0\">frottements<\/button><button class=\"opt\" data-o=\"1\">effet Joule<\/button><button class=\"opt\" data-o=\"2\">compression infiniment lente sans frottement<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"coefficients-transformations","rep":null,"tol":null},{"n":"coefficients-transformations","rep":null,"tol":null},{"n":"coefficients-transformations","rep":["0.0025"],"tol":0.0001},{"n":"coefficients-transformations","rep":null,"tol":null}],"qcm":[{"n":"coefficients-transformations","q":"Pour un gaz parfait, $\\chi_T$ vaut :","o":["$1/T$","$1/P$","$P$"],"a":1,"e":"$-\\frac{1}{V}\\cdot(-\\frac{V}{P}) = \\frac{1}{P}$."},{"n":"coefficients-transformations","q":"La relation entre les coefficients thermoélastiques est :","o":["$\\alpha = \\chi_T\\beta P$","$\\beta = \\alpha\\chi_T P$","$\\chi_T = \\alpha\\beta P$"],"a":0,"e":"Démonstration à partir de la relation « −1 »."},{"n":"coefficients-transformations","q":"Le signe « − » dans $\\chi_T$ sert à :","o":["rendre $\\chi_T$ négatif","rendre $\\chi_T$ positif, car V diminue quand P augmente","respecter la convention de signe des échanges"],"a":1,"e":"$(\\partial V/\\partial P)_T &lt; 0$."},{"n":"coefficients-transformations","q":"La température est une grandeur :","o":["extensive","intensive","additive"],"a":1,"e":"Elle ne dépend pas de la quantité de matière."},{"n":"coefficients-transformations","q":"Une transformation isochore se fait à :","o":["pression constante","volume constant","température constante"],"a":1,"e":"Iso-chore : volume constant."},{"n":"coefficients-transformations","q":"Une transformation monotherme :","o":["se fait à T constante","met le système en contact avec une seule source de chaleur","est toujours réversible"],"a":1,"e":"Seules T initiale et T finale sont égales à celle de la source."},{"n":"coefficients-transformations","q":"Quelle affirmation est vraie ?","o":["toute transformation quasi-statique est réversible","toute transformation réversible est quasi-statique","les transformations réelles sont réversibles"],"a":1,"e":"Réversible = quasi-statique + retour possible par les mêmes états."},{"n":"coefficients-transformations","q":"1 atm vaut :","o":["$10^5$ Pa","$1{,}01325\\times10^5$ Pa","1 bar exactement"],"a":1,"e":"1 atm = 760 mmHg = 101 325 Pa."},{"n":"coefficients-transformations","q":"Le principe zéro concerne :","o":["la conservation de l&#39;énergie","l&#39;équilibre thermique","l&#39;entropie"],"a":1,"e":"Il justifie la mesure de température."},{"n":"coefficients-transformations","q":"Lequel n&#39;est <strong>pas<\/strong> une cause d&#39;irréversibilité citée par le prof ?","o":["frottements","effet Joule","compression infiniment lente sans frottement"],"a":2,"e":"C&#39;est au contraire le modèle de transformation réversible."}]},{"id":"premier-principe-travail","t":"Premier principe, travail et statique des fluides","seance":"Chapitre 2 (1re partie) · Premier principe de la thermodynamique","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir intégrer $\\int \\frac{dV}{V} = \\ln V$ et lire une aire sous une courbe.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Calcule $\\int_{V_1}^{V_2}\\frac{dV}{V}$ pour $V_2 = 2V_1$.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.693<\/b><\/p><p>$\\ln(V_2/V_1) = \\ln 2 \\approx 0{,}693$.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Le premier principe est un <strong>bilan de compte en banque<\/strong> : ce qui entre (W et Q reçus) fait varier le solde (U).<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Prendre la pression du gaz au lieu de la <strong>pression extérieure<\/strong> dans $\\delta W = -P_{ext}dV$. On ne remplace $P_{ext}$ par $P$ que si la transformation est quasi-statique.<\/p>\n<\/aside><p>À la fin, tu sais écrire $\\Delta U = W + Q$, calculer un travail de pression et utiliser $dP/dz = -\\rho g$.<\/p>\n<h2>Idée 1 · Conservation de l&#39;énergie<\/h2>\n<p>$$E = E_c + E_p + U \\qquad\\text{et, si } dE_c = dE_p = 0 :\\quad dU = \\delta W + \\delta Q$$<\/p>\n<ul>\n<li>Entre deux états d&#39;équilibre : $\\Delta U = W + Q$.<\/li>\n<li>Sur un <strong>cycle<\/strong> : $\\Delta U = 0$, donc $W + Q = 0$.<\/li>\n<li>$U$ (énergie interne) regroupe l&#39;énergie cinétique microscopique et l&#39;énergie potentielle d&#39;interaction des particules.<\/li>\n<\/ul>\n<p>Exemple : un gaz reçoit 500 J de chaleur et fournit 200 J de travail. $\\Delta U = -200 + 500 = 300$ J.<\/p>\n<aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>Le premier principe est aussi appelé <strong>principe d&#39;équivalence<\/strong> : il y a équivalence entre chaleur et travail.<\/p>\n<\/aside><h2>Idée 2 · Le travail des forces de pression<\/h2>\n<svg viewBox=\"0 0 400 220\" style=\"width:100%;max-width:480px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Diagramme de Clapeyron : le travail est l'aire sous la courbe P de V entre V1 et V2\">\n<line x1=\"50\" y1=\"190\" x2=\"380\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"50\" y1=\"190\" x2=\"50\" y2=\"15\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<path d=\"M100 50 Q170 130 320 150 L320 190 L100 190 Z\" fill=\"#D9824F\" opacity=\"0.35\"/>\n<path d=\"M100 50 Q170 130 320 150\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/>\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\"><text x=\"370\" y=\"208\">V<\/text><text x=\"30\" y=\"20\">P<\/text><text x=\"92\" y=\"208\">V₁<\/text><text x=\"312\" y=\"208\">V₂<\/text><text x=\"170\" y=\"175\">|W| = aire<\/text><\/g>\n<\/svg><p>Travail élémentaire : $\\delta W = -P_{ext}\\,dV$. En quasi-statique, $P_{ext} = P$ :<\/p>\n<p>$$W = -\\int_{V_1}^{V_2} P\\,dV$$<\/p>\n<ul>\n<li>Compression ($V_2 &lt; V_1$) : W &gt; 0, le gaz <strong>reçoit<\/strong> du travail.<\/li>\n<li>Détente ($V_2 &gt; V_1$) : W &lt; 0.<\/li>\n<li>Isochore : W = 0.<\/li>\n<li>Cycle : |W| = aire du cycle ; W &gt; 0 si le cycle est parcouru dans le sens trigonométrique, W &lt; 0 dans le sens horaire (cycle moteur).<\/li>\n<\/ul>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Calculer W pour une détente isotherme réversible<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Écrire P<\/div><p>$P = nRT/V$ (gaz parfait, T constante).<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Intégrer<\/div><p>$W = -nRT\\int_{V_1}^{V_2}\\frac{dV}{V} = -nRT\\ln\\frac{V_2}{V_1}$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Passer aux pressions<\/div><p>$P_1V_1 = P_2V_2$ donne $W = nRT\\ln\\frac{P_2}{P_1}$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Application<\/div><p>1 mol à 300 K, $P_1 = 10$ atm, $P_2 = 3$ atm : $W = 8{,}314\\times300\\times\\ln 0{,}3 \\approx -3003$ J.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p>Généralisation : $\\delta W = \\sum_i Y_i\\,dX_i$ (variable intensive × variation d&#39;une extensive) : fil $F\\,dl$, surface $A\\,d\\Sigma$, pile $E\\,dq$.<\/p>\n<h2>Idée 3 · Pression dans un fluide en équilibre<\/h2>\n<p>L&#39;équilibre d&#39;un petit volume $dx\\,dy\\,dz$ donne $\\partial P/\\partial x = \\partial P/\\partial y = 0$ et<\/p>\n<p>$$\\frac{dP}{dz} = -\\rho g$$<\/p>\n<p>(axe Oz vers le haut). Les plans horizontaux sont <strong>isobares<\/strong>.<\/p>\n<figure class=\"grille\"><figcaption>Deux cas<\/figcaption><table><tr><th><\/th><th>Fluide<\/th><th>ρ<\/th><th>Résultat<\/th><\/tr><tr><th>Incompressible (liquide)<\/th><td>constante<\/td><td class=\"h1\">$P_2 - P_1 = -\\rho g(z_2 - z_1)$<\/td><\/tr><tr><th>Compressible (gaz isotherme)<\/th><td>dépend de P<\/td><td class=\"h1\">$P(z) = P_0\\,e^{-(z-z_0)/H}$, $H = RT/(Mg)$<\/td><\/tr><\/table><\/figure><p>Exemples du prof : 1 m d&#39;eau ($\\rho = 10^3$ kg/m³, g = 10) donne $|\\Delta P| = 10^4$ Pa = 0,1 bar ; 1 m d&#39;air ($\\rho = 1{,}3$) seulement 13 Pa.<\/p>\n<p>Atmosphère : troposphère (0–10,5 km, T baisse d&#39;environ 6 °C/km), stratosphère (10,5–50 km, modèle isotherme T = 217 K), ionosphère (au-delà, pas de modèle simple).<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Travail et pression<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Un plongeur descend de 20 m dans l&#39;eau. De combien la pression augmente-t-elle ($\\rho = 10^3$, g = 10) ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 200000<\/b><\/p><p>$\\Delta P = \\rho g h = 10^3\\times10\\times20 = 2\\times10^5$ Pa = 2 bar.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Un gaz décrit un cycle et reçoit Q = −150 J. Que vaut W ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 150<\/b><\/p><p>Sur un cycle, $W + Q = 0$, donc W = +150 J.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Calcule l&#39;échelle de hauteur $H = RT/(Mg)$ pour l&#39;air (M = 0,029 kg/mol) à T = 217 K, g = 9,81.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$H = 8{,}314\\times217/(0{,}029\\times9{,}81) \\approx 6{,}34\\times10^3$ m, soit environ 6,3 km.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Un gaz reçoit 400 J de chaleur et fournit 100 J de travail. $\\Delta U$ vaut :<\/div><button class=\"opt\" data-o=\"0\">500 J<\/button><button class=\"opt\" data-o=\"1\">300 J<\/button><button class=\"opt\" data-o=\"2\">−300 J<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Sur un cycle :<\/div><button class=\"opt\" data-o=\"0\">$W = 0$ et $Q = 0$<\/button><button class=\"opt\" data-o=\"1\">$W + Q = 0$<\/button><button class=\"opt\" data-o=\"2\">$W = Q$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Le travail élémentaire des forces de pression s&#39;écrit :<\/div><button class=\"opt\" data-o=\"0\">$\\delta W = -P_{ext}\\,dV$<\/button><button class=\"opt\" data-o=\"1\">$\\delta W = P\\,dV$<\/button><button class=\"opt\" data-o=\"2\">$\\delta W = V\\,dP$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Lors d&#39;une compression, le travail reçu par le gaz est :<\/div><button class=\"opt\" data-o=\"0\">positif<\/button><button class=\"opt\" data-o=\"1\">négatif<\/button><button class=\"opt\" data-o=\"2\">nul<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Pour une transformation isochore :<\/div><button class=\"opt\" data-o=\"0\">W = Q<\/button><button class=\"opt\" data-o=\"1\">W = 0<\/button><button class=\"opt\" data-o=\"2\">Q = 0<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Un cycle parcouru dans le sens horaire dans (P, V) :<\/div><button class=\"opt\" data-o=\"0\">reçoit du travail<\/button><button class=\"opt\" data-o=\"1\">fournit du travail (W &lt; 0)<\/button><button class=\"opt\" data-o=\"2\">n&#39;échange pas de travail<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Dans un fluide au repos (Oz vers le haut) :<\/div><button class=\"opt\" data-o=\"0\">$dP/dz = \\rho g$<\/button><button class=\"opt\" data-o=\"1\">$dP/dz = -\\rho g$<\/button><button class=\"opt\" data-o=\"2\">$dP/dz = 0$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">10 m d&#39;eau correspondent à environ :<\/div><button class=\"opt\" data-o=\"0\">0,1 bar<\/button><button class=\"opt\" data-o=\"1\">1 bar<\/button><button class=\"opt\" data-o=\"2\">10 bar<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Le travail isotherme réversible d&#39;un gaz parfait vaut :<\/div><button class=\"opt\" data-o=\"0\">$nR(T_2 - T_1)$<\/button><button class=\"opt\" data-o=\"1\">$-nRT\\ln(V_2/V_1)$<\/button><button class=\"opt\" data-o=\"2\">$-P(V_2 - V_1)$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Le modèle de la stratosphère retenu par le prof est :<\/div><button class=\"opt\" data-o=\"0\">adiabatique<\/button><button class=\"opt\" data-o=\"1\">isotherme (T ≈ 217 K)<\/button><button class=\"opt\" data-o=\"2\">incompressible<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"premier-principe-travail","rep":["0.693"],"tol":0.01},{"n":"premier-principe-travail","rep":["200000"],"tol":1000},{"n":"premier-principe-travail","rep":["150"],"tol":null},{"n":"premier-principe-travail","rep":null,"tol":null}],"qcm":[{"n":"premier-principe-travail","q":"Un gaz reçoit 400 J de chaleur et fournit 100 J de travail. $\\Delta U$ vaut :","o":["500 J","300 J","−300 J"],"a":1,"e":"$\\Delta U = W + Q = -100 + 400$."},{"n":"premier-principe-travail","q":"Sur un cycle :","o":["$W = 0$ et $Q = 0$","$W + Q = 0$","$W = Q$"],"a":1,"e":"$\\Delta U = 0$ car U est une fonction d&#39;état."},{"n":"premier-principe-travail","q":"Le travail élémentaire des forces de pression s&#39;écrit :","o":["$\\delta W = -P_{ext}\\,dV$","$\\delta W = P\\,dV$","$\\delta W = V\\,dP$"],"a":0,"e":"Signe moins : une compression (dV &lt; 0) donne un travail reçu positif."},{"n":"premier-principe-travail","q":"Lors d&#39;une compression, le travail reçu par le gaz est :","o":["positif","négatif","nul"],"a":0,"e":"dV &lt; 0 donc $-P\\,dV &gt; 0$."},{"n":"premier-principe-travail","q":"Pour une transformation isochore :","o":["W = Q","W = 0","Q = 0"],"a":1,"e":"dV = 0."},{"n":"premier-principe-travail","q":"Un cycle parcouru dans le sens horaire dans (P, V) :","o":["reçoit du travail","fournit du travail (W &lt; 0)","n&#39;échange pas de travail"],"a":1,"e":"C&#39;est un cycle moteur."},{"n":"premier-principe-travail","q":"Dans un fluide au repos (Oz vers le haut) :","o":["$dP/dz = \\rho g$","$dP/dz = -\\rho g$","$dP/dz = 0$"],"a":1,"e":"La pression diminue quand on monte."},{"n":"premier-principe-travail","q":"10 m d&#39;eau correspondent à environ :","o":["0,1 bar","1 bar","10 bar"],"a":1,"e":"$10^3\\times10\\times10 = 10^5$ Pa."},{"n":"premier-principe-travail","q":"Le travail isotherme réversible d&#39;un gaz parfait vaut :","o":["$nR(T_2 - T_1)$","$-nRT\\ln(V_2/V_1)$","$-P(V_2 - V_1)$"],"a":1,"e":"On intègre $-nRT\\,dV/V$."},{"n":"premier-principe-travail","q":"Le modèle de la stratosphère retenu par le prof est :","o":["adiabatique","isotherme (T ≈ 217 K)","incompressible"],"a":1,"e":"Pas de courants verticaux, T presque constante."}]},{"id":"chaleur-calorimetrie","t":"Chaleur, enthalpie, calorimétrie et chaleur latente","seance":"Chapitre 2 (2e partie) · Premier principe de la thermodynamique","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir écrire le premier principe $dU = \\delta W + \\delta Q$ et $\\delta W = -P\\,dV$.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>À volume constant, que vaut $\\Delta U$ ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$W = 0$, donc $\\Delta U = Q_V$ : la chaleur échangée à volume constant.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>En calorimétrie, une seule équation : <strong>la somme de toutes les chaleurs échangées dans l&#39;enceinte isolée est nulle<\/strong>. Écris chaque terme comme « m c (T_final − T_initial) », sans réfléchir aux signes : ils sortent tout seuls.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Oublier le changement d&#39;état. Avant de calculer $T_f$, vérifie si la glace fond <strong>en entier<\/strong> : sinon $T_f = 0$ °C et l&#39;inconnue devient la masse fondue.<\/p>\n<\/aside><p>À la fin, tu sais utiliser H, les coefficients calorimétriques et résoudre un problème de calorimètre avec glace.<\/p>\n<h2>Idée 1 · Les coefficients calorimétriques<\/h2>\n<p>$$\\delta Q = mc_v\\,dT + \\ell\\,dV = mc_p\\,dT + h\\,dP = \\lambda\\,dP + \\mu\\,dV$$<\/p>\n<ul>\n<li>$c_v$, $c_p$ : chaleurs massiques (J·K⁻¹·kg⁻¹) à V ou P constant.<\/li>\n<li>$\\ell$ : coefficient de dilatation à T constante (Pa) ; $h$ : de compression à T constante (m³).<\/li>\n<li>Ces six coefficients ne sont pas indépendants : $\\ell = m(c_p - c_v)\\left(\\frac{\\partial T}{\\partial V}\\right)_P$ et $h = -m(c_p - c_v)\\left(\\frac{\\partial T}{\\partial P}\\right)_V$.<\/li>\n<li>Capacités totales : $C_V = mc_v = nC_{V,m}$, $C_P = mc_p = nC_{P,m}$ ; $\\gamma = C_P/C_V$ (coefficient de Laplace).<\/li>\n<\/ul>\n<h2>Idée 2 · L&#39;enthalpie H = U + PV<\/h2>\n<figure class=\"flux\"><figcaption>Pourquoi H est pratique<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">H = U + PV<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">dH = δQ + V dP (quasi-statique)<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">à P constante : ΔH = Q_P<\/div><\/div><\/figure><ul>\n<li>Isobare quasi-statique : $\\Delta H = Q_P$. Isochore : $\\Delta U = Q_V$.<\/li>\n<li>$dU = mc_v\\,dT + (\\ell - P)dV$ et $dH = mc_p\\,dT + (h + V)dP$.<\/li>\n<\/ul>\n<p>Capacités du cours :<\/p>\n<figure class=\"grille\"><figcaption>Valeurs à connaître<\/figcaption><table><tr><th><\/th><th>Cas<\/th><th>Valeur<\/th><th>Remarque<\/th><\/tr><tr><th>Solide<\/th><td>$C_m \\approx 3R \\approx 25$ J·K⁻¹·mol⁻¹<\/td><td class=\"h0\">Dulong et Petit<\/td><\/tr><tr><th>Eau liquide<\/th><td>c = 4187 J·K⁻¹·kg⁻¹<\/td><td class=\"h1\">la plus élevée<\/td><\/tr><tr><th>Éthanol<\/th><td>c ≈ 2500 J·K⁻¹·kg⁻¹<\/td><td class=\"h0\">liquide organique<\/td><\/tr><tr><th>Gaz monoatomique<\/th><td>$C_{P,m} = 5R/2$, $C_{V,m} = 3R/2$<\/td><td class=\"h1\">γ = 5/3 ≈ 1,67<\/td><\/tr><tr><th>Gaz diatomique<\/th><td>$C_{P,m} = 7R/2$, $C_{V,m} = 5R/2$<\/td><td class=\"h1\">γ = 7/5 = 1,4<\/td><\/tr><\/table><\/figure><h2>Idée 3 · Le calorimètre<\/h2>\n<svg viewBox=\"0 0 360 200\" style=\"width:100%;max-width:420px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Calorimètre : enceinte extérieure, couche d'air isolante, enceinte intérieure contenant l'eau, thermomètre et agitateur\">\n<rect x=\"70\" y=\"40\" width=\"220\" height=\"150\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<rect x=\"95\" y=\"60\" width=\"170\" height=\"115\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<rect x=\"97\" y=\"100\" width=\"166\" height=\"73\" fill=\"#D9824F\" opacity=\"0.3\"/>\n<rect x=\"60\" y=\"30\" width=\"240\" height=\"10\" fill=\"currentColor\"/>\n<line x1=\"140\" y1=\"5\" x2=\"140\" y2=\"150\" stroke=\"#D9824F\" stroke-width=\"3\"/><line x1=\"220\" y1=\"5\" x2=\"220\" y2=\"160\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<g font-family=\"sans-serif\" font-size=\"12\" fill=\"currentColor\"><text x=\"146\" y=\"16\">thermomètre<\/text><text x=\"226\" y=\"16\">agitateur<\/text><text x=\"150\" y=\"140\">eau<\/text><text x=\"300\" y=\"120\">air isolant<\/text><\/g>\n<\/svg><p>Le calorimètre est <strong>adiabatique<\/strong> : $\\sum Q_i = 0$ (et $\\Delta H = Q_P = 0$).<\/p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Méthode des mélanges (trouver c_p d'un solide)<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Écrire le bilan<\/div><p>$m_1c_p(\\theta_f - \\theta_1) + (M_{eau}c_{eau} + \\mu c_{eau})(\\theta_f - \\theta_2) = 0$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Repérer μ<\/div><p>$\\mu$ est la <strong>valeur en eau<\/strong> du calorimètre : il se comporte comme une masse μ d&#39;eau.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Isoler c_p<\/div><p>$c_p = \\frac{(M_{eau} + \\mu)c_{eau}(\\theta_f - \\theta_2)}{m_1(\\theta_1 - \\theta_f)}$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Mesurer μ avant<\/div><p>on mélange de l&#39;eau chaude $(m_1, \\theta_1)$ et froide $(m_2, \\theta_2)$ : $\\mu = m_1\\frac{\\theta_1 - \\theta_f}{\\theta_f - \\theta_2} - m_2$.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p>Méthode électrique (liquides) : une résistance R parcourue par I pendant Δt fournit $RI^2\\Delta t$, d&#39;où $c_l = \\frac{RI^2\\Delta t}{m_l(\\theta_f - \\theta_i)}$.<\/p>\n<h2>Idée 4 · Changements d&#39;état et chaleur latente<\/h2>\n<figure class=\"flux\"><figcaption>Les changements de phase<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">Solide<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">(fusion) Liquide<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">(vaporisation) Gaz<\/div><\/div><\/figure><p>Sens inverses : solidification, liquéfaction (condensation) ; solide ↔ gaz : sublimation / condensation.<\/p>\n<p>$$Q = mL$$<\/p>\n<ul>\n<li>$L$ en J/kg ; $L_f &gt; 0$, $L_s = -L_f$ ; $L_v &gt; 0$, $L_l = -L_v$.<\/li>\n<li>Le changement d&#39;état se fait <strong>à T constante<\/strong> pour une P donnée.<\/li>\n<li>Eau : $L_v = 537$ cal/g à 100 °C ; $L_f = 80$ cal/g à 0 °C (≈ 334 J/g).<\/li>\n<li>L&#39;eau bout à 100 °C sous 1 atm, 151 °C sous 5 bar, 6,7 °C sous 0,01 bar ; vers 85 °C à 4500 m.<\/li>\n<\/ul>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Calorimétrie<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>On mélange 100 g d&#39;eau à 80 °C et 200 g d&#39;eau à 20 °C (calorimètre parfait). Température finale ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 40<\/b><\/p><p>$100(\\theta - 80) + 200(\\theta - 20) = 0$, donc $\\theta = 40$ °C.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Chaleur pour fondre 50 g de glace à 0 °C ($L_f = 334$ J/g) ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 16700<\/b><\/p><p>$Q = 50\\times334 = 16\\,700$ J.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Un gaz diatomique parfait : que vaut γ ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1.4<\/b><\/p><p>$\\gamma = C_{P,m}/C_{V,m} = (7/2)/(5/2) = 1{,}4$.<\/p>\n<\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 9 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">À pression constante, la chaleur échangée (quasi-statique) est égale à :<\/div><button class=\"opt\" data-o=\"0\">$\\Delta U$<\/button><button class=\"opt\" data-o=\"1\">$\\Delta H$<\/button><button class=\"opt\" data-o=\"2\">$W$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">La définition de l&#39;enthalpie est :<\/div><button class=\"opt\" data-o=\"0\">$H = U + PV$<\/button><button class=\"opt\" data-o=\"1\">$H = U - PV$<\/button><button class=\"opt\" data-o=\"2\">$H = U + TS$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Pour un gaz parfait diatomique, $C_{V,m}$ vaut :<\/div><button class=\"opt\" data-o=\"0\">$3R/2$<\/button><button class=\"opt\" data-o=\"1\">$5R/2$<\/button><button class=\"opt\" data-o=\"2\">$7R/2$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Dans un calorimètre adiabatique :<\/div><button class=\"opt\" data-o=\"0\">la somme des chaleurs échangées est nulle<\/button><button class=\"opt\" data-o=\"1\">la température reste constante<\/button><button class=\"opt\" data-o=\"2\">seule l&#39;eau échange de la chaleur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">La valeur en eau μ d&#39;un calorimètre représente :<\/div><button class=\"opt\" data-o=\"0\">sa masse réelle<\/button><button class=\"opt\" data-o=\"1\">la masse d&#39;eau thermiquement équivalente au calorimètre<\/button><button class=\"opt\" data-o=\"2\">la masse d&#39;eau qu&#39;il contient<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Pendant la fusion de la glace sous 1 atm, la température :<\/div><button class=\"opt\" data-o=\"0\">augmente<\/button><button class=\"opt\" data-o=\"1\">reste à 0 °C<\/button><button class=\"opt\" data-o=\"2\">diminue<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">La chaleur latente de solidification vérifie :<\/div><button class=\"opt\" data-o=\"0\">$L_s = L_f$<\/button><button class=\"opt\" data-o=\"1\">$L_s = -L_f$<\/button><button class=\"opt\" data-o=\"2\">$L_s = 0$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Selon Dulong et Petit, la capacité molaire d&#39;un solide vaut environ :<\/div><button class=\"opt\" data-o=\"0\">R<\/button><button class=\"opt\" data-o=\"1\">3R<\/button><button class=\"opt\" data-o=\"2\">5R/2<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">En altitude (4500 m), l&#39;eau bout vers 85 °C parce que :<\/div><button class=\"opt\" data-o=\"0\">la pression est inférieure à 1 atm<\/button><button class=\"opt\" data-o=\"1\">la gravité est plus faible<\/button><button class=\"opt\" data-o=\"2\">l&#39;air est plus froid<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">La chaleur massique de l&#39;eau liquide est :<\/div><button class=\"opt\" data-o=\"0\">la plus faible des liquides<\/button><button class=\"opt\" data-o=\"1\">la plus élevée des liquides courants (≈ 4187 J·K⁻¹·kg⁻¹)<\/button><button class=\"opt\" data-o=\"2\">égale à celle de l&#39;éthanol<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"chaleur-calorimetrie","rep":null,"tol":null},{"n":"chaleur-calorimetrie","rep":["40"],"tol":null},{"n":"chaleur-calorimetrie","rep":["16700"],"tol":null},{"n":"chaleur-calorimetrie","rep":["1.4"],"tol":null}],"qcm":[{"n":"chaleur-calorimetrie","q":"À pression constante, la chaleur échangée (quasi-statique) est égale à :","o":["$\\Delta U$","$\\Delta H$","$W$"],"a":1,"e":"$dH = \\delta Q + V\\,dP$ et $dP = 0$."},{"n":"chaleur-calorimetrie","q":"La définition de l&#39;enthalpie est :","o":["$H = U + PV$","$H = U - PV$","$H = U + TS$"],"a":0,"e":"Définition du cours."},{"n":"chaleur-calorimetrie","q":"Pour un gaz parfait diatomique, $C_{V,m}$ vaut :","o":["$3R/2$","$5R/2$","$7R/2$"],"a":1,"e":"Et $C_{P,m} = 7R/2$."},{"n":"chaleur-calorimetrie","q":"Dans un calorimètre adiabatique :","o":["la somme des chaleurs échangées est nulle","la température reste constante","seule l&#39;eau échange de la chaleur"],"a":0,"e":"$\\sum Q_i = 0$."},{"n":"chaleur-calorimetrie","q":"La valeur en eau μ d&#39;un calorimètre représente :","o":["sa masse réelle","la masse d&#39;eau thermiquement équivalente au calorimètre","la masse d&#39;eau qu&#39;il contient"],"a":1,"e":"On remplace le calorimètre par une masse μ d&#39;eau."},{"n":"chaleur-calorimetrie","q":"Pendant la fusion de la glace sous 1 atm, la température :","o":["augmente","reste à 0 °C","diminue"],"a":1,"e":"Le changement d&#39;état se fait à T constante."},{"n":"chaleur-calorimetrie","q":"La chaleur latente de solidification vérifie :","o":["$L_s = L_f$","$L_s = -L_f$","$L_s = 0$"],"a":1,"e":"L&#39;eau rend en gelant la chaleur absorbée en fondant."},{"n":"chaleur-calorimetrie","q":"Selon Dulong et Petit, la capacité molaire d&#39;un solide vaut environ :","o":["R","3R","5R/2"],"a":1,"e":"≈ 25 J·K⁻¹·mol⁻¹."},{"n":"chaleur-calorimetrie","q":"En altitude (4500 m), l&#39;eau bout vers 85 °C parce que :","o":["la pression est inférieure à 1 atm","la gravité est plus faible","l&#39;air est plus froid"],"a":0,"e":"La température d&#39;ébullition dépend de la pression."},{"n":"chaleur-calorimetrie","q":"La chaleur massique de l&#39;eau liquide est :","o":["la plus faible des liquides","la plus élevée des liquides courants (≈ 4187 J·K⁻¹·kg⁻¹)","égale à celle de l&#39;éthanol"],"a":1,"e":"Remarque du prof."}]},{"id":"gaz-parfaits","t":"Propriétés énergétiques des gaz parfaits","seance":"Chapitre 3 · Propriétés énergétiques des gaz parfaits","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut connaître $\\Delta U = W + Q$, $W = -\\int P\\,dV$ et $H = U + PV$.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Pour un gaz parfait, que vaut $PV$ en fonction de n et T ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$PV = nRT$, avec R = 8,314 J·K⁻¹·mol⁻¹ (le TD prend parfois 8,32).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Pour un gaz parfait, <strong>U et H ne dépendent que de T<\/strong>. Donc, quelle que soit la transformation : $\\Delta U = nC_{V,m}\\Delta T$ et $\\Delta H = nC_{P,m}\\Delta T$. Il reste ensuite à trouver W ou Q.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Utiliser $PV^\\gamma = $ cte pour une transformation adiabatique <strong>brusque<\/strong> (irréversible). Laplace ne vaut que pour l&#39;adiabatique <strong>quasi-statique<\/strong> (réversible).<\/p>\n<\/aside><p>À la fin, tu sais traiter les quatre transformations classiques d&#39;un gaz parfait et utiliser Mayer, Laplace et Reech.<\/p>\n<h2>Idée 1 · Les lois de Joule<\/h2>\n<figure class=\"grille\"><figcaption>Les deux expériences<\/figcaption><table><tr><th><\/th><th>Expérience<\/th><th>Résultat mesuré<\/th><th>Conclusion<\/th><\/tr><tr><th>Joule–Gay-Lussac<\/th><td>détente dans le vide, enceinte isolée : W = 0, Q = 0<\/td><td>ΔT = 0<\/td><td class=\"h1\">U = U(T) : 1re loi de Joule<\/td><\/tr><tr><th>Joule–Thomson<\/th><td>détente à travers une paroi poreuse, P₁ &gt; P₂<\/td><td>ΔT = 0<\/td><td class=\"h1\">H = H(T) : 2e loi de Joule<\/td><\/tr><\/table><\/figure><ul>\n<li>1re détente : iso-énergétique ($\\Delta U = 0$). 2e détente : isenthalpique ($\\Delta H = 0$).<\/li>\n<li>Conséquences : $\\ell = P$, $h = -V$, $dU = mc_v\\,dT$, $dH = mc_p\\,dT$.<\/li>\n<li>Gaz réel : léger refroidissement observé.<\/li>\n<\/ul>\n<h2>Idée 2 · La relation de Mayer<\/h2>\n<p>$$H = U + nRT \\;\\Rightarrow\\; C_P - C_V = nR \\qquad C_{P,m} - C_{V,m} = R$$<\/p>\n<p>Avec $\\gamma$ : $C_{V,m} = \\frac{R}{\\gamma - 1}$, $C_{P,m} = \\frac{\\gamma R}{\\gamma - 1}$. Comme $C_P &gt; C_V$, $\\gamma &gt; 1$.<\/p>\n<p>Exemple : air ($\\gamma = 1{,}4$) : $C_{V,m} = 8{,}314/0{,}4 \\approx 20{,}8$ J·K⁻¹·mol⁻¹.<\/p>\n<h2>Idée 3 · Compression isotherme quasi-statique<\/h2>\n<p>T constante, donc $\\Delta U = 0$ et $Q = -W$.<\/p>\n<p>$$W = nRT\\ln\\frac{V_1}{V_2} = nRT\\ln\\frac{P_2}{P_1}$$<\/p>\n<p>Le rapport volumétrique $a = V_1/V_2$ : $a &gt; 1$ compression (W &gt; 0), $a &lt; 1$ détente. En compression isotherme, le gaz <strong>cède<\/strong> au milieu extérieur une chaleur égale au travail reçu.<\/p>\n<h2>Idée 4 · Adiabatique quasi-statique : la loi de Laplace<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Démonstration du cours<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Premier principe avec Q = 0<\/div><p>$nC_{V,m}\\,dT = -P\\,dV$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · Différentier PV = nRT<\/div><p>$\\frac{dP}{P} + \\frac{dV}{V} = \\frac{dT}{T}$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · Éliminer dT<\/div><p>$\\frac{dP}{P} + \\left(1 + \\frac{R}{C_{V,m}}\\right)\\frac{dV}{V} = 0$, soit $\\frac{dP}{P} + \\gamma\\frac{dV}{V} = 0$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · Intégrer (γ constant)<\/div><p>$PV^\\gamma = $ cte.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · Formes équivalentes<\/div><p>$TV^{\\gamma-1} = $ cte et $P^{1-\\gamma}T^\\gamma = $ cte.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><p>Travail : $W = \\Delta U = nC_{V,m}(T_2 - T_1) = \\frac{P_2V_2 - P_1V_1}{\\gamma - 1}$.<\/p>\n<aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend<\/div><p>Exemple du cours : air comprimé adiabatiquement avec $a = 10$, $T_1 = 293$ K, $\\gamma = 1{,}4$. $T_2 = T_1 a^{\\gamma-1} = 293\\times10^{0{,}4} \\approx 735{,}983$ K. Le prof veut 3 chiffres après la virgule.<\/p>\n<\/aside><svg viewBox=\"0 0 400 220\" style=\"width:100%;max-width:460px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Dans le diagramme P V, l'adiabatique est plus pentue que l'isotherme passant par le même point\">\n<line x1=\"50\" y1=\"195\" x2=\"380\" y2=\"195\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"50\" y1=\"195\" x2=\"50\" y2=\"10\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<path d=\"M90 25 Q140 150 340 165\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/>\n<path d=\"M150 70 Q200 145 340 165\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"6 4\"/>\n<circle cx=\"340\" cy=\"165\" r=\"5\" fill=\"currentColor\"/>\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\"><text x=\"370\" y=\"212\">V<\/text><text x=\"30\" y=\"18\">P<\/text><text x=\"98\" y=\"22\" fill=\"#D9824F\">adiabatique<\/text><text x=\"190\" y=\"95\">isotherme<\/text><\/g>\n<\/svg><h2>Idée 5 · Relation de Reech<\/h2>\n<p>Pente de l&#39;isotherme : $-P/V$. Pente de l&#39;adiabatique : $-\\gamma P/V$. L&#39;adiabatique est $\\gamma$ fois plus raide : à même rapport volumétrique, une compression adiabatique élève davantage la pression (et la température).<\/p>\n<p>$$\\frac{\\chi_T}{\\chi_{Q=0}} = \\gamma \\quad\\text{(relation de Reech)}$$<\/p>\n<p>Application : vitesse du son $v = \\sqrt{\\frac{\\gamma RT}{M}}$. Pour l&#39;air à 293 K : $v = \\sqrt{1{,}4\\times8{,}314\\times293/0{,}029} \\approx 343$ m/s.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Gaz parfaits<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Calcule $C_{P,m}$ d&#39;un gaz parfait de $\\gamma = 5/3$ (R = 8,314).<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 20.8<\/b><\/p><p>$C_{P,m} = \\gamma R/(\\gamma - 1) = (5/3)(8{,}314)/(2/3) = 2{,}5R \\approx 20{,}8$ J·K⁻¹·mol⁻¹.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Un moteur a un rapport volumétrique a = 9 ; air (γ = 1,4) aspiré à 300 K, compression adiabatique réversible. T en fin de compression ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 722<\/b><\/p><p>$T_2 = 300\\times9^{0{,}4} \\approx 722{,}4$ K.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>2 mol de gaz parfait sont comprimées de façon isotherme réversible à 300 K de 1 bar à 5 bar. Calcule Q.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>$W = nRT\\ln(P_2/P_1) = 2\\times8{,}314\\times300\\times\\ln5 \\approx 8029$ J, et $Q = -W \\approx -8029$ J : le gaz cède de la chaleur.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">La détente de Joule–Gay-Lussac est :<\/div><button class=\"opt\" data-o=\"0\">iso-énergétique ($\\Delta U = 0$)<\/button><button class=\"opt\" data-o=\"1\">isenthalpique<\/button><button class=\"opt\" data-o=\"2\">isobare<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">La détente de Joule–Thomson est :<\/div><button class=\"opt\" data-o=\"0\">iso-énergétique<\/button><button class=\"opt\" data-o=\"1\">isenthalpique ($\\Delta H = 0$)<\/button><button class=\"opt\" data-o=\"2\">isochore<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">La relation de Mayer s&#39;écrit :<\/div><button class=\"opt\" data-o=\"0\">$C_{P,m} - C_{V,m} = R$<\/button><button class=\"opt\" data-o=\"1\">$C_{P,m} + C_{V,m} = R$<\/button><button class=\"opt\" data-o=\"2\">$C_{P,m}/C_{V,m} = R$<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Pour une isotherme d&#39;un gaz parfait :<\/div><button class=\"opt\" data-o=\"0\">Q = 0<\/button><button class=\"opt\" data-o=\"1\">$\\Delta U = 0$<\/button><button class=\"opt\" data-o=\"2\">W = 0<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">La loi de Laplace $PV^\\gamma = $ cte vaut pour :<\/div><button class=\"opt\" data-o=\"0\">toute transformation adiabatique<\/button><button class=\"opt\" data-o=\"1\">une adiabatique quasi-statique d&#39;un gaz parfait (γ constant)<\/button><button class=\"opt\" data-o=\"2\">une isotherme<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Une forme équivalente de Laplace est :<\/div><button class=\"opt\" data-o=\"0\">$TV^\\gamma = $ cte<\/button><button class=\"opt\" data-o=\"1\">$TV^{\\gamma-1} = $ cte<\/button><button class=\"opt\" data-o=\"2\">$PT^\\gamma = $ cte<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Le travail d&#39;une adiabatique réversible vaut :<\/div><button class=\"opt\" data-o=\"0\">$\\frac{P_2V_2 - P_1V_1}{\\gamma - 1}$<\/button><button class=\"opt\" data-o=\"1\">$nRT\\ln(V_1/V_2)$<\/button><button class=\"opt\" data-o=\"2\">0<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Dans le diagramme (P, V), au même point :<\/div><button class=\"opt\" data-o=\"0\">l&#39;isotherme est plus pentue<\/button><button class=\"opt\" data-o=\"1\">l&#39;adiabatique est γ fois plus pentue<\/button><button class=\"opt\" data-o=\"2\">les deux ont la même pente<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Air, $T_1 = 293$ K, a = 10, γ = 1,4 : $T_2$ vaut environ :<\/div><button class=\"opt\" data-o=\"0\">410 K<\/button><button class=\"opt\" data-o=\"1\">736 K<\/button><button class=\"opt\" data-o=\"2\">2930 K<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">En compression isotherme, le gaz :<\/div><button class=\"opt\" data-o=\"0\">reçoit de la chaleur<\/button><button class=\"opt\" data-o=\"1\">cède de la chaleur égale au travail reçu<\/button><button class=\"opt\" data-o=\"2\">n&#39;échange pas de chaleur<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"gaz-parfaits","rep":null,"tol":null},{"n":"gaz-parfaits","rep":["20.8"],"tol":0.1},{"n":"gaz-parfaits","rep":["722"],"tol":2},{"n":"gaz-parfaits","rep":null,"tol":null}],"qcm":[{"n":"gaz-parfaits","q":"La détente de Joule–Gay-Lussac est :","o":["iso-énergétique ($\\Delta U = 0$)","isenthalpique","isobare"],"a":0,"e":"W = 0 et Q = 0."},{"n":"gaz-parfaits","q":"La détente de Joule–Thomson est :","o":["iso-énergétique","isenthalpique ($\\Delta H = 0$)","isochore"],"a":1,"e":"Bilan avec les travaux de poussée $P_1V_1$ et $P_2V_2$."},{"n":"gaz-parfaits","q":"La relation de Mayer s&#39;écrit :","o":["$C_{P,m} - C_{V,m} = R$","$C_{P,m} + C_{V,m} = R$","$C_{P,m}/C_{V,m} = R$"],"a":0,"e":"Elle vient de $H = U + nRT$."},{"n":"gaz-parfaits","q":"Pour une isotherme d&#39;un gaz parfait :","o":["Q = 0","$\\Delta U = 0$","W = 0"],"a":1,"e":"U ne dépend que de T."},{"n":"gaz-parfaits","q":"La loi de Laplace $PV^\\gamma = $ cte vaut pour :","o":["toute transformation adiabatique","une adiabatique quasi-statique d&#39;un gaz parfait (γ constant)","une isotherme"],"a":1,"e":"Elle suppose la réversibilité."},{"n":"gaz-parfaits","q":"Une forme équivalente de Laplace est :","o":["$TV^\\gamma = $ cte","$TV^{\\gamma-1} = $ cte","$PT^\\gamma = $ cte"],"a":1,"e":"On remplace P par nRT/V."},{"n":"gaz-parfaits","q":"Le travail d&#39;une adiabatique réversible vaut :","o":["$\\frac{P_2V_2 - P_1V_1}{\\gamma - 1}$","$nRT\\ln(V_1/V_2)$","0"],"a":0,"e":"$W = \\Delta U = nC_{V,m}\\Delta T$."},{"n":"gaz-parfaits","q":"Dans le diagramme (P, V), au même point :","o":["l&#39;isotherme est plus pentue","l&#39;adiabatique est γ fois plus pentue","les deux ont la même pente"],"a":1,"e":"Pentes $-P/V$ et $-\\gamma P/V$."},{"n":"gaz-parfaits","q":"Air, $T_1 = 293$ K, a = 10, γ = 1,4 : $T_2$ vaut environ :","o":["410 K","736 K","2930 K"],"a":1,"e":"$293\\times10^{0{,}4} \\approx 735{,}98$ K."},{"n":"gaz-parfaits","q":"En compression isotherme, le gaz :","o":["reçoit de la chaleur","cède de la chaleur égale au travail reçu","n&#39;échange pas de chaleur"],"a":1,"e":"$Q = -W &lt; 0$."}]},{"id":"entropie-second-principe","t":"L'entropie et le second principe","seance":"Chapitre 4 · L'entropie et le second principe","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir écrire $\\delta Q$ pour un gaz parfait : $\\delta Q = nC_{V,m}dT + P\\,dV$.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Calcule $\\int_{T_1}^{T_2}\\frac{dT}{T}$ pour $T_1 = 300$ K, $T_2 = 600$ K.<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.693<\/b><\/p><p>$\\ln(600/300) = \\ln 2 \\approx 0{,}693$.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Le premier principe dit <strong>combien<\/strong> d&#39;énergie s&#39;échange ; le second dit <strong>dans quel sens<\/strong> les choses arrivent. L&#39;entropie de l&#39;univers ne peut qu&#39;augmenter.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Calculer $\\Delta S$ avec $\\int\\delta Q/T$ le long de la transformation <strong>réelle<\/strong> irréversible. S est une fonction d&#39;état : on calcule $\\Delta S$ sur un chemin <strong>réversible<\/strong> fictif reliant les mêmes états.<\/p>\n<\/aside><p>À la fin, tu sais calculer ΔS d&#39;un gaz parfait et d&#39;un corps au contact d&#39;un thermostat, et énoncer Clausius et Kelvin.<\/p>\n<h2>Idée 1 · Pourquoi un second principe<\/h2>\n<p>Le premier principe ne distingue pas ces sens :<\/p>\n<figure class=\"flux\"><figcaption>Ce qui se produit seul, jamais l'inverse<\/figcaption><div class=\"flux-l\"><div class=\"flux-b\">corps chaud + corps froid<\/div><div class=\"flux-f\">→<\/div><div class=\"flux-b\">températures égales<\/div><\/div><\/figure><ul>\n<li>Un morceau de glace fond dans un verre d&#39;eau ; l&#39;inverse n&#39;arrive pas.<\/li>\n<li>Les molécules détendues dans le vide ne reviennent pas dans le compartiment de départ.<\/li>\n<li>La chaleur dissipée par frottement ne se retransforme pas en travail.<\/li>\n<\/ul>\n<h2>Idée 2 · La définition de l&#39;entropie<\/h2>\n<p>Il existe une fonction d&#39;état extensive S (J/K) telle que<\/p>\n<p>$$dS = \\frac{\\delta Q_{rev}}{T}$$<\/p>\n<figure class=\"grille\"><figcaption>Conséquences<\/figcaption><table><tr><th><\/th><th>Situation<\/th><th>Résultat<\/th><\/tr><tr><th>Cycle<\/th><td>$\\Delta S = 0$<\/td><td class=\"h0\">S fonction d'état<\/td><\/tr><tr><th>Adiabatique réversible<\/th><td>$dS = 0$<\/td><td class=\"h1\">isentropique<\/td><\/tr><tr><th>Irréversible<\/th><td>$dS &gt; \\delta Q/T$<\/td><td class=\"h1\">création d'entropie<\/td><\/tr><tr><th>Système isolé<\/th><td>$\\Delta S \\ge 0$<\/td><td class=\"h1\">maximal à l'équilibre<\/td><\/tr><\/table><\/figure><p>Interprétation : S mesure le <strong>désordre<\/strong> microscopique. Fusion, vaporisation, échauffement font augmenter S.<\/p>\n<h2>Idée 3 · Entropie d&#39;un gaz parfait<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Les deux formules du cours<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · Variables (T, V)<\/div><p>$dS = nC_{V,m}\\frac{dT}{T} + nR\\frac{dV}{V}$, donc $\\Delta S = nC_{V,m}\\ln\\frac{T_f}{T_i} + nR\\ln\\frac{V_f}{V_i}$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · Variables (T, P)<\/div><p>$dS = nC_{P,m}\\frac{dT}{T} - nR\\frac{dP}{P}$, donc $\\Delta S = nC_{P,m}\\ln\\frac{T_f}{T_i} - nR\\ln\\frac{P_f}{P_i}$.<\/p>\n<\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · Exemple<\/div><p>1 mol, isotherme, volume doublé : $\\Delta S = R\\ln 2 \\approx 5{,}76$ J/K.<\/p>\n<\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Idée 4 · Corps froid au contact d&#39;un thermostat<\/h2>\n<p>Un corps (m, c, $T_1$) est mis en contact avec un thermostat à $T_0$, à P constante.<\/p>\n<ul>\n<li>Corps : $\\Delta S_{corps} = mc\\ln\\frac{T_0}{T_1}$.<\/li>\n<li>Thermostat (T fixe, reçoit $-Q_{corps}$) : $\\Delta S_{th} = -\\frac{mc(T_0 - T_1)}{T_0}$.<\/li>\n<li>Univers : $\\Delta S_{univ} = mc\\left(\\frac{T_1}{T_0} - 1 - \\ln\\frac{T_1}{T_0}\\right) = mc\\,f(x)$ avec $x = T_1/T_0$ et $f(x) = x - 1 - \\ln x$.<\/li>\n<\/ul>\n<svg viewBox=\"0 0 400 210\" style=\"width:100%;max-width:440px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Courbe de f de x égale x moins 1 moins ln x, positive avec un minimum nul en x égale 1\">\n<line x1=\"40\" y1=\"180\" x2=\"380\" y2=\"180\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"40\" y1=\"190\" x2=\"40\" y2=\"10\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<path d=\"M52 20 Q110 175 150 180 Q260 172 375 95\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/>\n<circle cx=\"150\" cy=\"180\" r=\"5\" fill=\"currentColor\"/>\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\"><text x=\"146\" y=\"200\">1<\/text><text x=\"370\" y=\"200\">x<\/text><text x=\"250\" y=\"110\">f(x) = x − 1 − ln x ≥ 0<\/text><\/g>\n<\/svg><p>$f'(x) = 1 - 1/x$ : f décroît sur ]0, 1[, croît ensuite, minimum $f(1) = 0$. Donc $\\Delta S_{univ} \\ge 0$, nul seulement si $T_1 = T_0$.<\/p>\n<p>Exemple : 1 kg d&#39;eau (c = 4180) à 280 K mis au contact d&#39;un thermostat à 350 K : $x = 0{,}8$, $f = 0{,}8 - 1 - \\ln 0{,}8 \\approx 0{,}0231$, $\\Delta S_{univ} \\approx 96{,}7$ J/K.<\/p>\n<h2>Idée 5 · Inégalité de Clausius, énoncés de Clausius et Kelvin<\/h2>\n<ul>\n<li>Système isolé : $\\Delta S_{système} = \\Delta S_{corps} + \\Delta S_{sources} \\ge 0$.<\/li>\n<li>Avec plusieurs sources isothermes : $\\sum_i \\frac{Q_i}{T_i} \\le \\Delta S_{corps}$ ; sur un <strong>cycle<\/strong>, $\\sum_i \\frac{Q_i}{T_i} \\le 0$ (inégalité de Clausius). Égalité si tout est réversible.<\/li>\n<\/ul>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir<\/div><p><strong>Clausius<\/strong> : la chaleur ne passe pas spontanément d&#39;un corps froid à un corps chaud. <strong>Kelvin<
