<script>
const MODULE={"slug":"analyse-numerique","titre":"Analyse numérique","cle":"analyse-numerique_scores","cleEtat":"analyse-numerique_scores_etat","format":"score10","intro":"<p>Ce module suit <strong>les chapitres 0 à 4 du Pr Laaribi</strong> (arithmétique de l&#39;ordinateur, équations non linéaires, méthodes directes et itératives pour les systèmes) et corrige les <strong>séries 1 à 4</strong>.</p>\n<p><strong>Comment l&#39;utiliser</strong></p>\n<ol>\n<li>Chaque chapitre a trois temps : prérequis, façon d&#39;aborder, idées illustrées.</li>\n<li>Chaque méthode est illustrée par un exemple chiffré calculé en Python : refais-le à la main, puis compare.</li>\n<li>Fais le QCM du chapitre. <strong>8/10 = chapitre maîtrisé.</strong></li>\n<li>Termine par l&#39;examen blanc (1 h 30), construit sur les annales 2022/23 et 2023/24.</li>\n</ol>\n<p><strong>À savoir</strong> : les encadrés « Attention » signalent des erreurs trouvées dans les diapos (avec la correction) et ce qui a été ajouté hors supports, comme le chapitre sur l&#39;interpolation.</p>\n","annexes":[],"cartes":null,"maths":true};
const CHAPS=[{"id":"arithmetique-ordinateur","t":"Introduction et arithmétique de l'ordinateur","seance":"Chapitres 0 et 1 · Introduction, arithmétique de l'ordinateur","imp":4,"html":"<h2>Avant de commencer</h2>\n<p>Il te faut savoir écrire un nombre en puissances de 10 : $4526 = 4\\times10^3 + 5\\times10^2 + 2\\times10 + 6$. Tout le chapitre fait la même chose en base 2.</p>\n<section class=\"exo\"><h3>Vérifie ton prérequis</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Écris $0.0523$ sous la forme $0.d_1d_2d_3 \\times 10^e$ avec $d_1 \\neq 0$.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Décale la virgule jusqu&#39;à ce que le premier chiffre après la virgule soit non nul.</p>\n</div><div class=\"ex-c\" hidden><p>$0.0523 = 0.523 \\times 10^{-1}$. C&#39;est exactement la « forme normalisée » du cours.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Comment aborder ce chapitre</h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p><strong>L&#39;ordinateur ne connaît pas les réels.</strong> Il ne stocke qu&#39;un nombre fini de chiffres. Chaque nombre et chaque opération sont donc arrondis. Le chapitre t&#39;apprend à mesurer et à prévoir ces petites erreurs.</p>\n</aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>Croire qu&#39;un calcul « juste en théorie » donne un résultat juste en machine. La suite $u_{n+1} = 1 - 2u_n$ avec $u_0 = 1/3$ est constante en théorie, et pourtant elle explose en machine.</p>\n</aside><p>À la fin, tu sais convertir entre bases, coder un entier en complément à 2, normaliser un flottant, calculer erreur absolue et relative, et expliquer absorption, non-distributivité et instabilité.</p>\n<h2>Idée 1 · Pourquoi l&#39;analyse numérique</h2>\n<figure class=\"flux\"><figcaption>Démarche d'un problème scientifique (chapitre 0)</figcaption><div class=\"flux-l\"><div class=\"flux-b\">Phénomène réel</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Modèle mathématique</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Analyse numérique</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Implémentation informatique</div><div class=\"flux-f\">→</div><div class=\"flux-b\">Résultat</div></div></figure><p>L&#39;analyse numérique sert quand la solution exacte est <strong>inaccessible</strong> : équation sans formule ($x = \\cos x$), intégrale impossible à calculer, équation différentielle trop complexe. On construit alors une <strong>approximation fiable</strong>, et on étudie sa <strong>convergence</strong>, sa <strong>stabilité</strong> et son <strong>coût</strong>.</p>\n<pre class=\"\"><code>import math\nx = 1.0\nfor n in range(1, 31):\n    x = math.cos(x)\n    if n in (1, 2, 10, 30):\n        print(n, round(x, 6))</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>1 0.540302\n2 0.857553\n10 0.744237\n30 0.739087</code></pre><p>C&#39;est l&#39;exemple du prof : la suite $x_{n+1} = \\cos(x_n)$ s&#39;approche de la solution de $x = \\cos x$, environ $0.739085$.</p>\n<h2>Idée 2 · Trois sources d&#39;erreurs</h2>\n<figure class=\"grille\"><figcaption>D'où viennent les erreurs</figcaption><table><tr><th>Source</th><th>Exemple</th></tr><tr><td>Données</td><td>mesures</td><td>imprécises,</td><td>bruit</td></tr><tr><td>Méthode</td><td>troncature,</td><td>discrétisation</td></tr><tr><td class=\"h1\">Machine</td><td>arrondis,</td><td>overflow,</td><td>underflow</td></tr></table></figure><ul>\n<li><strong>Conditionnement</strong> : sensibilité du <strong>problème</strong> aux perturbations des données. Exemple du prof : $f(x) = \\frac{1}{1-x}$ donne $f(0.99) = 100$ mais $f(0.991) \\approx 111.11$.</li>\n<li><strong>Stabilité</strong> : un <strong>algorithme</strong> est stable s&#39;il n&#39;amplifie pas les erreurs d&#39;arrondi.</li>\n</ul>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p>Un problème bien conditionné peut être mal résolu si l&#39;algorithme est instable.</p>\n</aside><h2>Idée 3 · Entiers : bases et complément à 2</h2>\n<p>Conversion décimal → base $b$ : divisions successives par $b$, on lit les restes <strong>de bas en haut</strong>.</p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Coder −12 sur 5 bits en complément à 2</figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Écrire |x| en binaire</div><p>$12 = (01100)_2$ sur 5 bits.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Inverser tous les bits</div><p>$01100 \\to 10011$.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Ajouter 1</div><p>$10011 + 1 = 10100$. Donc $-12 = (10100)_2$.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Vérifier</div><p>On stocke $2^5 + x = 32 - 12 = 20 = (10100)_2$. Même résultat.</p>\n</div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><pre class=\"\"><code>def c2(x, n):\n    return format((2**n + x) % 2**n, f&quot;0{n}b&quot;)\n\nprint(bin(42), oct(57), hex(57))\nprint(c2(-12, 5), c2(-13, 6))\nprint(&quot;intervalle 8 bits :&quot;, -2**7, 2**7 - 1)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>0b101010 0o71 0x39\n10100 110011\nintervalle 8 bits : -128 127</code></pre><p>Sur $n$ bits signés : $-2^{n-1} \\le x \\le 2^{n-1} - 1$. Au-delà, <strong>dépassement</strong> : sur 8 bits, $72 + 59 = 131$ devient $-125$.</p>\n<h2>Idée 4 · Réels : virgule flottante normalisée</h2>\n<p>Partie fractionnaire → binaire : on <strong>multiplie par 2</strong> et on garde la partie entière.</p>\n<figure class=\"grille\"><figcaption>0.375 en binaire</figcaption><table><tr><th>Calcul</th><th>Bit</th></tr><tr><td>2</td><td>×</td><td>0.375</td><td>=</td><td>0.75</td><td class=\"h1\">0</td></tr><tr><td>2</td><td>×</td><td>0.75</td><td>=</td><td>1.5</td><td class=\"h1\">1</td></tr><tr><td>2</td><td>×</td><td>0.5</td><td>=</td><td>1.0</td><td class=\"h1\">1</td></tr></table></figure><p>Donc $0.375 = (0.011)_2$ et $3.375 = (11.011)_2$. Mais $0.1 = (0.000110011\\ldots)_2$ : <strong>infini et périodique</strong>. D&#39;où le fameux $0.1 + 0.2 \\neq 0.3$.</p>\n<p>Forme normalisée : $x = (-1)^s\\, m \\times B^e$, $m = 0.d_1d_2\\ldots d_t$ avec $d_1 \\neq 0$, donc $B^{-1} \\le m &lt; 1$.</p>\n<table>\n<thead>\n<tr>\n<th>Format</th>\n<th>Signe</th>\n<th>Exposant</th>\n<th>Mantisse</th>\n<th>$x_{max}$</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Simple (32 bits)</td>\n<td>1</td>\n<td>8</td>\n<td>23</td>\n<td>$\\approx 3.4\\times10^{38}$</td>\n</tr>\n<tr>\n<td>Double (64 bits)</td>\n<td>1</td>\n<td>11</td>\n<td>52</td>\n<td>$\\approx 1.8\\times10^{308}$</td>\n</tr>\n</tbody></table>\n<pre class=\"\"><code>from fractions import Fraction\nprint(0.1 + 0.2, 0.1 + 0.2 == 0.3)\nprint(Fraction(0.1))\nprint(float(int(&quot;11001&quot;, 2) + Fraction(0b01101, 2**5)))\nprint(float(0x1AC + Fraction(0x2B, 256)))</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>0.30000000000000004 False\n3602879701896397/36028797018963968\n25.40625\n428.16796875</code></pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>Dans la diapo 22, $(1AC.2B)_{16}$ est converti en $428.1250000078093$. C&#39;est faux : $428 + \\frac{2}{16} + \\frac{11}{256} = 428.16796875$ (vérifié ci-dessus).</p>\n</aside><h2>Idée 5 · Arrondi, erreur absolue et relative</h2>\n<p>Avec $t$ chiffres : on garde $d_1\\ldots d_t$ ; si $d_{t+1} \\ge B/2$ on ajoute $B^{-t}$ (arrondi), sinon on coupe.</p>\n<ul>\n<li>Erreur absolue : $\\Delta x = |x - fl(x)|$ (la quantité d&#39;erreur).</li>\n<li>Erreur relative : $\\delta x = \\Delta x / |x|$ (l&#39;importance de l&#39;erreur, souvent en %).</li>\n</ul>\n<pre class=\"\"><code>x, fx = 0.3147, 0.315\nda = abs(x - fx)\nprint(round(da, 6), round(da / abs(x), 6))</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>0.0003 0.000953</code></pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>La diapo 32 appelle « troncature » le premier cas de la règle. En réalité les deux cas forment <strong>l&#39;arrondi au plus proche</strong>. La troncature, c&#39;est couper <strong>toujours</strong>, sans regarder $d_{t+1}$ : $3.14159 \\to 3.14$ (TD 1).</p>\n</aside><h2>Idée 6 · Arithmétique flottante : absorption, non-distributivité</h2>\n<p>Chaque opération est arrondie : $x \\oplus y = fl(fl(x) + fl(y))$. Pour additionner, on <strong>aligne les exposants</strong> : le petit nombre perd ses chiffres.</p>\n<pre class=\"\"><code>def fl(x, t):\n    from math import floor, log10\n    if x == 0: return 0.0\n    e = floor(log10(abs(x))) + 1\n    return float(f&quot;{round(x / 10**e, t)}e{e}&quot;)\n\nprint(fl(76.54 + 0.004856, 4))                    # absorption, t = 4\nprint(fl(122 * fl(333 + 695, 3), 3))              # 122 x (333 + 695)\nprint(fl(fl(122 * 333, 3) + fl(122 * 695, 3), 3))  # 122x333 + 122x695\nprint(1e9 + 1e-9 == 1e9)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>76.54\n126000.0\n125000.0\nTrue</code></pre><p>Exemple du prof avec $t = 3$ : $0.126\\times10^6 \\neq 0.125\\times10^6$. La distributivité échoue, et « $x + y = x \\Rightarrow y = 0$ » n&#39;est plus vrai.</p>\n<h2>Idée 7 · Stabilité : la suite qui explose</h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Pourquoi u(n+1) = 1 − 2 u(n) explose</figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Théorie</div><p>Avec $u_0 = 1/3$, on a $u_n = 1/3$ pour tout $n$.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · Erreur initiale</div><p>La machine stocke $u_0 + \\epsilon_0$, avec $\\epsilon_0 \\approx 10^{-17}$.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · Propagation</div><p>$\\epsilon_n = -2\\,\\epsilon_{n-1}$, donc $\\epsilon_n = (-2)^n \\epsilon_0$.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · Explosion</div><p>Dès que $2^n \\approx 10^{16}$, soit $n \\approx 55$ à $60$, l&#39;erreur domine.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · Remède</div><p>Récurrence inversée $u_n = (1 - u_{n+1})/2$ : l&#39;erreur est <strong>divisée</strong> par 2 à chaque pas.</p>\n</div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><pre class=\"\"><code>u = 1/3\nfor n in range(1, 81):\n    u = 1 - 2*u\n    if n in (1, 10, 40, 60, 80):\n        print(n, u)\n\nv = 0.0                      # u100 très mal connu (erreur 1/3)\nfor n in range(99, 79, -1):\n    v = (1 - v) / 2\nprint(&quot;inversée u80 =&quot;, v)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>1 0.33333333333333337\n10 0.3333333333333144\n40 0.33331298828125\n60 -21.0\n80 -22369621.0\ninversée u80 = 0.33333301544189453</code></pre><aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend</div><p>Le prof insiste : <strong>un algorithme correct en théorie peut être inutilisable en pratique</strong>. Choisis toujours un algorithme stable.</p>\n</aside><h2>S&#39;exercer</h2>\n<section class=\"exo\"><h3>Exercices types (série 1)</h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Convertis $57$ en binaire, puis en octal et en hexadécimal.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>$57 = (111001)_2$. Groupes de 3 bits : $111\\,001 = (71)_8$. Groupes de 4 : $0011\\,1001 = (39)_{16}$. Vérification : $3\\times16 + 9 = 57$.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Représente $-13$ sur 6 bits en complément à 2 et donne l&#39;intervalle représentable.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>$13 = 001101$, inversé $110010$, $+1$ : $110011$. Intervalle $[-32, 31]$.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Normalise $12.75$ en binaire.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>$12 = 1100_2$, $0.75 = 0.11_2$, donc $12.75 = 1100.11_2 = 1.10011_2 \\times 2^3$ (ou $0.110011_2\\times 2^4$ en forme $0.d_1\\ldots$ du cours).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"4\"><div class=\"ex-q\"><p>Erreur relative si $x = 0.3147$ est arrondi à $0.315$ ? (en notation scientifique, 2 chiffres)</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0.00095</b></p><p>$\\Delta x = 0.0003$, $\\delta x = 0.0003 / 0.3147 \\approx 9.5\\times10^{-4}$.</p>\n</div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 9 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">$42$ s&#39;écrit en binaire :</div><button class=\"opt\" data-o=\"0\">$(110101)_2$</button><button class=\"opt\" data-o=\"1\">$(101010)_2$</button><button class=\"opt\" data-o=\"2\">$(100110)_2$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">$-12$ sur 5 bits en complément à 2 :</div><button class=\"opt\" data-o=\"0\">$11100$</button><button class=\"opt\" data-o=\"1\">$10100$</button><button class=\"opt\" data-o=\"2\">$01100$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Sur 8 bits signés, on représente :</div><button class=\"opt\" data-o=\"0\">$[0, 255]$</button><button class=\"opt\" data-o=\"1\">$[-128, 127]$</button><button class=\"opt\" data-o=\"2\">$[-127, 127]$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Pourquoi $0.1 + 0.2 \\neq 0.3$ en Python ?</div><button class=\"opt\" data-o=\"0\">Python a un bug d&#39;addition</button><button class=\"opt\" data-o=\"1\">$0.1$ a une écriture binaire infinie, donc il est arrondi</button><button class=\"opt\" data-o=\"2\">Les flottants n&#39;ont que 8 chiffres</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">$(0.375)_{10}$ en binaire :</div><button class=\"opt\" data-o=\"0\">$(0.101)_2$</button><button class=\"opt\" data-o=\"1\">$(0.011)_2$</button><button class=\"opt\" data-o=\"2\">$(0.0011)_2$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">En double précision, la mantisse occupe :</div><button class=\"opt\" data-o=\"0\">23 bits</button><button class=\"opt\" data-o=\"1\">11 bits</button><button class=\"opt\" data-o=\"2\">52 bits</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">$x = 0.2\\times10^{-3}$ et $fl(x) = 0.22\\times10^{-3}$. L&#39;erreur relative vaut :</div><button class=\"opt\" data-o=\"0\">$0.2\\times10^{-4}$</button><button class=\"opt\" data-o=\"1\">$10\\,\\%$</button><button class=\"opt\" data-o=\"2\">$1\\,\\%$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Le phénomène d&#39;absorption, c&#39;est :</div><button class=\"opt\" data-o=\"0\">un petit nombre ajouté à un grand qui disparaît</button><button class=\"opt\" data-o=\"1\">un dépassement de la plus grande valeur</button><button class=\"opt\" data-o=\"2\">une division par zéro</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">La suite $u_{n+1} = 1 - 2u_n$, $u_0 = 1/3$, calculée en machine :</div><button class=\"opt\" data-o=\"0\">reste égale à $1/3$</button><button class=\"opt\" data-o=\"1\">diverge à cause de l&#39;amplification de l&#39;erreur par 2</button><button class=\"opt\" data-o=\"2\">converge vers 0</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Le conditionnement mesure :</div><button class=\"opt\" data-o=\"0\">la vitesse d&#39;un algorithme</button><button class=\"opt\" data-o=\"1\">la sensibilité de la solution exacte aux perturbations des données</button><button class=\"opt\" data-o=\"2\">le nombre de bits de la mantisse</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"arithmetique-ordinateur","rep":null,"tol":null},{"n":"arithmetique-ordinateur","rep":null,"tol":null},{"n":"arithmetique-ordinateur","rep":null,"tol":null},{"n":"arithmetique-ordinateur","rep":null,"tol":null},{"n":"arithmetique-ordinateur","rep":["0.00095"],"tol":0.00002}],"qcm":[{"n":"arithmetique-ordinateur","q":"$42$ s&#39;écrit en binaire :","o":["$(110101)_2$","$(101010)_2$","$(100110)_2$"],"a":1,"e":"Divisions par 2 : restes 0,1,0,1,0,1 lus de bas en haut."},{"n":"arithmetique-ordinateur","q":"$-12$ sur 5 bits en complément à 2 :","o":["$11100$","$10100$","$01100$"],"a":1,"e":"$01100 \\to 10011 \\to 10100$."},{"n":"arithmetique-ordinateur","q":"Sur 8 bits signés, on représente :","o":["$[0, 255]$","$[-128, 127]$","$[-127, 127]$"],"a":1,"e":"$[-2^7, 2^7 - 1]$, un seul zéro en complément à 2."},{"n":"arithmetique-ordinateur","q":"Pourquoi $0.1 + 0.2 \\neq 0.3$ en Python ?","o":["Python a un bug d&#39;addition","$0.1$ a une écriture binaire infinie, donc il est arrondi","Les flottants n&#39;ont que 8 chiffres"],"a":1,"e":"$0.1 = (0.000110011\\ldots)_2$ ne tient pas dans 52 bits de mantisse."},{"n":"arithmetique-ordinateur","q":"$(0.375)_{10}$ en binaire :","o":["$(0.101)_2$","$(0.011)_2$","$(0.0011)_2$"],"a":1,"e":"$0.375 = 1/4 + 1/8$."},{"n":"arithmetique-ordinateur","q":"En double précision, la mantisse occupe :","o":["23 bits","11 bits","52 bits"],"a":2,"e":"1 + 11 + 52 = 64 bits."},{"n":"arithmetique-ordinateur","q":"$x = 0.2\\times10^{-3}$ et $fl(x) = 0.22\\times10^{-3}$. L&#39;erreur relative vaut :","o":["$0.2\\times10^{-4}$","$10\\,\\%$","$1\\,\\%$"],"a":1,"e":"$\\Delta x = 0.2\\times10^{-4}$, divisé par $0.2\\times10^{-3}$ : $0.1$."},{"n":"arithmetique-ordinateur","q":"Le phénomène d&#39;absorption, c&#39;est :","o":["un petit nombre ajouté à un grand qui disparaît","un dépassement de la plus grande valeur","une division par zéro"],"a":0,"e":"Après alignement des exposants, les chiffres du petit nombre sortent de la mantisse."},{"n":"arithmetique-ordinateur","q":"La suite $u_{n+1} = 1 - 2u_n$, $u_0 = 1/3$, calculée en machine :","o":["reste égale à $1/3$","diverge à cause de l&#39;amplification de l&#39;erreur par 2","converge vers 0"],"a":1,"e":"$\\epsilon_n = (-2)^n\\epsilon_0$ : vers $n \\approx 60$, l&#39;erreur dépasse la valeur."},{"n":"arithmetique-ordinateur","q":"Le conditionnement mesure :","o":["la vitesse d&#39;un algorithme","la sensibilité de la solution exacte aux perturbations des données","le nombre de bits de la mantisse"],"a":1,"e":"C&#39;est une propriété du problème, pas de l&#39;algorithme."}]},{"id":"separation-dichotomie","t":"Équations f(x) = 0 · séparation des racines et dichotomie","seance":"Chapitre 2 (1/3) · Résolution numérique des équations","imp":5,"html":"<h2>Avant de commencer</h2>\n<p>Il te faut le <strong>théorème des valeurs intermédiaires</strong> (TVI) et savoir dresser un tableau de variations.</p>\n<section class=\"exo\"><h3>Vérifie ton prérequis</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>$f(x) = x^3 + 2x^2 - 3x - 1$. Calcule $f(1)$ et $f(2)$. Que peux-tu conclure ?</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Regarde les signes.</p>\n</div><div class=\"ex-c\" hidden><p>$f(1) = -1 &lt; 0$ et $f(2) = 9 &gt; 0$. $f$ est continue, donc d&#39;après le TVI il existe une racine dans $]1, 2[$.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Comment aborder ce chapitre</h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p><strong>Toujours deux volets.</strong> D&#39;abord le volet mathématique : existe-t-il une racine, est-elle unique, où est-elle ? Ensuite seulement le volet numérique : construire une suite $(x_n)$ qui s&#39;en approche.</p>\n</aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>Appliquer la dichotomie sans avoir vérifié $f(a)f(b) &lt; 0$ et l&#39;unicité. Sans changement de signe, la méthode ne garantit rien ; sans monotonie, tu peux tomber sur une autre racine.</p>\n</aside><p>À la fin, tu sais isoler chaque racine dans un intervalle, appliquer la dichotomie et calculer à l&#39;avance le nombre d&#39;itérations.</p>\n<h2>Idée 1 · Séparer les racines</h2>\n<svg viewBox=\"0 0 360 170\" style=\"width:100%;max-width:460px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Une courbe continue négative en a et positive en b coupe l'axe entre a et b\">\n<line x1=\"20\" y1=\"100\" x2=\"340\" y2=\"100\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n<path d=\"M60 140 C 140 135, 190 110, 210 95 S 280 30, 310 20\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/>\n<g font-family=\"sans-serif\" font-size=\"13\" fill=\"currentColor\" text-anchor=\"middle\">\n<line x1=\"60\" y1=\"96\" x2=\"60\" y2=\"104\" stroke=\"currentColor\"/><text x=\"60\" y=\"120\">a</text><text x=\"78\" y=\"155\">f(a) &lt; 0</text>\n<line x1=\"310\" y1=\"96\" x2=\"310\" y2=\"104\" stroke=\"currentColor\"/><text x=\"310\" y=\"120\">b</text><text x=\"300\" y=\"14\">f(b) &gt; 0</text>\n<circle cx=\"214\" cy=\"100\" r=\"5\" fill=\"currentColor\"/><text x=\"214\" y=\"122\">r</text></g>\n</svg><aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p><strong>TVI</strong> : $f$ continue sur $[a,b]$ et $f(a)f(b) &lt; 0$ ⇒ au moins une racine dans $]a,b[$. Si de plus $f$ est <strong>strictement monotone</strong>, la racine est <strong>unique</strong>.</p>\n</aside><figure class=\"etapes\" data-i=\"0\"><figcaption>Séparer les racines de x³ − 3x − 1 = 0 (série 2, ex. 2)</figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · Dériver</div><p>$f'(x) = 3x^2 - 3 = 3(x-1)(x+1)$ : $f$ croît, décroît sur $[-1,1]$, puis croît.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · Valeurs clés</div><p>$f(-1) = 1 &gt; 0$, $f(1) = -3 &lt; 0$, $f(-2) = -3$, $f(2) = 1$.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · Conclure</div><p>Trois racines, une dans chacun des intervalles $]-2,-1[$, $]-1,1[$ (en fait $]-1,0[$ car $f(0) = -1$), $]1,2[$.</p>\n</div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><h2>Idée 2 · La dichotomie (bissection)</h2>\n<p>On coupe l&#39;intervalle en deux et on garde la moitié où $f$ change de signe.</p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Algorithme de dichotomie</figcaption><div class=\"etape\"><div class=\"et-t\">1/4 · Départ</div><p>$f(a)f(b) &lt; 0$, une seule racine $r$ dans $[a,b]$.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/4 · Milieu</div><p>$c = \\dfrac{a+b}{2}$.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/4 · Choix</div><p>Si $f(a)f(c) \\le 0$, alors $b \\leftarrow c$ ; sinon $a \\leftarrow c$.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">4/4 · Arrêt</div><p>On recommence tant que $|b - a| &gt; \\varepsilon$.</p>\n</div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><pre class=\"\"><code>def dichotomie(f, a, b, eps):\n    n = 0\n    while b - a &gt; eps:\n        c = (a + b) / 2\n        if f(a) * f(c) &lt;= 0:\n            b = c\n        else:\n            a = c\n        n += 1\n        if n &lt;= 4:\n            print(n, c, round(f(c), 4))\n    return (a + b) / 2, n\n\nr, n = dichotomie(lambda x: x**2 - 2, 1, 2, 1e-6)\nprint(&quot;racine ≈&quot;, round(r, 6), &quot;après&quot;, n, &quot;itérations&quot;)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>1 1.5 0.25\n2 1.25 -0.4375\n3 1.375 -0.1094\n4 1.4375 0.0664\nracine ≈ 1.414214 après 20 itérations</code></pre><p>Ce sont exactement les itérés du prof : $c_1 = 1.5$, $c_2 = 1.25$, $c_3 = 1.375$, $c_4 = 1.4375$.</p>\n<h2>Idée 3 · Combien d&#39;itérations ?</h2>\n<p>Après $n$ itérations, l&#39;intervalle mesure $\\dfrac{b-a}{2^n}$. Pour une précision $\\varepsilon$ :</p>\n<p>$$n \\ge \\frac{\\ln\\left(\\frac{b-a}{\\varepsilon}\\right)}{\\ln 2}$$</p>\n<pre class=\"\"><code>import math\nfor (a, b, eps) in [(1, 2, 1e-6), (2, 3, 1e-3), (4.4, 4.5, 1e-3)]:\n    n = math.log((b - a) / eps) / math.log(2)\n    print(a, b, eps, round(n, 2), &quot;-&gt;&quot;, math.ceil(n))</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>1 2 1e-06 19.93 -&gt; 20\n2 3 0.001 9.97 -&gt; 10\n4.4 4.5 0.001 6.64 -&gt; 7</code></pre><aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend</div><p>Le théorème du cours : $|c_n - r| \\le \\dfrac{b-a}{2^{n+1}}$. La dichotomie <strong>converge toujours</strong> (si $f(a)f(b) &lt; 0$), mais <strong>lentement</strong> : ordre 1, on gagne un bit par itération.</p>\n</aside><p>Critères d&#39;arrêt possibles : $|x_{n+1} - x_n| &lt; \\varepsilon$ ou $|f(x_n)| &lt; \\varepsilon$.</p>\n<h2>Idée 4 · Exemple d&#39;examen : tan x = x</h2>\n<p>Série 2, ex. 1 : $f(x) = \\tan x - x$ sur $]\\pi/2, 3\\pi/2[$. $f'(x) = \\tan^2 x \\ge 0$ donc $f$ croissante, de $-\\infty$ à $+\\infty$ : racine unique. $f(4.4) &lt; 0 &lt; f(4.5)$.</p>\n<pre class=\"\"><code>import math\nf = lambda x: math.tan(x) - x\nprint(round(f(4.4), 4), round(f(4.5), 4))\na, b = 4.4, 4.5\nwhile b - a &gt; 1e-3:\n    c = (a + b) / 2\n    a, b = (a, c) if f(a) * f(c) &lt;= 0 else (c, b)\nprint(round(a, 4), round(b, 4))</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>-1.3037 0.1373\n4.493 4.4938</code></pre><p>Donc $\\alpha \\approx 4.493$ à $10^{-3}$ près (7 itérations).</p>\n<h2>S&#39;exercer</h2>\n<section class=\"exo\"><h3>Exercices types</h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Nombre minimal d&#39;itérations de dichotomie sur $[1, 2]$ pour $\\varepsilon = 10^{-6}$ ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 20</b></p><p>$n \\ge \\ln(10^6)/\\ln 2 \\approx 19.93$, donc $n = 20$.</p>\n</div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Montre que $x^4 - 3x^3 - x^2 + 3x = 0$ a trois racines dans $[-1, 2]$ et sépare-les.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>Factorise par $x$ puis par $(x^2 - 1)$.</p>\n</div><div class=\"ex-c\" hidden><p>$f(x) = x(x-1)(x+1)(x-3)$. Racines $-1, 0, 1$ dans $[-1,2]$ ($3$ est hors de l&#39;intervalle). Le signe change sur $[-1,0]$, $[0,1]$, $[1,2]$.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Approche la plus grande racine de $x^3 - 3x - 1$ à $10^{-2}$ près par dichotomie sur $[1, 2]$.</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>7 itérations ($\\ln(100)/\\ln 2 \\approx 6.64$) : $\\alpha \\in [1.875, 1.8828]$, soit $\\alpha \\approx 1.88$ (valeur exacte $1.8794$).</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 7 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">La dichotomie exige au départ :</div><button class=\"opt\" data-o=\"0\">$f'(a) \\neq 0$</button><button class=\"opt\" data-o=\"1\">$f$ continue et $f(a)f(b) &lt; 0$</button><button class=\"opt\" data-o=\"2\">$f$ convexe</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Pour garantir l&#39;unicité de la racine dans $[a,b]$, il suffit que :</div><button class=\"opt\" data-o=\"0\">$f(a) &gt; 0$</button><button class=\"opt\" data-o=\"1\">$f$ soit strictement monotone sur $[a,b]$</button><button class=\"opt\" data-o=\"2\">$f$ soit continue</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Sur $[1,2]$ avec $f(x) = x^2 - 2$, le premier milieu est $c_1 = 1.5$ et $f(1.5) = 0.25$. Le nouvel intervalle est :</div><button class=\"opt\" data-o=\"0\">$[1, 1.5]$</button><button class=\"opt\" data-o=\"1\">$[1.5, 2]$</button><button class=\"opt\" data-o=\"2\">$[1.25, 1.5]$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Après 10 itérations sur un intervalle de longueur 1, la longueur vaut :</div><button class=\"opt\" data-o=\"0\">$1/10$</button><button class=\"opt\" data-o=\"1\">$1/1024$</button><button class=\"opt\" data-o=\"2\">$1/20$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Ordre de convergence de la dichotomie :</div><button class=\"opt\" data-o=\"0\">1</button><button class=\"opt\" data-o=\"1\">2</button><button class=\"opt\" data-o=\"2\">1.618</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Nombre d&#39;itérations pour $[2,3]$ et $\\varepsilon = 10^{-3}$ :</div><button class=\"opt\" data-o=\"0\">3</button><button class=\"opt\" data-o=\"1\">10</button><button class=\"opt\" data-o=\"2\">30</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Combien de racines réelles a $x^3 - 3x - 1$ ?</div><button class=\"opt\" data-o=\"0\">1</button><button class=\"opt\" data-o=\"1\">2</button><button class=\"opt\" data-o=\"2\">3</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Pour $\\tan x - x$ sur $]\\pi/2, 3\\pi/2[$, l&#39;unicité vient de :</div><button class=\"opt\" data-o=\"0\">$f'(x) = \\tan^2 x \\ge 0$</button><button class=\"opt\" data-o=\"1\">$f(4.4) &lt; 0$</button><button class=\"opt\" data-o=\"2\">$\\tan$ est périodique</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">La principale qualité de la dichotomie est :</div><button class=\"opt\" data-o=\"0\">sa rapidité</button><button class=\"opt\" data-o=\"1\">sa robustesse : elle converge toujours</button><button class=\"opt\" data-o=\"2\">elle n&#39;a pas besoin de deux points</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">$|c_n - r|$ est majoré par :</div><button class=\"opt\" data-o=\"0\">$(b-a)/n$</button><button class=\"opt\" data-o=\"1\">$(b-a)/2^{n+1}$</button><button class=\"opt\" data-o=\"2\">$(b-a)^n$</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"separation-dichotomie","rep":null,"tol":null},{"n":"separation-dichotomie","rep":["20"],"tol":null},{"n":"separation-dichotomie","rep":null,"tol":null},{"n":"separation-dichotomie","rep":null,"tol":null}],"qcm":[{"n":"separation-dichotomie","q":"La dichotomie exige au départ :","o":["$f'(a) \\neq 0$","$f$ continue et $f(a)f(b) &lt; 0$","$f$ convexe"],"a":1,"e":"C&#39;est l&#39;hypothèse du TVI."},{"n":"separation-dichotomie","q":"Pour garantir l&#39;unicité de la racine dans $[a,b]$, il suffit que :","o":["$f(a) &gt; 0$","$f$ soit strictement monotone sur $[a,b]$","$f$ soit continue"],"a":1,"e":"Une fonction strictement monotone coupe l&#39;axe au plus une fois."},{"n":"separation-dichotomie","q":"Sur $[1,2]$ avec $f(x) = x^2 - 2$, le premier milieu est $c_1 = 1.5$ et $f(1.5) = 0.25$. Le nouvel intervalle est :","o":["$[1, 1.5]$","$[1.5, 2]$","$[1.25, 1.5]$"],"a":0,"e":"$f(1)f(1.5) &lt; 0$ : la racine est à gauche."},{"n":"separation-dichotomie","q":"Après 10 itérations sur un intervalle de longueur 1, la longueur vaut :","o":["$1/10$","$1/1024$","$1/20$"],"a":1,"e":"$1/2^{10}$."},{"n":"separation-dichotomie","q":"Ordre de convergence de la dichotomie :","o":["1","2","1.618"],"a":0,"e":"Linéaire : l&#39;erreur est divisée par 2 à chaque pas."},{"n":"separation-dichotomie","q":"Nombre d&#39;itérations pour $[2,3]$ et $\\varepsilon = 10^{-3}$ :","o":["3","10","30"],"a":1,"e":"$\\ln(1000)/\\ln 2 \\approx 9.97$."},{"n":"separation-dichotomie","q":"Combien de racines réelles a $x^3 - 3x - 1$ ?","o":["1","2","3"],"a":2,"e":"Maximum local $f(-1) = 1 &gt; 0$, minimum local $f(1) = -3 &lt; 0$."},{"n":"separation-dichotomie","q":"Pour $\\tan x - x$ sur $]\\pi/2, 3\\pi/2[$, l&#39;unicité vient de :","o":["$f'(x) = \\tan^2 x \\ge 0$","$f(4.4) &lt; 0$","$\\tan$ est périodique"],"a":0,"e":"$f$ est croissante sur l&#39;intervalle."},{"n":"separation-dichotomie","q":"La principale qualité de la dichotomie est :","o":["sa rapidité","sa robustesse : elle converge toujours","elle n&#39;a pas besoin de deux points"],"a":1,"e":"Sûre mais lente."},{"n":"separation-dichotomie","q":"$|c_n - r|$ est majoré par :","o":["$(b-a)/n$","$(b-a)/2^{n+1}$","$(b-a)^n$"],"a":1,"e":"Théorème du cours : $r$ est dans un intervalle de longueur $(b-a)/2^n$ dont $c_n$ est le milieu."}]},{"id":"point-fixe","t":"Méthode du point fixe (approximations successives)","seance":"Chapitre 2 (2/3) · Résolution numérique des équations","imp":5,"html":"<h2>Avant de commencer</h2>\n<p>Il te faut savoir dériver et majorer $|g'(x)|$ sur un intervalle, et connaître le théorème des accroissements finis : $|g(x) - g(y)| = |g'(c)|\\,|x - y|$.</p>\n<section class=\"exo\"><h3>Vérifie ton prérequis</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Majore $|g'(x)|$ pour $g(x) = e^{-x}$ sur $[0.5, \\ln 2]$.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>$g'(x) = -e^{-x}$ ; $e^{-x}$ décroît.</p>\n</div><div class=\"ex-c\" hidden><p>$|g'(x)| = e^{-x} \\le e^{-0.5} \\approx 0.607 &lt; 1$ sur cet intervalle.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Comment aborder ce chapitre</h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p><strong>Tout se joue sur le choix de $g$.</strong> La même équation $f(x) = 0$ peut s&#39;écrire $x = g(x)$ de plusieurs façons : certaines convergent, d&#39;autres divergent. Ton travail est de choisir $g$ et l&#39;intervalle.</p>\n</aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>Vérifier seulement $|g'| &lt; 1$ en un point. Le théorème demande <strong>deux</strong> conditions sur tout l&#39;intervalle $I$ : $g(I) \\subset I$ (stabilité) <strong>et</strong> $\\sup_I |g'| = k &lt; 1$ (contraction).</p>\n</aside><p>À la fin, tu sais transformer une équation en $x = g(x)$, prouver la convergence, calculer les itérés et donner l&#39;ordre de convergence.</p>\n<h2>Idée 1 · Le principe : $x_{n+1} = g(x_n)$</h2>\n<p>Un point fixe de $g$ est un $r$ tel que $g(r) = r$. On transforme $f(x) = 0$ en $x = g(x)$, puis on itère.</p>\n<svg viewBox=\"0 0 320 220\" style=\"width:100%;max-width:420px;display:block;margin:10px auto\" role=\"img\" aria-label=\"Escalier entre la courbe y = g(x) et la droite y = x qui converge vers le point fixe\">\n<line x1=\"30\" y1=\"200\" x2=\"310\" y2=\"200\" stroke=\"currentColor\"/><line x1=\"30\" y1=\"200\" x2=\"30\" y2=\"10\" stroke=\"currentColor\"/>\n<line x1=\"30\" y1=\"200\" x2=\"220\" y2=\"10\" stroke=\"currentColor\" stroke-dasharray=\"5 4\"/>\n<path d=\"M30 110 C 100 90, 180 70, 300 55\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/>\n<path d=\"M270 200 L270 60 L60 60 L60 104 L104 104 L104 93 L93 93\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n<g font-family=\"sans-serif\" font-size=\"12\" fill=\"currentColor\"><text x=\"272\" y=\"214\">x0</text><text x=\"226\" y=\"18\">y = x</text><text x=\"250\" y=\"48\" fill=\"#D9824F\">y = g(x)</text><circle cx=\"97\" cy=\"97\" r=\"4\" fill=\"#D9824F\"/><text x=\"108\" y=\"130\">r</text></g>\n</svg><h2>Idée 2 · Le théorème du point fixe</h2>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p>Si $g(I) \\subset I$ (avec $I = [a,b]$) et s&#39;il existe $k &lt; 1$ tel que $|g'(x)| \\le k$ sur $I$, alors $g$ est <strong>contractante</strong> : $|g(x) - g(y)| \\le k|x - y|$. Elle a un unique point fixe $r$ dans $I$, et pour tout $x_0 \\in I$ : $|x_n - r| \\le k^n |x_0 - r| \\le k^n (b-a)$.</p>\n</aside><figure class=\"grille\"><figcaption>Que dit |g'(r)| ?</figcaption><table><tr><th>Cas</th><th>Comportement</th></tr><tr><td class=\"h1\"></td><td>g'(r)</td><td>&lt; 1 convergence (locale), linéaire en général</td></tr><tr><td></td><td>g'(r)</td><td>= 1 cas douteux : lent ou oscillations</td></tr><tr><td class=\"h2\"></td><td>g'(r)</td><td>&gt; 1 divergence</td></tr></table></figure><aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>La fiche « Things you&#39;ll need » écrit « $|F'(x)| &lt; 1 \\Rightarrow$ contractante ». Il faut en fait une <strong>borne uniforme</strong> : $\\sup_I |F'| = k &lt; 1$ sur un intervalle fermé (sinon $k$ peut valoir 1).</p>\n</aside><p>Exemples du cours avec $x^2 - 2x - 3 = 0$ (racines $-1$ et $3$) :</p>\n<ul>\n<li>$g(x) = \\sqrt{2x+3}$ : $g'(3) = 1/3 &lt; 1$, convergence vers 3.</li>\n<li>$g(x) = (x^2 - 3)/2$ : $g'(3) = 3$, divergence autour de 3 ; $g'(-1) = -1$, cas limite, convergence très lente vers $-1$.</li>\n</ul>\n<pre class=\"\"><code>import math\nx = 4.0\nfor n in range(1, 6):\n    x = math.sqrt(2*x + 3)\n    print(n, round(x, 5))\ny = 0.0\nfor n in range(1, 2001):\n    y = (y*y - 3) / 2\nprint(&quot;g2 après 2000 itérations :&quot;, round(y, 4))</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>1 3.31662\n2 3.10375\n3 3.03439\n4 3.01144\n5 3.00381\ng2 après 2000 itérations : -0.9682</code></pre><h2>Idée 3 · Exemple complet : $x = e^{-x}$ (série 2, ex. 3)</h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Méthode type d'examen</figcaption><div class=\"etape\"><div class=\"et-t\">1/6 · Existence/unicité</div><p>$f(x) = x - e^{-x}$, $f' = 1 + e^{-x} &gt; 0$, $f(0) = -1 &lt; 0$, $f(1) \\approx 0.63 &gt; 0$ : racine unique $\\alpha \\in ]0,1[$.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/6 · Pas contractante sur [0,1]</div><p>$|F'(0)| = e^0 = 1$ : pas de $k &lt; 1$.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/6 · Réduire l&#39;intervalle</div><p>$f(1/2) &lt; 0$ et $f(\\ln 2) = \\ln 2 - 1/2 &gt; 0$, donc $\\alpha \\in [1/2, \\ln 2]$.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">4/6 · Contraction</div><p>Sur $[1/2, \\ln 2]$, $|F'(x)| \\le e^{-1/2} \\approx 0.607 = k &lt; 1$.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">5/6 · Stabilité</div><p>$F$ décroissante : $F([1/2, \\ln 2]) = [1/2, e^{-1/2}] \\subset [1/2, \\ln 2]$ car $e^{-0.5} \\approx 0.607 &lt; 0.693$.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">6/6 · Conclure</div><p>Pour tout $x_0 \\in [1/2, \\ln 2]$, $x_{n+1} = e^{-x_n}$ converge vers $\\alpha$.</p>\n</div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><pre class=\"\"><code>import math\nx = 0.5\nfor n in range(1, 5):\n    x = math.exp(-x)\n    print(f&quot;x{n} = {x:.6f}&quot;)\nfor n in range(5, 40):\n    x = math.exp(-x)\nprint(&quot;alpha ≈&quot;, round(x, 6))</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>x1 = 0.606531\nx2 = 0.545239\nx3 = 0.579703\nx4 = 0.560065\nalpha ≈ 0.567143</code></pre><h2>Idée 4 · Ordre de convergence</h2>\n<p>La méthode est d&#39;ordre $p$ si $\\lim \\dfrac{|x_{n+1} - r|}{|x_n - r|^p} = C \\neq 0$.</p>\n<p>Pour le point fixe : $x_{n+1} - r = g(x_n) - g(r) \\approx g'(r)(x_n - r)$. Donc <strong>ordre 1</strong> si $g'(r) \\neq 0$, avec $C = |g'(r)|$ ; ordre $\\ge 2$ si $g'(r) = 0$ (c&#39;est le cas de Newton).</p>\n<pre class=\"\"><code>import math\nr = 0.5671432904097838\nx = 0.5\nfor n in range(6):\n    xn = math.exp(-x)\n    print(n, round(abs(xn - r) / abs(x - r), 4))\n    x = xn\nprint(&quot;|g'(r)| =&quot;, round(math.exp(-r), 4))</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>0 0.5866\n1 0.5561\n2 0.5734\n3 0.5636\n4 0.5692\n5 0.566\n|g'(r)| = 0.5671</code></pre><p>Le rapport des erreurs tend vers $|g'(\\alpha)| = \\alpha \\approx 0.567$ : convergence linéaire.</p>\n<h2>S&#39;exercer</h2>\n<section class=\"exo\"><h3>Exercices de la série 2</h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Ex. 5 : $g(x) = \\ln(1+x) + 0.2$. Montre que $x_{n+1} = g(x_n)$ converge sur $[0.1, 5]$.</p>\n</div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-h\" hidden><p>$g'(x) = 1/(1+x)$.</p>\n</div><div class=\"ex-c\" hidden><p>Sur $[0.1, 5]$ : $|g'(x)| \\le 1/1.1 \\approx 0.909 &lt; 1$. $g$ croissante, $g(0.1) \\approx 0.295$, $g(5) \\approx 1.992$ : $g([0.1,5]) \\subset [0.1,5]$. Donc convergence vers l&#39;unique point fixe $r \\approx 0.77225$ (constante $k \\approx 0.909$, mais près de $r$ le rapport des erreurs vaut $g'(r) \\approx 0.56$).</p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>L&#39;énoncé demande $x_n = 0.77228$. Le calcul (Python) donne un point fixe $0.772250$ : avec $x_0 = 4$, on a $x_n = 0.77225$ à $10^{-5}$ près dès $n = 22$. La valeur $0.77228$ de l&#39;énoncé est probablement une coquille.</p>\n</aside><div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Ex. 7 : $g(x) = xe^{-x} + 1$, $x_0 = 1.5$. Calcule $x_1$ à $10^{-3}$ près.</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1.335</b></p><p>$x_1 = 1.5\\,e^{-1.5} + 1 \\approx 1.335$. Puis $x_2 \\approx 1.351$, $x_3 \\approx 1.350$, $x_4 \\approx 1.350$ : $\\alpha \\approx 1.349$.</p>\n</div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Ex. 8 : pour $x^3 - x - 1 = 0$ ($\\alpha \\approx 1.3247$), lequel de $F(x) = x^3 - 1$, $H(x) = (x+1)^{1/3}$ converge ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>$F'(\\alpha) = 3\\alpha^2 \\approx 5.3 &gt; 1$ : diverge. $H'(\\alpha) = \\frac{1}{3}(\\alpha+1)^{-2/3} \\approx 0.19 &lt; 1$ : converge.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 7 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Un point fixe de $g$ vérifie :</div><button class=\"opt\" data-o=\"0\">$g(r) = 0$</button><button class=\"opt\" data-o=\"1\">$g(r) = r$</button><button class=\"opt\" data-o=\"2\">$g'(r) = 0$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Pour $g(x) = \\sqrt{2x+3}$, $g'(3)$ vaut :</div><button class=\"opt\" data-o=\"0\">$1/3$</button><button class=\"opt\" data-o=\"1\">$3$</button><button class=\"opt\" data-o=\"2\">$1$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Avec $g(x) = (x^2-3)/2$ près de $r = 3$ :</div><button class=\"opt\" data-o=\"0\">convergence rapide</button><button class=\"opt\" data-o=\"1\">divergence car $|g'(3)| = 3 &gt; 1$</button><button class=\"opt\" data-o=\"2\">convergence lente</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Le théorème du point fixe demande :</div><button class=\"opt\" data-o=\"0\">seulement $|g'(r)| &lt; 1$</button><button class=\"opt\" data-o=\"1\">$g(I) \\subset I$ et $|g'| \\le k &lt; 1$ sur $I$</button><button class=\"opt\" data-o=\"2\">$g$ croissante</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">$e^{-x}$ est contractante sur :</div><button class=\"opt\" data-o=\"0\">$[0, 1]$</button><button class=\"opt\" data-o=\"1\">$[1/2, \\ln 2]$</button><button class=\"opt\" data-o=\"2\">$[-1, 0]$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">En général, le point fixe converge à l&#39;ordre :</div><button class=\"opt\" data-o=\"0\">1</button><button class=\"opt\" data-o=\"1\">2</button><button class=\"opt\" data-o=\"2\">3</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Si $|g'| \\le 0.5$ sur $I$ et $|x_0 - r| \\le 1$, alors $|x_{10} - r| \\le$ :</div><button class=\"opt\" data-o=\"0\">$0.05$</button><button class=\"opt\" data-o=\"1\">$0.5^{10} \\approx 10^{-3}$</button><button class=\"opt\" data-o=\"2\">$10^{-10}$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Pour $x^3 - x - 1 = 0$, quelle écriture converge près de $1.32$ ?</div><button class=\"opt\" data-o=\"0\">$x = x^3 - 1$</button><button class=\"opt\" data-o=\"1\">$x = (x+1)^{1/3}$</button><button class=\"opt\" data-o=\"2\">$x = 1/(x^2 - 1)$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Le rapport $|x_{n+1} - r|/|x_n - r|$ tend vers :</div><button class=\"opt\" data-o=\"0\">0</button><button class=\"opt\" data-o=\"1\">$|g'(r)|$</button><button class=\"opt\" data-o=\"2\">1</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Le point fixe d&#39;ordre 2 apparaît quand :</div><button class=\"opt\" data-o=\"0\">$g'(r) = 0$</button><button class=\"opt\" data-o=\"1\">$g'(r) = 1$</button><button class=\"opt\" data-o=\"2\">$g(r) = 0$</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"point-fixe","rep":null,"tol":null},{"n":"point-fixe","rep":null,"tol":null},{"n":"point-fixe","rep":["1.335"],"tol":0.001},{"n":"point-fixe","rep":null,"tol":null}],"qcm":[{"n":"point-fixe","q":"Un point fixe de $g$ vérifie :","o":["$g(r) = 0$","$g(r) = r$","$g'(r) = 0$"],"a":1,"e":"Par définition."},{"n":"point-fixe","q":"Pour $g(x) = \\sqrt{2x+3}$, $g'(3)$ vaut :","o":["$1/3$","$3$","$1$"],"a":0,"e":"$g'(x) = 1/\\sqrt{2x+3}$, et $\\sqrt 9 = 3$."},{"n":"point-fixe","q":"Avec $g(x) = (x^2-3)/2$ près de $r = 3$ :","o":["convergence rapide","divergence car $|g'(3)| = 3 &gt; 1$","convergence lente"],"a":1,"e":"$g'(x) = x$."},{"n":"point-fixe","q":"Le théorème du point fixe demande :","o":["seulement $|g'(r)| &lt; 1$","$g(I) \\subset I$ et $|g'| \\le k &lt; 1$ sur $I$","$g$ croissante"],"a":1,"e":"Stabilité de l&#39;intervalle et contraction uniforme."},{"n":"point-fixe","q":"$e^{-x}$ est contractante sur :","o":["$[0, 1]$","$[1/2, \\ln 2]$","$[-1, 0]$"],"a":1,"e":"Sur $[0,1]$, $|g'(0)| = 1$."},{"n":"point-fixe","q":"En général, le point fixe converge à l&#39;ordre :","o":["1","2","3"],"a":0,"e":"Ordre 1 sauf si $g'(r) = 0$."},{"n":"point-fixe","q":"Si $|g'| \\le 0.5$ sur $I$ et $|x_0 - r| \\le 1$, alors $|x_{10} - r| \\le$ :","o":["$0.05$","$0.5^{10} \\approx 10^{-3}$","$10^{-10}$"],"a":1,"e":"$k^n|x_0 - r|$."},{"n":"point-fixe","q":"Pour $x^3 - x - 1 = 0$, quelle écriture converge près de $1.32$ ?","o":["$x = x^3 - 1$","$x = (x+1)^{1/3}$","$x = 1/(x^2 - 1)$"],"a":1,"e":"$|H'(\\alpha)| \\approx 0.19 &lt; 1$ ; les deux autres ont $|g'(\\alpha)| &gt; 1$."},{"n":"point-fixe","q":"Le rapport $|x_{n+1} - r|/|x_n - r|$ tend vers :","o":["0","$|g'(r)|$","1"],"a":1,"e":"Développement de Taylor à l&#39;ordre 1."},{"n":"point-fixe","q":"Le point fixe d&#39;ordre 2 apparaît quand :","o":["$g'(r) = 0$","$g'(r) = 1$","$g(r) = 0$"],"a":0,"e":"Le terme d&#39;ordre 1 disparaît : c&#39;est le cas de Newton."}]},{"id":"newton-secante","t":"Méthodes de Newton-Raphson et de la sécante","seance":"Chapitre 2 (3/3) · Résolution numérique des équations","imp":5,"html":"<h2>Avant de commencer</h2>\n<p>Il te faut l&#39;équation de la tangente : en $x_n$, la tangente à $y = f(x)$ est $y = f(x_n) + f'(x_n)(x - x_n)$.</p>\n<section class=\"exo\"><h3>Vérifie ton prérequis</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Où la tangente à $f(x) = x^2 - 2$ en $x_0 = 2$ coupe-t-elle l&#39;axe des abscisses ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1.5</b></p><p>Tangente : $y = 2 + 4(x - 2)$. $y = 0$ donne $x = 2 - 2/4 = 1.5$. C&#39;est déjà le premier pas de Newton.</p>\n</div></div></section><h2>Comment aborder ce chapitre</h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p><strong>Newton = remplacer la courbe par sa tangente.</strong> La sécante fait la même chose avec une droite passant par deux points : pas besoin de dérivée.</p>\n</aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>Lancer Newton loin de la racine, ou là où $f'$ s&#39;annule. La méthode peut alors diverger ou osciller. Et pour une <strong>racine double</strong>, elle n&#39;est plus quadratique mais linéaire.</p>\n</aside><p>À la fin, tu sais écrire et appliquer Newton et la sécante, expliquer leurs ordres (2 et 1.618) et les comparer à la dichotomie.</p>\n<h2>Idée 1 · La formule de Newton</h2>\n<svg viewBox=\"0 0 340 200\" style=\"width:100%;max-width:440px;display:block;margin:10px auto\" role=\"img\" aria-label=\"La tangente en x0 coupe l'axe en x1, plus proche de la racine r\">\n<line x1=\"20\" y1=\"160\" x2=\"330\" y2=\"160\" stroke=\"currentColor\"/>\n<path d=\"M40 185 C 120 175, 200 140, 300 20\" fill=\"none\" stroke=\"#D9824F\" stroke-width=\"3\"/>\n<line x1=\"300\" y1=\"20\" x2=\"180\" y2=\"190\" stroke=\"currentColor\" stroke-dasharray=\"5 4\"/>\n<line x1=\"300\" y1=\"20\" x2=\"300\" y2=\"160\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"2 3\"/>\n<g font-family=\"sans-serif\" font-size=\"12\" fill=\"currentColor\"><text x=\"294\" y=\"176\">x0</text><text x=\"190\" y=\"176\">x1</text><circle cx=\"201\" cy=\"160\" r=\"4\" fill=\"currentColor\"/><circle cx=\"170\" cy=\"160\" r=\"4\" fill=\"#D9824F\"/><text x=\"160\" y=\"150\">r</text><text x=\"232\" y=\"60\">tangente</text></g>\n</svg><p>$$x_{n+1} = x_n - \\frac{f(x_n)}{f'(x_n)}$$</p>\n<p>C&#39;est un point fixe avec $g(x) = x - f(x)/f'(x)$. Comme $g'(r) = \\dfrac{f(r)f''(r)}{f'(r)^2} = 0$ pour une racine simple, la convergence est <strong>quadratique</strong> : le nombre de bons chiffres double à chaque pas.</p>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Newton pour √N (série 2, ex. 4)</figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · Équation</div><p>$\\sqrt N$ est racine de $f(x) = x^2 - N$, $f'(x) = 2x$.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · Formule</div><p>$x_{n+1} = x_n - \\dfrac{x_n^2 - N}{2x_n} = \\dfrac{1}{2}\\left(x_n + \\dfrac{N}{x_n}\\right)$.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · Application N = 2, x0 = 2</div><p>$x_1 = 1.5$, $x_2 = 1.41667$, $x_3 = 1.414216$, $x_4 = 1.41421356$.</p>\n</div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><pre class=\"\"><code>import math\ndef newton(f, df, x, n):\n    for k in range(1, n + 1):\n        x = x - f(x) / df(x)\n        print(k, f&quot;{x:.10f}&quot;)\n    return x\n\nnewton(lambda x: x*x - 2, lambda x: 2*x, 2.0, 4)\nprint(&quot;calculatrice :&quot;, f&quot;{math.sqrt(2):.10f}&quot;)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>1 1.5000000000\n2 1.4166666667\n3 1.4142156863\n4 1.4142135624\ncalculatrice : 1.4142135624</code></pre><h2>Idée 2 · Vérifier l&#39;ordre 2 sur $\\cos x - x$</h2>\n<p>Exemple du prof : $x_0 = 1$, $r \\approx 0.7390851$.</p>\n<pre class=\"\"><code>import math\nr = 0.7390851332151607\nx = 1.0\nfor k in range(1, 5):\n    x = x - (math.cos(x) - x) / (-math.sin(x) - 1)\n    print(k, f&quot;{x:.8f}&quot;, f&quot;erreur = {abs(x - r):.1e}&quot;)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>1 0.75036387 erreur = 1.1e-02\n2 0.73911289 erreur = 2.8e-05\n3 0.73908513 erreur = 1.7e-10\n4 0.73908513 erreur = 0.0e+00</code></pre><p>L&#39;erreur passe de $10^{-2}$ à $10^{-5}$ puis $10^{-10}$ : elle est à peu près élevée au carré.</p>\n<aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>La diapo donne $|x_2 - r| \\approx 5\\times10^{-4}$ et $|x_3 - r| \\approx 2\\times10^{-7}$. Le calcul exact donne des erreurs plus petites (environ $2.8\\times10^{-5}$ et $1.7\\times10^{-10}$, ci-dessus). La conclusion (ordre 2) reste juste.</p>\n</aside><h2>Idée 3 · Les limites de Newton</h2>\n<ul>\n<li>Si $f'(x_n) = 0$, la formule n&#39;existe pas.</li>\n<li>Mauvais $x_0$ : divergence ou oscillations.</li>\n<li><strong>Racine multiple</strong> : convergence seulement linéaire. Avec $f(x) = (x-1)^2$ : $x_{n+1} = \\frac{x_n + 1}{2}$, l&#39;erreur est juste divisée par 2.</li>\n</ul>\n<p>Remède vu en série 2 (ex. 9) : pour une racine double, on applique Newton à $g = \\sqrt{|f|}$, qui a une racine <strong>simple</strong>. Cela revient à $x_{n+1} = x_n - 2\\dfrac{f(x_n)}{f'(x_n)}$.</p>\n<pre class=\"\"><code>f = lambda x: 4*x**3 - 3*x + 1        # racine double 1/2\ndf = lambda x: 12*x**2 - 3\nx, y = 0.25, 0.25\nfor k in range(1, 5):\n    x = x - f(x) / df(x)              # Newton classique\n    y = y - 2 * f(y) / df(y)          # schéma de l'ex. 9\n    print(k, f&quot;{x:.6f}&quot;, f&quot;{y:.6f}&quot;)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>1 0.388889 0.527778\n2 0.446759 0.500250\n3 0.473879 0.500000\n4 0.487056 0.500000</code></pre><h2>Idée 4 · La sécante : Newton sans dérivée</h2>\n<p>On remplace $f'(x_n)$ par la pente entre les deux derniers points :</p>\n<p>$$x_{n+1} = x_n - f(x_n)\\,\\frac{x_n - x_{n-1}}{f(x_n) - f(x_{n-1})}$$</p>\n<p>Il faut <strong>deux</strong> points de départ. Ordre $p = \\frac{1+\\sqrt5}{2} \\approx 1.618$ (superlinéaire).</p>\n<pre class=\"\"><code>def secante(f, x0, x1, n):\n    for k in range(2, n + 2):\n        x0, x1 = x1, x1 - f(x1) * (x1 - x0) / (f(x1) - f(x0))\n        print(f&quot;x{k} = {x1:.6f}&quot;)\n\nf = lambda x: x**3 - 2*x - 5\nsecante(f, 2.0, 3.0, 5)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>x2 = 2.058824\nx3 = 2.081264\nx4 = 2.094824\nx5 = 2.094549\nx6 = 2.094551</code></pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>La diapo donne $x_3 \\approx 2.09$ pour cet exemple. Le calcul donne $x_3 \\approx 2.0813$ ; $x_4 \\approx 2.0948$ et la racine $2.09455$ sont justes.</p>\n</aside><h2>Idée 5 · Comparer les quatre méthodes</h2>\n<table>\n<thead>\n<tr>\n<th>Méthode</th>\n<th>Ordre</th>\n<th>Avantage</th>\n<th>Inconvénient</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Dichotomie</td>\n<td>1</td>\n<td>converge toujours</td>\n<td>lente (≈ 20 itérations pour $10^{-6}$)</td>\n</tr>\n<tr>\n<td>Point fixe</td>\n<td>1 (ou plus si $g'(r) = 0$)</td>\n<td>simple</td>\n<td>dépend du choix de $g$</td>\n</tr>\n<tr>\n<td>Newton</td>\n<td>2</td>\n<td>très rapide (≈ 4 itérations)</td>\n<td>besoin de $f'$ et d&#39;un bon $x_0$</td>\n</tr>\n<tr>\n<td>Sécante</td>\n<td>≈ 1.618</td>\n<td>pas de dérivée</td>\n<td>deux points de départ, un peu plus lente</td>\n</tr>\n</tbody></table>\n<aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend</div><p>Conclusion de la série 2 : dichotomie sûre mais lente, Newton rapide mais exige une bonne approximation initiale, sécante = compromis sans dérivée, point fixe = étude de contractance obligatoire, racines multiples = schéma adapté.</p>\n</aside><h2>S&#39;exercer</h2>\n<section class=\"exo\"><h3>Série 2</h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Ex. 2 : Newton sur $x^3 - 3x - 1$ à partir de $x_0 = 2$. Donne $x_2$ à $10^{-4}$.</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1.8795</b></p><p>$x_1 = 2 - 1/9 = 1.8889$, $x_2 \\approx 1.87945$, puis $x_3 = x_4 = x_5 \\approx 1.879385$.</p>\n</div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Ex. 8 : $x^3 + 2x^2 + 10x - 20 = 0$, Newton avec $x_0 = 2$. Calcule $x_1$.</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 1.4667</b></p><p>$f(2) = 16$, $f'(x) = 3x^2 + 4x + 10$, $f'(2) = 30$, $x_1 = 2 - 16/30 \\approx 1.4667$. Ensuite $x_2 \\approx 1.3715$, $x_3 \\approx 1.368810$, $x_4 \\approx 1.368808$.</p>\n</div></div><div class=\"ex\" data-x=\"3\"><div class=\"ex-q\"><p>Exam 2022/23 : pour $f(x) = e^x - x - 2$, pour quelle valeur de $x_0$ ne peut-on pas démarrer Newton ?</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0</b></p><p>$f'(x) = e^x - 1$ s&#39;annule en $x = 0$ : la tangente est horizontale.</p>\n</div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 8 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">La formule de Newton est :</div><button class=\"opt\" data-o=\"0\">$x_{n+1} = x_n - f'(x_n)/f(x_n)$</button><button class=\"opt\" data-o=\"1\">$x_{n+1} = x_n - f(x_n)/f'(x_n)$</button><button class=\"opt\" data-o=\"2\">$x_{n+1} = f(x_n)$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Newton pour $x^2 - 2$ avec $x_0 = 2$ donne $x_1 =$ :</div><button class=\"opt\" data-o=\"0\">1.25</button><button class=\"opt\" data-o=\"1\">1.5</button><button class=\"opt\" data-o=\"2\">1.4167</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">L&#39;ordre de Newton pour une racine simple est :</div><button class=\"opt\" data-o=\"0\">1</button><button class=\"opt\" data-o=\"1\">2</button><button class=\"opt\" data-o=\"2\">1.618</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Pour $f(x) = (x-1)^2$, Newton :</div><button class=\"opt\" data-o=\"0\">converge quadratiquement</button><button class=\"opt\" data-o=\"1\">converge linéairement, l&#39;erreur divisée par 2</button><button class=\"opt\" data-o=\"2\">diverge</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">La sécante a besoin de :</div><button class=\"opt\" data-o=\"0\">deux valeurs initiales</button><button class=\"opt\" data-o=\"1\">la dérivée $f'$</button><button class=\"opt\" data-o=\"2\">un intervalle où $f$ change de signe</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">L&#39;ordre de la sécante vaut environ :</div><button class=\"opt\" data-o=\"0\">1</button><button class=\"opt\" data-o=\"1\">1.618</button><button class=\"opt\" data-o=\"2\">2</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Newton échoue immédiatement si :</div><button class=\"opt\" data-o=\"0\">$f(x_n) = 0$</button><button class=\"opt\" data-o=\"1\">$f'(x_n) = 0$</button><button class=\"opt\" data-o=\"2\">$x_n &lt; 0$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Pour $10^{-6}$ sur $x^2 - 2$, Newton demande environ :</div><button class=\"opt\" data-o=\"0\">4 itérations</button><button class=\"opt\" data-o=\"1\">20 itérations</button><button class=\"opt\" data-o=\"2\">100 itérations</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Newton est un point fixe avec $g(x) = x - f(x)/f'(x)$. Pour une racine simple, $g'(r)$ vaut :</div><button class=\"opt\" data-o=\"0\">0</button><button class=\"opt\" data-o=\"1\">1</button><button class=\"opt\" data-o=\"2\">$f''(r)$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Quelle méthode est la plus robuste ?</div><button class=\"opt\" data-o=\"0\">Newton</button><button class=\"opt\" data-o=\"1\">Sécante</button><button class=\"opt\" data-o=\"2\">Dichotomie</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"newton-secante","rep":["1.5"],"tol":null},{"n":"newton-secante","rep":["1.8795"],"tol":0.0001},{"n":"newton-secante","rep":["1.4667"],"tol":0.0002},{"n":"newton-secante","rep":["0"],"tol":null}],"qcm":[{"n":"newton-secante","q":"La formule de Newton est :","o":["$x_{n+1} = x_n - f'(x_n)/f(x_n)$","$x_{n+1} = x_n - f(x_n)/f'(x_n)$","$x_{n+1} = f(x_n)$"],"a":1,"e":"Intersection de la tangente avec l&#39;axe."},{"n":"newton-secante","q":"Newton pour $x^2 - 2$ avec $x_0 = 2$ donne $x_1 =$ :","o":["1.25","1.5","1.4167"],"a":1,"e":"$\\frac12(2 + 2/2) = 1.5$."},{"n":"newton-secante","q":"L&#39;ordre de Newton pour une racine simple est :","o":["1","2","1.618"],"a":1,"e":"Quadratique."},{"n":"newton-secante","q":"Pour $f(x) = (x-1)^2$, Newton :","o":["converge quadratiquement","converge linéairement, l&#39;erreur divisée par 2","diverge"],"a":1,"e":"$x_{n+1} = (x_n + 1)/2$."},{"n":"newton-secante","q":"La sécante a besoin de :","o":["deux valeurs initiales","la dérivée $f'$","un intervalle où $f$ change de signe"],"a":0,"e":"Elle utilise $x_{n-1}$ et $x_n$."},{"n":"newton-secante","q":"L&#39;ordre de la sécante vaut environ :","o":["1","1.618","2"],"a":1,"e":"Nombre d&#39;or $(1+\\sqrt5)/2$."},{"n":"newton-secante","q":"Newton échoue immédiatement si :","o":["$f(x_n) = 0$","$f'(x_n) = 0$","$x_n &lt; 0$"],"a":1,"e":"Division par zéro : tangente horizontale."},{"n":"newton-secante","q":"Pour $10^{-6}$ sur $x^2 - 2$, Newton demande environ :","o":["4 itérations","20 itérations","100 itérations"],"a":0,"e":"Contre ≈ 20 pour la dichotomie."},{"n":"newton-secante","q":"Newton est un point fixe avec $g(x) = x - f(x)/f'(x)$. Pour une racine simple, $g'(r)$ vaut :","o":["0","1","$f''(r)$"],"a":0,"e":"$g'(r) = f(r)f''(r)/f'(r)^2 = 0$, d&#39;où l&#39;ordre 2."},{"n":"newton-secante","q":"Quelle méthode est la plus robuste ?","o":["Newton","Sécante","Dichotomie"],"a":2,"e":"Elle converge toujours dès que $f(a)f(b) &lt; 0$."}]},{"id":"systemes-gauss","t":"Systèmes linéaires (1) · Cramer, triangulaires, Gauss, Gauss-Jordan","seance":"Chapitre 3 (1/2) · Méthodes directes","imp":5,"html":"<h2>Avant de commencer</h2>\n<p>Il te faut savoir calculer un déterminant $2\\times2$ et $3\\times3$, et écrire un système sous la forme $Ax = b$.</p>\n<section class=\"exo\"><h3>Vérifie ton prérequis</h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Calcule $\\det\\begin{pmatrix}1 &amp; 2\\\\ 3 &amp; -1\\end{pmatrix}$.</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"></div><div class=\"ex-c\" hidden><p><b>Réponse attendue : -7</b></p><p>$1\\times(-1) - 2\\times3 = -7$.</p>\n</div></div></section><h2>Comment aborder ce chapitre</h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce</div><p><strong>Une méthode directe donne la solution exacte en un nombre fini d&#39;opérations</strong> (aux arrondis près). Toutes reviennent au même geste : rendre la matrice triangulaire, puis remonter.</p>\n</aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège</div><p>Oublier de faire subir au <strong>second membre</strong> $b$ les mêmes opérations que les lignes de $A$. Travaille toujours sur la matrice augmentée $[A\\,|\\,b]$.</p>\n</aside><p>À la fin, tu sais résoudre un système par Cramer, par substitution, par Gauss (avec permutation si un pivot est nul) et par Gauss-Jordan.</p>\n<h2>Idée 1 · Cramer : la formule, pas la méthode</h2>\n<p>Si $\\det A \\neq 0$ : $x_i = \\dfrac{\\det A_i}{\\det A}$, où $A_i$ est $A$ dont la colonne $i$ est remplacée par $b$.</p>\n<pre class=\"\"><code>import numpy as np\nA = np.array([[1, 2], [3, -1]])\nb = np.array([5, 4])\nd = round(np.linalg.det(A))\nfor i in range(2):\n    Ai = A.copy()\n    Ai[:, i] = b\n    print(f&quot;x{i+1} = {round(np.linalg.det(Ai))}/{d} = {np.linalg.det(Ai)/d:.4f}&quot;)</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>x1 = -13/-7 = 1.8571\nx2 = -11/-7 = 1.5714</code></pre><aside class=\"enc prof\"><div class=\"enc-t\">Ce que le prof attend</div><p>Cramer est utile pour la théorie, mais <strong>trop coûteux</strong> : à réserver aux petits systèmes ($n \\le 4$).</p>\n</aside><h2>Idée 2 · Systèmes triangulaires : remonter</h2>\n<figure class=\"grille\"><figcaption>Système triangulaire supérieur du cours</figcaption><table><tr><th>x1</th><th>x2</th><th>x3</th><th>b</th></tr><tr><td class=\"h1\">2</td><td>3</td><td>1</td><td>5</td></tr><tr><td class=\"h0\">0</td><td class=\"h1\">4</td><td>2</td><td>6</td></tr><tr><td class=\"h0\">0</td><td class=\"h0\">0</td><td class=\"h1\">3</td><td>9</td></tr></table></figure><p>Substitution arrière : $x_n = b_n/a_{nn}$, puis $x_i = \\dfrac{1}{a_{ii}}\\Big(b_i - \\sum_{j&gt;i} a_{ij}x_j\\Big)$. Ici $x_3 = 3$, $x_2 = 0$, $x_1 = 1$. Coût : environ $n^2$ opérations.</p>\n<pre class=\"\"><code>def remonter(U, b):\n    n = len(b)\n    x = [0] * n\n    for i in range(n - 1, -1, -1):\n        s = sum(U[i][j] * x[j] for j in range(i + 1, n))\n        x[i] = (b[i] - s) / U[i][i]\n    return x\n\nprint(remonter([[2, 3, 1], [0, 4, 2], [0, 0, 3]], [5, 6, 9]))</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>[1.0, 0.0, 3.0]</code></pre><h2>Idée 3 · Gauss : trianguler puis remonter</h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Méthode de Gauss</figcaption><div class=\"etape\"><div class=\"et-t\">1/5 · Matrice augmentée</div><p>On écrit $[A\\,|\\,b]$.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">2/5 · Pivot</div><p>À l&#39;étape $k$, le pivot est $a_{kk}$. S&#39;il est nul, on <strong>permute</strong> avec une ligne en dessous où $a_{lk} \\neq 0$.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">3/5 · Élimination</div><p>Pour chaque ligne $i &gt; k$ : $L_i \\leftarrow L_i - \\dfrac{a_{ik}}{a_{kk}} L_k$.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">4/5 · Répéter</div><p>$n - 1$ étapes donnent une matrice triangulaire supérieure.</p>\n</div><div class=\"etape\" hidden><div class=\"et-t\">5/5 · Remonter</div><p>Substitution arrière.</p>\n</div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente</button><button class=\"b p\" data-et=\"1\">Étape suivante →</button></div></figure><p>Exemple du cours : $x_2 + 3x_3 = 1$, $5x_1 + 2x_2 + 3x_3 = 4$, $6x_1 + 8x_2 + x_3 = 6$. Le premier pivot est nul : on échange $L_1$ et $L_2$.</p>\n<pre class=\"\"><code>from fractions import Fraction as F\n\ndef gauss(A, b):\n    n = len(b)\n    M = [[F(v) for v in A[i]] + [F(b[i])] for i in range(n)]\n    for k in range(n - 1):\n        if M[k][k] == 0:\n            l = next(i for i in range(k + 1, n) if M[i][k] != 0)\n            M[k], M[l] = M[l], M[k]\n            print(f&quot;permutation L{k+1} &lt;-&gt; L{l+1}&quot;)\n        for i in range(k + 1, n):\n            m = M[i][k] / M[k][k]\n            M[i] = [M[i][j] - m * M[k][j] for j in range(n + 1)]\n            print(f&quot;L{i+1} &lt;- L{i+1} - ({m}) L{k+1}&quot;)\n    for ligne in M:\n        print([str(v) for v in ligne])\n    x = [F(0)] * n\n    for i in range(n - 1, -1, -1):\n        x[i] = (M[i][n] - sum(M[i][j] * x[j] for j in range(i + 1, n))) / M[i][i]\n    return [str(v) for v in x]\n\nprint(gauss([[0, 1, 3], [5, 2, 3], [6, 8, 1]], [1, 4, 6]))</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>permutation L1 &lt;-&gt; L2\nL2 &lt;- L2 - (0) L1\nL3 &lt;- L3 - (6/5) L1\nL3 &lt;- L3 - (28/5) L2\n['5', '2', '3', '4']\n['0', '1', '3', '1']\n['0', '0', '-97/5', '-22/5']\n['52/97', '31/97', '22/97']</code></pre><aside class=\"enc attention\"><div class=\"enc-t\">Attention</div><p>La diapo trouve $x_1 = 67/97$. C&#39;est une erreur de calcul dans la remontée : $5x_1 = 4 - \\frac{62}{97} - \\frac{66}{97} = \\frac{260}{97}$, donc $x_1 = \\frac{52}{97} \\approx 0.536$. On vérifie : $5\\cdot\\frac{52}{97} + 2\\cdot\\frac{31}{97} + 3\\cdot\\frac{22}{97} = \\frac{388}{97} = 4$. Les valeurs $x_2 = 31/97$ et $x_3 = 22/97$ sont justes.</p>\n</aside><h2>Idée 4 · Gauss-Jordan : jusqu&#39;à l&#39;identité</h2>\n<p>On continue l&#39;élimination <strong>au-dessus</strong> des pivots et on <strong>normalise</strong> chaque pivot à 1 : $[A\\,|\\,b] \\to [I_n\\,|\\,x]$. Pas de remontée, mais plus d&#39;opérations que Gauss.</p>\n<pre class=\"\"><code>from fractions import Fraction as F\nM = [[F(v) for v in r] for r in [[1, 3, 3, 0], [2, 2, 0, 2], [3, 2, 6, 11]]]\nn = 3\nfor k in range(n):\n    p = M[k][k]\n    M[k] = [v / p for v in M[k]]\n    for i in range(n):\n        if i != k:\n            m = M[i][k]\n            M[i] = [M[i][j] - m * M[k][j] for j in range(n + 1)]\nfor r in M:\n    print([str(v) for v in r])</code></pre><pre class=\"sortie\"><div class=\"code-tag\">Sortie</div><code>['1', '0', '0', '3']\n['0', '1', '0', '-2']\n['0', '0', '1', '1']</code></pre><p>Solution : $x = (3, -2, 1)$, comme dans le cours.</p>\n<aside class=\"enc retenir\"><div class=\"enc-t\">À retenir</div><p>Gauss-Jordan sert aussi à calculer $A^{-1}$ : on réduit $[A\\,|\\,I_n]$ en $[I_n\\,|\\,A^{-1}]$.</p>\n</aside><h2>S&#39;exercer</h2>\n<section class=\"exo\"><h3>Série 3, ex. 1</h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Résous par Gauss : $3x_1 - x_2 + 2x_3 = 4$, $x_1 + 2x_2 - x_3 = 1$, $2x_1 + x_2 + x_3 = 5$. Donne $x_3$.</p>\n</div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier</button></div><div class=\"ex-b\"><button class=\"b\" data-ex=\"h\">Indice</button></div><div class=\"ex-h\" hidden><p>$L_2 \\leftarrow L_2 - \\frac13 L_1$, $L_3 \\leftarrow L_3 - \\frac23 L_1$.</p>\n</div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 3</b></p><p>Après élimination : $\\frac73 x_2 - \\frac53 x_3 = -\\frac13$ et $\\frac53x_2 - \\frac13x_3 = \\frac73$. Puis $L_3 \\leftarrow L_3 - \\frac57L_2$ : $\\frac{6}{7}x_3 = \\frac{18}{7}$, donc $x_3 = 3$, $x_2 = 2$, $x_1 = 0$.</p>\n</div></div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Pourquoi permute-t-on des lignes dans Gauss ?</p>\n</div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé</button></div><div class=\"ex-c\" hidden><p>Quand le pivot $a_{kk}$ est nul (division impossible). Si aucune ligne en dessous n&#39;a un coefficient non nul dans la colonne, la matrice est singulière.</p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste</button><button class=\"b ko\" data-ex=\"0\">J'avais faux</button></div></div></div></section><h2>Flashcards</h2>\n<p class=\"cartes-info\">🃏 7 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).</p><h2>QCM du chapitre</h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Cramer s&#39;applique si :</div><button class=\"opt\" data-o=\"0\">$A$ est symétrique</button><button class=\"opt\" data-o=\"1\">$\\det A \\neq 0$</button><button class=\"opt\" data-o=\"2\">$b = 0$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Avec $x_1 + 2x_2 = 5$, $3x_1 - x_2 = 4$, $\\det A_1$ vaut :</div><button class=\"opt\" data-o=\"0\">$-13$</button><button class=\"opt\" data-o=\"1\">$-11$</button><button class=\"opt\" data-o=\"2\">$-7$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Le coût de la remontée triangulaire est de l&#39;ordre de :</div><button class=\"opt\" data-o=\"0\">$n$</button><button class=\"opt\" data-o=\"1\">$n^2$</button><button class=\"opt\" data-o=\"2\">$n!$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Dans Gauss, si $a_{11} = 0$ :</div><button class=\"opt\" data-o=\"0\">le système n&#39;a pas de solution</button><button class=\"opt\" data-o=\"1\">on permute $L_1$ avec une ligne où $a_{l1} \\neq 0$</button><button class=\"opt\" data-o=\"2\">on divise par $a_{21}$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">L&#39;opération $L_3 \\leftarrow L_3 - \\frac65 L_1$ annule le coefficient :</div><button class=\"opt\" data-o=\"0\">$a_{31}$</button><button class=\"opt\" data-o=\"1\">$a_{33}$</button><button class=\"opt\" data-o=\"2\">$a_{13}$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Après Gauss, la matrice est :</div><button class=\"opt\" data-o=\"0\">diagonale</button><button class=\"opt\" data-o=\"1\">triangulaire supérieure</button><button class=\"opt\" data-o=\"2\">l&#39;identité</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Gauss-Jordan aboutit à :</div><button class=\"opt\" data-o=\"0\">une matrice triangulaire</button><button class=\"opt\" data-o=\"1\">la matrice identité</button><button class=\"opt\" data-o=\"2\">une matrice symétrique</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Par rapport à Gauss, Gauss-Jordan est :</div><button class=\"opt\" data-o=\"0\">moins coûteux</button><button class=\"opt\" data-o=\"1\">plus coûteux</button><button class=\"opt\" data-o=\"2\">identique</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Solution du système triangulaire $2x_1 + 3x_2 + x_3 = 5$, $4x_2 + 2x_3 = 6$, $3x_3 = 9$ :</div><button class=\"opt\" data-o=\"0\">$(1, 0, 3)$</button><button class=\"opt\" data-o=\"1\">$(3, 0, 1)$</button><button class=\"opt\" data-o=\"2\">$(1, 1, 1)$</button><div class=\"qq-e\" hidden></div></div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">On applique les opérations de lignes :</div><button class=\"opt\" data-o=\"0\">seulement à $A$</button><button class=\"opt\" data-o=\"1\">à $A$ et à $b$ (matrice augmentée)</button><button class=\"opt\" data-o=\"2\">seulement à $b$</button><div class=\"qq-e\" hidden></div></div></section>","ex":[{"n":"systemes-gauss","rep":["-7"],"tol":null},{"n":"systemes-gauss","rep":["3"],"tol":null},{"n":"systemes-gauss","rep":null,"tol":null}],"qcm":[{"n":"systemes-gauss","q":"Cramer s&#39;applique si :","o":["$A$ est symétrique","$\\det A \\neq 0$","$b = 0$"],"a":1,"e":"Sinon on divise par zéro."},{"n":"systemes-gauss","q":"Avec $x_1 + 2x_2 = 5$, $3x_1 - x_2 = 4$, $\\det A_1$ vaut :","o":["$-13$","$-11$","$-7$"],"a":0,"e":"$5\\times(-1) - 2\\times4$."},{"n":"systemes-gauss","q":"Le coût de la remontée triangulaire est de l&#39;ordre de :","o":["$n$","$n^2$","$n!$"],"a":1,"e":"Environ $n^2/2$ multiplications."},{"n":"systemes-gauss","q":"Dans Gauss, si $a_{11} = 0$ :","o":["le système n&#39;a pas de solution","on permute $L_1$ avec une ligne où $a_{l1} \\neq 0$","on divise par $a_{21}$"],"a":1,"e":"Permutation de lignes."},{"n":"systemes-gauss","q":"L&#39;opération $L_3 \\leftarrow L_3 - \\frac65 L_1$ annule le coefficient :","o":["$a_{31}$","$a_{33}$","$a_{13}$"],"a":0,"e":"Avec $a_{31} = 6$ et le pivot $5$."},{"n":"systemes-gauss","q":"Après Gauss, la matrice est :","o":["diagonale","triangulaire supérieure","l&#39;identité"],"a":1,"e":"On remonte ensuite."},{"n":"systemes-gauss","q":"Gauss-Jordan aboutit à :","o":["une matrice triangulaire","la matrice identité","une matrice symétrique"],"a":1,"e":"$[I\\,|\\,x]$."},{"n":"systemes-gauss","q":"Par rapport à Gauss, Gauss-Jordan est :","o":["moins coûteux","plus coûteux","identique"],"a":1,"e":"Il élimine aussi au-dessus des pivots."},{"n":"systemes-gauss","q":"Solution du système triangula
