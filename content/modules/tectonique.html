const MODULE={"slug":"tectonique","titre":"Tectonique","cle":"tectonique_scores","cleEtat":"tectonique_scores_etat","format":"score10","intro":"<p>Ce module suit <strong>le cours de Tectonique de la FST Béni Mellal<\/strong> (BCG S4) et la <strong>sortie de Khénifra<\/strong>, puis <strong>l&#39;examen de septembre 2020 corrigé<\/strong> (question de synthèse).<\/p>\n<p><strong>Comment l&#39;utiliser<\/strong><\/p>\n<ol>\n<li>Lis un chapitre et redessine chaque schéma de faille et de pli : à l&#39;examen et sur le terrain, tout passe par le dessin.<\/li>\n<li>Retiens les quatre domaines structuraux du Maroc.<\/li>\n<li>Fais le QCM du chapitre. <strong>8/10 = chapitre maîtrisé.<\/strong><\/li>\n<\/ol>\n<p><strong>À vérifier<\/strong> : le cours d&#39;introduction est un diaporama non lu et les examens 2022 sont des scans ; le cours est rédigé par nous à partir des rapports de sortie et du sujet 2020.<\/p>\n","annexes":[],"cartes":null,"maths":false};
const CHAPS=[{"id":"contraintes-deformation","t":"Contraintes et déformation","seance":"Introduction à la tectonique","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir lire le pendage d&#39;une couche : son angle avec l&#39;horizontale.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Une couche horizontale a quel pendage ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 0<\/b><\/p><p>0°. Une couche verticale a un pendage de 90°.<\/p>\n<\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « pâte à modeler ou biscuit ».<\/strong> Selon la profondeur, la température et la vitesse, une roche se plie (ductile) ou casse (cassante).<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Croire qu&#39;une roche casse toujours. En profondeur, chaude et sous pression, elle se déforme lentement sans casser : elle se plisse.<\/p>\n<\/aside><p>À la fin, tu sais relier le type de contrainte au type de structure.<\/p>\n<h2>Idée 1 · Les contraintes<\/h2>\n<p>Trois contraintes principales : σ1 (la plus forte), σ2, σ3 (la plus faible).<\/p>\n<figure class=\"grille\"><figcaption>Régimes tectoniques<\/figcaption><table><tr><th>Régime,<\/th><th>Contrainte<\/th><th>verticale,<\/th><th>Structures<\/th><\/tr><tr><td class=\"h1\">Compression,<\/td><td>σ3,<\/td><td>failles<\/td><td>inverses,<\/td><td>chevauchements,<\/td><td>plis<\/td><\/tr><tr><td class=\"h1\">Extension,<\/td><td>σ1,<\/td><td>failles<\/td><td>normales,<\/td><td>grabens,<\/td><td>rifts<\/td><\/tr><tr><td class=\"h1\">Décrochement,<\/td><td>σ2,<\/td><td>failles<\/td><td>décrochantes<\/td><\/tr><\/table><\/figure><h2>Idée 2 · Ductile et cassant<\/h2>\n<svg viewBox=\"0 0 320 110\" role=\"img\" aria-label=\"Comportement cassant en surface (faille) et ductile en profondeur (pli)\" style=\"max-width:360px;width:100%\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M10 25h120M10 40h120M150 25h150M150 40h150\"/><path d=\"M140 10l-20 45\" stroke=\"#D9824F\" stroke-width=\"3\"/><path d=\"M10 85q40-30 80 0t80 0t80 0t60 0\"/><path d=\"M10 100q40-30 80 0t80 0t80 0t60 0\"/><\/g>\n<g fill=\"currentColor\" font-size=\"10\"><text x=\"220\" y=\"15\">surface : cassant<\/text><text x=\"200\" y=\"70\">profondeur : ductile<\/text><\/g>\n<\/svg><h2>Idée 3 · Les étapes de la déformation<\/h2>\n<p>Élastique (réversible), plastique ou ductile (permanente sans rupture), puis rupture. La profondeur, la température, la pression de confinement, l&#39;eau et la lenteur favorisent le ductile.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Application<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Un graben se forme dans quel régime ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>En extension (failles normales).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Pourquoi trouve-t-on des plis plutôt que des failles dans les roches métamorphiques profondes ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Haute température et forte pression rendent les roches ductiles.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">En extension, on observe :<\/div><button class=\"opt\" data-o=\"0\">des failles normales<\/button><button class=\"opt\" data-o=\"1\">des failles inverses<\/button><button class=\"opt\" data-o=\"2\">des chevauchements<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">En compression, σ1 est :<\/div><button class=\"opt\" data-o=\"0\">horizontale<\/button><button class=\"opt\" data-o=\"1\">verticale<\/button><button class=\"opt\" data-o=\"2\">nulle<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Une roche ductile :<\/div><button class=\"opt\" data-o=\"0\">se déforme sans casser<\/button><button class=\"opt\" data-o=\"1\">casse<\/button><button class=\"opt\" data-o=\"2\">ne se déforme pas<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">La déformation élastique est :<\/div><button class=\"opt\" data-o=\"0\">réversible<\/button><button class=\"opt\" data-o=\"1\">permanente<\/button><button class=\"opt\" data-o=\"2\">une rupture<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Un graben est :<\/div><button class=\"opt\" data-o=\"0\">un fossé d&#39;effondrement<\/button><button class=\"opt\" data-o=\"1\">un pli<\/button><button class=\"opt\" data-o=\"2\">un volcan<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">La profondeur favorise :<\/div><button class=\"opt\" data-o=\"0\">le comportement ductile<\/button><button class=\"opt\" data-o=\"1\">le comportement cassant<\/button><button class=\"opt\" data-o=\"2\">rien<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Une couche verticale a un pendage de :<\/div><button class=\"opt\" data-o=\"0\">90°<\/button><button class=\"opt\" data-o=\"1\">0°<\/button><button class=\"opt\" data-o=\"2\">45°<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Le décrochement :<\/div><button class=\"opt\" data-o=\"0\">fait coulisser horizontalement<\/button><button class=\"opt\" data-o=\"1\">fait monter un bloc<\/button><button class=\"opt\" data-o=\"2\">crée un pli<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">La rupture survient :<\/div><button class=\"opt\" data-o=\"0\">après le domaine plastique<\/button><button class=\"opt\" data-o=\"1\">avant le domaine élastique<\/button><button class=\"opt\" data-o=\"2\">jamais<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">La tectonique étudie :<\/div><button class=\"opt\" data-o=\"0\">les déformations des terrains<\/button><button class=\"opt\" data-o=\"1\">les fossiles<\/button><button class=\"opt\" data-o=\"2\">les minéraux seuls<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"contraintes-deformation","rep":["0"],"tol":null},{"n":"contraintes-deformation","rep":null,"tol":null},{"n":"contraintes-deformation","rep":null,"tol":null}],"qcm":[{"n":"contraintes-deformation","q":"En extension, on observe :","o":["des failles normales","des failles inverses","des chevauchements"],"a":0,"e":"Étirement."},{"n":"contraintes-deformation","q":"En compression, σ1 est :","o":["horizontale","verticale","nulle"],"a":0,"e":"Raccourcissement horizontal."},{"n":"contraintes-deformation","q":"Une roche ductile :","o":["se déforme sans casser","casse","ne se déforme pas"],"a":0,"e":"Plis."},{"n":"contraintes-deformation","q":"La déformation élastique est :","o":["réversible","permanente","une rupture"],"a":0,"e":"Retour à l&#39;état initial."},{"n":"contraintes-deformation","q":"Un graben est :","o":["un fossé d&#39;effondrement","un pli","un volcan"],"a":0,"e":"Entre deux failles normales."},{"n":"contraintes-deformation","q":"La profondeur favorise :","o":["le comportement ductile","le comportement cassant","rien"],"a":0,"e":"Chaleur et pression."},{"n":"contraintes-deformation","q":"Une couche verticale a un pendage de :","o":["90°","0°","45°"],"a":0,"e":"Définition."},{"n":"contraintes-deformation","q":"Le décrochement :","o":["fait coulisser horizontalement","fait monter un bloc","crée un pli"],"a":0,"e":"σ2 vertical."},{"n":"contraintes-deformation","q":"La rupture survient :","o":["après le domaine plastique","avant le domaine élastique","jamais"],"a":0,"e":"Seuil de résistance."},{"n":"contraintes-deformation","q":"La tectonique étudie :","o":["les déformations des terrains","les fossiles","les minéraux seuls"],"a":0,"e":"Failles et plis."}]},{"id":"failles","t":"Les failles","seance":"Tectonique cassante · Failles et diaclases","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut distinguer le compartiment au-dessus du plan de faille (toit) de celui en dessous (mur).<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Dans une faille inclinée, quel compartiment repose sur le plan de faille ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Le toit (compartiment supérieur).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « le toit descend ou monte ? ».<\/strong> Toit qui descend : faille normale (extension). Toit qui monte : faille inverse (compression).<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Appeler faille une fracture sans déplacement. Sans mouvement des deux compartiments, c&#39;est une <strong>diaclase<\/strong>.<\/p>\n<\/aside><p>À la fin, tu sais nommer une faille sur un schéma et mesurer son rejet.<\/p>\n<h2>Idée 1 · Les types de failles<\/h2>\n<figure class=\"grille\"><figcaption>Types<\/figcaption><table><tr><th>Faille,<\/th><th>Mouvement<\/th><th>du<\/th><th>toit,<\/th><th>Régime<\/th><\/tr><tr><td class=\"h1\">Normale,<\/td><td>descend,<\/td><td>extension<\/td><\/tr><tr><td class=\"h1\">Inverse,<\/td><td>monte,<\/td><td>compression<\/td><\/tr><tr><td class=\"h1\">Chevauchement,<\/td><td>monte<\/td><td>sur<\/td><td>une<\/td><td>faille<\/td><td>peu<\/td><td>inclinée,<\/td><td>forte<\/td><td>compression<\/td><\/tr><tr><td class=\"h1\">Décrochante,<\/td><td>glisse<\/td><td>horizontalement<\/td><td>(dextre<\/td><td>ou<\/td><td>senestre),<\/td><td>décrochement<\/td><\/tr><\/table><\/figure><svg viewBox=\"0 0 320 120\" role=\"img\" aria-label=\"Faille normale : le toit descend le long du plan de faille\" style=\"max-width:360px;width:100%\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M150 10l40 100\" stroke=\"#D9824F\" stroke-width=\"3\"/><path d=\"M10 40h150M10 55h156M180 60h130M184 75h126\"/><path d=\"M220 30v20M215 45l5 6 5-6\"/><\/g>\n<g fill=\"currentColor\" font-size=\"10\"><text x=\"30\" y=\"30\">mur<\/text><text x=\"240\" y=\"50\">toit<\/text><text x=\"180\" y=\"105\">plan de faille<\/text><\/g>\n<\/svg><h2>Idée 2 · Le rejet<\/h2>\n<p>Le rejet est le déplacement d&#39;un repère (une couche) entre les deux compartiments. On le décompose en rejet vertical et rejet horizontal ; les stries sur le miroir de faille donnent la direction du mouvement.<\/p>\n<h2>Idée 3 · Diaclases et fentes<\/h2>\n<p>Diaclases : fractures sans déplacement. Fentes de tension : ouvertes et souvent remplies de calcite ou de quartz. Elles guident la circulation de l&#39;eau et des minéralisations.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Application<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Une couche est décalée de 5 m vers le bas du côté du toit. Type de faille ?<\/p>\n<\/div><div class=\"ex-r\"><input type=\"text\" placeholder=\"Ta réponse\" autocomplete=\"off\" spellcheck=\"false\"><button class=\"b p\" data-ex=\"v\">Vérifier<\/button><\/div><div class=\"ex-b\"><\/div><div class=\"ex-c\" hidden><p><b>Réponse attendue : 5<\/b><\/p><p>Faille normale, rejet vertical de 5 m.<\/p>\n<\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Comment savoir si une faille est décrochante ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Les stries sur le miroir sont horizontales et les repères sont décalés horizontalement.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Une faille normale indique :<\/div><button class=\"opt\" data-o=\"0\">une extension<\/button><button class=\"opt\" data-o=\"1\">une compression<\/button><button class=\"opt\" data-o=\"2\">un plissement<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Un chevauchement est :<\/div><button class=\"opt\" data-o=\"0\">une faille inverse peu inclinée<\/button><button class=\"opt\" data-o=\"1\">une faille normale<\/button><button class=\"opt\" data-o=\"2\">une diaclase<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Une diaclase :<\/div><button class=\"opt\" data-o=\"0\">n&#39;a pas de déplacement<\/button><button class=\"opt\" data-o=\"1\">a un rejet de plusieurs km<\/button><button class=\"opt\" data-o=\"2\">est un pli<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Les stries donnent :<\/div><button class=\"opt\" data-o=\"0\">la direction du mouvement<\/button><button class=\"opt\" data-o=\"1\">l&#39;âge de la faille<\/button><button class=\"opt\" data-o=\"2\">la nature de la roche<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Dextre signifie :<\/div><button class=\"opt\" data-o=\"0\">le compartiment d&#39;en face part vers la droite<\/button><button class=\"opt\" data-o=\"1\">vers la gauche<\/button><button class=\"opt\" data-o=\"2\">vers le haut<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Le rejet est :<\/div><button class=\"opt\" data-o=\"0\">le déplacement d&#39;un repère<\/button><button class=\"opt\" data-o=\"1\">l&#39;épaisseur de la couche<\/button><button class=\"opt\" data-o=\"2\">la longueur de la faille<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Les fentes de tension sont souvent remplies de :<\/div><button class=\"opt\" data-o=\"0\">calcite ou quartz<\/button><button class=\"opt\" data-o=\"1\">pétrole<\/button><button class=\"opt\" data-o=\"2\">argile pure<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Le toit est :<\/div><button class=\"opt\" data-o=\"0\">au-dessus du plan de faille<\/button><button class=\"opt\" data-o=\"1\">en dessous<\/button><button class=\"opt\" data-o=\"2\">le plan lui-même<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Un horst est :<\/div><button class=\"opt\" data-o=\"0\">un bloc soulevé entre deux failles normales<\/button><button class=\"opt\" data-o=\"1\">un pli<\/button><button class=\"opt\" data-o=\"2\">un fossé<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Les fractures guident :<\/div><button class=\"opt\" data-o=\"0\">la circulation de l&#39;eau souterraine<\/button><button class=\"opt\" data-o=\"1\">la photosynthèse<\/button><button class=\"opt\" data-o=\"2\">la sédimentation marine<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"failles","rep":null,"tol":null},{"n":"failles","rep":["5"],"tol":null},{"n":"failles","rep":null,"tol":null}],"qcm":[{"n":"failles","q":"Une faille normale indique :","o":["une extension","une compression","un plissement"],"a":0,"e":"Toit qui descend."},{"n":"failles","q":"Un chevauchement est :","o":["une faille inverse peu inclinée","une faille normale","une diaclase"],"a":0,"e":"Forte compression."},{"n":"failles","q":"Une diaclase :","o":["n&#39;a pas de déplacement","a un rejet de plusieurs km","est un pli"],"a":0,"e":"Simple fracture."},{"n":"failles","q":"Les stries donnent :","o":["la direction du mouvement","l&#39;âge de la faille","la nature de la roche"],"a":0,"e":"Miroir de faille."},{"n":"failles","q":"Dextre signifie :","o":["le compartiment d&#39;en face part vers la droite","vers la gauche","vers le haut"],"a":0,"e":"Décrochement."},{"n":"failles","q":"Le rejet est :","o":["le déplacement d&#39;un repère","l&#39;épaisseur de la couche","la longueur de la faille"],"a":0,"e":"Mesure du mouvement."},{"n":"failles","q":"Les fentes de tension sont souvent remplies de :","o":["calcite ou quartz","pétrole","argile pure"],"a":0,"e":"Cristallisation."},{"n":"failles","q":"Le toit est :","o":["au-dessus du plan de faille","en dessous","le plan lui-même"],"a":0,"e":"Compartiment supérieur."},{"n":"failles","q":"Un horst est :","o":["un bloc soulevé entre deux failles normales","un pli","un fossé"],"a":0,"e":"Contraire du graben."},{"n":"failles","q":"Les fractures guident :","o":["la circulation de l&#39;eau souterraine","la photosynthèse","la sédimentation marine"],"a":0,"e":"Perméabilité."}]},{"id":"plis-schistosite","t":"Plis et schistosité","seance":"Tectonique souple · Plis, schistosité (sortie de Khénifra)","imp":5,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir appliquer la superposition : les couches les plus jeunes sont au-dessus dans une série normale.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Au cœur d&#39;un anticlinal, trouve-t-on les couches les plus anciennes ou les plus jeunes ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Les plus anciennes.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « cœur ancien = anticlinal, cœur jeune = synclinal ».<\/strong> C&#39;est l&#39;âge des couches au cœur qui définit le pli, pas sa forme.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Définir l&#39;anticlinal seulement comme « un pli en bosse ». Un pli en bosse avec un cœur jeune serait un synforme renversé : c&#39;est l&#39;âge qui compte.<\/p>\n<\/aside><p>À la fin, tu sais décrire un pli et reconnaître une schistosité.<\/p>\n<h2>Idée 1 · Les éléments d&#39;un pli<\/h2>\n<svg viewBox=\"0 0 320 120\" role=\"img\" aria-label=\"Anticlinal et synclinal : charnière, flancs, plan axial\" style=\"max-width:380px;width:100%\">\n<g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M10 90q50-80 100 0t100 0t100 0\"/><path d=\"M10 105q50-80 100 0t100 0t100 0\"/><path d=\"M60 15v95M160 50v65\" stroke=\"#D9824F\" stroke-dasharray=\"4 4\"/><\/g>\n<g fill=\"currentColor\" font-size=\"10\"><text x=\"30\" y=\"12\">anticlinal<\/text><text x=\"135\" y=\"45\">synclinal<\/text><text x=\"66\" y=\"40\">charnière<\/text><text x=\"100\" y=\"80\">flanc<\/text><\/g>\n<\/svg><figure class=\"grille\"><figcaption>Vocabulaire<\/figcaption><table><tr><th>Terme,<\/th><th>Sens<\/th><\/tr><tr><td class=\"h1\">Charnière,<\/td><td>zone<\/td><td>de<\/td><td>courbure<\/td><td>maximale<\/td><\/tr><tr><td class=\"h1\">Flancs,<\/td><td>parties<\/td><td>de<\/td><td>part<\/td><td>et<\/td><td>d'autre<\/td><td>de<\/td><td>la<\/td><td>charnière<\/td><\/tr><tr><td class=\"h1\">Plan<\/td><td>axial,<\/td><td>plan<\/td><td>qui<\/td><td>passe<\/td><td>par<\/td><td>les<\/td><td>charnières<\/td><td>successives<\/td><\/tr><tr><td class=\"h1\">Axe,<\/td><td>ligne<\/td><td>de<\/td><td>charnière<\/td><\/tr><\/table><\/figure><h2>Idée 2 · Classer les plis<\/h2>\n<p>Par le plan axial : droit, déjeté, déversé, couché. Par la forme : isopaque (épaisseur constante), anisopaque. Par l&#39;ouverture : ouvert, serré, isoclinal.<\/p>\n<h2>Idée 3 · La schistosité<\/h2>\n<p>Feuilletage acquis par une roche sous l&#39;effet de la compression, souvent parallèle au plan axial des plis. Elle se superpose à la stratification. Observée dans les schistes paléozoïques de la région de Khénifra.<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Sortie de Khénifra<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Comment distinguer la stratification de la schistosité sur le terrain ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>La stratification suit les variations de couleur et de granulométrie des couches ; la schistosité est un débit régulier qui recoupe souvent la stratification avec un autre angle, parallèle au plan axial.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Un pli dont le plan axial est horizontal est :<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Couché.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Au cœur d&#39;un synclinal :<\/div><button class=\"opt\" data-o=\"0\">les couches les plus jeunes<\/button><button class=\"opt\" data-o=\"1\">les plus anciennes<\/button><button class=\"opt\" data-o=\"2\">aucune couche<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">La charnière est :<\/div><button class=\"opt\" data-o=\"0\">la zone de courbure maximale<\/button><button class=\"opt\" data-o=\"1\">un flanc<\/button><button class=\"opt\" data-o=\"2\">une faille<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Un pli couché a un plan axial :<\/div><button class=\"opt\" data-o=\"0\">horizontal<\/button><button class=\"opt\" data-o=\"1\">vertical<\/button><button class=\"opt\" data-o=\"2\">à 45° exactement<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">La schistosité est due :<\/div><button class=\"opt\" data-o=\"0\">à la compression<\/button><button class=\"opt\" data-o=\"1\">à l&#39;extension<\/button><button class=\"opt\" data-o=\"2\">à la sédimentation<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Un pli isoclinal a des flancs :<\/div><button class=\"opt\" data-o=\"0\">parallèles<\/button><button class=\"opt\" data-o=\"1\">très ouverts<\/button><button class=\"opt\" data-o=\"2\">horizontaux<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">La schistosité est souvent parallèle :<\/div><button class=\"opt\" data-o=\"0\">au plan axial<\/button><button class=\"opt\" data-o=\"1\">à la stratification<\/button><button class=\"opt\" data-o=\"2\">à la surface du sol<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Un pli droit a un plan axial :<\/div><button class=\"opt\" data-o=\"0\">vertical<\/button><button class=\"opt\" data-o=\"1\">horizontal<\/button><button class=\"opt\" data-o=\"2\">absent<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Les plis se forment surtout :<\/div><button class=\"opt\" data-o=\"0\">en domaine ductile<\/button><button class=\"opt\" data-o=\"1\">en domaine cassant<\/button><button class=\"opt\" data-o=\"2\">dans l&#39;air<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">L&#39;âge des couches sert à distinguer :<\/div><button class=\"opt\" data-o=\"0\">anticlinal et synclinal<\/button><button class=\"opt\" data-o=\"1\">faille normale et inverse<\/button><button class=\"opt\" data-o=\"2\">diaclase et fente<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">La région de Khénifra appartient :<\/div><button class=\"opt\" data-o=\"0\">au Moyen Atlas et au Massif central<\/button><button class=\"opt\" data-o=\"1\">au Sahara<\/button><button class=\"opt\" data-o=\"2\">au Rif uniquement<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"plis-schistosite","rep":null,"tol":null},{"n":"plis-schistosite","rep":null,"tol":null},{"n":"plis-schistosite","rep":null,"tol":null}],"qcm":[{"n":"plis-schistosite","q":"Au cœur d&#39;un synclinal :","o":["les couches les plus jeunes","les plus anciennes","aucune couche"],"a":0,"e":"Définition."},{"n":"plis-schistosite","q":"La charnière est :","o":["la zone de courbure maximale","un flanc","une faille"],"a":0,"e":"Sommet du pli."},{"n":"plis-schistosite","q":"Un pli couché a un plan axial :","o":["horizontal","vertical","à 45° exactement"],"a":0,"e":"Très déversé."},{"n":"plis-schistosite","q":"La schistosité est due :","o":["à la compression","à l&#39;extension","à la sédimentation"],"a":0,"e":"Aplatissement."},{"n":"plis-schistosite","q":"Un pli isoclinal a des flancs :","o":["parallèles","très ouverts","horizontaux"],"a":0,"e":"Pli serré."},{"n":"plis-schistosite","q":"La schistosité est souvent parallèle :","o":["au plan axial","à la stratification","à la surface du sol"],"a":0,"e":"Plan de plissement."},{"n":"plis-schistosite","q":"Un pli droit a un plan axial :","o":["vertical","horizontal","absent"],"a":0,"e":"Symétrique."},{"n":"plis-schistosite","q":"Les plis se forment surtout :","o":["en domaine ductile","en domaine cassant","dans l&#39;air"],"a":0,"e":"Profondeur."},{"n":"plis-schistosite","q":"L&#39;âge des couches sert à distinguer :","o":["anticlinal et synclinal","faille normale et inverse","diaclase et fente"],"a":0,"e":"Cœur ancien ou jeune."},{"n":"plis-schistosite","q":"La région de Khénifra appartient :","o":["au Moyen Atlas et au Massif central","au Sahara","au Rif uniquement"],"a":0,"e":"Sortie du module."}]},{"id":"domaines-maroc","t":"Les grands domaines structuraux du Maroc","seance":"Sortie de terrain · Les quatre domaines du Maroc","imp":4,"html":"<h2>Avant de commencer<\/h2>\n<p>Il faut savoir situer sur une carte le Rif, l&#39;Atlas et l&#39;Anti-Atlas.<\/p>\n<section class=\"exo\"><h3>Vérifie ton prérequis<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Du nord au sud, cite le Rif, l&#39;Atlas et l&#39;Anti-Atlas dans l&#39;ordre.<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Rif, puis Atlas (Moyen et Haut Atlas), puis Anti-Atlas.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Comment aborder ce chapitre<\/h2>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p><strong>Pense « plus on va au sud, plus c&#39;est vieux ».<\/strong> Le Rif est jeune (alpin), l&#39;Anti-Atlas expose des roches précambriennes.<\/p>\n<\/aside><aside class=\"enc piege\"><div class=\"enc-t\">Piège<\/div><p>Croire que l&#39;Atlas est une chaîne de collision comme les Alpes. C&#39;est surtout une chaîne <strong>intracontinentale<\/strong> : d&#39;anciens bassins en extension (Trias-Jurassique) ont été comprimés au Cénozoïque.<\/p>\n<\/aside><p>À la fin, tu sais citer les quatre domaines et leur histoire.<\/p>\n<h2>Idée 1 · Les quatre domaines<\/h2>\n<figure class=\"grille\"><figcaption>Domaines structuraux<\/figcaption><table><tr><th>Domaine,<\/th><th>Âge<\/th><th>des<\/th><th>structures,<\/th><th>Caractère<\/th><\/tr><tr><td class=\"h1\">Rif,<\/td><td>alpin<\/td><td>(Cénozoïque),<\/td><td>chaîne<\/td><td>de<\/td><td>collision<\/td><td>liée<\/td><td>à<\/td><td>la<\/td><td>Méditerranée<\/td><\/tr><tr><td class=\"h1\">Domaine<\/td><td>atlasique<\/td><td>(Moyen<\/td><td>et<\/td><td>Haut<\/td><td>Atlas),<\/td><td>mésozoïque<\/td><td>à<\/td><td>cénozoïque,<\/td><td>chaîne<\/td><td>intracontinentale,<\/td><td>bassins<\/td><td>inversés<\/td><\/tr><tr><td class=\"h1\">Meseta<\/td><td>(dont<\/td><td>le<\/td><td>Massif<\/td><td>central,<\/td><td>Khénifra),<\/td><td>hercynien<\/td><td>(Paléozoïque),<\/td><td>socle<\/td><td>plissé<\/td><td>et<\/td><td>schistosé<\/td><\/tr><tr><td class=\"h1\">Anti-Atlas,<\/td><td>précambrien<\/td><td>et<\/td><td>hercynien,<\/td><td>boutonnières<\/td><td>(ex.<\/td><td>Kerdous,<\/td><td>Tafraout)<\/td><\/tr><\/table><\/figure><h2>Idée 2 · Une histoire en trois actes<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Histoire géologique simplifiée<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/3 · 1. Orogenèse hercynienne (fin du Paléozoïque) : plis et schistosité de la Meseta, granites.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/3 · 2. Rifting Trias-Jurassique : extension, bassins de l&#39;Atlas, failles normales.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/3 · 3. Compression alpine (Cénozoïque) : inversion des bassins, surrection de l&#39;Atlas et du Rif.<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><h2>Idée 3 · Une boutonnière<\/h2>\n<p>Une boutonnière est une fenêtre d&#39;érosion qui fait affleurer le socle ancien au cœur d&#39;un anticlinal de couverture (Kerdous dans l&#39;Anti-Atlas, avec les plutons de Tafraout).<\/p>\n<h2>S&#39;exercer<\/h2>\n<section class=\"exo\"><h3>Application<\/h3><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Pourquoi trouve-t-on des schistes plissés paléozoïques près de Khénifra ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>La région appartient au Massif central (Meseta), déformé lors de l&#39;orogenèse hercynienne.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Qu&#39;est-ce que l&#39;inversion d&#39;un bassin ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Un bassin formé en extension (failles normales) est ensuite comprimé : les failles rejouent en inverses et le bassin se soulève.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>Flashcards<\/h2>\n<p class=\"cartes-info\">🃏 4 flashcards de ce chapitre ajoutées à la révision espacée (menu « Flashcards »).<\/p><h2>QCM du chapitre<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Le Rif est une chaîne :<\/div><button class=\"opt\" data-o=\"0\">alpine<\/button><button class=\"opt\" data-o=\"1\">hercynienne<\/button><button class=\"opt\" data-o=\"2\">précambrienne<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Le Haut Atlas résulte surtout :<\/div><button class=\"opt\" data-o=\"0\">de l&#39;inversion de bassins mésozoïques<\/button><button class=\"opt\" data-o=\"1\">d&#39;une collision de deux continents<\/button><button class=\"opt\" data-o=\"2\">d&#39;un point chaud<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Les structures de la Meseta sont :<\/div><button class=\"opt\" data-o=\"0\">hercyniennes<\/button><button class=\"opt\" data-o=\"1\">alpines<\/button><button class=\"opt\" data-o=\"2\">actuelles<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">L&#39;Anti-Atlas montre des roches :<\/div><button class=\"opt\" data-o=\"0\">précambriennes<\/button><button class=\"opt\" data-o=\"1\">uniquement quaternaires<\/button><button class=\"opt\" data-o=\"2\">uniquement crétacées<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">Le rifting Trias-Jurassique est une phase :<\/div><button class=\"opt\" data-o=\"0\">d&#39;extension<\/button><button class=\"opt\" data-o=\"1\">de compression<\/button><button class=\"opt\" data-o=\"2\">de décrochement pur<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">Kerdous est :<\/div><button class=\"opt\" data-o=\"0\">une boutonnière<\/button><button class=\"opt\" data-o=\"1\">un volcan actif<\/button><button class=\"opt\" data-o=\"2\">un lac<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">L&#39;orogenèse hercynienne date de :<\/div><button class=\"opt\" data-o=\"0\">la fin du Paléozoïque<\/button><button class=\"opt\" data-o=\"1\">du Cénozoïque<\/button><button class=\"opt\" data-o=\"2\">du Quaternaire<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Une inversion transforme des failles normales en :<\/div><button class=\"opt\" data-o=\"0\">failles inverses<\/button><button class=\"opt\" data-o=\"1\">diaclases<\/button><button class=\"opt\" data-o=\"2\">plis couchés uniquement<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Khénifra se trouve dans :<\/div><button class=\"opt\" data-o=\"0\">le Massif central marocain<\/button><button class=\"opt\" data-o=\"1\">l&#39;Anti-Atlas<\/button><button class=\"opt\" data-o=\"2\">le Rif<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Du nord au sud, l&#39;âge des structures :<\/div><button class=\"opt\" data-o=\"0\">augmente globalement<\/button><button class=\"opt\" data-o=\"1\">diminue<\/button><button class=\"opt\" data-o=\"2\">reste identique<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"domaines-maroc","rep":null,"tol":null},{"n":"domaines-maroc","rep":null,"tol":null},{"n":"domaines-maroc","rep":null,"tol":null}],"qcm":[{"n":"domaines-maroc","q":"Le Rif est une chaîne :","o":["alpine","hercynienne","précambrienne"],"a":0,"e":"Cénozoïque."},{"n":"domaines-maroc","q":"Le Haut Atlas résulte surtout :","o":["de l&#39;inversion de bassins mésozoïques","d&#39;une collision de deux continents","d&#39;un point chaud"],"a":0,"e":"Intracontinental."},{"n":"domaines-maroc","q":"Les structures de la Meseta sont :","o":["hercyniennes","alpines","actuelles"],"a":0,"e":"Paléozoïque."},{"n":"domaines-maroc","q":"L&#39;Anti-Atlas montre des roches :","o":["précambriennes","uniquement quaternaires","uniquement crétacées"],"a":0,"e":"Boutonnières."},{"n":"domaines-maroc","q":"Le rifting Trias-Jurassique est une phase :","o":["d&#39;extension","de compression","de décrochement pur"],"a":0,"e":"Bassins."},{"n":"domaines-maroc","q":"Kerdous est :","o":["une boutonnière","un volcan actif","un lac"],"a":0,"e":"Anti-Atlas."},{"n":"domaines-maroc","q":"L&#39;orogenèse hercynienne date de :","o":["la fin du Paléozoïque","du Cénozoïque","du Quaternaire"],"a":0,"e":"≈ 300 Ma."},{"n":"domaines-maroc","q":"Une inversion transforme des failles normales en :","o":["failles inverses","diaclases","plis couchés uniquement"],"a":0,"e":"Rejeu."},{"n":"domaines-maroc","q":"Khénifra se trouve dans :","o":["le Massif central marocain","l&#39;Anti-Atlas","le Rif"],"a":0,"e":"Bordure du Moyen Atlas."},{"n":"domaines-maroc","q":"Du nord au sud, l&#39;âge des structures :","o":["augmente globalement","diminue","reste identique"],"a":0,"e":"Rif jeune, Anti-Atlas ancien."}]},{"id":"annale-2020","t":"Annale corrigée · examen de septembre 2020","seance":"Examen du module de Tectonique BCG S4 (1 h 30, question de synthèse)","imp":5,"payant":true,"html":"<p><strong>Sujet (18/09/2020).<\/strong> En exploitant ce que tu as appris en tectonique, montre le rôle du géologue pour faciliter l&#39;exploration, l&#39;exploitation et la protection des ressources naturelles : eaux souterraines, pétrole, métaux, matériaux de construction. Schémas encouragés, aucun copier-coller.<\/p>\n<aside class=\"enc astuce\"><div class=\"enc-t\">Astuce<\/div><p>Une synthèse se note sur le plan, les exemples et les schémas. Fais une introduction, une partie par ressource, une conclusion.<\/p>\n<\/aside><h2>Plan corrigé<\/h2>\n<figure class=\"etapes\" data-i=\"0\"><figcaption>Plan type<\/figcaption><div class=\"etape\"><div class=\"et-t\">1/6 · 1. Introduction : la tectonique contrôle où les ressources se forment, se piègent et circulent ; le géologue cartographie failles, plis et fractures.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">2/6 · 2. Eaux souterraines : les failles et fractures servent de drains ; les synclinaux et grabens remplis de roches perméables forment des aquifères ; on implante les forages sur les zones fracturées ; protection : périmètres autour des failles qui conduisent les pollutions.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">3/6 · 3. Pétrole et gaz : pièges structuraux, anticlinaux et failles, qui bloquent les hydrocarbures sous une couverture imperméable ; la sismique réflexion repère ces structures.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">4/6 · 4. Métaux : les minéralisations se déposent dans des failles et des fentes (filons) et au contact des plutons ; suivre la direction des failles guide l&#39;exploration (ex. Anti-Atlas).<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">5/6 · 5. Matériaux de construction : choix de carrières dans des roches peu fracturées ; stabilité des talus et des ouvrages (barrages, routes) selon le pendage et les failles.<\/div><\/div><div class=\"etape\" hidden><div class=\"et-t\">6/6 · 6. Conclusion : le géologue réduit les coûts d&#39;exploration et les risques (glissements, pollutions, séismes) ; il concilie exploitation et protection.<\/div><\/div><div class=\"et-nav\"><button class=\"b\" data-et=\"-1\">← Étape précédente<\/button><button class=\"b p\" data-et=\"1\">Étape suivante →<\/button><\/div><\/figure><section class=\"exo\"><h3>Questions pour vérifier ta copie<\/h3><div class=\"ex\" data-x=\"0\"><div class=\"ex-q\"><p>Pourquoi un anticlinal peut-il piéger du pétrole ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Le pétrole, plus léger que l&#39;eau, migre vers le haut et s&#39;accumule sous la charnière, si une couche imperméable (argile, sel) le recouvre.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"1\"><div class=\"ex-q\"><p>Pourquoi une zone faillée est-elle intéressante pour un forage d&#39;eau ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Les fractures augmentent la perméabilité et collectent l&#39;eau : le débit est plus élevé.<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><div class=\"ex\" data-x=\"2\"><div class=\"ex-q\"><p>Quel risque une faille fait-elle courir à un barrage ?<\/p>\n<\/div><div class=\"ex-b\"><button class=\"b p\" data-ex=\"c\">Voir le corrigé<\/button><\/div><div class=\"ex-c\" hidden><p>Fuites d&#39;eau à travers la zone fracturée et instabilité si la faille est active (séismes).<\/p>\n<div class=\"ex-b\"><button class=\"b ok\" data-ex=\"1\">J'avais juste<\/button><button class=\"b ko\" data-ex=\"0\">J'avais faux<\/button><\/div><\/div><\/div><\/section><h2>QCM d&#39;entraînement<\/h2>\n<section class=\"qcm\"><div class=\"qq\" data-k=\"0\"><div class=\"qq-q\">Un piège à pétrole structural typique :<\/div><button class=\"opt\" data-o=\"0\">un anticlinal sous une couverture imperméable<\/button><button class=\"opt\" data-o=\"1\">un synclinal sans couverture<\/button><button class=\"opt\" data-o=\"2\">une plage<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"1\"><div class=\"qq-q\">Les failles sont souvent :<\/div><button class=\"opt\" data-o=\"0\">des drains pour l&#39;eau<\/button><button class=\"opt\" data-o=\"1\">totalement imperméables<\/button><button class=\"opt\" data-o=\"2\">sans effet<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"2\"><div class=\"qq-q\">Un filon minéralisé se dépose souvent :<\/div><button class=\"opt\" data-o=\"0\">dans une faille ou une fente<\/button><button class=\"opt\" data-o=\"1\">dans l&#39;atmosphère<\/button><button class=\"opt\" data-o=\"2\">dans un fossile<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"3\"><div class=\"qq-q\">Une carrière de pierre de taille cherche une roche :<\/div><button class=\"opt\" data-o=\"0\">peu fracturée<\/button><button class=\"opt\" data-o=\"1\">très fracturée<\/button><button class=\"opt\" data-o=\"2\">argileuse<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"4\"><div class=\"qq-q\">La sismique réflexion sert à :<\/div><button class=\"opt\" data-o=\"0\">imager les structures en profondeur<\/button><button class=\"opt\" data-o=\"1\">dater les fossiles<\/button><button class=\"opt\" data-o=\"2\">mesurer la pluie<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"5\"><div class=\"qq-q\">La couverture d&#39;un réservoir doit être :<\/div><button class=\"opt\" data-o=\"0\">imperméable<\/button><button class=\"opt\" data-o=\"1\">perméable<\/button><button class=\"opt\" data-o=\"2\">fracturée<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"6\"><div class=\"qq-q\">Un aquifère est :<\/div><button class=\"opt\" data-o=\"0\">une roche qui contient et laisse circuler l&#39;eau<\/button><button class=\"opt\" data-o=\"1\">un pli<\/button><button class=\"opt\" data-o=\"2\">une faille sèche<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"7\"><div class=\"qq-q\">Protéger une nappe implique de surveiller :<\/div><button class=\"opt\" data-o=\"0\">les failles qui peuvent conduire des pollutions<\/button><button class=\"opt\" data-o=\"1\">les nuages<\/button><button class=\"opt\" data-o=\"2\">les fossiles<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"8\"><div class=\"qq-q\">Une synthèse se note surtout sur :<\/div><button class=\"opt\" data-o=\"0\">le plan, les exemples et les schémas<\/button><button class=\"opt\" data-o=\"1\">la longueur seule<\/button><button class=\"opt\" data-o=\"2\">le copier-coller<\/button><div class=\"qq-e\" hidden><\/div><\/div><div class=\"qq\" data-k=\"9\"><div class=\"qq-q\">Le pétrole, par rapport à l&#39;eau, est :<\/div><button class=\"opt\" data-o=\"0\">plus léger<\/button><button class=\"opt\" data-o=\"1\">plus lourd<\/button><button class=\"opt\" data-o=\"2\">de même densité<\/button><div class=\"qq-e\" hidden><\/div><\/div><\/section>","ex":[{"n":"annale-2020","rep":null,"tol":null},{"n":"annale-2020","rep":null,"tol":null},{"n":"annale-2020","rep":null,"tol":null}],"qcm":[{"n":"annale-2020","q":"Un piège à pétrole structural typique :","o":["un anticlinal sous une couverture imperméable","un synclinal sans couverture","une plage"],"a":0,"e":"Le pétrole monte."},{"n":"annale-2020","q":"Les failles sont souvent :","o":["des drains pour l&#39;eau","totalement imperméables","sans effet"],"a":0,"e":"Fractures."},{"n":"annale-2020","q":"Un filon minéralisé se dépose souvent :","o":["dans une faille ou une fente","dans l&#39;atmosphère","dans un fossile"],"a":0,"e":"Circulation de fluides."},{"n":"annale-2020","q":"Une carrière de pierre de taille cherche une roche :","o":["peu fracturée","très fracturée","argileuse"],"a":0,"e":"Blocs sains."},{"n":"annale-2020","q":"La sismique réflexion sert à :","o":["imager les structures en profondeur","dater les fossiles","mesurer la pluie"],"a":0,"e":"Exploration pétrolière."},{"n":"annale-2020","q":"La couverture d&#39;un réservoir doit être :","o":["imperméable","perméable","fracturée"],"a":0,"e":"Elle bloque les fluides."},{"n":"annale-2020","q":"Un aquifère est :","o":["une roche qui contient et laisse circuler l&#39;eau","un pli","une faille sèche"],"a":0,"e":"Perméable."},{"n":"annale-2020","q":"Protéger une nappe implique de surveiller :","o":["les failles qui peuvent conduire des pollutions","les nuages","les fossiles"],"a":0,"e":"Circulations rapides."},{"n":"annale-2020","q":"Une synthèse se note surtout sur :","o":["le plan, les exemples et les schémas","la longueur seule","le copier-coller"],"a":0,"e":"Consigne."},{"n":"annale-2020","q":"Le pé const lireJ = (k) => { try { return JSON.parse(localStorage.getItem(k) || "{}") || {}; } catch (e) { return {}; } };
const ecrireJ = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const etat = () => { const S = lireJ(MODULE.cleEtat); S.attempts = S.attempts || {}; S.cards = S.cards || {}; return S; };
function noter(n, ok) { const S = etat(); (S.attempts[n] = S.attempts[n] || []).push(ok ? 1 : 0); if (S.attempts[n].length > 30) S.attempts[n].shift(); ecrireJ(MODULE.cleEtat, S); }
// Maîtrisé = au moins 3 essais et 80 % de réussite sur les 5 derniers (règle commune à la plateforme).
function statut(n) {
  if (MODULE.format === "score10") { const v = lireJ(MODULE.cle)[n]; if (v !== undefined) return [v >= 8 ? "ok" : "fragile", v / 10]; }
  if (MODULE.format === "best") { const v = (lireJ(MODULE.cle).notions || {})[n]; return v && v.best != null ? [v.best >= 0.8 ? "ok" : "fragile", v.best] : ["jamais", null]; }
  if (MODULE.format === "pc") { const v = lireJ(MODULE.cle)[n]; return v && v.pc !== undefined ? [v.pc >= 80 ? "ok" : "fragile", v.pc / 100] : ["jamais", null]; } const a = (etat().attempts[n] || []).slice(-5); if (!a.length) return ["jamais", null]; const r = a.reduce((x, y) => x + y, 0) / a.length; return [(etat().attempts[n].length >= 3 && r >= 0.8) ? "ok" : "fragile", r]; }
const NCH = {}; NOTIONS.forEach((n) => (NCH[n.ch] = NCH[n.ch] || []).push(n));
function scoreChap(c) {
  if (MODULE.format === "score10") return lireJ(MODULE.cle)[c.id];
  if (MODULE.format === "pc") { const v = lireJ(MODULE.cle)[c.id]; return v && v.pc !== undefined ? Math.round(v.pc / 10) : undefined; }
  if (MODULE.format === "best") { const v = (lireJ(MODULE.cle).notions || {})[c.id]; return v && v.best != null ? Math.round(v.best * 10) : undefined; }
  const l = NCH[c.id] || []; if (!l.length || !l.some((n) => statut(n.id)[0] !== "jamais")) return undefined;
  return Math.round((10 * l.filter((n) => statut(n.id)[0] === "ok").length) / l.length);
}

    <button class="mzt-pri" id="mztSend" type="submit">Envoyer</button>
    <button type="button" id="mztStop" hidden>Arrêter</button>
    <label id="mztImgL" hidden>📎 Photo<input type="file" id="mztImg" accept="image/*" hidden></label>
    <span class="mzt-note" id="mztImgN"></span>
    <label title="Modèle plus puissant : réponse plus longue et plus détaillée, consomme davantage"><input type="checkbox" id="mztDeep"> Approfondi</label>
    <button type="button" id="mztNew">Nouvelle discussion</button>
   </div>
   <p class="mzt-note" id="mztNote"></p>
  </form>
 </div>
 <div class="mzt-body" id="mztHist" hidden><div style="padding:10px"><input type="search" id="mztQ" placeholder="Chercher dans toutes mes anciennes questions…"></div><div class="mzt-list" id="mztList"></div></div>
 <div class="mzt-body" id="mztMem" hidden><div class="mzt-list"><p class="mzt-note">Ce que le tuteur retient de tes difficultés d'une conversation à l'autre. Il s'en sert pour faire des liens avec tes confusions passées. Tu peux effacer une note.</p><div id="mztMemL"></div></div></div>
</div>`);

  const CHIPS = ['Explique plus simplement', 'Donne un exemple concret', "Pourquoi c'est un piège ?", 'Fais-moi un mini-exercice'];
  $('#mztChips').innerHTML = CHIPS.map((c) => `<button type="button" data-chip="${esc(c)}">${esc(c)}</button>`).join('');

  function view(v) {
    $('#mztChat').hidden = v !== 'chat'; $('#mztHist').hidden = v !== 'hist'; $('#mztMem').hidden = v !== 'mem';
    $('#mztTabH').textContent = v === 'hist' ? 'Retour' : 'Historique'; $('#mztTabM').textContent = v === 'mem' ? 'Retour' : 'Mémoire';
    if (v === 'hist') renderList(); if (v === 'mem') renderMem();
  }
  function note() {
    $('#mztNote').textContent = !ready ? 'Connexion au tuteur…' : sample
      ? 'Mode rapide (économe) par défaut. « Approfondi » ou « Approfondir cette réponse » utilise un modèle supérieur. Pense à chercher dans l\'Historique avant de reposer une question.'
      : 'Le tuteur n\'est pas disponible ici (il faut ouvrir la page dans Claude et accepter la demande d\'autorisation). L\'historique reste consultable.';
  }
  function refreshCtx() {
    const c = context(); $('#mztCtx').textContent = '· ' + c.label; $('#mztPrev').textContent = c.text.slice(0, 2500) + (c.text.length > 2500 ? '\n…' : '');
    return c;
  }
  function openPanel(ctx) {
    forced = ctx && ctx.text ? ctx : null;
    $('#mztPan').hidden = false; $('#mztBtn').hidden = true; view('chat');
    const c = refreshCtx();
    if (!cur || cur.sec !== c.label) { const ts = ST.threads.filter((t) => t.sec === c.label); cur = forced ? null : ts[ts.length - 1] || null; }
    renderLog(); note(); setTimeout(() => $('#mztIn').focus(), 30);
  }
  function closePanel() { $('#mztPan').hidden = true; $('#mztBtn').hidden = false; forced = null; }

  // Sur téléphone, la réponse doit avoir la place : relances et note seulement sur une discussion vide.
  function compacter(on) { $('#mztChips').hidden = on; $('#mztNote').hidden = on; }
  function renderLog() {
    const log = $('#mztLog'); log.innerHTML = ''; compacter(!!(cur && cur.msgs.length));
    if (!cur || !cur.msgs.length) {
      log.innerHTML = `<div class="mzt-m a">Pose ta question sur « ${esc(context().label)} » : une phrase que tu ne comprends pas, un calcul à vérifier, un exemple en plus… Tu peux joindre une photo de ton brouillon.</div>`; return;
    }
    cur.msgs.forEach((m, i) => {
      const d = document.createElement('div'); d.className = 'mzt-m ' + (m.r === 'u' ? 'u' : 'a');
      if (m.d) d.innerHTML = '<span class="mzt-tag">Réponse approfondie</span>';
      if (m.r === 'u') d.appendChild(document.createTextNode(m.t)); else d.insertAdjacentHTML('beforeend', md(m.t)); log.appendChild(d);
      if (m.r === 'a' && i === cur.msgs.length - 1 && !m.d && !busy) {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'mzt-deepbtn'; b.textContent = 'Approfondir cette réponse';
        b.onclick = () => ask('Approfondis ta réponse précédente : explique plus en détail, avec un exemple complet et les pièges.', true); log.appendChild(b);
      }
    });
    dessinerMaths(log); log.scrollTop = 1e9;
  }
  function renderList() {
    const q = norm($('#mztQ').value || ''); const ts = [...ST.threads].reverse().filter((t) => !q || norm(t.msgs.map((m) => m.t).join(' ')).includes(q));
    $('#mztList').innerHTML = ts.length ? ts.map((t) => `<details class="mzt-item"><summary>${esc(t.title)}</summary><div class="mzt-meta">${esc(t.sec)} · ${esc(t.date)}</div>${t.msgs.map((m) => `<div class="mzt-m ${m.r === 'u' ? 'u' : 'a'}" style="margin:6px 0">${m.r === 'u' ? esc(m.t) : md(m.t)}</div>`).join('')}<button type="button" data-cont="${esc(t.id)}">Continuer cette discussion</button></details>`).join('')
      : `<p class="mzt-note">${ST.threads.length ? 'Aucune discussion ne contient ce mot.' : 'Aucune discussion pour l\'instant.'}</p>`;
    dessinerMaths($('#mztList'));
  }
  function renderMem() {
    $('#mztMemL').innerHTML = ST.memos.length ? ST.memos.map((m, i) => `<div class="mzt-item"><div class="mzt-meta">${esc(m.date)}</div>${esc(m.text)}<div><button type="button" data-memdel="${i}" style="margin-top:4px">Effacer</button></div></div>`).join('')
      : '<p class="mzt-note">Aucune note pour l\'instant. Elles apparaîtront au fil de tes questions.</p>';
  }

  // ---------- stockage compte ----------
  async function saveThread(t) {
    saveLocal(); if (!db) return;
    try { await db.collection(base + '/threads').doc(t.id).set({ sec: t.sec, date: t.date, title: t.title, msgs: t.msgs.slice(-40) }); } catch (e) {}
  }
  async function saveMemos() { saveLocal(); if (!db) return; try { await db.doc(base).set({ memos: ST.memos.slice(-30), updated: Date.now() }); } catch (e) {} }

  // ---------- appel au tuteur ----------
  const ERR = { not_granted: 'Tu n\'as pas autorisé la page à utiliser Claude. Recharge-la et accepte la demande, ou change-le dans le menu Autorisations de l\'artifact.', rate_limited: 'Trop de questions d\'un coup, ou limite d\'usage atteinte. Réessaie dans un moment.', prompt_too_large: 'L\'extrait est trop long : ouvre une partie plus précise du cours.', image_rejected: 'Cette photo n\'est pas acceptée. Essaie un JPEG ou un PNG plus léger.', refused: 'Claude n\'a pas pu répondre à cette demande. Reformule ta question.' };
  const visible = (t) => {
    const L = String(t).split('\n');
    for (let i = L.length - 1; i >= Math.max(0, L.length - 3); i--) if (/^\s*M[ÉE]MO\s*:/i.test(L[i])) return L.slice(0, i).join('\n').trim();
    return String(t).trim();
  };
  // rendu léger : on échappe le HTML d'abord, puis gras, italique, code, titres, puces, tableaux et blocs de code.
  // Les formules ($…$, $$…$$, \(…\), \[…\]) sont mises de côté avant le Markdown, puis dessinées par MathJax.
  const MATHS = [];
  const protegerMaths = (t) => {
    MATHS.length = 0;
    const garde = (tex, d) => { MATHS.push({ tex: tex.trim(), d }); return '\u0000' + (MATHS.length - 1) + '\u0000'; };
    const RX = /\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$(?=[^\s$\d])([^$\n]*?[^\s$\\])\$(?!\d)/g;
    // le code (blocs ``` et `…`) n'est jamais lu comme une formule
    return String(t).split(/(```[\s\S]*?(?:```|$))/).map((bloc, i) => i % 2 ? bloc
      : bloc.split(/(`[^`\n]*`)/).map((x, j) => j % 2 ? x : x.replace(RX, (_, a, b, c, d) => a != null ? garde(a, 1) : b != null ? garde(b, 1) : c != null ? garde(c, 0) : garde(d, 0))).join('')).join('');
  };
  const rendreMaths = (h) => h.replace(/\u0000(\d+)\u0000/g, (_, n) => { const m = MATHS[+n]; return m ? `<span class="mzt-tex${m.d ? ' d' : ''}" data-d="${m.d}">${esc(m.tex)}</span>` : ''; });
  const inl = (s) => {
    const p = s.split('`'); if (p.length % 2 === 0) { const last = p.pop(); p[p.length - 1] += '`' + last; }
    return p.map((x, i) => i % 2 ? '<code>' + esc(x) + '</code>' : esc(x).replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*\w])\*([^*\n]+)\*(?![*\w])/g, '$1<em>$2</em>')).join('');
  };
  const cellules = (l) => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim());
  const md = (t) => {
    const out = []; let list = null, code = null, tab = null;
    const flushTab = () => {
      if (!tab) return;
      if (tab.length >= 2 && /^[\s|:-]+$/.test(tab[1]) && tab[1].includes('-')) {
        const [tete, , ...corps] = tab;
        out.push('<div class="mzt-tab"><table><thead><tr>' + cellules(tete).map((c) => '<th>' + inl(c) + '</th>').join('') + '</tr></thead><tbody>'
          + corps.map((r) => '<tr>' + cellules(r).map((c) => '<td>' + inl(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>');
      } else tab.forEach((r) => out.push('<p>' + inl(r) + '</p>'));
      tab = null;
    };
    const flush = () => { flushTab(); if (list) { out.push('</' + list + '>'); list = null; } };
    protegerMaths(t).split('\n').forEach((raw) => {
      if (/^\s*```/.test(raw)) { if (code === null) { flush(); code = []; } else { out.push('<pre>' + esc(code.join('\n')) + '</pre>'); code = null; } return; }
      if (code !== null) { code.push(raw); return; }
      let m;
      if (/^\s*\|.*\|\s*$/.test(raw)) { if (list) { out.push('</' + list + '>'); list = null; } (tab = tab || []).push(raw); return; }
      flushTab();
      if ((m = raw.match(/^\s*#{1,6}\s+(.*)$/))) { flush(); out.push('<p><strong>' + inl(m[1]) + '</strong></p>'); }
      else if ((m = raw.match(/^\s*[-*•]\s+(.*)$/))) { if (list !== 'ul') { flush(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + inl(m[1]) + '</li>'); }
      else if ((m = raw.match(/^\s*\d+[.)]\s+(.*)$/))) { if (list !== 'ol') { flush(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + inl(m[1]) + '</li>'); }
      else if (!raw.trim()) flush();
      else { flush(); out.push('<p>' + inl(raw) + '</p>'); }
    });
    if (code !== null) out.push('<pre>' + esc(code.join('\n')) + '</pre>');
    flush(); return rendreMaths(out.join(''));
  };

  // ---------- MathJax : celui de la page s'il existe, sinon chargé à la première formule ----------
  let mjPret = null;
  const mathjax = () => mjPret || (mjPret = new Promise((ok, ko) => {
    if (!window.MathJax) {
      window.MathJax = { svg: { fontCache: 'global' }, startup: { typeset: false } };
      const s = document.createElement('script'); s.async = true; s.src = 'https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js';
      s.onerror = () => ko(new Error('MathJax')); document.head.appendChild(s);
    }
    let n = 0; const t = setInterval(() => {
      if (window.MathJax && MathJax.tex2svgPromise && MathJax.startup && MathJax.startup.promise) { clearInterval(t); MathJax.startup.promise.then(ok, ko); }
      else if (++n > 150) { clearInterval(t); ko(new Error('MathJax')); }
    }, 100);
  })).catch((e) => { mjPret = null; throw e; });
  const svgCache = new Map(); let file = Promise.resolve();
  function dessinerMaths(racine) {
    const spans = [...racine.querySelectorAll('.mzt-tex:not([data-ok])')]; if (!spans.length) return;
    mathjax().then(() => spans.forEach((sp) => {
      const cle = sp.dataset.d + '|' + sp.textContent;
      const poser = (n) => { if (!sp.isConnected || sp.dataset.ok) return; sp.textContent = ''; sp.appendChild(n.cloneNode(true)); sp.dataset.ok = '1'; };
      if (svgCache.has(cle)) return poser(svgCache.get(cle));
      file = file.then(() => MathJax.tex2svgPromise(sp.textContent, { display: sp.dataset.d === '1' }).then((n) => { svgCache.set(cle, n); poser(n); })).catch(() => {});
    })).catch(() => {});
  }
  async function ask(q, deep) {
    q = (q || '').trim(); deep = deep || $('#mztDeep').checked;
    if (busy || !q) return; if (!sample) { note(); return; }
    const c = refreshCtx();
    if (!cur || (cur.sec !== c.label && !forced)) { cur = { id: 't' + Date.now().toString(36), sec: c.label, date: today(), title: q.slice(0, 80), msgs: [] }; ST.threads.push(cur); }
    else if (!ST.threads.includes(cur)) ST.threads.push(cur);
    cur.msgs.push({ r: 'u', t: q }); busy = true; renderLog();
    const out = document.createElement('div'); out.className = 'mzt-m a'; out.textContent = deep ? 'Réflexion approfondie…' : 'Réflexion…'; $('#mztLog').appendChild(out);
    $('#mztSend').disabled = true; $('#mztStop').hidden = false;
    const style = deep
      ? 'Réponse APPROFONDIE (400 à 700 mots) : 1) l\'intuition avec une analogie, 2) l\'explication détaillée pas à pas, 3) pourquoi ça marche, 4) un exemple complet chiffré, 5) les pièges fréquents et ce qui tombe à l\'examen, 6) une question pour vérifier la compréhension.'
      : 'Réponse EXPLICATIVE (150 à 250 mots) : 1) l\'idée en une phrase, 2) l\'explication pas à pas, 3) un petit exemple chiffré ou concret, 4) une courte question pour vérifier la compréhension.';
    const mem = [];
    if (ST.memos.length) mem.push('DIFFICULTÉS DÉJÀ REPÉRÉES :\n' + ST.memos.slice(-12).map((m) => `- ${m.date} : ${m.text}`).join('\n'));
    const lastQ = ST.threads.flatMap((t) => t.msgs.filter((m) => m.r === 'u').map((m) => `[${t.sec}] ${m.t.slice(0, 100)}`)).slice(-6);
    if (lastQ.length) mem.push('SES DERNIÈRES QUESTIONS :\n' + lastQ.map((x) => '- ' + x).join('\n'));
    const rules = `Tu es le tuteur de ${C.student}, pour le module ${C.module}${C.prof ? ' du ' + C.prof : ''}. Il apprend souvent la notion pour la première fois.
Règles : réponds en français simple, en Markdown léger (**gras** pour les termes clés, tirets, étapes numérotées). Toute formule ou tout calcul s'écrit en LaTeX : $…$ dans la phrase, $$…$$ seul sur sa ligne pour une formule importante (ex. $\\hat y_i$, $$\\text{MSE}=\\frac{1}{n}\\sum_{i=1}^{n}(y_i-\\hat y_i)^2$$) ; jamais d'accents graves pour une formule, ils sont réservés au code et aux noms de fonctions. Un petit tableau Markdown est permis s'il clarifie (3 colonnes maximum, l'écran est étroit). ${style} Appuie-toi d'abord sur l'EXTRAIT ci-dessous et sur les conventions du prof ; si une source générale diffère du cours, signale l'écart et dis quelle version utiliser à l'examen (celle du prof). Pour un calcul, pose chaque étape et vérifie-la. S'il envoie une réponse ou une photo de brouillon, corrige étape par étape et nomme précisément l'erreur. Si tu n'es pas sûr, dis-le. S'il demande un mini-exercice, donne l'exercice sans la solution.
Utilise sa mémoire pour faire des liens avec ses confusions passées, sans la réciter.
Termine TOUJOURS par une dernière ligne séparée au format exact « MÉMO: … » qui résume en 15 mots maximum la difficulté révélée par sa question (ou « MÉMO: rien »). Cette ligne lui est cachée.
${C.conventions ? 'CONVENTIONS DU PROF : ' + C.conventions + '\n' : ''}MÉMOIRE DE L'ÉLÈVE :
${mem.join('\n\n') || '(rien pour l\'instant)'}
EXTRAIT (${c.label}) :
${c.text.slice(0, deep ? 9000 : 3500)}`;
    const recent = cur.msgs.slice(deep ? -9 : -5, -1).map((m) => ({ role: m.r === 'u' ? 'user' : 'assistant', content: m.t }));
    while (recent.length && recent[0].role !== 'user') recent.shift();
    const msgs = [...recent.filter((m) => m.content && m.content.trim()), { role: 'user', content: q }]; while (msgs.length > 1 && msgs[0].role !== 'user') msgs.shift(); msgs[0] = { role: 'user', content: rules + '\n\n---\nQuestion : ' + msgs[0].content };
    ctl = new AbortController();
    const opts = { modelTier: deep ? 'complex' : 'quick', cache: false, signal: ctl.signal, onText: ({ text }) => { out.innerHTML = md(visible(text)); dessinerMaths(out); $('#mztLog').scrollTop = 1e9; } };
    if (img) opts.images = [img];
    try {
      const r = await sample(msgs, opts);
      const mm = r.text.match(/(?:^|\n)\s*M[ÉE]MO\s*:\s*(.+)\s*$/i);
      cur.msgs.push({ r: 'a', t: visible(r.text) + (r.truncated ? '\n\n(Réponse coupée : pose une question plus ciblée.)' : ''), d: !!deep });
      if (mm && !/^\s*rien/i.test(mm[1])) { ST.memos.push({ date: today(), text: mm[1].trim().slice(0, 160) }); if (ST.memos.length > 30) ST.memos.shift(); saveMemos(); }
      await saveThread(cur);
    } catch (e) {
      const kept = e && e.text ? visible(e.text) : '';
      if (e && e.code === 'cancelled') { if (kept) cur.msgs.push({ r: 'a', t: kept + '\n(Arrêté.)' }); else cur.msgs.pop(); }
      else { cur.msgs.pop(); compacter(!!cur.msgs.length); out.textContent = (kept ? kept + '\n\n' : '') + (ERR[e && e.code] || 'Le tuteur n\'a pas pu répondre. Réessaie dans un instant.'); }
      if (!cur.msgs.length) ST.threads = ST.threads.filter((t) => t !== cur);
      saveLocal();
      if (!(e && e.code === 'cancelled')) { busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImgN').textContent = ''; return; }
    }
    busy = false; $('#mztSend').disabled = false; $('#mztStop').hidden = true; img = null; $('#mztImg').value = ''; $('#mztImgN').textContent = ''; renderLog();
  }

  // ---------- événements ----------
  $('#mztBtn').onclick = () => openPanel(null);
  $('#mztX').onclick = closePanel;
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#mztPan').hidden) closePanel(); });
  $('#mztTabH').onclick = () => view($('#mztHist').hidden ? 'hist' : 'chat');
  $('#mztTabM').onclick = () => view($('#mztMem').hidden ? 'mem' : 'chat');
  $('#mztQ').oninput = renderList;
  $('#mztList').onclick = (e) => { const id = e.target.dataset && e.target.dataset.cont; if (!id) return; cur = ST.threads.find((t) => t.id === id); view('chat'); $('#mztCtx').textContent = '· ' + cur.sec; renderLog(); };
  $('#mztMemL').onclick = (e) => { const i = e.target.dataset && e.target.dataset.memdel; if (i == null) return; ST.memos.splice(+i, 1); saveMemos(); renderMem(); };
  $('#mztChips').onclick = (e) => { const b = e.target.closest('[data-chip]'); if (!b) return; const t = $('#mztIn'); t.value = b.dataset.chip + (t.value ? ' : ' + t.value : ''); t.focus(); };
  $('#mztNew').onclick = () => { cur = null; renderLog(); };
  $('#mztStop').onclick = () => { if (ctl) ctl.abort(); };
  $('#mztImg').onchange = (e) => { img = e.target.files[0] || null; $('#mztImgN').textContent = img ? 'Photo : ' + img.name : ''; };
  $('#mztF').onsubmit = (e) => { e.preventDefault(); const v = $('#mztIn').value; $('#mztIn').value = ''; ask(v); };
  $('#mztIn').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#mztF').requestSubmit(); } });

  // ---------- capacités (facultatives) ----------
  const W = window.claude;
  if (W && W.use) {
    W.use('sample').then((s) => { sample = s; ready = true; note();
      if (s && s.limits) s.limits().then((l) => { if (l && l.images) { imgOK = true; $('#mztImgL').hidden = false; if (l.images.mediaTypes) $('#mztImg').accept = l.images.mediaTypes.join(','); } }).catch(() => {});
    }).catch(() => { ready = true; note(); });
    Promise.all([W.use('db'), W.use('user')]).then(async ([d, u]) => {
      if (!d || !u) return; const id = await u.id(); if (!id) return; db = d; base = 'data/users/' + id + '/mzt_' + C.id;
      try {
        const m = await db.doc(base).get(); if (m.exists) { const v = m.data() || {}; if (Array.isArray(v.memos)) ST.memos = JSON.parse(JSON.stringify(v.memos)); }
        const q = await db.collection(base + '/threads').get(); const remote = q.docs.map((x) => Object.assign({ id: x.id }, JSON.parse(JSON.stringify(x.data() || {}))));
        const map = {}; [...ST.threads, ...remote].forEach((t) => { if (!map[t.id] || (t.msgs || []).length > (map[t.id].msgs || []).length) map[t.id] = t; });
        ST.threads = Object.values(map).sort((a, b) => parseInt(a.id.slice(1), 36) - parseInt(b.id.slice(1), 36)); saveLocal();
      } catch (e) {}
    }).catch(() => {});
  } else { ready = true; note(); }

  window.MZT = { open: openPanel, close: closePanel };
})();

</script>

if(window.top===window&&location.protocol==="file:"){a.hidden=true;return}
a.href=p.indexOf("/decouvrir")===0||location.pathname.indexOf("/decouvrir")===0?"/decouvrir":"/app/modules";})();</script>
